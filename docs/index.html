lass=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>区間 <span class=\"math-inline\">$[a,b]$<\/span> のどの点も「同じくらい起こりやすい」連続型分布です。\n乱数生成の出発点であり、どんな連続分布も一様乱数を変換して作れるという点で、シミュレーションの土台になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$a&lt;b$<\/span> とします。密度関数が<\/p>\n<div class=\"math-display\">$$f(x)=\\begin{cases}\\dfrac{1}{b-a} &amp; (a\\le x\\le b)\\\\[4pt] 0 &amp; (\\text{それ以外})\\end{cases}$$<\/div>\n<p>のとき、<span class=\"math-inline\">$X \\sim U(a,b)$<\/span> と書きます。累積分布関数は <span class=\"math-inline\">$a\\le x\\le b$<\/span> で <span class=\"math-inline\">$F(x)=(x-a)/(b-a)$<\/span> です。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$[a,b]$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td><span class=\"math-inline\">$a&lt;b$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$\\dfrac{a+b}{2}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$\\dfrac{(b-a)^2}{12}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t)=\\dfrac{e^{tb}-e^{ta}}{t(b-a)}$<\/span>（<span class=\"math-inline\">$t\\ne0$<\/span>）、<span class=\"math-inline\">$M(0)=1$<\/span><\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t)=\\dfrac{e^{itb}-e^{ita}}{it(b-a)}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>高さ <span class=\"math-inline\">$1/(b-a)$<\/span> は、長方形の面積を1にするための値です。<\/li>\n<li>確率は「長さの比」です。<span class=\"math-inline\">$P(c\\le X\\le d)=(d-c)/(b-a)$<\/span> と、区間の長さだけで決まります。<\/li>\n<\/ul>\n<p><strong>分散の導出<\/strong>。まず <span class=\"math-inline\">$U(0,1)$<\/span> で計算します。<\/p>\n<div class=\"math-display\">$$E[U]=\\int_0^1 u\\,du=\\frac12,\\qquad E[U^2]=\\int_0^1 u^2\\,du=\\frac13,\\qquad V[U]=\\frac13-\\frac14=\\frac1{12}$$<\/div>\n<p><span class=\"math-inline\">$X=a+(b-a)U$<\/span> なので <span class=\"math-inline\">$V[X]=(b-a)^2/12$<\/span> です。<\/p>\n<p><strong>他の分布との関係<\/strong>。<\/p>\n<ul>\n<li><strong>確率積分変換<\/strong>：連続な累積分布関数 <span class=\"math-inline\">$F$<\/span> をもつ <span class=\"math-inline\">$X$<\/span> について、<span class=\"math-inline\">$F(X)\\sim U(0,1)$<\/span> です。逆に <span class=\"math-inline\">$U\\sim U(0,1)$<\/span> なら <span class=\"math-inline\">$F^{-1}(U)$<\/span> は分布 <span class=\"math-inline\">$F$<\/span> に従います（逆関数法）。<\/li>\n<li><span class=\"math-inline\">$U\\sim U(0,1)$<\/span> なら <span class=\"math-inline\">$-\\log U/\\lambda$<\/span> はレート <span class=\"math-inline\">$\\lambda$<\/span> の指数分布に従います。<\/li>\n<li><span class=\"math-inline\">$U_1,\\dots,U_n$<\/span> が独立に <span class=\"math-inline\">$U(0,1)$<\/span> のとき、小さいほうから <span class=\"math-inline\">$k$<\/span> 番目の順序統計量は <span class=\"math-inline\">$\\mathrm{Beta}(k,\\ n-k+1)$<\/span> に従います。<span class=\"math-inline\">$U(0,1)=\\mathrm{Beta}(1,1)$<\/span> でもあります。<\/li>\n<li>一様分布には再生性がありません。独立な2つの <span class=\"math-inline\">$U(0,1)$<\/span> の和は三角形の分布になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：バスの待ち時間<\/strong><\/p>\n<p>10分間隔で来るバスの停留所に、時刻表を見ずに行くと、待ち時間は <span class=\"math-inline\">$X\\sim U(0,10)$<\/span> とみなせます。<\/p>\n<div class=\"math-display\">$$E[X]=5,\\qquad V[X]=\\frac{100}{12}\\approx 8.333,\\qquad \\sqrt{V[X]}\\approx 2.887$$<\/div>\n<p>7分以上待つ確率は <span class=\"math-inline\">$P(X\\ge7)=3/10=0.3$<\/span> です。<\/p>\n<p><strong>例2：最大値の分布（試験に近い形）<\/strong><\/p>\n<p><span class=\"math-inline\">$U_1,\\dots,U_5$<\/span> が独立に <span class=\"math-inline\">$U(0,1)$<\/span> に従うとき、最大値 <span class=\"math-inline\">$M$<\/span> の累積分布関数は<\/p>\n<div class=\"math-display\">$$P(M\\le x)=P(U_1\\le x,\\dots,U_5\\le x)=x^5$$<\/div>\n<p>です。たとえば <span class=\"math-inline\">$P(M\\le0.9)=0.9^5\\approx0.5905$<\/span> です。密度は <span class=\"math-inline\">$5x^4$<\/span> なので <span class=\"math-inline\">$E[M]=\\int_0^1 5x^5dx=5/6\\approx0.8333$<\/span> となります。これは <span class=\"math-inline\">$\\mathrm{Beta}(5,1)$<\/span> の平均 <span class=\"math-inline\">$5/(5+1)$<\/span> と一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>IT・Webサービス<\/strong>：シミュレーションやA/Bテストの割り付けで、<span class=\"math-inline\">$[0,1)$<\/span> の一様乱数をもとに確率的な振り分けを行います。<\/li>\n<li><strong>製造・品質管理<\/strong>：丸め誤差のモデルとして使います。最小単位 <span class=\"math-inline\">$h$<\/span> で丸めた誤差は <span class=\"math-inline\">$U(-h/2,h/2)$<\/span> とみなせ、分散は <span class=\"math-inline\">$h^2/12$<\/span> です（シェパードの補正の考え方）。<\/li>\n<li><strong>金融・保険<\/strong>：モンテカルロ法で、一様乱数を逆関数法で変換し、損失額などの分布から乱数を発生させます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$a$<\/span> と <span class=\"math-inline\">$b$<\/span> を動かすと、長方形の幅と高さが変わります。幅が2倍になると高さが半分になり、面積は常に1に保たれます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>期待値 <span class=\"math-inline\">$(a+b)/2$<\/span>、分散 <span class=\"math-inline\">$(b-a)^2/12$<\/span> は即答できるようにします。<\/li>\n<li>最大値・最小値の分布を「すべてが <span class=\"math-inline\">$x$<\/span> 以下」「すべてが <span class=\"math-inline\">$x$<\/span> より大きい」から求める問題は典型です。<\/li>\n<li>確率積分変換 <span class=\"math-inline\">$F(X)\\sim U(0,1)$<\/span> と逆関数法は、第32章の乱数生成でも使います。<\/li>\n<li>順序統計量とベータ分布の関係を押さえておくと、平均や分散がすぐ出ます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 分散を <span class=\"math-inline\">$(b-a)^2/2$<\/span> や <span class=\"math-inline\">$(b-a)/12$<\/span> とする → ○ <span class=\"math-inline\">$(b-a)^2/12$<\/span> です。<\/li>\n<li>× 密度の高さが1を超えることはない → ○ <span class=\"math-inline\">$U(0,0.5)$<\/span> の密度は2です。密度は確率ではなく、1を超えてもかまいません。<\/li>\n<li>× 一様分布に従う変数の和も一様分布 → ○ 和は三角形や釣鐘形に近づきます（中心極限定理）。<\/li>\n<\/ul><\/section>","text":"一言でいうと 区間 のどの点も「同じくらい起こりやすい」連続型分布です。 乱数生成の出発点であり、どんな連続分布も一様乱数を変換して作れるという点で、シミュレーションの土台になります。 定義・数式 とします。密度関数が のとき、 と書きます。累積分布関数は で です。 項目 内容 台 パラメータ 期待値 分散 モーメント母関数 （ ）、 特性関数 数式の読み解き - 高さ は、長方形の面積を1にするための値です。 - 確率は「長さの比」です。 と、区間の長さだけで決まります。 分散の導出。まず で計算します。 なので です。 他の分布との関係。 - 確率積分変換：連続な累積分布関数 をもつ について、 です。逆に なら は分布 に従います（逆関数法）。 - なら はレート の指数分布に従います。 - が独立に のとき、小さいほうから 番目の順序統計量は に従います。 でもあります。 - 一様分布には再生性がありません。独立な2つの の和は三角形の分布になります。 具体例 例1：バスの待ち時間 10分間隔で来るバスの停留所に、時刻表を見ずに行くと、待ち時間は とみなせます。 7分以上待つ確率は です。 例2：最大値の分布（試験に近い形） が独立に に従うとき、最大値 の累積分布関数は です。たとえば です。密度は なので となります。これは の平均 と一致します。 現場での使われ方 - IT・Webサービス：シミュレーションやA/Bテストの割り付けで、 の一様乱数をもとに確率的な振り分けを行います。 - 製造・品質管理：丸め誤差のモデルとして使います。最小単位 で丸めた誤差は とみなせ、分散は です（シェパードの補正の考え方）。 - 金融・保険：モンテカルロ法で、一様乱数を逆関数法で変換し、損失額などの分布から乱数を発生させます。 グラフ・イメージ と を動かすと、長方形の幅と高さが変わります。幅が2倍になると高さが半分になり、面積は常に1に保たれます。 試験のポイント - 期待値 、分散 は即答できるようにします。 - 最大値・最小値の分布を「すべてが 以下」「すべてが より大きい」から求める問題は典型です。 - 確率積分変換 と逆関数法は、第32章の乱数生成でも使います。 - 順序統計量とベータ分布の関係を押さえておくと、平均や分散がすぐ出ます。 よくある間違い - × 分散を や とする → ○ です。 - × 密度の高さが1を超えることはない → ○ の密度は2です。密度は確率ではなく、1を超えてもかまいません。 - × 一様分布に従う変数の和も一様分布 → ○ 和は三角形や釣鐘形に近づきます（中心極限定理）。"},"chebyshev-inequality":{"id":"chebyshev-inequality","title":"チェビシェフの不等式","reading":"ちぇびしぇふのふとうしき","en":"Chebyshev's inequality","aliases":["チェビシェフ不等式","ビエネメ・チェビシェフの不等式"],"chapter":7,"importance":"A","tags":["確率不等式","分散","大数の法則","標本サイズ"],"related":["markov-inequality","weak-law-of-large-numbers","convergence-in-probability","expectation-variance-properties","normal-distribution","central-limit-theorem"],"charts":[{"type":"custom","id":"line-data","params":{"x":[1,1.5,2,2.5,3,3.5,4],"series":[{"label":"チェビシェフの上限 1/k²","y":[1,0.4444,0.25,0.16,0.1111,0.0816,0.0625]},{"label":"正規分布","y":[0.3173,0.1336,0.0455,0.0124,0.0027,0.0005,0.0001]},{"label":"指数分布","y":[0.1353,0.0821,0.0498,0.0302,0.0183,0.0111,0.0067]},{"label":"一様分布","y":[0.4226,0.134,0,0,0,0,0]}],"xlabel":"k（標準偏差の何倍か）","ylabel":"P(|X−μ| ≥ kσ)"},"caption":"平均から kσ 以上離れる確率の実際の値（正規・指数・一様）と、チェビシェフの上限 1/k² の比較。どの分布も上限の下にあるが、上限はかなり余裕を持っている。"},{"type":"pdf","dist":"norm","params":{"mu":0,"sigma":1},"sliders":[{"param":"sigma","label":"標準偏差 σ","min":0.3,"max":3,"step":0.1}],"x":{"min":-8,"max":8},"caption":"分散が小さいほど平均の近くに確率が集まる。チェビシェフの不等式はこの「集まり方」を分散だけで保証する。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>平均と分散だけから、「平均から大きく外れる確率」の上限を与える不等式です。\n分布の形を仮定せずに使えるので、大数の弱法則の証明や、保守的な標本サイズの見積もりに使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X$<\/span> の期待値を <span class=\"math-inline\">$\\mu$<\/span>、分散を <span class=\"math-inline\">$\\sigma^2$<\/span>（<span class=\"math-inline\">$0&lt;\\sigma^2&lt;\\infty$<\/span>）とします。任意の <span class=\"math-inline\">$k&gt;0$<\/span> について<\/p>\n<div class=\"math-display\">$$P(|X-\\mu| \\ge k\\sigma) \\le \\frac{1}{k^2}$$<\/div>\n<p>が成り立ちます。<span class=\"math-inline\">$\\varepsilon = k\\sigma$<\/span> とおいた形<\/p>\n<div class=\"math-display\">$$P(|X-\\mu| \\ge \\varepsilon) \\le \\frac{\\sigma^2}{\\varepsilon^2} \\qquad (\\varepsilon&gt;0)$$<\/div>\n<p>もよく使います。余事象で書くと、<span class=\"math-inline\">$P(|X-\\mu| &lt; k\\sigma) \\ge 1 - 1/k^2$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$k$<\/span>：「標準偏差の何倍外れるか」を表す数です。<\/li>\n<li><span class=\"math-inline\">$1/k^2$<\/span>：その確率の上限。<span class=\"math-inline\">$k=2$<\/span> なら <span class=\"math-inline\">$1/4$<\/span>、<span class=\"math-inline\">$k=3$<\/span> なら <span class=\"math-inline\">$1/9$<\/span> です。<\/li>\n<li><span class=\"math-inline\">$k \\le 1$<\/span> では上限が1以上になり、何も言えません。<\/li>\n<\/ul>\n<p>導出は、非負の確率変数 <span class=\"math-inline\">$Y=(X-\\mu)^2$<\/span> にマルコフの不等式を当てはめるだけです。<\/p>\n<div class=\"math-display\">$$P(|X-\\mu| \\ge \\varepsilon) = P\\big((X-\\mu)^2 \\ge \\varepsilon^2\\big) \\le \\frac{E[(X-\\mu)^2]}{\\varepsilon^2} = \\frac{\\sigma^2}{\\varepsilon^2}$$<\/div>\n<p>1つ目の等号は、<span class=\"math-inline\">$|X-\\mu| \\ge \\varepsilon$<\/span> と <span class=\"math-inline\">$(X-\\mu)^2 \\ge \\varepsilon^2$<\/span> が同じ事象であることを使っています。<\/p>\n<p>直感的には、「分散は平均からのずれの二乗の平均なので、大きくずれる値が多いと分散が大きくなってしまう。分散が <span class=\"math-inline\">$\\sigma^2$<\/span> に抑えられている以上、大きくずれる確率にも限りがある」ということです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：製品の重さ<\/strong><\/p>\n<p>ある製品の重さの平均が 500 g、標準偏差が 4 g です。分布の形はわかりません。重さが 492 g から 508 g の範囲（平均 ±2σ）に入る割合は<\/p>\n<div class=\"math-display\">$$P(|X-500| &lt; 8) \\ge 1 - \\frac{1}{2^2} = 0.75$$<\/div>\n<p>で、少なくとも 75% です。\nもし正規分布なら実際は約 95.45% です。チェビシェフの不等式は「どんな分布でも最低これだけは入る」という保証を与えます。<\/p>\n<p><strong>例2：支持率調査の標本サイズ<\/strong><\/p>\n<p>支持率 <span class=\"math-inline\">$p$<\/span> を標本比率 <span class=\"math-inline\">$\\hat p$<\/span> で推定し、「誤差が 0.05 以上になる確率を 5% 以下にしたい」とします。<span class=\"math-inline\">$V[\\hat p]=p(1-p)/n \\le 1/(4n)$<\/span> なので<\/p>\n<div class=\"math-display\">$$P(|\\hat p - p| \\ge 0.05) \\le \\frac{p(1-p)}{n \\times 0.05^2} \\le \\frac{0.25}{n \\times 0.0025}$$<\/div>\n<p>これを 0.05 以下にするには <span class=\"math-inline\">$n \\ge 0.25/(0.0025 \\times 0.05) = 2000$<\/span> です。\n中心極限定理による正規近似を使うと <span class=\"math-inline\">$n \\ge (1.96/0.05)^2 \\times 0.25 \\approx 384.2$<\/span>、つまり 385 人で足ります。チェビシェフの不等式は分布を仮定しない代わりに、約5倍の標本を要求します。<\/p>\n<p><strong>例3：上限と実際の値の差<\/strong><\/p>\n<p><span class=\"math-inline\">$k=3$<\/span> のとき、上限は <span class=\"math-inline\">$1/9 \\approx 0.1111$<\/span> です。正規分布での実際の値は <span class=\"math-inline\">$P(|Z| \\ge 3) \\approx 0.0027$<\/span>、平均1の指数分布では <span class=\"math-inline\">$P(|X-1| \\ge 3) = e^{-4} \\approx 0.0183$<\/span> です。どちらも上限よりはるかに小さくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：工程の分布が正規分布とは限らない場合に、平均と標準偏差だけから「規格外になる割合はこれ以下」と保守的に見積もります。<\/li>\n<li><strong>行政・調査<\/strong>：分布の仮定を置かずに、最悪の場合でも誤差が一定以下になる標本サイズを見積もるときの目安にします（実務では正規近似と併用し、違いを確認します）。<\/li>\n<li><strong>IT・Webサービス<\/strong>：監視指標の異常判定で、分布を仮定しない閾値（例：平均 ±<span class=\"math-inline\">$4\\sigma$<\/span> を超える確率は <span class=\"math-inline\">$1/16$<\/span> 以下）の根拠として使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図は、横軸の <span class=\"math-inline\">$k$<\/span> ごとに「平均から <span class=\"math-inline\">$k\\sigma$<\/span> 以上離れる確率」を描いたものです。正規・指数・一様のどの線も上限 <span class=\"math-inline\">$1/k^2$<\/span> の下にあり、とくに正規分布では上限とのあいだに大きな余裕があります。\n2つ目の図で <span class=\"math-inline\">$\\sigma$<\/span> を小さくすると、密度が平均の近くに集まります。チェビシェフの不等式はこの集まり具合を分散だけで評価しています。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>マルコフの不等式から導く流れ（<span class=\"math-inline\">$(X-\\mu)^2$<\/span> に当てはめる）は、導出問題として重要です。<\/li>\n<li>標本平均に当てはめた <span class=\"math-inline\">$P(|\\bar X - \\mu| \\ge \\varepsilon) \\le \\sigma^2/(n\\varepsilon^2)$<\/span> から、<span class=\"math-inline\">$n\\to\\infty$<\/span> で右辺 <span class=\"math-inline\">$\\to 0$<\/span> となり、<strong>大数の弱法則<\/strong>が証明できます。<\/li>\n<li>「少なくとも何％が範囲に入るか」「上限はいくつか」を、<span class=\"math-inline\">$1-1/k^2$<\/span> や <span class=\"math-inline\">$1/k^2$<\/span> で答えさせる計算が典型です。<\/li>\n<li>標本サイズの見積もりでは、<span class=\"math-inline\">$p(1-p) \\le 1/4$<\/span> を使って <span class=\"math-inline\">$p$<\/span> が未知でも計算できる点がよく使われます。<\/li>\n<li>正規近似（中心極限定理）による評価と比べ、どちらが保守的かを説明できるようにします。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$P(|X-\\mu| \\ge k\\sigma) \\le 1/k$<\/span> と覚える → ○ 上限は <span class=\"math-inline\">$1/k^2$<\/span> です。<span class=\"math-inline\">$1/k$<\/span> になるのは、非負の変数に対するマルコフの不等式 <span class=\"math-inline\">$P(X \\ge k\\mu) \\le 1/k$<\/span> のほうです。<\/li>\n<li>× 上限 <span class=\"math-inline\">$1/k^2$<\/span> を実際の確率の近似値として使う → ○ 上限にすぎません。正規分布の <span class=\"math-inline\">$k=2$<\/span> なら、上限 0.25 に対して実際は約 0.046 です。<\/li>\n<li>× 分散が存在しない分布（コーシー分布など）にも使う → ○ <span class=\"math-inline\">$\\sigma^2&lt;\\infty$<\/span> が前提です。<\/li>\n<li>× <span class=\"math-inline\">$\\varepsilon$<\/span> の形で <span class=\"math-inline\">$\\sigma^2/\\varepsilon$<\/span> と書く → ○ 分母は <span class=\"math-inline\">$\\varepsilon^2$<\/span> です。単位をそろえると（分子も分母も「長さの二乗」）間違えにくくなります。<\/li>\n<\/ul><\/section>","text":"一言でいうと 平均と分散だけから、「平均から大きく外れる確率」の上限を与える不等式です。 分布の形を仮定せずに使えるので、大数の弱法則の証明や、保守的な標本サイズの見積もりに使われます。 定義・数式 確率変数 の期待値を 、分散を （ ）とします。任意の について が成り立ちます。 とおいた形 もよく使います。余事象で書くと、 です。 数式の読み解き - ：「標準偏差の何倍外れるか」を表す数です。 - ：その確率の上限。 なら 、 なら です。 - では上限が1以上になり、何も言えません。 導出は、非負の確率変数 にマルコフの不等式を当てはめるだけです。 1つ目の等号は、 と が同じ事象であることを使っています。 直感的には、「分散は平均からのずれの二乗の平均なので、大きくずれる値が多いと分散が大きくなってしまう。分散が に抑えられている以上、大きくずれる確率にも限りがある」ということです。 具体例 例1：製品の重さ ある製品の重さの平均が 500 g、標準偏差が 4 g です。分布の形はわかりません。重さが 492 g から 508 g の範囲（平均 ±2σ）に入る割合は で、少なくとも 75% です。 もし正規分布なら実際は約 95.45% です。チェビシェフの不等式は「どんな分布でも最低これだけは入る」という保証を与えます。 例2：支持率調査の標本サイズ 支持率 を標本比率 で推定し、「誤差が 0.05 以上になる確率を 5% 以下にしたい」とします。 なので これを 0.05 以下にするには です。 中心極限定理による正規近似を使うと 、つまり 385 人で足ります。チェビシェフの不等式は分布を仮定しない代わりに、約5倍の標本を要求します。 例3：上限と実際の値の差 のとき、上限は です。正規分布での実際の値は 、平均1の指数分布では です。どちらも上限よりはるかに小さくなります。 現場での使われ方 - 製造・品質管理：工程の分布が正規分布とは限らない場合に、平均と標準偏差だけから「規格外になる割合はこれ以下」と保守的に見積もります。 - 行政・調査：分布の仮定を置かずに、最悪の場合でも誤差が一定以下になる標本サイズを見積もるときの目安にします（実務では正規近似と併用し、違いを確認します）。 - IT・Webサービス：監視指標の異常判定で、分布を仮定しない閾値（例：平均 ± を超える確率は 以下）の根拠として使います。 グラフ・イメージ 1つ目の図は、横軸の ごとに「平均から 以上離れる確率」を描いたものです。正規・指数・一様のどの線も上限 の下にあり、とくに正規分布では上限とのあいだに大きな余裕があります。 2つ目の図で を小さくすると、密度が平均の近くに集まります。チェビシェフの不等式はこの集まり具合を分散だけで評価しています。 試験のポイント - マルコフの不等式から導く流れ（ に当てはめる）は、導出問題として重要です。 - 標本平均に当てはめた から、 で右辺 となり、大数の弱法則が証明できます。 - 「少なくとも何％が範囲に入るか」「上限はいくつか」を、 や で答えさせる計算が典型です。 - 標本サイズの見積もりでは、 を使って が未知でも計算できる点がよく使われます。 - 正規近似（中心極限定理）による評価と比べ、どちらが保守的かを説明できるようにします。 よくある間違い - × と覚える → ○ 上限は です。 になるのは、非負の変数に対するマルコフの不等式 のほうです。 - × 上限 を実際の確率の近似値として使う → ○ 上限にすぎません。正規分布の なら、上限 0.25 に対して実際は約 0.046 です。 - × 分散が存在しない分布（コーシー分布など）にも使う → ○ が前提です。 - × の形で と書く → ○ 分母は です。単位をそろえると（分子も分母も「長さの二乗」）間違えにくくなります。"},"markov-inequality":{"id":"markov-inequality","title":"マルコフの不等式","reading":"まるこふのふとうしき","en":"Markov's inequality","aliases":["マルコフ不等式"],"chapter":7,"importance":"B","tags":["確率不等式","裾確率","期待値"],"related":["chebyshev-inequality","weak-law-of-large-numbers","expectation-variance-properties","exponential-distribution","convergence-in-probability"],"charts":[{"type":"pdf","dist":"expon","params":{"rate":0.2},"sliders":[{"param":"rate","label":"レート λ（平均 1/λ）","min":0.05,"max":1,"step":0.05}],"x":{"min":0,"max":40},"caption":"平均 1/λ の指数分布。マルコフの不等式は「a 以上の右裾の面積は 平均/a 以下」と言うが、実際の裾の面積はそれよりずっと小さいことが多い。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p><strong>0以上の値しかとらない<\/strong>確率変数について、「平均の何倍も大きな値が出る確率」の上限を、期待値だけから見積もる不等式です。\n分布の形がまったくわからなくても使える、最も基本的な確率不等式です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X$<\/span> が <span class=\"math-inline\">$X \\ge 0$<\/span>（確率1で非負）で、<span class=\"math-inline\">$E[X]&lt;\\infty$<\/span> とします。任意の <span class=\"math-inline\">$a&gt;0$<\/span> について<\/p>\n<div class=\"math-display\">$$P(X \\ge a) \\le \\frac{E[X]}{a}$$<\/div>\n<p>が成り立ちます。<\/p>\n<p>より一般に、<span class=\"math-inline\">$g$<\/span> が非負で単調非減少な関数で <span class=\"math-inline\">$g(a)&gt;0$<\/span> なら、<\/p>\n<div class=\"math-display\">$$P(X \\ge a) \\le \\frac{E[g(X)]}{g(a)}$$<\/div>\n<p>です（<span class=\"math-inline\">$X$<\/span> の非負性は不要になります）。<span class=\"math-inline\">$g(x)=x^2$<\/span> を <span class=\"math-inline\">$|X-\\mu|$<\/span> に当てはめるとチェビシェフの不等式、<span class=\"math-inline\">$g(x)=e^{tx}$<\/span> とするとモーメント母関数を使ったチェルノフ型の評価になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$a$<\/span>：「大きい」とみなす境目の値です。<\/li>\n<li><span class=\"math-inline\">$E[X]/a$<\/span>：平均が境目の何分の1か。<span class=\"math-inline\">$a = c\\,E[X]$<\/span> とおくと、<span class=\"math-inline\">$P(X \\ge c\\,E[X]) \\le 1/c$<\/span> と読めます。「平均の <span class=\"math-inline\">$c$<\/span> 倍以上になる確率は <span class=\"math-inline\">$1/c$<\/span> 以下」です。<\/li>\n<\/ul>\n<p>導出は、指示関数 <span class=\"math-inline\">$\\mathbf{1}\\{X \\ge a\\}$<\/span>（<span class=\"math-inline\">$X\\ge a$<\/span> なら1、そうでなければ0）を使うと1行で済みます。<span class=\"math-inline\">$X \\ge 0$<\/span> なので、どんな場合でも<\/p>\n<div class=\"math-display\">$$a\\,\\mathbf{1}\\{X \\ge a\\} \\le X$$<\/div>\n<p>が成り立ちます（<span class=\"math-inline\">$X \\ge a$<\/span> なら左辺は <span class=\"math-inline\">$a \\le X$<\/span>、<span class=\"math-inline\">$X&lt;a$<\/span> なら左辺は <span class=\"math-inline\">$0 \\le X$<\/span>）。両辺の期待値をとると<\/p>\n<div class=\"math-display\">$$a\\,P(X \\ge a) \\le E[X]$$<\/div>\n<p>となり、<span class=\"math-inline\">$a$<\/span> で割れば完成です。<\/p>\n<p>直感的には、「平均を一定に保ったまま、<span class=\"math-inline\">$a$<\/span> 以上の値に確率を最大限載せるには、その確率をちょうど <span class=\"math-inline\">$a$<\/span> の位置と0に集めるしかない」ということです。実際、<span class=\"math-inline\">$P(X=a)=E[X]/a$<\/span>、<span class=\"math-inline\">$P(X=0)=1-E[X]/a$<\/span> の2点分布で等号が成立するので、この上限はこれ以上改善できません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：窓口の待ち時間<\/strong><\/p>\n<p>ある窓口の待ち時間の平均が 5 分であることだけがわかっています。待ち時間が 20 分以上になる確率は<\/p>\n<div class=\"math-display\">$$P(X \\ge 20) \\le \\frac{5}{20} = 0.25$$<\/div>\n<p>で、どんな分布でも 25% を超えません。<\/p>\n<p>仮に待ち時間が平均 5 分の指数分布（レート <span class=\"math-inline\">$\\lambda = 0.2$<\/span>）に従うなら、実際の値は<\/p>\n<div class=\"math-display\">$$P(X \\ge 20) = e^{-0.2 \\times 20} = e^{-4} \\approx 0.0183$$<\/div>\n<p>です。上限 0.25 に比べてかなり小さく、マルコフの不等式は「安全側だが粗い」評価だとわかります。<\/p>\n<p><strong>例2：所得の上位層<\/strong><\/p>\n<p>ある地域の世帯所得（0以上）の平均が 500 万円なら、所得が 2,000 万円以上の世帯の割合は <span class=\"math-inline\">$500/2000 = 0.25$<\/span> 以下です。平均の4倍以上の世帯は、どんなに偏った分布でも4分の1を超えられません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>IT・Webサービス<\/strong>：応答時間やデータ量の平均しか把握していない段階で、「閾値を超えるリクエストの割合はこれ以下」と最悪の場合の見積もりを出します。<\/li>\n<li><strong>金融・保険<\/strong>：損失額（非負）の平均から、大きな損失が起こる確率の保守的な上限を見積もり、分布の仮定に依存しない安全側の評価として使います。<\/li>\n<li><strong>理論研究<\/strong>：確率収束を示すとき、<span class=\"math-inline\">$P(|T_n-\\theta| \\ge \\varepsilon) \\le E|T_n-\\theta|/\\varepsilon$<\/span> のように、期待値が0に近づくことから確率が0に近づくことを導く道具として使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>指数分布の密度で、たとえば <span class=\"math-inline\">$x \\ge 20$<\/span> の右裾の面積を見てください。マルコフの不等式はその面積が「平均 ÷ 20」以下だと保証しますが、実際の面積はかなり小さくなります。\nスライダーで平均を大きくすると裾が重くなり、上限と実際の差は縮まります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>前提は <strong><span class=\"math-inline\">$X \\ge 0$<\/span><\/strong>。この前提を使う箇所（<span class=\"math-inline\">$a\\mathbf{1}\\{X\\ge a\\} \\le X$<\/span>）を説明できるようにします。<\/li>\n<li><span class=\"math-inline\">$|X-\\mu|^2$<\/span> に当てはめるとチェビシェフの不等式が出る流れは、導出問題として重要です。<\/li>\n<li>等号が成り立つ2点分布の例を知っておくと、「上限はこれ以上改善できない」ことを説明できます。<\/li>\n<li>上限が1以上になる（<span class=\"math-inline\">$a \\le E[X]$<\/span>）ときは、何の情報も与えません。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 負の値もとる変数にそのまま使う → ○ <span class=\"math-inline\">$X \\ge 0$<\/span> が必要です。負の値をとる場合は <span class=\"math-inline\">$|X|$<\/span> や <span class=\"math-inline\">$(X-\\mu)^2$<\/span> などの非負の量に変えてから使います。<\/li>\n<li>× <span class=\"math-inline\">$P(X \\ge a)$<\/span> の近似値として使う → ○ あくまで上限です。実際の確率はずっと小さいことが多く、例1では 0.25 に対して 0.018 でした。<\/li>\n<li>× <span class=\"math-inline\">$P(X &gt; a) \\le E[X]/a$<\/span> だけ覚えて、<span class=\"math-inline\">$\\ge$<\/span> のときは使えないと思う → ○ <span class=\"math-inline\">$P(X\\ge a)$<\/span> で成り立つので、<span class=\"math-inline\">$P(X&gt;a)$<\/span> でも当然成り立ちます。<\/li>\n<\/ul><\/section>","text":"一言でいうと 0以上の値しかとらない確率変数について、「平均の何倍も大きな値が出る確率」の上限を、期待値だけから見積もる不等式です。 分布の形がまったくわからなくても使える、最も基本的な確率不等式です。 定義・数式 確率変数 が （確率1で非負）で、 とします。任意の について が成り立ちます。 より一般に、 が非負で単調非減少な関数で なら、 です（ の非負性は不要になります）。 を に当てはめるとチェビシェフの不等式、 とするとモーメント母関数を使ったチェルノフ型の評価になります。 数式の読み解き - ：「大きい」とみなす境目の値です。 - ：平均が境目の何分の1か。 とおくと、 と読めます。「平均の 倍以上になる確率は 以下」です。 導出は、指示関数 （ なら1、そうでなければ0）を使うと1行で済みます。 なので、どんな場合でも が成り立ちます（ なら左辺は 、 なら左辺は ）。両辺の期待値をとると となり、 で割れば完成です。 直感的には、「平均を一定に保ったまま、 以上の値に確率を最大限載せるには、その確率をちょうど の位置と0に集めるしかない」ということです。実際、 、 の2点分布で等号が成立するので、この上限はこれ以上改善できません。 具体例 例1：窓口の待ち時間 ある窓口の待ち時間の平均が 5 分であることだけがわかっています。待ち時間が 20 分以上になる確率は で、どんな分布でも 25% を超えません。 仮に待ち時間が平均 5 分の指数分布（レート ）に従うなら、実際の値は です。上限 0.25 に比べてかなり小さく、マルコフの不等式は「安全側だが粗い」評価だとわかります。 例2：所得の上位層 ある地域の世帯所得（0以上）の平均が 500 万円なら、所得が 2,000 万円以上の世帯の割合は 以下です。平均の4倍以上の世帯は、どんなに偏った分布でも4分の1を超えられません。 現場での使われ方 - IT・Webサービス：応答時間やデータ量の平均しか把握していない段階で、「閾値を超えるリクエストの割合はこれ以下」と最悪の場合の見積もりを出します。 - 金融・保険：損失額（非負）の平均から、大きな損失が起こる確率の保守的な上限を見積もり、分布の仮定に依存しない安全側の評価として使います。 - 理論研究：確率収束を示すとき、 のように、期待値が0に近づくことから確率が0に近づくことを導く道具として使います。 グラフ・イメージ 指数分布の密度で、たとえば の右裾の面積を見てください。マルコフの不等式はその面積が「平均 ÷ 20」以下だと保証しますが、実際の面積はかなり小さくなります。 スライダーで平均を大きくすると裾が重くなり、上限と実際の差は縮まります。 試験のポイント - 前提は 。この前提を使う箇所（ ）を説明できるようにします。 - に当てはめるとチェビシェフの不等式が出る流れは、導出問題として重要です。 - 等号が成り立つ2点分布の例を知っておくと、「上限はこれ以上改善できない」ことを説明できます。 - 上限が1以上になる（ ）ときは、何の情報も与えません。 よくある間違い - × 負の値もとる変数にそのまま使う → ○ が必要です。負の値をとる場合は や などの非負の量に変えてから使います。 - × の近似値として使う → ○ あくまで上限です。実際の確率はずっと小さいことが多く、例1では 0.25 に対して 0.018 でした。 - × だけ覚えて、 のときは使えないと思う → ○ で成り立つので、 でも当然成り立ちます。"}}}</script>
<script>
/* 分布の密度・確率・累積分布の計算ライブラリ（外部依存なし） */
(function (root) {
  'use strict';

  // ---------- 特殊関数 ----------
  var LANCZOS = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

  function lgamma(x) {
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1;
    var a = LANCZOS[0], t = x + 7.5;
    for (var i = 1; i < 9; i++) a += LANCZOS[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function lbeta(a, b) { return lgamma(a) + lgamma(b) - lgamma(a + b); }
  function lchoose(n, k) { return lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1); }

  // 正則化された下側不完全ガンマ関数 P(a, x)
  function gammainc(a, x) {
    if (x <= 0) return 0;
    if (!isFinite(x)) return 1;
    var lpre = a * Math.log(x) - x - lgamma(a);
    if (x < a + 1) {
      var sum = 1 / a, term = sum, ap = a;
      for (var n = 0; n < 10000; n++) {
        ap += 1; term *= x / ap; sum += term;
        if (Math.abs(term) < Math.abs(sum) * 1e-16) break;
      }
      return Math.min(1, sum * Math.exp(lpre));
    }
    return 1 - gammaincUpperCF(a, x, lpre);
  }
  function gammaincUpperCF(a, x, lpre) {
    var tiny = 1e-300, b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
    for (var i = 1; i < 10000; i++) {
      var an = -i * (i - a);
      b += 2;
      d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
      c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
      d = 1 / d;
      var del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-16) break;
    }
    return Math.exp(lpre) * h;
  }
  // 上側 Q(a,x) を精度よく
  function gammaincc(a, x) {
    if (x <= 0) return 1;
    if (x < a + 1) return 1 - gammainc(a, x);
    return gammaincUpperCF(a, x, a * Math.log(x) - x - lgamma(a));
  }

  // 正則化された不完全ベータ関数 I_x(a, b)
  function betacf(a, b, x) {
    var tiny = 1e-300, qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < tiny) d = tiny;
    d = 1 / d;
    var h = d;
    for (var m = 1; m < 10000; m++) {
      var m2 = 2 * m, aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny;
      c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny;
      c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny;
      d = 1 / d;
      var del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-16) break;
    }
    return h;
  }
  function betainc(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var lbt = a * Math.log(x) + b * Math.log(1 - x) - lbeta(a, b);
    if (x < (a + 1) / (a + b + 2)) return Math.exp(lbt) * betacf(a, b, x) / a;
    return 1 - Math.exp(lbt) * betacf(b, a, 1 - x) / b;
  }

  function normCdfStd(z) {
    // Φ(z) = P(1/2, z^2/2) を使って両側とも精度を保つ
    var q = 0.5 * gammaincc(0.5, z * z / 2);
    return z < 0 ? q : 1 - q;
  }
  function normPdfStd(z) { return Math.exp(-0.5 * z * z) / Math.sqrt(2 * Math.PI); }
  function erf(x) { return x >= 0 ? gammainc(0.5, x * x) : -gammainc(0.5, x * x); }

  function poisLogW(j, lam) { return lam > 0 ? -lam + j * Math.log(lam) - lgamma(j + 1) : (j === 0 ? 0 : -Infinity); }
  // ポアソン重み付き和 Σ w_j f(j)（重みが十分小さくなるまで、最頻値から両側へ）
  function poisMix(lam, f) {
    if (lam <= 0) return f(0);
    var mode = Math.floor(lam), s = 0, j, w;
    for (j = mode; j < mode + 2000; j++) {
      w = Math.exp(poisLogW(j, lam)); s += w * f(j);
      if (j > lam && w < 1e-17) break;
    }
    for (j = mode - 1; j >= 0; j--) {
      w = Math.exp(poisLogW(j, lam)); s += w * f(j);
      if (w < 1e-17) break;
    }
    return s;
  }

  // ---------- 分布の定義 ----------
  function chi2pdf(x, k) {
    if (x < 0) return 0;
    if (x === 0) return k < 2 ? Infinity : (k === 2 ? 0.5 : 0);
    return Math.exp((k / 2 - 1) * Math.log(x) - x / 2 - (k / 2) * Math.LN2 - lgamma(k / 2));
  }
  function betapdf(x, a, b) {
    if (x < 0 || x > 1) return 0;
    if (x === 0) return a < 1 ? Infinity : (a === 1 ? Math.exp(-lbeta(a, b)) : 0);
    if (x === 1) return b < 1 ? Infinity : (b === 1 ? Math.exp(-lbeta(a, b)) : 0);
    return Math.exp((a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x) - lbeta(a, b));
  }
  function tpdf(x, v) { return Math.exp(lgamma((v + 1) / 2) - lgamma(v / 2) - 0.5 * Math.log(v * Math.PI) - (v + 1) / 2 * Math.log(1 + x * x / v)); }
  function tcdf(x, v) {
    var ib = betainc(v / 2, 0.5, v / (v + x * x));
    return x >= 0 ? 1 - 0.5 * ib : 0.5 * ib;
  }
  function fpdf(x, d1, d2) {
    if (x < 0) return 0;
    if (x === 0) return d1 < 2 ? Infinity : (d1 === 2 ? 1 : 0);
    return Math.exp(0.5 * (d1 * Math.log(d1 * x) + d2 * Math.log(d2) - (d1 + d2) * Math.log(d1 * x + d2)) - Math.log(x) - lbeta(d1 / 2, d2 / 2));
  }
  function fcdf(x, d1, d2) { return x <= 0 ? 0 : betainc(d1 / 2, d2 / 2, d1 * x / (d1 * x + d2)); }

  // 非心t：T = (Z + δ)/sqrt(V/ν)。W = sqrt(V/ν) の密度で数値積分（シンプソン則）
  function nctIntegral(x, v, nc, wantCdf) {
    var lc = (v / 2) * Math.log(v) - (v / 2 - 1) * Math.LN2 - lgamma(v / 2);
    var wmax = 1 + 12 / Math.sqrt(v) + 2, n = 4000, h = wmax / n, s = 0;
    for (var i = 0; i <= n; i++) {
      var w = i * h, g;
      if (w === 0) g = v === 1 ? Math.exp(lc) : 0;
      else g = Math.exp(lc + (v - 1) * Math.log(w) - v * w * w / 2);
      var val = wantCdf ? g * normCdfStd(x * w - nc) : g * w * normPdfStd(x * w - nc);
      s += val * (i === 0 || i === n ? 1 : (i % 2 ? 4 : 2));
    }
    return s * h / 3;
  }

  var D = {
    bernoulli: { discrete: true, params: ['p'], defaults: { p: 0.3 },
      pmf: function (k, q) { return k === 0 ? 1 - q.p : (k === 1 ? q.p : 0); },
      support: function () { return [0, 1]; } },
    binom: { discrete: true, params: ['n', 'p'], defaults: { n: 10, p: 0.5 },
      pmf: function (k, q) {
        if (k < 0 || k > q.n) return 0;
        if (q.p === 0) return k === 0 ? 1 : 0;
        if (q.p === 1) return k === q.n ? 1 : 0;
        return Math.exp(lchoose(q.n, k) + k * Math.log(q.p) + (q.n - k) * Math.log(1 - q.p));
      },
      support: function (q) { return [0, q.n]; } },
    hypergeom: { discrete: true, params: ['N', 'K', 'n'], defaults: { N: 50, K: 10, n: 10 },
      pmf: function (k, q) {
        if (k < Math.max(0, q.n - (q.N - q.K)) || k > Math.min(q.n, q.K)) return 0;
        return Math.exp(lchoose(q.K, k) + lchoose(q.N - q.K, q.n - k) - lchoose(q.N, q.n));
      },
      support: function (q) { return [Math.max(0, q.n - (q.N - q.K)), Math.min(q.n, q.K)]; } },
    poisson: { discrete: true, params: ['lambda'], defaults: { lambda: 3 },
      pmf: function (k, q) { return k < 0 ? 0 : Math.exp(poisLogW(k, q.lambda)); },
      support: function (q) { return [0, Math.ceil(q.lambda + 6 * Math.sqrt(q.lambda) + 6)]; } },
    geom: { discrete: true, params: ['p', 'start'], defaults: { p: 0.3, start: 0 },
      pmf: function (k, q) { var s = q.start || 0, j = k - s; return j < 0 ? 0 : q.p * Math.pow(1 - q.p, j); },
      support: function (q) { var s = q.start || 0; return [s, s + Math.ceil(Math.log(1e-4) / Math.log(1 - q.p))]; } },
    nbinom: { discrete: true, params: ['r', 'p'], defaults: { r: 3, p: 0.4 },
      pmf: function (k, q) { return k < 0 ? 0 : Math.exp(lgamma(k + q.r) - lgamma(k + 1) - lgamma(q.r) + q.r * Math.log(q.p) + k * Math.log(1 - q.p)); },
      support: function (q) { var m = q.r * (1 - q.p) / q.p, s = Math.sqrt(m / q.p); return [0, Math.ceil(m + 6 * s + 5)]; } },
    unif: { params: ['a', 'b'], defaults: { a: 0, b: 1 },
      pdf: function (x, q) { return x < q.a || x > q.b ? 0 : 1 / (q.b - q.a); },
      cdf: function (x, q) { return x <= q.a ? 0 : (x >= q.b ? 1 : (x - q.a) / (q.b - q.a)); },
      range: function (q) { var w = q.b - q.a; return [q.a - 0.2 * w, q.b + 0.2 * w]; } },
    norm: { params: ['mu', 'sigma'], defaults: { mu: 0, sigma: 1 },
      pdf: function (x, q) { return normPdfStd((x - q.mu) / q.sigma) / q.sigma; },
      cdf: function (x, q) { return normCdfStd((x - q.mu) / q.sigma); },
      range: function (q) { return [q.mu - 4 * q.sigma, q.mu + 4 * q.sigma]; } },
    lognorm: { params: ['mu', 'sigma'], defaults: { mu: 0, sigma: 0.5 },
      pdf: function (x, q) { return x <= 0 ? 0 : normPdfStd((Math.log(x) - q.mu) / q.sigma) / (q.sigma * x); },
      cdf: function (x, q) { return x <= 0 ? 0 : normCdfStd((Math.log(x) - q.mu) / q.sigma); },
      range: function (q) { return [0, Math.exp(q.mu + 3 * q.sigma)]; } },

    if (b.dataset.goch) { go('#ch' + String(b.dataset.goch).padStart(2, '0')); return; }
    if (b.dataset.go) { state.fromList = false; go('#' + b.dataset.go); return; }
    if (b.dataset.jump) {
      var s = detailEl.querySelector('.sec[data-sec="' + b.dataset.jump + '"]');
      if (s) s.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (b.classList.contains('memo-toggle') && state.current) toggleMemo(state.current);
  });

  // ---------- スマホの一覧／解説の切り替え ----------
  var listScroll = 0;
  function showDetailView() {
    if (!document.body.classList.contains('show-detail')) listScroll = listEl.scrollTop;
    document.body.classList.add('show-detail');
  }
  function showListView() {
    var was = document.body.classList.contains('show-detail');
    document.body.classList.remove('show-detail');
    if (was) listEl.scrollTop = listScroll;
  }
  function backToList() {
    if (state.fromList && history.length > 1) { state.fromList = false; history.back(); return; }
    go(state.chapter === 'all' ? '#all' : '#ch' + String(state.chapter).padStart(2, '0'));
  }

  // ---------- ルーティング ----------
  function go(hash) {
    if (location.hash === hash) route(); else location.hash = hash;
  }
  function scrollRowIntoView() {
    var row = listEl.querySelector('.row[aria-current="true"]');
    if (!row) return;
    var lr = listEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
    if (rr.top < lr.top + 60 || rr.bottom > lr.bottom) listEl.scrollTop += rr.top - lr.top - lr.height / 3;
  }
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    var m = /^ch(\d{1,2})$/.exec(h);
    if (!h || h === 'all') {
      state.chapter = 'all';
      renderNav(); renderList(); showListView();
      if (!state.current) renderWelcome();
      return;
    }
    if (m) {
      var n = Number(m[1]);
      if (n >= 1 && n <= 32) {
        if (state.chapter !== n) listEl.scrollTop = 0;
        state.chapter = n;
        renderNav(); renderList(); showListView();
        if (!state.current) renderWelcome();
        return;
      }
    }
    if (PLAN[h]) {
      state.current = h;
      if (!state.query && state.chapter !== 'all' && state.chapter !== PLAN[h].chapter) { state.chapter = PLAN[h].chapter; listEl.scrollTop = 0; }
      renderNav(); renderList();
      if (isWritten(h)) { renderTerm(h); save('jd-last', h); } else renderPending(h);
      showDetailView();
      scrollRowIntoView();
      document.title = PLAN[h].title + '｜準1級 用語辞典';
      return;
    }
    renderNav(); renderList(); renderWelcome(); showListView();
  }
  window.addEventListener('hashchange', route);

  // ---------- 検索 ----------
  var timer = null;
  qEl.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.query = qEl.value.trim();
      renderList();
      listEl.scrollTop = 0;
      if (state.query) showListView();
    }, 100);
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qEl.focus(); qEl.select(); }
    else if (e.key === 'Escape') {
      if (document.body.classList.contains('nav-open')) { closeNav(); return; }
      if (qEl.value || document.activeElement === qEl) { qEl.value = ''; state.query = ''; renderList(); qEl.blur(); }
    }
  });

  // ---------- テーマ ----------
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effectiveTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t || (mq && mq.matches ? 'dark' : 'light');
  }
  $('btn-theme').addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('jd-theme', next); } catch (e) { /* 無視 */ }
    if (window.Charts) Charts.redrawAll();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (window.Charts) Charts.redrawAll(); });

  // ---------- 開始 ----------
  if (!location.hash) {
    var last = load('jd-last', null);
    if (last && isWritten(last) && window.innerWidth >= 600) {
      state.current = last;
      history.replaceState(null, '', '#' + last);
    }
  }
  route();
})();

</script>
</body>
</html>
