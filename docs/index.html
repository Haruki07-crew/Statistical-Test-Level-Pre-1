<style>
/* ===== 色とサイズ ===== */
:root {
  --bg: #f6f5f1;
  --surface: #fdfcf9;
  --surface-2: #efede6;
  --fg: #1d2320;
  --muted: #5b6560;
  --faint: #8d958f;
  --line: #dcd9d0;
  --accent: #1d6b66;
  --accent-soft: #dcebe8;
  --accent-fg: #ffffff;
  --mark: #f3e3a6;
  --imp-a: #9c3b22;
  --imp-b: #1d6b66;
  --imp-c: #6a6f6b;
  --chart-1: #1d6b66;
  --chart-2: #b5562f;
  --chart-3: #5a5fa8;
  --chart-fill: rgba(29, 107, 102, .22);
  --chart-fill-2: rgba(181, 86, 47, .22);
  --chart-grid: rgba(29, 35, 32, .10);
  --shadow: 0 6px 24px rgba(20, 30, 25, .14);
  --header-h: 56px;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715;
    --surface: #191e1b;
    --surface-2: #222824;
    --fg: #e4e9e5;
    --muted: #a3ada7;
    --faint: #6f7a74;
    --line: #2e3531;
    --accent: #6cc2b8;
    --accent-soft: #1f3532;
    --accent-fg: #0e1412;
    --mark: #5a4c1a;
    --imp-a: #f09a7c;
    --imp-b: #6cc2b8;
    --imp-c: #a3ada7;
    --chart-1: #6cc2b8;
    --chart-2: #f09a7c;
    --chart-3: #a9adf0;
    --chart-fill: rgba(108, 194, 184, .25);
    --chart-fill-2: rgba(240, 154, 124, .25);
    --chart-grid: rgba(228, 233, 229, .10);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715;
  --surface: #191e1b;
  --surface-2: #222824;
  --fg: #e4e9e5;
  --muted: #a3ada7;
  --faint: #6f7a74;
  --line: #2e3531;
  --accent: #6cc2b8;
  --accent-soft: #1f3532;
  --accent-fg: #0e1412;
  --mark: #5a4c1a;
  --imp-a: #f09a7c;
  --imp-b: #6cc2b8;
  --imp-c: #a3ada7;
  --chart-1: #6cc2b8;
  --chart-2: #f09a7c;
  --chart-3: #a9adf0;
  --chart-fill: rgba(108, 194, 184, .25);
  --chart-fill-2: rgba(240, 154, 124, .25);
  --chart-grid: rgba(228, 233, 229, .10);
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ===== 基本 ===== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== ヘッダー ===== */
.top {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand { text-decoration: none; color: var(--fg); font-weight: 700; white-space: nowrap; font-size: 1rem; letter-spacing: .02em; }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.search { position: relative; flex: 1; min-width: 0; max-width: 560px; margin-left: auto; }
.search input {
  width: 100%; height: 44px; padding: 0 40px 0 38px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  font-size: 16px; /* iOS のズーム防止 */
}
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search-icon { position: absolute; left: 12px; top: 13px; color: var(--faint); pointer-events: none; }
.search-kbd {
  position: absolute; right: 10px; top: 11px; font-family: var(--mono); font-size: 12px; line-height: 20px;
  padding: 0 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--faint);
}
.search input:not(:placeholder-shown) ~ .search-kbd { display: none; }

/* ===== レイアウト ===== */
.layout {
  position: fixed; inset: calc(var(--header-h) + env(safe-area-inset-top)) 0 0 0;
  display: grid; grid-template-columns: 260px 330px minmax(0, 1fr);
}
.pane { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; min-height: 0; }
.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 8px 0 calc(24px + env(safe-area-inset-bottom)); padding-left: env(safe-area-inset-left); }
.list { border-right: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
.detail { background: var(--surface); padding-bottom: env(safe-area-inset-bottom); padding-right: env(safe-area-inset-right); }
.nav-toggle { display: none; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .35); }

@media (max-width: 1023px) {
  .nav-toggle { display: grid; }
  .layout { grid-template-columns: 300px minmax(0, 1fr); }
  .nav {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(320px, 86vw);
    padding-top: env(safe-area-inset-top);
    transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow);
  }
  body.nav-open .nav { transform: none; }
}
@media (max-width: 599px) {
  :root { --header-h: 54px; }
  .brand { display: none; }
  .search { max-width: none; }
  .search-kbd { display: none; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .detail { display: none; border: 0; }
  body.show-detail .list { display: none; }
  body.show-detail .detail { display: block; }
}
@media (prefers-reduced-motion: reduce) { .nav { transition: none; } }

/* ===== 章ナビ ===== */
.nav-head { display: flex; gap: 6px; padding: 6px 12px 10px; flex-wrap: wrap; }
.nav-head button, .chip {
  min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); font-size: .85rem; color: var(--muted);
}
.nav-head button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.nav details { border-top: 1px solid var(--line); }
.nav summary {
  list-style: none; cursor: pointer; padding: 10px 14px; font-size: .8rem; font-weight: 700;
  color: var(--muted); letter-spacing: .06em; display: flex; justify-content: space-between; min-height: 44px; align-items: center;
}
.nav summary::-webkit-details-marker { display: none; }
.nav summary::after { content: "+"; font-family: var(--mono); color: var(--faint); }
.nav details[open] summary::after { content: "−"; }
.ch-btn {
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 4px;
  width: 100%; min-height: 44px; padding: 6px 14px; border: 0; background: transparent; text-align: left;
  font-size: .9rem; line-height: 1.4;
}
.ch-btn:hover { background: var(--surface-2); }
.ch-btn[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ch-no { font-family: var(--mono); color: var(--faint); font-size: .8rem; }
.ch-count { font-family: var(--mono); font-size: .72rem; color: var(--faint); white-space: nowrap; }

/* ===== 用語一覧 ===== */
.list-head {
  position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 14px 8px;
  border-bottom: 1px solid var(--line);
}
.list-title { margin: 0; font-size: .95rem; line-height: 1.5; }
.list-sub { margin: 2px 0 0; font-size: .78rem; color: var(--muted); }
.list ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.row-main {
  flex: 1; min-width: 0; display: block; padding: 10px 6px 10px 14px; min-height: 56px;
  border: 0; background: transparent; text-align: left; line-height: 1.45;
}
.row-main:hover { background: var(--surface-2); }
.row[aria-current="true"] .row-main { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row-title { display: flex; gap: 8px; align-items: baseline; font-weight: 700; font-size: .95rem; }
.row-title span:first-child { overflow: hidden; text-overflow: ellipsis; }
.row-reading { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-snippet { display: block; font-size: .78rem; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.row-snippet mark, .row-title mark { background: var(--mark); color: inherit; border-radius: 2px; }
.row.pending .row-main { cursor: default; }
.row.pending .row-title, .row.pending .row-reading { color: var(--faint); font-weight: 400; }
.pending-tag { font-size: .7rem; color: var(--faint); border: 1px dashed var(--faint); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.row-ch { font-family: var(--mono); font-size: .7rem; color: var(--faint); }
.memo-btn {
  flex: none; width: 48px; border: 0; background: transparent; display: grid; place-items: center; color: var(--faint);
}
.memo-btn svg { width: 22px; height: 22px; }
.memo-btn[aria-pressed="true"] { color: var(--accent); }
.empty { padding: 20px 16px; color: var(--muted); font-size: .9rem; }
.empty h3 { margin: 0 0 6px; font-size: 1rem; color: var(--fg); }

/* 重要度の印：文字と形で区別する */
.imp { flex: none; display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; font-family: var(--mono); font-size: .7rem; font-weight: 500; border-radius: 4px; line-height: 1; }
.imp-A { background: var(--imp-a); color: var(--surface); }
.imp-B { border: 1.5px solid var(--imp-b); color: var(--imp-b); }
.imp-C { border: 1px dashed var(--imp-c); color: var(--imp-c); border-radius: 50%; }

/* ===== 解説 ===== */
.article { max-width: 44rem; margin: 0 auto; padding: 20px max(16px, 4vw) 48px; }
.back-btn { display: none; }
@media (max-width: 599px) {
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; margin: 8px 0 0 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); font-size: .9rem;
  }
  .article { padding-top: 10px; }
}
.crumb { font-size: .8rem; color: var(--muted); margin: 0 0 4px; }
.crumb button { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }
.term-title { margin: 0; font-size: 1.6rem; line-height: 1.35; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
.term-title .imp { font-size: .8rem; }
.term-meta { margin: 6px 0 0; color: var(--muted); font-size: .85rem; line-height: 1.6; }
.term-meta .en { font-style: italic; }
.term-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.memo-toggle {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: .85rem;
}
.memo-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.memo-toggle svg { width: 18px; height: 18px; }
.jump {
  position: sticky; top: 0; z-index: 3; margin: 16px calc(-1 * max(16px, 4vw)) 0; padding: 8px max(16px, 4vw);
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
}
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; min-height: 34px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: .8rem; color: var(--muted); }
.jump button:hover { color: var(--fg); border-color: var(--faint); }
.body { overflow-wrap: anywhere; }
.body .sec { scroll-margin-top: 60px; }
.body h2 {
  font-size: 1.1rem; margin: 2.2em 0 .7em; padding-bottom: .35em; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
.body h2::before { content: ""; width: 6px; height: 1.1em; border-radius: 2px; background: var(--accent); }
.body p { margin: .8em 0; }
.body ul, .body ol { padding-left: 1.4em; }
.body li { margin: .35em 0; }
.body strong { font-weight: 700; }
.body .sec[data-sec="summary"] p { font-size: 1.05rem; }
.body .sec[data-sec="mistake"] li { list-style: none; margin-left: -1.2em; padding: 8px 12px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--imp-a); }
.math-display { overflow-x: auto; overflow-y: hidden; margin: 1em 0; padding: 4px 0; max-width: 100%; }
.math-inline { white-space: nowrap; }
mjx-container[display="true"] { margin: .4em 0 !important; }
mjx-container { max-width: 100%; }
.math-display mjx-container { overflow-x: auto; overflow-y: hidden; }
.table-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--line); border-radius: 8px; }
.body table { border-collapse: collapse; width: 100%; font-size: .9rem; line-height: 1.6; }
.body th, .body td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.body th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
.body tr:last-child td { border-bottom: 0; }
.body code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }

/* ===== グラフ ===== */
.chart { margin: 1.2em 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.chart-canvas { position: relative; width: 100%; height: 260px; }
.chart-canvas.tall { height: 340px; }
.chart-canvas.short { height: 200px; }
.chart-pair { display: grid; gap: 10px; }
.chart-pair > *, .chart-plot { min-width: 0; }
@media (min-width: 700px) { .chart-pair.side { grid-template-columns: 1fr 1fr; } }
.chart-controls { display: grid; gap: 10px; margin-top: 10px; }
.slider { display: grid; grid-template-columns: minmax(7em, auto) 1fr 4.5em; align-items: center; gap: 10px; font-size: .85rem; }
.slider output { font-family: var(--mono); text-align: right; color: var(--fg); }
.slider label { color: var(--muted); line-height: 1.4; }
input[type="range"] { width: 100%; height: 32px; accent-color: var(--accent); background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
input[type="range"] { -webkit-appearance: none; appearance: none; }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
@media (max-width: 599px) { .slider { grid-template-columns: 1fr 4.5em; } .slider label { grid-column: 1 / -1; } }
.chart-info { font-family: var(--mono); font-size: .82rem; color: var(--fg); margin-top: 8px; line-height: 1.6; overflow-wrap: anywhere; }
.chart-cap { margin: 8px 0 0; font-size: .82rem; color: var(--muted); line-height: 1.6; }
.chart-btn { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; justify-self: start; }
.chart-missing { padding: 16px; text-align: center; color: var(--faint); font-size: .85rem; border: 1px dashed var(--line); border-radius: 8px; }
.jm-table { border-collapse: collapse; margin: 0 auto; font-family: var(--mono); font-size: .85rem; }
.jm-table th, .jm-table td { border: 1px solid var(--line); padding: 6px 10px; text-align: center; min-width: 3.6em; }
.jm-table th { background: var(--surface-2); font-family: var(--font); font-weight: 700; }
.jm-table .marg { background: var(--accent-soft); font-weight: 500; }
.jm-table tr.sel td:not(.marg) { outline: 2px solid var(--chart-2); outline-offset: -2px; }
.jm-table tbody tr { cursor: pointer; }

/* ===== 関連・前後 ===== */
.related { margin-top: 2.6em; }
.related h2, .pager-h { font-size: 1rem; margin: 0 0 .6em; }
.related-list { display: flex; flex-wrap: wrap; gap: 8px; }
.rel-btn { min-height: 40px; padding: 4px 14px; border: 1px solid var(--accent); border-radius: 999px; background: var(--surface); color: var(--accent); font-size: .88rem; }
.rel-btn:hover { background: var(--accent-soft); }
.rel-btn:disabled { border-style: dashed; border-color: var(--line); color: var(--faint); cursor: default; background: transparent; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 2em; padding-top: 1.2em; border-top: 1px solid var(--line); }
.pager button { min-height: 56px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: left; font-size: .88rem; line-height: 1.4; }
.pager button:last-child { text-align: right; }
.pager small { display: block; color: var(--faint); font-size: .72rem; }
.pager button:disabled { visibility: hidden; }

/* ===== はじめの画面 ===== */
.welcome h1 { font-size: 1.4rem; margin: 0 0 .4em; text-wrap: balance; }
.welcome p { color: var(--muted); }
.progress-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 12px 0 4px; }
.progress-bar span { display: block; height: 100%; background: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

</style>

<header class="top">

,"status":"planned"},{"id":"em-algorithm","title":"EMアルゴリズム","importance":"A","status":"planned"},{"id":"censored-data","title":"打ち切りデータ","importance":"A","status":"planned"},{"id":"truncated-data","title":"切断データ","importance":"B","status":"planned"},{"id":"kaplan-meier-estimator","title":"カプラン・マイヤー推定量","importance":"A","status":"planned"},{"id":"greenwood-formula","title":"グリーンウッドの公式","importance":"B","status":"planned"},{"id":"log-rank-test","title":"ログランク検定","importance":"A","status":"planned"},{"id":"cox-proportional-hazards-model","title":"比例ハザードモデル","importance":"A","status":"planned"},{"id":"partial-likelihood","title":"部分尤度","importance":"B","status":"planned"},{"id":"hazard-ratio","title":"ハザード比","importance":"B","status":"planned"},{"id":"nelson-aalen-estimator","title":"ネルソン・アーレン推定量","importance":"C","status":"planned"},{"id":"ignorability","title":"無視可能性","importance":"C","status":"planned"}]},{"no":30,"title":"モデル選択","terms":[{"id":"model-selection","title":"モデル選択","importance":"B","status":"planned"},{"id":"aic","title":"AIC","importance":"A","status":"planned"},{"id":"bic","title":"BIC","importance":"A","status":"planned"},{"id":"kullback-leibler-divergence","title":"カルバック・ライブラー情報量","importance":"A","status":"planned"},{"id":"expected-log-likelihood","title":"平均対数尤度","importance":"B","status":"planned"},{"id":"cross-validation","title":"交差検証法","importance":"A","status":"planned"},{"id":"leave-one-out-cv","title":"一個抜き交差検証","importance":"B","status":"planned"},{"id":"overfitting","title":"過学習","importance":"A","status":"planned"},{"id":"bias-variance-tradeoff","title":"バイアス・バリアンスのトレードオフ","importance":"A","status":"planned"},{"id":"mallows-cp","title":"マローズのCp","importance":"A","status":"planned"},{"id":"information-criteria-comparison","title":"情報量規準によるモデル比較","importance":"B","status":"planned"},{"id":"generalization-error","title":"汎化誤差","importance":"B","status":"planned"},{"id":"training-test-split","title":"訓練データとテストデータ","importance":"C","status":"planned"},{"id":"aicc","title":"補正AIC","importance":"C","status":"planned"},{"id":"tic-ebic","title":"TICと一般化情報量規準","importance":"C","status":"planned"}]},{"no":31,"title":"ベイズ法","terms":[{"id":"prior-distribution","title":"事前分布","importance":"A","status":"planned"},{"id":"posterior-distribution","title":"事後分布","importance":"A","status":"planned"},{"id":"conjugate-prior","title":"共役事前分布","importance":"A","status":"planned"},{"id":"beta-binomial-model","title":"ベータ・二項モデル","importance":"A","status":"planned"},{"id":"gamma-poisson-model","title":"ガンマ・ポアソンモデル","importance":"A","status":"planned"},{"id":"normal-normal-model","title":"正規・正規モデル","importance":"A","status":"planned"},{"id":"noninformative-prior","title":"無情報事前分布","importance":"B","status":"planned"},{"id":"jeffreys-prior","title":"ジェフリーズの事前分布","importance":"B","status":"planned"},{"id":"posterior-mean-map","title":"事後平均とMAP推定","importance":"A","status":"planned"},{"id":"credible-interval","title":"信用区間","importance":"A","status":"planned"},{"id":"predictive-distribution","title":"予測分布","importance":"A","status":"planned"},{"id":"bayes-factor","title":"ベイズファクター","importance":"B","status":"planned"},{"id":"marginal-likelihood","title":"周辺尤度","importance":"B","status":"planned"},{"id":"hierarchical-bayes-model","title":"階層ベイズモデル","importance":"B","status":"planned"},{"id":"empirical-bayes","title":"経験ベイズ法","importance":"C","status":"planned"},{"id":"bayes-decision-theory","title":"ベイズ決定理論","importance":"C","status":"planned"}]},{"no":32,"title":"シミュレーション","terms":[{"id":"uniform-random-number","title":"一様乱数","importance":"A","status":"planned"},{"id":"linear-congruential-generator","title":"線形合同法","importance":"B","status":"planned"},{"id":"inverse-transform-sampling","title":"逆関数法","importance":"A","status":"planned"},{"id":"rejection-sampling","title":"棄却法","importance":"A","status":"planned"},{"id":"box-muller-method","title":"ボックス・ミュラー法","importance":"A","status":"planned"},{"id":"monte-carlo-integration","title":"モンテカルロ積分","importance":"A","status":"planned"},{"id":"importance-sampling","title":"重点サンプリング","importance":"A","status":"planned"},{"id":"variance-reduction","title":"分散減少法","importance":"C","status":"planned"},{"id":"mcmc","title":"マルコフ連鎖モンテカルロ法","importance":"A","status":"planned"},{"id":"metropolis-hastings","title":"メトロポリス・ヘイスティングス法","importance":"A","status":"planned"},{"id":"gibbs-sampling","title":"ギブスサンプリング","importance":"A","status":"planned"},{"id":"burn-in-convergence","title":"バーンインと収束診断","importance":"B","status":"planned"},{"id":"bootstrap","title":"ブートストラップ法","importance":"A","status":"planned"},{"id":"bootstrap-confidence-interval","title":"ブートストラップ信頼区間","importance":"B","status":"planned"},{"id":"jackknife","title":"ジャックナイフ法","importance":"A","status":"planned"},{"id":"permutation-simulation","title":"モンテカルロ検定","importance":"C","status":"planned"}]}],"terms":{"bayes-theorem":{"id":"bayes-theorem","title":"ベイズの定理","reading":"べいずのていり","en":"Bayes' theorem","aliases":["ベイズの公式","逆確率の公式"],"chapter":1,"importance":"A","tags":["条件付き確率","全確率の公式","事前確率","事後確率"],"related":["conditional-independence","conditional-probability-function","conditional-probability-density-function","prior-distribution","posterior-distribution"],"charts":[{"type":"custom","id":"bayes-area","params":{"prior":0.01,"sensitivity":0.99,"specificity":0.95},"sliders":[{"param":"prior","label":"有病率（事前確率）","min":0.001,"max":0.5,"step":0.001},{"param":"sensitivity","label":"感度 P(陽性|病気)","min":0.5,"max":1,"step":0.01},{"param":"specificity","label":"特異度 P(陰性|健康)","min":0.5,"max":1,"step":0.01}],"caption":"横幅を事前確率で、縦を検査結果の確率で分けた面積図。陽性の領域（色付き）のうち、病気の人が占める割合が事後確率になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>結果（データ）を見たあとで、その原因（仮説）が正しい確率を更新するための公式です。\n「原因 → 結果」の確率から、「結果 → 原因」の確率を逆算します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>事象 <span class=\"math-inline\">$A, B$<\/span> について <span class=\"math-inline\">$P(A)&gt;0,\\ P(B)&gt;0$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$P(A \\mid B) = \\frac{P(B \\mid A)\\,P(A)}{P(B)}$$<\/div>\n<p>が成り立ちます。<\/p>\n<p>より一般に、事象 <span class=\"math-inline\">$A_1, \\dots, A_k$<\/span> が互いに排反で、その和が全体 <span class=\"math-inline\">$\\Omega$<\/span> になる（標本空間の分割である）とき、<\/p>\n<div class=\"math-display\">$$P(A_i \\mid B) = \\frac{P(B \\mid A_i)\\,P(A_i)}{\\displaystyle\\sum_{j=1}^{k} P(B \\mid A_j)\\,P(A_j)}$$<\/div>\n<p>です。分母は<strong>全確率の公式<\/strong> <span class=\"math-inline\">$P(B)=\\sum_{j} P(B \\mid A_j)P(A_j)$<\/span> です。<\/p>\n<p>確率変数で書くと、パラメータ <span class=\"math-inline\">$\\theta$<\/span> の密度 <span class=\"math-inline\">$\\pi(\\theta)$<\/span> とデータ <span class=\"math-inline\">$x$<\/span> について<\/p>\n<div class=\"math-display\">$$\\pi(\\theta \\mid x) = \\frac{f(x \\mid \\theta)\\,\\pi(\\theta)}{\\displaystyle\\int f(x \\mid \\theta')\\,\\pi(\\theta')\\,d\\theta'} \\;\\propto\\; f(x \\mid \\theta)\\,\\pi(\\theta)$$<\/div>\n<p>となり、これが第31章「ベイズ法」の出発点になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$P(A_i)$<\/span>：<strong>事前確率<\/strong>。データを見る前の、原因 <span class=\"math-inline\">$A_i$<\/span> の確率。<\/li>\n<li><span class=\"math-inline\">$P(B \\mid A_i)$<\/span>：<strong>尤度<\/strong>。原因 <span class=\"math-inline\">$A_i$<\/span> のもとで、結果 <span class=\"math-inline\">$B$<\/span> が起こる確率。<\/li>\n<li><span class=\"math-inline\">$P(A_i \\mid B)$<\/span>：<strong>事後確率<\/strong>。結果 <span class=\"math-inline\">$B$<\/span> を見たあとの、原因 <span class=\"math-inline\">$A_i$<\/span> の確率。<\/li>\n<li>分母 <span class=\"math-inline\">$P(B)$<\/span>：結果 <span class=\"math-inline\">$B$<\/span> が起こる確率の合計。事後確率の合計を1にするための「正規化定数」です。<\/li>\n<\/ul>\n<p>導出は乗法定理を2通りに書くだけです。<\/p>\n<div class=\"math-display\">$$P(A \\cap B) = P(B \\mid A)\\,P(A) = P(A \\mid B)\\,P(B)$$<\/div>\n<p>右の2つを等しいとおいて <span class=\"math-inline\">$P(B)$<\/span> で割れば、ベイズの定理になります。<\/p>\n<p>直感的には、「結果 <span class=\"math-inline\">$B$<\/span> が起こる道筋」をすべて並べ、そのうち原因 <span class=\"math-inline\">$A_i$<\/span> を通る道筋が占める割合を求めている、と考えると覚えやすくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：病気の検査（陽性でも病気とは限らない）<\/strong><\/p>\n<p>ある病気の有病率が 1%、検査の感度（病気の人が陽性になる確率）が 99%、特異度（健康な人が陰性になる確率）が 95% とします。\n陽性と出た人が本当に病気である確率は、<\/p>\n<div class=\"math-display\">$$P(\\text{病気} \\mid +) = \\frac{0.99 \\times 0.01}{0.99 \\times 0.01 + 0.05 \\times 0.99} = \\frac{0.0099}{0.0594} \\approx 0.1667$$<\/div>\n<p>で、約 16.7% にすぎません。<\/p>\n<p>10,000人で数えると直感的にわかります。病気の100人のうち99人が陽性、健康な9,900人のうち495人が（誤って）陽性です。陽性の594人のうち病気なのは99人なので、<span class=\"math-inline\">$99/594 \\approx 0.167$<\/span> です。<\/p>\n<p><strong>例2：2回目の検査で更新する<\/strong><\/p>\n<p>陽性の人がもう一度、同じ精度の検査を受けて再び陽性だったとします。病気の有無を条件としたとき2回の検査結果が独立（条件付き独立）なら、1回目の事後確率 <span class=\"math-inline\">$1/6$<\/span> を新しい事前確率として使えます。<\/p>\n<div class=\"math-display\">$$P(\\text{病気} \\mid +,+) = \\frac{0.99 \\times \\frac{1}{6}}{0.99 \\times \\frac{1}{6} + 0.05 \\times \\frac{5}{6}} = \\frac{0.1650}{0.2067} \\approx 0.7984$$<\/div>\n<p>2回陽性で約 79.8% まで上がります。<\/p>\n<p><strong>例3：不良品はどの機械で作られたか<\/strong><\/p>\n<p>機械 A, B, C が製品の 50%, 30%, 20% を作り、不良率はそれぞれ 1%, 2%, 3% です。不良品が1個見つかったとき、<\/p>\n<div class=\"math-display\">$$P(\\text{不良}) = 0.5 \\times 0.01 + 0.3 \\times 0.02 + 0.2 \\times 0.03 = 0.017$$<\/div>\n<div class=\"math-display\">$$P(A \\mid \\text{不良}) = \\frac{0.005}{0.017} \\approx 0.294, \\quad\nP(B \\mid \\text{不良}) = P(C \\mid \\text{不良}) = \\frac{0.006}{0.017} \\approx 0.353$$<\/div>\n<p>生産量が最も多い A よりも、B と C が原因である可能性のほうが高くなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：検査が陽性だった人が本当に病気である確率（陽性的中率）を計算します。有病率の低い集団で一斉検査をすると偽陽性が多くなる理由の説明にも使われます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：迷惑メールフィルタでは、単語の出現確率を尤度として「このメールが迷惑メールである確率」を計算します（ナイーブベイズ分類器）。<\/li>\n<li><strong>製造・品質管理<\/strong>：不良品が見つかったとき、どの工程や機械が原因である可能性が高いかを推定し、点検の優先順位を決めます。<\/li>\n<li><strong>マーケティング<\/strong>：A/Bテストで、蓄積したデータから「案Bのほうが成約率が高い確率」を事後分布で直接求めます（ベイズ流のA/Bテスト）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>正方形全体を「病気／健康」の割合で左右に分け、それぞれを「陽性／陰性」の割合で上下に分けた面積図です。\n有病率のスライダーを小さくすると、陽性の領域の大部分を「健康なのに陽性」が占めるようになり、事後確率が下がる様子が見えます。\n特異度を上げると偽陽性の領域が細くなり、事後確率が大きく上がります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>分母は全確率の公式で計算します。原因が3つ以上ある問題では、表（原因 × 結果）を書いてから計算すると間違えにくくなります。<\/li>\n<li>「事後確率 ∝ 尤度 × 事前確率」の形は、第31章の事後分布の計算（共役事前分布など）でそのまま使います。<\/li>\n<li>オッズで書くと「事後オッズ ＝ 尤度比 × 事前オッズ」になります。例1では尤度比 <span class=\"math-inline\">$0.99/0.05=19.8$<\/span>、事前オッズ <span class=\"math-inline\">$1/99$<\/span> なので、事後オッズは <span class=\"math-inline\">$0.2$<\/span>、確率に直すと <span class=\"math-inline\">$0.2/1.2 \\approx 0.167$<\/span> です。<\/li>\n<li>逐次的に更新するときは、条件付き独立の仮定が必要です。問題文に仮定が書かれているかを確認します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$P(A \\mid B)$<\/span> と <span class=\"math-inline\">$P(B \\mid A)$<\/span> を同じものとみなす → ○ 「病気なら陽性になる確率」と「陽性なら病気である確率」はまったく別の値です（検察官の誤謬とも呼ばれます）。<\/li>\n<li>× 有病率（事前確率）を無視して、感度だけで判断する → ○ 事前確率が小さいと、精度の高い検査でも事後確率は低くなります（基準率の無視）。<\/li>\n<li>× 分母に <span class=\"math-inline\">$P(B \\mid A)P(A)$<\/span> だけを入れる → ○ 分母には、<span class=\"math-inline\">$B$<\/span> が起こるすべての道筋（<span class=\"math-inline\">$A$<\/span> でない場合も含む）を足し合わせます。<\/li>\n<\/ul><\/section>","text":"一言でいうと 結果（データ）を見たあとで、その原因（仮説）が正しい確率を更新するための公式です。 「原因 → 結果」の確率から、「結果 → 原因」の確率を逆算します。 定義・数式 事象 について のとき、 が成り立ちます。 より一般に、事象 が互いに排反で、その和が全体 になる（標本空間の分割である）とき、 です。分母は全確率の公式 です。 確率変数で書くと、パラメータ の密度 とデータ について となり、これが第31章「ベイズ法」の出発点になります。 数式の読み解き - ：事前確率。データを見る前の、原因 の確率。 - ：尤度。原因 のもとで、結果 が起こる確率。 - ：事後確率。結果 を見たあとの、原因 の確率。 - 分母 ：結果 が起こる確率の合計。事後確率の合計を1にするための「正規化定数」です。 導出は乗法定理を2通りに書くだけです。 右の2つを等しいとおいて で割れば、ベイズの定理になります。 直感的には、「結果 が起こる道筋」をすべて並べ、そのうち原因 を通る道筋が占める割合を求めている、と考えると覚えやすくなります。 具体例 例1：病気の検査（陽性でも病気とは限らない） ある病気の有病率が 1%、検査の感度（病気の人が陽性になる確率）が 99%、特異度（健康な人が陰性になる確率）が 95% とします。 陽性と出た人が本当に病気である確率は、 で、約 16.7% にすぎません。 10,000人で数えると直感的にわかります。病気の100人のうち99人が陽性、健康な9,900人のうち495人が（誤って）陽性です。陽性の594人のうち病気なのは99人なので、 です。 例2：2回目の検査で更新する 陽性の人がもう一度、同じ精度の検査を受けて再び陽性だったとします。病気の有無を条件としたとき2回の検査結果が独立（条件付き独立）なら、1回目の事後確率 を新しい事前確率として使えます。 2回陽性で約 79.8% まで上がります。 例3：不良品はどの機械で作られたか 機械 A, B, C が製品の 50%, 30%, 20% を作り、不良率はそれぞれ 1%, 2%, 3% です。不良品が1個見つかったとき、 生産量が最も多い A よりも、B と C が原因である可能性のほうが高くなります。 現場での使われ方 - 医療：検査が陽性だった人が本当に病気である確率（陽性的中率）を計算します。有病率の低い集団で一斉検査をすると偽陽性が多くなる理由の説明にも使われます。 - IT・Webサービス：迷惑メールフィルタでは、単語の出現確率を尤度として「このメールが迷惑メールである確率」を計算します（ナイーブベイズ分類器）。 - 製造・品質管理：不良品が見つかったとき、どの工程や機械が原因である可能性が高いかを推定し、点検の優先順位を決めます。 - マーケティング：A/Bテストで、蓄積したデータから「案Bのほうが成約率が高い確率」を事後分布で直接求めます（ベイズ流のA/Bテスト）。 グラフ・イメージ 正方形全体を「病気／健康」の割合で左右に分け、それぞれを「陽性／陰性」の割合で上下に分けた面積図です。 有病率のスライダーを小さくすると、陽性の領域の大部分を「健康なのに陽性」が占めるようになり、事後確率が下がる様子が見えます。 特異度を上げると偽陽性の領域が細くなり、事後確率が大きく上がります。 試験のポイント - 分母は全確率の公式で計算します。原因が3つ以上ある問題では、表（原因 × 結果）を書いてから計算すると間違えにくくなります。 - 「事後確率 ∝ 尤度 × 事前確率」の形は、第31章の事後分布の計算（共役事前分布など）でそのまま使います。 - オッズで書くと「事後オッズ ＝ 尤度比 × 事前オッズ」になります。例1では尤度比 、事前オッズ なので、事後オッズは 、確率に直すと です。 - 逐次的に更新するときは、条件付き独立の仮定が必要です。問題文に仮定が書かれているかを確認します。 よくある間違い - × と を同じものとみなす → ○ 「病気なら陽性になる確率」と「陽性なら病気である確率」はまったく別の値です（検察官の誤謬とも呼ばれます）。 - × 有病率（事前確率）を無視して、感度だけで判断する → ○ 事前確率が小さいと、精度の高い検査でも事後確率は低くなります（基準率の無視）。 - × 分母に だけを入れる → ○ 分母には、 が起こるすべての道筋（ でない場合も含む）を足し合わせます。"},"conditional-independence":{"id":"conditional-independence","title":"条件付き独立","reading":"じょうけんつきどくりつ","en":"Conditional independence","aliases":["条件つき独立"],"chapter":1,"importance":"A","tags":["独立","条件付き確率","ベイズの定理","グラフィカルモデル"],"related":["independence-of-events","bayes-theorem","conditional-probability","naive-bayes-classifier","graphical-model","markov-property"],"charts":[{"type":"custom","id":"bayes-area","params":{"prior":0.167,"sensitivity":0.99,"specificity":0.95,"labelA":"病気","labelNotA":"健康","labelB":"2回目陽性"},"sliders":[{"param":"prior","label":"1回目陽性後の P(病気)","min":0.001,"max":0.999,"step":0.001},{"param":"sensitivity","label":"感度 P(陽性|病気)","min":0.5,"max":1,"step":0.01},{"param":"specificity","label":"特異度 P(陰性|健康)","min":0.5,"max":1,"step":0.01}],"caption":"1回目が陽性だった人たち（病気の割合 1/6）を全体とみなし、2回目の検査で分けた面積図。条件付き独立なら、2回目は1回目と同じ感度・特異度で分けてよく、陽性部分に占める病気の割合が P(病気|+,+)≈0.798 になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>第3の事象 <span class=\"math-inline\">$C$<\/span> が起きたとわかっている世界の中で、2つの事象 <span class=\"math-inline\">$A, B$<\/span> が独立になっていることです。\n「共通の原因を固定すれば、残りはばらばらに起こる」という状況を表し、ベイズの逐次更新や、ナイーブベイズ、グラフィカルモデルの土台になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$P(C)&gt;0$<\/span> とします。事象 <span class=\"math-inline\">$A, B$<\/span> が <strong><span class=\"math-inline\">$C$<\/span> を与えたもとで条件付き独立<\/strong>であるとは、<\/p>\n<div class=\"math-display\">$$P(A \\cap B \\mid C) = P(A \\mid C)\\,P(B \\mid C)$$<\/div>\n<p>が成り立つことです。<span class=\"math-inline\">$P(B\\cap C)&gt;0$<\/span> なら、これは<\/p>\n<div class=\"math-display\">$$P(A \\mid B \\cap C) = P(A \\mid C)$$<\/div>\n<p>と同値です。「<span class=\"math-inline\">$C$<\/span> がわかっていれば、さらに <span class=\"math-inline\">$B$<\/span> を知っても <span class=\"math-inline\">$A$<\/span> の確率は変わらない」という意味です。<\/p>\n<p>確率変数では、<span class=\"math-inline\">$Z$<\/span> を与えたもとで <span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が条件付き独立（記号 <span class=\"math-inline\">$X \\perp\\!\\!\\!\\perp Y \\mid Z$<\/span>）とは、すべての <span class=\"math-inline\">$z$<\/span> について<\/p>\n<div class=\"math-display\">$$f(x, y \\mid z) = f(x \\mid z)\\,f(y \\mid z)$$<\/div>\n<p>が成り立つことです（<span class=\"math-inline\">$f$<\/span> は条件付き確率関数または条件付き密度）。<\/p>\n<p><strong>重要な注意<\/strong>：独立と条件付き独立は、どちらからどちらも導けません。<\/p>\n<ul>\n<li>条件付き独立でも、独立とは限らない（共通の原因がある場合）。<\/li>\n<li>独立でも、条件付き独立とは限らない（共通の結果を条件にした場合）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$C$<\/span>：「共通の原因」や「グループ」を表すことが多い事象です。<\/li>\n<li><span class=\"math-inline\">$P(\\cdot \\mid C)$<\/span>：<span class=\"math-inline\">$C$<\/span> の中だけを全体とみなした確率。条件付き独立は、この新しい確率のもとでの普通の独立です。<\/li>\n<li><span class=\"math-inline\">$C$<\/span> だけでなく <span class=\"math-inline\">$C^c$<\/span> のもとでも条件付き独立かどうかは、別に確かめる必要があります。<\/li>\n<\/ul>\n<p><strong>条件付き独立なのに独立でない理由<\/strong>は、全確率の公式で見えます。<span class=\"math-inline\">$C$<\/span> と <span class=\"math-inline\">$C^c$<\/span> の両方で条件付き独立なら<\/p>\n<div class=\"math-display\">$$P(A\\cap B) = P(A\\mid C)P(B\\mid C)P(C) + P(A\\mid C^c)P(B\\mid C^c)P(C^c)$$<\/div>\n<p>です。これは一般に <span class=\"math-inline\">$P(A)P(B)$<\/span> と一致しません。<span class=\"math-inline\">$A$<\/span> が起きたことは「<span class=\"math-inline\">$C$<\/span> である可能性が高い」という情報を運び、その結果 <span class=\"math-inline\">$B$<\/span> の確率も変わるからです。<\/p>\n<p><strong>ベイズの逐次更新<\/strong>は、条件付き独立を使っています。<span class=\"math-inline\">$D$<\/span>＝病気、<span class=\"math-inline\">$T_1, T_2$<\/span>＝1回目・2回目の陽性として、<span class=\"math-inline\">$D$<\/span> と <span class=\"math-inline\">$D^c$<\/span> のそれぞれのもとで <span class=\"math-inline\">$T_1, T_2$<\/span> が条件付き独立なら<\/p>\n<div class=\"math-display\">$$P(D\\mid T_1\\cap T_2) = \\frac{P(T_2\\mid D)\\,P(D\\mid T_1)}{P(T_2\\mid D)\\,P(D\\mid T_1) + P(T_2\\mid D^c)\\,P(D^c\\mid T_1)}$$<\/div>\n<p>となり、1回目の事後確率 <span class=\"math-inline\">$P(D\\mid T_1)$<\/span> をそのまま新しい事前確率として使えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：2回の検査（ベイズの定理の例2の裏側）<\/strong><\/p>\n<p>有病率 1%、感度 99%、特異度 95% の検査を2回受けます。病気の有無を与えたもとで2回の結果は条件付き独立とします。<\/p>\n<p>まず2回とも陽性の確率を全確率の公式で求めます。<\/p>\n<div class=\"math-display\">$$P(T_1\\cap T_2) = 0.99^2 \\times 0.01 + 0.05^2 \\times 0.99 = 0.009801 + 0.002475 = 0.012276$$<\/div>\n<p>1回の陽性率は <span class=\"math-inline\">$P(T_1)=P(T_2)=0.0594$<\/span> なので、<span class=\"math-inline\">$P(T_1)P(T_2) \\approx 0.003528$<\/span> です。\n<span class=\"math-inline\">$0.012276 \\ne 0.003528$<\/span> なので、<strong><span class=\"math-inline\">$T_1$<\/span> と <span class=\"math-inline\">$T_2$<\/span> は独立ではありません<\/strong>。実際<\/p>\n<div class=\"math-display\">$$P(T_2 \\mid T_1) = \\frac{0.012276}{0.0594} \\approx 0.2067 \\quad (\\text{比較：} P(T_2)=0.0594)$$<\/div>\n<p>で、1回目が陽性だと2回目も陽性になりやすくなります。1回目の陽性が「病気らしさ」を高めるからです。<\/p>\n<p>それでも事後確率は、条件付き独立のおかげで次のように計算できます。<\/p>\n<div class=\"math-display\">$$P(D \\mid T_1\\cap T_2) = \\frac{0.99^2\\times 0.01}{0.012276} = \\frac{0.009801}{0.012276} \\approx 0.7984$$<\/div>\n<p>これは1回目の事後確率 <span class=\"math-inline\">$1/6$<\/span> を事前確率にして更新した値（ベイズの定理の例2）と一致します。<\/p>\n<p><strong>例2：どちらのコインかわからない<\/strong><\/p>\n<p>公平なコイン（表 0.5）と偏ったコイン（表 0.8）から無作為に1枚選び、2回投げます。どちらのコインかを与えれば、2回の結果は条件付き独立です。しかし<\/p>\n<div class=\"math-display\">$$P(\\text{2回目表}\\mid\\text{1回目表}) = \\frac{0.5\\times0.5^2+0.5\\times0.8^2}{0.5\\times0.5+0.5\\times0.8} = \\frac{0.445}{0.65} \\approx 0.6846$$<\/div>\n<p>で、<span class=\"math-inline\">$P(\\text{2回目表})=0.65$<\/span> と異なります。共通の原因（どのコインか）が隠れていると、結果どうしに相関が生まれます。<\/p>\n<p><strong>例3：独立なのに、条件付きでは独立でない<\/strong><\/p>\n<p>公平なコインを2回投げ、<span class=\"math-inline\">$A$<\/span>＝「1回目が表」、<span class=\"math-inline\">$B$<\/span>＝「2回目が表」は独立です。ここで <span class=\"math-inline\">$C$<\/span>＝「2回の結果が同じ」を条件にすると、<\/p>\n<div class=\"math-display\">$$P(A\\cap B\\mid C) = \\frac{1/4}{1/2} = 0.5, \\qquad P(A\\mid C)P(B\\mid C) = 0.5\\times0.5 = 0.25$$<\/div>\n<p>となり、条件付き独立ではありません。<span class=\"math-inline\">$C$<\/span> のもとでは、1回目がわかれば2回目も決まるからです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：複数の検査を組み合わせて診断するとき、病気の有無を与えたもとで検査結果が条件付き独立と仮定して、陽性的中率を逐次更新します。同じ原理の検査どうしでは仮定が崩れやすく、事後確率を過大評価する点に注意します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：迷惑メールフィルタのナイーブベイズ分類器は、「迷惑メールかどうか」を与えたもとで各単語の出現が条件付き独立と仮定し、尤度を単語ごとの確率の積で計算します。<\/li>\n<li><strong>行政・調査<\/strong>：グラフィカルモデル（第25章）では、変数間の条件付き独立の関係をグラフの「辺がない」ことで表し、多数の変数の関係を整理します。<\/li>\n<li><strong>金融・保険<\/strong>：景気の状態を与えたもとで各社の倒産が条件付き独立と仮定するモデルでは、景気という共通要因を通じて倒産が同時に起こりやすくなる（相関する）ことを表現できます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1回目が陽性だった人だけを集めた集団（病気の割合 <span class=\"math-inline\">$1/6\\approx0.167$<\/span>）を全体とし、2回目の検査結果で分けた面積図です。\n条件付き独立なので、2回目の陽性率は病気の人で 0.99、健康な人で 0.05 のまま使えます。陽性の領域に占める病気の割合が <span class=\"math-inline\">$P(D\\mid T_1\\cap T_2)\\approx 0.798$<\/span> です。\n事前確率のスライダーを 0.01 に戻すと1回目の更新、0.167 にすると2回目の更新になり、同じ図で逐次更新を追えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定義 <span class=\"math-inline\">$P(A\\cap B\\mid C)=P(A\\mid C)P(B\\mid C)$<\/span> と、同値な形 <span class=\"math-inline\">$P(A\\mid B\\cap C)=P(A\\mid C)$<\/span> を覚えます。<\/li>\n<li>「条件付き独立 ⇏ 独立」「独立 ⇏ 条件付き独立」の両方向の反例（例2・例3）を説明できるようにします。<\/li>\n<li>ベイズの定理で「2回目の検査」や「追加データ」を扱う問題は、条件付き独立の仮定のもとで、前の事後確率を次の事前確率に使います。<\/li>\n<li>確率変数版は、マルコフ連鎖のマルコフ性（現在を与えれば過去と未来は条件付き独立）、グラフィカルモデル、偏相関係数（第3章）につながります。多変量正規分布では、偏相関が0であることと条件付き独立が同値です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 条件付き独立なら <span class=\"math-inline\">$P(T_1\\cap T_2)=P(T_1)P(T_2)$<\/span> → ○ 条件を外すと独立とは限りません。例1では <span class=\"math-inline\">$0.012276$<\/span> と <span class=\"math-inline\">$0.003528$<\/span> で大きく違います。<\/li>\n<li>× 独立な事象は、何を条件にしても独立 → ○ 例3のように、共通の結果を条件にすると従属になることがあります。<\/li>\n<li>× <span class=\"math-inline\">$C$<\/span> のもとで条件付き独立なら <span class=\"math-inline\">$C^c$<\/span> のもとでも自動的に条件付き独立 → ○ 別々に確かめます（逐次更新ではどちらも必要です）。<\/li>\n<li>× 同じ人に同じ検査を繰り返せば必ず条件付き独立 → ○ 体質などで偽陽性が出やすい人は2回目も偽陽性になりやすく、仮定が崩れます。仮定が成り立つかを問題文で確認します。<\/li>\n<\/ul><\/section>","text":"一言でいうと 第3の事象 が起きたとわかっている世界の中で、2つの事象 が独立になっていることです。 「共通の原因を固定すれば、残りはばらばらに起こる」という状況を表し、ベイズの逐次更新や、ナイーブベイズ、グラフィカルモデルの土台になります。 定義・数式 とします。事象 が を与えたもとで条件付き独立であるとは、 が成り立つことです。 なら、これは と同値です。「 がわかっていれば、さらに を知っても の確率は変わらない」という意味です。 確率変数では、 を与えたもとで と が条件付き独立（記号 ）とは、すべての について が成り立つことです（ は条件付き確率関数または条件付き密度）。 重要な注意：独立と条件付き独立は、どちらからどちらも導けません。 - 条件付き独立でも、独立とは限らない（共通の原因がある場合）。 - 独立でも、条件付き独立とは限らない（共通の結果を条件にした場合）。 数式の読み解き - ：「共通の原因」や「グループ」を表すことが多い事象です。 - ： の中だけを全体とみなした確率。条件付き独立は、この新しい確率のもとでの普通の独立です。 - だけでなく のもとでも条件付き独立かどうかは、別に確かめる必要があります。 条件付き独立なのに独立でない理由は、全確率の公式で見えます。 と の両方で条件付き独立なら です。これは一般に と一致しません。 が起きたことは「 である可能性が高い」という情報を運び、その結果 の確率も変わるからです。 ベイズの逐次更新は、条件付き独立を使っています。 ＝病気、 ＝1回目・2回目の陽性として、 と のそれぞれのもとで が条件付き独立なら となり、1回目の事後確率 をそのまま新しい事前確率として使えます。 具体例 例1：2回の検査（ベイズの定理の例2の裏側） 有病率 1%、感度 99%、特異度 95% の検査を2回受けます。病気の有無を与えたもとで2回の結果は条件付き独立とします。 まず2回とも陽性の確率を全確率の公式で求めます。 1回の陽性率は なので、 です。 なので、 と は独立ではありません。実際 で、1回目が陽性だと2回目も陽性になりやすくなります。1回目の陽性が「病気らしさ」を高めるからです。 それでも事後確率は、条件付き独立のおかげで次のように計算できます。 これは1回目の事後確率 を事前確率にして更新した値（ベイズの定理の例2）と一致します。 例2：どちらのコインかわからない 公平なコイン（表 0.5）と偏ったコイン（表 0.8）から無作為に1枚選び、2回投げます。どちらのコインかを与えれば、2回の結果は条件付き独立です。しかし で、 と異なります。共通の原因（どのコインか）が隠れていると、結果どうしに相関が生まれます。 例3：独立なのに、条件付きでは独立でない 公平なコインを2回投げ、 ＝「1回目が表」、 ＝「2回目が表」は独立です。ここで ＝「2回の結果が同じ」を条件にすると、 となり、条件付き独立ではありません。 のもとでは、1回目がわかれば2回目も決まるからです。 現場での使われ方 - 医療：複数の検査を組み合わせて診断するとき、病気の有無を与えたもとで検査結果が条件付き独立と仮定して、陽性的中率を逐次更新します。同じ原理の検査どうしでは仮定が崩れやすく、事後確率を過大評価する点に注意します。 - IT・Webサービス：迷惑メールフィルタのナイーブベイズ分類器は、「迷惑メールかどうか」を与えたもとで各単語の出現が条件付き独立と仮定し、尤度を単語ごとの確率の積で計算します。 - 行政・調査：グラフィカルモデル（第25章）では、変数間の条件付き独立の関係をグラフの「辺がない」ことで表し、多数の変数の関係を整理します。 - 金融・保険：景気の状態を与えたもとで各社の倒産が条件付き独立と仮定するモデルでは、景気という共通要因を通じて倒産が同時に起こりやすくなる（相関する）ことを表現できます。 グラフ・イメージ 1回目が陽性だった人だけを集めた集団（病気の割合 ）を全体とし、2回目の検査結果で分けた面積図です。 条件付き独立なので、2回目の陽性率は病気の人で 0.99、健康な人で 0.05 のまま使えます。陽性の領域に占める病気の割合が です。 事前確率のスライダーを 0.01 に戻すと1回目の更新、0.167 にすると2回目の更新になり、同じ図で逐次更新を追えます。 試験のポイント - 定義 と、同値な形 を覚えます。 - 「条件付き独立 ⇏ 独立」「独立 ⇏ 条件付き独立」の両方向の反例（例2・例3）を説明できるようにします。 - ベイズの定理で「2回目の検査」や「追加データ」を扱う問題は、条件付き独立の仮定のもとで、前の事後確率を次の事前確率に使います。 - 確率変数版は、マルコフ連鎖のマルコフ性（現在を与えれば過去と未来は条件付き独立）、グラフィカルモデル、偏相関係数（第3章）につながります。多変量正規分布では、偏相関が0であることと条件付き独立が同値です。 よくある間違い - × 条件付き独立なら → ○ 条件を外すと独立とは限りません。例1では と で大きく違います。 - × 独立な事象は、何を条件にしても独立 → ○ 例3のように、共通の結果を条件にすると従属になることがあります。 - × のもとで条件付き独立なら のもとでも自動的に条件付き独立 → ○ 別々に確かめます（逐次更新ではどちらも必要です）。 - × 同じ人に同じ検査を繰り返せば必ず条件付き独立 → ○ 体質などで偽陽性が出やすい人は2回目も偽陽性になりやすく、仮定が崩れます。仮定が成り立つかを問題文で確認します。"},"conditional-probability":{"id":"conditional-probability","title":"条件付き確率と乗法定理","reading":"じょうけんつきかくりつとじょうほうていり","en":"Conditional probability and multiplication rule","aliases":["条件付き確率","乗法定理","乗法公式","確率の乗法定理","連鎖律"],"chapter":1,"importance":"A","tags":["条件付き確率","乗法定理","同時確率","非復元抽出"],"related":["law-of-total-probability","bayes-theorem","independence-of-events","conditional-independence","conditional-probability-function","contingency-table"],"charts":[{"type":"custom","id":"bayes-area","params":{"prior":0.4,"sensitivity":0.15,"specificity":0.95,"labelA":"スマホ","labelNotA":"PC","labelB":"購入"},"sliders":[{"param":"prior","label":"P(A)：スマホ経由の割合","min":0.01,"max":0.99,"step":0.01},{"param":"sensitivity","label":"P(B|A)：スマホでの購入率","min":0,"max":1,"step":0.01},{"param":"specificity","label":"P(Bᶜ|Aᶜ)：PCでの非購入率","min":0,"max":1,"step":0.01}],"caption":"横幅を P(A) と P(Aᶜ) で分け、縦をそれぞれの条件付き確率で分けた面積図。色付きの長方形の面積が乗法定理 P(A∩B)=P(B|A)P(A) を表す。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「ある事象 <span class=\"math-inline\">$B$<\/span> が起きたとわかったとき、別の事象 <span class=\"math-inline\">$A$<\/span> がどのくらい起こりやすいか」を表すのが条件付き確率です。\nこれを掛け算の形に書き直したものが乗法定理で、「同時に起こる確率」を順番に分解して計算するための道具です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>事象 <span class=\"math-inline\">$B$<\/span> について <span class=\"math-inline\">$P(B)&gt;0$<\/span> のとき、<span class=\"math-inline\">$B$<\/span> が起きたという条件のもとでの <span class=\"math-inline\">$A$<\/span> の<strong>条件付き確率<\/strong>を<\/p>\n<div class=\"math-display\">$$P(A \\mid B) = \\frac{P(A \\cap B)}{P(B)}$$<\/div>\n<p>と定義します。<span class=\"math-inline\">$P(B)=0$<\/span> のときは、この式では定義しません。<\/p>\n<p>両辺に <span class=\"math-inline\">$P(B)$<\/span> を掛けると<strong>乗法定理<\/strong>が得られます。<\/p>\n<div class=\"math-display\">$$P(A \\cap B) = P(A \\mid B)\\,P(B) = P(B \\mid A)\\,P(A)$$<\/div>\n<p>（右側の等号は <span class=\"math-inline\">$P(A)&gt;0$<\/span> のとき）。3つ以上の事象では、<span class=\"math-inline\">$P(A_1 \\cap \\cdots \\cap A_{n-1})&gt;0$<\/span> のもとで<\/p>\n<div class=\"math-display\">$$P(A_1 \\cap A_2 \\cap \\cdots \\cap A_n) = P(A_1)\\,P(A_2 \\mid A_1)\\,P(A_3 \\mid A_1 \\cap A_2)\\cdots P(A_n \\mid A_1 \\cap \\cdots \\cap A_{n-1})$$<\/div>\n<p>が成り立ちます（連鎖律とも呼ばれます）。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$P(A \\cap B)$<\/span>：<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B$<\/span> が同時に起こる確率（同時確率）。<\/li>\n<li><span class=\"math-inline\">$P(B)$<\/span>：条件となる事象の確率。分母に置くことで、「<span class=\"math-inline\">$B$<\/span> の中だけ」を新しい全体とみなします。<\/li>\n<li><span class=\"math-inline\">$P(A \\mid B)$<\/span>：<span class=\"math-inline\">$B$<\/span> の中で <span class=\"math-inline\">$A$<\/span> が占める割合。縦棒の右側が「わかっていること」、左側が「知りたいこと」です。<\/li>\n<\/ul>\n<p>直感的には、<strong>標本空間を <span class=\"math-inline\">$\\Omega$<\/span> から <span class=\"math-inline\">$B$<\/span> に縮める操作<\/strong>です。\n全体を <span class=\"math-inline\">$B$<\/span> に取り替え、その中で <span class=\"math-inline\">$A$<\/span> と重なる部分 <span class=\"math-inline\">$A \\cap B$<\/span> の割合を測ります。\n分母の <span class=\"math-inline\">$P(B)$<\/span> は「新しい全体の確率を1にそろえるための調整」です。<\/p>\n<p><span class=\"math-inline\">$B$<\/span> を固定すると、<span class=\"math-inline\">$P(\\cdot \\mid B)$<\/span> はそれ自体が確率の公理（非負、全体で1、排反な事象で加法的）を満たします。\nしたがって <span class=\"math-inline\">$P(A^c \\mid B) = 1 - P(A \\mid B)$<\/span> のような通常の計算規則がそのまま使えます。<\/p>\n<p>乗法定理は「順番に起こる出来事」を計算するときに威力を発揮します。\n1つ目が起きる確率に、「1つ目が起きたもとで2つ目が起きる確率」を掛け、さらに「1つ目と2つ目が起きたもとで3つ目が起きる確率」を掛けていきます。\n樹形図の枝に沿って確率を掛けていく操作そのものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：サイコロ2個（情報で確率が変わる）<\/strong><\/p>\n<p>サイコロを2個振り、目の和が10以上になる確率は、36通り中6通りなので <span class=\"math-inline\">$1/6 \\approx 0.1667$<\/span> です。\nここで「1個目が6だった」とわかったとします。残る6通りのうち、和が10以上になるのは2個目が4, 5, 6 の3通りです。<\/p>\n<div class=\"math-display\">$$P(\\text{和}\\ge 10 \\mid \\text{1個目}=6) = \\frac{3/36}{6/36} = 0.5$$<\/div>\n<p>条件が加わることで、確率が <span class=\"math-inline\">$0.1667$<\/span> から <span class=\"math-inline\">$0.5$<\/span> に上がりました。<\/p>\n<p><strong>例2：非復元抽出（乗法定理）<\/strong><\/p>\n<p>赤玉3個・白玉7個の袋から、戻さずに1個ずつ取り出します。<\/p>\n<ul>\n<li>2回続けて赤：<span class=\"math-inline\">$P = \\dfrac{3}{10} \\times \\dfrac{2}{9} = \\dfrac{1}{15} \\approx 0.0667$<\/span><\/li>\n<li>赤、赤、白の順：<span class=\"math-inline\">$P = \\dfrac{3}{10} \\times \\dfrac{2}{9} \\times \\dfrac{7}{8} = \\dfrac{7}{120} \\approx 0.0583$<\/span><\/li>\n<\/ul>\n<p>2回目以降の確率は、それまでに何を取り出したかで変わります。これを条件付き確率として掛けていくのが乗法定理です。<\/p>\n<p><strong>例3：分割表から読む（向きを取り違えない）<\/strong><\/p>\n<p>あるWebサイトの訪問者1,000人のうち、スマホ経由が400人（うち購入60人）、PC経由が600人（うち購入30人）でした。<\/p>\n<div class=\"math-display\">$$P(\\text{購入} \\mid \\text{スマホ}) = \\frac{60}{400} = 0.15, \\qquad\nP(\\text{スマホ} \\mid \\text{購入}) = \\frac{60}{90} \\approx 0.6667$$<\/div>\n<p>同じ「60人」を分子に使っていても、分母（条件）が違うので値はまったく異なります。\nなお乗法定理で確かめると、<span class=\"math-inline\">$P(\\text{購入} \\cap \\text{スマホ}) = 0.15 \\times 0.4 = 0.06$<\/span> で、<span class=\"math-inline\">$60/1000$<\/span> と一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>マーケティング<\/strong>：「広告をクリックした人のうち購入した人の割合」（コンバージョン率）は条件付き確率です。どの経路の条件付き購入率が高いかを比べて、広告費の配分を決めます。<\/li>\n<li><strong>金融・保険<\/strong>：「現在40歳の人が今後10年以内に死亡する確率」は、40歳まで生存したという条件のもとでの条件付き確率です。生命表から保険料を計算するときの基本になります。<\/li>\n<li><strong>製造・品質管理<\/strong>：複数の工程を順に通る製品が、すべての工程で合格する確率を乗法定理で計算します。前の工程の結果が後の工程に影響する場合は、条件付き確率を順に掛けます。<\/li>\n<li><strong>医療<\/strong>：「症状がある患者のうち特定の病気である割合」を診療記録から集計し、診断の参考にします。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>正方形の横幅を <span class=\"math-inline\">$A$<\/span>（スマホ）と <span class=\"math-inline\">$A^c$<\/span>（PC）の割合で分け、それぞれの縦を「購入する／しない」の条件付き確率で分けた図です。\n色付きの長方形の横 × 縦が、乗法定理 <span class=\"math-inline\">$P(A\\cap B)=P(A)P(B\\mid A)$<\/span> の面積になっていることに注目してください。\n<span class=\"math-inline\">$P(A \\mid B)$<\/span> は、「購入」の領域の中で <span class=\"math-inline\">$A$<\/span> の部分が占める割合として読み取れます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定義 <span class=\"math-inline\">$P(A\\mid B)=P(A\\cap B)/P(B)$<\/span> と、その前提 <span class=\"math-inline\">$P(B)&gt;0$<\/span> をセットで覚えます。<\/li>\n<li>非復元抽出やくじ引きの問題では、乗法定理で樹形図の枝を掛けていく計算が基本です。全確率の公式・ベイズの定理と組み合わせて出題されます。<\/li>\n<li>分割表（クロス集計表）を与えて、行方向の割合と列方向の割合のどちらを求めるのかを問う形が重要です。分母がどの合計かを必ず確認します。<\/li>\n<li>「少なくとも1つ」「Aが起きたときBが起きない」のような言い換えでは、<span class=\"math-inline\">$P(A^c\\mid B)=1-P(A\\mid B)$<\/span> が使えます。ただし <span class=\"math-inline\">$P(A\\mid B^c)=1-P(A\\mid B)$<\/span> は一般に成り立ちません。<\/li>\n<li>確率変数版の条件付き確率関数・条件付き密度（第2章）も、同じ「同時 ÷ 周辺」の形です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$P(A \\mid B) = P(B \\mid A)$<\/span> とみなす → ○ 条件と対象を入れ替えると値は一般に変わります。例3では <span class=\"math-inline\">$0.15$<\/span> と <span class=\"math-inline\">$0.6667$<\/span> です。<\/li>\n<li>× <span class=\"math-inline\">$P(A \\mid B) = P(A \\cap B)$<\/span> と考える → ○ 同時確率を <span class=\"math-inline\">$P(B)$<\/span> で割って初めて条件付き確率になります。例3では同時確率は <span class=\"math-inline\">$0.06$<\/span>、条件付き確率は <span class=\"math-inline\">$0.15$<\/span> です。<\/li>\n<li>× 非復元抽出で毎回同じ確率を掛ける（<span class=\"math-inline\">$3/10 \\times 3/10$<\/span> など） → ○ 取り出した結果によって袋の中身が変わるので、2回目は <span class=\"math-inline\">$2/9$<\/span> のように条件付き確率を使います。<\/li>\n<li>× <span class=\"math-inline\">$P(A\\mid B^c) = 1 - P(A \\mid B)$<\/span> とする → ○ 補事象をとってよいのは縦棒の左側だけです。正しくは <span class=\"math-inline\">$P(A^c\\mid B)=1-P(A\\mid B)$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「ある事象 が起きたとわかったとき、別の事象 がどのくらい起こりやすいか」を表すのが条件付き確率です。 これを掛け算の形に書き直したものが乗法定理で、「同時に起こる確率」を順番に分解して計算するための道具です。 定義・数式 事象 について のとき、 が起きたという条件のもとでの の条件付き確率を と定義します。 のときは、この式では定義しません。 両辺に を掛けると乗法定理が得られます。 （右側の等号は のとき）。3つ以上の事象では、 のもとで が成り立ちます（連鎖律とも呼ばれます）。 数式の読み解き - ： と が同時に起こる確率（同時確率）。 - ：条件となる事象の確率。分母に置くことで、「 の中だけ」を新しい全体とみなします。 - ： の中で が占める割合。縦棒の右側が「わかっていること」、左側が「知りたいこと」です。 直感的には、標本空間を から に縮める操作です。 全体を に取り替え、その中で と重なる部分 の割合を測ります。 分母の は「新しい全体の確率を1にそろえるための調整」です。 を固定すると、 はそれ自体が確率の公理（非負、全体で1、排反な事象で加法的）を満たします。 したがって のような通常の計算規則がそのまま使えます。 乗法定理は「順番に起こる出来事」を計算するときに威力を発揮します。 1つ目が起きる確率に、「1つ目が起きたもとで2つ目が起きる確率」を掛け、さらに「1つ目と2つ目が起きたもとで3つ目が起きる確率」を掛けていきます。 樹形図の枝に沿って確率を掛けていく操作そのものです。 具体例 例1：サイコロ2個（情報で確率が変わる） サイコロを2個振り、目の和が10以上になる確率は、36通り中6通りなので です。 ここで「1個目が6だった」とわかったとします。残る6通りのうち、和が10以上になるのは2個目が4, 5, 6 の3通りです。 条件が加わることで、確率が から に上がりました。 例2：非復元抽出（乗法定理） 赤玉3個・白玉7個の袋から、戻さずに1個ずつ取り出します。 - 2回続けて赤： - 赤、赤、白の順： 2回目以降の確率は、それまでに何を取り出したかで変わります。これを条件付き確率として掛けていくのが乗法定理です。 例3：分割表から読む（向きを取り違えない） あるWebサイトの訪問者1,000人のうち、スマホ経由が400人（うち購入60人）、PC経由が600人（うち購入30人）でした。 同じ「60人」を分子に使っていても、分母（条件）が違うので値はまったく異なります。 なお乗法定理で確かめると、 で、 と一致します。 現場での使われ方 - マーケティング：「広告をクリックした人のうち購入した人の割合」（コンバージョン率）は条件付き確率です。どの経路の条件付き購入率が高いかを比べて、広告費の配分を決めます。 - 金融・保険：「現在40歳の人が今後10年以内に死亡する確率」は、40歳まで生存したという条件のもとでの条件付き確率です。生命表から保険料を計算するときの基本になります。 - 製造・品質管理：複数の工程を順に通る製品が、すべての工程で合格する確率を乗法定理で計算します。前の工程の結果が後の工程に影響する場合は、条件付き確率を順に掛けます。 - 医療：「症状がある患者のうち特定の病気である割合」を診療記録から集計し、診断の参考にします。 グラフ・イメージ 正方形の横幅を （スマホ）と （PC）の割合で分け、それぞれの縦を「購入する／しない」の条件付き確率で分けた図です。 色付きの長方形の横 × 縦が、乗法定理 の面積になっていることに注目してください。 は、「購入」の領域の中で の部分が占める割合として読み取れます。 試験のポイント - 定義 と、その前提 をセットで覚えます。 - 非復元抽出やくじ引きの問題では、乗法定理で樹形図の枝を掛けていく計算が基本です。全確率の公式・ベイズの定理と組み合わせて出題されます。 - 分割表（クロス集計表）を与えて、行方向の割合と列方向の割合のどちらを求めるのかを問う形が重要です。分母がどの合計かを必ず確認します。 - 「少なくとも1つ」「Aが起きたときBが起きない」のような言い換えでは、 が使えます。ただし は一般に成り立ちません。 - 確率変数版の条件付き確率関数・条件付き密度（第2章）も、同じ「同時 ÷ 周辺」の形です。 よくある間違い - × とみなす → ○ 条件と対象を入れ替えると値は一般に変わります。例3では と です。 - × と考える → ○ 同時確率を で割って初めて条件付き確率になります。例3では同時確率は 、条件付き確率は です。 - × 非復元抽出で毎回同じ確率を掛ける（ など） → ○ 取り出した結果によって袋の中身が変わるので、2回目は のように条件付き確率を使います。 - × とする → ○ 補事象をとってよいのは縦棒の左側だけです。正しくは です。"},"independence-of-events":{"id":"independence-of-events","title":"事象の独立","reading":"じしょうのどくりつ","en":"Independence of events","aliases":["独立","独立性","相互独立","対ごとの独立","互いに独立"],"chapter":1,"importance":"A","tags":["独立","条件付き確率","乗法定理","排反"],"related":["conditional-probability","conditional-independence","law-of-total-probability","bayes-theorem","independence-test","contingency-table"],"charts":[{"type":"custom","id":"bayes-area","params":{"prior":0.3,"sensitivity":0.4,"specificity":0.6,"labelA":"A","labelNotA":"Aᶜ","labelB":"B"},"sliders":[{"param":"prior","label":"P(A)","min":0.01,"max":0.99,"step":0.01},{"param":"sensitivity","label":"P(B|A)","min":0,"max":1,"step":0.01},{"param":"specificity","label":"P(Bᶜ|Aᶜ)","min":0,"max":1,"step":0.01}],"caption":"左右の列で色付き部分の高さ P(B|A) と P(B|Aᶜ)=1−P(Bᶜ|Aᶜ) がそろうとき、A と B は独立。初期値は 0.4 と 0.4 でそろっている。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>一方の事象が起きたかどうかを知っても、もう一方の起こりやすさがまったく変わらないとき、2つの事象は独立であるといいます。\n独立なら、「同時に起こる確率」は個々の確率の掛け算で求められます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>2つの事象 <span class=\"math-inline\">$A, B$<\/span> が<strong>独立<\/strong>であるとは、<\/p>\n<div class=\"math-display\">$$P(A \\cap B) = P(A)\\,P(B)$$<\/div>\n<p>が成り立つことです。<span class=\"math-inline\">$P(B)&gt;0$<\/span> なら、これは <span class=\"math-inline\">$P(A \\mid B) = P(A)$<\/span> と同値です。\n定義を掛け算の形にしておくと、<span class=\"math-inline\">$P(B)=0$<\/span> の場合も含められます。<\/p>\n<p>3つの事象 <span class=\"math-inline\">$A, B, C$<\/span> が<strong>（相互に）独立<\/strong>であるとは、次の4つがすべて成り立つことです。<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nP(A\\cap B) &amp;= P(A)P(B), \\quad P(A\\cap C) = P(A)P(C), \\quad P(B\\cap C) = P(B)P(C),\\\\\nP(A\\cap B\\cap C) &amp;= P(A)P(B)P(C)\n\\end{aligned}$$<\/div>\n<p>一般に <span class=\"math-inline\">$n$<\/span> 個の事象 <span class=\"math-inline\">$A_1,\\dots,A_n$<\/span> が独立とは、添字の任意の部分集合 <span class=\"math-inline\">$\\{i_1,\\dots,i_m\\}$<\/span>（<span class=\"math-inline\">$2\\le m\\le n$<\/span>）について<\/p>\n<div class=\"math-display\">$$P(A_{i_1}\\cap\\cdots\\cap A_{i_m}) = P(A_{i_1})\\cdots P(A_{i_m})$$<\/div>\n<p>が成り立つことです（条件は <span class=\"math-inline\">$2^n - n - 1$<\/span> 本）。最初の3本（2つずつの式）だけが成り立つ場合は<strong>対ごとに独立<\/strong>といい、相互独立より弱い条件です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$P(A\\mid B)=P(A)$<\/span>：<span class=\"math-inline\">$B$<\/span> が起きたと知っても <span class=\"math-inline\">$A$<\/span> の確率が変わらない、という「情報が役に立たない」状態です。<\/li>\n<li><span class=\"math-inline\">$P(A\\cap B)=P(A)P(B)$<\/span>：乗法定理 <span class=\"math-inline\">$P(A\\cap B)=P(A\\mid B)P(B)$<\/span> で <span class=\"math-inline\">$P(A\\mid B)$<\/span> を <span class=\"math-inline\">$P(A)$<\/span> に置き換えた形です。<\/li>\n<li>対称性：定義が <span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B$<\/span> について対称なので、<span class=\"math-inline\">$A$<\/span> が <span class=\"math-inline\">$B$<\/span> と独立なら <span class=\"math-inline\">$B$<\/span> も <span class=\"math-inline\">$A$<\/span> と独立です。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$A, B$<\/span> が独立なら、<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B^c$<\/span>、<span class=\"math-inline\">$A^c$<\/span> と <span class=\"math-inline\">$B$<\/span>、<span class=\"math-inline\">$A^c$<\/span> と <span class=\"math-inline\">$B^c$<\/span> もそれぞれ独立です。\nたとえば<\/p>\n<div class=\"math-display\">$$P(A\\cap B^c) = P(A) - P(A\\cap B) = P(A) - P(A)P(B) = P(A)\\{1-P(B)\\} = P(A)P(B^c)$$<\/div>\n<p>と確かめられます。<\/p>\n<p>独立は「確率の値」で決まる性質です。物理的に無関係に見えるかどうかではなく、数式が成り立つかどうかで判定します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：サイコロ2個で独立を判定する<\/strong><\/p>\n<p>サイコロを2個振り、<span class=\"math-inline\">$A$<\/span>＝「1個目が偶数」、<span class=\"math-inline\">$B$<\/span>＝「目の和が7」、<span class=\"math-inline\">$C$<\/span>＝「目の和が8」とします。<\/p>\n<ul>\n<li><span class=\"math-inline\">$P(A)=1/2$<\/span>、<span class=\"math-inline\">$P(B)=6/36=1/6$<\/span>、<span class=\"math-inline\">$A\\cap B$<\/span> は (2,5), (4,3), (6,1) の3通りで <span class=\"math-inline\">$P(A\\cap B)=3/36=1/12$<\/span>。<span class=\"math-inline\">$P(A)P(B)=1/12$<\/span> と一致するので、<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B$<\/span> は<strong>独立<\/strong>です。<\/li>\n<li><span class=\"math-inline\">$P(C)=5/36$<\/span>、<span class=\"math-inline\">$A\\cap C$<\/span> は (2,6), (4,4), (6,2) の3通りで <span class=\"math-inline\">$P(A\\cap C)=3/36\\approx 0.0833$<\/span>。<span class=\"math-inline\">$P(A)P(C)=5/72\\approx 0.0694$<\/span> と一致しないので、<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$C$<\/span> は<strong>独立ではありません<\/strong>。<\/li>\n<\/ul>\n<p>似た事象でも、数えてみないと独立かどうかはわかりません。<\/p>\n<p><strong>例2：対ごとに独立だが、相互独立ではない<\/strong><\/p>\n<p>公平なコインを2回投げ、<span class=\"math-inline\">$A$<\/span>＝「1回目が表」、<span class=\"math-inline\">$B$<\/span>＝「2回目が表」、<span class=\"math-inline\">$C$<\/span>＝「2回の結果が同じ」とします。どれも確率は <span class=\"math-inline\">$1/2$<\/span> です。<\/p>\n<ul>\n<li><span class=\"math-inline\">$P(A\\cap B)=P(\\text{表表})=1/4$<\/span>、<span class=\"math-inline\">$P(A\\cap C)=P(\\text{表表})=1/4$<\/span>、<span class=\"math-inline\">$P(B\\cap C)=P(\\text{表表})=1/4$<\/span>。どれも <span class=\"math-inline\">$1/2\\times1/2$<\/span> に等しく、対ごとに独立です。<\/li>\n<li>しかし <span class=\"math-inline\">$P(A\\cap B\\cap C)=P(\\text{表表})=1/4$<\/span> で、<span class=\"math-inline\">$P(A)P(B)P(C)=1/8$<\/span> と一致しません。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B$<\/span> がわかれば <span class=\"math-inline\">$C$<\/span> は完全に決まるので、3つは相互独立ではありません。<\/p>\n<p><strong>例3：システムの信頼性<\/strong><\/p>\n<p>正常に動く確率が 0.9 の部品3個が、互いに独立に故障するとします。<\/p>\n<ul>\n<li>直列（全部動けば動く）：<span class=\"math-inline\">$0.9^3 = 0.729$<\/span><\/li>\n<li>並列（1つでも動けば動く）：<span class=\"math-inline\">$1-(1-0.9)^3 = 1-0.001 = 0.999$<\/span><\/li>\n<\/ul>\n<p>「少なくとも1つ」は余事象で計算します。たとえばサイコロを4回振って少なくとも1回6が出る確率は <span class=\"math-inline\">$1-(5/6)^4 \\approx 0.5177$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：部品の故障が独立と仮定して、直列・並列システム全体の信頼度を計算します。予備の部品をいくつ並列にすれば目標の信頼度に届くかを決めます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：複数のサーバーに冗長化したとき、全台が同時に止まる確率を独立の仮定で見積もります。ただし同じ電源や同じ不具合を共有すると独立が崩れるため、仮定の妥当性も検討します。<\/li>\n<li><strong>医療<\/strong>：2つの危険因子（喫煙と高血圧など）が独立に分布しているかを、分割表と独立性の検定（第12章・第28章）で調べます。<\/li>\n<li><strong>行政・調査<\/strong>：性別と回答傾向などが独立かどうかを確かめ、独立でなければ層別の集計や分析を行います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>横幅を <span class=\"math-inline\">$P(A)$<\/span> と <span class=\"math-inline\">$P(A^c)$<\/span> で分け、左右それぞれの列で <span class=\"math-inline\">$B$<\/span> になる部分を色付きにした面積図です。\n左列の高さ <span class=\"math-inline\">$P(B\\mid A)$<\/span> と右列の高さ <span class=\"math-inline\">$P(B\\mid A^c)$<\/span> が等しいとき、色付きの帯が一直線にそろい、<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$B$<\/span> は独立です。\nスライダーで片方の高さだけを変えると帯に段差ができ、<span class=\"math-inline\">$A$<\/span> が起きたかどうかで <span class=\"math-inline\">$B$<\/span> の起こりやすさが変わる（独立でない）様子が見えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定義 <span class=\"math-inline\">$P(A\\cap B)=P(A)P(B)$<\/span> を実際に数えて確かめる問題が基本です。サイコロ・カードなどで判定させる形が典型です。<\/li>\n<li>3つ以上の事象では、対ごとの独立と相互独立の違いが重要です。例2のような反例を1つ覚えておくと判断が速くなります。<\/li>\n<li>独立なら補事象どうしも独立です。「少なくとも1回」は <span class=\"math-inline\">$1-\\prod_i P(A_i^c)$<\/span> で計算します。<\/li>\n<li>確率変数の独立（<span class=\"math-inline\">$f(x,y)=f_X(x)f_Y(y)$<\/span>）や、分割表の独立性の検定も、同じ「同時 ＝ 周辺の積」の考え方です。<\/li>\n<li>独立なら共分散は0ですが、共分散が0でも独立とは限りません（第3章）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 排反なら独立 → ○ <span class=\"math-inline\">$P(A)&gt;0,\\ P(B)&gt;0$<\/span> で排反なら <span class=\"math-inline\">$P(A\\cap B)=0\\ne P(A)P(B)$<\/span> なので、むしろ<strong>独立ではありません<\/strong>。一方が起きれば他方は起きないとわかるからです。<\/li>\n<li>× 2つずつ独立なら3つでも独立 → ○ 例2のように、3つの積の式が別に必要です。<\/li>\n<li>× 「見た目に無関係そう」だから独立 → ○ 例1の <span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$C$<\/span> のように、確率を計算すると独立でないことがあります。必ず定義式で確かめます。<\/li>\n<li>× 独立なら条件付き独立 → ○ 独立な2事象も、第3の事象を条件にすると独立でなくなることがあります（「条件付き独立」を参照）。<\/li>\n<\/ul><\/section>","text":"一言でいうと 一方の事象が起きたかどうかを知っても、もう一方の起こりやすさがまったく変わらないとき、2つの事象は独立であるといいます。 独立なら、「同時に起こる確率」は個々の確率の掛け算で求められます。 定義・数式 2つの事象 が独立であるとは、 が成り立つことです。 なら、これは と同値です。 定義を掛け算の形にしておくと、 の場合も含められます。 3つの事象 が（相互に）独立であるとは、次の4つがすべて成り立つことです。 一般に 個の事象 が独立とは、添字の任意の部分集合 （ ）について が成り立つことです（条件は 本）。最初の3本（2つずつの式）だけが成り立つ場合は対ごとに独立といい、相互独立より弱い条件です。 数式の読み解き - ： が起きたと知っても の確率が変わらない、という「情報が役に立たない」状態です。 - ：乗法定理 で を に置き換えた形です。 - 対称性：定義が と について対称なので、 が と独立なら も と独立です。 が独立なら、 と 、 と 、 と もそれぞれ独立です。 たとえば と確かめられます。 独立は「確率の値」で決まる性質です。物理的に無関係に見えるかどうかではなく、数式が成り立つかどうかで判定します。 具体例 例1：サイコロ2個で独立を判定する サイコロを2個振り、 ＝「1個目が偶数」、 ＝「目の和が7」、 ＝「目の和が8」とします。 - 、 、 は (2,5), (4,3), (6,1) の3通りで 。 と一致するので、 と は独立です。 - 、 は (2,6), (4,4), (6,2) の3通りで 。 と一致しないので、 と は独立ではありません。 似た事象でも、数えてみないと独立かどうかはわかりません。 例2：対ごとに独立だが、相互独立ではない 公平なコインを2回投げ、 ＝「1回目が表」、 ＝「2回目が表」、 ＝「2回の結果が同じ」とします。どれも確率は です。 - 、 、 。どれも に等しく、対ごとに独立です。 - しかし で、 と一致しません。 と がわかれば は完全に決まるので、3つは相互独立ではありません。 例3：システムの信頼性 正常に動く確率が 0.9 の部品3個が、互いに独立に故障するとします。 - 直列（全部動けば動く）： - 並列（1つでも動けば動く）： 「少なくとも1つ」は余事象で計算します。たとえばサイコロを4回振って少なくとも1回6が出る確率は です。 現場での使われ方 - 製造・品質管理：部品の故障が独立と仮定して、直列・並列システム全体の信頼度を計算します。予備の部品をいくつ並列にすれば目標の信頼度に届くかを決めます。 - IT・Webサービス：複数のサーバーに冗長化したとき、全台が同時に止まる確率を独立の仮定で見積もります。ただし同じ電源や同じ不具合を共有すると独立が崩れるため、仮定の妥当性も検討します。 - 医療：2つの危険因子（喫煙と高血圧など）が独立に分布しているかを、分割表と独立性の検定（第12章・第28章）で調べます。 - 行政・調査：性別と回答傾向などが独立かどうかを確かめ、独立でなければ層別の集計や分析を行います。 グラフ・イメージ 横幅を と で分け、左右それぞれの列で になる部分を色付きにした面積図です。 左列の高さ と右列の高さ が等しいとき、色付きの帯が一直線にそろい、 と は独立です。 スライダーで片方の高さだけを変えると帯に段差ができ、 が起きたかどうかで の起こりやすさが変わる（独立でない）様子が見えます。 試験のポイント - 定義 を実際に数えて確かめる問題が基本です。サイコロ・カードなどで判定させる形が典型です。 - 3つ以上の事象では、対ごとの独立と相互独立の違いが重要です。例2のような反例を1つ覚えておくと判断が速くなります。 - 独立なら補事象どうしも独立です。「少なくとも1回」は で計算します。 - 確率変数の独立（ ）や、分割表の独立性の検定も、同じ「同時 ＝ 周辺の積」の考え方です。 - 独立なら共分散は0ですが、共分散が0でも独立とは限りません（第3章）。 よくある間違い - × 排反なら独立 → ○ で排反なら なので、むしろ独立ではありません。一方が起きれば他方は起きないとわかるからです。 - × 2つずつ独立なら3つでも独立 → ○ 例2のように、3つの積の式が別に必要です。 - × 「見た目に無関係そう」だから独立 → ○ 例1の と のように、確率を計算すると独立でないことがあります。必ず定義式で確かめます。 - × 独立なら条件付き独立 → ○ 独立な2事象も、第3の事象を条件にすると独立でなくなることがあります（「条件付き独立」を参照）。"},"law-of-total-probability":{"id":"law-of-total-probability","title":"全確率の公式","reading":"ぜんかくりつのこうしき","en":"Law of total probability","aliases":["全確率の定理","全確率の法則"],"chapter":1,"importance":"B","tags":["条件付き確率","標本空間の分割","場合分け"],"related":["conditional-probability","bayes-theorem","conditional-independence","conditional-expectation","marginal-distribution"],"charts":[{"type":"custom","id":"bayes-area","params":{"prior":0.5,"sensitivity":0.64,"specificity":0.75,"labelA":"偏ったコイン","labelNotA":"公平なコイン","labelB":"2回表"},"sliders":[{"param":"prior","label":"P(A)：偏ったコインを選ぶ確率","min":0,"max":1,"step":0.01},{"param":"sensitivity","label":"P(B|A)：偏ったコインで2回表","min":0,"max":1,"step":0.01},{"param":"specificity","label":"P(Bᶜ|Aᶜ)：公平なコインで2回表にならない","min":0,"max":1,"step":0.01}],"caption":"横幅を「どちらのコインか」で分け、縦を「2回とも表か」で分けた面積図。色付き部分の面積の合計が全確率の公式で求める P(B) になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>ある事象の確率を、「原因」ごとに場合分けして足し合わせて求める公式です。\n直接は計算しにくい確率も、原因がわかっているときの条件付き確率なら計算しやすい、という発想に基づいています。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>事象 <span class=\"math-inline\">$A_1, A_2, \\dots, A_k$<\/span> が<strong>標本空間の分割<\/strong>であるとします。すなわち<\/p>\n<ul>\n<li>互いに排反：<span class=\"math-inline\">$i\\ne j$<\/span> なら <span class=\"math-inline\">$A_i \\cap A_j = \\varnothing$<\/span><\/li>\n<li>和が全体：<span class=\"math-inline\">$A_1 \\cup \\cdots \\cup A_k = \\Omega$<\/span><\/li>\n<li>各 <span class=\"math-inline\">$P(A_i) &gt; 0$<\/span><\/li>\n<\/ul>\n<p>のとき、任意の事象 <span class=\"math-inline\">$B$<\/span> について<\/p>\n<div class=\"math-display\">$$P(B) = \\sum_{i=1}^{k} P(B \\mid A_i)\\,P(A_i)$$<\/div>\n<p>が成り立ちます。分割は可算無限個 <span class=\"math-inline\">$A_1, A_2, \\dots$<\/span> でもかまいません。<\/p>\n<p>条件付き確率に対しても同じ形が成り立ちます。<span class=\"math-inline\">$P(C)&gt;0$<\/span> かつ各 <span class=\"math-inline\">$P(A_i\\cap C)&gt;0$<\/span> なら<\/p>\n<div class=\"math-display\">$$P(B \\mid C) = \\sum_{i=1}^{k} P(B \\mid A_i \\cap C)\\,P(A_i \\mid C)$$<\/div>\n<p>です。期待値版（繰り返し期待値の法則）は <span class=\"math-inline\">$E[X] = \\sum_i E[X \\mid A_i]\\,P(A_i)$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$A_i$<\/span>：「原因」や「グループ」。どれか1つだけが必ず起こります。<\/li>\n<li><span class=\"math-inline\">$P(A_i)$<\/span>：各原因の割合（重み）。<\/li>\n<li><span class=\"math-inline\">$P(B \\mid A_i)$<\/span>：原因 <span class=\"math-inline\">$A_i$<\/span> のもとで <span class=\"math-inline\">$B$<\/span> が起こる確率。<\/li>\n<li>全体は、条件付き確率 <span class=\"math-inline\">$P(B\\mid A_i)$<\/span> を重み <span class=\"math-inline\">$P(A_i)$<\/span> で平均した<strong>加重平均<\/strong>になっています。<\/li>\n<\/ul>\n<p>導出は2段階です。まず <span class=\"math-inline\">$B$<\/span> を分割に沿って切り分けます。<\/p>\n<div class=\"math-display\">$$B = (B \\cap A_1) \\cup (B \\cap A_2) \\cup \\cdots \\cup (B \\cap A_k)$$<\/div>\n<p>右辺の各部分は互いに排反なので、確率は足し算になります。最後に各項を乗法定理 <span class=\"math-inline\">$P(B \\cap A_i) = P(B\\mid A_i)P(A_i)$<\/span> で書き換えれば完成です。<\/p>\n<p>樹形図で言えば、「<span class=\"math-inline\">$B$<\/span> に到達する枝の確率をすべて足す」操作です。\nまた、加重平均なので、<span class=\"math-inline\">$P(B)$<\/span> は必ず <span class=\"math-inline\">$\\min_i P(B\\mid A_i)$<\/span> と <span class=\"math-inline\">$\\max_i P(B\\mid A_i)$<\/span> の間に入ります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：自動車保険の事故率<\/strong><\/p>\n<p>契約者を運転リスクで3群に分けます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>群<\/th>\n<th>割合 <span class=\"math-inline\">$P(A_i)$<\/span><\/th>\n<th>1年の事故率 <span class=\"math-inline\">$P(B\\mid A_i)$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>低リスク<\/td>\n<td>0.6<\/td>\n<td>0.01<\/td>\n<\/tr>\n<tr>\n<td>中リスク<\/td>\n<td>0.3<\/td>\n<td>0.03<\/td>\n<\/tr>\n<tr>\n<td>高リスク<\/td>\n<td>0.1<\/td>\n<td>0.10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>全体の事故率は<\/p>\n<div class=\"math-display\">$$P(B) = 0.6\\times 0.01 + 0.3\\times 0.03 + 0.1\\times 0.10 = 0.006 + 0.009 + 0.010 = 0.025$$<\/div>\n<p>です。さらに各項を <span class=\"math-inline\">$0.025$<\/span> で割ると、事故を起こした人がどの群に属するかの確率（ベイズの定理）になり、高リスク群が <span class=\"math-inline\">$0.010/0.025 = 0.40$<\/span> を占めます。人数は1割でも、事故の4割を占めます。<\/p>\n<p><strong>例2：どちらのコインかわからない<\/strong><\/p>\n<p>公平なコイン（表の確率 0.5）と偏ったコイン（表の確率 0.8）が1枚ずつあり、無作為に1枚選んで2回投げます。2回とも表になる確率は、選んだコインで場合分けして<\/p>\n<div class=\"math-display\">$$P(\\text{表表}) = 0.5 \\times 0.5^2 + 0.5 \\times 0.8^2 = 0.125 + 0.320 = 0.445$$<\/div>\n<p>です。同様に1回目が表になる確率は <span class=\"math-inline\">$0.5\\times0.5 + 0.5\\times0.8 = 0.65$<\/span> です。\n<span class=\"math-inline\">$0.65^2 \\approx 0.4225 \\ne 0.445$<\/span> なので、2回の結果は独立ではありません（詳しくは「条件付き独立」で扱います）。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：契約者をリスク区分に分け、区分ごとの事故率・死亡率を加重平均して、ポートフォリオ全体の期待支払額を見積もります。<\/li>\n<li><strong>製造・品質管理<\/strong>：複数の工場やラインから部品を仕入れるとき、各供給元の割合と不良率から、受け入れ全体の不良率を計算します。<\/li>\n<li><strong>行政・調査<\/strong>：層別抽出の調査で、地域や年代ごとの割合（層の重み）と層ごとの回答割合から、全体の割合を推定します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>横幅を「どちらのコインを選んだか」の確率で分け、それぞれの縦を「2回とも表になる確率」で塗った面積図です。\n色付きの2つの長方形の面積を足したものが <span class=\"math-inline\">$P(B)$<\/span> です。<span class=\"math-inline\">$P(A)$<\/span> のスライダーを動かすと、<span class=\"math-inline\">$P(B)$<\/span> が2つの条件付き確率の間を直線的に動くこと（加重平均であること）が確認できます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>ベイズの定理の分母として必ず使います。「全確率の公式で分母、該当する1項を分子」という手順を体に覚えさせます。<\/li>\n<li>分割の条件（排反で、和が全体）を満たしているかを確認します。満たさない場合は重複や漏れが生じます。<\/li>\n<li>期待値・分散版も重要です。<span class=\"math-inline\">$E[X]=E[E[X\\mid Y]]$<\/span>、<span class=\"math-inline\">$V[X]=E[V[X\\mid Y]]+V[E[X\\mid Y]]$<\/span>（第3章の条件付き期待値・条件付き分散）と同じ考え方です。<\/li>\n<li>連続な場合は <span class=\"math-inline\">$P(B)=\\int P(B\\mid Y=y)f_Y(y)\\,dy$<\/span> となり、混合分布や周辺分布の計算に使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$P(B)=\\sum_i P(B\\mid A_i)$<\/span> と重みを掛け忘れる → ○ 各条件付き確率に <span class=\"math-inline\">$P(A_i)$<\/span> を掛けてから足します。例1では重みなしだと <span class=\"math-inline\">$0.14$<\/span> になってしまいます。<\/li>\n<li>× <span class=\"math-inline\">$P(A_i\\mid B)$<\/span> を足し合わせる → ○ 足すのは <span class=\"math-inline\">$P(B\\mid A_i)P(A_i)$<\/span> です。<span class=\"math-inline\">$\\sum_i P(A_i\\mid B)$<\/span> は常に1で、<span class=\"math-inline\">$P(B)$<\/span> ではありません。<\/li>\n<li>× 排反でないグループ（例：「20代」と「学生」）で場合分けする → ○ 重なりがあると二重に数えます。分割は互いに排反で、全体を覆うものを選びます。<\/li>\n<\/ul><\/section>","text":"一言でいうと ある事象の確率を、「原因」ごとに場合分けして足し合わせて求める公式です。 直接は計算しにくい確率も、原因がわかっているときの条件付き確率なら計算しやすい、という発想に基づいています。 定義・数式 事象 が標本空間の分割であるとします。すなわち - 互いに排反： なら - 和が全体： - 各 のとき、任意の事象 について が成り立ちます。分割は可算無限個 でもかまいません。 条件付き確率に対しても同じ形が成り立ちます。 かつ各 なら です。期待値版（繰り返し期待値の法則）は です。 数式の読み解き - ：「原因」や「グループ」。どれか1つだけが必ず起こります。 - ：各原因の割合（重み）。 - ：原因 のもとで が起こる確率。 - 全体は、条件付き確率 を重み で平均した加重平均になっています。 導出は2段階です。まず を分割に沿って切り分けます。 右辺の各部分は互いに排反なので、確率は足し算になります。最後に各項を乗法定理 で書き換えれば完成です。 樹形図で言えば、「 に到達する枝の確率をすべて足す」操作です。 また、加重平均なので、 は必ず と の間に入ります。 具体例 例1：自動車保険の事故率 契約者を運転リスクで3群に分けます。 群 割合 1年の事故率 低リスク 0.6 0.01 中リスク 0.3 0.03 高リスク 0.1 0.10 全体の事故率は です。さらに各項を で割ると、事故を起こした人がどの群に属するかの確率（ベイズの定理）になり、高リスク群が を占めます。人数は1割でも、事故の4割を占めます。 例2：どちらのコインかわからない 公平なコイン（表の確率 0.5）と偏ったコイン（表の確率 0.8）が1枚ずつあり、無作為に1枚選んで2回投げます。2回とも表になる確率は、選んだコインで場合分けして です。同様に1回目が表になる確率は です。 なので、2回の結果は独立ではありません（詳しくは「条件付き独立」で扱います）。 現場での使われ方 - 金融・保険：契約者をリスク区分に分け、区分ごとの事故率・死亡率を加重平均して、ポートフォリオ全体の期待支払額を見積もります。 - 製造・品質管理：複数の工場やラインから部品を仕入れるとき、各供給元の割合と不良率から、受け入れ全体の不良率を計算します。 - 行政・調査：層別抽出の調査で、地域や年代ごとの割合（層の重み）と層ごとの回答割合から、全体の割合を推定します。 グラフ・イメージ 横幅を「どちらのコインを選んだか」の確率で分け、それぞれの縦を「2回とも表になる確率」で塗った面積図です。 色付きの2つの長方形の面積を足したものが です。 のスライダーを動かすと、 が2つの条件付き確率の間を直線的に動くこと（加重平均であること）が確認できます。 試験のポイント - ベイズの定理の分母として必ず使います。「全確率の公式で分母、該当する1項を分子」という手順を体に覚えさせます。 - 分割の条件（排反で、和が全体）を満たしているかを確認します。満たさない場合は重複や漏れが生じます。 - 期待値・分散版も重要です。 、 （第3章の条件付き期待値・条件付き分散）と同じ考え方です。 - 連続な場合は となり、混合分布や周辺分布の計算に使います。 よくある間違い - × と重みを掛け忘れる → ○ 各条件付き確率に を掛けてから足します。例1では重みなしだと になってしまいます。 - × を足し合わせる → ○ 足すのは です。 は常に1で、 ではありません。 - × 排反でないグループ（例：「20代」と「学生」）で場合分けする → ○ 重なりがあると二重に数えます。分割は互いに排反で、全体を覆うものを選びます。"},"conditional-probability-density-function":{"id":"conditional-probability-density-function","title":"条件付き確率密度関数","reading":"じょうけんつきかくりつみつどかんすう","en":"Conditional probability density function","aliases":["条件付き密度関数"],"chapter":2,"importance":"A","tags":["多変量","連続型","条件付き分布","条件付き期待値","2変量正規分布"],"related":["joint-probability-density-function","marginal-probability-density-function","conditional-probability-function","conditional-expectation","conditional-variance","bivariate-normal-distribution"],"charts":[{"type":"pdf","dist":"norm","params":{"mu":64.8,"sigma":6.4},"sliders":[{"param":"mu","label":"条件付き平均","min":50,"max":75,"step":0.4},{"param":"sigma","label":"条件付き標準偏差","min":2,"max":10,"step":0.2}],"x":{"min":30,"max":95},"compare":[{"dist":"norm","params":{"mu":60,"sigma":8},"label":"周辺分布 N(60, 8²)"}],"caption":"実線は身長176cmの人の体重の条件付き密度、破線は全体の体重の周辺密度。条件を付けると中心がずれ、幅が狭くなる。"},{"type":"scatter","model":"bvnorm","params":{"rho":0.6,"n":500},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"x をある値に固定して縦に細く切った帯の中の点の分布が、条件付き分布。|ρ| が大きいほど帯の中の点の散らばりが小さい。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>一方の連続型確率変数の値がわかったときの、もう一方の変数の密度です。\n同時密度の「切り口」を、面積が1になるように割り直したものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>連続型確率変数 <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率密度関数を <span class=\"math-inline\">$f(x,y)$<\/span>、<span class=\"math-inline\">$X$<\/span> の周辺確率密度関数を <span class=\"math-inline\">$f_X(x)$<\/span> とします。\n<span class=\"math-inline\">$f_X(x)&gt;0$<\/span> である <span class=\"math-inline\">$x$<\/span> について、<span class=\"math-inline\">$X=x$<\/span> が与えられたときの <span class=\"math-inline\">$Y$<\/span> の条件付き確率密度関数は<\/p>\n<div class=\"math-display\">$$f(y\\mid x) = \\frac{f(x,y)}{f_X(x)}$$<\/div>\n<p>です。<span class=\"math-inline\">$x$<\/span> を固定すると <span class=\"math-inline\">$y$<\/span> の密度になり、<span class=\"math-inline\">$\\int f(y\\mid x)\\,dy=1$<\/span> を満たします。<\/p>\n<p>条件付き確率・条件付き期待値は、この密度で計算します。<\/p>\n<div class=\"math-display\">$$P(Y\\in B\\mid X=x) = \\int_B f(y\\mid x)\\,dy,\\qquad E[Y\\mid X=x] = \\int_{-\\infty}^{\\infty} y\\,f(y\\mid x)\\,dy$$<\/div>\n<p>同時密度は <span class=\"math-inline\">$f(x,y)=f(y\\mid x)f_X(x)=f(x\\mid y)f_Y(y)$<\/span> と分解できます。\n<span class=\"math-inline\">$X,Y$<\/span> が独立であることは、<span class=\"math-inline\">$f(y\\mid x)=f_Y(y)$<\/span> がすべての <span class=\"math-inline\">$x$<\/span> で成り立つことと同じです。<\/p>\n<p><strong>2変量正規分布の条件付き分布<\/strong>（重要）：<span class=\"math-inline\">$(X,Y)$<\/span> が平均 <span class=\"math-inline\">$\\mu_X,\\mu_Y$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma_X,\\sigma_Y$<\/span>、相関係数 <span class=\"math-inline\">$\\rho$<\/span> の2変量正規分布に従うとき、<\/p>\n<div class=\"math-display\">$$Y\\mid X=x \\ \\sim\\ N\\left(\\mu_Y + \\rho\\frac{\\sigma_Y}{\\sigma_X}(x-\\mu_X),\\ \\ \\sigma_Y^2(1-\\rho^2)\\right)$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$f(x,y)$<\/span> を <span class=\"math-inline\">$x$<\/span> で固定したもの：同時密度の曲面を <span class=\"math-inline\">$x$<\/span> の位置で縦に切った切り口の曲線です。<\/li>\n<li><span class=\"math-inline\">$f_X(x)$<\/span> で割る：切り口の面積は <span class=\"math-inline\">$f_X(x)$<\/span> なので、これで割ると面積1の密度になります。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$P(X=x)=0$<\/span> なのに「<span class=\"math-inline\">$X=x$<\/span> という条件」を付けられるのは、<span class=\"math-inline\">$x\\le X\\le x+\\Delta x$<\/span> という細い帯で条件付けて <span class=\"math-inline\">$\\Delta x\\to0$<\/span> とした極限と考えるからです。<\/p>\n<div class=\"math-display\">$$P(Y\\le y\\mid x\\le X\\le x+\\Delta x) \\approx \\frac{\\int_{-\\infty}^{y} f(x,v)\\,\\Delta x\\,dv}{f_X(x)\\,\\Delta x} = \\int_{-\\infty}^{y} \\frac{f(x,v)}{f_X(x)}\\,dv$$<\/div>\n<p>2変量正規分布の結果は、平均が <span class=\"math-inline\">$x$<\/span> の1次式（回帰直線）になり、分散は <span class=\"math-inline\">$x$<\/span> によらず <span class=\"math-inline\">$1-\\rho^2$<\/span> 倍に縮む、と読めます。\n<span class=\"math-inline\">$\\rho$<\/span> が <span class=\"math-inline\">$\\pm1$<\/span> に近いほど、<span class=\"math-inline\">$x$<\/span> を知ることで <span class=\"math-inline\">$Y$<\/span> の不確かさが大きく減ります。<\/p>\n<p>分解 <span class=\"math-inline\">$f(x,y)=f(y\\mid x)f_X(x)$<\/span> を使うと、逆向きの条件付き密度も求められます。<\/p>\n<div class=\"math-display\">$$f(x\\mid y) = \\frac{f(y\\mid x)\\,f_X(x)}{\\int f(y\\mid x')\\,f_X(x')\\,dx'}$$<\/div>\n<p>これは連続型のベイズの定理で、<span class=\"math-inline\">$x$<\/span> をパラメータ、<span class=\"math-inline\">$y$<\/span> をデータと読めば事後分布の式そのものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：身長から体重を予測する<\/strong><\/p>\n<p>成人の身長 <span class=\"math-inline\">$X$<\/span>（cm）と体重 <span class=\"math-inline\">$Y$<\/span>（kg）が2変量正規分布に従い、<span class=\"math-inline\">$\\mu_X=170,\\ \\sigma_X=6,\\ \\mu_Y=60,\\ \\sigma_Y=8,\\ \\rho=0.6$<\/span> だとします。身長 176 cm の人の体重の条件付き分布は<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nE[Y\\mid X=176] &amp;= 60+0.6\\times\\tfrac{8}{6}\\times(176-170) = 64.8\\\\\nV[Y\\mid X=176] &amp;= 8^2\\times(1-0.6^2) = 40.96 = 6.4^2\n\\end{aligned}$$<\/div>\n<p>体重が 70 kg を超える確率は<\/p>\n<div class=\"math-display\">$$P(Y&gt;70\\mid X=176) = P\\left(Z&gt;\\tfrac{70-64.8}{6.4}\\right) = P(Z&gt;0.8125)\\approx 0.2083$$<\/div>\n<p>身長の情報がないときの <span class=\"math-inline\">$P(Y&gt;70)=P(Z&gt;1.25)\\approx0.1056$<\/span> のおよそ2倍です。<\/p>\n<p><strong>例2：正方形上の密度で条件付ける<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=x+y\\ (0&lt;x&lt;1,\\,0&lt;y&lt;1)$<\/span>、<span class=\"math-inline\">$f_X(x)=x+\\tfrac12$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$f(y\\mid x) = \\frac{x+y}{x+\\tfrac12}\\quad(0&lt;y&lt;1)$$<\/div>\n<p><span class=\"math-inline\">$x=\\tfrac12$<\/span> なら <span class=\"math-inline\">$f(y\\mid\\tfrac12)=y+\\tfrac12$<\/span> です。<\/p>\n<div class=\"math-display\">$$P\\left(Y\\le\\tfrac12\\ \\middle|\\ X=\\tfrac12\\right) = \\int_0^{1/2}\\left(y+\\tfrac12\\right)dy = 0.375,\\qquad\nE\\left[Y\\ \\middle|\\ X=\\tfrac12\\right] = \\int_0^1 y\\left(y+\\tfrac12\\right)dy = \\tfrac{7}{12}\\approx0.5833$$<\/div>\n<p><strong>例3：三角形の台<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=2\\ (0&lt;y&lt;x&lt;1)$<\/span>、<span class=\"math-inline\">$f_X(x)=2x$<\/span> なら <span class=\"math-inline\">$f(y\\mid x)=\\dfrac{2}{2x}=\\dfrac1x\\ (0&lt;y&lt;x)$<\/span> で、<span class=\"math-inline\">$Y\\mid X=x$<\/span> は一様分布 <span class=\"math-inline\">$U(0,x)$<\/span> です。\nしたがって <span class=\"math-inline\">$E[Y\\mid X=x]=x/2$<\/span>、全体では <span class=\"math-inline\">$E[Y]=E[X/2]=\\tfrac12\\cdot\\tfrac23=\\tfrac13$<\/span> となり、周辺密度から直接求めた値と一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：年齢や体格で条件付けた検査値の分布から「年齢別の基準範囲」を作ります。全体の分布で判定するより誤判定が減ります。<\/li>\n<li><strong>製造・品質管理<\/strong>：前工程の寸法で条件付けた後工程の寸法の分布を使い、前工程の測定値から最終製品の規格外れ確率を予測します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：滞在時間で条件付けた購入金額の分布を推定し、滞在が長い利用者向けの推薦の効果を見積もります。<\/li>\n<li><strong>金融・保険<\/strong>：ある資産が大きく下落したという条件のもとでの、別の資産の損益分布を求めてストレステストを行います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図では、条件付き密度（実線）が周辺密度（破線）より右にずれ、幅も狭くなっています。条件付き平均のスライダーを動かすと、身長の値を変えたときの体重分布の移動を再現できます。\n2つ目の散布図では、ρ を大きくすると、縦に切った帯の中の点の散らばりが小さくなります。これが条件付き分散 <span class=\"math-inline\">$\\sigma_Y^2(1-\\rho^2)$<\/span> の縮小です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>2変量正規分布の条件付き平均・条件付き分散の公式は必ず覚え、数値を代入して確率まで出せるようにします。条件付き平均の傾き <span class=\"math-inline\">$\\rho\\sigma_Y/\\sigma_X$<\/span> は回帰係数です。<\/li>\n<li>「<span class=\"math-inline\">$X$<\/span> の分布と、<span class=\"math-inline\">$X$<\/span> が与えられたときの <span class=\"math-inline\">$Y$<\/span> の条件付き分布」から同時密度を作り、周辺化して <span class=\"math-inline\">$Y$<\/span> の分布や期待値を求める階層型の問題は重要です。<\/li>\n<li><span class=\"math-inline\">$E[Y]=E[E[Y\\mid X]]$<\/span>、<span class=\"math-inline\">$V[Y]=E[V[Y\\mid X]]+V[E[Y\\mid X]]$<\/span> を使うと、<span class=\"math-inline\">$Y$<\/span> の周辺密度を求めずに期待値・分散が出せます。<\/li>\n<li>条件付き密度の台（例3の <span class=\"math-inline\">$0&lt;y&lt;x$<\/span>）を書き忘れないようにします。<\/li>\n<li>例：<span class=\"math-inline\">$X\\sim U(0,1)$<\/span>、<span class=\"math-inline\">$Y\\mid X=x\\sim U(0,x)$<\/span> なら、同時密度は <span class=\"math-inline\">$1/x\\ (0&lt;y&lt;x&lt;1)$<\/span>、<span class=\"math-inline\">$Y$<\/span> の周辺密度は <span class=\"math-inline\">$-\\log y$<\/span>、<span class=\"math-inline\">$E[Y]=E[X]/2=0.25$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$f(y\\mid x)$<\/span> を求めるとき <span class=\"math-inline\">$f_Y(y)$<\/span> で割る → ○ 条件側の変数 <span class=\"math-inline\">$X$<\/span> の周辺密度 <span class=\"math-inline\">$f_X(x)$<\/span> で割ります。<\/li>\n<li>× 2変量正規分布の条件付き分散を <span class=\"math-inline\">$\\sigma_Y^2\\rho^2$<\/span> とする → ○ <span class=\"math-inline\">$\\sigma_Y^2(1-\\rho^2)$<\/span> です。相関が強いほど小さくなります。<\/li>\n<li>× <span class=\"math-inline\">$f(y\\mid x)$<\/span> の積分範囲をいつも周辺の台全体にする → ○ 例3のように、条件付き密度の台は <span class=\"math-inline\">$x$<\/span> に依存することがあります。<\/li>\n<li>× 条件付き分散が <span class=\"math-inline\">$x$<\/span> によって変わると思う → ○ 2変量正規分布では <span class=\"math-inlin
