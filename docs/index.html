ass=\"math-inline\">$Y$<\/span> が <span class=\"math-inline\">$y$<\/span> になるのは、<span class=\"math-inline\">$X$<\/span> がどの値のときか」を逆算したもの。<\/li>\n<li><span class=\"math-inline\">$|dx/dy|$<\/span>：<span class=\"math-inline\">$y$<\/span> の目盛り1単位が、<span class=\"math-inline\">$x$<\/span> の目盛りで何単位に当たるか。密度は「単位幅あたりの確率」なので、幅の換算が必要です。<\/li>\n<li>絶対値：減少関数のときは <span class=\"math-inline\">$dx/dy&lt;0$<\/span> になりますが、密度は負にできないので絶対値を取ります。<\/li>\n<li><span class=\"math-inline\">$|J|$<\/span>：<span class=\"math-inline\">$(u,v)$<\/span> 平面の小さな長方形が、<span class=\"math-inline\">$(x,y)$<\/span> 平面では面積が何倍の平行四辺形になるかを表します。<\/li>\n<\/ul>\n<p><strong>1変数の導出（累積分布関数から）<\/strong><\/p>\n<p><span class=\"math-inline\">$g$<\/span> が増加関数なら<\/p>\n<div class=\"math-display\">$$F_Y(y)=P(g(X)\\le y)=P\\bigl(X\\le g^{-1}(y)\\bigr)=F_X\\bigl(g^{-1}(y)\\bigr)$$<\/div>\n<p>です。両辺を <span class=\"math-inline\">$y$<\/span> で微分すると、合成関数の微分で <span class=\"math-inline\">$f_Y(y)=f_X(g^{-1}(y))\\cdot \\dfrac{d g^{-1}(y)}{dy}$<\/span> になります。<\/p>\n<p>減少関数なら <span class=\"math-inline\">$P(g(X)\\le y)=P(X\\ge g^{-1}(y))=1-F_X(g^{-1}(y))$<\/span> で、微分すると負号が付きます。ただし <span class=\"math-inline\">$dg^{-1}/dy&lt;0$<\/span> なので、全体は正です。2つの場合をまとめて書いたのが絶対値付きの公式です。<\/p>\n<p>迷ったら「分布関数を書いて微分する」に戻れば、単調でない場合も含めて必ず正しい答えに着きます。<\/p>\n<p><strong>2変数の考え方<\/strong><\/p>\n<p>確率は「密度 × 面積」です。<span class=\"math-inline\">$(u,v)$<\/span> 側の小さな長方形 <span class=\"math-inline\">$du\\,dv$<\/span> は、<span class=\"math-inline\">$(x,y)$<\/span> 側では面積 <span class=\"math-inline\">$|J|\\,du\\,dv$<\/span> の平行四辺形に移ります。確率が保存されるので <span class=\"math-inline\">$f_{U,V}\\,du\\,dv=f_{X,Y}\\,|J|\\,du\\,dv$<\/span> となり、公式が得られます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：一様乱数から自由度2のカイ二乗分布を作る<\/strong><\/p>\n<p><span class=\"math-inline\">$X\\sim U(0,1)$<\/span>、<span class=\"math-inline\">$Y=-2\\log X$<\/span> とします。<span class=\"math-inline\">$g(x)=-2\\log x$<\/span> は <span class=\"math-inline\">$(0,1)$<\/span> で減少関数で、像は <span class=\"math-inline\">$(0,\\infty)$<\/span> です。<\/p>\n<div class=\"math-display\">$$x = e^{-y/2},\\qquad \\frac{dx}{dy} = -\\frac{1}{2}e^{-y/2}$$<\/div>\n<p><span class=\"math-inline\">$f_X(x)=1$<\/span> なので、<\/p>\n<div class=\"math-display\">$$f_Y(y) = 1\\times\\left|-\\frac{1}{2}e^{-y/2}\\right| = \\frac{1}{2}e^{-y/2}\\quad (y&gt;0)$$<\/div>\n<p>これは平均2の指数分布で、自由度2のカイ二乗分布と同じです。たとえば <span class=\"math-inline\">$P(Y&gt;3)=e^{-1.5}\\approx 0.2231$<\/span> です。<\/p>\n<p><strong>例2：標準正規の二乗（単調でない変換）<\/strong><\/p>\n<p><span class=\"math-inline\">$Z\\sim N(0,1)$<\/span>、<span class=\"math-inline\">$Y=Z^2$<\/span> とします。<span class=\"math-inline\">$y&gt;0$<\/span> に対して解は <span class=\"math-inline\">$z=\\pm\\sqrt{y}$<\/span> の2つで、どちらも <span class=\"math-inline\">$|dz/dy|=\\dfrac{1}{2\\sqrt{y}}$<\/span> です。<\/p>\n<div class=\"math-display\">$$f_Y(y) = \\phi(\\sqrt{y})\\frac{1}{2\\sqrt{y}} + \\phi(-\\sqrt{y})\\frac{1}{2\\sqrt{y}}\n= \\frac{1}{\\sqrt{2\\pi y}}\\,e^{-y/2}\\quad (y&gt;0)$$<\/div>\n<p>自由度1のカイ二乗分布の密度です。<span class=\"math-inline\">$y=1$<\/span> では <span class=\"math-inline\">$f_Y(1)=\\dfrac{e^{-1/2}}{\\sqrt{2\\pi}}\\approx 0.2420$<\/span> になります。<\/p>\n<p><strong>例3：2変数（和と比の変換）<\/strong><\/p>\n<p><span class=\"math-inline\">$X, Y$<\/span> が独立にどちらも指数分布 <span class=\"math-inline\">$\\mathrm{Exp}(1)$<\/span> に従うとき、<span class=\"math-inline\">$U=X+Y$<\/span>、<span class=\"math-inline\">$V=X/(X+Y)$<\/span> の同時分布を求めます。<\/p>\n<p>逆変換は <span class=\"math-inline\">$x=uv,\\ y=u(1-v)$<\/span> で、<span class=\"math-inline\">$u&gt;0,\\ 0&lt;v&lt;1$<\/span> です。<\/p>\n<div class=\"math-display\">$$J=\\det\\begin{pmatrix} v &amp; u \\\\ 1-v &amp; -u \\end{pmatrix} = -uv-u(1-v) = -u,\\qquad |J|=u$$<\/div>\n<p><span class=\"math-inline\">$f_{X,Y}(x,y)=e^{-(x+y)}=e^{-u}$<\/span> なので、<\/p>\n<div class=\"math-display\">$$f_{U,V}(u,v) = e^{-u}\\cdot u = \\underbrace{u\\,e^{-u}}_{U\\text{ の密度}}\\times\\underbrace{1}_{V\\text{ の密度}}\\qquad (u&gt;0,\\ 0&lt;v&lt;1)$$<\/div>\n<p>同時密度が <span class=\"math-inline\">$u$<\/span> だけの関数と <span class=\"math-inline\">$v$<\/span> だけの関数の積に分かれたので、<span class=\"math-inline\">$U$<\/span> と <span class=\"math-inline\">$V$<\/span> は独立で、<span class=\"math-inline\">$U\\sim\\mathrm{Ga}(2,1)$<\/span>（形状2・尺度1のガンマ分布）、<span class=\"math-inline\">$V\\sim U(0,1)$<\/span> です。たとえば <span class=\"math-inline\">$P(U\\le 2)=1-3e^{-2}\\approx 0.5940$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>IT・シミュレーション<\/strong>：一様乱数を変換して、指数分布や正規分布の乱数を作ります（逆関数法、ボックス・ミュラー法）。どちらも正しさの証明は変数変換の公式です。<\/li>\n<li><strong>金融・保険<\/strong>：対数収益率を正規分布でモデル化し、価格 <span class=\"math-inline\">$e^{Z}$<\/span> の分布（対数正規分布）や、損失額を換算した後の分布を求めます。<\/li>\n<li><strong>製造・品質管理<\/strong>：寸法 <span class=\"math-inline\">$X$<\/span> の分布から、面積 <span class=\"math-inline\">$X^2$<\/span> や体積など、測定値を加工した量の分布と規格外れの確率を求めます。<\/li>\n<li><strong>統計モデル全般<\/strong>：対数変換や Box-Cox 変換をしたデータで尤度を書くとき、元のデータに対する尤度へ戻すためにヤコビアンの項を加えます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図は、正規分布 <span class=\"math-inline\">$Z$<\/span> と、それを <span class=\"math-inline\">$Y=e^Z$<\/span> と変換した対数正規分布を重ねたものです。<span class=\"math-inline\">$\\sigma$<\/span> を大きくすると、変換後の密度が左に寄り右裾が長くなります。これは <span class=\"math-inline\">$|dz/dy|=1/y$<\/span> が <span class=\"math-inline\">$y$<\/span> の小さいところで大きいからです。\n2つ目の図は、<span class=\"math-inline\">$Z^2$<\/span> の密度です。<span class=\"math-inline\">$\\pm z$<\/span> の2つの枝が足し合わさり、0 の近くに確率が集まる様子を見てください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>公式を丸暗記するより、「分布関数を書いて微分する」流れを一度は自分で導けるようにしておくと、単調でない場合にも対応できます。<\/li>\n<li>1変数では <span class=\"math-inline\">$f_X(x)$<\/span> に「<span class=\"math-inline\">$x$<\/span> を <span class=\"math-inline\">$y$<\/span> で表した式」を代入し忘れないこと、<span class=\"math-inline\">$|dx/dy|$<\/span> を掛けること、台（<span class=\"math-inline\">$y$<\/span> の範囲）を書くことの3点が採点の要です。<\/li>\n<li>2変数では、逆変換を先に求め、ヤコビ行列を「<span class=\"math-inline\">$x,y$<\/span> を <span class=\"math-inline\">$u,v$<\/span> で偏微分」して作ります。<span class=\"math-inline\">$|J|$<\/span> が出たら、同時密度が <span class=\"math-inline\">$u$<\/span> の関数 × <span class=\"math-inline\">$v$<\/span> の関数に分かれるかを確認すると、独立性まで一度に言えます。<\/li>\n<li>変換した変数を1つだけ求めたいとき（例：<span class=\"math-inline\">$X+Y$<\/span> の分布）は、補助変数（<span class=\"math-inline\">$V=X$<\/span> など）を入れて2変数の変換にし、最後に <span class=\"math-inline\">$V$<\/span> を積分して周辺化します。たたみ込みの公式はこの特別な場合です。<\/li>\n<li>典型的な組み合わせ：<span class=\"math-inline\">$-\\log U$<\/span> → 指数分布、<span class=\"math-inline\">$Z^2$<\/span> → <span class=\"math-inline\">$\\chi^2_1$<\/span>、<span class=\"math-inline\">$e^Z$<\/span> → 対数正規分布、指数分布の和と比 → ガンマ分布と一様分布、極座標変換 → ボックス・ミュラー法。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$f_Y(y)=f_X(g^{-1}(y))$<\/span> とヤコビアンを掛け忘れる → ○ 密度は単位幅あたりの確率なので、<span class=\"math-inline\">$|dx/dy|$<\/span> を必ず掛けます。確率関数（離散型）ならヤコビアンは不要です。<\/li>\n<li>× <span class=\"math-inline\">$|dy/dx|$<\/span> を掛ける → ○ 掛けるのは逆変換の微分 <span class=\"math-inline\">$|dx/dy|$<\/span> です。<span class=\"math-inline\">$|dy/dx|$<\/span> で書くなら割ります。<\/li>\n<li>× 2変数で <span class=\"math-inline\">$\\det$<\/span> の符号が負のまま使う → ○ ヤコビアンは絶対値 <span class=\"math-inline\">$|J|$<\/span> を掛けます。<\/li>\n<li>× <span class=\"math-inline\">$Y=Z^2$<\/span> で <span class=\"math-inline\">$z=\\sqrt{y}$<\/span> の枝だけを使い、密度の合計が 1/2 になる → ○ 単調でない変換では、<span class=\"math-inline\">$g(x)=y$<\/span> のすべての解の寄与を足します。<\/li>\n<\/ul><\/section>","text":"一言でいうと 確率変数 の分布がわかっているとき、 のような「作り直した変数」の分布を求めるための公式です。 密度は「目盛りの伸び縮み」の分だけ補正が必要で、その補正係数がヤコビアンです。 定義・数式 1変数（単調変換） の密度を とし、 が の台の上で狭義単調かつ微分可能、逆関数 も微分可能とします。このとき の密度は です（ は による台の像の中。それ以外では ）。 1変数（単調でない変換） の解が と複数あり、それぞれの区間で が単調なら、各枝の寄与を足します。 2変数（ヤコビ行列式） の同時密度を とし、 が1対1の変換で、逆変換 が偏微分可能とします。このとき です。 をヤコビアン（ヤコビ行列式）と呼びます。 変数でも同じ形で、 の行列式の絶対値を掛けます。 数式の読み解き - ：「 が になるのは、 がどの値のときか」を逆算したもの。 - ： の目盛り1単位が、 の目盛りで何単位に当たるか。密度は「単位幅あたりの確率」なので、幅の換算が必要です。 - 絶対値：減少関数のときは になりますが、密度は負にできないので絶対値を取ります。 - ： 平面の小さな長方形が、 平面では面積が何倍の平行四辺形になるかを表します。 1変数の導出（累積分布関数から） が増加関数なら です。両辺を で微分すると、合成関数の微分で になります。 減少関数なら で、微分すると負号が付きます。ただし なので、全体は正です。2つの場合をまとめて書いたのが絶対値付きの公式です。 迷ったら「分布関数を書いて微分する」に戻れば、単調でない場合も含めて必ず正しい答えに着きます。 2変数の考え方 確率は「密度 × 面積」です。 側の小さな長方形 は、 側では面積 の平行四辺形に移ります。確率が保存されるので となり、公式が得られます。 具体例 例1：一様乱数から自由度2のカイ二乗分布を作る 、 とします。 は で減少関数で、像は です。 なので、 これは平均2の指数分布で、自由度2のカイ二乗分布と同じです。たとえば です。 例2：標準正規の二乗（単調でない変換） 、 とします。 に対して解は の2つで、どちらも です。 自由度1のカイ二乗分布の密度です。 では になります。 例3：2変数（和と比の変換） が独立にどちらも指数分布 に従うとき、 、 の同時分布を求めます。 逆変換は で、 です。 なので、 同時密度が だけの関数と だけの関数の積に分かれたので、 と は独立で、 （形状2・尺度1のガンマ分布）、 です。たとえば です。 現場での使われ方 - IT・シミュレーション：一様乱数を変換して、指数分布や正規分布の乱数を作ります（逆関数法、ボックス・ミュラー法）。どちらも正しさの証明は変数変換の公式です。 - 金融・保険：対数収益率を正規分布でモデル化し、価格 の分布（対数正規分布）や、損失額を換算した後の分布を求めます。 - 製造・品質管理：寸法 の分布から、面積 や体積など、測定値を加工した量の分布と規格外れの確率を求めます。 - 統計モデル全般：対数変換や Box-Cox 変換をしたデータで尤度を書くとき、元のデータに対する尤度へ戻すためにヤコビアンの項を加えます。 グラフ・イメージ 1つ目の図は、正規分布 と、それを と変換した対数正規分布を重ねたものです。 を大きくすると、変換後の密度が左に寄り右裾が長くなります。これは が の小さいところで大きいからです。 2つ目の図は、 の密度です。 の2つの枝が足し合わさり、0 の近くに確率が集まる様子を見てください。 試験のポイント - 公式を丸暗記するより、「分布関数を書いて微分する」流れを一度は自分で導けるようにしておくと、単調でない場合にも対応できます。 - 1変数では に「 を で表した式」を代入し忘れないこと、 を掛けること、台（ の範囲）を書くことの3点が採点の要です。 - 2変数では、逆変換を先に求め、ヤコビ行列を「 を で偏微分」して作ります。 が出たら、同時密度が の関数 × の関数に分かれるかを確認すると、独立性まで一度に言えます。 - 変換した変数を1つだけ求めたいとき（例： の分布）は、補助変数（ など）を入れて2変数の変換にし、最後に を積分して周辺化します。たたみ込みの公式はこの特別な場合です。 - 典型的な組み合わせ： → 指数分布、 → 、 → 対数正規分布、指数分布の和と比 → ガンマ分布と一様分布、極座標変換 → ボックス・ミュラー法。 よくある間違い - × とヤコビアンを掛け忘れる → ○ 密度は単位幅あたりの確率なので、 を必ず掛けます。確率関数（離散型）ならヤコビアンは不要です。 - × を掛ける → ○ 掛けるのは逆変換の微分 です。 で書くなら割ります。 - × 2変数で の符号が負のまま使う → ○ ヤコビアンは絶対値 を掛けます。 - × で の枝だけを使い、密度の合計が 1/2 になる → ○ 単調でない変換では、 のすべての解の寄与を足します。"},"log-transformation":{"id":"log-transformation","title":"対数変換","reading":"たいすうへんかん","en":"Log transformation","aliases":["ログ変換","対数をとる"],"chapter":4,"importance":"B","tags":["データ変換","分散安定化","歪度","対数正規分布"],"related":["lognormal-distribution","box-cox-transformation","power-transformation","change-of-variables","variance-stabilizing-transform","weighted-geometric-harmonic-mean"],"charts":[{"type":"pdf","dist":"lognorm","params":{"mu":1,"sigma":0.5},"sliders":[{"param":"mu","label":"μ（log X の平均）","min":0,"max":2,"step":0.1},{"param":"sigma","label":"σ（log X の標準偏差）","min":0.1,"max":1.2,"step":0.05}],"compare":[{"dist":"norm","params":{"mu":1,"sigma":0.5},"label":"対数をとった後 log X ~ N(1, 0.5²)"}],"x":{"min":-1,"max":12},"caption":"右に裾の長い対数正規分布 X と、対数をとった log X（左右対称な正規分布）を重ねた図。σ を大きくすると元の X の歪みが強くなるが、log X は常に左右対称のまま。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>正の値をとるデータ <span class=\"math-inline\">$x$<\/span> を <span class=\"math-inline\">$\\log x$<\/span> に置き換える変換です。\n右に裾の長い分布を左右対称に近づけ、「何倍か」という掛け算の関係を「いくつ増えたか」という足し算の関係に直します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$X&gt;0$<\/span> の確率変数（またはデータ <span class=\"math-inline\">$x_1,\\dots,x_n&gt;0$<\/span>）に対して<\/p>\n<div class=\"math-display\">$$Y=\\log X$$<\/div>\n<p>とします。統計では、断りがなければ <span class=\"math-inline\">$\\log$<\/span> は自然対数（底 <span class=\"math-inline\">$e$<\/span>）です。底を10にしても <span class=\"math-inline\">$\\log_{10}x=\\log x/\\log 10$<\/span> と定数倍が変わるだけで、分布の形は変わりません。<\/p>\n<p><span class=\"math-inline\">$Y=\\log X\\sim N(\\mu,\\sigma^2)$<\/span> のとき、<span class=\"math-inline\">$X$<\/span> は<strong>対数正規分布<\/strong>に従い、変数変換の公式から<\/p>\n<div class=\"math-display\">$$f_X(x)=\\frac{1}{\\sqrt{2\\pi}\\,\\sigma x}\\exp\\!\\left\\{-\\frac{(\\log x-\\mu)^2}{2\\sigma^2}\\right\\}\\quad(x&gt;0)$$<\/div>\n<p>です。デルタ法（1次のテイラー近似）によると、<span class=\"math-inline\">$E[X]=m$<\/span>、<span class=\"math-inline\">$V[X]=s^2$<\/span> のとき<\/p>\n<div class=\"math-display\">$$V[\\log X]\\approx\\left(\\frac{1}{m}\\right)^2 s^2=\\left(\\frac{s}{m}\\right)^2$$<\/div>\n<p>となり、対数変換後の分散はおよそ変動係数の二乗になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$1/x$<\/span>：変数変換のヤコビアン <span class=\"math-inline\">$|dy/dx|=1/x$<\/span> に由来します。<span class=\"math-inline\">$x$<\/span> が小さい範囲ほど目盛りが引き伸ばされ、密度が左に寄る原因です。<\/li>\n<li>掛け算 → 足し算：<span class=\"math-inline\">$\\log(ab)=\\log a+\\log b$<\/span> です。「誤差が測定値の何％」という形（乗法的な誤差）は、対数をとると「一定の幅の誤差」（加法的な誤差）になります。<\/li>\n<li>分散の安定化：標準偏差が平均に比例する（変動係数が一定の）データでは、対数をとると分散がほぼ一定になります。上のデルタ法の式がその理由です。<\/li>\n<li>平均の戻し方：<span class=\"math-inline\">$\\log x$<\/span> の平均を <span class=\"math-inline\">$e$<\/span> の肩に戻すと<strong>幾何平均<\/strong>になります。算術平均ではありません。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：3つの値の平均<\/strong><\/p>\n<p>データ <span class=\"math-inline\">$2, 8, 32$<\/span> は「4倍ずつ」増えています。対数をとると<\/p>\n<div class=\"math-display\">$$\\log 2\\approx 0.6931,\\quad \\log 8\\approx 2.0794,\\quad \\log 32\\approx 3.4657$$<\/div>\n<p>と等間隔（差 <span class=\"math-inline\">$\\log 4\\approx 1.3863$<\/span>）になります。対数の平均は <span class=\"math-inline\">$\\log 8\\approx 2.0794$<\/span> なので、元に戻すと幾何平均は <span class=\"math-inline\">$8$<\/span> です。算術平均 <span class=\"math-inline\">$(2+8+32)/3=14$<\/span> は大きい値に引っ張られています。<\/p>\n<p><strong>例2：対数正規分布の中央値と平均<\/strong><\/p>\n<p><span class=\"math-inline\">$\\log X\\sim N(1,\\,0.5^2)$<\/span> とします。<\/p>\n<div class=\"math-display\">$$\\text{中央値}=e^{1}\\approx 2.7183,\\qquad E[X]=e^{\\mu+\\sigma^2/2}=e^{1.125}\\approx 3.0802$$<\/div>\n<p><span class=\"math-inline\">$\\log X$<\/span> の平均 <span class=\"math-inline\">$\\mu$<\/span> を戻した <span class=\"math-inline\">$e^{\\mu}$<\/span> は中央値であり、平均は <span class=\"math-inline\">$e^{\\sigma^2/2}$<\/span> 倍だけ大きくなります。<\/p>\n<p><strong>例3：分散の安定化<\/strong><\/p>\n<p>平均 10・標準偏差 2 のグループと、平均 100・標準偏差 20 のグループがあるとします（どちらも変動係数 0.2）。元の尺度では標準偏差が10倍違いますが、デルタ法により対数をとった後はどちらも標準偏差 <span class=\"math-inline\">$\\approx 0.2$<\/span> になり、等分散を仮定する分析（<span class=\"math-inline\">$t$<\/span> 検定や分散分析）が使いやすくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：株価は「何％動いたか」が本質なので、対数収益率 <span class=\"math-inline\">$\\log(P_t/P_{t-1})$<\/span> を使います。複数期間の収益率が足し算で合成できます。<\/li>\n<li><strong>医療<\/strong>：ウイルス量や血中濃度のように桁が大きく変わる値を、対数で要約・比較します。幾何平均や「何倍になったか」で報告します。<\/li>\n<li><strong>マーケティング・行政<\/strong>：所得や売上のように右に裾が長い量を回帰分析するとき、目的変数を <span class=\"math-inline\">$\\log y$<\/span> にします。係数 <span class=\"math-inline\">$b$<\/span> は「<span class=\"math-inline\">$x$<\/span> が1増えると <span class=\"math-inline\">$y$<\/span> が約 <span class=\"math-inline\">$(e^{b}-1)\\times 100$<\/span>％変わる」と読めます（<span class=\"math-inline\">$b=0.05$<\/span> なら約 5.13％）。<\/li>\n<li><strong>製造・品質管理<\/strong>：寿命データや粒子径など、正の値で右に歪んだ測定値を正規分布に近づけてから管理図を作ります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>元の <span class=\"math-inline\">$X$<\/span>（対数正規分布）と、対数をとった <span class=\"math-inline\">$\\log X$<\/span>（正規分布）を重ねています。<span class=\"math-inline\">$\\sigma$<\/span> のスライダーを大きくすると <span class=\"math-inline\">$X$<\/span> の右裾が長くなり平均と中央値が離れますが、対数側はいつも左右対称です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\log X\\sim N(\\mu,\\sigma^2)$<\/span> のとき、<span class=\"math-inline\">$E[X]=e^{\\mu+\\sigma^2/2}$<\/span>、<span class=\"math-inline\">$V[X]=e^{2\\mu+\\sigma^2}(e^{\\sigma^2}-1)$<\/span>、中央値 <span class=\"math-inline\">$e^{\\mu}$<\/span>、最頻値 <span class=\"math-inline\">$e^{\\mu-\\sigma^2}$<\/span> を確認できるようにしておきます。<\/li>\n<li>対数変換は Box-Cox 変換の <span class=\"math-inline\">$\\lambda=0$<\/span> の場合です。<\/li>\n<li>「標準偏差が平均に比例するなら対数変換」「分散が平均に比例するなら平方根変換」という分散安定化の対応を、デルタ法から導けるようにしておきます。<\/li>\n<li>対数変換した回帰の係数の解釈（両対数モデルなら弾力性、片対数なら変化率）が重要です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 対数の平均を <span class=\"math-inline\">$e$<\/span> の肩に戻せば元の平均になる → ○ 戻した値は幾何平均（対数正規なら中央値）で、算術平均より小さくなります（イェンセンの不等式）。<\/li>\n<li>× 0 や負の値を含むデータにそのまま対数をとる → ○ <span class=\"math-inline\">$\\log x$<\/span> は <span class=\"math-inline\">$x&gt;0$<\/span> でしか定義されません。<span class=\"math-inline\">$\\log(x+c)$<\/span> のようにずらす方法はありますが、<span class=\"math-inline\">$c$<\/span> の選び方で結果が変わることに注意します。<\/li>\n<li>× 対数変換すれば何でも正規分布になる → ○ 元の分布が対数正規分布に近いときに有効です。左に歪んだデータでは歪みがかえって強くなります。<\/li>\n<\/ul><\/section>","text":"一言でいうと 正の値をとるデータ を に置き換える変換です。 右に裾の長い分布を左右対称に近づけ、「何倍か」という掛け算の関係を「いくつ増えたか」という足し算の関係に直します。 定義・数式 の確率変数（またはデータ ）に対して とします。統計では、断りがなければ は自然対数（底 ）です。底を10にしても と定数倍が変わるだけで、分布の形は変わりません。 のとき、 は対数正規分布に従い、変数変換の公式から です。デルタ法（1次のテイラー近似）によると、 、 のとき となり、対数変換後の分散はおよそ変動係数の二乗になります。 数式の読み解き - ：変数変換のヤコビアン に由来します。 が小さい範囲ほど目盛りが引き伸ばされ、密度が左に寄る原因です。 - 掛け算 → 足し算： です。「誤差が測定値の何％」という形（乗法的な誤差）は、対数をとると「一定の幅の誤差」（加法的な誤差）になります。 - 分散の安定化：標準偏差が平均に比例する（変動係数が一定の）データでは、対数をとると分散がほぼ一定になります。上のデルタ法の式がその理由です。 - 平均の戻し方： の平均を の肩に戻すと幾何平均になります。算術平均ではありません。 具体例 例1：3つの値の平均 データ は「4倍ずつ」増えています。対数をとると と等間隔（差 ）になります。対数の平均は なので、元に戻すと幾何平均は です。算術平均 は大きい値に引っ張られています。 例2：対数正規分布の中央値と平均 とします。 の平均 を戻した は中央値であり、平均は 倍だけ大きくなります。 例3：分散の安定化 平均 10・標準偏差 2 のグループと、平均 100・標準偏差 20 のグループがあるとします（どちらも変動係数 0.2）。元の尺度では標準偏差が10倍違いますが、デルタ法により対数をとった後はどちらも標準偏差 になり、等分散を仮定する分析（ 検定や分散分析）が使いやすくなります。 現場での使われ方 - 金融・保険：株価は「何％動いたか」が本質なので、対数収益率 を使います。複数期間の収益率が足し算で合成できます。 - 医療：ウイルス量や血中濃度のように桁が大きく変わる値を、対数で要約・比較します。幾何平均や「何倍になったか」で報告します。 - マーケティング・行政：所得や売上のように右に裾が長い量を回帰分析するとき、目的変数を にします。係数 は「 が1増えると が約 ％変わる」と読めます（ なら約 5.13％）。 - 製造・品質管理：寿命データや粒子径など、正の値で右に歪んだ測定値を正規分布に近づけてから管理図を作ります。 グラフ・イメージ 元の （対数正規分布）と、対数をとった （正規分布）を重ねています。 のスライダーを大きくすると の右裾が長くなり平均と中央値が離れますが、対数側はいつも左右対称です。 試験のポイント - のとき、 、 、中央値 、最頻値 を確認できるようにしておきます。 - 対数変換は Box-Cox 変換の の場合です。 - 「標準偏差が平均に比例するなら対数変換」「分散が平均に比例するなら平方根変換」という分散安定化の対応を、デルタ法から導けるようにしておきます。 - 対数変換した回帰の係数の解釈（両対数モデルなら弾力性、片対数なら変化率）が重要です。 よくある間違い - × 対数の平均を の肩に戻せば元の平均になる → ○ 戻した値は幾何平均（対数正規なら中央値）で、算術平均より小さくなります（イェンセンの不等式）。 - × 0 や負の値を含むデータにそのまま対数をとる → ○ は でしか定義されません。 のようにずらす方法はありますが、 の選び方で結果が変わることに注意します。 - × 対数変換すれば何でも正規分布になる → ○ 元の分布が対数正規分布に近いときに有効です。左に歪んだデータでは歪みがかえって強くなります。"},"logit-logistic-transformation":{"id":"logit-logistic-transformation","title":"ロジット変換・ロジスティック変換","reading":"ろじっとへんかん・ろじすてぃっくへんかん","en":"Logit transformation / Logistic transformation","aliases":["ロジット変換","ロジスティック変換","ロジット","ロジスティック関数","シグモイド関数","対数オッズ","logit"],"chapter":4,"importance":"A","tags":["データ変換","比率","オッズ","ロジスティック回帰","リンク関数"],"related":["probit-transformation","logistic-regression","odds-and-odds-ratio","link-function","delta-method","change-of-variables"],"charts":[{"type":"custom","id":"logistic-curve","params":{"b0":0,"b1":1},"sliders":[{"param":"b0","label":"切片 β0","min":-5,"max":5,"step":0.1},{"param":"b1","label":"傾き β1","min":-3,"max":3,"step":0.1}],"caption":"横軸 x（−10〜10）、縦軸 p = 1/(1+exp(−(β0+β1x))) のロジスティック曲線。β0 を変えると曲線が左右に平行移動し（p=0.5 になる位置は x=−β0/β1）、β1 の絶対値を大きくすると立ち上がりが急になる。β1<0 なら右下がりになる。"},{"type":"pdf","dist":"logistic","params":{"loc":0,"scale":1},"sliders":[{"param":"scale","label":"尺度 s","min":0.3,"max":2,"step":0.05}],"compare":[{"dist":"norm","params":{"mu":0,"sigma":1.8138},"label":"正規分布 N(0, 1.8138²)（s=1 と同じ分散）"}],"x":{"min":-8,"max":8},"caption":"累積分布関数がロジスティック関数になる分布（ロジスティック分布）の密度。s=1 のとき分散 π²/3 が等しい正規分布と比べると、中央がやや尖り、裾がやや重い。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>ロジット変換は、0 と 1 の間の確率 <span class=\"math-inline\">$p$<\/span> を「対数オッズ」に直して、<span class=\"math-inline\">$-\\infty$<\/span> から <span class=\"math-inline\">$\\infty$<\/span> までの値にする変換です。\nロジスティック変換はその逆で、どんな実数も 0 と 1 の間の確率に戻します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$0&lt;p&lt;1$<\/span> に対して、<strong>ロジット変換<\/strong>は<\/p>\n<div class=\"math-display\">$$\\operatorname{logit}(p)=\\log\\frac{p}{1-p}$$<\/div>\n<p>です。<span class=\"math-inline\">$p/(1-p)$<\/span> を<strong>オッズ<\/strong>と呼ぶので、ロジットは「対数オッズ」です。<\/p>\n<p>実数 <span class=\"math-inline\">$x$<\/span> に対して、<strong>ロジスティック変換<\/strong>（ロジスティック関数、シグモイド関数）は<\/p>\n<div class=\"math-display\">$$\\sigma(x)=\\frac{1}{1+e^{-x}}=\\frac{e^{x}}{1+e^{x}}$$<\/div>\n<p>です。2つは互いに逆関数で、<\/p>\n<div class=\"math-display\">$$\\sigma\\bigl(\\operatorname{logit}(p)\\bigr)=p,\\qquad \\operatorname{logit}\\bigl(\\sigma(x)\\bigr)=x$$<\/div>\n<p>が成り立ちます。微分は<\/p>\n<div class=\"math-display\">$$\\sigma'(x)=\\sigma(x)\\{1-\\sigma(x)\\},\\qquad \\frac{d}{dp}\\operatorname{logit}(p)=\\frac{1}{p(1-p)}$$<\/div>\n<p>です。<\/p>\n<p>ロジスティック回帰では、成功確率 <span class=\"math-inline\">$p_i$<\/span> を説明変数と次のように結びます。<\/p>\n<div class=\"math-display\">$$\\operatorname{logit}(p_i)=\\beta_0+\\beta_1x_i\\quad\\Longleftrightarrow\\quad p_i=\\frac{1}{1+e^{-(\\beta_0+\\beta_1x_i)}}$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p/(1-p)$<\/span>（オッズ）：「起こる確率が起こらない確率の何倍か」。<span class=\"math-inline\">$p=0.8$<\/span> ならオッズ4です。範囲は <span class=\"math-inline\">$(0,\\infty)$<\/span> です。<\/li>\n<li>対数をとる理由：オッズの範囲 <span class=\"math-inline\">$(0,\\infty)$<\/span> を <span class=\"math-inline\">$(-\\infty,\\infty)$<\/span> に広げ、<span class=\"math-inline\">$p=0.5$<\/span>（オッズ1）を0に、<span class=\"math-inline\">$p$<\/span> と <span class=\"math-inline\">$1-p$<\/span> を入れ替えると符号だけが反転する対称な形（<span class=\"math-inline\">$\\operatorname{logit}(1-p)=-\\operatorname{logit}(p)$<\/span>）にします。<\/li>\n<li>逆関数の導出：<span class=\"math-inline\">$x=\\log\\{p/(1-p)\\}$<\/span> を <span class=\"math-inline\">$p$<\/span> について解きます。<span class=\"math-inline\">$e^{x}=p/(1-p)$<\/span> より <span class=\"math-inline\">$e^{x}(1-p)=p$<\/span>、<span class=\"math-inline\">$p(1+e^{x})=e^{x}$<\/span> なので <span class=\"math-inline\">$p=e^{x}/(1+e^{x})$<\/span> です。<\/li>\n<li><span class=\"math-inline\">$\\sigma'(x)$<\/span> の導出：<span class=\"math-inline\">$\\sigma(x)=(1+e^{-x})^{-1}$<\/span> を微分すると <span class=\"math-inline\">$\\dfrac{e^{-x}}{(1+e^{-x})^2}=\\dfrac{1}{1+e^{-x}}\\cdot\\dfrac{e^{-x}}{1+e^{-x}}=\\sigma(x)\\{1-\\sigma(x)\\}$<\/span> です。傾きは <span class=\"math-inline\">$x=0$<\/span>（<span class=\"math-inline\">$p=0.5$<\/span>）で最大の <span class=\"math-inline\">$1/4$<\/span> になります。<\/li>\n<li>係数の意味：ロジスティック回帰で <span class=\"math-inline\">$x$<\/span> が1増えると、対数オッズが <span class=\"math-inline\">$\\beta_1$<\/span> 増える、つまりオッズが <span class=\"math-inline\">$e^{\\beta_1}$<\/span> 倍になります。<span class=\"math-inline\">$e^{\\beta_1}$<\/span> はオッズ比です。<\/li>\n<li>分布との関係：<span class=\"math-inline\">$\\sigma\\bigl((x-\\mu)/s\\bigr)$<\/span> は<strong>ロジスティック分布<\/strong>の累積分布関数です。その分散は <span class=\"math-inline\">$\\pi^2s^2/3$<\/span> で、標準形（<span class=\"math-inline\">$s=1$<\/span>）の標準偏差は <span class=\"math-inline\">$\\pi/\\sqrt3\\approx 1.8138$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：変換と逆変換<\/strong><\/p>\n<div class=\"math-display\">$$\\operatorname{logit}(0.8)=\\log\\frac{0.8}{0.2}=\\log 4\\approx 1.3863,\\qquad \\operatorname{logit}(0.2)=\\log\\frac14\\approx -1.3863$$<\/div>\n<p><span class=\"math-inline\">$p=0.8$<\/span> と <span class=\"math-inline\">$p=0.2$<\/span> はちょうど符号が反対になります。逆に<\/p>\n<div class=\"math-display\">$$\\sigma(-1)=\\frac{1}{1+e^{1}}\\approx 0.2689,\\qquad \\sigma(2)=\\frac{1}{1+e^{-2}}\\approx 0.8808$$<\/div>\n<p>です。<\/p>\n<p><strong>例2：ロジスティック回帰の予測確率<\/strong><\/p>\n<p>ある商品の購入確率を、来店回数 <span class=\"math-inline\">$x$<\/span> で <span class=\"math-inline\">$\\operatorname{logit}(p)=-3+0.5x$<\/span> とモデル化したとします。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><span class=\"math-inline\">$x$<\/span><\/th>\n<th>線形予測子 <span class=\"math-inline\">$-3+0.5x$<\/span><\/th>\n<th><span class=\"math-inline\">$p=\\sigma(\\cdot)$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2<\/td>\n<td><span class=\"math-inline\">$-2$<\/span><\/td>\n<td>0.1192<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><span class=\"math-inline\">$-1$<\/span><\/td>\n<td>0.2689<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><span class=\"math-inline\">$0$<\/span><\/td>\n<td>0.5000<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><span class=\"math-inline\">$1$<\/span><\/td>\n<td>0.7311<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"math-inline\">$p=0.5$<\/span> になるのは <span class=\"math-inline\">$x=-\\beta_0/\\beta_1=6$<\/span> です。来店が1回増えるごとにオッズは <span class=\"math-inline\">$e^{0.5}\\approx 1.6487$<\/span> 倍になります。ただし確率の増え方は一定ではなく、<span class=\"math-inline\">$x=4$<\/span> での傾きは <span class=\"math-inline\">$\\beta_1\\,p(1-p)=0.5\\times0.2689\\times0.7311\\approx 0.0983$<\/span>、<span class=\"math-inline\">$x=6$<\/span> では最大の <span class=\"math-inline\">$0.5/4=0.125$<\/span> です。<\/p>\n<p><strong>例3：比率の信頼区間をロジット尺度で作る<\/strong><\/p>\n<p><span class=\"math-inline\">$n=100$<\/span> 人中 20 人が「はい」と答え、<span class=\"math-inline\">$\\hat p=0.2$<\/span> です。デルタ法で<\/p>\n<div class=\"math-display\">$$V[\\operatorname{logit}(\\hat p)]\\approx\\left\\{\\frac{1}{p(1-p)}\\right\\}^2\\frac{p(1-p)}{n}=\\frac{1}{np(1-p)}=\\frac{1}{100\\times0.16}=0.0625$$<\/div>\n<p>標準誤差は <span class=\"math-inline\">$0.25$<\/span> です。ロジット尺度での 95% 区間は <span class=\"math-inline\">$-1.3863\\pm1.96\\times0.25=(-1.8763,\\,-0.8963)$<\/span> で、ロジスティック変換で戻すと<\/p>\n<div class=\"math-display\">$$\\bigl(\\sigma(-1.8763),\\ \\sigma(-0.8963)\\bigr)\\approx(0.1328,\\ 0.2898)$$<\/div>\n<p>です。必ず <span class=\"math-inline\">$(0,1)$<\/span> に収まり、<span class=\"math-inline\">$\\hat p$<\/span> に対して左右非対称な区間になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：患者の年齢や検査値から発症の確率を予測するロジスティック回帰で、係数をオッズ比 <span class=\"math-inline\">$e^{\\beta}$<\/span> として報告します。症例対照研究でもオッズ比は推定できるため、疫学で標準的に使われます。<\/li>\n<li><strong>金融・保険<\/strong>：顧客属性から債務不履行の確率を推定する信用スコアリングで、線形の得点をロジスティック変換して確率に直します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：広告のクリック率予測や、ニューラルネットワークの出力層（シグモイド関数）で、得点を確率に変換します。<\/li>\n<li><strong>行政・調査<\/strong>：割合（投票率、就業率など）を目的変数にするとき、ロジット変換して <span class=\"math-inline\">$(0,1)$<\/span> の制約を外してから回帰します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目はロジスティック曲線です。<span class=\"math-inline\">$\\beta_0$<\/span> を動かすと曲線が左右に動き、<span class=\"math-inline\">$\\beta_1$<\/span> を大きくすると立ち上がりが急になります。どの設定でも曲線は 0 と 1 の間に収まり、<span class=\"math-inline\">$p=0.5$<\/span> の点で最も傾きが大きいことを確認してください。\n2つ目は、累積分布関数がロジスティック関数になる分布（ロジスティック分布）の密度です。正規分布とよく似ていますが、裾が少し重いことがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>ロジットとロジスティックが逆関数であることを、<span class=\"math-inline\">$p$<\/span> について解く計算で示せるようにしておきます。<\/li>\n<li><span class=\"math-inline\">$\\sigma'(x)=\\sigma(x)\\{1-\\sigma(x)\\}$<\/span> は、ロジスティック回帰の対数尤度の微分（スコア関数）を計算するときに必ず使います。<\/li>\n<li>ロジスティック回帰の係数の解釈（オッズが <span class=\"math-inline\">$e^{\\beta_1}$<\/span> 倍、確率の変化は <span class=\"math-inline\">$\\beta_1p(1-p)$<\/span>）と、<span class=\"math-inline\">$p=0.5$<\/span> になる <span class=\"math-inline\">$x=-\\beta_0/\\beta_1$<\/span> は計算問題で重要です。<\/li>\n<li>ロジスティック関数は標準正規分布の累積分布関数と形が近く、<span class=\"math-inline\">$\\sigma(x)\\approx\\Phi(x/1.7)$<\/span> です（差の最大は約 0.0095）。このため、ロジットモデルの係数はプロビットモデルの係数のおよそ 1.6〜1.8 倍になります。<\/li>\n<li>一般化線形モデルでは、ロジットは二項分布の<strong>正準リンク関数<\/strong>です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× オッズと確率を同じものとして扱う → ○ <span class=\"math-inline\">$p=0.8$<\/span> のときオッズは <span class=\"math-inline\">$0.8/0.2=4$<\/span> です。確率が小さいとき（<span class=\"math-inline\">$p\\approx$<\/span> 数％）だけ、オッズ <span class=\"math-inline\">$\\approx p$<\/span> と近似できます。<\/li>\n<li>× ロジスティック回帰で「<span class=\"math-inline\">$x$<\/span> が1増えると確率が <span class=\"math-inline\">$\\beta_1$<\/span> 増える」 → ○ 増えるのは対数オッズです。確率の変化量は <span class=\"math-inline\">$p$<\/span> の位置によって変わります。<\/li>\n<li>× ロジットとロジスティックの向きを取り違える → ○ ロジットは「確率 → 実数」、ロジスティックは「実数 → 確率」です。<\/li>\n<li>× <span class=\"math-inline\">$\\hat p=0$<\/span> や <span class=\"math-inline\">$1$<\/span> のデータにそのままロジットをとる → ○ <span class=\"math-inline\">$\\log 0$<\/span> になり定義できません。<span class=\"math-inline\">$\\log\\{(y+0.5)/(n-y+0.5)\\}$<\/span> のような補正（経験ロジット）を使います。<\/li>\n<\/ul><\/section>","text":"一言でいうと ロジット変換は、0 と 1 の間の確率 を「対数オッズ」に直して、 から までの値にする変換です。 ロジスティック変換はその逆で、どんな実数も 0 と 1 の間の確率に戻します。 定義・数式 に対して、ロジット変換は です。 をオッズと呼ぶので、ロジットは「対数オッズ」です。 実数 に対して、ロジスティック変換（ロジスティック関数、シグモイド関数）は です。2つは互いに逆関数で、 が成り立ちます。微分は です。 ロジスティック回帰では、成功確率 を説明変数と次のように結びます。 数式の読み解き - （オッズ）：「起こる確率が起こらない確率の何倍か」。 ならオッズ4です。範囲は です。 - 対数をとる理由：オッズの範囲 を に広げ、 （オッズ1）を0に、 と を入れ替えると符号だけが反転する対称な形（ ）にします。 - 逆関数の導出： を について解きます。 より 、 なので です。 - の導出： を微分すると です。傾きは （ ）で最大の になります。 - 係数の意味：ロジスティック回帰で が1増えると、対数オッズが 増える、つまりオッズが 倍になります。 はオッズ比です。 - 分布との関係： はロジスティック分布の累積分布関数です。その分散は で、標準形（ ）の標準偏差は です。 具体例 例1：変換と逆変換 と はちょうど符号が反対になります。逆に です。 例2：ロジスティック回帰の予測確率 ある商品の購入確率を、来店回数 で とモデル化したとします。 線形予測子 2 0.1192 4 0.2689 6 0.5000 8 0.7311 になるのは です。来店が1回増えるごとにオッズは 倍になります。ただし確率の増え方は一定ではなく、 での傾きは 、 では最大の です。 例3：比率の信頼区間をロジット尺度で作る 人中 20 人が「はい」と答え、 です。デルタ法で 標準誤差は です。ロジット尺度での 95% 区間は で、ロジスティック変換で戻すと です。必ず に収まり、 に対して左右非対称な区間になります。 現場での使われ方 - 医療：患者の年齢や検査値から発症の確率を予測するロジスティック回帰で、係数をオッズ比 として報告します。症例対照研究でもオッズ比は推定できるため、疫学で標準的に使われます。 - 金融・保険：顧客属性から債務不履行の確率を推定する信用スコアリングで、線形の得点をロジスティック変換して確率に直します。 - IT・Webサービス：広告のクリック率予測や、ニューラルネットワークの出力層（シグモイド関数）で、得点を確率に変換します。 - 行政・調査：割合（投票率、就業率など）を目的変数にするとき、ロジット変換して の制約を外してから回帰します。 グラフ・イメージ 1つ目はロジスティック曲線です。 を動かすと曲線が左右に動き、 を大きくすると立ち上がりが急になります。どの設定でも曲線は 0 と 1 の間に収まり、 の点で最も傾きが大きいことを確認してください。 2つ目は、累積分布関数がロジスティック関数になる分布（ロジスティック分布）の密度です。正規分布とよく似ていますが、裾が少し重いことがわかります。 試験のポイント - ロジットとロジスティックが逆関数であることを、 について解く計算で示せるようにしておきます。 - は、ロジスティック回帰の対数尤度の微分（スコア関数）を計算するときに必ず使います。 - ロジスティック回帰の係数の解釈（オッズが 倍、確率の変化は ）と、 になる は計算問題で重要です。 - ロジスティック関数は標準正規分布の累積分布関数と形が近く、 です（差の最大は約 0.0095）。このため、ロジットモデルの係数はプロビットモデルの係数のおよそ 1.6〜1.8 倍になります。 - 一般化線形モデルでは、ロジットは二項分布の正準リンク関数です。 よくある間違い - × オッズと確率を同じものとして扱う → ○ のときオッズは です。確率が小さいとき（ 数％）だけ、オッズ と近似できます。 - × ロジスティック回帰で「 が1増えると確率が 増える」 → ○ 増えるのは対数オッズです。確率の変化量は の位置によって変わります。 - × ロジットとロジスティックの向きを取り違える → ○ ロジットは「確率 → 実数」、ロジスティックは「実数 → 確率」です。 - × や のデータにそのままロジットをとる → ○ になり定義できません。 のような補正（経験ロジット）を使います。"},"power-transformation":{"id":"power-transformation","title":"べき乗変換","reading":"べきじょうへんかん","en":"Power transformation","aliases":["累乗変換","平方根変換","逆数変換","べき変換"],"chapter":4,"importance":"C","tags":["データ変換","分散安定化","デルタ法"],"related":["box-cox-transformation","log-transformation","variance-stabilizing-transform","delta-method","poisson-distribution"],"charts":[],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>データ <span class=\"math-inline\">$x$<\/span> を <span class=\"math-inline\">$x^{\\lambda}$<\/span> に置き換える変換です。\n指数 <span class=\"math-inline\">$\\lambda$<\/span> を変えることで、分布の歪みや「平均とともに分散が増える」性質を弱めます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$X&gt;0$<\/span> とし、実数 <span class=\"math-inline\">$\\lambda\\ne 0$<\/span> に対して<\/p>\n<div class=\"math-display\">$$Y=X^{\\lambda}$$<\/div>\n<p>とします。<span class=\"math-inline\">$\\lambda=1/2$<\/span> が平方根変換、<span class=\"math-inline\">$\\lambda=-1$<\/span> が逆数変換です。<span class=\"math-inline\">$\\lambda&lt;0$<\/span> のときは大小関係が逆転するので、順序を保ちたい場合は <span class=\"math-inline\">$-X^{\\lambda}$<\/span> を使います。<span class=\"math-inline\">$\\lambda=0$<\/span> の位置には対数変換 <span class=\"math-inline\">$\\log X$<\/span> を置くのが慣例です（Box-Cox 変換はこれを1つの式にまとめたものです）。<\/p>\n<p><span class=\"math-inline\">$E[X]=\\mu$<\/span>、<span class=\"math-inline\">$V[X]=\\sigma^2$<\/span> のとき、デルタ法により<\/p>\n<div class=\"math-display\">$$V[X^{\\lambda}]\\approx\\left(\\lambda\\mu^{\\lambda-1}\\right)^2\\sigma^2$$<\/div>\n<p>です。特に標準偏差が <span class=\"math-inline\">$\\sigma\\propto\\mu^{\\beta}$<\/span> と平均のべき乗に比例するなら、<span class=\"math-inline\">$\\lambda=1-\\beta$<\/span> と選ぶと変換後の分散が <span class=\"math-inline\">$\\mu$<\/span> によらずほぼ一定になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\lambda&lt;1$<\/span>：大きい値を強く縮めます。右に歪んだデータの歪みが弱まります。<span class=\"math-inline\">$\\lambda$<\/span> が小さいほど縮め方が強く、<span class=\"math-inline\">$1/2$<\/span>（平方根）→ <span class=\"math-inline\">$0$<\/span>（対数）→ <span class=\"math-inline\">$-1$<\/span>（逆数）の順に強くなります（Tukey の「べき乗のはしご」）。<\/li>\n<li><span class=\"math-inline\">$\\lambda&gt;1$<\/span>：大きい値をさらに引き伸ばします。左に歪んだデータに使います。<\/li>\n<li><span class=\"math-inline\">$\\lambda\\mu^{\\lambda-1}$<\/span>：変換 <span class=\"math-inline\">$g(x)=x^{\\lambda}$<\/span> の、平均の位置での傾き <span class=\"math-inline\">$g'(\\mu)$<\/span> です。傾きの二乗だけ分散が拡大・縮小されます。<\/li>\n<li><span class=\"math-inline\">$\\lambda=1-\\beta$<\/span> の理由：分散の近似は <span class=\"math-inline\">$\\lambda^2\\mu^{2\\lambda-2}\\mu^{2\\beta}\\times\\text{定数}$<\/span> なので、<span class=\"math-inline\">$\\mu$<\/span> の指数 <span class=\"math-inline\">$2(\\lambda-1+\\beta)$<\/span> を0にすればよいからです。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例：ポアソン分布の平方根変換<\/strong><\/p>\n<p>ポアソン分布は分散＝平均なので、<span class=\"math-inline\">$\\sigma\\propto\\mu^{1/2}$<\/span>（<span class=\"math-inline\">$\\beta=1/2$<\/span>）です。したがって <span class=\"math-inline\">$\\lambda=1-1/2=1/2$<\/span>、つまり平方根変換が適します。デルタ法では<\/p>\n<div class=\"math-display\">$$V[\\sqrt{X}]\\approx\\left(\\frac{1}{2}\\mu^{-1/2}\\right)^2\\mu=\\frac{1}{4}$$<\/div>\n<p>と、平均によらず <span class=\"math-inline\">$0.25$<\/span> になります。実際に確率関数から正確に計算すると、<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>平均 <span class=\"math-inline\">$\\mu$<\/span><\/th>\n<th><span class=\"math-inline\">$V[X]$<\/span><\/th>\n<th><span class=\"math-inline\">$V[\\sqrt{X}]$<\/span>（正確な値）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4<\/td>\n<td>4<\/td>\n<td>0.3056<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>16<\/td>\n<td>0.2565<\/td>\n<\/tr>\n<tr>\n<td>64<\/td>\n<td>64<\/td>\n<td>0.2515<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>元の分散は16倍に広がるのに、平方根をとった後はほぼ <span class=\"math-inline\">$0.25$<\/span> にそろいます。平均が大きいほど近似がよくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：製品あたりの欠点数などの計数データを平方根変換してから分散分析にかけ、等分散の前提に近づけます。<\/li>\n<li><strong>医療・生物<\/strong>：反応時間など右に歪んだ時間データを逆数変換し、「単位時間あたりの速さ」として分析します。<\/li>\n<li><strong>行政・調査<\/strong>：地域ごとの件数データを比べるとき、平方根をとって件数の多い地域のばらつきに結果が引っ張られないようにします。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>「分散 ∝ 平均」なら平方根、「標準偏差 ∝ 平均」なら対数、「標準偏差 ∝ 平均の二乗」なら逆数という対応を、<span class=\"math-inline\">$\\lambda=1-\\beta$<\/span> から導けるようにしておきます。<\/li>\n<li>分散の近似はデルタ法 <span class=\"math-inline\">$V[g(X)]\\approx\\{g'(\\mu)\\}^2V[X]$<\/span> で計算します。<\/li>\n<li>べき乗変換を <span class=\"math-inline\">$\\lambda=0$<\/span> でも連続になるように正規化したものが Box-Cox 変換です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 逆数変換をしても大小の順序は保たれる → ○ <span class=\"math-inline\">$\\lambda&lt;0$<\/span> では大小が逆転します。解釈するときは符号に注意するか、<span class=\"math-inline\">$-X^{\\lambda}$<\/span> を使います。<\/li>\n<li>× べき乗変換で <span class=\"math-inline\">$\\lambda=0$<\/span> とすると <span class=\"math-inline\">$X^0=1$<\/span> が対数変換の代わりになる → ○ <span class=\"math-inline\">$X^0$<\/span> は定数で情報がなくなります。<span class=\"math-inline\">$\\lambda=0$<\/span> には <span class=\"math-inline\">$\\log X$<\/span> を当てます。<\/li>\n<\/ul><\/section>","text":"一言でいうと データ を に置き換える変換です。 指数 を変えることで、分布の歪みや「平均とともに分散が増える」性質を弱めます。 定義・数式 とし、実数 に対して とします。 が平方根変換、 が逆数変換です。 のときは大小関係が逆転するので、順序を保ちたい場合は を使います。 の位置には対数変換 を置くのが慣例です（Box-Cox 変換はこれを1つの式にまとめたものです）。 、 のとき、デルタ法により です。特に標準偏差が と平均のべき乗に比例するなら、 と選ぶと変換後の分散が によらずほぼ一定になります。 数式の読み解き - ：大きい値を強く縮めます。右に歪んだデータの歪みが弱まります。 が小さいほど縮め方が強く、 （平方根）→ （対数）→ （逆数）の順に強くなります（Tukey の「べき乗のはしご」）。 - ：大きい値をさらに引き伸ばします。左に歪んだデータに使います。 - ：変換 の、平均の位置での傾き です。傾きの二乗だけ分散が拡大・縮小されます。 - の理由：分散の近似は なので、 の指数 を0にすればよいからです。 具体例 例：ポアソン分布の平方根変換 ポアソン分布は分散＝平均なので、 （ ）です。したがって 、つまり平方根変換が適します。デルタ法では と、平均によらず になります。実際に確率関数から正確に計算すると、 平均 （正確な値） 4 4 0.3056 16 16 0.2565 64 64 0.2515 元の分散は16倍に広がるのに、平方根をとった後はほぼ にそろいます。平均が大きいほど近似がよくなります。 現場での使われ方 - 製造・品質管理：製品あたりの欠点数などの計数データを平方根変換してから分散分析にかけ、等分散の前提に近づけます。 - 医療・生物：反応時間など右に歪んだ時間データを逆数変換し、「単位時間あたりの速さ」として分析します。 - 行政・調査：地域ごとの件数データを比べるとき、平方根をとって件数の多い地域のばらつきに結果が引っ張られないようにします。 試験のポイント - 「分散 ∝ 平均」なら平方根、「標準偏差 ∝ 平均」なら対数、「標準偏差 ∝ 平均の二乗」なら逆数という対応を、 から導けるようにしておきます。 - 分散の近似はデルタ法 で計算します。 - べき乗変換を でも連続になるように正規化したものが Box-Cox 変換です。 よくある間違い - × 逆数変換をしても大小の順序は保たれる → ○ では大小が逆転します。解釈するときは符号に注意するか、 を使います。 - × べき乗変換で とすると が対数変換の代わりになる → ○ は定数で情報がなくなります。 には を当てます。"},"probit-transformation":{"id":"probit-transformation","title":"プロビット変換","reading":"ぷろびっとへんかん","en":"Probit transformation","aliases":["プロビット","probit","正規分位点変換"],"chapter":4,"importance":"B","tags":["データ変換","比率","標準正規分布","リンク関数","用量反応"],"related":["logit-logistic-transformation","probit-model","standard-normal-distribution","quantile-function","link-function"],"charts":[{"type":"cdf","dist":"norm","params":{"mu":0,"sigma":1},"quantile":0.8,"x":{"min":-4,"max":4},"caption":"標準正規分布の累積分布関数 Φ。縦軸の確率 p=0.8 から横に進んで曲線に当たった点の横座標 0.8416 が probit(0.8) になる。逆向きにたどるのがプロビット変換。"},{"type":"pdf","dist":"norm","params":{"mu":0,"sigma":1},"compare":[{"dist":"logistic","params":{"loc":0,"scale":0.5513},"label":"ロジスティック分布（分散1にそろえたもの）"}],"x":{"min":-5,"max":5},"caption":"プロビットの元になる標準正規分布と、分散を1にそろえたロジスティック分布の密度。中央付近はほぼ重なり、違いは裾の重さにある。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>0 と 1 の間の確率 <span class=\"math-inline\">$p$<\/span> を、「標準正規分布でその確率に対応する点（分位点）」に置き換える変換です。\nロジット変換と同じ目的で使われ、正規分布を土台にしている点が違います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>標準正規分布の累積分布関数を <span class=\"math-inline\">$\\Phi(z)=\\displaystyle\\int_{-\\infty}^{z}\\frac{1}{\\sqrt{2\\pi}}e^{-t^2/2}\\,dt$<\/span> とします。<span class=\"math-inline\">$0&lt;p&lt;1$<\/span> に対して、<strong>プロビット変換<\/strong>は<\/p>\n<div class=\"math-display\">$$\\operatorname{probit}(p)=\\Phi^{-1}(p)$$<\/div>\n<p>です。つまり <span class=\"math-inline\">$\\Phi(z)=p$<\/span> を満たす <span class=\"math-inline\">$z$<\/span> です。逆変換は <span class=\"math-inline\">$\\Phi$<\/span> そのものです。<\/p>\n<p>微分は、逆関数の微分公式より<\/p>\n<div class=\"math-display\">$$\\frac{d}{dp}\\Phi^{-1}(p)=\\frac{1}{\\phi\\bigl(\\Phi^{-1}(p)\\bigr)},\\qquad \\phi(z)=\\frac{1}{\\sqrt{2\\pi}}e^{-z^2/2}$$<\/div>\n<p>です。<\/p>\n<p><strong>プロビットモデル<\/strong>では、成功確率を<\/p>\n<div class=\"math-display\">$$\\Phi^{-1}(p_i)=\\beta_0+\\beta_1x_i\\quad\\Longleftrightarrow\\quad p_i=\\Phi(\\beta_0+\\beta_1x_i)$$<\/div>\n<p>と表します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\Phi^{-1}(p)$<\/span>：標準正規分布の下側 <span class=\"math-inline\">$100p$<\/span>％点です。<span class=\"math-inline\">$p=0.5$<\/span> で0、<span class=\"math-inline\">$p\\to0$<\/span> で <span class=\"math-inline\">$-\\infty$<\/span>、<span class=\"math-inline\">$p\\to1$<\/span> で <span class=\"math-inline\">$+\\infty$<\/span> になり、ロジットと同じく <span class=\"math-inline\">$(0,1)$<\/span> を実数全体に広げます。<span class=\"math-inline\">$\\Phi^{-1}(1-p)=-\\Phi^{-1}(p)$<\/span> という対称性もロジットと同じです。<\/li>\n<li>潜在変数による解釈：見えない連続量 <span class=\"math-inline\">$Y_i^{*}=\\beta_0+\\beta_1x_i+\\varepsilon_i$<\/span>、<span class=\"math-inline\">$\\varepsilon_i\\sim N(0,1)$<\/span> があり、<span class=\"math-inline\">$Y_i^{*}&gt;0$<\/span> のとき <span class=\"math-inline\">$Y_i=1$<\/span> になると考えます。すると <span class=\"math-inline\">$P(Y_i=1)=P(\\varepsilon_i&gt;-(\\beta_0+\\beta_1x_i))=\\Phi(\\beta_0+\\beta_1x_i)$<\/span> となり、プロビットモデルが出てきます。誤差をロジスティック分布にすればロジットモデルです。<\/li>\n<li>誤差の分散を1に固定するのは、<span class=\"math-inline\">$\\beta$<\/span> と誤差の尺度を同時には決められない（識別できない）からです。<\/li>\n<li>ロジットとの比較：ロジスティック分布の分散は <span class=\"math-inline\">$\\pi^2/3$<\/span> なので、尺度をそろえるとロジットの係数はプロビットの係数のおよそ <span class=\"math-inline\">$1.6$<\/span>〜<span class=\"math-inline\">$1.8$<\/span> 倍になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：変換の値<\/strong><\/p>\n<div class=\"math-display\">$$\\operatorname{probit}(0.975)=1.9600,\\qquad \\operatorname{probit}(0.8)\\approx 0.8416,\\qquad \\operatorname{probit}(0.5)=0$$<\/div>\n<p>同じ <span class=\"math-inline\">$p=0.8$<\/span> でロジットは <span class=\"math-inline\">$\\log4\\approx1.3863$<\/span> なので、比は <span class=\"math-inline\">$1.3863/0.8416\\approx 1.647$<\/span> です。<\/p>\n<p><strong>例2：用量反応（効く確率と用量）<\/strong><\/p>\n<p>薬の用量 <span class=\"math-inline\">$x$<\/span> と効果が出る確率を <span class=\"math-inline\">$p=\\Phi(-2+0.5x)$<\/span> とします。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>用量 <span class=\"math-inline\">$x$<\/span><\/th>\n<th><span class=\"math-inline\">$-2+0.5x$<\/span><\/th>\n<th><span class=\"math-inline\">$p=\\Phi(\\cdot)$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2<\/td>\n<td><span class=\"math-inline\">$-1$<\/span><\/td>\n<td>0.1587<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><span class=\"math-inline\">$0$<\/span><\/td>\n<td>0.5000<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><span class=\"math-inline\">$1$<\/span><\/td>\n<td>0.8413<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>半数に効く用量（50% 有効量）は <span class=\"math-inline\">$x=-\\beta_0/\\beta_1=4$<\/span> です。<span class=\"math-inline\">$x=6$<\/span> での確率の増え方（傾き）は<\/p>\n<div class=\"math-display\">$$\\frac{dp}{dx}=\\phi(1)\\times\\beta_1\\approx 0.2420\\times0.5=0.1210$$<\/div>\n<p>です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療・生物<\/strong>：毒性試験や薬効試験で、用量と反応率の関係（用量反応曲線）を当てはめ、50% 致死量や 50% 有効量を推定します。プロビット分析はもともとこの分野で発展しました。<\/li>\n<li><strong>マーケティング・経済<\/strong>：「購入するかしないか」を、見えない効用が閾値を超えるかどうかで説明するモデルとして使います。潜在変数の解釈がしやすい点が好まれます。<\/li>\n<li><strong>製造・品質管理<\/strong>：部品に加える負荷と破壊率の関係を、強度が正規分布に従うと仮定してプロビットで当てはめます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目は標準正規分布の累積分布関数です。縦軸の <span class=\"math-inline\">$p$<\/span> から曲線に当たる横軸の値がプロビットです。\n2つ目は標準正規分布と、分散をそろえたロジスティック分布の密度です。中央はほぼ同じで、裾だけが違うので、ロジットとプロビットの当てはめ結果が多くの場合よく似ることがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\operatorname{probit}(p)=\\Phi^{-1}(p)$<\/span> は正規分布表の逆引きです。<span class=\"math-inline\">$1.645$<\/span>（0.95）、<span class=\"math-inline\">$1.960$<\/span>（0.975）、<span class=\"math-inline\">$0.8416$<\/span>（0.8）などの値をすぐ出せるようにしておきます。<\/li>\n<li>潜在変数（閾値）モデルからプロビットモデルを導く流れが重要です。<\/li>\n<li>一般化線形モデルでは、プロビットは二項分布に対するリンク関数の1つです（正準リンクはロジット）。<\/li>\n<li>ロジットとの違いは主に係数の尺度と裾の重さです。係数の比がおよそ <span class=\"math-inline\">$1.6$<\/span>〜<span class=\"math-inline\">$1.8$<\/span> になることを押さえておきます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× プロビットの係数もオッズ比として解釈できる → ○ オッズ比の解釈ができるのはロジットです。プロビットは「標準正規分布の <span class=\"math-inline\">$z$<\/span> 値がいくつ動くか」と読みます。<\/li>\n<li>× ロジットとプロビットの係数をそのまま比べる → ○ 誤差分布の分散が違う（<span class=\"math-inline\">$\\pi^2/3$<\/span> と 1）ので、尺度をそろえてから比べます。<\/li>\n<li>× <span class=\"math-inline\">$\\Phi^{-1}$<\/span> を密度 <span class=\"math-inline\">$\\phi$<\/span> の逆関数と混同する → ○ 逆にするのは累積分布関数 <span class=\"math-inline\">$\\Phi$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 0 と 1 の間の確率 を、「標準正規分布でその確率に対応する点（分位点）」に置き換える変換です。 ロジット変換と同じ目的で使われ、正規分布を土台にしている点が違います。 定義・数式 標準正規分布の累積分布関数を とします。 に対して、プロビット変換は です。つまり を満たす です。逆変換は そのものです。 微分は、逆関数の微分公式より です。 プロビットモデルでは、成功確率を と表します。 数式の読み解き - ：標準正規分布の下側 ％点です。 で0、 で 、 で になり、ロジットと同じく を実数全体に広げます。 という対称性もロジットと同じです。 - 潜在変数による解釈：見えない連続量 、 があり、 のとき になると考えます。すると となり、プロビットモデルが出てきます。誤差をロジスティック分布にすればロジットモデルです。 - 誤差の分散を1に固定するのは、 と誤差の尺度を同時には決められない（識別できない）からです。 - ロジットとの比較：ロジスティック分布の分散は なので、尺度をそろえるとロジットの係数はプロビットの係数のおよそ 〜 倍になります。 具体例 例1：変換の値 同じ でロジットは なので、比は です。 例2：用量反応（効く確率と用量） 薬の用量 と効果が出る確率を とします。 用量 2 0.1587 4 0.5000 6 0.8413 半数に効く用量（50% 有効量）は です。 での確率の増え方（傾き）は です。 現場での使われ方 - 医療・生物：毒性試験や薬効試験で、用量と反応率の関係（用量反応曲線）を当てはめ、50% 致死量や 50% 有効量を推定します。プロビット分析はもともとこの分野で発展しました。 - マーケティング・経済：「購入するかしないか」を、見えない効用が閾値を超えるかどうかで説明するモデルとして使います。潜在変数の解釈がしやすい点が好まれます。 - 製造・品質管理：部品に加える負荷と破壊率の関係を、強度が正規分布に従うと仮定してプロビットで当てはめます。 グラフ・イメージ 1つ目は標準正規分布の累積分布関数です。縦軸の から曲線に当たる横軸の値がプロビットです。 2つ目は標準正規分布と、分散をそろえたロジスティック分布の密度です。中央はほぼ同じで、裾だけが違うので、ロジットとプロビットの当てはめ結果が多くの場合よく似ることがわかります。 試験のポイント - は正規分布表の逆引きです。 （0.95）、 （0.975）、 （0.8）などの値をすぐ出せるようにしておきます。 - 潜在変数（閾値）モデルからプロビットモデルを導く流れが重要です。 - 一般化線形モデルでは、プロビットは二項分布に対するリンク関数の1つです（正準リンクはロジット）。 - ロジットとの違いは主に係数の尺度と裾の重さです。係数の比がおよそ 〜 になることを押さえておきます。 よくある間違い - × プロビットの係数もオッズ比として解釈できる → ○ オッズ比の解釈ができるのはロジットです。プロビットは「標準正規分布の 値がいくつ動くか」と読みます。 - × ロジットとプロビットの係数をそのまま比べる → ○ 誤差分布の分散が違う（ と 1）ので、尺度をそろえてから比べます。 - × を密度 の逆関数と混同する → ○ 逆にするのは累積分布関数 です。"},"bernoulli-distribution":{"id":"bernoulli-distribution","title":"ベルヌーイ試行・ベルヌーイ分布","reading":"べるぬーいしこう・べるぬーいぶんぷ","en":"Bernoulli trial / Bernoulli distribution","aliases":["ベルヌーイ試行","ベルヌーイ分布","Bernoulli trial","Bernoulli distribution"],"chapter":5,"importance":"A","tags":["離散型分布","指示関数","二値データ"],"related":["binomial-distribution","geometric-distribution","negative-binomial-distribution","multinomial-distribution","probability-generating-function","moment-generating-function"],"charts":[{"type":"pmf","dist":"bernoulli","params":{"p":0.3},"sliders":[{"param":"p","label":"成功確率 p","min":0,"max":1,"step":0.01}],"x":{"min":0,"max":1},"caption":"0 と 1 の2本の棒だけの分布。p を動かすと 1 の棒が p、0 の棒が 1−p になり、分散 p(1−p) は p=0.5 で最大になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「成功か失敗か」「はいかいいえか」のように、結果が2通りしかない1回の試行を<strong>ベルヌーイ試行<\/strong>といいます。\nその結果を 1（成功）と 0（失敗）で表した確率変数の分布が<strong>ベルヌーイ分布<\/strong>で、二項分布・幾何分布・負の二項分布などすべての「数える分布」の部品になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>ベルヌーイ試行とは、次の2条件を満たす試行の列です。<\/p>\n<ul>\n<li>各試行の結果は「成功」「失敗」の2通りだけ。<\/li>\n<li>成功確率 <span class=\"math-inline\">$p$<\/span> はどの回も同じで、試行どうしは互いに独立。<\/li>\n<\/ul>\n<p>1回の試行で、成功なら <span class=\"math-inline\">$X=1$<\/span>、失敗なら <span class=\"math-inline\">$X=0$<\/span> とおきます。<span class=\"math-inline\">$0 \\le p \\le 1$<\/span> として、<\/p>\n<div class=\"math-display\">$$P(X = x) = p^{x}(1-p)^{1-x}, \\qquad x \\in \\{0, 1\\}$$<\/div>\n<p>これを <span class=\"math-inline\">$X \\sim \\mathrm{Bern}(p)$<\/span> と書きます。<span class=\"math-inline\">$\\mathrm{Bin}(1,p)$<\/span> と書くこともあります。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$\\{0, 1\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>成功確率 <span class=\"math-inline\">$p\\ (0 \\le p \\le 1)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$P(X=1)=p,\\ P(X=0)=1-p$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$p$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$p(1-p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t) = 1 - p + p e^{t}$<\/span>（すべての <span class=\"math-inline\">$t$<\/span> で存在）<\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$G(s) = 1 - p + p s$<\/span><\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t) = 1 - p + p e^{it}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>歪度<\/td>\n<td><span class=\"math-inline\">$\\dfrac{1-2p}{\\sqrt{p(1-p)}}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係は次のとおりです。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>和<\/td>\n<td>独立な <span class=\"math-inline\">$\\mathrm{Bern}(p)$<\/span> を <span class=\"math-inline\">$n$<\/span> 個足すと二項分布 <span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>最初の成功まで<\/td>\n<td>最初の成功までの失敗回数は幾何分布<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$r$<\/span> 回目の成功まで<\/td>\n<td><span class=\"math-inline\">$r$<\/span> 回目の成功までの失敗回数は負の二項分布<\/td>\n<\/tr>\n<tr>\n<td>多値への拡張<\/td>\n<td>結果が <span class=\"math-inline\">$k$<\/span> 通りなら、カテゴリ分布（多項分布の <span class=\"math-inline\">$n=1$<\/span>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$x$<\/span>：試行の結果（1 が成功、0 が失敗）。<\/li>\n<li><span class=\"math-inline\">$p^{x}(1-p)^{1-x}$<\/span>：<span class=\"math-inline\">$x=1$<\/span> を入れると <span class=\"math-inline\">$p$<\/span>、<span class=\"math-inline\">$x=0$<\/span> を入れると <span class=\"math-inline\">$1-p$<\/span> になる、場合分けを1本にまとめた書き方です。尤度を書くときに便利です。<\/li>\n<\/ul>\n<p>期待値と分散は定義どおり計算できます。<\/p>\n<div class=\"math-display\">$$E[X] = 0 \\cdot (1-p) + 1 \\cdot p = p$$<\/div>\n<p><span class=\"math-inline\">$X$<\/span> は 0 か 1 なので <span class=\"math-inline\">$X^2 = X$<\/span> です。したがって <span class=\"math-inline\">$E[X^2] = p$<\/span> で、<\/p>\n<div class=\"math-display\">$$V[X] = E[X^2] - (E[X])^2 = p - p^2 = p(1-p)$$<\/div>\n<p>同じ理由で <span class=\"math-inline\">$E[X^k] = p$<\/span>（<span class=\"math-inline\">$k \\ge 1$<\/span>）です。<\/p>\n<p>母関数も2項の和を書くだけです。<\/p>\n<div class=\"math-display\">$$M(t) = E[e^{tX}] = (1-p)e^{0} + p e^{t} = 1 - p + p e^{t}, \\qquad G(s) = E[s^X] = 1 - p + p s$$<\/div>\n<p><span class=\"math-inline\">$M'(t) = p e^{t}$<\/span> なので <span class=\"math-inline\">$M'(0)=p$<\/span>、<span class=\"math-inline\">$M''(0)=p$<\/span> となり、上の結果と一致します。<\/p>\n<p>直感的には、ベルヌーイ確率変数は「事象 <span class=\"math-inline\">$A$<\/span> が起きたら 1」という<strong>指示関数<\/strong> <span class=\"math-inline\">$1_A$<\/span> そのものです。期待値が確率 <span class=\"math-inline\">$P(A)$<\/span> に等しいことは、確率と期待値をつなぐ基本的な事実です。<\/p>\n<p>分散 <span class=\"math-inline\">$p(1-p)$<\/span> は <span class=\"math-inline\">$p=0.5$<\/span> で最大値 <span class=\"math-inline\">$0.25$<\/span> をとり、<span class=\"math-inline\">$p$<\/span> が 0 や 1 に近いほど小さくなります。結果がほぼ決まっている試行ほど、ばらつきが小さいということです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：製造ラインの不良品<\/strong><\/p>\n<p>ある製品の不良率が 5% とします。製品1個を検査して、不良なら <span class=\"math-inline\">$X=1$<\/span> とおくと <span class=\"math-inline\">$X \\sim \\mathrm{Bern}(0.05)$<\/span> です。<\/p>\n<div class=\"math-display\">$$E[X] = 0.05, \\qquad V[X] = 0.05 \\times 0.95 = 0.0475$$<\/div>\n<p>標準偏差は <span class=\"math-inline\">$\\sqrt{0.0475} \\approx 0.2179$<\/span> です。<\/p>\n<p><strong>例2：<span class=\"math-inline\">$p=0.3$<\/span> のときのモーメントと歪度<\/strong><\/p>\n<p><span class=\"math-inline\">$X \\sim \\mathrm{Bern}(0.3)$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$E[X] = 0.3, \\quad V[X] = 0.3 \\times 0.7 = 0.21$$<\/div>\n<p>歪度は<\/p>\n<div class=\"math-display\">$$\\frac{1 - 2 \\times 0.3}{\\sqrt{0.21}} = \\frac{0.4}{0.4583} \\approx 0.8729$$<\/div>\n<p>で正です。<span class=\"math-inline\">$p&lt;0.5$<\/span> だと 0 側に確率が多く、1 側に裾が伸びる形になるためです。<\/p>\n<p><strong>例3：標本比率の分散<\/strong><\/p>\n<p>独立に <span class=\"math-inline\">$X_1, \\dots, X_n \\sim \\mathrm{Bern}(p)$<\/span> を観測すると、標本比率 <span class=\"math-inline\">$\\hat p = \\frac{1}{n}\\sum X_i$<\/span> の期待値は <span class=\"math-inline\">$p$<\/span>、分散は <span class=\"math-inline\">$p(1-p)/n$<\/span> です。<span class=\"math-inline\">$p=0.3,\\ n=100$<\/span> なら <span class=\"math-inline\">$V[\\hat p] = 0.21/100 = 0.0021$<\/span>、標準誤差は <span class=\"math-inline\">$\\sqrt{0.0021} \\approx 0.0458$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：ある治療で「治癒したか否か」を患者ごとに 0/1 で記録し、治癒率 <span class=\"math-inline\">$p$<\/span> を推定します。臨床試験の主要評価項目が二値のとき、出発点はベルヌーイ分布です。<\/li>\n<li><strong>IT・Webサービス<\/strong>：広告が表示されたときに「クリックされたか」を 0/1 で記録します。クリック率の推定や A/B テストは、ベルヌーイ試行の繰り返しとしてモデル化します。<\/li>\n<li><strong>製造・品質管理<\/strong>：製品1個ごとの良・不良の判定は、不良率 <span class=\"math-inline\">$p$<\/span> のベルヌーイ試行とみなします。管理図（p 管理図）の計算もこの分散 <span class=\"math-inline\">$p(1-p)$<\/span> を使います。<\/li>\n<li><strong>金融・保険<\/strong>：契約者が1年以内に「債務不履行になるか」「保険金請求をするか」を 0/1 で表し、デフォルト確率や請求確率をモデル化します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>0 と 1 の2本の棒だけの、最も単純な分布です。\nスライダーで <span class=\"math-inline\">$p$<\/span> を動かすと、棒の高さが <span class=\"math-inline\">$1-p$<\/span> と <span class=\"math-inline\">$p$<\/span> に入れ替わります。\nグラフの下に表示される分散が、<span class=\"math-inline\">$p=0.5$<\/span> で最大の <span class=\"math-inline\">$0.25$<\/span> になることを確かめてください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$X^2 = X$<\/span> を使って <span class=\"math-inline\">$E[X^2]=p$<\/span>、<span class=\"math-inline\">$V[X]=p(1-p)$<\/span> を一瞬で出せるようにしておきます。<\/li>\n<li>二項分布の期待値 <span class=\"math-inline\">$np$<\/span>・分散 <span class=\"math-inline\">$np(1-p)$<\/span> は、ベルヌーイ確率変数の和として導くのが最短です（分散は独立性から足し算）。<\/li>\n<li>尤度 <span class=\"math-inline\">$\\prod p^{x_i}(1-p)^{1-x_i} = p^{\\sum x_i}(1-p)^{n-\\sum x_i}$<\/span> の形は、最尤推定（<span class=\"math-inline\">$\\hat p = \\bar x$<\/span>）、十分統計量（<span class=\"math-inline\">$\\sum x_i$<\/span>）、ベータ事前分布との共役性で繰り返し使います。<\/li>\n<li>分散 <span class=\"math-inline\">$p(1-p)$<\/span> が <span class=\"math-inline\">$p=1/2$<\/span> で最大になることは、比率の信頼区間で必要な標本サイズを見積もるとき（<span class=\"math-inline\">$p$<\/span> が不明なら <span class=\"math-inline\">$p=1/2$<\/span> とおく）に使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 分散を <span class=\"math-inline\">$p^2$<\/span> や <span class=\"math-inline\">$p$<\/span> とする → ○ <span class=\"math-inline\">$E[X^2]=p$<\/span> から <span class=\"math-inline\">$(E[X])^2=p^2$<\/span> を引いて <span class=\"math-inline\">$p(1-p)$<\/span> です。<\/li>\n<li>× 試行ごとに成功確率が違っても「ベルヌーイ試行の繰り返し」と呼ぶ → ○ 「独立」かつ「成功確率が一定」の両方が条件です。どちらかが崩れると和は二項分布になりません。<\/li>\n<li>× 非復元抽出の「当たり・はずれ」の繰り返しをベルヌーイ試行とみなす → ○ 非復元抽出では試行が独立でないので、当たりの個数は二項分布ではなく超幾何分布に従います。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「成功か失敗か」「はいかいいえか」のように、結果が2通りしかない1回の試行をベルヌーイ試行といいます。 その結果を 1（成功）と 0（失敗）で表した確率変数の分布がベルヌーイ分布で、二項分布・幾何分布・負の二項分布などすべての「数える分布」の部品になります。 定義・数式 ベルヌーイ試行とは、次の2条件を満たす試行の列です。 - 各試行の結果は「成功」「失敗」の2通りだけ。 - 成功確率 はどの回も同じで、試行どうしは互いに独立。 1回の試行で、成功なら 、失敗なら とおきます。 として、 これを と書きます。 と書くこともあります。 項目 内容 台 パラメータ 成功確率 確率関数 期待値 分散 モーメント母関数 （すべての で存在） 確率母関数 特性関数 歪度 他の分布との関係は次のとおりです。 関係 内容 和 独立な を 個足すと二項分布 最初の成功まで 最初の成功までの失敗回数は幾何分布 回目の成功まで 回目の成功までの失敗回数は負の二項分布 多値への拡張 結果が 通りなら、カテゴリ分布（多項分布の ） 数式の読み解き - ：試行の結果（1 が成功、0 が失敗）。 - ： を入れると 、 を入れると になる、場合分けを1本にまとめた書き方です。尤度を書くときに便利です。 期待値と分散は定義どおり計算できます。 は 0 か 1 なので です。したがって で、 同じ理由で （ ）です。 母関数も2項の和を書くだけです。 なので 、 となり、上の結果と一致します。 直感的には、ベルヌーイ確率変数は「事象 が起きたら 1」という指示関数 そのものです。期待値が確率 に等しいことは、確率と期待値をつなぐ基本的な事実です。 分散 は で最大値 をとり、 が 0 や 1 に近いほど小さくなります。結果がほぼ決まっている試行ほど、ばらつきが小さいということです。 具体例 例1：製造ラインの不良品 ある製品の不良率が 5% とします。製品1個を検査して、不良なら とおくと です。 標準偏差は です。 例2： のときのモーメントと歪度 のとき、 歪度は で正です。 だと 0 側に確率が多く、1 側に裾が伸びる形になるためです。 例3：標本比率の分散 独立に を観測すると、標本比率 の期待値は 、分散は です。 なら 、標準誤差は です。 現場での使われ方 - 医療：ある治療で「治癒したか否か」を患者ごとに 0/1 で記録し、治癒率 を推定します。臨床試験の主要評価項目が二値のとき、出発点はベルヌーイ分布です。 - IT・Webサービス：広告が表示されたときに「クリックされたか」を 0/1 で記録します。クリック率の推定や A/B テストは、ベルヌーイ試行の繰り返しとしてモデル化します。 - 製造・品質管理：製品1個ごとの良・不良の判定は、不良率 のベルヌーイ試行とみなします。管理図（p 管理図）の計算もこの分散 を使います。 - 金融・保険：契約者が1年以内に「債務不履行になるか」「保険金請求をするか」を 0/1 で表し、デフォルト確率や請求確率をモデル化します。 グラフ・イメージ 0 と 1 の2本の棒だけの、最も単純な分布です。 スライダーで を動かすと、棒の高さが と に入れ替わります。 グラフの下に表示される分散が、 で最大の になることを確かめてください。 試験のポイント - を使って 、 を一瞬で出せるようにしておきます。 - 二項分布の期待値 ・分散 は、ベルヌーイ確率変数の和として導くのが最短です（分散は独立性から足し算）。 - 尤度 の形は、最尤推定（ ）、十分統計量（ ）、ベータ事前分布との共役性で繰り返し使います。 - 分散 が で最大になることは、比率の信頼区間で必要な標本サイズを見積もるとき（ が不明なら とおく）に使います。 よくある間違い - × 分散を や とする → ○ から を引いて です。 - × 試行ごとに成功確率が違っても「ベルヌーイ試行の繰り返し」と呼ぶ → ○ 「独立」かつ「成功確率が一定」の両方が条件です。どちらかが崩れると和は二項分布になりません。 - × 非復元抽出の「当たり・はずれ」の繰り返しをベルヌーイ試行とみなす → ○ 非復元抽出では試行が独立でないので、当たりの個数は二項分布ではなく超幾何分布に従います。"},"binomial-distribution":{"id":"binomial-distribution","title":"二項分布","reading":"にこうぶんぷ","en":"Binomial distribution","aliases":["Bin"],"chapter":5,"importance":"A","tags":["離散型分布","再生性","正規近似","ポアソン近似"],"related":["bernoulli-distribution","poisson-distribution","hypergeometric-distribution","multinomial-distribution","central-limit-theorem","law-of-small-numbers"],"charts":[{"type":"pmf","dist":"binom","params":{"n":10,"p":0.3},"sliders":[{"param":"n","label":"試行回数 n","min":1,"max":100,"step":1},{"param":"p","label":"成功確率 p","min":0.01,"max":0.99,"step":0.01}],"overlay":"norm-approx","caption":"棒が二項分布、破線が同じ平均・分散の正規分布。n を大きくすると棒の形が破線に重なっていく。p が 0 や 1 に近いと左右非対称になり、近似が悪くなる。"},{"type":"pmf","dist":"binom","params":{"n":50,"p":0.04},"sliders":[{"param":"n","label":"試行回数 n","min":5,"max":200,"step":1},{"param":"p","label":"成功確率 p","min":0.005,"max":0.2,"step":0.005}],"x":{"min":0,"max":12},"overlay":"poisson-approx","caption":"点は平均 np のポアソン分布。p が小さく n が大きいほど、棒の先端と点がよく一致する（少数の法則）。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>成功確率 <span class=\"math-inline\">$p$<\/span> のベルヌーイ試行を <span class=\"math-inline\">$n$<\/span> 回独立に繰り返したとき、「成功が何回起きたか」の分布です。\nコイン投げの表の回数、検査で見つかる不良品の数など、「<span class=\"math-inline\">$n$<\/span> 回中何回」を数える場面の基本モデルです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$n$<\/span> を正の整数、<span class=\"math-inline\">$0 \\le p \\le 1$<\/span> とします。確率変数 <span class=\"math-inline\">$X$<\/span> の確率関数が<\/p>\n<div class=\"math-display\">$$P(X = x) = \\binom{n}{x} p^{x} (1-p)^{n-x}, \\qquad x = 0, 1, \\dots, n$$<\/div>\n<p>のとき、<span class=\"math-inline\">$X$<\/span> は二項分布に従うといい、<span class=\"math-inline\">$X \\sim \\mathrm{Bin}(n, p)$<\/span> と書きます。<span class=\"math-inline\">$\\binom{n}{x} = \\dfrac{n!}{x!\\,(n-x)!}$<\/span> です。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$\\{0, 1, \\dots, n\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>試行回数 <span class=\"math-inline\">$n$<\/span>（正の整数）、成功確率 <span class=\"math-inline\">$p\\ (0 \\le p \\le 1)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$\\binom{n}{x} p^{x}(1-p)^{n-x}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$np$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$np(1-p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t) = (1 - p + p e^{t})^{n}$<\/span>（すべての <span class=\"math-inline\">$t$<\/span> で存在）<\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$G(s) = (1 - p + p s)^{n}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t) = (1 - p + p e^{it})^{n}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td><span class=\"math-inline\">$p$<\/span> が共通なら <span class=\"math-inline\">$\\mathrm{Bin}(m,p) + \\mathrm{Bin}(n,p) = \\mathrm{Bin}(m+n,p)$<\/span>（独立のとき）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ベルヌーイ分布<\/td>\n<td><span class=\"math-inline\">$\\mathrm{Bin}(1,p) = \\mathrm{Bern}(p)$<\/span>。独立な <span class=\"math-inline\">$\\mathrm{Bern}(p)$<\/span> の <span class=\"math-inline\">$n$<\/span> 個の和が <span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布<\/td>\n<td><span class=\"math-inline\">$np = \\lambda$<\/span> を一定にして <span class=\"math-inline\">$n \\to \\infty$<\/span> とすると <span class=\"math-inline\">$\\mathrm{Po}(\\lambda)$<\/span> に収束（少数の法則）<\/td>\n<\/tr>\n<tr>\n<td>正規分布<\/td>\n<td><span class=\"math-inline\">$n$<\/span> が大きいとき <span class=\"math-inline\">$N(np,\\ np(1-p))$<\/span> で近似（中心極限定理）<\/td>\n<\/tr>\n<tr>\n<td>超幾何分布<\/td>\n<td>母集団が大きい非復元抽出の極限が二項分布<\/td>\n<\/tr>\n<tr>\n<td>多項分布<\/td>\n<td>多項分布の各成分の周辺分布が二項分布<\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布の条件付け<\/td>\n<td>独立な <span class=\"math-inline\">$X \\sim \\mathrm{Po}(\\lambda_1),\\ Y \\sim \\mathrm{Po}(\\lambda_2)$<\/span> で <span class=\"math-inline\">$X+Y=n$<\/span> を与えると <span class=\"math-inline\">$X \\sim \\mathrm{Bin}(n,\\ \\lambda_1/(\\lambda_1+\\lambda_2))$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p^{x}(1-p)^{n-x}$<\/span>：特定の並び（例：成功・失敗・成功・…）が起こる確率。成功 <span class=\"math-inline\">$x$<\/span> 回と失敗 <span class=\"math-inline\">$n-x$<\/span> 回の積です。<\/li>\n<li><span class=\"math-inline\">$\\binom{n}{x}$<\/span>：成功が <span class=\"math-inline\">$x$<\/span> 回となる並びの数。<span class=\"math-inline\">$n$<\/span> 回のうちどの <span class=\"math-inline\">$x$<\/span> 回が成功かの選び方です。<\/li>\n<li>全確率の和が 1 になることは、二項定理 <span class=\"math-inline\">$\\sum_x \\binom{n}{x}p^x(1-p)^{n-x} = (p + 1 - p)^n = 1$<\/span> そのものです。名前の由来もここにあります。<\/li>\n<\/ul>\n<p><strong>期待値・分散（ベルヌーイの和として）<\/strong><\/p>\n<p><span class=\"math-inline\">$X = X_1 + \\cdots + X_n$<\/span>（<span class=\"math-inline\">$X_i \\sim \\mathrm{Bern}(p)$<\/span> は独立）と書けるので、<\/p>\n<div class=\"math-display\">$$E[X] = \\sum_{i=1}^{n} E[X_i] = np, \\qquad V[X] = \\sum_{i=1}^{n} V[X_i] = np(1-p)$$<\/div>\n<p>分散が単純な足し算になるのは独立だからです。<\/p>\n<p><strong>モーメント母関数から導く<\/strong><\/p>\n<p>独立な和の母関数は積になるので <span class=\"math-inline\">$M(t) = (1-p+pe^{t})^{n}$<\/span> です。微分すると<\/p>\n<div class=\"math-display\">$$M'(t) = n(1-p+pe^{t})^{n-1} p e^{t}$$<\/div>\n<div class=\"math-display\">$$M''(t) = n(n-1)(1-p+pe^{t})^{n-2} p^2 e^{2t} + n(1-p+pe^{t})^{n-1} p e^{t}$$<\/div>\n<p><span class=\"math-inline\">$t=0$<\/span> を代入すると <span class=\"math-inline\">$1-p+p=1$<\/span> なので、<\/p>\n<div class=\"math-display\">$$E[X] = M'(0) = np, \\qquad E[X^2] = M''(0) = n(n-1)p^2 + np$$<\/div>\n<div class=\"math-display\">$$V[X] = n(n-1)p^2 + np - n^2p^2 = np - np^2 = np(1-p)$$<\/div>\n<p><strong>再生性<\/strong><\/p>\n<p><span class=\"math-inline\">$X \\sim \\mathrm{Bin}(m,p)$<\/span> と <span class=\"math-inline\">$Y \\sim \\mathrm{Bin}(n,p)$<\/span> が独立なら、<\/p>\n<div class=\"math-display\">$$M_{X+Y}(t) = (1-p+pe^{t})^{m}(1-p+pe^{t})^{n} = (1-p+pe^{t})^{m+n}$$<\/div>\n<p>で <span class=\"math-inline\">$X+Y \\sim \\mathrm{Bin}(m+n,p)$<\/span> です。<span class=\"math-inline\">$p$<\/span> が異なると積はこの形にならず、再生性は成り立ちません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：フリースロー10本<\/strong><\/p>\n<p>成功率 30% の選手が独立に10本打つとき、成功数 <span class=\"math-inline\">$X \\sim \\mathrm{Bin}(10, 0.3)$<\/span> です。ちょうど3本成功する確率は<\/p>\n<div class=\"math-display\">$$P(X=3) = \\binom{10}{3}(0.3)^3(0.7)^7 = 120 \\times 0.027 \\times 0.08235 \\approx 0.2668$$<\/div>\n<p>2本以下の確率は <span class=\"math-inline\">$P(X \\le 2) = 0.0282 + 0.1211 + 0.2335 \\approx 0.3828$<\/span> です。<span class=\"math-inline\">$E[X]=3$<\/span>、<span class=\"math-inline\">$V[X]=2.1$<\/span> です。<\/p>\n<p><strong>例2：正規近似と連続修正<\/strong><\/p>\n<p><span class=\"math-inline\">$X \\sim \\mathrm{Bin}(100, 0.4)$<\/span> で <span class=\"math-inline\">$P(X \\le 35)$<\/span> を求めます。<span class=\"math-inline\">$E[X] = 40$<\/span>、<span class=\"math-inline\">$V[X] = 24$<\/span> です。<\/p>\n<ul>\n<li>正確な値：<span class=\"math-inline\">$P(X \\le 35) \\approx 0.1795$<\/span><\/li>\n<li>連続修正あり：<span class=\"math-inline\">$P\\!\\left(Z \\le \\dfrac{35.5 - 40}{\\sqrt{24}}\\right) = \\Phi(-0.9186) \\approx 0.1792$<\/span><\/li>\n<li>連続修正なし：<span class=\"math-inline\">$\\Phi\\!\\left(\\dfrac{35 - 40}{\\sqrt{24}}\\right) = \\Phi(-1.0206) \\approx 0.1537$<\/span><\/li>\n<\/ul>\n<p>離散の棒を連続の曲線で近似するときは、境界を 0.5 ずらす連続修正で精度が大きく上がります。<\/p>\n<p><strong>例3：ポアソン近似<\/strong><\/p>\n<p>不良率 0.2% の部品を 1000 個調べるとき、不良数 <span class=\"math-inline\">$X \\sim \\mathrm{Bin}(1000, 0.002)$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(X=0) = 0.998^{1000} \\approx 0.1351, \\qquad \\text{ポアソン近似 } e^{-2} \\approx 0.1353$$<\/div>\n<p><span class=\"math-inline\">$P(X=3)$<\/span> も正確な値 <span class=\"math-inline\">$0.1806$<\/span> に対し、ポアソン近似 <span class=\"math-inline\">$\\dfrac{2^3 e^{-2}}{3!} \\approx 0.1804$<\/span> とほぼ一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：新薬を投与した <span class=\"math-inline\">$n$<\/span> 人のうち効果があった人数を二項分布でモデル化し、有効率が既存薬の値を上回るかを二項検定で調べます。<\/li>\n<li><strong>製造・品質管理<\/strong>：ロットから <span class=\"math-inline\">$n$<\/span> 個を抜き取り、不良数が <span class=\"math-inline\">$c$<\/span> 個以下なら合格とする抜取検査で、合格確率（OC曲線）を二項分布で計算します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：広告の表示回数 <span class=\"math-inline\">$n$<\/span> とクリック数から、クリック率の信頼区間を求めます。2つの案のクリック率を比べる A/B テストも二項分布が出発点です。<\/li>\n<li><strong>行政・調査<\/strong>：世論調査で「賛成」と答えた人数を二項分布とみなし、支持率の誤差幅（例：<span class=\"math-inline\">$n=1000$<\/span> で約 ±3%）を見積もります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目のグラフは、二項分布の棒に同じ平均・分散の正規分布を重ねたものです。<span class=\"math-inline\">$n$<\/span> を増やすと形が釣り鐘型に近づきます。<span class=\"math-inline\">$p$<\/span> を 0.05 などに下げると右に裾を引き、正規近似が悪くなることがわかります。<\/p>\n<p>2つ目のグラフは、<span class=\"math-inline\">$p$<\/span> が小さいときのポアソン近似です。点（ポアソン分布）と棒の先端の一致具合を、<span class=\"math-inline\">$n$<\/span> と <span class=\"math-inline\">$p$<\/span> を変えて確かめてください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>期待値・分散は「ベルヌーイの和」で導くのが最短です。モーメント母関数・確率母関数による導出も途中式まで書けるようにしておきます。<\/li>\n<li>再生性は「<span class=\"math-inline\">$p$<\/span> が共通」のときだけ成り立ちます。<\/li>\n<li>正規近似（連続修正つき）とポアソン近似の使い分けが重要です。目安として <span class=\"math-inline\">$np$<\/span> と <span class=\"math-inline\">$n(1-p)$<\/span> がともに 5 以上なら正規近似、<span class=\"math-inline\">$n$<\/span> が大きく <span class=\"math-inline\">$p$<\/span> が小さいならポアソン近似を使います。<\/li>\n<li>最尤推定量は <span class=\"math-inline\">$\\hat p = X/n$<\/span> で不偏、分散は <span class=\"math-inline\">$p(1-p)/n$<\/span> です。比率の信頼区間・検定（第9章・第11章）の土台になります。<\/li>\n<li>最頻値は <span class=\"math-inline\">$\\lfloor (n+1)p \\rfloor$<\/span> です（<span class=\"math-inline\">$(n+1)p$<\/span> が整数なら、その値と1つ小さい値の2つ）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 分散を <span class=\"math-inline\">$np$<\/span> とする → ○ <span class=\"math-inline\">$np(1-p)$<\/span> です。<span class=\"math-inline\">$np$<\/span> になるのはポアソン分布です（<span class=\"math-inline\">$p$<\/span> が小さいと二項分布の分散は <span class=\"math-inline\">$np$<\/span> に近くなりますが、等しくはありません）。<\/li>\n<li>× 成功確率が異なる二項分布の和も二項分布 → ○ <span class=\"math-inline\">$\\mathrm{Bin}(m,p_1)+\\mathrm{Bin}(n,p_2)$<\/span> は <span class=\"math-inline\">$p_1 \\ne p_2$<\/span> なら二項分布になりません。<\/li>\n<li>× 正規近似で <span class=\"math-inline\">$P(X \\le 35)$<\/span> を <span class=\"math-inline\">$\\Phi((35-\\mu)/\\sigma)$<\/span> で計算する → ○ 連続修正で <span class=\"math-inline\">$35.5$<\/span> を使います。<span class=\"math-inline\">$P(X &lt; 35)$<\/span> なら <span class=\"math-inline\">$34.5$<\/span> です。<\/li>\n<li>× 非復元抽出（くじを戻さない）でも二項分布を使う → ○ 母集団が小さいときは超幾何分布を使います。<\/li>\n<\/ul><\/section>","text":"一言でいうと 成功確率 のベルヌーイ試行を 回独立に繰り返したとき、「成功が何回起きたか」の分布です。 コイン投げの表の回数、検査で見つかる不良品の数など、「 回中何回」を数える場面の基本モデルです。 定義・数式 を正の整数、 とします。確率変数 の確率関数が のとき、 は二項分布に従うといい、 と書きます。 です。 項目 内容 台 パラメータ 試行回数 （正の整数）、成功確率 確率関数 期待値 分散 モーメント母関数 （すべての で存在） 確率母関数 特性関数 再生性 が共通なら （独立のとき） 他の分布との関係： 関係 内容 ベルヌーイ分布 。独立な の 個の和が ポアソン分布 を一定にして とすると に収束（少数の法則） 正規分布 が大きいとき で近似（中心極限定理） 超幾何分布 母集団が大きい非復元抽出の極限が二項分布 多項分布 多項分布の各成分の周辺分布が二項分布 ポアソン分布の条件付け 独立な で を与えると 数式の読み解き - ：特定の並び（例：成功・失敗・成功・…）が起こる確率。成功 回と失敗 回の積です。 - ：成功が 回となる並びの数。 回のうちどの 回が成功かの選び方です。 - 全確率の和が 1 になることは、二項定理 そのものです。名前の由来もここにあります。 期待値・分散（ベルヌーイの和として） （ は独立）と書けるので、 分散が単純な足し算になるのは独立だからです。 モーメント母関数から導く 独立な和の母関数は積になるので です。微分すると を代入すると なので、 再生性 と が独立なら、 で です。 が異なると積はこの形にならず、再生性は成り立ちません。 具体例 例1：フリースロー10本 成功率 30% の選手が独立に10本打つとき、成功数 です。ちょうど3本成功する確率は 2本以下の確率は です。 、 です。 例2：正規近似と連続修正 で を求めます。 、 です。 - 正確な値： - 連続修正あり： - 連続修正なし： 離散の棒を連続の曲線で近似するときは、境界を 0.5 ずらす連続修正で精度が大きく上がります。 例3：ポアソン近似 不良率 0.2% の部品を 1000 個調べるとき、不良数 です。 も正確な値 に対し、ポアソン近似 とほぼ一致します。 現場での使われ方 - 医療：新薬を投与した 人のうち効果があった人数を二項分布でモデル化し、有効率が既存薬の値を上回るかを二項検定で調べます。 - 製造・品質管理：ロットから 個を抜き取り、不良数が 個以下なら合格とする抜取検査で、合格確率（OC曲線）を二項分布で計算します。 - IT・Webサービス：広告の表示回数 とクリック数から、クリック率の信頼区間を求めます。2つの案のクリック率を比べる A/B テストも二項分布が出発点です。 - 行政・調査：世論調査で「賛成」と答えた人数を二項分布とみなし、支持率の誤差幅（例： で約 ±3%）を見積もります。 グラフ・イメージ 1つ目のグラフは、二項分布の棒に同じ平均・分散の正規分布を重ねたものです。 を増やすと形が釣り鐘型に近づきます。 を 0.05 などに下げると右に裾を引き、正規近似が悪くなることがわかります。 2つ目のグラフは、 が小さいときのポアソン近似です。点（ポアソン分布）と棒の先端の一致具合を、 と を変えて確かめてください。 試験のポイント - 期待値・分散は「ベルヌーイの和」で導くのが最短です。モーメント母関数・確率母関数による導出も途中式まで書けるようにしておきます。 - 再生性は「 が共通」のときだけ成り立ちます。 - 正規近似（連続修正つき）とポアソン近似の使い分けが重要です。目安として と がともに 5 以上なら正規近似、 が大きく が小さいならポアソン近似を使います。 - 最尤推定量は で不偏、分散は です。比率の信頼区間・検定（第9章・第11章）の土台になります。 - 最頻値は です（ が整数なら、その値と1つ小さい値の2つ）。 よくある間違い - × 分散を とする → ○ です。 になるのはポアソン分布です（ が小さいと二項分布の分散は に近くなりますが、等しくはありません）。 - × 成功確率が異なる二項分布の和も二項分布 → ○ は なら二項分布になりません。 - × 正規近似で を で計算する → ○ 連続修正で を使います。 なら です。 - × 非復元抽出（くじを戻さない）でも二項分布を使う → ○ 母集団が小さいときは超幾何分布を使います。"},"finite-population-correction":{"id":"finite-population-correction","title":"有限母集団修正","reading":"ゆうげんぼしゅうだんしゅうせい","en":"Finite population correction","aliases":["FPC","有限母集団修正項","有限修正"],"chapter":5,"importance":"B","tags":["非復元抽出","標本調査","標準誤差"],"related":["hypergeometric-distribution","simple-random-sampling","binomial-distribution","ci-proportion","stratified-sampling"],"charts":[{"type":"pmf","dist":"hypergeom","params":{"N":50,"K":20,"n":10},"sliders":[{"param":"n","label":"抽出数 n（N=50）","min":1,"max":50,"step":1}],"x":{"min":0,"max":20},"caption":"N=50（当たり20）から非復元で n 個取り出したときの当たりの数。n を N に近づけると分布が急に細くなり、n=50 で 20 に確定する。分散が (N−n)/(N−1) 倍に縮む様子にあたる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>有限の母集団から<strong>戻さずに<\/strong>標本を取るとき、標本平均や標本比率の分散を、復元抽出の場合より小さく補正するための係数です。\n母集団のかなりの割合を調べたなら、その分だけ推定は正確になる、という考え方を式にしたものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>大きさ <span class=\"math-inline\">$N$<\/span> の母集団（母平均 <span class=\"math-inline\">$\\mu$<\/span>、母分散 <span class=\"math-inline\">$\\sigma^2 = \\frac{1}{N}\\sum_{i=1}^{N}(y_i-\\mu)^2$<\/span>）から、大きさ <span class=\"math-inline\">$n$<\/span> の標本を非復元の単純無作為抽出で取ります。標本平均 <span class=\"math-inline\">$\\bar y$<\/span> について<\/p>\n<div class=\"math-display\">$$E[\\bar y] = \\mu, \\qquad V[\\bar y] = \\frac{N-n}{N-1}\\cdot\\frac{\\sigma^2}{n}$$<\/div>\n<p>が成り立ちます。この因子<\/p>\n<div class=\"math-display\">$$\\frac{N-n}{N-1}$$<\/div>\n<p>を<strong>有限母集団修正<\/strong>（FPC）といいます。<\/p>\n<p>母分散を <span class=\"math-inline\">$N-1$<\/span> で割る定義 <span class=\"math-inline\">$S^2 = \\frac{1}{N-1}\\sum_{i=1}^{N}(y_i-\\mu)^2$<\/span> を使う流儀では、同じ式が<\/p>\n<div class=\"math-display\">$$V[\\bar y] = \\left(1 - \\frac{n}{N}\\right)\\frac{S^2}{n}$$<\/div>\n<p>となります。<span class=\"math-inline\">$\\sigma^2 = \\frac{N-1}{N}S^2$<\/span> を代入すれば両者は一致します。<span class=\"math-inline\">$f = n/N$<\/span> を<strong>抽出率<\/strong>といい、<span class=\"math-inline\">$1-f$<\/span> を有限母集団修正と呼ぶこともあります。<\/p>\n<p>比率の場合（当たり <span class=\"math-inline\">$K$<\/span> 個、<span class=\"math-inline\">$p = K/N$<\/span>）は、標本比率 <span class=\"math-inline\">$\\hat p = X/n$<\/span>（<span class=\"math-inline\">$X$<\/span> は超幾何分布）について<\/p>\n<div class=\"math-display\">$$V[\\hat p] = \\frac{N-n}{N-1}\\cdot\\frac{p(1-p)}{n}$$<\/div>\n<p>です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\sigma^2/n$<\/span>：復元抽出（または無限母集団）のときの標本平均の分散。<\/li>\n<li><span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span>：非復元抽出による縮小率。<span class=\"math-inline\">$n=1$<\/span> なら 1（1個だけなら復元も非復元も同じ）、<span class=\"math-inline\">$n=N$<\/span> なら 0（全数調査なら誤差なし）です。<\/li>\n<li><span class=\"math-inline\">$N$<\/span> が <span class=\"math-inline\">$n$<\/span> に比べて十分大きいと <span class=\"math-inline\">$\\frac{N-n}{N-1} \\approx 1 - \\frac{n}{N} \\approx 1$<\/span> となり、修正は不要になります。目安として抽出率が 5% 未満なら無視されることが多いです。<\/li>\n<\/ul>\n<p><strong>導出の筋道<\/strong><\/p>\n<p>標本の <span class=\"math-inline\">$i$<\/span> 番目と <span class=\"math-inline\">$j$<\/span> 番目の値 <span class=\"math-inline\">$Y_i, Y_j$<\/span>（<span class=\"math-inline\">$i \\ne j$<\/span>）は、非復元抽出のため負の相関を持ちます。母集団全体の偏差の和が 0 であることから<\/p>\n<div class=\"math-display\">$$\\mathrm{Cov}(Y_i, Y_j) = -\\frac{\\sigma^2}{N-1}$$<\/div>\n<p>となります。これを使うと<\/p>\n<div class=\"math-display\">$$V\\!\\left[\\sum_{i=1}^{n} Y_i\\right] = n\\sigma^2 - n(n-1)\\frac{\\sigma^2}{N-1} = n\\sigma^2\\,\\frac{N-n}{N-1}$$<\/div>\n<p>で、<span class=\"math-inline\">$n^2$<\/span> で割れば <span class=\"math-inline\">$V[\\bar y]$<\/span> の式になります。超幾何分布の分散 <span class=\"math-inline\">$np(1-p)\\frac{N-n}{N-1}$<\/span> は、<span class=\"math-inline\">$y_i$<\/span> が 0 か 1 の特別な場合です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：社員の通勤時間<\/strong><\/p>\n<p>社員 1000 人（母標準偏差 <span class=\"math-inline\">$\\sigma = 20$<\/span> 分）から 100 人を非復元で選び、平均通勤時間を推定します。<\/p>\n<div class=\"math-display\">$$\\frac{N-n}{N-1} = \\frac{900}{999} \\approx 0.9009$$<\/div>\n<div class=\"math-display\">$$V[\\bar y] = 0.9009 \\times \\frac{400}{100} \\approx 3.6036, \\qquad \\text{標準誤差} \\approx 1.8983 \\text{ 分}$$<\/div>\n<p>修正しないと標準誤差は <span class=\"math-inline\">$20/\\sqrt{100} = 2$<\/span> 分です。抽出率 10% で、標準誤差が約 5% 小さくなります。<\/p>\n<p><strong>例2：小さな町の賛成率<\/strong><\/p>\n<p>有権者 500 人の町で 50 人に聞き、賛成率を推定します。真の賛成率を <span class=\"math-inline\">$p=0.3$<\/span> とすると、<\/p>\n<div class=\"math-display\">$$V[\\hat p] = \\frac{450}{499}\\times\\frac{0.3 \\times 0.7}{50} \\approx 0.003788, \\qquad \\text{標準誤差} \\approx 0.0615$$<\/div>\n<p>修正なしでは <span class=\"math-inline\">$\\sqrt{0.21/50} \\approx 0.0648$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>行政・調査<\/strong>：自治体の住民調査や事業所調査など、母集団の大きさがわかっていて抽出率が大きい調査では、標準誤差の計算に有限母集団修正を入れます。<\/li>\n<li><strong>製造・品質管理<\/strong>：数十個程度の小さなロットから多くを抜き取って検査する場合、不良率の推定精度を評価するときに使います。<\/li>\n<li><strong>会計監査<\/strong>：限られた件数の伝票から一部を抽出して誤りの総額を推定する監査サンプリングで、抽出率が大きいときに修正を入れます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$N=50$<\/span>、当たり20個の母集団から <span class=\"math-inline\">$n$<\/span> 個取り出したときの、当たりの数の分布です。\n<span class=\"math-inline\">$n$<\/span> を大きくすると、最初は二項分布と同じように幅が広がりますが、<span class=\"math-inline\">$n$<\/span> が <span class=\"math-inline\">$N$<\/span> に近づくと幅が急に縮みます。\n<span class=\"math-inline\">$n=50$<\/span> では当たりの数が 20 に確定し、分散は 0 になります。これが修正因子 <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> の効き方です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>超幾何分布の分散と単純無作為抽出の標本平均の分散の両方に、同じ因子 <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> が現れることを押さえます。<\/li>\n<li>母分散の定義（<span class=\"math-inline\">$N$<\/span> で割るか <span class=\"math-inline\">$N-1$<\/span> で割るか）によって、因子が <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> にも <span class=\"math-inline\">$1-\\frac{n}{N}$<\/span> にもなります。問題文の定義を確認します。<\/li>\n<li>抽出率が小さいときは 1 に近く、無視してよいことを数値で説明できるようにします。<\/li>\n<li>必要な標本サイズの計算でも、母集団が小さいときは修正を入れると必要数が減ります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 復元抽出でも修正を入れる → ○ 復元抽出では各回が独立なので、分散は <span class=\"math-inline\">$\\sigma^2/n$<\/span> のままです。<\/li>\n<li>× 因子を <span class=\"math-inline\">$\\frac{N-n}{N}$<\/span> と <span class=\"math-inline\">$\\sigma^2$<\/span>（<span class=\"math-inline\">$N$<\/span> で割る母分散）の組合せで使う → ○ <span class=\"math-inline\">$\\sigma^2$<\/span> には <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span>、<span class=\"math-inline\">$S^2$<\/span> には <span class=\"math-inline\">$\\frac{N-n}{N} = 1 - \\frac{n}{N}$<\/span> を組み合わせます。<\/li>\n<li>× 修正すると期待値も変わる → ○ 標本平均は非復元でも不偏です。変わるのは分散だけです。<\/li>\n<\/ul><\/section>","text":"一言でいうと 有限の母集団から戻さずに標本を取るとき、標本平均や標本比率の分散を、復元抽出の場合より小さく補正するための係数です。 母集団のかなりの割合を調べたなら、その分だけ推定は正確になる、という考え方を式にしたものです。 定義・数式 大きさ の母集団（母平均 、母分散 ）から、大きさ の標本を非復元の単純無作為抽出で取ります。標本平均 について が成り立ちます。この因子 を有限母集団修正（FPC）といいます。 母分散を で割る定義 を使う流儀では、同じ式が となります。 を代入すれば両者は一致します。 を抽出率といい、 を有限母集団修正と呼ぶこともあります。 比率の場合（当たり 個、 ）は、標本比率 （ は超幾何分布）について です。 数式の読み解き - ：復元抽出（または無限母集団）のときの標本平均の分散。 - ：非復元抽出による縮小率。 なら 1（1個だけなら復元も非復元も同じ）、 なら 0（全数調査なら誤差なし）です。 - が に比べて十分大きいと となり、修正は不要になります。目安として抽出率が 5% 未満なら無視されることが多いです。 導出の筋道 標本の 番目と 番目の値 （ ）は、非復元抽出のため負の相関を持ちます。母集団全体の偏差の和が 0 であることから となります。これを使うと で、 で割れば の式になります。超幾何分布の分散 は、 が 0 か 1 の特別な場合です。 具体例 例1：社員の通勤時間 社員 1000 人（母標準偏差 分）から 100 人を非復元で選び、平均通勤時間を推定します。 修正しないと標準誤差は 分です。抽出率 10% で、標準誤差が約 5% 小さくなります。 例2：小さな町の賛成率 有権者 500 人の町で 50 人に聞き、賛成率を推定します。真の賛成率を とすると、 修正なしでは です。 現場での使われ方 - 行政・調査：自治体の住民調査や事業所調査など、母集団の大きさがわかっていて抽出率が大きい調査では、標準誤差の計算に有限母集団修正を入れます。 - 製造・品質管理：数十個程度の小さなロットから多くを抜き取って検査する場合、不良率の推定精度を評価するときに使います。 - 会計監査：限られた件数の伝票から一部を抽出して誤りの総額を推定する監査サンプリングで、抽出率が大きいときに修正を入れます。 グラフ・イメージ 、当たり20個の母集団から 個取り出したときの、当たりの数の分布です。 を大きくすると、最初は二項分布と同じように幅が広がりますが、 が に近づくと幅が急に縮みます。 では当たりの数が 20 に確定し、分散は 0 になります。これが修正因子 の効き方です。 試験のポイント - 超幾何分布の分散と単純無作為抽出の標本平均の分散の両方に、同じ因子 が現れることを押さえます。 - 母分散の定義（ で割るか で割るか）によって、因子が にも にもなります。問題文の定義を確認します。 - 抽出率が小さいときは 1 に近く、無視してよいことを数値で説明できるようにします。 - 必要な標本サイズの計算でも、母集団が小さいときは修正を入れると必要数が減ります。 よくある間違い - × 復元抽出でも修正を入れる → ○ 復元抽出では各回が独立なので、分散は のままです。 - × 因子を と （ で割る母分散）の組合せで使う → ○ には 、 には を組み合わせます。 - × 修正すると期待値も変わる → ○ 標本平均は非復元でも不偏です。変わるのは分散だけです。"},"fisher-exact-test":{"id":"fisher-exact-test","title":"フィッシャーの正確検定","reading":"ふぃっしゃーのせいかくけんてい","en":"Fisher's exact test","aliases":["フィッシャーの直接確率検定","直接確率計算法","Fisher exact test"],"chapter":5,"importance":"B","tags":["分割表","2×2表","超幾何分布","小標本"],"related":["hypergeometric-distribution","two-by-two-table","independence-test","p-value","odds-ratio-interval","yates-correction"],"charts":[{"type":"pmf","dist":"hypergeom","params":{"N":16,"K":9,"n":8},"sliders":[{"param":"K","label":"成功の合計 a+c（N=16）","min":1,"max":15,"step":1},{"param":"n","label":"新薬群の人数 a+b","min":1,"max":15,"step":1}],"x":{"min":0,"max":15},"caption":"周辺度数を固定したときの、左上セル a の帰無分布（超幾何分布）。具体例の表では a=7 以上の棒の高さの合計が片側 p 値 0.0203 になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>2×2分割表で「2つの分類が独立か（2群の割合に差があるか）」を、近似を使わずに調べる検定です。\n表の行と列の合計を固定すると、セルの度数が超幾何分布に従うことを使って、p 値を正確に計算します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>2×2分割表を次のように書きます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>成功<\/th>\n<th>失敗<\/th>\n<th>計<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>群1<\/td>\n<td><span class=\"math-inline\">$a$<\/span><\/td>\n<td><span class=\"math-inline\">$b$<\/span><\/td>\n<td><span class=\"math-inline\">$a+b$<\/span><\/td>\n<\/tr>\n<tr>\n<td>群2<\/td>\n<td><span class=\"math-inline\">$c$<\/span><\/td>\n<td><span class=\"math-inline\">$d$<\/span><\/td>\n<td><span class=\"math-inline\">$c+d$<\/span><\/td>\n<\/tr>\n<tr>\n<td>計<\/td>\n<td><span class=\"math-inline\">$a+c$<\/span><\/td>\n<td><span class=\"math-inline\">$b+d$<\/span><\/td>\n<td><span class=\"math-inline\">$n$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>帰無仮説 <span class=\"math-inline\">$H_0$<\/span>：行の分類と列の分類は独立（2群の成功確率は等しい）。<\/p>\n<p><span class=\"math-inline\">$H_0$<\/span> のもとで、<strong>4つの周辺度数をすべて固定した条件付き分布<\/strong>を考えると、左上のセル <span class=\"math-inline\">$a$<\/span> は超幾何分布に従います。<\/p>\n<div class=\"math-display\">$$P(a) = \\frac{\\dbinom{a+b}{a}\\dbinom{c+d}{c}}{\\dbinom{n}{a+c}} = \\frac{(a+b)!\\,(c+d)!\\,(a+c)!\\,(b+d)!}{n!\\,a!\\,b!\\,c!\\,d!}$$<\/div>\n<p><span class=\"math-inline\">$a$<\/span> が決まれば <span class=\"math-inline\">$b, c, d$<\/span> も決まるので、表全体の確率がこの1つの式で表せます。<\/p>\n<p>p 値は次のように計算します。<\/p>\n<ul>\n<li><strong>片側検定<\/strong>（群1の成功が多い方向）：観測した <span class=\"math-inline\">$a$<\/span> 以上の値の確率の和 <span class=\"math-inline\">$\\sum_{k \\ge a} P(k)$<\/span>。<\/li>\n<li><strong>両側検定<\/strong>：確率が観測値の確率 <span class=\"math-inline\">$P(a)$<\/span> 以下になるすべ
