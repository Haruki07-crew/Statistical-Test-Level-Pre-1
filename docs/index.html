trong>例1：子どもの語彙数と身長<\/strong><\/p>\n<p>小学生の集団で、語彙数 <span class=\"math-inline\">$X$<\/span>、身長 <span class=\"math-inline\">$Y$<\/span>、年齢 <span class=\"math-inline\">$Z$<\/span> の相関が <span class=\"math-inline\">$r_{XY}=0.6,\\ r_{XZ}=0.7,\\ r_{YZ}=0.8$<\/span> だったとします。<\/p>\n<div class=\"math-display\">$$r_{XY\\cdot Z} = \\frac{0.6 - 0.7\\times0.8}{\\sqrt{(1-0.49)(1-0.64)}} = \\frac{0.04}{\\sqrt{0.1836}} \\approx 0.0934$$<\/div>\n<p>年齢をそろえると、語彙数と身長の相関はほぼ消えます。単相関 0.6 の大部分は年齢による擬似相関です。<\/p>\n<p><strong>例2：偏相関のほうが大きくなる場合<\/strong><\/p>\n<p><span class=\"math-inline\">$r_{XY}=0.5,\\ r_{XZ}=0.8,\\ r_{YZ}=0.3$<\/span> なら<\/p>\n<div class=\"math-display\">$$r_{XY\\cdot Z} = \\frac{0.5 - 0.24}{\\sqrt{0.36 \\times 0.91}} = \\frac{0.26}{\\sqrt{0.3276}} \\approx 0.4543$$<\/div>\n<p>です。偏相関係数は単相関より必ず小さくなるわけではありません。<\/p>\n<p><strong>例3：逆行列から求める<\/strong><\/p>\n<p>例1の相関係数行列の逆行列を計算すると、<span class=\"math-inline\">$r^{11}\\approx1.9780$<\/span>、<span class=\"math-inline\">$r^{22}\\approx2.8022$<\/span>、<span class=\"math-inline\">$r^{12}\\approx-0.2198$<\/span> です。<\/p>\n<div class=\"math-display\">$$r_{12\\cdot3} = -\\frac{-0.2198}{\\sqrt{1.9780\\times2.8022}} \\approx 0.0934$$<\/div>\n<p>となり、例1と一致します。<\/p>\n<p><strong>補足：擬似相関のモデルでは偏相関が0になる<\/strong><\/p>\n<p><span class=\"math-inline\">$Z,\\varepsilon_1,\\varepsilon_2$<\/span> が独立な標準正規分布で <span class=\"math-inline\">$X=2Z+\\varepsilon_1,\\ Y=1.5Z+\\varepsilon_2$<\/span> のとき、<span class=\"math-inline\">$r_{XZ}=2/\\sqrt5\\approx0.8944$<\/span>、<span class=\"math-inline\">$r_{YZ}=1.5/\\sqrt{3.25}\\approx0.8321$<\/span>、<span class=\"math-inline\">$r_{XY}\\approx0.7442$<\/span> です。\n<span class=\"math-inline\">$r_{XZ}r_{YZ}\\approx0.7442$<\/span> が <span class=\"math-inline\">$r_{XY}$<\/span> とぴったり一致するので、分子が0になり、偏相関係数は0です。単相関の全部が <span class=\"math-inline\">$Z$<\/span> を通じた分だったことを、公式の上でも確認できます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：ある血液検査値と病気の関係を、年齢や体格の影響を除いて評価します。<\/li>\n<li><strong>行政・調査<\/strong>：地域の指標どうしの関係を、人口規模や高齢化率を除いて比べ、見かけの関係かどうかを確かめます。<\/li>\n<li><strong>製造・品質管理<\/strong>：多数の工程変数の中から、他の変数を固定したときにも品質と関係が残る変数を探します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：多数の指標の精度行列から偏相関を計算し、「直接つながっている指標」のネットワーク図（グラフィカルモデル）を描きます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>共通要因 <span class=\"math-inline\">$Z$<\/span> が <span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> を動かす散布図です。a と b を大きくすると単相関は強くなりますが、<span class=\"math-inline\">$Z$<\/span> を除いた偏相関係数は理論上つねに 0 です。\n「見た目の相関」と「直接の関係」が違うことを確かめてください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>3変数の偏相関係数の公式に代入して計算させる問題は重要です。分子の引き算の順序と、分母の <span class=\"math-inline\">$1-r^2$<\/span> を正確に覚えます。<\/li>\n<li>「残差どうしの相関」という意味づけを説明できるようにします。<\/li>\n<li>相関係数行列の逆行列を使う表現（符号のマイナスに注意）も押さえます。<\/li>\n<li>偏相関係数の検定では、除いた変数の数を <span class=\"math-inline\">$k$<\/span> として自由度 <span class=\"math-inline\">$n-2-k$<\/span> の <span class=\"math-inline\">$t$<\/span> 統計量 <span class=\"math-inline\">$t = r\\sqrt{n-2-k}/\\sqrt{1-r^2}$<\/span> を使います。<\/li>\n<li>擬似相関のモデルでは偏相関が0、という例と組み合わせて理解します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 偏相関係数は単相関係数より常に小さい → ○ 例2のように大きくなることも、符号が反転することもあります。<\/li>\n<li>× 分子を <span class=\"math-inline\">$r_{XY} - r_{XZ} - r_{YZ}$<\/span> とする → ○ 引くのは積 <span class=\"math-inline\">$r_{XZ}r_{YZ}$<\/span> です。<\/li>\n<li>× 逆行列の成分をそのまま割って <span class=\"math-inline\">$r^{ij}/\\sqrt{r^{ii}r^{jj}}$<\/span> とする → ○ 先頭にマイナスが付きます。<\/li>\n<li>× 偏相関が0なら独立 → ○ 線形の関係が残っていないことを示すだけです。条件付き独立と同値になるのは多変量正規分布の場合です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 第三の変数 の影響を取り除いたうえで、 と の間に残る相関の強さです。 見かけの相関（擬似相関）なのか、直接の関係があるのかを見分ける手がかりになります。 定義・数式 の相関係数をそれぞれ とします（ ）。 を除いた と の偏相関係数は です。これは次の手順で求めた2つの残差どうしの相関係数と一致します。 1. を に線形回帰した残差 を求める。 2. を に線形回帰した残差 を求める。 3. と の相関係数を求める。 除く変数が複数あるときは、相関係数行列 の逆行列 を使って と書けます（「rest」は 以外のすべての変数）。 数式の読み解き - 分子 ：全体の相関 から、「 を経由して生じる分」 を引いています。 - 分母：残差の標準偏差にあたる量で、結果を から の範囲にそろえるための調整です。 - 導出の筋道：標準化した変数で、 を に回帰すると係数は なので、残差は です。同様に です。 この共分散を標準偏差の積で割ると、上の公式になります。 - 多変量正規分布では、 と「 を与えたとき と が条件付き独立」が同値です。グラフィカルモデルでは、精度行列（共分散行列の逆行列）の成分が0かどうかで辺の有無を判断します。 具体例 例1：子どもの語彙数と身長 小学生の集団で、語彙数 、身長 、年齢 の相関が だったとします。 年齢をそろえると、語彙数と身長の相関はほぼ消えます。単相関 0.6 の大部分は年齢による擬似相関です。 例2：偏相関のほうが大きくなる場合 なら です。偏相関係数は単相関より必ず小さくなるわけではありません。 例3：逆行列から求める 例1の相関係数行列の逆行列を計算すると、 、 、 です。 となり、例1と一致します。 補足：擬似相関のモデルでは偏相関が0になる が独立な標準正規分布で のとき、 、 、 です。 が とぴったり一致するので、分子が0になり、偏相関係数は0です。単相関の全部が を通じた分だったことを、公式の上でも確認できます。 現場での使われ方 - 医療：ある血液検査値と病気の関係を、年齢や体格の影響を除いて評価します。 - 行政・調査：地域の指標どうしの関係を、人口規模や高齢化率を除いて比べ、見かけの関係かどうかを確かめます。 - 製造・品質管理：多数の工程変数の中から、他の変数を固定したときにも品質と関係が残る変数を探します。 - IT・Webサービス：多数の指標の精度行列から偏相関を計算し、「直接つながっている指標」のネットワーク図（グラフィカルモデル）を描きます。 グラフ・イメージ 共通要因 が と を動かす散布図です。a と b を大きくすると単相関は強くなりますが、 を除いた偏相関係数は理論上つねに 0 です。 「見た目の相関」と「直接の関係」が違うことを確かめてください。 試験のポイント - 3変数の偏相関係数の公式に代入して計算させる問題は重要です。分子の引き算の順序と、分母の を正確に覚えます。 - 「残差どうしの相関」という意味づけを説明できるようにします。 - 相関係数行列の逆行列を使う表現（符号のマイナスに注意）も押さえます。 - 偏相関係数の検定では、除いた変数の数を として自由度 の 統計量 を使います。 - 擬似相関のモデルでは偏相関が0、という例と組み合わせて理解します。 よくある間違い - × 偏相関係数は単相関係数より常に小さい → ○ 例2のように大きくなることも、符号が反転することもあります。 - × 分子を とする → ○ 引くのは積 です。 - × 逆行列の成分をそのまま割って とする → ○ 先頭にマイナスが付きます。 - × 偏相関が0なら独立 → ○ 線形の関係が残っていないことを示すだけです。条件付き独立と同値になるのは多変量正規分布の場合です。"},"quantile-function":{"id":"quantile-function","title":"分位点関数","reading":"ぶんいてんかんすう","en":"Quantile function","aliases":["分位関数","逆累積分布関数","パーセント点","下側確率点"],"chapter":3,"importance":"B","tags":["分位点","中央値","累積分布関数","逆関数"],"related":["cumulative-distribution-function","exponential-distribution","standard-normal-distribution","normal-distribution","skewness-kurtosis"],"charts":[{"type":"cdf","dist":"expon","params":{"rate":0.5},"sliders":[{"param":"rate","label":"レート λ","min":0.1,"max":2,"step":0.1}],"x":{"min":0,"max":15},"quantile":0.9,"caption":"縦軸の 0.9 から横に線を引き、累積分布関数とぶつかった点の横座標が 90% 点。λ を小さく（平均を大きく）すると分位点は右へ動く。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「下から数えて割合 <span class=\"math-inline\">$p$<\/span> のところにある値はいくつか」を返す関数です。\n累積分布関数（値 → 確率）を逆向きにたどる（確率 → 値）ものと考えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>累積分布関数を <span class=\"math-inline\">$F(x)=P(X \\le x)$<\/span> とします。<span class=\"math-inline\">$0&lt;p&lt;1$<\/span> に対して<\/p>\n<div class=\"math-display\">$$Q(p) = F^{-1}(p) = \\inf\\{\\, x \\in \\mathbb{R} : F(x) \\ge p \\,\\}$$<\/div>\n<p>を<strong>分位点関数<\/strong>といい、<span class=\"math-inline\">$Q(p)$<\/span> を <strong><span class=\"math-inline\">$100p$<\/span>% 点<\/strong>（下側 <span class=\"math-inline\">$100p$<\/span>% 点）と呼びます。<\/p>\n<ul>\n<li><span class=\"math-inline\">$F$<\/span> が連続で狭義単調増加なら、<span class=\"math-inline\">$Q$<\/span> は通常の逆関数で、<span class=\"math-inline\">$F(Q(p))=p$<\/span> がちょうど成り立ちます。<\/li>\n<li><span class=\"math-inline\">$F$<\/span> に平らな区間や飛び（離散分布）があるときも、上の <span class=\"math-inline\">$\\inf$<\/span> による定義で一意に決まります。<\/li>\n<\/ul>\n<p>代表的な分位点には名前がついています。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><span class=\"math-inline\">$p$<\/span><\/th>\n<th>名前<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">$0.5$<\/span><\/td>\n<td>中央値（メディアン）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$0.25,\\ 0.75$<\/span><\/td>\n<td>第1四分位点、第3四分位点<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$0.01, 0.02, \\dots, 0.99$<\/span><\/td>\n<td>パーセンタイル<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>なお、検定でよく使う「上側 <span class=\"math-inline\">$100\\alpha$<\/span>% 点」<span class=\"math-inline\">$z_\\alpha$<\/span> は、<span class=\"math-inline\">$P(Z &gt; z_\\alpha)=\\alpha$<\/span> となる点で、<span class=\"math-inline\">$z_\\alpha = Q(1-\\alpha)$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$F(x) \\ge p$<\/span> となる <span class=\"math-inline\">$x$<\/span> の集まりは、右に無限に伸びる区間です。その左端（最小値）を取るのが <span class=\"math-inline\">$\\inf$<\/span> の意味です。<\/li>\n<li>離散分布では <span class=\"math-inline\">$F$<\/span> が階段状なので、ちょうど <span class=\"math-inline\">$F(x)=p$<\/span> となる <span class=\"math-inline\">$x$<\/span> がないことがあります。そのときは「初めて <span class=\"math-inline\">$p$<\/span> 以上になる値」を答えます。<\/li>\n<li><span class=\"math-inline\">$Q$<\/span> は単調非減少で、<span class=\"math-inline\">$F$<\/span> と同じく分布を完全に決めます。<\/li>\n<\/ul>\n<p><strong>指数分布の分位点の導出<\/strong>：レート <span class=\"math-inline\">$\\lambda$<\/span> の指数分布では <span class=\"math-inline\">$F(x)=1-e^{-\\lambda x}\\ (x\\ge0)$<\/span> です。<span class=\"math-inline\">$F(x)=p$<\/span> を <span class=\"math-inline\">$x$<\/span> について解くと<\/p>\n<div class=\"math-display\">$$1-e^{-\\lambda x}=p \\;\\Longrightarrow\\; e^{-\\lambda x} = 1-p \\;\\Longrightarrow\\; Q(p) = -\\frac{\\log(1-p)}{\\lambda}$$<\/div>\n<p>です。<\/p>\n<p><strong>逆変換法とのつながり<\/strong>：<span class=\"math-inline\">$U$<\/span> が <span class=\"math-inline\">$(0,1)$<\/span> 上の一様分布なら、<span class=\"math-inline\">$Q(U)$<\/span> は累積分布関数 <span class=\"math-inline\">$F$<\/span> を持つ分布に従います。乱数生成の「逆関数法」はこの性質を使います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：窓口の待ち時間<\/strong><\/p>\n<p>ある窓口の待ち時間が平均2分の指数分布（<span class=\"math-inline\">$\\lambda=0.5$<\/span>）に従うとします。<\/p>\n<div class=\"math-display\">$$Q(0.5) = 2\\log 2 \\approx 1.3863, \\qquad Q(0.9) = 2\\log 10 \\approx 4.6052$$<\/div>\n<p>中央値は約1.39分で、平均の2分より小さくなります。また、9割の客は約4.61分以内に呼ばれます。<\/p>\n<p><strong>例2：サイコロの中央値<\/strong><\/p>\n<p>サイコロの目では <span class=\"math-inline\">$F(2)=2/6&lt;0.5$<\/span>、<span class=\"math-inline\">$F(3)=3/6=0.5$<\/span> なので、定義どおり <span class=\"math-inline\">$Q(0.5)=3$<\/span> です。<span class=\"math-inline\">$F(x)=0.5$<\/span> となる <span class=\"math-inline\">$x$<\/span> は <span class=\"math-inline\">$3 \\le x &lt; 4$<\/span> の区間全体ですが、<span class=\"math-inline\">$\\inf$<\/span> を取るので <span class=\"math-inline\">$3$<\/span> に決まります。<\/p>\n<p><strong>例3：標準正規分布<\/strong><\/p>\n<p><span class=\"math-inline\">$\\Phi$<\/span> を標準正規分布の累積分布関数とすると、<span class=\"math-inline\">$Q(0.975) \\approx 1.9600$<\/span>、<span class=\"math-inline\">$Q(0.95) \\approx 1.6449$<\/span> です。両側5%検定の棄却限界 <span class=\"math-inline\">$\\pm1.96$<\/span> や、95% 信頼区間の係数はこの値です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：子どもの身長・体重の成長曲線は、年齢ごとの3、10、50、90、97 パーセンタイルの線で描かれます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：応答時間の評価では平均より「95 パーセンタイル（p95）」や「p99」を目標値に設定します。一部の遅いリクエストを見逃さないためです。<\/li>\n<li><strong>金融・保険<\/strong>：損失分布の 99% 点を VaR（バリュー・アット・リスク）として、必要な資本の目安にします。<\/li>\n<li><strong>製造・品質管理<\/strong>：保証期間を「故障が1%以下で収まる時間（1% 点）」として決めます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>指数分布の累積分布関数と、縦軸 0.9 の水平線が曲線とぶつかる点（90% 点）を表示しています。\nλ を小さくすると曲線がゆっくり立ち上がり、90% 点は右へ移動します。縦軸から横軸へたどる向きが分位点関数です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>上側 <span class=\"math-inline\">$100\\alpha$<\/span>% 点と下側 <span class=\"math-inline\">$100p$<\/span>% 点の対応 <span class=\"math-inline\">$z_\\alpha=Q(1-\\alpha)$<\/span> を取り違えないことが重要です。数表がどちらの向きかを必ず確認します。<\/li>\n<li>対称な分布では <span class=\"math-inline\">$Q(p) = -Q(1-p)$<\/span>（中心が0のとき）です。<span class=\"math-inline\">$t$<\/span> 分布や標準正規分布の下側の点は、上側の点に負号をつけて求めます。<\/li>\n<li>指数分布・ワイブル分布・一様分布など、<span class=\"math-inline\">$F$<\/span> が閉じた形で書ける分布の分位点（特に中央値）を求めさせる計算は重要です。<\/li>\n<li><span class=\"math-inline\">$Y=g(X)$<\/span> で <span class=\"math-inline\">$g$<\/span> が単調増加なら、<span class=\"math-inline\">$Y$<\/span> の分位点は <span class=\"math-inline\">$g(Q_X(p))$<\/span> です。対数正規分布の中央値 <span class=\"math-inline\">$e^{\\mu}$<\/span> はこれで求まります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 中央値は平均と同じ → ○ 右に裾の長い分布（指数分布など）では中央値 &lt; 平均です。一致するのは対称な分布などに限られます。<\/li>\n<li>× 「上側5%点」を <span class=\"math-inline\">$Q(0.05)$<\/span> とする → ○ 上側5%点は <span class=\"math-inline\">$Q(0.95)$<\/span> です。<\/li>\n<li>× 離散分布で <span class=\"math-inline\">$F(x)=p$<\/span> を満たす <span class=\"math-inline\">$x$<\/span> を探して「解なし」とする → ○ <span class=\"math-inline\">$F(x)\\ge p$<\/span> となる最小の <span class=\"math-inline\">$x$<\/span> を答えます。<\/li>\n<li>× <span class=\"math-inline\">$g$<\/span> が単調減少でも <span class=\"math-inline\">$Q_Y(p)=g(Q_X(p))$<\/span> とする → ○ 減少関数では向きが反転し、<span class=\"math-inline\">$Q_Y(p)=g(Q_X(1-p))$<\/span> になります。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「下から数えて割合 のところにある値はいくつか」を返す関数です。 累積分布関数（値 → 確率）を逆向きにたどる（確率 → 値）ものと考えます。 定義・数式 累積分布関数を とします。 に対して を分位点関数といい、 を % 点（下側 % 点）と呼びます。 - が連続で狭義単調増加なら、 は通常の逆関数で、 がちょうど成り立ちます。 - に平らな区間や飛び（離散分布）があるときも、上の による定義で一意に決まります。 代表的な分位点には名前がついています。 名前 中央値（メディアン） 第1四分位点、第3四分位点 パーセンタイル なお、検定でよく使う「上側 % 点」 は、 となる点で、 です。 数式の読み解き - となる の集まりは、右に無限に伸びる区間です。その左端（最小値）を取るのが の意味です。 - 離散分布では が階段状なので、ちょうど となる がないことがあります。そのときは「初めて 以上になる値」を答えます。 - は単調非減少で、 と同じく分布を完全に決めます。 指数分布の分位点の導出：レート の指数分布では です。 を について解くと です。 逆変換法とのつながり： が 上の一様分布なら、 は累積分布関数 を持つ分布に従います。乱数生成の「逆関数法」はこの性質を使います。 具体例 例1：窓口の待ち時間 ある窓口の待ち時間が平均2分の指数分布（ ）に従うとします。 中央値は約1.39分で、平均の2分より小さくなります。また、9割の客は約4.61分以内に呼ばれます。 例2：サイコロの中央値 サイコロの目では 、 なので、定義どおり です。 となる は の区間全体ですが、 を取るので に決まります。 例3：標準正規分布 を標準正規分布の累積分布関数とすると、 、 です。両側5%検定の棄却限界 や、95% 信頼区間の係数はこの値です。 現場での使われ方 - 医療：子どもの身長・体重の成長曲線は、年齢ごとの3、10、50、90、97 パーセンタイルの線で描かれます。 - IT・Webサービス：応答時間の評価では平均より「95 パーセンタイル（p95）」や「p99」を目標値に設定します。一部の遅いリクエストを見逃さないためです。 - 金融・保険：損失分布の 99% 点を VaR（バリュー・アット・リスク）として、必要な資本の目安にします。 - 製造・品質管理：保証期間を「故障が1%以下で収まる時間（1% 点）」として決めます。 グラフ・イメージ 指数分布の累積分布関数と、縦軸 0.9 の水平線が曲線とぶつかる点（90% 点）を表示しています。 λ を小さくすると曲線がゆっくり立ち上がり、90% 点は右へ移動します。縦軸から横軸へたどる向きが分位点関数です。 試験のポイント - 上側 % 点と下側 % 点の対応 を取り違えないことが重要です。数表がどちらの向きかを必ず確認します。 - 対称な分布では （中心が0のとき）です。 分布や標準正規分布の下側の点は、上側の点に負号をつけて求めます。 - 指数分布・ワイブル分布・一様分布など、 が閉じた形で書ける分布の分位点（特に中央値）を求めさせる計算は重要です。 - で が単調増加なら、 の分位点は です。対数正規分布の中央値 はこれで求まります。 よくある間違い - × 中央値は平均と同じ → ○ 右に裾の長い分布（指数分布など）では中央値 < 平均です。一致するのは対称な分布などに限られます。 - × 「上側5%点」を とする → ○ 上側5%点は です。 - × 離散分布で を満たす を探して「解なし」とする → ○ となる最小の を答えます。 - × が単調減少でも とする → ○ 減少関数では向きが反転し、 になります。"},"skewness-kurtosis":{"id":"skewness-kurtosis","title":"歪度と尖度","reading":"わいどとせんど","en":"Skewness and kurtosis","aliases":["歪度","尖度","超過尖度","わい度","せん度"],"chapter":3,"importance":"B","tags":["モーメント","分布の形","正規性"],"related":["expectation-variance-properties","moment-generating-function","normal-distribution","t-distribution","gamma-distribution","coefficient-of-variation"],"charts":[{"type":"pdf","dist":"gamma","params":{"shape":2,"scale":1},"sliders":[{"param":"shape","label":"形状 k（歪度 = 2/√k）","min":0.5,"max":30,"step":0.5}],"x":{"min":0,"max":40},"compare":[{"dist":"norm","params":{"mu":2,"sigma":1.414},"label":"同じ平均・分散の正規分布（k=2）"}],"caption":"ガンマ分布は右に裾が長く、歪度 2/√k は正。k を大きくすると左右対称に近づき、歪度は 0 に近づく。"},{"type":"pdf","dist":"t","params":{"df":5},"sliders":[{"param":"df","label":"自由度 ν","min":5,"max":50,"step":1}],"x":{"min":-6,"max":6},"compare":[{"dist":"norm","params":{"mu":0,"sigma":1},"label":"標準正規分布"}],"caption":"t 分布は正規分布より裾が重く、尖度が大きい（ν>4 で超過尖度 6/(ν−4)）。ν を大きくすると正規分布に近づく。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>歪度は分布の<strong>左右の非対称さ<\/strong>、尖度は分布の<strong>裾の重さ（とがり具合）<\/strong>を表す数値です。\n平均と分散だけではわからない「分布の形」を、3次・4次のモーメントで要約します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>平均 <span class=\"math-inline\">$\\mu$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma&gt;0$<\/span> の確率変数 <span class=\"math-inline\">$X$<\/span> について（必要な次数のモーメントが存在するとき）<\/p>\n<div class=\"math-display\">$$\\text{歪度}\\ \\ \\beta_1 = \\frac{E[(X-\\mu)^3]}{\\sigma^3}, \\qquad\n\\text{尖度}\\ \\ \\beta_2 = \\frac{E[(X-\\mu)^4]}{\\sigma^4}$$<\/div>\n<p>です。正規分布では <span class=\"math-inline\">$\\beta_1=0,\\ \\beta_2=3$<\/span> です。<\/p>\n<p><strong>流儀の違い<\/strong>：本項目では尖度を上の <span class=\"math-inline\">$\\beta_2$<\/span>（正規分布で3）で定義します。正規分布を0とするため3を引いた <span class=\"math-inline\">$\\beta_2-3$<\/span> を<strong>超過尖度<\/strong>といい、これを単に「尖度」と呼ぶ本やソフトウェアも多くあります。どちらの定義かを必ず確認してください。<\/p>\n<p>データ <span class=\"math-inline\">$x_1,\\dots,x_n$<\/span> では、<span class=\"math-inline\">$\\bar x$<\/span> と <span class=\"math-inline\">$s=\\sqrt{\\frac1n\\sum(x_i-\\bar x)^2}$<\/span> を使って <span class=\"math-inline\">$\\frac1n\\sum(x_i-\\bar x)^3/s^3$<\/span> などとします（不偏性を補正した式もあります）。<\/p>\n<p>代表的な分布の値：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>分布<\/th>\n<th>歪度<\/th>\n<th>尖度 <span class=\"math-inline\">$\\beta_2$<\/span>（超過尖度）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>正規分布<\/td>\n<td>0<\/td>\n<td>3（0）<\/td>\n<\/tr>\n<tr>\n<td>一様分布<\/td>\n<td>0<\/td>\n<td>1.8（−1.2）<\/td>\n<\/tr>\n<tr>\n<td>指数分布<\/td>\n<td>2<\/td>\n<td>9（6）<\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布 <span class=\"math-inline\">$Po(\\lambda)$<\/span><\/td>\n<td><span class=\"math-inline\">$1/\\sqrt{\\lambda}$<\/span><\/td>\n<td><span class=\"math-inline\">$3+1/\\lambda$<\/span>（<span class=\"math-inline\">$1/\\lambda$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>ガンマ分布（形状 <span class=\"math-inline\">$k$<\/span>）<\/td>\n<td><span class=\"math-inline\">$2/\\sqrt{k}$<\/span><\/td>\n<td><span class=\"math-inline\">$3+6/k$<\/span>（<span class=\"math-inline\">$6/k$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$t$<\/span> 分布（自由度 <span class=\"math-inline\">$\\nu$<\/span>）<\/td>\n<td>0（<span class=\"math-inline\">$\\nu&gt;3$<\/span>）<\/td>\n<td><span class=\"math-inline\">$3+6/(\\nu-4)$<\/span>（<span class=\"math-inline\">$\\nu&gt;4$<\/span>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>偏差を3乗すると符号が残ります。右に長い裾（大きな正の偏差）があると3乗で強調され、歪度は正になります。左に裾が長ければ負です。<\/li>\n<li>4乗は常に正で、平均から遠い値ほど極端に大きく効きます。尖度は「外れた値がどれだけ出やすいか」をよく反映します。<\/li>\n<li><span class=\"math-inline\">$\\sigma^3$<\/span>、<span class=\"math-inline\">$\\sigma^4$<\/span> で割るのは、単位をなくして尺度によらない値にするためです。<span class=\"math-inline\">$aX+b\\ (a&gt;0)$<\/span> と変換しても歪度・尖度は変わりません。<\/li>\n<li>キュムラント <span class=\"math-inline\">$\\kappa_r$<\/span> を使うと、歪度は <span class=\"math-inline\">$\\kappa_3/\\kappa_2^{3/2}$<\/span>、超過尖度は <span class=\"math-inline\">$\\kappa_4/\\kappa_2^2$<\/span> です。キュムラント母関数から求めると計算が楽になることがあります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：まれに大きな値をとる分布<\/strong><\/p>\n<p><span class=\"math-inline\">$X$<\/span> が確率 0.8 で 0、確率 0.2 で 5 をとるとします。<span class=\"math-inline\">$\\mu = 1$<\/span>、<span class=\"math-inline\">$\\sigma^2 = 0.8\\times1 + 0.2\\times16 = 4$<\/span>、<span class=\"math-inline\">$\\sigma=2$<\/span> です。<\/p>\n<div class=\"math-display\">$$E[(X-\\mu)^3] = 0.8\\times(-1)^3 + 0.2\\times4^3 = 12, \\qquad \\beta_1 = \\frac{12}{2^3} = 1.5$$<\/div>\n<div class=\"math-display\">$$E[(X-\\mu)^4] = 0.8\\times1 + 0.2\\times4^4 = 52, \\qquad \\beta_2 = \\frac{52}{2^4} = 3.25$$<\/div>\n<p>まれに大きな値をとるので歪度は正で、尖度は正規分布の3を少し上回ります。<\/p>\n<p><strong>例2：ポアソン分布<\/strong><\/p>\n<p><span class=\"math-inline\">$Po(4)$<\/span> の歪度は <span class=\"math-inline\">$1/\\sqrt4 = 0.5$<\/span>、超過尖度は <span class=\"math-inline\">$1/4 = 0.25$<\/span> です。<span class=\"math-inline\">$\\lambda$<\/span> が大きくなるほど0に近づき、正規分布に近づくことがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：収益率の分布は正規分布より裾が重い（尖度が3より大きい）ことが多く、正規分布を仮定すると大損失の確率を過小評価します。尖度でその程度を確認します。<\/li>\n<li><strong>製造・品質管理<\/strong>：工程能力指数は正規分布を前提にしているので、歪度・尖度で前提から外れていないかを確認します。<\/li>\n<li><strong>医療<\/strong>：検査値の分布が強く右に歪んでいれば、対数変換してから解析する判断材料にします。<\/li>\n<li><strong>行政・調査<\/strong>：所得の分布は右に大きく歪むため、平均ではなく中央値で代表値を示す理由づけになります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>上のグラフはガンマ分布と、同じ平均・分散の正規分布（k=2 のとき）です。k を大きくすると右の裾が短くなり、歪度 <span class=\"math-inline\">$2/\\sqrt{k}$<\/span> が0に近づきます。\n下のグラフは t 分布と標準正規分布です。自由度が小さいほど中心がとがり裾が厚くなり、尖度が大きくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>3次・4次の中心モーメントの計算は、<span class=\"math-inline\">$E[X^3]$<\/span> などの原点まわりのモーメントから展開して求めることがあります。例えば <span class=\"math-inline\">$E[(X-\\mu)^3] = E[X^3] - 3\\mu E[X^2] + 2\\mu^3$<\/span> です。<\/li>\n<li>尖度の定義（正規分布で3か0か）を必ず確認します。<\/li>\n<li>ジャック・ベラ検定など、歪度と尖度を組み合わせた正規性の検定の考え方につながります。<\/li>\n<li>指数分布・ポアソン分布など、主要な分布の歪度・尖度をモーメント母関数（キュムラント）から求めさせる形が重要です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 歪度が正なら山の頂上が右にある → ○ 歪度が正のとき、長いのは<strong>右の裾<\/strong>で、山の頂上（最頻値）はむしろ左に寄ります。一般に最頻値 &lt; 中央値 &lt; 平均の順になりやすくなります。<\/li>\n<li>× 尖度は山の高さを表す → ○ 尖度は主に裾の重さ（外れ値の出やすさ）を表す量です。分散でそろえたうえでの比較である点にも注意します。<\/li>\n<li>× 超過尖度と尖度を混同して「正規分布の尖度は0」と「3」を取り違える → ○ 定義を確認し、必要なら3を足し引きします。<\/li>\n<li>× 歪度が0なら左右対称 → ○ 対称なら歪度は0ですが、逆は成り立ちません。<\/li>\n<\/ul><\/section>","text":"一言でいうと 歪度は分布の左右の非対称さ、尖度は分布の裾の重さ（とがり具合）を表す数値です。 平均と分散だけではわからない「分布の形」を、3次・4次のモーメントで要約します。 定義・数式 平均 、標準偏差 の確率変数 について（必要な次数のモーメントが存在するとき） です。正規分布では です。 流儀の違い：本項目では尖度を上の （正規分布で3）で定義します。正規分布を0とするため3を引いた を超過尖度といい、これを単に「尖度」と呼ぶ本やソフトウェアも多くあります。どちらの定義かを必ず確認してください。 データ では、 と を使って などとします（不偏性を補正した式もあります）。 代表的な分布の値： 分布 歪度 尖度 （超過尖度） 正規分布 0 3（0） 一様分布 0 1.8（−1.2） 指数分布 2 9（6） ポアソン分布 （ ） ガンマ分布（形状 ） （ ） 分布（自由度 ） 0（ ） （ ） 数式の読み解き - 偏差を3乗すると符号が残ります。右に長い裾（大きな正の偏差）があると3乗で強調され、歪度は正になります。左に裾が長ければ負です。 - 4乗は常に正で、平均から遠い値ほど極端に大きく効きます。尖度は「外れた値がどれだけ出やすいか」をよく反映します。 - 、 で割るのは、単位をなくして尺度によらない値にするためです。 と変換しても歪度・尖度は変わりません。 - キュムラント を使うと、歪度は 、超過尖度は です。キュムラント母関数から求めると計算が楽になることがあります。 具体例 例1：まれに大きな値をとる分布 が確率 0.8 で 0、確率 0.2 で 5 をとるとします。 、 、 です。 まれに大きな値をとるので歪度は正で、尖度は正規分布の3を少し上回ります。 例2：ポアソン分布 の歪度は 、超過尖度は です。 が大きくなるほど0に近づき、正規分布に近づくことがわかります。 現場での使われ方 - 金融・保険：収益率の分布は正規分布より裾が重い（尖度が3より大きい）ことが多く、正規分布を仮定すると大損失の確率を過小評価します。尖度でその程度を確認します。 - 製造・品質管理：工程能力指数は正規分布を前提にしているので、歪度・尖度で前提から外れていないかを確認します。 - 医療：検査値の分布が強く右に歪んでいれば、対数変換してから解析する判断材料にします。 - 行政・調査：所得の分布は右に大きく歪むため、平均ではなく中央値で代表値を示す理由づけになります。 グラフ・イメージ 上のグラフはガンマ分布と、同じ平均・分散の正規分布（k=2 のとき）です。k を大きくすると右の裾が短くなり、歪度 が0に近づきます。 下のグラフは t 分布と標準正規分布です。自由度が小さいほど中心がとがり裾が厚くなり、尖度が大きくなります。 試験のポイント - 3次・4次の中心モーメントの計算は、 などの原点まわりのモーメントから展開して求めることがあります。例えば です。 - 尖度の定義（正規分布で3か0か）を必ず確認します。 - ジャック・ベラ検定など、歪度と尖度を組み合わせた正規性の検定の考え方につながります。 - 指数分布・ポアソン分布など、主要な分布の歪度・尖度をモーメント母関数（キュムラント）から求めさせる形が重要です。 よくある間違い - × 歪度が正なら山の頂上が右にある → ○ 歪度が正のとき、長いのは右の裾で、山の頂上（最頻値）はむしろ左に寄ります。一般に最頻値 < 中央値 < 平均の順になりやすくなります。 - × 尖度は山の高さを表す → ○ 尖度は主に裾の重さ（外れ値の出やすさ）を表す量です。分散でそろえたうえでの比較である点にも注意します。 - × 超過尖度と尖度を混同して「正規分布の尖度は0」と「3」を取り違える → ○ 定義を確認し、必要なら3を足し引きします。 - × 歪度が0なら左右対称 → ○ 対称なら歪度は0ですが、逆は成り立ちません。"},"spurious-correlation":{"id":"spurious-correlation","title":"擬似相関","reading":"ぎじそうかん","en":"Spurious correlation","aliases":["見かけの相関","疑似相関","交絡"],"chapter":3,"importance":"B","tags":["相関","因果","交絡","第三の変数"],"related":["covariance-and-correlation","partial-correlation-coefficient","conditional-independence","correlation-matrix"],"charts":[{"type":"scatter","model":"spurious","params":{"a":1.5,"b":1.5,"n":300},"sliders":[{"param":"a","label":"Z が X に与える影響 a","min":0,"max":3,"step":0.1},{"param":"b","label":"Z が Y に与える影響 b","min":0,"max":3,"step":0.1},{"param":"n","label":"点の数 n","min":50,"max":1000,"step":50}],"caption":"X と Y は直接にはつながっていないが、共通要因 Z が両方を動かすため、X と Y の散布図に右上がりの相関が現れる。a か b を 0 にすると相関は消える。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>2つの量の間に直接の関係がないのに、両方に影響する<strong>第三の変数<\/strong>（共通要因）があるために、見かけ上の相関が現れることです。\n「相関があること」と「一方が他方の原因であること」は別だ、という注意を表す言葉です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X, Y$<\/span> に相関があるが、その相関がもっぱら別の変数 <span class=\"math-inline\">$Z$<\/span> を通じて生じているとき、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の相関を<strong>擬似相関<\/strong>といいます。\n典型的なモデルは、<span class=\"math-inline\">$Z,\\ \\varepsilon_1,\\ \\varepsilon_2$<\/span> を互いに独立として<\/p>\n<div class=\"math-display\">$$X = aZ + \\varepsilon_1, \\qquad Y = bZ + \\varepsilon_2$$<\/div>\n<p>という形です。<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の間に直接の項はありませんが、<\/p>\n<div class=\"math-display\">$$\\mathrm{Cov}[X, Y] = ab\\,V[Z]$$<\/div>\n<p>となり、<span class=\"math-inline\">$ab \\neq 0$<\/span> なら相関が生じます。<span class=\"math-inline\">$V[Z]=V[\\varepsilon_1]=V[\\varepsilon_2]=1$<\/span> のときは<\/p>\n<div class=\"math-display\">$$\\rho_{XY} = \\frac{ab}{\\sqrt{(a^2+1)(b^2+1)}}$$<\/div>\n<p>です。一方、<span class=\"math-inline\">$Z$<\/span> の値を固定すると <span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> は独立（条件付き独立）になり、<span class=\"math-inline\">$Z$<\/span> を除いた<strong>偏相関係数<\/strong>は <span class=\"math-inline\">$0$<\/span> になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>共分散の計算は、独立な項どうしの共分散が0になることを使います。<\/li>\n<\/ul>\n<div class=\"math-display\">$$\\mathrm{Cov}[aZ+\\varepsilon_1,\\ bZ+\\varepsilon_2] = ab\\,\\mathrm{Cov}[Z,Z] + 0 = ab\\,V[Z]$$<\/div>\n<ul>\n<li><span class=\"math-inline\">$a$<\/span> と <span class=\"math-inline\">$b$<\/span> の符号が同じなら正の相関、違えば負の相関になります。<\/li>\n<li><span class=\"math-inline\">$Z$<\/span> の影響が誤差に比べて大きい（<span class=\"math-inline\">$|a|, |b|$<\/span> が大きい）ほど、見かけの相関は強くなります。<\/li>\n<li><span class=\"math-inline\">$Z$<\/span> を観測していれば、偏相関係数や <span class=\"math-inline\">$Z$<\/span> を説明変数に加えた回帰で、<span class=\"math-inline\">$Z$<\/span> の影響を取り除いた関係を調べられます。<span class=\"math-inline\">$Z$<\/span> を観測していないと、データだけでは擬似相関と因果を区別できません。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：アイスクリームと水難事故<\/strong><\/p>\n<p>夏に向けて、アイスクリームの売上と水難事故の件数はどちらも増えます。両者には正の相関が見られますが、アイスクリームが事故を起こすわけではありません。共通要因は「気温（季節）」です。気温が同じ日どうしで比べると、相関はほとんど消えます。<\/p>\n<p><strong>例2：数値で確かめる<\/strong><\/p>\n<p><span class=\"math-inline\">$Z, \\varepsilon_1, \\varepsilon_2$<\/span> を独立な標準正規分布とし、<span class=\"math-inline\">$a=2,\\ b=1.5$<\/span> とします。<\/p>\n<div class=\"math-display\">$$\\rho_{XY} = \\frac{2 \\times 1.5}{\\sqrt{(4+1)(2.25+1)}} = \\frac{3}{\\sqrt{16.25}} \\approx 0.7442$$<\/div>\n<p>直接の関係がまったくないのに、相関係数は約 0.74 にもなります。一方、<span class=\"math-inline\">$Z$<\/span> で条件づけた偏相関係数は <span class=\"math-inline\">$0$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：ある生活習慣と病気の相関を見るときは、年齢・喫煙などの交絡因子を調整してから評価します。調整しないと誤った健康指導につながります。<\/li>\n<li><strong>マーケティング<\/strong>：「アプリをよく開く人ほど購入額が多い」という相関があっても、もともと熱心な顧客が両方をしているだけかもしれません。施策の効果はランダム化した実験（A/Bテスト）で確かめます。<\/li>\n<li><strong>行政・調査<\/strong>：地域別データで2つの指標に相関が出ても、人口規模や年齢構成という共通要因で説明できることがあります。人口あたりの率に直す、層別するなどで確認します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>共通要因 <span class=\"math-inline\">$Z$<\/span> から <span class=\"math-inline\">$X, Y$<\/span> を作った散布図です。a と b を大きくすると、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> には直接のつながりがないのに右上がりの相関がはっきり現れます。\na か b を 0 にすると、相関は消えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>「擬似相関」「交絡」「偏相関係数」はセットで重要です。擬似相関の説明として、偏相関係数を計算して0に近くなることを確かめる流れが典型です。<\/li>\n<li>モデル <span class=\"math-inline\">$X=aZ+\\varepsilon_1,\\ Y=bZ+\\varepsilon_2$<\/span> の共分散・相関係数を、共分散の双線形性で計算できるようにします。<\/li>\n<li>層別（<span class=\"math-inline\">$Z$<\/span> の値ごとに分ける）すると相関が消える、あるいは逆転する（シンプソンのパラドックス）現象も、同じ構造で説明できます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 相関係数が大きいので因果関係がある → ○ 共通要因、逆向きの因果、偶然（多数の組合せを調べた結果）の可能性を検討します。<\/li>\n<li>× 擬似相関は「計算の誤り」で、相関係数そのものが間違っている → ○ 相関係数は正しく計算されています。誤りはその解釈（因果とみなすこと）にあります。<\/li>\n<li>× 変数をたくさん調整すればするほどよい → ○ 原因と結果の間にある変数（中間変数）や、結果から影響を受ける変数を調整すると、かえって偏りが生じます。何を調整するかは因果の構造で決めます。<\/li>\n<\/ul><\/section>","text":"一言でいうと 2つの量の間に直接の関係がないのに、両方に影響する第三の変数（共通要因）があるために、見かけ上の相関が現れることです。 「相関があること」と「一方が他方の原因であること」は別だ、という注意を表す言葉です。 定義・数式 確率変数 に相関があるが、その相関がもっぱら別の変数 を通じて生じているとき、 と の相関を擬似相関といいます。 典型的なモデルは、 を互いに独立として という形です。 と の間に直接の項はありませんが、 となり、 なら相関が生じます。 のときは です。一方、 の値を固定すると と は独立（条件付き独立）になり、 を除いた偏相関係数は になります。 数式の読み解き - 共分散の計算は、独立な項どうしの共分散が0になることを使います。 - と の符号が同じなら正の相関、違えば負の相関になります。 - の影響が誤差に比べて大きい（ が大きい）ほど、見かけの相関は強くなります。 - を観測していれば、偏相関係数や を説明変数に加えた回帰で、 の影響を取り除いた関係を調べられます。 を観測していないと、データだけでは擬似相関と因果を区別できません。 具体例 例1：アイスクリームと水難事故 夏に向けて、アイスクリームの売上と水難事故の件数はどちらも増えます。両者には正の相関が見られますが、アイスクリームが事故を起こすわけではありません。共通要因は「気温（季節）」です。気温が同じ日どうしで比べると、相関はほとんど消えます。 例2：数値で確かめる を独立な標準正規分布とし、 とします。 直接の関係がまったくないのに、相関係数は約 0.74 にもなります。一方、 で条件づけた偏相関係数は です。 現場での使われ方 - 医療：ある生活習慣と病気の相関を見るときは、年齢・喫煙などの交絡因子を調整してから評価します。調整しないと誤った健康指導につながります。 - マーケティング：「アプリをよく開く人ほど購入額が多い」という相関があっても、もともと熱心な顧客が両方をしているだけかもしれません。施策の効果はランダム化した実験（A/Bテスト）で確かめます。 - 行政・調査：地域別データで2つの指標に相関が出ても、人口規模や年齢構成という共通要因で説明できることがあります。人口あたりの率に直す、層別するなどで確認します。 グラフ・イメージ 共通要因 から を作った散布図です。a と b を大きくすると、 と には直接のつながりがないのに右上がりの相関がはっきり現れます。 a か b を 0 にすると、相関は消えます。 試験のポイント - 「擬似相関」「交絡」「偏相関係数」はセットで重要です。擬似相関の説明として、偏相関係数を計算して0に近くなることを確かめる流れが典型です。 - モデル の共分散・相関係数を、共分散の双線形性で計算できるようにします。 - 層別（ の値ごとに分ける）すると相関が消える、あるいは逆転する（シンプソンのパラドックス）現象も、同じ構造で説明できます。 よくある間違い - × 相関係数が大きいので因果関係がある → ○ 共通要因、逆向きの因果、偶然（多数の組合せを調べた結果）の可能性を検討します。 - × 擬似相関は「計算の誤り」で、相関係数そのものが間違っている → ○ 相関係数は正しく計算されています。誤りはその解釈（因果とみなすこと）にあります。 - × 変数をたくさん調整すればするほどよい → ○ 原因と結果の間にある変数（中間変数）や、結果から影響を受ける変数を調整すると、かえって偏りが生じます。何を調整するかは因果の構造で決めます。"},"variance-covariance-matrix":{"id":"variance-covariance-matrix","title":"分散共分散行列","reading":"ぶんさんきょうぶんさんぎょうれつ","en":"Variance-covariance matrix","aliases":["共分散行列","分散行列"],"chapter":3,"importance":"A","tags":["多変量","行列","共分散","半正定値"],"related":["mean-vector","correlation-matrix","covariance-and-correlation","expectation-variance-properties","multivariate-normal-distribution","partial-correlation-coefficient"],"charts":[{"type":"scatter","model":"bvnorm","params":{"rho":0.5,"n":300},"sliders":[{"param":"rho","label":"相関係数 ρ（非対角成分）","min":-0.95,"max":0.95,"step":0.05},{"param":"n","label":"点の数 n","min":50,"max":1000,"step":50}],"caption":"分散共分散行列が点の雲の形（楕円の向きと細さ）を決める。非対角成分が正なら右上がり、負なら右下がりの楕円になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>複数の確率変数について、各変数の分散と、すべての組の共分散を1つの行列にまとめたものです。\n多変量データの「広がり方と向き」を表し、線形変換したときの分散を行列の計算で一気に求められます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率ベクトル <span class=\"math-inline\">$\\boldsymbol{X}=(X_1,\\dots,X_p)^\\top$<\/span>、期待値ベクトル <span class=\"math-inline\">$\\boldsymbol{\\mu}$<\/span> について、<strong>分散共分散行列<\/strong>は<\/p>\n<div class=\"math-display\">$$\\Sigma = V[\\boldsymbol{X}] = E\\big[(\\boldsymbol{X}-\\boldsymbol{\\mu})(\\boldsymbol{X}-\\boldsymbol{\\mu})^\\top\\big]\n= \\begin{pmatrix}\n\\sigma_{11} &amp; \\sigma_{12} &amp; \\cdots &amp; \\sigma_{1p} \\\\\n\\sigma_{21} &amp; \\sigma_{22} &amp; \\cdots &amp; \\sigma_{2p} \\\\\n\\vdots &amp; &amp; \\ddots &amp; \\vdots \\\\\n\\sigma_{p1} &amp; \\sigma_{p2} &amp; \\cdots &amp; \\sigma_{pp}\n\\end{pmatrix}$$<\/div>\n<p>です。<span class=\"math-inline\">$\\sigma_{ii}=V[X_i]$<\/span>、<span class=\"math-inline\">$\\sigma_{ij}=\\mathrm{Cov}[X_i,X_j]$<\/span> です（各成分の分散が有限であるとき）。<span class=\"math-inline\">$\\Sigma = E[\\boldsymbol{X}\\boldsymbol{X}^\\top] - \\boldsymbol{\\mu}\\boldsymbol{\\mu}^\\top$<\/span> とも書けます。<\/p>\n<p>主な性質：<\/p>\n<ul>\n<li><strong>対称<\/strong>：<span class=\"math-inline\">$\\Sigma^\\top = \\Sigma$<\/span><\/li>\n<li><strong>半正定値<\/strong>：任意のベクトル <span class=\"math-inline\">$\\boldsymbol{a}$<\/span> で <span class=\"math-inline\">$\\boldsymbol{a}^\\top\\Sigma\\boldsymbol{a} = V[\\boldsymbol{a}^\\top\\boldsymbol{X}] \\ge 0$<\/span><\/li>\n<li><strong>線形変換<\/strong>：<span class=\"math-inline\">$q\\times p$<\/span> の定数行列 <span class=\"math-inline\">$A$<\/span>、定数ベクトル <span class=\"math-inline\">$\\boldsymbol{b}$<\/span> について<\/li>\n<\/ul>\n<div class=\"math-display\">$$V[A\\boldsymbol{X} + \\boldsymbol{b}] = A\\,\\Sigma\\,A^\\top$$<\/div>\n<ul>\n<li><span class=\"math-inline\">$\\boldsymbol{X}$<\/span> と <span class=\"math-inline\">$\\boldsymbol{Y}$<\/span> の共分散行列は <span class=\"math-inline\">$\\mathrm{Cov}[\\boldsymbol{X},\\boldsymbol{Y}] = E[(\\boldsymbol{X}-\\boldsymbol{\\mu}_X)(\\boldsymbol{Y}-\\boldsymbol{\\mu}_Y)^\\top]$<\/span> で、<span class=\"math-inline\">$\\mathrm{Cov}[A\\boldsymbol{X}, B\\boldsymbol{Y}] = A\\,\\mathrm{Cov}[\\boldsymbol{X},\\boldsymbol{Y}]\\,B^\\top$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$(\\boldsymbol{X}-\\boldsymbol{\\mu})(\\boldsymbol{X}-\\boldsymbol{\\mu})^\\top$<\/span> は <span class=\"math-inline\">$p\\times p$<\/span> 行列で、<span class=\"math-inline\">$(i,j)$<\/span> 成分が <span class=\"math-inline\">$(X_i-\\mu_i)(X_j-\\mu_j)$<\/span> です。その期待値をとれば、対角が分散、非対角が共分散になります。<\/li>\n<li><strong>線形変換の公式の導出<\/strong>：<span class=\"math-inline\">$\\boldsymbol{Y}=A\\boldsymbol{X}+\\boldsymbol{b}$<\/span> なら <span class=\"math-inline\">$\\boldsymbol{Y}-E[\\boldsymbol{Y}] = A(\\boldsymbol{X}-\\boldsymbol{\\mu})$<\/span> なので<\/li>\n<\/ul>\n<div class=\"math-display\">$$V[\\boldsymbol{Y}] = E\\big[A(\\boldsymbol{X}-\\boldsymbol{\\mu})(\\boldsymbol{X}-\\boldsymbol{\\mu})^\\top A^\\top\\big] = A\\,\\Sigma\\,A^\\top$$<\/div>\n<p>1変数の <span class=\"math-inline\">$V[aX+b]=a^2V[X]$<\/span> の行列版です。<span class=\"math-inline\">$a^2$<\/span> が「<span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$A^\\top$<\/span> で挟む」形になります。<\/p>\n<ul>\n<li><strong>半正定値の理由<\/strong>：<span class=\"math-inline\">$\\boldsymbol{a}^\\top\\Sigma\\boldsymbol{a}$<\/span> は1変数 <span class=\"math-inline\">$\\boldsymbol{a}^\\top\\boldsymbol{X}$<\/span> の分散なので、負にはなりません。等号が成り立つ <span class=\"math-inline\">$\\boldsymbol{a}\\neq\\boldsymbol{0}$<\/span> があるのは、変数の間に線形の関係（多重共線性）があるときで、そのとき <span class=\"math-inline\">$\\Sigma$<\/span> は正則でなくなります。<\/li>\n<li>固有値分解 <span class=\"math-inline\">$\\Sigma = P\\Lambda P^\\top$<\/span> の固有ベクトルは点の雲（楕円）の軸の向き、固有値はその方向の分散です。これが主成分分析の考え方です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：和と差の分散<\/strong><\/p>\n<p><span class=\"math-inline\">$\\boldsymbol{X}=(X_1,X_2)^\\top$<\/span> の分散共分散行列が <span class=\"math-inline\">$\\Sigma = \\begin{pmatrix} 4 &amp; 1.2 \\\\ 1.2 &amp; 9\\end{pmatrix}$<\/span> とします。<span class=\"math-inline\">$A=\\begin{pmatrix}1&amp;1\\\\1&amp;-1\\end{pmatrix}$<\/span> で和と差を作ると<\/p>\n<div class=\"math-display\">$$A\\Sigma A^\\top = \\begin{pmatrix} 4+9+2\\times1.2 &amp; 4-9 \\\\ 4-9 &amp; 4+9-2\\times1.2 \\end{pmatrix}\n= \\begin{pmatrix} 15.4 &amp; -5 \\\\ -5 &amp; 10.6 \\end{pmatrix}$$<\/div>\n<p><span class=\"math-inline\">$V[X_1+X_2]=15.4$<\/span>、<span class=\"math-inline\">$V[X_1-X_2]=10.6$<\/span>、和と差の共分散は <span class=\"math-inline\">$V[X_1]-V[X_2]=-5$<\/span> です。<\/p>\n<p>なお、この <span class=\"math-inline\">$\\Sigma$<\/span> の行列式は <span class=\"math-inline\">$4\\times9-1.2^2=34.56&gt;0$<\/span>、固有値は約 <span class=\"math-inline\">$3.7269$<\/span> と <span class=\"math-inline\">$9.2731$<\/span> でどちらも正なので、正定値（正則）です。2つの固有値の和 <span class=\"math-inline\">$13$<\/span> は対角成分の和（分散の合計）と一致し、積 <span class=\"math-inline\">$34.56$<\/span> は行列式と一致します。<\/p>\n<p><strong>例2：分散が最小になる組合せ<\/strong><\/p>\n<p><span class=\"math-inline\">$w X_1 + (1-w) X_2$<\/span> の分散 <span class=\"math-inline\">$4w^2 + 9(1-w)^2 + 2.4\\,w(1-w)$<\/span> を <span class=\"math-inline\">$w$<\/span> で微分して0とおくと<\/p>\n<div class=\"math-display\">$$w^* = \\frac{\\sigma_{22}-\\sigma_{12}}{\\sigma_{11}+\\sigma_{22}-2\\sigma_{12}} = \\frac{9-1.2}{13-2.4} = \\frac{7.8}{10.6} \\approx 0.7358$$<\/div>\n<p>最小の分散は <span class=\"math-inline\">$\\dfrac{\\sigma_{11}\\sigma_{22}-\\sigma_{12}^2}{\\sigma_{11}+\\sigma_{22}-2\\sigma_{12}} = \\dfrac{36-1.44}{10.6} \\approx 3.2604$<\/span> です。分散の小さい <span class=\"math-inline\">$X_1$<\/span> だけを持つ場合（4）よりさらに小さくなります。<\/p>\n<p><strong>例3：多項分布（正則でない例）<\/strong><\/p>\n<p>10回の試行で確率 <span class=\"math-inline\">$(0.5, 0.3, 0.2)$<\/span> の多項分布では、<span class=\"math-inline\">$\\sigma_{ii}=np_i(1-p_i)$<\/span>、<span class=\"math-inline\">$\\sigma_{ij}=-np_ip_j$<\/span> なので<\/p>\n<div class=\"math-display\">$$\\Sigma = \\begin{pmatrix} 2.5 &amp; -1.5 &amp; -1.0 \\\\ -1.5 &amp; 2.1 &amp; -0.6 \\\\ -1.0 &amp; -0.6 &amp; 1.6 \\end{pmatrix}$$<\/div>\n<p>です。各行の和が0で、行列式も0です。回数の合計が10に固定されている（<span class=\"math-inline\">$\\boldsymbol{a}=(1,1,1)^\\top$<\/span> で <span class=\"math-inline\">$V[\\boldsymbol{a}^\\top\\boldsymbol{N}]=0$<\/span>）ためです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：資産の収益率の分散共分散行列 <span class=\"math-inline\">$\\Sigma$<\/span> と保有比率 <span class=\"math-inline\">$\\boldsymbol{w}$<\/span> から、ポートフォリオのリスク <span class=\"math-inline\">$\\boldsymbol{w}^\\top\\Sigma\\boldsymbol{w}$<\/span> を計算し、最適な配分を求めます。<\/li>\n<li><strong>製造・品質管理<\/strong>：複数の品質特性の分散共分散行列を使い、マハラノビス距離で「全体として異常な製品」を検出します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：多数の指標の分散共分散行列（または相関行列）を固有値分解し、主成分分析で次元を減らして可視化します。<\/li>\n<li><strong>医療<\/strong>：回帰分析で推定した係数の分散共分散行列から、係数の組合せ（例：2つの治療効果の差）の標準誤差を計算します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2変量正規分布からの散布図です。非対角成分（ここでは相関係数 ρ）を大きくすると、点の雲が右上がりの細長い楕円になります。\n楕円の長軸の方向が <span class=\"math-inline\">$\\Sigma$<\/span> の最大固有値の固有ベクトル、長軸方向の広がりがその固有値に対応します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$V[A\\boldsymbol{X}+\\boldsymbol{b}]=A\\Sigma A^\\top$<\/span> は最重要の公式です。<span class=\"math-inline\">$V[\\boldsymbol{a}^\\top\\boldsymbol{X}]=\\boldsymbol{a}^\\top\\Sigma\\boldsymbol{a}$<\/span> とあわせて、和・差・加重和の分散を行列で計算できるようにします。<\/li>\n<li>対称・半正定値であること、正則でなくなる条件（線形従属）を説明できるようにします。<\/li>\n<li>多項分布の分散共分散行列（非対角が負）は重要です。<\/li>\n<li>最小分散の組合せ（例2の形）は、微分して求める計算問題として典型的です。<\/li>\n<li>主成分分析（固有値分解）、多変量正規分布の密度（<span class=\"math-inline\">$\\Sigma^{-1}$<\/span> と <span class=\"math-inline\">$|\\Sigma|$<\/span>）、回帰係数の分散 <span class=\"math-inline\">$\\sigma^2(X^\\top X)^{-1}$<\/span> へとつながります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$V[A\\boldsymbol{X}] = A^2\\Sigma$<\/span> や <span class=\"math-inline\">$A^\\top\\Sigma A$<\/span> → ○ 正しくは <span class=\"math-inline\">$A\\Sigma A^\\top$<\/span> です。行列のサイズ（<span class=\"math-inline\">$q\\times p$<\/span>、<span class=\"math-inline\">$p\\times p$<\/span>、<span class=\"math-inline\">$p\\times q$<\/span>）で順番を確かめます。<\/li>\n<li>× 非対角成分は相関係数 → ○ 非対角成分は共分散です。相関係数を並べたものは相関係数行列です。<\/li>\n<li>× 成分の数値が適当に与えられた行列はいつでも分散共分散行列になる → ○ 対称で半正定値でなければなりません。例えば <span class=\"math-inline\">$\\sigma_{12}^2 &gt; \\sigma_{11}\\sigma_{22}$<\/span> となる2×2行列はあり得ません。<\/li>\n<li>× 標本の分散共分散行列は <span class=\"math-inline\">$n$<\/span> で割るか <span class=\"math-inline\">$n-1$<\/span> で割るかは関係ない → ○ 不偏推定量にするには <span class=\"math-inline\">$n-1$<\/span> で割ります。最尤推定量は <span class=\"math-inline\">$n$<\/span> で割ったものです。<\/li>\n<\/ul><\/section>","text":"一言でいうと 複数の確率変数について、各変数の分散と、すべての組の共分散を1つの行列にまとめたものです。 多変量データの「広がり方と向き」を表し、線形変換したときの分散を行列の計算で一気に求められます。 定義・数式 確率ベクトル 、期待値ベクトル について、分散共分散行列は です。 、 です（各成分の分散が有限であるとき）。 とも書けます。 主な性質： - 対称： - 半正定値：任意のベクトル で - 線形変換： の定数行列 、定数ベクトル について - と の共分散行列は で、 です。 数式の読み解き - は 行列で、 成分が です。その期待値をとれば、対角が分散、非対角が共分散になります。 - 線形変換の公式の導出： なら なので 1変数の の行列版です。 が「 と で挟む」形になります。 - 半正定値の理由： は1変数 の分散なので、負にはなりません。等号が成り立つ があるのは、変数の間に線形の関係（多重共線性）があるときで、そのとき は正則でなくなります。 - 固有値分解 の固有ベクトルは点の雲（楕円）の軸の向き、固有値はその方向の分散です。これが主成分分析の考え方です。 具体例 例1：和と差の分散 の分散共分散行列が とします。 で和と差を作ると 、 、和と差の共分散は です。 なお、この の行列式は 、固有値は約 と でどちらも正なので、正定値（正則）です。2つの固有値の和 は対角成分の和（分散の合計）と一致し、積 は行列式と一致します。 例2：分散が最小になる組合せ の分散 を で微分して0とおくと 最小の分散は です。分散の小さい だけを持つ場合（4）よりさらに小さくなります。 例3：多項分布（正則でない例） 10回の試行で確率 の多項分布では、 、 なので です。各行の和が0で、行列式も0です。回数の合計が10に固定されている（ で ）ためです。 現場での使われ方 - 金融・保険：資産の収益率の分散共分散行列 と保有比率 から、ポートフォリオのリスク を計算し、最適な配分を求めます。 - 製造・品質管理：複数の品質特性の分散共分散行列を使い、マハラノビス距離で「全体として異常な製品」を検出します。 - IT・Webサービス：多数の指標の分散共分散行列（または相関行列）を固有値分解し、主成分分析で次元を減らして可視化します。 - 医療：回帰分析で推定した係数の分散共分散行列から、係数の組合せ（例：2つの治療効果の差）の標準誤差を計算します。 グラフ・イメージ 2変量正規分布からの散布図です。非対角成分（ここでは相関係数 ρ）を大きくすると、点の雲が右上がりの細長い楕円になります。 楕円の長軸の方向が の最大固有値の固有ベクトル、長軸方向の広がりがその固有値に対応します。 試験のポイント - は最重要の公式です。 とあわせて、和・差・加重和の分散を行列で計算できるようにします。 - 対称・半正定値であること、正則でなくなる条件（線形従属）を説明できるようにします。 - 多項分布の分散共分散行列（非対角が負）は重要です。 - 最小分散の組合せ（例2の形）は、微分して求める計算問題として典型的です。 - 主成分分析（固有値分解）、多変量正規分布の密度（ と ）、回帰係数の分散 へとつながります。 よくある間違い - × や → ○ 正しくは です。行列のサイズ（ 、 、 ）で順番を確かめます。 - × 非対角成分は相関係数 → ○ 非対角成分は共分散です。相関係数を並べたものは相関係数行列です。 - × 成分の数値が適当に与えられた行列はいつでも分散共分散行列になる → ○ 対称で半正定値でなければなりません。例えば となる2×2行列はあり得ません。 - × 標本の分散共分散行列は で割るか で割るかは関係ない → ○ 不偏推定量にするには で割ります。最尤推定量は で割ったものです。"},"weighted-geometric-harmonic-mean":{"id":"weighted-geometric-harmonic-mean","title":"加重平均・幾何平均・調和平均","reading":"かじゅうへいきん・きかへいきん・ちょうわへいきん","en":"Weighted mean, geometric mean and harmonic mean","aliases":["加重平均","重み付き平均","幾何平均","相乗平均","調和平均","相加平均","算術平均","相加相乗平均の不等式"],"chapter":3,"importance":"B","tags":["代表値","平均","成長率","不等式"],"related":["expectation-variance-properties","log-transformation","lognormal-distribution","coefficient-of-variation"],"charts":[{"type":"custom","id":"mean-inequality","params":{"a":2,"b":8},"sliders":[{"param":"a","label":"値 a","min":0.5,"max":20,"step":0.5},{"param":"b","label":"値 b","min":0.5,"max":20,"step":0.5}],"caption":"2つの正の数 a, b の相加平均・幾何平均・調和平均を数直線上に並べた図。常に AM ≥ GM ≥ HM の順に並び、a = b のときだけ3つが重なる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>ふつうの平均（相加平均）以外にも、目的に応じた「平均」があります。\n重要度に差をつけるなら<strong>加重平均<\/strong>、掛け算で積み重なる量（成長率）なら<strong>幾何平均<\/strong>、速さや単価のような「率」を同じ量ずつ平均するなら<strong>調和平均<\/strong>を使います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>正の値 <span class=\"math-inline\">$x_1,\\dots,x_n$<\/span> について<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\n\\text{相加平均（算術平均）}\\quad &amp; AM = \\frac{1}{n}\\sum_{i=1}^n x_i \\\\\n\\text{幾何平均（相乗平均）}\\quad &amp; GM = \\Big(\\prod_{i=1}^n x_i\\Big)^{1/n} \\\\\n\\text{調和平均}\\quad &amp; HM = \\frac{n}{\\displaystyle\\sum_{i=1}^n \\frac{1}{x_i}}\n\\end{aligned}$$<\/div>\n<p>です。重み <span class=\"math-inline\">$w_i \\ge 0,\\ \\sum_i w_i = 1$<\/span> を使った<strong>加重<\/strong>版は<\/p>\n<div class=\"math-display\">$$\\sum_i w_i x_i, \\qquad \\prod_i x_i^{\\,w_i}, \\qquad \\frac{1}{\\sum_i w_i / x_i}$$<\/div>\n<p>です（それぞれ加重相加平均・加重幾何平均・加重調和平均）。<span class=\"math-inline\">$w_i=1/n$<\/span> のとき上の3つに戻ります。<\/p>\n<p><strong>大小関係<\/strong>：<span class=\"math-inline\">$x_i&gt;0$<\/span> のとき<\/p>\n<div class=\"math-display\">$$AM \\ \\ge\\ GM \\ \\ge\\ HM$$<\/div>\n<p>が成り立ち、等号はすべての <span class=\"math-inline\">$x_i$<\/span> が等しいときに限ります（加重版でも同じです）。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><strong>幾何平均は「対数の平均」<\/strong>です。<span class=\"math-inline\">$\\log GM = \\frac1n\\sum \\log x_i$<\/span> なので、対数をとって相加平均し、元に戻したものです。<\/li>\n<li><strong>調和平均は「逆数の平均の逆数」<\/strong>です。<span class=\"math-inline\">$1/HM = \\frac1n\\sum (1/x_i)$<\/span> です。<\/li>\n<li><strong><span class=\"math-inline\">$AM\\ge GM$<\/span> の証明（2つの場合）<\/strong>：<span class=\"math-inline\">$a,b&gt;0$<\/span> について<\/li>\n<\/ul>\n<div class=\"math-display\">$$\\frac{a+b}{2} - \\sqrt{ab} = \\frac{(\\sqrt a - \\sqrt b)^2}{2} \\ge 0$$<\/div>\n<p>一般の場合は、<span class=\"math-inline\">$\\log$<\/span> が凹関数であることからジェンセンの不等式 <span class=\"math-inline\">$\\log\\big(\\sum w_i x_i\\big) \\ge \\sum w_i \\log x_i$<\/span> で示せます。<\/p>\n<ul>\n<li><strong><span class=\"math-inline\">$GM\\ge HM$<\/span><\/strong> は、逆数 <span class=\"math-inline\">$1/x_i$<\/span> に <span class=\"math-inline\">$AM\\ge GM$<\/span> を当てはめて、両辺の逆数をとれば得られます。<\/li>\n<li>2つの数では <span class=\"math-inline\">$GM^2 = AM\\times HM$<\/span> が成り立ちます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：売上の成長率<\/strong><\/p>\n<p>3年間の売上の伸びが <span class=\"math-inline\">$+10\\%,\\ +50\\%,\\ -20\\%$<\/span> だったとします。倍率は <span class=\"math-inline\">$1.1,\\ 1.5,\\ 0.8$<\/span> で、3年間で <span class=\"math-inline\">$1.1\\times1.5\\times0.8 = 1.32$<\/span> 倍です。<\/p>\n<div class=\"math-display\">$$GM = 1.32^{1/3} \\approx 1.0970$$<\/div>\n<p>1年あたりの平均成長率は約 <span class=\"math-inline\">$9.70\\%$<\/span> です。相加平均 <span class=\"math-inline\">$(10+50-20)/3 \\approx 13.33\\%$<\/span> を使うと、<span class=\"math-inline\">$1.1333^3\\approx1.456$<\/span> 倍となり、実際の 1.32 倍と合いません。<\/p>\n<p><strong>例2：往復の平均速度<\/strong><\/p>\n<p>同じ道を行きは時速 60 km、帰りは時速 40 km で走りました。片道を <span class=\"math-inline\">$d$<\/span> km とすると、かかった時間は <span class=\"math-inline\">$d/60 + d/40$<\/span> なので<\/p>\n<div class=\"math-display\">$$\\text{平均速度} = \\frac{2d}{d/60 + d/40} = \\frac{2}{1/60 + 1/40} = 48 \\ (\\text{km/h})$$<\/div>\n<p>で、調和平均になります。相加平均の 50 km/h ではありません。<\/p>\n<p><strong>例3：クラス平均の統合と大小関係<\/strong><\/p>\n<p>30人のクラスの平均点が 60 点、20人のクラスが 75 点なら、全体の平均は加重平均 <span class=\"math-inline\">$\\frac{30\\times60 + 20\\times75}{50} = 66$<\/span> 点です。\nまた、2つの数 <span class=\"math-inline\">$2$<\/span> と <span class=\"math-inline\">$8$<\/span> では <span class=\"math-inline\">$AM=5,\\ GM=4,\\ HM=3.2$<\/span> で、<span class=\"math-inline\">$5\\ge4\\ge3.2$<\/span>、<span class=\"math-inline\">$4^2 = 5\\times3.2$<\/span> が確かめられます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：複数年の投資収益率の平均は幾何平均（年平均成長率）で示します。毎月同じ金額ずつ買う積立投資では、平均購入単価が価格の調和平均になります。<\/li>\n<li><strong>行政・調査<\/strong>：物価指数や、地域別の率を人口で重みづけして全国値を出すときに加重平均を使います。<\/li>\n<li><strong>製造・品質管理<\/strong>：工程ごとの歩留まり（率）が掛け算で効くときは、幾何平均で工程あたりの平均歩留まりを表します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：分類モデルの評価指標 F 値は、適合率と再現率の調和平均です。どちらか一方が低いと全体も低くなるように作られています。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2つの正の数 <span class=\"math-inline\">$a, b$<\/span> の3種類の平均を数直線上に並べた図です。どのように動かしても AM ≥ GM ≥ HM の順は崩れず、<span class=\"math-inline\">$a$<\/span> と <span class=\"math-inline\">$b$<\/span> の差が大きいほど3つの間隔が開きます。<span class=\"math-inline\">$a=b$<\/span> にすると3つが重なります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>成長率・倍率には幾何平均、速さ・単価など「分母側の量が同じ」平均には調和平均、という使い分けが重要です。<\/li>\n<li><span class=\"math-inline\">$AM\\ge GM\\ge HM$<\/span> と等号成立条件（すべて等しいとき）を押さえます。<\/li>\n<li>幾何平均は対数変換した値の相加平均と対応します。対数正規分布の中央値 <span class=\"math-inline\">$e^{\\mu}$<\/span> は母集団の幾何平均です。<\/li>\n<li>加重平均の重みは、何の量で重みをつけるか（人数、金額、時間など）を問題文から読み取ります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 成長率の平均を相加平均で求める → ○ 掛け算で積み重なる量は幾何平均で平均します。<span class=\"math-inline\">$+50\\%$<\/span> と <span class=\"math-inline\">$-50\\%$<\/span> の相加平均は0% ですが、実際は <span class=\"math-inline\">$1.5\\times0.5=0.75$<\/span> 倍に減っています。<\/li>\n<li>× 往復の平均速度を <span class=\"math-inline\">$(60+40)/2$<\/span> とする → ○ 同じ距離を走るときは調和平均です。同じ「時間」ずつ走るなら相加平均になります。<\/li>\n<li>× 各グループの平均を単純に平均して全体平均とする → ○ グループの大きさが違えば、人数で重みづけした加重平均にします。<\/li>\n<li>× 0 や負の値を含むデータに幾何平均・調和平均を使う → ○ どちらも正の値が前提です。<\/li>\n<\/ul><\/section>","text":"一言でいうと ふつうの平均（相加平均）以外にも、目的に応じた「平均」があります。 重要度に差をつけるなら加重平均、掛け算で積み重なる量（成長率）なら幾何平均、速さや単価のような「率」を同じ量ずつ平均するなら調和平均を使います。 定義・数式 正の値 について です。重み を使った加重版は です（それぞれ加重相加平均・加重幾何平均・加重調和平均）。 のとき上の3つに戻ります。 大小関係： のとき が成り立ち、等号はすべての が等しいときに限ります（加重版でも同じです）。 数式の読み解き - 幾何平均は「対数の平均」です。 なので、対数をとって相加平均し、元に戻したものです。 - 調和平均は「逆数の平均の逆数」です。 です。 - の証明（2つの場合）： について 一般の場合は、 が凹関数であることからジェンセンの不等式 で示せます。 - は、逆数 に を当てはめて、両辺の逆数をとれば得られます。 - 2つの数では が成り立ちます。 具体例 例1：売上の成長率 3年間の売上の伸びが だったとします。倍率は で、3年間で 倍です。 1年あたりの平均成長率は約 です。相加平均 を使うと、 倍となり、実際の 1.32 倍と合いません。 例2：往復の平均速度 同じ道を行きは時速 60 km、帰りは時速 40 km で走りました。片道を km とすると、かかった時間は なので で、調和平均になります。相加平均の 50 km/h ではありません。 例3：クラス平均の統合と大小関係 30人のクラスの平均点が 60 点、20人のクラスが 75 点なら、全体の平均は加重平均 点です。 また、2つの数 と では で、 、 が確かめられます。 現場での使われ方 - 金融・保険：複数年の投資収益率の平均は幾何平均（年平均成長率）で示します。毎月同じ金額ずつ買う積立投資では、平均購入単価が価格の調和平均になります。 - 行政・調査：物価指数や、地域別の率を人口で重みづけして全国値を出すときに加重平均を使います。 - 製造・品質管理：工程ごとの歩留まり（率）が掛け算で効くときは、幾何平均で工程あたりの平均歩留まりを表します。 - IT・Webサービス：分類モデルの評価指標 F 値は、適合率と再現率の調和平均です。どちらか一方が低いと全体も低くなるように作られています。 グラフ・イメージ 2つの正の数 の3種類の平均を数直線上に並べた図です。どのように動かしても AM ≥ GM ≥ HM の順は崩れず、 と の差が大きいほど3つの間隔が開きます。 にすると3つが重なります。 試験のポイント - 成長率・倍率には幾何平均、速さ・単価など「分母側の量が同じ」平均には調和平均、という使い分けが重要です。 - と等号成立条件（すべて等しいとき）を押さえます。 - 幾何平均は対数変換した値の相加平均と対応します。対数正規分布の中央値 は母集団の幾何平均です。 - 加重平均の重みは、何の量で重みをつけるか（人数、金額、時間など）を問題文から読み取ります。 よくある間違い - × 成長率の平均を相加平均で求める → ○ 掛け算で積み重なる量は幾何平均で平均します。 と の相加平均は0% ですが、実際は 倍に減っています。 - × 往復の平均速度を とする → ○ 同じ距離を走るときは調和平均です。同じ「時間」ずつ走るなら相加平均になります。 - × 各グループの平均を単純に平均して全体平均とする → ○ グループの大きさが違えば、人数で重みづけした加重平均にします。 - × 0 や負の値を含むデータに幾何平均・調和平均を使う → ○ どちらも正の値が前提です。"}}}</script>

/* 分布の密度・確率・累積分布の計算ライブラリ（外部依存なし） */
(function (root) {

    var MJ = window.MathJax;
    if (MJ && MJ.typesetPromise) {
      MJ.typesetPromise([el]).catch(function (err) { if (window.console) console.warn(err); });
    }
  }
  document.addEventListener('mathjax-ready', function () { typeset(detailEl); });
  window.addEventListener('load', function () { if (window.Charts) Charts.redrawAll(); });

  function clearDetail() {
    if (window.Charts) Charts.destroyAll();
    var MJ = window.MathJax;
    if (MJ && MJ.typesetClear) { try { MJ.typesetClear([detailEl]); } catch (e) { /* 無視 */ } }
  }

  function renderWelcome() {
    clearDetail();
    var tot = ORDER.length, wr = ORDER.filter(isWritten).length, vf = ORDER.filter(function (id) { return PLAN[id].status === 'verified'; }).length;
    detailEl.innerHTML = '<div class="article welcome">' +
      '<h1>統計検定準1級 用語辞典</h1>' +
      '<p>『統計学実践ワークブック』の全32章の章立てに沿って、用語の定義・数式・具体例・試験のポイントをまとめています。解説はすべてオリジナルです。</p>' +
      '<div class="progress-bar" aria-hidden="true"><span style="width:' + (100 * wr / Math.max(1, tot)).toFixed(1) + '%"></span></div>' +
      '<p style="margin-top:0;font-size:.85rem">作成済み ' + wr + ' 語 ／ 予定 ' + tot + ' 語（うち数値検算済み ' + vf + ' 語）</p>' +
      '<h2 style="font-size:1rem;margin-top:1.6em">使い方</h2>' +
      '<ul style="padding-left:1.2em"><li>左の章から選ぶか、上の検索欄に用語・読み・英語名を入れます（「ガウス」「がんま」「MGF」など）。</li>' +
      '<li>各用語の右の丸をチェックすると「覚えた」印が付き、章ナビの「覚えた用語を隠す」で一覧から消せます。</li>' +
      '<li>PCでは <kbd>/</kbd> で検索、<kbd>Esc</kbd> で検索の解除ができます。</li>' +
      '<li>用語ごとのURL（#用語のid）をブックマークすると、その用語を直接開けます。</li></ul>' +
      '<h2 style="font-size:1rem;margin-top:1.6em">重要度の印</h2>' +
      '<div class="legend"><span>' + impMark('A') + '必須・頻出</span><span>' + impMark('B') + '重要</span><span>' + impMark('C') + '補足</span><span><span class="pending-tag">準備中</span>まだ書かれていない用語</span></div>' +
      '</div>';
  }

  function renderPending(id) {
    clearDetail();
    var p = PLAN[id];
    detailEl.innerHTML = '<button type="button" class="back-btn" data-back>← 一覧</button><div class="article"><p class="crumb">第' + p.chapter + '章 ' + esc(chapterOf(p.chapter).title) + '</p>' +
      '<h1 class="term-title">' + esc(p.title) + impMark(p.importance) + '</h1><p class="term-meta"><span class="pending-tag">準備中</span>　この用語の解説はまだ書かれていません。</p></div>';
  }

  function neighbor(id, dir) {
    var p = PLAN[id], terms = chapterOf(p.chapter).terms, i = p.order + dir;
    while (i >= 0 && i < terms.length) {
      if (isWritten(terms[i].id)) return terms[i].id;
      i += dir;
    }
    return null;
  }

  function renderTerm(id) {
    clearDetail();
    var t = TERMS[id], p = PLAN[id], ch = chapterOf(t.chapter);
    var meta = [esc(t.reading)];
    if (t.en) meta.push('<span class="en" lang="en">' + esc(t.en) + '</span>');
    if (t.aliases.length) meta.push('別名：' + t.aliases.map(esc).join('、'));
    var h = '<button type="button" class="back-btn" data-back>← 一覧</button><div class="article">' +
      '<p class="crumb">第' + t.chapter + '章 <button type="button" data-goch="' + t.chapter + '">' + esc(ch.title) + '</button></p>' +
      '<h1 class="term-title">' + esc(t.title) + impMark(t.importance) + '</h1>' +
      '<p class="term-meta">' + meta.join('　・　') + '</p>' +
      '<div class="term-actions"><button type="button" class="memo-toggle"></button>' +
      (p.status === 'verified' ? '<span class="pending-tag" style="border-style:solid" title="数値をPythonで検算済み">検算済み</span>' : '') + '</div>';
    var secs = [];
    t.html.replace(/data-sec="(\w+)"/g, function (_, k) { secs.push(k); return _; });
    if (t.charts.length && secs.indexOf('chart') < 0) secs.splice(Math.max(0, secs.indexOf('exam')), 0, 'chart');
    h += '<nav class="jump" aria-label="節へ移動">' + secs.filter(function (k) { return SEC_LABELS[k]; }).map(function (k) {
      return '<button type="button" data-jump="' + k + '">' + SEC_LABELS[k] + '</button>';
    }).join('') + '</nav>';
    h += '<div class="body">' + t.html + '</div>';
    if (t.related.length) {
      h += '<section class="related"><h2>関連用語</h2><div class="related-list">' + t.related.map(function (r) {
        var rp = PLAN[r];
        if (!rp) return '';
        return '<button type="button" class="rel-btn" data-go="' + r + '"' + (isWritten(r) ? '' : ' disabled title="準備中"') + '>' + esc(rp.title) + (isWritten(r) ? '' : '（準備中）') + '</button>';
      }).join('') + '</div></section>';
    }
    var prev = neighbor(id, -1), next = neighbor(id, 1);
    h += '<nav class="pager" aria-label="同じ章の前後の用語">' +
      '<button type="button" data-go="' + (prev || '') + '"' + (prev ? '' : ' disabled') + '><small>← 前の用語</small>' + (prev ? esc(PLAN[prev].title) : '') + '</button>' +
      '<button type="button" data-go="' + (next || '') + '"' + (next ? '' : ' disabled') + '><small>次の用語 →</small>' + (next ? esc(PLAN[next].title) : '') + '</button></nav>';
    h += '</div>';
    detailEl.innerHTML = h;
    setMemoToggle(detailEl.querySelector('.memo-toggle'), id);

    if (t.charts.length) {
      var sec = detailEl.querySelector('.sec[data-sec="chart"]');
      if (!sec) {
        sec = document.createElement('section');
        sec.className = 'sec'; sec.dataset.sec = 'chart'; sec.id = 'sec-chart';
        sec.innerHTML = '<h2>グラフ・イメージ</h2>';
        var exam = detailEl.querySelector('.sec[data-sec="exam"]');
        exam ? exam.parentNode.insertBefore(sec, exam) : detailEl.querySelector('.body').appendChild(sec);
      }
      t.charts.forEach(function (spec) {
        try { Charts.render(sec, spec); } catch (e) { if (window.console) console.error(e); }
      });
    }
    detailEl.scrollTop = 0;
    typeset(detailEl);
  }

  detailEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-back')) { backToList(); return; }
    if (b.dataset.goch) { go('#ch' + String(b.dataset.goch).padStart(2, '0')); return; }
    if (b.dataset.go) { state.fromList = false; go('#' + b.dataset.go); return; }
    if (b.dataset.jump) {
      var s = detailEl.querySelector('.sec[data-sec="' + b.dataset.jump + '"]');
      if (s) s.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (b.classList.contains('memo-toggle') && state.current) toggleMemo(state.current);
  });

  // ---------- スマホの一覧／解説の切り替え ----------
  var listScroll = 0;
  function showDetailView() {
    if (!document.body.classList.contains('show-detail')) listScroll = listEl.scrollTop;
    document.body.classList.add('show-detail');
  }
  function showListView() {
    var was = document.body.classList.contains('show-detail');
    document.body.classList.remove('show-detail');
    if (was) listEl.scrollTop = listScroll;
  }
  function backToList() {
    if (state.fromList && history.length > 1) { state.fromList = false; history.back(); return; }
    go(state.chapter === 'all' ? '#all' : '#ch' + String(state.chapter).padStart(2, '0'));
  }

  // ---------- ルーティング ----------
  function go(hash) {
    if (location.hash === hash) route(); else location.hash = hash;
  }
  function scrollRowIntoView() {
    var row = listEl.querySelector('.row[aria-current="true"]');
    if (!row) return;
    var lr = listEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
    if (rr.top < lr.top + 60 || rr.bottom > lr.bottom) listEl.scrollTop += rr.top - lr.top - lr.height / 3;
  }
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    var m = /^ch(\d{1,2})$/.exec(h);
    if (!h || h === 'all') {
      state.chapter = 'all';
      renderNav(); renderList(); showListView();
      if (!state.current) renderWelcome();
      return;
    }
    if (m) {
      var n = Number(m[1]);
      if (n >= 1 && n <= 32) {
        if (state.chapter !== n) listEl.scrollTop = 0;
        state.chapter = n;
        renderNav(); renderList(); showListView();
        if (!state.current) renderWelcome();
        return;
      }
    }
    if (PLAN[h]) {
      state.current = h;
      if (!state.query && state.chapter !== 'all' && state.chapter !== PLAN[h].chapter) { state.chapter = PLAN[h].chapter; listEl.scrollTop = 0; }
      renderNav(); renderList();
      if (isWritten(h)) { renderTerm(h); save('jd-last', h); } else renderPending(h);
      showDetailView();
      scrollRowIntoView();
      document.title = PLAN[h].title + '｜準1級 用語辞典';
      return;
    }
    renderNav(); renderList(); renderWelcome(); showListView();
  }
  window.addEventListener('hashchange', route);

  // ---------- 検索 ----------
  var timer = null;
  qEl.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.query = qEl.value.trim();
      renderList();
      listEl.scrollTop = 0;
      if (state.query) showListView();
    }, 100);
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); qEl.focus(); qEl.select(); }
    else if (e.key === 'Escape') {
      if (document.body.classList.contains('nav-open')) { closeNav(); return; }
      if (qEl.value || document.activeElement === qEl) { qEl.value = ''; state.query = ''; renderList(); qEl.blur(); }
    }
  });

  // ---------- テーマ ----------
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effectiveTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    return t || (mq && mq.matches ? 'dark' : 'light');
  }
  $('btn-theme').addEventListener('click', function () {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('jd-theme', next); } catch (e) { /* 無視 */ }
    if (window.Charts) Charts.redrawAll();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (window.Charts) Charts.redrawAll(); });

  // ---------- 開始 ----------
  if (!location.hash) {
    var last = load('jd-last', null);
    if (last && isWritten(last) && window.innerWidth >= 600) {
      state.current = last;
      history.replaceState(null, '', '#' + last);
    }
  }
  route();
})();

</script>
</body>
</html>
