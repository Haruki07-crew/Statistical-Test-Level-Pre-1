関数の微分で<\/p>\n<div class=\"math-display\">$$M'(t) = n\\,pe^t\\,(pe^t+q)^{n-1}$$<\/div>\n<div class=\"math-display\">$$M''(t) = n\\,pe^t\\,(pe^t+q)^{n-1} + n(n-1)\\,p^2e^{2t}\\,(pe^t+q)^{n-2}$$<\/div>\n<p><span class=\"math-inline\">$t=0$<\/span> では <span class=\"math-inline\">$pe^0+q=1$<\/span> なので、<\/p>\n<div class=\"math-display\">$$E[X]=M'(0)=np,\\qquad E[X^2]=M''(0)=np+n(n-1)p^2$$<\/div>\n<div class=\"math-display\">$$V[X] = np+n(n-1)p^2-(np)^2 = np-np^2 = np(1-p)$$<\/div>\n<p><strong>ポアソン分布 <span class=\"math-inline\">$Po(\\lambda)$<\/span><\/strong><\/p>\n<div class=\"math-display\">$$M(t) = \\sum_{k=0}^{\\infty}e^{tk}\\frac{e^{-\\lambda}\\lambda^k}{k!} = e^{-\\lambda}\\sum_{k=0}^{\\infty}\\frac{(\\lambda e^t)^k}{k!} = e^{-\\lambda}e^{\\lambda e^t} = \\exp\\{\\lambda(e^t-1)\\}$$<\/div>\n<div class=\"math-display\">$$M'(t) = \\lambda e^t\\,M(t),\\qquad M''(t) = \\lambda e^t\\,M(t)+\\lambda e^t\\cdot\\lambda e^t\\,M(t) = (\\lambda e^t+\\lambda^2e^{2t})\\,M(t)$$<\/div>\n<p><span class=\"math-inline\">$M(0)=1$<\/span> より<\/p>\n<div class=\"math-display\">$$E[X]=\\lambda,\\qquad E[X^2]=\\lambda+\\lambda^2,\\qquad V[X]=\\lambda+\\lambda^2-\\lambda^2=\\lambda$$<\/div>\n<p><strong>正規分布 <span class=\"math-inline\">$N(\\mu,\\sigma^2)$<\/span><\/strong><\/p>\n<p>指数部分を平方完成します。<\/p>\n<div class=\"math-display\">$$tx-\\frac{(x-\\mu)^2}{2\\sigma^2} = -\\frac{\\{x-(\\mu+\\sigma^2t)\\}^2}{2\\sigma^2}+\\mu t+\\frac{\\sigma^2t^2}{2}$$<\/div>\n<p>残った積分は <span class=\"math-inline\">$N(\\mu+\\sigma^2t,\\sigma^2)$<\/span> の密度の積分で1になるので、<span class=\"math-inline\">$M(t)=\\exp\\left(\\mu t+\\tfrac{\\sigma^2t^2}{2}\\right)$<\/span> です。<\/p>\n<div class=\"math-display\">$$M'(t) = (\\mu+\\sigma^2t)\\,M(t),\\qquad M''(t) = \\sigma^2M(t)+(\\mu+\\sigma^2t)^2M(t)$$<\/div>\n<div class=\"math-display\">$$E[X]=\\mu,\\qquad E[X^2]=\\sigma^2+\\mu^2,\\qquad V[X]=\\sigma^2$$<\/div>\n<p><strong>キュムラント母関数で楽をする<\/strong><\/p>\n<p><span class=\"math-inline\">$K(t)=\\log M(t)$<\/span> とすると、<span class=\"math-inline\">$K'=M'/M$<\/span>、<span class=\"math-inline\">$K''=\\{M''M-(M')^2\\}/M^2$<\/span> なので、<span class=\"math-inline\">$M(0)=1$<\/span> から <span class=\"math-inline\">$K''(0)=M''(0)-\\{M'(0)\\}^2=V[X]$<\/span> です。<\/p>\n<ul>\n<li>ポアソン：<span class=\"math-inline\">$K(t)=\\lambda(e^t-1)$<\/span>、<span class=\"math-inline\">$K'(t)=K''(t)=\\lambda e^t$<\/span> → 平均も分散も <span class=\"math-inline\">$\\lambda$<\/span><\/li>\n<li>正規：<span class=\"math-inline\">$K(t)=\\mu t+\\tfrac{\\sigma^2t^2}{2}$<\/span> → <span class=\"math-inline\">$K'(0)=\\mu$<\/span>、<span class=\"math-inline\">$K''(0)=\\sigma^2$<\/span><\/li>\n<li>二項：<span class=\"math-inline\">$K(t)=n\\log(pe^t+q)$<\/span>、<span class=\"math-inline\">$K'(t)=\\dfrac{npe^t}{pe^t+q}$<\/span>、<span class=\"math-inline\">$K''(t)=\\dfrac{npqe^t}{(pe^t+q)^2}$<\/span> → <span class=\"math-inline\">$np$<\/span>、<span class=\"math-inline\">$npq$<\/span><\/li>\n<\/ul>\n<p>積の微分が出てこないので、計算がずっと短くなります。3階微分 <span class=\"math-inline\">$K'''(0)$<\/span> は3次の中心モーメント（歪度の分子）になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：不良品の個数<\/strong><\/p>\n<p>不良率 0.3 の工程から10個取り出したときの不良品数 <span class=\"math-inline\">$X\\sim Bin(10,0.3)$<\/span> では、<\/p>\n<div class=\"math-display\">$$M'(0)=10\\times0.3=3,\\qquad M''(0)=3+10\\times9\\times0.09=11.1,\\qquad V[X]=11.1-3^2=2.1$$<\/div>\n<p><span class=\"math-inline\">$np(1-p)=10\\times0.3\\times0.7=2.1$<\/span> と一致します。<\/p>\n<p><strong>例2：モーメント母関数から分布を当てる<\/strong><\/p>\n<p>ある確率変数のモーメント母関数が <span class=\"math-inline\">$M(t)=(0.4+0.6e^t)^5$<\/span> だとわかりました。表と見比べると <span class=\"math-inline\">$Bin(5,\\,0.6)$<\/span> のモーメント母関数と同じなので、一意性から <span class=\"math-inline\">$X\\sim Bin(5,0.6)$<\/span> です。<span class=\"math-inline\">$E[X]=3$<\/span>、<span class=\"math-inline\">$V[X]=1.2$<\/span> です。<\/p>\n<p><strong>例3：ポアソン分布の再生性<\/strong><\/p>\n<p>窓口Aの1時間の来客数 <span class=\"math-inline\">$X\\sim Po(2)$<\/span>、窓口Bの来客数 <span class=\"math-inline\">$Y\\sim Po(3)$<\/span> が独立なら、<\/p>\n<div class=\"math-display\">$$M_{X+Y}(t) = e^{2(e^t-1)}\\,e^{3(e^t-1)} = e^{5(e^t-1)}$$<\/div>\n<p>これは <span class=\"math-inline\">$Po(5)$<\/span> のモーメント母関数なので、<span class=\"math-inline\">$X+Y\\sim Po(5)$<\/span> です。2窓口とも来客ゼロの確率は <span class=\"math-inline\">$e^{-5}\\approx0.0067$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：保険金の総額（件数も金額もランダムな和）のモーメント母関数から、平均・分散・歪度を求めて保険料や準備金を決めます。キュムラント母関数は損失確率の近似（鞍点近似）にも使われます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：サーバーの処理時間の和の裾の確率を、チェルノフ限界 <span class=\"math-inline\">$P(X\\ge a)\\le e^{-ta}M_X(t)$<\/span> で上から評価し、遅延の上限を保証します。<\/li>\n<li><strong>製造・品質管理<\/strong>：独立な部品の寸法の和（組み立て後の全長）の分布を、モーメント母関数の積から正規分布だと確かめ、公差設計に使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図は <span class=\"math-inline\">$M(t)$<\/span> の曲線と、<span class=\"math-inline\">$t=0$<\/span> での接線です。λ を大きくすると接線の傾き（＝平均）が急になり、曲線の曲がり具合（2階微分）も大きくなります。\n2つ目の図で、その平均と分散が分布の中心と広がりとして現れていることを確認してください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>二項・ポアソン・正規のモーメント母関数を自分で導出し、2回微分して分散まで出せることが基本です。キュムラント母関数を使うと速くなります。<\/li>\n<li>「独立な和のモーメント母関数＝積」と一意性を組み合わせて、再生性（二項・ポアソン・正規・ガンマ・カイ二乗）を示す問題が典型です。<\/li>\n<li><span class=\"math-inline\">$Z=(X-\\mu)/\\sigma$<\/span> のモーメント母関数は <span class=\"math-inline\">$e^{-\\mu t/\\sigma}M_X(t/\\sigma)$<\/span> です。標本平均 <span class=\"math-inline\">$\\bar X$<\/span> なら <span class=\"math-inline\">$\\{M_X(t/n)\\}^n$<\/span> です。<\/li>\n<li>中心極限定理の証明（モーメント母関数が存在する場合）は、標準化した和のモーメント母関数が <span class=\"math-inline\">$e^{t^2/2}$<\/span> に収束することを示す流れです。<\/li>\n<li>確率母関数とは <span class=\"math-inline\">$M_X(t)=G_X(e^t)$<\/span> の関係にあります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× どんな分布にもモーメント母関数がある → ○ コーシー分布、<span class=\"math-inline\">$t$<\/span> 分布、対数正規分布などでは存在しません。いつも存在するのは特性関数です。<\/li>\n<li>× <span class=\"math-inline\">$E[X^2]=M''(0)$<\/span> をそのまま分散とする → ○ 分散は <span class=\"math-inline\">$M''(0)-\\{M'(0)\\}^2$<\/span> です（キュムラント母関数なら <span class=\"math-inline\">$K''(0)$<\/span> がそのまま分散）。<\/li>\n<li>× 独立でない和にも <span class=\"math-inline\">$M_{X+Y}=M_XM_Y$<\/span> を使う → ○ 積の形は独立のときだけ成り立ちます。<\/li>\n<li>× すべてのモーメントが一致すれば必ず同じ分布 → ○ モーメント母関数が存在する場合は正しいですが、対数正規分布のようにモーメントだけでは分布が決まらない例があります。<\/li>\n<\/ul><\/section>","text":"一言でいうと という1つの関数に、分布のモーメント（ 、 、…）をすべて詰め込んだものです。 微分して を代入するとモーメントが取り出せ、さらに「関数が同じなら分布も同じ」という性質で分布の特定にも使えます。 定義・数式 確率変数 のモーメント母関数（積率母関数）は です。ただし、 を含むある開区間 （ ）のすべての で期待値が有限のときに「モーメント母関数が存在する」といいます。 主な性質は次の4つです。 1. モーメントの生成： 。つまり 2. 一意性：0の近くで なら、 と は同じ分布に従う 3. 独立な和： が独立なら 4. 1次変換： キュムラント母関数 を使うと、 と、平均と分散が直接得られます。 分布 存在する範囲 ベルヌーイ すべての 二項 すべての ポアソン すべての 幾何（失敗回数、 ） 正規 すべての 指数（レート ） ガンマ（形状 、レート ） カイ二乗 一様 （ では1） すべての コーシー、 分布、対数正規 存在しない — ガンマ分布を尺度 で書く流儀では （ ）です。 数式の読み解き - ：ただの補助の変数です。 自体に意味はなく、微分して を代入するための「つまみ」です。 - なぜ微分でモーメントが出るか： の期待値をとると です。 回微分して とすると、 の係数 だけが残ります。 以下、3つの分布で実際に微分します。 二項分布 （ ） （最後は二項定理）。合成関数の微分で では なので、 ポアソン分布 より 正規分布 指数部分を平方完成します。 残った積分は の密度の積分で1になるので、 です。 キュムラント母関数で楽をする とすると、 、 なので、 から です。 - ポアソン： 、 → 平均も分散も - 正規： → 、 - 二項： 、 、 → 、 積の微分が出てこないので、計算がずっと短くなります。3階微分 は3次の中心モーメント（歪度の分子）になります。 具体例 例1：不良品の個数 不良率 0.3 の工程から10個取り出したときの不良品数 では、 と一致します。 例2：モーメント母関数から分布を当てる ある確率変数のモーメント母関数が だとわかりました。表と見比べると のモーメント母関数と同じなので、一意性から です。 、 です。 例3：ポアソン分布の再生性 窓口Aの1時間の来客数 、窓口Bの来客数 が独立なら、 これは のモーメント母関数なので、 です。2窓口とも来客ゼロの確率は です。 現場での使われ方 - 金融・保険：保険金の総額（件数も金額もランダムな和）のモーメント母関数から、平均・分散・歪度を求めて保険料や準備金を決めます。キュムラント母関数は損失確率の近似（鞍点近似）にも使われます。 - IT・Webサービス：サーバーの処理時間の和の裾の確率を、チェルノフ限界 で上から評価し、遅延の上限を保証します。 - 製造・品質管理：独立な部品の寸法の和（組み立て後の全長）の分布を、モーメント母関数の積から正規分布だと確かめ、公差設計に使います。 グラフ・イメージ 1つ目の図は の曲線と、 での接線です。λ を大きくすると接線の傾き（＝平均）が急になり、曲線の曲がり具合（2階微分）も大きくなります。 2つ目の図で、その平均と分散が分布の中心と広がりとして現れていることを確認してください。 試験のポイント - 二項・ポアソン・正規のモーメント母関数を自分で導出し、2回微分して分散まで出せることが基本です。キュムラント母関数を使うと速くなります。 - 「独立な和のモーメント母関数＝積」と一意性を組み合わせて、再生性（二項・ポアソン・正規・ガンマ・カイ二乗）を示す問題が典型です。 - のモーメント母関数は です。標本平均 なら です。 - 中心極限定理の証明（モーメント母関数が存在する場合）は、標準化した和のモーメント母関数が に収束することを示す流れです。 - 確率母関数とは の関係にあります。 よくある間違い - × どんな分布にもモーメント母関数がある → ○ コーシー分布、 分布、対数正規分布などでは存在しません。いつも存在するのは特性関数です。 - × をそのまま分散とする → ○ 分散は です（キュムラント母関数なら がそのまま分散）。 - × 独立でない和にも を使う → ○ 積の形は独立のときだけ成り立ちます。 - × すべてのモーメントが一致すれば必ず同じ分布 → ○ モーメント母関数が存在する場合は正しいですが、対数正規分布のようにモーメントだけでは分布が決まらない例があります。"},"survival-function":{"id":"survival-function","title":"生存関数","reading":"せいぞんかんすう","en":"Survival function","aliases":["生存率関数","信頼度関数"],"chapter":2,"importance":"B","tags":["生存時間解析","信頼性","累積分布関数"],"related":["cumulative-distribution-function","hazard-function","exponential-distribution","kaplan-meier-estimator","cox-proportional-hazards-model"],"charts":[{"type":"survival-hazard","dist":"weibull","params":{"shape":2,"scale":10},"sliders":[{"param":"shape","label":"形状 k","min":0.5,"max":4,"step":0.1},{"param":"scale","label":"尺度 λ","min":2,"max":20,"step":1}],"caption":"左が生存関数 S(t)、右がハザード関数 h(t)。形状 k=1 で指数分布になり、S(t) は一定の割合で減っていく。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「時刻 <span class=\"math-inline\">$t$<\/span> を過ぎてもまだ生きている（壊れていない）確率」を表す関数です。\n累積分布関数を「1から引いたもの」で、寿命や待ち時間を扱うときの主役になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>非負の確率変数 <span class=\"math-inline\">$T$<\/span>（寿命、故障までの時間など）の累積分布関数を <span class=\"math-inline\">$F(t)$<\/span> とすると、生存関数は<\/p>\n<div class=\"math-display\">$$S(t) = P(T &gt; t) = 1 - F(t), \\qquad t \\ge 0$$<\/div>\n<p>です。連続型で密度 <span class=\"math-inline\">$f(t)$<\/span> をもつときは<\/p>\n<div class=\"math-display\">$$S(t) = \\int_t^{\\infty} f(u)\\,du, \\qquad f(t) = -\\frac{d}{dt}S(t)$$<\/div>\n<p>性質：<span class=\"math-inline\">$S(0)=1$<\/span>（<span class=\"math-inline\">$P(T=0)=0$<\/span> のとき）、単調非増加、<span class=\"math-inline\">$\\displaystyle\\lim_{t\\to\\infty}S(t)=0$<\/span>。<\/p>\n<p>期待値は生存関数の積分で書けます（<span class=\"math-inline\">$T\\ge0$<\/span> のとき）。<\/p>\n<div class=\"math-display\">$$E[T] = \\int_0^{\\infty} S(t)\\,dt$$<\/div>\n<p>離散型で <span class=\"math-inline\">$T$<\/span> が <span class=\"math-inline\">$0,1,2,\\dots$<\/span> の値をとるときは、<span class=\"math-inline\">$E[T]=\\sum_{k=1}^{\\infty}P(T\\ge k)=\\sum_{k=0}^{\\infty}P(T&gt;k)$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$S(t)$<\/span>：時刻 <span class=\"math-inline\">$t$<\/span> の時点で「まだイベントが起きていない」割合。最初は1で、時間とともに減ります。<\/li>\n<li><span class=\"math-inline\">$f(t)=-S'(t)$<\/span>：生存曲線の下がる速さが密度です。急に下がる時期ほど、イベントが集中しています。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$E[T]=\\int_0^\\infty S(t)dt$<\/span> の導出は、<span class=\"math-inline\">$T=\\int_0^\\infty \\mathbf{1}\\{T&gt;t\\}\\,dt$<\/span> と書いて両辺の期待値をとるだけです。\n積分と期待値を入れ替えると <span class=\"math-inline\">$\\int_0^\\infty P(T&gt;t)\\,dt$<\/span> になります。\n図で言えば「生存曲線の下の面積＝平均寿命」です。<\/p>\n<p>条件付きの生存確率は比で表せます。<\/p>\n<div class=\"math-display\">$$P(T &gt; t+s \\mid T &gt; t) = \\frac{S(t+s)}{S(t)}$$<\/div>\n<p>「すでに <span class=\"math-inline\">$t$<\/span> まで生きた人が、さらに <span class=\"math-inline\">$s$<\/span> 生きる確率」です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：指数分布の電球<\/strong><\/p>\n<p>寿命 <span class=\"math-inline\">$T$<\/span>（年）が平均10年の指数分布（レート <span class=\"math-inline\">$\\lambda=0.1$<\/span>）に従うとします。<span class=\"math-inline\">$S(t)=e^{-0.1t}$<\/span> です。<\/p>\n<ul>\n<li>5年後も点灯している確率：<span class=\"math-inline\">$S(5)=e^{-0.5}\\approx 0.6065$<\/span><\/li>\n<li>3年使えた電球が8年後も点灯している確率：<span class=\"math-inline\">$S(8)/S(3)=e^{-0.5}\\approx 0.6065$<\/span><\/li>\n<li>平均寿命：<span class=\"math-inline\">$\\int_0^\\infty e^{-0.1t}dt = 10$<\/span><\/li>\n<\/ul>\n<p>2つ目が1つ目と同じ値になるのが、指数分布の<strong>無記憶性<\/strong>です。<\/p>\n<p><strong>例2：ワイブル分布（劣化する部品）<\/strong><\/p>\n<p><span class=\"math-inline\">$S(t)=\\exp\\{-(t/10)^2\\}$<\/span>（形状2、尺度10のワイブル分布）とします。<\/p>\n<ul>\n<li><span class=\"math-inline\">$S(5)=e^{-0.25}\\approx 0.7788$<\/span>、<span class=\"math-inline\">$S(10)=e^{-1}\\approx 0.3679$<\/span><\/li>\n<li>5年使えた部品が10年後も使える確率：<span class=\"math-inline\">$S(10)/S(5)=e^{-0.75}\\approx 0.4724$<\/span><\/li>\n<\/ul>\n<p>新品が5年もつ確率（0.7788）より明らかに小さく、使うほど壊れやすくなる様子がわかります。\n平均寿命は <span class=\"math-inline\">$10\\,\\Gamma(1.5)\\approx 8.862$<\/span> 年です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：治療後の生存率を生存曲線として描き、「5年生存率」などを比べます。打ち切りのあるデータからはカプラン・マイヤー推定量で <span class=\"math-inline\">$S(t)$<\/span> を推定します。<\/li>\n<li><strong>製造・品質管理<\/strong>：信頼性工学では <span class=\"math-inline\">$S(t)$<\/span> を「信頼度」と呼び、部品が保証期間を無故障で乗り切る確率を見積もります。<\/li>\n<li><strong>IT・Webサービス<\/strong>：会員登録から解約までの期間を生存時間とみなし、継続率の曲線を作ってプランごとに比較します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>左の生存曲線は1から始まって0に向かって下がります。形状 k を大きくすると、最初はほとんど下がらず、ある時期に一気に下がる形（劣化型）になります。\n右のハザード関数と見比べると、ハザードが大きい時期に生存曲線が急に下がることがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$S(t)=1-F(t)$<\/span>、<span class=\"math-inline\">$f(t)=-S'(t)$<\/span>、<span class=\"math-inline\">$E[T]=\\int_0^\\infty S(t)dt$<\/span> の3つは即座に使えるようにします。<\/li>\n<li>条件付き生存確率 <span class=\"math-inline\">$S(t+s)/S(t)$<\/span> を計算させ、指数分布なら無記憶性で <span class=\"math-inline\">$S(s)$<\/span> に等しくなる、という流れが重要です。<\/li>\n<li>ハザード関数 <span class=\"math-inline\">$h(t)$<\/span> との関係 <span class=\"math-inline\">$S(t)=\\exp\\{-\\int_0^t h(u)du\\}$<\/span> を使って、ハザードから生存関数を復元する問題が典型です。<\/li>\n<li>独立な部品を直列につないだ系の生存関数は、各部品の生存関数の積です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$S(t)=P(T\\ge t)$<\/span> と <span class=\"math-inline\">$P(T&gt;t)$<\/span> を離散型でも同じとみなす → ○ 連続型では同じですが、離散型では <span class=\"math-inline\">$P(T=t)$<\/span> の分だけ違います。<\/li>\n<li>× 生存曲線の高さを「その時点で死亡する確率」と読む → ○ 高さは「まだ生きている割合」です。その時点での死亡の起こりやすさはハザード関数で表します。<\/li>\n<li>× 平均寿命を <span class=\"math-inline\">$S(t)=0.5$<\/span> となる <span class=\"math-inline\">$t$<\/span> とする → ○ それは中央値です。平均は曲線の下の面積です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「時刻 を過ぎてもまだ生きている（壊れていない）確率」を表す関数です。 累積分布関数を「1から引いたもの」で、寿命や待ち時間を扱うときの主役になります。 定義・数式 非負の確率変数 （寿命、故障までの時間など）の累積分布関数を とすると、生存関数は です。連続型で密度 をもつときは 性質： （ のとき）、単調非増加、 。 期待値は生存関数の積分で書けます（ のとき）。 離散型で が の値をとるときは、 です。 数式の読み解き - ：時刻 の時点で「まだイベントが起きていない」割合。最初は1で、時間とともに減ります。 - ：生存曲線の下がる速さが密度です。急に下がる時期ほど、イベントが集中しています。 の導出は、 と書いて両辺の期待値をとるだけです。 積分と期待値を入れ替えると になります。 図で言えば「生存曲線の下の面積＝平均寿命」です。 条件付きの生存確率は比で表せます。 「すでに まで生きた人が、さらに 生きる確率」です。 具体例 例1：指数分布の電球 寿命 （年）が平均10年の指数分布（レート ）に従うとします。 です。 - 5年後も点灯している確率： - 3年使えた電球が8年後も点灯している確率： - 平均寿命： 2つ目が1つ目と同じ値になるのが、指数分布の無記憶性です。 例2：ワイブル分布（劣化する部品） （形状2、尺度10のワイブル分布）とします。 - 、 - 5年使えた部品が10年後も使える確率： 新品が5年もつ確率（0.7788）より明らかに小さく、使うほど壊れやすくなる様子がわかります。 平均寿命は 年です。 現場での使われ方 - 医療：治療後の生存率を生存曲線として描き、「5年生存率」などを比べます。打ち切りのあるデータからはカプラン・マイヤー推定量で を推定します。 - 製造・品質管理：信頼性工学では を「信頼度」と呼び、部品が保証期間を無故障で乗り切る確率を見積もります。 - IT・Webサービス：会員登録から解約までの期間を生存時間とみなし、継続率の曲線を作ってプランごとに比較します。 グラフ・イメージ 左の生存曲線は1から始まって0に向かって下がります。形状 k を大きくすると、最初はほとんど下がらず、ある時期に一気に下がる形（劣化型）になります。 右のハザード関数と見比べると、ハザードが大きい時期に生存曲線が急に下がることがわかります。 試験のポイント - 、 、 の3つは即座に使えるようにします。 - 条件付き生存確率 を計算させ、指数分布なら無記憶性で に等しくなる、という流れが重要です。 - ハザード関数 との関係 を使って、ハザードから生存関数を復元する問題が典型です。 - 独立な部品を直列につないだ系の生存関数は、各部品の生存関数の積です。 よくある間違い - × と を離散型でも同じとみなす → ○ 連続型では同じですが、離散型では の分だけ違います。 - × 生存曲線の高さを「その時点で死亡する確率」と読む → ○ 高さは「まだ生きている割合」です。その時点での死亡の起こりやすさはハザード関数で表します。 - × 平均寿命を となる とする → ○ それは中央値です。平均は曲線の下の面積です。"},"coefficient-of-variation":{"id":"coefficient-of-variation","title":"変動係数","reading":"へんどうけいすう","en":"Coefficient of variation","aliases":["CV","相対標準偏差"],"chapter":3,"importance":"B","tags":["ばらつき","標準偏差","尺度"],"related":["expectation-variance-properties","skewness-kurtosis","gamma-distribution","poisson-distribution","exponential-distribution"],"charts":[{"type":"pdf","dist":"gamma","params":{"shape":4,"scale":1},"sliders":[{"param":"shape","label":"形状 k（CV = 1/√k）","min":0.5,"max":20,"step":0.5},{"param":"scale","label":"尺度 θ（CV は不変）","min":0.5,"max":3,"step":0.1}],"x":{"min":0,"max":40},"caption":"ガンマ分布の変動係数は 1/√k で尺度 θ によらない。θ を動かすと横に伸び縮みするだけで「相対的な広がり」は同じ。k を大きくすると平均に比べて幅が細くなる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>標準偏差を平均で割った、「平均に対してどのくらいばらついているか」を表す単位のない指標です。\n単位や大きさの違うものどうしのばらつきを比べるときに使います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>正の値をとる確率変数 <span class=\"math-inline\">$X$<\/span>（平均 <span class=\"math-inline\">$\\mu&gt;0$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma$<\/span>）について<\/p>\n<div class=\"math-display\">$$\\mathrm{CV} = \\frac{\\sigma}{\\mu}$$<\/div>\n<p>を<strong>変動係数<\/strong>といいます。データ <span class=\"math-inline\">$x_1,\\dots,x_n$<\/span> では標本平均 <span class=\"math-inline\">$\\bar x$<\/span> と標本標準偏差 <span class=\"math-inline\">$s$<\/span> を使い <span class=\"math-inline\">$s/\\bar x$<\/span> とします。百分率（%）で示すこともあります。<\/p>\n<p>前提：平均が正で、値が比率尺度（0 に意味があり、比が意味を持つ）であること。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\sigma$<\/span> と <span class=\"math-inline\">$\\mu$<\/span> は同じ単位なので、比をとると単位が消えます。<\/li>\n<li><span class=\"math-inline\">$X$<\/span> を <span class=\"math-inline\">$c$<\/span> 倍（<span class=\"math-inline\">$c&gt;0$<\/span>）しても <span class=\"math-inline\">$\\sigma$<\/span> も <span class=\"math-inline\">$\\mu$<\/span> も <span class=\"math-inline\">$c$<\/span> 倍になるので、CV は変わりません（尺度不変）。cm でも m でも同じ値です。<\/li>\n<li>一方、定数を足すと <span class=\"math-inline\">$\\mu$<\/span> だけが変わるので CV は変わります。摂氏と華氏のように原点が任意の量（間隔尺度）には使いません。<\/li>\n<\/ul>\n<p>代表的な分布の変動係数：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>分布<\/th>\n<th>平均<\/th>\n<th>標準偏差<\/th>\n<th>CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>指数分布（レート <span class=\"math-inline\">$\\lambda$<\/span>）<\/td>\n<td><span class=\"math-inline\">$1/\\lambda$<\/span><\/td>\n<td><span class=\"math-inline\">$1/\\lambda$<\/span><\/td>\n<td><span class=\"math-inline\">$1$<\/span><\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布 <span class=\"math-inline\">$Po(\\lambda)$<\/span><\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span><\/td>\n<td><span class=\"math-inline\">$\\sqrt{\\lambda}$<\/span><\/td>\n<td><span class=\"math-inline\">$1/\\sqrt{\\lambda}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>ガンマ分布（形状 <span class=\"math-inline\">$k$<\/span>、尺度 <span class=\"math-inline\">$\\theta$<\/span>）<\/td>\n<td><span class=\"math-inline\">$k\\theta$<\/span><\/td>\n<td><span class=\"math-inline\">$\\sqrt{k}\\,\\theta$<\/span><\/td>\n<td><span class=\"math-inline\">$1/\\sqrt{k}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>指数分布の CV がちょうど1であることは、「到着間隔が規則的（CV&lt;1）か、ばらばら（CV≈1）か、固まって来る（CV&gt;1）か」を判断する目安になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：身長と体重のばらつきを比べる<\/strong><\/p>\n<p>ある集団で、身長は平均 170 cm・標準偏差 5.7 cm、体重は平均 60 kg・標準偏差 9 kg でした。<\/p>\n<div class=\"math-display\">$$\\mathrm{CV}_{\\text{身長}} = \\frac{5.7}{170} \\approx 0.0335, \\qquad\n\\mathrm{CV}_{\\text{体重}} = \\frac{9}{60} = 0.15$$<\/div>\n<p>標準偏差の数字（5.7 と 9）は単位が違うので比べられませんが、CV なら体重のほうが相対的に約4.5倍ばらついているとわかります。<\/p>\n<p><strong>例2：ガンマ分布<\/strong><\/p>\n<p>形状 <span class=\"math-inline\">$k=4$<\/span> のガンマ分布の CV は <span class=\"math-inline\">$1/\\sqrt{4}=0.5$<\/span> です。尺度 <span class=\"math-inline\">$\\theta$<\/span> を何にしても変わりません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：大きさの違う部品の寸法精度を比べるとき、標準偏差ではなく CV で比べます。<\/li>\n<li><strong>医療<\/strong>：臨床検査の測定精度（同じ検体を繰り返し測ったときの再現性）を CV% で表し、基準を満たすか確認します。<\/li>\n<li><strong>金融・保険<\/strong>：リターン1単位あたりのリスクの比較に、標準偏差÷平均（またはその逆数）を使います。<\/li>\n<li><strong>行政・調査<\/strong>：統計表の推定値の精度を「標準誤差÷推定値」（標準誤差率）で示し、信頼できる数字かどうかの目安にします。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>ガンマ分布の密度です。尺度 θ を動かしても分布は横に伸び縮みするだけで、CV は変わりません。\n形状 k を大きくすると、平均の位置に対して山が細くなり、CV（<span class=\"math-inline\">$1/\\sqrt{k}$<\/span>）が小さくなる様子がわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定義 <span class=\"math-inline\">$\\sigma/\\mu$<\/span> と、単位をそろえずに比較できるという意味を押さえます。<\/li>\n<li>尺度変換（<span class=\"math-inline\">$c$<\/span> 倍）で不変、位置の移動では変わる点は重要です。<\/li>\n<li>指数分布の CV=1、ポアソン分布の <span class=\"math-inline\">$1/\\sqrt{\\lambda}$<\/span> のように、分布の平均と分散から CV を計算させる形が典型です。<\/li>\n<li>標本平均 <span class=\"math-inline\">$\\bar X$<\/span> の CV は <span class=\"math-inline\">$\\sigma/(\\sqrt{n}\\,\\mu)$<\/span> で、標本サイズを4倍にすると半分になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 平均が0に近い量や負の値をとる量にも使う → ○ 分母が0に近いと CV は不安定に大きくなります。正の値をとる比率尺度の量に使います。<\/li>\n<li>× 気温（摂氏）のばらつきを CV で比べる → ○ 原点が任意の量では、単位を変えると CV が変わってしまうので意味がありません。<\/li>\n<li>× 分散を平均で割る → ○ 変動係数は「標準偏差」÷平均です。分散÷平均は別の指標（分散指数、ポアソン分布で1）です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 標準偏差を平均で割った、「平均に対してどのくらいばらついているか」を表す単位のない指標です。 単位や大きさの違うものどうしのばらつきを比べるときに使います。 定義・数式 正の値をとる確率変数 （平均 、標準偏差 ）について を変動係数といいます。データ では標本平均 と標本標準偏差 を使い とします。百分率（%）で示すこともあります。 前提：平均が正で、値が比率尺度（0 に意味があり、比が意味を持つ）であること。 数式の読み解き - と は同じ単位なので、比をとると単位が消えます。 - を 倍（ ）しても も も 倍になるので、CV は変わりません（尺度不変）。cm でも m でも同じ値です。 - 一方、定数を足すと だけが変わるので CV は変わります。摂氏と華氏のように原点が任意の量（間隔尺度）には使いません。 代表的な分布の変動係数： 分布 平均 標準偏差 CV 指数分布（レート ） ポアソン分布 ガンマ分布（形状 、尺度 ） 指数分布の CV がちょうど1であることは、「到着間隔が規則的（CV<1）か、ばらばら（CV≈1）か、固まって来る（CV1）か」を判断する目安になります。 具体例 例1：身長と体重のばらつきを比べる ある集団で、身長は平均 170 cm・標準偏差 5.7 cm、体重は平均 60 kg・標準偏差 9 kg でした。 標準偏差の数字（5.7 と 9）は単位が違うので比べられませんが、CV なら体重のほうが相対的に約4.5倍ばらついているとわかります。 例2：ガンマ分布 形状 のガンマ分布の CV は です。尺度 を何にしても変わりません。 現場での使われ方 - 製造・品質管理：大きさの違う部品の寸法精度を比べるとき、標準偏差ではなく CV で比べます。 - 医療：臨床検査の測定精度（同じ検体を繰り返し測ったときの再現性）を CV% で表し、基準を満たすか確認します。 - 金融・保険：リターン1単位あたりのリスクの比較に、標準偏差÷平均（またはその逆数）を使います。 - 行政・調査：統計表の推定値の精度を「標準誤差÷推定値」（標準誤差率）で示し、信頼できる数字かどうかの目安にします。 グラフ・イメージ ガンマ分布の密度です。尺度 θ を動かしても分布は横に伸び縮みするだけで、CV は変わりません。 形状 k を大きくすると、平均の位置に対して山が細くなり、CV（ ）が小さくなる様子がわかります。 試験のポイント - 定義 と、単位をそろえずに比較できるという意味を押さえます。 - 尺度変換（ 倍）で不変、位置の移動では変わる点は重要です。 - 指数分布の CV=1、ポアソン分布の のように、分布の平均と分散から CV を計算させる形が典型です。 - 標本平均 の CV は で、標本サイズを4倍にすると半分になります。 よくある間違い - × 平均が0に近い量や負の値をとる量にも使う → ○ 分母が0に近いと CV は不安定に大きくなります。正の値をとる比率尺度の量に使います。 - × 気温（摂氏）のばらつきを CV で比べる → ○ 原点が任意の量では、単位を変えると CV が変わってしまうので意味がありません。 - × 分散を平均で割る → ○ 変動係数は「標準偏差」÷平均です。分散÷平均は別の指標（分散指数、ポアソン分布で1）です。"},"conditional-expectation":{"id":"conditional-expectation","title":"条件付き期待値","reading":"じょうけんつききたいち","en":"Conditional expectation","aliases":["条件つき期待値","繰り返し期待値の法則","タワー性"],"chapter":3,"importance":"A","tags":["条件付き分布","回帰関数","繰り返し期待値"],"related":["conditional-variance","conditional-probability-function","conditional-probability-density-function","expectation-variance-properties","bivariate-normal-distribution"],"charts":[{"type":"scatter","model":"regression","params":{"beta0":1,"beta1":0.8,"sigma":1,"n":200},"sliders":[{"param":"beta1","label":"傾き β1","min":-2,"max":2,"step":0.1},{"param":"sigma","label":"誤差の標準偏差 σ","min":0.1,"max":3,"step":0.1},{"param":"n","label":"点の数 n","min":20,"max":1000,"step":10}],"caption":"Y = β0 + β1 x + 誤差 から作った散布図。x を固定したときの Y の平均 E[Y|X=x] = β0 + β1 x が、点の雲の真ん中を通る直線になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「<span class=\"math-inline\">$X$<\/span> の値がわかったとき、<span class=\"math-inline\">$Y$<\/span> は平均してどのくらいになるか」を表すものです。\n<span class=\"math-inline\">$X$<\/span> の値ごとに <span class=\"math-inline\">$Y$<\/span> の平均を求めた関数で、回帰分析の「回帰関数」の正体です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$X=x$<\/span> を与えたときの <span class=\"math-inline\">$Y$<\/span> の条件付き分布を使って<\/p>\n<div class=\"math-display\">$$E[Y \\mid X=x] =\n\\begin{cases}\n\\displaystyle\\sum_{y} y\\, p_{Y\\mid X}(y \\mid x) = \\sum_y y\\,\\frac{p(x,y)}{p_X(x)} &amp; (\\text{離散型},\\ p_X(x)&gt;0)\\\\[2ex]\n\\displaystyle\\int_{-\\infty}^{\\infty} y\\, f_{Y\\mid X}(y \\mid x)\\,dy = \\int y\\,\\frac{f(x,y)}{f_X(x)}\\,dy &amp; (\\text{連続型},\\ f_X(x)&gt;0)\n\\end{cases}$$<\/div>\n<p>と定義します。これは <span class=\"math-inline\">$x$<\/span> の関数 <span class=\"math-inline\">$m(x)$<\/span> です。<span class=\"math-inline\">$x$<\/span> に確率変数 <span class=\"math-inline\">$X$<\/span> を代入した <span class=\"math-inline\">$m(X)$<\/span> を <span class=\"math-inline\">$E[Y\\mid X]$<\/span> と書き、これ自体が確率変数です。<\/p>\n<p>主な性質（<span class=\"math-inline\">$E[|Y|]&lt;\\infty$<\/span> とする）：<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\n&amp;E\\big[E[Y \\mid X]\\big] = E[Y] \\qquad (\\text{繰り返し期待値の法則}) \\\\\n&amp;E[g(X)\\,Y \\mid X] = g(X)\\,E[Y \\mid X] \\\\\n&amp;X, Y \\text{ が独立なら } E[Y \\mid X] = E[Y]\n\\end{aligned}$$<\/div>\n<p>さらに <span class=\"math-inline\">$E[Y^2]&lt;\\infty$<\/span> なら、<span class=\"math-inline\">$E[Y\\mid X]$<\/span> は <span class=\"math-inline\">$X$<\/span> の関数による <span class=\"math-inline\">$Y$<\/span> の予測のうち、平均二乗誤差 <span class=\"math-inline\">$E[(Y-h(X))^2]$<\/span> を最小にするものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p(x,y)/p_X(x)$<\/span> は、<span class=\"math-inline\">$X=x$<\/span> の行だけを取り出して、合計が1になるように割り直した条件付き分布です。その分布で <span class=\"math-inline\">$Y$<\/span> の平均を取ります。<\/li>\n<li><span class=\"math-inline\">$E[Y\\mid X=x]$<\/span> は数（<span class=\"math-inline\">$x$<\/span> の関数）、<span class=\"math-inline\">$E[Y\\mid X]$<\/span> は確率変数です。この区別が大事です。<\/li>\n<li><strong>繰り返し期待値の法則の導出<\/strong>（離散型）：<\/li>\n<\/ul>\n<div class=\"math-display\">$$E\\big[E[Y\\mid X]\\big] = \\sum_x p_X(x) \\sum_y y\\,\\frac{p(x,y)}{p_X(x)} = \\sum_x\\sum_y y\\,p(x,y) = E[Y]$$<\/div>\n<p>「グループごとの平均を、グループの大きさで重みづけして平均すると、全体の平均になる」という当たり前のことを式にしたものです。\n- <span class=\"math-inline\">$E[g(X)Y\\mid X]=g(X)E[Y\\mid X]$<\/span>：<span class=\"math-inline\">$X$<\/span> がわかっている世界では <span class=\"math-inline\">$g(X)$<\/span> は定数なので、外に出せます。\n- <strong>最良予測であることの筋道<\/strong>：<span class=\"math-inline\">$m(X)=E[Y\\mid X]$<\/span> として、任意の <span class=\"math-inline\">$h(X)$<\/span> について<\/p>\n<div class=\"math-display\">$$E[(Y-h(X))^2] = E[(Y-m(X))^2] + E[(m(X)-h(X))^2]$$<\/div>\n<p>が成り立ちます（交差項は、<span class=\"math-inline\">$X$<\/span> で条件づけると <span class=\"math-inline\">$E[Y-m(X)\\mid X]=0$<\/span> になるので消えます）。右辺の第2項は0以上なので、<span class=\"math-inline\">$h=m$<\/span> のとき最小です。「平均は二乗誤差を最小にする予測値」という性質の条件付き版です。\n- 2変量正規分布では、条件付き期待値は <span class=\"math-inline\">$x$<\/span> の1次式になります。<\/p>\n<div class=\"math-display\">$$E[Y\\mid X=x] = \\mu_Y + \\rho\\,\\frac{\\sigma_Y}{\\sigma_X}\\,(x-\\mu_X)$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：同時確率表から<\/strong><\/p>\n<p><span class=\"math-inline\">$X, Y \\in \\{0,1\\}$<\/span> で <span class=\"math-inline\">$P(0,0)=0.3,\\ P(0,1)=0.2,\\ P(1,0)=0.1,\\ P(1,1)=0.4$<\/span> とします。<span class=\"math-inline\">$P(X=0)=P(X=1)=0.5$<\/span> なので<\/p>\n<div class=\"math-display\">$$E[Y\\mid X=0] = \\frac{0.2}{0.5} = 0.4, \\qquad E[Y\\mid X=1] = \\frac{0.4}{0.5} = 0.8$$<\/div>\n<p>繰り返し期待値の法則で確かめると、<span class=\"math-inline\">$0.5\\times0.4 + 0.5\\times0.8 = 0.6 = E[Y]$<\/span> です。<\/p>\n<p><strong>例2：来店客の売上合計<\/strong><\/p>\n<p>1日の来店客数 <span class=\"math-inline\">$N$<\/span> が平均 20 人のポアソン分布に従い、各客の購入額 <span class=\"math-inline\">$X_1, X_2, \\dots$<\/span> は <span class=\"math-inline\">$N$<\/span> と独立に平均 3 千円とします。売上合計 <span class=\"math-inline\">$S=X_1+\\cdots+X_N$<\/span> について、<span class=\"math-inline\">$N=n$<\/span> なら <span class=\"math-inline\">$E[S\\mid N=n]=3n$<\/span> なので <span class=\"math-inline\">$E[S\\mid N]=3N$<\/span> です。<\/p>\n<div class=\"math-display\">$$E[S] = E\\big[E[S\\mid N]\\big] = 3\\,E[N] = 3 \\times 20 = 60 \\ (\\text{千円})$$<\/div>\n<p><strong>例3：父親と息子の身長<\/strong><\/p>\n<p>父親の身長 <span class=\"math-inline\">$X$<\/span> と息子の身長 <span class=\"math-inline\">$Y$<\/span> が、ともに平均 170 cm・標準偏差 6 cm、相関係数 0.5 の2変量正規分布に従うとします。父親が 182 cm なら<\/p>\n<div class=\"math-display\">$$E[Y\\mid X=182] = 170 + 0.5 \\times \\frac{6}{6} \\times (182-170) = 176 \\ (\\text{cm})$$<\/div>\n<p>父親が平均より 12 cm 高くても、息子の予測は 6 cm 高いだけです。これが「平均への回帰」です。<\/p>\n<p><strong>例4：連続型<\/strong><\/p>\n<p><span class=\"math-inline\">$X\\sim U(0,1)$<\/span> で、<span class=\"math-inline\">$X=x$<\/span> のもとで <span class=\"math-inline\">$Y\\sim U(0,x)$<\/span> とすると、<span class=\"math-inline\">$E[Y\\mid X]=X/2$<\/span> です。よって <span class=\"math-inline\">$E[Y]=E[X]/2=1/4$<\/span> です。<span class=\"math-inline\">$Y$<\/span> の周辺分布を求めなくても期待値が出せます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：保険金の総額を「件数 × 1件あたりの額」として、件数で条件づけてから期待値を計算します（複合ポアソンモデル）。<\/li>\n<li><strong>マーケティング<\/strong>：顧客属性 <span class=\"math-inline\">$X$<\/span> ごとの購入額の平均 <span class=\"math-inline\">$E[Y\\mid X]$<\/span> を推定し、どの層に施策を打つかを決めます。<\/li>\n<li><strong>医療<\/strong>：年齢・性別ごとの検査値の平均を基準値として使い、個人の値がその平均からどれだけ離れているかを評価します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：機械学習の回帰モデルは、二乗誤差を最小にするように学習するので、<span class=\"math-inline\">$E[Y\\mid X]$<\/span> を推定していることになります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$Y=\\beta_0+\\beta_1x+\\varepsilon$<\/span> から作った散布図です。どの <span class=\"math-inline\">$x$<\/span> で縦に切っても、点の平均は直線 <span class=\"math-inline\">$\\beta_0+\\beta_1x$<\/span> の上にあり、これが <span class=\"math-inline\">$E[Y\\mid X=x]$<\/span> です。\nσ を大きくしても直線（条件付き期待値）は変わらず、そのまわりの散らばり（条件付き分散）だけが大きくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>繰り返し期待値の法則 <span class=\"math-inline\">$E[Y]=E[E[Y\\mid X]]$<\/span> は、ランダムな個数の和、階層モデル、混合分布の期待値で頻繁に使う重要な道具です。<\/li>\n<li>同時確率表や同時密度から、条件付き分布を作ってから期待値を計算する流れを確実にこなせるようにします。<\/li>\n<li>2変量正規分布の条件付き期待値の式（傾き <span class=\"math-inline\">$\\rho\\sigma_Y/\\sigma_X$<\/span>）は暗記します。<\/li>\n<li>条件付き分散と組み合わせた全分散の公式 <span class=\"math-inline\">$V[Y]=E[V[Y\\mid X]]+V[E[Y\\mid X]]$<\/span> とセットで出されることが多い形です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$E[Y\\mid X]$<\/span> を定数として扱う → ○ <span class=\"math-inline\">$E[Y\\mid X]$<\/span> は <span class=\"math-inline\">$X$<\/span> の関数で、確率変数です。<span class=\"math-inline\">$E[Y\\mid X=x]$<\/span> と区別します。<\/li>\n<li>× 条件付き分布を作るときに、同時確率を全体の和1のまま使う → ○ 周辺確率 <span class=\"math-inline\">$p_X(x)$<\/span> で割って、条件付きの確率の和を1にします。<\/li>\n<li>× <span class=\"math-inline\">$E[Y\\mid X]=E[Y]$<\/span> なら独立 → ○ 平均が <span class=\"math-inline\">$X$<\/span> によらないだけで、分散など他の性質は <span class=\"math-inline\">$X$<\/span> に依存することがあります。独立はより強い条件です。<\/li>\n<li>× 例3で、息子の身長から父親を予測するときも同じ直線を逆に使う → ○ <span class=\"math-inline\">$E[X\\mid Y=y]$<\/span> は別の直線（傾き <span class=\"math-inline\">$\\rho\\sigma_X/\\sigma_Y$<\/span>）です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「 の値がわかったとき、 は平均してどのくらいになるか」を表すものです。 の値ごとに の平均を求めた関数で、回帰分析の「回帰関数」の正体です。 定義・数式 を与えたときの の条件付き分布を使って と定義します。これは の関数 です。 に確率変数 を代入した を と書き、これ自体が確率変数です。 主な性質（ とする）： さらに なら、 は の関数による の予測のうち、平均二乗誤差 を最小にするものです。 数式の読み解き - は、 の行だけを取り出して、合計が1になるように割り直した条件付き分布です。その分布で の平均を取ります。 - は数（ の関数）、 は確率変数です。この区別が大事です。 - 繰り返し期待値の法則の導出（離散型）： 「グループごとの平均を、グループの大きさで重みづけして平均すると、全体の平均になる」という当たり前のことを式にしたものです。 - ： がわかっている世界では は定数なので、外に出せます。 - 最良予測であることの筋道： として、任意の について が成り立ちます（交差項は、 で条件づけると になるので消えます）。右辺の第2項は0以上なので、 のとき最小です。「平均は二乗誤差を最小にする予測値」という性質の条件付き版です。 - 2変量正規分布では、条件付き期待値は の1次式になります。 具体例 例1：同時確率表から で とします。 なので 繰り返し期待値の法則で確かめると、 です。 例2：来店客の売上合計 1日の来店客数 が平均 20 人のポアソン分布に従い、各客の購入額 は と独立に平均 3 千円とします。売上合計 について、 なら なので です。 例3：父親と息子の身長 父親の身長 と息子の身長 が、ともに平均 170 cm・標準偏差 6 cm、相関係数 0.5 の2変量正規分布に従うとします。父親が 182 cm なら 父親が平均より 12 cm 高くても、息子の予測は 6 cm 高いだけです。これが「平均への回帰」です。 例4：連続型 で、 のもとで とすると、 です。よって です。 の周辺分布を求めなくても期待値が出せます。 現場での使われ方 - 金融・保険：保険金の総額を「件数 × 1件あたりの額」として、件数で条件づけてから期待値を計算します（複合ポアソンモデル）。 - マーケティング：顧客属性 ごとの購入額の平均 を推定し、どの層に施策を打つかを決めます。 - 医療：年齢・性別ごとの検査値の平均を基準値として使い、個人の値がその平均からどれだけ離れているかを評価します。 - IT・Webサービス：機械学習の回帰モデルは、二乗誤差を最小にするように学習するので、 を推定していることになります。 グラフ・イメージ から作った散布図です。どの で縦に切っても、点の平均は直線 の上にあり、これが です。 σ を大きくしても直線（条件付き期待値）は変わらず、そのまわりの散らばり（条件付き分散）だけが大きくなります。 試験のポイント - 繰り返し期待値の法則 は、ランダムな個数の和、階層モデル、混合分布の期待値で頻繁に使う重要な道具です。 - 同時確率表や同時密度から、条件付き分布を作ってから期待値を計算する流れを確実にこなせるようにします。 - 2変量正規分布の条件付き期待値の式（傾き ）は暗記します。 - 条件付き分散と組み合わせた全分散の公式 とセットで出されることが多い形です。 よくある間違い - × を定数として扱う → ○ は の関数で、確率変数です。 と区別します。 - × 条件付き分布を作るときに、同時確率を全体の和1のまま使う → ○ 周辺確率 で割って、条件付きの確率の和を1にします。 - × なら独立 → ○ 平均が によらないだけで、分散など他の性質は に依存することがあります。独立はより強い条件です。 - × 例3で、息子の身長から父親を予測するときも同じ直線を逆に使う → ○ は別の直線（傾き ）です。"},"conditional-variance":{"id":"conditional-variance","title":"条件付き分散","reading":"じょうけんつきぶんさん","en":"Conditional variance","aliases":["条件つき分散","全分散の公式","分散の分解公式"],"chapter":3,"importance":"A","tags":["条件付き分布","全分散の公式","群内変動","群間変動"],"related":["conditional-expectation","expectation-variance-properties","normal-mixture-distribution","bivariate-normal-distribution","conditional-probability-density-function"],"charts":[{"type":"pdf","dist":"normmix","params":{"w":0.5,"mu1":0,"sigma1":1,"mu2":4,"sigma2":1},"sliders":[{"param":"w","label":"グループ1の割合 w","min":0.05,"max":0.95,"step":0.05},{"param":"mu2","label":"グループ2の平均 μ2","min":0,"max":8,"step":0.5},{"param":"sigma1","label":"グループ1の標準偏差 σ1","min":0.3,"max":3,"step":0.1},{"param":"sigma2","label":"グループ2の標準偏差 σ2","min":0.3,"max":3,"step":0.1}],"x":{"min":-6,"max":14},"caption":"2つのグループを混ぜた分布。全体の分散は「グループ内の分散の平均」と「グループの平均どうしのばらつき」の和になる。μ2 を離すと後者が増え、山が2つに割れる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「<span class=\"math-inline\">$X$<\/span> の値がわかったとき、<span class=\"math-inline\">$Y$<\/span> がその条件付き平均のまわりでどのくらいばらつくか」を表す量です。\n全分散の公式によって、全体のばらつきを「グループ内のばらつき」と「グループ間のばらつき」に分けられます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$X=x$<\/span> を与えたときの <span class=\"math-inline\">$Y$<\/span> の条件付き分散は<\/p>\n<div class=\"math-display\">$$V[Y \\mid X=x] = E\\Big[\\big(Y - E[Y\\mid X=x]\\big)^2 \\,\\Big|\\, X=x\\Big] = E[Y^2\\mid X=x] - \\big(E[Y\\mid X=x]\\big)^2$$<\/div>\n<p>です。<span class=\"math-inline\">$x$<\/span> に <span class=\"math-inline\">$X$<\/span> を代入した <span class=\"math-inline\">$V[Y\\mid X]$<\/span> は確率変数です。<span class=\"math-inline\">$E[Y^2]&lt;\\infty$<\/span> のとき、次の<strong>全分散の公式<\/strong>（分散の分解公式）が成り立ちます。<\/p>\n<div class=\"math-display\">$$V[Y] = E\\big[V[Y\\mid X]\\big] + V\\big[E[Y\\mid X]\\big]$$<\/div>\n<ul>\n<li>第1項 <span class=\"math-inline\">$E[V[Y\\mid X]]$<\/span>：条件付き分散の平均（グループ内の分散の平均）<\/li>\n<li>第2項 <span class=\"math-inline\">$V[E[Y\\mid X]]$<\/span>：条件付き期待値の分散（グループの平均どうしのばらつき）<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<p><strong>全分散の公式の導出<\/strong>：<span class=\"math-inline\">$m(X)=E[Y\\mid X]$<\/span> とおきます。条件付き分散の定義から <span class=\"math-inline\">$E[Y^2\\mid X] = V[Y\\mid X] + m(X)^2$<\/span> です。両辺の期待値をとり、繰り返し期待値の法則を使うと<\/p>\n<div class=\"math-display\">$$E[Y^2] = E\\big[V[Y\\mid X]\\big] + E\\big[m(X)^2\\big]$$<\/div>\n<p>です。また <span class=\"math-inline\">$E[Y]=E[m(X)]$<\/span> なので、<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nV[Y] &amp;= E[Y^2] - (E[Y])^2 \\\\\n&amp;= E\\big[V[Y\\mid X]\\big] + \\Big\\{E\\big[m(X)^2\\big] - \\big(E[m(X)]\\big)^2\\Big\\} \\\\\n&amp;= E\\big[V[Y\\mid X]\\big] + V\\big[m(X)\\big]\n\\end{aligned}$$<\/div>\n<p>となります。<\/p>\n<ul>\n<li>直感的には、クラスごとの点数を考えるとわかりやすくなります。全員の点数のばらつきは、「各クラスの中でのばらつき」と「クラス平均どうしの差」の2つの原因から生まれます。前者を平均したものが第1項、後者が第2項です。<\/li>\n<li>両方の項が0以上なので、<span class=\"math-inline\">$E[V[Y\\mid X]] \\le V[Y]$<\/span> です。「<span class=\"math-inline\">$X$<\/span> がわかると、平均的にはばらつきが減る（増えない）」ことを意味します。<\/li>\n<li>分散分析の「総平方和 ＝ 群内平方和 ＋ 群間平方和」は、この公式のデータ版です。<\/li>\n<li>2変量正規分布では条件付き分散は <span class=\"math-inline\">$x$<\/span> によらず一定で、<span class=\"math-inline\">$V[Y\\mid X=x] = \\sigma_Y^2(1-\\rho^2)$<\/span> です。<span class=\"math-inline\">$\\rho^2$<\/span> は「<span class=\"math-inline\">$X$<\/span> で説明できる分散の割合」です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：同時確率表から<\/strong><\/p>\n<p><span class=\"math-inline\">$X, Y\\in\\{0,1\\}$<\/span> で <span class=\"math-inline\">$P(0,0)=0.3,\\ P(0,1)=0.2,\\ P(1,0)=0.1,\\ P(1,1)=0.4$<\/span> とします。<span class=\"math-inline\">$X=0$<\/span> のとき <span class=\"math-inline\">$Y$<\/span> は確率 0.4 で1、<span class=\"math-inline\">$X=1$<\/span> のとき確率 0.8 で1 なので<\/p>\n<div class=\"math-display\">$$V[Y\\mid X=0] = 0.4\\times0.6 = 0.24, \\qquad V[Y\\mid X=1] = 0.8\\times0.2 = 0.16$$<\/div>\n<p>各項を計算すると、<\/p>\n<div class=\"math-display\">$$E\\big[V[Y\\mid X]\\big] = 0.5\\times0.24 + 0.5\\times0.16 = 0.20$$<\/div>\n<div class=\"math-display\">$$V\\big[E[Y\\mid X]\\big] = 0.5\\times(0.4-0.6)^2 + 0.5\\times(0.8-0.6)^2 = 0.04$$<\/div>\n<p>合計 <span class=\"math-inline\">$0.24$<\/span> は、<span class=\"math-inline\">$Y$<\/span> の分散 <span class=\"math-inline\">$0.6\\times0.4=0.24$<\/span> と一致します。<\/p>\n<p><strong>例2：来店客の売上合計（複合ポアソン）<\/strong><\/p>\n<p>来店客数 <span class=\"math-inline\">$N\\sim Po(20)$<\/span>、各客の購入額は互いに独立で <span class=\"math-inline\">$N$<\/span> とも独立、平均 <span class=\"math-inline\">$\\mu=3$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma=2$<\/span>（千円）とします。売上合計 <span class=\"math-inline\">$S$<\/span> について <span class=\"math-inline\">$E[S\\mid N]=3N$<\/span>、<span class=\"math-inline\">$V[S\\mid N]=4N$<\/span> なので<\/p>\n<div class=\"math-display\">$$V[S] = E[4N] + V[3N] = 4\\times20 + 9\\times20 = 260$$<\/div>\n<p>標準偏差は <span class=\"math-inline\">$\\sqrt{260}\\approx16.125$<\/span> 千円です。一般に <span class=\"math-inline\">$V[S]=\\lambda(\\sigma^2+\\mu^2)=\\lambda E[X^2]$<\/span> になります。<\/p>\n<p><strong>例3：2変量正規分布<\/strong><\/p>\n<p>父親と息子の身長がともに標準偏差 6 cm、相関係数 0.5 なら、父親の身長を知ったあとの息子の身長の条件付き分散は<\/p>\n<div class=\"math-display\">$$V[Y\\mid X=x] = 36\\times(1-0.25) = 27$$<\/div>\n<p>条件付き標準偏差は <span class=\"math-inline\">$\\sqrt{27}\\approx5.196$<\/span> cm です。父親の情報で、ばらつきは 6 cm から約 5.2 cm に減ります。<\/p>\n<p><strong>例4：連続型<\/strong><\/p>\n<p><span class=\"math-inline\">$X\\sim U(0,1)$<\/span>、<span class=\"math-inline\">$X$<\/span> のもとで <span class=\"math-inline\">$Y\\sim U(0,X)$<\/span> とすると、<span class=\"math-inline\">$E[Y\\mid X]=X/2$<\/span>、<span class=\"math-inline\">$V[Y\\mid X]=X^2/12$<\/span> です。<\/p>\n<div class=\"math-display\">$$V[Y] = E\\Big[\\frac{X^2}{12}\\Big] + V\\Big[\\frac{X}{2}\\Big] = \\frac{1}{36} + \\frac{1}{48} = \\frac{7}{144} \\approx 0.0486$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：保険金総額の分散を、「件数のばらつき」と「1件あたりの額のばらつき」に分けて評価し、準備金を見積もります。<\/li>\n<li><strong>製造・品質管理<\/strong>：製品のばらつきを、ロット間（平均の違い）とロット内に分解し、どちらを減らすべきかを判断します。<\/li>\n<li><strong>行政・調査<\/strong>：層別抽出や集落抽出の精度を、層間・層内の分散に分けて設計します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：応答時間のばらつきを、サーバーごとの平均の差と各サーバー内のばらつきに分け、原因の所在を切り分けます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2つの正規分布を割合 <span class=\"math-inline\">$w$<\/span> で混ぜた分布です。グループの番号を <span class=\"math-inline\">$X$<\/span> とすると、全体の分散は <span class=\"math-inline\">$w\\sigma_1^2+(1-w)\\sigma_2^2$<\/span>（グループ内）と <span class=\"math-inline\">$w(1-w)(\\mu_1-\\mu_2)^2$<\/span>（グループ間）の和です。\nμ2 を μ1 から離すとグループ間の項が増え、山が2つに割れて全体の幅が広がります。σ1、σ2 を動かすとグループ内の項が変わります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>全分散の公式 <span class=\"math-inline\">$V[Y]=E[V[Y\\mid X]]+V[E[Y\\mid X]]$<\/span> は導出とともに必ず押さえます。ランダムな個数の和、混合分布、階層ベイズモデルの分散計算で使います。<\/li>\n<li>複合ポアソン分布の分散 <span class=\"math-inline\">$\\lambda E[X^2]$<\/span> は、全分散の公式の典型的な応用です。<\/li>\n<li>2変量正規分布の条件付き分散 <span class=\"math-inline\">$\\sigma_Y^2(1-\\rho^2)$<\/span> は暗記し、<span class=\"math-inline\">$x$<\/span> によらないことも覚えます。<\/li>\n<li>ポアソン分布の平均がガンマ分布に従って変動すると、分散が平均より大きくなる（過分散、負の二項分布）ことも、この公式で説明できます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$V[Y]=E[V[Y\\mid X]]$<\/span> → ○ 条件付き期待値のばらつき <span class=\"math-inline\">$V[E[Y\\mid X]]$<\/span> を足し忘れています。グループの平均が違えば、その差も全体のばらつきに入ります。<\/li>\n<li>× <span class=\"math-inline\">$V[Y] = V[E[Y\\mid X]] + V[V[Y\\mid X]]$<\/span> → ○ 第1項は条件付き分散の「期待値」です。<\/li>\n<li>× 例2で <span class=\"math-inline\">$V[S] = V[N]\\times V[X_i]$<\/span> とする → ○ 正しくは <span class=\"math-inline\">$E[N]\\sigma^2 + \\mu^2 V[N]$<\/span> です。<\/li>\n<li>× 条件付き分散はいつも元の分散より小さい → ○ 小さくなるのは「平均的に」です。特定の <span class=\"math-inline\">$x$<\/span> では <span class=\"math-inline\">$V[Y\\mid X=x] &gt; V[Y]$<\/span> となることがあります。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「 の値がわかったとき、 がその条件付き平均のまわりでどのくらいばらつくか」を表す量です。 全分散の公式によって、全体のばらつきを「グループ内のばらつき」と「グループ間のばらつき」に分けられます。 定義・数式 を与えたときの の条件付き分散は です。 に を代入した は確率変数です。 のとき、次の全分散の公式（分散の分解公式）が成り立ちます。 - 第1項 ：条件付き分散の平均（グループ内の分散の平均） - 第2項 ：条件付き期待値の分散（グループの平均どうしのばらつき） 数式の読み解き 全分散の公式の導出： とおきます。条件付き分散の定義から です。両辺の期待値をとり、繰り返し期待値の法則を使うと です。また なので、 となります。 - 直感的には、クラスごとの点数を考えるとわかりやすくなります。全員の点数のばらつきは、「各クラスの中でのばらつき」と「クラス平均どうしの差」の2つの原因から生まれます。前者を平均したものが第1項、後者が第2項です。 - 両方の項が0以上なので、 です。「 がわかると、平均的にはばらつきが減る（増えない）」ことを意味します。 - 分散分析の「総平方和 ＝ 群内平方和 ＋ 群間平方和」は、この公式のデータ版です。 - 2変量正規分布では条件付き分散は によらず一定で、 です。 は「 で説明できる分散の割合」です。 具体例 例1：同時確率表から で とします。 のとき は確率 0.4 で1、 のとき確率 0.8 で1 なので 各項を計算すると、 合計 は、 の分散 と一致します。 例2：来店客の売上合計（複合ポアソン） 来店客数 、各客の購入額は互いに独立で とも独立、平均 、標準偏差 （千円）とします。売上合計 について 、 なので 標準偏差は 千円です。一般に になります。 例3：2変量正規分布 父親と息子の身長がともに標準偏差 6 cm、相関係数 0.5 なら、父親の身長を知ったあとの息子の身長の条件付き分散は 条件付き標準偏差は cm です。父親の情報で、ばらつきは 6 cm から約 5.2 cm に減ります。 例4：連続型 、 のもとで とすると、 、 です。 現場での使われ方 - 金融・保険：保険金総額の分散を、「件数のばらつき」と「1件あたりの額のばらつき」に分けて評価し、準備金を見積もります。 - 製造・品質管理：製品のばらつきを、ロット間（平均の違い）とロット内に分解し、どちらを減らすべきかを判断します。 - 行政・調査：層別抽出や集落抽出の精度を、層間・層内の分散に分けて設計します。 - IT・Webサービス：応答時間のばらつきを、サーバーごとの平均の差と各サーバー内のばらつきに分け、原因の所在を切り分けます。 グラフ・イメージ 2つの正規分布を割合 で混ぜた分布です。グループの番号を とすると、全体の分散は （グループ内）と （グループ間）の和です。 μ2 を μ1 から離すとグループ間の項が増え、山が2つに割れて全体の幅が広がります。σ1、σ2 を動かすとグループ内の項が変わります。 試験のポイント - 全分散の公式 は導出とともに必ず押さえます。ランダムな個数の和、混合分布、階層ベイズモデルの分散計算で使います。 - 複合ポアソン分布の分散 は、全分散の公式の典型的な応用です。 - 2変量正規分布の条件付き分散 は暗記し、 によらないことも覚えます。 - ポアソン分布の平均がガンマ分布に従って変動すると、分散が平均より大きくなる（過分散、負の二項分布）ことも、この公式で説明できます。 よくある間違い - × → ○ 条件付き期待値のばらつき を足し忘れています。グループの平均が違えば、その差も全体のばらつきに入ります。 - × → ○ 第1項は条件付き分散の「期待値」です。 - × 例2で とする → ○ 正しくは です。 - × 条件付き分散はいつも元の分散より小さい → ○ 小さくなるのは「平均的に」です。特定の では となることがあります。"},"correlation-matrix":{"id":"correlation-matrix","title":"相関係数行列","reading":"そうかんけいすうぎょうれつ","en":"Correlation matrix","aliases":["相関行列"],"chapter":3,"importance":"B","tags":["多変量","行列","相関","標準化"],"related":["variance-covariance-matrix","covariance-and-correlation","partial-correlation-coefficient","mean-vector","multivariate-normal-distribution"],"charts":[{"type":"scatter","model":"bvnorm","params":{"rho":0.5,"n":300},"sliders":[{"param":"rho","label":"非対角成分 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"2変数の相関係数行列は非対角成分 ρ だけで決まる。標準化された変数どうしの散布図なので、縦横のスケールはそろっている。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>複数の変数について、すべての組の相関係数を並べた行列です。\n分散共分散行列から単位の影響を取り除いたもので、変数どうしの関係の強さを一覧できます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率ベクトル <span class=\"math-inline\">$\\boldsymbol{X}=(X_1,\\dots,X_p)^\\top$<\/span> の分散共分散行列を <span class=\"math-inline\">$\\Sigma=(\\sigma_{ij})$<\/span>（<span class=\"math-inline\">$\\sigma_{ii}&gt;0$<\/span>）とします。<strong>相関係数行列<\/strong>は<\/p>\n<div class=\"math-display\">$$R = (\\rho_{ij}), \\qquad \\rho_{ij} = \\frac{\\sigma_{ij}}{\\sqrt{\\sigma_{ii}\\,\\sigma_{jj}}}$$<\/div>\n<p>で、行列で書くと <span class=\"math-inline\">$D=\\mathrm{diag}(\\sigma_{11},\\dots,\\sigma_{pp})$<\/span> として<\/p>\n<div class=\"math-display\">$$R = D^{-1/2}\\,\\Sigma\\,D^{-1/2}$$<\/div>\n<p>です。主な性質は次のとおりです。<\/p>\n<ul>\n<li>対角成分はすべて1、非対角成分は <span class=\"math-inline\">$-1\\le\\rho_{ij}\\le1$<\/span><\/li>\n<li>対称・半正定値（<span class=\"math-inline\">$\\Sigma$<\/span> と同じ）<\/li>\n<li>各変数を標準化した <span class=\"math-inline\">$Z_i = (X_i-\\mu_i)/\\sqrt{\\sigma_{ii}}$<\/span> の分散共分散行列に等しい<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$D^{-1/2}$<\/span> は対角に <span class=\"math-inline\">$1/\\sigma_i$<\/span>（標準偏差の逆数）を並べた行列です。左から掛けると <span class=\"math-inline\">$i$<\/span> 行目が <span class=\"math-inline\">$1/\\sigma_i$<\/span> 倍、右から掛けると <span class=\"math-inline\">$j$<\/span> 列目が <span class=\"math-inline\">$1/\\sigma_j$<\/span> 倍になり、<span class=\"math-inline\">$(i,j)$<\/span> 成分が <span class=\"math-inline\">$\\sigma_{ij}/(\\sigma_i\\sigma_j)$<\/span> になります。<\/li>\n<li>標準化 <span class=\"math-inline\">$\\boldsymbol{Z}=D^{-1/2}(\\boldsymbol{X}-\\boldsymbol{\\mu})$<\/span> に分散共分散行列の変換公式を使うと <span class=\"math-inline\">$V[\\boldsymbol{Z}] = D^{-1/2}\\Sigma D^{-1/2} = R$<\/span> となり、上の性質が確かめられます。<\/li>\n<li>半正定値なので、非対角成分を勝手に決めることはできません。例えば <span class=\"math-inline\">$p$<\/span> 個の変数の相関がすべて同じ <span class=\"math-inline\">$\\rho$<\/span> の行列（等相関行列）の固有値は <span class=\"math-inline\">$1+(p-1)\\rho$<\/span> と <span class=\"math-inline\">$1-\\rho$<\/span> なので、<span class=\"math-inline\">$\\rho \\ge -1/(p-1)$<\/span> が必要です。<\/li>\n<li>逆行列 <span class=\"math-inline\">$R^{-1}$<\/span> の成分から、他のすべての変数を除いた偏相関係数が求められます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：分散共分散行列から求める<\/strong><\/p>\n<div class=\"math-display\">$$\\Sigma = \\begin{pmatrix} 4 &amp; 1.2 &amp; -2 \\\\ 1.2 &amp; 9 &amp; 3 \\\\ -2 &amp; 3 &amp; 16 \\end{pmatrix}$$<\/div>\n<p>なら標準偏差は <span class=\"math-inline\">$2, 3, 4$<\/span> なので<\/p>\n<div class=\"math-display\">$$\\rho_{12} = \\frac{1.2}{2\\times3} = 0.2, \\quad \\rho_{13} = \\frac{-2}{2\\times4} = -0.25, \\quad \\rho_{23} = \\frac{3}{3\\times4} = 0.25$$<\/div>\n<div class=\"math-display\">$$R = \\begin{pmatrix} 1 &amp; 0.2 &amp; -0.25 \\\\ 0.2 &amp; 1 &amp; 0.25 \\\\ -0.25 &amp; 0.25 &amp; 1 \\end{pmatrix}$$<\/div>\n<p>です。<\/p>\n<p><strong>例2：あり得ない相関の組合せ<\/strong><\/p>\n<p>3変数の相関がすべて <span class=\"math-inline\">$-0.6$<\/span> という行列は、固有値 <span class=\"math-inline\">$1+2\\times(-0.6) = -0.2 &lt; 0$<\/span> を持つので相関係数行列になりません。3つの変数が「互いに強く逆向き」になることはできない、ということです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>マーケティング<\/strong>：アンケートの多数の設問の相関係数行列を眺め、似た設問のまとまりを見つけます。因子分析の出発点です。<\/li>\n<li><strong>IT・Webサービス<\/strong>：単位の違う指標（秒、回数、金額）をまとめて主成分分析するときは、分散共分散行列ではなく相関係数行列を使います。単位の大きい変数に結果が引っ張られるのを防ぐためです。<\/li>\n<li><strong>金融・保険<\/strong>：資産間の相関係数行列をもとに、乱数で同時に動くシナリオを作り、損失の分布を評価します。<\/li>\n<li><strong>製造・品質管理<\/strong>：多数の工程変数の相関係数行列で、強く相関する（多重共線性のある）変数の組を見つけ、回帰モデルに入れる変数を選びます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2変数の相関係数行列 <span class=\"math-inline\">$\\begin{pmatrix}1&amp;\\rho\\\\\\rho&amp;1\\end{pmatrix}$<\/span> に対応する散布図です。非対角成分 ρ を動かすと雲の傾きと細さが変わります。\n縦横とも標準化された尺度なので、ρ&gt;0 なら雲は45度の方向に伸びます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>分散共分散行列から相関係数行列への変換（<span class=\"math-inline\">$\\sigma_{ij}/\\sqrt{\\sigma_{ii}\\sigma_{jj}}$<\/span>）の計算は基本です。<\/li>\n<li>半正定値でなければならないこと、等相関行列の条件 <span class=\"math-inline\">$\\rho\\ge-1/(p-1)$<\/span> は重要です。<\/li>\n<li>主成分分析を相関係数行列で行うか、分散共分散行列で行うかで結果が変わります。単位がそろっていないときは相関係数行列を使います。<\/li>\n<li>逆行列から偏相関係数を求める公式 <span class=\"math-inline\">$-r^{ij}/\\sqrt{r^{ii}r^{jj}}$<\/span> と組み合わせて問われます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 対角成分に分散を書く → ○ 相関係数行列の対角成分はすべて1です。<\/li>\n<li>× 非対角成分が <span class=\"math-inline\">$-1$<\/span> から <span class=\"math-inline\">$1$<\/span> の範囲にあれば、どんな組合せでもよい → ○ 行列全体が半正定値でなければなりません（例2）。<\/li>\n<li>× 相関係数行列から分散共分散行列を復元できる → ○ 各変数の標準偏差の情報が必要です。<span class=\"math-inline\">$\\Sigma = D^{1/2} R D^{1/2}$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 複数の変数について、すべての組の相関係数を並べた行列です。 分散共分散行列から単位の影響を取り除いたもので、変数どうしの関係の強さを一覧できます。 定義・数式 確率ベクトル の分散共分散行列を （ ）とします。相関係数行列は で、行列で書くと として です。主な性質は次のとおりです。 - 対角成分はすべて1、非対角成分は - 対称・半正定値（ と同じ） - 各変数を標準化した の分散共分散行列に等しい 数式の読み解き - は対角に （標準偏差の逆数）を並べた行列です。左から掛けると 行目が 倍、右から掛けると 列目が 倍になり、 成分が になります。 - 標準化 に分散共分散行列の変換公式を使うと となり、上の性質が確かめられます。 - 半正定値なので、非対角成分を勝手に決めることはできません。例えば 個の変数の相関がすべて同じ の行列（等相関行列）の固有値は と なので、 が必要です。 - 逆行列 の成分から、他のすべての変数を除いた偏相関係数が求められます。 具体例 例1：分散共分散行列から求める なら標準偏差は なので です。 例2：あり得ない相関の組合せ 3変数の相関がすべて という行列は、固有値 を持つので相関係数行列になりません。3つの変数が「互いに強く逆向き」になることはできない、ということです。 現場での使われ方 - マーケティング：アンケートの多数の設問の相関係数行列を眺め、似た設問のまとまりを見つけます。因子分析の出発点です。 - IT・Webサービス：単位の違う指標（秒、回数、金額）をまとめて主成分分析するときは、分散共分散行列ではなく相関係数行列を使います。単位の大きい変数に結果が引っ張られるのを防ぐためです。 - 金融・保険：資産間の相関係数行列をもとに、乱数で同時に動くシナリオを作り、損失の分布を評価します。 - 製造・品質管理：多数の工程変数の相関係数行列で、強く相関する（多重共線性のある）変数の組を見つけ、回帰モデルに入れる変数を選びます。 グラフ・イメージ 2変数の相関係数行列 に対応する散布図です。非対角成分 ρ を動かすと雲の傾きと細さが変わります。 縦横とも標準化された尺度なので、ρ0 なら雲は45度の方向に伸びます。 試験のポイント - 分散共分散行列から相関係数行列への変換（ ）の計算は基本です。 - 半正定値でなければならないこと、等相関行列の条件 は重要です。 - 主成分分析を相関係数行列で行うか、分散共分散行列で行うかで結果が変わります。単位がそろっていないときは相関係数行列を使います。 - 逆行列から偏相関係数を求める公式 と組み合わせて問われます。 よくある間違い - × 対角成分に分散を書く → ○ 相関係数行列の対角成分はすべて1です。 - × 非対角成分が から の範囲にあれば、どんな組合せでもよい → ○ 行列全体が半正定値でなければなりません（例2）。 - × 相関係数行列から分散共分散行列を復元できる → ○ 各変数の標準偏差の情報が必要です。 です。"},"covariance-and-correlation":{"id":"covariance-and-correlation","title":"共分散と相関係数","reading":"きょうぶんさんとそうかんけいすう","en":"Covariance and correlation coefficient","aliases":["共分散","相関係数","ピアソンの積率相関係数","Cov"],"chapter":3,"importance":"A","tags":["共分散","相関","無相関","独立"],"related":["expectation-variance-properties","spurious-correlation","partial-correlation-coefficient","variance-covariance-matrix","correlation-matrix","bivariate-normal-distribution"],"charts":[{"type":"scatter","model":"bvnorm","params":{"rho":0.5,"n":200},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.99,"max":0.99,"step":0.01},{"param":"n","label":"点の数 n","min":20,"max":1000,"step":10}],"caption":"2変量正規分布から作った散布図。ρ が ±1 に近づくほど点が直線のまわりに集まり、0 では丸い雲になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>共分散は、2つの量が「一緒に大きくなる／一方が大きいと他方が小さくなる」傾向を表す量です。\nそれを両者の標準偏差で割り、<span class=\"math-inline\">$-1$<\/span> から <span class=\"math-inline\">$1$<\/span> の範囲にそろえたものが相関係数で、<strong>直線的な<\/strong>関係の強さを表します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X, Y$<\/span>（平均 <span class=\"math-inline\">$\\mu_X, \\mu_Y$<\/span>、分散が有限で正）について、<strong>共分散<\/strong>は<\/p>\n<div class=\"math-display\">$$\\mathrm{Cov}[X, Y] = E\\big[(X-\\mu_X)(Y-\\mu_Y)\\big] = E[XY] - E[X]E[Y]$$<\/div>\n<p><strong>相関係数<\/strong>は<\/p>\n<div class=\"math-display\">$$\\rho_{XY} = \\frac{\\mathrm{Cov}[X,Y]}{\\sqrt{V[X]\\,V[Y]}}, \\qquad -1 \\le \\rho_{XY} \\le 1$$<\/div>\n<p>です。データ <span class=\"math-inline\">$(x_i, y_i)\\ (i=1,\\dots,n)$<\/span> では、標本相関係数を<\/p>\n<div class=\"math-display\">$$r = \\frac{\\sum_{i}(x_i-\\bar x)(y_i-\\bar y)}{\\sqrt{\\sum_i (x_i-\\bar x)^2}\\sqrt{\\sum_i (y_i-\\bar y)^2}}$$<\/div>\n<p>とします（分母と分子で <span class=\"math-inline\">$n$<\/span> や <span class=\"math-inline\">$n-1$<\/span> は打ち消し合うので、どちらで割っても同じ値です）。<\/p>\n<p>主な性質：<\/p>\n<ul>\n<li><span class=\"math-inline\">$\\mathrm{Cov}[X,X]=V[X]$<\/span>、<span class=\"math-inline\">$\\mathrm{Cov}[X,Y]=\\mathrm{Cov}[Y,X]$<\/span><\/li>\n<li><span class=\"math-inline\">$\\mathrm{Cov}[aX+b,\\ cY+d] = ac\\,\\mathrm{Cov}[X,Y]$<\/span><\/li>\n<li><span class=\"math-inline\">$\\rho_{aX+b,\\,cY+d} = \\mathrm{sign}(ac)\\,\\rho_{XY}$<\/span>（<span class=\"math-inline\">$ac\\neq0$<\/span>）<\/li>\n<li><span class=\"math-inline\">$X, Y$<\/span> が独立 <span class=\"math-inline\">$\\Rightarrow$<\/span> <span class=\"math-inline\">$\\mathrm{Cov}[X,Y]=0$<\/span>（無相関）。逆は一般には成り立ちません。<\/li>\n<li><span class=\"math-inline\">$|\\rho|=1$<\/span> <span class=\"math-inline\">$\\iff$<\/span> ある定数 <span class=\"math-inline\">$a\\ne0,\\ b$<\/span> で <span class=\"math-inline\">$Y=aX+b$<\/span> が確率1で成り立つ。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$(X-\\mu_X)(Y-\\mu_Y)$<\/span> は、両方が平均より大きい（または両方小さい）とき正、片方だけ大きいとき負になります。その平均が共分散です。散布図を平均の位置で4つに区切り、右上・左下の点が多ければ正、左上・右下が多ければ負です。<\/li>\n<li>共分散は単位に依存します（cm を m にすると値が変わる）。そこで両方の標準偏差で割って単位を消したのが相関係数です。<\/li>\n<li><span class=\"math-inline\">$-1\\le\\rho\\le1$<\/span> の導出：任意の実数 <span class=\"math-inline\">$t$<\/span> について<\/li>\n<\/ul>\n<div class=\"math-display\">$$0 \\le V[Y - tX] = V[Y] - 2t\\,\\mathrm{Cov}[X,Y] + t^2 V[X]$$<\/div>\n<p>右辺は <span class=\"math-inline\">$t$<\/span> の2次式で常に0以上なので、判別式が0以下です。<\/p>\n<div class=\"math-display\">$$\\{\\mathrm{Cov}[X,Y]\\}^2 - V[X]V[Y] \\le 0 \\;\\Longrightarrow\\; \\rho^2 \\le 1$$<\/div>\n<p>等号は <span class=\"math-inline\">$V[Y-tX]=0$<\/span>、つまり <span class=\"math-inline\">$Y-tX$<\/span> が定数のときに限られます。これはコーシー・シュワルツの不等式そのものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：2つの0-1変数<\/strong><\/p>\n<p><span class=\"math-inline\">$X, Y$<\/span> がそれぞれ0か1をとり、同時確率が次の表のとおりとします。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"math-inline\">$Y=0$<\/span><\/th>\n<th><span class=\"math-inline\">$Y=1$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">$X=0$<\/span><\/td>\n<td>0.3<\/td>\n<td>0.2<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=1$<\/span><\/td>\n<td>0.1<\/td>\n<td>0.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"math-inline\">$E[X]=0.5$<\/span>、<span class=\"math-inline\">$E[Y]=0.6$<\/span>、<span class=\"math-inline\">$E[XY]=P(X=1,Y=1)=0.4$<\/span> なので<\/p>\n<div class=\"math-display\">$$\\mathrm{Cov}[X,Y] = 0.4 - 0.5\\times0.6 = 0.1$$<\/div>\n<p><span class=\"math-inline\">$V[X]=0.5\\times0.5=0.25$<\/span>、<span class=\"math-inline\">$V[Y]=0.6\\times0.4=0.24$<\/span> から<\/p>\n<div class=\"math-display\">$$\\rho = \\frac{0.1}{\\sqrt{0.25\\times0.24}} = \\frac{0.1}{\\sqrt{0.06}} \\approx 0.4082$$<\/div>\n<p>です。<\/p>\n<p><strong>例2：無相関だが独立でない<\/strong><\/p>\n<p><span class=\"math-inline\">$X$<\/span> が <span class=\"math-inline\">$-1, 0, 1$<\/span> を確率 <span class=\"math-inline\">$1/3$<\/span> ずつとり、<span class=\"math-inline\">$Y=X^2$<\/span> とします。<span class=\"math-inline\">$E[X]=0$<\/span>、<span class=\"math-inline\">$E[XY]=E[X^3]=0$<\/span> なので <span class=\"math-inline\">$\\mathrm{Cov}[X,Y]=0$<\/span> です。\nしかし <span class=\"math-inline\">$X$<\/span> が決まれば <span class=\"math-inline\">$Y$<\/span> は完全に決まるので、独立ではありません。相関係数は「直線的な関係」しか測らないためです。<\/p>\n<p><strong>例3：勉強時間と得点（データ）<\/strong><\/p>\n<p>5人の勉強時間 <span class=\"math-inline\">$x=(1,2,3,4,5)$<\/span> と得点 <span class=\"math-inline\">$y=(50,55,65,70,85)$<\/span> では、<span class=\"math-inline\">$\\bar x=3$<\/span>、<span class=\"math-inline\">$\\bar y=65$<\/span>、<\/p>\n<div class=\"math-display\">$$\\sum(x_i-\\bar x)(y_i-\\bar y)=85,\\quad \\sum(x_i-\\bar x)^2=10,\\quad \\sum(y_i-\\bar y)^2=750$$<\/div>\n<p>より <span class=\"math-inline\">$r = 85/\\sqrt{10\\times750} \\approx 0.9815$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：資産どうしの相関係数から、分散投資でどれだけリスクが減るかを見積もります。相関が低い資産を組み合わせるほど効果が大きくなります。<\/li>\n<li><strong>マーケティング<\/strong>：広告費と売上、来店回数と購入額などの関係の強さを最初に確認する指標として使います。<\/li>\n<li><strong>製造・品質管理<\/strong>：工程の条件（温度・圧力など）と品質特性の相関を調べ、管理すべき要因の候補を絞ります。<\/li>\n<li><strong>医療<\/strong>：2つの測定法の値の相関を見ます。ただし一致度の評価には相関だけでは不十分で、差の分布も確認します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2変量正規分布から点を発生させた散布図です。ρ を 0 から ±0.99 まで動かすと、丸い雲が右上がり／右下がりの細い楕円に変わっていきます。\n同じ ρ でも n が小さいと見た目の印象がかなり変わることにも注目してください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\mathrm{Cov}[X,Y]=E[XY]-E[X]E[Y]$<\/span> を使った計算は基本です。同時確率表から計算させる形が典型です。<\/li>\n<li>線形変換で相関係数の絶対値は変わらず、係数の符号が逆なら符号だけ反転します。<\/li>\n<li>「独立 ⇒ 無相関」は成り立つが、逆は成り立たない。反例（<span class=\"math-inline\">$Y=X^2$<\/span> など）を言えるようにします。ただし2変量正規分布では無相関と独立は同値です。<\/li>\n<li><span class=\"math-inline\">$|\\rho|\\le1$<\/span> の証明（<span class=\"math-inline\">$V[Y-tX]\\ge0$<\/span> の判別式）は導出として重要です。<\/li>\n<li>和の分散 <span class=\"math-inline\">$V[X+Y]=V[X]+V[Y]+2\\,\\mathrm{Cov}[X,Y]$<\/span> と組み合わせて使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 相関係数が0なら関係がない → ○ 直線的な関係がないだけで、曲線的な関係（<span class=\"math-inline\">$Y=X^2$<\/span> など）はあり得ます。<\/li>\n<li>× 相関が強いので因果関係がある → ○ 第三の変数による擬似相関や、逆向きの因果の可能性があります。<\/li>\n<li>× 共分散が大きいほど関係が強い → ○ 共分散は単位で値が変わります。強さを比べるには相関係数を使います。<\/li>\n<li>× 相関係数 0.8 は 0.4 の「2倍強い関係」→ ○ 相関係数は比で解釈できる量ではありません。説明できる分散の割合の目安は <span class=\"math-inline\">$r^2$<\/span>（0.64 と 0.16）です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 共分散は、2つの量が「一緒に大きくなる／一方が大きいと他方が小さくなる」傾向を表す量です。 それを両者の標準偏差で割り、 から の範囲にそろえたものが相関係数で、直線的な関係の強さを表します。 定義・数式 確率変数 （平均 、分散が有限で正）について、共分散は 相関係数は です。データ では、標本相関係数を とします（分母と分子で や は打ち消し合うので、どちらで割っても同じ値です）。 主な性質： - 、 - - （ ） - が独立 （無相関）。逆は一般には成り立ちません。 - ある定数 で が確率1で成り立つ。 数式の読み解き - は、両方が平均より大きい（または両方小さい）とき正、片方だけ大きいとき負になります。その平均が共分散です。散布図を平均の位置で4つに区切り、右上・左下の点が多ければ正、左上・右下が多ければ負です。 - 共分散は単位に依存します（cm を m にすると値が変わる）。そこで両方の標準偏差で割って単位を消したのが相関係数です。 - の導出：任意の実数 について 右辺は の2次式で常に0以上なので、判別式が0以下です。 等号は 、つまり が定数のときに限られます。これはコーシー・シュワルツの不等式そのものです。 具体例 例1：2つの0-1変数 がそれぞれ0か1をとり、同時確率が次の表のとおりとします。 0.3 0.2 0.1 0.4 、 、 なので 、 から です。 例2：無相関だが独立でない が を確率 ずつとり、 とします。 、 なので です。 しかし が決まれば は完全に決まるので、独立ではありません。相関係数は「直線的な関係」しか測らないためです。 例3：勉強時間と得点（データ） 5人の勉強時間 と得点 では、 、 、 より です。 現場での使われ方 - 金融・保険：資産どうしの相関係数から、分散投資でどれだけリスクが減るかを見積もります。相関が低い資産を組み合わせるほど効果が大きくなります。 - マーケティング：広告費と売上、来店回数と購入額などの関係の強さを最初に確認する指標として使います。 - 製造・品質管理：工程の条件（温度・圧力など）と品質特性の相関を調べ、管理すべき要因の候補を絞ります。 - 医療：2つの測定法の値の相関を見ます。ただし一致度の評価には相関だけでは不十分で、差の分布も確認します。 グラフ・イメージ 2変量正規分布から点を発生させた散布図です。ρ を 0 から ±0.99 まで動かすと、丸い雲が右上がり／右下がりの細い楕円に変わっていきます。 同じ ρ でも n が小さいと見た目の印象がかなり変わることにも注目してください。 試験のポイント - を使った計算は基本です。同時確率表から計算させる形が典型です。 - 線形変換で相関係数の絶対値は変わらず、係数の符号が逆なら符号だけ反転します。 - 「独立 ⇒ 無相関」は成り立つが、逆は成り立たない。反例（ など）を言えるようにします。ただし2変量正規分布では無相関と独立は同値です。 - の証明（ の判別式）は導出として重要です。 - 和の分散 と組み合わせて使います。 よくある間違い - × 相関係数が0なら関係がない → ○ 直線的な関係がないだけで、曲線的な関係（ など）はあり得ます。 - × 相関が強いので因果関係がある → ○ 第三の変数による擬似相関や、逆向きの因果の可能性があります。 - × 共分散が大きいほど関係が強い → ○ 共分散は単位で値が変わります。強さを比べるには相関係数を使います。 - × 相関係数 0.8 は 0.4 の「2倍強い関係」→ ○ 相関係数は比で解釈できる量ではありません。説明できる分散の割合の目安は （0.64 と 0.16）です。"},"expectation-variance-properties":{"id":"expectation-variance-properties","title":"期待値と分散の性質","reading":"きたいちとぶんさんのせいしつ","en":"Properties of expectation and variance","aliases":["期待値の線形性","分散の公式"],"chapter":3,"importance":"A","tags":["期待値","分散","線形性","共分散"],"related":["covariance-and-correlation","conditional-expectation","conditional-variance","variance-covariance-matrix","moment-generating-function"],"charts":[{"type":"pdf","dist":"norm","params":{"mu":0,"sigma":1},"sliders":[{"param":"mu","label":"平均 μ（＋b にあたる）","min":-5,"max":5,"step":0.5},{"param":"sigma","label":"標準偏差 σ（|a| 倍にあたる）","min":0.3,"max":4,"step":0.1}],"x":{"min":-10,"max":10},"compare":[{"dist":"norm","params":{"mu":0,"sigma":1},"label":"元の分布 N(0,1)"}],"caption":"確率変数を aX+b と変換すると、山の中心は b だけ平行移動し、幅は |a| 倍になる。分散は幅の2乗なので a² 倍になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>期待値は「足し算と定数倍をそのまま通す」性質（線形性）を持ちます。\n分散は定数倍が2乗で効き、和の分散には共分散の項が加わります。この2つのルールが、統計量の平均や誤差を計算するときの基本道具です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X$<\/span> の期待値は、離散型・連続型でそれぞれ<\/p>\n<div class=\"math-display\">$$E[X] = \\sum_{x} x\\,p(x), \\qquad E[X] = \\int_{-\\infty}^{\\infty} x\\,f(x)\\,dx$$<\/div>\n<p>です（和や積分が絶対収束するときに定義されます）。分散は<\/p>\n<div class=\"math-display\">$$V[X] = E\\big[(X - E[X])^2\\big] = E[X^2] - (E[X])^2$$<\/div>\n<p>です。定数 <span class=\"math-inline\">$a, b$<\/span> と確率変数 <span class=\"math-inline\">$X, Y$<\/span> について、次が成り立ちます。<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nE[aX + b] &amp;= a\\,E[X] + b \\\\\nE[X + Y] &amp;= E[X] + E[Y] \\quad (\\text{独立でなくても成立}) \\\\\nV[aX + b] &amp;= a^2\\,V[X] \\\\\nV[X \\pm Y] &amp;= V[X] + V[Y] \\pm 2\\,\\mathrm{Cov}[X, Y]\n\\end{aligned}$$<\/div>\n<p><span class=\"math-inline\">$X, Y$<\/span> が独立なら <span class=\"math-inline\">$\\mathrm{Cov}[X,Y]=0$<\/span>、<span class=\"math-inline\">$E[XY]=E[X]E[Y]$<\/span> なので、<span class=\"math-inline\">$V[X \\pm Y] = V[X] + V[Y]$<\/span> です。<\/p>\n<p>一般に <span class=\"math-inline\">$X_1, \\dots, X_n$<\/span> と定数 <span class=\"math-inline\">$a_1, \\dots, a_n$<\/span> について<\/p>\n<div class=\"math-display\">$$V\\Big[\\sum_{i=1}^n a_i X_i\\Big] = \\sum_{i=1}^n a_i^2 V[X_i] + 2\\sum_{i&lt;j} a_i a_j \\mathrm{Cov}[X_i, X_j]$$<\/div>\n<p>です。特に <span class=\"math-inline\">$X_1,\\dots,X_n$<\/span> が独立で同じ分布（平均 <span class=\"math-inline\">$\\mu$<\/span>、分散 <span class=\"math-inline\">$\\sigma^2$<\/span>）なら、標本平均 <span class=\"math-inline\">$\\bar{X}$<\/span> について <span class=\"math-inline\">$E[\\bar X]=\\mu$<\/span>、<span class=\"math-inline\">$V[\\bar X]=\\sigma^2/n$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$E[aX+b]=aE[X]+b$<\/span>：全員の値を <span class=\"math-inline\">$a$<\/span> 倍して <span class=\"math-inline\">$b$<\/span> を足せば、平均も同じように変わる、という当たり前の性質です。和・積分が線形だから成り立ちます。<\/li>\n<li><span class=\"math-inline\">$V[aX+b]=a^2V[X]$<\/span>：<span class=\"math-inline\">$b$<\/span> を足しても散らばりは変わりません。<span class=\"math-inline\">$a$<\/span> 倍すると偏差 <span class=\"math-inline\">$X-E[X]$<\/span> が <span class=\"math-inline\">$a$<\/span> 倍になり、それを2乗するので <span class=\"math-inline\">$a^2$<\/span> 倍になります。<\/li>\n<li><span class=\"math-inline\">$V[X]=E[X^2]-(E[X])^2$<\/span> の導出は、<span class=\"math-inline\">$\\mu=E[X]$<\/span> として展開するだけです。<\/li>\n<\/ul>\n<div class=\"math-display\">$$E[(X-\\mu)^2] = E[X^2] - 2\\mu E[X] + \\mu^2 = E[X^2] - \\mu^2$$<\/div>\n<ul>\n<li>和の分散の導出も同じく展開です。<span class=\"math-inline\">$\\mu_X=E[X],\\ \\mu_Y=E[Y]$<\/span> として<\/li>\n<\/ul>\n<div class=\"math-display\">$$\\begin{aligned}\nV[X+Y] &amp;= E\\big[\\{(X-\\mu_X)+(Y-\\mu_Y)\\}^2\\big] \\\\\n&amp;= E[(X-\\mu_X)^2] + E[(Y-\\mu_Y)^2] + 2E[(X-\\mu_X)(Y-\\mu_Y)] \\\\\n&amp;= V[X] + V[Y] + 2\\,\\mathrm{Cov}[X,Y]\n\\end{aligned}$$<\/div>\n<ul>\n<li>標本平均の分散は、独立なので共分散がすべて0になり、<span class=\"math-inline\">$V[\\bar X] = \\frac{1}{n^2}\\cdot n\\sigma^2 = \\sigma^2/n$<\/span> です。「データを <span class=\"math-inline\">$n$<\/span> 倍集めると、平均のばらつき（標準誤差）は <span class=\"math-inline\">$1/\\sqrt{n}$<\/span> になる」という重要な結論です。<\/li>\n<\/ul>\n<p>直感的には、期待値は「重心」、分散は「重心まわりの回転しにくさ（慣性モーメント）」のようなものです。重心は平行移動・拡大にそのままついてきますが、慣性モーメントは長さの2乗で効きます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：サイコロの目を変換する<\/strong><\/p>\n<p>公正なサイコロの目 <span class=\"math-inline\">$X$<\/span> は <span class=\"math-inline\">$E[X]=3.5$<\/span>、<span class=\"math-inline\">$E[X^2]=91/6$<\/span> なので<\/p>\n<div class=\"math-display\">$$V[X] = \\frac{91}{6} - 3.5^2 = \\frac{35}{12} \\approx 2.9167$$<\/div>\n<p>です。ゲームの得点を <span class=\"math-inline\">$Y=2X+3$<\/span> とすると<\/p>\n<div class=\"math-display\">$$E[Y] = 2 \\times 3.5 + 3 = 10, \\qquad V[Y] = 2^2 \\times \\frac{35}{12} = \\frac{35}{3} \\approx 11.667$$<\/div>\n<p>です。<span class=\"math-inline\">$+3$<\/span> は分散に影響しません。<\/p>\n<p><strong>例2：2個のサイコロの和と差<\/strong><\/p>\n<p>独立な2個のサイコロ <span class=\"math-inline\">$X_1, X_2$<\/span> について、<\/p>\n<div class=\"math-display\">$$V[X_1 + X_2] = V[X_1 - X_2] = \\frac{35}{12} + \\frac{35}{12} = \\frac{35}{6} \\approx 5.8333$$<\/div>\n<p>です。差の分散も「足し算」になる点に注意します（<span class=\"math-inline\">$(-1)^2=1$<\/span> がかかるため）。期待値は和が <span class=\"math-inline\">$7$<\/span>、差が <span class=\"math-inline\">$0$<\/span> です。<\/p>\n<p><strong>例3：2つの資産を半分ずつ持つ<\/strong><\/p>\n<p>資産 A, B の収益率 <span class=\"math-inline\">$X, Y$<\/span> の分散がそれぞれ <span class=\"math-inline\">$4, 9$<\/span>、共分散が <span class=\"math-inline\">$-1.2$<\/span> とします。半分ずつ持つと、収益率は <span class=\"math-inline\">$0.5X+0.5Y$<\/span> で<\/p>\n<div class=\"math-display\">$$V[0.5X+0.5Y] = 0.25 \\times 4 + 0.25 \\times 9 + 2 \\times 0.25 \\times (-1.2) = 2.65$$<\/div>\n<p>です。どちらか一方だけ持つ場合（4 または 9）より小さくなります。共分散が負だと、分散はさらに小さくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：部品を積み重ねた全体の寸法のばらつきを、各部品の分散の和として見積もります（公差の積み上げ）。独立とみなせるかどうかで結果が変わります。<\/li>\n<li><strong>金融・保険<\/strong>：複数の資産や契約を組み合わせたときのリスク（分散）を、各分散と共分散から計算します。分散投資の効果はこの式そのものです。<\/li>\n<li><strong>行政・調査<\/strong>：標本調査で必要な標本サイズを決めるとき、<span class=\"math-inline\">$V[\\bar X]=\\sigma^2/n$<\/span> をもとに「誤差を半分にするには標本を4倍にする」と計算します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：単位の換算（秒→ミリ秒、円→千円）をしたときの平均・標準偏差の変わり方を確認します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>正規分布 <span class=\"math-inline\">$N(\\mu,\\sigma^2)$<\/span> の密度です。<span class=\"math-inline\">$\\mu$<\/span> のスライダーは <span class=\"math-inline\">$+b$<\/span>、<span class=\"math-inline\">$\\sigma$<\/span> のスライダーは <span class=\"math-inline\">$a$<\/span> 倍の変換にあたります。\n<span class=\"math-inline\">$\\mu$<\/span> を動かしても山の形は変わらず位置だけが動くこと、<span class=\"math-inline\">$\\sigma$<\/span> を2倍にすると幅が2倍（分散は4倍）になり山が低くなることを確認してください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$V[X]=E[X^2]-(E[X])^2$<\/span> は最も多く使う変形です。<span class=\"math-inline\">$E[X^2]=V[X]+(E[X])^2$<\/span> と逆向きにも使えるようにしておきます。<\/li>\n<li>和の分散では、独立かどうかを必ず確認します。独立でなければ <span class=\"math-inline\">$2\\,\\mathrm{Cov}$<\/span> の項を落とせません。<\/li>\n<li><span class=\"math-inline\">$V[\\bar X]=\\sigma^2/n$<\/span> は、不偏性・一致性・信頼区間・検定統計量のすべての土台です。導出を自力で書けるようにします。<\/li>\n<li>期待値の線形性は独立性がなくても成り立ちます。指示関数の和に分解して期待値を求める問題（例：一致する組の個数の期待値）で強力です。<\/li>\n<li>一般に <span class=\"math-inline\">$E[g(X)] \\neq g(E[X])$<\/span> です。<span class=\"math-inline\">$g$<\/span> が凸ならジェンセンの不等式 <span class=\"math-inline\">$E[g(X)] \\ge g(E[X])$<\/span> が成り立ち、<span class=\"math-inline\">$E[X^2] \\ge (E[X])^2$<\/span> はその特別な場合です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$V[X-Y]=V[X]-V[Y]$<\/span> → ○ 独立なら <span class=\"math-inline\">$V[X-Y]=V[X]+V[Y]$<\/span> です。係数 <span class=\"math-inline\">$-1$<\/span> は2乗されて <span class=\"math-inline\">$+1$<\/span> になります。<\/li>\n<li>× <span class=\"math-inline\">$V[aX+b]=aV[X]+b$<\/span> → ○ <span class=\"math-inline\">$V[aX+b]=a^2V[X]$<\/span>。定数の加算は分散に影響せず、係数は2乗で効きます。標準偏差なら <span class=\"math-inline\">$|a|$<\/span> 倍です。<\/li>\n<li>× <span class=\"math-inline\">$E[XY]=E[X]E[Y]$<\/span> をいつでも使う → ○ これは無相関（特に独立）のときだけです。一般には <span class=\"math-inline\">$E[XY]=E[X]E[Y]+\\mathrm{Cov}[X,Y]$<\/span> です。<\/li>\n<li>× <span class=\"math-inline\">$V[2X]$<\/span> と <span class=\"math-inline\">$V[X_1+X_2]$<\/span> を同じとみなす → ○ 前者は <span class=\"math-inline\">$4V[X]$<\/span>、独立な2つの和である後者は <span class=\"math-inline\">$2V[X]$<\/span> です。同じ変数を2倍するのと、独立なコピーを足すのは違います。<\/li>\n<\/ul><\/section>","text":"一言でいうと 期待値は「足し算と定数倍をそのまま通す」性質（線形性）を持ちます。 分散は定数倍が2乗で効き、和の分散には共分散の項が加わります。この2つのルールが、統計量の平均や誤差を計算するときの基本道具です。 定義・数式 確率変数 の期待値は、離散型・連続型でそれぞれ です（和や積分が絶対収束するときに定義されます）。分散は です。定数 と確率変数 について、次が成り立ちます。 が独立なら 、 なので、 です。 一般に と定数 について です。特に が独立で同じ分布（平均 、分散 ）なら、標本平均 について 、 です。 数式の読み解き - ：全員の値を 倍して を足せば、平均も同じように変わる、という当たり前の性質です。和・積分が線形だから成り立ちます。 - ： を足しても散らばりは変わりません。 倍すると偏差 が 倍になり、それを2乗するので 倍になります。 - の導出は、 として展開するだけです。 - 和の分散の導出も同じく展開です。 として - 標本平均の分散は、独立なので共分散がすべて0になり、 です。「データを 倍集めると、平均のばらつき（標準誤差）は になる」という重要な結論です。 直感的には、期待値は「重心」、分散は「重心まわりの回転しにくさ（慣性モーメント）」のようなものです。重心は平行移動・拡大にそのままついてきますが、慣性モーメントは長さの2乗で効きます。 具体例 例1：サイコロの目を変換する 公正なサイコロの目 は 、 なので です。ゲームの得点を とすると です。 は分散に影響しません。 例2：2個のサイコロの和と差 独立な2個のサイコロ について、 です。差の分散も「足し算」になる点に注意します（ がかかるため）。期待値は和が 、差が です。 例3：2つの資産を半分ずつ持つ 資産 A, B の収益率 の分散がそれぞれ 、共分散が とします。半分ずつ持つと、収益率は で です。どちらか一方だけ持つ場合（4 または 9）より小さくなります。共分散が負だと、分散はさらに小さくなります。 現場での使われ方 - 製造・品質管理：部品を積み重ねた全体の寸法のばらつきを、各部品の分散の和として見積もります（公差の積み上げ）。独立とみなせるかどうかで結果が変わります。 - 金融・保険：複数の資産や契約を組み合わせたときのリスク（分散）を、各分散と共分散から計算します。分散投資の効果はこの式そのものです。 - 行政・調査：標本調査で必要な標本サイズを決めるとき、 をもとに「誤差を半分にするには標本を4倍にする」と計算します。 - IT・Webサービス：単位の換算（秒→ミリ秒、円→千円）をしたときの平均・標準偏差の変わり方を確認します。 グラフ・イメージ 正規分布 の密度です。 のスライダーは 、 のスライダーは 倍の変換にあたります。 を動かしても山の形は変わらず位置だけが動くこと、 を2倍にすると幅が2倍（分散は4倍）になり山が低くなることを確認してください。 試験のポイント - は最も多く使う変形です。 と逆向きにも使えるようにしておきます。 - 和の分散では、独立かどうかを必ず確認します。独立でなければ の項を落とせません。 - は、不偏性・一致性・信頼区間・検定統計量のすべての土台です。導出を自力で書けるようにします。 - 期待値の線形性は独立性がなくても成り立ちます。指示関数の和に分解して期待値を求める問題（例：一致する組の個数の期待値）で強力です。 - 一般に です。 が凸ならジェンセンの不等式 が成り立ち、 はその特別な場合です。 よくある間違い - × → ○ 独立なら です。係数 は2乗されて になります。 - × → ○ 。定数の加算は分散に影響せず、係数は2乗で効きます。標準偏差なら 倍です。 - × をいつでも使う → ○ これは無相関（特に独立）のときだけです。一般には です。 - × と を同じとみなす → ○ 前者は 、独立な2つの和である後者は です。同じ変数を2倍するのと、独立なコピーを足すのは違います。"},"mean-vector":{"id":"mean-vector","title":"期待値ベクトル","reading":"きたいちべくとる","en":"Mean vector","aliases":["平均ベクトル","標本平均ベクトル"],"chapter":3,"importance":"B","tags":["多変量","ベクトル","線形変換"],"related":["variance-covariance-matrix","correlation-matrix","expectation-variance-properties","multivariate-normal-distribution","multinomial-distribution"],"charts":[{"type":"scatter","model":"bvnorm","params":{"rho":0.6,"n":300},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"2変量の点の雲の「重心」が期待値ベクトル。ρ を変えると雲の傾きや細さは変わるが、重心の位置（ここでは原点）は変わらない。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>複数の確率変数をまとめたベクトルについて、それぞれの期待値を縦に並べたものです。\n多変量データの「中心（重心）」を表します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$p$<\/span> 個の確率変数を並べた確率ベクトル <span class=\"math-inline\">$\\boldsymbol{X} = (X_1,\\dots,X_p)^\\top$<\/span> の<strong>期待値ベクトル<\/strong>（平均ベクトル）は<\/p>\n<div class=\"math-display\">$$\\boldsymbol{\\mu} = E[\\boldsymbol{X}] =\n\\begin{pmatrix} E[X_1] \\\\ \\vdots \\\\ E[X_p] \\end{pmatrix}$$<\/div>\n<p>です（各成分の期待値が存在するとき）。<span class=\"math-inline\">$q\\times p$<\/span> の定数行列 <span class=\"math-inline\">$A$<\/span> と <span class=\"math-inline\">$q$<\/span> 次元の定数ベクトル <span class=\"math-inline\">$\\boldsymbol{b}$<\/span> について<\/p>\n<div class=\"math-display\">$$E[A\\boldsymbol{X} + \\boldsymbol{b}] = A\\boldsymbol{\\mu} + \\boldsymbol{b}$$<\/div>\n<p>が成り立ちます。データ <span class=\"math-inline\">$\\boldsymbol{x}_1,\\dots,\\boldsymbol{x}_n$<\/span> では<strong>標本平均ベクトル<\/strong> <span class=\"math-inline\">$\\bar{\\boldsymbol{x}} = \\frac1n\\sum_{i=1}^n \\boldsymbol{x}_i$<\/span> を使い、<span class=\"math-inline\">$E[\\bar{\\boldsymbol{X}}]=\\boldsymbol{\\mu}$<\/span>（不偏）です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>期待値ベクトルは、成分ごとに期待値をとるだけです。新しい計算規則があるわけではありません。<\/li>\n<li><span class=\"math-inline\">$E[A\\boldsymbol{X}+\\boldsymbol{b}]$<\/span> の第 <span class=\"math-inline\">$i$<\/span> 成分は <span class=\"math-inline\">$E\\big[\\sum_j a_{ij}X_j + b_i\\big] = \\sum_j a_{ij}E[X_j] + b_i$<\/span> で、1変数の期待値の線形性をそのまま使っています。独立性は不要です。<\/li>\n<li>特に <span class=\"math-inline\">$A$<\/span> が1行（<span class=\"math-inline\">$\\boldsymbol{a}^\\top$<\/span>）なら、<span class=\"math-inline\">$E[\\boldsymbol{a}^\\top\\boldsymbol{X}] = \\boldsymbol{a}^\\top\\boldsymbol{\\mu}$<\/span> です。合計点や加重和の期待値がこれで求まります。<\/li>\n<li>期待値ベクトルは「中心の位置」だけを表し、各変数のばらつきや変数どうしの関係は分散共分散行列が表します。多変量正規分布 <span class=\"math-inline\">$N_p(\\boldsymbol{\\mu},\\Sigma)$<\/span> はこの2つで完全に決まります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：2科目の合計点と差<\/strong><\/p>\n<p>数学と英語の点数 <span class=\"math-inline\">$\\boldsymbol{X}=(X_1,X_2)^\\top$<\/span> の期待値ベクトルが <span class=\"math-inline\">$\\boldsymbol{\\mu}=(60, 70)^\\top$<\/span> とします。合計点と差（数学−英語）は<\/p>\n<div class=\"math-display\">$$\\begin{pmatrix} X_1+X_2 \\\\ X_1-X_2 \\end{pmatrix}\n= \\begin{pmatrix} 1 &amp; 1 \\\\ 1 &amp; -1 \\end{pmatrix}\\boldsymbol{X},\n\\qquad\nE = \\begin{pmatrix} 1 &amp; 1 \\\\ 1 &amp; -1 \\end{pmatrix}\\begin{pmatrix} 60 \\\\ 70 \\end{pmatrix}\n= \\begin{pmatrix} 130 \\\\ -10 \\end{pmatrix}$$<\/div>\n<p>です。2科目が相関していても関係なく計算できます。<\/p>\n<p><strong>例2：多項分布<\/strong><\/p>\n<p>10回の試行で、3つの結果が確率 <span class=\"math-inline\">$(0.5, 0.3, 0.2)$<\/span> で起こるとき、各結果の回数 <span class=\"math-inline\">$\\boldsymbol{N}$<\/span> は多項分布に従い<\/p>\n<div class=\"math-display\">$$E[\\boldsymbol{N}] = 10\\times(0.5,\\ 0.3,\\ 0.2)^\\top = (5,\\ 3,\\ 2)^\\top$$<\/div>\n<p>です。成分の和が試行回数10になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：寸法・重さ・硬さなど複数の品質特性の目標値をベクトルで管理し、製品の平均ベクトルが目標からずれていないかを多変量の管理図（ホテリングの <span class=\"math-inline\">$T^2$<\/span>）で監視します。<\/li>\n<li><strong>マーケティング<\/strong>：顧客セグメントごとに、購入頻度・購入額・最終購入からの日数などの平均ベクトルを比べ、特徴を把握します。<\/li>\n<li><strong>医療<\/strong>：複数の検査項目の平均ベクトルを、治療群と対照群で比べます（多変量の検定）。<\/li>\n<li><strong>IT・Webサービス<\/strong>：クラスタリング（k-means）では、各クラスタの中心として平均ベクトルを使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>2変量正規分布からの散布図です。点の雲の重心が期待値ベクトル（ここでは原点）です。\n相関係数を変えると雲の傾きや細さは変わりますが、重心の位置は変わらないことを確かめてください。位置と広がりが別の量で表されることがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$E[A\\boldsymbol{X}+\\boldsymbol{b}]=A\\boldsymbol{\\mu}+\\boldsymbol{b}$<\/span> を、分散共分散行列の <span class=\"math-inline\">$V[A\\boldsymbol{X}+\\boldsymbol{b}]=A\\Sigma A^\\top$<\/span> とセットで使えるようにします。<\/li>\n<li>多項分布・多変量正規分布の期待値ベクトルは基本です。<\/li>\n<li>2次形式の期待値 <span class=\"math-inline\">$E[\\boldsymbol{X}^\\top B\\boldsymbol{X}] = \\mathrm{tr}(B\\Sigma) + \\boldsymbol{\\mu}^\\top B\\boldsymbol{\\mu}$<\/span> も、期待値ベクトルと分散共分散行列から計算できます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 成分どうしが独立でないと <span class=\"math-inline\">$E[A\\boldsymbol{X}]=A\\boldsymbol{\\mu}$<\/span> は使えない → ○ 期待値の線形性は独立性と無関係に成り立ちます。<\/li>\n<li>× 期待値ベクトルが同じなら分布も同じ → ○ ばらつきや相関（分散共分散行列）が違えば、分布は異なります。<\/li>\n<li>× <span class=\"math-inline\">$E[X_1X_2] = E[X_1]E[X_2]$<\/span> を期待値ベクトルだけから求める → ○ 積の期待値には共分散が必要で、<span class=\"math-inline\">$E[X_1X_2]=\\mu_1\\mu_2+\\sigma_{12}$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 複数の確率変数をまとめたベクトルについて、それぞれの期待値を縦に並べたものです。 多変量データの「中心（重心）」を表します。 定義・数式 個の確率変数を並べた確率ベクトル の期待値ベクトル（平均ベクトル）は です（各成分の期待値が存在するとき）。 の定数行列 と 次元の定数ベクトル について が成り立ちます。データ では標本平均ベクトル を使い、 （不偏）です。 数式の読み解き - 期待値ベクトルは、成分ごとに期待値をとるだけです。新しい計算規則があるわけではありません。 - の第 成分は で、1変数の期待値の線形性をそのまま使っています。独立性は不要です。 - 特に が1行（ ）なら、 です。合計点や加重和の期待値がこれで求まります。 - 期待値ベクトルは「中心の位置」だけを表し、各変数のばらつきや変数どうしの関係は分散共分散行列が表します。多変量正規分布 はこの2つで完全に決まります。 具体例 例1：2科目の合計点と差 数学と英語の点数 の期待値ベクトルが とします。合計点と差（数学−英語）は です。2科目が相関していても関係なく計算できます。 例2：多項分布 10回の試行で、3つの結果が確率 で起こるとき、各結果の回数 は多項分布に従い です。成分の和が試行回数10になります。 現場での使われ方 - 製造・品質管理：寸法・重さ・硬さなど複数の品質特性の目標値をベクトルで管理し、製品の平均ベクトルが目標からずれていないかを多変量の管理図（ホテリングの ）で監視します。 - マーケティング：顧客セグメントごとに、購入頻度・購入額・最終購入からの日数などの平均ベクトルを比べ、特徴を把握します。 - 医療：複数の検査項目の平均ベクトルを、治療群と対照群で比べます（多変量の検定）。 - IT・Webサービス：クラスタリング（k-means）では、各クラスタの中心として平均ベクトルを使います。 グラフ・イメージ 2変量正規分布からの散布図です。点の雲の重心が期待値ベクトル（ここでは原点）です。 相関係数を変えると雲の傾きや細さは変わりますが、重心の位置は変わらないことを確かめてください。位置と広がりが別の量で表されることがわかります。 試験のポイント - を、分散共分散行列の とセットで使えるようにします。 - 多項分布・多変量正規分布の期待値ベクトルは基本です。 - 2次形式の期待値 も、期待値ベクトルと分散共分散行列から計算できます。 よくある間違い - × 成分どうしが独立でないと は使えない → ○ 期待値の線形性は独立性と無関係に成り立ちます。 - × 期待値ベクトルが同じなら分布も同じ → ○ ばらつきや相関（分散共分散行列）が違えば、分布は異なります。 - × を期待値ベクトルだけから求める → ○ 積の期待値には共分散が必要で、 です。"},"partial-correlation-coefficient":{"id":"partial-correlation-coefficient","title":"偏相関係数","reading":"へんそうかんけいすう","en":"Partial correlation coefficient","aliases":["偏相関"],"chapter":3,"importance":"A","tags":["相関","擬似相関","交絡","残差"],"related":["covariance-and-correlation","spurious-correlation","correlation-matrix","conditional-independence","variance-covariance-matrix"],"charts":[{"type":"scatter","model":"spurious","params":{"a":1.5,"b":1.5,"n":300},"sliders":[{"param":"a","label":"Z が X に与える影響 a","min":0,"max":3,"step":0.1},{"param":"b","label":"Z が Y に与える影響 b","min":0,"max":3,"step":0.1},{"param":"n","label":"点の数 n","min":50,"max":1000,"step":50}],"caption":"共通要因 Z が X と Y の両方を動かすモデル。見た目の相関（単相関）は強いが、Z の影響を除いた偏相関係数は 0 になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>第三の変数 <span class=\"math-inline\">$Z$<\/span> の影響を取り除いたうえで、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の間に残る相関の強さです。\n見かけの相関（擬似相関）なのか、直接の関係があるのかを見分ける手がかりになります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$X, Y, Z$<\/span> の相関係数をそれぞれ <span class=\"math-inline\">$r_{XY}, r_{XZ}, r_{YZ}$<\/span> とします（<span class=\"math-inline\">$|r_{XZ}|&lt;1,\\ |r_{YZ}|&lt;1$<\/span>）。<span class=\"math-inline\">$Z$<\/span> を除いた <span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の偏相関係数は<\/p>\n<div class=\"math-display\">$$r_{XY\\cdot Z} = \\frac{r_{XY} - r_{XZ}\\,r_{YZ}}{\\sqrt{(1-r_{XZ}^2)(1-r_{YZ}^2)}}$$<\/div>\n<p>です。これは次の手順で求めた2つの残差どうしの相関係数と一致します。<\/p>\n<ol>\n<li><span class=\"math-inline\">$X$<\/span> を <span class=\"math-inline\">$Z$<\/span> に線形回帰した残差 <span class=\"math-inline\">$e_X$<\/span> を求める。<\/li>\n<li><span class=\"math-inline\">$Y$<\/span> を <span class=\"math-inline\">$Z$<\/span> に線形回帰した残差 <span class=\"math-inline\">$e_Y$<\/span> を求める。<\/li>\n<li><span class=\"math-inline\">$e_X$<\/span> と <span class=\"math-inline\">$e_Y$<\/span> の相関係数を求める。<\/li>\n<\/ol>\n<p>除く変数が複数あるときは、相関係数行列 <span class=\"math-inline\">$R$<\/span> の逆行列 <span class=\"math-inline\">$R^{-1}=(r^{ij})$<\/span> を使って<\/p>\n<div class=\"math-display\">$$r_{ij\\cdot\\text{rest}} = -\\frac{r^{ij}}{\\sqrt{r^{ii}\\,r^{jj}}}$$<\/div>\n<p>と書けます（「rest」は <span class=\"math-inline\">$i, j$<\/span> 以外のすべての変数）。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>分子 <span class=\"math-inline\">$r_{XY} - r_{XZ}r_{YZ}$<\/span>：全体の相関 <span class=\"math-inline\">$r_{XY}$<\/span> から、「<span class=\"math-inline\">$Z$<\/span> を経由して生じる分」<span class=\"math-inline\">$r_{XZ}r_{YZ}$<\/span> を引いています。<\/li>\n<li>分母：残差の標準偏差にあたる量で、結果を <span class=\"math-inline\">$-1$<\/span> から <span class=\"math-inline\">$1$<\/span> の範囲にそろえるための調整です。<\/li>\n<li><strong>導出の筋道<\/strong>：標準化した変数で、<span class=\"math-inline\">$X$<\/span> を <span class=\"math-inline\">$Z$<\/span> に回帰すると係数は <span class=\"math-inline\">$r_{XZ}$<\/span> なので、残差は <span class=\"math-inline\">$e_X = X - r_{XZ}Z$<\/span> です。同様に <span class=\"math-inline\">$e_Y = Y - r_{YZ}Z$<\/span> です。<\/li>\n<\/ul>\n<div class=\"math-display\">$$\\begin{aligned}\n\\mathrm{Cov}[e_X, e_Y] &amp;= r_{XY} - r_{XZ}r_{YZ} - r_{YZ}r_{XZ} + r_{XZ}r_{YZ} = r_{XY} - r_{XZ}r_{YZ} \\\\\nV[e_X] &amp;= 1 - r_{XZ}^2, \\qquad V[e_Y] = 1 - r_{YZ}^2\n\\end{aligned}$$<\/div>\n<p>この共分散を標準偏差の積で割ると、上の公式になります。<\/p>\n<ul>\n<li>多変量正規分布では、<span class=\"math-inline\">$r_{XY\\cdot Z}=0$<\/span> と「<span class=\"math-inline\">$Z$<\/span> を与えたとき <span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が条件付き独立」が同値です。グラフィカルモデルでは、精度行列（共分散行列の逆行列）の成分が0かどうかで辺の有無を判断します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><s
