ての <span class=\"math-inline\">$k$<\/span> について <span class=\"math-inline\">$P(k)$<\/span> を足す方法が標準的です（統計ソフトの多くがこの方法）。片側 p 値を 2 倍する流儀もあります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>分母 <span class=\"math-inline\">$\\binom{n}{a+c}$<\/span>：<span class=\"math-inline\">$n$<\/span> 人の中から「成功」になる <span class=\"math-inline\">$a+c$<\/span> 人を選ぶ選び方の総数。<\/li>\n<li>分子：その <span class=\"math-inline\">$a+c$<\/span> 人のうち <span class=\"math-inline\">$a$<\/span> 人が群1から、<span class=\"math-inline\">$c$<\/span> 人が群2から選ばれる選び方の数。<\/li>\n<li>つまり「成功した <span class=\"math-inline\">$a+c$<\/span> 人を、群の区別と無関係にランダムに選んだら、群1から何人入るか」という非復元抽出の確率です。独立（差がない）という帰無仮説を、このくじ引きで表現しています。<\/li>\n<\/ul>\n<p>周辺度数を固定するのは、それらが「差があるかどうか」についての情報をほとんど持たない量（局外母数に関する十分統計量）だからです。条件付けによって未知の共通成功確率が消え、帰無分布が完全に決まります。そのため「正確」検定と呼ばれます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：小規模な治療試験<\/strong><\/p>\n<p>新薬群 8 人と対照群 8 人で、改善した人数を比べました。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>改善<\/th>\n<th>非改善<\/th>\n<th>計<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>新薬<\/td>\n<td>7<\/td>\n<td>1<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>対照<\/td>\n<td>2<\/td>\n<td>6<\/td>\n<td>8<\/td>\n<\/tr>\n<tr>\n<td>計<\/td>\n<td>9<\/td>\n<td>7<\/td>\n<td>16<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>周辺度数を固定すると <span class=\"math-inline\">$a \\sim \\mathrm{HG}(16, 9, 8)$<\/span> で、<span class=\"math-inline\">$\\binom{16}{8} = 12870$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(a=7) = \\frac{\\binom{9}{7}\\binom{7}{1}}{12870} = \\frac{252}{12870} \\approx 0.01958, \\qquad\nP(a=8) = \\frac{\\binom{9}{8}\\binom{7}{0}}{12870} = \\frac{9}{12870} \\approx 0.00070$$<\/div>\n<p>片側 p 値は <span class=\"math-inline\">$0.01958 + 0.00070 \\approx 0.0203$<\/span> です。<\/p>\n<p>この分布は左右対称（<span class=\"math-inline\">$a$<\/span> が 1 と 8、2 と 7 の確率が等しい）なので、両側 p 値は <span class=\"math-inline\">$a = 1, 2, 7, 8$<\/span> の確率の和で <span class=\"math-inline\">$\\approx 0.0406$<\/span> です。有意水準 5% で両側でも有意になります。標本オッズ比は <span class=\"math-inline\">$\\frac{7 \\times 6}{1 \\times 2} = 21$<\/span> です。<\/p>\n<p>期待度数は最小で <span class=\"math-inline\">$7 \\times 8/16 = 3.5$<\/span> と 5 未満のセルがあり、カイ二乗検定の近似は不安が残る場面です。<\/p>\n<p><strong>例2：紅茶の淹れ方を当てる実験<\/strong><\/p>\n<p>8杯の紅茶のうち4杯は「ミルクが先」、4杯は「紅茶が先」と伝えたうえで、ミルクが先の4杯を当ててもらいます。でたらめに選ぶと、正解数は <span class=\"math-inline\">$\\mathrm{HG}(8, 4, 4)$<\/span> に従います。<\/p>\n<div class=\"math-display\">$$P(\\text{4杯すべて正解}) = \\frac{1}{\\binom{8}{4}} = \\frac{1}{70} \\approx 0.0143$$<\/div>\n<p>3杯以上正解の確率は <span class=\"math-inline\">$\\frac{16 + 1}{70} \\approx 0.2429$<\/span> です。全問正解なら有意水準 5% で「でたらめではない」と言えますが、3杯正解では言えません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：希少疾患や初期の臨床試験など、症例数が少なく期待度数が小さい2×2表で、治療と転帰の関連を調べます。<\/li>\n<li><strong>生命科学<\/strong>：遺伝子解析で「ある機能を持つ遺伝子が、発現変動した遺伝子群に多く含まれるか」を調べる解析で、片側のフィッシャー検定（超幾何検定）を大量に行います。<\/li>\n<li><strong>製造・品質管理<\/strong>：工程変更の前後で不良の有無を少数のサンプルで比べるとき、近似に頼らない検定として使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>周辺度数を固定したときの、左上セル <span class=\"math-inline\">$a$<\/span> の分布です。初期値は例1の表（<span class=\"math-inline\">$n=16$<\/span>、改善計 9、新薬群 8）です。\n<span class=\"math-inline\">$a=7$<\/span> と <span class=\"math-inline\">$a=8$<\/span> の棒がどれだけ低いかが p 値の大きさです。\nスライダーで周辺度数を変えると、帰無分布の位置や幅が変わることがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>「周辺度数を固定すると、セルの度数は超幾何分布」という事実が核心です。確率を組合せで書けるようにしておきます。<\/li>\n<li>片側 p 値を、観測値とそれより極端な表の確率の和として計算させる問題が典型です。<\/li>\n<li>期待度数が小さい（目安として 5 未満のセルがある）ときに、カイ二乗検定の代わりに使います。<\/li>\n<li>周辺度数を固定した条件付き検定なので、離散性のために保守的（実際の第1種の過誤の確率が名目の有意水準より小さい）になりやすい点も押さえます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 観測した表の確率 <span class=\"math-inline\">$P(a)$<\/span> そのものを p 値とする → ○ p 値は「観測値と同じか、より極端な表」の確率の和です。<\/li>\n<li>× 両側 p 値は常に片側の2倍 → ○ 分布が非対称なら一致しません。標準的には「確率が観測値以下の表」の確率をすべて足します。<\/li>\n<li>× 大標本でも必ずカイ二乗検定のほうが正しい → ○ フィッシャー検定は標本サイズによらず使えます。大標本では計算量の都合でカイ二乗検定が使われるだけで、結果はほぼ一致します。<\/li>\n<\/ul><\/section>","text":"一言でいうと 2×2分割表で「2つの分類が独立か（2群の割合に差があるか）」を、近似を使わずに調べる検定です。 表の行と列の合計を固定すると、セルの度数が超幾何分布に従うことを使って、p 値を正確に計算します。 定義・数式 2×2分割表を次のように書きます。 成功 失敗 計 群1 群2 計 帰無仮説 ：行の分類と列の分類は独立（2群の成功確率は等しい）。 のもとで、4つの周辺度数をすべて固定した条件付き分布を考えると、左上のセル は超幾何分布に従います。 が決まれば も決まるので、表全体の確率がこの1つの式で表せます。 p 値は次のように計算します。 - 片側検定（群1の成功が多い方向）：観測した 以上の値の確率の和 。 - 両側検定：確率が観測値の確率 以下になるすべての について を足す方法が標準的です（統計ソフトの多くがこの方法）。片側 p 値を 2 倍する流儀もあります。 数式の読み解き - 分母 ： 人の中から「成功」になる 人を選ぶ選び方の総数。 - 分子：その 人のうち 人が群1から、 人が群2から選ばれる選び方の数。 - つまり「成功した 人を、群の区別と無関係にランダムに選んだら、群1から何人入るか」という非復元抽出の確率です。独立（差がない）という帰無仮説を、このくじ引きで表現しています。 周辺度数を固定するのは、それらが「差があるかどうか」についての情報をほとんど持たない量（局外母数に関する十分統計量）だからです。条件付けによって未知の共通成功確率が消え、帰無分布が完全に決まります。そのため「正確」検定と呼ばれます。 具体例 例1：小規模な治療試験 新薬群 8 人と対照群 8 人で、改善した人数を比べました。 改善 非改善 計 新薬 7 1 8 対照 2 6 8 計 9 7 16 周辺度数を固定すると で、 です。 片側 p 値は です。 この分布は左右対称（ が 1 と 8、2 と 7 の確率が等しい）なので、両側 p 値は の確率の和で です。有意水準 5% で両側でも有意になります。標本オッズ比は です。 期待度数は最小で と 5 未満のセルがあり、カイ二乗検定の近似は不安が残る場面です。 例2：紅茶の淹れ方を当てる実験 8杯の紅茶のうち4杯は「ミルクが先」、4杯は「紅茶が先」と伝えたうえで、ミルクが先の4杯を当ててもらいます。でたらめに選ぶと、正解数は に従います。 3杯以上正解の確率は です。全問正解なら有意水準 5% で「でたらめではない」と言えますが、3杯正解では言えません。 現場での使われ方 - 医療：希少疾患や初期の臨床試験など、症例数が少なく期待度数が小さい2×2表で、治療と転帰の関連を調べます。 - 生命科学：遺伝子解析で「ある機能を持つ遺伝子が、発現変動した遺伝子群に多く含まれるか」を調べる解析で、片側のフィッシャー検定（超幾何検定）を大量に行います。 - 製造・品質管理：工程変更の前後で不良の有無を少数のサンプルで比べるとき、近似に頼らない検定として使います。 グラフ・イメージ 周辺度数を固定したときの、左上セル の分布です。初期値は例1の表（ 、改善計 9、新薬群 8）です。 と の棒がどれだけ低いかが p 値の大きさです。 スライダーで周辺度数を変えると、帰無分布の位置や幅が変わることがわかります。 試験のポイント - 「周辺度数を固定すると、セルの度数は超幾何分布」という事実が核心です。確率を組合せで書けるようにしておきます。 - 片側 p 値を、観測値とそれより極端な表の確率の和として計算させる問題が典型です。 - 期待度数が小さい（目安として 5 未満のセルがある）ときに、カイ二乗検定の代わりに使います。 - 周辺度数を固定した条件付き検定なので、離散性のために保守的（実際の第1種の過誤の確率が名目の有意水準より小さい）になりやすい点も押さえます。 よくある間違い - × 観測した表の確率 そのものを p 値とする → ○ p 値は「観測値と同じか、より極端な表」の確率の和です。 - × 両側 p 値は常に片側の2倍 → ○ 分布が非対称なら一致しません。標準的には「確率が観測値以下の表」の確率をすべて足します。 - × 大標本でも必ずカイ二乗検定のほうが正しい → ○ フィッシャー検定は標本サイズによらず使えます。大標本では計算量の都合でカイ二乗検定が使われるだけで、結果はほぼ一致します。"},"geometric-distribution":{"id":"geometric-distribution","title":"幾何分布と無記憶性","reading":"きかぶんぷとむきおくせい","en":"Geometric distribution and memorylessness","aliases":["幾何分布","無記憶性","Geometric distribution","memoryless property"],"chapter":5,"importance":"A","tags":["離散型分布","無記憶性","待ち時間"],"related":["bernoulli-distribution","negative-binomial-distribution","exponential-distribution","probability-generating-function","first-passage-time"],"charts":[{"type":"pmf","dist":"geom","params":{"p":0.3,"start":0},"sliders":[{"param":"p","label":"成功確率 p","min":0.05,"max":0.95,"step":0.01}],"x":{"min":0,"max":30},"caption":"最初の成功までの失敗回数 X の分布（台は 0, 1, 2, …）。棒の高さは公比 1−p で減っていく。p を小さくすると減り方がゆるやかになり、待ち時間が長くなる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>ベルヌーイ試行を繰り返したとき、<strong>初めて成功するまでにかかる回数<\/strong>の分布です。\n「これまで何回失敗したか」は今後の待ち時間に影響しない、という<strong>無記憶性<\/strong>を持つ唯一の離散分布です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>成功確率 <span class=\"math-inline\">$p\\ (0 &lt; p \\le 1)$<\/span> のベルヌーイ試行を独立に繰り返します。<span class=\"math-inline\">$q = 1-p$<\/span> とおきます。<\/p>\n<p><strong>このページで採用する定義（失敗回数）<\/strong>：最初の成功までに起きた<strong>失敗の回数<\/strong> <span class=\"math-inline\">$X$<\/span> の分布を幾何分布 <span class=\"math-inline\">$\\mathrm{Geo}(p)$<\/span> とします。<\/p>\n<div class=\"math-display\">$$P(X = x) = p\\,q^{x}, \\qquad x = 0, 1, 2, \\dots$$<\/div>\n<p><strong>もう一方の流儀（試行回数）<\/strong>：最初の成功が起きた<strong>試行の回数<\/strong> <span class=\"math-inline\">$Y = X + 1$<\/span> を幾何分布と呼ぶ教科書もあります。この場合 <span class=\"math-inline\">$P(Y=y) = p\\,q^{y-1}$<\/span>（<span class=\"math-inline\">$y = 1, 2, \\dots$<\/span>）で、期待値は <span class=\"math-inline\">$1/p$<\/span> です。分散は <span class=\"math-inline\">$X$<\/span> と同じ <span class=\"math-inline\">$q/p^2$<\/span> です。問題文がどちらの定義かを必ず確認してください。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>失敗回数 <span class=\"math-inline\">$X$<\/span>（採用）<\/th>\n<th>試行回数 <span class=\"math-inline\">$Y=X+1$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$\\{0, 1, 2, \\dots\\}$<\/span><\/td>\n<td><span class=\"math-inline\">$\\{1, 2, 3, \\dots\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$p\\,q^{x}$<\/span><\/td>\n<td><span class=\"math-inline\">$p\\,q^{y-1}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$q/p$<\/span><\/td>\n<td><span class=\"math-inline\">$1/p$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$q/p^2$<\/span><\/td>\n<td><span class=\"math-inline\">$q/p^2$<\/span><\/td>\n<\/tr>\n<tr>\n<td>上側確率<\/td>\n<td><span class=\"math-inline\">$P(X \\ge k) = q^{k}$<\/span><\/td>\n<td><span class=\"math-inline\">$P(Y &gt; k) = q^{k}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$\\dfrac{p}{1 - q e^{t}}$<\/span>（<span class=\"math-inline\">$t &lt; -\\log q$<\/span>）<\/td>\n<td><span class=\"math-inline\">$\\dfrac{p e^{t}}{1 - q e^{t}}$<\/span>（<span class=\"math-inline\">$t &lt; -\\log q$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$\\dfrac{p}{1 - q s}$<\/span>（<span class=\"math-inline\">$\\lvert s \\rvert &lt; 1/q$<\/span>）<\/td>\n<td><span class=\"math-inline\">$\\dfrac{p s}{1 - q s}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>負の二項分布<\/td>\n<td>独立な <span class=\"math-inline\">$\\mathrm{Geo}(p)$<\/span> の <span class=\"math-inline\">$r$<\/span> 個の和が負の二項分布 <span class=\"math-inline\">$\\mathrm{NB}(r,p)$<\/span>。幾何分布は <span class=\"math-inline\">$\\mathrm{NB}(1,p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>指数分布<\/td>\n<td>連続時間で無記憶性を持つ唯一の分布が指数分布。幾何分布はその離散版<\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td>幾何分布どうしの和は幾何分布にならない（負の二項分布になる）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>無記憶性<\/strong>：任意の非負整数 <span class=\"math-inline\">$s, t$<\/span> について<\/p>\n<div class=\"math-display\">$$P(X \\ge s + t \\mid X \\ge s) = P(X \\ge t)$$<\/div>\n<p>が成り立ちます。逆に、非負整数に値をとる分布で無記憶性を持つのは幾何分布だけです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$q^{x}$<\/span>：最初の <span class=\"math-inline\">$x$<\/span> 回が続けて失敗する確率。<\/li>\n<li><span class=\"math-inline\">$p$<\/span>：その次の試行で成功する確率。<\/li>\n<li>確率が公比 <span class=\"math-inline\">$q$<\/span> の等比数列（幾何数列）になっているのが名前の由来です。和は <span class=\"math-inline\">$p \\sum q^x = p/(1-q) = 1$<\/span> です。<\/li>\n<\/ul>\n<p><strong>上側確率<\/strong>：<span class=\"math-inline\">$X \\ge k$<\/span> は「最初の <span class=\"math-inline\">$k$<\/span> 回がすべて失敗」と同じなので <span class=\"math-inline\">$P(X \\ge k) = q^{k}$<\/span> です。<\/p>\n<p><strong>無記憶性の証明<\/strong>：<\/p>\n<div class=\"math-display\">$$P(X \\ge s+t \\mid X \\ge s) = \\frac{P(X \\ge s+t)}{P(X \\ge s)} = \\frac{q^{s+t}}{q^{s}} = q^{t} = P(X \\ge t)$$<\/div>\n<p>各試行が独立で成功確率が一定なので、過去に何回失敗していても、そこから先は「最初からやり直し」と同じです。<\/p>\n<p><strong>確率母関数から期待値・分散<\/strong><\/p>\n<div class=\"math-display\">$$G(s) = \\sum_{x=0}^{\\infty} s^{x} p\\,q^{x} = \\frac{p}{1 - qs}$$<\/div>\n<p>微分すると<\/p>\n<div class=\"math-display\">$$G'(s) = \\frac{pq}{(1-qs)^2}, \\qquad G''(s) = \\frac{2pq^2}{(1-qs)^3}$$<\/div>\n<p><span class=\"math-inline\">$s=1$<\/span> を代入すると <span class=\"math-inline\">$1-q = p$<\/span> なので<\/p>\n<div class=\"math-display\">$$E[X] = G'(1) = \\frac{pq}{p^2} = \\frac{q}{p}, \\qquad E[X(X-1)] = G''(1) = \\frac{2q^2}{p^2}$$<\/div>\n<div class=\"math-display\">$$V[X] = G''(1) + G'(1) - \\{G'(1)\\}^2 = \\frac{2q^2}{p^2} + \\frac{q}{p} - \\frac{q^2}{p^2} = \\frac{q^2 + pq}{p^2} = \\frac{q}{p^2}$$<\/div>\n<p>モーメント母関数は <span class=\"math-inline\">$M(t) = G(e^t) = p/(1-qe^t)$<\/span> で、<span class=\"math-inline\">$qe^t &lt; 1$<\/span> すなわち <span class=\"math-inline\">$t &lt; -\\log q$<\/span> のときだけ存在します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：サイコロで6が出るまで<\/strong><\/p>\n<p>サイコロを振って 6 が出るまでの失敗回数を <span class=\"math-inline\">$X$<\/span> とすると、<span class=\"math-inline\">$p = 1/6$<\/span>、<span class=\"math-inline\">$q = 5/6$<\/span> です。<\/p>\n<div class=\"math-display\">$$E[X] = \\frac{5/6}{1/6} = 5, \\qquad V[X] = \\frac{5/6}{(1/6)^2} = 30$$<\/div>\n<p>試行回数で数えると平均 <span class=\"math-inline\">$E[Y] = 6$<\/span> 回です。ちょうど2回失敗して3回目に6が出る確率は<\/p>\n<div class=\"math-display\">$$P(X=2) = \\frac{1}{6}\\left(\\frac{5}{6}\\right)^2 = \\frac{25}{216} \\approx 0.1157$$<\/div>\n<p>6回振っても一度も6が出ない確率は <span class=\"math-inline\">$P(X \\ge 6) = (5/6)^6 \\approx 0.3349$<\/span> です。<\/p>\n<p><strong>例2：無記憶性<\/strong><\/p>\n<p>すでに10回続けて6が出ていない状況で、さらに3回以上失敗が続く確率は<\/p>\n<div class=\"math-display\">$$P(X \\ge 13 \\mid X \\ge 10) = P(X \\ge 3) = \\left(\\frac{5}{6}\\right)^3 \\approx 0.5787$$<\/div>\n<p>で、10回の失敗とは無関係です。「そろそろ出るはず」という直感は、独立な試行では成り立ちません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>IT・Webサービス<\/strong>：通信でパケットの送信が成功するまでの再送回数を幾何分布で表し、平均の遅延を見積もります。<\/li>\n<li><strong>マーケティング<\/strong>：営業電話で初めて契約が取れるまでの件数や、顧客が離脱するまでの来店回数（毎回一定確率で離脱）を幾何分布でモデル化します。<\/li>\n<li><strong>製造・品質管理<\/strong>：最初の不良品が出るまでに生産した個数を数え、不良率が上がっていないかを監視します（不良がすぐ出たら不良率の上昇を疑う）。<\/li>\n<li><strong>金融・保険<\/strong>：各年一定の確率で起こる事象（例：一定規模の災害）が初めて起こるまでの年数を幾何分布で表すと、平均 <span class=\"math-inline\">$1/p$<\/span> 年が「再現期間」になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>棒の高さが <span class=\"math-inline\">$p, pq, pq^2, \\dots$<\/span> と一定の比率で減っていく様子を見ます。\n<span class=\"math-inline\">$p$<\/span> を小さくすると減り方がゆるやかになり、長く待つ確率が高くなります。\nどの位置から先を切り取っても同じ形（全体の縮小コピー）になっていることが、無記憶性を表しています。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>台が 0 から始まるか 1 から始まるかで期待値が <span class=\"math-inline\">$q/p$<\/span> と <span class=\"math-inline\">$1/p$<\/span> で異なります。分散 <span class=\"math-inline\">$q/p^2$<\/span> は共通です。<\/li>\n<li>確率母関数で期待値・分散を導く流れは、途中式まで書けるようにしておきます。<\/li>\n<li>無記憶性の証明（上側確率 <span class=\"math-inline\">$q^k$<\/span> の比）と、「無記憶性を持つ離散分布は幾何分布だけ」という特徴づけが重要です。<\/li>\n<li>幾何分布の和が負の二項分布になること、指数分布の離散版であることを、他の分布との関係として押さえます。<\/li>\n<li>最尤推定量は、失敗回数の定義なら <span class=\"math-inline\">$\\hat p = 1/(1 + \\bar X)$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 期待値を常に <span class=\"math-inline\">$1/p$<\/span> とする → ○ 失敗回数で数えるなら <span class=\"math-inline\">$q/p$<\/span>、試行回数で数えるなら <span class=\"math-inline\">$1/p$<\/span> です。<\/li>\n<li>× 分散を <span class=\"math-inline\">$q/p$<\/span> や <span class=\"math-inline\">$1/p^2$<\/span> とする → ○ どちらの流儀でも <span class=\"math-inline\">$q/p^2$<\/span> です。<\/li>\n<li>× 「何回も失敗したから次は成功しやすい」と考える → ○ 無記憶性により、過去の失敗回数は今後の確率に影響しません。<\/li>\n<li>× モーメント母関数がすべての <span class=\"math-inline\">$t$<\/span> で存在するとする → ○ <span class=\"math-inline\">$t &lt; -\\log q$<\/span> のときだけ存在します。<\/li>\n<\/ul><\/section>","text":"一言でいうと ベルヌーイ試行を繰り返したとき、初めて成功するまでにかかる回数の分布です。 「これまで何回失敗したか」は今後の待ち時間に影響しない、という無記憶性を持つ唯一の離散分布です。 定義・数式 成功確率 のベルヌーイ試行を独立に繰り返します。 とおきます。 このページで採用する定義（失敗回数）：最初の成功までに起きた失敗の回数 の分布を幾何分布 とします。 もう一方の流儀（試行回数）：最初の成功が起きた試行の回数 を幾何分布と呼ぶ教科書もあります。この場合 （ ）で、期待値は です。分散は と同じ です。問題文がどちらの定義かを必ず確認してください。 項目 失敗回数 （採用） 試行回数 台 確率関数 期待値 分散 上側確率 モーメント母関数 （ ） （ ） 確率母関数 （ ） 他の分布との関係： 関係 内容 負の二項分布 独立な の 個の和が負の二項分布 。幾何分布は 指数分布 連続時間で無記憶性を持つ唯一の分布が指数分布。幾何分布はその離散版 再生性 幾何分布どうしの和は幾何分布にならない（負の二項分布になる） 無記憶性：任意の非負整数 について が成り立ちます。逆に、非負整数に値をとる分布で無記憶性を持つのは幾何分布だけです。 数式の読み解き - ：最初の 回が続けて失敗する確率。 - ：その次の試行で成功する確率。 - 確率が公比 の等比数列（幾何数列）になっているのが名前の由来です。和は です。 上側確率： は「最初の 回がすべて失敗」と同じなので です。 無記憶性の証明： 各試行が独立で成功確率が一定なので、過去に何回失敗していても、そこから先は「最初からやり直し」と同じです。 確率母関数から期待値・分散 微分すると を代入すると なので モーメント母関数は で、 すなわち のときだけ存在します。 具体例 例1：サイコロで6が出るまで サイコロを振って 6 が出るまでの失敗回数を とすると、 、 です。 試行回数で数えると平均 回です。ちょうど2回失敗して3回目に6が出る確率は 6回振っても一度も6が出ない確率は です。 例2：無記憶性 すでに10回続けて6が出ていない状況で、さらに3回以上失敗が続く確率は で、10回の失敗とは無関係です。「そろそろ出るはず」という直感は、独立な試行では成り立ちません。 現場での使われ方 - IT・Webサービス：通信でパケットの送信が成功するまでの再送回数を幾何分布で表し、平均の遅延を見積もります。 - マーケティング：営業電話で初めて契約が取れるまでの件数や、顧客が離脱するまでの来店回数（毎回一定確率で離脱）を幾何分布でモデル化します。 - 製造・品質管理：最初の不良品が出るまでに生産した個数を数え、不良率が上がっていないかを監視します（不良がすぐ出たら不良率の上昇を疑う）。 - 金融・保険：各年一定の確率で起こる事象（例：一定規模の災害）が初めて起こるまでの年数を幾何分布で表すと、平均 年が「再現期間」になります。 グラフ・イメージ 棒の高さが と一定の比率で減っていく様子を見ます。 を小さくすると減り方がゆるやかになり、長く待つ確率が高くなります。 どの位置から先を切り取っても同じ形（全体の縮小コピー）になっていることが、無記憶性を表しています。 試験のポイント - 台が 0 から始まるか 1 から始まるかで期待値が と で異なります。分散 は共通です。 - 確率母関数で期待値・分散を導く流れは、途中式まで書けるようにしておきます。 - 無記憶性の証明（上側確率 の比）と、「無記憶性を持つ離散分布は幾何分布だけ」という特徴づけが重要です。 - 幾何分布の和が負の二項分布になること、指数分布の離散版であることを、他の分布との関係として押さえます。 - 最尤推定量は、失敗回数の定義なら です。 よくある間違い - × 期待値を常に とする → ○ 失敗回数で数えるなら 、試行回数で数えるなら です。 - × 分散を や とする → ○ どちらの流儀でも です。 - × 「何回も失敗したから次は成功しやすい」と考える → ○ 無記憶性により、過去の失敗回数は今後の確率に影響しません。 - × モーメント母関数がすべての で存在するとする → ○ のときだけ存在します。"},"hypergeometric-distribution":{"id":"hypergeometric-distribution","title":"超幾何分布","reading":"ちょうきかぶんぷ","en":"Hypergeometric distribution","aliases":["HG"],"chapter":5,"importance":"A","tags":["離散型分布","非復元抽出","有限母集団"],"related":["binomial-distribution","finite-population-correction","fisher-exact-test","simple-random-sampling","multinomial-distribution"],"charts":[{"type":"pmf","dist":"hypergeom","params":{"N":20,"K":5,"n":4},"sliders":[{"param":"N","label":"母集団の大きさ N","min":10,"max":200,"step":1},{"param":"K","label":"母集団中の当たり K","min":1,"max":10,"step":1},{"param":"n","label":"抽出数 n","min":1,"max":10,"step":1}],"x":{"min":0,"max":10},"overlay":"norm-approx","caption":"非復元抽出で取り出した当たりの数の分布。N を大きくすると（K/N が小さくなる点に注意しつつ）、同じ K/N の二項分布に近づく。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>当たりとはずれが混ざった有限個の集まりから、<strong>戻さずに<\/strong>（非復元で）何個か取り出したとき、その中の当たりの数の分布です。\n抜取検査やくじ引きのように、取り出すたびに中身が変わる状況を正確に表します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>全部で <span class=\"math-inline\">$N$<\/span> 個のうち <span class=\"math-inline\">$K$<\/span> 個が当たり（<span class=\"math-inline\">$N-K$<\/span> 個がはずれ）の母集団から、<span class=\"math-inline\">$n$<\/span> 個を非復元で無作為に取り出します。取り出した中の当たりの数を <span class=\"math-inline\">$X$<\/span> とすると、<\/p>\n<div class=\"math-display\">$$P(X = x) = \\frac{\\dbinom{K}{x}\\dbinom{N-K}{n-x}}{\\dbinom{N}{n}}, \\qquad \\max(0,\\ n-(N-K)) \\le x \\le \\min(n,\\ K)$$<\/div>\n<p>です。これを <span class=\"math-inline\">$X \\sim \\mathrm{HG}(N, K, n)$<\/span> と書きます。以下 <span class=\"math-inline\">$p = K/N$<\/span> とおきます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td>整数 <span class=\"math-inline\">$x$<\/span> で <span class=\"math-inline\">$\\max(0,\\ n-N+K) \\le x \\le \\min(n,K)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>母集団の大きさ <span class=\"math-inline\">$N$<\/span>、当たりの数 <span class=\"math-inline\">$K\\ (0 \\le K \\le N)$<\/span>、抽出数 <span class=\"math-inline\">$n\\ (1 \\le n \\le N)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$\\binom{K}{x}\\binom{N-K}{n-x} \\big/ \\binom{N}{n}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$np = \\dfrac{nK}{N}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$np(1-p)\\dfrac{N-n}{N-1}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数・確率母関数<\/td>\n<td>存在する（台が有限）が、簡単な閉じた形はない（超幾何関数で表される）。期待値・分散は指示変数で求める<\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td>なし<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>二項分布<\/td>\n<td><span class=\"math-inline\">$K/N = p$<\/span> を一定にして <span class=\"math-inline\">$N \\to \\infty$<\/span> とすると <span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span> に収束。復元抽出なら最初から二項分布<\/td>\n<\/tr>\n<tr>\n<td>有限母集団修正<\/td>\n<td>分散の因子 <span class=\"math-inline\">$\\dfrac{N-n}{N-1}$<\/span> が有限母集団修正<\/td>\n<\/tr>\n<tr>\n<td>フィッシャーの正確検定<\/td>\n<td>2×2分割表で周辺度数を固定したときのセルの度数が超幾何分布<\/td>\n<\/tr>\n<tr>\n<td>多変量超幾何分布<\/td>\n<td>3種類以上に分かれた母集団からの非復元抽出（多項分布の非復元版）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>分母 <span class=\"math-inline\">$\\binom{N}{n}$<\/span>：<span class=\"math-inline\">$N$<\/span> 個から <span class=\"math-inline\">$n$<\/span> 個を選ぶ選び方の総数。どれも同様に確からしいとします。<\/li>\n<li>分子 <span class=\"math-inline\">$\\binom{K}{x}\\binom{N-K}{n-x}$<\/span>：当たり <span class=\"math-inline\">$K$<\/span> 個から <span class=\"math-inline\">$x$<\/span> 個、はずれ <span class=\"math-inline\">$N-K$<\/span> 個から残りの <span class=\"math-inline\">$n-x$<\/span> 個を選ぶ選び方の数。<\/li>\n<li>台の下限 <span class=\"math-inline\">$n-(N-K)$<\/span>：はずれを全部取ってもまだ足りない分は、当たりを取るしかありません。<\/li>\n<\/ul>\n<p><strong>期待値（指示変数で）<\/strong><\/p>\n<p><span class=\"math-inline\">$i$<\/span> 回目に取り出したものが当たりなら <span class=\"math-inline\">$I_i = 1$<\/span> とおくと <span class=\"math-inline\">$X = I_1 + \\cdots + I_n$<\/span> です。対称性から、何回目でも当たりを引く確率は <span class=\"math-inline\">$K/N$<\/span> なので、<\/p>\n<div class=\"math-display\">$$E[X] = \\sum_{i=1}^{n} P(I_i = 1) = n \\cdot \\frac{K}{N} = np$$<\/div>\n<p><strong>分散（共分散が負になる）<\/strong><\/p>\n<p>非復元なので <span class=\"math-inline\">$I_i$<\/span> どうしは独立ではありません。<span class=\"math-inline\">$i \\ne j$<\/span> のとき<\/p>\n<div class=\"math-display\">$$P(I_i = 1,\\ I_j = 1) = \\frac{K}{N}\\cdot\\frac{K-1}{N-1}$$<\/div>\n<div class=\"math-display\">$$\\mathrm{Cov}(I_i, I_j) = \\frac{K(K-1)}{N(N-1)} - \\frac{K^2}{N^2} = -\\frac{K(N-K)}{N^2(N-1)} = -\\frac{p(1-p)}{N-1}$$<\/div>\n<p>です。当たりを1つ引くと残りの当たりが減るので、共分散は負になります。よって<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nV[X] &amp;= \\sum_{i} V[I_i] + \\sum_{i \\ne j} \\mathrm{Cov}(I_i, I_j) \\\\\n&amp;= np(1-p) - n(n-1)\\frac{p(1-p)}{N-1} \\\\\n&amp;= np(1-p)\\left(1 - \\frac{n-1}{N-1}\\right) = np(1-p)\\frac{N-n}{N-1}\n\\end{aligned}$$<\/div>\n<p>二項分布の分散 <span class=\"math-inline\">$np(1-p)$<\/span> に、1 以下の因子 <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> がかかった形です。戻さずに取るので、母集団の構成がわかってくる分だけばらつきが小さくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：箱の中の不良品<\/strong><\/p>\n<p>20 個の部品のうち 5 個が不良です。無作為に 4 個を取り出したときの不良数 <span class=\"math-inline\">$X \\sim \\mathrm{HG}(20, 5, 4)$<\/span> を考えます。<span class=\"math-inline\">$\\binom{20}{4} = 4845$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(X=0) = \\frac{\\binom{5}{0}\\binom{15}{4}}{4845} = \\frac{1365}{4845} \\approx 0.2817, \\qquad\nP(X=1) = \\frac{\\binom{5}{1}\\binom{15}{3}}{4845} = \\frac{2275}{4845} \\approx 0.4696$$<\/div>\n<p>少なくとも1個不良が含まれる確率は <span class=\"math-inline\">$1 - 0.2817 = 0.7183$<\/span> です。<\/p>\n<p>期待値は <span class=\"math-inline\">$4 \\times 5/20 = 1$<\/span>、分散は<\/p>\n<div class=\"math-display\">$$V[X] = 4 \\times 0.25 \\times 0.75 \\times \\frac{20-4}{20-1} = 0.75 \\times \\frac{16}{19} \\approx 0.6316$$<\/div>\n<p>復元抽出（二項分布 <span class=\"math-inline\">$\\mathrm{Bin}(4, 0.25)$<\/span>）なら分散は 0.75 で、<span class=\"math-inline\">$P(X=0)=0.75^4 \\approx 0.3164$<\/span> です。母集団が小さいと違いがはっきり出ます。<\/p>\n<p><strong>例2：母集団が大きいときの二項近似<\/strong><\/p>\n<p>500 個中 50 個が不良（<span class=\"math-inline\">$p=0.1$<\/span>）のロットから 10 個を取り出すとき、不良が0個の確率は<\/p>\n<div class=\"math-display\">$$P(X=0) = \\frac{\\binom{450}{10}}{\\binom{500}{10}} \\approx 0.3452$$<\/div>\n<p>二項近似では <span class=\"math-inline\">$0.9^{10} \\approx 0.3487$<\/span> です。分散も <span class=\"math-inline\">$0.8838$<\/span> と <span class=\"math-inline\">$0.9$<\/span> で近い値です。抽出率 <span class=\"math-inline\">$n/N = 2\\%$<\/span> と小さいので、二項分布で十分よく近似できます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：ロットの大きさが有限で、検査した製品を戻さない抜取検査では、合格確率を超幾何分布で正確に計算します。ロットが小さいほど二項近似とのずれが大きくなります。<\/li>\n<li><strong>生態学・環境調査<\/strong>：捕獲再捕獲法で、標識した個体 <span class=\"math-inline\">$K$<\/span> 匹を放し、後で <span class=\"math-inline\">$n$<\/span> 匹捕まえたときの標識個体の数は超幾何分布に従います。そこから全体の個体数 <span class=\"math-inline\">$N$<\/span> を推定します（<span class=\"math-inline\">$\\hat N = nK/x$<\/span>）。<\/li>\n<li><strong>医療<\/strong>：2群の治療成績を比べる2×2分割表で、標本が小さいときはフィッシャーの正確検定を使います。その帰無分布が超幾何分布です。<\/li>\n<li><strong>IT・Webサービス<\/strong>：遺伝子やキーワードの集合について「ある特徴を持つものが、選ばれた集合に偶然以上に多く含まれるか」を調べるエンリッチメント解析で、超幾何分布の上側確率を p 値にします。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$N$<\/span>、<span class=\"math-inline\">$K$<\/span>、<span class=\"math-inline\">$n$<\/span> を動かして、当たりの数の分布がどう変わるかを見ます。\n<span class=\"math-inline\">$N$<\/span> を <span class=\"math-inline\">$K$<\/span> や <span class=\"math-inline\">$n$<\/span> に比べて十分大きくすると、非復元と復元の違いが小さくなり、二項分布に近づきます。\n逆に <span class=\"math-inline\">$n$<\/span> を <span class=\"math-inline\">$N$<\/span> に近づけると分布が細くなります。全部取り出せば当たりの数は <span class=\"math-inline\">$K$<\/span> に確定するからです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>確率関数を組合せで書き、具体的な確率を計算させる問題が基本です。<\/li>\n<li>期待値は指示変数の和で、分散は「共分散が <span class=\"math-inline\">$-p(1-p)/(N-1)$<\/span>」から導く流れが重要です。<\/li>\n<li>分散の因子 <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> は有限母集団修正そのものです。標本調査（第26章）の単純無作為抽出の分散公式と同じ形です。<\/li>\n<li><span class=\"math-inline\">$N \\to \\infty$<\/span> で二項分布に近づくこと、<span class=\"math-inline\">$n/N$<\/span> が小さければ二項近似でよいことを押さえます。<\/li>\n<li>フィッシャーの正確検定は、2×2分割表の1つのセルが超幾何分布に従うことを使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 分散を <span class=\"math-inline\">$np(1-p)$<\/span> とする → ○ 非復元抽出なので <span class=\"math-inline\">$\\frac{N-n}{N-1}$<\/span> がかかります。<\/li>\n<li>× 修正因子を <span class=\"math-inline\">$\\frac{N-n}{N}$<\/span> とする → ○ 分母は <span class=\"math-inline\">$N-1$<\/span> です（<span class=\"math-inline\">$N$<\/span> が大きければ差は小さいですが、小さな母集団では効きます）。<\/li>\n<li>× 台を <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$n$<\/span> までとする → ○ <span class=\"math-inline\">$x \\le K$<\/span> と <span class=\"math-inline\">$n - x \\le N-K$<\/span> も必要です。例えば当たりが3個しかなければ、4個当たることはありません。<\/li>\n<li>× 非復元なので期待値も二項分布と違う → ○ 期待値は復元・非復元とも <span class=\"math-inline\">$nK/N$<\/span> で同じです。違うのは分散です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 当たりとはずれが混ざった有限個の集まりから、戻さずに（非復元で）何個か取り出したとき、その中の当たりの数の分布です。 抜取検査やくじ引きのように、取り出すたびに中身が変わる状況を正確に表します。 定義・数式 全部で 個のうち 個が当たり（ 個がはずれ）の母集団から、 個を非復元で無作為に取り出します。取り出した中の当たりの数を とすると、 です。これを と書きます。以下 とおきます。 項目 内容 台 整数 で パラメータ 母集団の大きさ 、当たりの数 、抽出数 確率関数 期待値 分散 モーメント母関数・確率母関数 存在する（台が有限）が、簡単な閉じた形はない（超幾何関数で表される）。期待値・分散は指示変数で求める 再生性 なし 他の分布との関係： 関係 内容 二項分布 を一定にして とすると に収束。復元抽出なら最初から二項分布 有限母集団修正 分散の因子 が有限母集団修正 フィッシャーの正確検定 2×2分割表で周辺度数を固定したときのセルの度数が超幾何分布 多変量超幾何分布 3種類以上に分かれた母集団からの非復元抽出（多項分布の非復元版） 数式の読み解き - 分母 ： 個から 個を選ぶ選び方の総数。どれも同様に確からしいとします。 - 分子 ：当たり 個から 個、はずれ 個から残りの 個を選ぶ選び方の数。 - 台の下限 ：はずれを全部取ってもまだ足りない分は、当たりを取るしかありません。 期待値（指示変数で） 回目に取り出したものが当たりなら とおくと です。対称性から、何回目でも当たりを引く確率は なので、 分散（共分散が負になる） 非復元なので どうしは独立ではありません。 のとき です。当たりを1つ引くと残りの当たりが減るので、共分散は負になります。よって 二項分布の分散 に、1 以下の因子 がかかった形です。戻さずに取るので、母集団の構成がわかってくる分だけばらつきが小さくなります。 具体例 例1：箱の中の不良品 20 個の部品のうち 5 個が不良です。無作為に 4 個を取り出したときの不良数 を考えます。 です。 少なくとも1個不良が含まれる確率は です。 期待値は 、分散は 復元抽出（二項分布 ）なら分散は 0.75 で、 です。母集団が小さいと違いがはっきり出ます。 例2：母集団が大きいときの二項近似 500 個中 50 個が不良（ ）のロットから 10 個を取り出すとき、不良が0個の確率は 二項近似では です。分散も と で近い値です。抽出率 と小さいので、二項分布で十分よく近似できます。 現場での使われ方 - 製造・品質管理：ロットの大きさが有限で、検査した製品を戻さない抜取検査では、合格確率を超幾何分布で正確に計算します。ロットが小さいほど二項近似とのずれが大きくなります。 - 生態学・環境調査：捕獲再捕獲法で、標識した個体 匹を放し、後で 匹捕まえたときの標識個体の数は超幾何分布に従います。そこから全体の個体数 を推定します（ ）。 - 医療：2群の治療成績を比べる2×2分割表で、標本が小さいときはフィッシャーの正確検定を使います。その帰無分布が超幾何分布です。 - IT・Webサービス：遺伝子やキーワードの集合について「ある特徴を持つものが、選ばれた集合に偶然以上に多く含まれるか」を調べるエンリッチメント解析で、超幾何分布の上側確率を p 値にします。 グラフ・イメージ 、 、 を動かして、当たりの数の分布がどう変わるかを見ます。 を や に比べて十分大きくすると、非復元と復元の違いが小さくなり、二項分布に近づきます。 逆に を に近づけると分布が細くなります。全部取り出せば当たりの数は に確定するからです。 試験のポイント - 確率関数を組合せで書き、具体的な確率を計算させる問題が基本です。 - 期待値は指示変数の和で、分散は「共分散が 」から導く流れが重要です。 - 分散の因子 は有限母集団修正そのものです。標本調査（第26章）の単純無作為抽出の分散公式と同じ形です。 - で二項分布に近づくこと、 が小さければ二項近似でよいことを押さえます。 - フィッシャーの正確検定は、2×2分割表の1つのセルが超幾何分布に従うことを使います。 よくある間違い - × 分散を とする → ○ 非復元抽出なので がかかります。 - × 修正因子を とする → ○ 分母は です（ が大きければ差は小さいですが、小さな母集団では効きます）。 - × 台を から までとする → ○ と も必要です。例えば当たりが3個しかなければ、4個当たることはありません。 - × 非復元なので期待値も二項分布と違う → ○ 期待値は復元・非復元とも で同じです。違うのは分散です。"},"multinomial-distribution":{"id":"multinomial-distribution","title":"多項分布","reading":"たこうぶんぷ","en":"Multinomial distribution","aliases":["Multinomial","カテゴリ分布"],"chapter":5,"importance":"A","tags":["離散型分布","多変量分布","分割表","適合度検定"],"related":["binomial-distribution","bernoulli-distribution","poisson-distribution","goodness-of-fit-test","variance-covariance-matrix","hypergeometric-distribution"],"charts":[{"type":"pmf","dist":"binom","params":{"n":10,"p":0.5},"sliders":[{"param":"n","label":"試行回数 n","min":1,"max":60,"step":1},{"param":"p","label":"注目するカテゴリの確率 p₁","min":0.01,"max":0.99,"step":0.01}],"overlay":"norm-approx","caption":"多項分布の1つの成分 X₁ の周辺分布は二項分布 Bin(n, p₁) になる。他のカテゴリをまとめて「それ以外」とみなせばよいからである。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>結果が <span class=\"math-inline\">$k$<\/span> 通り（<span class=\"math-inline\">$k \\ge 3$<\/span> も可）ある試行を <span class=\"math-inline\">$n$<\/span> 回独立に繰り返したとき、各結果が何回出たかの<strong>組<\/strong>の分布です。\n二項分布（成功・失敗の2通り）を、3通り以上のカテゴリに広げたものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>1回の試行でカテゴリ <span class=\"math-inline\">$1, \\dots, k$<\/span> のどれか1つが、確率 <span class=\"math-inline\">$p_1, \\dots, p_k$<\/span>（<span class=\"math-inline\">$p_i \\ge 0$<\/span>、<span class=\"math-inline\">$\\sum_i p_i = 1$<\/span>）で起こるとします。これを独立に <span class=\"math-inline\">$n$<\/span> 回繰り返し、カテゴリ <span class=\"math-inline\">$i$<\/span> が起きた回数を <span class=\"math-inline\">$X_i$<\/span> とします。<span class=\"math-inline\">$x_i$<\/span> が非負整数で <span class=\"math-inline\">$x_1 + \\cdots + x_k = n$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$P(X_1 = x_1, \\dots, X_k = x_k) = \\frac{n!}{x_1!\\,x_2!\\cdots x_k!}\\,p_1^{x_1}p_2^{x_2}\\cdots p_k^{x_k}$$<\/div>\n<p>これを <span class=\"math-inline\">$(X_1, \\dots, X_k) \\sim \\mathrm{Mult}(n; p_1, \\dots, p_k)$<\/span> と書きます。<span class=\"math-inline\">$n=1$<\/span> の場合は<strong>カテゴリ分布<\/strong>と呼ばれます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td>非負整数の組 <span class=\"math-inline\">$(x_1,\\dots,x_k)$<\/span> で <span class=\"math-inline\">$\\sum_i x_i = n$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>試行回数 <span class=\"math-inline\">$n$<\/span>、各カテゴリの確率 <span class=\"math-inline\">$p_1,\\dots,p_k$<\/span>（和が 1）<\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$E[X_i] = np_i$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$V[X_i] = np_i(1-p_i)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>共分散<\/td>\n<td><span class=\"math-inline\">$\\mathrm{Cov}(X_i, X_j) = -np_ip_j\\ (i \\ne j)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>相関係数<\/td>\n<td><span class=\"math-inline\">$-\\sqrt{\\dfrac{p_ip_j}{(1-p_i)(1-p_j)}}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t_1,\\dots,t_k) = \\left(\\sum_{i=1}^{k} p_i e^{t_i}\\right)^{n}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$G(s_1,\\dots,s_k) = \\left(\\sum_{i=1}^{k} p_i s_i\\right)^{n}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td>確率 <span class=\"math-inline\">$p_i$<\/span> が共通なら <span class=\"math-inline\">$\\mathrm{Mult}(m;\\boldsymbol p) + \\mathrm{Mult}(n;\\boldsymbol p) = \\mathrm{Mult}(m+n;\\boldsymbol p)$<\/span>（独立のとき）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>二項分布<\/td>\n<td><span class=\"math-inline\">$k=2$<\/span> なら二項分布。各成分 <span class=\"math-inline\">$X_i$<\/span> の周辺分布は <span class=\"math-inline\">$\\mathrm{Bin}(n, p_i)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>条件付き分布<\/td>\n<td><span class=\"math-inline\">$X_j = x_j$<\/span> を与えたとき、<span class=\"math-inline\">$X_i \\sim \\mathrm{Bin}\\!\\left(n - x_j,\\ \\dfrac{p_i}{1-p_j}\\right)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布<\/td>\n<td>独立な <span class=\"math-inline\">$Y_i \\sim \\mathrm{Po}(\\lambda_i)$<\/span> を、合計 <span class=\"math-inline\">$\\sum Y_i = n$<\/span> で条件付けると <span class=\"math-inline\">$\\mathrm{Mult}(n;\\ \\lambda_i/\\sum_j\\lambda_j)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>多変量正規分布<\/td>\n<td><span class=\"math-inline\">$n$<\/span> が大きいとき、平均 <span class=\"math-inline\">$n\\boldsymbol p$<\/span>、共分散 <span class=\"math-inline\">$n(\\mathrm{diag}(\\boldsymbol p) - \\boldsymbol p\\boldsymbol p^\\top)$<\/span> の多変量正規分布で近似<\/td>\n<\/tr>\n<tr>\n<td>カイ二乗分布<\/td>\n<td>ピアソンのカイ二乗統計量 <span class=\"math-inline\">$\\sum_i (X_i - np_i)^2/(np_i)$<\/span> が、近似的に自由度 <span class=\"math-inline\">$k-1$<\/span> のカイ二乗分布に従う<\/td>\n<\/tr>\n<tr>\n<td>超幾何分布<\/td>\n<td>非復元抽出の場合は多変量超幾何分布になる<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p_1^{x_1}\\cdots p_k^{x_k}$<\/span>：特定の並び（例：1回目がカテゴリ2、2回目がカテゴリ1、…）の確率。<\/li>\n<li><span class=\"math-inline\">$\\dfrac{n!}{x_1!\\cdots x_k!}$<\/span>：カテゴリ <span class=\"math-inline\">$i$<\/span> がちょうど <span class=\"math-inline\">$x_i$<\/span> 回ずつ現れる並べ方の数（多項係数）。<span class=\"math-inline\">$k=2$<\/span> なら <span class=\"math-inline\">$\\binom{n}{x_1}$<\/span> です。<\/li>\n<li><span class=\"math-inline\">$\\sum_i X_i = n$<\/span> という制約があるので、実質的な自由度は <span class=\"math-inline\">$k-1$<\/span> です。<span class=\"math-inline\">$X_1, \\dots, X_{k-1}$<\/span> が決まれば <span class=\"math-inline\">$X_k$<\/span> も決まります。<\/li>\n<\/ul>\n<p><strong>周辺分布が二項分布になる理由<\/strong>：カテゴリ <span class=\"math-inline\">$i$<\/span> に注目し、それ以外をまとめて「失敗」とみなせば、成功確率 <span class=\"math-inline\">$p_i$<\/span> のベルヌーイ試行を <span class=\"math-inline\">$n$<\/span> 回行っているのと同じです。よって <span class=\"math-inline\">$X_i \\sim \\mathrm{Bin}(n, p_i)$<\/span> で、<span class=\"math-inline\">$E[X_i] = np_i$<\/span>、<span class=\"math-inline\">$V[X_i] = np_i(1-p_i)$<\/span> です。<\/p>\n<p><strong>共分散が負になる理由と導出<\/strong>：カテゴリ <span class=\"math-inline\">$i$<\/span> と <span class=\"math-inline\">$j$<\/span> をまとめると <span class=\"math-inline\">$X_i + X_j \\sim \\mathrm{Bin}(n, p_i + p_j)$<\/span> です。<\/p>\n<div class=\"math-display\">$$V[X_i + X_j] = V[X_i] + V[X_j] + 2\\,\\mathrm{Cov}(X_i, X_j)$$<\/div>\n<p>に代入すると<\/p>\n<div class=\"math-display\">$$n(p_i+p_j)(1-p_i-p_j) = np_i(1-p_i) + np_j(1-p_j) + 2\\,\\mathrm{Cov}(X_i,X_j)$$<\/div>\n<p>左辺から右辺の分散2つを引くと <span class=\"math-inline\">$-2np_ip_j$<\/span> になるので、<span class=\"math-inline\">$\\mathrm{Cov}(X_i,X_j) = -np_ip_j$<\/span> です。合計が <span class=\"math-inline\">$n$<\/span> に固定されているので、どれかが増えれば他は減る、という負の関係です。<\/p>\n<p><strong>モーメント母関数<\/strong>：1回の試行の母関数は <span class=\"math-inline\">$\\sum_i p_i e^{t_i}$<\/span> で、独立に <span class=\"math-inline\">$n$<\/span> 回繰り返すので <span class=\"math-inline\">$n$<\/span> 乗になります。<span class=\"math-inline\">$\\partial^2 M/\\partial t_i \\partial t_j$<\/span> を <span class=\"math-inline\">$\\boldsymbol t = \\boldsymbol 0$<\/span> で評価すると <span class=\"math-inline\">$E[X_iX_j] = n(n-1)p_ip_j$<\/span> となり、<span class=\"math-inline\">$\\mathrm{Cov} = n(n-1)p_ip_j - n^2p_ip_j = -np_ip_j$<\/span> と確かめられます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：アンケートの回答<\/strong><\/p>\n<p>ある質問に「賛成」「反対」「どちらでもない」と答える割合が <span class=\"math-inline\">$0.5,\\ 0.3,\\ 0.2$<\/span> の集団から10人を選びます。賛成5人・反対3人・どちらでもない2人となる確率は<\/p>\n<div class=\"math-display\">$$\\frac{10!}{5!\\,3!\\,2!}(0.5)^5(0.3)^3(0.2)^2 = 2520 \\times 0.03125 \\times 0.027 \\times 0.04 \\approx 0.0851$$<\/div>\n<p>賛成の人数だけを見ると <span class=\"math-inline\">$\\mathrm{Bin}(10, 0.5)$<\/span> で、<span class=\"math-inline\">$P(X_1 = 5) \\approx 0.2461$<\/span> です。<\/p>\n<p><strong>例2：共分散と相関<\/strong><\/p>\n<p>例1の設定で、賛成数 <span class=\"math-inline\">$X_1$<\/span> と反対数 <span class=\"math-inline\">$X_2$<\/span> について<\/p>\n<div class=\"math-display\">$$\\mathrm{Cov}(X_1, X_2) = -10 \\times 0.5 \\times 0.3 = -1.5, \\qquad\n\\rho = -\\sqrt{\\frac{0.5 \\times 0.3}{0.5 \\times 0.7}} \\approx -0.6547$$<\/div>\n<p>分散共分散行列は<\/p>\n<div class=\"math-display\">$$\\begin{pmatrix} 2.5 &amp; -1.5 &amp; -1.0 \\\\ -1.5 &amp; 2.1 &amp; -0.6 \\\\ -1.0 &amp; -0.6 &amp; 1.6 \\end{pmatrix}$$<\/div>\n<p>で、各行の和が 0 になります（合計が一定なので <span class=\"math-inline\">$V[\\sum X_i]=0$<\/span>）。<\/p>\n<p>「どちらでもない」が2人だとわかったとき、賛成数は <span class=\"math-inline\">$\\mathrm{Bin}(8,\\ 0.5/0.8) = \\mathrm{Bin}(8, 0.625)$<\/span> に従い、条件付き期待値は <span class=\"math-inline\">$5$<\/span> です。<\/p>\n<p><strong>例3：サイコロで全部の目が1回ずつ<\/strong><\/p>\n<p>サイコロを6回振って、1〜6の目がちょうど1回ずつ出る確率は<\/p>\n<div class=\"math-display\">$$\\frac{6!}{1!^6}\\left(\\frac{1}{6}\\right)^6 = \\frac{720}{46656} \\approx 0.0154$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>行政・調査<\/strong>：選挙の出口調査や意識調査で、複数の選択肢の回答数を多項分布でモデル化し、各選択肢の割合と、その差の標準誤差（負の共分散を考慮）を計算します。<\/li>\n<li><strong>マーケティング<\/strong>：顧客が複数のブランドからどれを選ぶかを多項分布で表し、市場シェアの推定や、多項ロジットモデルによる選択要因の分析に使います。<\/li>\n<li><strong>製造・品質管理<\/strong>：製品を「良品」「軽微な不良」「重大な不良」に分類した件数の分布をモデル化し、各区分の割合が基準どおりかを適合度検定で調べます。<\/li>\n<li><strong>生命科学<\/strong>：遺伝の分離比（例：<span class=\"math-inline\">$9:3:3:1$<\/span>）が理論どおりかを、表現型ごとの個体数を多項分布とみなしたカイ二乗適合度検定で確かめます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>多項分布そのものは多次元なので、ここでは1つのカテゴリの回数 <span class=\"math-inline\">$X_1$<\/span> の周辺分布（二項分布）を描いています。\n<span class=\"math-inline\">$p_1$<\/span> を動かすと、注目するカテゴリの回数の分布が移動します。\n他のカテゴリがいくつあっても、注目する1つ以外を「それ以外」とまとめれば二項分布になることを確かめてください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>確率関数を多項係数で書き、具体的な確率を計算させる問題が基本です。<\/li>\n<li>周辺分布が二項分布、条件付き分布も二項分布になることを使う問題が重要です。<\/li>\n<li>共分散 <span class=\"math-inline\">$-np_ip_j$<\/span> の導出（まとめると二項分布になることを使う方法）と、負になる理由を説明できるようにします。<\/li>\n<li>2つの比率の差 <span class=\"math-inline\">$\\hat p_i - \\hat p_j$<\/span> の分散は <span class=\"math-inline\">$\\{p_i(1-p_i) + p_j(1-p_j) + 2p_ip_j\\}/n$<\/span> です。同じ標本から得た比率の差では、共分散の項を忘れないようにします。<\/li>\n<li>最尤推定量は <span class=\"math-inline\">$\\hat p_i = X_i/n$<\/span> です。カイ二乗適合度検定（第12章）や分割表の検定の土台になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 各 <span class=\"math-inline\">$X_i$<\/span> は独立 → ○ 合計が <span class=\"math-inline\">$n$<\/span> に固定されているので独立ではなく、共分散は負です。<\/li>\n<li>× 同じ標本の2つの比率の差の分散を <span class=\"math-inline\">$\\frac{p_i(1-p_i)}{n} + \\frac{p_j(1-p_j)}{n}$<\/span> とする → ○ 共分散の分 <span class=\"math-inline\">$+\\frac{2p_ip_j}{n}$<\/span> が加わります（<span class=\"math-inline\">$-2\\mathrm{Cov}$<\/span> が正になるため）。<\/li>\n<li>× 自由度を <span class=\"math-inline\">$k$<\/span> とする → ○ 制約 <span class=\"math-inline\">$\\sum X_i = n$<\/span> があるので、自由に動けるのは <span class=\"math-inline\">$k-1$<\/span> 個です。適合度検定の自由度も <span class=\"math-inline\">$k-1$<\/span>（推定したパラメータがあればさらに減る）です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 結果が 通り（ も可）ある試行を 回独立に繰り返したとき、各結果が何回出たかの組の分布です。 二項分布（成功・失敗の2通り）を、3通り以上のカテゴリに広げたものです。 定義・数式 1回の試行でカテゴリ のどれか1つが、確率 （ 、 ）で起こるとします。これを独立に 回繰り返し、カテゴリ が起きた回数を とします。 が非負整数で のとき、 これを と書きます。 の場合はカテゴリ分布と呼ばれます。 項目 内容 台 非負整数の組 で パラメータ 試行回数 、各カテゴリの確率 （和が 1） 期待値 分散 共分散 相関係数 モーメント母関数 確率母関数 再生性 確率 が共通なら （独立のとき） 他の分布との関係： 関係 内容 二項分布 なら二項分布。各成分 の周辺分布は 条件付き分布 を与えたとき、 ポアソン分布 独立な を、合計 で条件付けると 多変量正規分布 が大きいとき、平均 、共分散 の多変量正規分布で近似 カイ二乗分布 ピアソンのカイ二乗統計量 が、近似的に自由度 のカイ二乗分布に従う 超幾何分布 非復元抽出の場合は多変量超幾何分布になる 数式の読み解き - ：特定の並び（例：1回目がカテゴリ2、2回目がカテゴリ1、…）の確率。 - ：カテゴリ がちょうど 回ずつ現れる並べ方の数（多項係数）。 なら です。 - という制約があるので、実質的な自由度は です。 が決まれば も決まります。 周辺分布が二項分布になる理由：カテゴリ に注目し、それ以外をまとめて「失敗」とみなせば、成功確率 のベルヌーイ試行を 回行っているのと同じです。よって で、 、 です。 共分散が負になる理由と導出：カテゴリ と をまとめると です。 に代入すると 左辺から右辺の分散2つを引くと になるので、 です。合計が に固定されているので、どれかが増えれば他は減る、という負の関係です。 モーメント母関数：1回の試行の母関数は で、独立に 回繰り返すので 乗になります。 を で評価すると となり、 と確かめられます。 具体例 例1：アンケートの回答 ある質問に「賛成」「反対」「どちらでもない」と答える割合が の集団から10人を選びます。賛成5人・反対3人・どちらでもない2人となる確率は 賛成の人数だけを見ると で、 です。 例2：共分散と相関 例1の設定で、賛成数 と反対数 について 分散共分散行列は で、各行の和が 0 になります（合計が一定なので ）。 「どちらでもない」が2人だとわかったとき、賛成数は に従い、条件付き期待値は です。 例3：サイコロで全部の目が1回ずつ サイコロを6回振って、1〜6の目がちょうど1回ずつ出る確率は 現場での使われ方 - 行政・調査：選挙の出口調査や意識調査で、複数の選択肢の回答数を多項分布でモデル化し、各選択肢の割合と、その差の標準誤差（負の共分散を考慮）を計算します。 - マーケティング：顧客が複数のブランドからどれを選ぶかを多項分布で表し、市場シェアの推定や、多項ロジットモデルによる選択要因の分析に使います。 - 製造・品質管理：製品を「良品」「軽微な不良」「重大な不良」に分類した件数の分布をモデル化し、各区分の割合が基準どおりかを適合度検定で調べます。 - 生命科学：遺伝の分離比（例： ）が理論どおりかを、表現型ごとの個体数を多項分布とみなしたカイ二乗適合度検定で確かめます。 グラフ・イメージ 多項分布そのものは多次元なので、ここでは1つのカテゴリの回数 の周辺分布（二項分布）を描いています。 を動かすと、注目するカテゴリの回数の分布が移動します。 他のカテゴリがいくつあっても、注目する1つ以外を「それ以外」とまとめれば二項分布になることを確かめてください。 試験のポイント - 確率関数を多項係数で書き、具体的な確率を計算させる問題が基本です。 - 周辺分布が二項分布、条件付き分布も二項分布になることを使う問題が重要です。 - 共分散 の導出（まとめると二項分布になることを使う方法）と、負になる理由を説明できるようにします。 - 2つの比率の差 の分散は です。同じ標本から得た比率の差では、共分散の項を忘れないようにします。 - 最尤推定量は です。カイ二乗適合度検定（第12章）や分割表の検定の土台になります。 よくある間違い - × 各 は独立 → ○ 合計が に固定されているので独立ではなく、共分散は負です。 - × 同じ標本の2つの比率の差の分散を とする → ○ 共分散の分 が加わります（ が正になるため）。 - × 自由度を とする → ○ 制約 があるので、自由に動けるのは 個です。適合度検定の自由度も （推定したパラメータがあればさらに減る）です。"},"negative-binomial-distribution":{"id":"negative-binomial-distribution","title":"負の二項分布","reading":"ふのにこうぶんぷ","en":"Negative binomial distribution","aliases":["パスカル分布","Pascal distribution","NB"],"chapter":5,"importance":"A","tags":["離散型分布","再生性","過分散","混合分布"],"related":["geometric-distribution","binomial-distribution","poisson-distribution","gamma-distribution","overdispersion","gamma-poisson-model"],"charts":[{"type":"pmf","dist":"nbinom","params":{"r":3,"p":0.4},"sliders":[{"param":"r","label":"必要な成功回数 r","min":1,"max":30,"step":1},{"param":"p","label":"成功確率 p","min":0.05,"max":0.95,"step":0.01}],"x":{"min":0,"max":40},"overlay":"poisson-approx","caption":"r 回目の成功までの失敗回数 X の分布。点は同じ平均のポアソン分布。負の二項分布のほうが裾が広い（分散が大きい）。r を大きくし p を 1 に近づけると、ポアソン分布に近づく。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>ベルヌーイ試行を繰り返して、<strong><span class=\"math-inline\">$r$<\/span> 回目の成功が起きるまでの失敗の回数<\/strong>の分布です。幾何分布（<span class=\"math-inline\">$r=1$<\/span>）を一般化したものです。\nもう1つの顔として、「平均が人や場所によってばらつくポアソン分布」でもあり、分散が平均より大きい件数データのモデルとしてよく使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>成功確率 <span class=\"math-inline\">$p\\ (0 &lt; p \\le 1)$<\/span> のベルヌーイ試行を独立に繰り返します。<span class=\"math-inline\">$q = 1-p$<\/span>、<span class=\"math-inline\">$r$<\/span> は正の整数とします。<\/p>\n<p><strong>このページで採用する定義（失敗回数）<\/strong>：<span class=\"math-inline\">$r$<\/span> 回目の成功が起きるまでの<strong>失敗の回数<\/strong> <span class=\"math-inline\">$X$<\/span> の分布を負の二項分布 <span class=\"math-inline\">$\\mathrm{NB}(r, p)$<\/span> とします。<\/p>\n<div class=\"math-display\">$$P(X = x) = \\binom{r + x - 1}{x} p^{r} q^{x}, \\qquad x = 0, 1, 2, \\dots$$<\/div>\n<p><strong>もう一方の流儀（試行回数）<\/strong>：<span class=\"math-inline\">$r$<\/span> 回目の成功が起きた<strong>試行の回数<\/strong> <span class=\"math-inline\">$Y = X + r$<\/span> を負の二項分布（パスカル分布）と呼ぶこともあります。<span class=\"math-inline\">$P(Y=y) = \\binom{y-1}{r-1}p^{r}q^{y-r}$<\/span>（<span class=\"math-inline\">$y = r, r+1, \\dots$<\/span>）、期待値 <span class=\"math-inline\">$r/p$<\/span> です。分散は <span class=\"math-inline\">$X$<\/span> と同じです。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容（失敗回数 <span class=\"math-inline\">$X$<\/span>）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$\\{0, 1, 2, \\dots\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>成功回数 <span class=\"math-inline\">$r$<\/span>（正の整数。混合分布として使うときは正の実数）、成功確率 <span class=\"math-inline\">$p\\ (0&lt;p\\le 1)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$\\binom{r+x-1}{x}p^{r}q^{x}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$rq/p$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$rq/p^2$<\/span>（期待値より大きい）<\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$\\left(\\dfrac{p}{1 - qe^{t}}\\right)^{r}$<\/span>（<span class=\"math-inline\">$t &lt; -\\log q$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$\\left(\\dfrac{p}{1 - qs}\\right)^{r}$<\/span>（<span class=\"math-inline\">$\\lvert s \\rvert &lt; 1/q$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td><span class=\"math-inline\">$p$<\/span> が共通なら <span class=\"math-inline\">$\\mathrm{NB}(r_1,p) + \\mathrm{NB}(r_2,p) = \\mathrm{NB}(r_1+r_2,p)$<\/span>（独立のとき）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>幾何分布<\/td>\n<td><span class=\"math-inline\">$\\mathrm{NB}(1,p)$<\/span> が幾何分布。独立な <span class=\"math-inline\">$\\mathrm{Geo}(p)$<\/span> の <span class=\"math-inline\">$r$<\/span> 個の和が <span class=\"math-inline\">$\\mathrm{NB}(r,p)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>ポアソン分布<\/td>\n<td>平均 <span class=\"math-inline\">$rq/p = \\mu$<\/span> を一定にして <span class=\"math-inline\">$r \\to \\infty$<\/span> とすると <span class=\"math-inline\">$\\mathrm{Po}(\\mu)$<\/span> に収束<\/td>\n<\/tr>\n<tr>\n<td>ガンマ・ポアソン混合<\/td>\n<td><span class=\"math-inline\">$X \\mid \\lambda \\sim \\mathrm{Po}(\\lambda)$<\/span>、<span class=\"math-inline\">$\\lambda \\sim$<\/span> ガンマ分布（形状 <span class=\"math-inline\">$r$<\/span>、尺度 <span class=\"math-inline\">$\\theta$<\/span>）なら、<span class=\"math-inline\">$X \\sim \\mathrm{NB}(r,\\ 1/(1+\\theta))$<\/span><\/td>\n<\/tr>\n<tr>\n<td>二項分布<\/td>\n<td>「<span class=\"math-inline\">$n$<\/span> 回中の成功数」が二項分布、「<span class=\"math-inline\">$r$<\/span> 回成功するまでの失敗数」が負の二項分布で、数える対象が逆<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p^{r}q^{x}$<\/span>：成功 <span class=\"math-inline\">$r$<\/span> 回と失敗 <span class=\"math-inline\">$x$<\/span> 回からなる、特定の並びの確率。<\/li>\n<li><span class=\"math-inline\">$\\binom{r+x-1}{x}$<\/span>：最後（<span class=\"math-inline\">$r+x$<\/span> 回目）は必ず成功なので、それより前の <span class=\"math-inline\">$r+x-1$<\/span> 回のうちどこに失敗 <span class=\"math-inline\">$x$<\/span> 回を置くかの数。二項分布の係数 <span class=\"math-inline\">$\\binom{n}{x}$<\/span> との違いはここです。<\/li>\n<li>名前の由来：<span class=\"math-inline\">$\\binom{r+x-1}{x} = (-1)^{x}\\binom{-r}{x}$<\/span> と書けるので、確率の和が負の指数の二項展開 <span class=\"math-inline\">$p^{r}(1-q)^{-r} = 1$<\/span> になります。<\/li>\n<\/ul>\n<p><strong>期待値・分散（幾何分布の和として）<\/strong><\/p>\n<p><span class=\"math-inline\">$X = X_1 + \\cdots + X_r$<\/span>（<span class=\"math-inline\">$X_i \\sim \\mathrm{Geo}(p)$<\/span> は独立、それぞれ「次の成功までの失敗回数」）なので、<\/p>\n<div class=\"math-display\">$$E[X] = r\\cdot\\frac{q}{p}, \\qquad V[X] = r\\cdot\\frac{q}{p^2}$$<\/div>\n<p>確率母関数も、幾何分布の <span class=\"math-inline\">$p/(1-qs)$<\/span> の <span class=\"math-inline\">$r$<\/span> 乗になります。<\/p>\n<p><strong>確率母関数で確かめる<\/strong><\/p>\n<p><span class=\"math-inline\">$G(s) = p^{r}(1-qs)^{-r}$<\/span> を微分すると<\/p>\n<div class=\"math-display\">$$G'(s) = rq\\,p^{r}(1-qs)^{-r-1}, \\qquad G''(s) = r(r+1)q^2 p^{r}(1-qs)^{-r-2}$$<\/div>\n<p><span class=\"math-inline\">$s=1$<\/span> で <span class=\"math-inline\">$1-q=p$<\/span> なので、<span class=\"math-inline\">$G'(1) = rq/p$<\/span>、<span class=\"math-inline\">$G''(1) = r(r+1)q^2/p^2$<\/span> です。<\/p>\n<div class=\"math-display\">$$V[X] = \\frac{r(r+1)q^2}{p^2} + \\frac{rq}{p} - \\frac{r^2q^2}{p^2} = \\frac{rq^2 + rpq}{p^2} = \\frac{rq}{p^2}$$<\/div>\n<p><strong>平均と分散の関係（過分散）<\/strong><\/p>\n<p>平均を <span class=\"math-inline\">$\\mu = rq/p$<\/span> とおくと、<span class=\"math-inline\">$1/p = 1 + \\mu/r$<\/span> なので<\/p>\n<div class=\"math-display\">$$V[X] = \\frac{\\mu}{p} = \\mu + \\frac{\\mu^2}{r}$$<\/div>\n<p>です。ポアソン分布（分散 <span class=\"math-inline\">$=\\mu$<\/span>）より <span class=\"math-inline\">$\\mu^2/r$<\/span> だけ分散が大きく、<span class=\"math-inline\">$r$<\/span> が小さいほどばらつきが大きくなります。<span class=\"math-inline\">$r \\to \\infty$<\/span> でポアソン分布に近づきます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：3回成功するまで<\/strong><\/p>\n<p>成功率 40% のシュートを、3本成功するまで打ち続けます。失敗数 <span class=\"math-inline\">$X \\sim \\mathrm{NB}(3, 0.4)$<\/span> です。ちょうど2回失敗する（5本目で3本目の成功）確率は<\/p>\n<div class=\"math-display\">$$P(X=2) = \\binom{4}{2}(0.4)^3(0.6)^2 = 6 \\times 0.064 \\times 0.36 = 0.1382$$<\/div>\n<p>期待値と分散は<\/p>\n<div class=\"math-display\">$$E[X] = \\frac{3 \\times 0.6}{0.4} = 4.5, \\qquad V[X] = \\frac{3 \\times 0.6}{0.16} = 11.25$$<\/div>\n<p>失敗が2回以下で済む確率は <span class=\"math-inline\">$P(X \\le 2) \\approx 0.3174$<\/span> です。<\/p>\n<p><strong>例2：過分散な件数データ<\/strong><\/p>\n<p>ある店舗で1日の来店客の苦情件数を調べると、平均 4 件、分散 12 件²でした。分散が平均の3倍なのでポアソン分布は合いません。負の二項分布を当てはめると、<\/p>\n<div class=\"math-display\">$$r = \\frac{\\mu^2}{V - \\mu} = \\frac{16}{12 - 4} = 2, \\qquad p = \\frac{r}{r + \\mu} = \\frac{2}{6} = \\frac{1}{3}$$<\/div>\n<p>です。苦情0件の日の確率は<\/p>\n<div class=\"math-display\">$$\\text{負の二項：} P(X=0) = p^{r} = \\left(\\frac{1}{3}\\right)^2 \\approx 0.1111, \\qquad \\text{ポアソン：} e^{-4} \\approx 0.0183$$<\/div>\n<p>10件以上の日も、負の二項分布では <span class=\"math-inline\">$0.0751$<\/span>、ポアソン分布では <span class=\"math-inline\">$0.0081$<\/span> です。負の二項分布のほうが「0件の日」も「極端に多い日」も起こりやすく、ばらつきの大きいデータに合います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：患者ごとの発作回数や入院回数は、人によって発生率が異なるため過分散になりがちです。負の二項回帰で治療効果を推定します。<\/li>\n<li><strong>生物・生態学<\/strong>：区画ごとの生物の個体数は、群れを作るためポアソン分布より散らばります。負の二項分布の <span class=\"math-inline\">$r$<\/span>（集中度）で集まり具合を表します。<\/li>\n<li><strong>金融・保険<\/strong>：契約者ごとの事故発生率がガンマ分布に従ってばらつくと考えると、事故件数は負の二項分布になります。自動車保険の等級制度の理論的な土台です。<\/li>\n<li><strong>マーケティング<\/strong>：顧客ごとの購買回数の分布に負の二項分布を当てはめ、今後の購買回数や優良顧客の割合を予測します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>棒が負の二項分布、点が同じ平均のポアソン分布です。\n<span class=\"math-inline\">$r$<\/span> が小さいと棒は 0 付近と右の裾に広がり、ポアソン分布より明らかに散らばっています。\n<span class=\"math-inline\">$r$<\/span> を大きくしつつ <span class=\"math-inline\">$p$<\/span> を 1 に近づけて平均をそろえると、両者が重なっていく様子が見えます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>確率関数の係数が <span class=\"math-inline\">$\\binom{r+x-1}{x}$<\/span>（最後は必ず成功）になる理由を説明できるようにします。<\/li>\n<li>期待値・分散は幾何分布の和として導くのが最短です。確率母関数でも導けるようにしておきます。<\/li>\n<li>再生性は <span class=\"math-inline\">$p$<\/span> が共通のときに成り立ちます。<\/li>\n<li>ガンマ分布とポアソン分布の混合として負の二項分布が現れることは、ベイズ法（ガンマ・ポアソンモデルの予測分布）や一般化線形モデル（過分散）につながります。<\/li>\n<li>失敗回数で数えるか試行回数で数えるかで、期待値が <span class=\"math-inline\">$rq/p$<\/span> と <span class=\"math-inline\">$r/p$<\/span> で異なります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 係数を <span class=\"math-inline\">$\\binom{r+x}{x}$<\/span> とする → ○ 最後の試行は成功に固定されるので <span class=\"math-inline\">$\\binom{r+x-1}{x}$<\/span> です。<\/li>\n<li>× 期待値を常に <span class=\"math-inline\">$r/p$<\/span> とする → ○ それは試行回数で数えた場合です。失敗回数なら <span class=\"math-inline\">$rq/p$<\/span> です。<\/li>\n<li>× 分散が平均より小さいデータに負の二項分布を当てはめる → ○ 負の二項分布の分散は常に平均より大きいので、過小分散のデータには合いません。<\/li>\n<li>× scipy などのソフトと教科書でパラメータが同じだと思い込む → ○ 「成功確率 <span class=\"math-inline\">$p$<\/span>」か「失敗確率」か、「失敗回数」か「試行回数」かは文献ごとに違います。定義を確認します。<\/li>\n<\/ul><\/section>","text":"一言でいうと ベルヌーイ試行を繰り返して、 回目の成功が起きるまでの失敗の回数の分布です。幾何分布（ ）を一般化したものです。 もう1つの顔として、「平均が人や場所によってばらつくポアソン分布」でもあり、分散が平均より大きい件数データのモデルとしてよく使われます。 定義・数式 成功確率 のベルヌーイ試行を独立に繰り返します。 、 は正の整数とします。 このページで採用する定義（失敗回数）： 回目の成功が起きるまでの失敗の回数 の分布を負の二項分布 とします。 もう一方の流儀（試行回数）：
