,"importance":"A","tags":["離散型分布","再生性","少数の法則","稀な事象"],"related":["binomial-distribution","law-of-small-numbers","poisson-process","exponential-distribution","gamma-distribution","negative-binomial-distribution"],"charts":[{"type":"pmf","dist":"poisson","params":{"lambda":2},"sliders":[{"param":"lambda","label":"平均 λ","min":0.1,"max":30,"step":0.1}],"x":{"min":0,"max":45},"overlay":"norm-approx","caption":"λ が小さいと右に裾を引く形、λ を大きくすると平均 λ・分散 λ の正規分布（破線）に近づく。"},{"type":"pdf-cdf","dist":"poisson","params":{"lambda":2},"x":{"min":0,"max":10},"caption":"上が確率関数、下が累積分布関数。累積分布関数は整数ごとに階段状に上がり、段差の高さが確率 P(X=k) になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>一定の時間や範囲の中で、まれな出来事が何回起こるかを表す分布です。\n1時間あたりの電話の件数、1ページあたりの誤字の数など、「平均的には <span class=\"math-inline\">$\\lambda$<\/span> 回」とわかっている数え上げに使います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$\\lambda &gt; 0$<\/span> とします。確率関数が<\/p>\n<div class=\"math-display\">$$P(X = x) = \\frac{\\lambda^{x} e^{-\\lambda}}{x!}, \\qquad x = 0, 1, 2, \\dots$$<\/div>\n<p>のとき、<span class=\"math-inline\">$X$<\/span> はポアソン分布に従うといい、<span class=\"math-inline\">$X \\sim \\mathrm{Po}(\\lambda)$<\/span> と書きます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$\\{0, 1, 2, \\dots\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>平均 <span class=\"math-inline\">$\\lambda &gt; 0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>確率関数<\/td>\n<td><span class=\"math-inline\">$\\lambda^{x}e^{-\\lambda}/x!$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span>（期待値と等しい）<\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t) = \\exp\\{\\lambda(e^{t}-1)\\}$<\/span>（すべての <span class=\"math-inline\">$t$<\/span> で存在）<\/td>\n<\/tr>\n<tr>\n<td>確率母関数<\/td>\n<td><span class=\"math-inline\">$G(s) = \\exp\\{\\lambda(s-1)\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t) = \\exp\\{\\lambda(e^{it}-1)\\}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>再生性<\/td>\n<td>独立なら <span class=\"math-inline\">$\\mathrm{Po}(\\lambda_1) + \\mathrm{Po}(\\lambda_2) = \\mathrm{Po}(\\lambda_1+\\lambda_2)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>歪度<\/td>\n<td><span class=\"math-inline\">$1/\\sqrt{\\lambda}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>他の分布との関係：<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>関係<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>二項分布<\/td>\n<td><span class=\"math-inline\">$np=\\lambda$<\/span> を一定にして <span class=\"math-inline\">$n\\to\\infty$<\/span> とした <span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span> の極限（少数の法則）<\/td>\n<\/tr>\n<tr>\n<td>二項分布（条件付け）<\/td>\n<td>独立な <span class=\"math-inline\">$X\\sim\\mathrm{Po}(\\lambda_1), Y\\sim\\mathrm{Po}(\\lambda_2)$<\/span> で <span class=\"math-inline\">$X+Y=n$<\/span> を与えると <span class=\"math-inline\">$X\\sim\\mathrm{Bin}(n, \\frac{\\lambda_1}{\\lambda_1+\\lambda_2})$<\/span><\/td>\n<\/tr>\n<tr>\n<td>正規分布<\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span> が大きいとき <span class=\"math-inline\">$N(\\lambda, \\lambda)$<\/span> で近似<\/td>\n<\/tr>\n<tr>\n<td>指数分布・ガンマ分布<\/td>\n<td>ポアソン過程で、単位時間の到着数がポアソン分布、到着間隔が指数分布、<span class=\"math-inline\">$k$<\/span> 回目の到着時刻がガンマ分布<\/td>\n<\/tr>\n<tr>\n<td>カイ二乗分布<\/td>\n<td><span class=\"math-inline\">$P(X \\le k-1) = P(\\chi^2_{2k} &gt; 2\\lambda)$<\/span>（区間推定で使う）<\/td>\n<\/tr>\n<tr>\n<td>負の二項分布<\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span> がガンマ分布に従って変動する混合分布が負の二項分布<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\lambda$<\/span>：平均の発生回数。分布の形はこの1つのパラメータだけで決まります。<\/li>\n<li><span class=\"math-inline\">$\\lambda^{x}/x!$<\/span>：<span class=\"math-inline\">$e^{\\lambda}$<\/span> のテイラー展開 <span class=\"math-inline\">$\\sum_x \\lambda^x/x!$<\/span> の各項。<span class=\"math-inline\">$e^{-\\lambda}$<\/span> は和を 1 にする正規化の定数です。<\/li>\n<\/ul>\n<p><strong>二項分布からの導出（少数の法則）<\/strong><\/p>\n<p><span class=\"math-inline\">$p = \\lambda/n$<\/span> とおいて <span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span> の確率を変形します。<\/p>\n<div class=\"math-display\">$$\\binom{n}{x}\\left(\\frac{\\lambda}{n}\\right)^{x}\\left(1-\\frac{\\lambda}{n}\\right)^{n-x}\n= \\frac{\\lambda^{x}}{x!}\\cdot\\frac{n(n-1)\\cdots(n-x+1)}{n^{x}}\\cdot\\left(1-\\frac{\\lambda}{n}\\right)^{n}\\left(1-\\frac{\\lambda}{n}\\right)^{-x}$$<\/div>\n<p><span class=\"math-inline\">$n\\to\\infty$<\/span> で、2番目の因子は 1、3番目は <span class=\"math-inline\">$e^{-\\lambda}$<\/span>、4番目は 1 に収束するので、<span class=\"math-inline\">$\\lambda^{x}e^{-\\lambda}/x!$<\/span> が得られます。「試行回数は多いが、1回あたりの確率は小さい」事象の回数がポアソン分布になる理由です。<\/p>\n<p><strong>モーメント母関数から期待値・分散<\/strong><\/p>\n<div class=\"math-display\">$$M(t) = \\sum_{x=0}^{\\infty} e^{tx}\\frac{\\lambda^{x}e^{-\\lambda}}{x!} = e^{-\\lambda}\\sum_{x=0}^{\\infty}\\frac{(\\lambda e^{t})^{x}}{x!} = e^{-\\lambda}e^{\\lambda e^{t}} = \\exp\\{\\lambda(e^{t}-1)\\}$$<\/div>\n<p>微分すると<\/p>\n<div class=\"math-display\">$$M'(t) = \\lambda e^{t} M(t), \\qquad M''(t) = \\lambda e^{t}M(t) + (\\lambda e^{t})^{2}M(t)$$<\/div>\n<p><span class=\"math-inline\">$M(0)=1$<\/span> なので <span class=\"math-inline\">$E[X] = \\lambda$<\/span>、<span class=\"math-inline\">$E[X^2] = \\lambda + \\lambda^2$<\/span>、<span class=\"math-inline\">$V[X] = \\lambda + \\lambda^2 - \\lambda^2 = \\lambda$<\/span> です。<\/p>\n<p>キュムラント母関数 <span class=\"math-inline\">$K(t) = \\log M(t) = \\lambda(e^{t}-1)$<\/span> を使うと、<span class=\"math-inline\">$K'(0) = K''(0) = \\lambda$<\/span> がすぐに出ます。すべてのキュムラントが <span class=\"math-inline\">$\\lambda$<\/span> に等しいのがポアソン分布の特徴です。<\/p>\n<p><strong>確率母関数から<\/strong><\/p>\n<p><span class=\"math-inline\">$G(s) = \\exp\\{\\lambda(s-1)\\}$<\/span> で、<span class=\"math-inline\">$G'(1) = \\lambda$<\/span>、<span class=\"math-inline\">$G''(1) = \\lambda^2$<\/span>（階乗モーメント <span class=\"math-inline\">$E[X(X-1)]$<\/span>）です。<\/p>\n<div class=\"math-display\">$$V[X] = G''(1) + G'(1) - \\{G'(1)\\}^2 = \\lambda^2 + \\lambda - \\lambda^2 = \\lambda$$<\/div>\n<p><strong>再生性<\/strong><\/p>\n<p>独立なら <span class=\"math-inline\">$M_{X+Y}(t) = e^{\\lambda_1(e^t-1)}e^{\\lambda_2(e^t-1)} = e^{(\\lambda_1+\\lambda_2)(e^t-1)}$<\/span> で、<span class=\"math-inline\">$\\mathrm{Po}(\\lambda_1+\\lambda_2)$<\/span> です。二項分布と違い、パラメータが違っても再生性が成り立ちます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：コールセンターの着信<\/strong><\/p>\n<p>1時間あたり平均2件の問い合わせが来る窓口で、着信数を <span class=\"math-inline\">$X \\sim \\mathrm{Po}(2)$<\/span> とします。<\/p>\n<div class=\"math-display\">$$P(X=0) = e^{-2} \\approx 0.1353, \\qquad P(X=2) = \\frac{2^2 e^{-2}}{2!} \\approx 0.2707$$<\/div>\n<p>3件以上来る確率は<\/p>\n<div class=\"math-display\">$$P(X \\ge 3) = 1 - e^{-2}\\left(1 + 2 + \\frac{4}{2}\\right) = 1 - 5e^{-2} \\approx 0.3233$$<\/div>\n<p><strong>例2：再生性を使う<\/strong><\/p>\n<p>窓口Aの着信が1時間平均 1.5 件、窓口Bが平均 2.5 件で、両者が独立とします。合計 <span class=\"math-inline\">$X+Y \\sim \\mathrm{Po}(4)$<\/span> なので、合計がちょうど4件の確率は<\/p>\n<div class=\"math-display\">$$P(X+Y=4) = \\frac{4^4 e^{-4}}{4!} = \\frac{256}{24}e^{-4} \\approx 0.1954$$<\/div>\n<p><strong>例3：二項分布との比較<\/strong><\/p>\n<p>不良率 0.2% の部品 1000 個中の不良数は、正確には <span class=\"math-inline\">$\\mathrm{Bin}(1000, 0.002)$<\/span> です。<span class=\"math-inline\">$P(X=0)$<\/span> は正確な値 <span class=\"math-inline\">$0.1351$<\/span>、ポアソン近似 <span class=\"math-inline\">$e^{-2} \\approx 0.1353$<\/span> でほぼ一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>IT・Webサービス<\/strong>：1分あたりのアクセス数やエラー発生数をポアソン分布でモデル化し、サーバーの容量計画や異常検知（普段の <span class=\"math-inline\">$\\lambda$<\/span> に比べてありえないほど多いか）に使います。<\/li>\n<li><strong>金融・保険<\/strong>：一定期間の事故件数や保険金請求件数をポアソン分布で表し、保険料の算定やリスク量の計算に使います。<\/li>\n<li><strong>製造・品質管理<\/strong>：製品1枚あたりの傷の数など「欠点数」の管理図（c 管理図）は、ポアソン分布の平均と分散が等しい性質を使って管理限界を決めます。<\/li>\n<li><strong>医療<\/strong>：まれな病気の地域別発生件数をポアソン分布で表し、特定の地域で偶然以上に多いか（疾病集積）を調べます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目のグラフでは <span class=\"math-inline\">$\\lambda$<\/span> を動かして形の変化を見ます。<span class=\"math-inline\">$\\lambda$<\/span> が 1 前後では 0 や 1 に山があり右に裾を引きますが、<span class=\"math-inline\">$\\lambda$<\/span> を 20 以上にすると正規分布（破線）とほぼ重なります。歪度 <span class=\"math-inline\">$1/\\sqrt\\lambda$<\/span> が小さくなるためです。<\/p>\n<p>2つ目のグラフは確率関数と累積分布関数を上下に並べたものです。累積分布関数は整数のところで段差の高さだけ跳ね上がります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>期待値＝分散＝<span class=\"math-inline\">$\\lambda$<\/span> は最重要の性質です。モーメント母関数・確率母関数のどちらからでも導けるようにしておきます。<\/li>\n<li>二項分布からの極限（少数の法則）の導出の流れを説明できるようにします。<\/li>\n<li>再生性を使って「合計の件数」の確率を求める問題、条件付けで二項分布になる問題が重要です。<\/li>\n<li>最尤推定量は <span class=\"math-inline\">$\\hat\\lambda = \\bar X$<\/span> で、<span class=\"math-inline\">$\\lambda$<\/span> の十分統計量は <span class=\"math-inline\">$\\sum X_i$<\/span> です。<\/li>\n<li>ポアソン過程（第15章）では、時間 <span class=\"math-inline\">$t$<\/span> の到着数が <span class=\"math-inline\">$\\mathrm{Po}(\\lambda t)$<\/span> になり、到着間隔が指数分布になります。<\/li>\n<li>平方根変換 <span class=\"math-inline\">$\\sqrt{X}$<\/span> で分散がほぼ一定（約 <span class=\"math-inline\">$1/4$<\/span>）になる分散安定化変換も押さえます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 確率関数の分母の <span class=\"math-inline\">$x!$<\/span> を忘れる、<span class=\"math-inline\">$e^{-\\lambda}$<\/span> を <span class=\"math-inline\">$e^{\\lambda}$<\/span> と書く → ○ <span class=\"math-inline\">$P(X=x) = \\lambda^{x}e^{-\\lambda}/x!$<\/span> です。<span class=\"math-inline\">$x=0$<\/span> のとき <span class=\"math-inline\">$0! = 1$<\/span> です。<\/li>\n<li>× 「1時間に平均2件」を30分の問題にもそのまま <span class=\"math-inline\">$\\lambda = 2$<\/span> で使う → ○ 時間の長さに比例させて、30分なら <span class=\"math-inline\">$\\lambda = 1$<\/span> です。<\/li>\n<li>× 実データの分散が平均より大きくてもポアソン分布を当てはめる → ○ 分散が平均より明らかに大きい（過分散）なら、負の二項分布などを検討します。<\/li>\n<\/ul><\/section>","text":"一言でいうと 一定の時間や範囲の中で、まれな出来事が何回起こるかを表す分布です。 1時間あたりの電話の件数、1ページあたりの誤字の数など、「平均的には 回」とわかっている数え上げに使います。 定義・数式 とします。確率関数が のとき、 はポアソン分布に従うといい、 と書きます。 項目 内容 台 パラメータ 平均 確率関数 期待値 分散 （期待値と等しい） モーメント母関数 （すべての で存在） 確率母関数 特性関数 再生性 独立なら 歪度 他の分布との関係： 関係 内容 二項分布 を一定にして とした の極限（少数の法則） 二項分布（条件付け） 独立な で を与えると 正規分布 が大きいとき で近似 指数分布・ガンマ分布 ポアソン過程で、単位時間の到着数がポアソン分布、到着間隔が指数分布、 回目の到着時刻がガンマ分布 カイ二乗分布 （区間推定で使う） 負の二項分布 がガンマ分布に従って変動する混合分布が負の二項分布 数式の読み解き - ：平均の発生回数。分布の形はこの1つのパラメータだけで決まります。 - ： のテイラー展開 の各項。 は和を 1 にする正規化の定数です。 二項分布からの導出（少数の法則） とおいて の確率を変形します。 で、2番目の因子は 1、3番目は 、4番目は 1 に収束するので、 が得られます。「試行回数は多いが、1回あたりの確率は小さい」事象の回数がポアソン分布になる理由です。 モーメント母関数から期待値・分散 微分すると なので 、 、 です。 キュムラント母関数 を使うと、 がすぐに出ます。すべてのキュムラントが に等しいのがポアソン分布の特徴です。 確率母関数から で、 、 （階乗モーメント ）です。 再生性 独立なら で、 です。二項分布と違い、パラメータが違っても再生性が成り立ちます。 具体例 例1：コールセンターの着信 1時間あたり平均2件の問い合わせが来る窓口で、着信数を とします。 3件以上来る確率は 例2：再生性を使う 窓口Aの着信が1時間平均 1.5 件、窓口Bが平均 2.5 件で、両者が独立とします。合計 なので、合計がちょうど4件の確率は 例3：二項分布との比較 不良率 0.2% の部品 1000 個中の不良数は、正確には です。 は正確な値 、ポアソン近似 でほぼ一致します。 現場での使われ方 - IT・Webサービス：1分あたりのアクセス数やエラー発生数をポアソン分布でモデル化し、サーバーの容量計画や異常検知（普段の に比べてありえないほど多いか）に使います。 - 金融・保険：一定期間の事故件数や保険金請求件数をポアソン分布で表し、保険料の算定やリスク量の計算に使います。 - 製造・品質管理：製品1枚あたりの傷の数など「欠点数」の管理図（c 管理図）は、ポアソン分布の平均と分散が等しい性質を使って管理限界を決めます。 - 医療：まれな病気の地域別発生件数をポアソン分布で表し、特定の地域で偶然以上に多いか（疾病集積）を調べます。 グラフ・イメージ 1つ目のグラフでは を動かして形の変化を見ます。 が 1 前後では 0 や 1 に山があり右に裾を引きますが、 を 20 以上にすると正規分布（破線）とほぼ重なります。歪度 が小さくなるためです。 2つ目のグラフは確率関数と累積分布関数を上下に並べたものです。累積分布関数は整数のところで段差の高さだけ跳ね上がります。 試験のポイント - 期待値＝分散＝ は最重要の性質です。モーメント母関数・確率母関数のどちらからでも導けるようにしておきます。 - 二項分布からの極限（少数の法則）の導出の流れを説明できるようにします。 - 再生性を使って「合計の件数」の確率を求める問題、条件付けで二項分布になる問題が重要です。 - 最尤推定量は で、 の十分統計量は です。 - ポアソン過程（第15章）では、時間 の到着数が になり、到着間隔が指数分布になります。 - 平方根変換 で分散がほぼ一定（約 ）になる分散安定化変換も押さえます。 よくある間違い - × 確率関数の分母の を忘れる、 を と書く → ○ です。 のとき です。 - × 「1時間に平均2件」を30分の問題にもそのまま で使う → ○ 時間の長さに比例させて、30分なら です。 - × 実データの分散が平均より大きくてもポアソン分布を当てはめる → ○ 分散が平均より明らかに大きい（過分散）なら、負の二項分布などを検討します。"},"beta-distribution":{"id":"beta-distribution","title":"ベータ分布","reading":"べーたぶんぷ","en":"Beta distribution","aliases":["β分布","Beta(a,b)"],"chapter":6,"importance":"A","tags":["連続型分布","割合のモデル","共役事前分布","順序統計量"],"related":["gamma-distribution","uniform-distribution","binomial-distribution","conjugate-prior","beta-binomial-model","f-distribution"],"charts":[{"type":"pdf","dist":"beta","params":{"a":2,"b":8},"sliders":[{"param":"a","label":"a（成功側）","min":0.5,"max":20,"step":0.5},{"param":"b","label":"b（失敗側）","min":0.5,"max":20,"step":0.5}],"x":{"min":0,"max":1},"compare":[{"dist":"beta","params":{"a":1,"b":1},"label":"一様分布 Beta(1,1)"}],"caption":"a を大きくすると山が右へ、b を大きくすると左へ寄る。a+b を大きくすると山が細くなる。a,b<1 では両端が持ち上がった U 字形になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>0から1の間の値をとる量、つまり「割合」や「確率そのもの」の不確かさを表す連続型分布です。\n2つのパラメータで左右の寄り方を自由に変えられ、ベイズ統計では成功確率 <span class=\"math-inline\">$p$<\/span> の事前分布・事後分布として欠かせません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$a&gt;0$<\/span>、<span class=\"math-inline\">$b&gt;0$<\/span> とします。密度関数が<\/p>\n<div class=\"math-display\">$$f(x)=\\frac{1}{B(a,b)}\\,x^{a-1}(1-x)^{b-1},\\qquad 0&lt;x&lt;1$$<\/div>\n<p>のとき <span class=\"math-inline\">$X\\sim\\mathrm{Beta}(a,b)$<\/span> と書きます。<span class=\"math-inline\">$B(a,b)$<\/span> はベータ関数で、ガンマ関数と次の関係があります。<\/p>\n<div class=\"math-display\">$$B(a,b)=\\int_0^1 u^{a-1}(1-u)^{b-1}du=\\frac{\\Gamma(a)\\Gamma(b)}{\\Gamma(a+b)}$$<\/div>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(0,1)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td><span class=\"math-inline\">$a&gt;0$<\/span>、<span class=\"math-inline\">$b&gt;0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$\\dfrac{a}{a+b}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$\\dfrac{ab}{(a+b)^2(a+b+1)}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>最頻値<\/td>\n<td><span class=\"math-inline\">$\\dfrac{a-1}{a+b-2}$<\/span>（<span class=\"math-inline\">$a,b&gt;1$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$k$<\/span> 次モーメント<\/td>\n<td><span class=\"math-inline\">$E[X^k]=\\dfrac{B(a+k,b)}{B(a,b)}=\\prod_{r=0}^{k-1}\\dfrac{a+r}{a+b+r}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td>すべての <span class=\"math-inline\">$t$<\/span> で存在（台が有界）するが、初等関数では書けない（<span class=\"math-inline\">$1+\\sum_{k\\ge1}E[X^k]\\,t^k/k!$<\/span> の級数、合流型超幾何関数）<\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td>同様に級数で表される<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$x^{a-1}(1-x)^{b-1}$<\/span>：二項分布の尤度 <span class=\"math-inline\">$p^{x}(1-p)^{n-x}$<\/span> と同じ形です。<span class=\"math-inline\">$a-1$<\/span> 回の成功と <span class=\"math-inline\">$b-1$<\/span> 回の失敗を見たときの尤度、と考えると直感がつかめます。<\/li>\n<li><span class=\"math-inline\">$a$<\/span> と <span class=\"math-inline\">$b$<\/span> の比が平均を、和 <span class=\"math-inline\">$a+b$<\/span> が「情報量（集中度）」を決めます。<span class=\"math-inline\">$a+b$<\/span> が大きいほど分散は小さくなります。<\/li>\n<li><span class=\"math-inline\">$a=b$<\/span> なら <span class=\"math-inline\">$1/2$<\/span> について対称、<span class=\"math-inline\">$a=b=1$<\/span> なら一様分布 <span class=\"math-inline\">$U(0,1)$<\/span> です。<\/li>\n<\/ul>\n<p>形はパラメータによって大きく変わります。<\/p>\n<ul>\n<li><span class=\"math-inline\">$a&gt;1,\\ b&gt;1$<\/span>：内側に山が1つある形。<span class=\"math-inline\">$a&lt;b$<\/span> なら山は左（0寄り）、<span class=\"math-inline\">$a&gt;b$<\/span> なら右（1寄り）。<\/li>\n<li><span class=\"math-inline\">$a&lt;1,\\ b&lt;1$<\/span>：両端で密度が無限大になる U 字形。「ほぼ0かほぼ1」に分かれる割合を表します。<\/li>\n<li><span class=\"math-inline\">$a\\le1&lt;b$<\/span> または <span class=\"math-inline\">$b\\le1&lt;a$<\/span>：一方の端に向かって単調に増える（減る）形。<\/li>\n<li><span class=\"math-inline\">$X\\sim\\mathrm{Beta}(a,b)$<\/span> なら <span class=\"math-inline\">$1-X\\sim\\mathrm{Beta}(b,a)$<\/span> です。成功と失敗の役割を入れ替えたものと読めます。<\/li>\n<\/ul>\n<p><strong>期待値・分散の導出<\/strong>。ベータ関数の比を使います。<\/p>\n<div class=\"math-display\">$$E[X]=\\frac{B(a+1,b)}{B(a,b)}=\\frac{\\Gamma(a+1)\\Gamma(a+b)}{\\Gamma(a)\\Gamma(a+b+1)}=\\frac{a}{a+b}$$<\/div>\n<p>同様に <span class=\"math-inline\">$E[X^2]=\\dfrac{a(a+1)}{(a+b)(a+b+1)}$<\/span> なので<\/p>\n<div class=\"math-display\">$$V[X]=\\frac{a(a+1)}{(a+b)(a+b+1)}-\\frac{a^2}{(a+b)^2}=\\frac{ab}{(a+b)^2(a+b+1)}$$<\/div>\n<p><strong>他の分布との関係<\/strong>。<\/p>\n<ul>\n<li><strong>ガンマ分布<\/strong>：<span class=\"math-inline\">$X\\sim\\mathrm{Ga}(a,\\beta)$<\/span>、<span class=\"math-inline\">$Y\\sim\\mathrm{Ga}(b,\\beta)$<\/span> が独立なら <span class=\"math-inline\">$X/(X+Y)\\sim\\mathrm{Beta}(a,b)$<\/span>。<\/li>\n<li><strong>一様分布の順序統計量<\/strong>：独立な <span class=\"math-inline\">$U(0,1)$<\/span> の <span class=\"math-inline\">$n$<\/span> 個のうち小さいほうから <span class=\"math-inline\">$k$<\/span> 番目は <span class=\"math-inline\">$\\mathrm{Beta}(k,n-k+1)$<\/span>。<\/li>\n<li><strong>二項分布<\/strong>：<span class=\"math-inline\">$\\mathrm{Bin}(n,p)$<\/span> の観測 <span class=\"math-inline\">$x$<\/span> に対し事前分布 <span class=\"math-inline\">$\\mathrm{Beta}(a,b)$<\/span> を使うと、事後分布は <span class=\"math-inline\">$\\mathrm{Beta}(a+x,\\ b+n-x)$<\/span>（共役事前分布）。<\/li>\n<li><strong>F分布<\/strong>：<span class=\"math-inline\">$X\\sim\\mathrm{Beta}(m/2,n/2)$<\/span> なら <span class=\"math-inline\">$\\dfrac{X/m}{(1-X)/n}\\sim F(m,n)$<\/span>。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：Web広告のクリック率<\/strong><\/p>\n<p>過去の経験から、新しい広告のクリック率 <span class=\"math-inline\">$p$<\/span> を <span class=\"math-inline\">$\\mathrm{Beta}(2,8)$<\/span> で表すとします。<\/p>\n<div class=\"math-display\">$$E[p]=\\frac{2}{10}=0.2,\\qquad V[p]=\\frac{2\\times8}{10^2\\times11}\\approx0.01455,\\qquad \\text{標準偏差}\\approx0.1206$$<\/div>\n<p>最頻値は <span class=\"math-inline\">$(2-1)/(10-2)=0.125$<\/span> です。20回表示して3回クリックされたら、事後分布は <span class=\"math-inline\">$\\mathrm{Beta}(2+3,\\ 8+17)=\\mathrm{Beta}(5,25)$<\/span> になり、<\/p>\n<div class=\"math-display\">$$E[p\\mid\\text{データ}]=\\frac{5}{30}\\approx0.1667,\\qquad \\text{標準偏差}\\approx0.0669$$<\/div>\n<p>と、平均がデータの比率 <span class=\"math-inline\">$3/20=0.15$<\/span> の方向に動き、ばらつきが小さくなります。<\/p>\n<p><strong>例2：5個の一様乱数の中央値（試験に近い形）<\/strong><\/p>\n<p>独立な <span class=\"math-inline\">$U(0,1)$<\/span> 5個の中央値（3番目）は <span class=\"math-inline\">$\\mathrm{Beta}(3,3)$<\/span> に従います。中央値が 0.3 未満になるのは「0.3 未満の値が3個以上ある」ときなので、二項分布 <span class=\"math-inline\">$\\mathrm{Bin}(5,0.3)$<\/span> で<\/p>\n<div class=\"math-display\">$$P(U_{(3)}&lt;0.3)=\\sum_{j=3}^{5}\\binom{5}{j}0.3^j0.7^{5-j}=0.1323+0.0284+0.0024\\approx0.1631$$<\/div>\n<p>です。ベータ分布の累積確率が二項分布の和で計算できる、という関係の例です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>マーケティング<\/strong>：ベイズ流A/Bテストで、案ごとの成約率の事後分布をベータ分布で表し、「案Bが案Aより良い確率」を計算します。<\/li>\n<li><strong>製造・品質管理<\/strong>：ロットごとに不良率がばらつく状況を、不良率がベータ分布に従うとしてモデル化します（ベータ二項分布）。<\/li>\n<li><strong>IT・Webサービス<\/strong>：推薦システムで、クリック率の事後分布からサンプルを引いて表示する記事を選ぶ方法（トンプソン抽出）に使います。<\/li>\n<li><strong>行政・調査<\/strong>：プロジェクト管理の工期見積もり（PERT）で、作業時間を有界な区間のベータ分布で近似します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$a=2,b=8$<\/span> から始め、<span class=\"math-inline\">$a$<\/span> と <span class=\"math-inline\">$b$<\/span> を同じ比のまま大きくすると、平均は変わらず山だけが細くなることを確認してください（データが増えて確信が強まる様子）。比較用の一様分布 <span class=\"math-inline\">$\\mathrm{Beta}(1,1)$<\/span> は「何も知らない」事前分布です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>期待値 <span class=\"math-inline\">$a/(a+b)$<\/span>、分散 <span class=\"math-inline\">$ab/\\{(a+b)^2(a+b+1)\\}$<\/span> はベータ関数とガンマ関数の関係から導けるようにします。<\/li>\n<li>二項分布の共役事前分布として、事後分布のパラメータ更新（<span class=\"math-inline\">$a+x$<\/span>、<span class=\"math-inline\">$b+n-x$<\/span>）は第31章で頻出です。<\/li>\n<li>ガンマ分布との関係、一様分布の順序統計量との関係、F分布との関係を押さえます。<\/li>\n<li><span class=\"math-inline\">$\\int_0^1 x^{a-1}(1-x)^{b-1}dx=B(a,b)$<\/span> を使って、積分を見た瞬間にベータ関数に直す計算力が問われます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 平均を <span class=\"math-inline\">$a/b$<\/span> とする → ○ <span class=\"math-inline\">$a/(a+b)$<\/span> です。<\/li>\n<li>× 事後分布を <span class=\"math-inline\">$\\mathrm{Beta}(a+x,\\ b+n)$<\/span> とする → ○ 失敗側には失敗回数 <span class=\"math-inline\">$n-x$<\/span> を足します。<\/li>\n<li>× 最頻値も平均と同じく <span class=\"math-inline\">$a/(a+b)$<\/span> → ○ 最頻値は <span class=\"math-inline\">$(a-1)/(a+b-2)$<\/span> で、<span class=\"math-inline\">$a,b&gt;1$<\/span> のときだけ内側にあります。例1では平均 0.2 に対し最頻値 0.125 です。<\/li>\n<li>× <span class=\"math-inline\">$B(a,b)=\\Gamma(a)\\Gamma(b)\\Gamma(a+b)$<\/span> → ○ <span class=\"math-inline\">$\\Gamma(a+b)$<\/span> は分母です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 0から1の間の値をとる量、つまり「割合」や「確率そのもの」の不確かさを表す連続型分布です。 2つのパラメータで左右の寄り方を自由に変えられ、ベイズ統計では成功確率 の事前分布・事後分布として欠かせません。 定義・数式 、 とします。密度関数が のとき と書きます。 はベータ関数で、ガンマ関数と次の関係があります。 項目 内容 台 パラメータ 、 期待値 分散 最頻値 （ ） 次モーメント モーメント母関数 すべての で存在（台が有界）するが、初等関数では書けない（ の級数、合流型超幾何関数） 特性関数 同様に級数で表される 数式の読み解き - ：二項分布の尤度 と同じ形です。 回の成功と 回の失敗を見たときの尤度、と考えると直感がつかめます。 - と の比が平均を、和 が「情報量（集中度）」を決めます。 が大きいほど分散は小さくなります。 - なら について対称、 なら一様分布 です。 形はパラメータによって大きく変わります。 - ：内側に山が1つある形。 なら山は左（0寄り）、 なら右（1寄り）。 - ：両端で密度が無限大になる U 字形。「ほぼ0かほぼ1」に分かれる割合を表します。 - または ：一方の端に向かって単調に増える（減る）形。 - なら です。成功と失敗の役割を入れ替えたものと読めます。 期待値・分散の導出。ベータ関数の比を使います。 同様に なので 他の分布との関係。 - ガンマ分布： 、 が独立なら 。 - 一様分布の順序統計量：独立な の 個のうち小さいほうから 番目は 。 - 二項分布： の観測 に対し事前分布 を使うと、事後分布は （共役事前分布）。 - F分布： なら 。 具体例 例1：Web広告のクリック率 過去の経験から、新しい広告のクリック率 を で表すとします。 最頻値は です。20回表示して3回クリックされたら、事後分布は になり、 と、平均がデータの比率 の方向に動き、ばらつきが小さくなります。 例2：5個の一様乱数の中央値（試験に近い形） 独立な 5個の中央値（3番目）は に従います。中央値が 0.3 未満になるのは「0.3 未満の値が3個以上ある」ときなので、二項分布 で です。ベータ分布の累積確率が二項分布の和で計算できる、という関係の例です。 現場での使われ方 - マーケティング：ベイズ流A/Bテストで、案ごとの成約率の事後分布をベータ分布で表し、「案Bが案Aより良い確率」を計算します。 - 製造・品質管理：ロットごとに不良率がばらつく状況を、不良率がベータ分布に従うとしてモデル化します（ベータ二項分布）。 - IT・Webサービス：推薦システムで、クリック率の事後分布からサンプルを引いて表示する記事を選ぶ方法（トンプソン抽出）に使います。 - 行政・調査：プロジェクト管理の工期見積もり（PERT）で、作業時間を有界な区間のベータ分布で近似します。 グラフ・イメージ から始め、 と を同じ比のまま大きくすると、平均は変わらず山だけが細くなることを確認してください（データが増えて確信が強まる様子）。比較用の一様分布 は「何も知らない」事前分布です。 試験のポイント - 期待値 、分散 はベータ関数とガンマ関数の関係から導けるようにします。 - 二項分布の共役事前分布として、事後分布のパラメータ更新（ 、 ）は第31章で頻出です。 - ガンマ分布との関係、一様分布の順序統計量との関係、F分布との関係を押さえます。 - を使って、積分を見た瞬間にベータ関数に直す計算力が問われます。 よくある間違い - × 平均を とする → ○ です。 - × 事後分布を とする → ○ 失敗側には失敗回数 を足します。 - × 最頻値も平均と同じく → ○ 最頻値は で、 のときだけ内側にあります。例1では平均 0.2 に対し最頻値 0.125 です。 - × → ○ は分母です。"},"cauchy-distribution":{"id":"cauchy-distribution","title":"コーシー分布","reading":"こーしーぶんぷ","en":"Cauchy distribution","aliases":["Cauchy distribution","ローレンツ分布"],"chapter":6,"importance":"B","tags":["連続型分布","裾の重い分布","期待値が存在しない","特性関数"],"related":["characteristic-function","t-distribution","standard-normal-distribution","central-limit-theorem","weak-law-of-large-numbers"],"charts":[{"type":"pdf","dist":"cauchy","params":{"loc":0,"scale":1},"sliders":[{"param":"loc","label":"位置 μ","min":-3,"max":3,"step":0.1},{"param":"scale","label":"尺度 γ","min":0.3,"max":3,"step":0.1}],"x":{"min":-8,"max":8},"compare":[{"dist":"norm","params":{"mu":0,"sigma":1},"label":"標準正規 N(0,1)"}],"caption":"中心付近は正規分布より低く、裾は正規分布よりはるかにゆっくり0に近づく。この「重い裾」のせいで期待値が存在しない。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>正規分布に似た左右対称の山をもちながら、裾が極端に重いために<strong>期待値も分散も存在しない<\/strong>連続型分布です。\n「平均をとればばらつきが減る」という常識が通用しない反例として、大数の法則や中心極限定理の前提を理解するのに使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>位置 <span class=\"math-inline\">$\\mu\\in\\mathbb{R}$<\/span>、尺度 <span class=\"math-inline\">$\\gamma&gt;0$<\/span> のコーシー分布の密度関数は<\/p>\n<div class=\"math-display\">$$f(x)=\\frac{1}{\\pi\\gamma}\\cdot\\frac{1}{1+\\left(\\dfrac{x-\\mu}{\\gamma}\\right)^2},\\qquad -\\infty&lt;x&lt;\\infty$$<\/div>\n<p>です。<span class=\"math-inline\">$\\mu=0,\\gamma=1$<\/span> を標準コーシー分布といい、<span class=\"math-inline\">$f(x)=\\dfrac{1}{\\pi(1+x^2)}$<\/span>、<span class=\"math-inline\">$F(x)=\\dfrac12+\\dfrac1\\pi\\arctan x$<\/span> です。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(-\\infty,\\infty)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>位置 <span class=\"math-inline\">$\\mu$<\/span>、尺度 <span class=\"math-inline\">$\\gamma&gt;0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td>存在しない<\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td>存在しない<\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td>存在しない（<span class=\"math-inline\">$t\\ne0$<\/span> で発散）<\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t)=\\exp(i\\mu t-\\gamma|t|)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>中央値・最頻値<\/td>\n<td><span class=\"math-inline\">$\\mu$<\/span><\/td>\n<\/tr>\n<tr>\n<td>四分位点<\/td>\n<td><span class=\"math-inline\">$\\mu\\pm\\gamma$<\/span>（四分位範囲は <span class=\"math-inline\">$2\\gamma$<\/span>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>密度は <span class=\"math-inline\">$|x|$<\/span> が大きいとき <span class=\"math-inline\">$1/x^2$<\/span> の速さでしか減りません。正規分布の <span class=\"math-inline\">$e^{-x^2/2}$<\/span> と比べて非常に遅いです。<\/li>\n<li><strong>期待値が存在しない理由<\/strong>：<span class=\"math-inline\">$\\int_0^\\infty \\dfrac{x}{\\pi(1+x^2)}dx=\\Big[\\dfrac{1}{2\\pi}\\log(1+x^2)\\Big]_0^\\infty=\\infty$<\/span> となり、正の部分も負の部分も発散するため、<span class=\"math-inline\">$E[X]$<\/span> が定義できません。対称だから0、とはなりません。<\/li>\n<li><span class=\"math-inline\">$\\mu$<\/span> と <span class=\"math-inline\">$\\gamma$<\/span> は「平均」「標準偏差」ではなく、中央値と半四分位範囲にあたります。<\/li>\n<\/ul>\n<p><strong>特性関数と標本平均<\/strong>。<span class=\"math-inline\">$X_1,\\dots,X_n$<\/span> が独立に標準コーシー分布に従うとき、<span class=\"math-inline\">$\\bar X$<\/span> の特性関数は<\/p>\n<div class=\"math-display\">$$\\varphi_{\\bar X}(t)=\\left\\{\\varphi\\!\\left(\\frac tn\\right)\\right\\}^n=\\left(e^{-|t|/n}\\right)^n=e^{-|t|}$$<\/div>\n<p>となり、<span class=\"math-inline\">$\\bar X$<\/span> は再び標準コーシー分布です。何個平均しても分布はまったく狭くなりません。大数の法則も中心極限定理も、期待値（分散）の存在が前提だからです。<\/p>\n<p><strong>他の分布との関係<\/strong>。<\/p>\n<ul>\n<li>独立な <span class=\"math-inline\">$Z_1,Z_2\\sim N(0,1)$<\/span> の比 <span class=\"math-inline\">$Z_1/Z_2$<\/span> は標準コーシー分布です。<\/li>\n<li>自由度1の t 分布 <span class=\"math-inline\">$t(1)$<\/span> は標準コーシー分布です。<\/li>\n<li><span class=\"math-inline\">$U\\sim U(-\\pi/2,\\pi/2)$<\/span> なら <span class=\"math-inline\">$\\tan U$<\/span> は標準コーシー分布です（角度を一様にして直線に投影したもの）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：裾の確率を正規分布と比べる<\/strong><\/p>\n<p>標準コーシー分布で <span class=\"math-inline\">$X&gt;3$<\/span> となる確率は<\/p>\n<div class=\"math-display\">$$P(X&gt;3)=\\frac12-\\frac1\\pi\\arctan3\\approx0.1024$$<\/div>\n<p>標準正規分布では <span class=\"math-inline\">$P(Z&gt;3)\\approx0.00135$<\/span> なので、約76倍起こりやすいことになります。また <span class=\"math-inline\">$P(|X|&gt;1)=1-\\frac{2}{\\pi}\\arctan1=0.5$<\/span> で、半分のデータが <span class=\"math-inline\">$\\pm1$<\/span> の外に出ます。<\/p>\n<p><strong>例2：100個平均しても変わらない<\/strong><\/p>\n<p>標準コーシー分布から100個とって平均しても、<span class=\"math-inline\">$\\bar X$<\/span> は標準コーシー分布なので、<span class=\"math-inline\">$P(|\\bar X|&gt;1)=0.5$<\/span> のままです。正規分布 <span class=\"math-inline\">$N(0,1)$<\/span> なら <span class=\"math-inline\">$\\bar X\\sim N(0,1/100)$<\/span> で、<span class=\"math-inline\">$P(|\\bar X|&gt;1)=P(|Z|&gt;10)$<\/span> はほぼ0です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：ごくまれに巨大な変動が起こる資産収益率など、裾の重い現象のモデルとして、正規分布の危険な過小評価を示す例に使われます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：ロバスト推定の性能評価で、外れ値が大量に混じる状況を作るためのシミュレーション分布として使います。平均ではなく中央値が有効な場面の典型です。<\/li>\n<li><strong>製造・品質管理<\/strong>：分光測定のスペクトル線の形（ローレンツ型）として物理計測で現れます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>比較用の標準正規分布と重ねると、中心付近ではコーシー分布のほうが低く、<span class=\"math-inline\">$|x|\\approx1.85$<\/span> を境に逆転して、コーシー分布の裾がいつまでも残る様子がわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>期待値が存在しないことを、積分の発散で説明できるようにします。<\/li>\n<li>特性関数 <span class=\"math-inline\">$e^{-|t|}$<\/span> から「標本平均もコーシー分布」を導く問題は、特性関数の使い方の典型です。<\/li>\n<li><span class=\"math-inline\">$t(1)$<\/span> と一致すること、<span class=\"math-inline\">$N(0,1)$<\/span> どうしの比であることを押さえます。<\/li>\n<li>位置の推定には標本平均ではなく標本中央値を使う、という結論につなげます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 左右対称だから期待値は0 → ○ 積分が発散するので、期待値は存在しません。<\/li>\n<li>× 標本を増やせば標本平均は <span class=\"math-inline\">$\\mu$<\/span> に近づく → ○ <span class=\"math-inline\">$\\bar X$<\/span> は何個平均しても元と同じ分布で、収束しません。<\/li>\n<li>× <span class=\"math-inline\">$\\gamma$<\/span> は標準偏差 → ○ 分散は存在しません。<span class=\"math-inline\">$\\gamma$<\/span> は四分位範囲の半分です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 正規分布に似た左右対称の山をもちながら、裾が極端に重いために期待値も分散も存在しない連続型分布です。 「平均をとればばらつきが減る」という常識が通用しない反例として、大数の法則や中心極限定理の前提を理解するのに使われます。 定義・数式 位置 、尺度 のコーシー分布の密度関数は です。 を標準コーシー分布といい、 、 です。 項目 内容 台 パラメータ 位置 、尺度 期待値 存在しない 分散 存在しない モーメント母関数 存在しない（ で発散） 特性関数 中央値・最頻値 四分位点 （四分位範囲は ） 数式の読み解き - 密度は が大きいとき の速さでしか減りません。正規分布の と比べて非常に遅いです。 - 期待値が存在しない理由： となり、正の部分も負の部分も発散するため、 が定義できません。対称だから0、とはなりません。 - と は「平均」「標準偏差」ではなく、中央値と半四分位範囲にあたります。 特性関数と標本平均。 が独立に標準コーシー分布に従うとき、 の特性関数は となり、 は再び標準コーシー分布です。何個平均しても分布はまったく狭くなりません。大数の法則も中心極限定理も、期待値（分散）の存在が前提だからです。 他の分布との関係。 - 独立な の比 は標準コーシー分布です。 - 自由度1の t 分布 は標準コーシー分布です。 - なら は標準コーシー分布です（角度を一様にして直線に投影したもの）。 具体例 例1：裾の確率を正規分布と比べる 標準コーシー分布で となる確率は 標準正規分布では なので、約76倍起こりやすいことになります。また で、半分のデータが の外に出ます。 例2：100個平均しても変わらない 標準コーシー分布から100個とって平均しても、 は標準コーシー分布なので、 のままです。正規分布 なら で、 はほぼ0です。 現場での使われ方 - 金融・保険：ごくまれに巨大な変動が起こる資産収益率など、裾の重い現象のモデルとして、正規分布の危険な過小評価を示す例に使われます。 - IT・Webサービス：ロバスト推定の性能評価で、外れ値が大量に混じる状況を作るためのシミュレーション分布として使います。平均ではなく中央値が有効な場面の典型です。 - 製造・品質管理：分光測定のスペクトル線の形（ローレンツ型）として物理計測で現れます。 グラフ・イメージ 比較用の標準正規分布と重ねると、中心付近ではコーシー分布のほうが低く、 を境に逆転して、コーシー分布の裾がいつまでも残る様子がわかります。 試験のポイント - 期待値が存在しないことを、積分の発散で説明できるようにします。 - 特性関数 から「標本平均もコーシー分布」を導く問題は、特性関数の使い方の典型です。 - と一致すること、 どうしの比であることを押さえます。 - 位置の推定には標本平均ではなく標本中央値を使う、という結論につなげます。 よくある間違い - × 左右対称だから期待値は0 → ○ 積分が発散するので、期待値は存在しません。 - × 標本を増やせば標本平均は に近づく → ○ は何個平均しても元と同じ分布で、収束しません。 - × は標準偏差 → ○ 分散は存在しません。 は四分位範囲の半分です。"},"exponential-distribution":{"id":"exponential-distribution","title":"指数分布","reading":"しすうぶんぷ","en":"Exponential distribution","aliases":["Exponential distribution","Exp(λ)"],"chapter":6,"importance":"A","tags":["連続型分布","無記憶性","待ち時間","ハザード関数"],"related":["gamma-distribution","geometric-distribution","poisson-distribution","poisson-process","hazard-function","survival-function"],"charts":[{"type":"pdf","dist":"expon","params":{"rate":1},"sliders":[{"param":"rate","label":"レート λ","min":0.2,"max":3,"step":0.1}],"x":{"min":0,"max":8},"caption":"x=0 で最大値 λ をとり、右へ指数的に減っていく。λ を大きくすると立ち上がりが高くなり、平均 1/λ が短くなる。"},{"type":"survival-hazard","dist":"expon","params":{"rate":1},"sliders":[{"param":"rate","label":"レート λ","min":0.2,"max":3,"step":0.1}],"caption":"生存関数 e^{−λx} は指数的に減るが、ハザード関数は λ で一定の水平線になる。これが無記憶性の表れ。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「次の出来事が起こるまでの待ち時間」を表す連続型分布です。\nどれだけ待ったかに関係なく「この先の待ち時間の分布は同じ」という<strong>無記憶性<\/strong>をもつ、唯一の連続型分布です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>この項では<strong>レート（発生率）<span class=\"math-inline\">$\\lambda&gt;0$<\/span><\/strong> を使う流儀を採用します。密度関数と累積分布関数は<\/p>\n<div class=\"math-display\">$$f(x)=\\lambda e^{-\\lambda x},\\qquad F(x)=1-e^{-\\lambda x},\\qquad x\\ge0$$<\/div>\n<p>で、<span class=\"math-inline\">$X\\sim \\mathrm{Exp}(\\lambda)$<\/span> と書きます。平均 <span class=\"math-inline\">$\\theta=1/\\lambda$<\/span> を使って <span class=\"math-inline\">$f(x)=\\frac1\\theta e^{-x/\\theta}$<\/span> と書く流儀（尺度パラメータ表記）もあります。教科書や問題文で <span class=\"math-inline\">$\\mathrm{Exp}(2)$<\/span> がどちらの意味かを必ず確認してください。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容（レート <span class=\"math-inline\">$\\lambda$<\/span> 表記）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$[0,\\infty)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td><span class=\"math-inline\">$\\lambda&gt;0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$1/\\lambda$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$1/\\lambda^2$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t)=\\dfrac{\\lambda}{\\lambda-t}$<\/span>（<span class=\"math-inline\">$t&lt;\\lambda$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t)=\\dfrac{\\lambda}{\\lambda-it}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>生存関数・ハザード<\/td>\n<td><span class=\"math-inline\">$S(x)=e^{-\\lambda x}$<\/span>、<span class=\"math-inline\">$h(x)=\\lambda$<\/span>（一定）<\/td>\n<\/tr>\n<tr>\n<td>中央値<\/td>\n<td><span class=\"math-inline\">$\\log 2/\\lambda$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\lambda$<\/span>：単位時間あたりに出来事が起こる率です。1分に平均2回なら <span class=\"math-inline\">$\\lambda=2$<\/span>、平均待ち時間は <span class=\"math-inline\">$1/2$<\/span> 分です。<\/li>\n<li><span class=\"math-inline\">$e^{-\\lambda x}$<\/span>：時間 <span class=\"math-inline\">$x$<\/span> までに一度も起こらない確率 <span class=\"math-inline\">$S(x)$<\/span> です。<\/li>\n<\/ul>\n<p><strong>MGF と平均・分散<\/strong>。<span class=\"math-inline\">$t&lt;\\lambda$<\/span> のとき<\/p>\n<div class=\"math-display\">$$M(t)=\\int_0^\\infty e^{tx}\\lambda e^{-\\lambda x}dx=\\lambda\\int_0^\\infty e^{-(\\lambda-t)x}dx=\\frac{\\lambda}{\\lambda-t}$$<\/div>\n<p><span class=\"math-inline\">$M'(t)=\\lambda/(\\lambda-t)^2$<\/span>、<span class=\"math-inline\">$M''(t)=2\\lambda/(\\lambda-t)^3$<\/span> より、<span class=\"math-inline\">$E[X]=1/\\lambda$<\/span>、<span class=\"math-inline\">$E[X^2]=2/\\lambda^2$<\/span>、<span class=\"math-inline\">$V[X]=2/\\lambda^2-1/\\lambda^2=1/\\lambda^2$<\/span> です。平均と標準偏差が等しい（変動係数が1）のが特徴です。<\/p>\n<p><strong>無記憶性<\/strong>。<span class=\"math-inline\">$s,t\\ge0$<\/span> について<\/p>\n<div class=\"math-display\">$$P(X&gt;s+t\\mid X&gt;s)=\\frac{e^{-\\lambda(s+t)}}{e^{-\\lambda s}}=e^{-\\lambda t}=P(X&gt;t)$$<\/div>\n<p>すでに <span class=\"math-inline\">$s$<\/span> だけ待っていても、残りの待ち時間は新品と同じ分布です。ハザード関数 <span class=\"math-inline\">$h(x)=f(x)/S(x)=\\lambda$<\/span> が一定であることと同じ意味です。<\/p>\n<p><strong>幾何分布との対比<\/strong>。第5章の幾何分布（成功までの失敗回数 <span class=\"math-inline\">$Y$<\/span>）も <span class=\"math-inline\">$P(Y\\ge s+t\\mid Y\\ge s)=P(Y\\ge t)$<\/span> という無記憶性をもちます。幾何分布は「離散時間で毎回確率 <span class=\"math-inline\">$p$<\/span> で起こる」待ち時間、指数分布は「連続時間で率 <span class=\"math-inline\">$\\lambda$<\/span> で起こる」待ち時間で、無記憶性をもつのは離散型では幾何分布、連続型では指数分布だけです。1回の幅を <span class=\"math-inline\">$\\Delta$<\/span> として <span class=\"math-inline\">$p=\\lambda\\Delta$<\/span> とし、<span class=\"math-inline\">$\\Delta\\to0$<\/span> とすると、幾何分布の待ち時間は指数分布に近づきます。<\/p>\n<p><strong>他の分布との関係<\/strong>。<\/p>\n<ul>\n<li>独立な <span class=\"math-inline\">$\\mathrm{Exp}(\\lambda)$<\/span> の <span class=\"math-inline\">$n$<\/span> 個の和は、形状 <span class=\"math-inline\">$n$<\/span>・レート <span class=\"math-inline\">$\\lambda$<\/span> のガンマ分布です（MGF <span class=\"math-inline\">$\\{\\lambda/(\\lambda-t)\\}^n$<\/span>）。<\/li>\n<li>ポアソン過程（率 <span class=\"math-inline\">$\\lambda$<\/span>）の到着間隔は <span class=\"math-inline\">$\\mathrm{Exp}(\\lambda)$<\/span> です。<\/li>\n<li>独立な <span class=\"math-inline\">$X_i\\sim\\mathrm{Exp}(\\lambda_i)$<\/span> の最小値は <span class=\"math-inline\">$\\mathrm{Exp}(\\lambda_1+\\cdots+\\lambda_k)$<\/span> です。<span class=\"math-inline\">$P(\\min&gt;x)=\\prod e^{-\\lambda_i x}$<\/span> から出ます。<\/li>\n<li><span class=\"math-inline\">$\\mathrm{Exp}(1/2)$<\/span>（平均2）は自由度2のカイ二乗分布と同じです。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：コールセンターの着信<\/strong><\/p>\n<p>着信が1分あたり平均 0.5 件（<span class=\"math-inline\">$\\lambda=0.5$<\/span>）のポアソン過程に従うとき、次の着信までの時間 <span class=\"math-inline\">$X\\sim\\mathrm{Exp}(0.5)$<\/span> です。平均は2分、中央値は <span class=\"math-inline\">$\\log2/0.5\\approx1.386$<\/span> 分です。<\/p>\n<div class=\"math-display\">$$P(X&gt;3)=e^{-0.5\\times3}=e^{-1.5}\\approx0.2231$$<\/div>\n<p>すでに2分着信がなかったとき、さらに3分以上来ない確率も、無記憶性により<\/p>\n<div class=\"math-display\">$$P(X&gt;5\\mid X&gt;2)=e^{-0.5\\times 3}\\approx0.2231$$<\/div>\n<p>で同じです。<\/p>\n<p><strong>例2：直列システムの故障時間（試験に近い形）<\/strong><\/p>\n<p>3つの部品の寿命が独立に、レート 0.1、0.2、0.3（1年あたり）の指数分布に従い、1つでも壊れるとシステムが止まります。システムの寿命 <span class=\"math-inline\">$T=\\min(X_1,X_2,X_3)$<\/span> は <span class=\"math-inline\">$\\mathrm{Exp}(0.6)$<\/span> に従うので、<\/p>\n<div class=\"math-display\">$$E[T]=\\frac{1}{0.6}\\approx1.667\\ \\text{年}$$<\/div>\n<p>です。最初に壊れるのが部品3である確率は <span class=\"math-inline\">$0.3/0.6=0.5$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：偶発故障期（故障率が一定の期間）の電子部品の寿命を指数分布でモデル化し、平均故障間隔（MTBF）<span class=\"math-inline\">$=1/\\lambda$<\/span> を推定します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：サーバへのリクエスト到着間隔をモデル化し、待ち行列理論（M/M/1など）でレスポンス遅延を見積もります。<\/li>\n<li><strong>金融・保険<\/strong>：保険事故の発生間隔をモデル化し、一定期間内に事故が起こらない確率を計算します。<\/li>\n<li><strong>医療<\/strong>：生存時間解析で、ハザードが一定と仮定できる場合の最も単純なモデルとして使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目では、<span class=\"math-inline\">$\\lambda$<\/span> を大きくすると <span class=\"math-inline\">$x=0$<\/span> での高さ <span class=\"math-inline\">$\\lambda$<\/span> が上がり、分布が左に縮む（平均 <span class=\"math-inline\">$1/\\lambda$<\/span> が短くなる）ことを確認します。\n2つ目では、生存関数が減っていく一方で、ハザード関数は水平線のままであることに注目してください。故障の起こりやすさが時間とともに変わらない、ということです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>平均 <span class=\"math-inline\">$1/\\lambda$<\/span>、分散 <span class=\"math-inline\">$1/\\lambda^2$<\/span>、MGF <span class=\"math-inline\">$\\lambda/(\\lambda-t)$<\/span> は即答できるようにします。採用しているパラメータ表記（レートか平均か）を最初に確認します。<\/li>\n<li>無記憶性を条件付き確率で示す計算は典型です。幾何分布との対応も押さえます。<\/li>\n<li>指数分布の和 → ガンマ分布、最小値 → 指数分布、ポアソン過程の到着間隔 → 指数分布、の3つの関係は頻繁に使います。<\/li>\n<li>最尤推定量は <span class=\"math-inline\">$\\hat\\lambda=1/\\bar X$<\/span> です（第8章）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$\\mathrm{Exp}(2)$<\/span> の平均を常に2とする → ○ レート表記なら平均は <span class=\"math-inline\">$1/2$<\/span>、尺度（平均）表記なら2です。<\/li>\n<li>× 長く待ったのだから、そろそろ来るはず → ○ 指数分布では残りの待ち時間の分布は変わりません。<\/li>\n<li>× 最小値の平均を <span class=\"math-inline\">$\\min(1/\\lambda_i)$<\/span> とする → ○ 最小値はレートの和 <span class=\"math-inline\">$\\sum\\lambda_i$<\/span> の指数分布で、平均は <span class=\"math-inline\">$1/\\sum\\lambda_i$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「次の出来事が起こるまでの待ち時間」を表す連続型分布です。 どれだけ待ったかに関係なく「この先の待ち時間の分布は同じ」という無記憶性をもつ、唯一の連続型分布です。 定義・数式 この項ではレート（発生率） を使う流儀を採用します。密度関数と累積分布関数は で、 と書きます。平均 を使って と書く流儀（尺度パラメータ表記）もあります。教科書や問題文で がどちらの意味かを必ず確認してください。 項目 内容（レート 表記） 台 パラメータ 期待値 分散 モーメント母関数 （ ） 特性関数 生存関数・ハザード 、 （一定） 中央値 数式の読み解き - ：単位時間あたりに出来事が起こる率です。1分に平均2回なら 、平均待ち時間は 分です。 - ：時間 までに一度も起こらない確率 です。 MGF と平均・分散。 のとき 、 より、 、 、 です。平均と標準偏差が等しい（変動係数が1）のが特徴です。 無記憶性。 について すでに だけ待っていても、残りの待ち時間は新品と同じ分布です。ハザード関数 が一定であることと同じ意味です。 幾何分布との対比。第5章の幾何分布（成功までの失敗回数 ）も という無記憶性をもちます。幾何分布は「離散時間で毎回確率 で起こる」待ち時間、指数分布は「連続時間で率 で起こる」待ち時間で、無記憶性をもつのは離散型では幾何分布、連続型では指数分布だけです。1回の幅を として とし、 とすると、幾何分布の待ち時間は指数分布に近づきます。 他の分布との関係。 - 独立な の 個の和は、形状 ・レート のガンマ分布です（MGF ）。 - ポアソン過程（率 ）の到着間隔は です。 - 独立な の最小値は です。 から出ます。 - （平均2）は自由度2のカイ二乗分布と同じです。 具体例 例1：コールセンターの着信 着信が1分あたり平均 0.5 件（ ）のポアソン過程に従うとき、次の着信までの時間 です。平均は2分、中央値は 分です。 すでに2分着信がなかったとき、さらに3分以上来ない確率も、無記憶性により で同じです。 例2：直列システムの故障時間（試験に近い形） 3つの部品の寿命が独立に、レート 0.1、0.2、0.3（1年あたり）の指数分布に従い、1つでも壊れるとシステムが止まります。システムの寿命 は に従うので、 です。最初に壊れるのが部品3である確率は です。 現場での使われ方 - 製造・品質管理：偶発故障期（故障率が一定の期間）の電子部品の寿命を指数分布でモデル化し、平均故障間隔（MTBF） を推定します。 - IT・Webサービス：サーバへのリクエスト到着間隔をモデル化し、待ち行列理論（M/M/1など）でレスポンス遅延を見積もります。 - 金融・保険：保険事故の発生間隔をモデル化し、一定期間内に事故が起こらない確率を計算します。 - 医療：生存時間解析で、ハザードが一定と仮定できる場合の最も単純なモデルとして使います。 グラフ・イメージ 1つ目では、 を大きくすると での高さ が上がり、分布が左に縮む（平均 が短くなる）ことを確認します。 2つ目では、生存関数が減っていく一方で、ハザード関数は水平線のままであることに注目してください。故障の起こりやすさが時間とともに変わらない、ということです。 試験のポイント - 平均 、分散 、MGF は即答できるようにします。採用しているパラメータ表記（レートか平均か）を最初に確認します。 - 無記憶性を条件付き確率で示す計算は典型です。幾何分布との対応も押さえます。 - 指数分布の和 → ガンマ分布、最小値 → 指数分布、ポアソン過程の到着間隔 → 指数分布、の3つの関係は頻繁に使います。 - 最尤推定量は です（第8章）。 よくある間違い - × の平均を常に2とする → ○ レート表記なら平均は 、尺度（平均）表記なら2です。 - × 長く待ったのだから、そろそろ来るはず → ○ 指数分布では残りの待ち時間の分布は変わりません。 - × 最小値の平均を とする → ○ 最小値はレートの和 の指数分布で、平均は です。"},"gamma-distribution":{"id":"gamma-distribution","title":"ガンマ分布","reading":"がんまぶんぷ","en":"Gamma distribution","aliases":["Γ分布","Ga(α,β)","アーラン分布"],"chapter":6,"importance":"A","tags":["連続型分布","再生性","待ち時間","ガンマ関数"],"related":["exponential-distribution","chi-squared-distribution","poisson-distribution","beta-distribution","gamma-poisson-model","moment-generating-function"],"charts":[{"type":"pdf","dist":"gamma","params":{"shape":2,"scale":1},"sliders":[{"param":"shape","label":"形状 α","min":0.5,"max":10,"step":0.5},{"param":"scale","label":"尺度 β","min":0.5,"max":5,"step":0.5}],"x":{"min":0,"max":20},"compare":[{"dist":"expon","params":{"rate":1},"label":"指数分布 Exp(1)（α=1, β=1）"}],"caption":"α=1 で指数分布、α<1 で x=0 に向かって発散、α>1 で山ができる。α を大きくすると山が右へ移り、左右対称に近づく。β は横軸の目盛りを伸ばすだけ。"},{"type":"survival-hazard","dist":"gamma","params":{"shape":2,"scale":1},"sliders":[{"param":"shape","label":"形状 α","min":0.5,"max":5,"step":0.5}],"caption":"α>1 ではハザードが増加（劣化型）、α<1 では減少（初期故障型）、α=1 で一定（指数分布）になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>指数分布の待ち時間を何個も足し合わせた「<span class=\"math-inline\">$\\alpha$<\/span> 回目の出来事が起こるまでの待ち時間」を表す連続型分布です。\n指数分布もカイ二乗分布もこの分布の特別な場合で、正の値をとるデータ（所要時間、損害額、降水量など）のモデルとして広く使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>この項では<strong>形状 <span class=\"math-inline\">$\\alpha&gt;0$<\/span>、尺度 <span class=\"math-inline\">$\\beta&gt;0$<\/span><\/strong> の流儀を採用します。密度関数は<\/p>\n<div class=\"math-display\">$$f(x)=\\frac{1}{\\Gamma(\\alpha)\\beta^{\\alpha}}\\,x^{\\alpha-1}e^{-x/\\beta},\\qquad x&gt;0$$<\/div>\n<p>で、<span class=\"math-inline\">$X\\sim\\mathrm{Ga}(\\alpha,\\beta)$<\/span> と書きます。ここで <span class=\"math-inline\">$\\Gamma(\\alpha)=\\int_0^\\infty u^{\\alpha-1}e^{-u}du$<\/span> はガンマ関数です。<\/p>\n<p>もう一方の流儀として、<strong>レート <span class=\"math-inline\">$\\lambda=1/\\beta$<\/span><\/strong> を使って<\/p>\n<div class=\"math-display\">$$f(x)=\\frac{\\lambda^{\\alpha}}{\\Gamma(\\alpha)}x^{\\alpha-1}e^{-\\lambda x}$$<\/div>\n<p>と書くこともあります（ベイズ統計ではこちらが多い）。<span class=\"math-inline\">$\\mathrm{Ga}(2,3)$<\/span> と書かれていたら、第2引数が尺度かレートかを必ず確認してください。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>尺度 <span class=\"math-inline\">$\\beta$<\/span> 表記<\/th>\n<th>レート <span class=\"math-inline\">$\\lambda$<\/span> 表記<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(0,\\infty)$<\/span><\/td>\n<td>同左<\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$\\alpha\\beta$<\/span><\/td>\n<td><span class=\"math-inline\">$\\alpha/\\lambda$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$\\alpha\\beta^2$<\/span><\/td>\n<td><span class=\"math-inline\">$\\alpha/\\lambda^2$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$(1-\\beta t)^{-\\alpha}$<\/span>（<span class=\"math-inline\">$t&lt;1/\\beta$<\/span>）<\/td>\n<td><span class=\"math-inline\">$\\left(\\dfrac{\\lambda}{\\lambda-t}\\right)^{\\alpha}$<\/span>（<span class=\"math-inline\">$t&lt;\\lambda$<\/span>）<\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$(1-i\\beta t)^{-\\alpha}$<\/span><\/td>\n<td><span class=\"math-inline\">$(1-it/\\lambda)^{-\\alpha}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>最頻値<\/td>\n<td><span class=\"math-inline\">$(\\alpha-1)\\beta$<\/span>（<span class=\"math-inline\">$\\alpha\\ge1$<\/span>）<\/td>\n<td><span class=\"math-inline\">$(\\alpha-1)/\\lambda$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\alpha$<\/span>（形状）：分布の形を決めます。整数のときは「<span class=\"math-inline\">$\\alpha$<\/span> 回目の到着までの待ち時間」と解釈できます。<\/li>\n<li><span class=\"math-inline\">$\\beta$<\/span>（尺度）：横軸の目盛りの単位です。<span class=\"math-inline\">$X\\sim\\mathrm{Ga}(\\alpha,1)$<\/span> なら <span class=\"math-inline\">$\\beta X\\sim\\mathrm{Ga}(\\alpha,\\beta)$<\/span> です。<\/li>\n<li>ガンマ関数の性質 <span class=\"math-inline\">$\\Gamma(\\alpha+1)=\\alpha\\Gamma(\\alpha)$<\/span>、<span class=\"math-inline\">$\\Gamma(n)=(n-1)!$<\/span>、<span class=\"math-inline\">$\\Gamma(1/2)=\\sqrt\\pi$<\/span> を使います。<\/li>\n<\/ul>\n<p><strong>MGF の導出<\/strong>。<span class=\"math-inline\">$t&lt;1/\\beta$<\/span> のとき、<span class=\"math-inline\">$x(1/\\beta-t)=u$<\/span> と置換すると<\/p>\n<div class=\"math-display\">$$M(t)=\\frac{1}{\\Gamma(\\alpha)\\beta^\\alpha}\\int_0^\\infty x^{\\alpha-1}e^{-x(1/\\beta-t)}dx=\\frac{1}{\\Gamma(\\alpha)\\beta^\\alpha}\\cdot\\frac{\\Gamma(\\alpha)}{(1/\\beta-t)^{\\alpha}}=(1-\\beta t)^{-\\alpha}$$<\/div>\n<p>キュムラント母関数 <span class=\"math-inline\">$K(t)=-\\alpha\\log(1-\\beta t)$<\/span> を微分すると <span class=\"math-inline\">$K'(t)=\\alpha\\beta/(1-\\beta t)$<\/span>、<span class=\"math-inline\">$K''(t)=\\alpha\\beta^2/(1-\\beta t)^2$<\/span> なので、<span class=\"math-inline\">$E[X]=\\alpha\\beta$<\/span>、<span class=\"math-inline\">$V[X]=\\alpha\\beta^2$<\/span> です。<\/p>\n<p><strong>再生性<\/strong>。<span class=\"math-inline\">$X_1\\sim\\mathrm{Ga}(\\alpha_1,\\beta)$<\/span>、<span class=\"math-inline\">$X_2\\sim\\mathrm{Ga}(\\alpha_2,\\beta)$<\/span> が独立なら、MGF の積 <span class=\"math-inline\">$(1-\\beta t)^{-(\\alpha_1+\\alpha_2)}$<\/span> より<\/p>\n<div class=\"math-display\">$$X_1+X_2\\sim\\mathrm{Ga}(\\alpha_1+\\alpha_2,\\ \\beta)$$<\/div>\n<p>です。<strong>尺度 <span class=\"math-inline\">$\\beta$<\/span> が共通<\/strong>であることが条件です。<\/p>\n<p><strong>他の分布との関係<\/strong>。<\/p>\n<ul>\n<li><span class=\"math-inline\">$\\alpha=1$<\/span>：指数分布 <span class=\"math-inline\">$\\mathrm{Ga}(1,\\beta)=\\mathrm{Exp}(1/\\beta)$<\/span>。よって独立な <span class=\"math-inline\">$\\mathrm{Exp}(\\lambda)$<\/span> の <span class=\"math-inline\">$n$<\/span> 個の和は <span class=\"math-inline\">$\\mathrm{Ga}(n,1/\\lambda)$<\/span> です（整数形状のものをアーラン分布ともいいます）。<\/li>\n<li><span class=\"math-inline\">$\\alpha=k/2,\\ \\beta=2$<\/span>：自由度 <span class=\"math-inline\">$k$<\/span> のカイ二乗分布 <span class=\"math-inline\">$\\chi^2(k)$<\/span>。<\/li>\n<li>ベータ分布：<span class=\"math-inline\">$X\\sim\\mathrm{Ga}(a,\\beta)$<\/span>、<span class=\"math-inline\">$Y\\sim\\mathrm{Ga}(b,\\beta)$<\/span> が独立なら <span class=\"math-inline\">$X/(X+Y)\\sim\\mathrm{Beta}(a,b)$<\/span> で、<span class=\"math-inline\">$X+Y$<\/span> と独立です。<\/li>\n<li>ポアソン分布：率 <span class=\"math-inline\">$\\lambda$<\/span> のポアソン過程で、<span class=\"math-inline\">$n$<\/span> 回目の到着時刻 <span class=\"math-inline\">$T_n\\sim\\mathrm{Ga}(n,1/\\lambda)$<\/span> について <span class=\"math-inline\">$P(T_n&gt;t)=P(N(t)\\le n-1)$<\/span> が成り立ちます。<\/li>\n<li>ベイズ統計：ポアソン分布の率パラメータの共役事前分布です（第31章）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：3人目の来店までの時間<\/strong><\/p>\n<p>来店が平均2分に1人（<span class=\"math-inline\">$\\lambda=0.5$<\/span>/分）のポアソン過程に従うとき、3人目が来るまでの時間は <span class=\"math-inline\">$T\\sim\\mathrm{Ga}(3,\\ \\beta=2)$<\/span> です。<\/p>\n<div class=\"math-display\">$$E[T]=3\\times2=6\\ \\text{分},\\qquad V[T]=3\\times2^2=12$$<\/div>\n<p>10分たっても3人目が来ない確率は、「10分間の来店数 <span class=\"math-inline\">$N\\sim\\mathrm{Po}(5)$<\/span> が2人以下」と同じなので<\/p>\n<div class=\"math-display\">$$P(T&gt;10)=P(N\\le2)=e^{-5}\\left(1+5+\\frac{5^2}{2}\\right)=18.5e^{-5}\\approx0.1247$$<\/div>\n<p>です。積分しなくても、ポアソン分布の和で求められます。<\/p>\n<p><strong>例2：再生性とカイ二乗分布（試験に近い形）<\/strong><\/p>\n<p><span class=\"math-inline\">$X\\sim\\chi^2(4)=\\mathrm{Ga}(2,2)$<\/span> と <span class=\"math-inline\">$Y\\sim\\mathrm{Ga}(1.5,2)$<\/span> が独立なら、<span class=\"math-inline\">$X+Y\\sim\\mathrm{Ga}(3.5,2)=\\chi^2(7)$<\/span> です。平均は <span class=\"math-inline\">$3.5\\times2=7$<\/span>、分散は <span class=\"math-inline\">$3.5\\times4=14$<\/span> で、<span class=\"math-inline\">$\\chi^2(7)$<\/span> の平均 <span class=\"math-inline\">$k=7$<\/span>、分散 <span class=\"math-inline\">$2k=14$<\/span> と一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：1件あたりの保険金支払額のように、正の値で右に裾が長いデータをモデル化します。<\/li>\n<li><strong>製造・品質管理<\/strong>：部品を予備も含めて <span class=\"math-inline\">$n$<\/span> 個使い切るまでの時間（待機冗長系の寿命）を、指数分布の和としてガンマ分布で表します。<\/li>\n<li><strong>医療<\/strong>：ポアソン分布の発生率が人によってばらつくとき、そのばらつきをガンマ分布で表すと、件数の分布が負の二項分布になります（過分散のモデル）。<\/li>\n<li><strong>行政・調査<\/strong>：日降水量など、0より大きく右に歪んだ気象データの分布として使われます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目では、<span class=\"math-inline\">$\\alpha=1$<\/span> のとき比較用の指数分布と重なることを確認してから、<span class=\"math-inline\">$\\alpha$<\/span> を大きくしてみてください。山が右へ移りながら左右対称に近づきます（指数分布の和なので中心極限定理が働きます）。<span class=\"math-inline\">$\\beta$<\/span> は形を変えず、横に伸ばすだけです。\n2つ目では、<span class=\"math-inline\">$\\alpha$<\/span> によってハザードが増加・一定・減少と変わる様子を見ます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>採用しているパラメータ表記（尺度かレートか）を最初に確認し、平均・分散・MGF をその表記で書けるようにします。<\/li>\n<li>MGF の導出は「ガンマ関数の定義に戻す置換」が定番です。<\/li>\n<li>再生性（尺度が共通のとき形状が足し算）、指数分布の和、カイ二乗分布との関係は頻出事項として押さえます。<\/li>\n<li><span class=\"math-inline\">$P(T_n&gt;t)=P(N(t)\\le n-1)$<\/span> を使うと、ガンマ分布の確率がポアソン分布の和で計算できます。<\/li>\n<li>ガンマ関数の値 <span class=\"math-inline\">$\\Gamma(1/2)=\\sqrt\\pi$<\/span>、<span class=\"math-inline\">$\\Gamma(n)=(n-1)!$<\/span> は計算でよく使います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 尺度 <span class=\"math-inline\">$\\beta$<\/span> とレート <span class=\"math-inline\">$\\lambda$<\/span> を取り違えて平均を <span class=\"math-inline\">$\\alpha/\\beta$<\/span> とする → ○ 尺度表記なら <span class=\"math-inline\">$\\alpha\\beta$<\/span>、レート表記なら <span class=\"math-inline\">$\\alpha/\\lambda$<\/span> です。<\/li>\n<li>× 尺度が違うガンマ分布どうしでも形状を足せる → ○ 再生性が成り立つのは尺度（レート）が共通のときだけです。<\/li>\n<li>× <span class=\"math-inline\">$\\Gamma(n)=n!$<\/span> → ○ <span class=\"math-inline\">$\\Gamma(n)=(n-1)!$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 指数分布の待ち時間を何個も足し合わせた「 回目の出来事が起こるまでの待ち時間」を表す連続型分布です。 指数分布もカイ二乗分布もこの分布の特別な場合で、正の値をとるデータ（所要時間、損害額、降水量など）のモデルとして広く使われます。 定義・数式 この項では形状 、尺度 の流儀を採用します。密度関数は で、 と書きます。ここで はガンマ関数です。 もう一方の流儀として、レート を使って と書くこともあります（ベイズ統計ではこちらが多い）。 と書かれていたら、第2引数が尺度かレートかを必ず確認してください。 項目 尺度 表記 レート 表記 台 同左 期待値 分散 モーメント母関数 （ ） （ ） 特性関数 最頻値 （ ） 数式の読み解き - （形状）：分布の形を決めます。整数のときは「 回目の到着までの待ち時間」と解釈できます。 - （尺度）：横軸の目盛りの単位です。 なら です。 - ガンマ関数の性質 、 、 を使います。 MGF の導出。 のとき、 と置換すると キュムラント母関数 を微分すると 、 なので、 、 です。 再生性。 、 が独立なら、MGF の積 より です。尺度 が共通であることが条件です。 他の分布との関係。 - ：指数分布 。よって独立な の 個の和は です（整数形状のものをアーラン分布ともいいます）。 - ：自由度 のカイ二乗分布 。 - ベータ分布： 、 が独立なら で、 と独立です。 - ポアソン分布：率 のポアソン過程で、 回目の到着時刻 について が成り立ちます。 - ベイズ統計：ポアソン分布の率パラメータの共役事前分布です（第31章）。 具体例 例1：3人目の来店までの時間 来店が平均2分に1人（ /分）のポアソン過程に従うとき、3人目が来るまでの時間は です。 10分たっても3人目が来ない確率は、「10分間の来店数 が2人以下」と同じなので です。積分しなくても、ポアソン分布の和で求められます。 例2：再生性とカイ二乗分布（試験に近い形） と が独立なら、 です。平均は 、分散は で、 の平均 、分散 と一致します。 現場での使われ方 - 金融・保険：1件あたりの保険金支払額のように、正の値で右に裾が長いデータをモデル化します。 - 製造・品質管理：部品を予備も含めて 個使い切るまでの時間（待機冗長系の寿命）を、指数分布の和としてガンマ分布で表します。 - 医療：ポアソン分布の発生率が人によってばらつくとき、そのばらつきをガンマ分布で表すと、件数の分布が負の二項分布になります（過分散のモデル）。 - 行政・調査：日降水量など、0より大きく右に歪んだ気象データの分布として使われます。 グラフ・イメージ 1つ目では、 のとき比較用の指数分布と重なることを確認してから、 を大きくしてみてください。山が右へ移りながら左右対称に近づきます（指数分布の和なので中心極限定理が働きます）。 は形を変えず、横に伸ばすだけです。 2つ目では、 によってハザードが増加・一定・減少と変わる様子を見ます。 試験のポイント - 採用しているパラメータ表記（尺度かレートか）を最初に確認し、平均・分散・MGF をその表記で書けるようにします。 - MGF の導出は「ガンマ関数の定義に戻す置換」が定番です。 - 再生性（尺度が共通のとき形状が足し算）、指数分布の和、カイ二乗分布との関係は頻出事項として押さえます。 - を使うと、ガンマ分布の確率がポアソン分布の和で計算できます。 - ガンマ関数の値 、 は計算でよく使います。 よくある間違い - × 尺度 とレート を取り違えて平均を とする → ○ 尺度表記なら 、レート表記なら です。 - × 尺度が違うガンマ分布どうしでも形状を足せる → ○ 再生性が成り立つのは尺度（レート）が共通のときだけです。 - × → ○ です。"},"lognormal-distribution":{"id":"lognormal-distribution","title":"対数正規分布","reading":"たいすうせいきぶんぷ","en":"Log-normal distribution","aliases":["Lognormal distribution","LN(μ,σ²)"],"chapter":6,"importance":"B","tags":["連続型分布","対数変換","右に歪んだ分布","積の再生性"],"related":["normal-distribution","log-transformation","change-of-variables","moment-generating-function","skewness-kurtosis"],"charts":[{"type":"pdf","dist":"lognorm","params":{"mu":0,"sigma":0.5},"sliders":[{"param":"mu","label":"μ（log X の平均）","min":-1,"max":2,"step":0.1},{"param":"sigma","label":"σ（log X の標準偏差）","min":0.1,"max":1.5,"step":0.05}],"x":{"min":0,"max":10},"caption":"σ が小さいと正規分布に近い形、σ を大きくすると右の裾が長く伸び、最頻値・中央値・平均が大きく離れる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>対数をとると正規分布になる、正の値だけをとる右に歪んだ分布です。\n「多くの要因が掛け算で効く」量（所得、資産価格、粒子の大きさ、病気の潜伏期間など）のモデルとして使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$\\log X\\sim N(\\mu,\\sigma^2)$<\/span> のとき、<span class=\"math-inline\">$X$<\/span> は対数正規分布に従うといい、<span class=\"math-inline\">$X\\sim LN(\\mu,\\sigma^2)$<\/span> と書きます。<span class=\"math-inline\">$\\mu,\\sigma^2$<\/span> は <span class=\"math-inline\">$X$<\/span> ではなく <span class=\"math-inline\">$\\log X$<\/span> の平均と分散です。密度関数は<\/p>\n<div class=\"math-display\">$$f(x)=\\frac{1}{\\sqrt{2\\pi}\\,\\sigma x}\\exp\\!\\left\\{-\\frac{(\\log x-\\mu)^2}{2\\sigma^2}\\right\\},\\qquad x&gt;0$$<\/div>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(0,\\infty)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td><span class=\"math-inline\">$\\mu\\in\\mathbb{R}$<\/span>、<span class=\"math-inline\">$\\sigma&gt;0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$e^{\\mu+\\sigma^2/2}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$e^{2\\mu+\\sigma^2}\\left(e^{\\sigma^2}-1\\right)$<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$k$<\/span> 次モーメント<\/td>\n<td><span class=\"math-inline\">$E[X^k]=e^{k\\mu+k^2\\sigma^2/2}$<\/span>（すべての <span class=\"math-inline\">$k$<\/span> で存在）<\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td>存在しない（<span class=\"math-inline\">$t&gt;0$<\/span> で発散）<\/td>\n<\/tr>\n<tr>\n<td>中央値・最頻値<\/td>\n<td>中央値 <span class=\"math-inline\">$e^{\\mu}$<\/span>、最頻値 <span class=\"math-inline\">$e^{\\mu-\\sigma^2}$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>密度の <span class=\"math-inline\">$1/x$<\/span> は、変数変換 <span class=\"math-inline\">$Y=\\log X$<\/span> のヤコビアン <span class=\"math-inline\">$|dy/dx|=1/x$<\/span> から来ます。<\/li>\n<li><strong>モーメントの導出<\/strong>：<span class=\"math-inline\">$Y=\\log X\\sim N(\\mu,\\sigma^2)$<\/span> とすると <span class=\"math-inline\">$E[X^k]=E[e^{kY}]=M_Y(k)$<\/span> です。正規分布の MGF にそのまま <span class=\"math-inline\">$t=k$<\/span> を代入して <span class=\"math-inline\">$e^{k\\mu+k^2\\sigma^2/2}$<\/span> が得られます。<\/li>\n<li>分散は <span class=\"math-inline\">$E[X^2]-(E[X])^2=e^{2\\mu+2\\sigma^2}-e^{2\\mu+\\sigma^2}$<\/span> を整理したものです。<\/li>\n<li>大小関係は「最頻値 ＜ 中央値 ＜ 平均」です。右の裾が長いので、平均が少数の大きな値に引っ張られます。<\/li>\n<li>すべての次数のモーメントが存在するのに MGF は存在しない、という珍しい例です。<\/li>\n<\/ul>\n<p><strong>積の再生性<\/strong>。<span class=\"math-inline\">$X_1\\sim LN(\\mu_1,\\sigma_1^2)$<\/span>、<span class=\"math-inline\">$X_2\\sim LN(\\mu_2,\\sigma_2^2)$<\/span> が独立なら、対数の和が正規分布なので<\/p>\n<div class=\"math-display\">$$X_1X_2\\sim LN(\\mu_1+\\mu_2,\\ \\sigma_1^2+\\sigma_2^2)$$<\/div>\n<p>です。また <span class=\"math-inline\">$X^a\\sim LN(a\\mu,a^2\\sigma^2)$<\/span> です。和については再生性がありません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例：世帯所得の分布<\/strong><\/p>\n<p>ある地域の世帯所得（万円）が <span class=\"math-inline\">$\\log X\\sim N(\\log400,\\ 0.5^2)$<\/span> に従うとします。<\/p>\n<div class=\"math-display\">$$\\text{中央値}=400,\\qquad \\text{平均}=400e^{0.125}\\approx453.3,\\qquad \\text{最頻値}=400e^{-0.25}\\approx311.5$$<\/div>\n<p>標準偏差は <span class=\"math-inline\">$\\sqrt{400^2e^{0.25}(e^{0.25}-1)}\\approx241.6$<\/span> です。所得が800万円を超える世帯の割合は<\/p>\n<div class=\"math-display\">$$P(X&gt;800)=P\\!\\left(Z&gt;\\frac{\\log800-\\log400}{0.5}\\right)=P(Z&gt;1.3863)\\approx0.0828$$<\/div>\n<p>で、約 8.3% です。平均（453.3万円）を上回る世帯は <span class=\"math-inline\">$P(Z&gt;0.25)\\approx0.401$<\/span> で半数に届きません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>金融・保険<\/strong>：株価のモデル（幾何ブラウン運動）では、一定期間後の株価が対数正規分布に従います。オプション価格の理論の基礎です。<\/li>\n<li><strong>行政・調査<\/strong>：所得や資産の分布を近似し、平均と中央値の差（格差の目安）を説明するのに使います。<\/li>\n<li><strong>医療<\/strong>：薬物の血中濃度や感染症の潜伏期間は右に歪むことが多く、対数変換して正規分布の手法で解析します。<\/li>\n<li><strong>製造・品質管理<\/strong>：粉体の粒径分布や、疲労による故障時間のモデルとして使われます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p><span class=\"math-inline\">$\\sigma$<\/span> を 0.1 付近にすると正規分布とほぼ同じ形ですが、大きくしていくと右の裾が伸び、山が左に寄っていきます。<span class=\"math-inline\">$\\mu$<\/span> を動かすと、形を保ったまま横軸方向に <span class=\"math-inline\">$e^\\mu$<\/span> 倍に伸縮します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$E[X]=e^{\\mu+\\sigma^2/2}$<\/span> を「正規分布の MGF に <span class=\"math-inline\">$t=1$<\/span> を代入」で導けるようにします。<\/li>\n<li>パラメータ <span class=\"math-inline\">$\\mu,\\sigma^2$<\/span> は <span class=\"math-inline\">$\\log X$<\/span> の平均・分散であって、<span class=\"math-inline\">$X$<\/span> の平均・分散ではないことを確認します。<\/li>\n<li>確率の計算は、対数をとって標準化するだけです。<\/li>\n<li>中央値 <span class=\"math-inline\">$e^\\mu$<\/span> と平均 <span class=\"math-inline\">$e^{\\mu+\\sigma^2/2}$<\/span> の違いは、対数変換したデータの平均を元の尺度に戻すときに重要です（戻した値は中央値の推定になります）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$E[X]=e^{\\mu}$<\/span> → ○ <span class=\"math-inline\">$e^{\\mu}$<\/span> は中央値で、平均は <span class=\"math-inline\">$e^{\\mu+\\sigma^2/2}$<\/span> です（ジェンセンの不等式から <span class=\"math-inline\">$E[e^Y]&gt;e^{E[Y]}$<\/span>）。<\/li>\n<li>× <span class=\"math-inline\">$LN(\\mu,\\sigma^2)$<\/span> の平均が <span class=\"math-inline\">$\\mu$<\/span> → ○ <span class=\"math-inline\">$\\mu$<\/span> は <span class=\"math-inline\">$\\log X$<\/span> の平均です。<\/li>\n<li>× 独立な対数正規の和も対数正規 → ○ 積は対数正規ですが、和は一般に対数正規になりません。<\/li>\n<\/ul><\/section>","text":"一言でいうと 対数をとると正規分布になる、正の値だけをとる右に歪んだ分布です。 「多くの要因が掛け算で効く」量（所得、資産価格、粒子の大きさ、病気の潜伏期間など）のモデルとして使われます。 定義・数式 のとき、 は対数正規分布に従うといい、 と書きます。 は ではなく の平均と分散です。密度関数は 項目 内容 台 パラメータ 、 期待値 分散 次モーメント （すべての で存在） モーメント母関数 存在しない（ で発散） 中央値・最頻値 中央値 、最頻値 数式の読み解き - 密度の は、変数変換 のヤコビアン から来ます。 - モーメントの導出： とすると です。正規分布の MGF にそのまま を代入して が得られます。 - 分散は を整理したものです。 - 大小関係は「最頻値 ＜ 中央値 ＜ 平均」です。右の裾が長いので、平均が少数の大きな値に引っ張られます。 - すべての次数のモーメントが存在するのに MGF は存在しない、という珍しい例です。 積の再生性。 、 が独立なら、対数の和が正規分布なので です。また です。和については再生性がありません。 具体例 例：世帯所得の分布 ある地域の世帯所得（万円）が に従うとします。 標準偏差は です。所得が800万円を超える世帯の割合は で、約 8.3% です。平均（453.3万円）を上回る世帯は で半数に届きません。 現場での使われ方 - 金融・保険：株価のモデル（幾何ブラウン運動）では、一定期間後の株価が対数正規分布に従います。オプション価格の理論の基礎です。 - 行政・調査：所得や資産の分布を近似し、平均と中央値の差（格差の目安）を説明するのに使います。 - 医療：薬物の血中濃度や感染症の潜伏期間は右に歪むことが多く、対数変換して正規分布の手法で解析します。 - 製造・品質管理：粉体の粒径分布や、疲労による故障時間のモデルとして使われます。 グラフ・イメージ を 0.1 付近にすると正規分布とほぼ同じ形ですが、大きくしていくと右の裾が伸び、山が左に寄っていきます。 を動かすと、形を保ったまま横軸方向に 倍に伸縮します。 試験のポイント - を「正規分布の MGF に を代入」で導けるようにします。 - パラメータ は の平均・分散であって、 の平均・分散ではないことを確認します。 - 確率の計算は、対数をとって標準化するだけです。 - 中央値 と平均 の違いは、対数変換したデータの平均を元の尺度に戻すときに重要です（戻した値は中央値の推定になります）。 よくある間違い - × → ○ は中央値で、平均は です（ジェンセンの不等式から ）。 - × の平均が → ○ は の平均です。 - × 独立な対数正規の和も対数正規 → ○ 積は対数正規ですが、和は一般に対数正規になりません。"},"normal-distribution":{"id":"normal-distribution","title":"正規分布","reading":"せいきぶんぷ","en":"Normal distribution","aliases":["ガウス分布","Gaussian distribution","N(μ,σ²)"],"chapter":6,"importance":"A","tags":["連続型分布","再生性","中心極限定理","モーメント母関数"],"related":["standard-normal-distribution","moment-generating-function","central-limit-theorem","chi-squared-distribution","bivariate-normal-distribution","lognormal-distribution"],"charts":[{"type":"pdf","dist":"norm","params":{"mu":0,"sigma":1},"sliders":[{"param":"mu","label":"平均 μ","min":-3,"max":3,"step":0.1},{"param":"sigma","label":"標準偏差 σ","min":0.3,"max":3,"step":0.1}],"x":{"min":-8,"max":8},"compare":[{"dist":"norm","params":{"mu":0,"sigma":1},"label":"標準正規 N(0,1)"}],"caption":"μ を動かすと山がそのまま左右に平行移動し、σ を大きくすると山が低く横に広がる。曲線の下の面積はいつも1。"},{"type":"pdf-cdf","dist":"norm","params":{"mu":0,"sigma":1},"x":{"min":-4,"max":4},"caption":"x を動かすと、密度の左側の面積（色付き）がそのまま累積分布関数の高さになる。±1σ で約68%、±2σ で約95%。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>平均のまわりに左右対称な釣鐘形をした、統計学で最も基本となる連続型分布です。\n多くの小さな要因が足し合わさった量は正規分布に近づく（中心極限定理）ため、測定誤差や標本平均のモデルとして広く使われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p><span class=\"math-inline\">$\\mu \\in \\mathbb{R}$<\/span>、<span class=\"math-inline\">$\\sigma &gt; 0$<\/span> とします。確率変数 <span class=\"math-inline\">$X$<\/span> の密度関数が<\/p>\n<div class=\"math-display\">$$f(x) = \\frac{1}{\\sqrt{2\\pi}\\,\\sigma}\\exp\\!\\left\\{-\\frac{(x-\\mu)^2}{2\\sigma^2}\\right\\}, \\qquad -\\infty &lt; x &lt; \\infty$$<\/div>\n<p>のとき、<span class=\"math-inline\">$X$<\/span> は平均 <span class=\"math-inline\">$\\mu$<\/span>、分散 <span class=\"math-inline\">$\\sigma^2$<\/span> の正規分布に従うといい、<span class=\"math-inline\">$X \\sim N(\\mu, \\sigma^2)$<\/span> と書きます。第2引数は<strong>分散<\/strong>です（標準偏差ではありません）。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(-\\infty, \\infty)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td><span class=\"math-inline\">$\\mu$<\/span>（位置）、<span class=\"math-inline\">$\\sigma^2&gt;0$<\/span>（尺度）<\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$\\mu$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$\\sigma^2$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t)=\\exp\\!\\left(\\mu t + \\tfrac{1}{2}\\sigma^2 t^2\\right)$<\/span>（すべての <span class=\"math-inline\">$t$<\/span> で存在）<\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t)=\\exp\\!\\left(i\\mu t - \\tfrac{1}{2}\\sigma^2 t^2\\right)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>歪度・尖度<\/td>\n<td>歪度 0、尖度 3（超過尖度 0）<\/td>\n<\/tr>\n<tr>\n<td>中央値・最頻値<\/td>\n<td>どちらも <span class=\"math-inline\">$\\mu$<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\mu$<\/span>：山の中心の位置。期待値・中央値・最頻値がすべて一致します。<\/li>\n<li><span class=\"math-inline\">$\\sigma$<\/span>：山の幅。変曲点は <span class=\"math-inline\">$\\mu \\pm \\sigma$<\/span> にあります。<\/li>\n<li><span class=\"math-inline\">$\\frac{1}{\\sqrt{2\\pi}\\sigma}$<\/span>：全体の面積を1にするための定数です。ガウス積分 <span class=\"math-inline\">$\\int_{-\\infty}^{\\infty} e^{-z^2/2}dz=\\sqrt{2\\pi}$<\/span> から来ています。<\/li>\n<li>指数部分 <span class=\"math-inline\">$-(x-\\mu)^2/(2\\sigma^2)$<\/span>：中心からの距離の2乗に比例して、密度が急速に小さくなります。<\/li>\n<\/ul>\n<p><strong>モーメント母関数の導出<\/strong>。<span class=\"math-inline\">$Z=(X-\\mu)/\\sigma$<\/span> とおくと、<span class=\"math-inline\">$Z \\sim N(0,1)$<\/span> です。<\/p>\n<div class=\"math-display\">$$M_Z(t)=\\int_{-\\infty}^{\\infty} e^{tz}\\frac{1}{\\sqrt{2\\pi}}e^{-z^2/2}dz\n= e^{t^2/2}\\int_{-\\infty}^{\\infty}\\frac{1}{\\sqrt{2\\pi}}e^{-(z-t)^2/2}dz = e^{t^2/2}$$<\/div>\n<p>指数の中で平方完成 <span class=\"math-inline\">$tz - z^2/2 = -(z-t)^2/2 + t^2/2$<\/span> を使いました。<span class=\"math-inline\">$X=\\mu+\\sigma Z$<\/span> なので <span class=\"math-inline\">$M_X(t)=e^{\\mu t}M_Z(\\sigma t)=\\exp(\\mu t+\\sigma^2t^2/2)$<\/span> です。<\/p>\n<p>キュムラント母関数 <span class=\"math-inline\">$K(t)=\\log M(t)=\\mu t+\\sigma^2 t^2/2$<\/span> を微分すると、<span class=\"math-inline\">$K'(0)=\\mu$<\/span>、<span class=\"math-inline\">$K''(0)=\\sigma^2$<\/span> がすぐに出ます。3次以上のキュムラントがすべて0なのが正規分布の特徴です。<\/p>\n<p><strong>再生性と線形変換<\/strong>。<span class=\"math-inline\">$X_1 \\sim N(\\mu_1,\\sigma_1^2)$<\/span>、<span class=\"math-inline\">$X_2 \\sim N(\\mu_2,\\sigma_2^2)$<\/span> が独立なら、MGF の積は<\/p>\n<div class=\"math-display\">$$M_{X_1+X_2}(t)=\\exp\\!\\left\\{(\\mu_1+\\mu_2)t+\\tfrac{1}{2}(\\sigma_1^2+\\sigma_2^2)t^2\\right\\}$$<\/div>\n<p>となり、<span class=\"math-inline\">$X_1+X_2 \\sim N(\\mu_1+\\mu_2,\\ \\sigma_1^2+\\sigma_2^2)$<\/span> です。また <span class=\"math-inline\">$aX+b \\sim N(a\\mu+b,\\ a^2\\sigma^2)$<\/span> です。\nこの結果から、<span class=\"math-inline\">$X_1,\\dots,X_n$<\/span> が独立に <span class=\"math-inline\">$N(\\mu,\\sigma^2)$<\/span> に従うとき、標本平均は <span class=\"math-inline\">$\\bar X \\sim N(\\mu, \\sigma^2/n)$<\/span> になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：製造ラインの重量検査<\/strong><\/p>\n<p>袋詰めの重量が <span class=\"math-inline\">$X \\sim N(500, 4^2)$<\/span>（単位 g）とします。<\/p>\n<div class=\"math-display\">$$P(X&lt;492)=P\\!\\left(Z&lt;\\frac{492-500}{4}\\right)=\\Phi(-2)\\approx 0.0228$$<\/div>\n<div class=\"math-display\">$$P(495&lt;X&lt;505)=\\Phi(1.25)-\\Phi(-1.25)\\approx 0.7887$$<\/div>\n<p>492 g 未満の不良は約 2.3%、規格 <span class=\"math-inline\">$500\\pm5$<\/span> g に入るのは約 78.9% です。<\/p>\n<p><strong>例2：独立な正規変数の和<\/strong><\/p>\n<p><span class=\"math-inline\">$X \\sim N(50, 10^2)$<\/span> と <span class=\"math-inline\">$Y \\sim N(60, 15^2)$<\/span> が独立なとき、<span class=\"math-inline\">$X+Y \\sim N(110,\\ 100+225)=N(110, 325)$<\/span> です。標準偏差は <span class=\"math-inline\">$\\sqrt{325}\\approx 18.028$<\/span> なので、<\/p>\n<div class=\"math-display\">$$P(X+Y&gt;130)=1-\\Phi\\!\\left(\\frac{20}{18.028}\\right)=1-\\Phi(1.1094)\\approx 0.1336$$<\/div>\n<p>標準偏差を足して <span class=\"math-inline\">$10+15=25$<\/span> とするのは誤りです。足すのは分散です。<\/p>\n<p><strong>例3：標本平均の分布<\/strong><\/p>\n<p>例1のラインから16袋を取り出すと、<span class=\"math-inline\">$\\bar X \\sim N(500, 16/16)=N(500,1)$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(|\\bar X-500|&gt;2)=2\\Phi(-2)\\approx 0.0455$$<\/div>\n<p>1袋なら <span class=\"math-inline\">$\\pm 2$<\/span> g を外れるのは珍しくありませんが、16袋の平均では約 4.6% しか起こりません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：寸法や重量が正規分布に従うとみなし、規格外になる割合（不良率）を見積もります。管理図の <span class=\"math-inline\">$\\pm3\\sigma$<\/span> の管理限界も正規分布が根拠です。<\/li>\n<li><strong>医療<\/strong>：血液検査の基準範囲は、健康な人の測定値（必要なら対数変換したもの）の平均 <span class=\"math-inline\">$\\pm 1.96$<\/span> 標準偏差、つまり中央の 95% で決めることが多いです。<\/li>\n<li><strong>金融・保険<\/strong>：資産収益率を正規分布で近似し、一定確率で起こりうる損失額（VaR）を計算します。ただし裾が重い現実のデータでは過小評価になる点に注意が必要です。<\/li>\n<li><strong>行政・調査<\/strong>：世論調査の支持率の誤差は、中心極限定理により正規近似で評価します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目のグラフでは、<span class=\"math-inline\">$\\mu$<\/span> が位置だけを、<span class=\"math-inline\">$\\sigma$<\/span> が広がりだけを決めることを確かめてください。比較用の標準正規分布と重ねると、<span class=\"math-inline\">$\\sigma$<\/span> が2倍になると山の高さが半分になることがわかります。\n2つ目のグラフでは、<span class=\"math-inline\">$x$<\/span> を動かして左側の面積と累積分布関数の値が連動する様子を見ます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>標準化 <span class=\"math-inline\">$Z=(X-\\mu)/\\sigma$<\/span> をして標準正規分布表を引く計算は、あらゆる章の基礎です。<\/li>\n<li>MGF <span class=\"math-inline\">$\\exp(\\mu t+\\sigma^2t^2/2)$<\/span> は暗記し、平方完成による導出も書けるようにします。<\/li>\n<li>再生性（独立な正規の和は正規）と線形変換の結果から、<span class=\"math-inline\">$\\bar X \\sim N(\\mu,\\sigma^2/n)$<\/span> を導けるようにします。<\/li>\n<li>他の分布との関係：標準正規の2乗和 → カイ二乗分布、正規とカイ二乗の比 → t分布、<span class=\"math-inline\">$e^X$<\/span> → 対数正規分布、二項・ポアソンの正規近似。<\/li>\n<li>正規母集団では <span class=\"math-inline\">$\\bar X$<\/span> と <span class=\"math-inline\">$S^2$<\/span> が独立で、<span class=\"math-inline\">$(n-1)S^2/\\sigma^2 \\sim \\chi^2(n-1)$<\/span> です。これが t 統計量の出発点になります。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$N(\\mu,\\sigma^2)$<\/span> の第2引数を標準偏差と読む → ○ 分散です。<span class=\"math-inline\">$N(500,16)$<\/span> なら標準偏差は 4 です。<\/li>\n<li>× 独立な正規変数の和で標準偏差を足す → ○ 分散を足してから平方根をとります。<\/li>\n<li>× 差 <span class=\"math-inline\">$X-Y$<\/span> の分散を <span class=\"math-inline\">$\\sigma_X^2-\\sigma_Y^2$<\/span> とする → ○ <span class=\"math-inline\">$\\sigma_X^2+\\sigma_Y^2$<\/span> です（独立なとき）。<\/li>\n<li>× 無相関なら（周辺がそれぞれ正規であるだけで）独立 → ○ 独立と言えるのは、<span class=\"math-inline\">$(X,Y)$<\/span> が2変量正規分布に従う場合です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 平均のまわりに左右対称な釣鐘形をした、統計学で最も基本となる連続型分布です。 多くの小さな要因が足し合わさった量は正規分布に近づく（中心極限定理）ため、測定誤差や標本平均のモデルとして広く使われます。 定義・数式 、 とします。確率変数 の密度関数が のとき、 は平均 、分散 の正規分布に従うといい、 と書きます。第2引数は分散です（標準偏差ではありません）。 項目 内容 台 パラメータ （位置）、 （尺度） 期待値 分散 モーメント母関数 （すべての で存在） 特性関数 歪度・尖度 歪度 0、尖度 3（超過尖度 0） 中央値・最頻値 どちらも 数式の読み解き - ：山の中心の位置。期待値・中央値・最頻値がすべて一致します。 - ：山の幅。変曲点は にあります。 - ：全体の面積を1にするための定数です。ガウス積分 から来ています。 - 指数部分 ：中心からの距離の2乗に比例して、密度が急速に小さくなります。 モーメント母関数の導出。 とおくと、 です。 指数の中で平方完成 を使いました。 なので です。 キュムラント母関数 を微分すると、 、 がすぐに出ます。3次以上のキュムラントがすべ 1の正規分布です。\nどんな正規分布も「平均を引いて標準偏差で割る（標準化）」とこの分布になるので、確率の計算や検定・信頼区間はすべてこの分布の表（またはその分位点）に帰着します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>密度関数を <span class=\"math-inline\">$\\phi(z)$<\/span>、累積分布関数を <span class=\"math-inline\">$\\Phi(z)$<\/span> と書きます。<\/p>\n<div class=\"math-display\">$$\\phi(z)=\\frac{1}{\\sqrt{2\\pi}}e^{-z^2/2}, \\qquad \\Phi(z)=\\int_{-\\infty}^{z}\\phi(u)\\,du, \\qquad -\\infty&lt;z&lt;\\infty$$<\/div>\n<p><span class=\"math-inline\">$X \\sim N(\\mu,\\sigma^2)$<\/span> なら <span class=\"math-inline\">$Z=(X-\\mu)/\\sigma \\sim N(0,1)$<\/span> です。これを<strong>標準化<\/strong>といいます。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>台<\/td>\n<td><span class=\"math-inline\">$(-\\infty,\\infty)$<\/span><\/td>\n<\/tr>\n<tr>\n<td>パラメータ<\/td>\n<td>なし<\/td>\n<\/tr>\n<tr>\n<td>期待値<\/td>\n<td><span class=\"math-inline\">$0$<\/span><\/td>\n<\/tr>\n<tr>\n<td>分散<\/td>\n<td><span class=\"math-inline\">$1$<\/span><\/td>\n<\/tr>\n<tr>\n<td>モーメント母関数<\/td>\n<td><span class=\"math-inline\">$M(t)=e^{t^2/2}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>特性関数<\/td>\n<td><span class=\"math-inline\">$\\varphi(t)=e^{-t^2/2}$<\/span><\/td>\n<\/tr>\n<tr>\n<td>奇数次モーメント<\/td>\n<td>すべて 0<\/td>\n<\/tr>\n<tr>\n<td>偶数次モーメント<\/td>\n<td><span class=\"math-inline\">$E[Z^{2k}]=(2k-1)(2k-3)\\cdots 3\\cdot 1$<\/span>（<span class=\"math-inline\">$E[Z^4]=3$<\/span>）<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>上側 <span class=\"math-inline\">$100\\alpha$<\/span>% 点 <span class=\"math-inline\">$z_\\alpha$<\/span> は <span class=\"math-inline\">$P(Z&gt;z_\\alpha)=\\alpha$<\/span> を満たす点です。よく使う値は <span class=\"math-inline\">$z_{0.05}=1.645$<\/span>、<span class=\"math-inline\">$z_{0.025}=1.960$<\/span>、<span class=\"math-inline\">$z_{0.005}=2.576$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\phi(z)$<\/span> は <span class=\"math-inline\">$z=0$<\/span> で最大値 <span class=\"math-inline\">$1/\\sqrt{2\\pi}\\approx 0.3989$<\/span> をとり、左右対称です。<\/li>\n<li>対称性から <span class=\"math-inline\">$\\Phi(-z)=1-\\Phi(z)$<\/span> です。正規分布表が <span class=\"math-inline\">$z\\ge0$<\/span> の部分しか載せていないのはこのためです。<\/li>\n<li><span class=\"math-inline\">$\\Phi(z)$<\/span> は初等関数で書けません。だから表や計算機を使います。<\/li>\n<li>標準化 <span class=\"math-inline\">$Z=(X-\\mu)/\\sigma$<\/span> は「平均から標準偏差いくつ分離れているか」という単位のない量です。単位や尺度の違うデータどうしを、同じ物差しで比べられるようになります。<\/li>\n<li>正規分布の線形変換はまた正規分布なので、標準化しても形は変わらず、位置と目盛りだけが変わります。<\/li>\n<\/ul>\n<p><strong>偶数次モーメントの導出<\/strong>。<span class=\"math-inline\">$\\phi'(z)=-z\\phi(z)$<\/span> を使って部分積分すると<\/p>\n<div class=\"math-display\">$$E[Z^{n}]=\\int z^{n-1}\\cdot z\\phi(z)\\,dz=\\Big[-z^{n-1}\\phi(z)\\Big]_{-\\infty}^{\\infty}+(n-1)\\int z^{n-2}\\phi(z)\\,dz=(n-1)E[Z^{n-2}]$$<\/div>\n<p>となります。<span class=\"math-inline\">$E[Z^0]=1$<\/span> から <span class=\"math-inline\">$E[Z^2]=1$<\/span>、<span class=\"math-inline\">$E[Z^4]=3$<\/span>、<span class=\"math-inline\">$E[Z^6]=15$<\/span> と順に求まります。<span class=\"math-inline\">$E[Z^4]=3$<\/span> が「正規分布の尖度は3」の根拠です。<\/p>\n<p>MGF <span class=\"math-inline\">$e^{t^2/2}=\\sum_{k} \\frac{t^{2k}}{2^k k!}$<\/span> と展開して <span class=\"math-inline\">$t^{2k}/(2k)!$<\/span> の係数を比べても、<span class=\"math-inline\">$E[Z^{2k}]=\\frac{(2k)!}{2^k k!}$<\/span> が得られます。<\/p>\n<p><strong><span class=\"math-inline\">$Z^2$<\/span> の分布<\/strong>。<span class=\"math-inline\">$Y=Z^2$<\/span> の累積分布関数は <span class=\"math-inline\">$P(Y\\le y)=P(-\\sqrt y\\le Z\\le \\sqrt y)=2\\Phi(\\sqrt y)-1$<\/span> です。微分すると<\/p>\n<div class=\"math-display\">$$f_Y(y)=\\frac{1}{\\sqrt{y}}\\phi(\\sqrt y)=\\frac{1}{\\sqrt{2\\pi}}\\,y^{-1/2}e^{-y/2}, \\qquad y&gt;0$$<\/div>\n<p>これは自由度1のカイ二乗分布です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：模試の偏差値<\/strong><\/p>\n<p>偏差値は「得点を標準化して <span class=\"math-inline\">$50+10Z$<\/span> にしたもの」です。得点が正規分布に従うとき、偏差値65以上の割合は<\/p>\n<div class=\"math-display\">$$P(Z\\ge 1.5)=1-\\Phi(1.5)=1-0.9332=0.0668$$<\/div>\n<p>で、約 6.7% です。偏差値40〜70（<span class=\"math-inline\">$-1&lt;Z&lt;2$<\/span>）の割合は <span class=\"math-inline\">$\\Phi(2)-\\Phi(-1)=0.9772-0.1587\\approx 0.8186$<\/span> です。<\/p>\n<p><strong>例2：68-95-99.7 ルール<\/strong><\/p>\n<div class=\"math-display\">$$P(|Z|&lt;1)\\approx 0.6827,\\quad P(|Z|&lt;2)\\approx 0.9545,\\quad P(|Z|&lt;3)\\approx 0.9973$$<\/div>\n<p><strong>例3：絶対値の期待値<\/strong><\/p>\n<div class=\"math-display\">$$E[|Z|]=2\\int_0^\\infty z\\phi(z)\\,dz=2\\Big[-\\phi(z)\\Big]_0^\\infty=2\\phi(0)=\\sqrt{\\frac{2}{\\pi}}\\approx 0.7979$$<\/div>\n<p>平均絶対偏差は標準偏差の約 0.80 倍です。<\/p>\n<p><strong>例4：検定統計量から p 値を求める<\/strong><\/p>\n<p>母分散が既知の平均の検定で、標準化した検定統計量が <span class=\"math-inline\">$z=2.3$<\/span> になったとします。帰無仮説のもとで <span class=\"math-inline\">$Z\\sim N(0,1)$<\/span> なので、<\/p>\n<div class=\"math-display\">$$\\text{片側 p 値}=1-\\Phi(2.3)\\approx 0.0107,\\qquad \\text{両側 p 値}=2\\{1-\\Phi(2.3)\\}\\approx 0.0214$$<\/div>\n<p>どちらも 0.05 を下回るので、有意水準 5% で帰無仮説を棄却します。両側 p 値は片側の2倍になる点に注意します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：工程能力指数や <span class=\"math-inline\">$3\\sigma$<\/span> 管理限界は、標準化した値が <span class=\"math-inline\">$\\pm3$<\/span> を超える確率（約 0.27%）を基準にしています。<\/li>\n<li><strong>医療<\/strong>：小児の身長・体重を、同じ月齢の分布で標準化した「Zスコア（SDスコア）」で評価します。<\/li>\n<li><strong>行政・調査<\/strong>：信頼係数 95% の区間の「1.96」は、標準正規分布の上側 2.5% 点です。<\/li>\n<li><strong>IT・Webサービス<\/strong>：異常検知で、指標を標準化して <span class=\"math-inline\">$|z|&gt;3$<\/span> のデータを外れ値候補として通知します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目は密度と累積分布関数を並べた図です。<span class=\"math-inline\">$x$<\/span> を動かすと、左側の面積がそのまま <span class=\"math-inline\">$\\Phi(x)$<\/span> になることがわかります。\n2つ目の累積分布関数では、高さ 0.975 に対応する横軸の値が 1.96 であることを確認してください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$z_{0.05}=1.645$<\/span>、<span class=\"math-inline\">$z_{0.025}=1.96$<\/span>、<span class=\"math-inline\">$z_{0.005}=2.576$<\/span> は暗記します。<\/li>\n<li><span class=\"math-inline\">$\\Phi(-z)=1-\\Phi(z)$<\/span> を使って、両側確率を片側の表から求めます。<\/li>\n<li><span class=\"math-inline\">$Z^2 \\sim \\chi^2(1)$<\/span> の導出（累積分布関数を経由する変数変換）は典型的です。<span class=\"math-inline\">$1.96^2\\approx 3.841$<\/span> が <span class=\"math-inline\">$\\chi^2(1)$<\/span> の上側 5% 点になっていることも確認できます。<\/li>\n<li>標準正規分布の確率 <span class=\"math-inline\">$P(a&lt;Z&lt;b)=\\Phi(b)-\\Phi(a)$<\/span> を表から求め、<span class=\"math-inline\">$N(\\mu,\\sigma^2)$<\/span> の確率に直す計算は、ほぼすべての検定・推定問題の最後の一歩です。<\/li>\n<li><span class=\"math-inline\">$E[Z^4]=3$<\/span> を使って <span class=\"math-inline\">$V[Z^2]=3-1=2$<\/span> を求める計算がよく使われます（<span class=\"math-inline\">$\\chi^2(1)$<\/span> の分散が2になる理由）。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 上側 <span class=\"math-inline\">$\\alpha$<\/span> 点と下側 <span class=\"math-inline\">$\\alpha$<\/span> 点を取り違える → ○ <span class=\"math-inline\">$z_{0.025}=1.96$<\/span> は「右側の面積が 0.025」の点で、<span class=\"math-inline\">$\\Phi(1.96)=0.975$<\/span> です。<\/li>\n<li>× 両側検定で <span class=\"math-inline\">$z_{0.05}=1.645$<\/span> を使う → ○ 両側 5% なら片側に 2.5% ずつなので 1.96 です。<\/li>\n<li>× 標準化で分散で割る → ○ 割るのは標準偏差 <span class=\"math-inline\">$\\sigma$<\/span> です。<\/li>\n<li>× <span class=\"math-inline\">$\\Phi(-1.5)$<\/span> を表から直接引こうとして迷う → ○ 対称性 <span class=\"math-inline\">$\\Phi(-1.5)=1-\\Phi(1.5)=0.0668$<\/span> を使います。負の値は必ず正の値に直してから表を引きます。<\/li>\n<\/ul><\/section>","text":"一言でいうと 平均0・分散1の正規分布です。 どんな正規分布も「平均を引いて標準偏差で割る（標準化）」とこの分布になるので、確率の計算や検定・信頼区間はすべてこの分布の表（またはその分位点）に帰着します。 定義・数式 密度関数を 、累積分布関数を と書きます。 なら です。これを標準化といいます。 項目 内容 台 パラメータ なし 期待値 分散 モーメント母関数 特性関数 奇数次モーメント すべて 0 偶数次モーメント （ ） 上側 % 点 は を満たす点です。よく使う値は 、 、 です。 数式の読み解き - は で最大値
