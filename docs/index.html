<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>準1級 用語辞典</title>
<style>
  :root { --bg: #f7f8f6; --fg: #1f2a24; --muted: #5d6b63; --line: #d5ddd7; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141a17; --fg: #e3ebe6; --muted: #9aa9a0; --line: #2c3631; color-scheme: dark; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans", "BIZ UDPGothic", "Noto Sans JP", system-ui, sans-serif;
    padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right));
  }
  main { max-width: 32rem; border-top: 1px solid var(--line); padding-top: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; text-wrap: balance; }
  p { color: var(--muted); line-height: 1.8; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>統計検定準1級 用語辞典</h1>
  <p>ただいま作成中です。章ができあがるたびに、このページが自動で更新されます。</p>
  <p>しばらくしてから再読み込みしてください。</p>
</main>
</body>
</html>
