s":["多変量","連続型","条件付き分布","条件付き期待値","2変量正規分布"],"related":["joint-probability-density-function","marginal-probability-density-function","conditional-probability-function","conditional-expectation","conditional-variance","bivariate-normal-distribution"],"charts":[{"type":"pdf","dist":"norm","params":{"mu":64.8,"sigma":6.4},"sliders":[{"param":"mu","label":"条件付き平均","min":50,"max":75,"step":0.4},{"param":"sigma","label":"条件付き標準偏差","min":2,"max":10,"step":0.2}],"x":{"min":30,"max":95},"compare":[{"dist":"norm","params":{"mu":60,"sigma":8},"label":"周辺分布 N(60, 8²)"}],"caption":"実線は身長176cmの人の体重の条件付き密度、破線は全体の体重の周辺密度。条件を付けると中心がずれ、幅が狭くなる。"},{"type":"scatter","model":"bvnorm","params":{"rho":0.6,"n":500},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"x をある値に固定して縦に細く切った帯の中の点の分布が、条件付き分布。|ρ| が大きいほど帯の中の点の散らばりが小さい。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>一方の連続型確率変数の値がわかったときの、もう一方の変数の密度です。\n同時密度の「切り口」を、面積が1になるように割り直したものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>連続型確率変数 <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率密度関数を <span class=\"math-inline\">$f(x,y)$<\/span>、<span class=\"math-inline\">$X$<\/span> の周辺確率密度関数を <span class=\"math-inline\">$f_X(x)$<\/span> とします。\n<span class=\"math-inline\">$f_X(x)&gt;0$<\/span> である <span class=\"math-inline\">$x$<\/span> について、<span class=\"math-inline\">$X=x$<\/span> が与えられたときの <span class=\"math-inline\">$Y$<\/span> の条件付き確率密度関数は<\/p>\n<div class=\"math-display\">$$f(y\\mid x) = \\frac{f(x,y)}{f_X(x)}$$<\/div>\n<p>です。<span class=\"math-inline\">$x$<\/span> を固定すると <span class=\"math-inline\">$y$<\/span> の密度になり、<span class=\"math-inline\">$\\int f(y\\mid x)\\,dy=1$<\/span> を満たします。<\/p>\n<p>条件付き確率・条件付き期待値は、この密度で計算します。<\/p>\n<div class=\"math-display\">$$P(Y\\in B\\mid X=x) = \\int_B f(y\\mid x)\\,dy,\\qquad E[Y\\mid X=x] = \\int_{-\\infty}^{\\infty} y\\,f(y\\mid x)\\,dy$$<\/div>\n<p>同時密度は <span class=\"math-inline\">$f(x,y)=f(y\\mid x)f_X(x)=f(x\\mid y)f_Y(y)$<\/span> と分解できます。\n<span class=\"math-inline\">$X,Y$<\/span> が独立であることは、<span class=\"math-inline\">$f(y\\mid x)=f_Y(y)$<\/span> がすべての <span class=\"math-inline\">$x$<\/span> で成り立つことと同じです。<\/p>\n<p><strong>2変量正規分布の条件付き分布<\/strong>（重要）：<span class=\"math-inline\">$(X,Y)$<\/span> が平均 <span class=\"math-inline\">$\\mu_X,\\mu_Y$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma_X,\\sigma_Y$<\/span>、相関係数 <span class=\"math-inline\">$\\rho$<\/span> の2変量正規分布に従うとき、<\/p>\n<div class=\"math-display\">$$Y\\mid X=x \\ \\sim\\ N\\left(\\mu_Y + \\rho\\frac{\\sigma_Y}{\\sigma_X}(x-\\mu_X),\\ \\ \\sigma_Y^2(1-\\rho^2)\\right)$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$f(x,y)$<\/span> を <span class=\"math-inline\">$x$<\/span> で固定したもの：同時密度の曲面を <span class=\"math-inline\">$x$<\/span> の位置で縦に切った切り口の曲線です。<\/li>\n<li><span class=\"math-inline\">$f_X(x)$<\/span> で割る：切り口の面積は <span class=\"math-inline\">$f_X(x)$<\/span> なので、これで割ると面積1の密度になります。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$P(X=x)=0$<\/span> なのに「<span class=\"math-inline\">$X=x$<\/span> という条件」を付けられるのは、<span class=\"math-inline\">$x\\le X\\le x+\\Delta x$<\/span> という細い帯で条件付けて <span class=\"math-inline\">$\\Delta x\\to0$<\/span> とした極限と考えるからです。<\/p>\n<div class=\"math-display\">$$P(Y\\le y\\mid x\\le X\\le x+\\Delta x) \\approx \\frac{\\int_{-\\infty}^{y} f(x,v)\\,\\Delta x\\,dv}{f_X(x)\\,\\Delta x} = \\int_{-\\infty}^{y} \\frac{f(x,v)}{f_X(x)}\\,dv$$<\/div>\n<p>2変量正規分布の結果は、平均が <span class=\"math-inline\">$x$<\/span> の1次式（回帰直線）になり、分散は <span class=\"math-inline\">$x$<\/span> によらず <span class=\"math-inline\">$1-\\rho^2$<\/span> 倍に縮む、と読めます。\n<span class=\"math-inline\">$\\rho$<\/span> が <span class=\"math-inline\">$\\pm1$<\/span> に近いほど、<span class=\"math-inline\">$x$<\/span> を知ることで <span class=\"math-inline\">$Y$<\/span> の不確かさが大きく減ります。<\/p>\n<p>分解 <span class=\"math-inline\">$f(x,y)=f(y\\mid x)f_X(x)$<\/span> を使うと、逆向きの条件付き密度も求められます。<\/p>\n<div class=\"math-display\">$$f(x\\mid y) = \\frac{f(y\\mid x)\\,f_X(x)}{\\int f(y\\mid x')\\,f_X(x')\\,dx'}$$<\/div>\n<p>これは連続型のベイズの定理で、<span class=\"math-inline\">$x$<\/span> をパラメータ、<span class=\"math-inline\">$y$<\/span> をデータと読めば事後分布の式そのものです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：身長から体重を予測する<\/strong><\/p>\n<p>成人の身長 <span class=\"math-inline\">$X$<\/span>（cm）と体重 <span class=\"math-inline\">$Y$<\/span>（kg）が2変量正規分布に従い、<span class=\"math-inline\">$\\mu_X=170,\\ \\sigma_X=6,\\ \\mu_Y=60,\\ \\sigma_Y=8,\\ \\rho=0.6$<\/span> だとします。身長 176 cm の人の体重の条件付き分布は<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\nE[Y\\mid X=176] &amp;= 60+0.6\\times\\tfrac{8}{6}\\times(176-170) = 64.8\\\\\nV[Y\\mid X=176] &amp;= 8^2\\times(1-0.6^2) = 40.96 = 6.4^2\n\\end{aligned}$$<\/div>\n<p>体重が 70 kg を超える確率は<\/p>\n<div class=\"math-display\">$$P(Y&gt;70\\mid X=176) = P\\left(Z&gt;\\tfrac{70-64.8}{6.4}\\right) = P(Z&gt;0.8125)\\approx 0.2083$$<\/div>\n<p>身長の情報がないときの <span class=\"math-inline\">$P(Y&gt;70)=P(Z&gt;1.25)\\approx0.1056$<\/span> のおよそ2倍です。<\/p>\n<p><strong>例2：正方形上の密度で条件付ける<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=x+y\\ (0&lt;x&lt;1,\\,0&lt;y&lt;1)$<\/span>、<span class=\"math-inline\">$f_X(x)=x+\\tfrac12$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$f(y\\mid x) = \\frac{x+y}{x+\\tfrac12}\\quad(0&lt;y&lt;1)$$<\/div>\n<p><span class=\"math-inline\">$x=\\tfrac12$<\/span> なら <span class=\"math-inline\">$f(y\\mid\\tfrac12)=y+\\tfrac12$<\/span> です。<\/p>\n<div class=\"math-display\">$$P\\left(Y\\le\\tfrac12\\ \\middle|\\ X=\\tfrac12\\right) = \\int_0^{1/2}\\left(y+\\tfrac12\\right)dy = 0.375,\\qquad\nE\\left[Y\\ \\middle|\\ X=\\tfrac12\\right] = \\int_0^1 y\\left(y+\\tfrac12\\right)dy = \\tfrac{7}{12}\\approx0.5833$$<\/div>\n<p><strong>例3：三角形の台<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=2\\ (0&lt;y&lt;x&lt;1)$<\/span>、<span class=\"math-inline\">$f_X(x)=2x$<\/span> なら <span class=\"math-inline\">$f(y\\mid x)=\\dfrac{2}{2x}=\\dfrac1x\\ (0&lt;y&lt;x)$<\/span> で、<span class=\"math-inline\">$Y\\mid X=x$<\/span> は一様分布 <span class=\"math-inline\">$U(0,x)$<\/span> です。\nしたがって <span class=\"math-inline\">$E[Y\\mid X=x]=x/2$<\/span>、全体では <span class=\"math-inline\">$E[Y]=E[X/2]=\\tfrac12\\cdot\\tfrac23=\\tfrac13$<\/span> となり、周辺密度から直接求めた値と一致します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>医療<\/strong>：年齢や体格で条件付けた検査値の分布から「年齢別の基準範囲」を作ります。全体の分布で判定するより誤判定が減ります。<\/li>\n<li><strong>製造・品質管理<\/strong>：前工程の寸法で条件付けた後工程の寸法の分布を使い、前工程の測定値から最終製品の規格外れ確率を予測します。<\/li>\n<li><strong>IT・Webサービス<\/strong>：滞在時間で条件付けた購入金額の分布を推定し、滞在が長い利用者向けの推薦の効果を見積もります。<\/li>\n<li><strong>金融・保険<\/strong>：ある資産が大きく下落したという条件のもとでの、別の資産の損益分布を求めてストレステストを行います。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図では、条件付き密度（実線）が周辺密度（破線）より右にずれ、幅も狭くなっています。条件付き平均のスライダーを動かすと、身長の値を変えたときの体重分布の移動を再現できます。\n2つ目の散布図では、ρ を大きくすると、縦に切った帯の中の点の散らばりが小さくなります。これが条件付き分散 <span class=\"math-inline\">$\\sigma_Y^2(1-\\rho^2)$<\/span> の縮小です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>2変量正規分布の条件付き平均・条件付き分散の公式は必ず覚え、数値を代入して確率まで出せるようにします。条件付き平均の傾き <span class=\"math-inline\">$\\rho\\sigma_Y/\\sigma_X$<\/span> は回帰係数です。<\/li>\n<li>「<span class=\"math-inline\">$X$<\/span> の分布と、<span class=\"math-inline\">$X$<\/span> が与えられたときの <span class=\"math-inline\">$Y$<\/span> の条件付き分布」から同時密度を作り、周辺化して <span class=\"math-inline\">$Y$<\/span> の分布や期待値を求める階層型の問題は重要です。<\/li>\n<li><span class=\"math-inline\">$E[Y]=E[E[Y\\mid X]]$<\/span>、<span class=\"math-inline\">$V[Y]=E[V[Y\\mid X]]+V[E[Y\\mid X]]$<\/span> を使うと、<span class=\"math-inline\">$Y$<\/span> の周辺密度を求めずに期待値・分散が出せます。<\/li>\n<li>条件付き密度の台（例3の <span class=\"math-inline\">$0&lt;y&lt;x$<\/span>）を書き忘れないようにします。<\/li>\n<li>例：<span class=\"math-inline\">$X\\sim U(0,1)$<\/span>、<span class=\"math-inline\">$Y\\mid X=x\\sim U(0,x)$<\/span> なら、同時密度は <span class=\"math-inline\">$1/x\\ (0&lt;y&lt;x&lt;1)$<\/span>、<span class=\"math-inline\">$Y$<\/span> の周辺密度は <span class=\"math-inline\">$-\\log y$<\/span>、<span class=\"math-inline\">$E[Y]=E[X]/2=0.25$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$f(y\\mid x)$<\/span> を求めるとき <span class=\"math-inline\">$f_Y(y)$<\/span> で割る → ○ 条件側の変数 <span class=\"math-inline\">$X$<\/span> の周辺密度 <span class=\"math-inline\">$f_X(x)$<\/span> で割ります。<\/li>\n<li>× 2変量正規分布の条件付き分散を <span class=\"math-inline\">$\\sigma_Y^2\\rho^2$<\/span> とする → ○ <span class=\"math-inline\">$\\sigma_Y^2(1-\\rho^2)$<\/span> です。相関が強いほど小さくなります。<\/li>\n<li>× <span class=\"math-inline\">$f(y\\mid x)$<\/span> の積分範囲をいつも周辺の台全体にする → ○ 例3のように、条件付き密度の台は <span class=\"math-inline\">$x$<\/span> に依存することがあります。<\/li>\n<li>× 条件付き分散が <span class=\"math-inline\">$x$<\/span> によって変わると思う → ○ 2変量正規分布では <span class=\"math-inline\">$x$<\/span> によらず一定です（一般の分布では <span class=\"math-inline\">$x$<\/span> によって変わることがあります）。<\/li>\n<\/ul><\/section>","text":"一言でいうと 一方の連続型確率変数の値がわかったときの、もう一方の変数の密度です。 同時密度の「切り口」を、面積が1になるように割り直したものです。 定義・数式 連続型確率変数 の同時確率密度関数を 、 の周辺確率密度関数を とします。 である について、 が与えられたときの の条件付き確率密度関数は です。 を固定すると の密度になり、 を満たします。 条件付き確率・条件付き期待値は、この密度で計算します。 同時密度は と分解できます。 が独立であることは、 がすべての で成り立つことと同じです。 2変量正規分布の条件付き分布（重要）： が平均 、標準偏差 、相関係数 の2変量正規分布に従うとき、 数式の読み解き - を で固定したもの：同時密度の曲面を の位置で縦に切った切り口の曲線です。 - で割る：切り口の面積は なので、これで割ると面積1の密度になります。 なのに「 という条件」を付けられるのは、 という細い帯で条件付けて とした極限と考えるからです。 2変量正規分布の結果は、平均が の1次式（回帰直線）になり、分散は によらず 倍に縮む、と読めます。 が に近いほど、 を知ることで の不確かさが大きく減ります。 分解 を使うと、逆向きの条件付き密度も求められます。 これは連続型のベイズの定理で、 をパラメータ、 をデータと読めば事後分布の式そのものです。 具体例 例1：身長から体重を予測する 成人の身長 （cm）と体重 （kg）が2変量正規分布に従い、 だとします。身長 176 cm の人の体重の条件付き分布は 体重が 70 kg を超える確率は 身長の情報がないときの のおよそ2倍です。 例2：正方形上の密度で条件付ける 、 のとき、 なら です。 例3：三角形の台 、 なら で、 は一様分布 です。 したがって 、全体では となり、周辺密度から直接求めた値と一致します。 現場での使われ方 - 医療：年齢や体格で条件付けた検査値の分布から「年齢別の基準範囲」を作ります。全体の分布で判定するより誤判定が減ります。 - 製造・品質管理：前工程の寸法で条件付けた後工程の寸法の分布を使い、前工程の測定値から最終製品の規格外れ確率を予測します。 - IT・Webサービス：滞在時間で条件付けた購入金額の分布を推定し、滞在が長い利用者向けの推薦の効果を見積もります。 - 金融・保険：ある資産が大きく下落したという条件のもとでの、別の資産の損益分布を求めてストレステストを行います。 グラフ・イメージ 1つ目の図では、条件付き密度（実線）が周辺密度（破線）より右にずれ、幅も狭くなっています。条件付き平均のスライダーを動かすと、身長の値を変えたときの体重分布の移動を再現できます。 2つ目の散布図では、ρ を大きくすると、縦に切った帯の中の点の散らばりが小さくなります。これが条件付き分散 の縮小です。 試験のポイント - 2変量正規分布の条件付き平均・条件付き分散の公式は必ず覚え、数値を代入して確率まで出せるようにします。条件付き平均の傾き は回帰係数です。 - 「 の分布と、 が与えられたときの の条件付き分布」から同時密度を作り、周辺化して の分布や期待値を求める階層型の問題は重要です。 - 、 を使うと、 の周辺密度を求めずに期待値・分散が出せます。 - 条件付き密度の台（例3の ）を書き忘れないようにします。 - 例： 、 なら、同時密度は 、 の周辺密度は 、 です。 よくある間違い - × を求めるとき で割る → ○ 条件側の変数 の周辺密度 で割ります。 - × 2変量正規分布の条件付き分散を とする → ○ です。相関が強いほど小さくなります。 - × の積分範囲をいつも周辺の台全体にする → ○ 例3のように、条件付き密度の台は に依存することがあります。 - × 条件付き分散が によって変わると思う → ○ 2変量正規分布では によらず一定です（一般の分布では によって変わることがあります）。"},"conditional-probability-function":{"id":"conditional-probability-function","title":"条件付き確率関数","reading":"じょうけんつきかくりつかんすう","en":"Conditional probability mass function","aliases":["条件付き確率質量関数"],"chapter":2,"importance":"A","tags":["多変量","離散型","条件付き分布","条件付き期待値"],"related":["joint-probability-function","marginal-probability-function","conditional-probability","conditional-expectation","conditional-variance","conditional-probability-density-function"],"charts":[{"type":"custom","id":"joint-marginal","params":{"table":[[0.1,0.2],[0.2,0.3],[0.1,0.1]],"rowLabels":["0","1","2"],"colLabels":["0","1"],"rowName":"X","colName":"Y"},"caption":"Y=1 の列だけを取り出し、列の合計 0.6 で割ると、Y=1 のときの X の条件付き確率関数（1/3, 1/2, 1/6）になる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>一方の変数の値がわかったときに、もう一方の変数がどの値をとるかの確率を表す関数です。\n同時確率の表の「1つの列（行）だけを取り出して、合計が1になるように割り直したもの」です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>離散型確率変数 <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率関数を <span class=\"math-inline\">$p(x,y)$<\/span>、<span class=\"math-inline\">$Y$<\/span> の周辺確率関数を <span class=\"math-inline\">$p_Y(y)$<\/span> とします。\n<span class=\"math-inline\">$p_Y(y)&gt;0$<\/span> である <span class=\"math-inline\">$y$<\/span> について、<span class=\"math-inline\">$Y=y$<\/span> が与えられたときの <span class=\"math-inline\">$X$<\/span> の条件付き確率関数は<\/p>\n<div class=\"math-display\">$$p(x \\mid y) = P(X=x \\mid Y=y) = \\frac{p(x,y)}{p_Y(y)}$$<\/div>\n<p>です。<span class=\"math-inline\">$y$<\/span> を固定すると、<span class=\"math-inline\">$x$<\/span> の関数として確率関数の条件を満たします。<\/p>\n<div class=\"math-display\">$$p(x\\mid y)\\ge 0,\\qquad \\sum_x p(x\\mid y) = \\frac{\\sum_x p(x,y)}{p_Y(y)} = 1$$<\/div>\n<p>同時確率関数は「周辺 × 条件付き」に分解できます（乗法定理）。<\/p>\n<div class=\"math-display\">$$p(x,y) = p(x\\mid y)\\,p_Y(y) = p(y\\mid x)\\,p_X(x)$$<\/div>\n<p><span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が独立であることは、<span class=\"math-inline\">$p_Y(y)&gt;0$<\/span> であるすべての <span class=\"math-inline\">$y$<\/span> で <span class=\"math-inline\">$p(x\\mid y)=p_X(x)$<\/span> となることと同じです。<\/p>\n<p>条件付き確率関数から、条件付き期待値・条件付き分散が定義できます。<\/p>\n<div class=\"math-display\">$$E[X\\mid Y=y] = \\sum_x x\\,p(x\\mid y),\\qquad V[X\\mid Y=y] = \\sum_x x^2 p(x\\mid y) - \\big(E[X\\mid Y=y]\\big)^2$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>分子 <span class=\"math-inline\">$p(x,y)$<\/span>：<span class=\"math-inline\">$X=x$<\/span> かつ <span class=\"math-inline\">$Y=y$<\/span> の確率。表の1マスです。<\/li>\n<li>分母 <span class=\"math-inline\">$p_Y(y)$<\/span>：<span class=\"math-inline\">$Y=y$<\/span> となる確率。表の1列の合計です。<\/li>\n<li>割り算の意味：「<span class=\"math-inline\">$Y=y$<\/span> が起きた世界」だけに注目し、その世界全体の確率を1に直しています。事象の条件付き確率 <span class=\"math-inline\">$P(A\\mid B)=P(A\\cap B)/P(B)$<\/span> を、確率変数の値ごとに書いたものです。<\/li>\n<\/ul>\n<p>分子の形（列の中での比率）は変わらず、大きさだけがそろえられる点が大切です。\n条件付き確率関数どうしを比べて形が違えば、<span class=\"math-inline\">$Y$<\/span> の値によって <span class=\"math-inline\">$X$<\/span> の分布が変わる、つまり従属していることになります。<\/p>\n<p>乗法定理 <span class=\"math-inline\">$p(x,y)=p(y\\mid x)p_X(x)$<\/span> は、逆向きにも使えます。\n問題では「まず <span class=\"math-inline\">$X$<\/span> の分布、次に <span class=\"math-inline\">$X$<\/span> が決まったときの <span class=\"math-inline\">$Y$<\/span> の分布」という2段階で与えられることがよくあります。\nこのときは、掛け算で同時確率関数を作り、相手の変数で足して周辺確率関数を作り、割り算で逆向きの条件付き確率関数 <span class=\"math-inline\">$p(x\\mid y)$<\/span> を作ります。\nこの3ステップは、ベイズの定理を確率関数で書いたものそのものです。<\/p>\n<div class=\"math-display\">$$p(x\\mid y) = \\frac{p(y\\mid x)\\,p_X(x)}{\\sum_{x'} p(y\\mid x')\\,p_X(x')}$$<\/div>\n<p>条件付き確率関数は、条件となる値 <span class=\"math-inline\">$y$<\/span> ごとに1つずつある「分布の集まり」です。\n<span class=\"math-inline\">$y$<\/span> を動かすと分布の形がどう変わるかを見ることが、2変数の関係を調べることにつながります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：表から条件付き分布を出す<\/strong><\/p>\n<p>パンの個数 <span class=\"math-inline\">$X$<\/span> とコーヒー購入 <span class=\"math-inline\">$Y$<\/span> の同時確率が次の表だとします。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"math-inline\">$Y=0$<\/span><\/th>\n<th><span class=\"math-inline\">$Y=1$<\/span><\/th>\n<th><span class=\"math-inline\">$p_X$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">$X=0$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=1$<\/span><\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<td>0.50<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=2$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$p_Y$<\/span><\/td>\n<td>0.40<\/td>\n<td>0.60<\/td>\n<td>1.00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>コーヒーを買った客（<span class=\"math-inline\">$Y=1$<\/span>）のパンの個数の分布は<\/p>\n<div class=\"math-display\">$$p(x\\mid 1) = \\frac{0.20}{0.60},\\ \\frac{0.30}{0.60},\\ \\frac{0.10}{0.60} = \\frac{1}{3},\\ \\frac{1}{2},\\ \\frac{1}{6}\\qquad (x=0,1,2)$$<\/div>\n<p><span class=\"math-inline\">$E[X\\mid Y=1]=0\\cdot\\tfrac13+1\\cdot\\tfrac12+2\\cdot\\tfrac16=\\tfrac56\\approx0.8333$<\/span> です。\n同様に <span class=\"math-inline\">$p(x\\mid 0)=(0.25,\\,0.5,\\,0.25)$<\/span>、<span class=\"math-inline\">$E[X\\mid Y=0]=1$<\/span> です。<\/p>\n<p>全体の平均は、条件付き期待値を <span class=\"math-inline\">$Y$<\/span> の確率で重み付けして戻ります（繰り返し期待値の法則）。<\/p>\n<div class=\"math-display\">$$E[X] = 1\\times0.4 + \\tfrac56\\times0.6 = 0.9$$<\/div>\n<p>分散も <span class=\"math-inline\">$V[X\\mid Y=0]=0.5$<\/span>、<span class=\"math-inline\">$V[X\\mid Y=1]=\\tfrac{17}{36}\\approx0.4722$<\/span> から<\/p>\n<div class=\"math-display\">$$V[X] = \\underbrace{0.4\\times0.5+0.6\\times\\tfrac{17}{36}}_{E[V[X\\mid Y]]\\,\\approx\\,0.4833} + \\underbrace{\\big(0.4\\times1^2+0.6\\times(\\tfrac56)^2\\big)-0.9^2}_{V[E[X\\mid Y]]\\,\\approx\\,0.0067} = 0.49$$<\/div>\n<p>と、直接計算した <span class=\"math-inline\">$V[X]=0.49$<\/span> に一致します。<\/p>\n<p><strong>例2：ポアソン分布の和で条件付ける<\/strong><\/p>\n<p>1時間の来店客のうち、男性客 <span class=\"math-inline\">$X$<\/span> と女性客 <span class=\"math-inline\">$Y$<\/span> が独立にポアソン分布 <span class=\"math-inline\">$Po(2)$<\/span>、<span class=\"math-inline\">$Po(3)$<\/span> に従うとします。合計 <span class=\"math-inline\">$X+Y=5$<\/span> だったとき、<\/p>\n<div class=\"math-display\">$$P(X=k\\mid X+Y=5) = \\frac{\\frac{e^{-2}2^k}{k!}\\cdot\\frac{e^{-3}3^{5-k}}{(5-k)!}}{\\frac{e^{-5}5^5}{5!}} = \\binom{5}{k}\\left(\\tfrac25\\right)^k\\left(\\tfrac35\\right)^{5-k}$$<\/div>\n<p>で、二項分布 <span class=\"math-inline\">$B(5,\\,0.4)$<\/span> になります。<span class=\"math-inline\">$P(X=2\\mid X+Y=5)=\\binom52(0.4)^2(0.6)^3=0.3456$<\/span> です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>マーケティング<\/strong>：「会員か非会員か」で条件付けた購入点数の分布を比べ、会員施策の効果を見ます。<\/li>\n<li><strong>医療<\/strong>：重症度ごとの入院日数の条件付き分布を作り、病床の必要数を重症度の構成比から見積もります。<\/li>\n<li><strong>IT・Webサービス<\/strong>：直前に閲覧したページで条件付けた「次に開くページ」の確率を推薦に使います。これはマルコフ連鎖の推移確率と同じ考え方です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>表の1列を取り出し、その列の合計で割ったものが条件付き確率関数です。\n<span class=\"math-inline\">$Y=0$<\/span> の列と <span class=\"math-inline\">$Y=1$<\/span> の列で割り直した比率が違う（0.25, 0.5, 0.25 と 1/3, 1/2, 1/6）ことが、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が独立でない証拠です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>「表 → 周辺 → 条件付き → 条件付き期待値 → 全体の期待値」の一連の計算は重要です。<\/li>\n<li>繰り返し期待値の法則 <span class=\"math-inline\">$E[X]=E[E[X\\mid Y]]$<\/span> と、分散の分解 <span class=\"math-inline\">$V[X]=E[V[X\\mid Y]]+V[E[X\\mid Y]]$<\/span> を数値で確かめられるようにします。<\/li>\n<li>独立なポアソン変数の和で条件付けると二項分布、独立な二項分布の和で条件付けると超幾何分布になる、という結果は導出ごと押さえておきます。<\/li>\n<li><span class=\"math-inline\">$p(x\\mid y)$<\/span> は <span class=\"math-inline\">$x$<\/span> について合計1ですが、<span class=\"math-inline\">$y$<\/span> について足しても1にはなりません。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× <span class=\"math-inline\">$p(x\\mid y)$<\/span> を分母 <span class=\"math-inline\">$p_X(x)$<\/span> で割って求める → ○ 条件側の変数 <span class=\"math-inline\">$Y$<\/span> の周辺確率 <span class=\"math-inline\">$p_Y(y)$<\/span> で割ります。<\/li>\n<li>× <span class=\"math-inline\">$p(x\\mid y)$<\/span> と <span class=\"math-inline\">$p(y\\mid x)$<\/span> を同じものとみなす → ○ 分母が違うので一般に別の値です。<\/li>\n<li>× <span class=\"math-inline\">$E[X\\mid Y]$<\/span> を定数だと思う → ○ <span class=\"math-inline\">$Y$<\/span> の値で変わる確率変数です。<span class=\"math-inline\">$Y=y$<\/span> を代入して初めて数値になります。<\/li>\n<\/ul><\/section>","text":"一言でいうと 一方の変数の値がわかったときに、もう一方の変数がどの値をとるかの確率を表す関数です。 同時確率の表の「1つの列（行）だけを取り出して、合計が1になるように割り直したもの」です。 定義・数式 離散型確率変数 の同時確率関数を 、 の周辺確率関数を とします。 である について、 が与えられたときの の条件付き確率関数は です。 を固定すると、 の関数として確率関数の条件を満たします。 同時確率関数は「周辺 × 条件付き」に分解できます（乗法定理）。 と が独立であることは、 であるすべての で となることと同じです。 条件付き確率関数から、条件付き期待値・条件付き分散が定義できます。 数式の読み解き - 分子 ： かつ の確率。表の1マスです。 - 分母 ： となる確率。表の1列の合計です。 - 割り算の意味：「 が起きた世界」だけに注目し、その世界全体の確率を1に直しています。事象の条件付き確率 を、確率変数の値ごとに書いたものです。 分子の形（列の中での比率）は変わらず、大きさだけがそろえられる点が大切です。 条件付き確率関数どうしを比べて形が違えば、 の値によって の分布が変わる、つまり従属していることになります。 乗法定理 は、逆向きにも使えます。 問題では「まず の分布、次に が決まったときの の分布」という2段階で与えられることがよくあります。 このときは、掛け算で同時確率関数を作り、相手の変数で足して周辺確率関数を作り、割り算で逆向きの条件付き確率関数 を作ります。 この3ステップは、ベイズの定理を確率関数で書いたものそのものです。 条件付き確率関数は、条件となる値 ごとに1つずつある「分布の集まり」です。 を動かすと分布の形がどう変わるかを見ることが、2変数の関係を調べることにつながります。 具体例 例1：表から条件付き分布を出す パンの個数 とコーヒー購入 の同時確率が次の表だとします。 0.10 0.20 0.30 0.20 0.30 0.50 0.10 0.10 0.20 0.40 0.60 1.00 コーヒーを買った客（ ）のパンの個数の分布は です。 同様に 、 です。 全体の平均は、条件付き期待値を の確率で重み付けして戻ります（繰り返し期待値の法則）。 分散も 、 から と、直接計算した に一致します。 例2：ポアソン分布の和で条件付ける 1時間の来店客のうち、男性客 と女性客 が独立にポアソン分布 、 に従うとします。合計 だったとき、 で、二項分布 になります。 です。 現場での使われ方 - マーケティング：「会員か非会員か」で条件付けた購入点数の分布を比べ、会員施策の効果を見ます。 - 医療：重症度ごとの入院日数の条件付き分布を作り、病床の必要数を重症度の構成比から見積もります。 - IT・Webサービス：直前に閲覧したページで条件付けた「次に開くページ」の確率を推薦に使います。これはマルコフ連鎖の推移確率と同じ考え方です。 グラフ・イメージ 表の1列を取り出し、その列の合計で割ったものが条件付き確率関数です。 の列と の列で割り直した比率が違う（0.25, 0.5, 0.25 と 1/3, 1/2, 1/6）ことが、 と が独立でない証拠です。 試験のポイント - 「表 → 周辺 → 条件付き → 条件付き期待値 → 全体の期待値」の一連の計算は重要です。 - 繰り返し期待値の法則 と、分散の分解 を数値で確かめられるようにします。 - 独立なポアソン変数の和で条件付けると二項分布、独立な二項分布の和で条件付けると超幾何分布になる、という結果は導出ごと押さえておきます。 - は について合計1ですが、 について足しても1にはなりません。 よくある間違い - × を分母 で割って求める → ○ 条件側の変数 の周辺確率 で割ります。 - × と を同じものとみなす → ○ 分母が違うので一般に別の値です。 - × を定数だと思う → ○ の値で変わる確率変数です。 を代入して初めて数値になります。"},"cumulative-distribution-function":{"id":"cumulative-distribution-function","title":"累積分布関数","reading":"るいせきぶんぷかんすう","en":"Cumulative distribution function","aliases":["CDF","分布関数"],"chapter":2,"importance":"A","tags":["確率分布","離散型","連続型","確率密度関数"],"related":["survival-function","quantile-function","joint-probability-density-function","change-of-variables","exponential-distribution"],"charts":[{"type":"pdf-cdf","dist":"norm","params":{"mu":0,"sigma":1},"x":{"min":-4,"max":4},"caption":"上の密度で x より左の面積（塗った部分）が、下の累積分布関数の高さ F(x) と一致する。"},{"type":"cdf","dist":"binom","params":{"n":10,"p":0.3},"sliders":[{"param":"n","label":"試行回数 n","min":1,"max":30,"step":1},{"param":"p","label":"成功確率 p","min":0.05,"max":0.95,"step":0.05}],"x":{"min":0,"max":30},"quantile":0.5,"caption":"離散分布の累積分布関数は階段状になる。各段の高さが、その値をとる確率である。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>確率変数が「ある値以下になる確率」を、値ごとに並べた関数です。\n離散型でも連続型でも同じ形で定義できるので、確率分布を表すいちばん基本的な道具です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数 <span class=\"math-inline\">$X$<\/span> の累積分布関数（分布関数）は、すべての実数 <span class=\"math-inline\">$x$<\/span> について<\/p>\n<div class=\"math-display\">$$F_X(x) = P(X \\le x), \\qquad -\\infty &lt; x &lt; \\infty$$<\/div>\n<p>で定義します。<\/p>\n<p>離散型で確率関数が <span class=\"math-inline\">$p(x_k)=P(X=x_k)$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$F_X(x) = \\sum_{k:\\, x_k \\le x} p(x_k)$$<\/div>\n<p>連続型で確率密度関数が <span class=\"math-inline\">$f(x)$<\/span> のとき、<\/p>\n<div class=\"math-display\">$$F_X(x) = \\int_{-\\infty}^{x} f(u)\\,du, \\qquad f(x) = \\frac{d}{dx}F_X(x)\\ \\ (\\text{微分可能な点で})$$<\/div>\n<p>どんな確率変数でも、累積分布関数は次の3つの性質をもちます。<\/p>\n<ol>\n<li>単調非減少：<span class=\"math-inline\">$x_1 &lt; x_2$<\/span> なら <span class=\"math-inline\">$F(x_1) \\le F(x_2)$<\/span><\/li>\n<li><span class=\"math-inline\">$\\displaystyle\\lim_{x\\to-\\infty}F(x)=0,\\ \\lim_{x\\to\\infty}F(x)=1$<\/span><\/li>\n<li>右連続：<span class=\"math-inline\">$\\displaystyle\\lim_{h\\downarrow 0}F(x+h)=F(x)$<\/span><\/li>\n<\/ol>\n<p>逆に、この3つを満たす関数は必ず何らかの確率変数の累積分布関数になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$F_X(x)$<\/span>：「<span class=\"math-inline\">$X$<\/span> が <span class=\"math-inline\">$x$<\/span> 以下」という事象の確率。0から1の間の値をとります。<\/li>\n<li>区間の確率は差で求めます。<\/li>\n<\/ul>\n<div class=\"math-display\">$$P(a &lt; X \\le b) = F(b) - F(a)$$<\/div>\n<ul>\n<li>1点の確率は「跳びの大きさ」です。<span class=\"math-inline\">$P(X=x)=F(x)-F(x-)$<\/span>（<span class=\"math-inline\">$F(x-)$<\/span> は左からの極限）。連続型では <span class=\"math-inline\">$F$<\/span> が連続なので、どの1点の確率も0です。<\/li>\n<\/ul>\n<p>離散型の <span class=\"math-inline\">$F$<\/span> は、値をとる点で跳び上がる階段関数になります。\n「右連続」とは、跳んだ点では上の段の値をとる、という約束です。<span class=\"math-inline\">$P(X \\le x)$<\/span> と「以下」で定義しているので、<span class=\"math-inline\">$x$<\/span> ちょうどの確率を含むからです。<\/p>\n<p>連続型では、<span class=\"math-inline\">$F$<\/span> は密度 <span class=\"math-inline\">$f$<\/span> の「左側の面積」です。\n面積の増え方（傾き）が密度なので、<span class=\"math-inline\">$F$<\/span> を微分すると <span class=\"math-inline\">$f$<\/span> に戻ります。<\/p>\n<p>離散でも連続でもない「混合型」も累積分布関数なら1つの式で扱えます。\nたとえば保険の支払額は「支払いなし（ちょうど0円）」に確率の塊があり、0より大きい部分は連続的に分布します。\nこのとき <span class=\"math-inline\">$F$<\/span> は0で跳び、その後はなめらかに増えます。確率関数や密度だけでは表しにくい分布も、累積分布関数なら必ず書けるのが強みです。<\/p>\n<p>また、累積分布関数が等しい2つの確率変数は「同じ分布に従う」と言います。分布が一致するかどうかを判定する基準そのものが <span class=\"math-inline\">$F$<\/span> です。\n第7章の分布収束も「<span class=\"math-inline\">$F_n(x)\\to F(x)$<\/span>（<span class=\"math-inline\">$F$<\/span> の連続点で）」と累積分布関数で定義されます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：サイコロの目<\/strong><\/p>\n<p>公正なサイコロの目 <span class=\"math-inline\">$X$<\/span> では、<span class=\"math-inline\">$F(x)$<\/span> は <span class=\"math-inline\">$x=1,2,\\dots,6$<\/span> で <span class=\"math-inline\">$1/6$<\/span> ずつ跳ぶ階段関数です。\nたとえば <span class=\"math-inline\">$F(3)=3/6=0.5$<\/span>、<span class=\"math-inline\">$F(3.7)=0.5$<\/span> です（3.7以下の目は1,2,3だけ）。\n<span class=\"math-inline\">$P(2 &lt; X \\le 5)=F(5)-F(2)=5/6-2/6=0.5$<\/span> です。<\/p>\n<p><strong>例2：部品の寿命（指数分布）<\/strong><\/p>\n<p>ある部品の寿命 <span class=\"math-inline\">$X$<\/span>（年）が、レート <span class=\"math-inline\">$\\lambda=0.5$<\/span> の指数分布に従うとします。密度は <span class=\"math-inline\">$f(x)=0.5e^{-0.5x}\\ (x\\ge0)$<\/span> なので、<\/p>\n<div class=\"math-display\">$$F(x) = \\int_0^x 0.5e^{-0.5u}\\,du = 1-e^{-0.5x}\\quad (x \\ge 0)$$<\/div>\n<p>2年以内に壊れる確率は <span class=\"math-inline\">$F(2)=1-e^{-1}\\approx 0.6321$<\/span> です。\n1年目から3年目の間に壊れる確率は<\/p>\n<div class=\"math-display\">$$F(3)-F(1) = e^{-0.5}-e^{-1.5} \\approx 0.6065-0.2231 = 0.3834$$<\/div>\n<p><strong>例3：最大値の分布<\/strong><\/p>\n<p><span class=\"math-inline\">$X_1,X_2,X_3$<\/span> が独立に一様分布 <span class=\"math-inline\">$U(0,1)$<\/span> に従うとき、最大値 <span class=\"math-inline\">$M$<\/span> の累積分布関数は、<\/p>\n<div class=\"math-display\">$$F_M(x) = P(X_1\\le x,\\,X_2\\le x,\\,X_3\\le x) = x^3 \\quad (0\\le x\\le 1)$$<\/div>\n<p>「最大値が <span class=\"math-inline\">$x$<\/span> 以下」は「全部が <span class=\"math-inline\">$x$<\/span> 以下」と同じだからです。<span class=\"math-inline\">$P(M\\le 0.5)=0.125$<\/span>、密度は微分して <span class=\"math-inline\">$f_M(x)=3x^2$<\/span> です。\nこのように、密度を直接求めにくい変数は、先に累積分布関数を求めてから微分するのが定石です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：部品の寿命分布の <span class=\"math-inline\">$F(t)$<\/span> を「時刻 <span class=\"math-inline\">$t$<\/span> までの累積故障率」として、保証期間内に壊れる割合を見積もります。<\/li>\n<li><strong>金融・保険<\/strong>：損失額の分布の <span class=\"math-inline\">$F$<\/span> から、「損失が一定額を超えない確率」や、その逆関数であるバリュー・アット・リスク（分位点）を求めます。<\/li>\n<li><strong>行政・調査<\/strong>：所得の分布を累積分布で描き、「下位何％の世帯が所得何万円以下か」を示します。経験分布関数（データから作る階段関数）がよく使われます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：応答時間の累積分布を描き、「95％のリクエストが何ミリ秒以内に返るか」を監視します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>1つ目の図では、x を動かすと、上の密度の塗った面積と下の曲線の高さが同じだけ増えることを確かめてください。密度が高い所ほど <span class=\"math-inline\">$F$<\/span> の傾きが急になります。\n2つ目の図は二項分布の累積分布関数です。階段の跳びの大きさが各値の確率で、最後は必ず1に達します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>区間確率 <span class=\"math-inline\">$F(b)-F(a)$<\/span> と、補集合 <span class=\"math-inline\">$P(X&gt;x)=1-F(x)$<\/span> の計算は全分野の基本です。<\/li>\n<li>最大値・最小値の分布は、<span class=\"math-inline\">$P(\\max\\le x)=\\prod F_i(x)$<\/span>、<span class=\"math-inline\">$P(\\min&gt; x)=\\prod\\{1-F_i(x)\\}$<\/span> から求めるのが典型です。<\/li>\n<li>変数変換で <span class=\"math-inline\">$Y=g(X)$<\/span> の密度を求めるとき、<span class=\"math-inline\">$F_Y(y)=P(g(X)\\le y)$<\/span> を書いてから微分する方法（分布関数法）は、単調でない変換にも使えます。<\/li>\n<li>連続型の <span class=\"math-inline\">$X$<\/span> について <span class=\"math-inline\">$F(X)$<\/span> は <span class=\"math-inline\">$U(0,1)$<\/span> に従います（確率積分変換）。逆に <span class=\"math-inline\">$F^{-1}(U)$<\/span> で乱数を作るのが逆関数法です。<\/li>\n<li>離散型では <span class=\"math-inline\">$P(X&lt;x)$<\/span> と <span class=\"math-inline\">$P(X\\le x)$<\/span> が異なります。不等号の向きと等号の有無を必ず確認します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 連続型の <span class=\"math-inline\">$F(x)$<\/span> を密度 <span class=\"math-inline\">$f(x)$<\/span> と同じものとみなす → ○ <span class=\"math-inline\">$F$<\/span> は確率（0〜1）、<span class=\"math-inline\">$f$<\/span> は確率の「濃さ」で、1を超えることもあります。<\/li>\n<li>× 離散型で <span class=\"math-inline\">$P(a \\le X \\le b)=F(b)-F(a)$<\/span> → ○ これは <span class=\"math-inline\">$P(a&lt;X\\le b)$<\/span> です。<span class=\"math-inline\">$a$<\/span> を含めるなら <span class=\"math-inline\">$F(b)-F(a-)$<\/span> です。<\/li>\n<li>× 累積分布関数は左連続 → ○ <span class=\"math-inline\">$P(X\\le x)$<\/span> で定義する限り右連続です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 確率変数が「ある値以下になる確率」を、値ごとに並べた関数です。 離散型でも連続型でも同じ形で定義できるので、確率分布を表すいちばん基本的な道具です。 定義・数式 確率変数 の累積分布関数（分布関数）は、すべての実数 について で定義します。 離散型で確率関数が のとき、 連続型で確率密度関数が のとき、 どんな確率変数でも、累積分布関数は次の3つの性質をもちます。 1. 単調非減少： なら 2. 3. 右連続： 逆に、この3つを満たす関数は必ず何らかの確率変数の累積分布関数になります。 数式の読み解き - ：「 が 以下」という事象の確率。0から1の間の値をとります。 - 区間の確率は差で求めます。 - 1点の確率は「跳びの大きさ」です。 （ は左からの極限）。連続型では が連続なので、どの1点の確率も0です。 離散型の は、値をとる点で跳び上がる階段関数になります。 「右連続」とは、跳んだ点では上の段の値をとる、という約束です。 と「以下」で定義しているので、 ちょうどの確率を含むからです。 連続型では、 は密度 の「左側の面積」です。 面積の増え方（傾き）が密度なので、 を微分すると に戻ります。 離散でも連続でもない「混合型」も累積分布関数なら1つの式で扱えます。 たとえば保険の支払額は「支払いなし（ちょうど0円）」に確率の塊があり、0より大きい部分は連続的に分布します。 このとき は0で跳び、その後はなめらかに増えます。確率関数や密度だけでは表しにくい分布も、累積分布関数なら必ず書けるのが強みです。 また、累積分布関数が等しい2つの確率変数は「同じ分布に従う」と言います。分布が一致するかどうかを判定する基準そのものが です。 第7章の分布収束も「 （ の連続点で）」と累積分布関数で定義されます。 具体例 例1：サイコロの目 公正なサイコロの目 では、 は で ずつ跳ぶ階段関数です。 たとえば 、 です（3.7以下の目は1,2,3だけ）。 です。 例2：部品の寿命（指数分布） ある部品の寿命 （年）が、レート の指数分布に従うとします。密度は なので、 2年以内に壊れる確率は です。 1年目から3年目の間に壊れる確率は 例3：最大値の分布 が独立に一様分布 に従うとき、最大値 の累積分布関数は、 「最大値が 以下」は「全部が 以下」と同じだからです。 、密度は微分して です。 このように、密度を直接求めにくい変数は、先に累積分布関数を求めてから微分するのが定石です。 現場での使われ方 - 製造・品質管理：部品の寿命分布の を「時刻 までの累積故障率」として、保証期間内に壊れる割合を見積もります。 - 金融・保険：損失額の分布の から、「損失が一定額を超えない確率」や、その逆関数であるバリュー・アット・リスク（分位点）を求めます。 - 行政・調査：所得の分布を累積分布で描き、「下位何％の世帯が所得何万円以下か」を示します。経験分布関数（データから作る階段関数）がよく使われます。 - IT・Webサービス：応答時間の累積分布を描き、「95％のリクエストが何ミリ秒以内に返るか」を監視します。 グラフ・イメージ 1つ目の図では、x を動かすと、上の密度の塗った面積と下の曲線の高さが同じだけ増えることを確かめてください。密度が高い所ほど の傾きが急になります。 2つ目の図は二項分布の累積分布関数です。階段の跳びの大きさが各値の確率で、最後は必ず1に達します。 試験のポイント - 区間確率 と、補集合 の計算は全分野の基本です。 - 最大値・最小値の分布は、 、 から求めるのが典型です。 - 変数変換で の密度を求めるとき、 を書いてから微分する方法（分布関数法）は、単調でない変換にも使えます。 - 連続型の について は に従います（確率積分変換）。逆に で乱数を作るのが逆関数法です。 - 離散型では と が異なります。不等号の向きと等号の有無を必ず確認します。 よくある間違い - × 連続型の を密度 と同じものとみなす → ○ は確率（0〜1）、 は確率の「濃さ」で、1を超えることもあります。 - × 離散型で → ○ これは です。 を含めるなら です。 - × 累積分布関数は左連続 → ○ で定義する限り右連続です。"},"hazard-function":{"id":"hazard-function","title":"ハザード関数","reading":"はざーどかんすう","en":"Hazard function","aliases":["ハザード率","瞬間故障率","故障率関数","瞬間死亡率"],"chapter":2,"importance":"A","tags":["生存時間解析","信頼性","生存関数","ワイブル分布"],"related":["survival-function","cumulative-distribution-function","exponential-distribution","cox-proportional-hazards-model","hazard-ratio"],"charts":[{"type":"survival-hazard","dist":"weibull","params":{"shape":2,"scale":10},"sliders":[{"param":"shape","label":"形状 k","min":0.5,"max":4,"step":0.1},{"param":"scale","label":"尺度 λ","min":2,"max":20,"step":1}],"caption":"形状 k<1 でハザードは右下がり（初期故障型）、k=1 で一定（偶発故障型＝指数分布）、k>1 で右上がり（摩耗故障型）になる。"},{"type":"survival-hazard","dist":"gamma","params":{"shape":2,"scale":2},"sliders":[{"param":"shape","label":"形状 α","min":0.5,"max":5,"step":0.1},{"param":"scale","label":"尺度 β","min":0.5,"max":5,"step":0.5}],"caption":"ガンマ分布のハザードは α>1 で増加しながら一定値 1/β に近づき、α<1 で減少しながら 1/β に近づく。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>「ここまで無事だったものが、次の瞬間にイベント（故障・死亡など）を起こす勢い」を時刻ごとに表した関数です。\n寿命の分布の「年齢による危なさの変化」を直接表すので、生存時間解析や信頼性工学の中心になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>連続型の非負の確率変数 <span class=\"math-inline\">$T$<\/span> が密度 <span class=\"math-inline\">$f(t)$<\/span>、生存関数 <span class=\"math-inline\">$S(t)=P(T&gt;t)$<\/span> をもつとき、ハザード関数は<\/p>\n<div class=\"math-display\">$$h(t) = \\lim_{\\Delta t \\downarrow 0} \\frac{P(t \\le T &lt; t+\\Delta t \\mid T \\ge t)}{\\Delta t} = \\frac{f(t)}{S(t)}$$<\/div>\n<p>で定義します（<span class=\"math-inline\">$S(t)&gt;0$<\/span> の範囲）。<\/p>\n<p>累積ハザード関数を <span class=\"math-inline\">$H(t)=\\int_0^t h(u)\\,du$<\/span> とすると、<\/p>\n<div class=\"math-display\">$$h(t) = -\\frac{d}{dt}\\log S(t), \\qquad S(t) = \\exp\\{-H(t)\\}, \\qquad f(t) = h(t)\\exp\\{-H(t)\\}$$<\/div>\n<p>が成り立ちます。ハザード関数・生存関数・密度・累積分布関数のどれか1つがわかれば、残りはすべて決まります。<\/p>\n<p>離散型（<span class=\"math-inline\">$T=1,2,\\dots$<\/span>）では <span class=\"math-inline\">$h(k)=P(T=k\\mid T\\ge k)$<\/span> と定義し、<span class=\"math-inline\">$S(k)=\\prod_{j=1}^{k}\\{1-h(j)\\}$<\/span> です。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>分布<\/th>\n<th>ハザード <span class=\"math-inline\">$h(t)$<\/span><\/th>\n<th>形<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>指数分布（レート <span class=\"math-inline\">$\\lambda$<\/span>）<\/td>\n<td><span class=\"math-inline\">$\\lambda$<\/span><\/td>\n<td>一定<\/td>\n<\/tr>\n<tr>\n<td>ワイブル分布（形状 <span class=\"math-inline\">$k$<\/span>、尺度 <span class=\"math-inline\">$\\eta$<\/span>）<\/td>\n<td><span class=\"math-inline\">$\\dfrac{k}{\\eta}\\left(\\dfrac{t}{\\eta}\\right)^{k-1}$<\/span><\/td>\n<td><span class=\"math-inline\">$k&lt;1$<\/span> 減少、<span class=\"math-inline\">$k=1$<\/span> 一定、<span class=\"math-inline\">$k&gt;1$<\/span> 増加<\/td>\n<\/tr>\n<tr>\n<td>幾何分布（離散）<\/td>\n<td><span class=\"math-inline\">$p$<\/span><\/td>\n<td>一定<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$P(t \\le T &lt; t+\\Delta t \\mid T \\ge t)$<\/span>：時刻 <span class=\"math-inline\">$t$<\/span> まで無事だったという条件のもとで、直後の短い時間にイベントが起こる確率。<\/li>\n<li>それを <span class=\"math-inline\">$\\Delta t$<\/span> で割ったものなので、<span class=\"math-inline\">$h(t)$<\/span> は確率ではなく「単位時間あたりの率」です。1を超えることもあります。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$f(t)/S(t)$<\/span> になる理由は、条件付き確率の定義そのものです。<\/p>\n<div class=\"math-display\">$$\\frac{P(t\\le T&lt;t+\\Delta t)}{P(T\\ge t)\\,\\Delta t} \\approx \\frac{f(t)\\,\\Delta t}{S(t)\\,\\Delta t} = \\frac{f(t)}{S(t)}$$<\/div>\n<p>さらに <span class=\"math-inline\">$S'(t)=-f(t)$<\/span> なので、<span class=\"math-inline\">$h(t)=-S'(t)/S(t)=-\\dfrac{d}{dt}\\log S(t)$<\/span> です。\n両辺を <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$t$<\/span> まで積分すると <span class=\"math-inline\">$H(t)=-\\log S(t)$<\/span>（<span class=\"math-inline\">$S(0)=1$<\/span> を使う）となり、<span class=\"math-inline\">$S(t)=e^{-H(t)}$<\/span> が出ます。<\/p>\n<p>密度 <span class=\"math-inline\">$f(t)$<\/span> は「新品の時点から見て、<span class=\"math-inline\">$t$<\/span> 付近で壊れる確率の濃さ」です。\nハザード <span class=\"math-inline\">$h(t)$<\/span> は「<span class=\"math-inline\">$t$<\/span> まで生き残った集団の中で、<span class=\"math-inline\">$t$<\/span> 付近で壊れる率」です。分母が生き残りの割合 <span class=\"math-inline\">$S(t)$<\/span> に変わっている点が違います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：ワイブル分布の部品<\/strong><\/p>\n<p>寿命が形状 <span class=\"math-inline\">$k=2$<\/span>、尺度 <span class=\"math-inline\">$\\eta=10$<\/span>（年）のワイブル分布に従う部品のハザードは<\/p>\n<div class=\"math-display\">$$h(t) = \\frac{2}{10}\\cdot\\frac{t}{10} = 0.02\\,t$$<\/div>\n<p>です。<span class=\"math-inline\">$h(5)=0.1$<\/span>、<span class=\"math-inline\">$h(10)=0.2$<\/span> で、年数に比例して危なさが増えます（摩耗故障型）。\n累積ハザードは <span class=\"math-inline\">$H(t)=(t/10)^2$<\/span> なので、<span class=\"math-inline\">$S(10)=e^{-1}\\approx 0.3679$<\/span> です。<\/p>\n<p><strong>例2：解約率（離散ハザード）<\/strong><\/p>\n<p>ある定額サービスの会員1000人を追跡しました。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>年<\/th>\n<th>年初の継続者<\/th>\n<th>その年の解約者<\/th>\n<th>ハザード <span class=\"math-inline\">$h(k)$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>1000<\/td>\n<td>200<\/td>\n<td>0.20<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>800<\/td>\n<td>120<\/td>\n<td>0.15<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>680<\/td>\n<td>68<\/td>\n<td>0.10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>3年後の継続率は<\/p>\n<div class=\"math-display\">$$S(3) = (1-0.20)(1-0.15)(1-0.10) = 0.8 \\times 0.85 \\times 0.9 = 0.612$$<\/div>\n<p>で、<span class=\"math-inline\">$612/1000$<\/span> と一致します。長く続けた会員ほど解約しにくくなっていることが、ハザードの減少から読み取れます。<\/p>\n<p><strong>例3：ハザードが2倍になると<\/strong><\/p>\n<p>ある治療群のハザードが、対照群のハザード <span class=\"math-inline\">$h_0(t)$<\/span> の常に2倍だとします。<span class=\"math-inline\">$H_1(t)=2H_0(t)$<\/span> なので <span class=\"math-inline\">$S_1(t)=\\{S_0(t)\\}^2$<\/span> です。\n対照群の5年生存率が <span class=\"math-inline\">$0.7788$<\/span> なら、治療群は <span class=\"math-inline\">$0.7788^2\\approx 0.6065$<\/span> です。「ハザード2倍」は「生存率が半分」ではありません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：故障率の時間変化を描くと、初期故障期（減少）・偶発故障期（一定）・摩耗故障期（増加）の「バスタブ曲線」になります。どの時期かで、初期検査を増やすか予防保全をするかを決めます。<\/li>\n<li><strong>医療<\/strong>：比例ハザードモデル（コックスモデル）で、治療や危険因子がハザードを何倍にするか（ハザード比）を推定します。<\/li>\n<li><strong>金融・保険<\/strong>：生命表の年齢別死亡率は離散ハザードそのものです。保険料の計算に使います。信用リスクでは「デフォルト強度」と呼ばれます。<\/li>\n<li><strong>IT・Webサービス<\/strong>：会員の解約ハザードを利用期間ごとに見て、解約が集中する時期にフォローの施策を打ちます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>ワイブル分布の形状 k を1より小さくすると右のハザードが右下がりに、1にすると水平に、1より大きくすると右上がりになります。\nハザードが大きい時期ほど、左の生存曲線が急に下がることを確認してください。ガンマ分布ではハザードが一定値に近づく点がワイブル分布と違います。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li><span class=\"math-inline\">$h=f/S$<\/span>、<span class=\"math-inline\">$S=e^{-H}$<\/span>、<span class=\"math-inline\">$f=he^{-H}$<\/span> の相互変換を自在に行えることが重要です。ハザードを与えて密度や中央値を求めさせる形が典型です。<\/li>\n<li>指数分布だけがハザード一定の連続分布です。これは無記憶性と同じ内容です。<\/li>\n<li>ワイブル分布は <span class=\"math-inline\">$H(t)=(t/\\eta)^k$<\/span> と簡単に書けるので、<span class=\"math-inline\">$\\log H(t)=k\\log t-k\\log\\eta$<\/span> が <span class=\"math-inline\">$\\log t$<\/span> の1次式になることも覚えておきます。<\/li>\n<li>独立な部品の直列系では、系のハザードは各部品のハザードの和になります（<span class=\"math-inline\">$S=\\prod S_i$<\/span> の対数を微分）。<\/li>\n<li>比例ハザード <span class=\"math-inline\">$h_1=c\\,h_0$<\/span> のとき <span class=\"math-inline\">$S_1=S_0^{\\,c}$<\/span> です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× ハザード <span class=\"math-inline\">$h(t)$<\/span> を確率とみなし、1以下だと思う → ○ 単位時間あたりの率なので、時間の単位を変えると値が変わり、1を超えることもあります（離散ハザードは確率です）。<\/li>\n<li>× <span class=\"math-inline\">$h(t)=f(t)$<\/span> → ○ 分母に <span class=\"math-inline\">$S(t)$<\/span> があります。新品の時点の確率ではなく、生き残った中での率です。<\/li>\n<li>× ハザード比2なら生存率は半分 → ○ <span class=\"math-inline\">$S_1=S_0^2$<\/span> で、ハザード比は生存率の比ではありません。<\/li>\n<\/ul><\/section>","text":"一言でいうと 「ここまで無事だったものが、次の瞬間にイベント（故障・死亡など）を起こす勢い」を時刻ごとに表した関数です。 寿命の分布の「年齢による危なさの変化」を直接表すので、生存時間解析や信頼性工学の中心になります。 定義・数式 連続型の非負の確率変数 が密度 、生存関数 をもつとき、ハザード関数は で定義します（ の範囲）。 累積ハザード関数を とすると、 が成り立ちます。ハザード関数・生存関数・密度・累積分布関数のどれか1つがわかれば、残りはすべて決まります。 離散型（ ）では と定義し、 です。 分布 ハザード 形 指数分布（レート ） 一定 ワイブル分布（形状 、尺度 ） 減少、 一定、 増加 幾何分布（離散） 一定 数式の読み解き - ：時刻 まで無事だったという条件のもとで、直後の短い時間にイベントが起こる確率。 - それを で割ったものなので、 は確率ではなく「単位時間あたりの率」です。1を超えることもあります。 になる理由は、条件付き確率の定義そのものです。 さらに なので、 です。 両辺を から まで積分すると （ を使う）となり、 が出ます。 密度 は「新品の時点から見て、 付近で壊れる確率の濃さ」です。 ハザード は「 まで生き残った集団の中で、 付近で壊れる率」です。分母が生き残りの割合 に変わっている点が違います。 具体例 例1：ワイブル分布の部品 寿命が形状 、尺度 （年）のワイブル分布に従う部品のハザードは です。 、 で、年数に比例して危なさが増えます（摩耗故障型）。 累積ハザードは なので、 です。 例2：解約率（離散ハザード） ある定額サービスの会員1000人を追跡しました。 年 年初の継続者 その年の解約者 ハザード 1 1000 200 0.20 2 800 120 0.15 3 <span class=\"math-inline\">$(X,Y)$<\/span> について、関数 <span class=\"math-inline\">$f(x,y)$<\/span> が<\/p>\n<div class=\"math-display\">$$f(x,y)\\ge 0,\\qquad \\int_{-\\infty}^{\\infty}\\int_{-\\infty}^{\\infty} f(x,y)\\,dx\\,dy = 1$$<\/div>\n<p>を満たし、平面上のすべての（十分よい）領域 <span class=\"math-inline\">$A$<\/span> について<\/p>\n<div class=\"math-display\">$$P\\big((X,Y)\\in A\\big) = \\iint_A f(x,y)\\,dx\\,dy$$<\/div>\n<p>となるとき、<span class=\"math-inline\">$f$<\/span> を <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率密度関数といいます。\n同時分布関数 <span class=\"math-inline\">$F(x,y)=P(X\\le x,\\,Y\\le y)$<\/span> との関係は<\/p>\n<div class=\"math-display\">$$F(x,y) = \\int_{-\\infty}^{x}\\int_{-\\infty}^{y} f(u,v)\\,dv\\,du,\\qquad f(x,y) = \\frac{\\partial^2}{\\partial x\\,\\partial y}F(x,y)$$<\/div>\n<p>です。期待値は <span class=\"math-inline\">$E[g(X,Y)]=\\iint g(x,y)f(x,y)\\,dx\\,dy$<\/span> で計算します。<\/p>\n<p><span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が独立であるとは、（ほとんど）すべての <span class=\"math-inline\">$(x,y)$<\/span> で<\/p>\n<div class=\"math-display\">$$f(x,y) = f_X(x)\\,f_Y(y)$$<\/div>\n<p>が成り立つことです。<span class=\"math-inline\">$f_X,f_Y$<\/span> は周辺確率密度関数です。<\/p>\n<p>代表例は2変量正規分布です（平均 <span class=\"math-inline\">$\\mu_X,\\mu_Y$<\/span>、標準偏差 <span class=\"math-inline\">$\\sigma_X,\\sigma_Y$<\/span>、相関係数 <span class=\"math-inline\">$\\rho$<\/span>、<span class=\"math-inline\">$|\\rho|&lt;1$<\/span>）。<\/p>\n<div class=\"math-display\">$$f(x,y) = \\frac{1}{2\\pi\\sigma_X\\sigma_Y\\sqrt{1-\\rho^2}}\\exp\\left[-\\frac{1}{2(1-\\rho^2)}\\left\\{\\frac{(x-\\mu_X)^2}{\\sigma_X^2}-\\frac{2\\rho(x-\\mu_X)(y-\\mu_Y)}{\\sigma_X\\sigma_Y}+\\frac{(y-\\mu_Y)^2}{\\sigma_Y^2}\\right\\}\\right]$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$f(x,y)$<\/span>：点 <span class=\"math-inline\">$(x,y)$<\/span> の近くの確率の「濃さ」。小さな長方形 <span class=\"math-inline\">$dx\\times dy$<\/span> に入る確率が、およそ <span class=\"math-inline\">$f(x,y)\\,dx\\,dy$<\/span> です。<\/li>\n<li>確率＝体積：曲面 <span class=\"math-inline\">$z=f(x,y)$<\/span> と領域 <span class=\"math-inline\">$A$<\/span> の間の体積が <span class=\"math-inline\">$P((X,Y)\\in A)$<\/span> です。全体の体積は1です。<\/li>\n<li>1点や1本の直線の上の確率は0です。たとえば <span class=\"math-inline\">$P(X=Y)=0$<\/span> です。<\/li>\n<li>単位：<span class=\"math-inline\">$f(x,y)$<\/span> は「確率 ÷ 面積」です。<span class=\"math-inline\">$x,y$<\/span> の単位を cm から m に変えると、密度の値は1万倍になります。<\/li>\n<\/ul>\n<p>離散型の同時確率関数との対応は、「和 → 積分」「マスの確率 → 小さな長方形の確率 <span class=\"math-inline\">$f\\,dx\\,dy$<\/span>」と置き換えるだけです。\n周辺化・条件付け・期待値の計算の考え方は離散型と同じです。<\/p>\n<p>計算の山場は<strong>積分範囲の設定<\/strong>です。\n<span class=\"math-inline\">$P(X+Y\\le1)$<\/span> のような確率は、領域 <span class=\"math-inline\">$\\{x+y\\le1\\}$<\/span> と台（<span class=\"math-inline\">$f&gt;0$<\/span> の範囲）の共通部分を図に描き、「<span class=\"math-inline\">$x$<\/span> を固定したとき <span class=\"math-inline\">$y$<\/span> がどこからどこまで動くか」を読み取って累次積分にします。<\/p>\n<p>独立性の判定には便利な条件があります。台が長方形（<span class=\"math-inline\">$a&lt;x&lt;b,\\ c&lt;y&lt;d$<\/span> の形）で、<span class=\"math-inline\">$f(x,y)=g(x)h(y)$<\/span> と <span class=\"math-inline\">$x$<\/span> だけの関数と <span class=\"math-inline\">$y$<\/span> だけの関数の積に分けられれば、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> は独立です。\n台が三角形などのときは、式が積の形でも独立ではありません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：一辺1の正方形上の密度<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=x+y\\ \\ (0&lt;x&lt;1,\\ 0&lt;y&lt;1)$<\/span> とします。まず全体の積分が1か確認します。<\/p>\n<div class=\"math-display\">$$\\int_0^1\\int_0^1 (x+y)\\,dy\\,dx = \\int_0^1\\left(x+\\tfrac12\\right)dx = \\tfrac12+\\tfrac12 = 1$$<\/div>\n<ul>\n<li><span class=\"math-inline\">$P(X\\le\\tfrac12,\\,Y\\le\\tfrac12)=\\int_0^{1/2}\\int_0^{1/2}(x+y)\\,dy\\,dx=\\tfrac18=0.125$<\/span><\/li>\n<li><span class=\"math-inline\">$P(X+Y\\le1)=\\int_0^1\\int_0^{1-x}(x+y)\\,dy\\,dx=\\int_0^1\\tfrac{1-x^2}{2}\\,dx=\\tfrac13\\approx0.3333$<\/span><\/li>\n<li><span class=\"math-inline\">$E[X]=\\int_0^1 x\\left(x+\\tfrac12\\right)dx=\\tfrac13+\\tfrac14=\\tfrac{7}{12}\\approx0.5833$<\/span>（<span class=\"math-inline\">$E[Y]$<\/span> も同じ）<\/li>\n<li><span class=\"math-inline\">$E[XY]=\\int_0^1\\int_0^1 xy(x+y)\\,dy\\,dx=\\tfrac13$<\/span> なので、<span class=\"math-inline\">$\\mathrm{Cov}(X,Y)=\\tfrac13-\\left(\\tfrac{7}{12}\\right)^2=-\\tfrac{1}{144}\\approx-0.0069$<\/span><\/li>\n<\/ul>\n<p><span class=\"math-inline\">$x+y$<\/span> は <span class=\"math-inline\">$x$<\/span> だけの関数と <span class=\"math-inline\">$y$<\/span> だけの関数の積に分けられないので、独立ではありません。<\/p>\n<p><strong>例2：2台の機械の故障時間<\/strong><\/p>\n<p>2台の機械の故障までの時間 <span class=\"math-inline\">$X,Y$<\/span>（年）が独立に平均1年の指数分布に従うとき、<span class=\"math-inline\">$f(x,y)=e^{-x}e^{-y}\\ (x,y&gt;0)$<\/span> です。\n1台目が故障したら予備の2台目に切り替える運用で、2台合わせても1年もたない確率は<\/p>\n<div class=\"math-display\">$$P(X+Y\\le1) = \\int_0^1\\int_0^{1-x} e^{-x-y}\\,dy\\,dx = \\int_0^1\\left(e^{-x}-e^{-1}\\right)dx = 1-2e^{-1}\\approx 0.2642$$<\/div>\n<p>また、対称性から <span class=\"math-inline\">$P(X&lt;Y)=0.5$<\/span> です。<\/p>\n<p><strong>例3：三角形の台（積の形でも独立でない）<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=2\\ \\ (0&lt;y&lt;x&lt;1)$<\/span> とします。三角形の面積は <span class=\"math-inline\">$\\tfrac12$<\/span> なので、全体の積分は1です。\n<span class=\"math-inline\">$P(Y&gt;\\tfrac12)$<\/span> は、<span class=\"math-inline\">$y$<\/span> を固定すると <span class=\"math-inline\">$x$<\/span> は <span class=\"math-inline\">$y$<\/span> から <span class=\"math-inline\">$1$<\/span> まで動くので<\/p>\n<div class=\"math-display\">$$P\\left(Y&gt;\\tfrac12\\right) = \\int_{1/2}^{1}\\int_{y}^{1} 2\\,dx\\,dy = \\int_{1/2}^{1}2(1-y)\\,dy = 0.25$$<\/div>\n<p><span class=\"math-inline\">$f=2$<\/span> は定数（積の形）ですが、台が三角形なので独立ではありません。<span class=\"math-inline\">$X=0.3$<\/span> と知れば <span class=\"math-inline\">$Y&lt;0.3$<\/span> に限られるからです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：部品の縦と横の寸法を2変量正規分布でモデル化し、両方が規格内に入る確率（領域の積分）を計算して歩留まりを見積もります。<\/li>\n<li><strong>金融・保険<\/strong>：2つの資産の収益率の同時密度から、両方が同時に大きく下落する確率を評価します。相関が高いほど同時下落の確率が上がります。<\/li>\n<li><strong>医療<\/strong>：血圧の上と下、身長と体重のように同時に測る2つの量を同時密度で表し、正常範囲を楕円（等高線）で決めます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>点の密度が同時確率密度の高さを表しています。ρ を0にすると点は円形に広がり（独立）、1に近づけると右上がりの細い楕円に集まります。\n同時密度の等高線は、2変量正規分布ではいつも楕円になります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定数 <span class=\"math-inline\">$c$<\/span> を「全体の積分＝1」から決め、次に領域の確率を累次積分で求める流れが典型です。積分範囲の図を必ず描きます。<\/li>\n<li>独立性の判定は「台が長方形 かつ 積に分解できる」で行います。台が <span class=\"math-inline\">$0&lt;y&lt;x&lt;1$<\/span> のような三角形なら独立ではありません。<\/li>\n<li>変数変換 <span class=\"math-inline\">$(U,V)=g(X,Y)$<\/span> の同時密度は、ヤコビアンを掛けて求めます（第4章）。<\/li>\n<li>2変量正規分布では「無相関 ⇔ 独立」が成り立ちます。一般の分布では成り立ちません。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 同時密度 <span class=\"math-inline\">$f(x,y)$<\/span> の値そのものを確率とみなす → ○ 確率は積分（体積）です。<span class=\"math-inline\">$f$<\/span> は1を超えてもかまいません。<\/li>\n<li>× 累次積分で、内側の積分範囲に定数だけを書く → ○ 三角形などの領域では、内側の範囲は外側の変数の式（例：<span class=\"math-inline\">$0&lt;y&lt;1-x$<\/span>）になります。<\/li>\n<li>× <span class=\"math-inline\">$f(x,y)$<\/span> の式が積に分かれるから独立 → ○ 台が長方形でなければ独立ではありません。<\/li>\n<\/ul><\/section>","text":"一言でいうと 2つ以上の連続型確率変数が「同時にどのあたりの値をとりやすいか」を、平面（空間）上の濃さで表した関数です。 確率は、この関数を領域で積分した「体積」として求めます。 定義・数式 連続型確率変数 について、関数 が を満たし、平面上のすべての（十分よい）領域 について となるとき、 を の同時確率密度関数といいます。 同時分布関数 との関係は です。期待値は で計算します。 と が独立であるとは、（ほとんど）すべての で が成り立つことです。 は周辺確率密度関数です。 代表例は2変量正規分布です（平均 、標準偏差 、相関係数 、 ）。 数式の読み解き - ：点 の近くの確率の「濃さ」。小さな長方形 に入る確率が、およそ です。 - 確率＝体積：曲面 と領域 の間の体積が です。全体の体積は1です。 - 1点や1本の直線の上の確率は0です。たとえば です。 - 単位： は「確率 ÷ 面積」です。 の単位を cm から m に変えると、密度の値は1万倍になります。 離散型の同時確率関数との対応は、「和 → 積分」「マスの確率 → 小さな長方形の確率 」と置き換えるだけです。 周辺化・条件付け・期待値の計算の考え方は離散型と同じです。 計算の山場は積分範囲 変数なら、行と列に値を並べた「確率の表」と考えるとわかりやすくなります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>離散型確率変数 <span class=\"math-inline\">$X$<\/span>（値 <span class=\"math-inline\">$x_1,x_2,\\dots$<\/span>）と <span class=\"math-inline\">$Y$<\/span>（値 <span class=\"math-inline\">$y_1,y_2,\\dots$<\/span>）の同時確率関数は<\/p>\n<div class=\"math-display\">$$p(x_i, y_j) = P(X = x_i,\\ Y = y_j)$$<\/div>\n<p>です。次の2つを満たします。<\/p>\n<div class=\"math-display\">$$p(x_i,y_j) \\ge 0, \\qquad \\sum_i \\sum_j p(x_i, y_j) = 1$$<\/div>\n<p>事象の確率は、条件を満たす組の確率を足して求めます。<\/p>\n<div class=\"math-display\">$$P\\big((X,Y) \\in A\\big) = \\sum_{(x_i,y_j)\\in A} p(x_i,y_j)$$<\/div>\n<p>関数 <span class=\"math-inline\">$g(X,Y)$<\/span> の期待値は<\/p>\n<div class=\"math-display\">$$E[g(X,Y)] = \\sum_i\\sum_j g(x_i,y_j)\\,p(x_i,y_j)$$<\/div>\n<p><span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> が独立であるとは、すべての <span class=\"math-inline\">$i,j$<\/span> について<\/p>\n<div class=\"math-display\">$$p(x_i,y_j) = p_X(x_i)\\,p_Y(y_j)$$<\/div>\n<p>が成り立つことです。<span class=\"math-inline\">$p_X, p_Y$<\/span> は周辺確率関数です。3変数以上でも同じように定義します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$P(X=x_i, Y=y_j)$<\/span> のカンマは「かつ」です。2つの事象 <span class=\"math-inline\">$\\{X=x_i\\}$<\/span> と <span class=\"math-inline\">$\\{Y=y_j\\}$<\/span> が同時に起こる確率を表します。<\/li>\n<li>合計が1：表のすべてのマスを足すと1です。どの組が出るかで、起こりうることを漏れなく分けているからです。<\/li>\n<li>周辺確率は行・列ごとの合計です。<span class=\"math-inline\">$p_X(x_i)=\\sum_j p(x_i,y_j)$<\/span> は表の各行を横に足したものです。<\/li>\n<\/ul>\n<p>独立の条件は「表のどのマスも、行の合計 × 列の合計 になっている」と読めます。\n1つでも成り立たないマスがあれば独立ではありません。<\/p>\n<p>同時確率関数からは、周辺分布・条件付き分布・共分散など、2変数について知りたいことがすべて計算できます。\n逆に、周辺分布だけからは同時確率関数は決まりません（独立なら決まります）。<\/p>\n<p>計算の手順はいつも同じです。\nまず「知りたい事象に当てはまるマス」を表の中で丸で囲み、次にその確率を足します。\n期待値なら、各マスに「そのマスでの <span class=\"math-inline\">$g(x,y)$<\/span> の値」を書き込み、確率との積を全マスで足します。\n変数が3つ以上になると表は書けませんが、「組ごとの確率を足す」という考え方は変わりません。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：表で与えられた同時分布<\/strong><\/p>\n<p>ある店で、1人の客が買うパンの個数 <span class=\"math-inline\">$X$<\/span> と、コーヒーを買うか（<span class=\"math-inline\">$Y=1$<\/span>）買わないか（<span class=\"math-inline\">$Y=0$<\/span>）の同時確率関数が次の表だとします。<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"math-inline\">$Y=0$<\/span><\/th>\n<th><span class=\"math-inline\">$Y=1$<\/span><\/th>\n<th>計<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">$X=0$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=1$<\/span><\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<td>0.50<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=2$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<\/tr>\n<tr>\n<td>計<\/td>\n<td>0.40<\/td>\n<td>0.60<\/td>\n<td>1.00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><span class=\"math-inline\">$P(X+Y=2)=p(1,1)+p(2,0)=0.30+0.10=0.40$<\/span><\/li>\n<li>独立か：<span class=\"math-inline\">$p(0,0)=0.10$<\/span> に対し <span class=\"math-inline\">$p_X(0)p_Y(0)=0.30\\times0.40=0.12$<\/span> なので、独立ではありません。<\/li>\n<li><span class=\"math-inline\">$E[X]=0\\times0.3+1\\times0.5+2\\times0.2=0.9$<\/span>、<span class=\"math-inline\">$E[Y]=0.6$<\/span><\/li>\n<li><span class=\"math-inline\">$E[XY]=1\\cdot1\\cdot0.30+2\\cdot1\\cdot0.10=0.50$<\/span><\/li>\n<li>\n<p>共分散 <span class=\"math-inline\">$\\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y]=0.50-0.54=-0.04$<\/span><\/p>\n<\/li>\n<li>\n<p>分散は <span class=\"math-inline\">$V[X]=E[X^2]-(E[X])^2=1.3-0.81=0.49$<\/span>、<span class=\"math-inline\">$V[Y]=0.6-0.36=0.24$<\/span> なので、相関係数は <span class=\"math-inline\">$-0.04/\\sqrt{0.49\\times0.24}\\approx-0.1166$<\/span><\/p>\n<\/li>\n<\/ul>\n<p>パンを多く買う客ほど、コーヒーを買う割合がやや低いことがわかります。ただし相関は弱く、関連はわずかです。<\/p>\n<p><strong>例2：非復元抽出<\/strong><\/p>\n<p>赤玉3個・白玉2個の袋から、玉を1個ずつ戻さずに2回取り出します。1回目が赤なら <span class=\"math-inline\">$X=1$<\/span>、2回目が赤なら <span class=\"math-inline\">$Y=1$<\/span> とします。<\/p>\n<div class=\"math-display\">$$\\begin{aligned}\np(1,1) &amp;= \\tfrac{3}{5}\\cdot\\tfrac{2}{4} = 0.3, &amp; p(1,0) &amp;= \\tfrac{3}{5}\\cdot\\tfrac{2}{4} = 0.3,\\\\\np(0,1) &amp;= \\tfrac{2}{5}\\cdot\\tfrac{3}{4} = 0.3, &amp; p(0,0) &amp;= \\tfrac{2}{5}\\cdot\\tfrac{1}{4} = 0.1\n\\end{aligned}$$<\/div>\n<p>合計は1です。<span class=\"math-inline\">$P(X=1)=0.6$<\/span>、<span class=\"math-inline\">$P(Y=1)=0.6$<\/span> ですが、<span class=\"math-inline\">$p(1,1)=0.3\\ne0.6\\times0.6=0.36$<\/span> なので独立ではありません。\n2回目が赤である確率は、1回目の結果を知らなければ1回目と同じ 0.6 になる点も確認できます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>マーケティング<\/strong>：商品Aと商品Bの購入有無を2×2の同時確率として集計し、「一緒に買われやすいか」（独立からのずれ）を調べます。併売分析の基本です。<\/li>\n<li><strong>医療<\/strong>：喫煙の有無と疾患の有無の同時分布を分割表にまとめ、関連があるかを独立性の検定で調べます。<\/li>\n<li><strong>製造・品質管理<\/strong>：1日の不良品数を「機械ごと × 不良の種類ごと」の同時分布で整理し、特定の機械に特定の不良が偏っていないかを見ます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>表の各マスの数値が同時確率、端の数値が行・列の合計（周辺確率）です。\nマスの値が「行の合計 × 列の合計」とずれているところが、2つの変数の関連を表しています。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>表で与えられた同時分布から、周辺分布・条件付き分布・期待値・共分散・相関係数を順に求める問題は重要です。表の端に合計を書き込むと計算が速くなります。<\/li>\n<li>独立性は「すべてのマスで積になるか」で判定します。反例を1つ示せば「独立でない」と言えます。<\/li>\n<li>共分散が0でも独立とは限りません。表で反例を作れるようにしておきます。<\/li>\n<li>多項分布は、試行の結果を数えた個数の同時確率関数です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 周辺分布がわかれば同時分布も決まる → ○ 独立でない限り、同じ周辺分布をもつ同時分布はいくらでもあります。<\/li>\n<li>× 1つのマスで積が成り立てば独立 → ○ すべてのマスで成り立つ必要があります。<\/li>\n<li>× <span class=\"math-inline\">$P(X+Y=2)$<\/span> を <span class=\"math-inline\">$P(X=2)+P(Y=2)$<\/span> と計算する → ○ <span class=\"math-inline\">$x+y=2$<\/span> となる組 <span class=\"math-inline\">$(x,y)$<\/span> をすべて書き出し、その同時確率を足します。<\/li>\n<\/ul><\/section>","text":"一言でいうと 2つ以上の離散型確率変数が「それぞれどの値を同時にとるか」の確率を、組ごとに与える関数です。 2変数なら、行と列に値を並べた「確率の表」と考えるとわかりやすくなります。 定義・数式 離散型確率変数 （値 ）と （値 ）の同時確率関数は です。次の2つを満たします。 事象の確率は、条件を満たす組の確率を足して求めます。 関数 の期待値は と が独立であるとは、すべての について が成り立つことです。 は周辺確率関数です。3変数以上でも同じように定義します。 数式の読み解き - のカンマは「かつ」です。2つの事象 と が同時に起こる確率を表します。 - 合計が1：表のすべてのマスを足すと1です。どの組が出るかで、起こりうることを漏れなく分けているからです。 - 周辺確率は行・列ごとの合計です。 は表の各行を横に足したものです。 独立の条件は「表のどのマスも、行の合計 × 列の合計 になっている」と読めます。 1つでも成り立たないマスがあれば独立ではありません。 同時確率関数からは、周辺分布・条件付き分布・共分散など、2変数について知りたいことがすべて計算できます。 逆に、周辺分布だけからは同時確率関数は決まりません（独立なら決まります）。 計算の手順はいつも同じです。 まず「知りたい事象に当てはまるマス」を表の中で丸で囲み、次にその確率を足します。 期待値なら、各マスに「そのマスでの の値」を書き込み、確率との積を全マスで足します。 変数が3つ以上になると表は書けませんが、「組ごとの確率を足す」という考え方は変わりません。 具体例 例1：表で与えられた同時分布 ある店で、1人の客が買うパンの個数 と、コーヒーを買うか（ ）買わないか（ ）の同時確率関数が次の表だとします。 計 0.10 0.20 0.30 0.20 0.30 0.50 0.10 0.10 0.20 計 0.40 0.60 1.00 - - 独立か： に対し なので、独立ではありません。 - 、 - - 共分散 - 分散は 、 なので、相関係数は パンを多く買う客ほど、コーヒーを買う割合がやや低いことがわかります。ただし相関は弱く、関連はわずかです。 例2：非復元抽出 赤玉3個・白玉2個の袋から、玉を1個ずつ戻さずに2回取り出します。1回目が赤なら 、2回目が赤なら とします。 合計は1です。 、 ですが、 なので独立ではありません。 2回目が赤である確率は、1回目の結果を知らなければ1回目と同じ 0.6 になる点も確認できます。 現場での使われ方 - マーケティング：商品Aと商品Bの購入有無を2×2の同時確率として集計し、「一緒に買われやすいか」（独立からのずれ）を調べます。併売分析の基本です。 - 医療：喫煙の有無と疾患の有無の同時分布を分割表にまとめ、関連があるかを独立性の検定で調べます。 - 製造・品質管理：1日の不良品数を「機械ごと × 不良の種類ごと」の同時分布で整理し、特定の機械に特定の不良が偏っていないかを見ます。 グラフ・イメージ 表の各マスの数値が同時確率、端の数値が行・列の合計（周辺確率）です。 マスの値が「行の合計 × 列の合計」とずれているところが、2つの変数の関連を表しています。 試験のポイント - 表で与えられた同時分布から、周辺分布・条件付き分布・期待値・共分散・相関係数を順に求める問題は重要です。表の端に合計を書き込むと計算が速くなります。 - 独立性は「すべてのマスで積になるか」で判定します。反例を1つ示せば「独立でない」と言えます。 - 共分散が0でも独立とは限りません。表で反例を作れるようにしておきます。 - 多項分布は、試行の結果を数えた個数の同時確率関数です。 よくある間違い - × 周辺分布がわかれば同時分布も決まる → ○ 独立でない限り、同じ周辺分布をもつ同時分布はいくらでもあります。 - × 1つのマスで積が成り立てば独立 → ○ すべてのマスで成り立つ必要があります。 - × を と計算する → ○ となる組 をすべて書き出し、その同時確率を足します。"},"marginal-distribution":{"id":"marginal-distribution","title":"周辺分布","reading":"しゅうへんぶんぷ","en":"Marginal distribution","aliases":["周辺化"],"chapter":2,"importance":"A","tags":["多変量","同時分布","周辺化"],"related":["marginal-probability-function","marginal-probability-density-function","joint-probability-function","joint-probability-density-function","bivariate-normal-distribution","multinomial-distribution"],"charts":[{"type":"custom","id":"joint-marginal","params":{"table":[[0.1,0.2],[0.2,0.3],[0.1,0.1]],"rowLabels":["0","1","2"],"colLabels":["0","1"],"rowName":"X","colName":"Y"},"caption":"表を横に足すと X の周辺分布、縦に足すと Y の周辺分布になる。「表の余白（margin）に書く分布」が名前の由来。"},{"type":"scatter","model":"bvnorm","params":{"rho":0.6,"n":500},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"点の雲を真下（x 軸）に落とした分布が X の周辺分布。ρ をどう変えても、x 軸方向の広がりは変わらない。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>複数の確率変数の同時分布から、注目する一部の変数だけの分布を取り出したものです。\n「他の変数がどの値でもよい」として足し上げる（積分する）ことで求めます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>確率変数の組 <span class=\"math-inline\">$(X,Y)$<\/span> の同時分布が与えられたとき、<span class=\"math-inline\">$X$<\/span> 単独の分布を <span class=\"math-inline\">$X$<\/span> の周辺分布といいます。<\/p>\n<p>離散型（同時確率関数 <span class=\"math-inline\">$p(x,y)$<\/span>）のとき、<\/p>\n<div class=\"math-display\">$$p_X(x) = \\sum_{y} p(x,y)$$<\/div>\n<p>連続型（同時確率密度関数 <span class=\"math-inline\">$f(x,y)$<\/span>）のとき、<\/p>\n<div class=\"math-display\">$$f_X(x) = \\int_{-\\infty}^{\\infty} f(x,y)\\,dy$$<\/div>\n<p>累積分布関数で書くと、同時分布関数 <span class=\"math-inline\">$F(x,y)=P(X\\le x, Y\\le y)$<\/span> から<\/p>\n<div class=\"math-display\">$$F_X(x) = \\lim_{y\\to\\infty} F(x,y)$$<\/div>\n<p>です。変数が3つ以上なら、残したい変数以外のすべてについて和（積分）をとります。\nたとえば <span class=\"math-inline\">$(X_1,X_2,X_3)$<\/span> から <span class=\"math-inline\">$(X_1,X_2)$<\/span> の周辺分布を出すときは <span class=\"math-inline\">$X_3$<\/span> だけを積分します。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li>周辺化：「<span class=\"math-inline\">$Y$<\/span> がどの値をとったかは問わない」ということです。<span class=\"math-inline\">$\\{X=x\\}$<\/span> は、<span class=\"math-inline\">$Y$<\/span> の値で <span class=\"math-inline\">$\\{X=x,Y=y_1\\},\\{X=x,Y=y_2\\},\\dots$<\/span> に排反に分かれるので、それらを足せば <span class=\"math-inline\">$P(X=x)$<\/span> になります（全確率の公式と同じ考え方）。<\/li>\n<li>連続型では和が積分に変わるだけです。<span class=\"math-inline\">$y$<\/span> 方向に「押しつぶす」イメージです。<\/li>\n<li>「周辺（marginal）」は、分割表の余白（margin）に行・列の合計を書くことに由来します。<\/li>\n<\/ul>\n<p>大事な事実が2つあります。<\/p>\n<ol>\n<li>同時分布 → 周辺分布は一意に決まります。<\/li>\n<li>周辺分布 → 同時分布は一般には決まりません。決まるのは、独立のとき（<span class=\"math-inline\">$p(x,y)=p_X(x)p_Y(y)$<\/span>）などの特別な場合です。<\/li>\n<\/ol>\n<p>周辺分布だけを見ると、変数どうしの関係（相関・従属性）の情報は失われます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：表から周辺分布を出す<\/strong><\/p>\n<p>パンの個数 <span class=\"math-inline\">$X$<\/span> とコーヒー購入の有無 <span class=\"math-inline\">$Y$<\/span> の同時確率が下の表のとき、<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><span class=\"math-inline\">$Y=0$<\/span><\/th>\n<th><span class=\"math-inline\">$Y=1$<\/span><\/th>\n<th><span class=\"math-inline\">$p_X$<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"math-inline\">$X=0$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=1$<\/span><\/td>\n<td>0.20<\/td>\n<td>0.30<\/td>\n<td>0.50<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$X=2$<\/span><\/td>\n<td>0.10<\/td>\n<td>0.10<\/td>\n<td>0.20<\/td>\n<\/tr>\n<tr>\n<td><span class=\"math-inline\">$p_Y$<\/span><\/td>\n<td>0.40<\/td>\n<td>0.60<\/td>\n<td>1.00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"math-inline\">$X$<\/span> の周辺分布は <span class=\"math-inline\">$(0.3,\\,0.5,\\,0.2)$<\/span>、<span class=\"math-inline\">$Y$<\/span> の周辺分布は <span class=\"math-inline\">$(0.4,\\,0.6)$<\/span> です。<\/p>\n<p><strong>例2：多項分布の周辺分布は二項分布<\/strong><\/p>\n<p>10人の客が、商品 A, B, C をそれぞれ確率 0.2, 0.3, 0.5 で1つ選ぶとします。選んだ人数 <span class=\"math-inline\">$(N_A,N_B,N_C)$<\/span> は多項分布に従います。\n<span class=\"math-inline\">$N_A$<\/span> の周辺分布は、「A かそれ以外か」の10回の試行と見れば二項分布 <span class=\"math-inline\">$B(10,\\,0.2)$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(N_A=2) = \\binom{10}{2}(0.2)^2(0.8)^8 \\approx 0.3020$$<\/div>\n<p>多項分布の確率を <span class=\"math-inline\">$N_B$<\/span> について <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$8$<\/span> まで足しても、同じ 0.3020 になります。<\/p>\n<p><strong>例3：2変量正規分布の周辺分布<\/strong><\/p>\n<p>身長 <span class=\"math-inline\">$X$<\/span> と体重 <span class=\"math-inline\">$Y$<\/span> が2変量正規分布に従い、<span class=\"math-inline\">$X$<\/span> の平均 170 cm、標準偏差 6 cm だとします。\n相関係数 <span class=\"math-inline\">$\\rho$<\/span> の値に関係なく、<span class=\"math-inline\">$X$<\/span> の周辺分布は <span class=\"math-inline\">$N(170,\\,6^2)$<\/span> です。<\/p>\n<div class=\"math-display\">$$P(X&gt;180) = P\\left(Z &gt; \\tfrac{10}{6}\\right) \\approx 0.0478$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>行政・調査<\/strong>：クロス集計表の「計」の行・列が周辺分布です。性別×年代の表から、年代別の構成比だけを報告する場合などに使います。<\/li>\n<li><strong>金融・保険<\/strong>：複数資産の同時分布から、個別資産の損益の分布を取り出してリスクを評価します。逆に、周辺分布を固定して依存構造だけを別に与える手法（コピュラ）もあります。<\/li>\n<li><strong>IT・Webサービス<\/strong>：ベイズ推定では、関心のないパラメータ（局外母数）を積分して消し、関心のあるパラメータだけの事後分布を求めます。これも周辺化です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>表の図では、行・列の合計が周辺分布です。\n散布図では、ρ のスライダーを動かしても x 軸方向・y 軸方向の広がり（周辺分布）は変わらず、点の雲の傾きだけが変わります。周辺分布だけでは相関がわからないことが見てとれます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>同時密度を積分して周辺密度を求めるときは、<strong>台（値をとる範囲）<\/strong>に注意します。<span class=\"math-inline\">$0&lt;y&lt;x&lt;1$<\/span> のような三角形の台では、積分範囲が <span class=\"math-inline\">$x$<\/span> に依存します。<\/li>\n<li>多項分布の周辺分布は二項分布、多変量正規分布の周辺分布は正規分布（平均ベクトル・共分散行列の該当部分を取り出す）です。<\/li>\n<li>「周辺分布がどちらも正規分布でも、同時分布が2変量正規分布とは限らない」は重要な注意点です。<\/li>\n<li>周辺分布が求まったら、独立性 <span class=\"math-inline\">$f(x,y)=f_X(x)f_Y(y)$<\/span> の確認に進む流れが定番です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 周辺分布が両方わかれば同時分布もわかる → ○ 独立などの仮定がなければ決まりません。<\/li>\n<li>× 周辺密度を求めるとき、台を確かめずにいつも <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$1$<\/span> まで積分する → ○ 台が <span class=\"math-inline\">$x$<\/span> に依存するときは、積分範囲も <span class=\"math-inline\">$x$<\/span> の式になります（例：<span class=\"math-inline\">$0&lt;y&lt;x$<\/span> なら <span class=\"math-inline\">$y$<\/span> は <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$x$<\/span> まで）。<\/li>\n<li>× 周辺分布が正規なら同時分布も多変量正規 → ○ 同時正規性は、すべての線形結合が正規になるという、より強い条件です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 複数の確率変数の同時分布から、注目する一部の変数だけの分布を取り出したものです。 「他の変数がどの値でもよい」として足し上げる（積分する）ことで求めます。 定義・数式 確率変数の組 の同時分布が与えられたとき、 単独の分布を の周辺分布といいます。 離散型（同時確率関数 ）のとき、 連続型（同時確率密度関数 ）のとき、 累積分布関数で書くと、同時分布関数 から です。変数が3つ以上なら、残したい変数以外のすべてについて和（積分）をとります。 たとえば から の周辺分布を出すときは だけを積分します。 数式の読み解き - 周辺化：「 がどの値をとったかは問わない」ということです。 は、 の値で に排反に分かれるので、それらを足せば になります（全確率の公式と同じ考え方）。 - 連続型では和が積分に変わるだけです。 方向に「押しつぶす」イメージです。 - 「周辺（marginal）」は、分割表の余白（margin）に行・列の合計を書くことに由来します。 大事な事実が2つあります。 1. 同時分布 → 周辺分布は一意に決まります。 2. 周辺分布 → 同時分布は一般には決まりません。決まるのは、独立のとき（ ）などの特別な場合です。 周辺分布だけを見ると、変数どうしの関係（相関・従属性）の情報は失われます。 具体例 例1：表から周辺分布を出す パンの個数 とコーヒー購入の有無 の同時確率が下の表のとき、 0.10 0.20 0.30 0.20 0.30 0.50 0.10 0.10 0.20 0.40 0.60 1.00 の周辺分布は 、 の周辺分布は です。 例2：多項分布の周辺分布は二項分布 10人の客が、商品 A, B, C をそれぞれ確率 0.2, 0.3, 0.5 で1つ選ぶとします。選んだ人数 は多項分布に従います。 の周辺分布は、「A かそれ以外か」の10回の試行と見れば二項分布 です。 多項分布の確率を について から まで足しても、同じ 0.3020 になります。 例3：2変量正規分布の周辺分布 身長 と体重 が2変量正規分布に従い、 の平均 170 cm、標準偏差 6 cm だとします。 相関係数 の値に関係なく、 の周辺分布は です。 現場での使われ方 - 行政・調査：クロス集計表の「計」の行・列が周辺分布です。性別×年代の表から、年代別の構成比だけを報告する場合などに使います。 - 金融・保険：複数資産の同時分布から、個別資産の損益の分布を取り出してリスクを評価します。逆に、周辺分布を固定して依存構造だけを別に与える手法（コピュラ）もあります。 - IT・Webサービス：ベイズ推定では、関心のないパラメータ（局外母数）を積分して消し、関心のあるパラメータだけの事後分布を求めます。これも周辺化です。 グラフ・イメージ 表の図では、行・列の合計が周辺分布です。 散布図では、ρ のスライダーを動かしても x 軸方向・y 軸方向の広がり（周辺分布）は変わらず、点の雲の傾きだけが変わります。周辺分布だけでは相関がわからないことが見てとれます。 試験のポイント - 同時密度を積分して周辺密度を求めるときは、台（値をとる範囲）に注意します。 のような三角形の台では、積分範囲が に依存します。 - 多項分布の周辺分布は二項分布、多変量正規分布の周辺分布は正規分布（平均ベクトル・共分散行列の該当部分を取り出す）です。 - 「周辺分布がどちらも正規分布でも、同時分布が2変量正規分布とは限らない」は重要な注意点です。 - 周辺分布が求まったら、独立性 の確認に進む流れが定番です。 よくある間違い - × 周辺分布が両方わかれば同時分布もわかる → ○ 独立などの仮定がなければ決まりません。 - × 周辺密度を求めるとき、台を確かめずにいつも から まで積分する → ○ 台が に依存するときは、積分範囲も の式になります（例： なら は から まで）。 - × 周辺分布が正規なら同時分布も多変量正規 → ○ 同時正規性は、すべての線形結合が正規になるという、より強い条件です。"},"marginal-probability-density-function":{"id":"marginal-probability-density-function","title":"周辺確率密度関数","reading":"しゅうへんかくりつみつどかんすう","en":"Marginal probability density function","aliases":["周辺密度関数"],"chapter":2,"importance":"B","tags":["多変量","連続型","周辺化","重積分"],"related":["marginal-distribution","joint-probability-density-function","conditional-probability-density-function","marginal-probability-function","bivariate-normal-distribution"],"charts":[{"type":"scatter","model":"bvnorm","params":{"rho":0.6,"n":500},"sliders":[{"param":"rho","label":"相関係数 ρ","min":-0.95,"max":0.95,"step":0.05}],"caption":"点の雲を x 軸に落とした（y を無視した）分布が X の周辺密度。ρ を変えても x 方向の広がりは同じ標準正規分布のまま。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>連続型の同時確率密度関数から、1つの変数だけの密度を取り出したものです。\n相手の変数について、端から端まで積分して求めます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>連続型確率変数 <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率密度関数を <span class=\"math-inline\">$f(x,y)$<\/span> とすると、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の周辺確率密度関数は<\/p>\n<div class=\"math-display\">$$f_X(x) = \\int_{-\\infty}^{\\infty} f(x,y)\\,dy,\\qquad f_Y(y) = \\int_{-\\infty}^{\\infty} f(x,y)\\,dx$$<\/div>\n<p>です。実際の積分範囲は、<span class=\"math-inline\">$x$<\/span> を固定したときに <span class=\"math-inline\">$f(x,y)&gt;0$<\/span> となる <span class=\"math-inline\">$y$<\/span> の範囲（台の切り口）です。<\/p>\n<p>周辺密度は1変数の密度の条件 <span class=\"math-inline\">$f_X(x)\\ge0$<\/span>、<span class=\"math-inline\">$\\int f_X(x)\\,dx=1$<\/span> を満たします。条件付き密度 <span class=\"math-inline\">$f(y\\mid x)$<\/span> を使えば<\/p>\n<div class=\"math-display\">$$f_Y(y) = \\int_{-\\infty}^{\\infty} f(y\\mid x)\\,f_X(x)\\,dx$$<\/div>\n<p>とも書けます（全確率の公式の連続版）。<\/p>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$\\int f(x,y)\\,dy$<\/span>：<span class=\"math-inline\">$x$<\/span> を固定して、<span class=\"math-inline\">$y$<\/span> 方向に「同時密度の切り口の面積」を求めています。その面積が <span class=\"math-inline\">$x$<\/span> 付近の確率の濃さです。<\/li>\n<li>離散型の「行の合計」が、連続型では「切り口の積分」になります。<\/li>\n<\/ul>\n<p>なぜこれで <span class=\"math-inline\">$X$<\/span> の密度になるかは、累積分布関数から確かめられます。<\/p>\n<div class=\"math-display\">$$P(X\\le x) = \\int_{-\\infty}^{x}\\left\\{\\int_{-\\infty}^{\\infty} f(u,y)\\,dy\\right\\}du$$<\/div>\n<p>これを <span class=\"math-inline\">$x$<\/span> で微分すると、中かっこの中身 <span class=\"math-inline\">$f_X(x)$<\/span> が出てきます。<\/p>\n<p>3変数以上でも考え方は同じです。<span class=\"math-inline\">$(X,Y,Z)$<\/span> の同時密度 <span class=\"math-inline\">$f(x,y,z)$<\/span> から <span class=\"math-inline\">$X$<\/span> の周辺密度を出すときは <span class=\"math-inline\">$y$<\/span> と <span class=\"math-inline\">$z$<\/span> の両方で積分し、<span class=\"math-inline\">$(X,Y)$<\/span> の周辺密度を出すときは <span class=\"math-inline\">$z$<\/span> だけで積分します。<\/p>\n<p>注意したいのは、周辺密度には変数どうしの関係の情報が残らないことです。\n同じ周辺密度をもつ同時密度はいくらでも作れます。たとえば2変量正規分布は、<span class=\"math-inline\">$\\rho$<\/span> がいくつでも周辺密度は同じ正規分布です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：三角形の台<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=2\\ \\ (0&lt;y&lt;x&lt;1)$<\/span> とします。<span class=\"math-inline\">$x$<\/span> を固定すると <span class=\"math-inline\">$y$<\/span> は <span class=\"math-inline\">$0$<\/span> から <span class=\"math-inline\">$x$<\/span> まで、<span class=\"math-inline\">$y$<\/span> を固定すると <span class=\"math-inline\">$x$<\/span> は <span class=\"math-inline\">$y$<\/span> から <span class=\"math-inline\">$1$<\/span> までです。<\/p>\n<div class=\"math-display\">$$f_X(x) = \\int_0^{x} 2\\,dy = 2x\\quad(0&lt;x&lt;1),\\qquad f_Y(y) = \\int_y^{1} 2\\,dx = 2(1-y)\\quad(0&lt;y&lt;1)$$<\/div>\n<p><span class=\"math-inline\">$E[X]=\\int_0^1 2x^2\\,dx=\\tfrac23\\approx0.6667$<\/span>、<span class=\"math-inline\">$E[Y]=\\int_0^1 2y(1-y)\\,dy=\\tfrac13\\approx0.3333$<\/span> です。\n<span class=\"math-inline\">$f_X(x)f_Y(y)=4x(1-y)$<\/span> は <span class=\"math-inline\">$f(x,y)=2$<\/span> と一致しないので、独立ではありません。<\/p>\n<p><strong>例2：正方形上の密度<\/strong><\/p>\n<p><span class=\"math-inline\">$f(x,y)=x+y\\ \\ (0&lt;x&lt;1,\\,0&lt;y&lt;1)$<\/span> なら <span class=\"math-inline\">$f_X(x)=\\int_0^1(x+y)\\,dy=x+\\tfrac12$<\/span> です。<\/p>\n<div class=\"math-display\">$$P\\left(X\\le\\tfrac12\\right) = \\int_0^{1/2}\\left(x+\\tfrac12\\right)dx = \\tfrac18+\\tfrac14 = 0.375$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>製造・品質管理<\/strong>：部品の縦横の寸法の同時分布から、縦の寸法だけの分布を出して、縦方向の規格外れ率を求めます。<\/li>\n<li><strong>金融・保険<\/strong>：ポートフォリオ全体のモデルから個別資産の損益分布を取り出し、資産ごとのリスク指標を計算します。<\/li>\n<li><strong>医療<\/strong>：ベイズ流の解析で、関心のある治療効果以外のパラメータを積分で消し、治療効果だけの事後分布（周辺事後分布）を求めます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>散布図の点を縦方向につぶして x 軸上に集めると、X の周辺分布の形が見えます。\nρ のスライダーで点の雲の傾きが変わっても、x 軸方向・y 軸方向の広がりは変わらないことを確認してください。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>台が三角形や <span class=\"math-inline\">$0&lt;x&lt;y$<\/span> のような形のとき、積分範囲が相手の変数に依存します。図を描いて切り口の範囲を読むのが要点です。<\/li>\n<li>2変量正規分布の周辺分布は正規分布 <span class=\"math-inline\">$N(\\mu_X,\\sigma_X^2)$<\/span> で、<span class=\"math-inline\">$\\rho$<\/span> に依存しません。<\/li>\n<li>周辺密度の積と同時密度を比べて独立性を判定する流れは重要です。<\/li>\n<li>周辺密度から求めた <span class=\"math-inline\">$E[X]$<\/span> と、同時密度で直接計算した <span class=\"math-inline\">$\\iint x f(x,y)\\,dx\\,dy$<\/span> は一致します。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 周辺密度の定義域を書き忘れる → ○ <span class=\"math-inline\">$f_X(x)=2x$<\/span> だけでなく「<span class=\"math-inline\">$0&lt;x&lt;1$<\/span>」まで書いて初めて密度が決まります。<\/li>\n<li>× <span class=\"math-inline\">$f_X(x)$<\/span> を求めるのに <span class=\"math-inline\">$x$<\/span> で積分する → ○ 積分するのは相手の変数 <span class=\"math-inline\">$y$<\/span> です。結果は <span class=\"math-inline\">$x$<\/span> の関数になります。<\/li>\n<li>× 例1で <span class=\"math-inline\">$f_Y(y)=\\int_0^1 2\\,dx=2$<\/span> とする → ○ <span class=\"math-inline\">$y$<\/span> を固定すると <span class=\"math-inline\">$x$<\/span> は <span class=\"math-inline\">$y&lt;x&lt;1$<\/span> の範囲しか動かないので <span class=\"math-inline\">$2(1-y)$<\/span> です。<\/li>\n<\/ul><\/section>","text":"一言でいうと 連続型の同時確率密度関数から、1つの変数だけの密度を取り出したものです。 相手の変数について、端から端まで積分して求めます。 定義・数式 連続型確率変数 の同時確率密度関数を とすると、 と の周辺確率密度関数は です。実際の積分範囲は、 を固定したときに となる の範囲（台の切り口）です。 周辺密度は1変数の密度の条件 、 を満たします。条件付き密度 を使えば とも書けます（全確率の公式の連続版）。 数式の読み解き - ： を固定して、 方向に「同時密度の切り口の面積」を求めています。その面積が 付近の確率の濃さです。 - 離散型の「行の合計」が、連続型では「切り口の積分」になります。 なぜこれで の密度になるかは、累積分布関数から確かめられます。 これを で微分すると、中かっこの中身 が出てきます。 3変数以上でも考え方は同じです。 の同時密度 から の周辺密度を出すときは と の両方で積分し、 の周辺密度を出すときは だけで積分します。 注意したいのは、周辺密度には変数どうしの関係の情報が残らないことです。 同じ周辺密度をもつ同時密度はいくらでも作れます。たとえば2変量正規分布は、 がいくつでも周辺密度は同じ正規分布です。 具体例 例1：三角形の台 とします。 を固定すると は から まで、 を固定すると は から までです。 、 です。 は と一致しないので、独立ではありません。 例2：正方形上の密度 なら です。 現場での使われ方 - 製造・品質管理：部品の縦横の寸法の同時分布から、縦の寸法だけの分布を出して、縦方向の規格外れ率を求めます。 - 金融・保険：ポートフォリオ全体のモデルから個別資産の損益分布を取り出し、資産ごとのリスク指標を計算します。 - 医療：ベイズ流の解析で、関心のある治療効果以外のパラメータを積分で消し、治療効果だけの事後分布（周辺事後分布）を求めます。 グラフ・イメージ 散布図の点を縦方向につぶして x 軸上に集めると、X の周辺分布の形が見えます。 ρ のスライダーで点の雲の傾きが変わっても、x 軸方向・y 軸方向の広がりは変わらないことを確認してください。 試験のポイント - 台が三角形や のような形のとき、積分範囲が相手の変数に依存します。図を描いて切り口の範囲を読むのが要点です。 - 2変量正規分布の周辺分布は正規分布 で、 に依存しません。 - 周辺密度の積と同時密度を比べて独立性を判定する流れは重要です。 - 周辺密度から求めた と、同時密度で直接計算した は一致します。 よくある間違い - × 周辺密度の定義域を書き忘れる → ○ だけでなく「 」まで書いて初めて密度が決まります。 - × を求めるのに で積分する → ○ 積分するのは相手の変数 です。結果は の関数になります。 - × 例1で とする → ○ を固定すると は の範囲しか動かないので です。"},"marginal-probability-function":{"id":"marginal-probability-function","title":"周辺確率関数","reading":"しゅうへんかくりつかんすう","en":"Marginal probability mass function","aliases":["周辺確率質量関数"],"chapter":2,"importance":"B","tags":["多変量","離散型","周辺化"],"related":["marginal-distribution","joint-probability-function","conditional-probability-function","marginal-probability-density-function","law-of-total-probability"],"charts":[{"type":"custom","id":"joint-marginal","params":{"table":[[0.1,0.3],[0.3,0.3]],"rowLabels":["白","赤"],"colLabels":["白","赤"],"rowName":"1回目","colName":"2回目"},"caption":"赤玉3個・白玉2個から戻さずに2回取り出したときの同時確率。行の合計も列の合計も（赤 0.6、白 0.4）で等しい。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p>離散型の同時確率関数から、1つの変数だけの確率関数を取り出したものです。\n表で言えば、行ごと・列ごとの合計です。<\/p>\n<\/section><section class=\"sec\" data-sec=\"definition\" id=\"sec-definition\"><h2>定義・数式<\/h2>\n<p>離散型確率変数 <span class=\"math-inline\">$(X,Y)$<\/span> の同時確率関数を <span class=\"math-inline\">$p(x,y)=P(X=x,Y=y)$<\/span> とすると、<span class=\"math-inline\">$X$<\/span> と <span class=\"math-inline\">$Y$<\/span> の周辺確率関数は<\/p>\n<div class=\"math-display\">$$p_X(x) = \\sum_{y} p(x,y), \\qquad p_Y(y) = \\sum_{x} p(x,y)$$<\/div>\n<p>です。和は、相手の変数がとりうるすべての値についてとります。\n周辺確率関数は、それ自体が確率関数の条件 <span class=\"math-inline\">$p_X(x)\\ge0$<\/span>、<span class=\"math-inline\">$\\sum_x p_X(x)=1$<\/span> を満たします。<\/p>\n<p>条件付き確率関数 <span class=\"math-inline\">$p(y\\mid x)$<\/span> を使うと、全確率の公式の形にも書けます。<\/p>\n<div class=\"math-display\">$$p_Y(y) = \\sum_{x} p(y\\mid x)\\,p_X(x)$$<\/div>\n<\/section><section class=\"sec\" data-sec=\"reading\" id=\"sec-reading\"><h2>数式の読み解き<\/h2>\n<ul>\n<li><span class=\"math-inline\">$p_X(x)$<\/span>：「<span class=\"math-inline\">$Y$<\/span> が何であっても <span class=\"math-inline\">$X=x$<\/span>」となる確率。<span class=\"math-inline\">$Y$<\/span> の値で場合分けした確率を合計しています。<\/li>\n<li>2つ目の式は「まず <span class=\"math-inline\">$X$<\/span> が決まり、それに応じて <span class=\"math-inline\">$Y$<\/span> が出る」という2段階の仕組みで <span class=\"math-inline\">$Y$<\/span> の確率を求める形です。<\/li>\n<\/ul>\n<p><span class=\"math-inline\">$X$<\/span> の期待値は、同時確率関数からも周辺確率関数からも計算できます。<\/p>\n<div class=\"math-display\">$$E[X] = \\sum_x\\sum_y x\\,p(x,y) = \\sum_x x\\left(\\sum_y p(x,y)\\right) = \\sum_x x\\,p_X(x)$$<\/div>\n<p><span class=\"math-inline\">$X$<\/span> だけに関する量は、周辺確率関数があれば十分です。\n逆に、<span class=\"math-inline\">$E[XY]$<\/span> や <span class=\"math-inline\">$P(X&lt;Y)$<\/span> のように2つの変数がからむ量は、周辺確率関数だけでは計算できません。同時確率関数に戻る必要があります。<\/p>\n<p>3変数 <span class=\"math-inline\">$(X,Y,Z)$<\/span> の場合も同じです。<span class=\"math-inline\">$p_X(x)=\\sum_y\\sum_z p(x,y,z)$<\/span> のように、残したい変数以外のすべてについて和をとります。\n<span class=\"math-inline\">$(X,Y)$<\/span> の組の周辺確率関数 <span class=\"math-inline\">$p_{XY}(x,y)=\\sum_z p(x,y,z)$<\/span> のように、2変数を残すこともできます。<\/p>\n<\/section><section class=\"sec\" data-sec=\"example\" id=\"sec-example\"><h2>具体例<\/h2>\n<p><strong>例1：式で与えられた同時確率関数<\/strong><\/p>\n<p><span class=\"math-inline\">$x,y\\in\\{1,2\\}$<\/span> で <span class=\"math-inline\">$p(x,y)=c(x+y)$<\/span> とします。合計が1なので<\/p>\n<div class=\"math-display\">$$c\\{(1+1)+(1+2)+(2+1)+(2+2)\\} = 12c = 1 \\quad\\Rightarrow\\quad c=\\tfrac{1}{12}$$<\/div>\n<p><span class=\"math-inline\">$X$<\/span> の周辺確率関数は<\/p>\n<div class=\"math-display\">$$p_X(1) = \\tfrac{2+3}{12} = \\tfrac{5}{12},\\qquad p_X(2) = \\tfrac{3+4}{12} = \\tfrac{7}{12}$$<\/div>\n<p><span class=\"math-inline\">$E[X]=1\\times\\tfrac{5}{12}+2\\times\\tfrac{7}{12}=\\tfrac{19}{12}\\approx 1.5833$<\/span> です。\n対称性から <span class=\"math-inline\">$Y$<\/span> の周辺確率関数も同じです。<span class=\"math-inline\">$p(1,1)=\\tfrac{2}{12}\\approx0.1667$<\/span> と <span class=\"math-inline\">$p_X(1)p_Y(1)=\\tfrac{25}{144}\\approx0.1736$<\/span> が違うので、<span class=\"math-inline\">$X,Y$<\/span> は独立ではありません。<\/p>\n<p><strong>例2：くじ引きの順番<\/strong><\/p>\n<p>赤玉3個・白玉2個から戻さずに2回取り出すとき、2回目が赤である確率は、1回目で場合分けして<\/p>\n<div class=\"math-display\">$$p_Y(\\text{赤}) = \\tfrac{2}{4}\\times\\tfrac{3}{5} + \\tfrac{3}{4}\\times\\tfrac{2}{5} = 0.3+0.3 = 0.6$$<\/div>\n<p>1回目と同じ 0.6 です。くじ引きは先に引いても後に引いても、当たる確率（周辺確率）は同じです。<\/p>\n<\/section><section class=\"sec\" data-sec=\"field\" id=\"sec-field\"><h2>現場での使われ方<\/h2>\n<ul>\n<li><strong>行政・調査<\/strong>：世帯人数×車の保有台数のクロス表から、世帯人数だけの分布（周辺確率）を計算して報告します。<\/li>\n<li><strong>医療<\/strong>：「年齢層 × 検査結果」の同時確率から、集団全体の陽性率（周辺確率）を求め、検査キットの必要数を見積もります。<\/li>\n<li><strong>マーケティング<\/strong>：「来店経路 × 購入の有無」の同時確率から、全体の購入率（周辺確率）と経路別の購入率（条件付き確率）を比べます。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"chart\" id=\"sec-chart\"><h2>グラフ・イメージ<\/h2>\n<p>表の右端の列が1回目の周辺確率、下端の行が2回目の周辺確率です。\nどちらも赤 0.6、白 0.4 で一致しています。\n一方、「赤・赤」は 0.3 で <span class=\"math-inline\">$0.6\\times0.6=0.36$<\/span> より小さく、1回目が赤だと2回目は赤が出にくくなる（従属している）ことがわかります。<\/p>\n<\/section><section class=\"sec\" data-sec=\"exam\" id=\"sec-exam\"><h2>試験のポイント<\/h2>\n<ul>\n<li>定数 <span class=\"math-inline\">$c$<\/span> を「合計1」から決め、そのあと周辺確率関数を求める流れが典型です。<\/li>\n<li>周辺確率関数の積と同時確率関数を比べて独立性を判定します。<\/li>\n<li>多項分布の1成分の周辺確率関数は二項分布になります。<\/li>\n<li>「2段階で決まる確率」（先に <span class=\"math-inline\">$X$<\/span>、次に <span class=\"math-inline\">$Y$<\/span>）を求める問題では、<span class=\"math-inline\">$p_Y(y)=\\sum_x p(y\\mid x)p_X(x)$<\/span> で周辺化します。ベイズの定理の分母も同じ計算です。<\/li>\n<\/ul>\n<\/section><section class=\"sec\" data-sec=\"mistake\" id=\"sec-mistake\"><h2>よくある間違い<\/h2>\n<ul>\n<li>× 周辺確率関数を求めるとき、注目している変数自身について和をとる → ○ <span class=\"math-inline\">$p_X(x)$<\/span> は<strong>相手の変数<\/strong> <span class=\"math-inline\">$y$<\/span> について和をとります。<\/li>\n<li>× 周辺確率の積が同時確率になると決めつける → ○ それは独立のときだけです。<\/li>\n<\/ul><\/section>","text":"一言でいうと 離散型の同時確率関数から、1つの変数だけの確率関数を取り出したものです。 表で言えば、行ごと・列ごとの合計です。 定義・数式 離散型確率変数 の同時確率関数を とすると、 と の周辺確率関数は です。和は、相手の変数がとりうるすべての値についてとります。 周辺確率関数は、それ自体が確率関数の条件 、 を満たします。 条件付き確率関数 を使うと、全確率の公式の形にも書けます。 数式の読み解き - ：「 が何であっても 」となる確率。 の値で場合分けした確率を合計しています。 - 2つ目の式は「まず が決まり、それに応じて が出る」という2段階の仕組みで の確率を求める形です。 の期待値は、同時確率関数からも周辺確率関数からも計算できます。 だけに関する量は、周辺確率関数があれば十分です。 逆に、 や のように2つの変数がからむ量は、周辺確率関数だけでは計算できません。同時確率関数に戻る必要があります。 3変数 の場合も同じです。 のように、残したい変数以外のすべてについて和をとります。 の組の周辺確率関数 のように、2変数を残すこともできます。 具体例 例1：式で与えられた同時確率関数 で とします。合計が1なので の周辺確率関数は です。 対称性から の周辺確率関数も同じです。 と が違うので、 は独立ではありません。 例2：くじ引きの順番 赤玉3個・白玉2個から戻さずに2回取り出すとき、2回目が赤である確率は、1回目で場合分けして 1回目と同じ 0.6 です。くじ引きは先に引いても後に引いても、当たる確率（周辺確率）は同じです。 現場での使われ方 - 行政・調査：世帯人数×車の保有台数のクロス表から、世帯人数だけの分布（周辺確率）を計算して報告します。 - 医療：「年齢層 × 検査結果」の同時確率から、集団全体の陽性率（周辺確率）を求め、検査キットの必要数を見積もります。 - マーケティング：「来店経路 × 購入の有無」の同時確率から、全体の購入率（周辺確率）と経路別の購入率（条件付き確率）を比べます。 グラフ・イメージ 表の右端の列が1回目の周辺確率、下端の行が2回目の周辺確率です。 どちらも赤 0.6、白 0.4 で一致しています。 一方、「赤・赤」は 0.3 で より小さく、1回目が赤だと2回目は赤が出にくくなる（従属している）ことがわかります。 試験のポイント - 定数 を「合計1」から決め、そのあと周辺確率関数を求める流れが典型です。 - 周辺確率関数の積と同時確率関数を比べて独立性を判定します。 - 多項分布の1成分の周辺確率関数は二項分布になります。 - 「2段階で決まる確率」（先に 、次に ）を求める問題では、 で周辺化します。ベイズの定理の分母も同じ計算です。 よくある間違い - × 周辺確率関数を求めるとき、注目している変数自身について和をとる → ○ は相手の変数 について和をとります。 - × 周辺確率の積が同時確率になると決めつける → ○ それは独立のときだけです。"},"moment-generating-function":{"id":"moment-generating-function","title":"モーメント母関数","reading":"もーめんとぼかんすう","en":"Moment generating function","aliases":["積率母関数","MGF","キュムラント母関数"],"chapter":2,"importance":"A","tags":["母関数","モーメント","キュムラント","再生性"],"related":["probability-generating-function","characteristic-function","binomial-distribution","poisson-distribution","normal-distribution","skewness-kurtosis"],"charts":[{"type":"custom","id":"mgf-curve","params":{"family":"poisson","lambda":3},"sliders":[{"param":"lambda","label":"ポアソン分布の λ","min":0.5,"max":10,"step":0.5}],"caption":"ポアソン分布のモーメント母関数 M(t) の曲線と、t=0 での接線。接線の傾きが E[X]＝λ になる。"},{"type":"pmf","dist":"poisson","params":{"lambda":3},"sliders":[{"param":"lambda","label":"λ","min":0.5,"max":15,"step":0.5}],"x":{"min":0,"max":25},"caption":"モーメント母関数を微分して得た平均 λ と分散 λ を、分布の中心と広がりとして確かめる。"}],"html":"<section class=\"sec\" data-sec=\"summary\" id=\"sec-summary\"><h2>一言でいうと<\/h2>\n<p><span class=\"math-inline\">$E[e^{tX}]$<\/span> という1つの関数に、分布のモーメント（<span class=\"math-inline\">$E[X]$<\/span>、<span class=\"math-inline\">$E[X^2]$<\/span>、…）をすべて詰め込んだものです。\n微分して <span class=\"math-inline\">$t=0$<\/span>
