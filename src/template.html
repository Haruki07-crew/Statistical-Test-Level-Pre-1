<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>準1級 用語辞典</title>
<meta name="description" content="統計検定準1級の用語を『統計学実践ワークブック』の章立てに沿って解説する辞典">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // テーマはちらつきを防ぐため最初に適用する
  try { var t = localStorage.getItem('jd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
{{CSS}}
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
  svg: { fontCache: 'global' },
  startup: { typeset: false, pageReady: function () { return MathJax.startup.defaultPageReady().then(function () { document.dispatchEvent(new Event('mathjax-ready')); }); } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
</head>
<body>
<header class="top">
  <button id="btn-nav" class="icon-btn nav-toggle" type="button" aria-label="章の一覧を開く" aria-controls="nav" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#all"><span class="brand-main">準1級 用語辞典</span></a>
  <div class="search">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="用語・読み・英語で検索" autocomplete="off" aria-label="用語を検索">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
  </div>
  <button id="btn-theme" class="icon-btn" type="button" aria-label="ライト／ダークを切り替える">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3z" fill="currentColor"/></svg>
  </button>
</header>
<div class="layout">
  <nav id="nav" class="pane nav" aria-label="章"></nav>
  <section id="list" class="pane list" aria-label="用語一覧"></section>
  <main id="detail" class="pane detail" aria-live="polite"></main>
</div>
<div id="scrim" class="scrim" hidden></div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
