<!doctype html>
<html lang="ja" data-level="{{LEVEL}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="{{THEME}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{SHORT}}">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="{{ASSET}}icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ASSET}}icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // テーマと文字サイズはちらつきを防ぐため最初に適用する
  try { var t = localStorage.getItem('jd-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  try { var d = JSON.parse(localStorage.getItem('{{KP}}data') || 'null'); if (d && /^(s|m|l)$/.test(d.font)) document.documentElement.setAttribute('data-font', d.font); } catch (e) {}
</script>
<style>
{{CSS}}
</style>
<script>
// 数式の設定。\boldsymbol は自動読み込みだと描画の途中で追加のファイルを取りに行くため、最初に読み込んでおく（sw.js でも保存する）
// 準備ができたら mathjax-ready、読み込みに失敗したら mathjax-failed を送る（app.js の showMath が受け取る）
window.MathJax = {
  loader: { load: ['[tex]/boldsymbol'] },
  tex: { packages: { '[+]': ['boldsymbol'] }, inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
  svg: { fontCache: 'global' },
  startup: { typeset: false, pageReady: function () {
    return MathJax.startup.defaultPageReady().then(function () { document.dispatchEvent(new Event('mathjax-ready')); },
      function () { window.__mjFailed = 1; document.dispatchEvent(new Event('mathjax-failed')); });
  } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer onerror="window.__mjFailed=1;document.dispatchEvent(new Event('mathjax-failed'))"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
</head>
<body>
<header class="top">
  <button id="btn-list" class="icon-btn list-toggle" type="button" aria-label="用語の一覧をたたむ" aria-controls="list" aria-expanded="true" title="用語の一覧をたたむ／ひらく">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.8"/><path class="arrow" d="M15.5 9.5l-2.5 2.5 2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <a class="brand" href="#home"><span class="brand-main">{{NAME}}</span></a>
  <div class="search">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="用語・読み・英語で検索" autocomplete="off" aria-label="用語を検索">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
  </div>
  <nav id="modes" class="modes" aria-label="画面の切り替え">
    <a href="#home" data-mode="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ホーム</span></a>
    <a href="#all" data-mode="dict"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M5 17a3 3 0 0 1 3-3h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>辞書</span></a>
    <a href="#book" data-mode="book"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2zM12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>教科書</span></a>
    <a href="#quiz" data-mode="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.7M12 17h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>問題</span></a>
    <a href="#exam" data-mode="exam"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>模試</span></a>
    <a href="#roadmap" data-mode="roadmap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 17.5h6.5a3 3 0 0 0 0-6h-5a3 3 0 0 1 0-6H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl-long">ロードマップ</span><span class="lbl-short">道順</span></a>
    <a href="#review" data-mode="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>復習</span><b class="badge" hidden></b></a>
    <a href="#stats" data-mode="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>記録</span></a>
  </nav>
  <button id="btn-theme" class="icon-btn" type="button" aria-label="ライト／ダークを切り替える">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3z" fill="currentColor"/></svg>
  </button>
</header>
<div class="layout">
  <section id="list" class="pane list" aria-label="用語一覧"></section>
  <main id="detail" class="pane detail" aria-live="polite"></main>
</div>
<script type="application/json" id="data">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
