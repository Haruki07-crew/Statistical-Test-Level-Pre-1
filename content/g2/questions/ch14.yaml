chapter: 14
questions:
  # ---------- 回帰分析の出力の読み方 (A) ----------
  - id: q14-regression-output-1
    term: regression-output
    level: 基本
    type: numeric
    question: |
      回帰分析の出力で、ある説明変数の係数の推定値が 0.36、標準誤差が 0.12 だった。この係数の t 値を求めよ。
    answer: 3
    tolerance: 0.001
    hint: |
      t 値 ＝ 推定値 ÷ 標準誤差。
    explanation: |
      $$t=\frac{0.36}{0.12}=3$$
      自由度が十分大きければ、|t| が 2 程度を超えると有意水準 5% で有意になります。

  - id: q14-regression-output-2
    term: regression-output
    level: 標準
    type: choice
    question: |
      重回帰分析の出力で、説明変数 A、B、C の係数の p 値はそれぞれ 0.003、0.210、0.048 だった。有意水準 5% で係数が 0 でないといえる説明変数はどれか。
    choices:
      - A と C
      - A だけ
      - A、B、C のすべて
      - B だけ
    answer: 0
    hint: |
      p 値が 0.05 より小さいものを選ぶ。
    explanation: |
      p 値が 0.05 未満なのは A（0.003）と C（0.048）なので、この 2 つです。
      B（0.210）は有意ではありませんが、それは「関係がないと証明された」ことを意味しません。

  - id: q14-regression-output-3
    term: regression-output
    level: 標準
    type: numeric
    question: |
      データ 25 個、説明変数 3 個の重回帰分析で、決定係数が 0.60 だった。自由度調整済み決定係数を小数第 3 位まで求めよ。
    answer: 0.543
    tolerance: 0.001
    hint: |
      $1-(1-R^2)\dfrac{n-1}{n-p-1}$。
    explanation: |
      $$1-(1-0.60)\times\frac{24}{21}=1-0.4\times 1.1429\approx 0.543$$

  - id: q14-regression-output-4
    term: regression-output
    level: 標準
    type: truefalse
    question: |
      重回帰分析では、係数の推定値の絶対値が大きい説明変数ほど、目的変数への影響が大きいといえる。
    answer: false
    hint: |
      身長を cm で測るか m で測るかで、係数はどう変わるか。
    explanation: |
      係数の大きさは説明変数の単位に依存します（cm を m に変えると係数は 100 倍）。
      影響の大きさを比べるには、t 値や、変数を標準化してから求めた係数（標準化偏回帰係数）を使います。

  - id: q14-regression-output-5
    term: regression-output
    level: 基本
    type: numeric
    question: |
      回帰分析の結果、$\hat y = 1.5 + 0.8x_1 - 0.3x_2$ が得られた。$x_1=10,\ x_2=4$ のときの予測値を求めよ。
    answer: 8.3
    tolerance: 0.001
    hint: |
      係数に値を代入する。
    explanation: |
      $$1.5+0.8\times 10-0.3\times 4=1.5+8-1.2=8.3$$

  # ---------- 回帰係数のt検定（共通の用語・2級の問題） ----------
  - id: q14-regression-coefficient-t-test-g1
    term: regression-coefficient-t-test
    level: 基本
    type: numeric
    question: |
      回帰分析の出力で、ある係数の推定値は 1.2、t 値は 4.0 だった。この係数の標準誤差を求めよ。
    answer: 0.3
    tolerance: 0.001
    hint: |
      t 値 ＝ 推定値 ÷ 標準誤差。
    explanation: |
      $1.2/4.0=0.3$ です。

  # ---------- 自由度調整済み決定係数（共通の用語・2級の問題） ----------
  - id: q14-adjusted-r-squared-g1
    term: adjusted-r-squared
    level: 標準
    type: numeric
    question: |
      データ 31 件、説明変数 5 個の重回帰分析で、決定係数は 0.70 だった。自由度調整済み決定係数を求めよ。
    answer: 0.64
    tolerance: 0.001
    hint: |
      $1-(1-R^2)(n-1)/(n-p-1)$。
    explanation: |
      $1-0.30\times 30/25=1-0.36=0.64$ です。

  # ---------- 重回帰モデル（共通の用語・2級の問題） ----------
  - id: q14-multiple-regression-model-g1
    term: multiple-regression-model
    level: 標準
    type: choice
    question: |
      体重 $y$（kg）を身長 $x_1$（cm）と 1 日の運動時間 $x_2$（時間）で説明する重回帰で、$x_2$ の係数が −1.5 だった。正しい解釈はどれか。
    choices:
      - 身長が同じなら、運動時間が 1 時間長いと体重は平均 1.5 kg 軽いと推定される
      - 運動時間が 1 時間長いと、身長に関係なく体重が必ず 1.5 kg 減る
      - 運動時間と体重の相関係数は −1.5 である
      - 身長が 1 cm 高いと、体重は 1.5 kg 軽い
    answer: 0
    hint: |
      重回帰の係数は、他の説明変数を一定にしたときの効果。
    explanation: |
      偏回帰係数は「他の説明変数（身長）を一定にしたとき」の平均的な変化を表します。個人ごとに必ずそうなるわけではなく、相関係数とも違います。

  - id: q14-multiple-regression-model-g2
    term: multiple-regression-model
    level: 標準
    type: numeric
    question: |
      30 件のデータで、説明変数 3 個の重回帰分析を行ったところ、残差平方和は 416 だった。誤差の標準偏差の推定値 $s$（残差平方和を残差の自由度で割って平方根をとったもの）を求めよ。
    answer: 4
    tolerance: 0.001
    hint: |
      残差の自由度は $n-p-1$。
    explanation: |
      残差の自由度は $30-3-1=26$ なので、$s^2=416/26=16$、$s=4$ です。
      30 や 29 で割ると、推定した係数（切片を含めて 4 個）の分の自由度を引いていないことになります。

  - id: q14-multiple-regression-model-g3
    term: multiple-regression-model
    level: 標準
    type: choice
    question: |
      店舗の売上を広告費 $x_1$ だけで単回帰すると、$x_1$ の係数は 3.0 だった。説明変数に店舗の面積 $x_2$ を加えた重回帰では、$x_1$ の係数は 1.2 になった。最も適切な解釈はどれか。
    choices:
      - 広告費の多い店ほど面積も広い傾向があり、単回帰の 3.0 には面積の効果も混ざっていた。1.2 は面積が同じ店どうしで比べた広告費の効果である
      - 重回帰の計算が誤っている。同じデータなら、係数は変わらないはずである
      - 広告費の本当の効果は、2 つの係数を足した 4.2 である
      - 説明変数を加えると、もとの説明変数の係数は必ず小さくなる
    answer: 0
    hint: |
      重回帰の係数は「ほかの説明変数を一定にしたとき」の効果。説明変数どうしに相関があると、単回帰の係数とは違う値になる。
    explanation: |
      広告費と面積に相関があると、広告費だけの単回帰の傾きには、面積を通じた売上の増え方も含まれます。面積を説明変数に加えると、面積をそろえたときの広告費の効果だけが残ります。
      係数は大きくなることも、符号が変わることもあるので、「必ず小さくなる」は誤りです。

  - id: q14-regression-coefficient-t-test-g2
    term: regression-coefficient-t-test
    level: 標準
    type: numeric
    question: |
      12 組のデータで単回帰を行ったところ、傾きの推定値は 3.0、残差の標準偏差（残差平方和を自由度 10 で割った値の平方根）は 6、説明変数の偏差平方和は 16 だった。傾きの t 値を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      傾きの標準誤差は $s/\sqrt{S_{xx}}$。
    explanation: |
      標準誤差は $6/\sqrt{16}=1.5$ なので、$t=3.0/1.5=2.0$ です。自由度 10 の両側 5% の点 2.228 より小さいので、有意水準 5% では「傾きは 0」を棄却しません。
      $S_{xx}$ の平方根をとらずに $6/16$ で割ると、t 値を大きく見積もってしまいます。

  - id: q14-adjusted-r-squared-g2
    term: adjusted-r-squared
    level: 標準
    type: choice
    question: |
      データ 30 件で、説明変数 2 個のモデル 1（決定係数 0.60）と、説明変数 4 個のモデル 2（決定係数 0.62）を比べる。自由度調整済み決定係数による比較として正しいものはどれか。
    choices:
      - モデル 1 は約 0.570、モデル 2 は約 0.559 で、モデル 1 のほうが大きい
      - モデル 1 は約 0.570、モデル 2 は約 0.559 で、モデル 2 のほうが大きい
      - 決定係数の大きいモデル 2 のほうが、自由度調整済み決定係数も必ず大きい
      - 説明変数の数が違うモデルは比べることができない
    answer: 0
    hint: |
      $1-(1-R^2)\dfrac{n-1}{n-p-1}$ をそれぞれ計算する。
    explanation: |
      モデル 1 は $1-0.40\times 29/27\approx 0.570$、モデル 2 は $1-0.38\times 29/25\approx 0.559$ です。決定係数はモデル 2 のほうが大きいものの、自由度調整済み決定係数はモデル 1 のほうが大きく、増やした 2 つの変数の説明力は割り引き分に見合いません。

  # ---------- 多重共線性（2級向けに書き直した用語） ----------
  - id: q14-multicollinearity-g1
    term: multicollinearity
    level: 標準
    type: numeric
    question: |
      説明変数 $x_1$ を、ほかの説明変数で回帰したときの決定係数は 0.75 だった。$x_1$ の分散拡大要因（VIF）を求めよ。
    answer: 4
    tolerance: 0.001
    hint: |
      $\mathrm{VIF}=1/(1-R_j^2)$。
    explanation: |
      $1/(1-0.75)=4$ です。$x_1$ の係数の分散は、ほかの説明変数と相関がない場合の 4 倍（標準誤差は 2 倍）になります。

  # ---------- 回帰全体のF検定（2級向けに書き直した用語） ----------
  - id: q14-overall-f-test-regression-g1
    term: overall-f-test-regression
    level: 標準
    type: numeric
    question: |
      30 件のデータで、説明変数 2 個の重回帰分析を行ったところ、決定係数は 0.40 だった。回帰全体の F 統計量を求めよ。
    answer: 9
    tolerance: 0.001
    hint: |
      $F=\dfrac{R^2/p}{(1-R^2)/(n-p-1)}$。
    explanation: |
      $\dfrac{0.40/2}{0.60/27}=\dfrac{0.2}{0.0222}=9.0$ です。自由度 (2, 27) の上側 5% 点（約 3.35）を超えるので、回帰全体は有意です。

  # ---------- ダミー変数（2級向けに書き直した用語） ----------
  - id: q14-dummy-variable-g1
    term: dummy-variable
    level: 基本
    type: choice
    question: |
      売上を説明する回帰に、店の地域（北・東・南・西の 4 つ）を説明変数として入れたい。切片を含む回帰で使うダミー変数の個数はどれか。
    choices:
      - '3'
      - '4'
      - '1'
      - '2'
    answer: 0
    hint: |
      基準の地域を 1 つ決め、それ以外の地域ごとにダミー変数を作る。
    explanation: |
      カテゴリの数 − 1 ＝ 3 個です。4 個入れると合計がいつも 1 になって切片と区別できず、係数が決まりません。
      地域を 1〜4 の番号のまま 1 つの変数として入れるのも、番号の大小に意味がないので不適切です。

  # ---------- 回帰の信頼区間と予測区間（2級向けに書き直した用語） ----------
  - id: q14-confidence-and-prediction-interval-regression-g1
    term: confidence-and-prediction-interval-regression
    level: 基本
    type: choice
    question: |
      単回帰で、ある $x$ の値における「$y$ の平均の 95% 信頼区間」と「新しく観測する 1 つの $y$ の 95% 予測区間」について正しいものはどれか。
    choices:
      - 予測区間は信頼区間より広く、どちらも $x$ が $x$ の平均から離れるほど広くなる
      - 予測区間は信頼区間より狭い
      - 2 つの区間の幅は $x$ の値によらず一定である
      - データを増やすと、予測区間の幅は 0 に近づく
    answer: 0
    hint: |
      予測区間は、直線の位置の不確かさに、個々の値の誤差を加える。
    explanation: |
      予測区間は個々の値の誤差を含むので信頼区間より広く、どちらも $x$ が平均から離れるほど広がります。データを増やしても、予測区間には個々の値の誤差の分の幅が残ります。

  - id: q14-overall-f-test-regression-g2
    term: overall-f-test-regression
    level: 基本
    type: choice
    question: |
      説明変数が 3 個の重回帰分析の出力で、回帰全体の F 検定の帰無仮説として正しいものはどれか。
    choices:
      - 3 つの説明変数の偏回帰係数がすべて 0 である
      - 3 つの説明変数の偏回帰係数のうち、少なくとも 1 つが 0 である
      - 切片が 0 である
      - 決定係数が 1 である
    answer: 0
    hint: |
      F 検定が有意なら「少なくとも 1 つの説明変数は役に立っている」といえる。
    explanation: |
      帰無仮説は「すべての偏回帰係数が 0」（説明変数はどれも目的変数の説明に役立たない）で、対立仮説は「少なくとも 1 つは 0 でない」です。どの説明変数が役立っているかは、個々の係数の t 検定で調べます。
  - id: q14-multicollinearity-g2
    term: multicollinearity
    level: 標準
    type: choice
    question: |
      重回帰分析で、決定係数が高く回帰全体の F 検定は有意なのに、個々の偏回帰係数の t 検定はどれも有意でなく、係数の符号も予想と逆のものがあった。最も考えられる原因はどれか。
    choices:
      - 説明変数どうしの相関が強い（多重共線性）
      - 残差の分散が一定でない
      - 標本の大きさが大きすぎる
      - 目的変数を対数変換していない
    answer: 0
    hint: |
      説明変数どうしが似ていると、どちらの効果かを区別できない。
    explanation: |
      説明変数どうしの相関が強いと、全体としての説明力は高くても、個々の係数の標準誤差が大きくなって t 検定が有意になりにくく、符号が不安定になります。VIF を確かめ、似た変数のどちらかを外すなどの対処をします。
  - id: q14-dummy-variable-g2
    term: dummy-variable
    level: 標準
    type: numeric
    question: |
      店の売上 $y$ を、広さ $x$ と地域（北・東・南）で説明する回帰で、北を基準にしたダミー変数 $D_{東}$、$D_{南}$ を使って $\hat y=40+2x+5D_{東}-3D_{南}$ を得た。広さが同じ東の店と南の店の、売上の予測値の差（東 − 南）を求めよ。
    answer: 8
    tolerance: 0.001
    hint: |
      各係数は、北と比べた差。
    explanation: |
      東は北より 5 大きく、南は北より 3 小さいので、東 − 南 ＝ $5-(-3)=8$ です。ダミー変数の係数は基準のカテゴリとの差を表すので、基準以外どうしの差は係数の差で求めます。
