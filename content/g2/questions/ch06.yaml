chapter: 6
questions:
  # ---------- 観察研究と実験研究 (A) ----------
  - id: q06-observational-vs-experimental-1
    term: observational-vs-experimental
    level: 基本
    type: choice
    question: |
      喫煙の習慣がある人とない人を集め、10 年後に肺の病気になった人の割合を比べた。この研究の種類として最も適切なものはどれか。
    choices:
      - 観察研究
      - ランダム化比較試験
      - 全数調査
      - 研究者が処理を割り付けた実験研究
    answer: 0
    hint: |
      喫煙するかどうかを決めたのは誰か。
    explanation: |
      喫煙の有無は対象者自身が選んだもので、研究者は割り付けていないので観察研究です。
      喫煙者と非喫煙者では年齢や生活習慣などが違う可能性があり、その影響（交絡）に注意して解釈します。

  - id: q06-observational-vs-experimental-2
    term: observational-vs-experimental
    level: 標準
    type: truefalse
    question: |
      観察研究でも、対象者の人数を十分に多くすれば、交絡の影響はなくなる。
    answer: false
    hint: |
      人数を増やして小さくなるのは、偶然のぶれか、偏りか。
    explanation: |
      人数を増やすと偶然のぶれは小さくなりますが、比べる群の条件の違い（交絡）による偏りは残ります。
      交絡を防ぐには無作為な割り付けが必要で、観察研究では交絡因子を測って調整するしかありません。

  - id: q06-observational-vs-experimental-3
    term: observational-vs-experimental
    level: 標準
    type: choice
    question: |
      「アイスクリームの売上が多い日ほど、水難事故の件数が多い」という関係が観察された。この関係を生み出している可能性が最も高い交絡因子はどれか。
    choices:
      - 気温（季節）
      - アイスクリームの価格
      - 水難事故の報道
      - 店舗の数
    answer: 0
    hint: |
      両方を同時に増やす要因は何か。
    explanation: |
      気温が高い日はアイスクリームがよく売れ、水辺に行く人も増えるので、両方が増えます。
      アイスクリームが事故の原因になっているわけではなく、気温という共通の要因による擬似相関です。

  # ---------- 母集団と標本 (A) ----------
  - id: q06-population-and-sample-1
    term: population-and-sample
    level: 基本
    type: choice
    question: |
      ある工場で今日生産した 5000 個の部品から 50 個を無作為に抜き取り、重さを測って全体の平均の重さを推測した。この調査の母集団はどれか。
    choices:
      - 今日生産した 5000 個の部品
      - 抜き取った 50 個の部品
      - 50 個の重さの平均
      - 部品を作る機械
    answer: 0
    hint: |
      推測したい対象の全体はどれか。
    explanation: |
      推測したいのは今日生産した部品全体の平均の重さなので、母集団は 5000 個の部品です。
      抜き取った 50 個は標本、その平均は統計量です。

  - id: q06-population-and-sample-2
    term: population-and-sample
    level: 標準
    type: truefalse
    question: |
      標本調査では、標本の大きさを十分大きくすれば、標本の選び方に偏りがあっても母集団を正しく推測できる。
    answer: false
    hint: |
      インターネットで自発的に回答した人を 1 万人集めた場合を考える。
    explanation: |
      標本を大きくすると偶然のぶれ（標本誤差）は小さくなりますが、選び方の偏りは消えません。
      自発的な回答など偏った選び方では、何万人集めても母集団の推測を誤ることがあります。

  - id: q06-population-and-sample-3
    term: population-and-sample
    level: 標準
    type: numeric
    question: |
      ある標本調査で、標本の大きさ 400 のとき、標本比率の標準誤差はおよそ 0.02 だった。標準誤差をおよそ 0.01 にするには、標本の大きさをいくらにすればよいか。
    answer: 1600
    tolerance: 0.5
    hint: |
      標準誤差は $1/\sqrt n$ に比例する。
    explanation: |
      標準誤差を半分にするには、$\sqrt n$ を 2 倍、つまり $n$ を 4 倍にする必要があるので、$400\times 4=1600$ です。

  # ---------- 単純無作為抽出（2級向けに書き直した用語） ----------
  - id: q06-simple-random-sampling-g1
    term: simple-random-sampling
    level: 基本
    type: choice
    question: |
      ある大学の学生 8000 人の通学時間を調べるため、200 人を選ぶ。単純無作為抽出にあたる方法はどれか。
    choices:
      - 学生名簿の全員に番号を付け、乱数で 200 個の番号を選ぶ
      - 正門の前を通った学生に、先着順で 200 人に答えてもらう
      - 調査員の所属するゼミの学生から 200 人を選ぶ
      - 大学のウェブサイトで回答を募り、最初の 200 人の回答を使う
    answer: 0
    hint: |
      どの学生も同じ確率で選ばれ、選び方が偶然だけで決まる方法。
    explanation: |
      名簿（抽出枠）と乱数を使えば、どの学生も同じ確率で選ばれます。
      正門を通る学生（その時間に来る人）、ゼミの学生、ウェブで自分から回答する学生は、いずれも特定の性質をもつ人に偏ります。

  - id: q06-simple-random-sampling-g2
    term: simple-random-sampling
    level: 基本
    type: numeric
    question: |
      8000 人の学生から 200 人を単純無作為抽出で選ぶ。ある特定の学生が選ばれる確率を求めよ。
    answer: 0.025
    tolerance: 0.0001
    hint: |
      単純無作為抽出では、どの個体も選ばれる確率は $n/N$。
    explanation: |
      $200/8000=0.025$ です。どの学生も同じ 2.5% の確率で選ばれます。

  # ---------- 標本誤差と非標本誤差（2級向けに書き直した用語） ----------
  - id: q06-sampling-and-nonsampling-error-g1
    term: sampling-and-nonsampling-error
    level: 基本
    type: choice
    question: |
      次のうち、標本誤差にあたるものはどれか。
    choices:
      - 無作為に選んだ標本に、たまたま年齢の高い人が多く含まれたことによるずれ
      - 調査票の入力のときに数字を打ち間違えたことによるずれ
      - 質問文が賛成に誘導する表現だったことによるずれ
      - 回答しなかった人の意見が回答した人と違っていたことによるずれ
    answer: 0
    hint: |
      標本誤差は「どの人が選ばれたか」という偶然によるずれ。
    explanation: |
      標本の選ばれ方の偶然によるずれが標本誤差です。入力の誤り、誘導的な質問文、無回答は、いずれも非標本誤差で、標本を大きくしても減りません。

  - id: q06-sampling-and-nonsampling-error-g2
    term: sampling-and-nonsampling-error
    level: 標準
    type: truefalse
    question: |
      全数調査では、標本誤差も非標本誤差も生じないので、得られた値は母集団の真の値に一致する。
    answer: false
    hint: |
      全数調査でも、記入の誤りや無回答は起こる。
    explanation: |
      誤りです。全数調査では標本誤差はありませんが、記入の誤り・回答漏れ・集計の誤りなどの非標本誤差は生じます。対象が多い分、確認が行き届かず非標本誤差が大きくなることもあります。

  # ---------- フィッシャーの3原則（2級向けに書き直した用語） ----------
  - id: q06-fisher-three-principles-g1
    term: fisher-three-principles
    level: 基本
    type: choice
    question: |
      2 種類の肥料を比べる実験で、畑の 20 区画に番号を付け、乱数で選んだ 10 区画に肥料 A を、残りに肥料 B を使った。この工夫はフィッシャーの 3 原則のどれにあたるか。
    choices:
      - 無作為化
      - 反復
      - 局所管理
      - 盲検化
    answer: 0
    hint: |
      処理の割り付けを偶然に任せる工夫。
    explanation: |
      処理の割り付けを乱数で決めるのは無作為化です。日当たりや土の性質など、測っていない条件も含めて 2 つの群で平均的にそろえ、偏り（交絡）を防ぎます。
      盲検化は大切な工夫ですが、フィッシャーの 3 原則には含まれません。

  - id: q06-fisher-three-principles-g2
    term: fisher-three-principles
    level: 標準
    type: choice
    question: |
      畑の場所によって土の性質が大きく違うので、似た区画をまとめて 4 つの区域（ブロック）を作り、各区域の中で 3 種類の肥料を比べることにした。この工夫の主な目的として最も適切なものはどれか。
    choices:
      - 区域の違いによる変動を誤差から取り除き、肥料の効果を見つけやすくする
      - 測っていない条件を平均的にそろえ、偏りを防ぐ
      - 同じ肥料を何回も試し、誤差の大きさを評価する
      - 肥料の効果を大きくする
    answer: 0
    hint: |
      これは局所管理。
    explanation: |
      条件の似たまとまりの中で比べる局所管理（乱塊法）の目的は、区域の違いによる変動を誤差から分けて取り除き、精度を上げることです。
      偏りの防止は無作為化、誤差の評価は反復の目的です。
