chapter: 3
questions:
  # ---------- 散布図 (A) ----------
  - id: q03-scatter-plot-1
    term: scatter-plot
    level: 基本
    type: choice
    question: |
      ある店で、日ごとの最高気温とホット飲料の売上を記録した。気温が高い日ほど売上が少ない傾向があった。この 2 つの変数の散布図の様子として最も適切なものはどれか。
    choices:
      - 右上がり（正の相関）
      - 右下がり（負の相関）
      - 点が丸く散らばる（無相関）
      - U 字形
    answer: 1
    hint: |
      横軸の値が大きいほど、縦軸の値はどうなるか。
    explanation: |
      気温（横軸）が大きいほど売上（縦軸）が小さいので、点は右下がりに並び、負の相関です。

  - id: q03-scatter-plot-2
    term: scatter-plot
    level: 標準
    type: truefalse
    question: |
      2 つの変数の相関係数が 0 であれば、その 2 つの変数の間にはどんな関係もない。
    answer: false
    hint: |
      相関係数がとらえるのはどのような関係か。
    explanation: |
      相関係数は直線的な関係の強さだけを表します。
      たとえば $x=-2,-1,0,1,2$、$y=x^2$ のように U 字形のはっきりした関係があっても、相関係数は 0 になります。
      散布図で形を確かめることが大切です。

  - id: q03-scatter-plot-3
    term: scatter-plot
    level: 標準
    type: numeric
    question: |
      2 つの変数 $x, y$ の共分散が 12、$x$ の標準偏差が 4、$y$ の標準偏差が 5 だった。相関係数を求めよ。
    answer: 0.6
    tolerance: 0.001
    hint: |
      相関係数 ＝ 共分散 ÷（標準偏差の積）。
    explanation: |
      $$r=\frac{12}{4\times 5}=0.6$$
      共分散・標準偏差は、同じ割り方（$n$ または $n-1$）でそろえて計算していれば、割り方によらず同じ値になります。

  # ---------- 層別の散布図 (B) ----------
  - id: q03-stratified-scatter-1
    term: stratified-scatter
    level: 標準
    type: choice
    question: |
      ある調査で、2 つの変数の相関係数は全体では 0.5 だったが、地域ごとに分けて計算すると、どの地域でも −0.3 程度だった。この結果の解釈として最も適切なものはどれか。
    choices:
      - 地域を表す変数が、2 つの変数の両方に関係している可能性がある
      - 全体の相関係数の計算が誤っている
      - 地域ごとの相関が正しく、全体の相関係数は必ず 0 になる
      - 地域の数を増やすほど、全体の相関は地域ごとの相関に近づく
    answer: 0
    hint: |
      地域ごとに 2 つの変数の平均が違うと、全体の散布図はどうなるか。
    explanation: |
      地域の間で 2 つの変数の平均がそろってずれていると、地域の中の関係と無関係に、全体では正の相関が現れます。
      地域という第 3 の変数が両方に関係していることを示唆する、層別の典型的な例です。計算の誤りではありません。

  - id: q03-stratified-scatter-2
    term: stratified-scatter
    level: 基本
    type: truefalse
    question: |
      層別した散布図では、全体の相関の向きと、層の中の相関の向きが逆になることがある。
    answer: true
    hint: |
      層の平均の違いが、全体の傾向を作ることがある。
    explanation: |
      層の中では右下がりでも、層の平均が右上がりに並んでいれば、全体では右上がりの相関になります。
      比率の表で起こるシンプソンのパラドックスと同じ構造です。

  # ---------- 度数表と2元クロス表 (A) ----------
  - id: q03-cross-tabulation-1
    term: cross-tabulation
    level: 基本
    type: numeric
    question: |
      ある施策への賛否を、男性 100 人・女性 100 人にたずねた。

      | | 賛成 | 反対 | 計 |
      |---|---|---|---|
      | 男性 | 40 | 60 | 100 |
      | 女性 | 20 | 80 | 100 |
      | 計 | 60 | 140 | 200 |

      性別と賛否が独立であるとしたときの、「男性・賛成」のセルの期待度数を求めよ。
    answer: 30
    tolerance: 0.01
    hint: |
      期待度数 ＝ 行の合計 × 列の合計 ÷ 総数。
    explanation: |
      $$E=\frac{100\times 60}{200}=30$$
      実際の度数 40 は期待度数より多く、男性のほうが賛成の割合が高いことを表しています。

  - id: q03-cross-tabulation-2
    term: cross-tabulation
    level: 標準
    type: choice
    question: |
      200 人の居住地域と通勤手段のクロス表は次のとおりである。

      | | 車 | 公共交通 | 計 |
      |---|---|---|---|
      | 都市部 | 30 | 90 | 120 |
      | 郊外 | 56 | 24 | 80 |
      | 計 | 86 | 114 | 200 |

      「車で通勤する人のうち、郊外に住む人の割合」に最も近いものはどれか。
    choices:
      - 25%
      - 65%
      - 70%
      - 43%
    answer: 1
    hint: |
      「車で通勤する人」が分母になる。
    explanation: |
      車で通勤する 86 人のうち郊外に住む人は 56 人なので、$56/86\approx 0.65$（65%）です。
      70% は「郊外に住む人のうち車の人」（行パーセント）、43% は車の人の全体に対する割合（$86/200$）、25% は都市部の人のうち車の人です。

  - id: q03-cross-tabulation-3
    term: cross-tabulation
    level: 基本
    type: truefalse
    question: |
      クロス表では、行パーセント（各行の合計で割った割合）と列パーセント（各列の合計で割った割合）は、同じセルについて同じ値になる。
    answer: false
    hint: |
      割る数（分母）が違う。
    explanation: |
      行パーセントは行の合計、列パーセントは列の合計で割るので、一般に値は違います。
      何を比べたいか（どちらの変数ごとに分布を比べるか）に合わせて選びます。

  # ---------- 共分散と相関係数（2級向けに書き直した用語） ----------
  - id: q03-covariance-and-correlation-g1
    term: covariance-and-correlation
    level: 基本
    type: numeric
    question: |
      2 つの変数 $x$、$y$ のデータについて、$\sum(x_i-\bar x)^2=25$、$\sum(y_i-\bar y)^2=64$、$\sum(x_i-\bar x)(y_i-\bar y)=30$ だった。相関係数を求めよ。
    answer: 0.75
    tolerance: 0.0001
    hint: |
      $r=\dfrac{\sum(x_i-\bar x)(y_i-\bar y)}{\sqrt{\sum(x_i-\bar x)^2\sum(y_i-\bar y)^2}}$。
    explanation: |
      $r=\dfrac{30}{\sqrt{25\times 64}}=\dfrac{30}{40}=0.75$ です。
      偏差平方和の「積の平方根」で割ります。和で割ったり、平方根をとり忘れたりしないようにします。

  - id: q03-covariance-and-correlation-g2
    term: covariance-and-correlation
    level: 標準
    type: choice
    question: |
      変数 $x$ と $y$ の共分散は 12、相関係数は 0.6 だった。$x$ をすべて 2 倍して 10 を足した $u=2x+10$ と $y$ の共分散と相関係数の組合せはどれか。
    choices:
      - 共分散 24、相関係数 0.6
      - 共分散 34、相関係数 1.2
      - 共分散 12、相関係数 0.6
      - 共分散 24、相関係数 1.2
    answer: 0
    hint: |
      定数を足しても偏差は変わらない。2 倍すると偏差が 2 倍、標準偏差も 2 倍。
    explanation: |
      $u$ の偏差は $x$ の偏差の 2 倍なので、共分散は $2\times 12=24$ です。相関係数は、共分散も $u$ の標準偏差も 2 倍になって打ち消し合うので 0.6 のままです。
      相関係数は −1 から 1 の範囲なので、1.2 にはなりません。

  # ---------- 擬似相関（2級向けに書き直した用語） ----------
  - id: q03-spurious-correlation-g1
    term: spurious-correlation
    level: 基本
    type: choice
    question: |
      ある地域の火事の記録で、「出動した消防車の台数」と「火事による損害額」には強い正の相関があった。この相関の解釈として最も適切なものはどれか。
    choices:
      - 火事の規模が大きいほど、消防車も多く出動し、損害額も大きくなるため、見かけの相関が生じている
      - 消防車が多く出動するほど損害額が増えるので、出動する台数を減らすべきである
      - 損害額が大きいと消防車の台数が増えるという因果関係が示された
      - 相関が強いので、2 つの変数の間に第 3 の変数の影響はない
    answer: 0
    hint: |
      両方に影響する第 3 の変数を考える。
    explanation: |
      火事の規模という第 3 の変数が、消防車の台数と損害額の両方を大きくしています。火事の規模が同じくらいの火事どうしで比べれば、この相関は弱くなる（消えたり逆になったりする）と考えられます。
      相関が強いことは、第 3 の変数がないことの証拠にはなりません。

  - id: q03-spurious-correlation-g2
    term: spurious-correlation
    level: 標準
    type: numeric
    question: |
      3 つの変数の相関係数が $r_{xy}=0.5$、$r_{xz}=0.6$、$r_{yz}=0.5$ だった。$z$ の影響を除いた $x$ と $y$ の偏相関係数を小数第 2 位まで求めよ。
    answer: 0.29
    tolerance: 0.005
    hint: |
      $r_{xy\cdot z}=\dfrac{r_{xy}-r_{xz}r_{yz}}{\sqrt{(1-r_{xz}^2)(1-r_{yz}^2)}}$。
    explanation: |
      分子は $0.5-0.6\times 0.5=0.2$、分母は $\sqrt{0.64\times 0.75}=\sqrt{0.48}\approx 0.693$ なので、$0.2/0.693\approx 0.29$ です。
      0.5 の相関の一部は $z$ を通じたものでしたが、$z$ の影響を除いても弱い正の相関が残ります。

  # ---------- 相関係数行列（2級向けに書き直した用語） ----------
  - id: q03-correlation-matrix-g1
    term: correlation-matrix
    level: 基本
    type: choice
    question: |
      ある店舗のデータの相関係数行列の一部は次のとおりだった。直線的な関係が最も強い組はどれか。

      | | 来客数 | 気温 | 雨量 |
      |---|---|---|---|
      | 来客数 | 1 | 0.45 | −0.82 |
      | 気温 | 0.45 | 1 | −0.30 |
      | 雨量 | −0.82 | −0.30 | 1 |
    choices:
      - 来客数と雨量
      - 来客数と気温
      - 気温と雨量
      - 来客数と来客数
    answer: 0
    hint: |
      関係の強さは相関係数の絶対値で比べる。対角は同じ変数どうし。
    explanation: |
      絶対値が最も大きいのは来客数と雨量の 0.82 で、雨が多いほど来客数が少ない強い負の関係です。
      対角の 1 は同じ変数どうしの相関なので、組として比べる対象ではありません。

  # ---------- 偏相関係数（2級向けに書き直した用語） ----------
  - id: q03-partial-correlation-coefficient-g1
    term: partial-correlation-coefficient
    level: 標準
    type: numeric
    question: |
      3 つの変数の相関係数が $r_{xy}=0.6$、$r_{xz}=0.5$、$r_{yz}=0.4$ だった。$z$ の影響を除いた $x$ と $y$ の偏相関係数を小数第 2 位まで求めよ。
    answer: 0.50
    tolerance: 0.005
    hint: |
      $r_{xy\cdot z}=\dfrac{r_{xy}-r_{xz}r_{yz}}{\sqrt{(1-r_{xz}^2)(1-r_{yz}^2)}}$。
    explanation: |
      分子は $0.6-0.5\times 0.4=0.4$、分母は $\sqrt{0.75\times 0.84}=\sqrt{0.63}\approx 0.794$ なので、$0.4/0.794\approx 0.50$ です。

  # ---------- シンプソンのパラドックス（2級向けに書き直した用語） ----------
  - id: q03-simpsons-paradox-g1
    term: simpsons-paradox
    level: 標準
    type: numeric
    question: |
      営業担当の B さんは、小口の案件 30 件のうち 80%、大口の案件 70 件のうち 40% を成約した。B さんの全体の成約率を求めよ。
    answer: 0.52
    tolerance: 0.0001
    hint: |
      成約した件数の合計を、案件の合計で割る。
    explanation: |
      成約は $30\times 0.8+70\times 0.4=24+28=52$ 件なので、$52/100=0.52$ です。成約率の単純な平均 $(0.8+0.4)/2=0.6$ ではありません。
      小口 70%・大口 30% の A さん（小口 80 件・大口 20 件）は全体で 0.62 となり、どちらの種類でも B さんのほうが高いのに、全体では A さんのほうが高くなります。

  - id: q03-correlation-matrix-g2
    term: correlation-matrix
    level: 標準
    type: numeric
    question: |
      2 つの変数 $x$、$y$ の分散共分散行列が次のとおりだった。$x$ と $y$ の相関係数を求めよ。

      $$
      \begin{pmatrix} 16 & 12 \\ 12 & 25 \end{pmatrix}
      $$
    answer: 0.6
    tolerance: 0.001
    hint: |
      対角が分散、対角以外が共分散。相関係数 ＝ 共分散 ÷（標準偏差の積）。
    explanation: |
      標準偏差は $\sqrt{16}=4$ と $\sqrt{25}=5$ なので、$r=\dfrac{12}{4\times 5}=0.6$ です。相関係数行列は、分散共分散行列の各要素をこのように標準偏差の積で割ったもので、対角はすべて 1 になります。
  - id: q03-partial-correlation-coefficient-g2
    term: partial-correlation-coefficient
    level: 応用
    type: choice
    question: |
      小学生の「語彙の数」$x$ と「50 m 走の速さ」$y$ の相関係数は 0.5 だった。どちらも「年齢」$z$ との相関が強く、$r_{xz}=0.7$、$r_{yz}=0.7$ である。$z$ の影響を除いた $x$ と $y$ の偏相関係数を計算したうえで、最も適切な解釈はどれか。
    choices:
      - 偏相関係数はほぼ 0 で、x と y の相関の大部分は、どちらも年齢と関係していることによる見かけのものと考えられる
      - 偏相関係数は 0.5 より大きく、年齢をそろえると x と y の関係はより強くなる
      - 偏相関係数がほぼ 0 なので、x と y はどちらも年齢と無関係である
      - 偏相関係数は 0.5 − 0.7 × 0.7 = 0.01 で、x と y の相関は計算の誤りである
    answer: 0
    hint: |
      $r_{xy\cdot z}=\dfrac{r_{xy}-r_{xz}r_{yz}}{\sqrt{1-r_{xz}^2}\sqrt{1-r_{yz}^2}}$。
    explanation: |
      $\dfrac{0.5-0.49}{\sqrt{0.51}\sqrt{0.51}}=\dfrac{0.01}{0.51}\approx 0.02$ で、年齢をそろえるとほとんど相関がありません。語彙と足の速さの相関は、年齢が上がるとどちらも伸びることによる見かけの相関（擬似相関）と考えられます。分子だけを計算して分母を忘れる誤りにも注意します。
  - id: q03-simpsons-paradox-g2
    term: simpsons-paradox
    level: 標準
    type: choice
    question: |
      2 つの治療法の結果（回復した人数 / 患者の人数）は次のとおりだった。治療法 X は軽症でも重症でも回復率が Y より高いのに、全体では Y より低い。その主な理由として最も適切なものはどれか。

      | | 軽症 | 重症 | 全体 |
      |---|---|---|---|
      | X | 18 / 20 | 40 / 80 | 58 / 100 |
      | Y | 68 / 80 | 8 / 20 | 76 / 100 |
    choices:
      - X は回復しにくい重症の患者に多く使われていたから
      - X の患者の数が Y より少ないから
      - 全体の回復率は、軽症と重症の回復率の単純な平均だから
      - 軽症と重症で、回復率に違いがないから
    answer: 0
    hint: |
      全体の回復率は、軽症と重症の回復率を、それぞれの人数の割合で重み付けした平均。
    explanation: |
      X は 90% と 50%、Y は 85% と 40% で、どちらの層でも X が高い率です。しかし X の患者の 80% は回復しにくい重症なので、全体の率は重症の 50% に引っぱられて 58% になります。Y は軽症が 80% なので全体で 76% です。層の構成の違い（重症度という交絡）が、全体での比較を逆転させています。
  - id: q03-covariance-and-correlation-g3
    term: covariance-and-correlation
    level: 応用
    type: numeric
    question: |
      10 組のデータについて、$\sum x_i=50$、$\sum y_i=80$、$\sum x_i^2=290$、$\sum y_i^2=700$、$\sum x_iy_i=430$ だった。相関係数を小数第 2 位まで求めよ。
    answer: 0.61
    tolerance: 0.005
    hint: |
      $\sum(x_i-\bar x)^2=\sum x_i^2-n\bar x^2$、$\sum(x_i-\bar x)(y_i-\bar y)=\sum x_iy_i-n\bar x\bar y$ を使う。
    explanation: |
      $\bar x=5$、$\bar y=8$ なので、$S_{xx}=290-10\times 25=40$、$S_{yy}=700-10\times 64=60$、$S_{xy}=430-10\times 5\times 8=30$ です。$r=\dfrac{30}{\sqrt{40\times 60}}=\dfrac{30}{48.99}\approx 0.61$ です。$\sum x_i^2$ などをそのまま使うと、平均を引いていないので誤りになります。
  - id: q03-spurious-correlation-g3
    term: spurious-correlation
    level: 標準
    type: choice
    question: |
      小学 1〜6 年生の全員のデータで、「靴のサイズ」と「計算テストの点数」に強い正の相関があった。これが学年による擬似相関かどうかを確かめる方法として、最も適切なものはどれか。
    choices:
      - 学年ごとに分けて相関係数を求めるか、学年の影響を除いた偏相関係数を求める
      - 標本の大きさを 2 倍にして、相関係数がさらに大きくなるか確かめる
      - 靴のサイズと点数の散布図に回帰直線を引き、傾きが正か確かめる
      - 相関係数の検定を行い、有意であれば因果関係があると判断する
    answer: 0
    hint: |
      共通の要因（学年）をそろえたときにも相関が残るかを見る。
    explanation: |
      学年をそろえる（層別する）か、偏相関係数で学年の影響を除いて、相関が残るかを調べます。学年ごとに見て相関がほとんどなければ、学年が上がると足も大きくなり計算もできるようになる、という共通の要因による擬似相関です。標本を増やしたり回帰直線を引いたり検定したりしても、相関の原因はわかりません。
