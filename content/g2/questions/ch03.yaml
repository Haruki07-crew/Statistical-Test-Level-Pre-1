chapter: 3
questions:
  # ---------- 散布図 (A) ----------
  - id: q03-scatter-plot-1
    term: scatter-plot
    level: 基本
    type: choice
    question: |
      ある店で、日ごとの最高気温とホット飲料の売上を記録した。気温が高い日ほど売上が少ない傾向があった。この 2 つの変数の散布図の様子として最も適切なものはどれか。
    choices:
      - 右上がり（正の相関）
      - 右下がり（負の相関）
      - 点が丸く散らばる（無相関）
      - U 字形
    answer: 1
    hint: |
      横軸の値が大きいほど、縦軸の値はどうなるか。
    explanation: |
      気温（横軸）が大きいほど売上（縦軸）が小さいので、点は右下がりに並び、負の相関です。

  - id: q03-scatter-plot-2
    term: scatter-plot
    level: 標準
    type: truefalse
    question: |
      2 つの変数の相関係数が 0 であれば、その 2 つの変数の間にはどんな関係もない。
    answer: false
    hint: |
      相関係数がとらえるのはどのような関係か。
    explanation: |
      相関係数は直線的な関係の強さだけを表します。
      たとえば $x=-2,-1,0,1,2$、$y=x^2$ のように U 字形のはっきりした関係があっても、相関係数は 0 になります。
      散布図で形を確かめることが大切です。

  - id: q03-scatter-plot-3
    term: scatter-plot
    level: 標準
    type: numeric
    question: |
      2 つの変数 $x, y$ の共分散が 12、$x$ の標準偏差が 4、$y$ の標準偏差が 5 だった。相関係数を求めよ。
    answer: 0.6
    tolerance: 0.001
    hint: |
      相関係数 ＝ 共分散 ÷（標準偏差の積）。
    explanation: |
      $$r=\frac{12}{4\times 5}=0.6$$
      共分散・標準偏差は、同じ割り方（$n$ または $n-1$）でそろえて計算していれば、割り方によらず同じ値になります。

  # ---------- 層別の散布図 (B) ----------
  - id: q03-stratified-scatter-1
    term: stratified-scatter
    level: 標準
    type: choice
    question: |
      ある調査で、2 つの変数の相関係数は全体では 0.5 だったが、地域ごとに分けて計算すると、どの地域でも −0.3 程度だった。この結果の解釈として最も適切なものはどれか。
    choices:
      - 地域を表す変数が、2 つの変数の両方に関係している可能性がある
      - 全体の相関係数の計算が誤っている
      - 地域ごとの相関が正しく、全体の相関係数は必ず 0 になる
      - 地域の数を増やすほど、全体の相関は地域ごとの相関に近づく
    answer: 0
    hint: |
      地域ごとに 2 つの変数の平均が違うと、全体の散布図はどうなるか。
    explanation: |
      地域の間で 2 つの変数の平均がそろってずれていると、地域の中の関係と無関係に、全体では正の相関が現れます。
      地域という第 3 の変数が両方に関係していることを示唆する、層別の典型的な例です。計算の誤りではありません。

  - id: q03-stratified-scatter-2
    term: stratified-scatter
    level: 基本
    type: truefalse
    question: |
      層別した散布図では、全体の相関の向きと、層の中の相関の向きが逆になることがある。
    answer: true
    hint: |
      層の平均の違いが、全体の傾向を作ることがある。
    explanation: |
      層の中では右下がりでも、層の平均が右上がりに並んでいれば、全体では右上がりの相関になります。
      比率の表で起こるシンプソンのパラドックスと同じ構造です。

  # ---------- 度数表と2元クロス表 (A) ----------
  - id: q03-cross-tabulation-1
    term: cross-tabulation
    level: 基本
    type: numeric
    question: |
      ある施策への賛否を、男性 100 人・女性 100 人にたずねた。

      | | 賛成 | 反対 | 計 |
      |---|---|---|---|
      | 男性 | 40 | 60 | 100 |
      | 女性 | 20 | 80 | 100 |
      | 計 | 60 | 140 | 200 |

      性別と賛否が独立であるとしたときの、「男性・賛成」のセルの期待度数を求めよ。
    answer: 30
    tolerance: 0.01
    hint: |
      期待度数 ＝ 行の合計 × 列の合計 ÷ 総数。
    explanation: |
      $$E=\frac{100\times 60}{200}=30$$
      実際の度数 40 は期待度数より多く、男性のほうが賛成の割合が高いことを表しています。

  - id: q03-cross-tabulation-2
    term: cross-tabulation
    level: 標準
    type: choice
    question: |
      200 人の居住地域と通勤手段のクロス表は次のとおりである。

      | | 車 | 公共交通 | 計 |
      |---|---|---|---|
      | 都市部 | 30 | 90 | 120 |
      | 郊外 | 56 | 24 | 80 |
      | 計 | 86 | 114 | 200 |

      「車で通勤する人のうち、郊外に住む人の割合」に最も近いものはどれか。
    choices:
      - 25%
      - 65%
      - 70%
      - 43%
    answer: 1
    hint: |
      「車で通勤する人」が分母になる。
    explanation: |
      車で通勤する 86 人のうち郊外に住む人は 56 人なので、$56/86\approx 0.65$（65%）です。
      70% は「郊外に住む人のうち車の人」（行パーセント）、43% は車の人の全体に対する割合（$86/200$）、25% は都市部の人のうち車の人です。

  - id: q03-cross-tabulation-3
    term: cross-tabulation
    level: 基本
    type: truefalse
    question: |
      クロス表では、行パーセント（各行の合計で割った割合）と列パーセント（各列の合計で割った割合）は、同じセルについて同じ値になる。
    answer: false
    hint: |
      割る数（分母）が違う。
    explanation: |
      行パーセントは行の合計、列パーセントは列の合計で割るので、一般に値は違います。
      何を比べたいか（どちらの変数ごとに分布を比べるか）に合わせて選びます。
