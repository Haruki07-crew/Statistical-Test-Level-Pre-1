chapter: 9
questions:
  # ---------- ベルヌーイ分布（2級向けに書き直した用語） ----------
  - id: q09-bernoulli-distribution-g1
    term: bernoulli-distribution
    level: 基本
    type: numeric
    question: |
      確率 0.2 で 1、確率 0.8 で 0 をとる確率変数 $X$（ベルヌーイ分布）の分散を求めよ。
    answer: 0.16
    tolerance: 0.0001
    hint: |
      ベルヌーイ分布の分散は $p(1-p)$。
    explanation: |
      $V[X]=0.2\times 0.8=0.16$ です。期待値は 0.2 で、$E[X^2]=0.2$ から $0.2-0.2^2=0.16$ と求めても同じです。

  - id: q09-bernoulli-distribution-g2
    term: bernoulli-distribution
    level: 基本
    type: choice
    question: |
      成功の確率が $p$ のベルヌーイ分布の分散が最も大きくなる $p$ はどれか。
    choices:
      - '0.5'
      - '1'
      - '0.25'
      - $p$ によらず一定
    answer: 0
    hint: |
      分散 $p(1-p)$ を $p$ の 2 次関数として考える。
    explanation: |
      $p(1-p)=-(p-0.5)^2+0.25$ なので、$p=0.5$ で最大の 0.25 になります。$p=1$ なら結果が必ず 1 で、分散は 0 です。
      母比率の見当がつかないときに標本の大きさを $p=0.5$ で計算するのは、分散が最大の場合に備えるためです。

  - id: q09-bernoulli-distribution-g3
    term: bernoulli-distribution
    level: 標準
    type: numeric
    question: |
      ある意見に賛成する人の割合が 0.2 の大きな集団から、400 人を無作為に選ぶ。賛成を 1、反対を 0 として 400 人の平均（標本比率）をとるとき、標本比率の標準偏差を求めよ。
    answer: 0.02
    tolerance: 0.0001
    hint: |
      標本比率は、ベルヌーイ分布にしたがう 400 個の変数の標本平均。標本平均の分散は（1 個の分散）÷ $n$。
    explanation: |
      1 人分の分散は $0.2\times 0.8=0.16$ なので、標本比率の分散は $0.16/400=0.0004$、標準偏差は $\sqrt{0.0004}=0.02$ です。
      分散 0.0004 のまま答えたり、$\sqrt{0.16}=0.4$（1 人分の標準偏差）を答えたりしないようにします。

  # ---------- 二項分布（2級向けに書き直した用語） ----------
  - id: q09-binomial-distribution-g1
    term: binomial-distribution
    level: 基本
    type: numeric
    question: |
      公正な硬貨を 4 回投げるとき、表がちょうど 2 回出る確率を求めよ。
    answer: 0.375
    tolerance: 0.001
    hint: |
      $\binom{4}{2}(0.5)^2(0.5)^2$。
    explanation: |
      $\binom{4}{2}=6$ 通りあり、どれも確率 $(1/2)^4=1/16$ なので、$6/16=0.375$ です。

  - id: q09-binomial-distribution-g2
    term: binomial-distribution
    level: 標準
    type: numeric
    question: |
      不良率 0.1 の製品を 3 個無作為に選ぶ。少なくとも 1 個が不良品である確率を求めよ。
    answer: 0.271
    tolerance: 0.001
    hint: |
      余事象「3 個とも良品」を使う。
    explanation: |
      $1-0.9^3=1-0.729=0.271$ です。

  - id: q09-binomial-distribution-g3
    term: binomial-distribution
    level: 基本
    type: numeric
    question: |
      成功の確率が 0.4 の独立な試行を 30 回行うとき、成功の回数の分散を求めよ。
    answer: 7.2
    tolerance: 0.001
    hint: |
      成功の回数は $B(30,\ 0.4)$ にしたがう。分散は $np(1-p)$。
    explanation: |
      $30\times 0.4\times 0.6=7.2$ です（期待値は 12）。
      $np=12$ を分散と答えるのは、ポアソン分布（平均 ＝ 分散）と混同した誤りです。

  # ---------- ポアソン分布（2級向けに書き直した用語） ----------
  - id: q09-poisson-distribution-g1
    term: poisson-distribution
    level: 基本
    type: numeric
    question: |
      1 日の問い合わせの件数が平均 2 件のポアソン分布にしたがう。ある日の件数が 0 件である確率を求めよ。ただし $e^{-2}=0.1353$ とする。
    answer: 0.1353
    tolerance: 0.0005
    hint: |
      $P(X=0)=e^{-\lambda}$。
    explanation: |
      $P(X=0)=e^{-2}\cdot 2^0/0!=e^{-2}=0.1353$ です。

  - id: q09-poisson-distribution-g2
    term: poisson-distribution
    level: 標準
    type: numeric
    question: |
      ある交差点の 1 か月の事故の件数は、平均 1.5 件のポアソン分布にしたがう。ある月の事故が 1 件以下である確率を求めよ。ただし $e^{-1.5}=0.2231$ とする。
    answer: 0.5578
    tolerance: 0.0005
    hint: |
      $P(X=0)+P(X=1)=e^{-1.5}(1+1.5)$。
    explanation: |
      $P(X=0)=e^{-1.5}=0.2231$、$P(X=1)=1.5e^{-1.5}=0.3347$ なので、合計 $2.5\times 0.2231\approx 0.5578$ です。
      「1 件以下」は 0 件と 1 件の両方を含みます。

  - id: q09-poisson-distribution-g3
    term: poisson-distribution
    level: 基本
    type: choice
    question: |
      窓口 A への 1 時間の問い合わせの件数は平均 2 件、窓口 B は平均 3 件のポアソン分布にしたがい、互いに独立である。2 つの窓口の 1 時間の件数の合計がしたがう分布はどれか。
    choices:
      - 平均 5 のポアソン分布
      - 平均 6 のポアソン分布
      - 平均 5・分散 13 の分布
      - 平均 2.5 のポアソン分布
    answer: 0
    hint: |
      独立なポアソン分布の和はポアソン分布で、平均は足し算。
    explanation: |
      合計は平均 $2+3=5$ のポアソン分布にしたがいます。ポアソン分布なので分散も 5 です。
      平均を掛けたり（6）、平均をとったり（2.5）しないようにします。分散 13 は $2^2+3^2$ で、平均を標準偏差と取り違えた値です。

  # ---------- 正規分布（2級向けに書き直した用語） ----------
  - id: q09-normal-distribution-g1
    term: normal-distribution
    level: 標準
    type: numeric
    question: |
      ある集団の身長は $N(170,\ 6^2)$（cm）にしたがう。182 cm を超える人の割合を求めよ。ただし $P(Z>2)=0.0228$ とする。
    answer: 0.0228
    tolerance: 0.0001
    hint: |
      標準化する：$(182-170)/6$。
    explanation: |
      $(182-170)/6=2$ なので、$P(X>182)=P(Z>2)=0.0228$ です。

  - id: q09-normal-distribution-g2
    term: normal-distribution
    level: 基本
    type: choice
    question: |
      確率変数 $X$ が $N(50,\ 10^2)$ にしたがうとき、$Y=2X+5$ がしたがう分布はどれか。
    choices:
      - $N(105,\ 20^2)$
      - $N(105,\ 10^2)$
      - $N(100,\ 20^2)$
      - $N(105,\ 25^2)$
    answer: 0
    hint: |
      正規分布を 1 次変換しても正規分布。平均は $2\times 50+5$、標準偏差は $|2|\times 10$。
    explanation: |
      $aX+b$ は $N(a\mu+b,\ a^2\sigma^2)$ にしたがうので、平均 $2\times 50+5=105$、分散 $2^2\times 10^2=20^2$ です。
      足した定数 5 は散らばりに影響しません。標準偏差に 5 を足したり、平均の計算で 5 を忘れたりしないようにします。

  - id: q09-normal-distribution-g3
    term: normal-distribution
    level: 標準
    type: numeric
    question: |
      工程 A で作る部品の長さは $N(30,\ 0.6^2)$、工程 B で作る部品の長さは $N(29,\ 0.8^2)$（mm）にしたがい、互いに独立である。A と B から 1 個ずつ選んだとき、A のほうが短い確率を求めよ。ただし $P(Z>1)=0.1587$ とする。
    answer: 0.1587
    tolerance: 0.0001
    hint: |
      差 $A-B$ も正規分布にしたがう。平均は $30-29$、分散は $0.6^2+0.8^2$。
    explanation: |
      $A-B\sim N(1,\ 0.6^2+0.8^2)=N(1,\ 1^2)$ です。A のほうが短いのは $A-B<0$ のときなので
      $P(A-B<0)=P(Z<(0-1)/1)=P(Z<-1)=P(Z>1)=0.1587$ です。
      差の分散も足し算です（$0.36-0.64$ のように引くと負になってしまいます）。

  # ---------- 標準正規分布（2級向けに書き直した用語） ----------
  - id: q09-standard-normal-distribution-g1
    term: standard-normal-distribution
    level: 基本
    type: numeric
    question: |
      標準正規分布で $P(Z>1.96)=0.025$ である。$P(-1.96<Z<1.96)$ を求めよ。
    answer: 0.95
    tolerance: 0.0001
    hint: |
      左右対称なので、両側の裾は同じ 0.025。
    explanation: |
      $1-2\times 0.025=0.95$ です。95% 信頼区間や両側 5% の検定で使う値です。

  - id: q09-standard-normal-distribution-g2
    term: standard-normal-distribution
    level: 基本
    type: numeric
    question: |
      標準正規分布にしたがう $Z$ について、$P(-1<Z<2)$ を求めよ。ただし $P(Z>1)=0.1587$、$P(Z>2)=0.0228$ とする。
    answer: 0.8185
    tolerance: 0.0001
    hint: |
      全体 1 から、左の裾 $P(Z<-1)$ と右の裾 $P(Z>2)$ を引く。
    explanation: |
      対称性から $P(Z<-1)=P(Z>1)=0.1587$ です。よって $P(-1<Z<2)=1-0.1587-0.0228=0.8185$ です。
      $0.1587-0.0228$ のように上側確率どうしを引くと、$P(1<Z<2)$ を求めたことになります。

  - id: q09-standard-normal-distribution-g3
    term: standard-normal-distribution
    level: 標準
    type: numeric
    question: |
      ある試験の得点は $N(500,\ 100^2)$ にしたがう。上位 2.5% に入るための得点の境目（何点以上か）を求めよ。ただし標準正規分布の上側 2.5% 点を 1.96 とする。
    answer: 696
    tolerance: 0.01
    hint: |
      境目は $\mu+z_{0.025}\,\sigma$。
    explanation: |
      $500+1.96\times 100=696$ 点です。
      「上位 2.5%」は片側なので上側 2.5% 点 1.96 を使います。上位 5% なら 1.645 を使って 664.5 点になります。

  # ---------- 指数分布（2級向けに書き直した用語） ----------
  - id: q09-exponential-distribution-g1
    term: exponential-distribution
    level: 標準
    type: numeric
    question: |
      待ち時間 $T$（分）が平均 10 分の指数分布にしたがう。待ち時間が 5 分以下である確率を求めよ。ただし $e^{-0.5}=0.6065$ とする。
    answer: 0.3935
    tolerance: 0.0005
    hint: |
      レートは $1/10$。$P(T\le t)=1-e^{-t/10}$。
    explanation: |
      $P(T\le 5)=1-e^{-5/10}=1-0.6065=0.3935$ です。

  - id: q09-exponential-distribution-g2
    term: exponential-distribution
    level: 標準
    type: numeric
    question: |
      窓口の待ち時間 $T$（分）は平均 8 分の指数分布にしたがう。すでに 4 分待っているとき、待ち時間が全部で 12 分を超える（あと 8 分以上待つ）確率を求めよ。ただし $e^{-1}=0.3679$ とする。
    answer: 0.3679
    tolerance: 0.0001
    hint: |
      指数分布の無記憶性 $P(T>s+t\mid T>s)=P(T>t)$。
    explanation: |
      $P(T>12\mid T>4)=P(T>8)=e^{-8/8}=e^{-1}=0.3679$ です。
      $P(T>12)/P(T>4)=e^{-1.5}/e^{-0.5}=e^{-1}$ と計算しても同じです。すでに待った時間は、この先の待ち時間の確率に影響しません。

  - id: q09-exponential-distribution-g3
    term: exponential-distribution
    level: 基本
    type: choice
    question: |
      平均 8 分の指数分布にしたがう待ち時間の分散はどれか。
    choices:
      - '64'
      - '8'
      - $1/64$
      - '16'
    answer: 0
    hint: |
      レート $\lambda$ の指数分布の期待値は $1/\lambda$、分散は $1/\lambda^2$。
    explanation: |
      平均 8 分なので $\lambda=1/8$、分散は $1/\lambda^2=64$ です（標準偏差は平均と同じ 8 分）。
      分散を平均と同じ 8 とするのは、ポアソン分布（平均 ＝ 分散）と混同した誤りです。$1/64$ はレートの 2 乗 $\lambda^2$ です。

  # ---------- 幾何分布（2級向けに書き直した用語） ----------
  - id: q09-geometric-distribution-g1
    term: geometric-distribution
    level: 基本
    type: numeric
    question: |
      成功の確率が 0.4 の独立な試行をくり返す。初めて成功するのがちょうど 2 回目である確率を求めよ。
    answer: 0.24
    tolerance: 0.0001
    hint: |
      1 回目は失敗、2 回目は成功。
    explanation: |
      $0.6\times 0.4=0.24$ です。初めて成功するまでの回数の期待値は $1/0.4=2.5$ 回です。

  # ---------- 一様分布（2級向けに書き直した用語） ----------
  - id: q09-uniform-distribution-g1
    term: uniform-distribution
    level: 基本
    type: numeric
    question: |
      確率変数 $X$ が 2 から 14 の一様分布にしたがうとき、$X$ の分散を求めよ。
    answer: 12
    tolerance: 0.001
    hint: |
      $U(a,\ b)$ の分散は $(b-a)^2/12$。
    explanation: |
      $(14-2)^2/12=144/12=12$ です。期待値は $(2+14)/2=8$ です。

  # ---------- 超幾何分布（2級向けに書き直した用語） ----------
  - id: q09-hypergeometric-distribution-g1
    term: hypergeometric-distribution
    level: 標準
    type: numeric
    question: |
      12 個の部品のうち 4 個が不良品である箱から、3 個を同時に取り出す。不良品が 1 個も含まれない確率を小数第 3 位まで求めよ。
    answer: 0.255
    tolerance: 0.0005
    hint: |
      良品 8 個から 3 個を選ぶ選び方を、12 個から 3 個を選ぶ選び方で割る。
    explanation: |
      $\dfrac{\binom{8}{3}}{\binom{12}{3}}=\dfrac{56}{220}\approx 0.255$ です。
      戻して取り出す二項分布で計算すると $(8/12)^3\approx 0.296$ で、全体が小さいと違いが出ます。

  # ---------- 2変量正規分布（2級向けに書き直した用語） ----------
  - id: q09-bivariate-normal-distribution-g1
    term: bivariate-normal-distribution
    level: 標準
    type: numeric
    question: |
      $X$ と $Y$ は 2 変量正規分布にしたがい、$X$ は平均 50・標準偏差 10、$Y$ は平均 60・標準偏差 12、相関係数は 0.5 である。$X=70$ のときの $Y$ の条件付き平均を求めよ。
    answer: 72
    tolerance: 0.001
    hint: |
      $E[Y\mid X=x]=\mu_Y+\rho\dfrac{\sigma_Y}{\sigma_X}(x-\mu_X)$。
    explanation: |
      $60+0.5\times\dfrac{12}{10}\times(70-50)=60+12=72$ です。$X$ が平均より標準偏差 2 個分大きくても、$Y$ の平均は標準偏差 $2\times 0.5=1$ 個分しか大きくなりません（平均への回帰）。

  # ---------- 負の二項分布（2級向けに書き直した用語） ----------
  - id: q09-negative-binomial-distribution-g1
    term: negative-binomial-distribution
    level: 標準
    type: numeric
    question: |
      成功の確率が 0.5 の独立な試行をくり返す。2 回目の成功がちょうど 3 回目の試行で起こる確率を求めよ。
    answer: 0.25
    tolerance: 0.0001
    hint: |
      3 回目が成功で、最初の 2 回のうちちょうど 1 回が成功。
    explanation: |
      $\binom{2}{1}(0.5)^1(0.5)^1\times 0.5=2\times 0.125=0.25$ です。最後の試行が成功と決まっているので、組合せは最初の 2 回の中から成功の 1 回を選ぶ $\binom{2}{1}$ です。

  - id: q09-geometric-distribution-g2
    term: geometric-distribution
    level: 標準
    type: numeric
    question: |
      1 回で当たる確率が 0.2 のくじを、当たるまで引き続ける（くじは毎回もとに戻す）。すでに 3 回続けて外れたとき、あと 2 回以内に当たる確率を求めよ。
    answer: 0.36
    tolerance: 0.0001
    hint: |
      幾何分布の無記憶性：それまでの外れの回数は、これからの確率に影響しない。
    explanation: |
      各回は独立なので、3 回外れたことは関係なく、$1-0.8^2=0.36$ です。「3 回も外れたから次は当たりやすい」と考えるのは誤り（ギャンブラーの誤謬）で、最初から引くときの「2 回以内に当たる確率」と同じです。
  - id: q09-uniform-distribution-g2
    term: uniform-distribution
    level: 基本
    type: numeric
    question: |
      バスは 15 分おきに来る。時刻表を見ずにでたらめな時刻にバス停に着くとき、待ち時間は 0 分から 15 分の一様分布にしたがうとする。待ち時間が 10 分を超える確率を、小数第 3 位まで求めよ。
    answer: 0.333
    tolerance: 0.0005
    hint: |
      一様分布では、確率は区間の長さに比例する。
    explanation: |
      10 分から 15 分の長さ 5 の区間なので、$5/15=1/3\approx 0.333$ です。待ち時間の平均は $15/2=7.5$ 分です。
  - id: q09-hypergeometric-distribution-g2
    term: hypergeometric-distribution
    level: 応用
    type: numeric
    question: |
      20 個のうち 5 個が不良品の箱から、4 個を同時に（戻さずに）取り出す。取り出した不良品の個数の分散を、小数第 2 位まで求めよ。
    answer: 0.63
    tolerance: 0.005
    hint: |
      二項分布の分散 $np(1-p)$ に、有限母集団修正 $\dfrac{N-n}{N-1}$ を掛ける。
    explanation: |
      $p=5/20=0.25$ なので、$4\times 0.25\times 0.75\times\dfrac{20-4}{20-1}=0.75\times\dfrac{16}{19}\approx 0.63$ です。戻して取り出す（二項分布）なら 0.75 で、戻さないほうが分散は小さくなります。平均はどちらも $4\times 0.25=1$ です。
