chapter: 12
questions:
  # ---------- p値（共通の用語・2級の問題） ----------
  - id: q12-p-value-g1
    term: p-value
    level: 基本
    type: truefalse
    question: |
      ある検定の p 値が 0.03 だった。有意水準 5% では帰無仮説を棄却し、有意水準 1% では棄却しない。
    answer: true
    hint: |
      p 値が有意水準より小さければ棄却する。
    explanation: |
      $0.03<0.05$ なので 5% では棄却、$0.03>0.01$ なので 1% では棄却しません。

  # ---------- 1標本t検定（共通の用語・2級の問題） ----------
  - id: q12-one-sample-t-test-g1
    term: one-sample-t-test
    level: 標準
    type: numeric
    question: |
      大きさ 9 の標本の平均は 52、標本標準偏差（不偏分散の平方根）は 3 だった。帰無仮説「母平均 50」の t 検定の検定統計量を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      $t=(\bar x-\mu_0)/(s/\sqrt n)$。
    explanation: |
      $t=(52-50)/(3/3)=2$ です。自由度は 8 で、$t_{0.025}(8)=2.306$ より小さいので、有意水準 5% の両側検定では棄却しません。

  # ---------- 母比率の検定（共通の用語・2級の問題） ----------
  - id: q12-proportion-test-g1
    term: proportion-test
    level: 標準
    type: numeric
    question: |
      100 人中 60 人が新しい商品を好んだ。帰無仮説「好む人の割合は 0.5」の検定統計量 $z$（正規近似、連続修正なし）を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      標準誤差は帰無仮説の比率 0.5 で計算する。
    explanation: |
      $z=(0.6-0.5)/\sqrt{0.5\times 0.5/100}=0.1/0.05=2$ です。

  # ---------- 第1種の過誤・第2種の過誤（共通の用語・2級の問題） ----------

  - id: q12-proportion-test-g2
    term: proportion-test
    level: 標準
    type: choice
    question: |
      不良率は 5% 以下とされている工程で 400 個を調べたところ、不良品は 28 個（7%）だった。帰無仮説「不良率は 0.05」の検定統計量 $z$ の分母（標準誤差）に使う値として正しいものはどれか。
    choices:
      - $\sqrt{0.05\times 0.95/400}$
      - $\sqrt{0.07\times 0.93/400}$
      - $0.05\times 0.95/400$
      - $\sqrt{0.05\times 0.95}$
    answer: 0
    hint: |
      検定では、帰無仮説が正しいとしたときの散らばりを使う。
    explanation: |
      帰無仮説の値 0.05 を使って $\sqrt{0.05\times 0.95/400}\approx 0.0109$ とします。$z=(0.07-0.05)/0.0109\approx 1.84$ で、右片側 5% の点 1.645 より大きいので棄却します。
      標本比率 0.07 を使うのは信頼区間のときです（使うと $z\approx 1.57$ になり、結論が変わってしまいます）。

  - id: q12-type-i-and-ii-errors-g1
    term: type-i-and-ii-errors
    level: 基本
    type: choice
    question: |
      ある工場の機械は正常に動いていたのに、品質検査の検定で「異常あり」と判定してしまった。この誤りはどれか。
    choices:
      - 第 1 種の過誤
      - 第 2 種の過誤
      - 標本誤差
      - 検出力
    answer: 0
    hint: |
      帰無仮説は「正常」。それが正しいのに棄却した。
    explanation: |
      正しい帰無仮説（正常）を棄却したので第 1 種の過誤です。異常があるのに見逃すのが第 2 種の過誤です。

  # ---------- 帰無仮説と対立仮説（2級向けに書き直した用語） ----------
  - id: q12-null-and-alternative-hypothesis-g1
    term: null-and-alternative-hypothesis
    level: 基本
    type: choice
    question: |
      「1 個 50 g」と表示された製品の重さが、表示より軽いのではないかを調べたい。母平均を $\mu$ とするとき、帰無仮説と対立仮説の組合せとして最も適切なものはどれか。
    choices:
      - 帰無仮説 $\mu=50$、対立仮説 $\mu<50$
      - 帰無仮説 $\mu<50$、対立仮説 $\mu=50$
      - 帰無仮説 $\mu=50$、対立仮説 $\mu>50$
      - 帰無仮説 $\mu\ne 50$、対立仮説 $\mu=50$
    answer: 0
    hint: |
      示したいこと（軽い）を対立仮説に、等号（表示どおり）を帰無仮説に置く。
    explanation: |
      「表示より軽い」を示したいので、対立仮説は $\mu<50$（左片側）、帰無仮説は等号の $\mu=50$ です。
      示したいことを帰無仮説に置いたり、向きを逆にしたりしないようにします。

  - id: q12-null-and-alternative-hypothesis-g2
    term: null-and-alternative-hypothesis
    level: 基本
    type: truefalse
    question: |
      有意水準 5% の検定で帰無仮説「新しい教材と従来の教材の平均点は等しい」が棄却されなかった。このことから、2 つの教材の効果は同じであることが示された。
    answer: false
    hint: |
      棄却しないことは、帰無仮説が正しいことの証明ではない。
    explanation: |
      誤りです。結論は「平均点に差があるとはいえない」で、差がないことが示されたわけではありません。
      標本が小さいと、本当は差があっても棄却できないことがあります（第 2 種の過誤）。

  # ---------- 有意水準（2級向けに書き直した用語） ----------
  - id: q12-significance-level-g1
    term: significance-level
    level: 基本
    type: choice
    question: |
      「有意水準 5% の検定」の有意水準 5% の意味として、最も適切なものはどれか。
    choices:
      - 帰無仮説が正しいのに、誤って棄却してしまう確率を 5% 以下にする
      - 帰無仮説が正しい確率が 5% である
      - 対立仮説が正しいのに、棄却しない確率を 5% にする
      - 検定の結論が正しい確率が 95% である
    answer: 0
    hint: |
      有意水準は第 1 種の過誤の確率。
    explanation: |
      有意水準は、帰無仮説が正しいときに棄却してしまう確率（第 1 種の過誤の確率）の上限です。
      帰無仮説が正しい確率や、結論が正しい確率ではありません。対立仮説が正しいのに棄却しない確率は第 2 種の過誤の確率 $\beta$ です。

  - id: q12-significance-level-g2
    term: significance-level
    level: 標準
    type: numeric
    question: |
      帰無仮説がすべて正しい状況で、有意水準 5% の検定を互いに独立に 3 回行う。少なくとも 1 回、誤って帰無仮説を棄却する確率を小数第 3 位まで求めよ。
    answer: 0.143
    tolerance: 0.0005
    hint: |
      余事象「3 回とも棄却しない」の確率は $0.95^3$。
    explanation: |
      $1-0.95^3=1-0.857375\approx 0.143$ です。
      検定をくり返すと、偶然に有意になる確率は 1 回の 5% より大きくなります。$3\times 0.05=0.15$ は近似で、正確な値ではありません。

  # ---------- p値（2級向けに書き直した用語） ----------
  - id: q12-p-value-g2
    term: p-value
    level: 標準
    type: numeric
    question: |
      帰無仮説のもとで標準正規分布にしたがう検定統計量の値が 2.05 だった。両側検定の p 値を求めよ。ただし $P(Z>2.05)=0.0202$ とする。
    answer: 0.0404
    tolerance: 0.0001
    hint: |
      両側検定の p 値は $2P(Z\ge|z|)$。
    explanation: |
      $2\times 0.0202=0.0404$ です。有意水準 5% では棄却し、1% では棄却しません。
      右片側の検定なら p 値は 0.0202 です。

  - id: q12-p-value-g3
    term: p-value
    level: 基本
    type: choice
    question: |
      ある検定で p 値が 0.002 だった。この結果の説明として最も適切なものはどれか。
    choices:
      - 帰無仮説が正しいとしたら、得られた結果と同じかそれ以上に極端な結果が出る確率は 0.002 である
      - 帰無仮説が正しい確率は 0.002 である
      - 効果の大きさがとても大きいことが示された
      - 同じ実験をくり返すと、99.8% の確率で同じ結論になる
    answer: 0
    hint: |
      p 値は帰無仮説のもとで計算する確率。
    explanation: |
      p 値は「帰無仮説が正しいと仮定したとき、観測された結果以上に極端な結果が出る確率」です。
      帰無仮説が正しい確率ではなく、効果の大きさや結論の再現性を表すものでもありません。標本が大きければ、小さな効果でも p 値はとても小さくなります。

  # ---------- 第1種の過誤・第2種の過誤（2級向けに書き直した用語） ----------
  - id: q12-type-i-and-ii-errors-g2
    term: type-i-and-ii-errors
    level: 標準
    type: numeric
    question: |
      母標準偏差 10 の正規母集団から大きさ 25 の標本をとり、帰無仮説「母平均 50」、対立仮説「母平均は 50 より大きい」を有意水準 5% で検定する（標本平均が 53.29 を超えれば棄却）。本当の母平均が 55 のときの検出力を小数第 2 位まで求めよ。ただし $P(Z>0.86)=0.195$ とする。
    answer: 0.80
    tolerance: 0.005
    hint: |
      本当の平均 55 のもとで、標本平均（標準偏差 $10/\sqrt{25}=2$）が 53.29 を超える確率を求める。
    explanation: |
      $P(\bar X>53.29)=P\!\left(Z>\dfrac{53.29-55}{2}\right)=P(Z>-0.855)\approx 1-0.195=0.80$ です。
      第 2 種の過誤の確率は約 0.20 です。棄却の境目は帰無仮説（50）のもとで決め、検出力は本当の値（55）のもとで計算します。

  - id: q12-type-i-and-ii-errors-g3
    term: type-i-and-ii-errors
    level: 基本
    type: choice
    question: |
      有意水準を 5% のまま、標本の大きさを大きくした。第 1 種の過誤と第 2 種の過誤の確率はどうなるか（本当の平均は帰無仮説の値と違うとする）。
    choices:
      - 第 1 種は 5% のまま、第 2 種は小さくなる
      - どちらも小さくなる
      - 第 1 種は小さくなり、第 2 種は大きくなる
      - どちらも変わらない
    answer: 0
    hint: |
      第 1 種の過誤の確率は有意水準そのもの。標本が大きいと標本平均のぶれが小さくなる。
    explanation: |
      第 1 種の過誤の確率は有意水準で決まるので 5% のままです。標本を大きくすると標本平均のぶれが小さくなり、本当の差を見つけやすくなるので、第 2 種の過誤の確率は小さく（検出力は大きく）なります。

  # ---------- 片側検定と両側検定（2級向けに書き直した用語） ----------
  - id: q12-one-sided-two-sided-test-g1
    term: one-sided-two-sided-test
    level: 基本
    type: choice
    question: |
      部品の長さの平均が規格の 20 mm から変わっていないかを調べる。長すぎても短すぎても困る。適切な検定はどれか。
    choices:
      - 両側検定（対立仮説 $\mu\ne 20$）
      - 右片側検定（対立仮説 $\mu>20$）
      - 左片側検定（対立仮説 $\mu<20$）
      - データを見て、平均が 20 より大きければ右片側、小さければ左片側にする
    answer: 0
    hint: |
      どちらの向きのずれも問題になるかどうか。
    explanation: |
      長すぎても短すぎても困るので、どちらの向きのずれも検出できる両側検定にします。
      データを見てから向きを決めると、誤って棄却する確率が有意水準より大きくなるので不適切です。

  - id: q12-one-sided-two-sided-test-g2
    term: one-sided-two-sided-test
    level: 標準
    type: truefalse
    question: |
      帰無仮説のもとで標準正規分布にしたがう検定統計量の値が 1.75 だった。有意水準 5% のとき、右片側検定なら帰無仮説を棄却し、両側検定なら棄却しない。
    answer: true
    hint: |
      右片側の境目は 1.645、両側の境目は 1.96。
    explanation: |
      正しい記述です。$1.645<1.75<1.96$ なので、右片側では棄却、両側では棄却しません。p 値で見ても、片側 0.0401、両側 0.0802 です。

  # ---------- 母平均の検定（分散既知）（2級向けに書き直した用語） ----------
  - id: q12-z-test-known-variance-g1
    term: z-test-known-variance
    level: 基本
    type: numeric
    question: |
      標準偏差 6 g の正規分布にしたがう製品の重さについて、36 個の平均は 498 g だった。帰無仮説「母平均 500 g」の検定統計量 $z$ を求めよ。
    answer: -2
    tolerance: 0.001
    hint: |
      $z=(\bar x-\mu_0)/(\sigma/\sqrt n)$。
    explanation: |
      $z=\dfrac{498-500}{6/\sqrt{36}}=\dfrac{-2}{1}=-2.0$ です。
      両側検定なら $|z|=2.0>1.96$ で有意水準 5% で棄却、1% なら $2.0<2.576$ で棄却しません。

  - id: q12-z-test-known-variance-g2
    term: z-test-known-variance
    level: 標準
    type: choice
    question: |
      母標準偏差 8 の正規母集団から大きさ 16 の標本をとったところ、標本平均は 104 だった。帰無仮説「母平均 100」、対立仮説「母平均は 100 より大きい」の検定の結果として正しいものはどれか。
    choices:
      - z ＝ 2.0 で、有意水準 5% でも 1% でも棄却する
      - z ＝ 2.0 で、有意水準 5% では棄却するが、1% では棄却しない
      - z ＝ 0.5 で、どちらの水準でも棄却しない
      - z ＝ 8.0 で、どちらの水準でも棄却する
    answer: 1
    hint: |
      標準誤差は $8/\sqrt{16}$。右片側の点は 5% で 1.645、1% で 2.326。
    explanation: |
      $z=(104-100)/(8/4)=2.0$ です。$1.645<2.0<2.326$ なので、5% では棄却し、1% では棄却しません。
      0.5 は $\sigma$ で割った値、8.0 は $\sigma/n$ で割った値です。

  # ---------- 1標本t検定（2級向けに書き直した用語） ----------
  - id: q12-one-sample-t-test-g2
    term: one-sample-t-test
    level: 標準
    type: choice
    question: |
      正規母集団から大きさ 10 の標本をとり、母分散が未知のまま、帰無仮説「母平均 100」の両側検定を有意水準 5% で行う。検定統計量 $t$ と比べる値はどれか。
    choices:
      - $t_{0.025}(9)=2.262$
      - $t_{0.05}(9)=1.833$
      - $t_{0.025}(10)=2.228$
      - $z_{0.025}=1.96$
    answer: 0
    hint: |
      自由度は $n-1$。両側 5% なので上側 2.5% 点。
    explanation: |
      自由度 $10-1=9$ の t 分布の上側 2.5% 点 2.262 と比べます。
      1.833 は片側 5% の点、2.228 は自由度を 10 とした点、1.96 は母分散が既知のときの点です。

  # ---------- 棄却域（2級向けに書き直した用語） ----------
  - id: q12-rejection-region-g1
    term: rejection-region
    level: 基本
    type: numeric
    question: |
      母標準偏差 10 の正規母集団から大きさ 25 の標本をとり、帰無仮説「母平均 200」を有意水準 5% の両側検定で調べる。棄却域を標本平均で表したとき、上側の棄却限界（これより大きければ棄却する値）を求めよ。
    answer: 203.92
    tolerance: 0.005
    hint: |
      $\mu_0+1.96\,\sigma/\sqrt n$。
    explanation: |
      標準誤差は $10/5=2$ なので、$200+1.96\times 2=203.92$ です。下側の棄却限界は $196.08$ です。
      右片側の検定なら $200+1.645\times 2=203.29$ になります。

  # ---------- 信頼区間と検定の対応（2級向けに書き直した用語） ----------
  - id: q12-confidence-interval-test-duality-g1
    term: confidence-interval-test-duality
    level: 基本
    type: choice
    question: |
      ある母平均の 95% 信頼区間（t 分布による）が (12.4, 15.8) と得られた。同じデータで有意水準 5% の両側 t 検定を行うとき、棄却される帰無仮説はどれか。
    choices:
      - 「母平均は 12」
      - 「母平均は 13」
      - 「母平均は 14」
      - 「母平均は 15.8」
    answer: 0
    hint: |
      95% 信頼区間に含まれない値が、両側 5% の検定で棄却される。
    explanation: |
      12 は区間 (12.4, 15.8) の外にあるので棄却されます。13 と 14 は区間の中なので棄却されません。15.8 はちょうど区間の端で、棄却の境目にあたります（p 値がちょうど 0.05）。

  # ---------- 検出力・検出力関数（2級向けに書き直した用語） ----------
  - id: q12-power-function-g1
    term: power-function
    level: 標準
    type: numeric
    question: |
      母標準偏差 8 の正規母集団から大きさ 16 の標本をとり、帰無仮説「母平均 50」、対立仮説「母平均は 50 より大きい」を有意水準 5% で検定する（標本平均が 53.29 を超えれば棄却）。本当の母平均が 54 のときの検出力を小数第 2 位まで求めよ。ただし $P(Z>0.36)=0.3594$ とする。
    answer: 0.64
    tolerance: 0.005
    hint: |
      本当の平均 54 のもとで、標本平均（標準偏差 $8/\sqrt{16}=2$）が 53.29 を超える確率。
    explanation: |
      $P(\bar X>53.29)=P\!\left(Z>\dfrac{53.29-54}{2}\right)=P(Z>-0.355)\approx 1-0.3594\approx 0.64$ です。
      差が 4（標準誤差の 2 倍）でも、3 回に 1 回以上は見のがすことになります。

  # ---------- 母分散の検定（2級向けに書き直した用語） ----------
  - id: q12-chi-square-test-variance-g1
    term: chi-square-test-variance
    level: 基本
    type: numeric
    question: |
      正規母集団から大きさ 11 の標本をとったところ、不偏分散は 12 だった。帰無仮説「母分散は 8」の検定統計量 $\chi^2$ を求めよ。
    answer: 15
    tolerance: 0.001
    hint: |
      $\chi^2=(n-1)s^2/\sigma_0^2$。
    explanation: |
      $\chi^2=10\times 12/8=15$ です。自由度 10 のカイ二乗分布の上側 5% 点 18.31 より小さいので、右片側 5% でも棄却しません。

