chapter: 7
questions:
  # ---------- 順列と組合せ (B) ----------
  - id: q07-counting-1
    term: counting
    level: 基本
    type: numeric
    question: |
      6 人の中から代表を 2 人選ぶ方法は何通りか（2 人の役割は区別しない）。
    answer: 15
    tolerance: 0.01
    hint: |
      組合せ $\binom{6}{2}$。
    explanation: |
      $$\binom{6}{2}=\frac{6\times 5}{2\times 1}=15 \text{ 通り}$$
      役割を区別する（代表と副代表）なら ${}_6\mathrm{P}_2=30$ 通りです。

  - id: q07-counting-2
    term: counting
    level: 標準
    type: numeric
    question: |
      当たり 3 本・はずれ 7 本のくじから、同時に 2 本引く。2 本とも当たりである確率を小数第 3 位まで求めよ。
    answer: 0.067
    tolerance: 0.001
    hint: |
      引き方の総数は $\binom{10}{2}$、2 本とも当たりの引き方は $\binom{3}{2}$。
    explanation: |
      $$\frac{\binom{3}{2}}{\binom{10}{2}}=\frac{3}{45}=\frac{1}{15}\approx 0.067$$
      1 本ずつ引くと考えても $\frac{3}{10}\times\frac{2}{9}=\frac{1}{15}$ で同じです。

  - id: q07-counting-3
    term: counting
    level: 基本
    type: choice
    question: |
      8 人の中から委員長と副委員長を 1 人ずつ選ぶ方法は何通りか。
    choices:
      - '28'
      - '56'
      - '64'
      - '16'
    answer: 1
    hint: |
      役割が違うので、順番を区別して選ぶ。
    explanation: |
      委員長の選び方が 8 通り、残り 7 人から副委員長を選ぶので ${}_8\mathrm{P}_2=8\times 7=56$ 通りです。
      28 は役割を区別しない組合せ $\binom{8}{2}$、64 は同じ人が両方を兼ねることを許した数です。

  # ---------- 事象と確率 (A) ----------
  - id: q07-events-and-probability-1
    term: events-and-probability
    level: 基本
    type: numeric
    question: |
      $P(A)=0.5$、$P(B)=0.4$、$P(A\cap B)=0.2$ のとき、$P(A\cup B)$ を求めよ。
    answer: 0.7
    tolerance: 0.001
    hint: |
      加法定理。重なりを 1 回引く。
    explanation: |
      $$P(A\cup B)=0.5+0.4-0.2=0.7$$

  - id: q07-events-and-probability-2
    term: events-and-probability
    level: 標準
    type: truefalse
    question: |
      確率が正である 2 つの事象 $A, B$ が排反ならば、$A$ と $B$ は独立である。
    answer: false
    hint: |
      排反なら $P(A\cap B)=0$。独立なら $P(A\cap B)=P(A)P(B)$。
    explanation: |
      排反だと $P(A\cap B)=0$ ですが、$P(A)P(B)>0$ なので $P(A\cap B)\neq P(A)P(B)$ となり、独立ではありません。
      一方が起きると他方は決して起こらないので、むしろ強く関係しています。

  - id: q07-events-and-probability-3
    term: events-and-probability
    level: 標準
    type: numeric
    question: |
      公正な硬貨を 4 回投げるとき、少なくとも 1 回表が出る確率を求めよ（小数第 4 位まで）。
    answer: 0.9375
    tolerance: 0.0001
    hint: |
      余事象は「4 回とも裏」。
    explanation: |
      $$1-\left(\frac12\right)^4=1-\frac{1}{16}=\frac{15}{16}=0.9375$$

  - id: q07-events-and-probability-4
    term: events-and-probability
    level: 標準
    type: choice
    question: |
      ある調査で、スマートフォンを使う人は 80%、パソコンを使う人は 50%、両方を使う人は 40% だった。どちらも使わない人の割合はどれか。
    choices:
      - 10%
      - 30%
      - 40%
      - 0%
    answer: 0
    hint: |
      まず「少なくとも一方を使う人」の割合を加法定理で求める。
    explanation: |
      少なくとも一方を使う人は $0.8+0.5-0.4=0.9$ なので、どちらも使わない人は $1-0.9=0.1$（10%）です。
      重なりを引き忘れると $0.8+0.5=1.3$ となり 100% を超えてしまいます。

  # ---------- 条件付き確率と乗法定理（共通の用語・2級の問題） ----------
  - id: q07-conditional-probability-g1
    term: conditional-probability
    level: 標準
    type: numeric
    question: |
      あるクラスは男子 25 人（うち眼鏡 10 人）、女子 15 人（うち眼鏡 9 人）である。眼鏡をかけた生徒から 1 人を選ぶとき、その生徒が女子である確率を小数第 3 位まで求めよ。
    answer: 0.474
    tolerance: 0.001
    hint: |
      条件は「眼鏡をかけている」。眼鏡の生徒全体を分母にする。
    explanation: |
      眼鏡の生徒は $10+9=19$ 人なので、$P(\text{女子}\mid\text{眼鏡})=9/19\approx 0.474$ です。
      $P(\text{眼鏡}\mid\text{女子})=9/15=0.6$ とは条件の向きが逆なので注意します。

  # ---------- ベイズの定理（共通の用語・2級の問題） ----------
  - id: q07-bayes-theorem-g1
    term: bayes-theorem
    level: 標準
    type: numeric
    question: |
      ある部品は工場 A で 60%、工場 B で 40% 作られ、不良率は A が 2%、B が 5% である。不良品を 1 つ選んだとき、それが工場 B の製品である確率を求めよ。
    answer: 0.625
    tolerance: 0.001
    hint: |
      分母の「不良品である確率」を全確率の公式で求める。
    explanation: |
      $P(\text{A かつ不良})=0.6\times 0.02=0.012$、$P(\text{B かつ不良})=0.4\times 0.05=0.020$。
      $$P(\text{B}\mid\text{不良})=\frac{0.020}{0.012+0.020}=\frac{0.020}{0.032}=0.625$$
      生産量は A のほうが多くても、不良品の中では B の製品のほうが多くなります。

  - id: q07-bayes-theorem-g2
    term: bayes-theorem
    level: 基本
    type: truefalse
    question: |
      病気の人を 99% の確率で陽性と判定する検査がある。この検査で陽性と判定された人が実際に病気である確率も、必ず 99% である。
    answer: false
    hint: |
      $P(\text{陽性}\mid\text{病気})$ と $P(\text{病気}\mid\text{陽性})$ は別の量。後者は有病率や、病気でない人が陽性になる確率にもよる。
    explanation: |
      誤りです。例えば有病率 1%、病気でない人が陽性になる確率 5% なら、10000 人のうち陽性は病気の人 99 人と病気でない人 495 人で、陽性の人が病気である確率は $99/594\approx 0.17$ にすぎません。
      ベイズの定理で逆向きの確率を求めるには、事前確率（有病率）が必要です。

  - id: q07-bayes-theorem-g3
    term: bayes-theorem
    level: 標準
    type: numeric
    question: |
      箱 A には赤玉 2 個・白玉 3 個、箱 B には赤玉 4 個・白玉 1 個が入っている。硬貨を投げて箱を 1 つ選び（どちらも確率 1/2）、選んだ箱から玉を 1 個取り出したところ赤玉だった。選んだ箱が A である確率を小数第 3 位まで求めよ。
    answer: 0.333
    tolerance: 0.001
    hint: |
      $P(\text{A}\mid\text{赤})=\dfrac{P(\text{赤}\mid\text{A})P(\text{A})}{P(\text{赤}\mid\text{A})P(\text{A})+P(\text{赤}\mid\text{B})P(\text{B})}$。
    explanation: |
      $P(\text{A かつ赤})=0.5\times 0.4=0.2$、$P(\text{B かつ赤})=0.5\times 0.8=0.4$ なので
      $$P(\text{A}\mid\text{赤})=\frac{0.2}{0.2+0.4}=\frac{1}{3}\approx 0.333$$
      赤玉の多い箱 B のほうが、赤玉が出たときの原因として起こりやすくなります。赤玉が出たという情報で、箱 A の確率は 1/2 から 1/3 に下がりました。
