chapter: 15
questions:
  # ---------- 処理群と対照群 (A) ----------
  - id: q15-treatment-and-control-1
    term: treatment-and-control
    level: 基本
    type: choice
    question: |
      新しい薬の効果を調べる実験で、対照群に偽薬（有効成分を含まない見た目が同じ薬）を飲んでもらう主な目的はどれか。
    choices:
      - 「薬を飲んだ」という思い込みによる効果を、両群でそろえるため
      - 対照群の人数を減らすため
      - 処理群の効果を大きく見せるため
      - 新しい薬の副作用を調べるため
    answer: 0
    hint: |
      薬を飲んだと思うだけで症状が良くなることがある（プラセボ効果）。
    explanation: |
      偽薬を使うと、思い込みによる効果（プラセボ効果）が両群に同じように生じるので、群の差を有効成分の効果として取り出せます。
      どちらの群かを本人に知らせない（盲検化）こととセットで使います。

  - id: q15-treatment-and-control-2
    term: treatment-and-control
    level: 標準
    type: truefalse
    question: |
      処理を受ける前後で結果を比べれば、対照群を置かなくても処理の効果を正しく評価できる。
    answer: false
    hint: |
      時間がたつだけで結果が変わることはないか。
    explanation: |
      前後の変化には、処理の効果のほかに、時間の経過・季節・自然な回復・思い込みなどの影響が混ざります。
      同じ期間を過ごした対照群と比べることで、処理の効果だけを取り出せます。

  - id: q15-treatment-and-control-3
    term: treatment-and-control
    level: 標準
    type: numeric
    question: |
      80 人を無作為に 40 人ずつに分け、処理群では 30 人、対照群では 20 人の症状が改善した。改善した人の割合の差（処理群 − 対照群）を求めよ。
    answer: 0.25
    tolerance: 0.001
    hint: |
      それぞれの群の改善率を求めて引く。
    explanation: |
      処理群は $30/40=0.75$、対照群は $20/40=0.50$ なので、差は $0.25$ です。
      この差が偶然の範囲かどうかは、2 標本の比率の差の検定で確かめます。

  # ---------- 分散分析表の読み方 (A) ----------
  - id: q15-anova-table-1
    term: anova-table
    level: 基本
    type: numeric
    question: |
      4 つの群に 6 人ずつ（合計 24 人）を割り付けた一元配置分散分析で、群内（誤差）の自由度を求めよ。
    answer: 20
    tolerance: 0.01
    hint: |
      群内の自由度 ＝ 全体の個数 − 群の数。
    explanation: |
      群内の自由度は $24-4=20$ です。群間の自由度は $4-1=3$、全体は $24-1=23$ で、$3+20=23$ になります。

  - id: q15-anova-table-2
    term: anova-table
    level: 標準
    type: numeric
    question: |
      一元配置分散分析で、群間の平方和が 60（自由度 2）、群内の平方和が 90（自由度 18）だった。F 比を求めよ。
    answer: 6
    tolerance: 0.001
    hint: |
      まず平均平方（平方和 ÷ 自由度）を求める。
    explanation: |
      群間の平均平方は $60/2=30$、群内の平均平方は $90/18=5$ なので、$F=30/5=6$ です。
      平方和の比 $60/90$ を F 比とするのは誤りです。

  - id: q15-anova-table-3
    term: anova-table
    level: 標準
    type: choice
    question: |
      3 群の一元配置分散分析で F 比が 6.0 だった。F 分布表で $F_{0.05}(2,18)=3.555$ のとき、有意水準 5% での結論として正しいものはどれか。
    choices:
      - 3 つの群の母平均がすべて等しいという帰無仮説を棄却する
      - 帰無仮説を採択し、母平均はすべて等しいと結論する
      - すべての群の母平均が互いに異なると結論する
      - 群内の分散が群間の分散より大きいと結論する
    answer: 0
    hint: |
      F 比が上側 5% 点より大きいかを見る。
    explanation: |
      $6.0>3.555$ なので帰無仮説を棄却し、「少なくとも 1 組の群の母平均に差がある」と判断します。
      どの群とどの群に差があるかまでは、分散分析だけではわかりません。

  - id: q15-anova-table-4
    term: anova-table
    level: 基本
    type: truefalse
    question: |
      一元配置分散分析では、全体の平方和は、群間の平方和と群内の平方和の和に等しい。
    answer: true
    hint: |
      各データの偏差を「群の平均からのずれ」と「群の平均の全体平均からのずれ」に分ける。
    explanation: |
      $S_T=S_A+S_E$ が成り立ちます（平方和の分解）。自由度も $N-1=(k-1)+(N-k)$ と分解できます。

  # ---------- 一元配置分散分析（共通の用語・2級の問題） ----------
  - id: q15-one-way-anova-g1
    term: one-way-anova
    level: 標準
    type: numeric
    question: |
      5 群・合計 35 個のデータの一元配置分散分析で、群間の平方和は 40、群内の平方和は 90 だった。F 比を小数第 2 位まで求めよ。
    answer: 3.33
    tolerance: 0.01
    hint: |
      自由度は群間 $5-1$、群内 $35-5$。
    explanation: |
      群間の平均平方 $40/4=10$、群内の平均平方 $90/30=3$、$F=10/3\approx 3.33$ です。

  - id: q15-one-way-anova-g2
    term: one-way-anova
    level: 標準
    type: truefalse
    question: |
      2 つの群だけで一元配置分散分析を行うと、F 比は、母分散が等しいと仮定した 2 標本 t 検定の t 統計量の 2 乗に等しくなる。
    answer: true
    hint: |
      2 群なら群間の自由度は 1。$F(1,\ \nu)$ と $t(\nu)$ の関係。
    explanation: |
      正しい記述です。例えば A：3, 5, 4, 6, 7 と B：7, 8, 6, 9, 10 では、$F=9.0$、$t=-3.0$ で $t^2=F$ です。2 つの検定は同じ結論になります。

  # ---------- 平方和の分解（2級向けに書き直した用語） ----------
  - id: q15-sum-of-squares-decomposition-g1
    term: sum-of-squares-decomposition
    level: 標準
    type: numeric
    question: |
      3 つの群（各 5 個）の平均は 20、24、25 だった。群間の平方和を求めよ。
    answer: 70
    tolerance: 0.001
    hint: |
      全体の平均を求め、各群について「群の大きさ ×（群の平均 − 全体の平均）²」を足す。
    explanation: |
      全体の平均は $(20+24+25)/3=23$（各群の大きさが等しいので単純な平均でよい）。群間の平方和は $5\{(20-23)^2+(24-23)^2+(25-23)^2\}=5\times 14=70$ です。
      群の大きさ 5 を掛け忘れると 14 になります。

  - id: q15-sum-of-squares-decomposition-g2
    term: sum-of-squares-decomposition
    level: 基本
    type: truefalse
    question: |
      一元配置分散分析では、全体の平均平方は、群間の平均平方と群内の平均平方の和に等しい。
    answer: false
    hint: |
      足し算で分解できるのは平方和と自由度。
    explanation: |
      誤りです。足し算で分解できるのは平方和（$S_T=S_A+S_E$）と自由度（$N-1=(k-1)+(N-k)$）で、平均平方（平方和 ÷ 自由度）は足し算になりません。
      例えば 3 群・各 3 個で $S_T=60$、$S_A=54$、$S_E=6$ なら、平均平方は $60/8=7.5$、$54/2=27$、$6/6=1$ で、$27+1\ne 7.5$ です。

