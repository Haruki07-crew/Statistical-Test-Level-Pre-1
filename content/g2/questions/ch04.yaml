chapter: 4
questions:
  # ---------- 単回帰と回帰直線 (A) ----------
  - id: q04-simple-regression-1
    term: simple-regression
    level: 基本
    type: numeric
    question: |
      $x$ の平均が 10、$y$ の平均が 50 のデータに、最小二乗法で回帰直線 $\hat y = a + bx$ を当てはめたところ、傾きは $b=2.5$ だった。切片 $a$ を求めよ。
    answer: 25
    tolerance: 0.01
    hint: |
      回帰直線は平均の点 $(\bar x,\bar y)$ を通る。
    explanation: |
      $a=\bar y-b\bar x=50-2.5\times 10=25$ です。

  - id: q04-simple-regression-2
    term: simple-regression
    level: 標準
    type: numeric
    question: |
      $x$ と $y$ の相関係数が 0.8、$x$ の標準偏差が 5、$y$ の標準偏差が 10 である。$y$ を $x$ で説明する回帰直線の傾きを求めよ。
    answer: 1.6
    tolerance: 0.001
    hint: |
      傾き ＝ 相関係数 × $y$ の標準偏差 ÷ $x$ の標準偏差。
    explanation: |
      $$b=r\,\frac{s_y}{s_x}=0.8\times\frac{10}{5}=1.6$$
      相関係数（0.8）をそのまま傾きとするのは誤りです。

  - id: q04-simple-regression-3
    term: simple-regression
    level: 標準
    type: choice
    question: |
      5 組のデータ $(x,y)=(2,5),(4,7),(6,6),(8,10),(10,12)$ に最小二乗法で当てはめた回帰直線はどれか。
    choices:
      - $\hat y = 2.9 + 0.85x$
      - $\hat y = 0.85 + 2.9x$
      - $\hat y = 3.5 + 0.75x$
      - $\hat y = 2.48 + 0.92x$
    answer: 0
    hint: |
      $\bar x=6,\ \bar y=8$。$S_{xx}=\sum(x-\bar x)^2$、$S_{xy}=\sum(x-\bar x)(y-\bar y)$ を計算する。
    explanation: |
      偏差は $x$：−4, −2, 0, 2, 4、$y$：−3, −1, −2, 2, 4。
      $S_{xx}=40$、$S_{xy}=12+2+0+4+16=34$ なので、$b=34/40=0.85$、$a=8-0.85\times 6=2.9$ です。
      $3.5+0.75x$ も平均の点を通りますが傾きが違います。0.92 は相関係数を傾きと取り違えた値です。

  - id: q04-simple-regression-4
    term: simple-regression
    level: 基本
    type: truefalse
    question: |
      最小二乗法で求めた回帰直線は、必ず平均の点 $(\bar x,\bar y)$ を通る。
    answer: true
    hint: |
      切片の式 $a=\bar y-b\bar x$ を変形する。
    explanation: |
      $a=\bar y-b\bar x$ より $\bar y=a+b\bar x$ なので、回帰直線は点 $(\bar x,\bar y)$ を通ります。
      このため残差の合計は 0 になります。

  # ---------- 最小二乗法（2級向けに書き直した用語） ----------
  - id: q04-least-squares-method-g1
    term: least-squares-method
    level: 基本
    type: choice
    question: |
      $y$ を $x$ で説明する回帰直線を最小二乗法で求めるとき、最小にしているものはどれか。
    choices:
      - 各点の $y$ の値と直線の予測値の差（残差）の 2 乗の合計
      - 各点の $y$ の値と直線の予測値の差（残差）の合計
      - 各点から直線に垂直に下ろした線の長さの合計
      - 各点の $y$ の値と $y$ の平均の差の 2 乗の合計
    answer: 0
    hint: |
      残差をそのまま足すと、正と負が打ち消し合う。
    explanation: |
      最小二乗法は、縦のずれ（残差）$y_i-\hat y_i$ の 2 乗の合計を最小にします。
      残差の合計は、最小二乗法の直線では自動的に 0 になるので、これを最小にしても直線は 1 本に決まりません。垂直に下ろした長さ（点と直線の距離）ではなく縦のずれを使うのは、$y$ の予測の誤差を小さくしたいからです。$y$ と平均の差の 2 乗の合計は全体の平方和で、直線によらず一定です。

  - id: q04-least-squares-method-g2
    term: least-squares-method
    level: 標準
    type: numeric
    question: |
      5 組のデータについて、$\sum x=20$、$\sum y=50$、$\sum xy=215$、$\sum x^2=90$ だった。最小二乗法による回帰直線 $\hat y=a+bx$ の切片 $a$ を求めよ。
    answer: 4
    tolerance: 0.001
    hint: |
      $S_{xy}=\sum xy-n\bar x\bar y$、$S_{xx}=\sum x^2-n\bar x^{\,2}$、$b=S_{xy}/S_{xx}$、$a=\bar y-b\bar x$。
    explanation: |
      $\bar x=4$、$\bar y=10$、$S_{xy}=215-5\times 4\times 10=15$、$S_{xx}=90-5\times 16=10$ なので $b=1.5$、$a=10-1.5\times 4=4$ です。
      $\sum xy/\sum x^2\approx 2.39$ を傾きにするのは、平均を引いていない誤りです。

  - id: q04-least-squares-method-g3
    term: least-squares-method
    level: 標準
    type: truefalse
    question: |
      最小二乗法は残差を 2 乗して足すので、ほかの点から大きく外れた点が 1 つあっても、回帰直線はほとんど変わらない。
    answer: false
    hint: |
      ずれが 2 倍になると、2 乗した値は 4 倍になる。
    explanation: |
      誤りです。2 乗すると大きなずれほど強く数えられるので、外れた点に直線が大きく引き寄せられます。
      例えば $(1,2),(2,4),(3,5),(4,4),(5,6)$ の傾きは 0.8 ですが、最後の点を $(5,\ 12)$ にすると傾きは 2.0 になります。散布図で外れた点を確かめてから当てはめます。

  # ---------- 決定係数（2級向けに書き直した用語） ----------
  - id: q04-coefficient-of-determination-g1
    term: coefficient-of-determination
    level: 基本
    type: numeric
    question: |
      ある単回帰分析で、目的変数の全体の平方和は 400、残差平方和は 100 だった。決定係数を求めよ。
    answer: 0.75
    tolerance: 0.0001
    hint: |
      $R^2=1-(\text{残差平方和})/(\text{全体の平方和})$。
    explanation: |
      $1-100/400=0.75$ です。目的変数の変動の 75% が回帰で説明されます。
      $100/400=0.25$ は、説明されずに残った割合です。

  - id: q04-coefficient-of-determination-g2
    term: coefficient-of-determination
    level: 標準
    type: choice
    question: |
      単回帰分析で、回帰直線の傾きは負、決定係数は 0.81 だった。相関係数はいくらか。
    choices:
      - '−0.9'
      - '0.9'
      - '−0.81'
      - '0.81'
    answer: 0
    hint: |
      単回帰では決定係数は相関係数の 2 乗。符号は傾きの符号と同じ。
    explanation: |
      $|r|=\sqrt{0.81}=0.9$ で、傾きが負なので $r=-0.9$ です。決定係数からは符号がわからないので、傾きの符号で決めます。

  # ---------- 残差（2級向けに書き直した用語） ----------
  - id: q04-residual-g1
    term: residual
    level: 基本
    type: numeric
    question: |
      回帰直線 $\hat y=30+0.5x$ が得られた。$x=40$ で $y=47$ のデータの残差を求めよ。
    answer: -3
    tolerance: 0.001
    hint: |
      残差 ＝ 実際の値 − 予測値。
    explanation: |
      予測値は $30+0.5\times 40=50$ なので、残差は $47-50=-3$ です。負の残差は、そのデータが回帰直線より下にある（予測より小さい）ことを表します。

  - id: q04-residual-g2
    term: residual
    level: 基本
    type: truefalse
    question: |
      切片を含む単回帰を最小二乗法で当てはめたとき、当てはまりが悪いデータほど、残差の合計は大きな正の値になる。
    answer: false
    hint: |
      最小二乗法の直線は平均の点 $(\bar x,\bar y)$ を通る。
    explanation: |
      誤りです。切片を含む最小二乗法では、当てはまりのよしあしにかかわらず残差の合計は必ず 0 になります。当てはまりの悪さは、残差の 2 乗の合計（残差平方和）や決定係数で見ます。

  # ---------- 対数変換（2級向けに書き直した用語） ----------
  - id: q04-log-transformation-g1
    term: log-transformation
    level: 標準
    type: numeric
    question: |
      売上 $y$ の自然対数を説明変数 $x$ で回帰して $\log y=2.0+0.2x$ を得た。$x$ が 1 増えると、売上は何 % 増えると予測されるか。小数第 1 位まで答えよ。ただし $e^{0.2}=1.2214$ とする。
    answer: 22.1
    tolerance: 0.05
    hint: |
      $\log y$ が 0.2 増えると、$y$ は $e^{0.2}$ 倍になる。
    explanation: |
      $y$ は $e^{0.2}=1.2214$ 倍になるので、約 22.1% 増えます。係数 0.2 を「20% 増」と読むのは、係数が小さいときの近似で、0.2 では差が出ます。

  # ---------- 残差プロット（2級向けに書き直した用語） ----------
  - id: q04-residual-plot-g1
    term: residual-plot
    level: 基本
    type: choice
    question: |
      単回帰の残差を予測値に対してプロットしたところ、予測値が大きいほど残差の散らばりが大きくなる扇形になった。最も適切な判断はどれか。
    choices:
      - 誤差の分散が一定でない可能性があり、目的変数の対数変換などを検討する
      - 関係が曲線的である可能性があり、2 次の項を加えるべきである
      - 残差の合計が 0 でないので、計算に誤りがある
      - 当てはまりが非常によいことを示している
    answer: 0
    hint: |
      扇形は散らばりの大きさの変化、U 字形は関係の形の問題。
    explanation: |
      扇形は、予測値（目的変数の大きさ）によって誤差の散らばりが変わる（不均一分散）ことを示します。売上や所得のような量では、対数をとると散らばりがそろうことが多いです。
      曲線的な関係を示すのは U 字形などの曲線の模様です。最小二乗法の残差の合計はいつも 0 です。

  - id: q04-residual-plot-g2
    term: residual-plot
    level: 標準
    type: choice
    question: |
      単回帰の残差を説明変数 $x$ に対してプロットしたところ、$x$ の小さいところと大きいところで残差が正、中ほどで負になる U 字形の並びになった。最も適切な判断はどれか。
    choices:
      - 直線では表せない曲線的な関係があるので、x の 2 乗の項を加えるなどモデルを見直す
      - 誤差の分散が x とともに大きくなっているので、対数変換を考える
      - 残差の合計は 0 なので、モデルに問題はない
      - 残差どうしに時間的な相関があるので、時系列のモデルを使う
    answer: 0
    hint: |
      残差に「形」があるのは、モデルがとらえていない規則性が残っているしるし。
    explanation: |
      U 字形の並びは、本当の関係が曲線なのに直線を当てはめたときに現れます。2 乗の項を加える、変数を変換するなどでモデルを見直します。散らばりが扇形に広がるのは分散が一定でないとき、波のような並びは時間的な相関があるときのしるしです。残差の合計は、当てはまりの良し悪しによらずいつも 0 です。
  - id: q04-log-transformation-g2
    term: log-transformation
    level: 応用
    type: numeric
    question: |
      ある商品の販売数 $y$ と広告費 $x$ について、両方の自然対数をとって回帰し、$\log y=1.0+0.8\log x$ を得た。広告費を 10% 増やすと、販売数は何 % 増えると予測されるか。小数第 1 位まで答えよ。ただし $1.1^{0.8}=1.0792$ とする。
    answer: 7.9
    tolerance: 0.05
    hint: |
      $x$ を 1.1 倍すると、$y$ は $1.1^{0.8}$ 倍になる。
    explanation: |
      $y=e^{1.0}x^{0.8}$ なので、$x$ を 1.1 倍すると $y$ は $1.1^{0.8}=1.0792$ 倍、つまり約 7.9% 増えます。両方を対数にしたときの傾き 0.8 は「$x$ が 1% 増えると $y$ が約 0.8% 増える」（弾力性）という意味で、$0.8\times 10=8$% はその近似です。
  - id: q04-coefficient-of-determination-g3
    term: coefficient-of-determination
    level: 応用
    type: numeric
    question: |
      単回帰分析で、説明変数の偏差平方和は 50、目的変数の偏差平方和は 200、回帰直線の傾きは 1.6 だった。決定係数を求めよ。
    answer: 0.64
    tolerance: 0.001
    hint: |
      回帰で説明される平方和は $b^2S_{xx}$。
    explanation: |
      回帰で説明される平方和は $1.6^2\times 50=128$ なので、$R^2=128/200=0.64$ です。相関係数で考えても、$S_{xy}=bS_{xx}=80$、$r=80/\sqrt{50\times 200}=0.8$ で $r^2=0.64$ になります。
  - id: q04-residual-g3
    term: residual
    level: 応用
    type: numeric
    question: |
      4 組のデータ $(x,y)=(1,2),(2,4),(3,5),(4,7)$ に最小二乗法で回帰直線を当てはめた。残差平方和を求めよ。
    answer: 0.2
    tolerance: 0.001
    hint: |
      $S_{xx}=5$、$S_{xy}=8$ から傾きと切片を求め、各点の予測値との差を 2 乗して足す。
    explanation: |
      傾きは $8/5=1.6$、切片は $4.5-1.6\times 2.5=0.5$ で、予測値は 2.1、3.7、5.3、6.9 です。残差は −0.1、0.3、−0.3、0.1（合計 0）で、残差平方和は $0.01+0.09+0.09+0.01=0.2$ です。$S_{yy}-S_{xy}^2/S_{xx}=13-64/5=0.2$ でも求められます。
