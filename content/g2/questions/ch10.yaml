chapter: 10
questions:
  # ---------- 標本平均の分布 (A) ----------
  - id: q10-sampling-distribution-of-mean-1
    term: sampling-distribution-of-mean
    level: 基本
    type: numeric
    question: |
      母標準偏差が 12 の母集団から、大きさ 36 の標本を無作為に取り出す。標本平均の標準偏差を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      $\sigma/\sqrt n$。
    explanation: |
      $$\frac{12}{\sqrt{36}}=\frac{12}{6}=2$$

  - id: q10-sampling-distribution-of-mean-2
    term: sampling-distribution-of-mean
    level: 標準
    type: numeric
    question: |
      母平均 50、母標準偏差 10 の正規母集団から大きさ 25 の標本を取り出す。標本平均が 53 を超える確率を求めよ。ただし $P(Z>1.5)=0.0668$ とする。
    answer: 0.0668
    tolerance: 0.0005
    hint: |
      標本平均の標準偏差は $10/\sqrt{25}=2$。標準化する。
    explanation: |
      標本平均は $N(50,\ 2^2)$ にしたがうので、
      $$P(\bar X>53)=P\left(Z>\frac{53-50}{2}\right)=P(Z>1.5)=0.0668$$
      標準偏差 10 で割って $P(Z>0.3)$ とするのは、1 個の値の確率と取り違えた誤りです。

  - id: q10-sampling-distribution-of-mean-3
    term: sampling-distribution-of-mean
    level: 標準
    type: choice
    question: |
      標本の大きさを 100 から 400 に増やすと、標本平均の標準偏差はどうなるか。
    choices:
      - 1/4 になる
      - 1/2 になる
      - 変わらない
      - 2 倍になる
    answer: 1
    hint: |
      標準偏差は $1/\sqrt n$ に比例する。
    explanation: |
      $n$ が 4 倍になると $\sqrt n$ は 2 倍なので、標準偏差は 1/2 になります。
      1/4 になるのは分散です。

  - id: q10-sampling-distribution-of-mean-4
    term: sampling-distribution-of-mean
    level: 基本
    type: truefalse
    question: |
      母集団の分布が正規分布でなくても、標本の大きさが十分に大きければ、標本平均の分布は正規分布で近似できる。
    answer: true
    hint: |
      中心極限定理。
    explanation: |
      中心極限定理により、平均と分散が有限の母集団なら、標本の大きさが大きいとき標本平均の分布は正規分布 $N(\mu,\ \sigma^2/n)$ に近づきます。
      母集団の歪みが強いほど、近似に必要な標本の大きさは大きくなります。

  # ---------- 分布表の読み方 (A) ----------
  - id: q10-statistical-tables-1
    term: statistical-tables
    level: 基本
    type: choice
    question: |
      標準正規分布で、両側合わせて 5% となる点（$P(|Z|>c)=0.05$ となる $c$）はどれか。
    choices:
      - '1.645'
      - '1.960'
      - '2.326'
      - '2.576'
    answer: 1
    hint: |
      両側 5% は、上側 2.5%。
    explanation: |
      $P(|Z|>c)=0.05$ なら $P(Z>c)=0.025$ なので、$c=z_{0.025}=1.960$ です。
      1.645 は上側 5%、2.326 は上側 1%、2.576 は上側 0.5% の点です。

  - id: q10-statistical-tables-2
    term: statistical-tables
    level: 標準
    type: numeric
    question: |
      標準正規分布表で $P(Z>1.2)=0.1151$ である。$P(|Z|>1.2)$ を求めよ。
    answer: 0.2302
    tolerance: 0.0001
    hint: |
      標準正規分布は 0 について左右対称。
    explanation: |
      $P(Z<-1.2)=P(Z>1.2)=0.1151$ なので、$P(|Z|>1.2)=2\times 0.1151=0.2302$ です。

  - id: q10-statistical-tables-3
    term: statistical-tables
    level: 標準
    type: numeric
    question: |
      F 分布表で $F_{0.05}(8,5)=4.818$ である。自由度 $(5, 8)$ の F 分布の下側 5% 点 $F_{0.95}(5,8)$ を小数第 3 位まで求めよ。
    answer: 0.208
    tolerance: 0.001
    hint: |
      $F_{1-\alpha}(m,n)=1/F_{\alpha}(n,m)$。自由度の順番に注意。
    explanation: |
      $$F_{0.95}(5,8)=\frac{1}{F_{0.05}(8,5)}=\frac{1}{4.818}\approx 0.208$$

  - id: q10-statistical-tables-4
    term: statistical-tables
    level: 標準
    type: choice
    question: |
      大きさ 10 の標本から、正規母集団の母分散の 95% 信頼区間を作る。分布表から読む値の組として正しいものはどれか。
    choices:
      - $\chi^2_{0.025}(9)$ と $\chi^2_{0.975}(9)$
      - $\chi^2_{0.05}(9)$ と $\chi^2_{0.95}(9)$
      - $\chi^2_{0.025}(10)$ と $\chi^2_{0.975}(10)$
      - $\chi^2_{0.025}(9)$ とその符号を変えた値
    answer: 0
    hint: |
      統計量 $(n-1)s^2/\sigma^2$ は自由度 $n-1$ のカイ二乗分布。両側 5%。
    explanation: |
      自由度は $10-1=9$、両側 5% なので上側 2.5% 点と上側 97.5% 点（下側 2.5% 点）を使います。
      カイ二乗分布は左右対称ではないので、符号を変えた値は使えません。

  # ---------- 中心極限定理（共通の用語・2級の問題） ----------
  - id: q10-central-limit-theorem-g1
    term: central-limit-theorem
    level: 標準
    type: numeric
    question: |
      母平均 50、母標準偏差 12 の母集団（分布の形はわからない）から大きさ 36 の標本を抽出する。中心極限定理を使い、標本平均が 54 を超える確率を近似せよ。ただし $P(Z>2)=0.0228$ とする。
    answer: 0.0228
    tolerance: 0.0001
    hint: |
      標本平均は近似的に平均 50、標準偏差 $12/\sqrt{36}$ の正規分布にしたがう。
    explanation: |
      標準偏差は $12/6=2$。$(54-50)/2=2$ なので、$P(\bar X>54)\approx P(Z>2)=0.0228$ です。
      ただし近似なので、母集団の分布が大きく歪んでいる（例えば指数分布）と、$n=36$ でも実際の確率は 0.03 程度になることがあります。歪みが強いほど、近似に必要な標本の大きさは大きくなります。

  - id: q10-central-limit-theorem-g2
    term: central-limit-theorem
    level: 基本
    type: choice
    question: |
      ある市の世帯の年間の電気代は、右に裾の長い分布をしている（平均 $\mu$、標準偏差 $\sigma$）。この市から無作為に選んだ 100 世帯の電気代の平均 $\bar X$ の分布について、最も適切なものはどれか。
    choices:
      - 近似的に、平均 $\mu$・標準偏差 $\sigma/10$ の正規分布にしたがう
      - 母集団と同じく右に裾の長い形で、標準偏差は $\sigma/10$ になる
      - 近似的に、平均 $\mu$・標準偏差 $\sigma$ の正規分布にしたがう
      - 母集団が正規分布でないので、$\bar X$ の分布について何もいえない
    answer: 0
    hint: |
      中心極限定理は、母集団の形によらず標本平均の分布について述べている。標本平均の標準偏差は $\sigma/\sqrt n$。
    explanation: |
      標本が大きければ、母集団が歪んでいても標本平均は近似的に正規分布にしたがいます（中心極限定理）。平均は $\mu$、標準偏差は $\sigma/\sqrt{100}=\sigma/10$ です。
      $n=1$ なら元の分布の形のままですが、$n$ が大きくなるにつれて歪みは小さくなります。標準偏差を $\sigma$ のままにするのは、標本平均ではなく 1 世帯分の値の散らばりと取り違えた誤りです。

  - id: q10-central-limit-theorem-g3
    term: central-limit-theorem
    level: 標準
    type: numeric
    question: |
      1 個の重さが平均 20 g・標準偏差 3 g の菓子がある（分布の形はわからない）。無作為に選んだ 100 個を 1 つの袋に詰めるとき、袋の中身の合計が 2045 g を超える確率を、中心極限定理を使って近似せよ。ただし $P(Z>1.5)=0.0668$ とする。
    answer: 0.0668
    tolerance: 0.0001
    hint: |
      合計は近似的に、平均 $100\times 20$、標準偏差 $\sqrt{100}\times 3$ の正規分布にしたがう。
    explanation: |
      合計の平均は 2000 g、分散は $100\times 3^2=900$ なので標準偏差は 30 g です。$(2045-2000)/30=1.5$ より、確率は $P(Z>1.5)=0.0668$ です。
      合計の標準偏差を $100\times 3=300$ とすると $z=0.15$ になり、確率を大きく見積もってしまいます。分散が $n$ 倍なので、標準偏差は $\sqrt n$ 倍です。

  # ---------- 二項分布・ポアソン分布の正規近似（共通の用語・2級の問題） ----------
  - id: q10-normal-approximation-binomial-poisson-g1
    term: normal-approximation-binomial-poisson
    level: 基本
    type: numeric
    question: |
      二項分布 $B(400,\ 0.2)$ を正規分布で近似する。近似に使う正規分布の標準偏差を求めよ。
    answer: 8
    tolerance: 0.001
    hint: |
      分散は $np(1-p)$。
    explanation: |
      分散 $400\times 0.2\times 0.8=64$ なので、標準偏差は 8 です（平均は 80）。

  # ---------- t分布（共通の用語・2級の問題） ----------
  - id: q10-t-distribution-g1
    term: t-distribution
    level: 基本
    type: truefalse
    question: |
      t 分布は自由度が大きくなるほど標準正規分布に近づき、自由度が小さいほど裾が重くなる。
    answer: true
    hint: |
      上側 2.5% 点は、自由度 5 で 2.571、自由度 30 で 2.042、自由度が無限大で 1.96。
    explanation: |
      正しい記述です。母分散を標本から推定する不確かさの分だけ裾が重くなり、標本が大きくなるとその影響が小さくなります。

  # ---------- カイ二乗分布（共通の用語・2級の問題） ----------
  - id: q10-chi-squared-distribution-g1
    term: chi-squared-distribution
    level: 基本
    type: numeric
    question: |
      自由度 6 のカイ二乗分布の分散を求めよ。
    answer: 12
    tolerance: 0.001
    hint: |
      自由度 $k$ のカイ二乗分布の期待値は $k$、分散は $2k$。
    explanation: |
      分散は $2\times 6=12$ です（期待値は 6）。
