chapter: 10
questions:
  # ---------- 標本平均の分布 (A) ----------
  - id: q10-sampling-distribution-of-mean-1
    term: sampling-distribution-of-mean
    level: 基本
    type: numeric
    question: |
      母標準偏差が 12 の母集団から、大きさ 36 の標本を無作為に取り出す。標本平均の標準偏差を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      $\sigma/\sqrt n$。
    explanation: |
      $$\frac{12}{\sqrt{36}}=\frac{12}{6}=2$$

  - id: q10-sampling-distribution-of-mean-2
    term: sampling-distribution-of-mean
    level: 標準
    type: numeric
    question: |
      母平均 50、母標準偏差 10 の正規母集団から大きさ 25 の標本を取り出す。標本平均が 53 を超える確率を求めよ。ただし $P(Z>1.5)=0.0668$ とする。
    answer: 0.0668
    tolerance: 0.0005
    hint: |
      標本平均の標準偏差は $10/\sqrt{25}=2$。標準化する。
    explanation: |
      標本平均は $N(50,\ 2^2)$ にしたがうので、
      $$P(\bar X>53)=P\left(Z>\frac{53-50}{2}\right)=P(Z>1.5)=0.0668$$
      標準偏差 10 で割って $P(Z>0.3)$ とするのは、1 個の値の確率と取り違えた誤りです。

  - id: q10-sampling-distribution-of-mean-3
    term: sampling-distribution-of-mean
    level: 標準
    type: choice
    question: |
      標本の大きさを 100 から 400 に増やすと、標本平均の標準偏差はどうなるか。
    choices:
      - 1/4 になる
      - 1/2 になる
      - 変わらない
      - 2 倍になる
    answer: 1
    hint: |
      標準偏差は $1/\sqrt n$ に比例する。
    explanation: |
      $n$ が 4 倍になると $\sqrt n$ は 2 倍なので、標準偏差は 1/2 になります。
      1/4 になるのは分散です。

  - id: q10-sampling-distribution-of-mean-4
    term: sampling-distribution-of-mean
    level: 基本
    type: truefalse
    question: |
      母集団の分布が正規分布でなくても、標本の大きさが十分に大きければ、標本平均の分布は正規分布で近似できる。
    answer: true
    hint: |
      中心極限定理。
    explanation: |
      中心極限定理により、平均と分散が有限の母集団なら、標本の大きさが大きいとき標本平均の分布は正規分布 $N(\mu,\ \sigma^2/n)$ に近づきます。
      母集団の歪みが強いほど、近似に必要な標本の大きさは大きくなります。

  # ---------- 分布表の読み方 (A) ----------
  - id: q10-statistical-tables-1
    term: statistical-tables
    level: 基本
    type: choice
    question: |
      標準正規分布で、両側合わせて 5% となる点（$P(|Z|>c)=0.05$ となる $c$）はどれか。
    choices:
      - '1.645'
      - '1.960'
      - '2.326'
      - '2.576'
    answer: 1
    hint: |
      両側 5% は、上側 2.5%。
    explanation: |
      $P(|Z|>c)=0.05$ なら $P(Z>c)=0.025$ なので、$c=z_{0.025}=1.960$ です。
      1.645 は上側 5%、2.326 は上側 1%、2.576 は上側 0.5% の点です。

  - id: q10-statistical-tables-2
    term: statistical-tables
    level: 標準
    type: numeric
    question: |
      標準正規分布表で $P(Z>1.2)=0.1151$ である。$P(|Z|>1.2)$ を求めよ。
    answer: 0.2302
    tolerance: 0.0001
    hint: |
      標準正規分布は 0 について左右対称。
    explanation: |
      $P(Z<-1.2)=P(Z>1.2)=0.1151$ なので、$P(|Z|>1.2)=2\times 0.1151=0.2302$ です。

  - id: q10-statistical-tables-3
    term: statistical-tables
    level: 標準
    type: numeric
    question: |
      F 分布表で $F_{0.05}(8,5)=4.818$ である。自由度 $(5, 8)$ の F 分布の下側 5% 点 $F_{0.95}(5,8)$ を小数第 3 位まで求めよ。
    answer: 0.208
    tolerance: 0.001
    hint: |
      $F_{1-\alpha}(m,n)=1/F_{\alpha}(n,m)$。自由度の順番に注意。
    explanation: |
      $$F_{0.95}(5,8)=\frac{1}{F_{0.05}(8,5)}=\frac{1}{4.818}\approx 0.208$$

  - id: q10-statistical-tables-4
    term: statistical-tables
    level: 標準
    type: choice
    question: |
      大きさ 10 の標本から、正規母集団の母分散の 95% 信頼区間を作る。分布表から読む値の組として正しいものはどれか。
    choices:
      - $\chi^2_{0.025}(9)$ と $\chi^2_{0.975}(9)$
      - $\chi^2_{0.05}(9)$ と $\chi^2_{0.95}(9)$
      - $\chi^2_{0.025}(10)$ と $\chi^2_{0.975}(10)$
      - $\chi^2_{0.025}(9)$ とその符号を変えた値
    answer: 0
    hint: |
      統計量 $(n-1)s^2/\sigma^2$ は自由度 $n-1$ のカイ二乗分布。両側 5%。
    explanation: |
      自由度は $10-1=9$、両側 5% なので上側 2.5% 点と上側 97.5% 点（下側 2.5% 点）を使います。
      カイ二乗分布は左右対称ではないので、符号を変えた値は使えません。

  # ---------- 中心極限定理（共通の用語・2級の問題） ----------
  - id: q10-central-limit-theorem-g1
    term: central-limit-theorem
    level: 標準
    type: numeric
    question: |
      母平均 50、母標準偏差 12 の母集団（分布の形はわからない）から大きさ 36 の標本を抽出する。中心極限定理を使い、標本平均が 54 を超える確率を近似せよ。ただし $P(Z>2)=0.0228$ とする。
    answer: 0.0228
    tolerance: 0.0001
    hint: |
      標本平均は近似的に平均 50、標準偏差 $12/\sqrt{36}$ の正規分布にしたがう。
    explanation: |
      標準偏差は $12/6=2$。$(54-50)/2=2$ なので、$P(\bar X>54)\approx P(Z>2)=0.0228$ です。
      ただし近似なので、母集団の分布が大きく歪んでいる（例えば指数分布）と、$n=36$ でも実際の確率は 0.03 程度になることがあります。歪みが強いほど、近似に必要な標本の大きさは大きくなります。

  - id: q10-central-limit-theorem-g2
    term: central-limit-theorem
    level: 基本
    type: choice
    question: |
      ある市の世帯の年間の電気代は、右に裾の長い分布をしている（平均 $\mu$、標準偏差 $\sigma$）。この市から無作為に選んだ 100 世帯の電気代の平均 $\bar X$ の分布について、最も適切なものはどれか。
    choices:
      - 近似的に、平均 $\mu$・標準偏差 $\sigma/10$ の正規分布にしたがう
      - 母集団と同じく右に裾の長い形で、標準偏差は $\sigma/10$ になる
      - 近似的に、平均 $\mu$・標準偏差 $\sigma$ の正規分布にしたがう
      - 母集団が正規分布でないので、$\bar X$ の分布について何もいえない
    answer: 0
    hint: |
      中心極限定理は、母集団の形によらず標本平均の分布について述べている。標本平均の標準偏差は $\sigma/\sqrt n$。
    explanation: |
      標本が大きければ、母集団が歪んでいても標本平均は近似的に正規分布にしたがいます（中心極限定理）。平均は $\mu$、標準偏差は $\sigma/\sqrt{100}=\sigma/10$ です。
      $n=1$ なら元の分布の形のままですが、$n$ が大きくなるにつれて歪みは小さくなります。標準偏差を $\sigma$ のままにするのは、標本平均ではなく 1 世帯分の値の散らばりと取り違えた誤りです。

  - id: q10-central-limit-theorem-g3
    term: central-limit-theorem
    level: 標準
    type: numeric
    question: |
      1 個の重さが平均 20 g・標準偏差 3 g の菓子がある（分布の形はわからない）。無作為に選んだ 100 個を 1 つの袋に詰めるとき、袋の中身の合計が 2045 g を超える確率を、中心極限定理を使って近似せよ。ただし $P(Z>1.5)=0.0668$ とする。
    answer: 0.0668
    tolerance: 0.0001
    hint: |
      合計は近似的に、平均 $100\times 20$、標準偏差 $\sqrt{100}\times 3$ の正規分布にしたがう。
    explanation: |
      合計の平均は 2000 g、分散は $100\times 3^2=900$ なので標準偏差は 30 g です。$(2045-2000)/30=1.5$ より、確率は $P(Z>1.5)=0.0668$ です。
      合計の標準偏差を $100\times 3=300$ とすると $z=0.15$ になり、確率を大きく見積もってしまいます。分散が $n$ 倍なので、標準偏差は $\sqrt n$ 倍です。

  # ---------- 二項分布・ポアソン分布の正規近似（共通の用語・2級の問題） ----------
  - id: q10-normal-approximation-binomial-poisson-g1
    term: normal-approximation-binomial-poisson
    level: 基本
    type: numeric
    question: |
      二項分布 $B(400,\ 0.2)$ を正規分布で近似する。近似に使う正規分布の標準偏差を求めよ。
    answer: 8
    tolerance: 0.001
    hint: |
      分散は $np(1-p)$。
    explanation: |
      分散 $400\times 0.2\times 0.8=64$ なので、標準偏差は 8 です（平均は 80）。

  - id: q10-normal-approximation-binomial-poisson-g2
    term: normal-approximation-binomial-poisson
    level: 標準
    type: numeric
    question: |
      不良率 0.1 の工程から製品を 900 個無作為に取り出す。不良品が 75 個以下である確率を、連続修正を行った正規近似で求めよ。ただし $P(Z>1.61)=0.0537$ とする。
    answer: 0.0537
    tolerance: 0.0001
    hint: |
      平均 $900\times 0.1$、標準偏差 $\sqrt{900\times 0.1\times 0.9}$。「75 以下」は連続修正で 75.5 まで。
    explanation: |
      平均 90、標準偏差 $\sqrt{81}=9$ です。$(75.5-90)/9\approx -1.61$ なので、$P(X\le 75)\approx P(Z\le -1.61)=P(Z>1.61)=0.0537$ です。
      「以下」なので $+0.5$ の向きに修正します。74.5 で標準化すると「74 以下」の確率になってしまいます。

  - id: q10-normal-approximation-binomial-poisson-g3
    term: normal-approximation-binomial-poisson
    level: 基本
    type: choice
    question: |
      二項分布にしたがう $X$ について、$P(X=30)$（ちょうど 30 回）を連続修正を行った正規近似で求めるとき、正規分布のどの範囲の確率を使うか。
    choices:
      - 29.5 から 30.5 まで
      - 30 から 31 まで
      - 29 から 30 まで
      - 30 ちょうどの 1 点（確率は 0）
    answer: 0
    hint: |
      整数の値 $k$ を、$k-0.5$ から $k+0.5$ までの幅 1 の柱と考える。
    explanation: |
      $X=30$ を区間 $[29.5,\ 30.5]$ の柱と考え、正規分布のこの範囲の面積で近似します。
      連続型の正規分布では 1 点の確率は 0 なので、連続修正をしないと「ちょうど 30 回」の確率は求められません。

  # ---------- t分布（共通の用語・2級の問題） ----------
  - id: q10-t-distribution-g1
    term: t-distribution
    level: 基本
    type: truefalse
    question: |
      t 分布は自由度が大きくなるほど標準正規分布に近づき、自由度が小さいほど裾が重くなる。
    answer: true
    hint: |
      上側 2.5% 点は、自由度 5 で 2.571、自由度 30 で 2.042、自由度が無限大で 1.96。
    explanation: |
      正しい記述です。母分散を標本から推定する不確かさの分だけ裾が重くなり、標本が大きくなるとその影響が小さくなります。

  - id: q10-t-distribution-g2
    term: t-distribution
    level: 基本
    type: choice
    question: |
      次の値のうち、最も大きいものはどれか。ただし $t_{0.025}(\nu)$ は自由度 $\nu$ の t 分布の上側 2.5% 点、$z_{0.025}$ は標準正規分布の上側 2.5% 点である。
    choices:
      - $t_{0.025}(5)$
      - $t_{0.025}(20)$
      - $t_{0.025}(60)$
      - $z_{0.025}$
    answer: 0
    hint: |
      自由度が小さいほど裾が重く、同じ上側確率の点は 0 から遠くなる。
    explanation: |
      $t_{0.025}(5)=2.571$、$t_{0.025}(20)=2.086$、$t_{0.025}(60)=2.000$、$z_{0.025}=1.960$ で、自由度が小さいほど大きくなります。
      標本が小さいと、同じ信頼係数でも信頼区間は広くなります。

  - id: q10-t-distribution-g3
    term: t-distribution
    level: 標準
    type: numeric
    question: |
      正規母集団から大きさ 25 の標本をとったところ、不偏分散の平方根は 10 だった。母平均の 95% 信頼区間の幅の半分（推定値 ± の部分）を、小数第 2 位まで求めよ。ただし $t_{0.025}(24)=2.064$ とする。
    answer: 4.13
    tolerance: 0.005
    hint: |
      幅の半分は $t_{0.025}(n-1)\times s/\sqrt n$。
    explanation: |
      標準誤差は $10/\sqrt{25}=2$ なので、幅の半分は $2.064\times 2=4.128\approx 4.13$ です。
      1.96 を使うと 3.92 になり、母分散が未知のときの区間を狭く見積もってしまいます。

  # ---------- カイ二乗分布（共通の用語・2級の問題） ----------
  - id: q10-chi-squared-distribution-g1
    term: chi-squared-distribution
    level: 基本
    type: numeric
    question: |
      自由度 6 のカイ二乗分布の分散を求めよ。
    answer: 12
    tolerance: 0.001
    hint: |
      自由度 $k$ のカイ二乗分布の期待値は $k$、分散は $2k$。
    explanation: |
      分散は $2\times 6=12$ です（期待値は 6）。

  - id: q10-chi-squared-distribution-g2
    term: chi-squared-distribution
    level: 基本
    type: truefalse
    question: |
      カイ二乗分布は 0 について左右対称なので、下側 2.5% 点は上側 2.5% 点に − を付けた値になる。
    answer: false
    hint: |
      カイ二乗分布は 2 乗の和の分布で、0 以上の値だけをとる。
    explanation: |
      誤りです。カイ二乗分布は 0 以上の値だけをとる右に裾の長い分布で、左右対称ではありません。例えば自由度 9 では、上側 2.5% 点は 19.02、下側 2.5% 点（上側 97.5% 点）は 2.700 で、表から別々に読みます。
      0 について左右対称なのは、標準正規分布や t 分布です。

  - id: q10-chi-squared-distribution-g3
    term: chi-squared-distribution
    level: 標準
    type: numeric
    question: |
      正規母集団（母分散 $\sigma^2$）から大きさ 16 の標本をとり、不偏分散を $S^2$ とする。$P(S^2>c\,\sigma^2)=0.05$ となる $c$ を小数第 2 位まで求めよ。ただし自由度 15 のカイ二乗分布の上側 5% 点を 25.00 とする。
    answer: 1.67
    tolerance: 0.005
    hint: |
      $15S^2/\sigma^2$ は自由度 15 のカイ二乗分布にしたがう。
    explanation: |
      $P(15S^2/\sigma^2>25.00)=0.05$ なので、$S^2>\dfrac{25.00}{15}\sigma^2\approx 1.67\sigma^2$ となる確率が 0.05 です。
      自由度 16 で割ったり、$n-1$ を掛け忘れたりしないようにします。

  # ---------- F分布（2級向けに書き直した用語） ----------
  - id: q10-f-distribution-g1
    term: f-distribution
    level: 標準
    type: numeric
    question: |
      $F_{0.05}(10,\ 5)=4.735$ である。自由度 $(5,\ 10)$ の F 分布の下側 5% 点 $F_{0.95}(5,\ 10)$ を小数第 3 位まで求めよ。
    answer: 0.211
    tolerance: 0.0005
    hint: |
      $F_{1-\alpha}(m,\ n)=1/F_\alpha(n,\ m)$。自由度を入れ替える。
    explanation: |
      $F_{0.95}(5,\ 10)=1/F_{0.05}(10,\ 5)=1/4.735\approx 0.211$ です。
      自由度を入れ替えずに $1/F_{0.05}(5,\ 10)$ としないように注意します。

  - id: q10-f-distribution-g2
    term: f-distribution
    level: 基本
    type: choice
    question: |
      母分散の等しい 2 つの正規母集団から、大きさ 8 と 13 の標本をとった。不偏分散の比（大きさ 8 の標本の不偏分散 ÷ 大きさ 13 の標本の不偏分散）がしたがう分布はどれか。
    choices:
      - 自由度 (7, 12) の F 分布
      - 自由度 (8, 13) の F 分布
      - 自由度 (12, 7) の F 分布
      - 自由度 19 の t 分布
    answer: 0
    hint: |
      自由度はそれぞれの標本の大きさ − 1 で、分子の自由度が先。
    explanation: |
      分子は大きさ 8 の標本なので自由度 7、分母は大きさ 13 の標本なので自由度 12 で、$F(7,\ 12)$ にしたがいます。
      分子と分母を逆にすると $F(12,\ 7)$ になります。どちらを分子にしたかと自由度の順番を合わせます。

  - id: q10-f-distribution-g3
    term: f-distribution
    level: 標準
    type: truefalse
    question: |
      自由度 10 の t 分布にしたがう $T$ の 2 乗 $T^2$ は自由度 (1, 10) の F 分布にしたがうので、$F_{0.05}(1,\ 10)$ は $t_{0.025}(10)=2.228$ の 2 乗に等しい。
    answer: true
    hint: |
      $P(T^2>c)=P(|T|>\sqrt c)$ で、$|T|>2.228$ となる確率は両側で 5%。
    explanation: |
      正しい記述です。$P(T^2>2.228^2)=P(|T|>2.228)=0.05$ なので、$F_{0.05}(1,\ 10)=2.228^2\approx 4.96$ です。
      F の上側 5% 点は t の「上側 2.5% 点」の 2 乗で、上側 5% 点の 2 乗ではありません。単回帰の傾きの t 検定と回帰の F 検定が同じ結論になるのはこのためです。
