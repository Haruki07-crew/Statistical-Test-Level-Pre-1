chapter: 1
questions:
  # ---------- 質的変数と量的変数 (A) ----------
  - id: q01-data-types-1
    term: data-types
    level: 基本
    type: choice
    question: |
      次のうち、量的変数で、しかも連続変数として扱うのが適切なものはどれか。
    choices:
      - 郵便番号
      - 1 日の来店客数
      - 通学にかかる時間（分）
      - 好きな季節
    answer: 2
    hint: |
      値の意味（数量か区分か）と、とびとびか連続かの 2 段階で判断する。
    explanation: |
      通学時間は測った量で、ある範囲の任意の値をとりうるので連続変数です。
      郵便番号は数字で書かれていても地域を区別する記号なので質的変数（名義）、好きな季節も質的変数です。
      来店客数は量的変数ですが、数えた値なので離散変数です。

  - id: q01-data-types-2
    term: data-types
    level: 基本
    type: truefalse
    question: |
      授業の満足度を「1：不満」〜「5：満足」の 5 段階の数字で記録した変数は、数字で記録されているので量的変数である。
    answer: false
    hint: |
      数字の差（1 と 2、4 と 5）が同じ大きさを表しているといえるか考える。
    explanation: |
      5 段階の満足度は区分に順序がある質的変数（順序尺度）です。
      数字で記録しても、1 と 2 の差と 4 と 5 の差が同じ大きさとは限らないので、量的変数とはいえません。
      中央値や「4 以上の割合」で要約するのが安全です。

  - id: q01-data-types-3
    term: data-types
    level: 標準
    type: choice
    question: |
      60 人に通学手段をたずねたところ、徒歩 12 人、自転車 25 人、バス 8 人、電車 15 人だった。
      この変数の代表値として意味があるものはどれか。
    choices:
      - 平均値
      - 中央値
      - 最頻値
      - 標準偏差
    answer: 2
    hint: |
      通学手段は区分に順序もない質的変数（名義）である。
    explanation: |
      名義の質的変数で意味がある代表値は最頻値（ここでは自転車）だけです。
      平均値・標準偏差は量的変数、中央値は少なくとも順序のある変数でないと計算できません。
      「1＝徒歩、2＝自転車…」と番号を付けて平均しても意味はありません。

  # ---------- 尺度水準 (B) ----------
  - id: q01-scales-of-measurement-1
    term: scales-of-measurement
    level: 基本
    type: choice
    question: |
      摂氏（℃）で測った気温は、次のどの尺度にあたるか。
    choices:
      - 名義尺度
      - 順序尺度
      - 間隔尺度
      - 比例尺度
    answer: 2
    hint: |
      0℃ が「温度がない」ことを表すかどうかを考える。
    explanation: |
      摂氏の気温は差（何度違うか）には意味がありますが、0℃ は水の凍る温度として決めた点で「温度がない」わけではないので、比（何倍か）には意味がありません。
      したがって間隔尺度です。身長や金額のように 0 が本当の 0 で比が意味を持つものが比例尺度です。

  - id: q01-scales-of-measurement-2
    term: scales-of-measurement
    level: 標準
    type: truefalse
    question: |
      マラソンの順位（1 位、2 位、3 位、…）は、隣り合う順位の差がどれも 1 なので間隔尺度である。
    answer: false
    hint: |
      1 位と 2 位のタイムの差と、2 位と 3 位のタイムの差は等しいか。
    explanation: |
      順位は大小の順序だけを表す順序尺度です。
      1 位と 2 位の差が 1 秒、2 位と 3 位の差が 5 分ということもあり、順位の「差 1」は同じ大きさの違いを表しません。

  # ---------- 棒グラフ・円グラフ・帯グラフ (B) ----------
  - id: q01-bar-pie-band-chart-1
    term: bar-pie-band-chart
    level: 基本
    type: numeric
    question: |
      ある調査で「とても満足」と答えた人の割合は 15% だった。
      この結果を円グラフにしたとき、「とても満足」の扇形の中心角は何度か。
    answer: 54
    tolerance: 0.5
    hint: |
      円全体の 360° が 100% にあたる。
    explanation: |
      中心角は 相対度数 × 360° なので
      $$0.15\times 360^\circ = 54^\circ$$

  - id: q01-bar-pie-band-chart-2
    term: bar-pie-band-chart
    level: 標準
    type: choice
    question: |
      ある高校の 1 年生（200 人）と 2 年生（150 人）について、運動部に所属する生徒の割合を帯グラフで比べたところ、1 年生は 40%、2 年生は 50% だった。
      運動部に所属する生徒の「人数」について正しいものはどれか。
    choices:
      - 1 年生のほうが多い
      - 2 年生のほうが多い
      - 両学年で等しい
      - 割合が高い 2 年生のほうが必ず多い
    answer: 0
    hint: |
      人数 ＝ 割合 × 全体の人数。
    explanation: |
      1 年生は $200\times 0.40=80$ 人、2 年生は $150\times 0.50=75$ 人なので、1 年生のほうが多いです。
      帯グラフは割合を表すので、全体の人数が違うと、割合の大小と人数の大小が逆になることがあります。

  - id: q01-bar-pie-band-chart-3
    term: bar-pie-band-chart
    level: 基本
    type: choice
    question: |
      ある市の月ごとの観光客数を 3 年分示し、季節による変化と年ごとの増減を読み取りやすくしたい。最も適したグラフはどれか。
    choices:
      - 折れ線グラフ
      - 円グラフ
      - 帯グラフ
      - パレート図
    answer: 0
    hint: |
      時間の順に並んだ値の変化を表すグラフはどれか。
    explanation: |
      時間による変化は、時点の順に値を線で結ぶ折れ線グラフが適しています。
      円グラフ・帯グラフは構成比を、パレート図は原因などを多い順に並べて主なものを見つけるのに使います。

  # ---------- 度数分布表とヒストグラム (A) ----------
  - id: q01-frequency-distribution-histogram-1
    term: frequency-distribution-histogram
    level: 標準
    type: numeric
    question: |
      次の度数分布表から、平均の近似値を求めよ（階級値を使う）。小数第 1 位まで答えよ。

      | 階級 | 0 以上 20 未満 | 20〜40 | 40〜60 |
      |---|---|---|---|
      | 度数 | 5 | 12 | 8 |
    answer: 32.4
    tolerance: 0.05
    hint: |
      階級値は 10、30、50。度数で重み付けして平均する。
    explanation: |
      $$\bar x \approx \frac{10\times 5 + 30\times 12 + 50\times 8}{25} = \frac{50+360+400}{25} = \frac{810}{25} = 32.4$$
      各階級のデータがすべて階級値にあるとみなした近似値です。

  - id: q01-frequency-distribution-histogram-2
    term: frequency-distribution-histogram
    level: 基本
    type: choice
    question: |
      階級の幅が等しくない度数分布表をヒストグラムにするとき、各階級の柱の高さに使うものはどれか。
    choices:
      - 度数
      - 度数 ÷ 階級の幅
      - 累積度数
      - 相対度数 × 階級の幅
    answer: 1
    hint: |
      ヒストグラムでは柱の「面積」が度数に比例する。
    explanation: |
      柱の面積（高さ × 幅）を度数に比例させるため、高さは 度数 ÷ 幅（度数密度）にします。
      度数をそのまま高さにすると、幅の広い階級の柱が実際より大きく見えてしまいます。

  - id: q01-frequency-distribution-histogram-3
    term: frequency-distribution-histogram
    level: 基本
    type: truefalse
    question: |
      度数分布表から階級値を使って計算した平均は、元のデータの平均と必ず一致する。
    answer: false
    hint: |
      階級の中のデータが、すべて階級値にあるとは限らない。
    explanation: |
      度数分布表ではデータの個々の値が失われるので、各データを階級値で代用した近似値になります。
      元のデータの平均とは一般に少しずれます。

  # ---------- 累積度数と累積相対度数 (A) ----------
  - id: q01-cumulative-frequency-1
    term: cumulative-frequency
    level: 基本
    type: numeric
    question: |
      25 人の待ち時間（分）を、0〜10、10〜20、20〜30、30〜40 の階級に分けたところ、度数はそれぞれ 3、7、10、5 だった。
      待ち時間が 30 分未満の人の割合（累積相対度数）を求めよ。
    answer: 0.8
    tolerance: 0.001
    hint: |
      30 分未満は、最初の 3 つの階級の度数の合計。
    explanation: |
      30 分未満は $3+7+10=20$ 人なので、累積相対度数は $20/25=0.8$ です。
      30 分以上の人の割合は $1-0.8=0.2$ になります。

  - id: q01-cumulative-frequency-2
    term: cumulative-frequency
    level: 標準
    type: choice
    question: |
      前問と同じ 25 人の待ち時間（0〜10 分が 3 人、10〜20 分が 7 人、20〜30 分が 10 人、30〜40 分が 5 人）について、中央値が含まれる階級はどれか。
    choices:
      - 0〜10 分
      - 10〜20 分
      - 20〜30 分
      - 30〜40 分
    answer: 2
    hint: |
      25 人の中央値は小さいほうから 13 番目の値。累積度数を順に見る。
    explanation: |
      累積度数は 3、10、20、25 です。13 番目の値は、累積度数が 10 を超えて 20 に達する 20〜30 分の階級に入ります。
      10〜20 分を選ぶのは、度数 7 の階級までで半分に達したと誤って数えた場合です。

  - id: q01-cumulative-frequency-3
    term: cumulative-frequency
    level: 基本
    type: truefalse
    question: |
      累積相対度数グラフ（折れ線）では、各階級の階級値の位置に累積相対度数の点を打つ。
    answer: false
    hint: |
      累積相対度数は「どの値より小さいデータの割合」か。
    explanation: |
      累積相対度数は「その階級の上端の値より小さいデータの割合」なので、点は各階級の上端に打ちます。
      階級値（真ん中）に打つと、グラフから読む中央値などがずれます。

  # ---------- 幹葉図 (B) ----------
  - id: q01-stem-and-leaf-plot-1
    term: stem-and-leaf-plot
    level: 基本
    type: numeric
    question: |
      次の幹葉図（単位：3｜2 は 32）で表されたデータの中央値を求めよ。

      | 幹 | 葉 |
      |---|---|
      | 3 | 2 5 |
      | 4 | 1 4 4 8 |
      | 5 | 0 3 6 |
      | 6 | 2 |
    answer: 46
    tolerance: 0.01
    hint: |
      データは 10 個。5 番目と 6 番目の値の平均。
    explanation: |
      データを小さい順に書くと 32, 35, 41, 44, 44, 48, 50, 53, 56, 62 の 10 個です。
      中央値は 5 番目（44）と 6 番目（48）の平均で $(44+48)/2=46$ です。

  - id: q01-stem-and-leaf-plot-2
    term: stem-and-leaf-plot
    level: 標準
    type: choice
    question: |
      前問の幹葉図のデータ（32, 35, 41, 44, 44, 48, 50, 53, 56, 62）について、第 3 四分位数を「中央値より上の半分のデータの中央値」として求めると、いくらか。
    choices:
      - '50'
      - '53'
      - '54.5'
      - '56'
    answer: 1
    hint: |
      データは 10 個なので、上の半分は 6〜10 番目の 5 個。
    explanation: |
      上の半分は 48, 50, 53, 56, 62 の 5 個で、その中央値は 53 です。
      54.5 は上の 4 個（50, 53, 56, 62）の中央値で、半分の分け方を誤った値です。

  # ---------- 分布の形 (A) ----------
  - id: q01-distribution-shape-1
    term: distribution-shape
    level: 基本
    type: choice
    question: |
      所得の分布のように、右に裾が長い単峰の分布で典型的に成り立つ代表値の大小関係はどれか。
    choices:
      - 平均値 ＜ 中央値 ＜ 最頻値
      - 最頻値 ＜ 中央値 ＜ 平均値
      - 中央値 ＜ 平均値 ＜ 最頻値
      - 3 つはつねに等しい
    answer: 1
    hint: |
      裾の側にある大きな値に、最も引っ張られる代表値はどれか。
    explanation: |
      平均値は大きな値に引っ張られて裾の側（右）へずれ、最頻値は山の位置（左寄り）にとどまります。中央値はその間です。
      したがって 最頻値 ＜ 中央値 ＜ 平均値 となるのが典型です。左に裾が長いときは逆になります。

  - id: q01-distribution-shape-2
    term: distribution-shape
    level: 標準
    type: truefalse
    question: |
      子どもと大人が混ざった集団の年齢の分布のような二峰性の分布では、平均値が 2 つの山の間の、ほとんどデータのない値になることがある。
    answer: true
    hint: |
      10 歳前後と 40 歳前後に山がある分布の平均を考える。
    explanation: |
      2 つの山の重心が平均値なので、山と山の間（例えば 25 歳前後）の、該当者の少ない値になることがあります。
      このような分布は層（子ども・大人）に分けて要約するのが適切です。

  - id: q01-distribution-shape-3
    term: distribution-shape
    level: 標準
    type: choice
    question: |
      とても易しい試験で、多くの受験者が満点近くを取り、一部の受験者だけが低い点だった。この点数の分布について最も適切なものはどれか。
    choices:
      - 左に裾が長く、平均値は中央値より小さくなりやすい
      - 右に裾が長く、平均値は中央値より大きくなりやすい
      - 左右対称で、平均値と中央値は等しい
      - 一様分布で、最頻値は存在しない
    answer: 0
    hint: |
      データの多い山は高得点側、少数の低い点が裾をつくる。
    explanation: |
      山が右（高得点側）にあり、低い点の側（左）に長い裾ができるので、左に裾が長い分布です。
      平均値は低い点に引っ張られて、中央値より小さくなりやすくなります。

  # ---------- 公的統計とデータの出所 (C) ----------
  - id: q01-official-statistics-1
    term: official-statistics
    level: 基本
    type: truefalse
    question: |
      国勢調査は、日本に住む人の中から無作為に選んだ一部の世帯を調べる標本調査である。
    answer: false
    hint: |
      国勢調査の対象は誰か。
    explanation: |
      国勢調査は、日本に住むすべての人と世帯を対象とする全数調査です（5 年ごと）。
      労働力調査や家計調査などは標本調査です。

  - id: q01-official-statistics-2
    term: official-statistics
    level: 標準
    type: choice
    question: |
      次のうち、利用する人にとって「二次データ」にあたるものはどれか。
    choices:
      - 自分が設計して実施したアンケートの回答
      - 政府統計の総合窓口（e-Stat）で公開されている統計表を、自分の分析に使う場合
      - 自分の実験で測定した値
      - 自分の店で記録した毎日の売上
    answer: 1
    hint: |
      自分の目的のために自分で集めたデータかどうか。
    explanation: |
      他の機関が別の目的で集めたデータを利用するものが二次データです。公的統計を分析に使う場合がその例です。
      二次データを使うときは、対象・定義・時点など、集め方を確認する必要があります。
