chapter: 8
questions:
  # ---------- 期待値と分散の性質（共通の用語・2級の問題） ----------
  - id: q08-expectation-variance-properties-g1
    term: expectation-variance-properties
    level: 基本
    type: numeric
    question: |
      確率変数 $X$ の期待値は 3、分散は 2 である。$E[X^2]$ を求めよ。
    answer: 11
    tolerance: 0.001
    hint: |
      $V[X]=E[X^2]-(E[X])^2$ を変形する。
    explanation: |
      $E[X^2]=V[X]+(E[X])^2=2+9=11$ です。

  - id: q08-expectation-variance-properties-g2
    term: expectation-variance-properties
    level: 標準
    type: choice
    question: |
      独立な確率変数 $X$、$Y$ の分散がそれぞれ 2 と 3 のとき、$V[X-2Y]$ はどれか。
    choices:
      - '14'
      - '−4'
      - '8'
      - '5'
    answer: 0
    hint: |
      係数は 2 乗して掛け、独立なら差でも分散は足し算。
    explanation: |
      $V[X-2Y]=1^2\times 2+(-2)^2\times 3=2+12=14$ です。
      分散を引き算すると −4 のように負になりえますが、分散は負になりません。8 は係数 2 を 2 乗しなかった値（$2+2\times 3$）、5 は係数を無視して分散を足した値です。

  - id: q08-expectation-variance-properties-g3
    term: expectation-variance-properties
    level: 標準
    type: numeric
    question: |
      作業 A の所要時間は平均 20 分・標準偏差 3 分、作業 B は平均 15 分・標準偏差 4 分で、互いに独立である。A と B を続けて行うときの合計時間の標準偏差（分）を求めよ。
    answer: 5
    tolerance: 0.001
    hint: |
      独立なら分散が足し算になる。標準偏差は分散の平方根。
    explanation: |
      分散は $3^2+4^2=25$ なので、標準偏差は $\sqrt{25}=5$ 分です（平均は 35 分）。
      標準偏差を足して 7 分とするのは誤りです。

  # ---------- 確率関数と確率密度関数（2級向けに書き直した用語） ----------
  - id: q08-probability-mass-and-density-function-g1
    term: probability-mass-and-density-function
    level: 基本
    type: numeric
    question: |
      確率変数 $X$ は 0, 1, 2, 3 の値をとり、$P(X=0)=0.1$、$P(X=1)=0.4$、$P(X=3)=0.2$ である。$P(X\ge 2)$ を求めよ。
    answer: 0.5
    tolerance: 0.0001
    hint: |
      確率の合計は 1。まず $P(X=2)$ を求める。
    explanation: |
      $P(X=2)=1-0.1-0.4-0.2=0.3$ なので、$P(X\ge 2)=0.3+0.2=0.5$ です。
      離散型では「2 以上」に 2 を含めるかどうかで値が変わるので、等号に注意します。

  - id: q08-probability-mass-and-density-function-g2
    term: probability-mass-and-density-function
    level: 基本
    type: choice
    question: |
      連続型の確率変数 $X$ の確率密度関数 $f(x)$ について、正しい記述はどれか。
    choices:
      - $P(a\le X\le b)$ は、$a$ から $b$ までの $f(x)$ の下の面積である
      - $f(a)$ は $X=a$ となる確率である
      - $f(x)$ の値は必ず 1 以下である
      - $P(a\le X\le b)$ は $P(a<X<b)$ より大きい
    answer: 0
    hint: |
      連続型では確率は面積で表す。1 点の確率は 0。
    explanation: |
      連続型の確率は密度の曲線の下の面積です。1 点の確率は 0 なので、等号の有無で確率は変わらず、$f(a)$ も確率ではありません。
      面積が 1 であればよいので、狭い範囲に集中した分布では $f(x)$ が 1 を超えることもあります（例：$0\le x\le 1$ で $f(x)=3x^2$ なら $f(1)=3$）。

  - id: q08-probability-mass-and-density-function-g3
    term: probability-mass-and-density-function
    level: 標準
    type: numeric
    question: |
      確率変数 $X$ の確率密度関数が $f(x)=3x^2\ (0\le x\le 1)$、それ以外では 0 である。$P(X>0.5)$ を求めよ。
    answer: 0.875
    tolerance: 0.0001
    hint: |
      $P(X\le 0.5)=\int_0^{0.5}3x^2\,dx=0.5^3$。
    explanation: |
      $P(X\le 0.5)=0.5^3=0.125$ なので、$P(X>0.5)=1-0.125=0.875$ です。
      区間の長さの割合（0.5）とするのは、一様分布と取り違えた誤りです。大きい値ほど密度が高いので、0.5 より上の確率は半分よりずっと大きくなります。

  # ---------- 確率変数の和と再生性（2級向けに書き直した用語） ----------
  - id: q08-sum-of-random-variables-g1
    term: sum-of-random-variables
    level: 標準
    type: numeric
    question: |
      $X$ は二項分布 $B(20,\ 0.4)$、$Y$ は $B(30,\ 0.4)$ にしたがい、互いに独立である。$X+Y$ の分散を求めよ。
    answer: 12
    tolerance: 0.001
    hint: |
      成功の確率が同じ独立な二項分布の和は $B(20+30,\ 0.4)$。
    explanation: |
      $X+Y\sim B(50,\ 0.4)$ なので、分散は $50\times 0.4\times 0.6=12$ です。$V[X]+V[Y]=4.8+7.2=12$ と足しても同じです。

  - id: q08-sum-of-random-variables-g2
    term: sum-of-random-variables
    level: 基本
    type: choice
    question: |
      独立な 2 つの確率変数の和について、正しい記述はどれか。
    choices:
      - 平均 2 と平均 3 のポアソン分布の和は、平均 5 のポアソン分布にしたがう
      - 0 から 1 の一様分布 2 つの和は、0 から 2 の一様分布にしたがう
      - $B(10,\ 0.3)$ と $B(10,\ 0.5)$ の和は、$B(20,\ 0.4)$ にしたがう
      - 正規分布の和は、正規分布にはならない
    answer: 0
    hint: |
      再生性がある分布と、その条件を考える。
    explanation: |
      ポアソン分布には再生性があり、和は平均を足したポアソン分布になります。
      一様分布の和は三角形の分布になり、一様分布ではありません。二項分布の和が二項分布になるのは成功の確率が同じときだけです。正規分布の和は正規分布です。

  # ---------- 累積分布関数（2級向けに書き直した用語） ----------
  - id: q08-cumulative-distribution-function-g1
    term: cumulative-distribution-function
    level: 基本
    type: numeric
    question: |
      1, 2, 3, 4 の値をとる確率変数 $X$ の累積分布関数が、$F(1)=0.1$、$F(2)=0.35$、$F(3)=0.8$、$F(4)=1$ である。$P(X=3)$ を求めよ。
    answer: 0.45
    tolerance: 0.0001
    hint: |
      $P(X=3)=P(X\le 3)-P(X\le 2)$。
    explanation: |
      $P(X=3)=F(3)-F(2)=0.8-0.35=0.45$ です。累積分布関数の段の高さが、その値の確率です。

  # ---------- 同時確率関数（2級向けに書き直した用語） ----------
  - id: q08-joint-probability-function-g1
    term: joint-probability-function
    level: 基本
    type: numeric
    question: |
      確率変数 $X$（0・1・2）と $Y$（0・1）の同時確率が、$p(0,0)=0.10$、$p(0,1)=0.20$、$p(1,0)=0.15$、$p(1,1)=0.25$、$p(2,0)=0.05$、$p(2,1)=0.25$ である。$P(Y=1\mid X=1)$ を求めよ。
    answer: 0.625
    tolerance: 0.0001
    hint: |
      まず周辺確率 $P(X=1)=p(1,0)+p(1,1)$ を求める。
    explanation: |
      $P(X=1)=0.15+0.25=0.40$ なので、$P(Y=1\mid X=1)=0.25/0.40=0.625$ です。$P(Y=1)=0.70$ と違うので、$X$ と $Y$ は独立ではありません。

  # ---------- 周辺分布（2級向けに書き直した用語） ----------
  - id: q08-marginal-distribution-g1
    term: marginal-distribution
    level: 基本
    type: numeric
    question: |
      確率変数 $X$（0・1・2）と $Y$（0・1）の同時確率が、$p(0,0)=0.15$、$p(0,1)=0.10$、$p(1,0)=0.25$、$p(1,1)=0.20$、$p(2,0)=0.10$、$p(2,1)=0.20$ である。$P(Y=1)$ を求めよ。
    answer: 0.5
    tolerance: 0.0001
    hint: |
      $Y=1$ の列の同時確率を足す。
    explanation: |
      $P(Y=1)=0.10+0.20+0.20=0.50$ です。周辺確率は、もう一方の変数のすべての値について同時確率を足して求めます。

