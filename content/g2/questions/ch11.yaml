chapter: 11
questions:
  # ---------- 信頼区間（共通の用語・2級の問題） ----------
  - id: q11-confidence-interval-g1
    term: confidence-interval
    level: 基本
    type: truefalse
    question: |
      ある標本から母平均の 95% 信頼区間 (48, 52) が得られた。このとき「母平均がこの区間 (48, 52) に入る確率は 95% である」と言ってよい。
    answer: false
    hint: |
      母平均は決まった値で、確率的に変わるのは区間のほう。
    explanation: |
      95% は「同じ方法で区間を何度も作ると、約 95% の区間が母平均を含む」という方法の性質です。得られた 1 つの区間は、母平均を含むか含まないかのどちらかです。

  # ---------- 母平均の区間推定（分散未知）（共通の用語・2級の問題） ----------
  - id: q11-ci-mean-unknown-variance-g1
    term: ci-mean-unknown-variance
    level: 標準
    type: numeric
    question: |
      正規母集団から大きさ 16 の標本を抽出したところ、標本平均 20、標本標準偏差（不偏分散の平方根）4 だった。母平均の 95% 信頼区間の上限を小数第 2 位まで求めよ。ただし $t_{0.025}(15)=2.131$ とする。
    answer: 22.13
    tolerance: 0.01
    hint: |
      標準誤差は $4/\sqrt{16}$。
    explanation: |
      $20+2.131\times 4/4=20+2.131=22.131\approx 22.13$ です。下限は 17.87。

  # ---------- 母比率の区間推定（共通の用語・2級の問題） ----------
  - id: q11-ci-proportion-g1
    term: ci-proportion
    level: 標準
    type: numeric
    question: |
      無作為に選んだ 400 人のうち 200 人が賛成だった。母比率の 95% 信頼区間の幅の半分（標本比率 ± の値）を小数第 3 位まで求めよ。
    answer: 0.049
    tolerance: 0.0005
    hint: |
      $1.96\sqrt{\hat p(1-\hat p)/n}$。
    explanation: |
      $\hat p=0.5$、$\sqrt{0.25/400}=0.025$、$1.96\times 0.025=0.049$ です。区間はおよそ (0.451, 0.549)。

  # ---------- 標準誤差（共通の用語・2級の問題） ----------
  - id: q11-standard-error-g1
    term: standard-error
    level: 基本
    type: numeric
    question: |
      大きさ 25 の標本の標本標準偏差（不偏分散の平方根）が 10 だった。標本平均の標準誤差を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      $s/\sqrt n$。
    explanation: |
      $10/\sqrt{25}=2$ です。

  # ---------- 点推定と推定量（2級向けに書き直した用語） ----------
  - id: q11-point-estimation-g1
    term: point-estimation
    level: 基本
    type: numeric
    question: |
      母集団から無作為にとった 5 個のデータは 3, 5, 7, 9, 11 だった。母分散の不偏推定値（不偏分散）を求めよ。
    answer: 10
    tolerance: 0.001
    hint: |
      偏差平方和を $n-1$ で割る。
    explanation: |
      平均は 7、偏差は −4, −2, 0, 2, 4、偏差平方和は $16+4+0+4+16=40$ なので、不偏分散は $40/4=10$ です。
      $n=5$ で割った 8 は、母分散を平均的に小さめに推定する値です。

  - id: q11-point-estimation-g2
    term: point-estimation
    level: 基本
    type: choice
    question: |
      推定量と推定値について、正しい記述はどれか。
    choices:
      - 推定量は標本によって値が変わる確率変数で、推定値は実際のデータから計算した 1 つの数値である
      - 推定量と推定値はどちらも、母数そのものを表す
      - 推定値は、標本を取り直しても必ず同じ値になる
      - 推定量は、標本の大きさによらず一定の値をとる
    answer: 0
    hint: |
      $\bar X$（式）と $\bar x=12$（数値）の違い。
    explanation: |
      推定量（例：標本平均 $\bar X$）は計算の規則で、標本によって値の変わる確率変数です。推定値（例：$\bar x=12$）は、手元のデータを入れて計算した数値です。
      推定量が確率変数なので、期待値（不偏性）や分散（精度）を考えることができます。

  # ---------- 不偏推定量（2級向けに書き直した用語） ----------
  - id: q11-unbiased-estimator-g1
    term: unbiased-estimator
    level: 標準
    type: numeric
    question: |
      母分散 9 の母集団から大きさ 10 の標本をとる。偏差平方和を $n=10$ で割った標本分散の期待値を求めよ。
    answer: 8.1
    tolerance: 0.001
    hint: |
      偏差平方和の期待値は $(n-1)\sigma^2$。
    explanation: |
      偏差平方和の期待値は $9\times 9=81$ なので、10 で割った標本分散の期待値は 8.1 です。母分散 9 より小さく、不偏ではありません。
      $n-1=9$ で割った不偏分散なら、期待値は 9 になります。

  - id: q11-unbiased-estimator-g2
    term: unbiased-estimator
    level: 標準
    type: choice
    question: |
      母平均 $\mu$・母分散 $\sigma^2$ の母集団から独立に $X_1,X_2,X_3$ をとる。$\bar X=(X_1+X_2+X_3)/3$ と $T=(X_1+X_2+2X_3)/4$ について正しい記述はどれか。
    choices:
      - どちらも不偏推定量で、分散は $\bar X$ のほうが小さい
      - どちらも不偏推定量で、分散は $T$ のほうが小さい
      - $\bar X$ は不偏推定量だが、$T$ は不偏推定量ではない
      - どちらも不偏推定量で、分散も等しい
    answer: 0
    hint: |
      $E[T]=(\mu+\mu+2\mu)/4$、$V[T]=(1+1+4)\sigma^2/16$。
    explanation: |
      $E[\bar X]=E[T]=\mu$ でどちらも不偏です。分散は $V[\bar X]=\sigma^2/3\approx 0.333\sigma^2$、$V[T]=6\sigma^2/16=0.375\sigma^2$ で、$\bar X$ のほうが小さく、良い推定量です。

  # ---------- 標準誤差（2級向けに書き直した用語） ----------
  - id: q11-standard-error-g2
    term: standard-error
    level: 基本
    type: numeric
    question: |
      無作為に選んだ 100 人のうち 20 人がある商品を使っていた。標本比率の標準誤差を求めよ。
    answer: 0.04
    tolerance: 0.0001
    hint: |
      $\sqrt{\hat p(1-\hat p)/n}$。
    explanation: |
      $\hat p=0.2$ なので、$\sqrt{0.2\times 0.8/100}=\sqrt{0.0016}=0.04$ です。
      平方根をとらない 0.0016 や、$n$ で割らない 0.4 と取り違えないようにします。

  # ---------- 信頼区間（2級向けに書き直した用語） ----------
  - id: q11-confidence-interval-g2
    term: confidence-interval
    level: 基本
    type: choice
    question: |
      母平均の信頼区間の幅について、正しい記述はどれか（ほかの条件は同じとする）。
    choices:
      - 標本の大きさを 4 倍にすると、幅は半分になる
      - 信頼係数を 95% から 99% に上げると、幅は狭くなる
      - 標本の大きさを 2 倍にすると、幅は半分になる
      - データの散らばりが大きいほど、幅は狭くなる
    answer: 0
    hint: |
      幅は $\sqrt n$ に反比例し、信頼係数の点と散らばりに比例する。
    explanation: |
      幅は $1/\sqrt n$ に比例するので、標本を 4 倍にすると半分になります。2 倍では $1/\sqrt 2\approx 0.71$ 倍です。
      信頼係数を上げると点が 1.96 から 2.576 になり、幅は広がります。散らばりが大きいほど幅も広がります。

  # ---------- 母平均の区間推定（分散既知）（2級向けに書き直した用語） ----------
  - id: q11-ci-mean-known-variance-g1
    term: ci-mean-known-variance
    level: 基本
    type: numeric
    question: |
      母標準偏差 15 の正規母集団から大きさ 25 の標本をとったところ、標本平均は 120 だった。母平均の 95% 信頼区間の上限を求めよ。
    answer: 125.88
    tolerance: 0.005
    hint: |
      $\bar x+1.96\,\sigma/\sqrt n$。
    explanation: |
      標準誤差は $15/5=3$ なので、上限は $120+1.96\times 3=125.88$ です（下限は 114.12）。

  - id: q11-ci-mean-known-variance-g2
    term: ci-mean-known-variance
    level: 標準
    type: numeric
    question: |
      母標準偏差 15 の母集団で、母平均の 95% 信頼区間の幅の半分を 3 以下にしたい。必要な標本の大きさの最小値を求めよ。
    answer: 97
    tolerance: 0.4
    hint: |
      $1.96\times 15/\sqrt n\le 3$ を $n$ について解き、切り上げる。
    explanation: |
      $n\ge(1.96\times 15/3)^2=9.8^2=96.04$ なので、最小の整数は 97 です。
      96 では $1.96\times 15/\sqrt{96}\approx 3.0006$ で、わずかに 3 を超えてしまいます。

  # ---------- 母平均の区間推定（分散未知）（2級向けに書き直した用語） ----------
  - id: q11-ci-mean-unknown-variance-g2
    term: ci-mean-unknown-variance
    level: 基本
    type: choice
    question: |
      正規母集団から大きさ 12 の標本をとり、母分散が未知のまま母平均の 95% 信頼区間を作る。「標本平均 ± 係数 × 標準誤差」の係数として正しいものはどれか。
    choices:
      - $t_{0.025}(11)=2.201$
      - $t_{0.025}(12)=2.179$
      - $t_{0.05}(11)=1.796$
      - $z_{0.025}=1.960$
    answer: 0
    hint: |
      自由度は $n-1$、95% の両側なので上側 2.5% 点。
    explanation: |
      自由度 $12-1=11$ の t 分布の上側 2.5% 点 2.201 を使います。
      2.179 は自由度を 12 とした点、1.796 は 90% 信頼区間で使う点、1.96 は母分散が既知のときの点です。

  # ---------- 母比率の区間推定（2級向けに書き直した用語） ----------
  - id: q11-ci-proportion-g2
    term: ci-proportion
    level: 標準
    type: numeric
    question: |
      母比率の見当がまったくつかない。95% 信頼区間の幅の半分（誤差の範囲）を 0.02 以下にするために必要な標本の大きさの最小値を求めよ。
    answer: 2401
    tolerance: 0.4
    hint: |
      見当がないときは $p(1-p)$ の最大値 0.25 を使う。$n\ge(1.96/0.02)^2\times 0.25$。
    explanation: |
      $n\ge(1.96/0.02)^2\times 0.25=98^2\times 0.25=2401$ なので、2401 人です。
      誤差の範囲を 0.04 にするなら、その 1/4 の約 600 人で足ります。誤差を半分にするには標本を 4 倍にする必要があります。

  # ---------- 信頼係数（2級向けに書き直した用語） ----------
  - id: q11-confidence-coefficient-g1
    term: confidence-coefficient
    level: 基本
    type: choice
    question: |
      母分散が既知の正規母集団で、母平均の 90% 信頼区間を「標本平均 ± 係数 × 標準誤差」で作る。係数として正しいものはどれか。
    choices:
      - '1.645'
      - '1.282'
      - '1.96'
      - '2.576'
    answer: 0
    hint: |
      両側で 10% なので、上側 5% 点。
    explanation: |
      90% 信頼区間では、左右に 5% ずつを除くので上側 5% 点 1.645 を使います。1.96 は 95%、2.576 は 99%、1.282 は上側 10% 点（80% 信頼区間）です。

  # ---------- 2標本の母平均の差の区間推定（2級向けに書き直した用語） ----------
  - id: q11-ci-two-sample-mean-difference-g1
    term: ci-two-sample-mean-difference
    level: 標準
    type: numeric
    question: |
      2 つの独立な大きな標本で、群 1（50 人）の平均は群 2（40 人）の平均より 5 大きく、標準偏差はそれぞれ 10 と 8 だった。母平均の差の 95% 信頼区間の上限を、正規近似で小数第 2 位まで求めよ。
    answer: 8.72
    tolerance: 0.005
    hint: |
      差の標準誤差は $\sqrt{10^2/50+8^2/40}$。
    explanation: |
      標準誤差は $\sqrt{2+1.6}=\sqrt{3.6}\approx 1.897$ なので、上限は $5+1.96\times 1.897\approx 8.72$ です（下限は 1.28）。区間が 0 を含まないので、差があるといえます。

  # ---------- 2標本の母比率の差の区間推定（2級向けに書き直した用語） ----------
  - id: q11-ci-two-sample-proportion-g1
    term: ci-two-sample-proportion
    level: 標準
    type: numeric
    question: |
      地域 A の 200 人のうち 50%、地域 B の 150 人のうち 40% がある政策に賛成した。母比率の差（A − B）の区間推定で使う標準誤差を小数第 3 位まで求めよ。
    answer: 0.053
    tolerance: 0.0005
    hint: |
      $\sqrt{\hat p_A(1-\hat p_A)/n_A+\hat p_B(1-\hat p_B)/n_B}$。
    explanation: |
      $\sqrt{0.25/200+0.24/150}=\sqrt{0.00125+0.0016}=\sqrt{0.00285}\approx 0.053$ です。95% 信頼区間は $0.10\pm 1.96\times 0.053=0.10\pm 0.105$ で、0 をわずかに含みます。

  # ---------- 母分散の区間推定（2級向けに書き直した用語） ----------
  - id: q11-ci-variance-g1
    term: ci-variance
    level: 標準
    type: numeric
    question: |
      正規母集団から大きさ 10 の標本をとったところ、不偏分散は 18 だった。母分散の 95% 信頼区間の下限を小数第 2 位まで求めよ。ただし $\chi^2_{0.025}(9)=19.02$、$\chi^2_{0.975}(9)=2.700$ とする。
    answer: 8.52
    tolerance: 0.005
    hint: |
      下限は $(n-1)s^2$ を大きいほうの点で割る。
    explanation: |
      $(n-1)s^2=9\times 18=162$ なので、下限は $162/19.02\approx 8.52$、上限は $162/2.700=60$ です。

  # ---------- 一致推定量（2級向けに書き直した用語） ----------
  - id: q11-consistent-estimator-g1
    term: consistent-estimator
    level: 標準
    type: choice
    question: |
      母平均 $\mu$ の母集団から大きさ $n$ の標本 $X_1,\dots,X_n$ をとる。不偏推定量だが一致推定量ではないものはどれか。
    choices:
      - 1 つ目の観測値 $X_1$
      - 標本平均 $\bar X$
      - $\bar X+1/n$
      - 標本の最初の半分の平均
    answer: 0
    hint: |
      標本を大きくしても、ぶれが小さくならないもの。
    explanation: |
      $X_1$ は期待値が $\mu$ で不偏ですが、標本をいくら大きくしても使うのは 1 個なので、ぶれ（分散 $\sigma^2$）が小さくならず、一致推定量ではありません。
      $\bar X$ と最初の半分の平均は不偏かつ一致、$\bar X+1/n$ は不偏ではないが一致です。

  # ---------- 必要な標本の大きさ（2級向けに書き直した用語） ----------
  - id: q11-required-sample-size-g1
    term: required-sample-size
    level: 標準
    type: numeric
    question: |
      母標準偏差が 10 とわかっている母集団で、母平均の 95% 信頼区間の幅の半分を 1.5 以下にしたい。必要な標本の大きさの最小値を求めよ。
    answer: 171
    tolerance: 0.4
    hint: |
      $n\ge(1.96\times 10/1.5)^2$ を計算し、切り上げる。
    explanation: |
      $(1.96\times 10/1.5)^2\approx 13.07^2\approx 170.7$ なので、171 個必要です。切り捨てて 170 にすると、幅の半分がわずかに 1.5 を超えます。

  # ---------- フィッシャーのz変換（2級向けに書き直した用語） ----------
  - id: q11-fisher-z-transformation-g1
    term: fisher-z-transformation
    level: 標準
    type: numeric
    question: |
      標本相関係数 $r=0.6$ を、フィッシャーの z 変換 $z=\dfrac12\log\dfrac{1+r}{1-r}$ で変換した値を小数第 3 位まで求めよ。ただし $\log 4=1.386$ とする。
    answer: 0.693
    tolerance: 0.0005
    hint: |
      $(1+0.6)/(1-0.6)=4$。
    explanation: |
      $\dfrac12\log\dfrac{1.6}{0.4}=\dfrac12\log 4=0.693$ です。大きさ $n$ の標本なら、この値は近似的に標準偏差 $1/\sqrt{n-3}$ の正規分布にしたがいます。

  # ---------- 母分散比の区間推定（2級向けに書き直した用語） ----------
  - id: q11-ci-variance-ratio-g1
    term: ci-variance-ratio
    level: 標準
    type: numeric
    question: |
      大きさ 8 と 10 の標本の不偏分散の比 $s_1^2/s_2^2$ は 3.0 だった。母分散の比 $\sigma_1^2/\sigma_2^2$ の 95% 信頼区間の下限を小数第 2 位まで求めよ。ただし $F_{0.025}(7,9)=4.197$ とする。
    answer: 0.71
    tolerance: 0.005
    hint: |
      下限は（不偏分散の比）÷ $F_{0.025}(n_1-1,\ n_2-1)$。
    explanation: |
      $3.0/4.197\approx 0.71$ です。上限は自由度を入れかえた $F_{0.025}(9,7)$ を掛けて求めます。

  # ---------- 有限母集団修正（2級向けに書き直した用語） ----------
  - id: q11-finite-population-correction-g1
    term: finite-population-correction
    level: 基本
    type: numeric
    question: |
      200 人の母集団から 50 人を戻さずに選ぶ。標本平均の標準誤差に掛ける有限母集団修正の係数 $\sqrt{(N-n)/(N-1)}$ を小数第 3 位まで求めよ。
    answer: 0.868
    tolerance: 0.0005
    hint: |
      $N=200$、$n=50$。
    explanation: |
      $\sqrt{150/199}\approx 0.868$ です。母集団の 4 分の 1 を調べるので、標準誤差は修正しない場合より約 13% 小さくなります。

  - id: q11-confidence-coefficient-g2
    term: confidence-coefficient
    level: 標準
    type: numeric
    question: |
      母分散が既知の正規母集団で、標本の大きさを変えずに信頼係数を 95% から 99% に上げる。母平均の信頼区間の幅は何倍になるか。小数第 2 位まで求めよ（係数は 1.96 と 2.576 を使う）。
    answer: 1.31
    tolerance: 0.005
    hint: |
      幅は係数に比例する。
    explanation: |
      $2.576/1.96\approx 1.31$ 倍です。信頼係数を上げると、母平均を含む確率は上がりますが、区間は広くなって情報としては粗くなります。幅を変えずに信頼係数を上げるには、標本を大きくする必要があります（同じ幅なら $1.31^2\approx 1.73$ 倍）。
  - id: q11-ci-two-sample-mean-difference-g2
    term: ci-two-sample-mean-difference
    level: 応用
    type: numeric
    question: |
      2 つの正規母集団の母分散は等しいと仮定する。大きさ 8 の標本の平均は 25、大きさ 10 の標本の平均は 21、プールした分散は 9 だった。母平均の差の 95% 信頼区間の下限を小数第 2 位まで求めよ。ただし $t_{0.025}(16)=2.120$ とする。
    answer: 0.98
    tolerance: 0.005
    hint: |
      標準誤差は $\sqrt{9\left(\dfrac18+\dfrac1{10}\right)}$、自由度は $8+10-2=16$。
    explanation: |
      標準誤差は $3\sqrt{0.225}\approx 1.423$、幅の半分は $2.120\times 1.423\approx 3.02$ なので、下限は $4-3.02=0.98$ です。区間が 0 を含まないので、有意水準 5% の両側検定でも母平均に差があると判断できます。
  - id: q11-ci-two-sample-proportion-g2
    term: ci-two-sample-proportion
    level: 標準
    type: numeric
    question: |
      A 群 300 人のうち 30%、B 群 200 人のうち 20% がある商品を知っていた。母比率の差（A − B）の 95% 信頼区間の下限を、正規近似で小数第 3 位まで求めよ。
    answer: 0.024
    tolerance: 0.0005
    hint: |
      標準誤差は $\sqrt{\dfrac{0.3\times 0.7}{300}+\dfrac{0.2\times 0.8}{200}}$。
    explanation: |
      標準誤差は $\sqrt{0.0007+0.0008}=\sqrt{0.0015}\approx 0.0387$、幅の半分は $1.96\times 0.0387\approx 0.076$ なので、下限は $0.10-0.076=0.024$ です。区間は 0 を含まず、A 群のほうが知っている割合が高いといえます。
  - id: q11-ci-variance-g2
    term: ci-variance
    level: 応用
    type: numeric
    question: |
      正規母集団から大きさ 16 の標本をとったところ、不偏分散は 25 だった。母標準偏差の 95% 信頼区間の上限を小数第 2 位まで求めよ。ただし $\chi^2_{0.025}(15)=27.49$、$\chi^2_{0.975}(15)=6.262$ とする。
    answer: 7.74
    tolerance: 0.005
    hint: |
      まず母分散の区間を作り、両端の平方根をとる。上限には小さいほうの点 6.262 を使う。
    explanation: |
      母分散の上限は $15\times 25/6.262\approx 59.9$ なので、母標準偏差の上限は $\sqrt{59.9}\approx 7.74$ です。下限は $\sqrt{375/27.49}\approx 3.69$ で、区間 $(3.69,\ 7.74)$ は標本の標準偏差 5 について左右対称ではありません。
  - id: q11-consistent-estimator-g2
    term: consistent-estimator
    level: 標準
    type: truefalse
    question: |
      「標本分散 $\dfrac1n\sum(X_i-\bar X)^2$ は母分散の不偏推定量ではないので、一致推定量でもない。」この記述は正しいか。
    answer: false
    hint: |
      期待値は $\dfrac{n-1}{n}\sigma^2$。$n$ を大きくするとどうなるか。
    explanation: |
      誤りです。標本分散の期待値は $\dfrac{n-1}{n}\sigma^2$ で少し小さいので不偏ではありませんが、$n$ が大きくなるとこの偏りは 0 に近づき、ばらつきも小さくなるので、母分散に近づきます（一致推定量）。不偏性と一致性は別の性質です。
  - id: q11-required-sample-size-g2
    term: required-sample-size
    level: 標準
    type: numeric
    question: |
      ある政策の支持率を調べる。支持率の見当がまったくつかないとき、95% 信頼区間の幅の半分を 0.03 以下にするのに必要な標本の大きさの最小値を求めよ（係数は 1.96 を使う）。
    answer: 1068
    tolerance: 0.4
    hint: |
      見当がつかないときは、$p(1-p)$ が最大になる $p=0.5$ を使う。
    explanation: |
      $n\ge\left(\dfrac{1.96}{0.03}\right)^2\times 0.25\approx 1067.1$ なので、最小は 1068 人です。切り捨てて 1067 にすると、幅の半分がわずかに 0.03 を超えます。
  - id: q11-point-estimation-g3
    term: point-estimation
    level: 標準
    type: numeric
    question: |
      2000 世帯の町から 100 世帯を無作為に選んで調べたところ、1 世帯あたりの人数の平均は 3.2 人だった。町全体の人数（総数）の推定値を求めよ。
    answer: 6400
    tolerance: 0.4
    hint: |
      母平均の推定値に、母集団の世帯数を掛ける。
    explanation: |
      母平均の推定値 3.2 人に世帯数 2000 を掛けて、$3.2\times 2000=6400$ 人です。標本平均は母平均の不偏推定量なので、それを $N$ 倍した値も総数の不偏推定量になります。
  - id: q11-unbiased-estimator-g3
    term: unbiased-estimator
    level: 標準
    type: numeric
    question: |
      大きさ 5 の標本について、$c\sum_{i=1}^{5}(X_i-\bar X)^2$ が母分散 $\sigma^2$ の不偏推定量になるような定数 $c$ を求めよ。
    answer: 0.25
    tolerance: 0.0001
    hint: |
      $E\left[\sum(X_i-\bar X)^2\right]=(n-1)\sigma^2$。
    explanation: |
      偏差平方和の期待値は $(5-1)\sigma^2=4\sigma^2$ なので、$c=1/4=0.25$ です。$n=5$ で割る（$c=0.2$）と、期待値は $0.8\sigma^2$ で小さめになります。
  - id: q11-standard-error-g3
    term: standard-error
    level: 応用
    type: numeric
    question: |
      独立な 2 つの群の標本平均の標準誤差は、それぞれ 3 と 4 だった。2 つの標本平均の差の標準誤差を求めよ。
    answer: 5
    tolerance: 0.001
    hint: |
      独立なら、差の分散は分散の和。標準誤差は足さずに、2 乗して足してから平方根。
    explanation: |
      $\sqrt{3^2+4^2}=5$ です。標準誤差をそのまま足して 7、引いて 1 とするのは誤りです。差でも和でも、独立な量の分散は足し算になります。
  - id: q11-confidence-interval-g3
    term: confidence-interval
    level: 応用
    type: numeric
    question: |
      母標準偏差が 10 の正規母集団で、標本平均から作った母平均の 95% 信頼区間は (46.08, 53.92) だった。標本の大きさを求めよ。
    answer: 25
    tolerance: 0.4
    hint: |
      幅の半分は $1.96\times 10/\sqrt n$。
    explanation: |
      幅の半分は $(53.92-46.08)/2=3.92$ なので、$1.96\times 10/\sqrt n=3.92$ より $\sqrt n=5$、$n=25$ です。区間の中心 50 が標本平均です。
  - id: q11-ci-mean-known-variance-g3
    term: ci-mean-known-variance
    level: 標準
    type: numeric
    question: |
      母標準偏差 12 の正規母集団から大きさ 36 の標本をとったところ、標本平均は 80 だった。母平均の 99% 信頼区間の下限を小数第 2 位まで求めよ（係数は 2.576 を使う）。
    answer: 74.85
    tolerance: 0.005
    hint: |
      標準誤差は $12/\sqrt{36}=2$。
    explanation: |
      $80-2.576\times 2=80-5.152\approx 74.85$ です。95% 信頼区間（係数 1.96）なら下限は 76.08 で、99% のほうが広くなります。
  - id: q11-ci-mean-unknown-variance-g3
    term: ci-mean-unknown-variance
    level: 応用
    type: numeric
    question: |
      正規母集団から 5 個のデータ 12, 15, 9, 14, 10 を得た。母平均の 95% 信頼区間の上限を小数第 2 位まで求めよ。ただし $t_{0.025}(4)=2.776$ とする。
    answer: 15.17
    tolerance: 0.01
    hint: |
      平均は 12、偏差平方和は 26、不偏分散は $26/4$。
    explanation: |
      不偏分散は $26/4=6.5$、標準誤差は $\sqrt{6.5/5}=\sqrt{1.3}\approx 1.140$ です。上限は $12+2.776\times 1.140\approx 15.17$ です。不偏分散を $n=5$ で割って求めたり、正規分布の 1.96 を使ったりすると、区間が狭くなりすぎます。
  - id: q11-ci-proportion-g3
    term: ci-proportion
    level: 標準
    type: numeric
    question: |
      無作為に選んだ 400 人のうち 80 人がある商品を使っていた。母比率の 99% 信頼区間の幅の半分を小数第 3 位まで求めよ（係数は 2.576 を使う）。
    answer: 0.052
    tolerance: 0.0005
    hint: |
      標準誤差は $\sqrt{0.2\times 0.8/400}$。
    explanation: |
      標準誤差は $\sqrt{0.16/400}=0.02$ なので、幅の半分は $2.576\times 0.02\approx 0.052$ です。区間は約 $(0.148,\ 0.252)$ です。
