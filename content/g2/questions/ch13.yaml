chapter: 13
questions:
  # ---------- 2標本t検定・プールした分散（共通の用語・2級の問題） ----------
  - id: q13-pooled-variance-g1
    term: pooled-variance
    level: 標準
    type: numeric
    question: |
      2 つの群の大きさはどちらも 6、不偏分散は 10 と 14 だった。プールした分散を求めよ。
    answer: 12
    tolerance: 0.001
    hint: |
      $\{(n_1-1)s_1^2+(n_2-1)s_2^2\}/(n_1+n_2-2)$。
    explanation: |
      $(5\times 10+5\times 14)/10=120/10=12$ です。大きさが等しいときは 2 つの不偏分散の平均になります。

  - id: q13-two-sample-t-test-g1
    term: two-sample-t-test
    level: 標準
    type: numeric
    question: |
      2 つの群（大きさはどちらも 6）の平均の差は 4、プールした分散は 12 だった。等分散を仮定した 2 標本 t 検定の検定統計量を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      標準誤差は $\sqrt{s_p^2(1/n_1+1/n_2)}$。
    explanation: |
      $\sqrt{12\times(1/6+1/6)}=\sqrt 4=2$、$t=4/2=2$ です。自由度は 10。

  # ---------- 対応のあるt検定（共通の用語・2級の問題） ----------
  - id: q13-paired-t-test-g1
    term: paired-t-test
    level: 標準
    type: choice
    question: |
      次のうち、対応のある t 検定を使うのが最も適切な場面はどれか。
    choices:
      - 同じ 20 人の、薬を飲む前と飲んだ後の血圧を比べる
      - A 組 20 人と B 組 25 人の得点を比べる
      - 男性 100 人と女性 100 人の賛成の割合を比べる
      - 3 つの地域の平均気温を比べる
    answer: 0
    hint: |
      同じ対象を 2 回測っているか。
    explanation: |
      同じ人の前後の測定値は対応があるので、差をとって検定します。別々の人の 2 群は 2 標本の検定、割合の比較は比率の差の検定、3 群以上は分散分析を使います。

  # ---------- 独立性の検定（共通の用語・2級の問題） ----------
  - id: q13-independence-test-g1
    term: independence-test
    level: 標準
    type: numeric
    question: |
      200 人のクロス表で、ある行の合計が 60、ある列の合計が 50 だった。独立性の検定で、この行と列が交わるセルの期待度数を求めよ。
    answer: 15
    tolerance: 0.001
    hint: |
      行の合計 × 列の合計 ÷ 総数。
    explanation: |
      $60\times 50/200=15$ です。

  # ---------- 適合度検定（共通の用語・2級の問題） ----------
  - id: q13-goodness-of-fit-test-g1
    term: goodness-of-fit-test
    level: 標準
    type: numeric
    question: |
      さいころを 120 回投げたところ、1〜6 の目の回数は 25, 15, 20, 20, 18, 22 だった。「どの目も確率 1/6」を帰無仮説とする適合度検定のカイ二乗統計量を求めよ。
    answer: 2.9
    tolerance: 0.01
    hint: |
      期待度数はどれも 20。
    explanation: |
      $(25+25+0+0+4+4)/20=58/20=2.9$ です。自由度 5 の上側 5% 点 11.07 より小さいので棄却しません。

  # ---------- ウェルチの検定（共通の用語・2級の問題） ----------
  - id: q13-welch-test-g1
    term: welch-test
    level: 基本
    type: truefalse
    question: |
      ウェルチの検定は、2 つの母分散が等しいと仮定して 2 つの母平均を比べる方法である。
    answer: false
    hint: |
      プールした分散を使うかどうか。
    explanation: |
      ウェルチの検定は、母分散が等しいとは限らないときに使う方法で、標準誤差を $\sqrt{s_1^2/n_1+s_2^2/n_2}$ とします。等分散を仮定するのはプールした分散を使う 2 標本 t 検定です。

  # ---------- 2標本t検定（2級向けに書き直した用語） ----------
  - id: q13-two-sample-t-test-g2
    term: two-sample-t-test
    level: 基本
    type: numeric
    question: |
      大きさ 10 と 12 の独立な 2 つの群で、母分散が等しいと仮定した 2 標本 t 検定を行う。検定統計量がしたがう t 分布の自由度を求めよ。
    answer: 20
    tolerance: 0.4
    hint: |
      全体の個数から、推定した平均の数 2 を引く。
    explanation: |
      自由度は $n_1+n_2-2=10+12-2=20$ です。
      $n_1+n_2-1=21$ や、どちらか一方の $n-1$ と取り違えないようにします。

  # ---------- ウェルチの検定（2級向けに書き直した用語） ----------
  - id: q13-welch-test-g2
    term: welch-test
    level: 標準
    type: numeric
    question: |
      店 A の客 10 人の購入額は平均 85・不偏分散 144、店 B の客 15 人は平均 78・不偏分散 36 だった。母分散が等しいとは限らないとして、ウェルチの方法で検定統計量 $t$ を小数第 2 位まで求めよ。
    answer: 1.71
    tolerance: 0.005
    hint: |
      標準誤差は $\sqrt{s_1^2/n_1+s_2^2/n_2}$。
    explanation: |
      $\sqrt{144/10+36/15}=\sqrt{14.4+2.4}=\sqrt{16.8}\approx 4.099$ なので、$t=7/4.099\approx 1.71$ です。
      等分散を仮定してプールした分散を使うと約 1.94 になり、分散の大きい群が小さい（人数の少ない）ときは差を大きく見積もりやすくなります。

  # ---------- 対応のあるt検定（2級向けに書き直した用語） ----------
  - id: q13-paired-t-test-g2
    term: paired-t-test
    level: 標準
    type: numeric
    question: |
      8 人の前後の点数の差（後 − 前）は 2, −1, 3, 4, 0, 2, 5, 1 だった。対応のある t 検定の検定統計量を小数第 2 位まで求めよ。
    answer: 2.83
    tolerance: 0.005
    hint: |
      差の平均と、差の不偏分散の平方根を求め、$\bar d/(s_d/\sqrt n)$。
    explanation: |
      差の平均は 2、偏差平方和は 28、不偏分散は $28/7=4$ で $s_d=2$ です。$t=2/(2/\sqrt 8)\approx 2.83$ で、自由度 7 の上側 2.5% 点 2.365 より大きいので、両側 5% で棄却します。

  # ---------- 適合度検定（2級向けに書き直した用語） ----------
  - id: q13-goodness-of-fit-test-g2
    term: goodness-of-fit-test
    level: 標準
    type: choice
    question: |
      1 日の問い合わせの件数を「0 件・1 件・2 件・3 件・4 件・5 件以上」の 6 つのカテゴリに分けて数えた。データから平均を推定したポアソン分布を当てはめて適合度検定を行うとき、統計量がしたがうカイ二乗分布の自由度はどれか。
    choices:
      - '4'
      - '5'
      - '6'
      - '3'
    answer: 0
    hint: |
      自由度 ＝ カテゴリの数 − 1 − 推定した母数の数。
    explanation: |
      $6-1-1=4$ です。ポアソン分布の平均（母数 1 個）をデータから推定したので、その分さらに 1 を引きます。
      推定した母数を引かない 5、カテゴリの数そのままの 6 は誤りです。

  # ---------- 独立性の検定（2級向けに書き直した用語） ----------
  - id: q13-independence-test-g2
    term: independence-test
    level: 標準
    type: numeric
    question: |
      次のクロス表について、独立性のカイ二乗統計量（連続修正なし）を小数第 2 位まで求めよ。

      | | 購入した | 購入しない |
      |---|---|---|
      | 広告 A | 40 | 10 |
      | 広告 B | 30 | 20 |
    answer: 4.76
    tolerance: 0.005
    hint: |
      期待度数は 行の合計 × 列の合計 ÷ 総数。購入した 70 人、しない 30 人、各行 50 人。
    explanation: |
      期待度数は「購入した」が各行 35、「購入しない」が各行 15 です。
      $$\chi^2=\frac{5^2}{35}+\frac{5^2}{15}+\frac{5^2}{35}+\frac{5^2}{15}\approx 0.714+1.667+0.714+1.667=4.76$$
      自由度 1 の上側 5% 点 3.841 より大きいので、有意水準 5% で「広告と購入は独立」を棄却します。

  # ---------- ピアソンのカイ二乗統計量（2級向けに書き直した用語） ----------
  - id: q13-pearson-chi-square-statistic-g1
    term: pearson-chi-square-statistic
    level: 基本
    type: numeric
    question: |
      3 つのカテゴリの観測度数が 18、12、30、期待度数がどれも 20 だった。ピアソンのカイ二乗統計量を求めよ。
    answer: 8.4
    tolerance: 0.001
    hint: |
      $\sum(O-E)^2/E$。
    explanation: |
      $\dfrac{(-2)^2+(-8)^2+10^2}{20}=\dfrac{4+64+100}{20}=8.4$ です。自由度 2 の上側 5% 点 5.991 を超えます。

  # ---------- 期待度数（2級向けに書き直した用語） ----------
  - id: q13-expected-frequency-g1
    term: expected-frequency
    level: 基本
    type: numeric
    question: |
      200 人のクロス表で、ある行の合計が 80 人、ある列の合計が 45 人だった。独立性の検定で、この行と列が交わるセルの期待度数を求めよ。
    answer: 18
    tolerance: 0.001
    hint: |
      行の合計 × 列の合計 ÷ 総数。
    explanation: |
      $80\times 45/200=18$ です。「列の割合 45/200 が、どの行でも同じ」と考えて、この行の 80 人に掛けた値です。

  # ---------- 等分散のF検定（2級向けに書き直した用語） ----------
  - id: q13-f-test-equal-variances-g1
    term: f-test-equal-variances
    level: 標準
    type: choice
    question: |
      2 つの正規母集団から大きさ 9 と 13 の標本をとり、不偏分散は 30 と 12 だった。大きいほうを分子にした F 統計量で、有意水準 5% の両側検定を行う。統計量と比べる点として正しいものはどれか。
    choices:
      - F ＝ 2.5 を、自由度 (8, 12) の F 分布の上側 2.5% 点と比べる
      - F ＝ 2.5 を、自由度 (8, 12) の F 分布の上側 5% 点と比べる
      - F ＝ 2.5 を、自由度 (12, 8) の F 分布の上側 2.5% 点と比べる
      - F ＝ 2.5 を、自由度 (9, 13) の F 分布の上側 2.5% 点と比べる
    answer: 0
    hint: |
      自由度は（分子の標本の大きさ − 1, 分母の標本の大きさ − 1）。両側で大きいほうを分子にしたら上側 α/2 点。
    explanation: |
      $F=30/12=2.5$ で、分子は大きさ 9 の標本なので自由度 (8, 12) です。両側 5% で大きいほうを分子にしたので、上側 2.5% 点（$F_{0.025}(8,12)\approx 3.51$）と比べ、棄却しません。

  # ---------- プールした分散（2級向けに書き直した用語） ----------
  - id: q13-pooled-variance-g2
    term: pooled-variance
    level: 標準
    type: numeric
    question: |
      群 1（大きさ 8、不偏分散 20）と群 2（大きさ 13、不偏分散 26）のプールした分散を小数第 2 位まで求めよ。
    answer: 23.79
    tolerance: 0.005
    hint: |
      $\{(n_1-1)s_1^2+(n_2-1)s_2^2\}/(n_1+n_2-2)$。
    explanation: |
      $(7\times 20+12\times 26)/19=(140+312)/19\approx 23.79$ です。単純な平均 23 より、大きさの大きい群 2 の値に近くなります。

  # ---------- 2標本の比率の差の検定（2級向けに書き直した用語） ----------
  - id: q13-two-sample-proportion-test-g1
    term: two-sample-proportion-test
    level: 標準
    type: numeric
    question: |
      A 地区の 200 人のうち 110 人、B 地区の 200 人のうち 90 人がある政策に賛成した。帰無仮説「2 つの地区の賛成率は等しい」のもとで、合わせた比率を使う検定統計量 $z$ を求めよ。
    answer: 2
    tolerance: 0.001
    hint: |
      合わせた比率は $(110+90)/400$。標準誤差は $\sqrt{\hat p(1-\hat p)(1/200+1/200)}$。
    explanation: |
      合わせた比率は 0.5、標準誤差は $\sqrt{0.25\times 0.01}=0.05$ なので、$z=(0.55-0.45)/0.05=2.0$ です。両側 5% の点 1.96 をわずかに超えます。

  # ---------- 母相関係数の検定（2級向けに書き直した用語） ----------
  - id: q13-test-correlation-coefficient-g1
    term: test-correlation-coefficient
    level: 標準
    type: numeric
    question: |
      11 組のデータの標本相関係数は 0.6 だった。帰無仮説「母相関係数は 0」の検定統計量 $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ を求めよ。
    answer: 2.25
    tolerance: 0.001
    hint: |
      $\sqrt{n-2}=3$、$\sqrt{1-0.36}=0.8$。
    explanation: |
      $t=0.6\times 3/0.8=2.25$ です。自由度 9 の両側 5% の点 2.262 よりわずかに小さいので、有意水準 5% では棄却しません。

  - id: q13-pearson-chi-square-statistic-g2
    term: pearson-chi-square-statistic
    level: 標準
    type: choice
    question: |
      さいころを 60 回振ったところ、1〜6 の目がそれぞれ 5、8、9、12、11、15 回出た。「どの目も確率 1/6」の適合度検定を有意水準 5% で行う。正しいものはどれか。ただし $\chi^2_{0.05}(5)=11.07$、$\chi^2_{0.05}(6)=12.59$ とする。
    choices:
      - χ² ＝ 6.0、自由度 5 で、11.07 より小さいので棄却しない
      - χ² ＝ 6.0、自由度 6 で、12.59 より小さいので棄却しない
      - χ² ＝ 6.0 は自由度 5 より大きいので棄却する
      - χ² ＝ 0.6、自由度 5 で、11.07 より小さいので棄却しない
    answer: 0
    hint: |
      期待度数はどれも 10。自由度は「カテゴリの数 − 1」。
    explanation: |
      $\dfrac{25+4+1+4+1+25}{10}=6.0$、自由度は $6-1=5$ で、11.07 より小さいので「さいころは正しい」を棄却しません。カテゴリの数 6 を自由度にする誤り、度数ではなく割合で計算して 0.6 にする誤りに注意します。
  - id: q13-expected-frequency-g2
    term: expected-frequency
    level: 標準
    type: choice
    question: |
      クロス表の独立性の検定を行おうとしたところ、期待度数が 5 未満のセルがいくつもあった。最も適切な対処はどれか。
    choices:
      - 意味の近いカテゴリをまとめて期待度数を大きくするか、近似に頼らない正確な方法を使う
      - 観測度数が 5 未満のセルを取り除いて計算する
      - 期待度数が 5 未満のセルは、期待度数を 5 に置き換えて計算する
      - カイ二乗分布の近似は期待度数によらず正確なので、そのまま検定する
    answer: 0
    hint: |
      カイ二乗分布による近似がよいのは、期待度数がある程度大きいとき。
    explanation: |
      期待度数が小さいと、統計量の分布がカイ二乗分布からずれて検定が不正確になります。目安は「すべての期待度数が 5 以上」で、満たさないときはカテゴリをまとめるか、2×2 表ならフィッシャーの正確検定などを使います。セルを取り除いたり値を置き換えたりすると、データの意味が変わってしまいます。
  - id: q13-f-test-equal-variances-g2
    term: f-test-equal-variances
    level: 基本
    type: numeric
    question: |
      2 つの標本の標準偏差（不偏分散の平方根）は 6 と 4 だった。等分散の検定で、大きいほうを分子にした F 統計量を求めよ。
    answer: 2.25
    tolerance: 0.001
    hint: |
      F 統計量は分散の比。標準偏差は 2 乗してから割る。
    explanation: |
      $F=\dfrac{6^2}{4^2}=\dfrac{36}{16}=2.25$ です。標準偏差の比 $6/4=1.5$ をそのまま使うのはよくある誤りです。
  - id: q13-two-sample-proportion-test-g2
    term: two-sample-proportion-test
    level: 応用
    type: numeric
    question: |
      2 つの群の比率の差の検定で、合わせた比率を使う検定統計量は $z=2.0$ だった。同じデータを 2×2 のクロス表にして独立性の検定を行うと、ピアソンのカイ二乗統計量（連続修正なし）はいくらになるか。
    answer: 4
    tolerance: 0.001
    hint: |
      2×2 表の独立性の検定は、2 つの比率の差の検定と同じことを調べている。
    explanation: |
      2×2 表のカイ二乗統計量は $z^2$ に等しく、$2.0^2=4.0$ です。棄却の境目も、自由度 1 のカイ二乗分布の上側 5% 点 3.84 が $1.96^2$ に等しいので、2 つの検定の結論はいつも一致します。
  - id: q13-two-sample-t-test-g3
    term: two-sample-t-test
    level: 応用
    type: numeric
    question: |
      大きさ 5 の群の平均は 20・不偏分散 10、大きさ 7 の群の平均は 16・不偏分散 8 だった。等分散を仮定した 2 標本 t 検定の検定統計量を小数第 2 位まで求めよ。
    answer: 2.3
    tolerance: 0.005
    hint: |
      プールした分散は $\dfrac{4\times 10+6\times 8}{10}$。
    explanation: |
      プールした分散は $88/10=8.8$、標準誤差は $\sqrt{8.8\times(1/5+1/7)}\approx 1.737$ なので、$t=4/1.737\approx 2.30$ です。自由度 10 の両側 5% の点 2.228 より大きいので、有意水準 5% で棄却します。
  - id: q13-welch-test-g3
    term: welch-test
    level: 標準
    type: choice
    question: |
      2 つの独立な群の平均を比べる。群 A は 8 人で不偏分散 4、群 B は 30 人で不偏分散 50 だった。最も適切な方法はどれか。
    choices:
      - 母分散が等しいと仮定しない、ウェルチの検定を使う
      - プールした分散を使う 2 標本 t 検定を使う
      - 対応のある t 検定を使う
      - 2 つの群の分散の比を F 検定で調べ、その結果だけで平均の差を判断する
    answer: 0
    hint: |
      分散が 10 倍以上違い、大きさも違う。
    explanation: |
      分散が大きく違い、群の大きさも違うときにプールした分散を使うと、検定の有意水準が大きくずれます。ウェルチの検定は母分散が等しいと仮定しないので、このような場合に適しています。人が違う 2 つの群なので、対応のある t 検定は使えません。F 検定は分散を比べるもので、平均の差は判断できません。
  - id: q13-paired-t-test-g3
    term: paired-t-test
    level: 応用
    type: choice
    question: |
      同じ 10 人に薬を飲む前と後で血圧を測った。この対応のあるデータを、誤って独立な 2 標本 t 検定で分析すると、一般にどうなるか。
    choices:
      - 人による血圧の違い（個人差）が誤差に含まれ、効果を検出しにくくなることが多い
      - 個人差が取り除かれ、効果を検出しやすくなる
      - 平均の差の推定値が変わる
      - 結果は対応のある t 検定とまったく同じになる
    answer: 0
    hint: |
      対応のある t 検定は、一人ひとりの差をとることで個人差を打ち消す。
    explanation: |
      平均の差（の推定値）はどちらでも同じですが、独立な 2 標本として扱うと、個人差のばらつきが標準誤差に入って大きくなり、t 値が小さくなります。前と後の値に強い正の相関があるほど、この違いは大きくなります。
  - id: q13-goodness-of-fit-test-g3
    term: goodness-of-fit-test
    level: 応用
    type: numeric
    question: |
      ある遺伝の法則では 4 つの型が 9 : 3 : 3 : 1 の割合で現れる。160 個体を調べたところ、96、28、26、10 個体だった。適合度検定のカイ二乗統計量を小数第 2 位まで求めよ。
    answer: 1.07
    tolerance: 0.005
    hint: |
      期待度数は $160\times 9/16=90$、30、30、10。
    explanation: |
      $\dfrac{6^2}{90}+\dfrac{2^2}{30}+\dfrac{4^2}{30}+0=0.4+0.133+0.533\approx 1.07$ です。自由度 3 の上側 5% 点 7.81 よりずっと小さいので、法則どおりの割合だという帰無仮説は棄却されません。
  - id: q13-independence-test-g3
    term: independence-test
    level: 応用
    type: numeric
    question: |
      次の 2×3 のクロス表について、独立性のカイ二乗統計量を小数第 2 位まで求めよ。

      | | 賛成 | どちらでもない | 反対 |
      |---|---|---|---|
      | 男性 | 20 | 30 | 50 |
      | 女性 | 30 | 30 | 40 |
    answer: 3.11
    tolerance: 0.005
    hint: |
      期待度数は、どちらの行も 25、30、45。
    explanation: |
      行の合計はどちらも 100、列の合計は 50、60、90 なので、期待度数はどちらの行も 25、30、45 です。$2\times\left(\dfrac{5^2}{25}+0+\dfrac{5^2}{45}\right)\approx 3.11$ で、自由度 $(2-1)(3-1)=2$ の上側 5% 点 5.99 より小さいので、独立という帰無仮説は棄却されません。
