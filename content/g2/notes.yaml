# 準1級と共通の解説を使う用語（plan.yaml の from: pre1）に、2級で押さえることを短く示す注記。
# build.py が用語ページの上に表示する。数式は使わず、文章で書く。
coefficient-of-variation: 定義（標準偏差 ÷ 平均）と、平均の大きさや単位の違う量のばらつきを比べるときに使うことを押さえる。分布ごとの変動係数の表は読み飛ばしてよい。
skewness-kurtosis: 歪度の符号と裾の向き（右に裾が長いと正）、平均値と中央値の大小関係との対応を押さえる。尖度の式やモーメントによる定義は2級ではほとんど問われない。
weighted-geometric-harmonic-mean: 平均成長率は幾何平均、同じ距離を違う速さで進んだときの平均の速さは調和平均、という使い分けを押さえる。
correlation-matrix: 表の読み方（対角は 1、対称、強さは絶対値で比べる）を押さえればよい。行列の計算は2級では不要。
partial-correlation-coefficient: 3つの相関係数から偏相関係数を求める公式を使えるようにする。行列による一般化は読み飛ばしてよい。
simpsons-paradox: 層ごとの割合と全体の割合で大小が逆になる表を読み取れるようにする。原因は層の構成の違い。
residual-plot: 残差プロットの形（曲線→直線関係でない、扇形→分散が一定でない）の読み取りを押さえる。
log-transformation: 右に裾の長いデータを対数変換すると対称に近づくこと、対数をとった回帰の傾きが変化の割合（%）を表すことを押さえる。
autocovariance-autocorrelation: 時点をずらした値どうしの相関（自己相関）の意味を押さえる。定常性の厳密な定義は読み飛ばしてよい。
correlogram: コレログラムの読み取り（季節周期のラグで大きな自己相関、トレンドがあるとゆっくり減る）を押さえる。
seasonal-adjustment: 季節調整値・前年同月比の意味を知っておけば十分。調整の方法の細部は不要。
systematic-sampling: 最初だけ無作為に選び、一定の間隔で選ぶ方法。名簿に周期があると偏ることを押さえる。
stratified-sampling: すべての層から選ぶこと、比例配分の計算、層の間の違いが大きく層の中が似ているときに精度が上がることを押さえる。ネイマン配分は知っておく程度でよい。
cluster-sampling: いくつかの集落を選び、その中を全部調べる方法。集落の中が似ていると精度が下がることを押さえる。
two-stage-sampling: 1段目で集団（学校・地区）を、2段目でその中の個人を選ぶ方法。集落抽出との違いを押さえる。
nonresponse-bias: 回答した人としなかった人で性質が違うと偏りが生じ、回答数を増やしても消えないことを押さえる。
law-of-total-probability: 場合分けして確率を足し合わせる計算を押さえる。ベイズの定理の分母になる。
cumulative-distribution-function: 「x 以下の確率」を表す関数で、確率の差から区間の確率を求められることを押さえる。
joint-probability-function: 同時確率の表から周辺確率・条件付き確率を求め、独立かどうかを判断できるようにする。
marginal-distribution: 同時確率の表の行や列を足して求めることだけ押さえればよい。
sum-of-random-variables: 独立な確率変数の和の期待値と分散、独立な正規分布の和が正規分布になることを押さえる。再生性の一般論は読み飛ばしてよい。
geometric-distribution: 初めて成功するまでの回数の分布。2級の問題は「試行の回数」で数えることが多く、そのとき期待値は 1/p。この辞典の解説は「失敗の回数」で数えているので注意。
hypergeometric-distribution: 戻さずに取り出すときの確率を組合せの比で計算できるようにする。
negative-binomial-distribution: 出題はまれ。幾何分布を「r 回成功するまで」に広げたものと知っておけば十分。
uniform-distribution: 区間 [a, b] の一様分布の期待値（a＋b）/2 と分散（b－a）²/12 を押さえる。
bivariate-normal-distribution: 出題はまれ。相関係数が 0 なら独立になる、という性質だけ知っておけば十分。
chebyshev-inequality: 分布の形によらず、平均から標準偏差の k 倍以上離れる確率は 1/k² 以下、という使い方を押さえる。
continuity-correction: 「k 以上」を k－0.5 から、「k 以下」を k＋0.5 までとして標準化する修正を押さえる。
consistent-estimator: 標本を大きくすると母数に近づく推定量のこと。不偏性との違いを押さえる。
confidence-coefficient: 信頼係数を上げると区間が広くなること、90%・95%・99% に対応する点（1.645・1.96・2.576）を押さえる。
ci-variance: カイ二乗分布の上側と下側の2つの点を使う区間の計算を押さえる。
ci-two-sample-mean-difference: 2つの分散を足して標準誤差を作ること、等分散を仮定するときはプールした分散と自由度 n₁＋n₂－2 を使うことを押さえる。
ci-variance-ratio: 出題はまれ。F 分布の2つの点を使うことだけ知っておけば十分。
ci-two-sample-proportion: 2つの比率の分散を足して標準誤差を作る計算を押さえる。
required-sample-size: 誤差の範囲を決めて n について解く計算（比率で見当がなければ p＝0.5）と、小数は切り上げることを押さえる。
fisher-z-transformation: 相関係数を z 変換し、標準偏差 1/√(n－3) で区間を作って元に戻す手順を押さえる。
finite-population-correction: 戻さずに抽出するとき、標本平均の分散に (N－n)/(N－1) を掛けることを押さえる。
rejection-region: 棄却域の形（両側・右片側・左片側）と、分布表の点の選び方を押さえる。
power-function: 検出力＝対立仮説が正しいときに棄却する確率。標本を大きくすると上がることと、簡単な z 検定での計算を押さえる。
chi-square-test-variance: （n－1）s²/σ₀² を自由度 n－1 のカイ二乗分布の点と比べる手順を押さえる。
confidence-interval-test-duality: 両側 α の検定で棄却されない値の範囲が、信頼係数 1－α の信頼区間になることを押さえる。
pooled-variance: （n₁－1）s₁²＋（n₂－1）s₂² を n₁＋n₂－2 で割る計算を押さえる。
f-test-equal-variances: 不偏分散の比を F 分布（自由度の順に注意）の点と比べる手順を押さえる。
two-sample-proportion-test: 2群を合わせた比率で標準誤差を作る z 検定を押さえる。
pearson-chi-square-statistic: （観測度数－期待度数）² ÷ 期待度数 の合計を計算できるようにする。
expected-frequency: 独立性の検定では 行の合計 × 列の合計 ÷ 総数、適合度検定では 総数 × 確率 で求めることを押さえる。
test-correlation-coefficient: t ＝ r√(n－2) ÷ √(1－r²) を自由度 n－2 の t 分布で検定する手順を押さえる。
overall-f-test-regression: 決定係数から F を求める式と、「すべての係数が 0」の検定であることを押さえる。
multicollinearity: 説明変数どうしの相関が強いと係数の標準誤差が大きくなり、符号や有意性が不安定になることを押さえる。VIF は知っておく程度でよい。
dummy-variable: 質的変数を 0 と 1 で表し、係数を基準のカテゴリとの差として読むこと、カテゴリの数－1 個のダミーを使うことを押さえる。
confidence-and-prediction-interval-regression: 予測区間は信頼区間より広く、どちらも x が平均から離れるほど広くなる、という性質を押さえる。
randomized-block-design: ブロックを作ってその中で処理を比べる目的と、誤差の自由度が（処理の数－1）×（ブロックの数－1）になることを押さえる。
main-effect-and-interaction: 組合せごとの平均の表から、一方の効果がもう一方の水準で変わる（交互作用）ことを読み取れるようにする。
two-way-anova-with-replication: 出題はまれ。交互作用を検定するには繰り返しが必要、ということを知っておけば十分。
