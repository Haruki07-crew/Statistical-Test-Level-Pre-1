          - 平方和の比をそのままとった
          - 群間と誤差の自由度を入れ替えた
          - 誤差の自由度の代わりに全体の自由度 14 を使った
          - 正解
          - 分子と分母を逆にした
        explanation: |
          **方針** 自由度は群間 $3-1=2$、誤差 $15-3=12$。平均平方 ＝ 平方和 ÷ 自由度、F ＝ 群間の平均平方 ÷ 誤差の平均平方。

          **途中式** $48/2=24$、$72/12=6$、$F=24/6=4.00$

          **答え** 4.00

          **間違えやすい点** F 比は平方和ではなく平均平方の比。$F_{0.05}(2,12)=3.885$ より大きいので、有意水準 5% で肥料による差があると判断できる。
