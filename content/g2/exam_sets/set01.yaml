set: 1
title: 2級 模擬試験 第1回
minutes: 90
problems:
  - id: s01p01
    title: 世帯の電気代の度数分布
    context: |
      ある地区の 50 世帯について、ある月の電気代（千円）を調べ、次の度数分布表にまとめた。階級は「4 以上 6 未満」のように区切っている。

      | 電気代（千円） | 4〜6 | 6〜8 | 8〜10 | 10〜12 | 12〜14 |
      |---|---|---|---|---|---|
      | 世帯数 | 6 | 14 | 17 | 9 | 4 |
    items:
      - id: s01p01a
        chapter: 1
        terms: [cumulative-frequency, frequency-distribution-histogram]
        topic: 度数分布表から電気代が一定額未満の世帯の割合を累積相対度数として求める
        level: 基本
        definition: false
        type: choice
        question: |
          電気代が 10 千円未満の世帯の割合はいくらか。
        choices:
          - '0.34'
          - '0.40'
          - '0.74'
          - '0.26'
          - '0.92'
        answer: 2
        distractors:
          - 8〜10 千円の階級だけの相対度数（17/50）を答えた
          - 8 千円未満までしか足していない（(6+14)/50）
          - 正解
          - 10 千円以上の割合（1 − 0.74）を答えた
          - 12 千円未満まで足した（(6+14+17+9)/50）
        explanation: |
          **方針** 10 千円未満は、4〜6・6〜8・8〜10 の 3 つの階級の合計。累積度数を全体の 50 で割る。

          **途中式** $6+14+17=37$、$37/50=0.74$

          **答え** 0.74

          **間違えやすい点** 「10 千円未満」の境目は 10〜12 の階級の下端。8〜10 の階級まで含めて数える。10 千円以上の割合は $1-0.74=0.26$ で、「未満」と「以上」を取り違えないようにする。
      - id: s01p01b
        chapter: 2
        terms: [mean-median-mode, frequency-distribution-histogram]
        topic: 度数分布表から階級値を使って平均の近似値を求め階級の端の値を使う誤りと区別する
        level: 標準
        definition: false
        type: choice
        question: |
          各階級の階級値を使って、50 世帯の電気代の平均の近似値を求めると、何千円か。
        choices:
          - '8.64'
          - '7.64'
          - '9.64'
          - '9.00'
          - '10.00'
        answer: 0
        distractors:
          - 正解
          - 階級値の代わりに各階級の下端（4, 6, 8, 10, 12）を使った
          - 階級値の代わりに各階級の上端（6, 8, 10, 12, 14）を使った
          - 度数が最も多い階級の階級値（最頻値）を答えた
          - 度数の平均（50 ÷ 5）を答えた
        explanation: |
          **方針** 階級値は 5, 7, 9, 11, 13。度数で重み付けした平均を求める。

          **途中式**
          $$\frac{5\times 6+7\times 14+9\times 17+11\times 9+13\times 4}{50}=\frac{30+98+153+99+52}{50}=\frac{432}{50}=8.64$$

          **答え** 8.64 千円

          **間違えやすい点** 階級値は階級の真ん中の値。下端や上端を使うと、ちょうど階級の幅の半分（1 千円）ずれる。度数分布表からの平均は近似値である。
  - id: s01p02
    title: 通学時間の要約
    context: |
      11 人の生徒の通学時間（分）を小さい順に並べると、次のとおりであった。

      5, 8, 10, 12, 13, 15, 16, 18, 20, 24, 45

      第 1 四分位数・第 3 四分位数は、中央値を除いた下半分・上半分（それぞれ 5 個）の中央値とする。外れ値は「第 1 四分位数 − 1.5 × 四分位範囲」より小さい値、または「第 3 四分位数 ＋ 1.5 × 四分位範囲」より大きい値とする。
    items:
      - id: s01p02a
        chapter: 2
        terms: [quartiles-iqr, box-plot]
        topic: 奇数個のデータで中央値を除いて四分位数を求め1.5倍の四分位範囲の基準で外れ値を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          四分位範囲と、外れ値と判定される値の組合せとして正しいものはどれか。
        choices:
          - 四分位範囲 10、外れ値はない
          - 四分位範囲 40、外れ値は 45
          - 四分位範囲 8、外れ値は 45
          - 四分位範囲 10、外れ値は 45
          - 四分位範囲 10、外れ値は 5 と 45
        answer: 3
        distractors:
          - 上側の基準 35 を計算していない（45 は 35 を超える）
          - 範囲（最大 − 最小）を四分位範囲とした
          - 中央値を含めて 6 個ずつに分け、第 1 四分位数 11・第 3 四分位数 19 とした
          - 正解
          - 下側の基準は −5 で、5 はそれより大きいので外れ値ではない
        explanation: |
          **方針** 中央値（6 番目の 15）を除き、下半分 5, 8, 10, 12, 13 と上半分 16, 18, 20, 24, 45 の中央値を求める。

          **途中式**
          - 第 1 四分位数 10、第 3 四分位数 20、四分位範囲 $20-10=10$
          - 上側の基準 $20+1.5\times 10=35$、下側の基準 $10-15=-5$
          - 35 を超えるのは 45 だけ。−5 より小さい値はない。

          **答え** 四分位範囲 10、外れ値は 45

          **間違えやすい点** 四分位数の求め方は問題文の定義に従う。中央値を含めて分けると 11 と 19 になり、四分位範囲は 8 になる。範囲（40）と四分位範囲を混同しない。
      - id: s01p02b
        chapter: 2
        terms: [mean-median-mode, distribution-shape]
        topic: 大きな値を1つ含むデータで平均値と中央値の大小と外れ値を除いたときの中央値の変化を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          このデータについて正しい記述はどれか。
        choices:
          - 中央値は 16 分である
          - 平均値は中央値より大きい
          - 最頻値は 15 分である
          - 範囲は 35 分である
          - 45 分を除くと、中央値は大きくなる
        answer: 1
        distractors:
          - 中央値は 6 番目の 15 分（16 は 7 番目）
          - 正解
          - すべての値が 1 回ずつなので、最頻値は定まらない
          - 範囲は 45 − 5 = 40 分
          - 45 分を除いた 10 個の中央値は (13 + 15)/2 = 14 分で、小さくなる
        explanation: |
          **方針** 平均値と中央値を実際に求めて比べる。

          **途中式** 合計は 186 なので平均値は $186/11\approx 16.9$ 分。中央値は 6 番目の 15 分。

          **答え** 平均値は中央値より大きい

          **間違えやすい点** 45 分という大きな値に平均値が引っ張られる（右に裾が長い）。45 分を除くと平均値は $141/10=14.1$ 分に大きく下がるが、中央値は 15 分から 14 分に少し下がるだけである。
  - id: s01p03
    title: 広告費と売上
    context: |
      ある会社の 8 店舗について、1 か月の広告費 $x$（万円）と売上 $y$（万円）を調べ、次の値を得た。

      $\bar x=20$、$\bar y=150$、$\sum(x_i-\bar x)^2=200$、$\sum(y_i-\bar y)^2=2000$、$\sum(x_i-\bar x)(y_i-\bar y)=480$
    items:
      - id: s01p03a
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 偏差平方和と偏差積和から相関係数を求め回帰の傾きや決定係数と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          $x$ と $y$ の相関係数に最も近いものはどれか。
        choices:
          - '0.22'
          - '2.40'
          - '0.24'
          - '0.58'
          - '0.76'
        answer: 4
        distractors:
          - 偏差積和を 2 つの偏差平方和の「和」で割った
          - 偏差積和を x の偏差平方和だけで割った（y を x で説明する回帰の傾き）
          - 偏差積和を y の偏差平方和だけで割った（x を y で説明する回帰の傾き）
          - 相関係数の 2 乗（決定係数）を答えた
          - 正解
        explanation: |
          **方針** 相関係数は 偏差積和 ÷ √（偏差平方和の積）。

          **途中式**
          $$r=\frac{480}{\sqrt{200\times 2000}}=\frac{480}{\sqrt{400000}}\approx\frac{480}{632.5}\approx 0.76$$

          **答え** 0.76

          **間違えやすい点** 割る数は 2 つの偏差平方和の積の平方根。$480/200=2.4$ は回帰の傾きで、相関係数は $-1$ から $1$ の範囲に入る。$r^2\approx 0.58$ は単回帰の決定係数。
      - id: s01p03b
        chapter: 4
        terms: [simple-regression, least-squares-method]
        topic: 偏差平方和と偏差積和から最小二乗の回帰直線を求めて広告費の値から売上を予測する
        level: 標準
        definition: false
        type: choice
        question: |
          $y$ を $x$ で説明する回帰直線を最小二乗法で求め、広告費が 25 万円の店舗の売上を予測すると、何万円か。
        choices:
          - '151.2'
          - '153.8'
          - '162.0'
          - '60.0'
          - '210.0'
        answer: 2
        distractors:
          - 傾きを 480/2000＝0.24（x を y で説明する回帰の傾き）とした
          - 相関係数 0.76 を傾きとした
          - 正解
          - 切片を忘れて 傾き × 25 だけを計算した
          - 切片を平均の 150 とし、x を平均からのずれにしないで 2.4 × 25 を足した
        explanation: |
          **方針** 傾き $b=S_{xy}/S_{xx}$、切片 $a=\bar y-b\bar x$。

          **途中式**
          - $b=480/200=2.4$、$a=150-2.4\times 20=102$
          - $\hat y=102+2.4\times 25=162$

          **答え** 162.0 万円

          **間違えやすい点** 回帰直線は平均の点 (20, 150) を通るので、$\hat y=150+2.4\times(25-20)$ と考えてもよい。傾きの分母は説明変数 $x$ の偏差平方和。
      - id: s01p03c
        chapter: 4
        terms: [simple-regression, covariance-and-correlation, coefficient-of-determination]
        topic: 説明変数の単位を変えたときに相関係数と回帰の傾きと決定係数がどう変わるかを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          広告費 $x$ を「万円」から「千円」の単位に直した（値を 10 倍した）。売上 $y$ の単位はそのままとする。このとき正しい記述はどれか。
        choices:
          - 相関係数は変わらず、回帰の傾きは 1/10 になる
          - 相関係数も回帰の傾きも変わらない
          - 相関係数も回帰の傾きも 1/10 になる
          - 相関係数は変わらず、回帰の傾きは 10 倍になる
          - 相関係数は 10 倍になり、回帰の傾きは変わらない
        answer: 0
        distractors:
          - 正解
          - 傾きは x の単位に依存するので変わる
          - 相関係数は単位に依存しない
          - x が 10 倍になると、x の 1 単位あたりの y の変化は 1/10 になる（10 倍ではない）
          - 相関係数は単位に依存しない
        explanation: |
          **方針** $x'=10x$ とすると、偏差積和は 10 倍、$x$ の偏差平方和は 100 倍になる。

          **途中式**
          - 相関係数：$\dfrac{10S_{xy}}{\sqrt{100S_{xx}S_{yy}}}=\dfrac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$ で変わらない
          - 傾き：$\dfrac{10S_{xy}}{100S_{xx}}=\dfrac{1}{10}\cdot\dfrac{S_{xy}}{S_{xx}}$ で 0.24 になる

          **答え** 相関係数は変わらず、回帰の傾きは 1/10 になる

          **間違えやすい点** 1 千円は 1 万円の 1/10 なので、「1 単位増えたときの売上の増え方」も 1/10 になる。決定係数（$r^2$）や予測値も変わらない。
  - id: s01p04
    title: 売上の推移と物価
    context: |
      ある店の売上の指数（2021 年 ＝ 100）は、2022 年 120、2023 年 108、2024 年 135、2025 年 146.41 だった。
    items:
      - id: s01p04a
        chapter: 5
        terms: [growth-rate, weighted-geometric-harmonic-mean]
        topic: 指数の系列から4年間の年平均成長率を幾何平均で求め成長率の算術平均と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          2021 年から 2025 年までの 4 年間の、売上の年平均成長率はいくらか。
        choices:
          - 10.9%
          - 11.6%
          - 21.0%
          - 10.0%
          - 46.4%
        answer: 3
        distractors:
          - 各年の成長率（20%、−10%、25%、約 8.45%）の算術平均を求めた
          - 4 年間の増加率 46.41% を 4 で割った
          - 2 年分として平方根をとった（$\sqrt{1.4641}-1$）
          - 正解
          - 4 年間の増加率をそのまま答えた
        explanation: |
          **方針** 平均成長率 $\bar g$ は $(1+\bar g)^4=146.41/100$ を満たす。

          **途中式** $\sqrt{1.4641}=1.21$、$\sqrt{1.21}=1.1$ なので $1+\bar g=1.1$。

          **答え** 10.0%

          **間違えやすい点** 成長は掛け算で積み重なるので、成長率の算術平均（約 10.9%）は使えない。4 乗根は平方根を 2 回とると電卓で求められる。
      - id: s01p04b
        chapter: 5
        terms: [price-index, index-number]
        topic: 3品目の価格と基準時の数量からラスパイレス価格指数を求めパーシェ指数や価格比の単純平均と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          この店で扱う 3 品目の価格（円）と購入数量は次のとおりである。基準時を 100 とするラスパイレス価格指数に最も近いものはどれか。

          | 品目 | 基準時の価格 | 基準時の数量 | 比較時の価格 | 比較時の数量 |
          |---|---|---|---|---|
          | A | 200 | 5 | 240 | 4 |
          | B | 120 | 10 | 120 | 11 |
          | C | 80 | 15 | 72 | 18 |
        choices:
          - '100.45'
          - '102.35'
          - '103.33'
          - '97.70'
          - '101.40'
        answer: 1
        distractors:
          - 比較時の数量を使った（パーシェ価格指数）
          - 正解
          - 3 品目の価格比（1.2、1.0、0.9）を単純に平均した
          - 分子と分母を逆にした
          - ラスパイレス指数とパーシェ指数の幾何平均（フィッシャー指数）を求めた
        explanation: |
          **方針** 基準時の数量を、比較時の価格と基準時の価格で買ったときの費用の比を求める。

          **途中式**
          - 分子：$240\times 5+120\times 10+72\times 15=1200+1200+1080=3480$
          - 分母：$200\times 5+120\times 10+80\times 15=1000+1200+1200=3400$
          - $3480/3400\times 100\approx 102.35$

          **答え** 102.35

          **間違えやすい点** 比較時の数量を使うとパーシェ指数（$3576/3560\times 100\approx 100.45$）になる。値上がりした A の購入が減り、値下がりした C の購入が増えたので、パーシェ指数のほうが低い。
  - id: s01p05
    title: 健康教室の効果と調査の方法
    context: |
      ある市で、市民の健康づくりについて調べる。
    items:
      - id: s01p05a
        chapter: 6
        terms: [observational-vs-experimental, treatment-and-control]
        topic: 参加を本人が選んだ健康教室の参加者と非参加者の比較が観察研究であり交絡が起こりうることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          市が開いた健康教室に自分の意思で参加した人と、参加しなかった人について、1 年後の体重の変化を比べたところ、参加者のほうが平均で多く減っていた。この研究について最も適切な記述はどれか。
        choices:
          - 市が教室を開いたので実験研究であり、体重の差は教室の効果とみなしてよい
          - 対象者の人数が十分に多ければ、体重の差は教室の効果とみなしてよい
          - 市民全員を対象にした全数調査なので、偏りは生じない
          - 無作為に抽出していないので、平均を計算することができない
          - 参加するかどうかを本人が選んでいる観察研究なので、健康への関心の違いなどが差に影響している可能性がある
        answer: 4
        distractors:
          - 教室を開いても、参加者を研究者が割り付けていないので実験研究ではない
          - 人数を増やしても、参加者と非参加者の条件の違い（交絡）はなくならない
          - 比べているのは参加を選んだ人と選ばなかった人で、全数調査かどうかとは別の問題
          - 平均は計算できる。問題は差の解釈である
          - 正解
        explanation: |
          **方針** 処理（教室への参加）を誰が決めたかで、観察研究か実験研究かを判断する。

          **途中式** 参加は本人の意思 → 研究者は割り付けていない → 観察研究。参加する人はもともと健康への関心が高く、食事や運動にも気を付けているかもしれない（交絡）。

          **答え** 観察研究で、健康への関心などが差に影響している可能性がある

          **間違えやすい点** 教室の効果を確かめるには、希望者を無作為に参加群と非参加群（対照群）に分ける実験が必要。人数を増やしても偏りは消えない。
      - id: s01p05b
        chapter: 6
        terms: [cluster-sampling, stratified-sampling, two-stage-sampling]
        topic: 地区を無作為に選び選んだ地区の全世帯を調べる方法が集落抽出法であることを層化抽出や二段抽出と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          市内の全世帯を町丁目（地区）ごとに分け、町丁目をいくつか無作為に選んで、選んだ町丁目に住む全世帯を調査した。この標本抽出の方法はどれか。
        choices:
          - 単純無作為抽出法
          - 系統抽出法
          - 集落抽出法
          - 層化抽出法
          - 二段抽出法
        answer: 2
        distractors:
          - 世帯を直接 1 つずつ無作為に選んではいない
          - 一定の間隔で選ぶ方法ではない
          - 正解
          - 層化抽出はすべての地区（層）から世帯を選ぶ。ここでは一部の地区しか調べていない
          - 二段抽出は選んだ地区の中からさらに世帯を抽出する。ここでは全世帯を調べている
        explanation: |
          **方針** 「まとまり（集落）を選び、その中は全部調べる」のが集落抽出法。

          **途中式** 抽出の単位は町丁目（集落）で、選んだ町丁目の中は全数調査になっている。

          **答え** 集落抽出法

          **間違えやすい点** 層化抽出法はすべての層から標本を取る（層の間の違いを標本に反映させる）。集落抽出法は一部の集落だけを選ぶので、集落の中の世帯が似ていると精度が下がる。選んだ町丁目からさらに世帯を選べば二段抽出法になる。
  - id: s01p06
    title: 部活動と検査の確率
    context: |
      確率の計算を 2 つ考える。
    items:
      - id: s01p06a
        chapter: 7
        terms: [events-and-probability]
        topic: 2つの部活動の所属割合と両方の割合から加法定理と余事象でどちらにも所属しない割合を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある学校の生徒のうち、運動部に所属する生徒は 35%、文化部に所属する生徒は 25%、両方に所属する生徒は 5% である。どちらにも所属していない生徒の割合はどれか。
        choices:
          - '0.40'
          - '0.45'
          - '0.55'
          - '0.60'
          - '0.05'
        answer: 1
        distractors:
          - 両方に所属する 5% を引き忘れて 1 − (0.35 + 0.25) とした
          - 正解
          - 少なくとも一方に所属する割合を答えた
          - 2 つの割合を足しただけ
          - 両方に所属する割合を答えた
        explanation: |
          **方針** 加法定理で「少なくとも一方」を求め、余事象をとる。

          **途中式** $P(A\cup B)=0.35+0.25-0.05=0.55$、どちらにも所属しない割合は $1-0.55=0.45$。

          **答え** 0.45

          **間違えやすい点** 両方に所属する生徒は、運動部の 35% にも文化部の 25% にも数えられているので、1 回分を引く。
      - id: s01p06b
        chapter: 7
        terms: [bayes-theorem, conditional-probability, law-of-total-probability]
        topic: 有病率と感度と特異度から陽性のときに病気である確率をベイズの定理で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある病気の有病率は 2% である。この病気の検査は、病気の人を 90% の確率で陽性と判定し、病気でない人を 95% の確率で陰性と判定する。検査で陽性となった人が実際に病気である確率に最も近いものはどれか。
        choices:
          - '0.90'
          - '0.067'
          - '0.018'
          - '0.27'
          - '0.95'
        answer: 3
        distractors:
          - 病気の人が陽性になる確率（感度）と取り違えた
          - 陽性になる確率（全体）を答えた
          - 「病気で、かつ陽性」の確率を答え、陽性の確率で割っていない
          - 正解
          - 病気でない人が陰性になる確率（特異度）を答えた
        explanation: |
          **方針** $P(\text{病気}\mid\text{陽性})=\dfrac{P(\text{病気})P(\text{陽性}\mid\text{病気})}{P(\text{陽性})}$。分母は全確率の公式で求める。

          **途中式**
          - $P(\text{病気かつ陽性})=0.02\times 0.90=0.018$
          - $P(\text{病気でなく陽性})=0.98\times 0.05=0.049$
          - $P(\text{陽性})=0.018+0.049=0.067$、$0.018/0.067\approx 0.27$

          **答え** 0.27

          **間違えやすい点** 有病率が低いと、病気でない人の中の偽陽性（0.049）が病気の人の陽性（0.018）より多くなり、陽性でも病気である確率は 3 割に満たない。$P(\text{陽性}\mid\text{病気})$ と $P(\text{病気}\mid\text{陽性})$ は別のもの。
  - id: s01p07
    title: 確率変数の期待値と分散
    context: |
      確率変数の期待値と分散を考える。
    items:
      - id: s01p07a
        chapter: 8
        terms: [expectation-variance-properties, probability-mass-and-density-function]
        topic: 確率分布表から離散型確率変数の期待値と分散を求め2乗の期待値や標準偏差と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          確率変数 $X$ の確率分布が次のとおりであるとき、期待値 $E[X]$ と分散 $V[X]$ の組合せとして正しいものはどれか。

          | $X$ | 0 | 1 | 2 | 3 |
          |---|---|---|---|---|
          | 確率 | 0.1 | 0.3 | 0.4 | 0.2 |
        choices:
          - $E[X]=1.7,\ V[X]=0.81$
          - $E[X]=1.5,\ V[X]=1.25$
          - $E[X]=1.7,\ V[X]=3.70$
          - $E[X]=1.7,\ V[X]=0.90$
          - $E[X]=1.7,\ V[X]=2.89$
        answer: 0
        distractors:
          - 正解
          - 確率を無視して 0〜3 を同じ重みで扱った
          - $E[X^2]$ を分散とした
          - 標準偏差（0.9）を分散とした
          - $(E[X])^2$ を分散とした
        explanation: |
          **方針** $E[X]=\sum x\,p(x)$、$V[X]=E[X^2]-(E[X])^2$。

          **途中式**
          - $E[X]=0\times 0.1+1\times 0.3+2\times 0.4+3\times 0.2=1.7$
          - $E[X^2]=0+0.3+1.6+1.8=3.7$
          - $V[X]=3.7-1.7^2=3.7-2.89=0.81$

          **答え** $E[X]=1.7,\ V[X]=0.81$

          **間違えやすい点** 分散は $E[X^2]$ から $(E[X])^2$ を引く。標準偏差は $\sqrt{0.81}=0.9$ で、分散と取り違えない。
      - id: s01p07b
        chapter: 8
        terms: [expectation-variance-properties, sum-of-random-variables]
        topic: 独立な2つの確率変数の1次結合の分散を係数の2乗を掛けて足して求める
        level: 応用
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$ は独立で、$V[X]=4$、$V[Y]=9$ である。$V[2X-3Y]$ はいくらか。
        choices:
          - '−65'
          - '13'
          - '35'
          - '25'
          - '97'
        answer: 4
        distractors:
          - 分散も引き算した（$2^2\times 4-3^2\times 9$）
          - 係数を無視して分散を足した
          - 係数を 2 乗せずに掛けた（$2\times 4+3\times 9$）
          - 標準偏差の差 $2\times 2-3\times 3$ を 2 乗した
          - 正解
        explanation: |
          **方針** 独立なら $V[aX+bY]=a^2V[X]+b^2V[Y]$。$b=-3$ でも $b^2=9$ で足し算になる。

          **途中式** $V[2X-3Y]=2^2\times 4+(-3)^2\times 9=16+81=97$

          **答え** 97

          **間違えやすい点** 差の分散も「足し算」になる（ばらつきは打ち消し合わない）。分散は負にならないので、−65 はすぐに誤りとわかる。
  - id: s01p08
    title: 二項分布と正規分布
    context: |
      必要なら次の値を使ってよい：$0.2^2=0.04$、$0.8^3=0.512$、標準正規分布 $Z$ について $P(Z>0.5)=0.3085$、$P(Z>1.5)=0.0668$。
    items:
      - id: s01p08a
        chapter: 9
        terms: [binomial-distribution, counting]
        topic: 不良率0.2の製品を5個調べたとき不良品がちょうど2個である二項確率を二項係数を含めて求める
        level: 基本
        definition: false
        type: choice
        question: |
          不良品の割合が 0.2 の製造工程から、製品を 5 個無作為に取り出す。不良品がちょうど 2 個である確率に最も近いものはどれか。
        choices:
          - '0.020'
          - '0.040'
          - '0.205'
          - '0.942'
          - '0.263'
        answer: 2
        distractors:
          - 二項係数 $\binom{5}{2}=10$ を掛け忘れた（$0.04\times 0.512$）
          - 2 個が不良品である確率 $0.2^2$ だけを計算した
          - 正解
          - 2 個以下である確率 $P(X\le 2)$ を答えた
          - 2 個以上である確率 $P(X\ge 2)$ を答えた
        explanation: |
          **方針** 不良品の個数 $X$ は二項分布 $B(5,\ 0.2)$ にしたがう。

          **途中式** $P(X=2)=\binom{5}{2}(0.2)^2(0.8)^3=10\times 0.04\times 0.512=0.2048$

          **答え** 0.205

          **間違えやすい点** 5 個のうちどの 2 個が不良品かの選び方 $\binom{5}{2}=10$ 通りを掛ける。「ちょうど 2 個」と「2 個以下」「2 個以上」を区別する。
      - id: s01p08b
        chapter: 9
        terms: [normal-distribution, standard-normal-distribution]
        topic: 平均60標準偏差10の正規分布の区間確率を標準化して上側確率の表の値から求める
        level: 標準
        definition: false
        type: choice
        question: |
          あるテストの得点 $X$ は正規分布 $N(60,\ 10^2)$ にしたがう。$P(55<X<75)$ に最も近いものはどれか。
        choices:
          - '0.6247'
          - '0.3753'
          - '0.2417'
          - '0.6915'
          - '0.9332'
        answer: 0
        distractors:
          - 正解
          - 区間の外側の確率（両側の裾の和）を答えた
          - 2 つの上側確率の差をとった
          - $P(X>55)$（＝$P(Z>-0.5)$）だけを求めた
          - $P(X<75)$（＝$P(Z<1.5)$）だけを求めた
        explanation: |
          **方針** 標準化して $P(-0.5<Z<1.5)$ を求める。

          **途中式**
          - $(55-60)/10=-0.5$、$(75-60)/10=1.5$
          - $P(Z<-0.5)=P(Z>0.5)=0.3085$、$P(Z>1.5)=0.0668$
          - $1-0.3085-0.0668=0.6247$

          **答え** 0.6247

          **間違えやすい点** 下側の裾は対称性から $P(Z<-0.5)=P(Z>0.5)$。区間の確率は 1 から両側の裾を引く。
  - id: s01p09
    title: 標本平均と標本比率の分布
