          **間違えやすい点** 表の他の行でも、$3.20/1.10\approx 2.91$、$-0.080/0.050=-1.60$ と確かめられる。
      - id: s01p13b
        chapter: 14
        terms: [regression-output, multiple-regression-model, p-value]
        topic: 重回帰の出力から築年数の係数の意味と有意性を読み取り係数の大きさやp値の誤った解釈と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          この出力の解釈として正しいものはどれか。
        choices:
          - 築年数の係数は負なので、有意水準 5% で、築年数が家賃を下げる効果があるといえる
          - 面積の係数（0.150）は築年数の係数より絶対値が大きいので、面積のほうが家賃への影響が大きい
          - 切片 3.20 は、面積 1 m²・築年数 1 年の物件の家賃の予測値である
          - 築年数の p 値 0.124 は、築年数の係数が 0 である確率が 12.4% であることを表す
          - 面積が同じなら、築年数が 1 年増えると家賃は平均 0.08 万円下がると推定されるが、有意水準 5% では有意とはいえない
        answer: 4
        distractors:
