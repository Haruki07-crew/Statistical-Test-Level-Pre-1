          - 残差の自由度を $n-p=23$ とした
          - 分子と分母の自由度を逆にした
        explanation: |
          **方針** $\bar R^2=1-(1-R^2)\dfrac{n-1}{n-p-1}$（$n=25$、説明変数 $p=2$）。

          **途中式** $1-0.28\times\dfrac{24}{22}=1-0.3055\approx 0.695$

