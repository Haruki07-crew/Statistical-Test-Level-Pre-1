          **途中式** 築年数の係数 −0.080、p 値 0.124 ＞ 0.05。

          **答え** 面積が同じなら築年数 1 年で平均 0.08 万円下がると推定されるが、有意とはいえない

          **間違えやすい点** 有意でないことは「効果がない」ことの証明ではない。係数の比較は t 値や標準化した係数で行う。
      - id: s01p13c
        chapter: 14
        terms: [adjusted-r-squared, regression-output]
        topic: データ数25で説明変数2個の重回帰の決定係数0.72から自由度調整済み決定係数を求める
