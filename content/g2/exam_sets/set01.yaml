          - 係数の大きさは単位に依存するので、それだけでは影響の大小を比べられない
          - 切片は面積 0・築年数 0 のときの予測値
          - p 値は「係数が 0 のとき、これ以上極端な t 値が出る確率」で、係数が 0 である確率ではない
          - 正解
