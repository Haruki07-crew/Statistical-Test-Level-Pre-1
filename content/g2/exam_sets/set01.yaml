    items:
      - id: s01p09a
        chapter: 10
        terms: [sampling-distribution-of-mean, standard-error]
        topic: 母標準偏差15の母集団から25個取った標本平均の標準偏差を求め母標準偏差やn−1で割った値と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          母平均 200、母標準偏差 15 の母集団から、大きさ 25 の標本を無作為に抽出する。標本平均の標準偏差はいくらか。
        choices:
          - '0.60'
          - '3.00'
          - '15.00'
          - '9.00'
          - '3.06'
        answer: 1
        distractors:
          - 母標準偏差を $n$ で割った
          - 正解
          - 母標準偏差をそのまま答えた
          - 母分散を $n$ で割った値（標本平均の分散）を答えた
          - $\sqrt{n-1}$ で割った
        explanation: |
          **方針** 標本平均の標準偏差は $\sigma/\sqrt n$。

          **途中式** $15/\sqrt{25}=15/5=3$

          **答え** 3.00

          **間違えやすい点** 分散が $\sigma^2/n=9$ で、その平方根が標準偏差 3。$n$ で割るのは分散のほう。
      - id: s01p09b
        chapter: 10
        terms: [normal-approximation-binomial-poisson, continuity-correction]
        topic: 公正な硬貨を100回投げて表が60回以上出る確率を連続修正つきの正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          公正な硬貨を 100 回投げるとき、表が 60 回以上出る確率を、連続修正を行った正規近似で求めると、どれに最も近いか。
        choices:
          - '0.0228'
          - '0.0179'
          - '0.0446'
          - '0.0287'
          - '0.9713'
        answer: 3
        distractors:
          - 連続修正をしなかった（60 で標準化）
          - 修正の向きを逆にした（60.5 で標準化。「60 回を超える」確率）
          - 58.5 で標準化した
          - 正解
          - 59 回以下の確率（1 − 0.0287）を答えた
        explanation: |
          **方針** 表の回数 $X\sim B(100,\ 0.5)$ は平均 50、標準偏差 $\sqrt{100\times 0.5\times 0.5}=5$ の正規分布で近似する。「60 回以上」は連続修正で 59.5 以上とする。

          **途中式** $(59.5-50)/5=1.9$、$P(Z>1.9)=0.0287$

          **答え** 0.0287

          **間違えやすい点** 整数の値 60 は区間 [59.5, 60.5) にあたるので、「60 以上」は 59.5 から。修正しないと 0.0228 になる（正確な二項確率は約 0.028）。
      - id: s01p09c
        chapter: 10
        terms: [t-distribution, sampling-distribution-of-mean, chi-squared-distribution]
        topic: 正規母集団の標本平均を標本標準偏差で標準化した統計量が自由度n−1のt分布にしたがうことを答える
        level: 標準
        definition: true
        type: choice
        question: |
          正規母集団 $N(\mu,\sigma^2)$ から大きさ 10 の標本を抽出し、標本平均を $\bar X$、不偏分散の平方根を $S$ とする。統計量 $T=\dfrac{\bar X-\mu}{S/\sqrt{10}}$ がしたがう分布はどれか。
        choices:
          - 標準正規分布
          - 自由度 10 の t 分布
          - 自由度 10 のカイ二乗分布
          - 自由度 9 のカイ二乗分布
          - 自由度 9 の t 分布
        answer: 4
        distractors:
          - σ が既知で σ を使ったときの分布。S で置き換えると裾が重くなる
          - 自由度は標本の大きさ 10 ではなく 10 − 1
          - カイ二乗分布は正の値だけをとる分布で、分散の統計量にかかわる
          - $(n-1)S^2/\sigma^2$ がしたがう分布
          - 正解
        explanation: |
          **方針** 母標準偏差 σ の代わりに標本の $S$ を使うと、標準化した統計量は t 分布にしたがう。

          **途中式** 自由度は $n-1=9$。

          **答え** 自由度 9 の t 分布

          **間違えやすい点** σ を使えば標準正規分布。$(n-1)S^2/\sigma^2$ は自由度 $n-1$ のカイ二乗分布。自由度は $n$ ではなく $n-1$。
  - id: s01p10
    title: 区間推定
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$z_{0.005}=2.576$、$t_{0.025}(15)=2.131$、$t_{0.025}(16)=2.120$、$t_{0.05}(15)=1.753$。ただし $z_\alpha$、$t_\alpha(m)$ は標準正規分布・自由度 $m$ の t 分布の上側 $\alpha$ 点。
    items:
      - id: s01p10a
        chapter: 11
        terms: [ci-mean-known-variance, confidence-interval]
        topic: 母標準偏差が既知の正規母集団で36個の標本平均から母平均の95パーセント信頼区間を求める
        level: 基本
        definition: false
        type: choice
        question: |
          母標準偏差が 6 であることがわかっている正規母集団から、大きさ 36 の標本を抽出したところ、標本平均は 50 だった。母平均の 95% 信頼区間はどれか。
        choices:
          - (48.04, 51.96)
          - (48.36, 51.65)
          - (38.24, 61.76)
          - (49.67, 50.33)
          - (47.42, 52.58)
        answer: 0
        distractors:
          - 正解
          - 上側 5% 点 1.645 を使った（90% 信頼区間）
          - 標準誤差の代わりに母標準偏差 6 をそのまま使った
          - 母標準偏差を $\sqrt n$ ではなく $n$ で割った
          - 上側 0.5% 点 2.576 を使った（99% 信頼区間）
        explanation: |
          **方針** $\bar x\pm z_{0.025}\,\sigma/\sqrt n$。

          **途中式** 標準誤差 $6/\sqrt{36}=1$、$50\pm 1.96\times 1$

          **答え** (48.04, 51.96)

          **間違えやすい点** 95% の両側なので上側 2.5% 点 1.96 を使う。母標準偏差は標本の大きさの平方根で割る。
      - id: s01p10b
        chapter: 11
        terms: [ci-mean-unknown-variance, t-distribution]
        topic: 母分散が未知の正規母集団で16個の標本から自由度15のt分布の点を使って母平均の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 16 の標本を抽出したところ、標本平均 72、標本標準偏差（不偏分散の平方根）8 だった。母分散は未知である。母平均の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (68.08, 75.92)
          - (67.76, 76.24)
          - (67.74, 76.26)
          - (54.95, 89.05)
          - (68.49, 75.51)
        answer: 2
        distractors:
          - 母分散が未知なのに標準正規分布の 1.96 を使った
          - 自由度を 16 とした（$t_{0.025}(16)=2.120$）
          - 正解
          - 標準誤差の代わりに標本標準偏差 8 をそのまま使った
          - 上側 5% 点 $t_{0.05}(15)$ を使った（90% 信頼区間）
        explanation: |
          **方針** 母分散が未知なので $\bar x\pm t_{0.025}(n-1)\,s/\sqrt n$。

          **途中式** 標準誤差 $8/\sqrt{16}=2$、$t_{0.025}(15)=2.131$、$72\pm 2.131\times 2=72\pm 4.262$

          **答え** (67.74, 76.26)

          **間違えやすい点** 自由度は $n-1=15$。標本が小さいときは t 分布の点が 1.96 より大きく、区間は広くなる。
      - id: s01p10c
        chapter: 11
        terms: [ci-proportion, standard-error]
        topic: 400人中120人という標本比率から正規近似で母比率の95パーセント信頼区間を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある市の有権者から無作為に 400 人を選んだところ、120 人がある政策に賛成した。賛成する人の母比率の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (0.262, 0.338)
          - (0.251, 0.349)
          - (0.299, 0.301)
          - (0.241, 0.359)
          - (0.255, 0.345)
        answer: 4
        distractors:
          - 1.645 を使った（90% 信頼区間）
          - 標本比率の代わりに 0.5 を使って標準誤差を計算した
          - 標準誤差の計算で平方根をとらなかった（$0.3\times 0.7/400$ をそのまま使った）
          - 2.576 を使った（99% 信頼区間）
          - 正解
        explanation: |
          **方針** $\hat p\pm 1.96\sqrt{\hat p(1-\hat p)/n}$。

          **途中式** $\hat p=120/400=0.3$、$\sqrt{0.3\times 0.7/400}=\sqrt{0.000525}\approx 0.0229$、$1.96\times 0.0229\approx 0.045$

          **答え** (0.255, 0.345)

          **間違えやすい点** 標準誤差は $\hat p(1-\hat p)/n$ の平方根。信頼係数と上側確率点の対応（90%→1.645、95%→1.96、99%→2.576）を確認する。
      - id: s01p10d
        chapter: 11
        terms: [required-sample-size, ci-proportion]
        topic: 母比率の見当がないとき95パーセント信頼区間の幅の半分を0.03以下にするのに必要な標本の大きさを求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある意見に賛成する人の割合を調べたい。母比率の見当がまったくつかないとき、95% 信頼区間の幅の半分（誤差の範囲）を 0.03 以下にするために必要な標本の大きさの最小値はどれか。
        choices:
          - '1067'
          - '1068'
          - '752'
          - '2135'
          - '33'
        answer: 1
        distractors:
          - 1067.1 を切り捨てた（これでは条件を満たさない）
          - 正解
          - 1.645（90%）を使った
          - $p(1-p)$ の代わりに $p=0.5$ を使った
          - $(1.96/0.03)$ を 2 乗しなかった
        explanation: |
          **方針** $1.96\sqrt{p(1-p)/n}\le 0.03$ を $n$ について解く。$p(1-p)$ は $p=0.5$ で最大の 0.25 なので、見当がないときは 0.25 を使う。

          **途中式** $n\ge\left(\dfrac{1.96}{0.03}\right)^2\times 0.25=65.33^2\times 0.25\approx 1067.1$

          **答え** 1068

          **間違えやすい点** 条件を満たす最小の整数なので、小数は切り上げる。誤差の範囲を半分にするには、標本は 4 倍必要になる。
  - id: s01p11
    title: 1 つの母集団の検定
    context: |
      必要なら次の値を使ってよい：$t_{0.025}(8)=2.306$、$t_{0.05}(8)=1.860$、$z_{0.05}=1.645$、$z_{0.025}=1.96$、$z_{0.005}=2.576$。
    items:
      - id: s01p11a
        chapter: 12
        terms: [type-i-and-ii-errors, significance-level]
        topic: 第1種の過誤の意味を第2種の過誤や検出力と区別して答える
        level: 基本
        definition: true
        type: choice
        question: |
          仮説検定における「第 1 種の過誤」を説明したものはどれか。
        choices:
          - 帰無仮説が誤っているのに、棄却しない誤り
          - 対立仮説が正しいのに、対立仮説を棄却する誤り
          - 帰無仮説が誤っているときに、それを正しく棄却する確率
          - 帰無仮説が正しいのに、棄却してしまう誤り
          - p 値が有意水準を上回る確率
        answer: 3
        distractors:
          - 第 2 種の過誤の説明
          - 対立仮説を棄却するという手順はない。内容は第 2 種の過誤にあたる
          - 検出力の説明
          - 正解
          - 過誤の定義ではない
        explanation: |
          **方針** 帰無仮説が「正しいとき」に起こる誤りが第 1 種、「誤っているとき」に起こる誤りが第 2 種。

          **途中式** 第 1 種の過誤の確率は有意水準 α で、検定を行う人があらかじめ決める。

          **答え** 帰無仮説が正しいのに、棄却してしまう誤り

          **間違えやすい点** 第 2 種の過誤の確率を β とすると、検出力は $1-\beta$。有意水準を小さくすると第 1 種の過誤は減るが、第 2 種の過誤は増える。
      - id: s01p11b
        chapter: 12
        terms: [one-sample-t-test, rejection-region]
        topic: 内容量9袋の平均と標本標準偏差から1標本t統計量を求め自由度8の両側5パーセントの点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          内容量が 500 g と表示された菓子袋を 9 袋無作為に選んで量ったところ、平均 497 g、標本標準偏差（不偏分散の平方根）4.5 g だった。内容量は正規分布にしたがうとする。「母平均は 500 g」を帰無仮説とし、有意水準 5% の両側検定を行うときの結果として正しいものはどれか。
        choices:
          - t ＝ −2.0 で、|t| ＜ 2.306 なので棄却しない
          - t ＝ −2.0 で、|t| ＞ 1.96 なので棄却する
          - t ＝ −2.0 で、|t| ＞ 1.860 なので棄却する
          - t ＝ −0.67 で、棄却しない
          - t ＝ −6.0 で、棄却する
        answer: 0
        distractors:
          - 正解
          - 母分散が未知なのに標準正規分布の点を使った
          - 両側検定なのに片側 5% の点 $t_{0.05}(8)$ を使った
          - 標本標準偏差を $\sqrt n$ で割らなかった
          - 標本標準偏差を $\sqrt n$ ではなく $n$ で割った
        explanation: |
          **方針** $t=\dfrac{\bar x-\mu_0}{s/\sqrt n}$ を、自由度 $n-1=8$ の t 分布の上側 2.5% 点と比べる。

          **途中式** $t=\dfrac{497-500}{4.5/3}=\dfrac{-3}{1.5}=-2.0$。$|t|=2.0<2.306$。

          **答え** t ＝ −2.0 で、棄却しない

          **間違えやすい点** 標本が小さく母分散が未知なので、1.96 ではなく t 分布の点を使う。棄却しないことは「500 g である」と証明したことではない。
      - id: s01p11c
        chapter: 12
        terms: [proportion-test, one-sided-two-sided-test, p-value]
        topic: 400個中30個の不良から帰無仮説の比率0.05を使ったz統計量を求め上側片側5パーセントで判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある工程の不良率は 0.05 以下とされている。製品 400 個を無作為に調べたところ 30 個が不良だった。「不良率は 0.05」を帰無仮説、「不良率は 0.05 より大きい」を対立仮説とし、正規近似を用いて有意水準 5% で検定する。正しいものはどれか。
        choices:
          - z ≈ 211 で、棄却する
          - z ≈ 0.11 で、棄却しない
          - z ≈ 2.29 で、棄却する
          - z ≈ 2.29 で、2.576 より小さいので棄却しない
          - z ≈ 2.29 で、p 値は約 0.989 なので棄却しない
        answer: 2
        distractors:
          - 標準誤差の平方根をとらず、分散 0.05×0.95/400 で割った
          - 標準誤差の計算で $n$ で割らなかった
          - 正解
          - 片側 5% の検定なのに、両側 1% の点 2.576 と比べた
          - $P(Z<2.29)$ を p 値とした（片側の上側確率は約 0.011）
        explanation: |
          **方針** 帰無仮説のもとでの標準誤差 $\sqrt{0.05\times 0.95/400}$ で標準化し、上側 5% 点 1.645 と比べる。

          **途中式** $\hat p=30/400=0.075$、$\sqrt{0.05\times 0.95/400}\approx 0.0109$、$z=(0.075-0.05)/0.0109\approx 2.29>1.645$

          **答え** z ≈ 2.29 で、棄却する

          **間違えやすい点** 検定では帰無仮説の値 0.05 を使って標準誤差を計算する。対立仮説が「大きい」なので上側の片側検定で、p 値は $P(Z>2.29)\approx 0.011$。
  - id: s01p12
    title: 2 つの母集団の比較
    context: |
      必要なら次の値を使ってよい：$\chi^2_{0.05}(1)=3.841$、$\chi^2_{0.05}(4)=9.488$、$F_{0.05}(10,8)=3.347$、$F_{0.025}(10,8)=4.295$、$F_{0.025}(8,10)=3.855$。
    items:
      - id: s01p12a
        chapter: 13
        terms: [paired-t-test, standard-error]
        topic: 6人の運動前後の体重の差から対応のあるt統計量を差の不偏分散を使って求める
        level: 標準
        definition: false
        type: choice
        question: |
          6 人が 1 か月の運動プログラムに参加し、前後の体重（kg）を測った。

          | 参加者 | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | 前 | 70 | 68 | 75 | 80 | 72 | 66 |
          | 後 | 67 | 63 | 76 | 76 | 70 | 61 |

          差（前 − 後）の平均は 3、差の不偏分散は 5.2 である。対応のある t 検定の検定統計量に最も近いものはどれか。
        choices:
          - '1.32'
          - '7.89'
          - '3.53'
          - '1.41'
          - '3.22'
        answer: 4
        distractors:
          - 差の標準偏差を $\sqrt n$ で割らなかった
          - 差の標準偏差を $\sqrt n$ ではなく $n$ で割った
          - 差の分散を $n-1$ ではなく $n$ で割って求め直した
          - 差の標準偏差の代わりに分散 5.2 を使った
          - 正解
        explanation: |
          **方針** 差 $d$ の 1 標本 t 検定：$t=\bar d/(s_d/\sqrt n)$。

          **途中式** $s_d=\sqrt{5.2}\approx 2.280$、$s_d/\sqrt 6\approx 0.931$、$t=3/0.931\approx 3.22$

          **答え** 3.22

          **間違えやすい点** 同じ人の前後を比べるので、2 標本の t 検定ではなく差について検定する。自由度は $6-1=5$。
      - id: s01p12b
        chapter: 13
        terms: [independence-test, expected-frequency, pearson-chi-square-statistic]
        topic: 2行2列のクロス表から期待度数を求めて独立性のカイ二乗統計量を計算し自由度1の点と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          ある商品の広告を見たかどうかと、商品を買ったかどうかを 100 人に調べた。

          | | 買った | 買わない |
          |---|---|---|
          | 広告を見た | 30 | 20 |
          | 見ていない | 20 | 30 |

          独立性のカイ二乗検定（連続修正なし、有意水準 5%）の結果として正しいものはどれか。
        choices:
          - χ² ＝ 2.0 で、棄却しない
          - χ² ＝ 4.0 で、棄却する
          - χ² ＝ 4.0 で、9.488 より小さいので棄却しない
          - χ² ＝ 0.16 で、棄却しない
          - χ² ＝ 100 で、棄却する
        answer: 1
        distractors:
          - 4 つのセルのうち 2 つしか足していない
          - 正解
          - 自由度を 4 とした（2×2 表の自由度は (2−1)(2−1)=1）
          - 差の 2 乗を期待度数の 2 乗で割った
          - (観測度数 − 期待度数)² を期待度数で割らなかった
        explanation: |
          **方針** 期待度数は 行の合計 × 列の合計 ÷ 総数。統計量 $\sum (O-E)^2/E$ を自由度 1 の上側 5% 点と比べる。

          **途中式** 期待度数はすべて $50\times 50/100=25$。各セル $(5)^2/25=1$ で、合計 $\chi^2=4.0>3.841$。

          **答え** χ² ＝ 4.0 で、棄却する

          **間違えやすい点** 2×2 表の自由度は 1。棄却されても「広告が購入の原因」とまではいえない（観察データの関連）。
      - id: s01p12c
        chapter: 13
        terms: [f-test-equal-variances, f-distribution]
        topic: 2群の不偏分散の比からF統計量を求め両側5パーセントの等分散の検定で自由度の順に注意して判断する
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの正規母集団から、大きさ 11 と 9 の標本を抽出したところ、不偏分散はそれぞれ 36 と 12 だった。「2 つの母分散は等しい」を帰無仮説とし、有意水準 5% の両側検定を行う（大きいほうの不偏分散を分子にした F 統計量を使う）。検定統計量と比べるべき F 分布の点と、検定の結論の組合せとして正しいものはどれか。
        choices:
          - $F_{0.05}(10,8)=3.347$ と比べて、棄却しない
          - $F_{0.025}(8,10)=3.855$ と比べて、棄却しない
          - $F_{0.05}(10,8)=3.347$ と比べて、棄却する
          - $F_{0.025}(10,8)=4.295$ と比べて、棄却しない
          - $F_{0.025}(10,8)=4.295$ と比べて、棄却する
        answer: 3
        distractors:
          - 両側検定なのに上側 5% 点と比べた
          - 分子と分母の自由度を逆にした
          - 両側検定なのに上側 5% 点と比べ、さらに F ＝ 3.0 が 3.347 より小さいのに棄却とした
          - 正解
          - F ＝ 3.0 は 4.295 より小さいので棄却できない
        explanation: |
          **方針** $F=s_1^2/s_2^2$ は、帰無仮説のもとで自由度 $(n_1-1,\ n_2-1)=(10,\ 8)$ の F 分布にしたがう。大きいほうを分子にした両側 5% の検定では、上側 2.5% 点と比べる。

          **途中式** $F=36/12=3.0<F_{0.025}(10,8)=4.295$

          **答え** $F_{0.025}(10,8)=4.295$ と比べて、棄却しない（F ＝ 3.0）

          **間違えやすい点** 自由度は分子の標本から順に $(10,\ 8)$。両側検定で大きいほうを分子にするときは上側 $\alpha/2$ 点を使う。
  - id: s01p13
    title: 家賃の重回帰分析
    context: |
