set: 11
title: 2級 模擬試験 第11回
minutes: 90
problems:
  - id: s11p01
    title: グラフと累積相対度数
    context: |
      グラフや度数分布表から読み取る。
    items:
      - id: s11p01a
        chapter: 1
        terms: [bar-pie-band-chart, official-statistics]
        topic: 縦軸が0から始まらない折れ線グラフでは小さな変化が大きく見えることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある会社の売上を示す折れ線グラフは、縦軸の目盛りが 95 億円から 101 億円までで、売上が 96 億円から 100 億円へ急に伸びたように見えた。このグラフの読み方として最も適切なものはどれか。
        choices:
          - グラフの傾きが急なので、売上はおよそ 2 倍になった
          - 折れ線グラフでは、縦軸の範囲を変えても見た目の印象は変わらない
          - 縦軸が 0 から始まっていないので、このグラフから増えたか減ったかは判断できない
          - 縦軸が 0 から始まっていないので変化が大きく見えている。実際の増加は約 4% で、増加率で確かめる
          - 傾きが急なので、来年も同じ勢いで伸びると判断できる
        answer: 3
        distractors:
          - 見た目の傾きを倍率と取り違えている（96 → 100 は約 1.04 倍）
          - 縦軸の範囲を狭めると、同じ変化でも傾きが急に見える
          - 増えたか減ったかは目盛りを読めば判断できる。問題は変化の大きさの印象
          - 正解
          - グラフの傾きから将来の伸びは判断できない
        explanation: |
          **方針** 縦軸の範囲が狭いと、小さな変化でも傾きが急に見える。目盛りの値で変化の大きさを確かめる。

          **途中式** $(100-96)/96\approx 0.042$ で、増加は約 4% である。

          **答え** 縦軸が 0 から始まっていないので変化が大きく見えている。増加は約 4%

          **間違えやすい点** 縦軸を省略すること自体は誤りではないが、見た目の傾きを変化の大きさと思い込まないようにする。
      - id: s11p01b
        chapter: 1
        terms: [cumulative-frequency, frequency-distribution-histogram]
        topic: 累積相対度数の表で中央値を含む階級の中を直線で補間して中央値の近似値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある会社の社員の通勤時間（分）の累積相対度数は、10 分未満 0.15、20 分未満 0.40、30 分未満 0.70、40 分未満 0.90、50 分未満 1.00 だった。各階級の中ではデータが均等に散らばっていると考えて、中央値の近似値を求めよ。
        choices:
          - 25.0 分
          - 20.0 分
          - 約 26.7 分
          - 約 23.3 分
          - 30.0 分
        answer: 3
        distractors:
          - 中央値を含む階級の階級値をそのまま答えている
          - 中央値を含む階級の下の端を答えている
          - 補間の向きを逆にしている（30 分未満の 0.70 から 0.5 までの差 0.20 を下の端に足している）
          - 正解
          - 累積相対度数が 0.5 を超える階級の上の端を答えている
        explanation: |
          **方針** 累積相対度数が 0.5 になる位置を探す。0.40（20 分）と 0.70（30 分）の間にある。

          **途中式** 20〜30 分の階級に 0.30 が入っているので、0.5 までの残り $0.5-0.40=0.10$ は階級の幅の $0.10/0.30=1/3$ にあたる。中央値 $\approx 20+10\times\dfrac13\approx 23.3$ 分。

          **答え** 約 23.3 分

          **間違えやすい点** 階級値（25 分）で代用するのは粗い近似。補間するときは、階級の下の端から「残りの割合 ÷ 階級の相対度数」だけ進む。
  - id: s11p02
    title: 散らばりの指標の計算と性質
    context: |
      データの散らばりを数値やグラフでまとめる。
    items:
      - id: s11p02a
        chapter: 2
        terms: [sample-variance-sd]
        topic: 8個のデータの平均と偏差の2乗から標準偏差をnで割って求め分散や平均偏差と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          8 個のデータ 2, 4, 4, 4, 5, 5, 7, 9 の標準偏差（偏差の 2 乗の和を $n=8$ で割った分散の平方根）を求めよ。
        choices:
          - "4"
          - 約 2.14
          - "1.5"
          - "32"
          - "2"
        answer: 4
        distractors:
          - 分散を答えている（平方根をとっていない）
          - n−1 = 7 で割っている
          - 偏差の絶対値の平均（平均偏差）を求めている
          - 偏差の 2 乗の和をそのまま答えている
          - 正解
        explanation: |
          **方針** 平均を求め、偏差の 2 乗の平均の平方根をとる。

          **途中式** 平均は $40/8=5$。偏差の 2 乗は 9, 1, 1, 1, 0, 0, 4, 16 で和は 32。分散は $32/8=4$、標準偏差は $\sqrt4=2$。

          **答え** 2

          **間違えやすい点** 分散（4）と標準偏差（2）を取り違えない。$n-1$ で割ると約 2.14 になる。問題文がどちらで割るかを指定しているか確かめる。
      - id: s11p02b
        chapter: 2
        terms: [sample-variance-sd, mean-median-mode]
        topic: 平均と同じ値のデータを1個加えたときに平均は変わらず偏差平方和も変わらないので標準偏差が小さくなることを計算する
        level: 応用
        definition: false
        type: choice
        question: |
          9 個のデータの平均は 50、標準偏差（$n$ で割る）は 6 だった。ここに値 50 のデータを 1 個加えて 10 個にした。10 個のデータの標準偏差（$n$ で割る）を求めよ。
        choices:
          - 約 5.69
          - "6.00"
          - "5.40"
          - 約 6.32
          - "32.4"
        answer: 0
        distractors:
          - 正解
          - 平均と同じ値なので散らばりは変わらないと考えている
          - 標準偏差に 9/10 を掛けている（分散ではなく標準偏差を縮めている）
          - 逆に 10/9 倍して散らばりが大きくなると考えている
          - 分散を答えている
        explanation: |
          **方針** 偏差の 2 乗の和がどう変わるかを考える。加えた値は平均と同じなので、平均も偏差の 2 乗の和も変わらない。

          **途中式** 9 個の偏差の 2 乗の和は $9\times 6^2=324$。加えた値の偏差は 0 なので、10 個でも 324。分散は $324/10=32.4$、標準偏差は $\sqrt{32.4}\approx 5.69$。

          **答え** 約 5.69

          **間違えやすい点** 平均と同じ値を加えても「散らばりが変わらない」わけではない。割る数が増えるので、標準偏差は小さくなる。
      - id: s11p02c
        chapter: 2
        terms: [box-plot, distribution-shape]
        topic: 箱ひげ図からは分布の山が1つか2つかがわからないことを判断する
        level: 基本
        definition: true
        type: choice
        question: |
          あるデータを箱ひげ図に表した（外れ値の基準は使わず、ひげは最小値と最大値まで）。この箱ひげ図**だけ**からはわからないものはどれか。
        choices:
          - 中央値
          - 分布の山が 1 つか 2 つか
          - 四分位範囲
          - 範囲（最大値 − 最小値）
          - 中央値が箱の中でどちらに寄っているか
        answer: 1
        distractors:
          - 箱の中の線の位置で読み取れる
          - 正解
          - 箱の長さで読み取れる
          - ひげの両端の差で読み取れる
          - 箱の中の線の位置で読み取れる（分布の偏りの目安になる）
        explanation: |
          **方針** 箱ひげ図は 5 つの値（最小値・第 1 四分位数・中央値・第 3 四分位数・最大値）だけで描かれる。

          **途中式** 中央値・四分位範囲・範囲・中央値の位置はこの 5 つから読める。山がいくつあるかは 5 つの値には表れない。

          **答え** 分布の山が 1 つか 2 つか

          **間違えやすい点** 山が 2 つある分布でも、山が 1 つの分布と同じ箱ひげ図になることがある。分布の形を見るにはヒストグラムも描く。
  - id: s11p03
    title: 相関と回帰の解釈
    context: |
      2 つの量的変数の関係を読み取る。
    items:
      - id: s11p03a
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 選抜で範囲が狭められた集団では相関係数が弱く出ることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある大学で、入学試験の得点と入学後 1 年間の成績の相関係数を合格者だけで計算したところ 0.15 と小さかった。この結果の解釈として最も適切なものはどれか。
        choices:
          - 入試の得点は、入学後の成績とまったく関係がないことが示された
          - 合格者は入試の得点が高い人だけに限られ、得点の範囲が狭いので、受験者全体より相関が弱く出ている可能性がある
          - 合格者だけで計算しても、受験者全体で計算しても、相関係数は同じになる
          - 範囲を狭めると、相関係数は必ず大きくなる
          - 相関係数が 0.15 なので、入試の得点が高い人ほど入学後の成績が低い
        answer: 1
        distractors:
          - 選抜された一部のデータだけで「関係がない」とは言えない
          - 正解
          - 一方の変数の範囲を限ると、相関係数はふつう小さくなる
          - 範囲を狭めると、相関係数はふつう小さくなる
          - 相関係数は正なので、負の関係ではない
        explanation: |
          **方針** 一方の変数の範囲が限られる（選抜される）と、散布図の一部だけを見ることになる。

          **途中式** 全体では右上がりの細長い楕円でも、得点の高い部分だけを切り取ると、横に狭い範囲で点が上下に散らばるので、相関係数は小さくなる。

          **答え** 範囲が狭いために相関が弱く出ている可能性がある

          **間違えやすい点** 相関係数は、データの範囲によって変わる。選抜された集団の相関から、全体の関係を判断しない。
      - id: s11p03b
        chapter: 4
        terms: [simple-regression, covariance-and-correlation]
        topic: 平均と標準偏差が等しい父と息子の身長の回帰で息子の予測値が平均に近づく平均への回帰を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある集団で、父親の身長 $x$ と息子の身長 $y$ はどちらも平均 170 cm・標準偏差 6 cm で、相関係数は 0.5 だった。$y$ を $x$ で説明する回帰直線で、身長 182 cm の父親の息子の身長を予測せよ。
        choices:
          - 176 cm
          - 182 cm
          - 170 cm
          - 173 cm
          - 194 cm
        answer: 0
        distractors:
          - 正解
          - 傾きを 1 と考えている（回帰の傾きは r × 標準偏差の比 = 0.5）
          - 父親の身長の情報を使っていない
          - 傾きに相関係数の 2 乗（0.25）を使っている
          - 傾きを 1/r = 2 としている（x を y で説明する回帰と取り違えている）
        explanation: |
          **方針** 傾きは $b=r\,\dfrac{s_y}{s_x}$、回帰直線は平均の点 $(\bar x,\ \bar y)$ を通る。

          **途中式** $b=0.5\times\dfrac{6}{6}=0.5$。$\hat y=170+0.5\times(182-170)=176$ cm。

          **答え** 176 cm

          **間違えやすい点** 父親が平均より 12 cm 高くても、息子の予測は 6 cm しか高くならない（平均への回帰）。相関が 1 でない限り、予測値は平均に近づく。
  - id: s11p04
    title: 時系列の見方
    context: |
      時系列データの変化を正しく表す。
    items:
      - id: s11p04a
        chapter: 5
        terms: [growth-rate]
        topic: 四半期ごとの前期比2パーセントが1年続いたときの年率を複利で求め単純に4倍した値と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある国の実質 GDP は、前期比 2.0% の伸びが 4 四半期続いた。1 年間の伸び率（年率）を、複利で求めよ。
        choices:
          - 8.00%
          - 約 8.24%
          - 2.00%
          - 0.50%
          - 約 4.04%
        answer: 1
        distractors:
          - 単純に 4 倍している（伸びの上に伸びが重なることを無視している）
          - 正解
          - 1 四半期分の伸び率のまま答えている
          - 4 で割っている
          - 2 四半期分（半年）しか重ねていない
        explanation: |
          **方針** 1 四半期ごとに 1.02 倍になるので、1 年では $1.02^4$ 倍。

          **途中式** $1.02^4=1.0824$ なので、年率は約 8.24%。

          **答え** 約 8.24%

          **間違えやすい点** 伸び率は掛け算で重なるので、単純に 4 倍（8%）すると少し小さくなる。率が大きいほど差が大きくなる。
      - id: s11p04b
        chapter: 5
        terms: [growth-rate, log-transformation]
        topic: 一定の率で成長する系列を片対数グラフに描くと直線になることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          毎年 10% ずつ増える売上を、縦軸を対数目盛りにしたグラフ（片対数グラフ）に描くと、どのような形になるか。
        choices:
          - 右上がりの直線になる
          - 右上がりで、だんだん傾きが急になる曲線になる
          - 右上がりで、だんだん傾きがゆるやかになる曲線になる
          - 水平な直線になる
          - 階段状の線になる
        answer: 0
        distractors:
          - 正解
          - ふつうの目盛りのグラフに描いたときの形
          - 増え方が年々小さくなるときの形
          - 伸び率が 0% のときの形
          - 一定の率の成長は階段状にはならない
        explanation: |
          **方針** 売上を $y_t=y_0\times 1.1^t$ と表し、対数をとる。

          **途中式** $\log y_t=\log y_0+t\log 1.1$ は $t$ の 1 次式なので、対数目盛りでは傾き $\log 1.1$ の直線になる。

          **答え** 右上がりの直線になる

          **間違えやすい点** ふつうの目盛りでは加速して見える一定の率の成長も、片対数グラフでは直線になる。片対数グラフで直線から曲がれば、伸び率が変わったとわかる。
  - id: s11p05
    title: 調査の偏りと層別の推定
    context: |
      標本調査の結果から母集団について考える。
    items:
      - id: s11p05a
        chapter: 6
        terms: [simple-random-sampling, sampling-and-nonsampling-error]
        topic: ウェブサイトで自由に回答を募る調査では関心の強い人が多く回答する自己選択の偏りが生じることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある自治体が新しい施設の建設について、ホームページで誰でも回答できるアンケートを行い、5000 件の回答を集めた。この結果を市民全体の意見とみなすときの問題点として、最も適切なものはどれか。
        choices:
          - 回答数が 5000 件と多いので、問題はない
          - 回答数が多いので、標本誤差が大きくなる
          - 無作為抽出ではないが、回答数を増やせば偏りはなくなる
          - 回答するかどうかを本人が選ぶので、関心の強い人の意見が多く集まり、市民全体と違う結果になりやすい
          - インターネットの調査では、非標本誤差は生じない
        answer: 3
        distractors:
          - 回答数が多くても、回答者の選ばれ方に偏りがあれば偏りは残る
          - 回答数が多いほど、標本誤差は小さくなる
          - 偏りは回答数を増やしても減らない
          - 正解
          - 自己選択による偏りは非標本誤差の一種
        explanation: |
          **方針** 回答者がどのように選ばれたかを考える。

          **途中式** 回答するかどうかを本人が決める（自己選択）ので、強く賛成・反対する人や、ホームページをよく見る人が多く回答する。

          **答え** 関心の強い人の意見が多く集まり、全体と違う結果になりやすい

          **間違えやすい点** 回答の数が多いことと、回答者が母集団を代表していることは別。偏りは、標本を大きくしても減らない。
      - id: s11p05b
        chapter: 6
        terms: [stratified-sampling, point-estimation]
        topic: 層ごとに同じ人数を選んだ層化抽出で層の大きさを重みにして母平均を推定する
        level: 標準
        definition: false
        type: choice
        question: |
          ある市の世帯は、都市部 6000 世帯、郊外 4000 世帯である。それぞれから 100 世帯ずつ無作為に選び、1 か月の外食費を調べたところ、平均は都市部 4.0 万円、郊外 6.0 万円だった。市全体の 1 世帯あたりの平均の推定値を求めよ。
        choices:
          - 5.0 万円
          - 5.2 万円
          - 4.0 万円
          - 4.8 万円
          - 6.0 万円
        answer: 3
        distractors:
          - 標本 200 世帯の平均をそのまま使っている（層の大きさの違いを無視している）
          - 重みを入れかえている（都市部に 0.4、郊外に 0.6）
          - 世帯数の多い都市部の平均だけを使っている
          - 正解
          - 郊外の平均だけを使っている
        explanation: |
          **方針** 層ごとの抽出率が違うので、層の大きさ（世帯数の割合）で重みを付けて平均する。

          **途中式** 重みは都市部 $6000/10000=0.6$、郊外 0.4。$0.6\times 4.0+0.4\times 6.0=4.8$ 万円。

          **答え** 4.8 万円

          **間違えやすい点** 等しい人数ずつ選んだので、標本全体の平均（5.0 万円）では、世帯数の少ない郊外の影響が大きくなりすぎる。
  - id: s11p06
    title: 確率と期待値
    context: |
      確率や期待値を求める。
    items:
      - id: s11p06a
        chapter: 7
        terms: [bayes-theorem, conditional-probability]
        topic: 独立な検査で2回続けて陽性になったときに病気である確率をベイズの定理で求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある病気の有病率は 1% である。検査は、病気の人で 90% が陽性、病気でない人で 10% が陽性になる。同じ人に検査を 2 回行い、結果は（病気かどうかが決まれば）互いに独立とする。2 回とも陽性だった人が病気である確率を求めよ。
        choices:
          - 約 0.083
          - "0.81"
          - "0.90"
          - 約 0.17
          - "0.45"
        answer: 4
        distractors:
          - 1 回陽性だったときの確率を答えている
          - 病気の人が 2 回とも陽性になる確率（0.9 の 2 乗）を答えている
          - 病気の人が陽性になる確率（感度）と取り違えている
          - 1 回陽性のときの確率を 2 倍している
          - 正解
        explanation: |
          **方針** 「2 回とも陽性」を 1 つの事象として、ベイズの定理を使う。

          **途中式** 病気で 2 回陽性：$0.01\times 0.9^2=0.0081$。病気でなくて 2 回陽性：$0.99\times 0.1^2=0.0099$。求める確率は $\dfrac{0.0081}{0.0081+0.0099}=0.45$。

          **答え** 0.45

          **間違えやすい点** 1 回の陽性では約 0.083 にすぎないが、2 回目の陽性で大きく上がる。確率は 2 倍になるのではなく、ベイズの定理で計算し直す。
      - id: s11p06b
        chapter: 8
        terms: [expectation-variance-properties]
        topic: 2乗の誤差の期待値を最小にする定数が期待値で最小値が分散になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$ の期待値は 3、分散は 2 である。定数 $c$ を動かすとき、$E[(X-c)^2]$ を最小にする $c$ と、そのときの最小値の組合せとして正しいものはどれか。
        choices:
          - c ＝ 0 のとき、最小値 11
          - c ＝ 3 のとき、最小値 0
          - c ＝ 3 のとき、最小値 2
          - c ＝ 3 のとき、最小値 √2
          - c ＝ 2 のとき、最小値 3
        answer: 2
        distractors:
          - c ＝ 0 での値（2 乗の期待値）で、最小ではない
          - X は確率変数なので、c をどう選んでも 0 にはならない
          - 正解
          - 分散ではなく標準偏差を答えている
          - 期待値と分散を入れかえている
        explanation: |
          **方針** $E[(X-c)^2]$ を、分散と期待値で表す。

          **途中式** $E[(X-c)^2]=V[X]+(E[X]-c)^2=2+(3-c)^2$。$c=3$ で最小になり、最小値は 2。

          **答え** $c=3$ のとき、最小値 2

          **間違えやすい点** 期待値は「2 乗の誤差を最も小さくする予測」で、そのときの誤差の 2 乗の平均が分散になる。
      - id: s11p06c
        chapter: 8
        terms: [expectation-variance-properties, sum-of-random-variables]
        topic: 4人が傘を無作為に取るとき自分の傘を取る人数の期待値を各人の確率の和として求める
        level: 標準
        definition: false
        type: choice
        question: |
          4 人がそれぞれ傘を 1 本ずつ預け、帰りに 4 本の傘を無作為に 1 本ずつ受け取る。自分の傘を受け取る人数の期待値を求めよ。
        choices:
          - 0.25 人
          - 4 人
          - 1 人
          - 2 人
          - 0 人
        answer: 2
        distractors:
          - 1 人が自分の傘を受け取る確率を答えている
          - 全員が自分の傘を受け取る場合の人数
          - 正解
          - 根拠なく半分の人数としている
          - 全員が他人の傘を受け取る場合だけを考えている
        explanation: |
          **方針** 各人について「自分の傘を受け取れば 1、そうでなければ 0」の確率変数を考え、期待値の和を使う。

          **途中式** 各人が自分の傘を受け取る確率は $1/4$ なので、各確率変数の期待値は $1/4$。人数の期待値は $4\times\dfrac14=1$ 人。

          **答え** 1 人

          **間違えやすい点** 4 人の結果は独立ではないが、期待値の和の性質は独立でなくても成り立つ。人数が何人でも期待値は 1 人になる。
  - id: s11p07
    title: 確率分布の計算
    context: |
      代表的な確率分布を使う。標準正規分布の上側確率は、$P(Z>0.8)=0.2119$、$P(Z>1)=0.1587$、$P(Z>1.25)=0.1056$、$P(Z>1.41)=0.0793$、$P(Z>2)=0.0228$ とする。
    items:
      - id: s11p07a
        chapter: 9
        terms: [binomial-distribution]
        topic: 不良率10パーセントの製品で少なくとも1個の不良品を含む確率が0.5以上になる最小の個数を余事象で求める
        level: 標準
        definition: false
        type: choice
        question: |
          不良率 10% の製品を無作為に $n$ 個調べる（各製品は独立）。少なくとも 1 個の不良品が含まれる確率が 0.5 以上になる最小の $n$ を求めよ。ただし $0.9^6=0.531$、$0.9^7=0.478$ とする。
        choices:
          - 5 個
          - 7 個
          - 6 個
          - 10 個
          - 8 個
        answer: 1
        distractors:
          - 0.5 を 0.1 で割っている（確率を足し算で考えている）
          - 正解
          - 0.9 の 6 乗 0.531 を「少なくとも 1 個」の確率と取り違えている（実際は 1 − 0.531 = 0.469）
          - 期待値が 1 個になる個数と取り違えている
          - 条件を満たす最小の個数ではない
        explanation: |
          **方針** 「少なくとも 1 個」は余事象「1 個もない」の確率 $0.9^n$ を 1 から引く。

          **途中式** $1-0.9^6=0.469<0.5$、$1-0.9^7=0.522\ge 0.5$。

          **答え** 7 個

          **間違えやすい点** 確率は足し算で増えない（$0.1\times 5=0.5$ とはならない）。余事象を使い、$0.9^n$ が 0.5 以下になる $n$ を探す。
      - id: s11p07b
        chapter: 9
        terms: [exponential-distribution]
        topic: 平均10分の指数分布の中央値を平均にlog2を掛けて求め平均と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある窓口の待ち時間は平均 10 分の指数分布にしたがう。待ち時間の中央値を求めよ。ただし $\log 2=0.693$ とする。
        choices:
          - 約 6.93 分
          - 10 分
          - 5 分
          - 約 14.4 分
          - 約 0.0693 分
        answer: 0
        distractors:
          - 正解
          - 平均を答えている（右に裾の長い分布では平均と中央値は違う）
          - 一様分布のように平均の半分としている
          - log 2 で割っている
          - レート 0.1 と log 2 を掛けている
        explanation: |
          **方針** 中央値 $m$ は $P(T>m)=0.5$ を満たす。平均 10 分の指数分布では $P(T>t)=e^{-t/10}$。

          **途中式** $e^{-m/10}=0.5$ より $m=10\log 2=6.93$ 分。

          **答え** 約 6.93 分

          **間違えやすい点** 指数分布は右に裾が長いので、中央値は平均より小さい。待ち時間の半分以上は 6.93 分以下で終わる。
      - id: s11p07c
        chapter: 9
        terms: [normal-distribution, expectation-variance-properties]
        topic: 正規確率変数の1次変換の平均と標準偏差を求めて上側確率を標準化で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $X$ は平均 50・標準偏差 10 の正規分布にしたがう。$Y=2X+5$ について、$P(Y>125)$ を求めよ。
        choices:
          - "0.0228"
          - "0.0793"
          - "0.2119"
          - "0.1056"
          - "0.1587"
        answer: 4
        distractors:
          - 標準偏差を 2 倍していない（z = 2 になる）
          - 分散を 2 倍している（標準偏差を √2 倍にしている）
          - 定数 5 を標準偏差にも足している（標準偏差 25）
          - 平均に定数 5 を足し忘れている（平均 100）
          - 正解
        explanation: |
          **方針** $Y=2X+5$ は平均 $2\times 50+5=105$、標準偏差 $2\times 10=20$ の正規分布にしたがう。

          **途中式** $z=\dfrac{125-105}{20}=1$、$P(Z>1)=0.1587$。

          **答え** 0.1587

          **間違えやすい点** 定数を足しても標準偏差は変わらない。定数倍すると標準偏差はその倍数（分散は 2 乗倍）になる。
  - id: s11p08
    title: 標本分布
    context: |
      統計量の分布を考える。標準正規分布の上側確率は、$P(Z>0.25)=0.4013$、$P(Z>2)=0.0228$ とする。
    items:
      - id: s11p08a
        chapter: 10
        terms: [chi-squared-distribution]
        topic: 独立な自由度3と自由度5のカイ二乗確率変数の和が自由度8のカイ二乗分布にしたがいその期待値が8であることを答える
        level: 基本
        definition: false
        type: choice
        question: |
          $U$ は自由度 3 のカイ二乗分布、$V$ は自由度 5 のカイ二乗分布にしたがい、互いに独立である。$U+V$ の分布と期待値の組合せとして正しいものはどれか。
        choices:
          - 自由度 15 のカイ二乗分布で、期待値は 15
          - 自由度 8 のカイ二乗分布で、期待値は 16
          - 自由度 8 のカイ二乗分布で、期待値は 8
          - 自由度 4 のカイ二乗分布で、期待値は 4
          - 自由度 (3, 5) の F 分布で、期待値は 8
        answer: 2
        distractors:
          - 自由度を掛けている
          - 期待値と分散（自由度の 2 倍）を取り違えている
          - 正解
          - 自由度を平均している
          - F 分布は、カイ二乗確率変数をそれぞれの自由度で割った比の分布
        explanation: |
          **方針** 独立なカイ二乗確率変数の和は、自由度を足したカイ二乗分布にしたがう（再生性）。

          **途中式** 自由度は $3+5=8$。自由度 $k$ のカイ二乗分布の期待値は $k$ なので 8（分散は $2k=16$）。

          **答え** 自由度 8 のカイ二乗分布で、期待値は 8

          **間違えやすい点** カイ二乗分布は「標準正規分布の 2 乗を自由度の数だけ足したもの」なので、足すと自由度も足し算になる。
      - id: s11p08b
        chapter: 10
        terms: [central-limit-theorem, sampling-distribution-of-mean]
        topic: 平均2の指数分布から64個とった標本平均が2.5を超える確率を中心極限定理で近似し1個の値の確率や両側の確率と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          1 件の処理時間が平均 2 分・標準偏差 2 分の指数分布にしたがう。独立な 64 件の処理時間の平均が 2.5 分を超える確率を、中心極限定理を使って近似せよ。
        choices:
          - "0.4013"
          - "0.0456"
          - "0.0228"
          - "0.9772"
          - 約 0.2865
        answer: 2
        distractors:
          - 標本平均の標準偏差を 2 分のまま（√64 で割っていない）にしている
          - 両側の確率にしている
          - 正解
          - 2.5 分以下の確率を答えている
          - 1 件の処理時間が 2.5 分を超える確率（e の −1.25 乗）と取り違えている
        explanation: |
          **方針** 64 件の平均は、近似的に平均 2、標準偏差 $2/\sqrt{64}=0.25$ の正規分布にしたがう。

          **途中式** $z=\dfrac{2.5-2}{0.25}=2$、$P(Z>2)=0.0228$。

          **答え** 0.0228

          **間違えやすい点** もとの分布が正規分布でなくても、平均は正規分布で近似できる（この場合の正確な値は約 0.029 で、近似は少し小さめになる）。1 件の値の分布（指数分布）とは区別する。
      - id: s11p08c
        chapter: 10
        terms: [chi-squared-distribution, sample-variance-sd]
        topic: 正規母集団の不偏分散の分散をカイ二乗分布の分散2kから求める
        level: 応用
        definition: false
        type: choice
        question: |
          母分散 4 の正規母集団から大きさ 11 の標本をとり、不偏分散 $s^2$ を求める。$s^2$ の分散 $V[s^2]$ を求めよ。ただし、$\dfrac{(n-1)s^2}{\sigma^2}$ は自由度 $n-1$ のカイ二乗分布にしたがう。
        choices:
          - 約 2.91
          - "20"
          - "0.8"
          - "3.2"
          - 約 1.79
        answer: 3
        distractors:
          - n − 1 ではなく n = 11 で割っている
          - 自由度 10 のカイ二乗分布の分散 2 × 10 をそのまま答えている
          - σ² の 2 乗ではなく σ² を使っている
          - 正解
          - 分散ではなく標準偏差を答えている
        explanation: |
          **方針** $W=\dfrac{10s^2}{4}$ は自由度 10 のカイ二乗分布にしたがうので、$V[W]=2\times 10=20$。$s^2=\dfrac{4}{10}W$ と表す。

          **途中式** $V[s^2]=\left(\dfrac{4}{10}\right)^2\times 20=0.16\times 20=3.2$。一般に $V[s^2]=\dfrac{2\sigma^4}{n-1}$。

          **答え** 3.2

          **間違えやすい点** 定数倍の分散は定数の 2 乗倍になる。$\sigma^2$ ではなく $\sigma^4$ が出てくる。
  - id: s11p09
    title: 区間推定
    context: |
      母数を区間で推定する。
    items:
      - id: s11p09a
        chapter: 11
        terms: [confidence-interval, sampling-and-nonsampling-error]
        topic: 世論調査の結果に付けられた標本誤差プラスマイナス3ポイントの意味と限界を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ約 1000 人の世論調査で、内閣の支持率は 40% と報じられ、「標本誤差は信頼係数 95% で ±3 ポイント」と注記されていた。最も適切な解釈はどれか。
        choices:
          - 本当の支持率は 37〜43% 程度と推定される。同じ方法の調査を何度も行えば、約 95% の調査でこのような区間が本当の支持率を含む
          - 回答者の 95% が、37〜43% の範囲の支持を示した
          - 質問文や無回答による偏りも含めて、誤差は ±3 ポイント以内に収まっている
          - 前回の調査の 38% から 40% に上がったので、支持率は確実に上がった
          - 本当の支持率は、必ず 37〜43% の間にある
        answer: 0
        distractors:
          - 正解
          - 区間は母比率についてのもので、回答者の分布ではない
          - ±3 ポイントは標本誤差だけで、非標本誤差は含まない
          - 2 ポイントの差は、両方の調査の標本誤差の範囲に収まる
          - 95% の信頼区間は、5% 程度の割合で本当の値を外す
        explanation: |
          **方針** ±3 ポイントは、標本比率から作った母比率の 95% 信頼区間の幅の半分。

          **途中式** $1.96\sqrt{0.4\times 0.6/1000}\approx 0.030$ なので、区間は約 37〜43%。

          **答え** 本当の支持率は 37〜43% 程度と推定される

          **間違えやすい点** ±3 ポイントは標本誤差だけを表し、質問文や無回答による偏り（非標本誤差）は含まない。小さな変化は、標本誤差の範囲かどうかを考えてから判断する。
      - id: s11p09b
        chapter: 11
        terms: [required-sample-size, ci-two-sample-proportion]
        topic: 2つの群の比率の差の95パーセント信頼区間の幅の半分を0.05以下にするための1群あたりの標本の大きさを求める
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの地域で、ある意見に賛成する割合の差を調べる。どちらの地域も賛成率の見当がつかないので 0.5 とし、両地域から同じ人数 $n$ 人ずつ選ぶ。母比率の差の 95% 信頼区間の幅の半分を 0.05 以下にするのに必要な、1 地域あたりの最小の $n$ を求めよ（係数は 1.96 を使う）。
        choices:
          - 385 人
          - 768 人
          - 769 人
          - 544 人
          - 1538 人
        answer: 2
        distractors:
          - 1 つの比率の区間の公式を使っている（差の分散は 2 つの分散の和）
          - 768.3 を切り捨てている（幅の半分が 0.05 を少し超える）
          - 正解
          - 人数を 1 つの比率の場合の √2 倍にしている（差の分散は 2 倍になるので、必要な人数も 2 倍）
          - 2 地域の合計の人数を答えている
        explanation: |
          **方針** 差の標準誤差は $\sqrt{\dfrac{0.25}{n}+\dfrac{0.25}{n}}=\sqrt{\dfrac{0.5}{n}}$。

          **途中式** $1.96\sqrt{0.5/n}\le 0.05$ より $n\ge 0.5\times(1.96/0.05)^2=768.32$。最小は 769 人。

          **答え** 769 人

          **間違えやすい点** 差を推定するには、1 つの比率を推定するときの 2 倍の人数が 1 群ごとに必要になる。人数は切り上げる。
      - id: s11p09c
        chapter: 11
        terms: [unbiased-estimator, sample-variance-sd]
        topic: 不偏分散は母分散の不偏推定量だがその平方根は母標準偏差の不偏推定量ではなく平均的に小さいことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ $n$ の標本をとり、不偏分散 $s^2$（偏差の 2 乗の和を $n-1$ で割る）とその平方根 $s$ を求める。正しいものはどれか。
        choices:
          - s² が不偏推定量なので、その平方根 s も母標準偏差の不偏推定量である
          - s は平均的に母標準偏差より大きい
          - s² は母分散の不偏推定量だが、s は母標準偏差の不偏推定量ではなく、平均的に母標準偏差より少し小さい
          - n で割った分散の平方根のほうが、母標準偏差の不偏推定量になる
          - s は、n を大きくしても母標準偏差に近づかない
        answer: 2
        distractors:
          - 平方根をとると期待値の関係は保たれない
          - 平方根は上に凸なので、平均的には小さくなる
          - 正解
          - n で割るとさらに小さくなるので、不偏にはならない
          - s は一致推定量で、n を大きくすると母標準偏差に近づく
        explanation: |
          **方針** $E[s^2]=\sigma^2$ でも、$E[s]$ は $\sqrt{E[s^2]}$ と等しいとは限らない。

          **途中式** $V[s]=E[s^2]-(E[s])^2>0$ なので、$(E[s])^2<E[s^2]=\sigma^2$、つまり $E[s]<\sigma$。

          **答え** $s$ は母標準偏差の不偏推定量ではなく、平均的に少し小さい

          **間違えやすい点** 不偏性は、平方根などの変換で保たれない。ただし $n$ が大きければ偏りは小さく、$s$ は一致推定量である。
      - id: s11p09d
        chapter: 11
        terms: [ci-proportion, point-estimation]
        topic: 400人中60人という結果から母比率の95パーセント信頼区間を求め母集団2万人の該当者数の区間に換算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある町の住民 2 万人から無作為に 400 人を選んだところ、60 人がある制度を利用していた。町全体の利用者の人数の 95% 信頼区間として最も適切なものはどれか。
        choices:
          - 約 2410 人から約 3590 人
          - 約 2300 人から約 3700 人
          - 約 2900 人から約 3100 人
          - 46 人から 74 人
          - 0.115 人から 0.185 人
        answer: 1
        distractors:
          - 90% 信頼区間の 1.645 を使っている
          - 正解
          - 標準誤差を母集団の 2 万人で計算している（標本の大きさは 400）
          - 標本 400 人の中の人数の区間で、町全体に換算していない
          - 比率の区間に人の単位を付けている（2 万人を掛けていない）
        explanation: |
          **方針** まず母比率の信頼区間を求め、母集団の人数 2 万人を掛ける。

          **途中式** $\hat p=0.15$、標準誤差 $\sqrt{0.15\times 0.85/400}\approx 0.0179$。$0.15\pm 1.96\times 0.0179=(0.115,\ 0.185)$。2 万人を掛けて約 2300〜3700 人。

          **答え** 約 2300 人から約 3700 人

          **間違えやすい点** 標準誤差の分母は標本の大きさ 400。母集団の大きさは、最後に人数へ換算するときに使う。
  - id: s11p10
    title: 仮説検定の設計
    context: |
      検定の棄却域・有意水準・検出力を考える。
    items:
      - id: s11p10a
        chapter: 12
        terms: [power-function, required-sample-size, type-i-and-ii-errors]
        topic: 右片側5パーセントのz検定で差5を検出力90パーセントで検出するのに必要な標本の大きさを求める
        level: 応用
        definition: false
        type: choice
        question: |
          母標準偏差 10 の正規母集団で、帰無仮説「母平均 $\mu_0$」を右片側・有意水準 5% の z 検定で調べる。本当の母平均が $\mu_0+5$ のときの検出力を 90% 以上にしたい。必要な標本の大きさの最小値を求めよ。ただし上側 5% 点は 1.645、上側 10% 点は 1.282 とする。
        choices:
          - "11"
          - "34"
          - "43"
          - "6"
          - "35"
        answer: 4
        distractors:
          - 検出力を考えず、差 5 が有意になる大きさだけを求めている
          - 34.27 を切り捨てている（検出力が 90% に届かない）
          - 両側 5% の 1.96 を使っている
          - √n を求めたところで止めている（2 乗していない）
          - 正解
        explanation: |
          **方針** 棄却の境目 $\mu_0+1.645\sigma/\sqrt n$ が、本当の分布で下側 10% の位置 $\mu_0+5-1.282\sigma/\sqrt n$ 以下になればよい。

          **途中式** $(1.645+1.282)\times\dfrac{10}{\sqrt n}\le 5$ より $\sqrt n\ge 5.854$、$n\ge 34.27$。最小は 35。

          **答え** 35

          **間違えやすい点** 必要な標本の大きさは切り上げる。検出力の条件を入れないと、本当に差があっても半分程度しか検出できない大きさになる。
      - id: s11p10b
        chapter: 12
        terms: [proportion-test, rejection-region]
        topic: 400個の調査で比率0.2の左片側5パーセント検定の棄却域を個数で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある商品の購入率は 0.2 とされている。新しい包装で購入率が下がったかを、400 人の購入者数 $X$ を使って、左片側・有意水準 5% で検定する（正規近似、連続修正なし、境目は −1.645）。棄却域として正しいものはどれか。
        choices:
          - X が 67 以下
          - X が 64 以下
          - X が 65 以下
          - X が 94 以上
          - X が 66 以下
        answer: 4
        distractors:
          - 66.84 を切り上げている（67 は z が −1.645 より大きく、棄却域に入らない）
          - 両側 5% の 1.96 を使っている
          - 標準偏差を √(np) = √80 としている（1 − p を掛け忘れている）
          - 右側の棄却域にしている
          - 正解
        explanation: |
          **方針** $X$ は近似的に平均 $400\times 0.2=80$、標準偏差 $\sqrt{400\times 0.2\times 0.8}=8$ の正規分布にしたがう。

          **途中式** $\dfrac{X-80}{8}\le -1.645$ より $X\le 66.84$。$X$ は整数なので 66 以下。

          **答え** $X$ が 66 以下

          **間違えやすい点** 境目の値が整数でないときは、条件を満たす側に丸める。67 では $z=-1.625$ で棄却されない。
      - id: s11p10c
        chapter: 12
        terms: [type-i-and-ii-errors, binomial-distribution]
        topic: 10回の試行で9回以上なら棄却する二項分布の検定の第1種の過誤の確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          あるコインが表に偏っているかを調べるため、10 回投げて表が 9 回以上なら「表の確率は 0.5」を棄却することにした。この検定の第 1 種の過誤の確率を求めよ。
        choices:
          - 約 0.0107
          - 約 0.0010
          - 約 0.0098
          - 約 0.0547
          - "0.05"
        answer: 0
        distractors:
          - 正解
          - 表が 10 回の確率だけを足している
          - 表が 9 回の確率だけを足している
          - 8 回以上の確率を求めている
          - 有意水準をいつも 5% と考えている（離散的な検定では、棄却域の確率が第 1 種の過誤の確率になる）
        explanation: |
          **方針** 第 1 種の過誤の確率は、帰無仮説（表の確率 0.5）が正しいときに棄却域に入る確率。

          **途中式** $P(X\ge 9)=\dfrac{\binom{10}{9}+\binom{10}{10}}{2^{10}}=\dfrac{11}{1024}\approx 0.0107$。

          **答え** 約 0.0107

          **間違えやすい点** 二項分布のような離散的な分布では、棄却域の確率がちょうど 5% にはならない。実際の第 1 種の過誤の確率を計算する。
      - id: s11p10d
        chapter: 12
        terms: [confidence-interval-test-duality, one-sided-two-sided-test]
        topic: 右片側5パーセントのz検定の棄却と母平均の90パーセント両側信頼区間の下限の対応を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          母分散既知の母平均について、帰無仮説 $\mu=\mu_0$、対立仮説 $\mu>\mu_0$ の z 検定を有意水準 5% で行う。帰無仮説が棄却されることと同じ条件はどれか。
        choices:
          - 母平均の 95% 信頼区間（両側）の下限が μ₀ より大きい
          - 母平均の 90% 信頼区間（両側）が μ₀ を含まない
          - 母平均の 95% 信頼区間（両側）が μ₀ を含む
          - 母平均の 90% 信頼区間（両側）の下限が μ₀ より大きい
          - 母平均の 99% 信頼区間（両側）の上限が μ₀ より小さい
        answer: 3
        distractors:
          - 両側 95% の下限は 1.96 を使うので、右片側 2.5% の検定に対応する
          - μ₀ が区間の上側の外にある場合（左側の差）も含んでしまう
          - 両側 5% の検定で棄却されない条件
          - 正解
          - 母平均が μ₀ より小さい側の条件
        explanation: |
          **方針** 右片側 5% の検定の境目 1.645 は、両側 90% 信頼区間の係数と同じ。

          **途中式** 棄却 ⇔ $\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}>1.645$ ⇔ $\bar x-1.645\dfrac{\sigma}{\sqrt n}>\mu_0$。左辺は 90% 両側信頼区間の下限。

          **答え** 90% 信頼区間（両側）の下限が $\mu_0$ より大きい

          **間違えやすい点** 片側検定に対応する区間は、片側の信頼限界（ここでは 95% の片側下限 ＝ 90% 両側区間の下限）。
  - id: s11p11
    title: クロス表の検定
    context: |
      2×2 のクロス表で独立性の検定を行う。
    items:
      - id: s11p11a
        chapter: 13
        terms: [independence-test, continuity-correction]
        topic: 2行2列の表でイェーツの連続修正をしたカイ二乗統計量を求め修正なしの値と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          次のクロス表について、イェーツの連続修正をした独立性のカイ二乗統計量を求めよ（修正は、各セルの $|O-E|$ から 0.5 を引いてから 2 乗する）。

          | | 改善した | 改善しない |
          |---|---|---|
          | 新しい方法 | 30 | 20 |
          | 従来の方法 | 20 | 30 |
        choices:
          - "4.00"
          - "2.56"
          - "3.24"
          - "0.81"
          - "3.84"
        answer: 2
        distractors:
          - 連続修正をしていない
          - 0.5 ではなく 1 を引いている
          - 正解
          - 1 つのセルの寄与だけを答えている
          - 自由度 1 のカイ二乗分布の上側 5% 点と取り違えている
        explanation: |
          **方針** 行と列の合計はすべて 50 なので、期待度数はどのセルも $50\times 50/100=25$。

          **途中式** どのセルも $|O-E|=5$。修正後は $\dfrac{(5-0.5)^2}{25}=0.81$ を 4 セル足して $3.24$。

          **答え** 3.24

          **間違えやすい点** 修正なしでは 4.00 で、自由度 1 の 5% 点 3.84 を超えるが、修正後は超えない。境目に近いときは修正の有無で結論が変わる。
      - id: s11p11b
        chapter: 13
        terms: [independence-test, pearson-chi-square-statistic]
        topic: クロス表のすべての度数を2倍にするとカイ二乗統計量も2倍になり結論が変わりうることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          2×2 のクロス表で独立性のカイ二乗統計量（連続修正なし）は 3.0 だった。割合が同じまま、すべてのセルの度数を 2 倍にした表では、統計量と有意水準 5% での結論はどうなるか（自由度 1 の上側 5% 点は 3.84）。
        choices:
          - 3.0 のままで、棄却されない
          - 約 4.24（√2 倍）になり、棄却される
          - 6.0 になるが、自由度も 2 になるので棄却されない
          - 1.5 になり、棄却されない
          - 6.0 になり、3.84 より大きいので棄却される
        answer: 4
        distractors:
          - 割合が同じでも、度数が増えると統計量は大きくなる
          - 統計量は度数に比例する（√ に比例するのは z 統計量）
          - 自由度は表の行と列の数で決まり、度数では変わらない
          - 度数を増やすと統計量は小さくならない
          - 正解
        explanation: |
          **方針** 度数を $k$ 倍すると、$O$ も $E$ も $k$ 倍になる。

          **途中式** $\dfrac{(kO-kE)^2}{kE}=k\dfrac{(O-E)^2}{E}$ なので、統計量は $2\times 3.0=6.0$。3.84 より大きいので棄却される。

          **答え** 6.0 になり、棄却される

          **間違えやすい点** 同じ割合の違いでも、標本が大きいほど有意になりやすい。有意かどうかと、違いの大きさは別に考える。
  - id: s11p12
    title: 回帰分析の出力
    context: |
      回帰分析の結果を読み取る。
    items:
      - id: s11p12a
        chapter: 14
        terms: [multiple-regression-model, coefficient-of-determination]
        topic: 重回帰の決定係数から実際の値と予測値の相関係数である重相関係数を平方根として求め符号が負にならないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          説明変数が 3 個の重回帰分析で、決定係数は 0.64 だった。目的変数の実際の値と予測値の相関係数（重相関係数）を求めよ。
        choices:
          - "0.64"
          - 約 0.41
          - ±0.80（係数の符号によって決まる）
          - 約 0.21
          - "0.80"
        answer: 4
        distractors:
          - 決定係数をそのまま答えている
          - 決定係数を 2 乗している
          - 実際の値と予測値の相関は負にならない（予測値は実際の値と同じ向きに動く）
          - 決定係数を説明変数の数で割っている
          - 正解
        explanation: |
          **方針** 重回帰の決定係数は、実際の値 $y$ と予測値 $\hat y$ の相関係数の 2 乗に等しい。

          **途中式** $\sqrt{0.64}=0.80$。

          **答え** 0.80

          **間違えやすい点** 単回帰の相関係数は傾きの符号で負になることがあるが、重相関係数は 0 以上。どの説明変数が効いているかは、決定係数だけではわからない。
      - id: s11p12b
        chapter: 14
        terms: [dummy-variable, multicollinearity]
        topic: 切片を含む回帰に4つのカテゴリすべてのダミー変数を入れると完全な多重共線性になることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          切片を含む回帰で、季節（春・夏・秋・冬）を表すために、4 つのダミー変数（春なら 1 の変数、夏なら 1 の変数、…）をすべて説明変数に入れた。どのような問題が起こるか。
        choices:
          - 説明変数が多いので、決定係数が必ず下がる
          - 4 つのダミー変数の和がいつも 1（切片の列と同じ）になり、係数が 1 通りに決まらない
          - ダミー変数は 0 と 1 しかとらないので、回帰には使えない
          - 特に問題はなく、各季節の効果がそれぞれ求まる
          - 季節の効果がすべて 0 と推定される
        answer: 1
        distractors:
          - 説明変数を増やしても決定係数は下がらない
          - 正解
          - ダミー変数は回帰の説明変数として使える
          - 切片を含むときは、カテゴリの数 − 1 個のダミー変数にする必要がある
          - 係数が決まらないのであって、0 になるわけではない
        explanation: |
          **方針** どの季節でも 4 つのダミー変数のうちちょうど 1 つが 1 になることに注目する。

          **途中式** 4 つの和はいつも 1 で、切片の列（すべて 1）と一致する。説明変数の間に完全な直線関係（完全な多重共線性）があり、係数が 1 通りに決まらない。

          **答え** 係数が 1 通りに決まらない

          **間違えやすい点** 切片を含む回帰では、1 つのカテゴリ（例えば冬）を基準にして 3 つのダミー変数を使う。各係数は基準との差を表す。
      - id: s11p12c
        chapter: 14
        terms: [overall-f-test-regression, regression-coefficient-t-test]
        topic: 単回帰では回帰全体のF統計量が傾きのt統計量の2乗に等しいことを使う
        level: 基本
        definition: false
        type: choice
        question: |
          単回帰分析の出力で、傾きの t 値は 3.0 だった。回帰全体の F 統計量はいくらか。
        choices:
          - "3.0"
          - "9.0"
          - 約 1.73
          - "6.0"
          - 決定係数がわからないと求められない
        answer: 1
        distractors:
          - t 値をそのまま答えている
          - 正解
          - t 値の平方根をとっている
          - t 値を 2 倍している
          - 単回帰では F 統計量は t 値から求められる
        explanation: |
          **方針** 単回帰では、回帰全体の F 検定と傾きの t 検定は同じ帰無仮説（傾きは 0）を調べている。

          **途中式** $F=t^2=3.0^2=9.0$。

          **答え** 9.0

          **間違えやすい点** 説明変数が 1 つのときだけ $F=t^2$ が成り立つ。重回帰では、F 検定は全体、t 検定は個々の係数を調べる。
  - id: s11p13
    title: 分散分析
    context: |
      実験の結果を分散分析でまとめる。
    items:
      - id: s11p13a
        chapter: 15
        terms: [two-way-anova-with-replication, main-effect-and-interaction]
        topic: 3水準と2水準で各組合せ4回の繰り返しのある二元配置の誤差の自由度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          要因 A が 3 水準、要因 B が 2 水準で、各組合せで 4 回ずつ実験した（全体 24 個）。交互作用を含む二元配置分散分析の誤差の自由度を求めよ。
        choices:
          - "18"
          - "2"
          - "20"
          - "23"
          - "21"
        answer: 0
        distractors:
          - 正解
          - 交互作用の自由度を答えている
          - 交互作用を含めずに引いている（24 − 1 − 2 − 1）
          - 全体の自由度を答えている
          - 要因 A だけの一元配置のように引いている（24 − 3）
        explanation: |
          **方針** 誤差の自由度は、組合せごとの「繰り返しの数 − 1」の合計。

          **途中式** 組合せは $3\times 2=6$ 通り、各組合せで $4-1=3$ なので $6\times 3=18$。全体 23 から A の 2、B の 1、交互作用の 2 を引いても 18。

          **答え** 18

          **間違えやすい点** 交互作用 A×B の自由度は $(3-1)(2-1)=2$。交互作用を誤差と分けられるのは、繰り返しがあるから。
      - id: s11p13b
        chapter: 15
        terms: [one-way-anova, sum-of-squares-decomposition]
        topic: 一元配置分散分析の群間の平方和を全体の平方和で割って寄与率を求めF比と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          3 群・合計 30 個のデータの一元配置分散分析で、全体の平方和は 120、群間の平方和は 30 だった。全体の変動のうち、群の違いで説明される割合（寄与率）を求めよ。
        choices:
          - 約 0.33
          - "0.75"
          - "4.5"
          - "0.25"
          - "4.0"
        answer: 3
        distractors:
          - 群間の平方和を群内の平方和 90 で割っている
          - 群内の平方和の割合を答えている
          - F 比（群間と群内の平均平方の比）を答えている
          - 正解
          - 全体の平方和を群間の平方和で割っている
        explanation: |
          **方針** 寄与率は、群間の平方和 ÷ 全体の平方和。

          **途中式** $30/120=0.25$。群内の平方和は $120-30=90$。

          **答え** 0.25

          **間違えやすい点** F 比 $\dfrac{30/2}{90/27}=4.5$ は、群の違いが偶然の範囲かを調べる量で、説明される割合ではない。
