          **間違えやすい点** 「それぞれ 1 件以下」は「合計 1 件以下」と違う（1 件ずつで合計 2 件の場合が入る）。
      - id: s12p07b
        chapter: 9
        terms: [hypergeometric-distribution, binomial-distribution]
        topic: 大きなロットから少数を抜き取るときは超幾何分布を二項分布で近似してよいことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          1 万個の製品のうち 500 個が不良品のロットから、20 個を戻さずに抜き取る。抜き取った中の不良品の個数の分布を、二項分布 $B(20,\ 0.05)$ で近似してよい理由として最も適切なものはどれか。
        choices:
          - 戻さずに抜き取ると、二項分布にちょうど一致するから
          - 不良率が 0.05 と小さいから
          - 抜き取る個数がロット全体に比べて非常に少なく、戻すか戻さないかで確率がほとんど変わらないから
          - 抜き取る個数が 20 個以上だから
          - 超幾何分布は期待値が計算できないから
        answer: 2
        distractors:
          - 戻さない抽出は超幾何分布で、二項分布と一致はしない
          - 不良率が小さいことはポアソン近似の条件で、この近似の理由ではない
          - 正解
          - 個数が多いことではなく、全体に対する割合が小さいことが理由
          - 超幾何分布の期待値も計算できる（20 × 0.05 = 1）
        explanation: |
          **方針** 戻さない抽出（超幾何分布）と戻す抽出（二項分布）の違いは、取り出すたびに残りの割合が変わること。

          **途中式** 1 万個から 20 個だけ取るので、取り出しても不良率は 0.05 からほとんど変わらない。有限母集団修正 $\dfrac{10000-20}{10000-1}\approx 0.998$ もほぼ 1。

          **答え** 抜き取る個数が全体に比べて非常に少ないから

          **間違えやすい点** 抽出の割合（抽出率）が小さければ、戻さない抽出でも二項分布で近似できる。抽出率が大きいときは超幾何分布を使う。
      - id: s12p07c
        chapter: 9
        terms: [exponential-distribution, poisson-distribution]
        topic: 1時間に平均3件のポアソン到着から次の到着までの待ち時間が20分を超える確率を指数分布で求める
        level: 標準
        definition: false
