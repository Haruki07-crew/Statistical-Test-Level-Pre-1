        explanation: |
          **方針** 独立なポアソン分布の和は、平均を足したポアソン分布にしたがう。合計は平均 3 のポアソン分布。

          **途中式** $P(0)+P(1)=e^{-3}+3e^{-3}=4\times 0.0498\approx 0.199$。

