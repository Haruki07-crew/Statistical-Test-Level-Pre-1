set: 12
title: 2級 模擬試験 第12回
minutes: 90
problems:
  - id: s12p01
    title: 度数分布とグラフの選び方
    context: |
      データをまとめる方法を選ぶ。
    items:
      - id: s12p01a
        chapter: 1
        terms: [frequency-distribution-histogram]
        topic: スタージェスの公式で64個のデータの度数分布表の階級の数の目安を求める
        level: 基本
        definition: false
        type: choice
        question: |
          64 個のデータから度数分布表を作る。階級の数の目安を、スタージェスの公式 $1+\log_2 n$ で求めよ。
        choices:
          - "8"
          - "6"
          - "32"
          - "3"
          - "7"
        answer: 4
        distractors:
          - データの個数の平方根を求めている（別の目安）
          - 1 を足し忘れている
          - データの個数の半分にしている
          - 2 を底とする対数ではなく常用対数を使っている（1 + log₁₀ 64 ≈ 2.8）
          - 正解
        explanation: |
          **方針** $n=64$ を公式に代入する。

          **途中式** $64=2^6$ なので $\log_2 64=6$。階級の数の目安は $1+6=7$。

          **答え** 7

          **間違えやすい点** スタージェスの公式は目安で、データの範囲や分布の形を見て調整してよい。階級が少なすぎると形がつぶれ、多すぎると柱がでこぼこになる。
      - id: s12p01b
        chapter: 1
        terms: [bar-pie-band-chart]
        topic: 複数回答の質問では割合の合計が100パーセントを超えるので円グラフではなく棒グラフを使うことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          「よく使う交通手段をすべて選んでください」という質問（複数回答可）に 200 人が答え、電車 60%、バス 45%、自転車 30%、車 25% だった。この結果を表すグラフとして最も適切なものはどれか。
        choices:
          - 4 つの割合を扇形にした円グラフ
          - 交通手段ごとの割合を並べた棒グラフ
          - 4 つの割合を積み上げた 100% の帯グラフ
          - 交通手段を横軸にした折れ線グラフ
          - 割合のヒストグラム
        answer: 1
        distractors:
          - 合計が 160% になり、全体を 100% とする円グラフにできない
          - 正解
          - 帯グラフも全体を 100% に分ける図で、合計が 100% を超える複数回答には使えない
          - 折れ線グラフは時間などの順序のある変化を表す
          - ヒストグラムは量的変数の分布を表す図で、カテゴリの比較には使わない
        explanation: |
          **方針** 割合の合計が 100% になるかを確かめる。

          **途中式** $60+45+30+25=160$% で、1 人が複数を選んでいるので 100% を超える。全体を分ける円グラフや帯グラフは使えない。

          **答え** 交通手段ごとの割合を並べた棒グラフ

          **間違えやすい点** 円グラフ・帯グラフは「全体の内訳」を表す。複数回答の結果は、各項目を選んだ人の割合として棒グラフで比べる。
  - id: s12p02
    title: 四分位数と単位の変換
    context: |
      データの代表値や散らばりを求める。
    items:
      - id: s12p02a
        chapter: 2
        terms: [quartiles-iqr]
        topic: 偶数個のデータを小さい半分と大きい半分に分けて四分位数を求め四分位範囲を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          10 個のデータ 3, 5, 6, 8, 9, 11, 12, 14, 15, 20 の四分位範囲を求めよ。ただし、四分位数は、データを小さいほうの 5 個と大きいほうの 5 個に分け、それぞれの中央値とする。
        choices:
          - "17"
          - "4"
          - "8"
          - "10"
          - "9"
        answer: 2
        distractors:
          - 範囲（最大値 − 最小値）を求めている
          - 四分位範囲の半分（四分位偏差）を求めている
          - 正解
          - 中央値を答えている
          - 第 1 四分位数を小さいほうの 5 個の 2 番目（5）としている
        explanation: |
          **方針** 小さいほうの 5 個と大きいほうの 5 個の、それぞれの中央値を求める。

          **途中式** 小さいほう 3, 5, 6, 8, 9 の中央値は 6（第 1 四分位数）、大きいほう 11, 12, 14, 15, 20 の中央値は 14（第 3 四分位数）。四分位範囲は $14-6=8$。

          **答え** 8

          **間違えやすい点** 四分位数の求め方にはいくつかの流儀があり、ソフトによって値が少し違う。問題文の決め方にしたがう。
      - id: s12p02b
        chapter: 2
        terms: [sample-variance-sd, mean-median-mode]
        topic: 華氏で測った気温の平均と標準偏差を摂氏に換算する1次変換で定数を引く影響と掛ける影響を区別する
        level: 基本
        definition: false
        type: choice
        question: |
          ある月の気温を華氏（°F）で記録したところ、平均 68°F、標準偏差 9°F だった。摂氏（°C）は $C=(F-32)\times\dfrac59$ で換算できる。摂氏での平均と標準偏差の組合せとして正しいものはどれか。
        choices:
          - 平均 20℃、標準偏差 9℃
          - 平均約 37.8℃、標準偏差 5℃
          - 平均 20℃、標準偏差 5℃
          - 平均 20℃、標準偏差約 −12.8℃
          - 平均 20℃、標準偏差約 2.78℃
        answer: 2
        distractors:
          - 標準偏差を換算していない
          - 平均から 32 を引き忘れている
          - 正解
          - 標準偏差からも 32 を引いている（標準偏差は負にならない）
          - 標準偏差に 5/9 の 2 乗を掛けている（2 乗を掛けるのは分散）
        explanation: |
          **方針** $C=aF+b$ の形の 1 次変換では、平均は同じ式で変わり、標準偏差は $|a|$ 倍になる（$b$ の影響を受けない）。

          **途中式** 平均 $(68-32)\times\dfrac59=20$℃。標準偏差 $9\times\dfrac59=5$℃。

          **答え** 平均 20℃、標準偏差 5℃

          **間違えやすい点** 定数を足し引きしてもデータの散らばりは変わらない。分散は $a^2$ 倍、標準偏差は $|a|$ 倍。
  - id: s12p03
    title: 相関と回帰の性質
    context: |
      2 つの量的変数の関係を調べる。
    items:
      - id: s12p03a
        chapter: 3
        terms: [stratified-scatter, simpsons-paradox]
        topic: 店舗ごとには価格と販売数が負の相関なのに全店舗を合わせると正の相関になる理由を層の違いとして判断する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの店舗で、ある商品の日ごとの価格と販売数を記録した。店舗ごとに見ると、どちらの店舗でも価格が高い日ほど販売数が少なかった（負の相関）。ところが、2 店舗のデータを合わせて散布図を描くと、正の相関になった。この理由として最も適切なものはどれか。
        choices:
          - 店舗ごとの相関の計算が誤っている
          - データを合わせると点の数が増えるので、相関は必ず正になる
          - 価格が高いほど売れるという関係が、本当の関係である
          - 負の相関どうしを合わせると、必ず正の相関になる
          - 客の多い店舗のほうが全体に価格が高く設定されており、店舗の違いが合わせたデータに正の相関を生んでいる
        answer: 4
        distractors:
          - 層ごとの相関と全体の相関が逆になることはありうる
          - 点の数で相関の符号は決まらない
          - 層ごとに見ると、価格が高いほど売れていない
          - 合わせても負のままのことも多い。逆転は層の平均の位置しだい
          - 正解
        explanation: |
          **方針** 層（店舗）ごとの散布図と、合わせた散布図を分けて考える。

          **途中式** 客の多い店舗は価格も販売数も全体に高い位置に点が集まる。2 つの点の雲の位置の違いが右上がりに並ぶので、合わせると正の相関になる。

          **答え** 店舗の違いが、合わせたデータに正の相関を生んでいる

          **間違えやすい点** 層によって平均が違うデータを合わせると、層の中の関係と違う相関が出ることがある。層別の散布図で確かめる。
      - id: s12p03b
        chapter: 4
        terms: [least-squares-method]
        topic: 最小二乗法が最小にする量が目的変数の方向の残差の2乗の和であることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          単回帰で $y$ を $x$ で説明する直線を最小二乗法で求める。最小にしている量はどれか。
        choices:
          - 各点から直線までの垂直な距離の 2 乗の和
          - 各点と直線の、横方向（x の方向）のずれの 2 乗の和
          - 各点と直線の、縦方向のずれの和
          - 各点と直線の、縦方向のずれの絶対値の最大値
          - 各点と直線の、縦方向（y の方向）のずれの 2 乗の和
        answer: 4
        distractors:
          - 点から直線に下ろした垂線の長さは、最小二乗法の残差ではない
          - 横方向のずれを最小にするのは、x を y で説明する回帰
          - ずれの和は、切片を含む最小二乗の直線ではいつも 0 で、最小にする量ではない
          - 最大のずれを最小にする方法は最小二乗法ではない
          - 正解
        explanation: |
          **方針** 残差 $e_i=y_i-\hat y_i$ は、目的変数の方向のずれ。

          **途中式** 最小二乗法は $\sum e_i^2=\sum(y_i-a-bx_i)^2$ を最小にする $a$、$b$ を求める。

          **答え** 縦方向のずれの 2 乗の和

          **間違えやすい点** $y$ を $x$ で説明する回帰と、$x$ を $y$ で説明する回帰は、最小にするずれの方向が違うので、別の直線になる。
      - id: s12p03c
        chapter: 4
        terms: [simple-regression, standard-score]
        topic: xとyをどちらも標準化してから回帰すると傾きが相関係数に切片が0になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          $x$ と $y$ の相関係数は 0.6 である。$x$ と $y$ をそれぞれ標準化（平均 0・標準偏差 1 に変換）してから、標準化した $y$ を標準化した $x$ で説明する回帰直線を求めた。傾きと切片の組合せとして正しいものはどれか。
        choices:
          - 傾き 0.6、切片 0
          - 傾き 1、切片 0
          - 傾き 0.36、切片 0
          - 傾き 0.6、切片は標準化する前の切片と同じ
          - 傾き約 1.67、切片 0
        answer: 0
        distractors:
          - 正解
          - 標準化しても、点が直線に乗るわけではない
          - 傾きに決定係数（相関係数の 2 乗）を使っている
          - 標準化すると両方の平均が 0 になるので、直線は原点を通る
          - 傾きを 1/r としている
        explanation: |
          **方針** 傾きは $b=r\,\dfrac{s_y}{s_x}$、直線は平均の点を通る。

          **途中式** 標準化すると $s_x=s_y=1$ なので $b=r=0.6$。両方の平均が 0 なので切片は $0-0.6\times 0=0$。

          **答え** 傾き 0.6、切片 0

          **間違えやすい点** 標準化した回帰の傾きは相関係数そのもので、$|r|<1$ なら予測は平均（0）に近づく。
  - id: s12p04
    title: 時系列と指数
    context: |
      時系列データや指数を扱う。
    items:
      - id: s12p04a
        chapter: 5
        terms: [moving-average, time-series-components]
        topic: 曜日による7日周期の変動を除くための移動平均の項数を周期に合わせて選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          ある店の毎日の来客数には、曜日による変動（7 日周期）がある。曜日による変動を取り除いて傾向を見るための移動平均の項数として、最も適切なものはどれか。
        choices:
          - 3 項
          - 5 項
          - 12 項
          - 7 項
          - 30 項
        answer: 3
        distractors:
          - 3 日分では、曜日の変動がならされない
          - 平日の日数に合わせても、1 週間の変動はならされない
          - 12 項は月次データの 1 年周期に使う
          - 正解
          - 周期と合っていないので曜日の変動が少し残り、傾向の変化にも遅れて反応する
        explanation: |
          **方針** 周期と同じ項数の移動平均をとると、どの平均にもすべての曜日が 1 回ずつ入る。

          **途中式** 7 項移動平均は月〜日の 7 日を 1 回ずつ含むので、曜日の効果が平均されて消える。

          **答え** 7 項

          **間違えやすい点** 項数は周期に合わせる。四半期データなら 4 項、月次データなら 12 項（偶数なので中心化する）。
      - id: s12p04b
        chapter: 5
        terms: [price-index, index-number]
        topic: 値上がりした品目の購入量が減るためパーシェ価格指数がラスパイレス価格指数より小さくなりやすいことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある期間に、いくつかの品目が大きく値上がりし、消費者はそれらの購入量を減らして、値上がりの小さい品目に切りかえた。このとき、ラスパイレス価格指数とパーシェ価格指数の関係として最も適切なものはどれか。
        choices:
          - 比較時の購入量を重みにするパーシェ指数では値上がりした品目の重みが小さくなるので、パーシェ指数はラスパイレス指数より小さくなりやすい
          - 基準時の購入量を重みにするラスパイレス指数のほうが、値上がりした品目の重みが小さいので小さくなる
          - 2 つの指数は重みが違っても、いつも同じ値になる
          - パーシェ指数は購入量の変化を考えないので、ラスパイレス指数より大きくなる
          - 2 つの指数の大小は、品目の数だけで決まる
        answer: 0
        distractors:
          - 正解
          - ラスパイレス指数は基準時の量を使うので、値上がり前の多い購入量のまま重みが付く
          - 重みが違うので、ふつう値は違う
          - 購入量の変化を反映するのはパーシェ指数
          - 品目の数ではなく、価格と購入量の変化の関係で決まる
        explanation: |
          **方針** ラスパイレス指数は基準時の購入量、パーシェ指数は比較時の購入量を重みにする。

          **途中式** 値上がりした品目は比較時の購入量が減っているので、パーシェ指数ではその品目の重みが小さくなり、指数の上がり方が小さくなる。ラスパイレス指数は値上がり前の購入量で重みを付けるので、上がり方が大きめに出る。

          **答え** パーシェ指数はラスパイレス指数より小さくなりやすい

          **間違えやすい点** 価格と購入量が逆向きに動く（高くなったものを買わなくなる）ときに、ラスパイレス ＞ パーシェ になりやすい。いつも成り立つわけではない。
  - id: s12p05
    title: 調査と実験の設計
    context: |
      データの集め方を考える。
    items:
      - id: s12p05a
        chapter: 6
        terms: [stratified-sampling]
        topic: 層化抽出の層を作る変数は調べたい量と関係の強いものがよいことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある市の世帯の年間収入を、層化抽出法で調べる。精度を上げるために層を作る変数として、最も適切なものはどれか。
        choices:
          - 世帯主の名前の五十音順
          - 世帯主の職業や、住んでいる地区の平均的な所得水準など、収入と関係の強い変数
          - 世帯主の誕生月
          - 世帯番号が偶数か奇数か
          - 調査を担当する調査員
        answer: 1
        distractors:
          - 収入と関係がないので、層の中も層の間もばらつきが変わらず、精度が上がらない
          - 正解
          - 収入と関係がないので、精度が上がらない
          - 収入と関係がないので、精度が上がらない
          - 調べたい量と関係のない分け方で、精度が上がらない
        explanation: |
          **方針** 層化で精度が上がるのは、層の中が均質で、層の間で値が違うとき。

          **途中式** 収入と関係の強い変数（職業・地区の所得水準など）で層を作ると、層の中の収入が似て、層の間の違いが推定のぶれから取り除かれる。

          **答え** 収入と関係の強い変数

          **間違えやすい点** 層化しても偏りが生じるわけではないが、調べたい量と関係のない変数で層を作っても精度はほとんど上がらない。
      - id: s12p05b
        chapter: 6
        terms: [observational-vs-experimental, treatment-and-control]
        topic: 前回の成績が下位の生徒だけに補習をして次の試験で平均が上がっても平均への回帰があるので対照群が必要なことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          前回の試験で成績が下位 10% だった生徒だけに補習を行ったところ、次の試験でその生徒たちの平均点が上がった。補習の効果を判断するうえで、最も適切なものはどれか。
        choices:
          - 平均点が上がったので、補習の効果があったことが示された
          - 下位の生徒は偶然悪かった人も多く、補習がなくても次は平均に近づく（平均への回帰）ので、補習をしない比較群と比べる必要がある
          - 下位の生徒の点数は上がりにくいので、補習の効果は実際より小さく見えている
          - 同じ生徒を比べているので、ほかの要因の影響はない
          - 上位の生徒の平均点が下がっていれば、補習の効果は確実である
        answer: 1
        distractors:
          - 対照がないので、上がった分が補習によるものとは言えない
          - 正解
          - 極端に悪かった集団は、何もしなくても次は上がりやすい
          - 試験の難しさの違いなども影響する
          - 上位の生徒の平均点が下がるのも平均への回帰で起こる
        explanation: |
          **方針** 極端な値で選んだ集団は、次の測定で平均に近づきやすい（平均への回帰）。

          **途中式** 試験の点数には偶然の要素があり、下位 10% には「たまたま悪かった」人が多い。次の試験では、補習がなくても平均点が上がりやすい。

          **答え** 補習をしない比較群（対照群）と比べる必要がある

          **間違えやすい点** 下位の生徒を無作為に補習する群としない群に分けて比べれば、平均への回帰の影響を除いて効果を判断できる。
  - id: s12p06
    title: 確率と確率変数
    context: |
      確率や確率変数の性質を考える。
    items:
      - id: s12p06a
        chapter: 7
        terms: [counting, events-and-probability]
        topic: 3人で1回じゃんけんをして勝ち負けが決まる確率をあいこの場合の数を数えて余事象で求める
        level: 標準
        definition: false
        type: choice
        question: |
          3 人が 1 回じゃんけんをする。各人はグー・チョキ・パーを等しい確率で独立に出す。1 回で勝ち負けが決まる（あいこにならない）確率を求めよ。
        choices:
          - 1/3
          - 8/9
          - 2/3
          - 7/9
          - 1/2
        answer: 2
        distractors:
          - あいこになる確率を答えている
          - 3 人とも同じ手のときだけをあいことしている（3 人とも違う手もあいこ）
          - 正解
          - 3 人とも違う手のときだけをあいことしている
          - 根拠なく半分としている
        explanation: |
          **方針** 全部で $3^3=27$ 通り。あいこは「3 人とも同じ手」と「3 人とも違う手」。

          **途中式** 3 人とも同じは 3 通り、3 人とも違うは $3!=6$ 通りで、あいこは 9 通り（確率 $1/3$）。勝ち負けが決まる確率は $1-\dfrac{9}{27}=\dfrac23$。

          **答え** 2/3

          **間違えやすい点** 3 人とも違う手（グー・チョキ・パーが 1 人ずつ）もあいこになる。
      - id: s12p06b
        chapter: 8
        terms: [expectation-variance-properties, joint-probability-function]
        topic: Xが−1と0と1を等しい確率でとりYがXの2乗のとき共分散は0だが独立でないことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          確率変数 $X$ は −1, 0, 1 をそれぞれ確率 1/3 でとり、$Y=X^2$ とする。正しいものはどれか。
        choices:
          - X と Y の共分散は 0 なので、X と Y は独立である
          - X と Y の共分散は 0 だが、X と Y は独立ではない
          - Y は X で決まるので、X と Y の相関係数は 1 である
          - X と Y の共分散は 2/3 である
          - X と Y の共分散は負である
        answer: 1
        distractors:
          - 共分散が 0 でも独立とは限らない（X = 0 なら Y = 0 と決まる）
          - 正解
          - 相関係数は直線的な関係だけを測る。Y は X の 2 次式で、直線の関係はない
          - E[Y] = 2/3 と取り違えている
          - E[XY] = E[X³] = 0、E[X] = 0 なので共分散は 0
        explanation: |
          **方針** $\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y]$ を計算し、独立かどうかは条件付き確率で確かめる。

          **途中式** $E[X]=0$、$E[XY]=E[X^3]=\dfrac{-1+0+1}{3}=0$ なので共分散は 0。一方、$P(Y=0)=1/3$ だが $P(Y=0\mid X=0)=1$ なので独立ではない。

          **答え** 共分散は 0 だが、独立ではない

          **間違えやすい点** 独立なら共分散は 0 だが、逆は成り立たない。共分散（相関係数）は直線的な関係しかとらえない。
  - id: s12p07
    title: 確率分布の性質
