          **間違えやすい点** 群の大きさが違っても、群内の自由度は各群の「大きさ − 1」の合計で求められる。
      - id: s12p13b
        chapter: 15
        terms: [randomized-block-design, anova-table]
        topic: 4処理3ブロックの乱塊法の平方和から処理のF比を求めブロックを無視した一元配置の値と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          4 種類の処理を 3 つのブロックのそれぞれで 1 回ずつ行う乱塊法の実験で、処理の平方和は 24、ブロックの平方和は 30、誤差の平方和は 12 だった。処理の効果を調べる F 比を求めよ。
        choices:
          - 約 1.52
          - "3.0"
          - "4.0"
          - "7.5"
          - "2.0"
        answer: 2
        distractors:
          - ブロックを無視して一元配置で計算している（ブロックの平方和が誤差に入る）
          - 処理の自由度を 4 としている（正しくは 4 − 1 = 3）
          - 正解
          - ブロックの F 比を求めている
          - 平方和の比をそのまま求めている（自由度で割っていない）
        explanation: |
          **方針** 自由度は処理 $4-1=3$、ブロック $3-1=2$、誤差 $3\times 2=6$。

          **途中式** 処理の平均平方 $24/3=8$、誤差の平均平方 $12/6=2$ なので $F=8/2=4.0$。

          **答え** 4.0

          **間違えやすい点** ブロックを無視すると、ブロックの違い（30）が誤差に入り、$F=\dfrac{24/3}{42/8}\approx 1.52$ と小さくなって処理の効果を見逃しやすい。
