          - 約 0.149
        answer: 3
        distractors:
          - 合計が 0 件の確率だけを求めている
          - それぞれの窓口が 1 件以下である確率を掛けている（合計 2 件の場合も含んでしまう）
          - 2 つの窓口の平均 1.5 をポアソン分布の平均にしている
          - 正解
