        question: |
          問い合わせは 1 時間に平均 3 件のポアソン過程にしたがって来る（次の問い合わせまでの時間は指数分布にしたがう）。ある時点から次の問い合わせまで 20 分を超える確率を求めよ。
        choices:
          - 約 0.368
          - 約 0.050
          - 約 0.632
          - 約 0.333
          - 約 0.135
        answer: 0
        distractors:
          - 正解
          - 1 時間待つ確率（e の −3 乗）を求めている
          - 20 分以内に来る確率を答えている
          - 20 分 ÷ 1 時間 で割合を求めている
          - 40 分を超える確率（e の −2 乗）を求めている
        explanation: |
          **方針** 20 分 ＝ 1/3 時間。「20 分を超えて来ない」は「20 分間の件数が 0 件」と同じ。

          **途中式** 20 分間の件数は平均 $3\times\dfrac13=1$ のポアソン分布なので、0 件の確率は $e^{-1}\approx 0.368$（指数分布で $P(T>1/3)=e^{-3\times 1/3}$ と同じ）。

          **答え** 約 0.368

          **間違えやすい点** 時間の単位をそろえる。1 時間あたりのレート 3 に、時間 1/3 を掛けてから指数に入れる。
      - id: s12p07d
        chapter: 9
        terms: [bernoulli-distribution]
        topic: ベルヌーイ分布の分散p(1−p)がp＝0.5で最大値0.25になることを答える
        level: 基本
        definition: false
        type: choice
        question: |
          成功の確率が $p$ のベルヌーイ分布（成功なら 1、失敗なら 0）の分散について、正しいものはどれか。
        choices:
          - p ＝ 1 のとき最大で、最大値は 1
          - p ＝ 0.5 のとき最大で、最大値は 0.5
          - p ＝ 0.5 のとき最大で、最大値は 0.25
          - p によらず一定で 0.25
          - p ＝ 0 のとき最大
        answer: 2
        distractors:
          - p = 1 ならいつも成功で、ばらつきは 0
          - 標準偏差の最大値 0.5 と取り違えている
          - 正解
          - 分散 p(1 − p) は p によって変わる
          - p = 0 ならいつも失敗で、ばらつきは 0
        explanation: |
          **方針** 分散は $p(1-p)$。

          **途中式** $p(1-p)=0.25-(p-0.5)^2$ なので、$p=0.5$ で最大値 0.25。

          **答え** $p=0.5$ のとき最大で、最大値は 0.25

          **間違えやすい点** 比率の推定で見当がつかないときに $p=0.5$ を使うのは、この分散が最大になって必要な標本の大きさが安全側になるから。
  - id: s12p08
    title: 大数の法則と中心極限定理
    context: |
      多くの試行の平均や合計の性質を考える。標準正規分布の上側確率は、$P(Z>0.12)=0.4522$、$P(Z>1.17)=0.1210$ とする。
    items:
      - id: s12p08a
        chapter: 10
        terms: [weak-law-of-large-numbers]
        topic: 公正なコインで表が続いたあとも次に表が出る確率は0.5のままで大数の法則は個々の試行の結果を補正しないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          公正なコインを投げたところ、10 回続けて表が出た。次の 1 回について正しいものはどれか。
        choices:
          - 大数の法則により、表と裏の回数をそろえるため裏が出やすくなっている
          - 表が続いているので、次も表が出やすい
          - 10 回続けて表が出る確率は非常に小さいので、次は必ず裏が出る
          - 表が出る確率は 0.5 のままである
          - 表が出る確率は 1/11 である
        answer: 3
        distractors:
          - 大数の法則は、回数を増やすと割合が 0.5 に近づくというもので、個々の結果を補正するわけではない
          - 公正なコインでは各回は独立で、前の結果に影響されない
          - 各回は独立なので、次が裏になる確率も 0.5
          - 正解
          - 根拠のない値
        explanation: |
          **方針** 公正なコインの各回は独立。

          **途中式** 前の 10 回の結果に関係なく、次に表が出る確率は 0.5。

          **答え** 表が出る確率は 0.5 のまま

          **間違えやすい点** 大数の法則は「回数を増やすと表の割合が 0.5 に近づく」ことで、過去の偏りを打ち消すように次の結果が変わるわけではない（ギャンブラーの誤謬）。
      - id: s12p08b
        chapter: 10
        terms: [central-limit-theorem, expectation-variance-properties]
        topic: さいころを100回投げた目の合計が370を超える確率を1回の期待値と分散から中心極限定理で近似する
        level: 標準
        definition: false
        type: choice
        question: |
          公正なさいころを 100 回投げる。1 回の目の期待値は 3.5、分散は $35/12\approx 2.917$ である。目の合計が 370 を超える確率を、中心極限定理を使って近似せよ（連続修正はしない）。
        choices:
          - 約 0.121
          - 約 0.242
          - 約 0.879
          - 約 0.452
          - ほぼ 0
        answer: 0
        distractors:
          - 正解
          - 両側の確率にしている
          - 370 以下の確率を答えている
          - 合計の標準偏差を 1 回の標準偏差の 100 倍にしている（√100 倍が正しい）
          - 合計の標準偏差を 1 回の標準偏差のままにしている
        explanation: |
          **方針** 合計の期待値は $100\times 3.5=350$、分散は $100\times 2.917=291.7$、標準偏差は $\sqrt{291.7}\approx 17.08$。

          **途中式** $z=\dfrac{370-350}{17.08}\approx 1.17$、$P(Z>1.17)=0.121$。

          **答え** 約 0.121

          **間違えやすい点** 独立な和の分散は $n$ 倍、標準偏差は $\sqrt n$ 倍になる。
      - id: s12p08c
        chapter: 10
        terms: [normal-approximation-binomial-poisson]
        topic: 二項分布を正規分布で近似してよい目安としてnpとn(1−p)がどちらも5以上程度であることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          二項分布 $B(n,\ p)$ を正規分布で近似するときの目安として、最も適切なものはどれか。
        choices:
          - n が 10 以上であれば、p によらずよい近似になる
          - p が 0.5 から離れているほどよい近似になる
          - np が 1 未満であること
          - np と n(1 − p) がどちらも 5 以上（または 10 以上）程度あること
          - n と p によらず、いつもよい近似になる
        answer: 3
        distractors:
          - p が 0 や 1 に近いと、n が 10 程度では分布が偏っていて近似が悪い
          - p が 0.5 に近いほど分布が左右対称で、近似がよい
          - np が小さいときはポアソン近似の場面
          - 正解
          - n が小さいときや p が極端なときは近似が悪い
        explanation: |
          **方針** 二項分布が正規分布に近い形（左右対称の山）になる条件を考える。

          **途中式** 成功と失敗の回数の期待値 $np$、$n(1-p)$ がどちらもある程度大きければ、分布は左右対称に近くなる。

          **答え** $np$ と $n(1-p)$ がどちらも 5 以上程度

          **間違えやすい点** 目安は教科書によって 5 や 10 など違う。$p$ が小さく $np$ も小さいときは、ポアソン分布で近似する。
  - id: s12p09
    title: 推定の方法
    context: |
      母数を推定する。
    items:
      - id: s12p09a
        chapter: 11
        terms: [ci-mean-known-variance, poisson-distribution]
        topic: ポアソン分布の分散が平均に等しいことを使い100日分の平均件数から1日の平均件数の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある窓口の 1 日の問い合わせの件数はポアソン分布にしたがう。100 日分の件数の平均は 4.0 件だった。1 日の平均件数 $\lambda$ の 95% 信頼区間を、正規近似で求めよ（標準誤差には $\sqrt{\bar x/n}$ を使う）。
        choices:
          - (0.08, 7.92)
          - (3.92, 4.08)
          - (3.22, 4.78)
          - (3.67, 4.33)
          - (3.61, 4.39)
        answer: 4
        distractors:
          - 1 日の件数の標準偏差 √4 = 2 をそのまま使っている（√n で割っていない）
          - 分散 4 ではなく平均を n で割った 0.04 を標準誤差にしている
          - 標準偏差を √λ ではなく λ（= 4）としている
          - 90% 信頼区間の 1.645 を使っている
          - 正解
        explanation: |
          **方針** ポアソン分布の分散は平均と等しいので、1 日の件数の分散を $\bar x=4$ で推定する。

          **途中式** 標準誤差 $\sqrt{4/100}=0.2$。$4.0\pm 1.96\times 0.2=4.0\pm 0.392$ より $(3.61,\ 4.39)$。

          **答え** (3.61, 4.39)

          **間違えやすい点** 標準誤差は「1 日の件数の標準偏差 ÷ √n」。ポアソン分布の標準偏差は $\sqrt\lambda$。
      - id: s12p09b
        chapter: 11
        terms: [consistent-estimator, unbiased-estimator]
        topic: 母平均の推定量のうち不偏ではないが一致推定量であるものを選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          母平均 $\mu$ の母集団から大きさ $n$ の標本 $X_1,\dots,X_n$ をとる（$\bar X$ は標本平均）。$\mu$ の推定量のうち、不偏推定量ではないが一致推定量であるものはどれか。
        choices:
          - X̄
          - X̄ ＋ 1/n
          - X₁
          - (X₁ ＋ Xₙ)/2
          - 0.9 X̄
        answer: 1
        distractors:
          - 不偏推定量で、一致推定量でもある
          - 正解
          - 不偏推定量だが、n を増やしてもばらつきが減らないので一致推定量ではない
          - 不偏推定量だが、2 つの値しか使わないので一致推定量ではない
          - 期待値は 0.9μ で不偏ではなく、n を増やしても 0.9μ に近づくので一致推定量でもない（μ ≠ 0 のとき）
        explanation: |
          **方針** 不偏：期待値が $\mu$。一致：$n$ を大きくすると $\mu$ に近づく。

          **途中式** $E[\bar X+1/n]=\mu+1/n\ne\mu$ で不偏ではないが、$n\to\infty$ で $1/n\to 0$、$\bar X\to\mu$ なので一致推定量。

          **答え** $\bar X+1/n$

          **間違えやすい点** 不偏性と一致性は別の性質。$X_1$ は不偏でも、$n$ を増やしても良くならない。
      - id: s12p09c
        chapter: 11
        terms: [unbiased-estimator, sample-variance-sd]
        topic: 母平均が既知のときは母平均からの偏差の2乗の和をnで割ると母分散の不偏推定量になることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          母平均 $\mu$ が**既知**の母集団から大きさ $n$ の標本 $X_1,\dots,X_n$ をとる。$\dfrac{1}{c}\sum_{i=1}^{n}(X_i-\mu)^2$ が母分散 $\sigma^2$ の不偏推定量になる $c$ はどれか。
        choices:
          - n − 1
          - n − 2
          - n ＋ 1
          - √n
          - n
        answer: 4
        distractors:
          - 母平均が未知で標本平均を使うときの値
          - 根拠のない値（単回帰の残差の自由度）
          - 根拠のない値
          - 割る数を平方根にしている
          - 正解
        explanation: |
          **方針** 各 $X_i$ について $E[(X_i-\mu)^2]=\sigma^2$。

          **途中式** $E\left[\sum(X_i-\mu)^2\right]=n\sigma^2$ なので、$n$ で割ると期待値が $\sigma^2$ になる。

          **答え** $n$

          **間違えやすい点** $n-1$ で割るのは、母平均の代わりに標本平均を使うとき。標本平均からの偏差は母平均からの偏差より平均的に小さいので、割る数を 1 減らして補う。
      - id: s12p09d
        chapter: 11
        terms: [ci-mean-unknown-variance, t-distribution]
        topic: 大きさ5の標本のt分布による信頼区間の幅が同じ標準誤差の正規分布による幅の約1.42倍になることを求める
        level: 標準
        definition: false
        type: choice
        question: |
          大きさ 5 の標本から母平均の 95% 信頼区間を作る。母分散が未知で t 分布（自由度 4）を使うときの幅は、仮に同じ標準誤差で正規分布の 1.96 を使ったときの幅の何倍か。ただし $t_{0.025}(4)=2.776$ とする。
        choices:
          - 1 倍
          - 約 2.01 倍
          - 約 1.42 倍
          - 約 0.71 倍
          - 約 1.19 倍
        answer: 2
        distractors:
          - t 分布と正規分布の点の違いを考えていない
          - 比を 2 乗している
          - 正解
          - 比を逆にしている
          - 比の平方根をとっている
        explanation: |
          **方針** 幅は「係数 × 標準誤差」に比例するので、係数の比を求める。

          **途中式** $2.776/1.96\approx 1.42$ 倍。

          **答え** 約 1.42 倍

          **間違えやすい点** 標本が小さいときは t 分布の点がかなり大きく、正規分布で代用すると区間が狭くなりすぎる。標本が大きくなると t の点は 1.96 に近づく。
  - id: s12p10
    title: 検定の考え方
    context: |
      仮説検定の手順と性質を考える。
    items:
      - id: s12p10a
        chapter: 12
        terms: [one-sided-two-sided-test, type-i-and-ii-errors]
        topic: データを見てから差の向きに合わせて片側検定を選ぶと実質的な有意水準が2倍になることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある研究者は、データを見て標本平均が帰無仮説の値より大きければ右側の、小さければ左側の片側検定（有意水準 5%）を行うことにした。この手順の問題点として最も適切なものはどれか。
        choices:
          - 片側検定は両側検定より棄却しにくいので、差を見逃しやすくなる
          - 標本平均の向きに合わせるのは正しい手順で、問題はない
          - 有意水準が実質 2.5% になり、厳しくなりすぎる
          - どちらの向きの差でも 5% で棄却されうるので、帰無仮説が正しいときに棄却する確率は実質 10% になる
          - 片側検定では p 値が計算できない
        answer: 3
        distractors:
          - 片側 5% の境目 1.645 は両側 5% の 1.96 より小さく、棄却しやすい
          - 向きはデータを見る前に決めておく必要がある
          - 2.5% ではなく、2 倍の 10% になる
          - 正解
          - 片側検定でも p 値は計算できる
        explanation: |
          **方針** 帰無仮説が正しいとき、この手順で棄却される確率を考える。

          **途中式** 統計量が 1.645 より大きいとき、または −1.645 より小さいときに棄却するので、確率は $0.05+0.05=0.10$。

          **答え** 実質 10% の有意水準になる

          **間違えやすい点** 片側か両側か、どちら向きかは、データを見る前に研究の目的から決める。
      - id: s12p10b
        chapter: 12
        terms: [power-function, significance-level]
        topic: 本当の母平均が帰無仮説の値に等しいとき検出力関数の値が有意水準に等しいことを答える
        level: 基本
        definition: false
        type: choice
        question: |
          有意水準 5% の母平均の検定で、検出力（帰無仮説を棄却する確率）を本当の母平均の関数として描いた（検出力関数）。本当の母平均がちょうど帰無仮説の値のとき、検出力関数の値はいくらか。
        choices:
          - "0"
          - "0.05"
          - "0.95"
          - "0.5"
          - "1"
        answer: 1
        distractors:
          - 帰無仮説が正しくても、確率 5% で棄却される
          - 正解
          - 棄却しない確率を答えている
          - 根拠なく半分としている
          - 帰無仮説が正しいときに必ず棄却するわけではない
        explanation: |
          **方針** 本当の母平均が帰無仮説の値なら、棄却するのは第 1 種の過誤。

          **途中式** その確率は有意水準そのものなので 0.05。

          **答え** 0.05

          **間違えやすい点** 検出力関数は、帰無仮説の値で有意水準に等しく、本当の値が離れるほど 1 に近づく。
      - id: s12p10c
        chapter: 12
        terms: [chi-square-test-variance]
        topic: 正規母集団の16個の不偏分散から母分散が基準より小さいかを左片側のカイ二乗検定で下側5パーセント点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある工程の母分散は 4 とされている。改善後に大きさ 16 の標本をとったところ、不偏分散は 2 だった。「母分散は 4 より小さくなった」かを有意水準 5% の左片側検定で調べる。正しいものはどれか。ただし自由度 15 のカイ二乗分布の下側 5% 点は 7.261、上側 5% 点は 25.00、自由度 16 の下側 5% 点は 7.962 とする。
        choices:
          - χ² ＝ 7.5 で、下側 5% 点 7.261 より大きいので棄却しない
          - χ² ＝ 7.5 で、上側 5% 点 25.00 より小さいので棄却する
          - χ² ＝ 0.5 で、7.261 より小さいので棄却する
          - χ² ＝ 7.5 で、自由度 16 の下側 5% 点 7.962 より小さいので棄却する
          - χ² ＝ 7.5 で、自由度 15 より小さいので棄却する
        answer: 0
        distractors:
          - 正解
          - 左片側検定なのに上側の点と比べている
          - (n − 1) を掛けずに分散の比だけを求めている
          - 自由度を n = 16 にしている（正しくは n − 1 = 15）
          - 自由度（期待値）と比べている
        explanation: |
          **方針** $\chi^2=\dfrac{(n-1)s^2}{\sigma_0^2}$ は自由度 $n-1=15$ のカイ二乗分布にしたがう。左片側検定なので下側 5% 点と比べる。

          **途中式** $\chi^2=\dfrac{15\times 2}{4}=7.5$。7.261 より大きいので、棄却域（7.261 以下）に入らない。

          **答え** χ² ＝ 7.5 で、棄却しない

          **間違えやすい点** 不偏分散が半分になっても、標本が小さいと有意にならないことがある。自由度は $n-1$。
  - id: s12p11
    title: 2 標本の検定とカイ二乗検定
    context: |
      2 つの群の比較やカイ二乗検定を使う。
    items:
      - id: s12p11a
        chapter: 13
        terms: [welch-test, two-sample-t-test, pooled-variance]
        topic: 2つの群の大きさが等しいときはプールした分散を使うt統計量とウェルチのt統計量が同じ値になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          大きさがどちらも 12 の 2 つの群で、不偏分散は 20 と 60 だった。プールした分散を使う 2 標本 t 統計量と、ウェルチの t 統計量の関係として正しいものはどれか。
        choices:
          - 2 つの t 統計量の値は等しい（比べる t 分布の自由度は違う）
          - ウェルチの t 統計量のほうが必ず大きい
          - プールした分散を使う t 統計量のほうが必ず大きい
          - 分散が 3 倍違うので、ウェルチの t 統計量は計算できない
          - 2 つの t 統計量の値も自由度も、すべて等しい
        answer: 0
        distractors:
          - 正解
          - 大きさが等しいときは、標準誤差が一致する
          - 大きさが等しいときは、標準誤差が一致する
          - ウェルチの方法は、分散が違うときのための方法
          - 自由度は、プールでは 22、ウェルチでは分散の違いに応じて 22 より小さくなる
        explanation: |
          **方針** 2 つの方法の標準誤差を比べる。

          **途中式** プールした分散は $\dfrac{11\times 20+11\times 60}{22}=40$ で、標準誤差は $\sqrt{40\left(\dfrac1{12}+\dfrac1{12}\right)}=\sqrt{\dfrac{80}{12}}$。ウェルチの標準誤差は $\sqrt{\dfrac{20}{12}+\dfrac{60}{12}}=\sqrt{\dfrac{80}{12}}$ で、同じになる。

          **答え** 2 つの t 統計量の値は等しい

          **間違えやすい点** 値が同じでも、ウェルチの方法では自由度が小さくなる（この例では約 17.6）ので、棄却の境目は大きくなる。群の大きさが違うときは、統計量の値も違う。
      - id: s12p11b
        chapter: 13
        terms: [expected-frequency, binomial-distribution]
        topic: 3枚の硬貨を80回投げる実験で表の枚数が2枚になる期待度数を二項分布から求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 枚の公正な硬貨を同時に投げることを 80 回くり返し、表の枚数（0〜3 枚）を数えた。「硬貨は公正」とする適合度検定で、表が 2 枚の期待度数を求めよ。
        choices:
          - "20"
          - 約 26.7
          - "40"
          - "10"
          - "30"
        answer: 4
        distractors:
          - 0〜3 枚の 4 つの結果が同じ確率と考えている
          - 3 で割っている
          - 表が 2 枚の確率を 1/2 としている
          - 表が 0 枚や 3 枚の期待度数と取り違えている
          - 正解
        explanation: |
          **方針** 表の枚数は二項分布 $B(3,\ 0.5)$ にしたがう。

          **途中式** $P(2)=\binom32(0.5)^3=3/8$。期待度数は $80\times\dfrac38=30$。

          **答え** 30

          **間違えやすい点** 0・1・2・3 枚は同じ確率ではない（1/8・3/8・3/8・1/8）。
      - id: s12p11c
        chapter: 13
        terms: [independence-test]
        topic: 独立性の検定で有意になっても関連の向きや強さや因果関係はわからないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある地域の調査で、喫煙の有無と、ある症状の有無のクロス表について独立性の検定を行い、有意水準 1% で有意になった。この結果からいえることとして最も適切なものはどれか。
        choices:
          - 喫煙がその症状の原因であることが示された
          - 2 つの変数は独立ではない（関連がある）といえるが、関連の強さや因果関係はこの検定だけではわからない
          - 2 つの変数の関連は非常に強い
          - 有意水準 1% なので、99% の人で喫煙と症状が一致している
          - 2 つの変数は独立である
        answer: 1
        distractors:
          - 観察データの関連から因果関係は言えない
          - 正解
          - 有意であることと関連の強さは別（標本が大きいと弱い関連でも有意になる）
          - 有意水準の意味を取り違えている
          - 帰無仮説（独立）は棄却された
        explanation: |
          **方針** 独立性の検定の帰無仮説は「2 つの変数は独立」。

          **途中式** 有意になったので独立という帰無仮説を棄却し、関連があると判断する。関連の向きや強さは、行ごとの割合などで別に見る。

          **答え** 関連があるといえるが、強さや因果関係はわからない

          **間違えやすい点** 観察研究の関連には、年齢などの交絡が入りうる。因果を調べるには、研究の計画から考える必要がある。
  - id: s12p12
    title: 回帰分析の診断
    context: |
      回帰分析の結果を評価する。
    items:
      - id: s12p12a
        chapter: 14
        terms: [multiple-regression-model, regression-output]
        topic: 単位の違う説明変数の偏回帰係数の大きさを比べて重要度を判断してはいけないことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          マンションの家賃（万円）を、広さ（m²）と駅からの距離（km）で説明する重回帰で、広さの係数は 0.05、駅からの距離の係数は −1.2 だった。どちらの変数が家賃の説明に重要かについて、最も適切な考え方はどれか。
        choices:
          - 2 つの係数は単位が違うので、大きさをそのまま比べられない。t 値や、変数を標準化して求めた係数などを参考にする
          - 係数の絶対値が大きい駅からの距離のほうが、必ず重要である
          - 係数が正の広さのほうが、必ず重要である
          - 距離を m で表せば係数は −0.0012 になるので、広さのほうが重要になる
          - 係数の大きさは単位によらないので、そのまま比べてよい
        answer: 0
        distractors:
          - 正解
          - 係数の大きさは単位で変わるので、そのままでは比べられない
          - 係数の符号は関係の向きで、重要さとは関係ない
          - 単位を変えると係数の大きさが変わることを示しているだけで、重要さは変わらない
          - 係数は「説明変数が 1 単位増えたときの変化」なので、単位によって変わる
        explanation: |
          **方針** 偏回帰係数は「ほかの変数を一定にして、その変数が 1 単位増えたときの目的変数の変化」。

          **途中式** 広さ 1 m² と距離 1 km は比べようのない量。距離を m にすると係数は 1000 分の 1 になるが、関係そのものは変わらない。

          **答え** 単位が違うのでそのまま比べられず、t 値や標準化した係数などを参考にする

          **間違えやすい点** 「1 m² 広い」と「1 km 近い」の効果を比べたいときは、実際に起こりうる変化の大きさ（標準偏差など）にそろえて考える。
      - id: s12p12b
        chapter: 14
        terms: [regression-coefficient-t-test, test-correlation-coefficient]
        topic: 単回帰の傾きが0かのt検定の統計量と母相関係数が0かの検定の統計量が等しいことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          20 組のデータで単回帰分析を行い、傾きが 0 かどうかの t 検定を行った。同じデータで、母相関係数が 0 かどうかの検定（$t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$）を行うと、2 つの t の値の関係はどうなるか。
        choices:
          - 相関係数の検定の t は、傾きの t の 2 乗になる
          - 2 つの t の値の間には決まった関係はない
          - 相関係数の検定の t は、傾きの t の √(n − 2) 倍になる
          - 2 つの t の値は等しい
          - 傾きの t は、相関係数の検定の t より必ず大きい
        answer: 3
        distractors:
          - 2 乗の関係は、単回帰の F 統計量と t の関係
          - 単回帰では同じ値になる
          - √(n − 2) はすでに式の中に入っていて、2 つは同じ値になる
          - 正解
          - 同じ値なので、大小はない
        explanation: |
          **方針** 単回帰では「傾きが 0」と「相関係数が 0」は同じことを調べている。

          **途中式** 傾きの t 値を相関係数で書き直すと $\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ になり、2 つは一致する（自由度はどちらも $n-2=18$）。

          **答え** 2 つの t の値は等しい

          **間違えやすい点** 重回帰の個々の係数の t 検定は、単純な相関係数の検定とは一致しない（ほかの説明変数を一定にした効果を調べている）。
      - id: s12p12c
        chapter: 14
        terms: [residual-plot, regression-output]
        topic: 時間の順に並べた残差に同じ符号が長く続くことから誤差が互いに独立でない可能性を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          月ごとの売上を広告費で説明する単回帰を行い、残差を時間の順に並べたところ、正の残差が何か月も続いたあと、負の残差が何か月も続いていた。最も適切な判断はどれか。
        choices:
          - 誤差の分散が説明変数とともに大きくなっている
          - 残差の合計が 0 なので、問題はない
          - 説明変数と残差の相関が強いので、傾きの推定が誤っている
          - 外れ値が 1 つあるので、そのデータを除けばよい
          - 誤差が互いに独立でない（時間的な相関がある）可能性があり、係数の標準誤差や検定の結果が信頼できないおそれがある
        answer: 4
        distractors:
          - それは予測値や説明変数に対して残差が扇形に広がるときのしるし
          - 残差の合計はいつも 0 で、並び方の問題は判断できない
          - 最小二乗法では残差と説明変数の相関はいつも 0
          - 1 点ではなく、長い期間にわたる並び方の問題
          - 正解
        explanation: |
          **方針** 時間の順の残差に規則的な並び（同じ符号が続く）があるかを見る。

          **途中式** 同じ符号が長く続くのは、隣り合う月の誤差に正の相関があるしるし。回帰の標準誤差は誤差の独立を前提にしているので、小さく出すぎて有意になりやすくなる。

          **答え** 誤差が独立でない可能性がある

          **間違えやすい点** 時系列のデータの回帰では、トレンドや季節変動を説明変数に入れる、時系列のモデルを使うなどの対処を考える。
  - id: s12p13
    title: 分散分析の計算
    context: |
      実験の結果を分散分析で調べる。
    items:
      - id: s12p13a
        chapter: 15
        terms: [one-way-anova, anova-table]
        topic: 大きさが5と6と7の3群の一元配置分散分析で群内の自由度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          大きさが 5、6、7 の 3 つの群（合計 18 個）で一元配置分散分析を行う。群内（誤差）の自由度を求めよ。
        choices:
          - "17"
          - "2"
          - "12"
          - "15"
          - "16"
        answer: 3
        distractors:
          - 全体の自由度を答えている
          - 群間の自由度を答えている
          - いちばん小さい群の大きさに合わせて 3 × (5 − 1) としている
          - 正解
          - 群の数ではなく 2 を引いている
        explanation: |
          **方針** 群内の自由度は「データの総数 − 群の数」。

          **途中式** $18-3=15$。群ごとに数えても $(5-1)+(6-1)+(7-1)=15$。

