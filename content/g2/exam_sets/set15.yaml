set: 15
title: 2級 模擬試験 第15回
minutes: 90
problems:
  - id: s15p01
    title: 度数分布とクロス表の図
    context: |
      データを表やグラフにまとめる。
    items:
      - id: s15p01a
        chapter: 1
        terms: [frequency-distribution-histogram]
        topic: 以上と未満で区切った度数分布表で階級の境目の値が上の階級に入ることを答える
        level: 基本
        definition: false
        type: choice
        question: |
          度数分布表の階級を「10 以上 20 未満」「20 以上 30 未満」…と決めた。得点がちょうど 20 点の人は、どの階級に数えるか。
        choices:
          - 10 以上 20 未満
          - 20 以上 30 未満
          - 両方の階級に 1 人ずつ数える
          - どちらの階級にも数えない
          - 2 つの階級に 0.5 人ずつ数える
        answer: 1
        distractors:
          - 「20 未満」には 20 は入らない
          - 正解
          - 1 人を 2 回数えると、度数の合計が人数より多くなる
          - 境目の値も必ずどこかの階級に入る
          - 人数を分けて数えることはしない
        explanation: |
          **方針** 「以上」はその値を含み、「未満」はその値を含まない。

          **途中式** 20 は「20 以上」を満たし、「20 未満」は満たさない。

          **答え** 20 以上 30 未満

          **間違えやすい点** 階級は重なりも抜けもないように区切る。境目の値の扱いは、表の注記で確かめる。
      - id: s15p01b
        chapter: 1
        terms: [cross-tabulation, bar-pie-band-chart]
        topic: 2つの質的変数のモザイク図で横幅が一方の変数の割合を縦の区切りが条件付きの割合を表すことを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          性別（男性・女性）と、ある意見への賛否（賛成・反対）のクロス表を、モザイク図に表した。横方向に男性と女性の 2 本の柱を並べ、それぞれの柱を縦に賛成と反対に区切った。この図の読み方として正しいものはどれか。
        choices:
          - 柱の横幅は賛成の人数を、縦の区切りは性別の割合を表す
          - 柱の横幅はどちらも同じで、縦の区切りは全体に対する割合を表す
          - 柱の横幅は男性と女性の人数の割合を、各柱の縦の区切りはそれぞれの性別の中での賛成と反対の割合を表す
          - 4 つの長方形の面積は、どれも等しい
          - モザイク図からは、賛成の割合を性別で比べることはできない
        answer: 2
        distractors:
          - 横と縦の役割を取り違えている
          - モザイク図では、柱の横幅が人数の割合に比例する
          - 正解
          - 面積はそれぞれの組合せの人数に比例する
          - 各柱の縦の区切りの位置を比べれば、性別ごとの賛成の割合を比べられる
        explanation: |
          **方針** モザイク図では、長方形の面積が各セルの度数に比例する。

          **途中式** 横幅 ＝ 性別の割合、縦の長さ ＝ その性別の中での賛否の割合 なので、面積 ＝ 性別の割合 × 条件付きの割合 ＝ 全体に対する割合。

          **答え** 横幅は性別の割合、縦の区切りは性別ごとの賛否の割合

          **間違えやすい点** 2 本の柱の縦の区切りの高さがそろっていれば、性別と賛否は独立に近い。
  - id: s15p02
    title: 代表値と分散の性質
    context: |
      データの代表値や散らばりの性質を使う。
    items:
      - id: s15p02a
        chapter: 2
        terms: [mean-median-mode]
        topic: 各データとの差の絶対値の和を最小にする値が中央値であることを計算で確かめ平均や中点と区別する
        level: 応用
        definition: false
        type: choice
        question: |
          5 個のデータ 1, 2, 4, 10, 13 について、各データとの差の絶対値の和 $\sum|x_i-c|$ を最小にする値 $c$ と、そのときの和の組合せとして正しいものはどれか。
        choices:
          - c ＝ 6（平均）のとき 22
          - c ＝ 4（中央値）のとき 20
          - c ＝ 7（最大値と最小値の中点）のとき 23
          - c ＝ 4 のとき 0
          - c ＝ 6 のとき 0
        answer: 1
        distractors:
          - 平均は差の 2 乗の和を最小にする値で、絶対値の和は中央値で最小になる
          - 正解
          - 最大値と最小値の中点は、差の絶対値の最大値を最小にする値
          - データが 1 つの値に集まっていない限り、和は 0 にならない
          - 差の和（符号つき）が 0 になるのが平均で、絶対値の和は 0 にならない
        explanation: |
          **方針** いくつかの候補で $\sum|x_i-c|$ を計算して比べる。

          **途中式** $c=4$：$3+2+0+6+9=20$。$c=6$：$5+4+2+4+7=22$。$c=7$：$6+5+3+3+6=23$。中央値 4 で最小。

          **答え** $c=4$（中央値）のとき 20

          **間違えやすい点** 差の 2 乗の和を最小にするのは平均、差の絶対値の和を最小にするのは中央値。中央値が外れ値に強いのはこの性質と関係がある。
      - id: s15p02b
        chapter: 2
        terms: [sample-variance-sd]
        topic: データの2乗の平均から平均の2乗を引いて分散を求め標準偏差やnマイナス1で割った値と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          5 個のデータの平均は 6、データの 2 乗の平均は 40 だった。分散（偏差の 2 乗の和を $n=5$ で割ったもの）を求めよ。
        choices:
          - "34"
          - "2"
          - "5"
          - "40"
          - "4"
        answer: 4
        distractors:
          - 平均を 2 乗せずに引いている
          - 標準偏差を答えている
          - n − 1 ＝ 4 で割った値（不偏分散）に直している
          - 2 乗の平均をそのまま答えている
          - 正解
        explanation: |
          **方針** 分散 ＝（2 乗の平均）−（平均の 2 乗）。

          **途中式** $40-6^2=40-36=4$。

          **答え** 4

          **間違えやすい点** 平均を 2 乗してから引く。不偏分散なら $4\times\dfrac54=5$ になる。
  - id: s15p03
    title: 相関と回帰の注意
    context: |
      相関や回帰の結果を正しく読む。
    items:
      - id: s15p03a
        chapter: 3
        terms: [spurious-correlation, time-series-components]
        topic: どちらもトレンドのある2つの時系列は前の時点からの変化どうしで相関を調べると見かけの相関を避けやすいことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある国の 30 年間の「携帯電話の契約数」と「平均寿命」は、どちらも年とともに増えていて、相関係数は 0.97 だった。2 つの関係を調べるうえで最も適切な方法はどれか。
        choices:
          - 相関係数が 0.97 なので、携帯電話が寿命を延ばしていると判断する
          - 年数を 2 倍の 60 年に増やせば、見かけの相関はなくなる
          - 相関係数を 2 乗して決定係数にすれば、因果関係がわかる
          - 時系列データでは相関係数を計算できない
          - どちらにもトレンドがあるので、前年からの変化（差分）どうしの相関を調べるなど、トレンドを除いて関係を確かめる
        answer: 4
        distractors:
          - どちらも時間とともに増えるだけで、強い相関が出る
          - トレンドが続く限り、年数を増やしても見かけの相関は残る
          - 決定係数にしても因果関係はわからない
          - 計算はできるが、トレンドによる見かけの相関に注意が必要
          - 正解
        explanation: |
          **方針** 2 つの系列がどちらも時間とともに増えると、関係がなくても相関係数は大きくなる。

          **途中式** 前年からの変化（差分）どうしの相関を見ると、トレンドの影響が除かれ、年ごとの増え方に関係があるかを確かめられる。

          **答え** トレンドを除いて関係を確かめる

          **間違えやすい点** 時間（年）が共通の要因になって生じる見かけの相関で、時系列データでは特に起こりやすい。
      - id: s15p03b
        chapter: 4
        terms: [coefficient-of-determination, simple-regression]
        topic: データが2組だけのとき回帰直線は2点を必ず通り決定係数が1になるので当てはまりの良さを示さないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある店の 2 か月分の広告費と売上（2 組のデータ）で単回帰を行ったところ、決定係数は 1 だった。この結果について最も適切なものはどれか。
        choices:
          - 決定係数が 1 なので、広告費から売上を完全に予測できる
          - 2 点を通る直線は必ず引けるので、データが 2 組なら決定係数はいつも 1 になり、当てはまりの良さを示さない
          - 決定係数が 1 なので、広告費が売上の原因である
          - 決定係数が 1 になったのは計算の誤りである
          - 2 組のデータでは、回帰直線は引けない
        answer: 1
        distractors:
          - 2 点ならどんなデータでも直線に乗るので、予測の良さはわからない
          - 正解
          - 決定係数から因果関係はわからない
          - 2 組なら必ず 1 になり、誤りではない
          - 2 点を通る直線は 1 本だけ引ける
        explanation: |
          **方針** 単回帰では切片と傾きの 2 つを推定する。データが 2 組なら、直線は 2 点を通るように決まる。

          **途中式** 残差はどちらも 0 で、残差平方和 0、決定係数 1。残差の自由度は $n-2=0$ で、ばらつきの大きさも評価できない。

          **答え** データが 2 組なら決定係数はいつも 1 になり、当てはまりの良さを示さない

          **間違えやすい点** データの数に比べて推定する係数が多いと、当てはまりは見かけ上よくなる。自由度調整済み決定係数などで考える。
  - id: s15p04
    title: 時系列の加工
    context: |
      時系列データを加工して読み取る。
    items:
      - id: s15p04a
        chapter: 5
        terms: [correlogram, time-series-components]
        topic: トレンドがあるとどのラグの自己相関も大きくなり周期が見えにくいのでトレンドを除いてからコレログラムを見ることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          月次の売上に季節変動があるかをコレログラムで調べたい。売上には強い増加のトレンドもある。最も適切な手順はどれか。
        choices:
          - そのままコレログラムを描けば、ラグ 12 の山で季節変動がすぐわかる
          - トレンドがあるとコレログラムは描けない
          - 自己相関がどのラグでも大きければ、季節変動が強い証拠である
          - コレログラムではなく、売上の平均だけを見ればよい
          - トレンドがあるとどのラグでも自己相関が大きくなり季節の周期が見えにくいので、差分をとるなどしてトレンドを除いてからコレログラムを見る
        answer: 4
        distractors:
          - トレンドの影響で、どのラグも大きな正の値になり、山が目立たない
          - 描くことはできるが、トレンドの影響を強く受ける
          - どのラグでも大きいのは、トレンドがあることのしるし
          - 平均だけでは季節の周期はわからない
          - 正解
        explanation: |
          **方針** トレンドがあると、離れた月どうしも「どちらも平均より上（下）」になりやすく、自己相関がゆっくりしか下がらない。

          **途中式** 前月との差（差分）や移動平均からのずれをとってトレンドを除くと、ラグ 12、24 の山（季節の周期）が見やすくなる。

          **答え** トレンドを除いてからコレログラムを見る

          **間違えやすい点** コレログラムで周期を読むときは、先にトレンドの有無を確かめる。
      - id: s15p04b
        chapter: 5
        terms: [index-number, growth-rate]
        topic: 毎年の前年比を掛け合わせて連鎖指数を求め前年比の変化率を足し合わせる誤りと区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある指数の前年比は、1 年目 1.10 倍、2 年目 1.20 倍、3 年目 0.90 倍だった。最初の年を 100 としたとき、3 年後の指数を求めよ。
        choices:
          - "120"
          - 約 106.7
          - "118.8"
          - "90"
          - "132"
        answer: 2
        distractors:
          - 変化率（＋10%、＋20%、−10%）を足している
          - 前年比を平均している
          - 正解
          - 最後の年の前年比だけを使っている
          - 3 年目の前年比を掛け忘れている
        explanation: |
          **方針** 前年比を順に掛け合わせる（連鎖させる）。

          **途中式** $100\times 1.10\times 1.20\times 0.90=118.8$。

          **答え** 118.8

          **間違えやすい点** 変化率は足し算ではなく掛け算で重なる。＋20% と −20% を続けても元に戻らない（0.96 倍）。
      - id: s15p04c
        chapter: 5
        terms: [growth-rate, log-transformation]
        topic: 自然対数の差が0.10のときの正確な成長率を指数関数で求め対数の差をそのまま成長率とする近似と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある国の GDP の自然対数は、前年の値より 0.10 大きかった。前年からの成長率を正確に求めよ。ただし $e^{0.1}=1.105$ とする。
        choices:
          - 10.0%
          - 約 9.5%
          - 約 25.9%
          - 約 10.5%
          - 0.1%
        answer: 3
        distractors:
          - 対数の差をそのまま成長率にした近似値
          - 1 − e^(−0.1) を求めている
          - 常用対数と取り違えている（10^0.1 − 1）
          - 正解
          - 単位を取り違えている
        explanation: |
          **方針** $\log y_t-\log y_{t-1}=\log\dfrac{y_t}{y_{t-1}}=0.10$ なので、$\dfrac{y_t}{y_{t-1}}=e^{0.10}$。

          **途中式** $e^{0.1}-1=0.105$ で、約 10.5%。

          **答え** 約 10.5%

          **間違えやすい点** 対数の差は成長率の近似（率が小さいほどよく合う）。率が大きいときは指数関数で戻す。
  - id: s15p05
    title: 実験と調査の設計
    context: |
      データの集め方を考える。
    items:
      - id: s15p05a
        chapter: 6
        terms: [fisher-three-principles, cluster-sampling]
        topic: クラス単位で教材を割り付ける実験では同じクラスの生徒が似ているので生徒の数ほど独立な情報がないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい教材の効果を調べるため、学校の 10 クラス（各 30 人）を無作為に 5 クラスずつに分け、一方のクラスでだけ新しい教材を使った。この実験の分析で注意すべき点として、最も適切なものはどれか。
        choices:
          - 同じクラスの生徒は担任や雰囲気が共通で成績が似やすいので、300 人を独立なデータとして扱うと標準誤差を小さく見積もってしまう
          - クラスごとに割り付けたので、無作為化の効果は生徒ごとに割り付けたときとまったく同じである
          - 生徒が 300 人もいるので、どのように分析しても問題はない
          - クラス単位で割り付けると、教材の効果は推定できない
          - 生徒ごとの差は小さいので、クラスの違いは考えなくてよい
        answer: 0
        distractors:
          - 正解
          - 割り付けた単位はクラスで、実質的な反復はクラスの数（各群 5）に近い
          - 生徒どうしが独立でないことを考えないと、有意になりやすくなる
          - クラスの平均を比べるなどの方法で推定できる
          - クラスによる違い（担任など）は大きいことが多い
        explanation: |
          **方針** 無作為に割り付けた単位（クラス）が、実験の反復の単位になる。

          **途中式** 同じクラスの生徒は互いに似ているので、30 人分の情報は独立な 30 人分より少ない。クラスの平均を 1 つのデータとして比べるなど、クラスの違いを考えて分析する。

          **答え** 300 人を独立なデータとして扱うと、標準誤差を小さく見積もってしまう

          **間違えやすい点** 集落抽出法で同じ集落の中が似ていると精度が下がるのと同じ理由。
      - id: s15p05b
        chapter: 6
        terms: [sampling-and-nonsampling-error]
        topic: 無作為抽出の標本誤差は確率の理論で大きさを評価できるが非標本誤差は評価しにくいことを答える
        level: 基本
        definition: false
        type: choice
        question: |
          標本調査の誤差について、正しいものはどれか。
        choices:
          - 非標本誤差は、標準誤差の公式で大きさを計算できる
          - 標本誤差は、標本を大きくしても小さくならない
          - 標本誤差と非標本誤差は、どちらも標本を大きくすれば 0 に近づく
          - 無作為抽出による標本誤差は確率の理論で大きさを見積もれるが、非標本誤差は大きさを見積もるのが難しい
          - 無作為抽出をすれば、非標本誤差は生じない
        answer: 3
        distractors:
          - 標準誤差の公式が表すのは標本誤差だけ
          - 標本誤差は、標本を大きくすると小さくなる
          - 非標本誤差は、標本を大きくしても減らない
          - 正解
          - 無作為に選んでも、回答の誤りや無回答は起こる
        explanation: |
          **方針** 標本誤差は「どの人が選ばれたか」による偶然のずれ、非標本誤差はそれ以外（無回答・測定の誤りなど）。

          **途中式** 無作為抽出なら、標本誤差の大きさは標準誤差などで評価できる。非標本誤差は向きも大きさも状況しだいで、公式では評価できない。

          **答え** 標本誤差は見積もれるが、非標本誤差は見積もりにくい

          **間違えやすい点** 報告される「誤差 ±3 ポイント」などは標本誤差だけの大きさ。
  - id: s15p06
    title: 確率と期待値の計算
    context: |
      確率や期待値を求める。
    items:
      - id: s15p06a
        chapter: 7
        terms: [conditional-probability, bayes-theorem]
        topic: 両面赤と両面白と赤白の3枚のカードから見えた面が赤のとき裏も赤である確率を面の数で数えて求める
        level: 応用
        definition: false
        type: choice
        question: |
          袋に 3 枚のカードが入っている。1 枚は両面が赤、1 枚は両面が白、1 枚は片面が赤で片面が白である。1 枚を無作為に取り出し、無作為に一方の面を見たところ赤だった。そのカードの裏も赤である確率を求めよ。
        choices:
          - 1/2
          - 1/3
          - "1"
          - 2/3
          - 3/4
        answer: 3
        distractors:
          - 「赤い面のあるカードは 2 枚」と考えている（見えている面の数で考える必要がある）
          - 両面赤のカードを引く確率（条件なし）を答えている
          - 赤が見えても、赤白のカードの可能性が残る
          - 正解
          - 根拠のない値
        explanation: |
          **方針** 見える面は 6 面のどれかが同じ確率。赤い面は 3 面ある。

          **途中式** 赤い 3 面のうち、裏も赤なのは両面赤のカードの 2 面。条件付き確率は $2/3$。ベイズの定理でも $\dfrac{\frac13\times 1}{\frac13\times 1+\frac13\times\frac12}=\dfrac23$。

          **答え** 2/3

          **間違えやすい点** 「赤が見えたカード」の候補は 2 枚だが、両面赤のカードのほうが赤が見えやすいので、同じ確率ではない。
      - id: s15p06b
        chapter: 8
        terms: [expectation-variance-properties]
        topic: 確率変数の逆数の期待値は期待値の逆数と等しくないことを2点の分布で計算する
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$ は 1 と 4 をそれぞれ確率 1/2 でとる。$E\left[\dfrac1X\right]$ を求めよ。
        choices:
          - "0.4"
          - "0.625"
          - "2.5"
          - "1.25"
          - "0.25"
        answer: 1
        distractors:
          - 期待値の逆数 1/E[X] を求めている（一般に E[1/X] とは違う）
          - 正解
          - E[X] を答えている
          - 確率 1/2 を掛け忘れている
          - 大きいほうの値の逆数だけを使っている
        explanation: |
          **方針** $\dfrac1X$ がとる値と確率から期待値を計算する。

          **途中式** $\dfrac1X$ は 1 と 0.25 を確率 1/2 ずつでとるので、$E\left[\dfrac1X\right]=\dfrac{1+0.25}{2}=0.625$。一方、$\dfrac{1}{E[X]}=\dfrac{1}{2.5}=0.4$。

          **答え** 0.625

          **間違えやすい点** 期待値の性質 $E[aX+b]=aE[X]+b$ は 1 次式のときだけ。逆数や 2 乗などでは、期待値と変換の順番を入れかえられない。
      - id: s15p06c
        chapter: 8
        terms: [uniform-distribution, expectation-variance-properties]
        topic: 0から1の一様分布の2乗の期待値を積分で求め期待値の2乗や分散と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          $X$ が 0 から 1 の連続一様分布にしたがうとき、$E[X^2]$ を求めよ。
        choices:
          - 1/4
          - 1/2
          - 1/3
          - 1/12
          - "1"
        answer: 2
        distractors:
          - 期待値の 2 乗 (E[X])² を求めている
          - E[X] を答えている
          - 正解
          - 分散を答えている
          - 根拠のない値
        explanation: |
          **方針** $E[X^2]=\displaystyle\int_0^1 x^2\,dx$。

          **途中式** $\left[\dfrac{x^3}{3}\right]_0^1=\dfrac13$。分散は $\dfrac13-\left(\dfrac12\right)^2=\dfrac1{12}$。

          **答え** 1/3

          **間違えやすい点** $E[X^2]$ と $(E[X])^2$ は違い、その差が分散になる。
  - id: s15p07
    title: 分布の確率と当てはまり
    context: |
      確率分布を使って確率を求めたり、データへの当てはまりを考えたりする。
    items:
      - id: s15p07a
        chapter: 9
        terms: [binomial-distribution]
        topic: 二項分布B5と0.3で4回以上成功する確率を4回と5回の確率の和として二項係数を含めて求める
        level: 標準
        definition: false
        type: choice
        question: |
          成功の確率が 0.3 の独立な試行を 5 回行う。4 回以上成功する確率を求めよ。
        choices:
          - 約 0.028
          - 約 0.031
          - 約 0.002
          - 約 0.163
          - 約 0.008
        answer: 1
        distractors:
          - ちょうど 4 回の確率だけを求めている
          - 正解
          - ちょうど 5 回の確率だけを求めている
          - 3 回以上の確率を求めている
          - 二項係数を掛け忘れて 0.3⁴ だけを求めている
        explanation: |
          **方針** $P(X\ge 4)=P(X=4)+P(X=5)$。

          **途中式** $P(4)=\binom54(0.3)^4(0.7)=5\times 0.0081\times 0.7=0.02835$、$P(5)=0.3^5=0.00243$。和は約 0.031。

          **答え** 約 0.031

          **間違えやすい点** 「以上」はその値も含める。4 回成功する並び方は $\binom54=5$ 通りある。
      - id: s15p07b
        chapter: 8
        terms: [probability-mass-and-density-function]
        topic: 連続型の確率変数がちょうど1つの値をとる確率は0で確率は区間に対して決まることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          身長 $X$（cm）を連続型の確率変数として、正規分布で表す。$P(X=170)$ について正しいものはどれか。
        choices:
          - 確率密度関数の 170 での値に等しい
          - 正規分布の山の頂上なら 0.5 である
          - 平均が 170 なら 1 である
          - 0 である。連続型では、確率は区間（例えば 169.5 以上 170.5 未満）に対して考える
          - 正規分布表から直接読み取れる正の値である
        answer: 3
        distractors:
          - 密度の値は確率ではない
          - 1 つの値をとる確率は、どこでも 0
          - 平均の値でも、ちょうどその値をとる確率は 0
          - 正解
          - 表から読み取れるのは、ある値以上（以下）の確率
        explanation: |
          **方針** 連続型の確率は、確率密度関数の下の面積。

          **途中式** 1 つの点の上の面積は幅が 0 なので 0。

          **答え** 0 である

          **間違えやすい点** そのため、連続型では $P(X\le 170)$ と $P(X<170)$ は等しい。測定値が 170 と記録されるのは、実際には 169.5〜170.5 などの区間にあることを表す。
      - id: s15p07c
        chapter: 9
        terms: [poisson-distribution, sample-variance-sd]
        topic: 件数のデータの分散が平均よりずっと大きいときはポアソン分布の分散と平均が等しい性質に合わず当てはまりが悪いことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある窓口の 1 日の問い合わせの件数を 100 日分調べたところ、平均は 3 件、分散は 12 だった。この件数をポアソン分布で表すことについて、最も適切なものはどれか。
        choices:
          - 平均が 3 なので、平均 3 のポアソン分布がよく当てはまる
          - ポアソン分布では分散が平均の 2 乗になるので、よく当てはまる
          - 分散が平均より大きいのは、どの件数のデータでもふつうで、ポアソン分布で問題はない
          - ポアソン分布では分散と平均が等しいが、分散が平均の 4 倍もあるので、当てはまりはよくないと考えられる
          - 件数のデータには、どんな場合でもポアソン分布が当てはまる
        answer: 3
        distractors:
          - 平均は合わせられても、散らばりが合わない
          - 分散が平均の 2 乗になるのは指数分布の性質（平均 μ なら分散 μ²）
          - 分散が平均よりずっと大きいときは、日によって起こりやすさが違うなどの理由が考えられる
          - 正解
          - 起こりやすさが一定で独立に起こるときにポアソン分布になる
        explanation: |
          **方針** ポアソン分布の分散は平均と等しい。

          **途中式** 平均 3 なら分散も 3 のはずだが、実際は 12 で大きく違う。曜日や天気によって問い合わせの起こりやすさが変わるなど、ポアソン分布の前提が成り立っていない可能性がある。

          **答え** 分散が平均の 4 倍もあるので、当てはまりはよくない

          **間違えやすい点** 適合度検定で確かめる前に、平均と分散を比べるだけでも当てはまりの目安になる。
  - id: s15p08
    title: 中心極限定理と大数の法則
    context: |
      多くの値を合わせたときのふるまいを考える。
    items:
      - id: s15p08a
        chapter: 10
        terms: [central-limit-theorem, uniform-distribution]
        topic: 0から1の一様分布12個の和から6を引いた値の期待値と分散が0と1でおよそ標準正規分布にしたがうことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          0 から 1 の連続一様分布にしたがう独立な確率変数 12 個の和から 6 を引いた値 $W$ について、正しいものはどれか。一様分布の期待値は 1/2、分散は 1/12 である。
        choices:
          - 期待値 0、分散 1 で、中心極限定理によりおよそ標準正規分布にしたがう
          - 期待値 0、分散 1/12 で、0 から 1 の一様分布にしたがう
          - 期待値 6、分散 1 で、およそ正規分布にしたがう
          - 期待値 0、分散 12 で、およそ正規分布にしたがう
          - 期待値 0、分散 1/144 で、およそ正規分布にしたがう
        answer: 0
        distractors:
          - 正解
          - 分散を 12 倍していない。和は一様分布にはならない
          - 6 を引き忘れている
          - 分散に 12 を 2 回掛けている（1/12 × 12 ＝ 1）
          - 和ではなく平均の分散のように 12 で割っている
        explanation: |
          **方針** 独立な和の期待値は期待値の和、分散は分散の和。

          **途中式** 和の期待値は $12\times\dfrac12=6$、分散は $12\times\dfrac1{12}=1$。6 を引くと期待値 0、分散 1。12 個の和なので、中心極限定理によりおよそ正規分布になる。

          **答え** 期待値 0、分散 1 で、およそ標準正規分布にしたがう

          **間違えやすい点** 2 個の和は三角形の分布になり、個数が増えるほど山形の正規分布に近づく。
      - id: s15p08b
        chapter: 10
        terms: [t-distribution, standard-normal-distribution]
        topic: 標本の大きさ100ではt分布の点が1.96に近く母分散が未知でも正規分布で近似してよいことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          母分散が未知の正規母集団から大きさ 100 の標本をとり、母平均の 95% 信頼区間を作る。$t_{0.025}(99)=1.984$ である。正しいものはどれか。
        choices:
          - 1.984 は 1.96 とほとんど同じなので、正規分布の 1.96 で近似しても区間はほとんど変わらない
          - 母分散が未知なので、正規分布で近似することはできない
          - 標本が大きいときほど、t 分布と正規分布の違いは大きくなる
          - t 分布を使うと区間は正規分布の 2 倍の幅になる
          - 標本が大きいと t 分布は使えない
        answer: 0
        distractors:
          - 正解
          - 標本が大きいと t 分布は標準正規分布にほぼ等しくなる
          - 逆。標本が大きいほど違いは小さくなる
          - 1.984/1.96 ≈ 1.01 倍で、ほとんど同じ
          - 使えるが、正規分布とほぼ同じになる
        explanation: |
          **方針** t 分布は、自由度が大きくなるほど標準正規分布に近づく。

          **途中式** $1.984/1.96\approx 1.012$ で、幅の違いは約 1%。

          **答え** 正規分布で近似しても区間はほとんど変わらない

          **間違えやすい点** 標本が小さいとき（例えば $n=5$ で 2.776）は差が大きいので、t 分布を使う。
      - id: s15p08c
        chapter: 10
        terms: [weak-law-of-large-numbers, sampling-distribution-of-mean]
        topic: 公正な硬貨を1万回投げたときの表の割合の標準偏差を求め大数の法則で割合のぶれが小さくなることを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          公正な硬貨を 10000 回投げる。表の割合の標準偏差を求めよ。
        choices:
          - "0.05"
          - "0.0025"
          - "0.000025"
          - "50"
          - "0.005"
        answer: 4
        distractors:
          - 100 回投げたときの値
          - 1 回の分散 0.25 を √n ＝ 100 で割っている（正しくは n で割ってから平方根をとる）
          - 割合の分散を答えている
          - 表の回数の標準偏差を答えている
          - 正解
        explanation: |
          **方針** 割合の標準偏差は $\sqrt{\dfrac{p(1-p)}{n}}$。

          **途中式** $\sqrt{\dfrac{0.25}{10000}}=\dfrac{0.5}{100}=0.005$。

          **答え** 0.005

          **間違えやすい点** 割合のぶれは $1/\sqrt n$ で小さくなる（大数の法則）が、表の回数そのもののぶれは $\sqrt n$ で大きくなる（10000 回なら標準偏差 50 回）。
  - id: s15p09
    title: 推定量と信頼区間の性質
    context: |
      推定の方法の性質を考える。
    items:
      - id: s15p09a
        chapter: 11
        terms: [unbiased-estimator, mean-median-mode]
        topic: 正規母集団では標本平均の分散が標本中央値の分散より小さく平均のほうが有効な推定量であることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団の母平均を、大きな標本の標本平均で推定する方法と、標本中央値で推定する方法を比べる。どちらも母平均を中心にばらつく。正しいものはどれか。
        choices:
          - 標本中央値の分散のほうが小さいので、中央値のほうがよい
          - 2 つの分散はいつも等しい
          - 標本中央値は母平均の推定には使えない
          - 標本平均は外れ値に弱いので、正規母集団でも中央値のほうがよい
          - 標本平均の分散のほうが小さい（中央値の約 0.64 倍）ので、標本平均のほうが精度のよい（有効な）推定量である
        answer: 4
        distractors:
          - 正規母集団では、中央値のほうが分散が大きい
          - 中央値の分散は平均の約 π/2 ≈ 1.57 倍
          - 正規分布は対称なので、中央値も母平均の推定に使える
          - 外れ値が多い（裾の重い）分布なら中央値が有利なこともあるが、正規母集団では平均が有利
          - 正解
        explanation: |
          **方針** 同じ母数を推定する方法は、ばらつき（分散）が小さいほうがよい（有効）。

          **途中式** 正規母集団で $n$ が大きいとき、標本平均の分散は $\sigma^2/n$、標本中央値の分散は約 $\dfrac{\pi}{2}\dfrac{\sigma^2}{n}$。比は $2/\pi\approx 0.64$。

          **答え** 標本平均のほうが有効

          **間違えやすい点** どちらがよいかは母集団の分布による。裾の重い分布では中央値のほうがよいこともある。
      - id: s15p09b
        chapter: 11
        terms: [ci-mean-known-variance, confidence-interval]
        topic: 母分散既知の母平均の信頼区間の幅は標本平均の値によらず標本の大きさと標準偏差と信頼係数で決まることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          母標準偏差が既知の母平均の 95% 信頼区間について、区間の幅に**影響しない**ものはどれか。
        choices:
          - 標本の大きさ
          - 母標準偏差
          - 標本平均の値
          - 信頼係数
          - 標本の大きさと信頼係数の両方
        answer: 2
        distractors:
          - 大きいほど幅は狭くなる
          - 大きいほど幅は広くなる
          - 正解
          - 大きいほど幅は広くなる
          - どちらも幅に影響する
        explanation: |
          **方針** 区間は $\bar x\pm z\dfrac{\sigma}{\sqrt n}$ で、幅は $2z\dfrac{\sigma}{\sqrt n}$。

          **途中式** 幅は $z$（信頼係数）、$\sigma$、$n$ で決まり、$\bar x$ は区間の位置（中心）だけを決める。

          **答え** 標本平均の値

          **間違えやすい点** 母分散が未知のときは、幅は標本の標準偏差 $s$ にもよるので、標本ごとに幅が変わる。
      - id: s15p09c
        chapter: 11
        terms: [ci-proportion, proportion-test]
        topic: 母比率の信頼区間では標本比率で標準誤差を求め検定では帰無仮説の値で標準誤差を求める違いを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          400 人中 140 人（35%）が賛成だった。母比率の 95% 信頼区間を作るときと、帰無仮説「母比率は 0.3」の検定を行うときの、標準誤差の計算の組合せとして正しいものはどれか。
        choices:
          - 区間でも検定でも √(0.35 × 0.65/400) を使う
          - 区間でも検定でも √(0.3 × 0.7/400) を使う
          - 区間では √(0.3 × 0.7/400)、検定では √(0.35 × 0.65/400) を使う
          - 区間では √(0.35 × 0.65/400)、検定では √(0.3 × 0.7/400) を使う
          - 区間でも検定でも √(0.5 × 0.5/400) を使う
        answer: 3
        distractors:
          - 検定では、帰無仮説が正しいとしたときの標準誤差を使う
          - 区間では、母比率がわからないので標本比率で標準誤差を推定する
          - 2 つを入れかえている
          - 正解
          - 0.5 は必要な標本の大きさを決めるときに、見当がつかない場合に使う値
        explanation: |
          **方針** 検定は「帰無仮説が正しいとしたら」の計算、区間推定は「わかっている情報（標本比率）から推定する」計算。

          **途中式** 区間：$0.35\pm 1.96\sqrt{\dfrac{0.35\times 0.65}{400}}$。検定：$z=\dfrac{0.35-0.3}{\sqrt{0.3\times 0.7/400}}$。

          **答え** 区間では標本比率、検定では帰無仮説の値で標準誤差を求める

          **間違えやすい点** 2 つの比率の差の検定でも、帰無仮説のもとの共通の比率（合わせた比率）を使う。
      - id: s15p09d
        chapter: 11
        terms: [confidence-interval, simple-random-sampling]
        topic: 無作為抽出でないデータから計算した信頼区間は母集団について意味をもたないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある店のホームページで、来店したことのある人に満足度（10 点満点）を自由に答えてもらい、2000 件の回答を得た。平均は 8.2、95% 信頼区間は (8.1, 8.3) と計算された。この区間について最も適切なものはどれか。
        choices:
          - 2000 件もあるので、来店者全体の平均満足度は 95% の確率で 8.1〜8.3 にある
          - 回答者は無作為に選ばれていないので、この区間は「来店者全体の平均満足度」についての信頼区間とはいえない
          - 区間の幅が狭いので、偏りもほとんどない
          - 回答数をさらに増やせば、偏りはなくなる
          - 信頼区間は回答者の選ばれ方に関係なく使える
        answer: 1
        distractors:
          - 標本の大きさは偏りをなくさない
          - 正解
          - 区間の幅が表すのは標本誤差だけで、選ばれ方の偏りは含まない
          - 自分から答える人の偏り（満足した人ほど答えるなど）は、数を増やしても残る
          - 信頼区間の計算は、無作為抽出を前提にしている
        explanation: |
          **方針** 信頼区間の「95%」は、無作為抽出をくり返したときの性質。

          **途中式** 自分から答えた人は、とても満足した人やとても不満な人に偏りやすい。無作為抽出でないと、区間は標本誤差しか表さず、偏りは含まれない。

          **答え** 来店者全体の平均満足度の信頼区間とはいえない

          **間違えやすい点** 数が多いと区間は狭くなり、正確そうに見えるが、偏りがあれば狭い区間が本当の値から外れていることになる。
  - id: s15p10
    title: 検定の考え方
    context: |
      仮説検定の手順と結果の見方を考える。
    items:
      - id: s15p10a
        chapter: 12
        terms: [significance-level, p-value]
        topic: 有意水準はデータを見る前に決めておきp値を見てから都合のよい有意水準を選んではいけないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある研究者は、p 値が 0.08 だったので、有意水準を 10% にして「有意な差がある」と報告した。この手順の問題点として最も適切なものはどれか。
        choices:
          - 有意水準はデータを見る前に決めておくもので、p 値を見てから都合のよい有意水準を選ぶと、第 1 種の過誤の確率が保証されない
          - 有意水準 10% は大きすぎるので、どのような場合でも使ってはいけない
          - p 値が 0.08 なら、どの有意水準でも有意になる
          - p 値が 0.08 なら、差がないことが証明された
          - 有意水準と p 値は関係がない
        answer: 0
        distractors:
          - 正解
          - 前もって決めていれば 10% を使うこともある。問題は後から選んだこと
          - 有意水準 5% や 1% では有意にならない
          - 有意でないことは、差がないことの証明ではない
          - p 値が有意水準以下のときに棄却する
        explanation: |
          **方針** 検定の手順は、仮説と有意水準を決める → データから統計量と p 値を求める → 判断する、の順。

          **途中式** p 値を見てから有意水準を選ぶと、どんな結果でも「有意」にできてしまい、有意水準の意味（第 1 種の過誤の確率）がなくなる。

          **答え** 有意水準は前もって決めておく必要がある

          **間違えやすい点** p 値そのものを報告するのはよいが、有意かどうかの判断は前もって決めた有意水準で行う。
      - id: s15p10b
        chapter: 12
        terms: [p-value, significance-level]
        topic: p値0.049と0.051は証拠の強さとしてほとんど同じで有意水準の境目だけで結論を大きく変えないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの研究で同じ大きさの効果を調べ、p 値は研究 A で 0.049、研究 B で 0.051 だった（有意水準 5%）。最も適切な解釈はどれか。
        choices:
          - A では効果があり、B では効果がないことが示された
          - A の効果は B の効果よりはるかに大きい
          - B の研究は誤りなので、捨てるべきである
          - p 値の差 0.002 から、A が正しい確率は B より 0.2% 高い
          - 判断は A が有意、B が有意でないと分かれるが、帰無仮説に反する証拠の強さはほとんど同じで、2 つの研究の結果は矛盾していない
        answer: 4
        distractors:
          - 有意でないことは、効果がないことを示さない
          - p 値のわずかな差は、効果の大きさの大きな差を意味しない
          - 有意にならなかった研究も、証拠として価値がある
          - p 値の意味を取り違えている
          - 正解
        explanation: |
          **方針** p 値は証拠の強さを連続的に表す量。

          **途中式** 0.049 と 0.051 は、どちらも「帰無仮説が正しいとすると、5% 程度しか起こらない結果」で、ほとんど同じ。

          **答え** 証拠の強さはほとんど同じで、結果は矛盾していない

          **間違えやすい点** 5% は便宜的な境目。p 値と一緒に効果の大きさや信頼区間も見て判断する。
      - id: s15p10c
        chapter: 12
        terms: [power-function, type-i-and-ii-errors]
        topic: 検出力80パーセントの意味を本当に想定した差があるときに帰無仮説を棄却する確率として答える
        level: 基本
        definition: true
        type: choice
        question: |
          ある検定の計画で「想定した差があるときの検出力は 80%」とされた。この意味として正しいものはどれか。
        choices:
          - 帰無仮説が正しいとき、帰無仮説を棄却する確率が 80%
          - 帰無仮説が正しい確率が 80%
          - 本当に想定した差があるとき、帰無仮説を棄却する確率が 80%
          - 本当に差があるとき、帰無仮説を棄却しない確率が 80%
          - 検定の結果が正しい確率が 80%
        answer: 2
        distractors:
          - それは第 1 種の過誤の確率（有意水準）
          - 検定では帰無仮説が正しい確率は求めない
          - 正解
          - それは第 2 種の過誤の確率（1 − 検出力 ＝ 20%）
          - 検出力は、差があるときに棄却する確率
        explanation: |
          **方針** 検出力 ＝ 1 − 第 2 種の過誤の確率。

          **途中式** 第 2 種の過誤（差があるのに棄却しない）の確率が 20% なので、差を検出する確率が 80%。

          **答え** 想定した差があるとき、棄却する確率が 80%

          **間違えやすい点** 検出力は、想定する差の大きさによって変わる。差が小さいほど検出力は低い。
  - id: s15p11
    title: 2 群の比較とクロス表
    context: |
      2 つの群の比較やクロス表の検定を考える。
    items:
      - id: s15p11a
        chapter: 13
        terms: [paired-t-test, sum-of-random-variables]
        topic: 対応のある2つの測定値の相関が負のとき差の分散が独立の場合より大きくなることを計算する
        level: 応用
        definition: false
        type: choice
        question: |
          同じ人の 2 つの測定値 $X$、$Y$ の標準偏差はどちらも 10、相関係数は −0.3 だった。差 $X-Y$ の分散を求めよ。
        choices:
          - "260"
          - "140"
          - "200"
          - "60"
          - "20"
        answer: 0
        distractors:
          - 正解
          - 共分散の符号を取り違えている（−2 × 共分散 ＝ ＋60）
          - 相関を考えていない（独立とみなしている）
          - 共分散の部分だけを求めている
          - 標準偏差を足している
        explanation: |
          **方針** $V[X-Y]=V[X]+V[Y]-2\,\mathrm{Cov}(X,Y)$、$\mathrm{Cov}=r\,s_Xs_Y$。

          **途中式** 共分散は $-0.3\times 10\times 10=-30$。$100+100-2\times(-30)=260$。

          **答え** 260

          **間違えやすい点** 対応のある t 検定が有利なのは、2 つの測定値に正の相関があるとき（差の分散が小さくなる）。負の相関なら、かえって差の分散は大きくなる。
      - id: s15p11b
        chapter: 13
        terms: [independence-test, cross-tabulation]
        topic: クロス表の行と列を入れかえても独立性のカイ二乗統計量と自由度は変わらないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          2 行 3 列のクロス表の行と列を入れかえて 3 行 2 列の表にし、独立性の検定を行った。元の表と比べて正しいものはどれか。
        choices:
          - カイ二乗統計量も自由度（2）も変わらない
          - カイ二乗統計量は変わらないが、自由度は 3 に変わる
          - カイ二乗統計量は逆数になる
          - 行と列を入れかえると、独立性の検定は行えない
          - カイ二乗統計量は 2 倍になる
        answer: 0
        distractors:
          - 正解
          - 自由度は（2 − 1）×（3 − 1）＝（3 − 1）×（2 − 1）＝ 2 で同じ
          - 各セルの観測度数と期待度数は同じなので、統計量も同じ
          - 2 つの変数の役割は対称で、どちらを行にしてもよい
          - セルの数は同じ 6 つで、統計量は変わらない
        explanation: |
          **方針** 独立性の検定は、2 つの変数の役割について対称。

          **途中式** 各セルの観測度数も、期待度数（行の合計 × 列の合計 ÷ 総数）も入れかえる前と同じなので、統計量は同じ。自由度も $(2-1)(3-1)=2$ で同じ。

          **答え** カイ二乗統計量も自由度も変わらない

          **間違えやすい点** 割合で比べるときは、どちらの変数で割合をとるか（行パーセントか列パーセントか）で見え方が変わる。
      - id: s15p11c
        chapter: 13
        terms: [welch-test]
        topic: ウェルチの検定の自由度は小さいほうの群の大きさマイナス1以上で2群の大きさの和マイナス2以下になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          大きさ 8 と 13 の 2 つの群をウェルチの方法で比べる。ウェルチの近似による自由度について正しいものはどれか。
        choices:
          - いつも 8 ＋ 13 − 2 ＝ 19 になる
          - 2 つの群の不偏分散によって変わるが、7 以上 19 以下の値になる
          - いつも 8 − 1 ＝ 7 になる
          - 20 以上の値になる
          - いつも 21 になる
        answer: 1
        distractors:
          - 19 はプールした分散を使う t 検定の自由度で、ウェルチではそれ以下になる
          - 正解
          - 小さいほうの群の大きさ − 1 は、自由度のとりうる最小の値
          - 自由度は n₁ ＋ n₂ − 2 ＝ 19 を超えない
          - 合計の人数は自由度ではない
        explanation: |
          **方針** ウェルチの自由度は、2 つの群の $s^2/n$ の大きさの関係で決まる。

          **途中式** 2 つの群の $s^2/n$ が同じくらいなら 19 に近く、一方が大きく上回ると、その群の「大きさ − 1」（7 または 12）に近づく。いつも $\min(n_1,n_2)-1=7$ 以上、$n_1+n_2-2=19$ 以下。

          **答え** 7 以上 19 以下の値になる

          **間違えやすい点** 自由度が小さいほど t の点は大きいので、ウェルチの検定は分散の違いに対して慎重な判断になる。
  - id: s15p12
    title: 回帰モデルの使い方
    context: |
      回帰分析の結果を予測や解釈に使う。
    items:
      - id: s15p12a
        chapter: 14
        terms: [multicollinearity, multiple-regression-model]
        topic: 説明変数どうしの相関が強くても同じような範囲での予測値の精度はあまり悪くならず係数の解釈が難しくなることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある重回帰分析で、2 つの説明変数の相関が 0.95 と強く、それぞれの係数の標準誤差が大きかった。このモデルを予測に使うことについて、最も適切なものはどれか。
        choices:
          - データと同じように 2 つの変数が一緒に動く範囲での予測なら、予測値の精度はあまり悪くならないが、個々の係数の値を解釈するのは難しい
          - 係数の標準誤差が大きいので、どのような予測にもまったく使えない
          - 説明変数どうしの相関が強いほど、予測は正確になる
          - 一方の変数だけを大きく変えた場合の予測も、問題なく正確である
          - 係数の大きさから、どちらの変数が重要かをはっきり判断できる
        answer: 0
        distractors:
          - 正解
          - 個々の係数は不安定でも、2 つの効果の合計はよく推定できることが多い
          - 相関の強さは予測の正確さを高めるわけではない
          - データにない組合せ（一方だけ大きく変える）では、不安定な係数の影響が大きく出る
          - 係数が不安定なので、重要さの判断は難しい
        explanation: |
          **方針** 多重共線性があると、個々の係数は不安定だが、2 つの変数を合わせた効果はよく推定できる。

          **途中式** データと同じように 2 つの変数が一緒に動く値で予測すると、不安定さは打ち消し合い、予測値はあまりぶれない。一方だけを大きく動かすと、不安定な係数の影響がそのまま出る。

          **答え** 同じような範囲の予測なら精度はあまり悪くならないが、係数の解釈は難しい

          **間違えやすい点** 多重共線性の問題は主に「係数の解釈」と「データにない組合せでの予測」で起こる。
      - id: s15p12b
        chapter: 14
        terms: [dummy-variable]
        topic: ダミー変数の基準のカテゴリを変えたときに別のカテゴリの係数が基準との差として計算し直されることを求める
        level: 標準
        definition: false
        type: choice
        question: |
          地域（北・東・南）を、北を基準とする 2 つのダミー変数で表した回帰で、東の係数は 4、南の係数は 7 だった。基準を南に変えて回帰し直すと、東の係数はいくらになるか（ほかの説明変数は同じ）。
        choices:
          - "4"
          - "3"
          - "11"
          - "−7"
          - "−3"
        answer: 4
        distractors:
          - 基準を変えても係数は変わらないと考えている
          - 引く順番を逆にしている（南 − 東 ＝ 7 − 4）
          - 2 つの係数を足している
          - 北の係数（北 − 南）を答えている
          - 正解
        explanation: |
          **方針** ダミー変数の係数は、基準のカテゴリとの差。

          **途中式** 北を 0 とすると、東は 4、南は 7。南を基準にすると、東 − 南 ＝ $4-7=-3$、北 − 南 ＝ $-7$。

          **答え** −3

          **間違えやすい点** 基準を変えても、予測値やカテゴリどうしの差は変わらない。変わるのは係数の表し方だけ。
      - id: s15p12c
        chapter: 14
        terms: [multiple-regression-model, residual-plot]
        topic: 説明変数の2乗の項を含む回帰式から予測値が最大になる説明変数の値を平方完成で求める
        level: 標準
        definition: false
        type: choice
        question: |
          気温 $x$（℃）とアイスの売上 $y$ の関係に、2 乗の項を加えた回帰式 $\hat y=10+4x-0.5x^2$ を当てはめた（この式は $x$ がおよそ 0〜8 の範囲のデータから求めた）。この範囲で予測値が最大になる $x$ を求めよ。
        choices:
          - "8"
          - "2"
          - "4"
          - "0"
          - "18"
        answer: 2
        distractors:
          - 4 を 0.5 で割っている（正しくは 4 を 2 × 0.5 で割る）
          - 4 を 2 で割っている
          - 正解
          - 切片の位置を答えている
          - 予測値の最大値を答えている
        explanation: |
          **方針** 2 次式 $a+bx+cx^2$（$c<0$）は $x=-\dfrac{b}{2c}$ で最大。

          **途中式** $x=-\dfrac{4}{2\times(-0.5)}=4$。最大値は $10+16-8=18$。

          **答え** 4

          **間違えやすい点** 2 乗の項を加えると曲がった関係を表せるが、データの範囲の外では当てにならない。
  - id: s15p13
    title: 分散分析の解釈
    context: |
      分散分析の結果を読み取る。
    items:
      - id: s15p13a
        chapter: 15
        terms: [one-way-anova, anova-table]
        topic: 一元配置分散分析でF比が1より小さいときは群の違いを示す証拠がないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          一元配置分散分析を行ったところ、F 比は 0.6 だった。この結果の解釈として最も適切なものはどれか。
        choices:
          - F 比が 1 より小さいのは計算の誤りである
          - F 比が小さいほど、群の違いは大きい
          - 群間の平均平方が群内の平均平方より小さく、群の母平均に違いがあるという証拠はない
          - F 比が 1 より小さいので、群の母平均がすべて等しいことが証明された
          - F 比が 0.6 なので、群間の違いは全体の 60% を説明している
        answer: 2
        distractors:
          - 偶然のばらつきで 1 より小さくなることはよくある
          - F 比が大きいほど群の違いを示す
          - 正解
          - 有意でないことは、等しいことの証明ではない
          - F 比は平均平方の比で、説明の割合ではない
        explanation: |
          **方針** F 比は（群間の平均平方）÷（群内の平均平方）。帰無仮説のもとでは 1 の前後の値になる。

          **途中式** 0.6 は 1 より小さく、F 分布の上側の棄却域にはまったく入らない。

          **答え** 群の母平均に違いがある証拠はない

          **間違えやすい点** F 検定は上側（大きい側）で棄却する。F 比が 1 より小さいことに特別な意味はない。
      - id: s15p13b
        chapter: 15
        terms: [one-way-anova, significance-level]
        topic: 3群のすべての組を比べる多重比較でボンフェローニの方法により1組あたりの有意水準を組の数で割って求める
        level: 標準
        definition: false
        type: choice
        question: |
          一元配置分散分析で 3 つの群の差が有意になったので、3 群のすべての組（A と B、A と C、B と C）を t 検定で比べる。全体の有意水準を 5% に保つため、ボンフェローニの方法で 1 組あたりの有意水準を決めると、いくらになるか。
        choices:
          - "0.05"
          - "0.025"
          - 約 0.008
          - 約 0.017
          - "0.15"
        answer: 3
        distractors:
          - 1 組ごとに 5% で検定すると、全体の第 1 種の過誤の確率が大きくなる
          - 組の数 3 ではなく 2 で割っている
          - 組の数を順番を区別して 6 と数えている
          - 正解
          - 割るのではなく掛けている
        explanation: |
          **方針** ボンフェローニの方法では、全体の有意水準を比べる組の数で割る。

          **途中式** 組の数は $\binom32=3$。$0.05/3\approx 0.017$。

          **答え** 約 0.017

          **間違えやすい点** 群が多いと組の数が急に増え（4 群なら 6 組）、1 組あたりの有意水準はとても小さくなる。
