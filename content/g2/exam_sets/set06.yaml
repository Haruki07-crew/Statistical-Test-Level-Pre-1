      - id: s06p10b
        chapter: 11
        terms: [unbiased-estimator, point-estimation]
        topic: 2つの観測値の重み付き平均が不偏であることと分散を比べて単純平均のほうが効率がよいことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          母平均 $\mu$、母分散 $\sigma^2$ の母集団から独立に $X_1$、$X_2$ を取り出す。推定量 $T_1=(X_1+X_2)/2$ と $T_2=(X_1+2X_2)/3$ について正しい記述はどれか。
        choices:
          - $T_2$ は不偏推定量ではない
          - どちらも不偏推定量で、分散も等しい
          - 分散は $T_2$ のほうが小さい
          - どちらも不偏推定量ではない
          - どちらも不偏推定量だが、分散は $T_1$ のほうが小さい（$\sigma^2/2$ と $5\sigma^2/9$）
        answer: 4
        distractors:
          - $E[T_2]=(\mu+2\mu)/3=\mu$ で不偏
          - $T_2$ の分散は $(1+4)\sigma^2/9=5\sigma^2/9$
          - $5/9$ は $1/2$ より大きい
          - どちらも期待値は $\mu$
          - 正解
        explanation: |
          **方針** 期待値と分散を、線形性と独立性で計算する。

          **途中式** $E[T_1]=E[T_2]=\mu$。$V[T_1]=\sigma^2/2$、$V[T_2]=(1^2+2^2)\sigma^2/9=5\sigma^2/9$。

          **答え** どちらも不偏だが、$T_1$ のほうが分散が小さい

          **間違えやすい点** 不偏推定量どうしなら、分散の小さいほうが効率のよい推定量。
      - id: s06p10c
        chapter: 11
