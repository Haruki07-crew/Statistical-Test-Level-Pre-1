          - 有意水準は第 1 種の過誤の確率そのもので、下げれば小さくなる
          - 棄却しにくくなるので検出力は小さくなる
          - 棄却域が変わるので過誤の確率も変わる
          - 正解
        explanation: |
          **方針** 有意水準を下げると棄却域が狭くなり、棄却しにくくなる。

          **途中式** 第 1 種の過誤（正しい帰無仮説を棄却）は減り、第 2 種の過誤（誤った帰無仮説を棄却しない）は増える。

          **答え** 第 1 種は小さく、第 2 種は大きくなる

          **間違えやすい点** 2 種類の過誤はトレードオフの関係にある。
      - id: s06p11b
        chapter: 12
        terms: [one-sample-t-test, one-sided-two-sided-test]
        topic: 25個の標本で右片側の1標本t検定を行い自由度24の上側5パーセント点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある電池の平均寿命は 100 時間とされている。改良品 25 個の寿命は平均 103 時間、標本標準偏差（不偏分散の平方根）10 時間だった。帰無仮説「母平均 100」、対立仮説「母平均は 100 より大きい」で有意水準 5% の t 検定を行う。正しいものはどれか。
        choices:
          - t ＝ 1.5 で、1.711 より小さいので棄却しない
          - t ＝ 1.5 で、1.645 より小さいので棄却しない
          - t ＝ 0.3 で、棄却しない
          - t ＝ 7.5 で、棄却する
          - t ＝ 1.5 で、2.064 より小さいので棄却しない
        answer: 0
        distractors:
          - 正解
          - 母分散が未知なのに標準正規分布の点と比べた
          - 標準偏差を $\sqrt n$ で割らなかった
          - 標準偏差を $n$ で割った
          - 片側検定なのに両側の点と比べた
        explanation: |
          **方針** $t=(\bar x-\mu_0)/(s/\sqrt n)$ を自由度 24 の上側 5% 点と比べる。

          **途中式** $t=3/(10/5)=1.5<1.711$

          **答え** t ＝ 1.5 で、棄却しない

          **間違えやすい点** 片側検定は上側 $\alpha$ 点（1.711）、両側検定は上側 $\alpha/2$ 点（2.064）と比べる。
      - id: s06p11c
        chapter: 12
        terms: [rejection-region, z-test-known-variance]
        topic: 母標準偏差既知の右片側z検定の棄却域を標本平均の値の範囲で表す
        level: 標準
        definition: false
        type: choice
        question: |
          母標準偏差 15 の正規母集団から大きさ 36 の標本を取り、帰無仮説「母平均 100」、対立仮説「母平均は 100 より大きい」を有意水準 5% で検定する。棄却域を標本平均 $\bar x$ で表すとどれか。
        choices:
          - $\bar x>104.90$
          - $\bar x>104.11$
          - $\bar x>124.68$
          - $\bar x<95.89$
          - $\bar x>100.69$
        answer: 1
        distractors:
          - 両側検定の点 1.96 を使った
          - 正解
          - 標準誤差の代わりに母標準偏差 15 を使った
          - 左側の棄却域を求めた
          - 母標準偏差を $n$ で割った
        explanation: |
          **方針** $z=(\bar x-100)/(15/\sqrt{36})>1.645$ を $\bar x$ について解く。

          **途中式** $15/6=2.5$、$100+1.645\times 2.5=104.11$

          **答え** $\bar x>104.11$

          **間違えやすい点** 棄却域を標本平均で表しておくと、検出力の計算に使える。
      - id: s06p11d
        chapter: 13
        terms: [independence-test, expected-frequency, pearson-chi-square-statistic]
        topic: 2行2列の表で期待度数を求めて独立性のカイ二乗統計量を計算し有意水準1パーセントでも棄却されることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある講習の受講の有無と、資格試験の合否を 200 人について調べた。

          | | 合格 | 不合格 |
          |---|---|---|
          | 受講した | 45 | 55 |
          | 受講しなかった | 25 | 75 |

          独立性のカイ二乗検定（連続修正なし）の結果として正しいものはどれか。
        choices:
          - χ² ≈ 8.79 で、有意水準 1% でも棄却する
          - χ² ≈ 8.79 で、有意水準 5% では棄却するが 1% では棄却しない
          - χ² ≈ 4.40 で、有意水準 5% で棄却する
          - χ² ＝ 400 で、棄却する
          - χ² ≈ 8.79 で、棄却しない
        answer: 0
        distractors:
          - 正解
          - 8.79 は 6.635 より大きいので 1% でも棄却する
          - 4 つのセルのうち 2 つしか足していない
          - 期待度数で割らなかった
          - 8.79 は 3.841 より大きい
        explanation: |
          **方針** 期待度数は、合格が各行 $100\times 70/200=35$、不合格が 65。

          **途中式** $\dfrac{10^2}{35}\times 2+\dfrac{10^2}{65}\times 2\approx 5.71+3.08=8.79$。$8.79>6.635$

          **答え** 有意水準 1% でも棄却する

          **間違えやすい点** 受講と合格に関連があっても、受講した人がもともと意欲が高いなど、因果関係とは限らない。
      - id: s06p11e
        chapter: 13
        terms: [f-test-equal-variances, welch-test]
        topic: 2つの母集団のばらつきが等しいかを調べる検定として等分散のF検定を選ぶ
        level: 基本
        definition: true
        type: choice
        question: |
          2 つの工場の製品の重さについて、「ばらつき（母分散）が等しいか」を調べたい。両方の母集団は正規分布にしたがうとする。使う検定として最も適切なものはどれか。
        choices:
          - 2 標本の t 検定
          - 独立性のカイ二乗検定
          - 対応のある t 検定
          - 2 つの不偏分散の比を使う F 検定
          - 母比率の差の検定
        answer: 3
        distractors:
          - 母平均の差を調べる検定
          - 質的変数どうしの関連を調べる検定
          - 対応のあるデータの平均の差を調べる検定
          - 正解
          - 比率を比べる検定
        explanation: |
          **方針** 分散の比は、2 つの母分散が等しいとき F 分布にしたがう。

          **途中式** $F=s_1^2/s_2^2$ を自由度 $(n_1-1,\ n_2-1)$ の F 分布の点と比べる。

          **答え** 不偏分散の比を使う F 検定

          **間違えやすい点** F 検定は正規分布の仮定に敏感。結果によって t 検定の種類を選ぶやり方（予備検定）には注意が必要とされる。
      - id: s06p11f
        chapter: 13
        terms: [goodness-of-fit-test, expected-frequency]
        topic: カイ二乗検定で期待度数が5未満のセルがあるときにカテゴリをまとめて自由度を数え直すことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある適合度検定で、6 つのカテゴリのうち最後の 2 つの期待度数が 2.1 と 3.4 と小さかった（ほかのカテゴリの期待度数は 10 以上。推定した母数はない）。対応として最も適切なものはどれか。
        choices:
          - そのまま 6 つのカテゴリで、自由度 6 として検定する
          - 期待度数の小さい 2 つのカテゴリをまとめ、5 つのカテゴリとして自由度 4 で検定する
          - 期待度数の小さいカテゴリを捨て、残りの 4 つで、自由度 3 として検定する
          - 期待度数が小さいほどカイ二乗分布の近似が良くなるので、そのまま検定する
          - 期待度数を観測度数で置き換えて検定する
        answer: 1
        distractors:
          - 期待度数の小さいセルで近似が悪くなる。自由度も 6 − 1 ＝ 5 で誤り
          - 正解
          - データを捨てると、標本全体の検定にならない
          - 期待度数が小さいと近似が悪くなる
          - 統計量が 0 になってしまう
        explanation: |
          **方針** カイ二乗分布による近似は、期待度数がおよそ 5 以上で良くなる。小さいセルは隣とまとめる。

          **途中式** 2 つをまとめると期待度数 $2.1+3.4=5.5$ で 5 以上になる。カテゴリは 5 つになるので、自由度は $5-1=4$。

          **答え** まとめて、カテゴリの数 − 1 を自由度にする

          **間違えやすい点** まとめたあとは、カテゴリの数が変わるので自由度も変わる。
