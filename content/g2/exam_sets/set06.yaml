set: 6
title: 2級 模擬試験 第6回
minutes: 90
problems:
  - id: s06p01
    title: 2 つのクラスの得点
    context: |
      2 つのクラスの小テストの得点を比べる。
    items:
      - id: s06p01a
        chapter: 1
        terms: [distribution-shape, mean-median-mode]
        topic: 2つの山があるヒストグラムで平均値がどちらの山からも外れることを読み取り層に分ける必要を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある学年全体の得点のヒストグラムは、30 点付近と 80 点付近に 2 つの山があり、その間の 50〜60 点はほとんどいなかった。正しい記述はどれか。
        choices:
          - 山が 2 つあるので、平均値と最頻値は必ず一致する
          - 山が 2 つある分布は、左右対称にはなりえない
          - 平均値は必ずどちらかの山の位置にある
          - 平均値は 2 つの山の間の、人数の少ない値になる可能性があり、性質の違う集団が混ざっていないかを調べるべきである
          - 二峰性は、分散が小さいことを表している
        answer: 3
        distractors:
          - 最頻値は山の位置で、平均値とは一般に一致しない
          - 2 つの山の高さや位置がそろえば左右対称になりうる
          - 平均値は 2 つの山の重心で、山の間になりうる
          - 正解
          - 2 つの山が離れているほど分散は大きい
        explanation: |
          **方針** 二峰性の分布は、性質の違う 2 つの集団が混ざっていることが多い。

          **途中式** 2 つの山の重心が平均値なので、山と山の間（人数の少ない値）になりうる。

          **答え** 混ざった集団がないかを調べるべきである

          **間違えやすい点** 二峰の分布では平均値 1 つで要約すると誤解を招く。集団（コース・学年など）に分けて要約する。
      - id: s06p01b
        chapter: 1
        terms: [stem-and-leaf-plot, mean-median-mode]
        topic: 背中合わせの幹葉図から2つのクラスの中央値をそれぞれ読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          A 組・B 組 9 人ずつの得点を背中合わせの幹葉図にした（幹の左が A 組、右が B 組。単位：6｜1 は 61 点）。

          | A 組の葉 | 幹 | B 組の葉 |
          |---|---|---|
          | | 4 | 5 9 |
          | 8 2 | 5 | 5 6 |
          | 7 3 1 | 6 | 0 2 6 |
          | 5 4 0 | 7 | 2 |
          | 1 | 8 | 8 |

          A 組と B 組の中央値の組合せはどれか。
        choices:
          - A 組 66.8 点、B 組 61.4 点
          - A 組 67 点、B 組 60 点
          - A 組 63 点、B 組 56 点
          - A 組 70 点、B 組 62 点
          - A 組 61 点、B 組 60 点
        answer: 1
        distractors:
          - 平均値を答えた
          - 正解
          - 4 番目の値を中央値とした
          - 6 番目の値を中央値とした
          - A 組の葉を左から書かれた順に読み、並べ替えずに 5 番目を答えた
        explanation: |
          **方針** 9 人なので、それぞれ小さい順に 5 番目の値が中央値。左側の葉は幹から外向きに大きくなるように並んでいる。

          **途中式** A 組：52, 58, 61, 63, 67, 70, 74, 75, 81 → 67。B 組：45, 49, 55, 56, 60, 62, 66, 72, 88 → 60。

          **答え** A 組 67 点、B 組 60 点

          **間違えやすい点** 背中合わせの幹葉図では、左側の葉の並ぶ向きに注意する（幹に近いほど小さい）。
  - id: s06p02
    title: 標準化と所得の分布
    context: |
      データを加工して比べる。
    items:
      - id: s06p02a
        chapter: 2
        terms: [standard-score, sample-variance-sd]
        topic: データ全体を標準得点と偏差値に変換したときの平均と標準偏差を答える
        level: 基本
        definition: false
        type: choice
        question: |
          あるクラスの得点（平均 62 点、標準偏差 12 点）を、全員について標準得点（z 得点）と偏差値に変換した。変換後の標準得点の平均・標準偏差と、偏差値の平均・標準偏差の組合せとして正しいものはどれか。
        choices:
          - 標準得点は平均 0・標準偏差 1、偏差値は平均 50・標準偏差 10
          - 標準得点は平均 62・標準偏差 12、偏差値は平均 50・標準偏差 10
          - 標準得点は平均 0・標準偏差 1、偏差値は平均 62・標準偏差 12
          - 標準得点は平均 0・標準偏差 12、偏差値は平均 50・標準偏差 10
          - 標準得点は平均 1・標準偏差 0、偏差値は平均 10・標準偏差 50
        answer: 0
        distractors:
          - 正解
          - 標準化で平均と標準偏差が変わることを考えていない
          - 偏差値は平均 50・標準偏差 10 になるように作る
          - 標準偏差で割るので標準偏差は 1 になる
          - 平均と標準偏差の値を取り違えた
        explanation: |
          **方針** 標準得点 $z=(x-\bar x)/s$、偏差値 $=50+10z$。1 次変換の性質を使う。

          **途中式** $z$ の平均 $(62-62)/12=0$、標準偏差 $12/12=1$。偏差値の平均 $50+10\times 0=50$、標準偏差 $10\times 1=10$。

          **答え** 標準得点は平均 0・標準偏差 1、偏差値は平均 50・標準偏差 10

          **間違えやすい点** 変換しても分布の形は変わらない。
      - id: s06p02b
        chapter: 2
        terms: [lorenz-curve-gini, cumulative-frequency]
        topic: ローレンツ曲線上の点から所得の多い半数の世帯が全体の何割を持つかを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          ある地域の所得のローレンツ曲線は、点（0.5, 0.2）と点（0.9, 0.6）を通る（横軸：世帯の累積割合、縦軸：所得の累積割合）。正しい記述はどれか。
        choices:
          - 所得の少ない半数の世帯が、所得全体の 50% を持っている
          - 所得の多い上位 50% の世帯が、所得全体の 20% を持っている
          - 所得の多い上位 10% の世帯が、所得全体の 40% を持っている
          - 所得の多い上位 10% の世帯が、所得全体の 60% を持っている
          - この曲線から、ジニ係数は 0.2 とわかる
        answer: 2
        distractors:
          - 下位 50% は所得の 20% を持つ
          - 上位 50% は所得の 1 − 0.2 ＝ 80% を持つ
          - 正解
          - 下位 90% が 60% を持つので、上位 10% は 40%
          - ジニ係数は曲線全体の面積から求める。1 つの点の値ではない
        explanation: |
          **方針** ローレンツ曲線の点（$a$, $b$）は「所得の少ない順に $a$ の割合の世帯が、所得の $b$ を持つ」ことを表す。

          **途中式** 下位 90% が 60% を持つ → 上位 10% は $100\%-60\%=40\%$。

          **答え** 上位 10% の世帯が所得の 40% を持つ

          **間違えやすい点** 上位の割合は 1 から引いて求める。
  - id: s06p03
    title: 2 つの変数の関係と回帰
    context: |
      2 つの変数 $x$、$y$ の関係を調べる。
    items:
      - id: s06p03a
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 一方の変数に負の数を掛けて定数を足したときの相関係数の符号と大きさの変化を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          $x$ と $y$ の相関係数は 0.6 だった。$u=-2x+3$ とすると、$u$ と $y$ の相関係数はいくらか。
        choices:
          - '0.6'
          - '−1.2'
          - '1.8'
          - '−0.6'
          - '−0.3'
        answer: 3
        distractors:
          - 負の数を掛けると符号が変わることを考えていない
          - 相関係数に −2 を掛けた
          - 相関係数に $u$ と同じ変換をした（$-2\times 0.6+3$）
          - 正解
          - 相関係数を −2 で割った
        explanation: |
          **方針** 相関係数は、変数に正の数を掛けたり定数を足したりしても変わらないが、負の数を掛けると符号が変わる。

          **途中式** 共分散は $-2$ 倍、$u$ の標準偏差は $2$ 倍 → 相関係数は $(-2)/2=-1$ 倍で $-0.6$。

          **答え** −0.6

          **間違えやすい点** 相関係数はいつも −1 以上 1 以下なので、−1.2 や 1.8 はありえない。
      - id: s06p03b
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 相関係数の性質について直線上に並ぶ点の場合などから正しい記述を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          相関係数について正しい記述はどれか。
        choices:
          - 相関係数が 0.8 なら、$y$ の 80% が $x$ で説明される
          - 相関係数は、$x$ の単位を cm から m に変えると 1/100 になる
          - すべての点が右下がりの直線の上にあれば、相関係数は −1 である
          - 相関係数が 0 なら、2 つの変数は独立である
          - 傾きが急な直線の上に点が並ぶほど、相関係数は大きい
        answer: 2
        distractors:
          - 説明される割合は決定係数（$0.8^2=0.64$）
          - 相関係数は単位によらない
          - 正解
          - 曲線的な関係があっても 0 になりうる
          - 直線の上に並べば、傾きによらず ±1
        explanation: |
          **方針** 相関係数は直線的な関係の強さを表し、点がすべて直線上にあれば ±1。

          **途中式** 右下がりの直線上 → 完全な負の相関 → −1。

          **答え** すべての点が右下がりの直線上にあれば −1

          **間違えやすい点** 相関係数の大きさは直線の傾きの急さではなく、直線のまわりへの集まり具合。
      - id: s06p03c
        chapter: 4
        terms: [simple-regression, covariance-and-correlation]
        topic: yをxで説明する回帰の傾きとxをyで説明する回帰の傾きの積が相関係数の2乗になることから相関係数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          $y$ を $x$ で説明する回帰直線の傾きは 0.8、$x$ を $y$ で説明する回帰直線の傾きは 0.45 だった。$x$ と $y$ の相関係数はいくらか。
        choices:
          - '0.36'
          - '0.625'
          - '1.25'
          - '0.6'
          - '0.8'
        answer: 3
        distractors:
          - 2 つの傾きの積（相関係数の 2 乗）を答えた
          - 2 つの傾きの平均を答えた
          - 2 つの傾きの和を答えた
          - 正解
          - $y$ を $x$ で説明する傾きをそのまま答えた
        explanation: |
          **方針** $b_{y\cdot x}=S_{xy}/S_{xx}$、$b_{x\cdot y}=S_{xy}/S_{yy}$ なので、積は $S_{xy}^2/(S_{xx}S_{yy})=r^2$。

          **途中式** $r^2=0.8\times 0.45=0.36$、傾きが正なので $r=0.6$。

          **答え** 0.6

          **間違えやすい点** 2 本の回帰直線は一般に一致しない。一致するのは $r=\pm 1$ のときだけ。
  - id: s06p04
    title: 統計の公表値と物価
    context: |
      公表される経済統計を読む。
    items:
      - id: s06p04a
        chapter: 5
        terms: [seasonal-adjustment, time-series-components]
        topic: 季節調整済みの前月比と原数値の前年同月比の使い分けを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある月次の統計で、季節調整値の前月比が −0.5%、原数値（季節調整をしていない値）の前年同月比が +3% と公表された。正しい読み方はどれか。
        choices:
          - 原数値の前月比も必ず −0.5% である
          - 前年同月比が +3% なので、前月より 3% 増えている
          - 季節の影響を除くと前月より少し減ったが、1 年前の同じ月と比べると増えている
          - 季節調整値は季節の影響を含んだ値である
          - 2 つの数字が矛盾しているので、どちらかが誤りである
        answer: 2
        distractors:
          - 原数値の前月比は季節変動を含むので、大きく違うことがある
          - 前年同月比は 1 年前との比較
          - 正解
          - 季節調整値は季節の影響を取り除いた値
          - 比べている時点と処理が違うので矛盾ではない
        explanation: |
          **方針** 季節調整値の前月比は「季節の影響を除いた直近の動き」、原数値の前年同月比は「1 年前の同じ季節との比較」。

          **途中式** 直近 1 か月は減ったが、1 年の流れでは増えている。

          **答え** 季節の影響を除くと前月より減ったが、前年同月よりは増えている

          **間違えやすい点** 景気の転換点を見るには季節調整値の前月比、1 年の伸びを見るには前年同月比を使う。
      - id: s06p04b
        chapter: 5
        terms: [price-index, weighted-geometric-harmonic-mean]
        topic: 支出の割合のウエイトと品目ごとの価格比からラスパイレス型の物価指数を加重平均で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある家計の支出の割合（基準時）は、食料 30%、住居 20%、その他 50% で、基準時からの価格比はそれぞれ 1.10、1.00、1.04 だった。この支出の割合をウエイトとするラスパイレス型の物価指数（基準時 ＝ 100）はいくらか。
        choices:
          - '104.7'
          - '105.0'
          - '114.0'
          - '104.0'
          - '110.0'
        answer: 1
        distractors:
          - 3 つの価格比を単純に平均した（ウエイトを使っていない）
          - 正解
          - 価格比の増加分を足した（10＋0＋4）
          - ウエイトの順番を取り違えた（食料 20%、住居 30%）
          - 最も大きい価格比（食料）だけを使った
        explanation: |
          **方針** ラスパイレス指数は、基準時の支出の割合で価格比を加重平均したもの。

          **途中式** $0.3\times 1.10+0.2\times 1.00+0.5\times 1.04=0.33+0.20+0.52=1.05$

          **答え** 105.0

          **間違えやすい点** ウエイトの合計が 1 になっていることを確かめる。単純平均では、支出の大きい品目の影響が正しく反映されない。
  - id: s06p05
    title: 調査の計画
    context: |
      調査や研究の計画を考える。
    items:
      - id: s06p05a
        chapter: 6
        terms: [simple-random-sampling, population-and-sample]
        topic: 市民の意見を調べる方法として住民基本台帳から乱数で選ぶ方法を他の偏りのある方法と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          ある市の 18 歳以上の市民の意見を調べたい。単純無作為抽出にあたる方法はどれか。
        choices:
          - 駅前で通りかかった人に声をかけ、1000 人に答えてもらう
          - 18 歳以上の市民の名簿から、乱数を使って 1000 人を選ぶ
          - 市のウェブサイトで回答を募り、先着 1000 人の回答を使う
          - 調査員の知り合いから 1000 人を選ぶ
          - 名簿の最初の 1000 人を選ぶ
        answer: 1
        distractors:
          - 駅を利用する人・その時間にいる人に偏る
          - 正解
          - 関心の強い人が回答しやすく偏る
          - 調査員の意図や交友関係で偏る
          - 名簿の並び（地区・年齢など）によって偏る
        explanation: |
          **方針** 単純無作為抽出は、母集団の全員が同じ確率で選ばれる方法。名簿（抽出枠）と乱数が必要。

          **途中式** 名簿から乱数で選べば、誰が選ばれるかは偶然だけで決まる。

          **答え** 名簿から乱数で 1000 人を選ぶ

          **間違えやすい点** 人数を多くしても、選び方が偏っていれば偏りは消えない。
      - id: s06p05b
        chapter: 6
        terms: [observational-vs-experimental, spurious-correlation]
        topic: コーヒーを飲む量と病気の関連で喫煙という交絡因子がありうることと無作為割り付けの意味を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある調査で、コーヒーを多く飲む人ほど心臓の病気が多いという関連が見られた。ただし、コーヒーを多く飲む人は喫煙者が多かった。この関連について最も適切な記述はどれか。
        choices:
          - 関連が見られたので、コーヒーが心臓の病気の原因であると結論できる
          - 喫煙者を含めて調べたので、喫煙の影響はすでに除かれている
          - 対象者を増やせば、喫煙の影響はなくなる
          - 観察研究では、関連を調べること自体に意味がない
          - 喫煙が交絡因子になっている可能性があり、コーヒーの影響かどうかはこの調査だけでは判断できない
        answer: 4
        distractors:
          - 観察された関連だけでは因果関係はわからない
          - 喫煙者を含めると、むしろ喫煙の影響が混ざる
          - 人数を増やしても交絡は消えない
          - 観察研究でも、交絡を考えて調整すれば多くのことがわかる
          - 正解
        explanation: |
          **方針** 喫煙はコーヒーの量とも病気とも関係しているので、交絡因子の候補になる。

          **途中式** 喫煙の有無で層別して比べる、喫煙を説明変数に加えた回帰で調整する、などで喫煙の影響を除いて調べる。

          **答え** 喫煙が交絡因子の可能性があり、判断できない

          **間違えやすい点** コーヒーの量を研究者が無作為に割り付ける実験ができれば交絡を防げるが、現実には難しいことが多い。
  - id: s06p06
    title: 確率の計算
    context: |
      確率を求める。
    items:
      - id: s06p06a
        chapter: 7
        terms: [counting, events-and-probability]
        topic: 5人を1列に並べるとき特定の2人が隣り合う確率を順列で求める
        level: 基本
        definition: false
        type: choice
        question: |
          A〜E の 5 人を無作為に 1 列に並べる。A と B が隣り合う確率はいくらか。
        choices:
          - '0.2'
          - '0.1'
          - '0.5'
          - '0.4'
          - '0.8'
        answer: 3
        distractors:
          - A と B の並び順（AB と BA）の 2 通りを数え忘れた
          - まとまり以外の 3 人だけを並べ、まとまりを含めた 4 つの並べ方を考えなかった（$3!\times 2/5!$）
          - 「隣り合う・隣り合わない」を同じ確からしさとした
          - 正解
          - 2 通りの並び順を 2 回掛けた
        explanation: |
          **方針** A と B をひとまとめにして 4 つのものを並べ、まとまりの中の順番 2 通りを掛ける。

          **途中式** $\dfrac{4!\times 2}{5!}=\dfrac{48}{120}=0.4$

          **答え** 0.4

          **間違えやすい点** まとまりの中の並び順（AB と BA）を忘れない。
      - id: s06p06b
        chapter: 7
        terms: [bayes-theorem, law-of-total-probability]
        topic: 迷惑メールの割合と特定の語が含まれる確率からその語を含むメールが迷惑メールである確率をベイズの定理で求める
        level: 標準
        definition: false
        type: choice
        question: |
          受信するメールの 20% は迷惑メールである。ある語は、迷惑メールの 60%、迷惑メールでないメールの 5% に含まれる。この語を含むメールが迷惑メールである確率はいくらか。
        choices:
          - '0.60'
          - '0.12'
          - '0.75'
          - '0.16'
          - '0.25'
        answer: 2
        distractors:
          - 迷惑メールがこの語を含む確率と取り違えた
          - 「迷惑メールで、かつ語を含む」確率
          - 正解
          - この語を含むメールの割合
          - 語を含むメールが迷惑メールでない確率（0.04 ÷ 0.16）を求めた
        explanation: |
          **方針** ベイズの定理。分母は全確率の公式で求める。

          **途中式** $P(\text{迷惑かつ語})=0.2\times 0.6=0.12$、$P(\text{非迷惑かつ語})=0.8\times 0.05=0.04$、$0.12/0.16=0.75$

          **答え** 0.75

          **間違えやすい点** 迷惑メールの割合（事前確率 0.2）が、語を含むという情報で 0.75 に更新される。
  - id: s06p07
    title: 確率変数の性質
    context: |
