          | | 推定値 | 標準誤差 |
          |---|---|---|
          | $x_1$ | 4.2 | 1.4 |
          | $x_2$ | −0.9 | 0.2 |
        choices:
          - $x_2$（t ＝ −4.5）
          - $x_1$（t ＝ 3.0）
          - $x_1$（推定値 4.2 が大きい）
          - どちらも有意でない
          - $x_2$（t ＝ −0.22）
        answer: 0
        distractors:
          - 正解
          - $x_1$ の t 値は 3.0 で、$x_2$ の絶対値 4.5 より小さい
          - 推定値の大きさは単位に依存し、有意性は t 値で判断する
          - どちらも |t| が 2.086 より大きい
          - 標準誤差を推定値で割った
        explanation: |
          **方針** t 値 ＝ 推定値 ÷ 標準誤差。絶対値で比べる。

          **途中式** $x_1$：$4.2/1.4=3.0$、$x_2$：$-0.9/0.2=-4.5$。どちらも $|t|>2.086$。

          **答え** $x_2$（t ＝ −4.5）

          **間違えやすい点** 負の係数も、絶対値が大きければ強く有意。推定値の大きさだけで判断しない。
      - id: s06p12b
        chapter: 14
        terms: [regression-output, residual]
        topic: 残差平方和と残差の自由度から残差の標準偏差の推定値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          この重回帰分析の残差平方和は 200 だった。誤差の標準偏差の推定値（残差の平方和を残差の自由度で割って平方根をとったもの）はいくらか。
        choices:
          - '2.95'
          - '10.0'
          - '14.1'
          - '3.16'
          - '3.02'
        answer: 3
        distractors:
          - データの数 23 で割った
          - 平方根をとらなかった
          - 残差平方和の平方根をそのまま答えた
          - 正解
          - 自由度を 22 とした
        explanation: |
          **方針** 残差の自由度は $n-p-1=23-2-1=20$。

          **途中式** $\sqrt{200/20}=\sqrt{10}\approx 3.16$

          **答え** 3.16

          **間違えやすい点** 推定した係数の数（切片を含めて 3）だけ自由度が減る。
      - id: s06p12c
        chapter: 14
        terms: [log-transformation, simple-regression]
        topic: 両方の変数を対数変換した回帰の傾きを弾力性として1パーセントの変化に対する変化率で解釈する
        level: 応用
        definition: false
        type: choice
        question: |
          ある商品の販売量 $Q$ と価格 $P$ について、両方の自然対数をとった回帰 $\log Q=8.0-1.2\log P$ が得られた。この式の解釈として最も適切なものはどれか。
        choices:
          - 価格が 1 円上がると、販売量は 1.2 個減る
          - 価格が 1 円上がると、販売量は 1.2% 減る
          - 価格が 1% 上がると、販売量は 1.2 個減る
          - 価格が 2 倍になると、販売量は 1.2 倍になる
          - 価格が 1% 上がると、販売量はおよそ 1.2% 減る
        answer: 4
        distractors:
          - 両方を対数にしたので、変化は割合で読む
          - 価格は対数にしているので、1 円あたりではなく割合で読む
          - 販売量も対数にしているので、個数ではなく割合で読む
          - 2 倍になると販売量は $2^{-1.2}\approx 0.44$ 倍
          - 正解
        explanation: |
          **方針** 両方を対数にした回帰の傾きは「$P$ が 1% 変わったときの $Q$ の変化率（%）」（弾力性）。

          **途中式** $\log Q$ の変化 $=-1.2\times\log P$ の変化。$\log$ の小さな変化は変化率にほぼ等しい。

          **答え** 価格が 1% 上がると販売量はおよそ 1.2% 減る

          **間違えやすい点** 目的変数だけを対数にした場合（説明変数 1 単位で何 % 変わるか）と区別する。
