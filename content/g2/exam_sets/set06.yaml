    items:
      - id: s06p07a
        chapter: 8
        terms: [probability-mass-and-density-function, expectation-variance-properties]
        topic: 確率分布表の未知の確率を確率の合計が1になることから求め期待値を計算する
        level: 基本
        definition: false
        type: choice
        question: |
          確率変数 $X$ は 1、2、3 の値をとり、$P(X=1)=0.2$、$P(X=2)=a$、$P(X=3)=0.5$ である。$a$ と $E[X]$ の組合せはどれか。
        choices:
          - $a=0.3$、$E[X]=2.3$
          - $a=0.3$、$E[X]=2.0$
          - $a=0.5$、$E[X]=2.7$
          - $a=0.3$、$E[X]=1.0$
          - $a=0.7$、$E[X]=3.1$
        answer: 0
        distractors:
          - 正解
          - 期待値を値の単純な平均とした
          - $a$ を 0.5 と誤り、確率の合計が 1 を超えている
          - 確率の合計（1）を期待値とした
          - $a$ を 1 − 0.3 と誤った
        explanation: |
          **方針** 確率の合計は 1。期待値は Σ（値 × 確率）。

          **途中式** $a=1-0.2-0.5=0.3$、$E[X]=1\times 0.2+2\times 0.3+3\times 0.5=2.3$

          **答え** $a=0.3$、$E[X]=2.3$

          **間違えやすい点** 確率分布の問題では、まず確率の合計が 1 になることを使う。
      - id: s06p07b
        chapter: 8
        terms: [sum-of-random-variables, covariance-and-correlation, expectation-variance-properties]
        topic: 負の相関がある2つの投資の収益を半分ずつ組み合わせたときの分散を共分散を含めて求める
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの投資の収益 $X$、$Y$ の分散はそれぞれ 4 と 9、相関係数は −0.5 である。資金を半分ずつに分けた収益 $0.5X+0.5Y$ の分散はいくらか。
        choices:
          - '3.25'
          - '6.50'
          - '4.75'
          - '3.00'
          - '1.75'
        answer: 4
        distractors:
          - 共分散を無視した（独立とした）
          - 係数を 2 乗せずに 0.5 を掛け、共分散の項も忘れた（$0.5\times 4+0.5\times 9$）
          - 共分散の符号を逆にした
          - 共分散を相関係数のまま使った
          - 正解
        explanation: |
          **方針** $V[aX+bY]=a^2V[X]+b^2V[Y]+2ab\,\mathrm{Cov}[X,Y]$、$\mathrm{Cov}=\rho\sigma_X\sigma_Y$。

          **途中式** $\mathrm{Cov}=-0.5\times 2\times 3=-3$、$0.25\times 4+0.25\times 9+2\times 0.25\times(-3)=1+2.25-1.5=1.75$

          **答え** 1.75

          **間違えやすい点** 負の相関がある資産を組み合わせると、散らばり（リスク）が小さくなる。
  - id: s06p08
    title: 分布の利用
    context: |
      必要なら次の値を使ってよい：$P(Z>2)=0.0228$、$z_{0.025}=1.96$。
    items:
      - id: s06p08a
        chapter: 9
        terms: [poisson-distribution]
        topic: 1時間あたり平均2件のポアソン分布から3時間の件数の分布の期待値と分散を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある窓口への電話は 1 時間あたり平均 2 件のポアソン分布にしたがう（時間ごとに独立）。3 時間の電話の件数の期待値と分散の組合せはどれか。
        choices:
          - 期待値 6、分散 6
          - 期待値 6、分散 2
          - 期待値 6、分散 18
          - 期待値 2、分散 2
          - 期待値 6、分散 36
        answer: 0
        distractors:
          - 正解
          - 3 時間分の分散を 1 時間分のままにした
          - 分散を 3² 倍した（3 時間の件数を 1 時間の件数の 3 倍とした）
          - 1 時間分の値を答えた
          - 期待値の 2 乗を分散とした
        explanation: |
          **方針** 独立なポアソン分布の和はポアソン分布で、平均は足し算になる。ポアソン分布の分散は平均に等しい。

          **途中式** 3 時間で平均 $2\times 3=6$ のポアソン分布 → 期待値 6、分散 6。

          **答え** 期待値 6、分散 6

          **間違えやすい点** 3 時間の件数は「1 時間の件数の 3 倍」ではなく「3 つの 1 時間の件数の和」なので、分散は 3² 倍ではなく 3 倍。
      - id: s06p08b
        chapter: 9
        terms: [normal-distribution, standard-normal-distribution]
        topic: 平均と上側確率がわかっている正規分布から標準偏差を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある部品の長さは平均 60 mm の正規分布にしたがい、長さが 70 mm を超える部品の割合は 2.28% である。長さの標準偏差はいくらか。
        choices:
          - 10 mm
          - 5.1 mm
          - 5 mm
          - 2.28 mm
          - 20 mm
        answer: 2
        distractors:
          - 平均との差 10 をそのまま標準偏差とした
          - 2.28% を両側 5% と取り違え、1.96 で割った
          - 正解
          - 割合の数値をそのまま使った
          - 平均との差に 2 を掛けた
        explanation: |
          **方針** $P(Z>2)=0.0228$ なので、70 は平均から標準偏差の 2 倍上の値。

          **途中式** $(70-60)/\sigma=2$ → $\sigma=5$

          **答え** 5 mm

          **間違えやすい点** 上側確率から標準正規分布の点を読み、標準化の式を逆に解く。
  - id: s06p09
    title: 標本分布
    context: |
      必要なら次の値を使ってよい：$P(Z>0.9)=0.1841$、$P(Z>1.0)=0.1587$、$P(Z>1.1)=0.1357$、$t_{0.025}(15)=2.131$、$t_{0.025}(16)=2.120$。
    items:
      - id: s06p09a
        chapter: 10
        terms: [central-limit-theorem, sampling-distribution-of-mean]
        topic: 標本平均の分布を正規分布とみなしてよい条件を中心極限定理と正規母集団の場合から判断する
        level: 基本
        definition: true
        type: choice
        question: |
          標本平均の分布について正しい記述はどれか。
        choices:
          - 母集団が正規分布のときに限り、標本平均は正規分布で近似できる
          - 標本の大きさによらず、標本平均の分布は母集団の分布と同じ形になる
          - 母集団が正規分布なら標本の大きさによらず正規分布にしたがい、そうでなくても標本が大きければ正規分布で近似できる
          - 標本を大きくすると、標本平均の分散は大きくなる
          - 標本平均の分布の平均は、標本の大きさが大きいほど母平均から離れる
        answer: 2
        distractors:
          - 中心極限定理により、母集団が正規分布でなくても近似できる
          - 標本を大きくすると、分布の形は正規分布に近づく
          - 正解
          - 分散は σ²/n で、小さくなる
          - 標本平均の分布の平均は常に母平均
        explanation: |
          **方針** 正規母集団なら標本平均も正確に正規分布。一般の母集団でも中心極限定理により近似できる。

          **途中式** いずれの場合も、平均 $\mu$、分散 $\sigma^2/n$。

          **答え** 正規母集団なら正確に、そうでなくても大標本で近似的に正規分布

          **間違えやすい点** 母集団の歪みが強いほど、近似に必要な標本の大きさは大きい。
      - id: s06p09b
        chapter: 10
        terms: [normal-approximation-binomial-poisson, continuity-correction]
        topic: 公正な硬貨を100回投げて表が45回以下になる確率を連続修正つきの正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          公正な硬貨を 100 回投げる。表が 45 回以下になる確率を、連続修正を行った正規近似で求めるといくらか。
        choices:
          - '0.1587'
          - '0.1841'
          - '0.1357'
          - '0.8159'
          - '0.3682'
        answer: 1
        distractors:
          - 連続修正をしなかった（45 で標準化）
          - 正解
          - 修正の向きを逆にした（44.5 で標準化）
          - 45.5 以上の確率を求めた
          - 両側の確率を求めた
        explanation: |
          **方針** 平均 50、標準偏差 5 の正規分布で近似し、「45 以下」は 45.5 までとする。

          **途中式** $(45.5-50)/5=-0.9$、$P(Z<-0.9)=P(Z>0.9)=0.1841$

          **答え** 0.1841

          **間違えやすい点** 「以下」は ＋0.5、「以上」は −0.5 の向きに修正する。正確な二項確率は約 0.184。
      - id: s06p09c
        chapter: 10
        terms: [t-distribution, statistical-tables, sampling-distribution-of-mean]
        topic: 正規母集団の16個の標本から作るt統計量の絶対値が2.131を超える確率を答える
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 16 の標本を抽出し、$T=\dfrac{\bar X-\mu}{S/\sqrt{16}}$（$S$ は不偏分散の平方根）とする。$P(|T|>2.131)$ はいくらか。
        choices:
          - '0.025'
          - '0.10'
          - '0.95'
          - '0.0331'
          - '0.05'
        answer: 4
        distractors:
          - 片側の確率を答えた
          - 上側 2.5% 点を上側 5% 点と取り違え、両側を 10% とした
          - $|T|$ が 2.131 以下の確率を答えた
          - 標準正規分布として $2P(Z>2.131)$ を計算した
          - 正解
        explanation: |
          **方針** $T$ は自由度 15 の t 分布にしたがい、$t_{0.025}(15)=2.131$。

          **途中式** $P(T>2.131)=0.025$、対称性から $P(|T|>2.131)=0.05$。

          **答え** 0.05

          **間違えやすい点** 自由度は 16 ではなく 15。標準正規分布として計算すると確率を小さく見積もる。
  - id: s06p10
