set: 13
title: 2級 模擬試験 第13回
minutes: 90
problems:
  - id: s13p01
    title: データの種類と幹葉図
    context: |
      データの種類に合ったまとめ方を考える。
    items:
      - id: s13p01a
        chapter: 1
        terms: [scales-of-measurement, mean-median-mode]
        topic: 名義尺度の変数で意味のある代表値は最頻値だけであることを判断する
        level: 基本
        definition: true
        type: choice
        question: |
          100 人の血液型（A・B・O・AB）を調べた。このデータの代表値として意味があるものはどれか。
        choices:
          - A＝1、B＝2、O＝3、AB＝4 と番号を付けたときの平均値
          - 同じ番号を付けたときの中央値
          - 最も人数の多い血液型（最頻値）
          - 同じ番号を付けたときの標準偏差
          - 血液型の幾何平均
        answer: 2
        distractors:
          - 番号は区別のためのもので、大小や間隔に意味がないので平均は意味をもたない
          - 名義尺度には順序がないので、中央値も意味をもたない
          - 正解
          - 番号の付け方を変えると値が変わり、意味をもたない
          - 名義尺度には数値としての意味がない
        explanation: |
          **方針** 血液型は名義尺度（区別だけに意味がある）。

          **途中式** 番号の付け方は自由に変えられるので、平均値・中央値・標準偏差は番号の付け方しだいで変わる。度数だけは番号によらない。

          **答え** 最頻値

          **間違えやすい点** 順序尺度なら中央値も使えるが、名義尺度で使えるのは最頻値と度数・割合。
      - id: s13p01b
        chapter: 1
        terms: [stem-and-leaf-plot, mean-median-mode]
        topic: 葉の単位が0.1の幹葉図から元の値を読み取って中央値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          5 人の、ある測定値を幹葉図に表した（単位：3｜2 は 3.2）。中央値を求めよ。

          | 幹 | 葉 |
          |---|---|
          | 3 | 2 5 7 |
          | 4 | 0 4 |
        choices:
          - "37"
          - "3.76"
          - "3.5"
          - "4"
          - "3.7"
        answer: 4
        distractors:
          - 葉の単位を無視して 37 と読んでいる
          - 平均値を求めている
          - 小さいほうから 2 番目の値を答えている
          - 幹だけを見て、人数の多い段を答えている
          - 正解
        explanation: |
          **方針** 葉の単位 0.1 から、元の値を読み取る。

          **途中式** 値は 3.2, 3.5, 3.7, 4.0, 4.4。5 個の真ん中（3 番目）は 3.7。

          **答え** 3.7

          **間違えやすい点** 幹葉図では、葉の単位（どの位の数字か）を必ず確かめる。
  - id: s13p02
    title: 不平等の指標と平均の種類
    context: |
      データを 1 つの数値で要約する。
    items:
      - id: s13p02a
        chapter: 2
        terms: [lorenz-curve-gini]
        topic: ジニ係数は完全に平等なとき0で不平等が大きいほど1に近づきローレンツ曲線と対角線の間の面積で決まることを答える
        level: 基本
        definition: false
        type: choice
        question: |
          所得の分布のジニ係数について、正しいものはどれか。
        choices:
          - 全員の所得が等しいと 1 になる
          - 全員の所得が等しいと 0 で、1 人が全体を独占する状態に近いほど 1 に近づく
          - ローレンツ曲線が対角線に近いほど大きくなる
          - 平均所得が高い国ほど必ず大きくなる
          - 値はいつも 0.5 以上になる
        answer: 1
        distractors:
          - 0 と 1 の意味を逆にしている
          - 正解
          - 対角線から離れる（ふくらむ）ほど大きくなる
          - ジニ係数は分布の偏りを表し、所得の水準とは関係がない
          - 0 から 1 の間のどの値もとりうる
        explanation: |
          **方針** ジニ係数は、ローレンツ曲線と対角線（完全平等の線）で囲まれた部分の面積の 2 倍。

          **途中式** 完全平等ならローレンツ曲線は対角線と重なり 0。1 人がすべてを持つと面積は三角形の半分に近づき、ジニ係数は 1 に近づく。

          **答え** 等しいと 0、独占に近いほど 1 に近づく

          **間違えやすい点** ジニ係数は散らばりの割合の指標で、所得を全員 2 倍にしても変わらない。
      - id: s13p02b
        chapter: 2
        terms: [weighted-geometric-harmonic-mean]
        topic: 2つの正の数の算術平均と幾何平均と調和平均を求め算術平均以上幾何平均以上調和平均の大小を確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの値 4 と 9 の算術平均・幾何平均・調和平均の組合せとして正しいものはどれか。
        choices:
          - 3 つとも 6.5
          - 算術平均 6.5、幾何平均 約 5.54、調和平均 6
          - 算術平均 6.5、幾何平均 36、調和平均 約 5.54
          - 算術平均 6.5、幾何平均 6、調和平均 約 5.54
          - 算術平均 6.5、幾何平均 6、調和平均 約 0.18
        answer: 3
        distractors:
          - 値が違うときは 3 つの平均は等しくならない
          - 幾何平均と調和平均を入れかえている（いつも 算術 ≧ 幾何 ≧ 調和）
          - 幾何平均で平方根をとり忘れている
          - 正解
          - 調和平均で、逆数の平均をもう一度逆数にし忘れている
        explanation: |
          **方針** 算術平均 $\dfrac{a+b}{2}$、幾何平均 $\sqrt{ab}$、調和平均 $\dfrac{2}{1/a+1/b}$。

          **途中式** $\dfrac{13}{2}=6.5$、$\sqrt{36}=6$、$\dfrac{2}{1/4+1/9}=\dfrac{2}{13/36}=\dfrac{72}{13}\approx 5.54$。

          **答え** 算術平均 6.5、幾何平均 6、調和平均 約 5.54

          **間違えやすい点** 正の数では、いつも 算術平均 ≧ 幾何平均 ≧ 調和平均 で、等号はすべての値が等しいときだけ。
  - id: s13p03
    title: 相関と回帰の使い方
    context: |
      2 つの変数の関係を表し、予測に使う。
    items:
      - id: s13p03a
        chapter: 3
        terms: [covariance-and-correlation, correlation-matrix]
        topic: 分散共分散行列の対角の分散と対角以外の共分散から相関係数を求め回帰の傾きなどと区別する
        level: 基本
        definition: false
        type: choice
        question: |
          2 つの変数 $x$、$y$ の分散共分散行列は次のとおりだった。$x$ と $y$ の相関係数を求めよ。

          $$
          \begin{pmatrix} 9 & -6 \\ -6 & 16 \end{pmatrix}
          $$
        choices:
          - −6
          - 約 −0.042
          - −0.24
          - −0.5
          - 約 −0.67
        answer: 3
        distractors:
          - 共分散をそのまま答えている
          - 分散の積 144 で割っている（標準偏差の積で割る）
          - 分散の和 25 で割っている
          - 正解
          - x の分散 9 だけで割っている（y を x で説明する回帰の傾き）
        explanation: |
          **方針** 対角が分散、対角以外が共分散。相関係数は共分散を標準偏差の積で割る。

          **途中式** 標準偏差は $\sqrt9=3$、$\sqrt{16}=4$。$r=\dfrac{-6}{3\times 4}=-0.5$。

          **答え** −0.5

          **間違えやすい点** 分散の積ではなく、標準偏差（分散の平方根）の積で割る。
      - id: s13p03b
        chapter: 4
        terms: [simple-regression, least-squares-method]
        topic: yをxで説明する回帰直線をxについて解いてxを予測するのは不適切でxをyで説明する回帰を使うことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある集団で、身長 $x$（cm）から体重 $y$（kg）を予測する回帰直線 $\hat y=-60+0.75x$ を得た（相関係数は 0.6）。逆に、体重 65 kg の人の身長を予測したい。最も適切な方法はどれか。
        choices:
          - 65 ＝ −60 ＋ 0.75x を x について解き、約 166.7 cm と予測する
          - 体重から身長は予測できないので、身長の平均を答えるしかない
          - x を y で説明する回帰直線を別に求めて、y ＝ 65 を代入する
          - 回帰直線の x に 65 を代入して、−11.25 と予測する
          - 相関係数が正なので、どちらの回帰直線も同じになる
        answer: 2
        distractors:
          - y の方向の残差を最小にした直線で、x の予測の誤差を最小にするものではない
          - 相関があるので、x を y で説明する回帰で予測できる
          - 正解
          - 体重 65 を身長として代入している（変数を取り違えている）
          - 2 本の回帰直線が一致するのは相関係数が ±1 のときだけ
        explanation: |
          **方針** 最小二乗法は、目的変数の方向のずれを最小にする。予測したい変数を目的変数にする。

          **途中式** $x$ を $y$ で説明する回帰の傾きは $r\,\dfrac{s_x}{s_y}$ で、$y$ を $x$ で説明する直線の傾きの逆数 $\dfrac{1}{r}\dfrac{s_x}{s_y}$ とは、$r^2=1$ でない限り違う。

          **答え** $x$ を $y$ で説明する回帰直線を別に求めて使う

          **間違えやすい点** 式を逆に解くと、平均への回帰が逆向きにかかり、予測が平均から離れすぎる。
  - id: s13p04
    title: 季節変動と移動平均
    context: |
      四半期や月ごとの時系列データを扱う。
    items:
      - id: s13p04a
        chapter: 5
        terms: [seasonal-adjustment, time-series-components]
        topic: 乗法モデルの四半期の季節指数は平均が1になることから残りの1つを求め加法モデルと区別する
        level: 基本
        definition: false
        type: choice
        question: |
          乗法モデルで求めた四半期の季節指数（平均が 1 になるように調整したもの）が、1〜3 月期 0.9、4〜6 月期 1.2、7〜9 月期 0.8 だった。10〜12 月期の季節指数を求めよ。
        choices:
          - "1.0"
          - 約 0.97
          - "0.1"
          - "−2.9"
          - "1.1"
        answer: 4
        distractors:
          - 残りは季節の影響がないと考えている
          - 3 つの指数の平均をとっている
          - 4 つの合計を 3 としている
          - 加法モデルのように、4 つの合計を 0 にしている
          - 正解
        explanation: |
          **方針** 平均が 1 なので、4 つの指数の合計は 4。

          **途中式** $4-(0.9+1.2+0.8)=4-2.9=1.1$。

          **答え** 1.1

          **間違えやすい点** 加法モデルの季節変動は合計（平均）が 0 になるように、乗法モデルの季節指数は平均が 1 になるように調整する。
      - id: s13p04b
        chapter: 5
        terms: [moving-average]
        topic: 3年分の月次データに12か月の中心化移動平均をとったときに求められる値の個数を両端の欠けから求める
        level: 標準
        definition: false
        type: choice
        question: |
          3 年分（36 か月）の月次データに、12 か月の中心化移動平均をとる。中心化移動平均の値が求められるのは何か月分か。
        choices:
          - 25 か月分
          - 24 か月分
          - 36 か月分
          - 30 か月分
          - 12 か月分
        answer: 1
        distractors:
          - 中心化しない 12 項移動平均の個数（36 − 11）を答えている
          - 正解
          - 両端で求められない月があることを考えていない
          - 片側の 6 か月だけ欠けるとしている
          - 1 年分しか求められないと考えている
        explanation: |
          **方針** 12 か月の中心化移動平均は、中心の月の前後 6 か月ずつ（13 か月分）のデータを使う。

          **途中式** 最初の 6 か月と最後の 6 か月は前後のデータが足りないので求められない。$36-6-6=24$ か月分。

          **答え** 24 か月分

          **間違えやすい点** 移動平均の項数が多いほど変動はなめらかになるが、両端の欠ける期間が長くなり、最新の動きがわかりにくくなる。
      - id: s13p04c
        chapter: 5
        terms: [autocovariance-autocorrelation]
        topic: 5時点の時系列の偏差の積の和と偏差の2乗の和からラグ1の標本自己相関を求め割る数の不一致の誤りと区別する
        level: 標準
        definition: false
        type: choice
        question: |
          5 時点の時系列 4, 6, 2, 8, 5 のラグ 1 の標本自己相関を求めよ。ただし自己共分散は、どのラグでも偏差の積の和を 5 で割って求める。
        choices:
          - "0.65"
          - 約 −0.81
          - "−13"
          - −0.65
          - "−2.6"
        answer: 3
        distractors:
          - 符号を取り違えている（偏差の積の和は負）
          - ラグ 1 の自己共分散だけ組の数 4 で割っている（分母と分子で割る数をそろえていない）
          - 偏差の積の和をそのまま答えている
          - 正解
          - ラグ 1 の自己共分散を答えている（ラグ 0 の自己共分散で割っていない）
        explanation: |
          **方針** 平均からの偏差を求め、隣り合う偏差の積の和を、偏差の 2 乗の和で割る。

          **途中式** 平均は 5、偏差は −1, 1, −3, 3, 0。偏差の 2 乗の和は 20。隣り合う積の和は $(-1)(1)+(1)(-3)+(-3)(3)+(3)(0)=-13$。$-13/20=-0.65$。

          **答え** −0.65

          **間違えやすい点** ラグ 1 の自己相関が負なのは、上がった次は下がりやすいジグザグの系列のしるし。
  - id: s13p05
    title: 調査と実験の偏り
    context: |
      データの集め方による偏りを考える。
    items:
      - id: s13p05a
        chapter: 6
        terms: [population-and-sample, simple-random-sampling]
        topic: 固定電話の名簿から標本を選ぶと固定電話のない世帯が抽出の対象から外れて偏りが生じることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある市の全世帯の意見を調べるため、固定電話の番号の名簿から無作為に 1000 世帯を選んで電話調査をした。この方法の主な問題点として最も適切なものはどれか。
        choices:
          - 無作為に選んでいるので、偏りは生じない
          - 固定電話のない世帯（若い世帯など）が選ばれる可能性がなく、名簿と母集団がずれているので偏りが生じうる
          - 1000 世帯は母集団に比べて少なすぎるので、標本誤差が大きすぎる
          - 電話調査では標本誤差が生じない
          - 名簿から選ぶと、必ず系統抽出法になる
        answer: 1
        distractors:
          - 名簿の中で無作為でも、名簿に入っていない人は選ばれない
          - 正解
          - 標本誤差は主に標本の大きさで決まり、1000 世帯なら小さい
          - 標本調査なので標本誤差は生じる
          - 名簿からの選び方は単純無作為抽出でもよい
        explanation: |
          **方針** 標本を選ぶもとの名簿（抽出の枠）が、母集団全体を含んでいるかを確かめる。

          **途中式** 固定電話の名簿には、固定電話のない世帯が入っていない。その世帯の意見が他と違えば、何世帯選んでも偏りが残る。

          **答え** 名簿と母集団がずれているので偏りが生じうる

          **間違えやすい点** 無作為抽出が偏りを防ぐのは、名簿が母集団全体を含んでいるときだけ。
      - id: s13p05b
        chapter: 6
        terms: [treatment-and-control, observational-vs-experimental]
        topic: 薬の効果を調べる実験で偽薬を使い患者も評価者も割り付けを知らないようにする盲検化の目的を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい薬の効果を調べる実験で、患者を無作為に 2 群に分け、一方に薬、もう一方に見た目が同じ偽薬（プラセボ）を与え、患者も医師もどちらの群かを知らないようにした。この工夫の主な目的として最も適切なものはどれか。
        choices:
          - 患者の数を減らして費用を下げるため
          - 2 つの群の人数を等しくするため
          - 無作為に割り付けなくても偏りがなくなるようにするため
          - 薬の副作用をなくすため
          - 「薬を飲んだ」という期待や、評価する医師の思い込みによる差を、薬そのものの効果と区別するため
        answer: 4
        distractors:
          - 偽薬を使っても患者の数は減らない
          - 人数をそろえるのは割り付けの方法で決まる
          - 盲検化は無作為化の代わりではなく、両方を行う
          - 偽薬を使っても副作用はなくならない
          - 正解
        explanation: |
          **方針** 偽薬と盲検化で、2 つの群の違いを「薬の成分」だけにする。

          **途中式** 薬を飲んだと思うだけで症状がよくなる（プラセボ効果）ことや、医師が群を知っていると評価が甘くなることがある。どちらの群も同じ条件にすれば、差は薬の成分によるものと考えられる。

          **答え** 期待や思い込みによる差を、薬の効果と区別するため

          **間違えやすい点** 無作為化は群の性質をそろえるため、盲検化は実験中の扱いや評価をそろえるため。役割が違う。
  - id: s13p06
    title: 確率と共分散
    context: |
      確率や確率変数の性質を使う。
    items:
      - id: s13p06a
        chapter: 7
        terms: [events-and-probability]
        topic: 3つのサービスの利用率と重なりから包除原理で少なくとも1つを利用する確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある町の住民のうち、動画配信を使う人は 50%、音楽配信は 40%、電子書籍は 30%、動画と音楽の両方は 20%、動画と書籍の両方は 10%、音楽と書籍の両方は 10%、3 つすべては 5% だった。少なくとも 1 つを使う人の割合を求めよ。
        choices:
          - 120%
          - 80%
          - 75%
          - 15%
          - 85%
        answer: 4
        distractors:
          - 3 つの割合を足しただけで、重なりを引いていない
          - 2 つずつの重なりを引いたが、3 つすべての分を足し戻していない
          - 3 つすべての分を足すのではなく引いている
          - どれも使わない人の割合を答えている
          - 正解
        explanation: |
          **方針** 3 つの事象の和の確率は、包除原理で求める。

          **途中式** $50+40+30-20-10-10+5=85$%。

          **答え** 85%

          **間違えやすい点** 2 つずつの重なりを引くと、3 つすべてに入る人を引きすぎるので、その分を 1 回足し戻す。
      - id: s13p06b
        chapter: 8
        terms: [expectation-variance-properties]
        topic: 共分散の1次変換の性質で定数を足しても変わらず係数の積が掛かることを使う
        level: 基本
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$ の共分散は 3 である。$U=2X+1$、$V=-Y+4$ の共分散 $\mathrm{Cov}(U,V)$ を求めよ。
        choices:
          - "−6"
          - "6"
          - "3"
          - "12"
          - "−2"
        answer: 0
        distractors:
          - 正解
          - −1 を掛けたことによる符号の変化を考えていない
          - 1 次変換で共分散は変わらないと考えている
          - 分散のように係数を 2 乗している
          - 定数 4 を足している（定数は共分散に影響しない）
        explanation: |
          **方針** $\mathrm{Cov}(aX+b,\ cY+d)=ac\,\mathrm{Cov}(X,Y)$。

          **途中式** $2\times(-1)\times 3=-6$。

          **答え** −6

          **間違えやすい点** 定数を足しても共分散は変わらない。係数の符号はそのまま積に入る。
      - id: s13p06c
        chapter: 8
        terms: [cumulative-distribution-function, probability-mass-and-density-function]
        topic: 累積分布関数xの3乗の連続型確率変数の中央値をF(m)＝0.5から求める
        level: 標準
        definition: false
        type: choice
        question: |
          連続型の確率変数 $X$ の累積分布関数は、$0\le x\le 1$ で $F(x)=x^3$（$x<0$ で 0、$x>1$ で 1）である。$X$ の中央値として最も近いものはどれか。ただし $0.5^{1/3}\approx 0.794$ とする。
        choices:
          - "0.5"
          - "0.125"
          - "0.75"
          - 約 0.71
          - 約 0.79
        answer: 4
        distractors:
          - 区間 0〜1 の真ん中を答えている
          - F(0.5) の値を答えている
          - 期待値 E[X] ＝ 3/4 を答えている
          - F(x) ＝ x² のときの中央値（√0.5）を答えている
          - 正解
        explanation: |
          **方針** 中央値 $m$ は $F(m)=0.5$ を満たす値。

          **途中式** $m^3=0.5$ より $m=0.5^{1/3}\approx 0.79$。

          **答え** 約 0.79

          **間違えやすい点** 密度 $f(x)=3x^2$ は右ほど大きいので、中央値は真ん中の 0.5 より右にくる。
  - id: s13p07
    title: 確率分布の母数
    context: |
      確率分布の期待値・分散・確率を使う。標準正規分布の上側確率は $P(Z>1)=0.1587$、$P(Z>2)=0.0228$ とする。
    items:
      - id: s13p07a
        chapter: 9
        terms: [binomial-distribution]
        topic: 二項分布の期待値12と分散4.8から試行回数と成功確率を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          二項分布 $B(n,\ p)$ にしたがう確率変数の期待値は 12、分散は 4.8 だった。$n$ と $p$ の組合せとして正しいものはどれか。
        choices:
          - n ＝ 30、p ＝ 0.4
          - n ＝ 12、p ＝ 0.4
          - n ＝ 20、p ＝ 0.4
          - n ＝ 20、p ＝ 0.6
          - n ＝ 24、p ＝ 0.5
        answer: 3
        distractors:
          - 分散 ÷ 期待値 ＝ 0.4 を p としている（0.4 は 1 − p）
          - 期待値を n、分散 ÷ 期待値を p としている
          - n は正しいが、p と 1 − p を取り違えている
          - 正解
          - p ＝ 0.5 と決めつけている（分散は 6 になってしまう）
        explanation: |
          **方針** 期待値 $np=12$、分散 $np(1-p)=4.8$。

          **途中式** 割ると $1-p=4.8/12=0.4$ なので $p=0.6$、$n=12/0.6=20$。

          **答え** $n=20$、$p=0.6$

          **間違えやすい点** 分散 ÷ 期待値は $1-p$ で、$p$ ではない。求めた $n$、$p$ で期待値と分散を計算し直して確かめる。
      - id: s13p07b
        chapter: 9
        terms: [exponential-distribution]
        topic: 平均5日の指数分布の標準偏差が平均と等しく5日であることをポアソン分布の分散と区別して答える
        level: 基本
        definition: false
        type: choice
        question: |
          ある機械の故障から次の故障までの時間は、平均 5 日の指数分布にしたがう。この時間の標準偏差はいくらか。
        choices:
          - 約 2.24 日
          - 2.5 日
          - 0.2 日
          - 5 日
          - 25 日
        answer: 3
        distractors:
          - 分散が平均に等しいポアソン分布と取り違えている（√5）
          - 平均の半分としている
          - レート（1 日あたり 0.2 回）を答えている
          - 正解
          - 分散を答えている
        explanation: |
          **方針** 平均 $\mu$ の指数分布の分散は $\mu^2$。

          **途中式** 分散は $5^2=25$、標準偏差は 5 日。

          **答え** 5 日

          **間違えやすい点** 指数分布では標準偏差と平均が等しい。分散が平均に等しいのはポアソン分布。
      - id: s13p07c
        chapter: 9
        terms: [normal-distribution, standard-score]
        topic: 正規分布で平均より標準偏差2個分以上大きい人数の期待値を上側確率から求める
        level: 基本
        definition: false
        type: choice
        question: |
          1000 人の受験者の得点が、平均 50・標準偏差 10 の正規分布にしたがうとする。70 点以上の人数はおよそ何人と見込まれるか。
        choices:
          - 約 23 人
          - 約 46 人
          - 約 159 人
          - 約 977 人
          - 50 人
        answer: 0
        distractors:
          - 正解
          - 30 点以下の人も含めた両側の人数にしている
          - 60 点以上（標準偏差 1 個分）の人数を求めている
          - 70 点未満の人数を求めている
          - 根拠なく 5% としている
        explanation: |
          **方針** 70 点は $z=(70-50)/10=2$。

          **途中式** $P(Z\ge 2)=0.0228$ なので、$1000\times 0.0228\approx 23$ 人。

          **答え** 約 23 人

          **間違えやすい点** 偏差値 70 以上は上位約 2.3%。標準偏差 2 個分の外は、両側を合わせて約 4.6%。
  - id: s13p08
    title: 統計量の分布
    context: |
      統計量がしたがう分布を考える。標準正規分布の上側確率は、$P(Z>1.01)=0.1562$、$P(Z>1.43)=0.0764$、$P(Z>2.00)=0.0228$ とする。
    items:
      - id: s13p08a
        chapter: 10
        terms: [sampling-distribution-of-mean, two-sample-proportion-test]
        topic: 2つの群の標本比率の差の分布の標準偏差を分散の和から求め母比率の高い群の標本比率が低い群を下回る確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          A 地区の母比率は 0.5、B 地区の母比率は 0.4 である。それぞれから独立に 100 人ずつ選ぶとき、A 地区の標本比率が B 地区の標本比率を下回る確率を正規近似で求めよ。
        choices:
          - 約 0.023
          - 約 0.156
          - 約 0.153
          - 約 0.076
          - 約 0.924
        answer: 3
        distractors:
          - A 地区の標準偏差 0.05 だけを使っている
          - 2 つの標準偏差を足している（分散を足してから平方根をとる）
          - 両側の確率にしている
          - 正解
          - A 地区が B 地区以上になる確率を答えている
        explanation: |
          **方針** 差 $\hat p_A-\hat p_B$ は近似的に正規分布にしたがい、平均 0.1、分散 $\dfrac{0.5\times 0.5}{100}+\dfrac{0.4\times 0.6}{100}=0.0049$。

          **途中式** 標準偏差は 0.07。$P(\hat p_A-\hat p_B<0)=P\left(Z<\dfrac{0-0.1}{0.07}\right)=P(Z<-1.43)=0.0764$。

          **答え** 約 0.076

          **間違えやすい点** 独立な 2 つの量の差の分散は、分散の和。標準偏差どうしを足してはいけない。
      - id: s13p08b
        chapter: 10
        terms: [chi-squared-distribution, standard-normal-distribution]
        topic: 標準正規分布の2乗が自由度1のカイ二乗分布にしたがうことからZの2乗が3.84を超える確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $Z$ は標準正規分布にしたがう。$P(Z^2>3.84)$ を求めよ（$3.84=1.96^2$）。
        choices:
          - "0.025"
          - "0.95"
          - "0.10"
          - "0.05"
          - "0.01"
        answer: 3
        distractors:
          - Z > 1.96 の片側だけを考えている
          - Z² が 3.84 以下の確率を答えている
          - 有意水準 10% の両側の確率と取り違えている
          - 正解
          - 根拠のない値
        explanation: |
          **方針** $Z^2>3.84$ は $|Z|>1.96$ と同じ。$Z^2$ は自由度 1 のカイ二乗分布にしたがう。

          **途中式** $P(|Z|>1.96)=0.025+0.025=0.05$。

          **答え** 0.05

          **間違えやすい点** 自由度 1 のカイ二乗分布の上側 5% 点 3.84 は、標準正規分布の両側 5% 点 1.96 の 2 乗。
      - id: s13p08c
        chapter: 10
        terms: [chi-squared-distribution]
        topic: カイ二乗分布は自由度が大きくなるほど中心が右に移り左右対称に近づくことを答える
        level: 基本
        definition: true
        type: choice
        question: |
          カイ二乗分布の形と自由度の関係として、正しいものはどれか。
        choices:
          - 自由度が大きくなるほど、分布の中心は右に移り、左右対称に近づく
          - 自由度によらず、左右対称な分布である
          - 自由度が大きくなるほど、分布の中心は左に移る
          - 自由度が大きくなるほど、右に長い裾がさらに長くなる
          - 負の値もとる分布である
        answer: 0
        distractors:
          - 正解
          - 正の値だけをとり、右に裾の長い分布で、対称ではない
          - 期待値が自由度に等しいので、右に移る
          - 自由度が大きいほど、正規分布に近い対称な形になる
          - 2 乗の和なので、負の値はとらない
        explanation: |
          **方針** 自由度 $k$ のカイ二乗分布は、期待値 $k$、分散 $2k$ で、0 以上の値をとる。

          **途中式** $k$ が大きいと中心（期待値）は右に移り、中心極限定理により正規分布に近い対称な形になる。

          **答え** 中心は右に移り、左右対称に近づく

          **間違えやすい点** 自由度が小さいときは右に裾が長く、0 の近くに山がある（自由度 1・2 では 0 に近いほど高い）。
  - id: s13p09
    title: 推定の性質と区間
    context: |
      推定量の性質や信頼区間を考える。
    items:
      - id: s13p09a
        chapter: 11
        terms: [unbiased-estimator, uniform-distribution]
        topic: 0からθの一様分布の上限θを標本の最大値で推定すると小さめに偏ることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          0 から $\theta$ の連続一様分布から大きさ $n$ の標本をとり、標本の最大値 $M$ で $\theta$ を推定する。この推定量について正しいものはどれか。ただし $E[M]=\dfrac{n}{n+1}\theta$ である。
        choices:
          - M は θ の不偏推定量である
          - M は大きめに偏るので、n/(n ＋ 1) 倍すると不偏推定量になる
          - M は n を大きくしても θ に近づかない
          - 偏りをなくすには、M を 2 倍すればよい
          - M はいつも θ 以下なので小さめに偏る。(n ＋ 1)/n 倍すると不偏推定量になる
        answer: 4
        distractors:
          - 期待値は nθ/(n ＋ 1) で、θ より小さい
          - 最大値は θ を超えないので、大きめには偏らない
          - n を大きくすると最大値は θ に近づく（一致推定量）
          - 2 倍するのは標本平均で推定するとき（E[X̄] ＝ θ/2）
          - 正解
        explanation: |
          **方針** 期待値と $\theta$ を比べる。

          **途中式** $E[M]=\dfrac{n}{n+1}\theta<\theta$ なので小さめに偏る。$E\left[\dfrac{n+1}{n}M\right]=\theta$ で不偏になる。$n\to\infty$ で $E[M]\to\theta$。

          **答え** 小さめに偏り、$(n+1)/n$ 倍すると不偏

          **間違えやすい点** 標本の最大値は母集団の上限を超えないので、上限の推定には小さめの偏りが出る。偏りがあっても一致推定量にはなる。
      - id: s13p09b
        chapter: 11
        terms: [ci-proportion, required-sample-size]
        topic: 母比率の95パーセント信頼区間の幅の半分と標本比率から調査した人数を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある調査の報告に「賛成は 30%、95% 信頼区間は 25.5%〜34.5%」とあった。調べた人数はおよそ何人か。
        choices:
          - 約 100 人
          - 約 400 人
          - 約 280 人
          - 約 1600 人
          - 約 20 人
        answer: 1
        distractors:
          - 1.96 を掛け忘れて、幅の半分を標準誤差としている
          - 正解
          - 90% 信頼区間の 1.645 を使っている
          - 区間全体の幅 9 ポイントの半分ではなく、さらに半分の 0.0225 を幅の半分にしている
          - n ではなく √n を答えている
        explanation: |
          **方針** 幅の半分は $0.345-0.30=0.045$ で、$1.96\sqrt{\dfrac{0.3\times 0.7}{n}}=0.045$。

          **途中式** $n=0.21\times\left(\dfrac{1.96}{0.045}\right)^2\approx 398$ なので、約 400 人。

          **答え** 約 400 人

          **間違えやすい点** 報告された区間から、幅の半分 → 標準誤差 → 人数の順に逆にたどる。
      - id: s13p09c
        chapter: 11
        terms: [standard-error, confidence-interval]
        topic: 個々の値が散らばる範囲を表す標準偏差と母平均の信頼区間に使う標準誤差を区別して2つの範囲の意味を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          100 人の通勤時間の平均は 40 分、標準偏差（不偏分散の平方根）は 15 分だった。「$40\pm 1.96\times 15$」と「$40\pm 1.96\times 1.5$」の 2 つの範囲について、正しいものはどれか。
        choices:
          - 前者は個々の人の通勤時間がおよそ 95% 入る範囲の目安、後者は母平均の 95% 信頼区間
          - 前者は母平均の 95% 信頼区間、後者は個々の人の通勤時間がおよそ 95% 入る範囲
          - どちらも母平均の 95% 信頼区間で、前者のほうが正確である
          - どちらも個々の人の通勤時間の範囲で、後者は計算の誤りである
          - 2 つの範囲は同じ意味で、どちらを使ってもよい
        answer: 0
        distractors:
          - 正解
          - 2 つの意味を逆にしている（母平均の区間には標準誤差 15/√100 ＝ 1.5 を使う）
          - 母平均の区間に標準偏差 15 を使うと、広すぎる
          - 1.5 は標本平均の標準誤差で、母平均の区間に使う
          - 散らばりの対象（個々の値と標本平均）が違うので、意味も幅も違う
        explanation: |
          **方針** 標準偏差は個々の値の散らばり、標準誤差 $s/\sqrt n$ は標本平均の散らばり。

          **途中式** 標準誤差は $15/\sqrt{100}=1.5$。$40\pm 1.96\times 1.5\approx(37.1,\ 42.9)$ は母平均の信頼区間。$40\pm 1.96\times 15\approx(10.6,\ 69.4)$ は、分布が正規分布に近ければ、個々の人のおよそ 95% が入る範囲の目安。

          **答え** 前者は個々の値の範囲、後者は母平均の信頼区間

          **間違えやすい点** 標本を大きくすると標準誤差は小さくなるが、個々の値の散らばり（標準偏差）は小さくならない。
      - id: s13p09d
        chapter: 11
        terms: [confidence-interval, confidence-coefficient]
        topic: 同じデータから作った90パーセント信頼区間は95パーセント信頼区間に含まれることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          同じデータから、母平均の 90% 信頼区間と 95% 信頼区間を作った（中心は同じ）。2 つの区間の関係として正しいものはどれか。
        choices:
          - 95% 信頼区間は、90% 信頼区間の内側に含まれる
          - 2 つの区間は同じ幅になる
          - 90% 信頼区間は、95% 信頼区間の内側に含まれる
          - 2 つの区間は重ならない
          - どちらが広いかは、データによって変わる
        answer: 2
        distractors:
          - 信頼係数が大きいほど区間は広い
          - 係数（1.645 と 1.96）が違うので幅は違う
          - 正解
          - 中心が同じなので、必ず重なる
          - 同じデータなら、信頼係数の大きいほうがいつも広い
        explanation: |
          **方針** 区間は「中心 ± 係数 × 標準誤差」。

          **途中式** 90% は 1.645、95% は 1.96 で、95% のほうが広い。中心が同じなので、90% の区間は 95% の区間の内側にある。

          **答え** 90% 信頼区間は 95% 信頼区間の内側に含まれる

          **間違えやすい点** 信頼係数を上げると、母数を含む確率は上がるが区間は広くなる。
  - id: s13p10
    title: 検定の解釈
    context: |
      仮説検定の結果を正しく読み取る。標準正規分布の上側確率は $P(Z>-0.355)=0.639$、$P(Z>-0.04)=0.516$ とする。
    items:
      - id: s13p10a
        chapter: 12
        terms: [proportion-test, p-value, binomial-distribution]
        topic: 20回中15回成功のデータで母比率0.5の右片側検定の正確なp値を二項分布の上側の確率として求める
        level: 標準
        definition: false
        type: choice
        question: |
          新しい方法で 20 回試したところ 15 回成功した。帰無仮説「成功の確率は 0.5」、対立仮説「0.5 より大きい」の検定の p 値を、二項分布で正確に求めよ。ただし $B(20,\ 0.5)$ で $P(X=15)=0.0148$、$P(X\ge 16)=0.0059$ とする。
        choices:
          - 約 0.015
          - 約 0.041
          - 約 0.021
          - 約 0.006
          - "0.75"
        answer: 2
        distractors:
          - 15 回ちょうどの確率だけを求めている（15 回以上の確率が p 値）
          - 両側の p 値にしている（対立仮説は片側）
          - 正解
          - 16 回以上の確率で、観測した 15 回を含めていない
          - 成功の割合（標本比率）を答えている
        explanation: |
          **方針** p 値は、帰無仮説のもとで観測値以上に極端な結果が出る確率。右片側なので $P(X\ge 15)$。

          **途中式** $P(X\ge 15)=P(X=15)+P(X\ge 16)=0.0148+0.0059=0.0207$。

          **答え** 約 0.021

          **間違えやすい点** 「観測した値と、それより極端な値」の確率を足す。観測値そのものも含める。
      - id: s13p10b
        chapter: 12
        terms: [null-and-alternative-hypothesis, type-i-and-ii-errors]
        topic: 帰無仮説が棄却されなかったことは帰無仮説が正しいことの証明ではないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある工場で、新しい機械の不良率が従来の機械と違うかを検定したところ、有意水準 5% で有意にならなかった。正しい解釈はどれか。
        choices:
          - 不良率に差があるとはいえないが、差がないことが示されたわけではない
          - 2 つの機械の不良率は等しいことが示された
          - 2 つの機械の不良率が等しい確率は 95% である
          - 新しい機械の不良率のほうが低いことが示された
          - 検定の計算が誤っている
        answer: 0
        distractors:
          - 正解
          - 標本が小さいと、本当は差があっても有意にならない（第 2 種の過誤）
          - 有意水準の意味を取り違えている
          - 有意でなかったので、向きについても何もいえない
          - 有意にならないことはよくあり、計算の誤りとは限らない
        explanation: |
          **方針** 検定で強くいえるのは、帰無仮説を棄却したときだけ。

          **途中式** 棄却されなかったのは「差がある証拠が十分でない」ということで、差がないことの証明ではない。

          **答え** 差があるとはいえないが、差がないことが示されたわけではない

          **間違えやすい点** 差がないことを示したいときは、信頼区間を見て差が実質的に小さいと言えるかを確かめる。
      - id: s13p10c
        chapter: 12
        terms: [p-value, significance-level]
        topic: 非常に大きな標本では実質的に意味のない小さな差でも有意になることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          10 万人ずつのデータで、2 つの地域の平均点を比べたところ、差は 0.3 点（満点 100 点、標準偏差はどちらも約 15 点）で、p 値は 0.001 未満だった。この結果の解釈として最も適切なものはどれか。
        choices:
          - p 値が非常に小さいので、2 つの地域の学力には大きな差がある
          - 差が 0.3 点しかないので、検定の計算が誤っている
          - 統計的には有意だが、標本が非常に大きいので小さな差でも有意になる。0.3 点の差が実質的に意味があるかは別に考える
          - p 値が 0.001 未満なので、差は 99.9% 以上の確率で正しい
          - 有意になったので、差の原因は地域にある
        answer: 2
        distractors:
          - p 値の小ささは差の大きさを表さない
          - 標本が大きいと、小さな差でも有意になる
          - 正解
          - p 値の意味を取り違えている
          - 観察データで、原因までは言えない
        explanation: |
          **方針** 検定統計量は「差 ÷ 標準誤差」で、標準誤差は $\sqrt n$ に反比例して小さくなる。

          **途中式** 差の標準誤差は $15\sqrt{\dfrac{1}{100000}+\dfrac{1}{100000}}\approx 0.067$ 点と非常に小さいので、0.3 点の差でも $z\approx 4.5$ になり、p 値は 0.001 よりずっと小さくなる。

          **答え** 有意だが、差が実質的に意味があるかは別に考える

          **間違えやすい点** 結果を報告するときは、p 値だけでなく、差の大きさとその信頼区間も示す。
      - id: s13p10d
        chapter: 12
        terms: [power-function, one-sided-two-sided-test]
        topic: 本当の差が右側にあるとき同じ有意水準の右片側検定は両側検定より検出力が高いことを計算で確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          母分散既知の母平均の z 検定で、本当の母平均は帰無仮説の値より標準誤差 2 個分大きい。有意水準 5% の右片側検定（境目 1.645）と両側検定（境目 ±1.96）の検出力の組合せとして最も適切なものはどれか。
        choices:
          - 右片側 約 0.52、両側 約 0.64
          - 右片側 約 0.64、両側 約 0.52
          - どちらも 約 0.64
          - 右片側 約 0.95、両側 約 0.975
          - 右片側 約 0.05、両側 約 0.05
        answer: 1
        distractors:
          - 片側と両側を入れかえている（境目の小さい片側のほうが棄却しやすい）
          - 正解
          - 境目が違うので、検出力も違う
          - 1 − 有意水準 と取り違えている
          - 帰無仮説が正しいときの棄却の確率（有意水準）と取り違えている
        explanation: |
          **方針** 本当の分布では、統計量は平均 2・標準偏差 1 の正規分布にしたがう。

          **途中式** 右片側：$P(Z'>1.645)=P(Z>1.645-2)=P(Z>-0.355)\approx 0.64$。両側：$P(Z'>1.96)+P(Z'<-1.96)\approx P(Z>-0.04)\approx 0.52$（左側の分はほぼ 0）。

          **答え** 右片側 約 0.64、両側 約 0.52

          **間違えやすい点** 向きが正しければ片側検定のほうが検出力は高いが、逆向きの差はまったく検出できない。向きはデータを見る前に決める。
  - id: s13p11
    title: カイ二乗検定の計算の注意
    context: |
      クロス表のカイ二乗検定を正しく行う。
    items:
      - id: s13p11a
        chapter: 13
        terms: [independence-test, pearson-chi-square-statistic]
        topic: 独立性のカイ二乗統計量を度数ではなくパーセントで計算すると値が変わり結論を誤ることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          200 人のクロス表で独立性の検定を行うとき、度数の代わりに、全体を 100 としたパーセントの表でカイ二乗統計量を計算した。正しいものはどれか。
        choices:
          - 統計量は人数に比例するので、パーセントで計算すると度数のときの半分の値になり、結論を誤ることがある
          - パーセントでも度数でも、統計量は同じ値になる
          - パーセントで計算すると、統計量は 2 倍になる
          - パーセントで計算すると、自由度が変わる
          - パーセントのほうが、比べやすいので正しい
        answer: 0
        distractors:
          - 正解
          - 割合が同じでも、人数が違えば統計量は違う
          - 200 人を 100 にするので、統計量は 100/200 倍になる
          - 自由度は表の行と列の数で決まる
          - カイ二乗統計量は度数で計算する必要がある
        explanation: |
          **方針** カイ二乗統計量 $\sum\dfrac{(O-E)^2}{E}$ は、すべての度数を $k$ 倍すると $k$ 倍になる。

          **途中式** パーセントの表は度数を $100/200=0.5$ 倍したもの。統計量も 0.5 倍になり、本当は有意でも有意でないと判断してしまうことがある。

          **答え** 度数のときの半分の値になり、結論を誤ることがある

          **間違えやすい点** 割合は比べるための表、検定は度数（人数）の表で行う。
      - id: s13p11b
        chapter: 13
        terms: [expected-frequency, independence-test]
        topic: 独立性の検定の期待度数の各行の合計が観測度数の各行の合計に等しいことを答える
        level: 基本
        definition: false
        type: choice
        question: |
          クロス表の独立性の検定で、期待度数の表を作った。期待度数の表について正しいものはどれか。
        choices:
          - すべてのセルの期待度数は等しい
          - 期待度数は整数でなければならない
          - 各行の合計と各列の合計は、観測度数の表の行の合計・列の合計と等しい
          - 期待度数の合計は、観測度数の合計より大きい
          - 期待度数は、観測度数を 2 倍したものである
        answer: 2
        distractors:
          - セルごとに（行の合計 × 列の合計）÷ 総数で、ふつう等しくない
          - 期待度数は割り算で求めるので、小数になってよい
          - 正解
          - 合計は総数で等しい
          - 根拠のない求め方
        explanation: |
          **方針** 期待度数は（行の合計）×（列の合計）÷（総数）。

          **途中式** ある行の期待度数を足すと、（行の合計）×（列の合計の和）÷ 総数 ＝（行の合計）。列についても同じ。

          **答え** 行と列の合計は、観測度数と等しい

          **間違えやすい点** 期待度数は「行と列の合計を変えずに、独立なら期待される度数」。小数になってもそのまま使う。
  - id: s13p12
    title: 回帰分析の評価
    context: |
      回帰分析の結果を読み取り、評価する。
    items:
      - id: s13p12a
        chapter: 14
        terms: [simple-regression, regression-output]
        topic: 身長から体重を予測する回帰の切片は身長0の体重でデータの範囲の外なのでそれ自体に意味がないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          成人 100 人のデータ（身長はおよそ 150〜190 cm）で、身長 $x$（cm）から体重 $y$（kg）を予測する回帰直線 $\hat y=-60+0.75x$ を得た。切片 −60 の解釈として最も適切なものはどれか。
        choices:
          - 身長が 1 cm 増えると、体重は 60 kg 減る
          - 体重の平均は −60 kg である
          - 切片が負なので、身長と体重には負の相関がある
          - 切片が負なので、この回帰分析は誤りである
          - 身長 0 cm の人の体重の予測値にあたるが、データの範囲から大きく外れているので、それ自体には意味がない
        answer: 4
        distractors:
          - 傾きと切片を取り違えている（傾き 0.75 は 1 cm あたり 0.75 kg 増える）
          - 切片は x ＝ 0 のときの予測値で、y の平均ではない
          - 相関の向きは傾きの符号で決まる（傾きは正）
          - 切片は直線の位置を決めるための値で、負になってもよい
          - 正解
        explanation: |
          **方針** 切片は $x=0$ のときの予測値。

          **途中式** 身長 0 cm はデータ（150〜190 cm）の範囲から大きく外れている。切片は、データの範囲で直線の高さを合わせるための値で、それ自体を解釈しない。

          **答え** 身長 0 cm の体重にあたるが、それ自体には意味がない

          **間違えやすい点** データの範囲の外での予測（外挿）は当てにならない。切片を意味のある値にしたいときは、$x$ から平均を引いてから回帰する（切片が平均身長での予測値になる）。
      - id: s13p12b
        chapter: 14
        terms: [regression-coefficient-t-test, standard-error]
        topic: 傾きと残差の散らばりと説明変数の散らばりが同じでデータを4倍にすると傾きのt値がおよそ2倍になることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          ある単回帰分析で、傾きの t 値は 1.5 で有意ではなかった。同じような条件（傾き・残差の散らばり・説明変数の散らばりが同じ）でデータの数を 4 倍に増やすと、傾きの t 値はおよそどうなるか。
        choices:
          - 約 6.0（約 4 倍）になる
          - 1.5 のまま変わらない
          - 約 3.0（約 2 倍）になる
          - 約 0.75（約 半分）になる
          - 約 2.1（約 √2 倍）になる
        answer: 2
        distractors:
          - 標準誤差は n ではなく √n に反比例する
          - 標準誤差が小さくなるので、t 値は大きくなる
          - 正解
          - データを増やすと標準誤差は小さくなり、t 値は大きくなる
          - 4 倍の平方根は 2 で、√2 ではない
        explanation: |
          **方針** 傾きの標準誤差は $\dfrac{s}{\sqrt{S_{xx}}}$ で、$S_{xx}$ はデータの数にほぼ比例する。

          **途中式** データを 4 倍にすると $S_{xx}$ は約 4 倍、標準誤差は約 1/2 倍。傾きが同じなら t 値は約 2 倍の 3.0。

          **答え** 約 3.0 になる

          **間違えやすい点** 有意でなかった効果も、データを増やすと有意になることがある。有意かどうかは効果の大きさだけでなくデータの数にもよる。
      - id: s13p12c
        chapter: 14
        terms: [multiple-regression-model, multicollinearity]
        topic: 2つの説明変数の相関が0なら重回帰の偏回帰係数がそれぞれの単回帰の傾きと等しくなることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの説明変数 $x_1$、$x_2$ の標本相関係数がちょうど 0 のデータで、$y$ を $x_1$ と $x_2$ で説明する重回帰を行った。$x_1$ の偏回帰係数について正しいものはどれか。
        choices:
          - y を x₁ だけで説明する単回帰の傾きより必ず大きくなる
          - y を x₁ だけで説明する単回帰の傾きと等しくなる
          - 0 になる
          - x₂ の係数と必ず等しくなる
          - 説明変数どうしの相関が 0 なので、重回帰は計算できない
        answer: 1
        distractors:
          - 説明変数どうしの相関が 0 なら、x₂ を加えても x₁ の係数は変わらない
          - 正解
          - 0 になる理由はない
          - 2 つの係数は、それぞれと y の関係で決まる
          - 相関が 0 は、むしろ計算が安定する場合（多重共線性の反対）
        explanation: |
          **方針** 偏回帰係数は「ほかの説明変数を一定にしたときの効果」。ほかの説明変数と相関がなければ、一定にしてもしなくても同じになる。

          **途中式** $x_1$ と $x_2$ が無相関なら、$x_2$ を加えても $x_1$ の効果の推定は変わらず、偏回帰係数は単回帰の傾きと一致する。

          **答え** 単回帰の傾きと等しくなる

          **間違えやすい点** 説明変数どうしに相関があるときは、単回帰と重回帰の係数が違い、符号が逆になることもある。
  - id: s13p13
    title: 分散分析と要因の効果
    context: |
      実験の結果を分散分析で調べる。
    items:
      - id: s13p13a
        chapter: 15
        terms: [fisher-three-principles, counting]
        topic: 6つの区画に2つの処理を3区画ずつ無作為に割り付ける方法の数を組合せで求める
        level: 標準
        definition: false
        type: choice
        question: |
          6 つの区画に、肥料 A と肥料 B を 3 区画ずつ、すべての割り付け方が同じ確率になるように無作為に割り付ける。割り付け方は全部で何通りあるか。
        choices:
          - 720 通り
          - 20 通り
          - 120 通り
          - 64 通り
          - 6 通り
        answer: 1
        distractors:
          - 6 区画の並べ方 6! を数えている（同じ肥料の区画どうしの並びは区別しない）
          - 正解
          - 3 区画の順番を区別して 6 × 5 × 4 と数えている
          - 各区画に A か B を自由に選ぶ 2⁶ を数えている（3 区画ずつの条件を満たさないものも入る）
          - 区画の数をそのまま答えている
        explanation: |
          **方針** 6 区画から肥料 A を使う 3 区画を選べば、残りは B に決まる。

          **途中式** $\binom63=\dfrac{6\times 5\times 4}{3\times 2\times 1}=20$ 通り。

          **答え** 20 通り

          **間違えやすい点** 実際には、20 通りに番号を付けて乱数で 1 つ選ぶか、区画に番号を付けて乱数で 3 つ選ぶ。どちらも、どの割り付け方も同じ確率になる。
      - id: s13p13b
        chapter: 15
        terms: [main-effect-and-interaction]
        topic: 2要因の組合せの平均の表から要因Aの主効果を水準ごとの平均の差として求め交互作用がないことも読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          温度（A1・A2）と時間（B1・B2）の組合せでの製品の強度の平均は、A1B1 ＝ 20、A1B2 ＝ 30、A2B1 ＝ 26、A2B2 ＝ 36 だった。温度の主効果（A2 での平均 − A1 での平均）を求めよ。
        choices:
          - "6"
          - "10"
          - "0"
          - "16"
          - "12"
        answer: 0
        distractors:
          - 正解
          - 時間の主効果を求めている
          - 交互作用の大きさを求めている
          - A2B2 と A1B1 の差を求めている（時間の効果も含んでしまう）
          - B1 と B2 での差 6 と 6 を足している（平均する）
        explanation: |
          **方針** A2 の平均と A1 の平均を、B について平均してから比べる。

          **途中式** A1 の平均 $(20+30)/2=25$、A2 の平均 $(26+36)/2=31$。主効果は $31-25=6$。

          **答え** 6

          **間違えやすい点** B1 でも B2 でも A の効果は 6 で同じなので、交互作用はない（折れ線が平行）。
