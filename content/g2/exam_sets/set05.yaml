set: 5
title: 2級 模擬試験 第5回
minutes: 90
problems:
  - id: s05p01
    title: 市民アンケートと通勤時間
    context: |
      ある市の市民について調べる。
    items:
      - id: s05p01a
        chapter: 1
        terms: [bar-pie-band-chart, data-types]
        topic: 円グラフの扇形の中心角と回答者の総数から賛成した人数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          200 人へのアンケートの結果を円グラフにしたところ、「賛成」の扇形の中心角は 126° だった。賛成した人は何人か。
        choices:
          - 126 人
          - 63 人
          - 70 人
          - 35 人
          - 56 人
        answer: 2
        distractors:
          - 中心角の数値をそのまま人数とした
          - 中心角を 2 で割った
          - 正解
          - 割合（35%）を人数とした
          - 中心角を 360 ではなく 450 で割った（割合を 28% とした）
        explanation: |
          **方針** 割合 ＝ 中心角 ÷ 360°、人数 ＝ 割合 × 全体の人数。

          **途中式** $126/360=0.35$、$0.35\times 200=70$ 人

          **答え** 70 人

          **間違えやすい点** 円グラフは 1 つの全体の内訳を表す。人数を知るには全体の人数が必要。
      - id: s05p01b
        chapter: 2
        terms: [sample-variance-sd, frequency-distribution-histogram]
        topic: 度数分布表から階級値を使って平均と標準偏差の近似値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          20 人の通勤時間を度数分布表にまとめた。階級値を使って求めた標準偏差（偏差平方和を $n-1$ で割った分散の平方根）に最も近いものはどれか。

          | 通勤時間（分） | 0〜10 | 10〜20 | 20〜30 | 30〜40 |
          |---|---|---|---|---|
          | 人数 | 4 | 6 | 8 | 2 |
        choices:
          - '9.17'
          - '88.42'
          - '12.91'
          - '20.49'
          - '9.40'
        answer: 4
        distractors:
          - $n$ で割った
          - 分散を答えた（平方根をとっていない）
          - 人数を考えず、4 つの階級値だけの標準偏差を求めた
          - 偏差平方和を階級の数 4 で割った
          - 正解
        explanation: |
          **方針** 階級値 5, 15, 25, 35 に度数の重みを付けて、平均と偏差平方和を求める。

          **途中式**
          - 平均：$(5\times 4+15\times 6+25\times 8+35\times 2)/20=380/20=19$
          - 偏差平方和：$4\times 14^2+6\times 4^2+8\times 6^2+2\times 16^2=784+96+288+512=1680$
          - 標準偏差：$\sqrt{1680/19}\approx\sqrt{88.42}\approx 9.40$

          **答え** 9.40

          **間違えやすい点** 偏差の 2 乗に度数を掛けるのを忘れない。階級値で代用しているので近似値になる。
      - id: s05p01c
        chapter: 2
        terms: [standard-score, quartiles-iqr, mean-median-mode]
        topic: 全員の得点に同じ点数を加えたときに変わらない要約統計量を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          あるテストで、採点の誤りがあったため全員の得点に 5 点を加えた。次の統計量のうち、加える前と変わらないものの組合せはどれか。
        choices:
          - 平均値と中央値
          - 平均値と標準偏差
          - 中央値と四分位範囲
          - すべての統計量が変わらない
          - 標準偏差と四分位範囲
        answer: 4
        distractors:
          - 平均値と中央値は 5 点増える
          - 平均値は 5 点増える
          - 中央値は 5 点増える
          - 位置を表す統計量（平均値・中央値など）は変わる
          - 正解
        explanation: |
          **方針** 全員に同じ数を足すと分布が平行移動する。位置の指標は変わり、散らばりの指標は変わらない。

          **途中式** 平均値・中央値・最頻値・四分位数 → 5 点増える。標準偏差・分散・範囲・四分位範囲 → 変わらない。

          **答え** 標準偏差と四分位範囲

          **間違えやすい点** 全員の得点を 2 倍した場合は、散らばりの指標も 2 倍（分散は 4 倍）になる。
  - id: s05p02
    title: 相関と回帰の読み取り
    context: |
      2 つの変数の関係について考える。
    items:
      - id: s05p02a
        chapter: 3
        terms: [spurious-correlation, stratified-scatter]
        topic: 小学生の足の大きさと漢字の得点の相関が学年で層別すると消えることから見かけの相関と判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある小学校の全校児童について、足の大きさと漢字テストの得点に強い正の相関が見られた。しかし、学年ごとに分けて調べると、どの学年でも相関はほとんどなかった。この結果の解釈として最も適切なものはどれか。
        choices:
          - 足が大きくなると漢字を覚えやすくなる
          - 学年（年齢）が両方に影響して生じた見かけの相関で、足の大きさが得点の原因ではない
          - 学年ごとの分析が誤っており、全体の相関が正しい
          - 漢字の練習をすると足が大きくなる
          - 相関係数が大きければ、層に分けても必ず同じ相関が見られる
        answer: 1
        distractors:
          - 相関は因果を示さない。層の中では関係がない
          - 正解
          - 層の中で関係が消えることは、第 3 の変数の影響を示している
          - 因果の向きを逆にしても、層の中で関係がないことと合わない
          - 層によって相関は大きく変わりうる
        explanation: |
          **方針** 層別すると相関が消える → 層を表す変数（学年）が 2 つの変数の両方に影響している。

          **途中式** 学年が上がると足も大きくなり、漢字の得点も上がる → 全体では正の相関に見える。

          **答え** 学年が両方に影響した見かけの相関

          **間違えやすい点** このような相関を擬似相関という。学年の影響を除いた偏相関係数を求めると 0 に近くなる。
      - id: s05p02b
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 無相関に近いデータに離れた1点が加わると相関係数が大きく変わることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          10 組のデータの相関係数は 0.1 だったが、ほかの点から大きく離れた右上の 1 点を加えると、相関係数は 0.8 になった。正しい記述はどれか。
        choices:
          - 1 つの離れた点が相関係数を大きく変えることがあるので、散布図で確かめる必要がある
          - 点を加えて相関係数が 0.8 になったので、2 つの変数には強い直線関係がある
          - 相関係数は外れた値の影響を受けない
          - 点を 1 つ加えても、相関係数は 0.1 から変わらないはずなので、計算の誤りである
          - 相関係数が大きくなったので、回帰直線の傾きは必ず 0.8 になる
        answer: 0
        distractors:
          - 正解
          - 残りの 10 点にはほとんど関係がなく、1 点の影響で大きく見えているだけ
          - 相関係数は平均と偏差を使うので、外れた値の影響を強く受ける
          - 離れた 1 点の影響で大きく変わることは十分ありうる
          - 傾きは相関係数と標準偏差の比で決まり、0.8 とは限らない
        explanation: |
          **方針** 相関係数は偏差の積の和を使うので、平均から大きく離れた点の影響が大きい。

          **途中式** 離れた点は $x$ も $y$ も平均から大きく離れ、偏差の積が非常に大きな正の値になる。

          **答え** 散布図で確かめる必要がある

          **間違えやすい点** 相関係数だけで判断せず、散布図で外れた点や曲線的な関係を確かめる。必要なら順位相関係数も見る。
      - id: s05p02c
        chapter: 4
        terms: [simple-regression, coefficient-of-determination]
        topic: 回帰の傾きが負で決定係数が0.49のとき相関係数を符号に注意して求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある単回帰分析で、回帰直線の傾きは負で、決定係数は 0.49 だった。相関係数はいくらか。
        choices:
          - '0.7'
          - '0.49'
          - '−0.49'
          - '−0.7'
          - '0.24'
        answer: 3
        distractors:
          - 傾きが負なのに正の値にした
          - 決定係数をそのまま相関係数とした
          - 決定係数に符号を付けただけ
          - 正解
          - 決定係数を 2 乗した
        explanation: |
          **方針** 単回帰では決定係数 ＝ 相関係数の 2 乗。相関係数の符号は傾きの符号と同じ。

          **途中式** $r^2=0.49$ → $|r|=0.7$、傾きが負なので $r=-0.7$

          **答え** −0.7

          **間違えやすい点** 傾き $b=r\,s_y/s_x$ なので、傾きと相関係数の符号は必ず一致する。
      - id: s05p02d
        chapter: 4
        terms: [simple-regression, residual]
        topic: 6歳から12歳のデータで作った回帰式で40歳の身長を予測する外挿の危険を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          6〜12 歳の子どもの年齢 $x$（歳）と身長 $y$（cm）のデータから、回帰直線 $\hat y=80+6x$ を得た（決定係数 0.95）。この式で 40 歳の人の身長を予測すると 320 cm になる。この予測についての記述として最も適切なものはどれか。
        choices:
          - 決定係数が 0.95 と高いので、40 歳の予測も信頼できる
          - 傾き 6 は 40 歳まで変わらないことが回帰分析で証明されている
          - データの範囲外への予測（外挿）で、直線の関係が続く保証がないので信頼できない
          - 予測値は正しいが、残差が大きくなるだけである
          - 切片 80 は 0 歳の身長なので、40 歳の予測も正しい
        answer: 2
        distractors:
          - 決定係数は、データの範囲内での当てはまりを表すだけ
          - 回帰分析はデータの範囲の外の関係について何も示さない
          - 正解
          - 身長は成長期を過ぎると伸びなくなり、予測そのものが大きく外れる
          - 切片も 6〜12 歳のデータからの外挿で、0 歳の身長を表すとは限らない
        explanation: |
          **方針** 回帰式が使えるのは、基本的にデータの範囲（6〜12 歳）の中。

          **途中式** 身長は成長期を過ぎると伸びが止まるので、直線の関係は大人まで続かない。

          **答え** 外挿なので信頼できない

          **間違えやすい点** 当てはまりが良いこと（決定係数が高いこと）と、範囲外で予測できることは別。
  - id: s05p03
    title: 季節のある売上と指数の接続
    context: |
      時系列のデータを加工する。
    items:
      - id: s05p03a
        chapter: 5
        terms: [moving-average, time-series-components]
        topic: 四半期データの3時点目を中心とする4項中心化移動平均を両端に半分の重みを付けて求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある店の四半期ごとの売上（百万円）は、30, 34, 40, 36, 32, 38, 44, 40 だった。3 時点目（40）を中心とする 4 項中心化移動平均はいくらか。
        choices:
          - '35.00'
          - '35.50'
          - '36.67'
          - '35.25'
          - '40.00'
        answer: 3
        distractors:
          - 1〜4 時点目の単純な 4 項平均（中心が 2.5 時点目にずれている）
          - 2〜5 時点目の単純な 4 項平均（中心が 3.5 時点目にずれている）
          - 2〜4 時点目の 3 項移動平均
          - 正解
          - 3 時点目の値そのもの
        explanation: |
          **方針** 1〜5 時点目を使い、両端に 1/2 の重みを付ける。

          **途中式** $\dfrac14\left(\dfrac{30}{2}+34+40+36+\dfrac{32}{2}\right)=\dfrac{141}{4}=35.25$

          **答え** 35.25

          **間違えやすい点** 項数が偶数の移動平均は、2 つの 4 項平均（35.00 と 35.50）をさらに平均して中心を合わせる。
      - id: s05p03b
        chapter: 5
        terms: [index-number, price-index]
        topic: 基準年の違う2つの指数系列を重なる年でつないで古い基準の指数に換算する
        level: 応用
        definition: false
        type: choice
        question: |
          ある物価指数は、2015 年 ＝ 100 の系列で 2020 年が 110 だった。2020 年以降は 2020 年 ＝ 100 の新しい系列で公表され、2023 年は 108 だった。2023 年の値を 2015 年 ＝ 100 の基準で表すといくらか。
        choices:
          - '118.0'
          - '118.8'
          - '98.2'
          - '108.0'
          - '109.0'
        answer: 1
        distractors:
          - 2 つの指数の上昇分（10 と 8）を足した
          - 正解
          - 新しい指数を古い指数で割った
          - 新しい基準の値をそのまま使った
          - 2 つの指数の平均をとった
        explanation: |
          **方針** 2020 年から 2023 年に 1.08 倍になったので、古い基準の 2020 年の値 110 に 1.08 を掛ける。

          **途中式** $110\times 1.08=118.8$

          **答え** 118.8

          **間違えやすい点** 指数の変化は比で積み重なるので、上昇分を足すのは誤り（ポイントの足し算は近似にしかならない）。
  - id: s05p04
    title: 調査の精度
    context: |
      標本調査の精度を考える。
    items:
      - id: s05p04a
        chapter: 6
        terms: [stratified-sampling, simple-random-sampling]
        topic: 層化抽出法が単純無作為抽出より精度が上がるのは層の間で値が違い層の中で似ているときであると答える
        level: 基本
        definition: true
        type: choice
        question: |
          層化抽出法が、同じ大きさの単純無作為抽出法より推定の精度が高くなりやすいのはどのような場合か。
        choices:
          - 層の中で値が大きくばらつき、層の間では値が似ている場合
          - 層の数が標本の大きさより多い場合
          - 層の間で調べたい値が大きく違い、層の中では値が似ている場合
          - 各層から 1 人ずつだけ選ぶ場合
          - 層の大きさがわからない場合
        answer: 2
        distractors:
          - この場合は層に分ける効果が小さい
          - 層の数が多すぎると、各層から選べなくなる
          - 正解
          - 各層 1 人では層の中のばらつきを推定できない
          - 層の大きさがわからないと、比例配分や全体の推定ができない
        explanation: |
          **方針** 層化抽出では、層の間の違いは標本誤差に入らず、層の中のばらつきだけが誤差になる。

          **途中式** 層の中が似ているほど（層の中の分散が小さいほど）、推定の精度が上がる。

          **答え** 層の間で値が違い、層の中で似ている場合

          **間違えやすい点** 集落抽出法はその逆で、集落の中が似ていると精度が下がる。
      - id: s05p04b
        chapter: 6
        terms: [sampling-and-nonsampling-error, ci-proportion]
        topic: 400人の世論調査で賛成率がおよそ50パーセントのときの95パーセントの誤差の範囲をポイントで求める
        level: 標準
        definition: false
        type: choice
        question: |
          無作為に選んだ 400 人への世論調査で、内閣の支持率はおよそ 50% だった。95% の信頼度で見積もった標本誤差の範囲（± 何ポイント）に最も近いものはどれか。
        choices:
          - 約 ±4.9 ポイント
          - 約 ±2.5 ポイント
          - 約 ±9.8 ポイント
          - 約 ±4.1 ポイント
          - 約 ±0.25 ポイント
        answer: 0
        distractors:
          - 正解
          - 標準誤差だけを答え、1.96 を掛けていない
          - 標準誤差に 1.96 の 2 倍を掛けた（区間の幅全体）
          - 1.645 を掛けた（90%）
          - 標準誤差の計算で平方根をとらなかった
        explanation: |
          **方針** 標準誤差 $\sqrt{0.5\times 0.5/400}=0.025$、95% の誤差の範囲は $\pm 1.96\times 0.025$。

          **途中式** $1.96\times 0.025=0.049$ → 約 ±4.9 ポイント

          **答え** 約 ±4.9 ポイント

          **間違えやすい点** これは標本誤差だけの範囲で、質問の仕方や無回答による誤差（非標本誤差）は含まない。
  - id: s05p05
    title: 確率の計算
    context: |
      確率を求める。必要なら $e^{-0.6}=0.5488$、$e^{-1}=0.3679$、$e^{-0.4}=0.6703$ を使ってよい。
    items:
      - id: s05p05a
        chapter: 7
        terms: [events-and-probability, independence-of-events]
        topic: 成功確率0.3の独立な試行を3回行い少なくとも1回成功する確率を余事象で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある営業のアポイントが取れる確率は 1 回の電話あたり 0.3 で、電話の結果は互いに独立とする。3 回電話して、少なくとも 1 回アポイントが取れる確率はいくらか。
        choices:
          - '0.900'
          - '0.657'
          - '0.027'
          - '0.343'
          - '0.973'
        answer: 1
        distractors:
          - 確率を 3 回足した
          - 正解
          - 3 回とも取れる確率
          - 1 回も取れない確率
          - 1 から「3 回とも取れる確率」を引いた
        explanation: |
          **方針** 余事象「1 回も取れない」を使う。

          **途中式** $1-0.7^3=1-0.343=0.657$

          **答え** 0.657

          **間違えやすい点** 確率を足すと 1 を超えることもある。「少なくとも 1 回」は余事象で考える。
      - id: s05p05b
        chapter: 7
        terms: [conditional-probability, law-of-total-probability, bayes-theorem]
        topic: 赤玉3個と白玉2個から戻さずに2回取り出すとき2回目が赤の確率と2回目が赤のとき1回目も赤の条件付き確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          赤玉 3 個と白玉 2 個が入った袋から、玉を 1 個ずつ戻さずに 2 回取り出す。2 回目が赤である確率と、2 回目が赤であったときに 1 回目も赤である確率の組合せはどれか。
        choices:
          - 0.6 と 0.3
          - 0.6 と 0.6
          - 0.6 と 0.75
          - 0.6 と 0.5
          - 0.625 と 0.5
        answer: 3
        distractors:
          - 「1 回目も 2 回目も赤」の同時確率を条件付き確率とした
          - 2 回の取り出しを独立とした
          - 1 回目が白のときに 2 回目が赤である確率と取り違えた
          - 正解
          - 1 回目の結果ごとの確率 2/4 と 3/4 を、重みを付けずに平均した
        explanation: |
          **方針** 全確率の公式で 2 回目が赤の確率を求め、ベイズの定理で逆向きの条件付き確率を求める。

          **途中式**
          - $P(\text{2 回目赤})=\frac35\cdot\frac24+\frac25\cdot\frac34=\frac{6}{20}+\frac{6}{20}=0.6$
          - $P(\text{1 回目赤}\mid\text{2 回目赤})=\dfrac{0.3}{0.6}=0.5$

          **答え** 0.6 と 0.5

          **間違えやすい点** 戻さずに取り出しても、2 回目が赤である確率は 1 回目と同じ 3/5（くじ引きの公平性）。
      - id: s05p05c
        chapter: 8
        terms: [joint-probability-function, covariance-and-correlation, expectation-variance-properties]
        topic: 2つの0か1の確率変数の同時確率表から共分散を積の期待値と期待値の積の差で求める
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$（どちらも 0 か 1）の同時確率は、$P(0,0)=0.2$、$P(0,1)=0.1$、$P(1,0)=0.1$、$P(1,1)=0.6$ である（$P(x,y)=P(X=x,Y=y)$）。$X$ と $Y$ の共分散はいくらか。
        choices:
          - '0.60'
          - '0.49'
          - '0.11'
          - '−0.11'
          - '0.21'
        answer: 2
        distractors:
          - $E[XY]$ をそのまま答えた
          - $E[X]E[Y]$ を答えた
          - 正解
          - 引く順番を逆にした
          - $X$ の分散 $0.7\times 0.3$ を答えた
        explanation: |
          **方針** $\mathrm{Cov}[X,Y]=E[XY]-E[X]E[Y]$。

          **途中式** $E[X]=P(X=1)=0.7$、$E[Y]=0.7$、$E[XY]=P(1,1)=0.6$、$0.6-0.49=0.11$

          **答え** 0.11

          **間違えやすい点** 共分散が正なので正の関連がある。独立なら共分散は 0（$E[XY]=E[X]E[Y]$）。
      - id: s05p05d
        chapter: 8
        terms: [sum-of-random-variables, expectation-variance-properties, uniform-distribution]
        topic: 2個の公正なさいころの目の和の期待値と分散を1個の期待値と分散から求める
        level: 基本
        definition: false
        type: choice
        question: |
          公正なさいころ 1 個の目の期待値は 3.5、分散は $35/12\approx 2.92$ である。2 個のさいころを振ったときの目の和の期待値と分散の組合せはどれか。
        choices:
          - 期待値 7、分散 2.92
          - 期待値 3.5、分散 2.92
          - 期待値 7、分散 5.83
          - 期待値 7、分散 11.67
          - 期待値 7、分散 2.42
        answer: 2
        distractors:
          - 和の分散を 1 個の分散と同じとした
          - 1 個分の期待値と分散を答えた
          - 正解
          - 1 個の目を 2 倍した場合（$V[2X]=4V[X]$）と混同した
          - 和の標準偏差を答えた
        explanation: |
          **方針** 独立なら、和の期待値も分散も足し算。

          **途中式** $3.5+3.5=7$、$35/12+35/12=35/6\approx 5.83$

          **答え** 期待値 7、分散 5.83

          **間違えやすい点** 2 個のさいころの和 $X_1+X_2$ と、1 個の目の 2 倍 $2X$ は違う。後者の分散は $4\times 2.92$。
  - id: s05p06
    title: 分布の点と無記憶性
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$e^{-0.6}=0.5488$、$e^{-1}=0.3679$、$e^{-0.4}=0.6703$。
    items:
      - id: s05p06a
        chapter: 9
        terms: [normal-distribution, standard-normal-distribution, statistical-tables]
        topic: 平均50標準偏差10の正規分布で上位5パーセントに入るための得点の境目を上側5パーセント点から求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある試験の得点は $N(50,\ 10^2)$ にしたがう。上位 5% に入るには、何点以上取ればよいか。
        choices:
          - 69.6 点
          - 66.45 点
          - 33.55 点
          - 51.645 点
          - 60 点
        answer: 1
        distractors:
          - 上側 2.5% 点 1.96 を使った
          - 正解
          - 下位 5% の境目を求めた
          - 標準偏差を掛け忘れた
          - 平均 ＋ 標準偏差（上位約 16%）を答えた
        explanation: |
          **方針** 上位 5% の境目は $\mu+z_{0.05}\sigma$。

          **途中式** $50+1.645\times 10=66.45$

          **答え** 66.45 点

          **間違えやすい点** 「上位 5%」は片側なので $z_{0.05}=1.645$。両側 5% の 1.96 と区別する。
      - id: s05p06b
        chapter: 9
        terms: [exponential-distribution, geometric-distribution]
        topic: 平均5分の指数分布で2分待ったあとさらに3分以上待つ確率を無記憶性で求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある窓口の待ち時間 $T$（分）は平均 5 分の指数分布にしたがう。すでに 2 分待っているとき、待ち時間が全部で 5 分を超える（あと 3 分以上待つ）確率はいくらか。
        choices:
          - '0.549'
          - '0.368'
          - '0.670'
          - '0.451'
          - '0.600'
        answer: 0
        distractors:
          - 正解
          - 条件を使わず $P(T>5)$ を求めた
          - $P(T>2)$ を求めた
          - あと 3 分以内に終わる確率を求めた
          - 残り時間の割合 3/5 を確率とした
        explanation: |
          **方針** 指数分布は無記憶性 $P(T>s+t\mid T>s)=P(T>t)$ をもつ。

          **途中式** $P(T>5\mid T>2)=P(T>3)=e^{-3/5}=e^{-0.6}\approx 0.549$

          **答え** 0.549

          **間違えやすい点** すでに待った時間は、この先の待ち時間の確率に影響しない。$P(T>5)/P(T>2)=e^{-1}/e^{-0.4}=e^{-0.6}$ と計算しても同じ。
  - id: s05p07
    title: 標本分布と t 分布
    context: |
      必要なら次の値を使ってよい：$z_{0.025}=1.96$、$z_{0.05}=1.645$、$\chi^2_{0.05}(9)=16.92$、$\chi^2_{0.95}(9)=3.325$。
    items:
      - id: s05p07a
        chapter: 10
        terms: [t-distribution, standard-normal-distribution]
        topic: t分布と標準正規分布の違いを自由度と裾の重さの関係として答える
        level: 基本
        definition: true
        type: choice
        question: |
          t 分布について正しい記述はどれか。
        choices:
          - 正の値だけをとる分布で、自由度が大きいほど右に裾が長い
          - 自由度が大きいほど裾が重くなる
          - 自由度によらず標準正規分布と同じ形である
          - 期待値は自由度に等しい
          - 0 について左右対称で、標準正規分布より裾が重く、自由度が大きくなると標準正規分布に近づく
        answer: 4
        distractors:
          - カイ二乗分布の性質と混同した
          - 自由度が小さいほど裾が重い
          - 自由度が小さいと標準正規分布より裾が重い
          - カイ二乗分布の性質（t 分布の期待値は 0）
          - 正解
        explanation: |
          **方針** t 分布は母分散を標本の分散で置き換えた統計量の分布。

          **途中式** 置き換えによる不確かさの分だけ裾が重くなり、自由度が大きいと置き換えの影響が小さくなる。

          **答え** 左右対称で裾が重く、自由度が大きいと標準正規分布に近づく

          **間違えやすい点** 自由度が小さいほど、上側 2.5% 点は 1.96 より大きくなる（例：自由度 9 で 2.262）。
      - id: s05p07b
        chapter: 10
        terms: [sampling-distribution-of-mean, required-sample-size]
        topic: 標本平均と母平均の差が1以内になる確率を95パーセント以上にするのに必要な標本の大きさを求める
        level: 標準
        definition: false
        type: choice
        question: |
          母標準偏差 5 の母集団から無作為に $n$ 個を抽出する。標本平均と母平均の差の絶対値が 1 以内になる確率を 95% 以上にしたい。必要な $n$ の最小値はどれか（正規近似を用いる）。
        choices:
          - '96'
          - '68'
          - '97'
          - '10'
          - '100'
        answer: 2
        distractors:
          - 96.04 を切り捨てた（条件を満たさない）
          - 1.645 を使った
          - 正解
          - 2 乗しなかった（$1.96\times 5=9.8$）
          - 1.96 を 2 として計算した
        explanation: |
          **方針** $1.96\times 5/\sqrt n\le 1$ を満たす最小の $n$。

          **途中式** $\sqrt n\ge 9.8$、$n\ge 96.04$ → 97

          **答え** 97

          **間違えやすい点** 条件を満たす最小の整数なので切り上げる。
      - id: s05p07c
        chapter: 10
        terms: [chi-squared-distribution, statistical-tables, sample-variance-sd]
        topic: 正規母集団の10個の不偏分散が母分散の何倍を超える確率が5パーセントかを自由度9のカイ二乗分布の点から求める
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団（母分散 $\sigma^2$）から大きさ 10 の標本を抽出し、不偏分散を $S^2$ とする。$P(S^2>c\,\sigma^2)=0.05$ となる $c$ に最も近いものはどれか。
        choices:
          - '16.92'
          - '1.69'
          - '0.37'
          - '1.88'
          - '1.645'
        answer: 3
        distractors:
          - カイ二乗分布の点を自由度で割らなかった
          - 自由度 9 ではなく 10 で割った
          - 下側の点 3.325 を使った
          - 正解
          - 標準正規分布の点を使った
        explanation: |
          **方針** $9S^2/\sigma^2$ は自由度 9 のカイ二乗分布にしたがう。$P(9S^2/\sigma^2>16.92)=0.05$。

          **途中式** $S^2>\dfrac{16.92}{9}\sigma^2\approx 1.88\sigma^2$

          **答え** 1.88

          **間違えやすい点** 標本が小さいと、不偏分散は母分散の 2 倍近くになることも 5% ほどある。
  - id: s05p08
    title: 推定
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$z_{0.005}=2.576$、$t_{0.025}(8)=2.306$、$t_{0.005}(8)=3.355$、$t_{0.005}(9)=3.250$。
    items:
      - id: s05p08a
        chapter: 11
        terms: [point-estimation, standard-error, ci-proportion]
        topic: 250人中50人という結果から母比率の点推定値とその標準誤差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ 250 人のうち 50 人が、ある商品を知っていた。この商品を知っている人の母比率の推定値と、その標準誤差の組合せとして最も近いものはどれか。
        choices:
          - 推定値 0.20、標準誤差 0.00064
          - 推定値 0.20、標準誤差 0.025
          - 推定値 0.20、標準誤差 0.028
          - 推定値 0.20、標準誤差 0.40
          - 推定値 0.20、標準誤差 0.032
        answer: 1
        distractors:
          - 平方根をとらなかった
          - 正解
          - $1-\hat p$ を掛け忘れた（$\sqrt{0.2/250}$）
          - 標本の大きさで割らなかった
          - $\hat p$ の代わりに 0.5 を使った
        explanation: |
          **方針** 推定値 $\hat p=50/250$、標準誤差 $\sqrt{\hat p(1-\hat p)/n}$。

          **途中式** $\hat p=0.2$、$\sqrt{0.2\times 0.8/250}=\sqrt{0.00064}\approx 0.0253$

          **答え** 推定値 0.20、標準誤差 0.025

          **間違えやすい点** 標準誤差は推定値のぶれの大きさ。95% 信頼区間はおよそ推定値 ± 2 × 標準誤差。
      - id: s05p08b
        chapter: 11
        terms: [ci-mean-known-variance, confidence-coefficient]
        topic: 母標準偏差既知の正規母集団で25個の標本平均から母平均の90パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          母標準偏差 10 の正規母集団から大きさ 25 の標本を抽出したところ、標本平均は 60 だった。母平均の 90% 信頼区間はどれか。
        choices:
          - (56.71, 63.29)
          - (56.08, 63.92)
          - (43.55, 76.45)
          - (54.85, 65.15)
          - (59.34, 60.66)
        answer: 0
        distractors:
          - 正解
          - 1.96 を使った（95% 信頼区間）
          - 標準誤差の代わりに母標準偏差 10 を使った
          - 2.576 を使った（99% 信頼区間）
          - 母標準偏差を $n$ で割った
        explanation: |
          **方針** 90% 信頼区間は $\bar x\pm z_{0.05}\sigma/\sqrt n$。

          **途中式** $10/\sqrt{25}=2$、$60\pm 1.645\times 2=60\pm 3.29$

          **答え** (56.71, 63.29)

          **間違えやすい点** 90% の両側なので、上側 5% 点 1.645 を使う。
      - id: s05p08c
        chapter: 11
        terms: [ci-mean-unknown-variance, t-distribution]
        topic: 母分散が未知の正規母集団で9個の標本から自由度8のt分布の上側0.5パーセント点を使い母平均の99パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 9 の標本を抽出したところ、標本平均 30、標本標準偏差（不偏分散の平方根）6 だった。母平均の 99% 信頼区間に最も近いものはどれか。
        choices:
          - (25.39, 34.61)
          - (23.50, 36.50)
          - (24.85, 35.15)
          - (23.29, 36.71)
          - (9.87, 50.13)
        answer: 3
        distractors:
          - 上側 2.5% 点を使った（95% 信頼区間）
          - 自由度を 9 とした
          - 母分散が未知なのに 2.576 を使った
          - 正解
          - 標準誤差の代わりに標本標準偏差 6 を使った
        explanation: |
          **方針** $\bar x\pm t_{0.005}(n-1)\,s/\sqrt n$。

          **途中式** $6/\sqrt 9=2$、$30\pm 3.355\times 2=30\pm 6.71$

          **答え** (23.29, 36.71)

          **間違えやすい点** 99% の両側は上側 0.5% 点。自由度は $n-1=8$。
      - id: s05p08d
        chapter: 11
        terms: [required-sample-size, ci-mean-known-variance]
        topic: 母標準偏差12のとき母平均の95パーセント信頼区間の幅の半分を2以下にする標本の大きさを求める
        level: 応用
        definition: false
        type: choice
        question: |
          母標準偏差が 12 とわかっている母集団で、母平均の 95% 信頼区間の幅の半分を 2 以下にしたい。必要な標本の大きさの最小値はどれか。
        choices:
          - '139'
          - '138'
          - '98'
          - '12'
          - '36'
        answer: 0
        distractors:
          - 正解
          - 138.3 を切り捨てた
          - 1.645 を使った
          - 2 乗しなかった（$1.96\times 12/2=11.76$）
          - $(12/2)^2$ として 1.96 を掛けなかった
        explanation: |
          **方針** $1.96\times 12/\sqrt n\le 2$ を $n$ について解く。

          **途中式** $n\ge\left(\dfrac{1.96\times 12}{2}\right)^2=11.76^2\approx 138.3$ → 139

          **答え** 139

          **間違えやすい点** 幅の半分を半分にするには、標本を 4 倍にする必要がある。
  - id: s05p09
    title: 検定の結論
    context: |
      必要なら次の値を使ってよい：$t_{0.025}(15)=2.131$、$t_{0.01}(15)=2.602$、$t_{0.005}(15)=2.947$、$P(Z>2.4)=0.0082$、$P(Z>0.24)=0.4052$、$z_{0.025}=1.96$、$z_{0.005}=2.576$、$\chi^2_{0.05}(3)=7.815$。
    items:
      - id: s05p09a
        chapter: 12
        terms: [type-i-and-ii-errors, power-function]
        topic: 実際には効果がある新しい治療法で検定が有意にならなかった状況を第2種の過誤と判断する
        level: 基本
        definition: false
        type: choice
        question: |
          新しい治療法には実際には効果があったが、臨床試験の検定では有意にならず、「効果があるとはいえない」と結論した。この誤りを何というか。
        choices:
