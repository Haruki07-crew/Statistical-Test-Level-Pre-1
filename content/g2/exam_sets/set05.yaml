          **答え** 0.02 と 0.05 の間

          **間違えやすい点** 有意水準 5% なら棄却、1% なら棄却しない。
      - id: s05p09c
        chapter: 12
        terms: [proportion-test, p-value]
        topic: 硬貨を100回投げて表が62回出たときの比率の検定統計量と両側p値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある硬貨を 100 回投げたところ、表が 62 回出た。帰無仮説「表の出る確率は 0.5」の両側検定（正規近似、連続修正なし）の検定統計量と p 値の組合せはどれか。
        choices:
          - z ＝ 2.4、p 値 0.0164
          - z ＝ 2.4、p 値 0.0082
          - z ＝ 0.24、p 値 0.8104
          - z ＝ 2.4、p 値 0.9836
          - z ＝ 48、p 値 0.0000
        answer: 0
        distractors:
          - 正解
          - 両側検定なのに片側の確率を p 値とした
          - 標準誤差の計算で標本の大きさで割らなかった
          - 1 から両側の p 値を引いた
          - 標準誤差の平方根をとらなかった
        explanation: |
          **方針** $z=\dfrac{\hat p-0.5}{\sqrt{0.5\times 0.5/100}}$、両側 p 値は $2P(Z>|z|)$。

          **途中式** $\hat p=0.62$、$\sqrt{0.0025}=0.05$、$z=0.12/0.05=2.4$、p 値 $=2\times 0.0082=0.0164$

          **答え** z ＝ 2.4、p 値 0.0164

          **間違えやすい点** 検定では帰無仮説の比率 0.5 で標準誤差を計算する。
      - id: s05p09d
        chapter: 13
        terms: [two-sample-t-test, ci-two-sample-mean-difference, standard-error]
        topic: 大きな2標本の平均の差を標準誤差で割ったz統計量を求め両側5パーセントと1パーセントで判断する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの工場からそれぞれ 100 個の製品を抽出した。工場 A は平均 52、標準偏差 8、工場 B は平均 50、標準偏差 6 だった。母平均の差の検定（標本が大きいので正規近似）の結果として正しいものはどれか。
        choices:
          - z ＝ 2.0 で、有意水準 1% の両側検定でも棄却する
          - z ＝ 0.2 で、棄却しない
          - z ≈ 1.43 で、棄却しない
          - z ＝ 2.0 で、有意水準 5% の両側検定で棄却する
          - z ＝ 2.0 で、1.96 より小さいので棄却しない
        answer: 3
        distractors:
          - 2.0 は 2.576 より小さいので、1% では棄却しない
          - 分散を標本の大きさで割らなかった
          - 標準誤差を標準偏差の和 ÷ 10 とした
          - 正解
          - 2.0 は 1.96 より大きい
        explanation: |
          **方針** 標準誤差 $\sqrt{s_1^2/n_1+s_2^2/n_2}$ で差を割る。

          **途中式** $\sqrt{64/100+36/100}=1$、$z=(52-50)/1=2.0>1.96$

          **答え** z ＝ 2.0 で、5% で棄却する

          **間違えやすい点** 5% では有意だが 1% では有意でない。有意水準によって結論が変わる境目の例。
      - id: s05p09e
        chapter: 13
        terms: [goodness-of-fit-test, expected-frequency, pearson-chi-square-statistic]
        topic: 4つの型の比率が4対3対2対1という仮説への200人の度数の適合度をカイ二乗統計量で検定する
        level: 標準
        definition: false
        type: choice
        question: |
          ある地域の血液型の比率は A：O：B：AB ＝ 4：3：2：1 とされている。200 人を調べたところ、A 90 人、O 50 人、B 40 人、AB 20 人だった。有意水準 5% の適合度検定の結果として正しいものはどれか。
        choices:
          - χ² ≈ 2.92 で、自由度 3 の点 7.815 より小さいので、比率は 4：3：2：1 であると証明された
          - χ² ＝ 200 で、棄却する
          - χ² ≈ 0.04 で、棄却しない
          - χ² ≈ 2.92 で、自由度 3 の点 7.815 より大きいので棄却する
          - χ² ≈ 2.92 で、自由度 3 の点 7.815 より小さいので棄却しない
        answer: 4
        distractors:
          - 棄却しないことは、仮説が正しいことの証明ではない
          - (観測度数 − 期待度数)² を期待度数で割らなかった
          - (観測度数 − 期待度数)² を期待度数の 2 乗で割った
          - 2.92 は 7.815 より小さい（大小の比較を誤った）
          - 正解
        explanation: |
          **方針** 期待度数は 200 × 比率 ＝ 80、60、40、20。統計量を自由度 3 の点と比べる。

          **途中式** $\dfrac{10^2}{80}+\dfrac{10^2}{60}+0+0=1.25+1.67\approx 2.92<7.815$

          **答え** 棄却しない

          **間違えやすい点** 自由度はカテゴリの数 − 1（比率は仮説で与えられていて、推定していない）。
      - id: s05p09f
        chapter: 13
        terms: [paired-t-test, two-sample-t-test]
        topic: 個人差の大きい前後のデータを対応を無視して2標本で検定すると統計量が小さくなることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          5 人の前後の測定値で、差（後 − 前）の平均は 2、差の標準偏差は 1 だった。一方、前・後それぞれの値の標準偏差は約 8 と大きかった。正しい記述はどれか。
        choices:
          - 対応のある t 検定では t ≈ 4.47 と大きいが、対応を無視した 2 標本の検定では t ≈ 0.40 と小さくなる
          - 対応を無視した 2 標本の検定のほうが t が大きくなる
          - どちらの方法でも t は同じになる
          - 対応のある t 検定は、個人差が大きいときには使えない
          - 対応のある t 検定の自由度は 2 × 5 − 2 ＝ 8 である
        answer: 0
        distractors:
          - 正解
          - 対応を無視すると個人差が誤差に入り、t は小さくなる
          - 差をとると個人差が打ち消されるので、t は大きく違う
          - 個人差が大きいときこそ、差をとる対応のある検定が有効
          - 対応のある t 検定の自由度は 5 − 1 ＝ 4
        explanation: |
          **方針** 対応のある検定は差の散らばり（1）、2 標本の検定は各群の散らばり（8）で比べる。

          **途中式** 対応あり：$2/(1/\sqrt 5)\approx 4.47$。対応を無視：$2/\sqrt{64/5+64/5}\approx 0.40$

          **答え** 対応のある t ≈ 4.47、対応を無視すると t ≈ 0.40

          **間違えやすい点** 同じ人の前後は対応のあるデータとして分析する。個人差を除けるので検出力が高い。
  - id: s05p10
    title: 重回帰分析の出力
    context: |
      目的変数 $y$ を 3 つの説明変数 $x_1,x_2,x_3$ で説明する重回帰分析を行い、$\hat y=5.0+0.8x_1+1.5x_2-0.2x_3$ を得た。
    items:
      - id: s05p10a
        chapter: 14
        terms: [multiple-regression-model, regression-output]
        topic: 3つの説明変数の重回帰式に値を代入して予測値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          $x_1=10$、$x_2=2$、$x_3=15$ のときの予測値はいくらか。
        choices:
          - '19.0'
          - '8.0'
          - '16.0'
          - '13.0'
          - '18.0'
        answer: 3
        distractors:
          - $x_3$ の係数の符号を + とした
          - 切片を足し忘れた
          - $x_3$ の項を忘れた
          - 正解
          - 切片を足し忘れ、$x_3$ の項も足した
        explanation: |
          **方針** 係数に値を代入して足す。

          **途中式** $5.0+0.8\times 10+1.5\times 2-0.2\times 15=5+8+3-3=13.0$

          **答え** 13.0

          **間違えやすい点** 負の係数の項は引き算になる。
      - id: s05p10b
        chapter: 14
        terms: [multicollinearity, overall-f-test-regression, regression-coefficient-t-test]
        topic: 回帰全体のF検定は有意なのに個々の係数のt検定がどれも有意でない出力から多重共線性を疑う
        level: 標準
        definition: false
        type: choice
        question: |
          この重回帰分析では、回帰全体の F 検定は有意水準 1% で有意（決定係数 0.85）だったが、3 つの係数の t 検定はどれも有意水準 5% で有意でなかった。最も考えられる原因はどれか。
        choices:
          - 3 つの説明変数はどれも目的変数と関係がない
          - 説明変数どうしの相関が強く（多重共線性）、それぞれの効果を分けて推定できていない
          - 決定係数が高いので、t 検定の計算が誤っている
          - 標本が大きすぎる
          - 切片が 5.0 と大きい
        answer: 1
        distractors:
          - 全体の F 検定が有意なので、少なくとも 1 つは関係がある
          - 正解
          - 多重共線性があると、全体の当てはまりは良くても個々の係数は有意になりにくい
          - 標本が大きいほど有意になりやすい
          - 切片の大きさは個々の係数の有意性と関係ない
        explanation: |
          **方針** 全体としては説明力があるのに、個々の効果が区別できない典型的な状況。

          **途中式** 説明変数どうしの相関が強いと係数の標準誤差が大きくなり、t 値が小さくなる。

          **答え** 多重共線性

          **間違えやすい点** 対策として、相関の強い変数の一方を除く、まとめる、などを検討する。
      - id: s05p10c
        chapter: 14
        terms: [regression-output, coefficient-of-determination, regression-coefficient-t-test]
        topic: 目的変数の単位を千円から万円に変えたときの係数とt値と決定係数の変化を判断する
        level: 応用
        definition: false
        type: choice
        question: |
          この分析で目的変数 $y$ は「千円」単位だった。$y$ を「万円」単位に直して（値を 1/10 にして）同じ重回帰分析をやり直すと、どうなるか。
        choices:
          - 係数も t 値も 1/10 になる
          - 係数は変わらず、決定係数が 1/10 になる
          - 係数は 10 倍になり、t 値も 10 倍になる
          - すべての値が変わらない
          - 係数と標準誤差は 1/10 になり、t 値と決定係数は変わらない
        answer: 4
        distractors:
          - t 値は推定値 ÷ 標準誤差なので、両方が 1/10 になれば変わらない
          - 決定係数は変動の割合なので単位によらない
          - $y$ を 1/10 にすると係数も 1/10
          - 係数（と切片・標準誤差）は単位に合わせて変わる
          - 正解
        explanation: |
          **方針** $y$ をすべて 1/10 にすると、予測式全体（切片・係数）も 1/10 になる。

          **途中式** 係数と標準誤差がともに 1/10 → t 値は不変。残差と全体の変動が同じ比で縮む → 決定係数は不変。

          **答え** 係数と標準誤差は 1/10、t 値と決定係数は不変

          **間違えやすい点** 係数の大きさは単位で変わるので、それだけで変数の重要さを比べない。
  - id: s05p11
    title: 新しい教材の効果
    context: |
      新しい教材の効果を調べる。必要なら $F_{0.05}(2,18)=3.555$ を使ってよい。
    items:
      - id: s05p11a
        chapter: 15
        terms: [treatment-and-control, observational-vs-experimental]
        topic: 新しい教材の効果を使用前後の比較だけで判断する研究の問題点を対照群がないこととして指摘する
        level: 基本
        definition: false
        type: choice
        question: |
          ある学校で、2 学期に新しい教材を使い、1 学期末と 2 学期末のテストの平均点を比べたところ、10 点上がっていた。この比較だけで「教材の効果で 10 点上がった」と結論する問題点として最も適切なものはどれか。
        choices:
          - 平均点ではなく中央値で比べるべきである
          - 10 点は小さすぎるので、効果があるとはいえない
          - 対応のあるデータなので、比べることができない
          - テストの点数は量的変数ではないので、平均は計算できない
          - 対照群がないので、教材以外の要因（学習の進み具合やテストの難しさの違いなど）の影響と区別できない
        answer: 4
        distractors:
          - 代表値の選び方は根本的な問題ではない
          - 差の大きさではなく、比べ方が問題
          - 対応のあるデータは差をとって比べられる
          - テストの点数は量的変数
          - 正解
        explanation: |
          **方針** 処理の効果を取り出すには、処理を受けない対照群との比較が必要。

          **途中式** 同じ期間に教材を使わない群（対照群）を無作為に設けて比べれば、時間の経過やテストの違いの影響を除ける。

          **答え** 対照群がないので、ほかの要因と区別できない

          **間違えやすい点** 前後の比較だけでは、何もしなくても起こる変化と処理の効果を区別できない。
      - id: s05p11b
        chapter: 15
        terms: [anova-table, sum-of-squares-decomposition, one-way-anova]
        topic: 3群7人ずつの一元配置分散分析で群間の平均平方とF比から全体の平方和を逆算する
        level: 基本
        definition: false
        type: choice
        question: |
          3 種類の教材を 7 人ずつ（合計 21 人）に割り付けた一元配置分散分析で、群間の平均平方は 30、F 比は 5.0 だった。全体の平方和はいくらか。
        choices:
          - '108'
          - '60'
          - '168'
          - '36'
          - '186'
        answer: 2
        distractors:
          - 誤差の平方和だけを答えた
          - 群間の平方和だけを答えた
          - 正解
          - 2 つの平均平方を足した
          - 誤差の自由度を 21 とした
        explanation: |
          **方針** 誤差の平均平方 ＝ 群間の平均平方 ÷ F。平方和 ＝ 平均平方 × 自由度。

          **途中式**
          - 誤差の平均平方 $30/5=6$、誤差の自由度 $21-3=18$ → 誤差の平方和 $108$
          - 群間の平方和 $30\times 2=60$
          - 全体の平方和 $60+108=168$

          **答え** 168

          **間違えやすい点** 平方和と自由度は足し算で分解できるが、平均平方は足せない。F ＝ 5.0 は $F_{0.05}(2,18)=3.555$ より大きく、有意。
