        chapter: 12
        terms: [p-value, z-test-known-variance]
        topic: 左片側z検定で検定統計量マイナス1.8の片側p値を求めて有意水準5パーセントで判断する
        level: 標準
        definition: false
        type: choice
        question: |
          前問の検定で、検定統計量の値は $-1.8$ だった。p 値と、有意水準 5% での判断の組合せはどれか。
        choices:
          - p 値 0.0359 で、棄却する
          - p 値 0.0718 で、棄却しない
          - p 値 0.9641 で、棄却しない
          - p 値 0.0359 で、棄却しない
          - p 値 0.0718 で、棄却する
        answer: 0
        distractors:
          - 正解
          - 片側検定なのに両側の p 値を求めた
          - 右側の確率 $P(Z>-1.8)$ を p 値とした
          - 0.0359 は 0.05 より小さいので棄却する
          - 両側の p 値 0.0718 は 0.05 より大きい
        explanation: |
          **方針** 左片側検定の p 値は $P(Z\le -1.8)$。

          **途中式** $P(Z\le -1.8)=P(Z\ge 1.8)=0.0359<0.05$

          **答え** p 値 0.0359 で、棄却する

          **間違えやすい点** 同じ値でも、両側検定なら p 値は 0.0718 で棄却されない。
      - id: s07p10c
        chapter: 12
        terms: [chi-square-test-variance, chi-squared-distribution]
        topic: 正規母集団の21個の不偏分散から母分散の両側検定を自由度20のカイ二乗分布の2つの点と比べて行う
        level: 標準
        definition: false
        type: choice
        question: |
          ある部品の寸法の母分散は 25 とされている。21 個を測ったところ不偏分散は 50 だった。帰無仮説「母分散は 25」、対立仮説「母分散は 25 ではない」で有意水準 5% の検定を行う。正しいものはどれか。
        choices:
          - χ² ＝ 42 で、上側 2.5% 点 34.17 より大きいので棄却する
          - χ² ＝ 40 で、上側 2.5% 点 34.17 より大きいので棄却する
          - χ² ＝ 40 で、上側 2.5% 点 34.17 より大きいが、両側検定なので棄却しない
          - χ² ＝ 2 で、棄却しない
          - χ² ＝ 10 で、棄却しない
        answer: 1
        distractors:
          - $(n-1)$ ではなく $n$ を掛けた
          - 正解
          - 両側検定でも、上側 2.5% 点を超えれば棄却する
          - 不偏分散と基準の比だけを求めた
          - 比を逆にして $(n-1)$ を掛けた（$20\times 25/50$）。下側の点 9.591 より大きいので棄却されないと誤った
        explanation: |
          **方針** $\chi^2=(n-1)s^2/\sigma_0^2$ を、自由度 20 の上側 2.5% 点と下側 2.5% 点（上側 97.5% 点）と比べる。

          **途中式** $20\times 50/25=40>34.17$

          **答え** χ² ＝ 40 で、棄却する

          **間違えやすい点** 両側検定は上側 2.5% 点（34.17）と下側 2.5% 点（9.591）の 2 つと比べる。片側の点 31.41 は使わない。
      - id: s07p10d
        chapter: 13
        terms: [goodness-of-fit-test, poisson-distribution, expected-frequency]
        topic: 平均1.5のポアソン分布を当てはめる適合度検定で0件の期待度数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある交差点の 200 日間の 1 日の事故件数に、平均 1.5 のポアソン分布を当てはめる適合度検定を行う。事故が 0 件の日の期待度数はいくらか。
        choices:
          - '0.223'
          - '66.9'
          - '300'
          - '44.6'
          - '133.3'
        answer: 3
        distractors:
          - 確率 $e^{-1.5}$ に 200 を掛け忘れた
          - 1 件の日の期待度数（$200\times 1.5e^{-1.5}$）を答えた
          - 200 に平均 1.5 を掛けた
          - 正解
          - 200 を平均 1.5 で割った
        explanation: |
          **方針** 期待度数 ＝ 日数 × ポアソン分布の確率 $P(X=0)=e^{-1.5}$。

          **途中式** $200\times 0.2231\approx 44.6$

          **答え** 44.6

          **間違えやすい点** 平均をデータから推定した場合は、適合度検定の自由度を 1 減らす。
      - id: s07p10e
        chapter: 13
        terms: [independence-test, two-sample-proportion-test]
        topic: 2行2列の独立性の検定の統計量が2つの比率の差の検定のz統計量の2乗に等しいことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの店舗（各 100 人）で商品を買った人の割合を比べた。店舗 A は 60 人、店舗 B は 45 人が買った。この 2×2 表の独立性のカイ二乗統計量（連続修正なし）と、合わせた比率を使う比率の差の検定の $z$ の関係として正しいものはどれか。
        choices:
          - カイ二乗統計量 ≈ 4.51 は $z\approx 2.12$ の 2 乗に等しく、2 つの検定は同じ結論になる
          - カイ二乗統計量は $z$ に等しい
          - カイ二乗統計量は $z$ の 2 倍である
          - 2 つの検定は、いつも逆の結論になる
          - カイ二乗統計量 ≈ 4.51 は $z$ の 2 乗に等しいが、有意水準 5% での結論は違う
        answer: 0
        distractors:
          - 正解
          - 2 乗の関係
          - 2 乗の関係（4.51 は 2.12 の 2 倍ではない）
          - 2 乗の関係なので、両側検定どうしなら結論は一致する
          - $z^2$ と自由度 1 のカイ二乗分布の点も 2 乗の関係（$1.96^2=3.841$）なので結論は一致する
        explanation: |
          **方針** 2×2 表の独立性のカイ二乗統計量は、合わせた比率を使う比率の差の $z$ の 2 乗に等しい。

          **途中式** 合わせた比率 $105/200=0.525$、$z=\dfrac{0.60-0.45}{\sqrt{0.525\times 0.475\times(1/100+1/100)}}\approx 2.12$、$z^2\approx 4.51$

          **答え** カイ二乗統計量は $z$ の 2 乗に等しく、結論は同じ

          **間違えやすい点** 自由度 1 のカイ二乗分布の上側 5% 点 3.841 は $1.96^2$。両側の比率の差の検定と同じ判断になる。
      - id: s07p10f
        chapter: 13
        terms: [independence-test, null-and-alternative-hypothesis]
        topic: クロス表の独立性の検定の帰無仮説が2つの変数が独立であることだと答える
        level: 基本
        definition: true
        type: choice
        question: |
          性別と好きな季節のクロス表で独立性のカイ二乗検定を行う。帰無仮説として正しいものはどれか。
        choices:
          - 性別と好きな季節には関連がある
          - 男性と女性の人数は等しい
          - どの季節も同じ人数に好まれている
          - 性別と好きな季節は独立である（関連がない）
          - 期待度数と観測度数はすべて等しい
        answer: 3
        distractors:
          - これは対立仮説
          - 独立性の検定は行や列の合計についての仮説ではない
          - これは季節の一様性の適合度検定の仮説
          - 正解
          - 仮説は母集団についてのもので、観測度数についての主張ではない
        explanation: |
          **方針** 独立性の検定の帰無仮説は「2 つの変数は独立」。

          **途中式** 独立なら、期待度数は 行の合計 × 列の合計 ÷ 総数 になる。

          **答え** 性別と好きな季節は独立である

          **間違えやすい点** 棄却されれば「関連がある」といえるが、関連の強さや因果関係まではわからない。
  - id: s07p11
    title: 店舗の売上の重回帰
    context: |
      ある地域の 30 店舗の売上 $y$（万円）を、店の前の人通り $x_1$（千人／日）と近くの競合店の数 $x_2$ で説明する重回帰を行い、$\hat y=50+2.0x_1-8.0x_2$ を得た。
    items:
      - id: s07p11a
        chapter: 14
        terms: [residual, multiple-regression-model]
        topic: 重回帰式から1店舗の予測値を求めて実際の売上との差として残差を計算する
        level: 基本
        definition: false
        type: choice
        question: |
          人通り 40 千人／日・競合店 3 店の店舗の売上は 120 万円だった。この店舗の残差はいくらか。
        choices:
          - '−14'
          - '106'
          - '14'
          - '64'
          - '−34'
        answer: 2
        distractors:
          - 予測値 − 実際の値 と、引く順番を逆にした
          - 予測値を答えた
          - 正解
          - 切片 50 を足し忘れて予測値を 56 とした
          - 競合店の項の符号を + とした（予測値 154）
        explanation: |
          **方針** 残差 ＝ 実際の値 − 予測値。

          **途中式** 予測値 $50+2.0\times 40-8.0\times 3=50+80-24=106$、残差 $120-106=14$

          **答え** 14

          **間違えやすい点** 残差が正なら、その店舗は条件から予測されるより売上が多い。
      - id: s07p11b
        chapter: 14
        terms: [multiple-regression-model, spurious-correlation, regression-coefficient-t-test]
        topic: 単回帰では正の係数なのに重回帰では負になる理由を他の説明変数を一定にした効果として判断する
        level: 標準
        definition: false
        type: choice
        question: |
          売上を競合店の数 $x_2$ だけで説明する単回帰では、係数は正（＋3.0）だった。重回帰で係数が負（−8.0）になった理由として最も適切なものはどれか。
        choices:
          - 重回帰の計算が誤っている
          - 単回帰と重回帰の係数は必ず同じ符号になる
          - 競合店が増えると売上が増えることが重回帰で証明された
          - 人通りの多い場所ほど競合店も多いので、単回帰の係数には人通りの効果が混ざっている。重回帰の係数は人通りを一定にしたときの効果である
          - 符号が変わったので、競合店の数は売上と関係がない
        answer: 3
        distractors:
          - 説明変数どうしに相関があると、係数の符号が変わることは珍しくない
          - 他の変数を一定にするかどうかで、係数の意味が違う
          - 重回帰では負の係数になっている
          - 正解
          - 関係がないのではなく、他の変数を考えるかどうかで見え方が変わる
        explanation: |
          **方針** 重回帰の係数は「他の説明変数を一定にしたとき」の効果。単回帰の係数には、相関のある他の変数の効果も含まれる。

          **途中式** 人通りが多い → 売上も多い、競合店も多い。人通りを考えないと、競合店が多い店ほど売上が多いように見える。

          **答え** 単回帰の係数に人通りの効果が混ざっている

          **間違えやすい点** これは擬似相関と同じ構造。係数の解釈では、どの変数を一定にしているかを確かめる。
      - id: s07p11c
        chapter: 14
        terms: [overall-f-test-regression, coefficient-of-determination]
        topic: データ数30で説明変数2個の重回帰の回帰全体のF統計量から決定係数を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          この重回帰分析（データ 30 件、説明変数 2 個）の回帰全体の F 統計量は 13.5 だった。決定係数はいくらか。
        choices:
          - '0.93'
          - '0.48'
          - '0.50'
          - '0.33'
          - '0.07'
        answer: 2
        distractors:
          - $F/(F+1)$ とした（自由度を考えていない）
          - 残差の自由度を $n-1=29$ とした
          - 正解
          - 説明変数の数を 1 とした
          - $1/F$ を答えた
        explanation: |
          **方針** $F=\dfrac{R^2/p}{(1-R^2)/(n-p-1)}$ を $R^2$ について解くと $R^2=\dfrac{pF}{pF+(n-p-1)}$。

          **途中式** $\dfrac{2\times 13.5}{2\times 13.5+27}=\dfrac{27}{54}=0.50$

          **答え** 0.50

          **間違えやすい点** 自由度は (2, 27)。F が大きくても、決定係数が大きいとは限らない（データが多いと小さな $R^2$ でも F は大きくなる）。
  - id: s07p12
    title: 2 つの要因の実験
    context: |
      2 種類の温度（低・高）と 2 種類の時間（短・長）を組み合わせて、ある製品の強度を調べる実験を行った。
    items:
      - id: s07p12a
        chapter: 15
        terms: [main-effect-and-interaction, two-way-anova-with-replication]
        topic: 2つの要因の組合せの平均を結んだ折れ線がほぼ平行なことから交互作用がないと読み取る
        level: 基本
        definition: false
        type: choice
        question: |
          横軸に時間（短・長）、縦軸に強度の平均をとり、温度ごとに平均を結んだ 2 本の折れ線を描いたところ、2 本はほぼ平行で、高温の線が低温の線より全体に上にあった。読み取れることとして最も適切なものはどれか。
        choices:
          - 2 本の線が交わっていないので、温度の効果はない
          - 温度の効果は時間によらずほぼ一定で、交互作用はほとんどない
          - 線が平行なので、時間の効果はない
          - 交互作用が強く、温度の効果は時間によって大きく変わる
          - 平行な線からは何も読み取れない
        answer: 1
        distractors:
          - 高温の線が上にあるので、温度の効果（主効果）はある
          - 正解
          - 時間の効果は各線の傾きで読む。平行かどうかとは別
          - 交互作用があれば線は平行にならない
          - 線の上下と平行かどうかから主効果と交互作用が読める
        explanation: |
          **方針** 折れ線が平行なら、一方の要因の効果がもう一方の水準によらず一定（交互作用なし）。

          **途中式** 高温の線が全体に上 → 温度の主効果あり。平行 → 交互作用ほぼなし。

          **答え** 交互作用はほとんどない

          **間違えやすい点** 線が交差したり、開いたりしていれば交互作用がある。
      - id: s07p12b
        chapter: 15
        terms: [one-way-anova, anova-table]
        topic: 3群以上の一元配置分散分析で有意になったあとにどの群の間に差があるかを調べる必要を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          別の実験で、4 種類の添加剤の効果を一元配置分散分析で比べたところ、有意水準 5% で有意になった。この結果から言えることとして最も適切なものはどれか。
        choices:
          - 4 種類の添加剤の母平均はすべて互いに異なる
          - 少なくとも 1 組の添加剤の母平均に差があるといえるが、どの組に差があるかは別に調べる必要がある
          - 最も平均の高い添加剤が、他のすべてより有意に優れている
          - 4 種類の添加剤の母分散が異なる
          - 有意になったので、効果の大きさも大きい
        answer: 1
        distractors:
          - 分散分析の対立仮説は「少なくとも 1 組が違う」
          - 正解
          - どの組が違うかは、多重比較などで調べる
          - 分散分析は平均の比較で、母分散は等しいと仮定している
          - 有意かどうかと効果の大きさは別
        explanation: |
          **方針** 分散分析の帰無仮説は「すべての母平均が等しい」。棄却されるのは、少なくとも 1 組が違うとき。

          **途中式** どの組に差があるかを調べるには、多重比較（テューキーの方法など）を使う。

          **答え** 少なくとも 1 組に差があるが、どの組かは別に調べる

          **間違えやすい点** 2 群ずつ t 検定をくり返すと、全体として第 1 種の過誤が起こりやすくなる。
