          **答え** 推定量は式、推定値はその数値

          **間違えやすい点** 不偏性や一致性は推定量の性質で、1 つの推定値の性質ではない。
      - id: s07p09b
        chapter: 11
        terms: [ci-variance-ratio, f-distribution]
