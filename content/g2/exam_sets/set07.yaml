  - id: s07p08
    title: 標本分布の性質
    context: |
      必要なら次の値を使ってよい：$F_{0.05}(10,4)=5.964$、$F_{0.05}(4,10)=3.478$、$P(Z>1.41)=0.0793$。
    items:
      - id: s07p08a
        chapter: 10
        terms: [weak-law-of-large-numbers, central-limit-theorem]
        topic: 大数の法則と中心極限定理が述べている内容の違いを答える
        level: 基本
        definition: true
        type: choice
        question: |
          大数の法則と中心極限定理の説明の組合せとして正しいものはどれか。
        choices:
          - 大数の法則は「標本平均の分布が正規分布で近似できる」こと、中心極限定理は「標本平均が母平均に近づく」こと
          - どちらも「母集団の分布が正規分布になる」ことを述べている
          - 大数の法則は母集団が正規分布のときだけ成り立つ
          - 大数の法則は「標本平均が母平均に近づく」こと、中心極限定理は「標本平均の分布が正規分布で近似できる」こと
          - 中心極限定理によると、標本を大きくすると母集団のデータが正規分布に近づく
        answer: 3
        distractors:
          - 2 つの説明を入れ替えた
          - どちらも標本平均についての定理で、母集団の分布は変わらない
          - 平均が存在すれば分布の形によらず成り立つ
          - 正解
          - 正規分布に近づくのは標本平均の分布
        explanation: |
          **方針** 大数の法則は「どこに近づくか」（母平均）、中心極限定理は「どのようにばらつくか」（正規分布で、標準偏差 $\sigma/\sqrt n$）を述べる。

          **途中式** 標本平均は母平均のまわりに $\sigma/\sqrt n$ 程度ばらつき、その分布は正規分布で近似できる。

          **答え** 大数の法則は母平均に近づくこと、中心極限定理は正規分布で近似できること

          **間違えやすい点** どちらも、母集団の分布そのものを変えるものではない。
      - id: s07p08b
        chapter: 10
