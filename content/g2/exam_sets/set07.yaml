          - 幅の半分は 0.098 で、標本比率が 0 や 1 に近いほど幅は大きい
          - 幅の半分は 0.05 で、標本比率が 0.5 のときに幅は最大
          - 幅の半分は 0.0049 で、標本比率が 0.5 のときに幅は最大
          - 幅の半分は 0.49 で、標本比率によらず幅は一定
        answer: 0
        distractors:
