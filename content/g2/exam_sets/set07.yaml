          - 正解
          - 差の標準偏差を 1 個の標準偏差 2 とした：$P(Z>-0.5)$
          - 差の標準偏差を、2 つの標本平均の標準偏差 0.5 の和 1 とした：$P(Z>-1)$
        explanation: |
