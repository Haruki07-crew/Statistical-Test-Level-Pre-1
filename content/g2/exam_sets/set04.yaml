        answer: 0
        distractors:
          - 正解
          - 示したいこと（上がった）は対立仮説に置く
          - 調べたいのは「上がった」なので向きが逆
          - 帰無仮説には等号を置き、示したいことを対立仮説にする
          - 対立仮説を特定の値にする理由がない
        explanation: |
          **方針** 帰無仮説は「変化なし（等号）」、示したいことを対立仮説にする。

          **途中式** 「上がった」を示したいので、右片側の対立仮説 $\mu>50$。

          **答え** 帰無仮説 $\mu=50$、対立仮説 $\mu>50$

          **間違えやすい点** 片側か両側かは、データを見る前に目的から決める。
      - id: s04p11b
        chapter: 12
        terms: [p-value, significance-level]
        topic: 検定統計量の値から両側検定のp値を求めて有意水準5パーセントと1パーセントでの判断を答える
        level: 標準
        definition: false
        type: choice
        question: |
          帰無仮説のもとで標準正規分布にしたがう検定統計量の値が 2.2 だった。両側検定の p 値と、その判断の組合せとして正しいものはどれか。
        choices:
          - p 値 0.0139 で、有意水準 5% でも 1% でも棄却する
          - p 値 0.0278 で、有意水準 5% でも 1% でも棄却する
          - p 値 0.9861 で、どちらの有意水準でも棄却しない
          - p 値 0.0278 で、有意水準 5% では棄却し、1% では棄却しない
          - p 値 0.0278 で、有意水準 5% では棄却しない
        answer: 3
        distractors:
          - 両側検定なのに片側の確率を p 値とした
          - 0.0278 は 0.01 より大きいので、1% では棄却しない
          - $P(Z<2.2)$ を p 値とした
          - 正解
          - 0.0278 は 0.05 より小さいので棄却する
        explanation: |
          **方針** 両側の p 値は $2P(Z>|z|)$。p 値が有意水準より小さければ棄却する。

          **途中式** $2\times 0.0139=0.0278$。$0.0278<0.05$、$0.0278>0.01$。

          **答え** 5% では棄却し、1% では棄却しない

          **間違えやすい点** 有意水準を厳しく（小さく）すると、同じデータでも棄却されないことがある。
      - id: s04p11c
        chapter: 12
        terms: [confidence-interval-test-duality, confidence-interval]
        topic: 母平均の95パーセント信頼区間に含まれるかどうかから両側5パーセントの検定の結論を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある母平均の 95% 信頼区間（t 分布による）が (2.1, 5.3) と得られた。同じデータで有意水準 5% の両側の t 検定を行うときの結論として正しいものはどれか。
        choices:
          - 「$\mu=2$」は棄却され、「$\mu=3$」は棄却されない
          - 「$\mu=2$」も「$\mu=3$」も棄却されない
          - 「$\mu=2$」は棄却されず、「$\mu=3$」は棄却される
          - 「$\mu=2$」も「$\mu=3$」も棄却される
          - 信頼区間からは検定の結論はわからない
        answer: 0
        distractors:
          - 正解
          - 2 は区間 (2.1, 5.3) の外にあるので棄却される
          - 区間の内と外を逆にした
          - 3 は区間の中にあるので棄却されない
          - 同じデータ・同じ水準なら、区間の外の値は棄却、中の値は棄却されない
        explanation: |
          **方針** 両側 5% の検定で「$\mu=\mu_0$」が棄却されないのは、$\mu_0$ が 95% 信頼区間に含まれるときと同じ。

          **途中式** 2 は区間の外 → 棄却。3 は区間の中 → 棄却されない。

          **答え** 「$\mu=2$」は棄却され、「$\mu=3$」は棄却されない

          **間違えやすい点** 区間と検定が対応するのは、同じ統計量・同じ水準・両側検定のとき。
  - id: s04p12
    title: 2 標本・相関・適合度の検定
    context: |
      必要なら次の値を使ってよい：$t_{0.025}(9)=2.262$、$t_{0.025}(16)=2.120$、$\chi^2_{0.05}(3)=7.815$、$\chi^2_{0.05}(4)=9.488$。
    items:
      - id: s04p12a
        chapter: 13
        terms: [paired-t-test, one-sample-t-test]
        topic: 10人の前後の差の平均と標準偏差から対応のあるt統計量を求め自由度9の点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          10 人に新しい睡眠アプリを 1 週間使ってもらい、使用前後の睡眠時間の差（後 − 前、時間）を求めたところ、平均 1.5、標準偏差（不偏分散の平方根）2 だった。有意水準 5% の両側の対応のある t 検定の結果として正しいものはどれか。
        choices:
          - t ≈ 0.75 で、棄却しない
          - t ≈ 7.50 で、棄却する
          - t ≈ 2.37 で、2.262 より大きいが、片側検定ではないので棄却しない
          - t ≈ 2.37 で、2.262 より大きいので棄却する
          - t ≈ 1.19 で、棄却しない
        answer: 3
        distractors:
          - 標準偏差を $\sqrt n$ で割らなかった
          - 標準偏差を $\sqrt n$ ではなく $n$ で割った
          - 両側検定でも、|t| が上側 2.5% 点より大きければ棄却する
          - 正解
          - 標準偏差を 2 倍した値（4）を使った
        explanation: |
          **方針** 差について 1 標本の t 検定を行う：$t=\bar d/(s_d/\sqrt n)$、自由度 $n-1=9$。

          **途中式** $1.5/(2/\sqrt{10})=1.5/0.632\approx 2.37>2.262$

          **答え** t ≈ 2.37 で、棄却する

          **間違えやすい点** 同じ人の前後なので、2 標本の検定ではなく差を使う。
      - id: s04p12b
        chapter: 13
        terms: [test-correlation-coefficient, t-distribution]
        topic: 18組のデータの標本相関係数から母相関係数が0かどうかをt統計量で検定する
        level: 標準
        definition: false
        type: choice
        question: |
          18 組のデータで標本相関係数は 0.5 だった。帰無仮説「母相関係数は 0」の検定統計量 $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ を求め、有意水準 5% の両側検定を行うときの結果として正しいものはどれか。
        choices:
          - t ≈ 2.45 で、棄却する
          - t ≈ 2.31 で、2.120 より大きいので棄却する
          - t ≈ 2.67 で、棄却する
          - t ≈ 2.00 で、棄却しない
          - t ≈ 0.58 で、棄却しない
        answer: 1
        distractors:
          - $\sqrt{n-2}$ の代わりに $\sqrt n$ を使った
          - 正解
          - 分母で $1-r^2$ の平方根をとらなかった
          - 分母の $\sqrt{1-r^2}$ を忘れた
          - $\sqrt{n-2}$ を掛け忘れた（$0.5/\sqrt{0.75}$）
        explanation: |
          **方針** 帰無仮説のもとで $t$ は自由度 $n-2$ の t 分布にしたがう。

          **途中式** $\dfrac{0.5\sqrt{16}}{\sqrt{0.75}}=\dfrac{2}{0.866}\approx 2.31>t_{0.025}(16)=2.120$

          **答え** t ≈ 2.31 で、棄却する

          **間違えやすい点** 相関係数の検定の自由度は $n-2$。有意でも、相関の強さ（0.5）とは別の話。
      - id: s04p12c
        chapter: 13
        terms: [goodness-of-fit-test, poisson-distribution, pearson-chi-square-statistic]
        topic: ポアソン分布の母数をデータから推定して5つのカテゴリで適合度検定を行うときの自由度を求める
        level: 応用
        definition: false
        type: choice
        question: |
          1 日の事故件数が 0, 1, 2, 3, 4 件以上の 5 つのカテゴリに分けた度数に、ポアソン分布を当てはめる。ポアソン分布の平均はデータの標本平均で推定した。適合度検定の統計量を比べるべき有意水準 5% の点はどれか。
        choices:
          - $\chi^2_{0.05}(4)=9.488$
          - $t_{0.025}(16)=2.120$
          - $\chi^2_{0.05}(3)=7.815$
          - $\chi^2_{0.05}(5)$
          - $t_{0.025}(9)=2.262$
        answer: 2
        distractors:
          - 推定した母数の数（1）を自由度から引いていない
          - 適合度検定はカイ二乗分布を使う
          - 正解
          - カテゴリの数をそのまま自由度にした
          - 適合度検定はカイ二乗分布を使う
        explanation: |
          **方針** 自由度 ＝ カテゴリの数 − 1 − 推定した母数の数。

          **途中式** $5-1-1=3$

          **答え** $\chi^2_{0.05}(3)=7.815$

          **間違えやすい点** 母数をデータから推定すると、その分だけ当てはまりが良くなるので自由度を減らす。
  - id: s04p13
    title: 回帰分析の表
    context: |
      回帰分析の結果を読む。必要なら $F_{0.05}(1,20)=4.351$ を使ってよい。
    items:
      - id: s04p13a
        chapter: 14
        terms: [coefficient-of-determination, regression-output]
        topic: 決定係数0.64の意味を目的変数の変動のうち回帰で説明できる割合として正しく解釈する
        level: 基本
        definition: false
        type: choice
        question: |
          ある単回帰分析の決定係数は 0.64 だった。正しい記述はどれか。
        choices:
          - 予測値の 64% が実際の値と一致する
          - 回帰直線の傾きは 0.64 である
          - 相関係数は 0.64 である
          - 説明変数を 1 増やすと、目的変数は 64% 増える
          - 目的変数の変動のうち、64% が回帰直線で説明される
        answer: 4
        distractors:
          - 決定係数は一致する割合ではない
          - 傾きとは別の量
          - 単回帰では決定係数は相関係数の 2 乗なので、相関係数は ±0.8
          - 傾きの解釈と取り違えた
          - 正解
        explanation: |
          **方針** 決定係数 ＝ 回帰で説明される変動 ÷ 全体の変動 ＝ $1-$（残差平方和 ÷ 全体の平方和）。

          **途中式** 単回帰では $R^2=r^2$ なので $|r|=0.8$。

          **答え** 変動の 64% が回帰直線で説明される

          **間違えやすい点** 決定係数が高くても、因果関係や外挿の妥当性を保証するものではない。
      - id: s04p13b
        chapter: 14
        terms: [overall-f-test-regression, sum-of-squares-decomposition, anova-table]
        topic: 単回帰の分散分析表の回帰と残差の平方和からF統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          22 組のデータの単回帰分析で、回帰の平方和が 360、残差の平方和が 140 だった。回帰の F 統計量はいくらか。
        choices:
          - '2.57'
          - '54.0'
          - '0.72'
          - '51.4'
          - '18.0'
        answer: 3
        distractors:
          - 平方和の比をそのままとった（自由度で割っていない）
          - 残差の自由度を 21 とした（正しくは 22 − 2 ＝ 20）
          - 決定係数を答えた
          - 正解
          - 回帰の平方和を残差の自由度で割っただけ
        explanation: |
          **方針** 自由度は回帰 1、残差 $n-2=20$。$F=$（回帰の平均平方）÷（残差の平均平方）。

          **途中式** $\dfrac{360/1}{140/20}=\dfrac{360}{7}\approx 51.4$

          **答え** 51.4

          **間違えやすい点** 決定係数は $360/500=0.72$。単回帰では F は傾きの t 値の 2 乗に等しい。
      - id: s04p13c
        chapter: 14
        terms: [dummy-variable, multiple-regression-model]
        topic: 3つの地域を2つのダミー変数で表した回帰で係数を基準の地域との差として解釈する
        level: 応用
        definition: false
        type: choice
        question: |
          店舗の売上 $y$（万円）を、地域（北・中・南の 3 つ）で説明する。北を基準とし、中なら 1 の $d_1$、南なら 1 の $d_2$ の 2 つのダミー変数を使って $\hat y=200+30d_1-20d_2$ を得た。正しい記述はどれか。
        choices:
          - 中の平均は 30 万円、南の平均は −20 万円と推定される
          - 南の平均は中より 10 万円多いと推定される
          - 3 つの地域を表すには、ダミー変数が 3 つ必要である
          - 北の平均は 230 万円と推定される
          - 中の平均は北より 30 万円多く、南の平均は北より 20 万円少ないと推定される
        answer: 4
        distractors:
          - 係数は基準（北）との差で、平均そのものではない
          - 南は 180、中は 230 で、南は中より 50 万円少ない
          - 3 つ使うと切片と区別できなくなる（カテゴリの数 − 1 個でよい）
          - 北は両方のダミーが 0 なので 200
          - 正解
        explanation: |
          **方針** 基準の地域は切片、ダミーの係数は基準との差。

          **途中式** 北 200、中 $200+30=230$、南 $200-20=180$。

          **答え** 中は北より 30 万円多く、南は北より 20 万円少ない

          **間違えやすい点** $k$ 個のカテゴリは $k-1$ 個のダミーで表す。全部入れると多重共線性で推定できない。
  - id: s04p14
    title: 4 つの処理の比較
    context: |
      4 種類の処理を比べる実験を考える。必要なら $F_{0.05}(3,12)=3.490$ を使ってよい。
    items:
      - id: s04p14a
        chapter: 15
        terms: [one-way-anova, anova-table]
        topic: 一元配置分散分析の帰無仮説がすべての群の母平均が等しいことであると答える
        level: 基本
        definition: true
        type: choice
        question: |
          4 つの処理の効果を一元配置分散分析で比べる。この分析の帰無仮説として正しいものはどれか。
        choices:
          - 4 つの処理の母平均はすべて異なる
          - 4 つの処理の母分散はすべて異なる
          - 少なくとも 1 組の処理の母平均が異なる
          - 4 つの処理の標本平均はすべて等しい
          - 4 つの処理の母平均はすべて等しい
        answer: 4
        distractors:
          - 対立仮説でもない（少なくとも 1 組が違えばよい）
          - 分散分析は平均の比較で、母分散は等しいと仮定する
          - これは対立仮説
          - 仮説は母数（母平均）について立てる
          - 正解
        explanation: |
          **方針** 分散分析は「すべての母平均が等しい」かどうかを、F 比で調べる。

          **途中式** 帰無仮説 $\mu_1=\mu_2=\mu_3=\mu_4$、対立仮説「少なくとも 1 組が異なる」。

          **答え** 4 つの処理の母平均はすべて等しい

          **間違えやすい点** 棄却されても、どの組が違うかまではわからない。
      - id: s04p14b
        chapter: 15
        terms: [randomized-block-design, anova-table, fisher-three-principles]
        topic: 4処理と5ブロックの乱塊法の分散分析で誤差の自由度を処理とブロックの自由度の積として求める
        level: 標準
        definition: false
        type: choice
        question: |
          4 つの処理を、5 つのブロック（畑の区域）のそれぞれで 1 回ずつ行う乱塊法の実験を行った（全部で 20 区画）。分散分析表の誤差の自由度はいくらか。
        choices:
          - '12'
          - '16'
          - '15'
          - '19'
          - '3'
        answer: 0
        distractors:
          - 正解
          - ブロックを考えない一元配置の誤差の自由度（20 − 4）
          - ブロックの自由度だけを全体から引いた（20 − 5）
          - 全体の自由度
          - 処理の自由度
        explanation: |
          **方針** 自由度：全体 $20-1=19$、処理 $4-1=3$、ブロック $5-1=4$、誤差は残り。

          **途中式** $19-3-4=12$（$=(4-1)(5-1)$）

          **答え** 12

          **間違えやすい点** ブロックの違いを分けて取り出すので、誤差の平方和が小さくなり処理の効果を検出しやすくなる。その代わり誤差の自由度は一元配置の 16 より小さい。
