set: 4
title: 2級 模擬試験 第4回
minutes: 90
problems:
  - id: s04p01
    title: 健康診断のデータ
    context: |
      ある会社の健康診断のデータを整理する。
    items:
      - id: s04p01a
        chapter: 1
        terms: [scales-of-measurement, data-types]
        topic: 健康診断の4つの項目を名義尺度順序尺度間隔尺度比例尺度に正しく分類する
        level: 基本
        definition: true
        type: choice
        question: |
          健康診断の次の 4 つの項目を、尺度の種類に分けた組合せとして正しいものはどれか。

          - (ア) 社員番号　(イ) 判定（A・B・C・D の 4 段階）　(ウ) 体温（℃）　(エ) 体重（kg）
        choices:
          - (ア) 名義、(イ) 順序、(ウ) 間隔、(エ) 比例
          - (ア) 比例、(イ) 順序、(ウ) 間隔、(エ) 比例
          - (ア) 名義、(イ) 名義、(ウ) 比例、(エ) 比例
          - (ア) 名義、(イ) 間隔、(ウ) 間隔、(エ) 比例
          - (ア) 順序、(イ) 順序、(ウ) 比例、(エ) 間隔
        answer: 0
        distractors:
          - 正解
          - 社員番号は数字でも区別のための記号（名義）
          - 判定には順序がある。体温（℃）の 0 は「温度がない」ではないので比例尺度ではない
          - 判定の段階の間隔が等しいとは限らない（順序）
          - 社員番号の大小に意味はない。体重は 0 が「重さがない」を表す比例尺度
        explanation: |
          **方針** 区別だけ（名義）→ 順序がある（順序）→ 差に意味がある（間隔）→ 比に意味がある（比例）。

          **途中式** 社員番号は区別だけ、判定は順序のみ、体温（℃）は差に意味があるが比には意味がない、体重は比に意味がある。

          **答え** (ア) 名義、(イ) 順序、(ウ) 間隔、(エ) 比例

          **間違えやすい点** 数字で書かれていても量とは限らない。摂氏の温度は 0 が任意に決めた点なので間隔尺度。
      - id: s04p01b
        chapter: 1
        terms: [cumulative-frequency, frequency-distribution-histogram]
        topic: 累積相対度数の表から2つの値の間に入る人数を累積相対度数の差と全体の人数で求める
        level: 標準
        definition: false
        type: choice
        question: |
          社員 200 人の最高血圧の累積相対度数は、110 未満が 0.15、120 未満が 0.35、130 未満が 0.62、140 未満が 0.80、150 未満が 0.93 だった。最高血圧が 120 以上 140 未満の社員は何人か。
        choices:
          - 54 人
          - 36 人
          - 160 人
          - 90 人
          - 45 人
        answer: 3
        distractors:
          - 120 以上 130 未満の人数だけを求めた（0.27 × 200）
          - 130 以上 140 未満の人数だけを求めた（0.18 × 200）
          - 140 未満の人数を求めた
          - 正解
          - 割合 0.45 を人数の 100 倍とした（200 を掛けていない）
        explanation: |
          **方針** 「120 以上 140 未満」の割合 ＝ 140 未満の累積相対度数 − 120 未満の累積相対度数。

          **途中式** $0.80-0.35=0.45$、$0.45\times 200=90$ 人

          **答え** 90 人

          **間違えやすい点** 累積相対度数は「その値未満」の割合。区間の割合は 2 つの累積の差で求める。
  - id: s04p02
    title: 2 つの部署の残業時間
    context: |
      部署 A と部署 B の社員の 1 か月の残業時間（時間）を、5 数要約で比べた。

      | | 最小値 | 第 1 四分位数 | 中央値 | 第 3 四分位数 | 最大値 |
      |---|---|---|---|---|---|
      | A | 10 | 20 | 25 | 35 | 50 |
      | B | 15 | 22 | 30 | 33 | 40 |
    items:
      - id: s04p02a
        chapter: 2
        terms: [box-plot, quartiles-iqr]
        topic: 2つの部署の5数要約から四分位範囲と範囲と中央値を比べて読み取れることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          この表から読み取れることとして正しいものはどれか。
        choices:
          - B の平均値は 30 時間である
          - A の社員の半数以上が 30 時間以上残業している
          - 範囲は B のほうが大きい
          - A の社員の人数は B より多い
          - 四分位範囲は A のほうが大きい
        answer: 4
        distractors:
          - 5 数要約から平均値はわからない（30 は中央値）
          - A の中央値は 25 なので、半数以上は 25 時間以下
          - 範囲は A が 40、B が 25 で A のほうが大きい
          - 5 数要約から人数はわからない
          - 正解
        explanation: |
          **方針** 四分位範囲 ＝ 第 3 四分位数 − 第 1 四分位数、範囲 ＝ 最大値 − 最小値。

          **途中式** 四分位範囲：A $35-20=15$、B $33-22=11$。範囲：A 40、B 25。

          **答え** 四分位範囲は A のほうが大きい

          **間違えやすい点** 箱ひげ図や 5 数要約からは、平均値もデータの個数もわからない。
      - id: s04p02b
        chapter: 2
        terms: [skewness-kurtosis, distribution-shape, mean-median-mode]
        topic: 平均値が中央値より大きいデータの分布の歪みの向きと歪度の符号を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          部署 A の残業時間の平均値は 28 時間で、中央値（25 時間）より大きかった。部署 A の残業時間の分布について最も適切なものはどれか。
        choices:
          - 左に裾が長く、歪度は正と考えられる
          - 右に裾が長く、歪度は正と考えられる
          - 右に裾が長く、歪度は負と考えられる
          - 左に裾が長く、歪度は負と考えられる
          - 左右対称で、歪度は 0 と考えられる
        answer: 1
        distractors:
          - 左に裾が長いと平均値は中央値より小さくなりやすく、歪度は負
          - 正解
          - 右に裾が長いとき、歪度は正
          - 平均値が中央値より大きいので、左に裾が長いとは考えにくい
          - 平均値と中央値が 3 時間違い、5 数要約でも上側（25〜50）が下側（10〜25）より広い
        explanation: |
          **方針** 大きい値の側に長い裾があると、平均値が引っ張られて中央値より大きくなる。

          **途中式** 平均値 28 ＞ 中央値 25、5 数要約でも中央値から最大値まで（25）が最小値まで（15）より長い。

          **答え** 右に裾が長く、歪度は正

          **間違えやすい点** 歪度の符号は裾の長い側と同じ向き（右に長い → 正）。
  - id: s04p03
    title: 3 つの変数の関係
    context: |
      ある地域の 30 店舗について、売場面積 $x_1$、従業員数 $x_2$、駅からの距離 $x_3$、売上 $y$ の相関係数行列を求めた。

      | | $x_1$ | $x_2$ | $x_3$ | $y$ |
      |---|---|---|---|---|
      | $x_1$ | 1 | 0.72 | −0.15 | 0.65 |
      | $x_2$ | 0.72 | 1 | −0.08 | 0.58 |
      | $x_3$ | −0.15 | −0.08 | 1 | −0.70 |
      | $y$ | 0.65 | 0.58 | −0.70 | 1 |
    items:
      - id: s04p03a
        chapter: 3
        terms: [correlation-matrix, covariance-and-correlation]
        topic: 相関係数行列から売上と最も強く直線的に関係する変数を絶対値で判断する
        level: 基本
        definition: false
        type: choice
        question: |
          売上 $y$ と最も強い直線的な関係がある変数と、その関係の向きの組合せはどれか。
        choices:
          - 売場面積 $x_1$、正の相関
          - 従業員数 $x_2$、正の相関
          - 駅からの距離 $x_3$、正の相関
          - 駅からの距離 $x_3$、負の相関
          - 売場面積 $x_1$ と従業員数 $x_2$、正の相関
        answer: 3
        distractors:
          - 正の値の中で最大のものを選んだ（強さは絶対値で比べる）
          - 0.58 は 0.70 より絶対値が小さい
          - −0.70 は負の相関
          - 正解
          - これは $x_1$ と $x_2$ の相関で、$y$ との関係ではない
        explanation: |
          **方針** 相関の強さは相関係数の絶対値で比べ、符号で向きを判断する。

          **途中式** $y$ との相関：0.65、0.58、−0.70。絶対値が最大なのは $x_3$ の 0.70。

          **答え** 駅からの距離 $x_3$、負の相関

          **間違えやすい点** 負の相関も強さは絶対値で見る。相関行列は対角線について対称で、対角成分は 1。
      - id: s04p03b
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 4組のデータから偏差の積の和をn−1で割って共分散を求め相関係数やnで割った値と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          4 店舗のデータ $(x, y)=(1, 2),\ (3, 6),\ (5, 4),\ (7, 8)$ の共分散（偏差の積の和を $n-1$ で割ったもの）はいくらか。
        choices:
          - '5.33'
          - '4.00'
          - '0.80'
          - '16.00'
          - '1.33'
        answer: 0
        distractors:
          - 正解
          - $n$ で割った
          - 相関係数を求めた
          - 偏差の積の和をそのまま答えた
          - 偏差の積の和を 3 ではなく $n\times(n-1)=12$ で割った
        explanation: |
          **方針** 平均は $\bar x=4$、$\bar y=5$。偏差の積を足して $n-1=3$ で割る。

          **途中式** 偏差は $x$：−3, −1, 1, 3、$y$：−3, 1, −1, 3。積は 9, −1, −1, 9 で合計 16。$16/3\approx 5.33$

          **答え** 5.33

          **間違えやすい点** 共分散は単位に依存する（$x$ の単位 × $y$ の単位）。相関係数は共分散を 2 つの標準偏差で割ったもの（ここでは 0.80）。
  - id: s04p04
    title: 回帰の残差の点検
    context: |
      ある回帰分析の残差を、予測値を横軸にして散布図（残差プロット）に描いた。
    items:
      - id: s04p04a
        chapter: 4
        terms: [residual-plot, residual, simple-regression]
        topic: 予測値が大きいほど残差のばらつきが大きくなる残差プロットから誤差の分散が一定でないことを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          残差は 0 のまわりに散らばっていたが、予測値が大きいほど残差の散らばりが大きくなる「扇形」になっていた。このことから考えられることとして最も適切なものはどれか。
        choices:
          - 回帰直線の傾きが 0 である
          - 残差の合計が 0 になっていないので計算の誤りがある
          - 決定係数が 1 である
          - 説明変数と目的変数の関係は完全に直線的であることが確かめられた
          - 誤差の分散が一定でない可能性がある（目的変数の対数変換などを検討する）
        answer: 4
        distractors:
          - 残差の散らばり方から傾きの大きさはわからない
          - 残差は 0 のまわりに散らばっており、合計が 0 でないとはいえない
          - 決定係数が 1 なら残差はすべて 0
          - 扇形は誤差の性質の問題で、直線の当てはまりを保証するものではない
          - 正解
        explanation: |
          **方針** 残差プロットは、回帰の前提（直線関係、誤差の分散が一定）を点検するために描く。

          **途中式** 散らばりが予測値とともに広がる → 誤差の分散が一定でない（不均一分散）。

          **答え** 誤差の分散が一定でない可能性がある

          **間違えやすい点** 曲線的なパターンなら直線関係でない可能性、扇形なら分散が一定でない可能性を示す。売上や所得のような量では、対数変換で改善することが多い。
  - id: s04p05
    title: 売上の季節変動と物価
    context: |
      ある店のデータを分析する。
    items:
      - id: s04p05a
        chapter: 5
        terms: [time-series-components, growth-rate]
        topic: 四半期の売上の表から前年同期比を求めて前期比と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          四半期の売上（百万円）は次のとおりである。2025 年 7〜9 月期の前年同期比（%）はいくらか。

          | 年 | 1〜3 月 | 4〜6 月 | 7〜9 月 | 10〜12 月 |
          |---|---|---|---|---|
          | 2024 年 | 40 | 52 | 60 | 48 |
          | 2025 年 | 44 | 55 | 66 | — |
        choices:
          - 20%
          - 6%
          - 10%
          - 37.5%
          - 5.8%
        answer: 2
        distractors:
          - 前期（2025 年 4〜6 月期）との比を求めた
          - 増加額 6 をそのまま % とした
          - 正解
          - 2024 年 10〜12 月期との比を求めた
          - 4〜6 月期どうしの前年同期比（55/52 − 1）を求めた
        explanation: |
          **方針** 前年同期比は、前年の同じ四半期と比べる。

          **途中式** $66/60-1=0.10$

          **答え** 10%

          **間違えやすい点** 前期比（$66/55-1=20\%$）は季節変動の影響を受ける。
      - id: s04p05b
        chapter: 5
        terms: [price-index, index-number]
        topic: 3品目の価格と比較時の数量からパーシェ価格指数を求めてラスパイレス指数と区別する
        level: 応用
        definition: false
        type: choice
        question: |
          3 品目の価格（円）と購入量は次のとおりである。基準時を 100 とするパーシェ価格指数に最も近いものはどれか。

          | 品目 | 基準時の価格 | 基準時の数量 | 比較時の価格 | 比較時の数量 |
          |---|---|---|---|---|
          | X | 200 | 5 | 250 | 3 |
          | Y | 120 | 10 | 120 | 12 |
          | Z | 80 | 15 | 60 | 20 |
        choices:
          - '93.13'
          - '98.53'
          - '100.00'
          - '107.37'
          - '95.79'
        answer: 0
        distractors:
          - 正解
          - 基準時の数量を使った（ラスパイレス指数）
          - 価格比（1.25、1.0、0.75）を単純に平均した
          - 分子と分母を逆にした
          - ラスパイレス指数とパーシェ指数の幾何平均（フィッシャー指数）
        explanation: |
          **方針** パーシェ指数は比較時の数量を使う：$\sum p_1q_1/\sum p_0q_1\times 100$。

          **途中式**
          - 分子：$250\times 3+120\times 12+60\times 20=750+1440+1200=3390$
          - 分母：$200\times 3+120\times 12+80\times 20=600+1440+1600=3640$
          - $3390/3640\times 100\approx 93.13$

          **答え** 93.13

          **間違えやすい点** 値上がりした X の購入が減り、値下がりした Z の購入が増えたので、比較時の数量を使うパーシェ指数はラスパイレス指数（98.53）より低くなる。
  - id: s04p06
    title: 調査の方法の選び方
    context: |
      目的に合った調査の方法を考える。
    items:
      - id: s04p06a
        chapter: 6
        terms: [population-and-sample, sampling-and-nonsampling-error]
        topic: 検査で製品を壊してしまう場合に全数調査ではなく標本調査を使う理由を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          電池の寿命を調べる検査では、電池を最後まで使い切る必要がある。この検査を、ある日に作った電池について行うときの方法として最も適切なものはどれか。
        choices:
          - 正確さのため、作った電池をすべて検査する全数調査を行う
          - 検査すると製品がなくなるので、一部を無作為に選んで調べる標本調査を行う
          - 寿命の長そうな電池を選んで検査する
          - 作った順に最初の数個だけを検査すれば十分である
          - 検査をせず、前日の結果をそのまま使う
        answer: 1
        distractors:
          - 全数調査をすると売る電池がなくなる
          - 正解
          - 意図的に選ぶと偏りが生じる
          - 最初の数個は工程の状態が違うかもしれず、無作為ではない
          - その日の製品の情報が得られない
        explanation: |
          **方針** 破壊検査では全数調査はできないので、無作為に選んだ標本から推測する。

          **途中式** 標本誤差は標本の大きさで小さくでき、無作為に選べば大きさを評価できる。

          **答え** 一部を無作為に選ぶ標本調査を行う

          **間違えやすい点** 全数調査が常に良いとは限らない。費用・時間・破壊検査の理由で標本調査を選ぶ。
      - id: s04p06b
        chapter: 6
        terms: [two-stage-sampling, cluster-sampling, stratified-sampling]
        topic: 学校を無作為に選びさらに選んだ学校の中から生徒を無作為に選ぶ方法が二段抽出法であることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          全国の中学生の睡眠時間を調べるため、まず全国の中学校から 100 校を無作為に選び、次に選んだ各学校の名簿から 20 人ずつを無作為に選んだ。この標本抽出の方法はどれか。
        choices:
          - 集落抽出法
          - 層化抽出法
          - 二段抽出法
          - 系統抽出法
          - 単純無作為抽出法
        answer: 2
        distractors:
          - 集落抽出法では、選んだ学校の生徒を全員調べる
          - 層化抽出法では、すべての層（学校）から選ぶ
          - 正解
          - 一定の間隔で選ぶ方法ではない
          - 全国の中学生の名簿から直接選んではいない
        explanation: |
          **方針** 抽出を 2 段階（学校 → 生徒）で行っている。

          **途中式** 1 段目で学校（第 1 次抽出単位）、2 段目で生徒（第 2 次抽出単位）を選ぶ。

          **答え** 二段抽出法

          **間違えやすい点** 全国の生徒の名簿がなくても実施できるのが利点。ただし同じ学校の生徒は似ていることが多く、同じ人数の単純無作為抽出より精度は下がりやすい。
  - id: s04p07
    title: 機械の故障と賞金
    context: |
      確率と期待値を考える。
    items:
      - id: s04p07a
        chapter: 7
        terms: [independence-of-events, events-and-probability]
        topic: 独立に故障する2台の機械で少なくとも1台が故障する確率を余事象で求める
        level: 基本
        definition: false
        type: choice
        question: |
          機械 A、B がある日に故障する確率は、それぞれ 0.1、0.2 で、2 台の故障は独立である。少なくとも 1 台が故障する確率はいくらか。
        choices:
          - '0.30'
          - '0.02'
          - '0.28'
          - '0.72'
          - '0.26'
        answer: 2
        distractors:
          - 確率を足しただけ（両方故障する場合を 2 回数えている）
          - 両方とも故障する確率
          - 正解
          - どちらも故障しない確率
          - 両方が故障する確率 0.02 を 2 回引いた
        explanation: |
          **方針** 余事象「どちらも故障しない」を使う。独立なので確率を掛けられる。

          **途中式** $1-(1-0.1)(1-0.2)=1-0.72=0.28$（加法定理でも $0.1+0.2-0.02=0.28$）

          **答え** 0.28

          **間違えやすい点** 「少なくとも 1 つ」は余事象で求めると簡単。
      - id: s04p07b
        chapter: 7
        terms: [conditional-probability, counting]
        topic: 2個のさいころで1個目が6とわかったときに目の和が10以上になる条件付き確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          さいころを 2 個振る。1 個目の目が 6 であるとわかったとき、2 個の目の和が 10 以上である確率はいくらか。
        choices:
          - 1/6
          - 1/2
          - 1/12
          - 1/3
          - 2/3
        answer: 1
        distractors:
          - 和が 10 以上になる 6 通りを 36 通りで割った（条件を使っていない）
          - 正解
          - 「1 個目が 6 で、かつ和が 10 以上」の確率（3/36）を求めた（条件付きではない）
          - 和が 11 以上（2 個目が 5・6）と取り違えた
          - 「10 以上」を 9 以上（2 個目が 3〜6）と取り違えた
        explanation: |
          **方針** 1 個目が 6 なら、和が 10 以上になるのは 2 個目が 4・5・6 のとき。

          **途中式** $P(\text{和}\ge 10\mid\text{1 個目}=6)=3/6=1/2$

          **答え** 1/2

          **間違えやすい点** 条件付き確率では、条件（1 個目が 6）を満たす 6 通りだけを全体と考える。
      - id: s04p07c
        chapter: 8
        terms: [expectation-variance-properties, probability-mass-and-density-function]
        topic: 賞金と当たる確率の表からくじ1枚の賞金の期待値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある福引きでは、1 等（賞金 1000 円）が確率 0.01、2 等（賞金 100 円）が確率 0.1 で当たり、それ以外ははずれ（0 円）である。1 回の福引きの賞金の期待値は何円か。
        choices:
          - 1100 円
          - 20 円
          - 550 円
          - 11 円
          - 10 円
        answer: 1
        distractors:
          - 賞金を足しただけ
          - 正解
          - 賞金の平均（確率を考えていない）
          - 確率を足して 100 倍した
          - 1 等の分だけを計算した
        explanation: |
          **方針** 期待値 ＝ Σ（賞金 × 確率）。

          **途中式** $1000\times 0.01+100\times 0.1+0\times 0.89=10+10=20$

          **答え** 20 円

          **間違えやすい点** はずれの確率 0.89 も含めて、確率の合計が 1 になっていることを確かめる。
  - id: s04p08
    title: 同時分布と分布の性質
    context: |
      確率変数の分布を調べる。
    items:
      - id: s04p08a
        chapter: 8
        terms: [joint-probability-function, marginal-distribution, independence-of-events]
        topic: 2つの確率変数の同時確率表から周辺確率と条件付き確率を求めて独立でないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$（どちらも 0 か 1）の同時確率は次のとおりである。

          | | $Y=0$ | $Y=1$ |
          |---|---|---|
          | $X=0$ | 0.30 | 0.20 |
          | $X=1$ | 0.10 | 0.40 |

          正しい記述はどれか。
        choices:
          - $P(Y=1\mid X=1)=0.4$ で、$X$ と $Y$ は独立でない
          - $P(Y=1\mid X=1)=0.8$ で、$X$ と $Y$ は独立である
          - $P(Y=1)=0.4$ で、$X$ と $Y$ は独立でない
          - $P(Y=1\mid X=1)=0.67$ で、$X$ と $Y$ は独立である
          - $P(Y=1\mid X=1)=0.8$ で、$X$ と $Y$ は独立でない
        answer: 4
        distractors:
          - 同時確率 $P(X=1,Y=1)$ を条件付き確率とした
          - $P(Y=1)=0.6$ と $P(Y=1\mid X=1)=0.8$ が違うので独立ではない
          - $P(Y=1)$ は周辺確率 $0.20+0.40=0.6$
          - $P(X=1\mid Y=1)=0.4/0.6$ と取り違えた
          - 正解
        explanation: |
          **方針** 周辺確率 $P(X=1)=0.5$、$P(Y=1)=0.6$。条件付き確率 ＝ 同時確率 ÷ 周辺確率。

          **途中式** $P(Y=1\mid X=1)=0.40/0.50=0.8\neq P(Y=1)=0.6$。また $P(X=1)P(Y=1)=0.3\neq 0.4$。

          **答え** $P(Y=1\mid X=1)=0.8$ で、独立でない

          **間違えやすい点** 独立なら、すべてのセルで「同時確率 ＝ 周辺確率の積」が成り立つ。
      - id: s04p08b
        chapter: 9
        terms: [binomial-distribution, expectation-variance-properties]
        topic: 二項分布の試行回数と成功確率から成功回数の期待値と分散を公式で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある広告メールを読んだ人が商品を購入する確率は 0.2 である。50 人がメールを読むとき、購入する人数 $X$ の期待値と分散の組合せはどれか（購入は互いに独立とする）。
        choices:
          - 期待値 10、分散 10
          - 期待値 10、分散 2.83
          - 期待値 10、分散 8
          - 期待値 0.2、分散 0.16
          - 期待値 10、分散 40
        answer: 2
        distractors:
          - 分散をポアソン分布のように期待値と同じとした
          - 標準偏差を答えた
          - 正解
          - 1 人分（ベルヌーイ分布）の期待値と分散
          - $n(1-p)$ を分散とした（$p$ を掛け忘れた）
        explanation: |
          **方針** $X\sim B(50,\ 0.2)$。期待値 $np$、分散 $np(1-p)$。

          **途中式** $50\times 0.2=10$、$50\times 0.2\times 0.8=8$

          **答え** 期待値 10、分散 8

          **間違えやすい点** 二項分布の分散は期待値より小さい（$1-p$ を掛ける）。
      - id: s04p08c
        chapter: 9
        terms: [geometric-distribution, bernoulli-distribution]
        topic: 成功確率0.2の試行を繰り返して初めて成功するのが3回目である確率と初めて成功するまでの回数の期待値を求める
        level: 応用
        definition: false
        type: choice
        question: |
          成功する確率が 0.2 の独立な試行をくり返す。初めて成功するのがちょうど 3 回目である確率と、初めて成功するまでの試行の回数（成功した回を含む）の期待値の組合せはどれか。
        choices:
          - 確率 0.008、期待値 5
          - 確率 0.128、期待値 5
          - 確率 0.512、期待値 5
          - 確率 0.128、期待値 4
          - 確率 0.384、期待値 5
        answer: 1
        distractors:
          - 3 回とも成功する確率を求めた
          - 正解
          - 3 回とも失敗する確率を求めた
          - 期待値を失敗の回数（$q/p$）で答えた
          - 「3 回中 1 回成功」の確率（$3\times 0.128$）とした（順番を考えていない）
        explanation: |
          **方針** 初めて成功する回数は幾何分布：$P(X=k)=(1-p)^{k-1}p$、期待値 $1/p$。

          **途中式** $0.8^2\times 0.2=0.128$、期待値 $1/0.2=5$ 回

          **答え** 確率 0.128、期待値 5

          **間違えやすい点** 「初めて」なので 1・2 回目は失敗、3 回目は成功の 1 通りだけ。失敗の回数で数える流儀では期待値は $0.8/0.2=4$。
  - id: s04p09
    title: 正規近似と有限母集団
    context: |
      必要なら次の値を使ってよい：$P(Z>1.95)=0.0256$、$P(Z>2.00)=0.0228$、$P(Z>2.05)=0.0202$。
    items:
      - id: s04p09a
        chapter: 10
        terms: [normal-approximation-binomial-poisson, binomial-distribution]
        topic: 二項分布B400と0.5を正規分布で近似するときの平均と標準偏差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          二項分布 $B(400,\ 0.5)$ を正規分布で近似する。近似に使う正規分布の平均と標準偏差の組合せはどれか。
        choices:
          - 平均 200、標準偏差 100
          - 平均 200、標準偏差 20
          - 平均 200、標準偏差 10
          - 平均 0.5、標準偏差 0.025
          - 平均 200、標準偏差 14.1
        answer: 2
        distractors:
          - 分散 $np(1-p)=100$ を標準偏差とした
          - 標準偏差を $\sqrt{n}=20$ とした（$p(1-p)$ を掛け忘れた）
          - 正解
          - 回数ではなく割合（標本比率）の平均と標準偏差
          - $\sqrt{np}$ を標準偏差とした（$1-p$ を掛け忘れた）
        explanation: |
          **方針** $B(n,p)$ は平均 $np$、分散 $np(1-p)$ の正規分布で近似できる。

          **途中式** $400\times 0.5=200$、$\sqrt{400\times 0.5\times 0.5}=\sqrt{100}=10$

          **答え** 平均 200、標準偏差 10

          **間違えやすい点** 標準偏差は分散の平方根。$np$ と $n(1-p)$ が十分大きい（目安として 5 以上）ときに近似がよい。
      - id: s04p09b
        chapter: 10
        terms: [normal-approximation-binomial-poisson, continuity-correction, poisson-distribution]
        topic: 平均100のポアソン分布で120以上となる確率を連続修正つきの正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある店の 1 日の来店者数は平均 100 人のポアソン分布にしたがう。来店者数が 120 人以上になる確率を、連続修正を行った正規近似で求めるといくらか。
        choices:
          - '0.0228'
          - '0.0202'
          - '0.9744'
          - '0.0512'
          - '0.0256'
        answer: 4
        distractors:
          - 連続修正をしなかった
          - 120.5 で標準化した（修正の向きが逆）
          - 120 人未満の確率を求めた
          - 両側の確率を求めた
          - 正解
        explanation: |
          **方針** ポアソン分布 $Po(\lambda)$ は、$\lambda$ が大きいとき平均 $\lambda$、分散 $\lambda$ の正規分布で近似できる。

          **途中式** 標準偏差 $\sqrt{100}=10$、「120 以上」は 119.5 から：$(119.5-100)/10=1.95$、$P(Z>1.95)=0.0256$

          **答え** 0.0256

          **間違えやすい点** ポアソン分布は分散も $\lambda$ なので、標準偏差は $\sqrt{\lambda}$（10）。正確なポアソン確率は約 0.028。
      - id: s04p09c
        chapter: 10
        terms: [finite-population-correction, sampling-distribution-of-mean]
        topic: 1000人の母集団から100人を戻さずに抽出したときの標本平均の標準偏差を有限母集団修正を掛けて求める
        level: 応用
        definition: false
        type: choice
        question: |
          1000 人の社員（得点の母標準偏差 10）から、100 人を戻さずに無作為に抽出する。標本平均の標準偏差に最も近いものはどれか。
        choices:
          - '1.000'
          - '0.901'
          - '0.100'
          - '0.949'
          - '0.095'
        answer: 3
        distractors:
          - 有限母集団修正をしなかった（戻して抽出する場合の値）
          - 修正の係数 $(N-n)/(N-1)$ の平方根をとらずに掛けた
          - 母標準偏差を $n$ で割った
          - 正解
          - 母標準偏差を $n$ で割ってから修正を掛けた
        explanation: |
          **方針** 戻さずに抽出するときは、$\dfrac{\sigma}{\sqrt n}\sqrt{\dfrac{N-n}{N-1}}$。

          **途中式** $\dfrac{10}{\sqrt{100}}\sqrt{\dfrac{900}{999}}=1\times 0.949\approx 0.949$

          **答え** 0.949

          **間違えやすい点** 母集団の 1 割を抽出しているので、標準偏差は約 5% 小さくなる。母集団が標本よりずっと大きければ修正はほぼ 1。
  - id: s04p10
    title: 区間推定
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$z_{0.005}=2.576$、$t_{0.025}(14)=2.145$、$t_{0.025}(16)=2.120$、$t_{0.05}(14)=1.761$。
    items:
      - id: s04p10a
        chapter: 11
        terms: [ci-proportion, confidence-interval]
        topic: 100人中20人という標本比率から母比率の95パーセント信頼区間を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある町で無作為に選んだ 100 世帯のうち、20 世帯が電気自動車を持っていた。電気自動車を持つ世帯の母比率の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (0.134, 0.266)
          - (0.102, 0.298)
          - (0.097, 0.303)
          - (0.122, 0.278)
          - (0.197, 0.203)
        answer: 3
        distractors:
          - 1.645 を使った（90% 信頼区間）
          - 標本比率の代わりに 0.5 を使って標準誤差を計算した（$\sqrt{0.25/100}$）
          - 2.576 を使った（99% 信頼区間）
          - 正解
          - 平方根をとらずに $0.16/100$ に 1.96 を掛けた
        explanation: |
          **方針** $\hat p\pm 1.96\sqrt{\hat p(1-\hat p)/n}$。

          **途中式** $\sqrt{0.2\times 0.8/100}=0.04$、$0.2\pm 1.96\times 0.04=0.2\pm 0.0784$

          **答え** (0.122, 0.278)

          **間違えやすい点** 標準誤差の計算には標本比率 0.2 を使う。
      - id: s04p10b
        chapter: 11
        terms: [consistent-estimator, unbiased-estimator]
        topic: 標本平均が母平均の不偏推定量であり一致推定量でもあることの意味を判断する
        level: 標準
        definition: true
        type: choice
        question: |
          母平均 $\mu$ の推定量としての標本平均 $\bar X$ について、正しい記述はどれか。
        choices:
          - 期待値が $\mu$ に等しく（不偏性）、標本を大きくすると $\mu$ に近づく（一致性）
          - 期待値は $\mu$ に等しいが、標本を大きくしても $\mu$ には近づかない
          - 標本を大きくすると $\mu$ に近づくが、期待値は $\mu$ と等しくない
          - どんな標本でも $\bar X=\mu$ となる
          - 標本の大きさによらず、分散は母分散 $\sigma^2$ に等しい
        answer: 0
        distractors:
          - 正解
          - 分散 $\sigma^2/n$ が 0 に近づくので、$\mu$ に近づく（一致性がある）
          - $E[\bar X]=\mu$ なので不偏
          - 標本ごとにぶれる
          - 分散は $\sigma^2/n$
        explanation: |
          **方針** 不偏性：期待値が推定したい値に等しい。一致性：標本を大きくすると推定したい値に近づく。

          **途中式** $E[\bar X]=\mu$、$V[\bar X]=\sigma^2/n\to 0$

          **答え** 不偏性と一致性の両方をもつ

          **間違えやすい点** $n$ で割った標本分散は不偏ではないが一致性はある。2 つの性質は別のもの。
      - id: s04p10c
        chapter: 11
        terms: [ci-two-sample-mean-difference, pooled-variance]
        topic: 小さな2標本でプールした分散を使い自由度14のt分布の点で母平均の差の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの教材で 8 人ずつ学習した結果、教材 A は平均 25 点・不偏分散 9、教材 B は平均 21 点・不偏分散 7 だった。母分散は等しいと仮定し、母平均の差（A − B）の 95% 信頼区間を求めると、どれに最も近いか。
        choices:
          - (1.23, 6.77)
          - (0.97, 7.03)
          - (1.00, 7.00)
          - (1.51, 6.49)
          - (−2.07, 10.07)
        answer: 1
        distractors:
          - t 分布ではなく 1.96 を使った
          - 正解
          - 自由度を 16 とした
          - 上側 5% 点を使った（90% 信頼区間）
          - プールした分散に $1/n_1+1/n_2$ を掛け忘れた
        explanation: |
          **方針** $s_p^2=\dfrac{7\times 9+7\times 7}{14}=8$、標準誤差 $\sqrt{8(1/8+1/8)}=\sqrt 2$、自由度 14。

          **途中式** $4\pm 2.145\times 1.414=4\pm 3.03$

          **答え** (0.97, 7.03)

          **間違えやすい点** 自由度は $n_1+n_2-2=14$。区間が 0 を含まないので、有意水準 5% で差があるといえる。
      - id: s04p10d
        chapter: 11
        terms: [confidence-coefficient, confidence-interval]
        topic: 同じデータで信頼係数を95パーセントから99パーセントに上げたときの区間の幅の倍率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          母分散が既知の正規母集団で、母平均の 95% 信頼区間の幅が 10 だった。同じデータで 99% 信頼区間を作ると、幅はいくらか。
        choices:
          - 約 7.6
          - 10
          - 約 13.1
          - 約 15.7
          - 約 10.4
        answer: 2
        distractors:
          - 信頼係数を上げると区間は狭くなるとした（1.96/2.576 倍）
          - 幅は信頼係数によらないとした
          - 正解
          - 2.576/1.645 倍とした（90% との比）
          - 0.99/0.95 倍とした
        explanation: |
          **方針** 幅は $2z\sigma/\sqrt n$ で、$z$ に比例する。

          **途中式** $10\times 2.576/1.96\approx 13.1$

          **答え** 約 13.1

          **間違えやすい点** 信頼係数を上げる（外れにくくする）と、区間は広くなる。
  - id: s04p11
    title: 検定の手順
    context: |
      必要なら次の値を使ってよい：$P(Z>2.2)=0.0139$、$t_{0.025}(9)=2.262$、$t_{0.025}(16)=2.120$。
