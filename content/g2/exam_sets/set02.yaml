set: 2
title: 2級 模擬試験 第2回
minutes: 90
problems:
  - id: s02p01
    title: 小テストの得点
    context: |
      ある授業の小テスト（100 点満点）の 15 人の得点を幹葉図にまとめた（単位：4｜2 は 42 点）。

      | 幹 | 葉 |
      |---|---|
      | 4 | 2 7 |
      | 5 | 1 3 5 8 |
      | 6 | 1 2 2 6 9 |
      | 7 | 3 5 |
      | 8 | 1 |
      | 9 | 4 |
    items:
      - id: s02p01a
        chapter: 1
        terms: [stem-and-leaf-plot, mean-median-mode]
        topic: 幹葉図から15人の得点を読み取り中央値を求めて平均値や最頻値と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          15 人の得点の中央値はどれか。
        choices:
          - 61 点
          - 63.3 点
          - 68 点
          - 62 点
          - 60 点
        answer: 3
        distractors:
          - 60 点台の最初の葉を中央値とした（7 番目の値）
          - 平均値（合計 949 ÷ 15）を答えた
          - 最小値と最大値の真ん中（(42 ＋ 94) ÷ 2）を答えた
          - 正解
          - 葉の数が最も多い幹（60 点台）の下端を答えた
        explanation: |
          **方針** 15 個なので、小さい順に 8 番目の値が中央値。

          **途中式** 40 点台 2 個、50 点台 4 個で 6 個。60 点台の葉 1, 2, 2, 6, 9 の 2 番目（全体の 8 番目）は 62 点。

          **答え** 62 点

          **間違えやすい点** 幹ごとの葉の数を足して、何番目かを正しく数える。平均値は $949/15\approx 63.3$ 点で、94 点のような大きな値に引っ張られて中央値より大きい。62 点は 2 回現れるので最頻値でもある。
  - id: s02p02
    title: 3 科目の成績
    context: |
      ある模擬試験の 3 科目について、受験者全体の平均点・標準偏差と、B さんの得点は次のとおりだった。偏差値は 50 ＋ 10 ×（得点 − 平均点）÷ 標準偏差 で求める。

      | 科目 | 平均点 | 標準偏差 | B さんの得点 |
      |---|---|---|---|
      | 国語 | 60 | 16 | 68 |
      | 数学 | 70 | 5 | 74 |
      | 英語 | 40 | 4 | 45 |
    items:
      - id: s02p02a
        chapter: 2
        terms: [standard-score, sample-variance-sd]
        topic: 平均と標準偏差の違う3科目の得点を偏差値に直して偏差値60を超える科目を判定する
        level: 基本
        definition: false
        type: choice
        question: |
          B さんの偏差値が 60 を超える科目はどれか。
        choices:
          - 数学と英語
          - 国語だけ
          - 3 科目すべて
          - 英語だけ
          - どの科目も 60 を超えない
        answer: 3
        distractors:
          - 数学の偏差値は 58 で 60 を超えない
          - 国語は平均との差（8 点）が最も大きいが、標準偏差も大きく偏差値は 55
          - 国語は 55、数学は 58 で 60 を超えない
          - 正解
          - 英語の偏差値は 62.5 で 60 を超える
        explanation: |
          **方針** 標準得点（得点 − 平均）÷ 標準偏差 を求め、偏差値 ＝ 50 ＋ 10 × 標準得点 に直す。

          **途中式**
          - 国語：$(68-60)/16=0.5$ → 55
          - 数学：$(74-70)/5=0.8$ → 58
          - 英語：$(45-40)/4=1.25$ → 62.5

          **答え** 英語だけ

          **間違えやすい点** 平均点との差は国語が 8 点で最も大きいが、国語は散らばりも大きいので、集団の中の位置は英語のほうが上になる。
  - id: s02p03
    title: 所得の格差
    context: |
      ある国の世帯を所得の少ない順に 5 等分（各 20%）したとき、各グループが所得全体に占める割合は、少ない順に 5%、10%、15%、25%、45% だった。
    items:
      - id: s02p03a
        chapter: 2
        terms: [lorenz-curve-gini, cumulative-frequency]
        topic: 所得の5分位の構成比からローレンツ曲線の下の面積を台形で求めてジニ係数を計算する
        level: 応用
        definition: false
        type: choice
        question: |
          ローレンツ曲線を折れ線で描き、ジニ係数を求めるといくらか。
        choices:
          - '0.31'
          - '0.19'
          - '0.69'
          - '0.45'
          - '0.38'
        answer: 4
        distractors:
          - ローレンツ曲線の下の面積を答えた
          - 完全平等線との間の面積（0.5 − 0.31）を 2 倍しなかった
          - 1 からローレンツ曲線の下の面積を引いただけ
          - 最上位のグループの割合を答えた
          - 正解
        explanation: |
          **方針** 累積割合 0.05, 0.15, 0.30, 0.55, 1.00 を結ぶ折れ線の下の面積を、幅 0.2 の台形の和で求め、$G=1-2\times(\text{面積})$。

          **途中式**
          $$0.2\times\frac{(0+0.05)+(0.05+0.15)+(0.15+0.30)+(0.30+0.55)+(0.55+1.00)}{2}=0.1\times 3.1=0.31$$
          $G=1-2\times 0.31=0.38$

          **答え** 0.38

          **間違えやすい点** ジニ係数は、完全平等線との間の面積（$0.5-0.31=0.19$）を三角形の面積 0.5 で割ったもの、つまりその 2 倍である。
  - id: s02p04
    title: 地域と意見のクロス表、3 つの変数の相関
    context: |
      地域の住民調査について考える。
    items:
      - id: s02p04a
        chapter: 3
        terms: [cross-tabulation, expected-frequency]
        topic: 年代と賛否のクロス表で年代ごとの賛成の割合を行パーセントとして求め全体に対する割合と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          新しい公園の計画について、年代別に賛否をたずねた。

          | | 賛成 | 反対 | 計 |
          |---|---|---|---|
          | 40 歳未満 | 72 | 48 | 120 |
          | 40 歳以上 | 45 | 35 | 80 |
          | 計 | 117 | 83 | 200 |

          「40 歳未満の人のうち賛成の人の割合」と「40 歳以上の人のうち賛成の人の割合」の組合せとして正しいものはどれか。
        choices:
          - 61.5% と 38.5%
          - 36% と 22.5%
          - 60% と 56.25%
          - 60% と 43.75%
          - 58.5% と 58.5%
        answer: 2
        distractors:
          - 賛成の 117 人を分母にした（列パーセント）
          - 全体の 200 人を分母にした
          - 正解
          - 40 歳以上について、反対の割合（35/80）を答えた
          - 年代を区別せず、全体の賛成の割合（117/200）を両方に答えた
        explanation: |
          **方針** 年代ごとに比べるので、各行の合計で割る（行パーセント）。

          **途中式** $72/120=0.60$、$45/80=0.5625$

          **答え** 60% と 56.25%

          **間違えやすい点** $72/117\approx 61.5\%$ は「賛成の人のうち 40 歳未満の割合」で、比べたい量と違う。分母を何にするかで意味が変わる。
      - id: s02p04b
        chapter: 3
        terms: [partial-correlation-coefficient, spurious-correlation]
        topic: 3つの変数の相関係数から第3の変数の影響を除いた偏相関係数を公式で計算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある地域の 50 の町について、商店の数 $x$、交通事故の件数 $y$、人口 $z$ を調べたところ、相関係数は $r_{xy}=0.6$、$r_{xz}=0.8$、$r_{yz}=0.7$ だった。$z$ の影響を除いた $x$ と $y$ の偏相関係数に最も近いものはどれか。
        choices:
          - '0.60'
          - '0.04'
          - '0.22'
          - '0.56'
          - '0.09'
        answer: 4
        distractors:
          - 元の相関係数をそのまま答えた
          - 分子（$r_{xy}-r_{xz}r_{yz}$）だけを計算した
          - 分母で平方根をとらなかった
          - $r_{xz}\times r_{yz}$ を答えた
          - 正解
        explanation: |
          **方針** $r_{xy\cdot z}=\dfrac{r_{xy}-r_{xz}r_{yz}}{\sqrt{(1-r_{xz}^2)(1-r_{yz}^2)}}$。

          **途中式** 分子 $0.6-0.8\times 0.7=0.04$、分母 $\sqrt{0.36\times 0.51}=\sqrt{0.1836}\approx 0.428$、$0.04/0.428\approx 0.09$

          **答え** 0.09

          **間違えやすい点** 人口の多い町ほど商店も事故も多いので、元の相関 0.6 の大部分は人口による擬似相関で、人口の影響を除くとほぼ 0 になる。
  - id: s02p05
    title: 勉強時間と得点の回帰
    context: |
      ある学年の生徒について、1 日の勉強時間 $x$（時間）と試験の得点 $y$（点）を調べた。$x$ の平均 5、標準偏差 4、$y$ の平均 60、標準偏差 12、相関係数 0.6 だった。
    items:
      - id: s02p05a
        chapter: 4
        terms: [simple-regression, coefficient-of-determination]
        topic: 相関係数と2つの標準偏差から回帰の傾きを求め決定係数を相関係数の2乗として求める
        level: 標準
        definition: false
        type: choice
        question: |
          $y$ を $x$ で説明する回帰直線の傾きと、決定係数の組合せとして正しいものはどれか。
        choices:
          - 傾き 0.6、決定係数 0.36
          - 傾き 1.8、決定係数 0.60
          - 傾き 0.2、決定係数 0.36
          - 傾き 1.8、決定係数 0.36
          - 傾き 3.0、決定係数 0.36
        answer: 3
        distractors:
          - 相関係数をそのまま傾きとした
          - 決定係数を相関係数と同じとした（2 乗していない）
          - 標準偏差の比を逆にした（$0.6\times 4/12$）
          - 正解
          - 相関係数を掛けずに標準偏差の比だけを使った
        explanation: |
          **方針** 傾き $b=r\,s_y/s_x$、単回帰の決定係数は $r^2$。

          **途中式** $b=0.6\times 12/4=1.8$、$R^2=0.6^2=0.36$

          **答え** 傾き 1.8、決定係数 0.36

          **間違えやすい点** 傾きは相関係数に「$y$ の標準偏差 ÷ $x$ の標準偏差」を掛ける。勉強時間 1 時間あたり平均 1.8 点高い、と読む。
      - id: s02p05b
        chapter: 4
        terms: [residual, simple-regression]
        topic: 回帰直線から予測値を求めて実際の得点との差として残差を計算し符号に注意する
        level: 基本
        definition: false
        type: choice
        question: |
          回帰直線は $\hat y = 51 + 1.8x$ である。勉強時間 8 時間で 70 点だった生徒の残差はいくらか。
        choices:
          - '−4.6'
          - '4.6'
          - '65.4'
          - '10.0'
          - '8.2'
        answer: 1
        distractors:
          - 予測値 − 実際の値 と、引く順番を逆にした
          - 正解
          - 予測値を答えた
          - 得点の平均 60 との差を答えた
          - 相関係数 0.6 を傾きとして予測した（60 ＋ 0.6 × 3）
        explanation: |
          **方針** 残差 ＝ 実際の値 − 予測値。

          **途中式** 予測値 $51+1.8\times 8=65.4$、残差 $70-65.4=4.6$

          **答え** 4.6

          **間違えやすい点** 残差が正なら、その生徒は直線の上にあり、勉強時間から予測されるより得点が高い。残差の合計は 0 になる。
  - id: s02p06
    title: 来店者数と売上の推移
    context: |
      ある店の時系列データを考える。
    items:
      - id: s02p06a
        chapter: 5
        terms: [moving-average, time-series-components]
        topic: 7か月の来店者数から4か月目を中心とする5項移動平均を求め3項移動平均と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          7 か月間の月ごとの来店者数（百人）は 12, 15, 11, 14, 18, 16, 20 だった。4 か月目を中心とする 5 項移動平均はいくらか。
        choices:
          - '14.3'
          - '16.0'
          - '14.8'
          - '14.0'
          - '14.5'
        answer: 2
        distractors:
          - 3 項移動平均（11, 14, 18）を求めた
          - 5 か月目を中心とする 3 項移動平均を求めた
          - 正解
          - 1〜5 か月目の平均（3 か月目を中心とする 5 項）を求めた
          - 2〜5 か月目の 4 つだけを平均した
        explanation: |
          **方針** 4 か月目を中心に前後 2 か月ずつ、2〜6 か月目の 5 つを平均する。

          **途中式** $(15+11+14+18+16)/5=74/5=14.8$

          **答え** 14.8

          **間違えやすい点** 中心の時点を確認して、前後に同じ数ずつ取る。項数を増やすほど線はなめらかになるが、両端で計算できない月が増える。
      - id: s02p06b
        chapter: 5
        terms: [growth-rate]
        topic: 3部門の売上の増加から全体の成長率に対する1部門の寄与率を求め部門自身の成長率と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある会社の部門別の売上（億円）は次のとおりだった。全体の成長率に対する部門 A の寄与率はいくらか。

          | 部門 | A | B | C | 計 |
          |---|---|---|---|---|
          | 前年 | 100 | 200 | 100 | 400 |
          | 今年 | 120 | 210 | 110 | 440 |
        choices:
          - 20%
          - 5%
          - 25%
          - 27.3%
          - 50%
        answer: 4
        distractors:
          - 部門 A 自身の成長率（20/100）を答えた
          - 部門 A の寄与度（5 ポイント）を寄与率とした
          - 前年の売上に占める A の割合を答えた
          - 今年の売上に占める A の割合を答えた
          - 正解
        explanation: |
          **方針** 寄与度 ＝ 部門の増加分 ÷ 全体の前年の値、寄与率 ＝ 寄与度 ÷ 全体の成長率（＝ 部門の増加分 ÷ 全体の増加分）。

          **途中式** 全体の成長率 $40/400=10\%$、A の寄与度 $20/400=5$ ポイント、寄与率 $5/10=50\%$（$=20/40$）

          **答え** 50%

          **間違えやすい点** 寄与率の合計は 100%（A 50%、B 25%、C 25%）。部門自身の成長率（A は 20%）とは別の量。
  - id: s02p07
    title: 市民意識調査の設計
    context: |
      ある市（人口 10000 人）で市民意識調査を行う。
    items:
      - id: s02p07a
        chapter: 6
        terms: [sampling-and-nonsampling-error, population-and-sample]
        topic: 質問文の誤解による誤差が非標本誤差であり標本を大きくしても減らないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          予備調査で、質問文がわかりにくく、多くの回答者が質問の意味を取り違えていたことがわかった。この原因による誤差について正しい記述はどれか。
        choices:
          - 標本誤差であり、標本を大きくすれば小さくなる
          - 非標本誤差であり、標本を大きくしても小さくならない
          - 非標本誤差であり、標本を大きくすれば小さくなる
          - 標本誤差であり、全数調査にすれば生じない
          - 標本の選び方の偶然による誤差であり、無作為抽出をすれば生じない
        answer: 1
        distractors:
          - 標本誤差は、どの人が選ばれたかの偶然による誤差
          - 正解
          - 質問の誤解は人数を増やしても同じように起こる
          - 質問の誤解は全数調査でも起こる
          - 選び方ではなく、測り方（質問文）の問題である
        explanation: |
          **方針** 標本誤差は「標本の選ばれ方の偶然」による誤差、非標本誤差はそれ以外（質問文、回答の誤り、無回答、入力ミスなど）。

          **途中式** 質問文の誤解は、誰を選んでも起こる測り方の問題 → 非標本誤差。標本を大きくしても、全数調査にしても減らない。

          **答え** 非標本誤差であり、標本を大きくしても小さくならない

          **間違えやすい点** 標本誤差は標本を大きくすれば小さくなるが、非標本誤差は調査票の改善や調査員の訓練などで減らす。
      - id: s02p07b
        chapter: 6
        terms: [stratified-sampling, population-and-sample]
        topic: 3つの地区の人口に比例して200人の標本を層化抽出法の比例配分で割り当てる
        level: 標準
        definition: false
        type: choice
        question: |
          市を 3 つの地区（人口は北地区 6000 人、中地区 3000 人、南地区 1000 人）に分け、層化抽出法で合計 200 人を選ぶ。比例配分で割り当てるとき、北・中・南の各地区から選ぶ人数の組合せはどれか。
        choices:
          - 67 人・67 人・66 人
          - 20 人・60 人・120 人
          - 100 人・50 人・50 人
          - 6 人・3 人・1 人
          - 120 人・60 人・20 人
        answer: 4
        distractors:
          - 比例配分ではなく、各地区に等しく割り当てた
          - 人口の少ない地区ほど多く割り当て、比例の向きを逆にした
          - 最大の地区に半分を割り当て、残りを等分した
          - 人口の比 6：3：1 をそのまま人数とした
          - 正解
        explanation: |
          **方針** 比例配分では、各層の大きさに比例して標本を割り当てる。

          **途中式** 北 $200\times 6000/10000=120$、中 $200\times 3000/10000=60$、南 $200\times 1000/10000=20$

          **答え** 120 人・60 人・20 人

          **間違えやすい点** 層化抽出法は、すべての層から標本を選ぶ。比例配分なら、標本の地区の構成が母集団と同じになる。
  - id: s02p08
    title: 事象の独立と工場の不良品
    context: |
      確率の計算を 2 つ考える。
    items:
      - id: s02p08a
        chapter: 7
        terms: [conditional-probability, independence-of-events]
        topic: 2つの事象の確率と積事象の確率から条件付き確率を求めて独立かどうかを判定する
        level: 基本
        definition: false
        type: choice
        question: |
          事象 $A$、$B$ について $P(A)=0.4$、$P(B)=0.5$、$P(A\cap B)=0.2$ である。正しい記述はどれか。
        choices:
          - $P(A\mid B)=0.5$ で、$A$ と $B$ は独立である
          - $P(A\mid B)=0.2$ で、$A$ と $B$ は独立でない
          - $P(A\mid B)=0.4$ で、$A$ と $B$ は排反である
          - $P(A\mid B)=0.08$ で、$A$ と $B$ は独立でない
          - $P(A\mid B)=0.4$ で、$A$ と $B$ は独立である
        answer: 4
        distractors:
          - $P(B\mid A)=0.2/0.4$ と取り違えた
          - 積事象の確率を条件付き確率とした
          - $P(A\cap B)=0.2>0$ なので排反ではない
          - $P(A)\times P(A\cap B)$ を計算した
          - 正解
        explanation: |
          **方針** $P(A\mid B)=P(A\cap B)/P(B)$。$P(A\mid B)=P(A)$（つまり $P(A\cap B)=P(A)P(B)$）なら独立。

          **途中式** $P(A\mid B)=0.2/0.5=0.4=P(A)$。また $P(A)P(B)=0.4\times 0.5=0.2=P(A\cap B)$。

          **答え** $P(A\mid B)=0.4$ で、独立である

          **間違えやすい点** 独立は「一方が起きても他方の確率が変わらない」こと。排反（同時に起こらない）とは別の概念で、$P(A\cap B)>0$ なので排反ではない。
      - id: s02p08b
        chapter: 7
        terms: [law-of-total-probability, conditional-probability]
        topic: 3つの工場の生産の割合と工場ごとの不良率から全確率の公式で製品全体の不良率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある製品は工場 X・Y・Z で作られ、生産量の割合は 50%・30%・20%、各工場の不良率は 1%・2%・4% である。製品全体から 1 個を無作為に選んだとき、不良品である確率はいくらか。
        choices:
          - '0.070'
          - '0.023'
          - '0.008'
          - '0.019'
          - '0.421'
        answer: 3
        distractors:
          - 不良率を単純に足した
          - 不良率を単純に平均した（生産量の違いを考えていない）
          - 工場 Z の分（0.2 × 0.04）だけを計算した
          - 正解
          - 不良品だったときに工場 Z の製品である確率（ベイズの定理）を求めた
        explanation: |
          **方針** 全確率の公式：$P(\text{不良})=\sum P(\text{工場})P(\text{不良}\mid\text{工場})$。

          **途中式** $0.5\times 0.01+0.3\times 0.02+0.2\times 0.04=0.005+0.006+0.008=0.019$

          **答え** 0.019

          **間違えやすい点** 不良率を生産量の割合で重み付けした平均になる。不良品が工場 Z の製品である確率は $0.008/0.019\approx 0.42$ で、別の量。
  - id: s02p09
    title: 確率変数の変換と和
    context: |
      確率変数の期待値・分散・共分散を考える。
    items:
      - id: s02p09a
        chapter: 8
        terms: [expectation-variance-properties]
        topic: 期待値と分散がわかっている確率変数の1次変換の期待値と分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$ の期待値は 5、分散は 4 である。$Y=3X-2$ の期待値と分散の組合せはどれか。
        choices:
          - $E[Y]=13,\ V[Y]=12$
          - $E[Y]=13,\ V[Y]=36$
          - $E[Y]=15,\ V[Y]=36$
          - $E[Y]=13,\ V[Y]=34$
          - $E[Y]=13,\ V[Y]=10$
        answer: 1
        distractors:
          - 分散に係数 3 を 2 乗せずに掛けた
          - 正解
          - 期待値で −2 を忘れた
          - 分散からも定数 2 を引いた
          - 分散も期待値と同じように 3 × 4 − 2 とした
        explanation: |
          **方針** $E[aX+b]=aE[X]+b$、$V[aX+b]=a^2V[X]$。

          **途中式** $E[Y]=3\times 5-2=13$、$V[Y]=3^2\times 4=36$

          **答え** $E[Y]=13,\ V[Y]=36$

          **間違えやすい点** 定数を足し引きしても散らばりは変わらないので、分散には影響しない。係数は 2 乗して掛ける。
      - id: s02p09b
        chapter: 8
        terms: [sum-of-random-variables, covariance-and-correlation, expectation-variance-properties]
        topic: 2つの確率変数の分散と負の共分散から和の分散と相関係数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$ について $V[X]=4$、$V[Y]=9$、$\mathrm{Cov}[X,Y]=-2$ である。$V[X+Y]$ と、$X$ と $Y$ の相関係数の組合せとして正しいものはどれか。
        choices:
          - $V[X+Y]=13$、相関係数 $-0.33$
          - $V[X+Y]=17$、相関係数 $-0.33$
          - $V[X+Y]=9$、相関係数 $-0.33$
          - $V[X+Y]=11$、相関係数 $-0.33$
          - $V[X+Y]=9$、相関係数 $-0.06$
        answer: 2
        distractors:
          - 共分散を無視した（独立の場合の式を使った）
          - 共分散の符号を逆にした（$4+9+2\times 2$）
          - 正解
          - 共分散を 2 倍しなかった（$4+9-2$）
          - 相関係数で、標準偏差の積ではなく分散の積で割った
        explanation: |
          **方針** $V[X+Y]=V[X]+V[Y]+2\,\mathrm{Cov}[X,Y]$、相関係数 $=\mathrm{Cov}/(\sigma_X\sigma_Y)$。

          **途中式** $V[X+Y]=4+9+2\times(-2)=9$、相関係数 $=-2/(2\times 3)\approx -0.33$

          **答え** $V[X+Y]=9$、相関係数 $-0.33$

          **間違えやすい点** 負の相関があると、和の散らばりは独立の場合（13）より小さくなる。共分散は 2 倍して足す。
  - id: s02p10
    title: 問い合わせの件数と待ち時間
    context: |
      ある窓口の問い合わせについて考える。必要なら $e^{-3}=0.0498$、$e^{-0.5}=0.6065$、$e^{-1}=0.3679$、$e^{-8}=0.0003$ を使ってよい。
    items:
      - id: s02p10a
        chapter: 9
        terms: [poisson-distribution]
        topic: 1時間あたり平均3件のポアソン分布で問い合わせが1件以下である確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          1 時間あたりの問い合わせの件数は、平均 3 件のポアソン分布にしたがう。ある 1 時間の件数が 1 件以下である確率に最も近いものはどれか。
        choices:
          - '0.050'
          - '0.149'
          - '0.801'
          - '0.199'
          - '0.224'
        answer: 3
        distractors:
          - 0 件の確率だけを求めた
          - 1 件の確率だけを求めた
          - 2 件以上の確率を求めた
          - 正解
          - 2 件の確率を求めた
        explanation: |
          **方針** $P(X=k)=e^{-\lambda}\lambda^k/k!$（$\lambda=3$）。1 件以下は $k=0,1$ の和。

          **途中式** $P(X=0)=e^{-3}=0.0498$、$P(X=1)=3e^{-3}=0.1494$、合計 $4e^{-3}\approx 0.199$

          **答え** 0.199

          **間違えやすい点** 「1 件以下」は 0 件と 1 件の両方。ポアソン分布の平均と分散はどちらも $\lambda=3$。
      - id: s02p10b
        chapter: 9
        terms: [exponential-distribution, poisson-distribution]
        topic: 平均4分の指数分布にしたがう待ち時間が2分を超える確率をレートに注意して求める
        level: 標準
        definition: false
        type: choice
        question: |
          窓口での待ち時間 $T$（分）は、平均 4 分の指数分布にしたがう。待ち時間が 2 分を超える確率に最も近いものはどれか。
        choices:
          - '0.393'
          - '0.607'
          - '0.500'
          - '0.368'
          - '0.0003'
        answer: 1
        distractors:
          - 2 分以下の確率を求めた
          - 正解
          - 0〜4 分の一様分布のように直線的に計算した（1 − 2/4）
          - 平均の 4 分を超える確率を求めた
          - 平均 4 をレートとして $e^{-4\times 2}$ を計算した
        explanation: |
          **方針** 平均 4 分の指数分布はレート $\lambda=1/4$ で、$P(T>t)=e^{-\lambda t}$。

          **途中式** $P(T>2)=e^{-2/4}=e^{-0.5}\approx 0.607$

          **答え** 0.607

          **間違えやすい点** 平均とレートは逆数の関係。指数分布では平均を超える確率は $e^{-1}\approx 0.368$ で、半分（0.5）ではない。
  - id: s02p11
    title: 標本平均・標本比率の確率
    context: |
      必要なら次の値を使ってよい：$P(Z>0.5)=0.3085$、$P(Z>1)=0.1587$、$P(Z>1.90)=0.0287$、$P(Z>1.96)=0.0250$、$P(Z>2)=0.0228$。
    items:
      - id: s02p11a
        chapter: 10
        terms: [sampling-distribution-of-mean, standard-normal-distribution]
        topic: 正規母集団から4個取った標本平均がある値を超える確率を標本平均の標準偏差で標準化して求める
        level: 基本
        definition: false
        type: choice
        question: |
          正規分布 $N(10,\ 4^2)$ にしたがう母集団から大きさ 4 の標本を抽出する。標本平均が 12 を超える確率はいくらか。
        choices:
          - '0.3085'
          - '0.0228'
          - '0.1587'
          - '0.8413'
          - '0.3413'
        answer: 2
        distractors:
          - 標本平均ではなく 1 個の値として、標準偏差 4 で標準化した
          - 標準偏差を $\sqrt n$ ではなく $n$ で割った
          - 正解
          - 12 以下の確率を求めた
          - 平均と 12 の間の確率 $P(0<Z<1)$ を求めた
        explanation: |
          **方針** 標本平均は $N(10,\ 4^2/4)=N(10,\ 2^2)$ にしたがう。

          **途中式** $P(\bar X>12)=P(Z>(12-10)/2)=P(Z>1)=0.1587$

          **答え** 0.1587

          **間違えやすい点** 標本平均の標準偏差は $\sigma/\sqrt n=4/2=2$。1 個の値なら $P(Z>0.5)=0.3085$ で、平均をとるとぶれが小さくなる。
      - id: s02p11b
        chapter: 10
        terms: [normal-approximation-binomial-poisson, sampling-distribution-of-mean, central-limit-theorem]
        topic: 母比率0.4から96人を抽出したときの標本比率が0.5以上になる確率を正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある意見に賛成する人の割合が 0.4 の大きな母集団から、96 人を無作為に抽出する。標本の賛成の割合が 0.5 以上になる確率を、正規近似で（連続修正は行わずに）求めるといくらか。
        choices:
          - '0.0250'
          - '0.9772'
          - '0.0456'
          - '0.0228'
          - '0.0287'
        answer: 3
        distractors:
          - 標準偏差の計算に 0.4 ではなく 0.5 を使った（$\sqrt{0.25/96}$）
          - 0.5 未満の確率を求めた
          - 両側の確率（2 × 0.0228）を求めた
          - 正解
          - 問題の指示に反して連続修正を行った（0.5 − 1/192 で標準化して z ≈ 1.90）
        explanation: |
          **方針** 標本比率は平均 0.4、標準偏差 $\sqrt{0.4\times 0.6/96}$ の正規分布で近似する。

          **途中式** $\sqrt{0.24/96}=\sqrt{0.0025}=0.05$、$(0.5-0.4)/0.05=2$、$P(Z\ge 2)=0.0228$

          **答え** 0.0228

          **間違えやすい点** 標本比率は 0 と 1 のデータの標本平均なので、標準偏差は $\sqrt{p(1-p)/n}$。計算には母比率 0.4 を使う。
      - id: s02p11c
        chapter: 10
        terms: [chebyshev-inequality, sample-variance-sd]
        topic: 分布の形がわからない確率変数で平均から標準偏差の2倍以上離れる確率の上限をチェビシェフの不等式で求める
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$ の平均は 50、標準偏差は 5 であるが、分布の形はわからない。チェビシェフの不等式から、$P(|X-50|\ge 10)$ の上限として得られる値はどれか。
        choices:
          - '0.0456'
          - '0.25'
          - '0.5'
          - '0.75'
          - '0.01'
        answer: 1
        distractors:
          - 正規分布を仮定して両側 2σ の外の確率を求めた（分布の形はわからない）
          - 正解
          - $1/k^2$ ではなく $1/k$ とした
          - 平均から 2σ 以内の確率の下限（1 − 1/4）を答えた
          - $k$ を 10 として $1/k^2$ を計算した（$k$ は標準偏差の何倍か）
        explanation: |
          **方針** チェビシェフの不等式 $P(|X-\mu|\ge k\sigma)\le 1/k^2$。

          **途中式** $10=2\times 5$ なので $k=2$、上限は $1/2^2=0.25$

          **答え** 0.25

          **間違えやすい点** 分布の形によらずに成り立つ代わりに、正規分布の値（約 0.046）よりずっと大きい、ゆるい上限になる。
  - id: s02p12
    title: 推定量と区間推定
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$\chi^2_{0.025}(9)=19.02$、$\chi^2_{0.975}(9)=2.700$、$\chi^2_{0.05}(9)=16.92$、$\chi^2_{0.95}(9)=3.325$、$\chi^2_{0.025}(10)=20.48$、$\chi^2_{0.975}(10)=3.247$。
    items:
      - id: s02p12a
        chapter: 11
        terms: [unbiased-estimator, sample-variance-sd]
        topic: 母分散の不偏推定量が偏差平方和をn−1で割ったものであることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          母分散 $\sigma^2$ の母集団から無作為に抽出した $X_1,\dots,X_n$ と、その標本平均 $\bar X$ について、$\sigma^2$ の不偏推定量はどれか。
        choices:
          - $\dfrac{1}{n}\sum_{i=1}^n (X_i-\bar X)^2$
          - $\dfrac{1}{n}\sum_{i=1}^n (X_i-\bar X)$
          - $\dfrac{1}{n-1}\sum_{i=1}^n |X_i-\bar X|$
          - $\dfrac{1}{n^2}\sum_{i=1}^n (X_i-\bar X)^2$
          - $\dfrac{1}{n-1}\sum_{i=1}^n (X_i-\bar X)^2$
        answer: 4
        distractors:
          - 期待値が $\frac{n-1}{n}\sigma^2$ になり、平均的に小さめになる
          - 偏差の合計は 0 なので、常に 0 になる
          - 偏差の絶対値を使うと分散の推定量にならない
          - 標本平均の分散 $\sigma^2/n$ の推定にあたる量で、$\sigma^2$ の推定量ではない
          - 正解
        explanation: |
          **方針** 不偏推定量は、期待値が推定したい母数に一致する推定量。

          **途中式** $E\left[\sum(X_i-\bar X)^2\right]=(n-1)\sigma^2$ なので、$n-1$ で割ると期待値が $\sigma^2$ になる。

          **答え** $\dfrac{1}{n-1}\sum (X_i-\bar X)^2$

          **間違えやすい点** $n$ で割ると、平均 $\bar X$ を使ったぶん偏差が小さめになり、$\sigma^2$ を平均的に過小評価する。
      - id: s02p12b
        chapter: 11
        terms: [ci-two-sample-mean-difference, standard-error]
        topic: 大きな2標本の平均と標準偏差から母平均の差の95パーセント信頼区間を正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの工場の製品の重さを比べるため、それぞれ 100 個ずつ無作為に抽出した。工場 1 は平均 504 g・標準偏差 10 g、工場 2 は平均 500 g・標準偏差 12 g だった。母平均の差（工場 1 − 工場 2）の 95% 信頼区間に最も近いものはどれか（標本が大きいので正規近似を用いる）。
        choices:
          - (1.43, 6.57)
          - (−0.31, 8.31)
          - (−26.6, 34.6)
          - (0.94, 7.06)
          - (1.84, 6.16)
        answer: 3
        distractors:
          - 1.645 を使った（90% 信頼区間）
          - 標準誤差を標準偏差の和 ÷ 10 とした（分散を足していない）
          - 標準誤差の計算で標本の大きさで割らなかった
          - 正解
          - 分散の和を 2 つの標本の大きさの合計 200 で割った
        explanation: |
          **方針** 差の標準誤差は $\sqrt{s_1^2/n_1+s_2^2/n_2}$。

          **途中式** $\sqrt{100/100+144/100}=\sqrt{2.44}\approx 1.562$、$4\pm 1.96\times 1.562=4\pm 3.06$

          **答え** (0.94, 7.06)

          **間違えやすい点** 差の分散は 2 つの分散の「和」になる（標準偏差の和ではない）。区間が 0 を含まないので、平均に差があると考えられる。
      - id: s02p12c
        chapter: 11
        terms: [ci-variance, chi-squared-distribution]
        topic: 正規母集団の10個の標本の不偏分散から自由度9のカイ二乗分布の2つの点を使って母分散の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 10 の標本を抽出したところ、不偏分散は 20 だった。母分散の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (10.52, 74.07)
          - (9.46, 66.67)
          - (8.79, 55.44)
          - (2.12, 14.91)
          - (10.64, 54.14)
        answer: 1
        distractors:
          - 分子を $(n-1)s^2=180$ ではなく $ns^2=200$ とした
          - 正解
          - 自由度を 10 とした
          - 不偏分散の代わりに標準偏差 $\sqrt{20}$ を使った
          - 上側 5% 点・95% 点を使った（90% 信頼区間）
        explanation: |
          **方針** $(n-1)s^2/\sigma^2$ は自由度 $n-1$ のカイ二乗分布にしたがうので、区間は $\left(\dfrac{(n-1)s^2}{\chi^2_{0.025}(9)},\ \dfrac{(n-1)s^2}{\chi^2_{0.975}(9)}\right)$。

          **途中式** $(n-1)s^2=9\times 20=180$、$180/19.02\approx 9.46$、$180/2.700\approx 66.67$

          **答え** (9.46, 66.67)

          **間違えやすい点** 大きいほうの点で割ると下限、小さいほうの点で割ると上限になる。カイ二乗分布は左右対称ではないので、区間は不偏分散 20 について対称にならない。
      - id: s02p12d
        chapter: 11
        terms: [ci-two-sample-proportion, ci-proportion]
        topic: 2つのグループの標本比率から母比率の差の95パーセント信頼区間を各グループの分散を足して求める
        level: 応用
        definition: false
        type: choice
        question: |
          新しい広告 A と従来の広告 B を、それぞれ無作為に選んだ 200 人に見せたところ、商品に興味を持った人の割合は A が 0.60、B が 0.50 だった。母比率の差（A − B）の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (0.019, 0.181)
          - (0.093, 0.107)
          - (0.003, 0.197)
          - (−0.037, 0.237)
          - (0.032, 0.168)
        answer: 2
        distractors:
          - 1.645 を使った（90% 信頼区間）
          - 2 つの分散を足して平方根をとったあと、200 で割った（$\sqrt{0.24+0.25}/200$）
          - 正解
          - 2 つの標準誤差を足した（分散ではなく標準偏差を足した）
          - A の標準誤差だけを使った
        explanation: |
          **方針** 差の標準誤差は $\sqrt{\hat p_A(1-\hat p_A)/n_A+\hat p_B(1-\hat p_B)/n_B}$。

          **途中式** $\sqrt{0.24/200+0.25/200}=\sqrt{0.00245}\approx 0.0495$、$0.10\pm 1.96\times 0.0495=0.10\pm 0.097$

          **答え** (0.003, 0.197)

          **間違えやすい点** 独立な 2 つの推定量の差の分散は、それぞれの分散の和。区間は 0 をわずかに含まないので、有意水準 5% で差があると判断できる境目に近い。
  - id: s02p13
    title: 検定の考え方
    context: |
      必要なら次の値を使ってよい：$P(Z>1.67)=0.0475$、$z_{0.05}=1.645$、$z_{0.025}=1.96$。
    items:
      - id: s02p13a
        chapter: 12
        terms: [power-function, type-i-and-ii-errors]
        topic: 標本の大きさや有意水準や真の値の離れ方と検出力の関係について正しい記述を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          母平均の検定の検出力について正しい記述はどれか。ほかの条件は変えないものとする。
        choices:
          - 標本の大きさを大きくすると、検出力は大きくなる
          - 有意水準を小さくすると、検出力は大きくなる
          - 検出力とは、第 1 種の過誤を起こす確率のことである
          - 検出力とは、帰無仮説が正しいときに帰無仮説を棄却しない確率のことである
          - 真の母平均が帰無仮説の値から離れるほど、検出力は小さくなる
        answer: 0
        distractors:
          - 正解
          - 有意水準を小さくすると棄却しにくくなり、検出力は小さくなる
          - 第 1 種の過誤の確率は有意水準
          - それは 1 − 有意水準。検出力は対立仮説が正しいときに棄却する確率
          - 離れるほど差を見つけやすくなり、検出力は大きくなる
        explanation: |
          **方針** 検出力 ＝ 対立仮説が正しいときに帰無仮説を棄却する確率 ＝ 1 − 第 2 種の過誤の確率。

          **途中式** 標本を大きくすると標準誤差が小さくなり、真の差を見つけやすくなる。

          **答え** 標本の大きさを大きくすると、検出力は大きくなる

          **間違えやすい点** 有意水準を下げると第 1 種の過誤は減るが、検出力も下がる（第 2 種の過誤が増える）。
      - id: s02p13b
        chapter: 12
        terms: [z-test-known-variance, one-sided-two-sided-test]
        topic: 母標準偏差既知の平均の検定で右片側の対立仮説のときに上側5パーセント点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある模試の得点は母標準偏差 15 の正規分布にしたがうとする。新しい教材で学んだ 25 人の平均点は 105 点だった。帰無仮説「母平均は 100 点」、対立仮説「母平均は 100 点より大きい」で、有意水準 5% の検定を行うときの結果として正しいものはどれか。
        choices:
          - z ≈ 1.67 で、1.645 より大きいので棄却する
          - z ≈ 1.67 で、1.96 より小さいので棄却しない
          - z ≈ 0.33 で、棄却しない
          - z ≈ 8.33 で、棄却する
          - z ≈ 1.67 で、p 値は約 0.095 なので棄却しない
        answer: 0
        distractors:
          - 正解
          - 片側検定なのに両側検定の点を使った
          - 母標準偏差を $\sqrt n$ で割らなかった
          - 母標準偏差を $\sqrt n$ ではなく $n$ で割った
          - 片側検定なのに両側の p 値（2 × 0.0475）を使った
        explanation: |
          **方針** $z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}$ を、右片側なので上側 5% 点 1.645 と比べる。

          **途中式** $z=\dfrac{105-100}{15/5}=\dfrac{5}{3}\approx 1.67>1.645$。p 値は $P(Z>1.67)=0.0475<0.05$。

          **答え** z ≈ 1.67 で、棄却する

          **間違えやすい点** 同じデータでも両側検定なら 1.96 と比べて棄却しない。片側か両側かは、データを見る前に問題の目的から決める。
      - id: s02p13c
        chapter: 12
        terms: [p-value, significance-level]
        topic: p値の意味を帰無仮説が正しい確率などの誤った解釈と区別して答える
        level: 基本
        definition: true
        type: choice
        question: |
          ある検定で p 値が 0.03 だった。p 値の説明として正しいものはどれか。
        choices:
          - 帰無仮説が正しい確率が 0.03 である
          - 対立仮説が正しい確率が 0.97 である
          - 帰無仮説が正しいとしたとき、得られたデータ以上に極端な結果が出る確率が 0.03 である
          - 第 2 種の過誤を起こす確率が 0.03 である
          - 同じ実験をくり返すと、97% の確率で同じ結論になる
        answer: 2
        distractors:
          - p 値は仮説が正しい確率ではない
          - p 値から対立仮説が正しい確率はわからない
          - 正解
          - 第 2 種の過誤の確率は対立仮説のもとで決まる別の量
          - p 値は結論の再現性を表すものではない
        explanation: |
          **方針** p 値は「帰無仮説のもとで、観測された統計量と同じかそれ以上に極端な値が出る確率」。

          **途中式** p 値 0.03 ＜ 有意水準 0.05 なら、有意水準 5% で帰無仮説を棄却する。

          **答え** 帰無仮説が正しいとしたとき、得られたデータ以上に極端な結果が出る確率

          **間違えやすい点** p 値は帰無仮説が正しい確率ではない。p 値が小さいことは、効果が大きいことも意味しない（標本が大きければ小さな差でも p 値は小さくなる）。
  - id: s02p14
    title: 2 つの群の比較と検定の選び方
    context: |
      必要なら次の値を使ってよい：$t_{0.025}(18)=2.101$、$\chi^2_{0.05}(1)=3.841$、$\chi^2_{0.05}(5)=11.07$。
    items:
      - id: s02p14a
        chapter: 13
        terms: [two-sample-t-test, pooled-variance]
        topic: 2群10人ずつの平均と不偏分散からプールした分散を求めて2標本t統計量を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの学習方法で 10 人ずつの得点を比べた。方法 A は平均 52 点・不偏分散 16、方法 B は平均 48 点・不偏分散 20 だった。母分散が等しいと仮定した 2 標本 t 検定の検定統計量に最も近いものはどれか。
        choices:
          - '2.11'
          - '0.94'
          - '2.98'
          - '4.22'
          - '0.67'
        answer: 0
        distractors:
          - 正解
          - プールした分散 18 の平方根で割り、$1/n_1+1/n_2$ を掛け忘れた
          - $1/n_1+1/n_2$ の代わりに $1/10$ だけを使った
          - $1/n_1+1/n_2$ の代わりに $1/20$ を使った
          - 2 つの不偏分散を足した 36 の平方根で割った
        explanation: |
          **方針** プールした分散 $s_p^2=\dfrac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}$、$t=\dfrac{\bar x_1-\bar x_2}{\sqrt{s_p^2(1/n_1+1/n_2)}}$。

          **途中式** $s_p^2=(9\times 16+9\times 20)/18=18$、$\sqrt{18\times 0.2}=\sqrt{3.6}\approx 1.897$、$t=4/1.897\approx 2.11$

          **答え** 2.11

          **間違えやすい点** 自由度は $n_1+n_2-2=18$。$t_{0.025}(18)=2.101$ と比べると、有意水準 5% の両側検定でわずかに棄却される。
      - id: s02p14b
        chapter: 13
        terms: [goodness-of-fit-test, pearson-chi-square-statistic, expected-frequency]
        topic: さいころを60回投げた目の度数から一様性の適合度検定のカイ二乗統計量を求め自由度5の点と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          さいころを 60 回投げたところ、1〜6 の目が出た回数はそれぞれ 8, 12, 9, 11, 6, 14 だった。「どの目も出る確率は 1/6」を帰無仮説として、有意水準 5% の適合度検定を行うときの結果として正しいものはどれか。
        choices:
          - χ² ＝ 0.42 で、棄却しない
          - χ² ＝ 4.2 で、棄却しない
          - χ² ＝ 42 で、棄却する
          - χ² ＝ 4.2 で、棄却する
          - χ² ＝ 0 で、棄却しない
        answer: 1
        distractors:
          - (観測度数 − 期待度数)² を期待度数の 2 乗で割った
          - 正解
          - 期待度数で割らなかった
          - 自由度を 1 として 3.841 と比べた（自由度は 6 − 1 = 5）
          - (観測度数 − 期待度数) を 2 乗せずに足した（合計は必ず 0）
        explanation: |
          **方針** 期待度数はどの目も $60/6=10$。$\chi^2=\sum(O-E)^2/E$ を自由度 5 の上側 5% 点と比べる。

          **途中式** $(4+4+1+1+16+16)/10=42/10=4.2<11.07$

          **答え** χ² ＝ 4.2 で、棄却しない

          **間違えやすい点** 自由度は（カテゴリの数 − 1）＝ 5。棄却しないことは「さいころが公正だと証明された」ことではない。
      - id: s02p14c
        chapter: 13
        terms: [paired-t-test, welch-test, independence-test]
        topic: 3つの調査場面に対して対応のあるt検定とウェルチの検定と自由度2の独立性の検定を正しく選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          次の 3 つの場面で使う検定の組合せとして最も適切なものはどれか。

          - (i) 同じ生徒 15 人の 4 月と 7 月の得点を比べ、平均点が上がったかを調べる。
          - (ii) A 組 20 人と B 組 25 人の得点の平均を比べる。2 つの組の母分散が等しいとは限らない。
          - (iii) 3 つの地域で、ある政策への賛成・反対の人数を数え、地域と賛否に関連があるかを調べる。
        choices:
          - (i) 対応のある t 検定、(ii) ウェルチの検定、(iii) 自由度 2 のカイ二乗検定（独立性の検定）
          - (i) 2 標本 t 検定（等分散）、(ii) ウェルチの検定、(iii) 自由度 2 のカイ二乗検定（独立性の検定）
          - (i) 対応のある t 検定、(ii) 対応のある t 検定、(iii) 自由度 6 のカイ二乗検定（独立性の検定）
          - (i) 対応のある t 検定、(ii) ウェルチの検定、(iii) 自由度 6 のカイ二乗検定（独立性の検定）
          - (i) 1 標本の z 検定、(ii) 等分散の F 検定、(iii) 自由度 2 の適合度検定
        answer: 0
        distractors:
          - 正解
          - (i) は同じ生徒の前後なので対応がある。2 つの独立な標本として扱うのは誤り
          - (ii) は別の生徒どうしで対応がない。(iii) の自由度も誤り
          - (iii) の自由度は (3−1)(2−1)＝2。セルの数 6 ではない
          - (i) は母分散がわからないので t 検定、(ii) は平均の比較なので F 検定ではない
        explanation: |
          **方針** データに対応があるか、母分散が等しいと仮定できるか、質的データの関連かを判断する。

          **途中式**
          - (i) 同じ人の前後 → 差について t 検定（対応のある t 検定）
          - (ii) 独立な 2 群・等分散とは限らない → ウェルチの検定
          - (iii) 3×2 のクロス表 → 独立性のカイ二乗検定、自由度 $(3-1)(2-1)=2$

          **答え** (i) 対応のある t 検定、(ii) ウェルチの検定、(iii) 自由度 2 の独立性の検定

          **間違えやすい点** 対応のあるデータを独立な 2 標本として検定すると、個人差が誤差に入り検出力が落ちる。クロス表の自由度は（行の数 − 1）×（列の数 − 1）。
  - id: s02p15
    title: 電力使用量の回帰分析
    context: |
      ある建物の 23 日分の電力使用量 $y$（kWh）を、最高気温 $x_1$（℃）と平日ダミー $x_2$（平日 ＝ 1、休日 ＝ 0）で説明する重回帰分析を行い、次の出力を得た。決定係数は 0.60 だった。

      | | 推定値 | 標準誤差 | t 値 | p 値 |
      |---|---|---|---|---|
      | 切片 | 120.0 | 15.0 | 8.00 | 0.000 |
      | 気温 | 2.4 | 0.5 | 4.80 | 0.000 |
      | 平日 | 18.0 | 6.0 | 3.00 | 0.007 |

      必要なら次の値を使ってよい：$t_{0.025}(20)=2.086$、$t_{0.025}(23)=2.069$、$t_{0.05}(20)=1.725$、$z_{0.025}=1.96$。
    items:
      - id: s02p15a
        chapter: 14
        terms: [dummy-variable, regression-output, multiple-regression-model]
        topic: 平日ダミーの係数を気温が同じときの平日と休日の平均の差として解釈する
        level: 基本
        definition: false
        type: choice
        question: |
          平日ダミーの係数 18.0 の解釈として正しいものはどれか。
        choices:
          - 平日の電力使用量の平均は 18.0 kWh と推定される
          - 気温が同じなら、平日は休日より電力使用量が平均 18.0% 多いと推定される
          - 気温が同じなら、平日は休日より電力使用量が平均 18.0 kWh 多いと推定される
          - 平日ダミーの係数は気温の係数より大きいので、気温より曜日の影響のほうが大きい
          - 気温が同じなら、休日は平日より電力使用量が平均 18.0 kWh 多いと推定される
        answer: 2
        distractors:
          - 係数は平日と休日の「差」で、平日の平均そのものではない
          - 目的変数をそのまま使っているので、差は kWh 単位で、% ではない
          - 正解
          - 単位の違う変数の係数の大きさは、そのままでは比べられない
          - 平日 ＝ 1 なので、係数が正なら平日のほうが多い
        explanation: |
          **方針** ダミー変数の係数は、他の説明変数を一定にしたときの「1 の群（平日）と 0 の群（休日）の平均の差」。

          **途中式** 平日：$\hat y=120+2.4x_1+18$、休日：$\hat y=120+2.4x_1$ → 差は 18.0。

          **答え** 気温が同じなら、平日は休日より平均 18.0 kWh 多い

          **間違えやすい点** 0 と 1 のどちらを平日にしたかで係数の符号が変わる。基準（0 の群）を確認する。
      - id: s02p15b
        chapter: 14
        terms: [regression-coefficient-t-test, regression-output, confidence-and-prediction-interval-regression]
        topic: 重回帰の気温の係数の95パーセント信頼区間を残差の自由度20のt分布の点で求める
        level: 標準
        definition: false
        type: choice
        question: |
          気温の係数の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (1.36, 3.44)
          - (1.42, 3.38)
          - (1.37, 3.43)
          - (1.54, 3.26)
          - (0.31, 4.49)
        answer: 0
        distractors:
          - 正解
          - t 分布ではなく標準正規分布の 1.96 を使った
          - 自由度をデータの数 23 とした
          - 上側 5% 点を使った（90% 信頼区間）
          - 標準誤差を掛け忘れた（2.4 ± 2.086）
        explanation: |
          **方針** 係数の区間は 推定値 ± $t_{0.025}(n-p-1)$ × 標準誤差。残差の自由度は $23-2-1=20$。

          **途中式** $2.4\pm 2.086\times 0.5=2.4\pm 1.043$

          **答え** (1.36, 3.44)

          **間違えやすい点** 自由度は、データの数から推定した係数の数（切片を含めて 3）を引いた 20。区間が 0 を含まないことは、t 値 4.80 で有意であることと対応する。
      - id: s02p15c
        chapter: 14
        terms: [overall-f-test-regression, coefficient-of-determination]
        topic: データ数23で説明変数2個の重回帰の決定係数0.60から回帰全体のF統計量を求める
        level: 応用
        definition: false
        type: choice
        question: |
          この重回帰分析で、「2 つの係数がともに 0」を帰無仮説とする F 統計量はいくらか。
        choices:
          - '15.0'
          - '16.5'
          - '1.5'
          - '9.5'
          - '17.25'
        answer: 0
        distractors:
          - 正解
          - 残差の自由度を $n-1=22$ とした
          - 決定係数と 1 − 決定係数の比をそのままとった（自由度で割っていない）
          - 説明変数の数を切片も含めて 3 とした
          - 残差の自由度をデータの数 23 とした
        explanation: |
          **方針** $F=\dfrac{R^2/p}{(1-R^2)/(n-p-1)}$（$p=2$、$n=23$）。

          **途中式** $\dfrac{0.60/2}{0.40/20}=\dfrac{0.30}{0.02}=15.0$

          **答え** 15.0

          **間違えやすい点** 自由度は (2, 20)。$F_{0.05}(2,20)=3.49$ より大きく、回帰全体は有意である。
  - id: s02p16
    title: 教え方の比較実験
    context: |
      4 種類の教え方を比べるため、20 人の生徒を無作為に 5 人ずつ 4 つの群に割り付け、同じテストの得点を比べた。必要なら $F_{0.05}(3,16)=3.239$ を使ってよい。
    items:
      - id: s02p16a
        chapter: 15
        terms: [treatment-and-control, fisher-three-principles]
        topic: 生徒を群に無作為に割り付ける目的が処理以外の条件を平均的にそろえて偏りを防ぐことだと答える
        level: 基本
        definition: true
        type: choice
        question: |
