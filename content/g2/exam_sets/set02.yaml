      - id: s02p16b
        chapter: 15
        terms: [anova-table, one-way-anova, sum-of-squares-decomposition]
        topic: 4群20人の一元配置分散分析で全体と群間の平方和から誤差の平方和を求めF比を計算して判断する
        level: 基本
        definition: false
        type: choice
        question: |
          一元配置分散分析を行ったところ、群間の平方和は 36、全体の平方和は 100 だった。F 比と、有意水準 5% での判断の組合せとして正しいものはどれか。
