set: 9
title: 2級 模擬試験 第9回
minutes: 90
problems:
  - id: s09p01
    title: アンケートの項目と待ち時間
    context: |
      ある病院の利用者アンケートと待ち時間のデータを整理する。
    items:
      - id: s09p01a
        chapter: 1
        terms: [data-types, scales-of-measurement]
        topic: アンケートの4つの項目を質的変数と離散的な量的変数と連続的な量的変数に分ける
        level: 基本
        definition: false
        type: choice
        question: |
          アンケートの項目 (ア) 受診した診療科、(イ) これまでの通院回数、(ウ) 待ち時間（分）、(エ) 満足度（5 段階）の組合せとして正しいものはどれか。
        choices:
          - (ア) 質的、(イ) 量的・連続、(ウ) 量的・離散、(エ) 量的・連続
          - (ア) 質的、(イ) 量的・離散、(ウ) 量的・連続、(エ) 質的（順序）
          - (ア) 量的・離散、(イ) 量的・離散、(ウ) 量的・連続、(エ) 質的（順序）
          - (ア) 質的、(イ) 質的、(ウ) 量的・連続、(エ) 量的・離散
          - (ア) 質的、(イ) 量的・離散、(ウ) 質的（順序）、(エ) 量的・連続
        answer: 1
        distractors:
          - 回数は数えた値で離散、待ち時間は測った値で連続。満足度の段階は量ではない
          - 正解
          - 診療科は区分を表す質的変数
          - 通院回数は量的変数。満足度の数字は順序を表すだけ
          - 待ち時間は量的変数
        explanation: |
          **方針** 区分を表すか数量か、数量なら数えた値（離散）か測った値（連続）かで分ける。

          **途中式** 診療科は区分、通院回数は数えた値、待ち時間は測った値、満足度は順序のある区分。

          **答え** (ア) 質的、(イ) 量的・離散、(ウ) 量的・連続、(エ) 質的（順序）

          **間違えやすい点** 5 段階の満足度は数字で答えても、間隔が等しいとは限らない順序の変数。
      - id: s09p01b
        chapter: 1
        terms: [frequency-distribution-histogram]
        topic: 縦軸が幅10分あたりの人数のヒストグラムで幅20分の階級の柱の高さから度数を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          待ち時間のヒストグラムは、縦軸を「幅 10 分あたりの人数」として描かれている。40〜60 分の階級（幅 20 分）の柱の高さは 6 だった。この階級の人数は何人か。
        choices:
          - 6 人
          - 3 人
          - 120 人
          - 12 人
          - 26 人
        answer: 3
        distractors:
          - 高さをそのまま人数とした
          - 高さを幅の比 2 で割った（逆にした）
          - 高さに幅 20 をそのまま掛けた（10 分あたりではなく 1 分あたりの高さとみなした）
          - 正解
          - 高さに幅 20 を足した
        explanation: |
          **方針** ヒストグラムでは柱の面積が度数に比例する。高さは 10 分あたりの人数なので、幅 20 分ならその 2 倍が度数。

          **途中式** $6\times(20/10)=12$ 人

          **答え** 12 人

          **間違えやすい点** 幅の違う階級では、柱の高さだけで人数を比べない。
  - id: s09p02
    title: 平均の選び方と得点の逆算
    context: |
      平均や標準得点を目的に合わせて使う。
    items:
      - id: s09p02a
        chapter: 2
        terms: [weighted-geometric-harmonic-mean]
        topic: 同じ金額ずつ2回に分けて買ったときの1個あたりの平均価格を調和平均で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある商品を、1 回目は 1 個 100 円のときに 1 万円分、2 回目は 1 個 200 円のときに 1 万円分買った。買った商品 1 個あたりの平均価格は何円か。
        choices:
          - 150 円
          - 約 141 円
          - 約 133 円
          - 300 円
          - 約 67 円
        answer: 2
        distractors:
          - 価格の算術平均（買った個数の違いを考えていない）
          - 価格の幾何平均
          - 正解
          - 価格を足しただけ
          - 調和平均を求めたあと半分にした
        explanation: |
          **方針** 平均価格 ＝ 支払った総額 ÷ 買った総個数。同じ金額ずつ買ったときは価格の調和平均になる。

          **途中式** 個数は 100 個と 50 個。$20000/150\approx 133$ 円（$2/(1/100+1/200)$ と同じ）

          **答え** 約 133 円

          **間違えやすい点** 安いときに多く買うので、平均価格は算術平均より安くなる（ドル・コスト平均法の考え方）。
      - id: s09p02b
        chapter: 2
        terms: [standard-score]
        topic: 平均と標準偏差がわかっている試験で偏差値65に必要な得点を逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある模擬試験の平均点は 60 点、標準偏差は 8 点だった。偏差値 65 になるのは何点のときか。
        choices:
          - 65 点
          - 68 点
          - 180 点
          - 72 点
          - 52 点
        answer: 3
        distractors:
          - 偏差値をそのまま得点とした
          - 平均に標準偏差 8 を 1 つ分だけ足した（偏差値 60 の得点）
          - 偏差値の差 15 に標準偏差 8 を掛けて平均に足した（10 で割り忘れた）
          - 正解
          - 平均から標準偏差を引いた（偏差値 40 の得点）
        explanation: |
          **方針** 偏差値 $=50+10\times(x-60)/8$ を $x$ について解く。

          **途中式** $65=50+10(x-60)/8$ → $(x-60)/8=1.5$ → $x=72$

          **答え** 72 点

          **間違えやすい点** 偏差値 65 は標準得点 1.5（平均から標準偏差 1.5 個分上）。
  - id: s09p03
    title: クロス表と 3 つの変数
    context: |
      2 つ以上の変数の関係を調べる。
    items:
      - id: s09p03a
        chapter: 3
        terms: [cross-tabulation]
        topic: 通勤手段と地域のクロス表から列パーセントとして車通勤の人のうち郊外の人の割合を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある会社の社員 250 人の居住地域と通勤手段は次のとおりだった。

          | | 車 | 電車 | 計 |
          |---|---|---|---|
          | 市内 | 20 | 130 | 150 |
          | 郊外 | 60 | 40 | 100 |
          | 計 | 80 | 170 | 250 |

          車で通勤する社員のうち、郊外に住む社員の割合はいくらか。
        choices:
          - 60%
          - 75%
          - 24%
          - 32%
          - 40%
        answer: 1
        distractors:
          - 郊外の社員のうち車の割合（行パーセント）
          - 正解
          - 全体 250 人のうち「郊外で車」の割合
          - 全体のうち車の社員の割合
          - 郊外の社員の全体に対する割合
        explanation: |
          **方針** 条件は「車で通勤する社員」なので、車の列の合計 80 人を分母にする（列パーセント）。

          **途中式** $60/80=0.75$

          **答え** 75%

          **間違えやすい点** 何を分母にするかで意味が変わる。「郊外の社員のうち車」は $60/100=60\%$。
      - id: s09p03b
        chapter: 3
        terms: [partial-correlation-coefficient, spurious-correlation]
        topic: 第3の変数と逆向きの相関がある場合に偏相関係数が元の相関係数より大きくなることを計算で確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          変数 $x$、$y$、$z$ の相関係数は $r_{xy}=0.2$、$r_{xz}=0.5$、$r_{yz}=-0.4$ だった。$z$ の影響を除いた $x$ と $y$ の偏相関係数に最も近いものはどれか。
        choices:
          - '0.20'
          - '0.40'
          - '0.63'
          - '0'
          - '0.50'
        answer: 4
        distractors:
          - 元の相関係数をそのまま答えた
          - 分子（$r_{xy}-r_{xz}r_{yz}$）だけを計算した
          - 分母で平方根をとらなかった
          - 偏相関は元の相関より必ず小さいと考えた
          - 正解
        explanation: |
          **方針** $r_{xy\cdot z}=\dfrac{r_{xy}-r_{xz}r_{yz}}{\sqrt{(1-r_{xz}^2)(1-r_{yz}^2)}}$。

          **途中式** 分子 $0.2-0.5\times(-0.4)=0.4$、分母 $\sqrt{0.75\times 0.84}\approx 0.794$、$0.4/0.794\approx 0.50$

          **答え** 0.50

          **間違えやすい点** $z$ が $x$ と $y$ に逆向きに関係していると、元の相関は $x$ と $y$ の関係を弱めて見せる。偏相関は元の相関より大きくなることもある。
  - id: s09p04
    title: 回帰と時系列
    context: |
      回帰の計算と経済の時系列を扱う。
    items:
      - id: s09p04a
        chapter: 4
        terms: [simple-regression, least-squares-method]
        topic: データの個数と合計と積の和と2乗和から最小二乗法の傾きと切片を求める
        level: 標準
        definition: false
        type: choice
        question: |
          5 組のデータについて、$\sum x=20$、$\sum y=50$、$\sum xy=230$、$\sum x^2=90$ だった。最小二乗法による回帰直線 $\hat y=a+bx$ はどれか。
        choices:
          - $\hat y=10+2.56x$
          - $\hat y=3-2x$
          - $\hat y=-2+3x$
          - $\hat y=10+3x$
          - $\hat y=2+2x$
        answer: 2
        distractors:
          - 傾きを $\sum xy/\sum x^2$ とし、切片を $\bar y$ とした
          - 切片と傾きを入れ替えた
          - 正解
          - 切片を $\bar y-b\bar x$ ではなく $\bar y$ のままにした
          - 平均の点（4, 10）を通るが、傾きを誤った
        explanation: |
          **方針** $S_{xy}=\sum xy-n\bar x\bar y$、$S_{xx}=\sum x^2-n\bar x^{\,2}$、$b=S_{xy}/S_{xx}$、$a=\bar y-b\bar x$。

          **途中式** $\bar x=4$、$\bar y=10$、$S_{xy}=230-200=30$、$S_{xx}=90-80=10$、$b=3$、$a=10-12=-2$

          **答え** $\hat y=-2+3x$

          **間違えやすい点** 合計から偏差の積和を作るときは、$n\bar x\bar y$ を引く。
      - id: s09p04b
        chapter: 5
        terms: [growth-rate]
        topic: 2つの部門のうち一方が減少したときの全体の成長率への寄与度を符号に注意して求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある会社の売上は、部門 A が 60 億円から 70 億円に、部門 B が 40 億円から 35 億円に変わった（合計 100 億円から 105 億円）。部門 A と B の寄与度（ポイント）の組合せはどれか。
        choices:
          - A は ＋16.7 ポイント、B は −12.5 ポイント
          - A は ＋10 ポイント、B は −5 ポイント
          - A は ＋10 ポイント、B は ＋5 ポイント
          - A は ＋5 ポイント、B は −10 ポイント
          - A は ＋200%、B は −100%
        answer: 1
        distractors:
          - それぞれの部門自身の成長率を求めた
          - 正解
          - B の減少をプラスとした
          - A と B を取り違えた
          - 寄与率（全体の増加 5 に対する割合）を求めた
        explanation: |
          **方針** 寄与度 ＝ 部門の増減 ÷ 全体の前年の値。

          **途中式** A：$+10/100=+10$ ポイント、B：$-5/100=-5$ ポイント。合計 $+5$ ポイントが全体の成長率 5%。

          **答え** A は ＋10 ポイント、B は −5 ポイント

          **間違えやすい点** 減少した部門の寄与度は負。寄与率は A が $10/5=200\%$、B が $-100\%$ になる。
      - id: s09p04c
        chapter: 5
        terms: [price-index, growth-rate, index-number]
        topic: 名目賃金と消費者物価指数の変化から実質賃金の変化率を比で求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある人の月給は 30 万円から 30.9 万円に増え、同じ期間に消費者物価指数は 104.0 から 106.08 に上がった。実質賃金の変化率に最も近いものはどれか。
        choices:
          - ＋1.0%
          - −1.0%
          - ＋5.0%
          - ＋3.0%
          - ＋0.9%
        answer: 0
        distractors:
          - 正解
          - 比を逆にした
          - 賃金の上昇率と物価の上昇率を足した
          - 名目賃金の上昇率だけを答えた
          - 物価指数の差（2.08 ポイント）を % として引いた（3 − 2.08）
        explanation: |
          **方針** 実質賃金 ＝ 名目賃金 ÷ 物価指数。変化率は比で求める。

          **途中式** 名目は $30.9/30=1.03$ 倍、物価は $106.08/104=1.02$ 倍。$1.03/1.02-1\approx 0.0098$ → 約 ＋1.0%

          **答え** ＋1.0%

          **間違えやすい点** 物価の上昇率は指数のポイント差（2.08）ではなく比（2%）で求める。
  - id: s09p05
    title: 調査の誤差
    context: |
      全国の世論調査について考える。
    items:
      - id: s09p05a
        chapter: 6
        terms: [population-and-sample, sampling-and-nonsampling-error]
        topic: 無作為抽出の標本誤差が母集団の大きさにほとんどよらず標本の大きさで決まることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          人口 1 億人の国と人口 100 万人の県で、それぞれ無作為に 1000 人を選んで賛成の割合を調べる。標本誤差の大きさについて最も適切なものはどれか。
        choices:
          - 母集団が標本よりずっと大きければ、標本誤差の大きさは主に標本の大きさで決まり、2 つでほとんど変わらない
          - 母集団が 100 倍なので、国の調査の標本誤差は 100 倍になる
          - 母集団が大きいほど、標本誤差は小さくなる
          - 国の調査では、1000 人では標本誤差を評価できない
          - 県の調査は全数調査に近いので、標本誤差は 0 になる
        answer: 0
        distractors:
          - 正解
          - 標本誤差は母集団の大きさにほとんど依存しない
          - 母集団の大きさは標本誤差にほとんど影響しない
          - 無作為抽出なら、標本の大きさから標本誤差を評価できる
          - 1000 人は 100 万人のごく一部で、全数調査とはまったく違う
        explanation: |
          **方針** 戻さない抽出の分散には $(N-n)/(N-1)$ が掛かるが、$N$ が $n$ よりずっと大きければほぼ 1。

          **途中式** 1 億人でも 100 万人でも、1000 人の標本比率の標準誤差はおよそ $\sqrt{p(1-p)/1000}$。

          **答え** 2 つでほとんど変わらない

          **間違えやすい点** 全国調査でも数千人の標本で精度よく推測できるのはこのため。
      - id: s09p05b
        chapter: 6
        terms: [sampling-and-nonsampling-error, official-statistics]
        topic: 全数調査でも記入の誤りや回答漏れなどの非標本誤差が生じることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          全数調査で集めた統計について、正しい記述はどれか。
        choices:
          - 誤差はいっさい生じない
          - 標本誤差が最も大きくなる
          - 非標本誤差は標本調査にしか生じない
          - 対象が多いので、非標本誤差は必ず標本調査より小さい
          - 標本誤差はないが、記入の誤り・回答漏れ・集計の誤りなどの非標本誤差は生じうる
        answer: 4
        distractors:
          - 非標本誤差は生じうる
          - 全員を調べるので標本誤差はない
          - 非標本誤差は全数調査でも生じる
          - 対象が多いと、調査員の訓練や確認が行き届かず、非標本誤差が大きくなることもある
          - 正解
        explanation: |
          **方針** 標本誤差は「標本の選ばれ方の偶然」による誤差なので、全数調査にはない。それ以外の誤差は全数調査でも生じる。

          **途中式** 記入ミス、誤解、無回答、集計ミスなどが非標本誤差。

          **答え** 標本誤差はないが、非標本誤差は生じうる

          **間違えやすい点** 標本調査のほうが対象が少なく丁寧に調べられるので、全体として正確になることもある。
  - id: s09p06
    title: 確率の計算
    context: |
      確率と確率変数の計算をする。必要なら $z_{0.25}=0.674$（標準正規分布の上側 25% 点）を使ってよい。
    items:
      - id: s09p06a
        chapter: 7
        terms: [conditional-probability, events-and-probability]
        topic: 当たり4本とはずれ6本のくじを戻さずに2本引くとき1本目が当たりで2本目がはずれである確率を乗法定理で求める
        level: 基本
        definition: false
        type: choice
        question: |
          当たり 4 本・はずれ 6 本のくじから、1 本ずつ戻さずに 2 本引く。1 本目が当たり、2 本目がはずれである確率に最も近いものはどれか。
        choices:
          - '0.24'
          - '0.40'
          - '0.60'
          - '0.667'
          - '0.267'
        answer: 4
        distractors:
          - 戻して取り出したとした（0.4 × 0.6）
          - 1 回目が当たりの確率だけを答えた
          - 2 回目がはずれの確率だけを答えた
          - 1 回目が当たりのとき 2 回目がはずれになる条件付き確率（6/9）を答えた
          - 正解
        explanation: |
          **方針** 乗法定理 $P(A\cap B)=P(A)P(B\mid A)$。

          **途中式** $P(\text{1 本目当たり})=4/10$、当たりを引いたあとは当たり 3・はずれ 6 なので $P(\text{2 本目はずれ}\mid\text{1 本目当たり})=6/9$。$\dfrac{4}{10}\times\dfrac{6}{9}=\dfrac{24}{90}\approx 0.267$

          **答え** 0.267

          **間違えやすい点** 戻さずに引くと、2 本目の確率は 1 本目の結果で変わる。
      - id: s09p06b
        chapter: 7
        terms: [independence-of-events, events-and-probability]
        topic: 確率が正の2つの排反な事象が独立でないことを条件付き確率で確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          事象 $A$、$B$ は排反で、$P(A)=0.2$、$P(B)=0.5$ である。正しい記述はどれか。
        choices:
          - 排反なので、$A$ と $B$ は独立である
          - $P(A\cap B)=0.1$ である
          - $P(A\mid B)=0$ で $P(A)$ と違うので、$A$ と $B$ は独立ではない
          - $P(A\cup B)=0.6$ である
          - $P(A\mid B)=0.2$ である
        answer: 2
        distractors:
          - 排反と独立は別の概念で、確率が正なら排反な事象は独立にならない
          - 独立とみなして掛けた。排反なら 0
          - 正解
          - 排反なので重なりは 0 で、$P(A\cup B)=0.7$
          - 独立とみなした値
        explanation: |
