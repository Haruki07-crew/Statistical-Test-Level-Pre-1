          **方針** 自由度 $n-1=9$ の t 分布の上側 1% 点を使う。

          **途中式** $t_{0.01}(9)=2.821$

          **答え** $t>2.821$

          **間違えやすい点** 自由度が小さいと、t 分布の点は正規分布の点（2.326）より大きい。
      - id: s09p09d
        chapter: 13
        terms: [goodness-of-fit-test]
        topic: 3つのカテゴリの比率が与えられた適合度検定の自由度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある商品の 3 種類の味（A・B・C）が、2：2：1 の比率で好まれているかを、300 人のデータで適合度検定する。統計量がしたがうカイ二乗分布の自由度はいくらか。
        choices:
          - '3'
          - '2'
          - '299'
          - '1'
          - '5'
        answer: 1
        distractors:
          - カテゴリの数をそのまま自由度にした
          - 正解
          - 人数から 1 を引いた
          - 比率を推定したと考えて 1 を引きすぎた（比率は仮説で与えられている）
          - 比の数を足した
        explanation: |
          **方針** 自由度 ＝ カテゴリの数 − 1 − 推定した母数の数。

          **途中式** 比率は仮説で与えられているので、$3-1=2$。

          **答え** 2

          **間違えやすい点** 期待度数は 120、120、60 になる。棄却の点は $\chi^2_{0.05}(2)=5.991$。
      - id: s09p09e
        chapter: 13
        terms: [two-sample-t-test, pooled-variance]
        topic: 等分散を仮定した2標本t検定の統計量2.0を自由度16の両側5パーセント点と比べて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの群（大きさ 8 と 10）で、等分散を仮定した 2 標本 t 検定の統計量は 2.0 だった。有意水準 5% の両側検定の結果として正しいものはどれか。
        choices:
          - 自由度 16 の点 2.120 より大きいので棄却する
          - 1.96 より大きいので棄却する
          - 自由度 16 の点 2.120 より小さいので棄却しない
          - 自由度 15 の片側の点 1.753 より大きいので棄却する
          - 自由度 18 の点と比べなければならない
        answer: 2
        distractors:
          - 2.0 は 2.120 より小さい
          - 標本が小さいのに標準正規分布の点を使った
          - 正解
          - 両側検定なのに片側の点を使い、自由度も誤った
          - 自由度は $n_1+n_2-2=16$
        explanation: |
          **方針** 等分散を仮定した 2 標本 t 検定の自由度は $n_1+n_2-2=16$。両側 5% なので上側 2.5% 点と比べる。

          **途中式** $2.0<2.120$

          **答え** 棄却しない

          **間違えやすい点** 標本が小さいと、正規分布で判断すると棄却しすぎる。
      - id: s09p09f
        chapter: 13
        terms: [two-sample-proportion-test, standard-error]
        topic: 2つの群の比率が変わらず標本の大きさだけを4倍にすると比率の差の検定統計量が2倍になることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの群の比率の差の検定で、各群 100 人のとき検定統計量は $z=1.5$ で有意水準 5% の両側検定では有意でなかった。各群の比率が同じまま、各群を 400 人にしたら $z$ はおよそいくらになるか。
        choices:
          - 約 3.0（有意になる）
          - 約 6.0（有意になる）
          - 約 1.5（変わらない）
          - 約 0.75（小さくなる）
          - 約 2.1（√2 倍）
        answer: 0
        distractors:
          - 正解
          - 標準誤差が 1/4 になるとした（$1/n$ に比例すると誤った）
          - 標本が増えても比率が同じなら z も同じとした
          - 標本を増やすと z が小さくなるとした
          - 2 倍ではなく √2 倍とした
        explanation: |
          **方針** 標準誤差は $1/\sqrt n$ に比例する。比率の差が同じなら $z$ は $\sqrt n$ に比例する。

          **途中式** 人数を 4 倍 → 標準誤差は 1/2 → $z$ は 2 倍で約 3.0

          **答え** 約 3.0

          **間違えやすい点** 同じ大きさの差でも、標本が大きいと有意になる。有意かどうかと、差の大きさ（実際の意味）は分けて考える。
  - id: s09p10
    title: 回帰分析の使い方
    context: |
      回帰分析の結果を読む。
    items:
      - id: s09p10a
        chapter: 14
        terms: [coefficient-of-determination, adjusted-r-squared]
        topic: 説明変数を加えると決定係数は減らないが自由度調整済み決定係数は減ることもあると判断する
        level: 基本
        definition: false
        type: choice
        question: |
          重回帰モデルに説明変数を 1 つ加えたときについて、正しい記述はどれか。
        choices:
          - 決定係数も自由度調整済み決定係数も必ず増える
          - 決定係数は減らないが、自由度調整済み決定係数は減ることがある
          - 決定係数は必ず減る
          - 自由度調整済み決定係数は必ず増える
          - 加えた変数が役に立たなければ、決定係数は必ず減る
        answer: 1
        distractors:
          - 自由度調整済み決定係数は減ることもある
          - 正解
          - 決定係数は減らない
          - 役に立たない変数を加えると減ることがある
          - 役に立たない変数でも決定係数はわずかに増える（減らない）
        explanation: |
          **方針** 説明変数を増やすと残差平方和は増えないので、決定係数は減らない。自由度調整済み決定係数は変数の数の分だけ割り引く。

          **途中式** 役に立たない変数を加えると、残差の減り方より自由度の減り方が大きく、調整済みの値は下がる。

          **答え** 決定係数は減らないが、調整済みは減ることがある

          **間違えやすい点** 変数の数の違うモデルを決定係数だけで比べない。
      - id: s09p10b
        chapter: 14
        terms: [dummy-variable, multiple-regression-model]
        topic: 量的な説明変数とダミー変数を含む回帰式に値を代入して予測値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある商品の 1 日の売上 $y$（万円）を、気温 $x$（℃）と週末ダミー $d$（週末 ＝ 1、平日 ＝ 0）で説明する回帰 $\hat y=10+2x+5d$ を得た。気温 3℃ の週末の予測値はいくらか。
        choices:
          - '16'
          - '15'
          - '31'
          - '21'
          - '18'
        answer: 3
        distractors:
          - 週末の効果 5 を足し忘れた
          - 気温の効果を足し忘れた
          - 週末ダミーに気温の値 3 を入れた（10 ＋ 2 × 3 ＋ 5 × 3）
          - 正解
          - 気温の係数 2 を掛け忘れた（10＋3＋5）
        explanation: |
          **方針** 値を代入する。週末なので $d=1$。

          **途中式** $10+2\times 3+5\times 1=21$

          **答え** 21

          **間違えやすい点** ダミー変数の係数は、気温が同じときの週末と平日の差。
      - id: s09p10c
        chapter: 14
        terms: [regression-coefficient-t-test, confidence-interval-test-duality]
        topic: 回帰係数の95パーセント信頼区間が0を含むことと有意水準5パーセントのt検定で有意でないことの対応を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          回帰分析の出力で、ある係数の 95% 信頼区間は (−0.3, 1.5) だった。この係数について正しい記述はどれか。
        choices:
          - 区間の中央 0.6 が 0 より大きいので、有意である
          - 区間が 0 を含むので、有意水準 5% の両側の t 検定では有意でない
          - 区間の上限が正なので、係数は正であると結論できる
          - 区間が 0 を含むので、係数は 0 であると証明された
          - 信頼区間と t 検定の結果には関係がない
        answer: 1
        distractors:
          - 推定値が正でも、区間が 0 を含めば有意ではない
          - 正解
          - 区間の下限が負なので、正とは言い切れない
          - 有意でないことは 0 の証明ではない
          - 同じ自由度の t 分布を使うので、対応がある
        explanation: |
          **方針** 両側 5% の t 検定で「係数 ＝ 0」が棄却されないのは、0 が 95% 信頼区間に含まれるとき。

          **途中式** (−0.3, 1.5) は 0 を含む → 有意でない。

          **答え** 有意でない

          **間違えやすい点** 出力の p 値が 0.05 より大きいことと同じ意味。
  - id: s09p11
    title: 分散分析の前提と考え方
    context: |
      一元配置分散分析について考える。
    items:
      - id: s09p11a
        chapter: 15
        terms: [one-way-anova]
        topic: 一元配置分散分析の前提として各群が正規分布で母分散が等しく独立であることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          一元配置分散分析（F 検定）で前提とされることの組合せとして最も適切なものはどれか。
        choices:
          - 各群の母平均が等しい
          - 各群の標本の大きさが必ず等しい
          - 各群の母分散が互いに異なる
          - 各群のデータが互いに独立で、正規分布にしたがい、母分散が等しい
          - 各群のデータに対応がある
        answer: 3
        distractors:
          - それは前提ではなく帰無仮説
          - 大きさが違っても分析できる
          - 等分散を仮定する
          - 正解
          - 一元配置では各群は独立な標本
        explanation: |
          **方針** F 比が F 分布にしたがうための前提を考える。

          **途中式** 独立性・正規性・等分散性。

          **答え** 独立・正規分布・等分散

          **間違えやすい点** 群の大きさは違ってもよい。等分散が大きく崩れているときは注意が必要。
      - id: s09p11b
        chapter: 15
        terms: [anova-table, f-distribution]
        topic: 群の母平均がすべて等しいときF比が1の前後の値になる理由を平均平方の意味から判断する
        level: 標準
        definition: false
        type: choice
        question: |
          一元配置分散分析で、すべての群の母平均が等しいとき、F 比（群間の平均平方 ÷ 群内の平均平方）がとりやすい値として最も適切なものはどれか。
        choices:
          - 0 に近い値
          - 群の数に近い値
          - データの数に近い値
          - 1 の前後の値（どちらの平均平方も誤差分散の推定値になるため）
          - 必ずちょうど 1
        answer: 3
        distractors:
          - 群間の平均平方も誤差分散くらいの大きさになるので、0 には近づかない
          - 群の数とは関係ない
          - データの数とは関係ない
          - 正解
          - 偶然のぶれがあるので、ちょうど 1 にはならない
        explanation: |
          **方針** 群内の平均平方は誤差分散の推定値。帰無仮説のもとでは、群間の平均平方も誤差分散の推定値になる。

          **途中式** 2 つの推定値の比なので、1 の前後でばらつく（F 分布）。平均に差があると群間の平均平方が大きくなり、F は 1 より大きくなる。

          **答え** 1 の前後の値

          **間違えやすい点** F が 1 より小さいときは、群の平均の差がほとんどないことを示す。
