        question: |
          正規母集団 $N(\mu,\sigma^2)$ から大きさ $n$ の標本を取る。$\sum(X_i-\mu)^2/\sigma^2$ と $\sum(X_i-\bar X)^2/\sigma^2$ がしたがう分布の組合せとして正しいものはどれか。
        choices:
          - 前者は自由度 $n$、後者は自由度 $n-1$ のカイ二乗分布
          - どちらも自由度 $n$ のカイ二乗分布
          - どちらも自由度 $n-1$ のカイ二乗分布
          - 前者は自由度 $n-1$、後者は自由度 $n$ のカイ二乗分布
          - どちらも標準正規分布
        answer: 0
        distractors:
          - 正解
          - 標本平均を使うと自由度が 1 減る
          - 母平均を使った和は $n$ 個の独立な標準正規の 2 乗和
          - 自由度の対応が逆
          - 2 乗の和は正の値だけをとり、正規分布にはならない
        explanation: |
          **方針** 独立な標準正規分布 $k$ 個の 2 乗和は自由度 $k$ のカイ二乗分布。

          **途中式** $(X_i-\mu)/\sigma$ は $n$ 個とも独立な標準正規。標本平均を使うと偏差の合計が 0 という制約が 1 つ入り、自由度は $n-1$。

          **答え** 前者は $n$、後者は $n-1$

          **間違えやすい点** 不偏分散で $n-1$ で割るのも、この自由度と対応している。
      - id: s09p07b
        chapter: 10
        terms: [sampling-distribution-of-mean, normal-approximation-binomial-poisson]
        topic: 母比率0.2から400人を抽出したときの標本比率の平均と標準偏差を求め0.24を超える確率を近似する
        level: 標準
        definition: false
        type: choice
        question: |
          ある地域の住民のうち 20% が持っている資格がある。無作為に 400 人を選ぶとき、標本比率が 0.24 を超える確率を正規近似（連続修正なし）で求めるといくらか。
        choices:
          - '0.04'
          - '0.9772'
          - '0.0456'
          - '0.0228'
          - '0.24'
        answer: 3
        distractors:
          - 確率ではなく、標本比率と母比率の差を答えた
          - 0.24 以下の確率を求めた
          - 両側の確率を求めた
          - 正解
          - 0.24 をそのまま確率とした
        explanation: |
          **方針** 標本比率は平均 $p=0.2$、標準偏差 $\sqrt{p(1-p)/n}$ の正規分布で近似できる。

          **途中式** $\sqrt{0.16/400}=0.02$、$(0.24-0.2)/0.02=2$、$P(Z>2)=0.0228$

          **答え** 0.0228

          **間違えやすい点** 標本比率の標準偏差は、母比率 $p$ を使って計算する。
