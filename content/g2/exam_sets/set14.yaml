  - id: s14p08
    title: 統計量のふるまい
    context: |
      統計量の分布を考える。自由度 4 のカイ二乗分布で $P(\chi^2<4)=0.594$ とする。
    items:
      - id: s14p08a
        chapter: 10
        terms: [f-distribution, f-test-equal-variances]
        topic: 大きさの等しい2つの標本を同じ正規母集団からとったとき不偏分散の比が1を超える確率が0.5であることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          同じ正規母集団から、大きさ 10 の標本を独立に 2 つとり、不偏分散の比 $F=s_1^2/s_2^2$ を求める。$P(F>1)$ はいくらか。
        choices:
          - "0.05"
          - "0.5"
          - "0.025"
          - "1"
          - "0"
        answer: 1
        distractors:
          - 有意水準と取り違えている
          - 正解
          - 両側検定の片側の確率と取り違えている
          - 不偏分散の比はいつも 1 より大きいわけではない
          - 比が 1 を超えることはよくある
        explanation: |
          **方針** 2 つの標本は同じ条件なので、$s_1^2$ と $s_2^2$ の役割を入れかえても分布は同じ。

          **途中式** $P(s_1^2>s_2^2)=P(s_2^2>s_1^2)$ で、等しくなる確率は 0 なので、どちらも 0.5。

          **答え** 0.5

          **間違えやすい点** $F(m,\ m)$ の分布の中央値は 1。期待値は 1 より少し大きいが、中央値はちょうど 1。
      - id: s14p08b
        chapter: 10
