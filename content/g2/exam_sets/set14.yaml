set: 14
title: 2級 模擬試験 第14回
minutes: 90
problems:
  - id: s14p01
    title: データの表し方
    context: |
      データの特徴が伝わるまとめ方を選ぶ。
    items:
      - id: s14p01a
        chapter: 1
        terms: [bar-pie-band-chart, index-number]
        topic: 単位も大きさも違う2つの時系列の伸びを比べるため基準年を100とする指数に直して同じグラフに描く
        level: 基本
        definition: false
        type: choice
        question: |
          ある会社の「売上高（億円）」と「従業員数（人）」の 10 年間の伸び方を、1 つのグラフで比べたい。最も適切な方法はどれか。
        choices:
          - 億円と人をそのまま同じ縦軸に描く
          - 2 つの系列を、それぞれ最初の年を 100 とする指数に直して、同じ目盛りの折れ線グラフに描く
          - 2 つの系列を足して 1 本の折れ線にする
          - 2 つの系列の 10 年分を、それぞれ円グラフにする
          - 売上高を従業員数で割った値だけを描く
        answer: 1
        distractors:
          - 単位も大きさも違うので、一方がほとんど平らに見えて比べられない
          - 正解
          - 単位の違う量を足しても意味がない
          - 円グラフは内訳を表す図で、時間の変化は表せない
          - 1 人あたりの売上はわかるが、2 つの伸び方を比べることはできない
        explanation: |
          **方針** 単位や大きさの違う系列の「伸び方」を比べるには、共通の基準にそろえる。

          **途中式** 最初の年を 100 とする指数にすると、どちらも 100 から始まり、「何 % 伸びたか」を同じ目盛りで比べられる。

          **答え** それぞれ最初の年を 100 とする指数に直して描く

          **間違えやすい点** 2 つの縦軸を使うグラフは、目盛りの取り方しだいで印象が大きく変わるので注意する。
      - id: s14p01b
        chapter: 1
        terms: [stem-and-leaf-plot, frequency-distribution-histogram]
        topic: 幹葉図はヒストグラムと違って元のデータの値が残ることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          30 人の得点を、幹葉図とヒストグラムのそれぞれで表した。幹葉図の利点として最も適切なものはどれか。
        choices:
          - データが何万個あっても見やすい
          - 階級の幅を自由に変えられる
          - 平均と標準偏差が図に書き込まれている
          - 分布の形がわかるうえに、元の一つ一つの値も読み取れる
          - 2 つの変数の関係がわかる
        answer: 3
        distractors:
          - データが多いと葉が長くなりすぎて見にくい
          - 階級の幅を自由に選べるのはヒストグラム（幹葉図は位で決まる）
          - 平均や標準偏差は図には書かれない
          - 正解
          - 2 つの変数の関係を見るのは散布図
        explanation: |
          **方針** 幹葉図とヒストグラムで、残る情報を比べる。

          **途中式** ヒストグラムは階級ごとの度数だけを表すが、幹葉図は葉に元の値の下の位を書くので、元の値が残る。

          **答え** 分布の形がわかるうえに、元の値も読み取れる

          **間違えやすい点** 幹葉図は、データが数十個程度のときに向いている。データが多いときはヒストグラムを使う。
      - id: s14p01c
        chapter: 1
        terms: [scales-of-measurement, mean-median-mode]
        topic: 5段階評価は順序尺度で平均は間隔が等しいと仮定したときの目安にすぎず中央値や割合も使うことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          満足度を「1：不満 〜 5：満足」の 5 段階で答えてもらった。このデータをまとめる方法として最も適切な考え方はどれか。
        choices:
          - 数字で答えているので比例尺度であり、「4 は 2 の 2 倍満足」といえる
          - 名義尺度なので、最頻値しか意味をもたない
          - 5 段階は順序尺度なので、各段階の割合や中央値でまとめ、平均は段階の間隔が等しいと考えたときの目安として使う
          - 平均だけを報告すれば十分である
          - 段階の数字には意味がないので、まとめることはできない
        answer: 2
        distractors:
          - 0 に意味がなく、間隔も等しいとは限らないので、比は意味をもたない
          - 段階には順序があるので、中央値も使える
          - 正解
          - 平均だけでは、意見が分かれているのか中ほどに集まっているのかがわからない
          - 順序には意味があるので、割合や中央値でまとめられる
        explanation: |
          **方針** 5 段階評価は「大小の順序」に意味がある順序尺度。

          **途中式** 段階の間隔（1 と 2 の差と、4 と 5 の差）が等しいとは限らないので、平均は目安。割合（例：4 以上の割合）や中央値は順序だけで決まる。

          **答え** 割合や中央値でまとめ、平均は目安として使う

          **間違えやすい点** 平均 3.0 でも、全員が 3 の場合と、1 と 5 に分かれた場合とでは意味がまったく違う。
  - id: s14p02
    title: 標準化と歪み
    context: |
      データの位置や形を数値で表す。
    items:
      - id: s14p02a
        chapter: 2
        terms: [standard-score, sum-of-random-variables, covariance-and-correlation]
        topic: 2科目の偏差値がどちらも60のとき合計点の偏差値は2科目の相関が1未満なら60より高くなることを計算する
        level: 応用
        definition: false
        type: choice
        question: |
          国語と数学の得点の標準偏差はどちらも 10、相関係数は 0.5 である。A さんは国語・数学ともに偏差値 60 だった。2 科目の合計点での A さんの偏差値はおよそいくらか。
        choices:
          - "60"
          - "70"
          - 約 64.1
          - 約 61.5
          - 約 56.7
        answer: 3
        distractors:
          - 2 科目とも 60 なので合計も 60 と考えている（合計の散らばりが変わることを考えていない）
          - 2 科目の平均からのずれ（標準偏差 1 個分ずつ）を足して 2 個分としている（合計の標準偏差は 2 倍にならない）
          - 相関を 0 として合計の標準偏差を計算している
          - 正解
          - 合計の標準偏差ではなく分散（標準偏差の 2 乗）で割っている
        explanation: |
          **方針** 合計点の平均からのずれと、合計点の標準偏差を求める。

          **途中式** A さんは各科目で平均より 10 点高いので、合計は平均より 20 点高い。合計の分散は $10^2+10^2+2\times 0.5\times 10\times 10=300$、標準偏差は $\sqrt{300}\approx 17.3$。標準得点は $20/17.3\approx 1.15$ で、偏差値は $50+10\times 1.15\approx 61.5$。

          **答え** 約 61.5

          **間違えやすい点** 相関が 1 未満なら、両方とも高い人は合計では相対的にさらに上の位置になる。偏差値は平均しても合計の偏差値にはならない。
      - id: s14p02b
        chapter: 2
        terms: [skewness-kurtosis, mean-median-mode]
        topic: 4個のデータの偏差の3乗の和の符号から歪度の符号を判定し平均と中央値の大小と結び付ける
        level: 標準
        definition: false
        type: choice
        question: |
          4 個のデータ 1, 2, 3, 10 の歪度（偏差の 3 乗の平均を標準偏差の 3 乗で割ったもの）について、正しいものはどれか。
        choices:
          - 偏差の和が 0 なので、歪度は 0
          - 偏差の 3 乗の和は −180 で負なので歪度は負
          - 偏差の 3 乗の和は 180 で正なので歪度は正。右に裾が長く、平均 4 は中央値 2.5 より大きい
          - 値の多くが平均より小さいので、歪度は負
          - 4 個では歪度は計算できない
        answer: 2
        distractors:
          - 偏差の和はいつも 0。歪度は偏差の 3 乗で決まる
          - 符号を取り違えている（大きく離れた 10 の偏差 6 の 3 乗 216 が効く）
          - 正解
          - 平均より小さい値が多いのは、右に裾が長い（歪度が正の）分布の特徴
          - データの個数が少なくても計算はできる
        explanation: |
          **方針** 平均を求め、偏差の 3 乗の和の符号を見る。

          **途中式** 平均は 4、偏差は −3, −2, −1, 6。3 乗は −27, −8, −1, 216 で、和は 180（正）。中央値は $(2+3)/2=2.5$。

          **答え** 歪度は正で、平均は中央値より大きい

          **間違えやすい点** 3 乗すると、大きく離れた値の影響が強く出る。右に 1 つ離れた値があると歪度は正になる。
  - id: s14p03
    title: 共分散と回帰の式
    context: |
      2 つの変数の関係を数値や式で表す。
    items:
      - id: s14p03a
        chapter: 3
        terms: [covariance-and-correlation, scatter-plot]
        topic: 散布図を平均の縦線と横線で4つに分けた点の数から共分散の符号を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          30 組のデータの散布図を、$x$ の平均と $y$ の平均を通る縦線と横線で 4 つに分けた。点の数は、右上 12、左下 11、左上 3、右下 4 で、どの点も平均からの離れ方は同じくらいだった。共分散について最も適切なものはどれか。
        choices:
          - 左上と右下の点もあるので、共分散は 0 である
          - 右上の点が最も多いので、共分散は負である
          - 共分散は点の数ではなく平均の大きさで決まる
          - 4 つの部分すべてに点があるので、共分散は計算できない
          - 右上と左下では偏差の積が正なので、それらの点が多いことから共分散は正と考えられる
        answer: 4
        distractors:
          - 正の積と負の積が打ち消し合うのは、両方が同じくらいのとき
          - 右上は x も y も平均より大きく、偏差の積は正
          - 共分散は偏差の積の平均で、平均そのものの大きさは関係ない
          - どこに点があっても共分散は計算できる
          - 正解
        explanation: |
          **方針** 右上と左下は偏差の積が正、左上と右下は負。

          **途中式** 正の積の点が 23、負の積の点が 7 で、離れ方が同じくらいなら、積の合計は正になる。

          **答え** 共分散は正と考えられる

          **間違えやすい点** 点の数だけでなく、平均からの離れ方の大きさも効く。大きく離れた少数の点が符号を決めることもある。
      - id: s14p03b
        chapter: 4
        terms: [simple-regression, least-squares-method]
        topic: 説明変数から平均を引いてから回帰すると切片が目的変数の平均になることを使う
        level: 標準
        definition: false
        type: choice
        question: |
          1 日の勉強時間 $x$（平均 4 時間）で得点 $y$（平均 62 点）を説明する回帰直線は $\hat y=42+5x$ だった。勉強時間から平均を引いた $x-4$ を説明変数にして回帰し直すと、切片はいくらになるか。
        choices:
          - "42"
          - "0"
          - "62"
          - "4"
          - "20"
        answer: 2
        distractors:
          - 説明変数を変えても切片は変わらないと考えている
          - 平均を引いたので切片も 0 になると考えている（0 になるのは y からも平均を引いたとき）
          - 正解
          - 説明変数の平均を答えている
          - 傾き × 説明変数の平均を答えている
        explanation: |
          **方針** 回帰直線は平均の点 $(\bar x,\ \bar y)$ を通る。$x-4=0$ は $x=\bar x$ のとき。

          **途中式** $\hat y=42+5x=42+5\times 4+5(x-4)=62+5(x-4)$。切片は 62、傾きは 5 のまま。

          **答え** 62

          **間違えやすい点** 説明変数から平均を引くと、切片は「平均的な説明変数での予測値」になり、意味のある値になる。傾きは変わらない。
  - id: s14p04
    title: 指数とトレンド
    context: |
      経済の時系列データを扱う。
    items:
      - id: s14p04a
        chapter: 5
        terms: [index-number, price-index]
        topic: 基準時の価格を重みにしたラスパイレス数量指数を求め数量比の単純平均と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの品目の基準時の価格と数量、比較時の数量は次のとおりだった。基準時の価格を重みにしたラスパイレス数量指数（基準時 ＝ 100）を求めよ。

          | 品目 | 基準時の価格 | 基準時の数量 | 比較時の数量 |
          |---|---|---|---|
          | A | 100 | 10 | 15 |
          | B | 300 | 10 | 10 |
        choices:
          - "125"
          - "150"
          - "100"
          - "137.5"
          - "112.5"
        answer: 4
        distractors:
          - 数量の比（1.5 と 1.0）を単純に平均している
          - 品目 A の数量の比だけを使っている
          - 品目 B の数量の比だけを使っている
          - 重みを入れかえている（A に 3000、B に 1000）
          - 正解
        explanation: |
          **方針** ラスパイレス数量指数は、基準時の価格で数量を評価した金額の比。$\dfrac{\sum p_0q_1}{\sum p_0q_0}\times 100$。

          **途中式** $\sum p_0q_0=1000+3000=4000$、$\sum p_0q_1=1500+3000=4500$。$4500/4000\times 100=112.5$。

          **答え** 112.5

          **間違えやすい点** 金額の大きい品目 B の数量が変わっていないので、A の数量が 1.5 倍でも全体は 12.5% 増にとどまる。
      - id: s14p04b
        chapter: 5
        terms: [time-series-components, simple-regression]
        topic: 四半期の売上を時点の番号で回帰した傾きから1年あたりのトレンドの増加を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある店の四半期ごとの売上を、時点の番号 $t$（1, 2, 3, …、1 つ増えると 1 四半期）を説明変数として回帰し、$\hat y=80+2.5t$ を得た。トレンドとして、売上は 1 年あたりおよそどれだけ増えているか。
        choices:
          - "2.5"
          - "10"
          - "82.5"
          - "30"
          - "0.625"
        answer: 1
        distractors:
          - 1 四半期あたりの増加を答えている
          - 正解
          - t ＝ 1 のときの予測値を答えている
          - 1 年を 12 期として計算している（四半期データの 1 年は 4 期）
          - 4 で割っている
        explanation: |
          **方針** 傾き 2.5 は「1 四半期あたりの平均的な増加」。

          **途中式** 1 年は 4 四半期なので $2.5\times 4=10$。

          **答え** 10

          **間違えやすい点** 季節変動のある四半期データでは、時点だけで回帰した残差に季節の波が残る。季節のダミー変数を加えるなどして確かめる。
  - id: s14p05
    title: 調査と観察研究
    context: |
      データの集め方と分析の注意点を考える。
    items:
      - id: s14p05a
        chapter: 6
        terms: [sampling-and-nonsampling-error, population-and-sample]
        topic: 標本調査は調査の質を管理しやすく非標本誤差を小さくできるので全数調査より正確になることがあると判断する
        level: 基本
        definition: false
        type: choice
        question: |
          全数調査と標本調査の比較として、最も適切なものはどれか。
        choices:
          - 全数調査はどんな場合でも標本調査より正確である
          - 標本調査には非標本誤差がない
          - 標本調査は対象が少ないぶん調査員の訓練や確認に手間をかけられ、非標本誤差を小さくできるので、全数調査より正確になることもある
          - 全数調査にも標本誤差がある
          - 標本調査の結果は、標本の大きさによらず信用できない
        answer: 2
        distractors:
          - 全数調査は標本誤差がないが、記入の誤りや回答漏れなどの非標本誤差が大きくなることがある
          - 標本調査にも非標本誤差はある
          - 正解
          - 全数調査には標本誤差はない
          - 無作為抽出で十分な大きさがあれば、誤差の大きさを評価して使える
        explanation: |
          **方針** 誤差を標本誤差と非標本誤差に分けて考える。

          **途中式** 全数調査は標本誤差がないが、対象が多いので調査の質を保ちにくく、非標本誤差が大きくなりやすい。標本調査は標本誤差があるが、質を管理しやすい。

          **答え** 非標本誤差を小さくできるので、全数調査より正確になることもある

          **間違えやすい点** 標本誤差は標本を大きくすれば小さくなるが、非標本誤差は調査の方法を工夫しないと小さくならない。
      - id: s14p05b
        chapter: 6
        terms: [observational-vs-experimental, stratified-scatter]
        topic: 観察研究で交絡因子の年齢の影響を減らすため年齢層ごとに分けて比べることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある観察研究で、運動習慣のある人はない人より血圧が低かった。ただし、運動習慣のある人は若い人が多く、年齢は血圧とも関係がある。年齢の影響を減らして比べる方法として、最も適切なものはどれか。
        choices:
          - 人数を 2 倍に増やして、同じように比べる
          - 年齢層ごとに分けて、同じ年齢層の中で運動習慣のある人とない人の血圧を比べる
          - 運動習慣のある人だけを調べる
          - 年齢を無視して、全体の平均の差をそのまま使う
          - 血圧の測定回数を増やす
        answer: 1
        distractors:
          - 標本を増やしても、年齢の偏りによる差は残る
          - 正解
          - 比べる相手がいなくなる
          - 年齢の違いが運動習慣の差に混ざったままになる
          - 測定の精度は上がるが、年齢の偏りは残る
        explanation: |
          **方針** 交絡因子（年齢）をそろえたうえで比べる。

          **途中式** 年齢層ごとに分けると、同じ年齢層の中では年齢の違いがほとんどないので、運動習慣による違いを比べやすくなる（層別）。回帰分析で年齢を説明変数に加える方法もある。

          **答え** 年齢層ごとに分けて、同じ年齢層の中で比べる

          **間違えやすい点** 層別や回帰で調整できるのは、測っている交絡因子だけ。測っていない要因の影響は残るので、観察研究から因果を言うのには限界がある。
  - id: s14p06
    title: 確率と確率変数
    context: |
      確率や期待値の性質を考える。
    items:
      - id: s14p06a
        chapter: 7
        terms: [conditional-probability, independence-of-events]
        topic: P(A｜B)がP(A)より大きいならP(B｜A)もP(B)より大きいという正の関連の対称性を判断する
        level: 応用
        definition: false
        type: choice
        question: |
          確率が正の事象 $A$、$B$ について、$P(A\mid B)>P(A)$ が成り立つ。正しいものはどれか。
        choices:
          - P(B｜A) ＞ P(B) も成り立つ
          - P(B｜A) ＜ P(B) が成り立つ
          - P(B｜A) ＝ P(B) が成り立つ
          - A と B は独立である
          - P(A｜B) ＞ P(B｜A) が成り立つ
        answer: 0
        distractors:
          - 正解
          - 正の関連は向きを変えても正のまま
          - 等しいのは A と B が独立なとき
          - 独立なら P(A｜B) ＝ P(A)
          - 2 つの条件付き確率の大小は、P(A) と P(B) の大小で決まる
        explanation: |
          **方針** 条件付き確率の定義 $P(A\mid B)=\dfrac{P(A\cap B)}{P(B)}$ を使う。

          **途中式** $P(A\mid B)>P(A)$ は $P(A\cap B)>P(A)P(B)$ と同じ。両辺を $P(A)$ で割ると $P(B\mid A)>P(B)$。

          **答え** $P(B\mid A)>P(B)$ も成り立つ

          **間違えやすい点** 「B が起きると A が起きやすい」なら「A が起きると B も起きやすい」。ただし $P(A\mid B)$ と $P(B\mid A)$ の値そのものは一般に違う。
      - id: s14p06b
        chapter: 8
        terms: [probability-mass-and-density-function, uniform-distribution]
        topic: 確率密度関数の値は確率ではないので1を超えてもよいことを区間0から0.5の一様分布で確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          0 から 0.5 の連続一様分布の確率密度関数の値は、区間の中で 2 である。この点について正しいものはどれか。
        choices:
          - 密度の値は確率ではなく、区間の長さを掛けて（面積で）確率になるので、1 を超えてもよい
          - 確率は 1 を超えられないので、この分布は存在しない
          - 密度が 2 なので、どの値も確率 2 でとる
          - 密度の値の合計が 1 になるように、密度は 1 以下でなければならない
          - 区間の長さが 0.5 なので、密度は 0.5 になるはず
        answer: 0
        distractors:
          - 正解
          - 面積は 2 × 0.5 ＝ 1 で、正しい確率密度関数
          - 連続型では、1 つの値をとる確率は 0
          - 1 になるのは密度の値の合計ではなく、密度の下の面積
          - 密度は 1 ÷ 区間の長さ ＝ 2
        explanation: |
          **方針** 連続型の確率は、確率密度関数の下の面積で表される。

          **途中式** 面積は $2\times 0.5=1$ で条件を満たす。例えば $P(0.1\le X\le 0.2)=2\times 0.1=0.2$。

          **答え** 密度の値は確率ではないので、1 を超えてもよい

          **間違えやすい点** 1 以下でなければならないのは確率（面積）で、密度の値ではない。
      - id: s14p06c
        chapter: 8
        terms: [joint-probability-function, expectation-variance-properties]
        topic: 同時確率表からXが1のときのYの条件付き期待値を条件付き分布から求め無条件の期待値と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$（0・1）と $Y$（1・2・3）の同時確率は、$p(0,1)=0.3$、$p(0,2)=0.2$、$p(0,3)=0.1$、$p(1,1)=0.1$、$p(1,2)=0.2$、$p(1,3)=0.1$ である。$X=1$ のときの $Y$ の条件付き期待値 $E[Y\mid X=1]$ を求めよ。
        choices:
          - "0.8"
          - "2.0"
          - "1.8"
          - 約 1.67
          - "0.5"
        answer: 1
        distractors:
          - P(X ＝ 1) ＝ 0.4 で割っていない
          - 正解
          - 条件を付けない Y の期待値を求めている
          - X ＝ 0 のときの条件付き期待値を求めている
          - 条件付き確率 P(Y ＝ 2｜X ＝ 1) を答えている
        explanation: |
          **方針** $X=1$ の行を $P(X=1)=0.4$ で割って条件付き分布を作り、期待値を求める。

          **途中式** 条件付き分布は $Y=1,2,3$ に 0.25, 0.5, 0.25。$E[Y\mid X=1]=1\times 0.25+2\times 0.5+3\times 0.25=2.0$。

          **答え** 2.0

          **間違えやすい点** $X=0$ のときは約 1.67 で、$X$ によって $Y$ の平均が違うので、$X$ と $Y$ は独立ではない。
  - id: s14p07
    title: 待ち時間と成功までの回数
