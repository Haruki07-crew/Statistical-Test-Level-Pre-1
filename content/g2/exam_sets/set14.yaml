  - id: s14p09
    title: 推定の使い方
    context: |
      推定の結果を正しく使う。
    items:
      - id: s14p09a
        chapter: 11
        terms: [confidence-interval, ci-two-sample-mean-difference]
        topic: 2つの群の95パーセント信頼区間が重なっていても平均の差の検定では有意になりうることを計算で確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの独立な群の標本平均は 50 と 55 で、標準誤差はどちらも 1.5 だった。それぞれの母平均の 95% 信頼区間は (47.06, 52.94) と (52.06, 57.94) で重なっている。2 つの母平均の差について、最も適切なものはどれか。
        choices:
          - 区間が重なっているので、差は有意ではない
          - 区間が重なっているので、2 つの母平均は等しい
          - 差の標準誤差は 1.5 ＋ 1.5 ＝ 3 なので、z ≈ 1.67 で有意ではない
          - 区間が重なっていても、差の標準誤差は約 2.12 で z ≈ 2.36 となり、有意水準 5% で差があると判断できる
          - 2 つの区間からは、差について何も判断できない
        answer: 3
        distractors:
          - 重なりで判断すると、本当は有意な差を見逃すことがある
          - 区間が重なることは、母平均が等しいことを示さない
          - 標準誤差どうしを足している（分散を足してから平方根をとる）
          - 正解
          - 標準誤差がわかれば、差の検定ができる
        explanation: |
          **方針** 差 $\bar x_2-\bar x_1$ の標準誤差は $\sqrt{1.5^2+1.5^2}$。

          **途中式** $\sqrt{4.5}\approx 2.12$、$z=5/2.12\approx 2.36>1.96$。差の 95% 信頼区間は $5\pm 1.96\times 2.12\approx(0.84,\ 9.16)$ で 0 を含まない。

          **答え** 区間が重なっていても、差は有意と判断できる

          **間違えやすい点** 2 つの区間が重ならなければ差は有意だが、重なっていても有意なことがある。差は、差の区間や検定で調べる。
      - id: s14p09b
        chapter: 11
        terms: [stratified-sampling, standard-error]
        topic: 層化抽出の2つの層の標本平均の標準誤差から層の大きさで重み付けした全体の推定値の標準誤差を分散の重み付きの和として求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある市の世帯を都市部（全体の 60%）と郊外（40%）に分けて層化抽出を行った。1 世帯あたりの支出の標本平均は都市部 3.0 万円、郊外 5.0 万円で、それぞれの標本平均の標準誤差は 0.2 万円と 0.3 万円だった。市全体の平均の推定値 $0.6\times 3.0+0.4\times 5.0=3.8$ 万円の標準誤差を求めよ（2 つの層の標本は独立）。
        choices:
          - 0.5 万円
          - 0.24 万円
          - 約 0.17 万円
          - 約 0.36 万円
          - 約 0.029 万円
        answer: 2
        distractors:
          - 2 つの標準誤差を足している
          - 標準誤差を重みで平均している（分散を重みの 2 乗で足してから平方根をとる）
          - 正解
          - 重みを掛けずに分散を足している
          - 分散のまま答えている（平方根をとっていない）
        explanation: |
          **方針** 独立な量の 1 次結合の分散は、係数の 2 乗 × 分散 の和。

          **途中式** $0.6^2\times 0.2^2+0.4^2\times 0.3^2=0.0144+0.0144=0.0288$。標準誤差は $\sqrt{0.0288}\approx 0.17$ 万円。

          **答え** 約 0.17 万円

          **間違えやすい点** 標準誤差どうしを足したり平均したりしない。重みは 2 乗して分散に掛ける。
      - id: s14p09c
        chapter: 11
        terms: [ci-variance, chi-squared-distribution]
        topic: カイ二乗分布による母分散の信頼区間は母集団が正規分布でないと大きく外れることがあることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          カイ二乗分布を使う母分散の信頼区間と、t 分布を使う母平均の信頼区間について、母集団の分布が正規分布から外れているときの影響として最も適切なものはどれか。
        choices:
          - どちらの区間も、標本が大きければ正規分布でなくても正しい
          - どちらの区間も、正規分布でなければまったく使えない
          - 標本が大きければ母平均の区間は中心極限定理によりおよそ正しいが、母分散の区間は正規分布の仮定に強く頼っていて、標本が大きくても外れることがある
          - 母分散の区間のほうが、正規分布から外れても影響を受けにくい
          - 信頼区間は母集団の分布の形とまったく関係がない
        answer: 2
        distractors:
          - 母分散の区間は、裾の重さ（尖度）の影響を強く受ける
          - 母平均の区間は、標本が大きければおよそ使える
          - 正解
          - 逆。影響を受けやすいのは母分散の区間
          - 区間を作るときの分布は、母集団の分布の仮定から導かれる
        explanation: |
          **方針** 母平均の区間は標本平均の分布、母分散の区間は不偏分散の分布にもとづく。

          **途中式** 標本平均の分布は中心極限定理で正規分布に近づくが、$(n-1)s^2/\sigma^2$ がカイ二乗分布にしたがうのは母集団が正規分布のときだけ。裾の重い分布では、不偏分散の散らばりが大きく、区間が母分散を含む割合が 95% より大きく下がることがある。

          **答え** 母平均の区間はおよそ正しいが、母分散の区間は外れることがある

          **間違えやすい点** 母分散の区間や検定を使う前に、ヒストグラムなどで分布の形を確かめる。
      - id: s14p09d
        chapter: 11
        terms: [unbiased-estimator, point-estimation]
        topic: 不偏推定量の意味を何度も標本をとったときの推定値の平均が母数に等しいこととして答える
        level: 基本
        definition: true
        type: choice
        question: |
          「標本平均は母平均の不偏推定量である」の意味として、正しいものはどれか。
        choices:
          - 1 回の標本で求めた標本平均は、いつも母平均に等しい
          - 標本平均と母平均の差は、いつも 1 以下である
          - 標本を大きくすると、標本平均は母平均から離れていく
          - 標本平均の分散は 0 である
          - 同じ大きさの標本を何度もとって標本平均を求めると、その平均（期待値）が母平均に等しい
        answer: 4
        distractors:
          - 1 回ごとの標本平均は母平均からずれる。等しいのは平均的に
          - 差の大きさについての性質ではない
          - 標本を大きくすると母平均に近づく（一致性）
          - 標本平均の分散は σ²/n で、0 ではない
          - 正解
        explanation: |
          **方針** 不偏性は、推定量の期待値についての性質。

          **途中式** $E[\bar X]=\mu$ なので、何度も標本をとって標本平均を平均すると $\mu$ に近づく。

          **答え** 何度もとったときの標本平均の平均が母平均に等しい

          **間違えやすい点** 不偏でも 1 回ごとの推定値はずれる。ずれの大きさは標準誤差で表す。
  - id: s14p10
    title: 検定の前提と解釈
    context: |
      検定を正しく使う。
    items:
      - id: s14p10a
        chapter: 12
        terms: [type-i-and-ii-errors, significance-level]
        topic: 標本を大きくしても第1種の過誤の確率は有意水準のままで第2種の過誤の確率が小さくなることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          有意水準を 5% に決めたまま、標本の大きさを大きくした。第 1 種の過誤と第 2 種の過誤の確率はどう変わるか。
        choices:
          - 第 1 種の過誤の確率も第 2 種の過誤の確率も小さくなる
          - 第 1 種の過誤の確率は小さくなり、第 2 種の過誤の確率は変わらない
          - どちらも変わらない
          - 第 1 種の過誤の確率は 5% のまま変わらず、第 2 種の過誤の確率は小さくなる
          - 第 1 種の過誤の確率は大きくなり、第 2 種の過誤の確率は小さくなる
        answer: 3
        distractors:
          - 第 1 種の過誤の確率は、有意水準として自分で決めた値
          - 逆。変わらないのは第 1 種の過誤の確率
          - 標本を大きくすると検出力が上がり、第 2 種の過誤の確率は下がる
          - 正解
          - 有意水準を変えていないので、第 1 種の過誤の確率は変わらない
        explanation: |
          **方針** 第 1 種の過誤の確率は有意水準そのもの。第 2 種の過誤の確率は 1 − 検出力。

          **途中式** 棄却域は有意水準で決まるので、第 1 種の過誤の確率は 5% のまま。標本が大きいと標準誤差が小さくなり、検出力が上がる。

          **答え** 第 1 種は変わらず、第 2 種は小さくなる

          **間違えやすい点** 有意水準を下げると第 1 種の過誤は減るが、第 2 種の過誤は増える。両方を減らすには標本を大きくする。
      - id: s14p10b
        chapter: 12
        terms: [one-sample-t-test, standard-error]
        topic: 同じ人から繰り返し測った値を独立なデータとして扱うと標準誤差を小さく見積もり有意になりやすいことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい睡眠法の効果を調べるため、3 人に試してもらい、1 人につき 10 晩ずつ睡眠時間を測った。この 30 個の値を独立な 30 人分のデータとして 1 標本 t 検定を行った。この分析の問題点として最も適切なものはどれか。
        choices:
          - データが 30 個あるので、問題はない
          - 1 人 10 晩では少ないので、標準誤差を大きく見積もってしまう
          - t 検定ではなく z 検定を使えば、問題はなくなる
          - 睡眠時間は正規分布にしたがうので、問題はない
          - 同じ人の値どうしは似ているので独立ではなく、標準誤差を小さく見積もって、有意になりやすくなる
        answer: 4
        distractors:
          - 実際の独立な情報は 3 人分に近い
          - 問題は数の少なさではなく、値が独立でないこと
          - 独立でないことの問題は、検定の種類を変えても解決しない
          - 分布の形ではなく、値どうしの独立性の問題
          - 正解
        explanation: |
          **方針** t 検定は、値どうしが独立であることを前提にしている。

          **途中式** 同じ人の 10 晩は似た値になるので、30 個の値の情報は独立な 30 人分よりずっと少ない。独立とみなすと標準誤差 $s/\sqrt{30}$ が小さすぎ、t 値が大きくなる。

          **答え** 独立でないので、標準誤差を小さく見積もり、有意になりやすくなる

          **間違えやすい点** 1 人ごとに平均してから 3 人分のデータとして扱う、人数を増やすなど、分析の単位をそろえる。
      - id: s14p10c
        chapter: 12
        terms: [p-value, one-sided-two-sided-test]
        topic: 右片側検定で検定統計量が負の側に出たときのp値は0.5より大きいことを求める
        level: 応用
        definition: false
        type: choice
        question: |
          帰無仮説 $\mu=\mu_0$、対立仮説 $\mu>\mu_0$ の z 検定で、検定統計量は $z=-1.8$ だった。この検定の p 値を求めよ。ただし $P(Z>1.8)=0.0359$ とする。
        choices:
          - 約 0.964
          - 約 0.036
          - 約 0.072
          - "0.5"
          - "0"
        answer: 0
        distractors:
          - 正解
          - 統計量の符号を無視して、右側の裾の確率を求めている
          - 両側の p 値を求めている
          - 根拠なく 0.5 としている
          - p 値が 0 になることはない
        explanation: |
          **方針** 右片側の p 値は $P(Z\ge z_{\text{観測}})$。

          **途中式** $P(Z\ge -1.8)=1-P(Z<-1.8)=1-0.0359=0.9641$。

          **答え** 約 0.964

          **間違えやすい点** 統計量が対立仮説と逆向きに出たときは、p 値は 0.5 より大きく、棄却されない。逆向きの差を後から検定し直すのは誤り。
  - id: s14p11
    title: 2 群の比較の考え方
    context: |
      2 つの群を比べる検定を考える。
    items:
      - id: s14p11a
        chapter: 13
        terms: [two-sample-t-test, central-limit-theorem]
        topic: 2標本t検定は標本が大きければ母集団が正規分布でなくてもおよそ使えることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          2 つの群（各 200 人）の購入金額を 2 標本 t 検定で比べたい。購入金額の分布は右に裾が長く、正規分布ではない。最も適切な考え方はどれか。
        choices:
          - 正規分布でないので、t 検定はまったく使えない
          - 正規分布でないので、カイ二乗検定を使わなければならない
          - 分布が右に裾が長いと、t 検定は必ず有意になる
          - 標本が大きいほど、正規分布でないことの影響は大きくなる
          - 標本が大きいので、標本平均の分布は中心極限定理によりおよそ正規分布になり、t 検定はおよそ使える
        answer: 4
        distractors:
          - 標本が大きければ、平均の差の検定はおよそ正しく使える
          - カイ二乗検定は度数（カテゴリ）のデータに使う
          - 分布の形で必ず有意になるわけではない
          - 標本が大きいほど、中心極限定理で影響は小さくなる
          - 正解
        explanation: |
          **方針** t 検定で必要なのは、標本平均（の差）の分布が正規分布に近いこと。

          **途中式** 各群 200 人なら、もとの分布が偏っていても標本平均の分布はおよそ正規分布になる。

          **答え** 標本が大きいので、t 検定はおよそ使える

          **間違えやすい点** 標本が小さく分布が大きく偏っているときは、外れ値の影響を受けやすいので、データの変換やほかの方法も考える。
      - id: s14p11b
        chapter: 13
        terms: [pooled-variance, two-sample-t-test]
        topic: 大きさの違う2群の不偏分散を自由度で重み付けしてプールした分散を求め単純平均と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          大きさ 5 の群の不偏分散は 8、大きさ 9 の群の不偏分散は 20 だった。等分散を仮定した 2 標本 t 検定で使うプールした分散を求めよ。
        choices:
          - "14"
          - "16"
          - 約 15.7
          - "28"
          - 約 13.7
        answer: 1
        distractors:
          - 2 つの不偏分散を単純に平均している（大きい群の情報を重く扱っていない）
          - 正解
          - 自由度ではなく大きさ（5 と 9）で重みを付けている
          - 2 つの不偏分散を足している
          - 偏差の 2 乗の和を n₁ ＋ n₂ ＝ 14 で割っている（正しくは n₁ ＋ n₂ − 2）
        explanation: |
          **方針** プールした分散は、2 つの群の偏差の 2 乗の和を合わせて、自由度の合計で割る。

          **途中式** $\dfrac{(5-1)\times 8+(9-1)\times 20}{5+9-2}=\dfrac{32+160}{12}=16$。

          **答え** 16

          **間違えやすい点** 大きい群の不偏分散のほうが信頼できるので、自由度で重みを付ける。単純平均の 14 とは違う。
      - id: s14p11c
        chapter: 13
        terms: [two-sample-proportion-test]
        topic: 2つの比率の差の検定で帰無仮説のもとでは母比率が共通なので2群を合わせた比率で標準誤差を求める理由を答える
        level: 基本
        definition: false
        type: choice
        question: |
          2 つの群の比率の差の検定で、標準誤差を計算するときに、2 つの群を合わせた比率を使う理由として最も適切なものはどれか。
        choices:
          - 2 つの群の大きさが違うときに、計算を簡単にするため
          - 合わせた比率を使うと、必ず有意になるから
          - 帰無仮説「2 つの母比率は等しい」のもとでは共通の母比率があり、2 群を合わせた比率がその推定値になるから
          - 合わせた比率を使うと、標準誤差が 0 になるから
          - 2 つの群の比率のうち、大きいほうを使うのと同じだから
        answer: 2
        distractors:
          - 大きさが違っても同じでも、帰無仮説のもとの推定のために合わせる
          - 有意になりやすくするための工夫ではない
          - 正解
          - 標準誤差は 0 にならない
          - 合わせた比率は 2 つの比率の間の値（人数で重み付けした平均）
        explanation: |
          **方針** 検定統計量は、帰無仮説が正しいとしたときの分布で考える。

          **途中式** 帰無仮説のもとでは $p_1=p_2=p$ なので、2 群の成功の合計 ÷ 人数の合計で $p$ を推定し、標準誤差 $\sqrt{p(1-p)(1/n_1+1/n_2)}$ を計算する。

          **答え** 帰無仮説のもとの共通の母比率を推定するため

          **間違えやすい点** 母比率の差の信頼区間を作るときは、帰無仮説を置かないので、それぞれの群の比率を使う。
  - id: s14p12
    title: 回帰の精度と説明力
    context: |
      回帰分析の結果の精度と説明力を考える。
    items:
      - id: s14p12a
        chapter: 14
        terms: [regression-coefficient-t-test, simple-regression]
        topic: 傾きの標準誤差は説明変数の偏差平方和の平方根に反比例するので説明変数を広い範囲でとると傾きの推定が精密になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          肥料の量 $x$ と収穫量 $y$ の関係を単回帰で調べる実験を計画する。データの数が同じとき、傾きを最も精密に推定できる（標準誤差が小さい）$x$ の決め方はどれか（関係は直線と考えてよい範囲とする）。
        choices:
          - x をすべて同じ値にする
          - x を平均の近くの狭い範囲に集める
          - x の決め方は、傾きの精度に影響しない
          - 調べたい範囲の中で、x をできるだけ広く散らばらせる
          - x を小さい値だけにする
        answer: 3
        distractors:
          - x がすべて同じだと、傾きは推定できない
          - 散らばりが小さいと、傾きの標準誤差が大きくなる
          - 傾きの標準誤差は x の散らばりで決まる
          - 正解
          - 範囲が狭くなり、散らばりが小さくなる
        explanation: |
          **方針** 傾きの標準誤差は $\dfrac{s}{\sqrt{S_{xx}}}$（$S_{xx}$ は $x$ の偏差平方和）。

          **途中式** $x$ を広く散らばらせると $S_{xx}$ が大きくなり、標準誤差が小さくなる。

          **答え** $x$ をできるだけ広く散らばらせる

          **間違えやすい点** 両端だけに集めると曲がりを確かめられないので、実際には中ほどにも点を置く。直線と考えてよい範囲の外に広げてはいけない。
      - id: s14p12b
        chapter: 14
        terms: [coefficient-of-determination, multiple-regression-model]
        topic: 2つの説明変数を入れた重回帰の決定係数はそれぞれの単回帰の決定係数の大きいほう以上になることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          $y$ を $x_1$ だけで説明する単回帰の決定係数は 0.36、$x_2$ だけで説明する単回帰の決定係数は 0.25 だった。$x_1$ と $x_2$ の両方を使う重回帰の決定係数について、必ず正しいものはどれか。
        choices:
          - 0.36 以上である
          - ちょうど 0.61（＝ 0.36 ＋ 0.25）になる
          - 0.61 以上である
          - 0.25 以下である
          - 0.36 と 0.25 の平均 0.305 になる
        answer: 0
        distractors:
          - 正解
          - 和になるのは x₁ と x₂ が無相関のときだけ
          - 説明変数どうしに相関があると、0.61 より小さくなることが多い
          - 説明変数を加えると、決定係数は下がらない
          - 平均になる理由はない
        explanation: |
          **方針** 説明変数を加えると、決定係数は下がらない（加えた変数の係数を 0 にすれば元のモデルと同じになるため）。

          **途中式** 重回帰の決定係数は、$x_1$ だけのモデルの 0.36 以上。$x_1$ と $x_2$ の相関が強いと 0.36 に近く、無相関なら 0.61 になる。

          **答え** 0.36 以上である

          **間違えやすい点** 説明変数どうしが似ていると、加えても説明力はあまり増えない。
      - id: s14p12c
        chapter: 14
        terms: [overall-f-test-regression, coefficient-of-determination]
        topic: データ数が非常に多いと決定係数が小さくても回帰全体のF検定が有意になり有意性と説明力が別であることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          1 万件のデータの単回帰分析で、回帰全体の F 検定の p 値は 0.0001 未満だったが、決定係数は 0.02 だった。最も適切な解釈はどれか。
        choices:
          - p 値が非常に小さいので、予測はとても正確である
          - 決定係数が小さいので、F 検定の結果は誤りである
          - 決定係数が小さいので、説明変数と目的変数にはまったく関係がない
          - p 値が小さいので、決定係数も大きいはずである
          - 説明変数と目的変数に関係があると判断できるが、目的変数の変動のうち説明できるのは 2% だけで、個々の予測にはほとんど役立たない
        answer: 4
        distractors:
          - 有意であることと、予測の精度（説明力）は別
          - データが多いと、小さな関係でも有意になる
          - 有意なので、関係はあると判断できる
          - データの数が多いと、決定係数が小さくても有意になる
          - 正解
        explanation: |
          **方針** F 統計量は $\dfrac{R^2/k}{(1-R^2)/(n-k-1)}$ で、$n$ が大きいと $R^2$ が小さくても大きくなる。

          **途中式** $\dfrac{0.02}{0.98/9998}\approx 204$ で、非常に有意になる。しかし変動の 98% は説明されていない。

          **答え** 関係はあるが、説明できるのは 2% だけ

          **間違えやすい点** 有意性（関係があるか）と、決定係数（どれだけ説明できるか）は別の問い。
  - id: s14p13
    title: 実験の結果と計画
    context: |
      実験の計画と結果の分析を考える。
    items:
      - id: s14p13a
        chapter: 15
        terms: [one-way-anova, main-effect-and-interaction]
        topic: 一元配置で各群の平均から全体の平均を引いて処理の効果の推定値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 つの処理（各 8 個）の一元配置の実験で、群の平均は 12、15、18 だった。処理 3 の効果（処理 3 の平均 − 全体の平均）の推定値を求めよ。
        choices:
          - "18"
          - "6"
          - "15"
          - "3"
          - "−3"
        answer: 3
        distractors:
          - 処理 3 の平均をそのまま答えている
          - 処理 1 との差を求めている
          - 全体の平均を答えている
          - 正解
          - 引く順番を逆にしている
        explanation: |
          **方針** 各群の大きさが等しいので、全体の平均は群の平均の平均。

          **途中式** 全体の平均は $(12+15+18)/3=15$。処理 3 の効果は $18-15=3$（処理 1 は −3、処理 2 は 0）。

          **答え** 3

          **間違えやすい点** 効果の推定値の合計（各群の大きさが等しいとき）は 0 になる。
      - id: s14p13b
        chapter: 15
        terms: [fisher-three-principles, treatment-and-control]
        topic: 午前に処理Aだけを午後に処理Bだけを測ると時間帯の影響と処理の効果が区別できないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          2 種類の測定方法 A・B を比べるため、午前中にすべての試料を方法 A で、午後にすべての試料を方法 B で測った。この計画の問題点として最も適切なものはどれか。
        choices:
          - 試料の数が多すぎる
          - 時間帯による違い（室温や機械の状態など）と方法の違いが重なり、どちらの影響か区別できない
          - 2 つの方法を同じ日に測っているので問題はない
          - 午前と午後で測ると、測定の回数が足りなくなる
          - 方法 A と B で同じ試料を使っているので、比べられない
        answer: 1
        distractors:
          - 数の多さではなく、割り付け方の問題
          - 正解
          - 同じ日でも、時間帯の違いが方法の違いと重なる
          - 回数ではなく、割り付け方の問題
          - 同じ試料を両方で測るのは、対応のある比較として有効
        explanation: |
          **方針** 比べたい要因（方法）と、ほかの要因（時間帯）が同時に変わっていないかを確かめる。

          **途中式** 方法 A はいつも午前、B はいつも午後なので、差が出ても方法の違いか時間帯の違いかがわからない（交絡）。

          **答え** 時間帯と方法の違いが区別できない

          **間違えやすい点** 測る順番を無作為に決める（無作為化）、午前と午後の両方で A と B を測る（局所管理）などで防ぐ。
