    items:
      - id: s14p07a
        chapter: 9
        terms: [binomial-distribution, distribution-shape]
        topic: 成功確率が0.5より小さい二項分布は右に裾が長く0.5なら左右対称になることを答える
        level: 基本
        definition: false
        type: choice
        question: |
          二項分布 $B(10,\ p)$ の形について、正しいものはどれか。
        choices:
          - p によらず、いつも左右対称である
          - p が 0.5 より小さいと、左に裾が長い形になる
          - p ＝ 0.5 のときが最も右に偏る
          - p ＝ 0.5 なら左右対称で、p が 0.5 より小さいと右に裾が長い形になる
          - 二項分布は、いつも正規分布と同じ形である
        answer: 3
        distractors:
          - p が 0.5 でないと対称にならない
          - p が小さいと 0 の近くに山があり、右に裾が伸びる
          - p ＝ 0.5 のときは対称
          - 正解
          - 離散型で、n が小さいときや p が極端なときは正規分布と形が違う
        explanation: |
          **方針** 期待値 $np$ の位置と、とりうる値の範囲 0〜10 を比べる。

          **途中式** $p=0.2$ なら期待値は 2 で山は左寄り、右に 10 まで裾が伸びる。$p=0.5$ なら $P(X=k)=P(X=10-k)$ で対称。

          **答え** $p=0.5$ なら対称、$p<0.5$ なら右に裾が長い

          **間違えやすい点** $p>0.5$ なら左に裾が長い。$n$ が大きくなると、どの $p$ でも正規分布に近づく。
      - id: s14p07b
        chapter: 9
        terms: [exponential-distribution]
        topic: 独立な2台の機械の故障までの時間がそれぞれ平均10時間の指数分布のとき先に故障するまでの時間の平均を求める
        level: 応用
        definition: false
