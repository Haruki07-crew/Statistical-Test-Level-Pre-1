        choices:
          - 合計の標準偏差は √n σ で大きくなり、平均の標準偏差は σ/√n で小さくなる
          - 合計の標準偏差も平均の標準偏差も小さくなる
          - 合計の標準偏差も平均の標準偏差も変わらない
          - 合計の標準偏差は nσ で大きくなり、平均の標準偏差は σ/n で小さくなる
          - 合計の標準偏差は小さくなり、平均の標準偏差は大きくなる
        answer: 0
        distractors:
          - 正解
          - 合計は値を足すので、散らばりも大きくなる
          - どちらも n によって変わる
          - 標準偏差は n ではなく √n に比例・反比例する（分散が n 倍・1/n 倍）
          - 増減を逆にしている
        explanation: |
          **方針** 独立な $n$ 個の和の分散は $n\sigma^2$、平均の分散は $\sigma^2/n$。

          **途中式** 標準偏差は、合計が $\sqrt n\,\sigma$、平均が $\sigma/\sqrt n$。

          **答え** 合計は $\sqrt n\,\sigma$ で大きく、平均は $\sigma/\sqrt n$ で小さくなる

          **間違えやすい点** 大数の法則で安定するのは平均（や割合）で、合計（や回数の差）は $n$ とともに散らばりが大きくなる。
      - id: s14p08c
