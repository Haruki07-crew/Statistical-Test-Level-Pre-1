        choices:
          - 5 時間
          - 10 時間
          - 20 時間
          - 約 7.07 時間
          - 約 6.93 時間
        answer: 0
        distractors:
          - 正解
          - 2 台になっても先に壊れるまでの時間は変わらないと考えている
          - 2 台の平均を足している（両方が壊れるまでの時間とも違う）
          - 平均を √2 で割っている
          - 1 台の中央値（10 × log 2）を答えている
        explanation: |
          **方針** 平均 10 時間の指数分布のレートは 1/10 = 0.1（1 時間あたり）。

