          - 正解
          - 有意水準 10% の右片側の棄却域
        explanation: |
          **方針** 両側 10% なので、左右に 5% ずつ。上側 5% 点は 1.645。

          **途中式** $P(|Z|>1.645)=0.10$

          **答え** $|Z|>1.645$

          **間違えやすい点** 有意水準 5% の右片側検定の点も 1.645。どちらの検定かを確かめる。
      - id: s10p09d
        chapter: 13
        terms: [independence-test]
        topic: 3行4列のクロス表の独立性の検定の自由度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 つの年代と 4 つの好きなスポーツのクロス表（3 行 4 列）で独立性のカイ二乗検定を行う。自由度はいくらか。
        choices:
          - '6'
          - '12'
          - '11'
          - '7'
          - '5'
        answer: 0
        distractors:
          - 正解
          - セルの数をそのまま自由度にした
          - セルの数から 1 を引いた（適合度検定の考え方を当てはめた）
          - 行の数と列の数を足した
          - 行の数 − 1 と列の数 − 1 を足した
        explanation: |
          **方針** 独立性の検定の自由度は（行の数 − 1）×（列の数 − 1）。

          **途中式** $(3-1)\times(4-1)=6$

          **答え** 6

          **間違えやすい点** 行と列の合計が決まると、自由に決められるセルは $2\times 3=6$ 個。
      - id: s10p09e
        chapter: 13
        terms: [pearson-chi-square-statistic, independence-test, expected-frequency]
        topic: クロス表の各セルのカイ二乗統計量への寄与からどの選択肢で地域による違いが表れているかを読み取る
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの地域（各 60 人）で、3 つの案のどれを支持するかをたずねた。

          | | 案 1 | 案 2 | 案 3 |
          |---|---|---|---|
          | 地域 A | 30 | 10 | 20 |
          | 地域 B | 10 | 30 | 20 |

          独立性のカイ二乗統計量と、地域による違いの表れ方の組合せとして正しいものはどれか。
        choices:
          - χ² ＝ 20 で、違いは案 3 の支持に最も強く表れている
          - χ² ＝ 10 で、違いは案 1 と案 2 の支持に表れている
          - χ² ＝ 20 で、どの案の支持にも同じように違いがある
          - χ² ＝ 0 で、地域による違いはない
          - χ² ＝ 20 で、違いは案 1 と案 2 の支持に表れ、案 3 の支持には違いがない
        answer: 4
        distractors:
          - 案 3 は観測度数と期待度数が等しく、寄与は 0
          - 地域 A の行だけを足した
          - 案 3 のセルの寄与は 0 で、案 1・案 2 に偏っている
          - 案 1 と案 2 で大きくずれている
          - 正解
        explanation: |
          **方針** 期待度数はどのセルも 20（各列の合計が 40、各行が 60）。各セルの $(O-E)^2/E$ を比べる。

          **途中式** 案 1・案 2 のセルは各 $10^2/20=5$、案 3 は 0。合計 $\chi^2=20$。

          **答え** χ² ＝ 20 で、違いは案 1 と案 2 に表れる

          **間違えやすい点** 検定で有意になったら、どのセルが大きく寄与しているかを見ると、関連の中身がわかる。
      - id: s10p09f
        chapter: 13
        terms: [f-test-equal-variances, f-distribution]
        topic: 新しい機械のばらつきが大きいかを右片側の等分散のF検定で調べ上側5パーセント点と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          新しい機械（11 個）と従来の機械（13 個）の製品の重さの不偏分散は、25 と 10 だった。「新しい機械のほうが母分散が大きい」を対立仮説とする有意水準 5% の F 検定の結果として正しいものはどれか。
        choices:
          - F ＝ 2.5 で、$F_{0.05}(10,12)=2.753$ より小さいが、分散が 2 倍以上なので棄却する
          - F ＝ 2.5 で、1.645 より大きいので棄却する
          - F ＝ 0.4 で、棄却しない
          - F ＝ 2.5 で、$F_{0.05}(10,12)=2.753$ より小さいので棄却しない
          - F ＝ 2.5 で、2 より大きいので棄却する
        answer: 3
        distractors:
          - 点より小さいのに棄却した（分散が 2 倍以上なら有意という決まりはない）
          - F 分布ではなく標準正規分布の点を使った
          - 分子と分母を逆にした
          - 正解
          - 分散が 2 倍以上なら有意、という決まりはない
        explanation: |
          **方針** $F=s_{\text{新}}^2/s_{\text{従来}}^2$ は自由度 $(11-1,\ 13-1)=(10,\ 12)$ の F 分布にしたがう。右片側なので上側 5% 点と比べる。

          **途中式** $F=25/10=2.5<2.753$

          **答え** 棄却しない

          **間違えやすい点** 分散が 2.5 倍でも、標本が小さいと有意にならない。
  - id: s10p10
    title: 重回帰の自由度と多重共線性
    context: |
      40 件のデータで、説明変数 4 個の重回帰分析を行った。
    items:
      - id: s10p10a
        chapter: 14
        terms: [regression-output, multiple-regression-model]
        topic: データ数40で説明変数4個の重回帰の残差の自由度を切片を含めて数える
        level: 基本
        definition: false
        type: choice
        question: |
          この重回帰分析の残差の自由度（係数の t 検定に使う自由度）はいくらか。
        choices:
          - '36'
          - '39'
          - '4'
          - '35'
          - '40'
        answer: 3
        distractors:
          - 切片の分を引き忘れた
          - データの数から 1 だけ引いた
          - 説明変数の数を答えた（回帰の自由度）
          - 正解
          - データの数をそのまま答えた
        explanation: |
          **方針** 残差の自由度 ＝ データの数 − 推定した係数の数（切片を含む）＝ $n-p-1$。

          **途中式** $40-4-1=35$

          **答え** 35

          **間違えやすい点** 回帰の自由度は $p=4$、全体の自由度は $n-1=39$ で、$4+35=39$。
      - id: s10p10b
        chapter: 14
        terms: [multicollinearity]
        topic: ある説明変数を他の説明変数で回帰したときの決定係数0.9から分散拡大要因を求める
        level: 標準
        definition: false
        type: choice
        question: |
          説明変数 $x_1$ を、ほかの 3 つの説明変数で回帰したときの決定係数は 0.9 だった。$x_1$ の分散拡大要因（VIF）はいくらか。
        choices:
          - '0.1'
          - '0.9'
          - '10'
          - '1.11'
          - '9'
        answer: 2
        distractors:
          - $1-R^2$ を答えた
          - 決定係数をそのまま答えた
          - 正解
          - $1/R^2$ を計算した
          - $R^2/(1-R^2)$ を計算した
        explanation: |
          **方針** VIF $=1/(1-R_j^2)$。$R_j^2$ は $x_j$ を他の説明変数で回帰したときの決定係数。

          **途中式** $1/(1-0.9)=10$

          **答え** 10

          **間違えやすい点** VIF が 10 以上だと多重共線性が強いとされることが多い。係数の分散が、相関がない場合の約 10 倍になる。
      - id: s10p10c
        chapter: 14
        terms: [confidence-and-prediction-interval-regression, simple-regression]
        topic: 単回帰の予測区間の幅が説明変数の平均の位置で最も狭くなることを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          別の単回帰分析で、説明変数 $x$ の平均は 20、データの範囲は 10〜30 だった。新しい 1 つの値 $y$ の 95% 予測区間の幅が最も狭くなる $x$ の値はどれか。
        choices:
          - '10'
          - '20'
          - '30'
          - '0'
          - どの $x$ でも同じ
        answer: 1
        distractors:
          - データの端では直線の推定の不確かさが大きい
          - 正解
          - データの端では直線の推定の不確かさが大きい
          - データの範囲外（外挿）ではさらに広い
          - $x$ が平均から離れるほど広くなる
        explanation: |
          **方針** 予測区間の標準誤差は $s\sqrt{1+\dfrac1n+\dfrac{(x-\bar x)^2}{S_{xx}}}$。

          **途中式** $(x-\bar x)^2$ が 0 になる $x=\bar x=20$ で最小。

          **答え** 20

          **間違えやすい点** データの中心から離れるほど、予測の不確かさは大きくなる。
  - id: s10p11
    title: 実験の進め方
    context: |
      20 区画の畑で、2 種類の肥料を比べる実験を行う。
    items:
      - id: s10p11a
        chapter: 15
        terms: [treatment-and-control, fisher-three-principles]
        topic: 処理を無作為に割り付ける具体的な方法として区画に番号を付けて乱数で選ぶ方法を選ぶ
        level: 基本
        definition: true
        type: choice
        question: |
          20 区画に肥料 A・B を 10 区画ずつ無作為に割り付けたい。最も適切な方法はどれか。
        choices:
          - 区画に 1〜20 の番号を付け、乱数で 10 個の番号を選んで A とし、残りを B とする
          - 日当たりのよい 10 区画を A にする
          - 畑の北側の 10 区画を A、南側を B にする
          - 実験者が見て、育ちそうな区画を A にする
          - 番号の小さい 10 区画を A にする
        answer: 0
        distractors:
          - 正解
          - 日当たりの効果と肥料の効果が区別できなくなる
          - 場所の違いと肥料の効果が区別できなくなる
          - 実験者の判断が入り、偏りが生じる
          - 番号の付け方（場所の並び）と肥料の効果が区別できなくなる
        explanation: |
          **方針** 無作為化は、乱数などで偶然に割り付け、処理以外の条件を平均的にそろえる。

          **途中式** 番号を付けて乱数で選べば、どの区画も同じ確率で A になる。

          **答え** 乱数で 10 個の番号を選ぶ

          **間違えやすい点** 「適当に」選ぶのは無作為ではない。人の判断が入らない方法で割り付ける。
      - id: s10p11b
        chapter: 15
        terms: [randomized-block-design, sum-of-squares-decomposition, anova-table]
        topic: ブロックを考慮した分析ではブロックの変動が誤差から除かれて処理の効果を検出しやすくなることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          畑の場所による違いが大きいことがわかったので、似た区画どうしでブロックを作って処理を比べる乱塊法で分析し直した。ブロックを考えない一元配置の分析と比べたときの変化として最も適切なものはどれか。
        choices:
          - ブロックの違いによる変動が誤差から取り除かれ、誤差の平均平方が小さくなって、処理の F 比が大きくなりやすい
          - 処理の平方和が必ず小さくなる
          - 誤差の自由度が増えるので、検出力が必ず下がる
          - ブロックを考えても、分析の結果は何も変わらない
          - 全体の平方和が小さくなる
        answer: 0
        distractors:
          - 正解
          - 処理の平方和は同じ（群の平均は変わらない）
          - 誤差の自由度はブロックの分だけ減る
          - ブロックの違いが大きいと、誤差が大きく減る
          - 全体の平方和はデータで決まり、分析の方法では変わらない
        explanation: |
          **方針** 全体の平方和 ＝ 処理 ＋ ブロック ＋ 誤差。一元配置ではブロックの分が誤差に含まれていた。

          **途中式** ブロックの分を取り出すと誤差の平方和が減る → 誤差の平均平方が小さくなる → F が大きくなる。

          **答え** 誤差が小さくなり、F 比が大きくなりやすい

          **間違えやすい点** ブロックの違いが小さいときは、自由度が減る分だけ不利になることもある。
