      - id: s10p09b
        chapter: 12
        terms: [z-test-known-variance, one-sample-t-test]
        topic: 母平均の検定で母分散が既知ならz検定で未知ならt検定を使う使い分けを答える
        level: 標準
        definition: true
        type: choice
        question: |
          正規母集団の母平均の検定で、z 検定（標準正規分布を使う）と t 検定（t 分布を使う）の使い分けとして正しいものはどれか。
        choices:
          - 標本の大きさが 30 未満なら z 検定、30 以上なら t 検定
          - 母分散が既知なら z 検定、未知で標本の分散を使うなら t 検定
          - 片側検定なら z 検定、両側検定なら t 検定
          - 母分散が既知なら t 検定、未知なら z 検定
          - 有意水準 5% なら z 検定、1% なら t 検定
        answer: 1
