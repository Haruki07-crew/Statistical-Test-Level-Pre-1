          - 正解
          - 人数の多い 2 回目の比率だけを使った
          - 1 回目の比率だけを使った
          - 2 つの比率を足した
        explanation: |
          **方針** 合わせた賛成者数 ÷ 合わせた人数。

          **途中式** $(30+120)/400=0.375$

          **答え** 0.375

          **間違えやすい点** 大きい標本ほど情報が多いので、人数で重み付けする。
      - id: s10p08d
        chapter: 11
        terms: [ci-variance, chi-squared-distribution]
        topic: 母分散の95パーセント信頼区間の両端の平方根をとって母標準偏差の信頼区間を求める
        level: 応用
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 16 の標本を抽出し、不偏分散は 9 だった。母標準偏差 $\sigma$ の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (4.91, 21.56)
          - (1.53, 4.47)
          - (2.22, 4.64)
          - (0.57, 1.20)
          - (2.29, 4.80)
        answer: 2
        distractors:
          - 母分散の区間を答えた（平方根をとっていない）
          - 標準偏差 3 に ± 1.96 × 0.75 のような左右対称の区間を作った
          - 正解
          - 分子に $(n-1)$ を掛けず、不偏分散 9 をそのまま使ったあと平方根をとった
          - 分子を $(n-1)s^2$ ではなく $ns^2=144$ とした
        explanation: |
          **方針** 母分散の区間 $\left(\dfrac{15\times 9}{27.49},\ \dfrac{15\times 9}{6.262}\right)$ を求め、両端の平方根をとる。

          **途中式** 母分散の区間 $(4.91,\ 21.56)$ → 母標準偏差の区間 $(\sqrt{4.91},\ \sqrt{21.56})\approx(2.22,\ 4.64)$

          **答え** (2.22, 4.64)

          **間違えやすい点** 平方根は単調に増えるので、母分散の区間の両端の平方根がそのまま母標準偏差の区間になる。
  - id: s10p09
