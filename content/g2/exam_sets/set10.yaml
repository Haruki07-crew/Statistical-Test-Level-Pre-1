        question: |
          同じ母集団から無作為に、1 回目は 100 人、2 回目は 300 人を選んで賛成の割合を調べたところ、1 回目は 0.30、2 回目は 0.40 だった。2 回を合わせた母比率の推定値はいくらか。
        choices:
          - '0.350'
          - '0.375'
          - '0.400'
          - '0.300'
          - '0.700'
        answer: 1
        distractors:
