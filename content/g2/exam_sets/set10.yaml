set: 10
title: 2級 模擬試験 第10回
minutes: 90
problems:
  - id: s10p01
    title: 統計表の読み方
    context: |
      公表された統計表や度数分布表を使う。
    items:
      - id: s10p01a
        chapter: 1
        terms: [frequency-distribution-histogram, mean-median-mode]
        topic: 元のデータがなく度数分布表だけがあるときに正確にわかる量と近似しかできない量を区別する
        level: 基本
        definition: true
        type: choice
        question: |
          ある調査の結果が度数分布表（階級と度数）だけで公表されていて、元のデータはない。この表から正確にわかるものはどれか。
        choices:
          - データの正確な平均値
          - データの正確な最大値
          - データの正確な中央値
          - データの正確な標準偏差
          - 各階級に入るデータの個数と、全体の個数
        answer: 4
        distractors:
          - 階級値で代用した近似値しか求められない
          - 最大値が入る階級はわかるが、正確な値はわからない
          - 中央値が入る階級はわかるが、正確な値はわからない
          - 階級値で代用した近似値しか求められない
          - 正解
        explanation: |
          **方針** 度数分布表にまとめると、階級の中のデータの値は失われる。

          **途中式** わかるのは各階級の度数とその合計。平均・中央値・標準偏差は階級値などを使った近似になる。

          **答え** 各階級の個数と全体の個数

          **間違えやすい点** 度数分布表から計算した平均などは近似値であることを意識して使う。
      - id: s10p01b
        chapter: 1
        terms: [official-statistics, index-number]
        topic: 公的統計の時系列を比べるときに基準年の改定や定義の変更に注意する必要を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある物価指数を 2010 年から 2025 年まで並べてグラフにしたい。途中の 2020 年に基準年が改定され（2015 年 ＝ 100 から 2020 年 ＝ 100 へ）、調べる品目も一部入れ替わっていた。最も適切な扱いはどれか。
        choices:
          - 改定の前後で基準と品目が違うことに注意し、公表されている接続の方法（重なる年の比など）でつないでから比べる
          - 公表された数値をそのまま 1 本の折れ線にして比べる
          - 改定前の数値はすべて捨てて、改定後の数値だけを使えばよい
          - 基準年が違っても、指数の値は同じ意味なので気にしなくてよい
          - 品目が入れ替わっても、物価指数の値には影響しない
        answer: 0
        distractors:
          - 正解
          - 改定の前後で基準が違うので、そのままつなぐと段差ができる
          - 長い期間の比較ができなくなる
          - 基準年が違うと 100 の意味が違う
          - 品目や重みが変わると指数の動きも変わりうる
        explanation: |
          **方針** 二次データを時系列で比べるときは、基準・定義・対象の変更を確かめる。

          **途中式** 重なる年の比を使ってつなぐ（接続指数）などで、同じ基準にそろえる。

          **答え** 改定に注意し、接続してから比べる

          **間違えやすい点** 統計表の注記（改定・定義の変更）を読まずに比べると、見かけの変化を本当の変化と誤る。
  - id: s10p02
    title: 外れ値と平均の選び方
    context: |
      データの要約の方法を選ぶ。
    items:
      - id: s10p02a
        chapter: 2
        terms: [quartiles-iqr, sample-variance-sd, mean-median-mode]
        topic: データの最大値だけを非常に大きく変えたときに値が変わらない散らばりの指標を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          20 個のデータの最大値だけを、入力の誤りで 10 倍の値にしてしまった。次の指標のうち、値が変わらないものはどれか。
        choices:
          - 範囲
          - 標準偏差
          - 四分位範囲
          - 平均値
          - 分散
        answer: 2
        distractors:
          - 最大値をそのまま使うので変わる
          - すべての値を使うので、最大値の変化で大きくなる
          - 正解
          - すべての値を使うので変わる
          - すべての値を使うので変わる
        explanation: |
          **方針** 順番で決まる指標（中央値・四分位数）は、端の値の大きさに影響されない。

          **途中式** 最大値が大きくなっても、第 1・第 3 四分位数の位置の値は変わらない。

          **答え** 四分位範囲

          **間違えやすい点** 外れ値がありそうなデータでは、中央値と四分位範囲で要約すると頑健。
      - id: s10p02b
        chapter: 2
        terms: [weighted-geometric-harmonic-mean, growth-rate]
        topic: 1年目に2倍になり2年目に半分になった株価の年平均の変化率を幾何平均で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある株価は、1 年目に 2 倍になり、2 年目に半分になった。2 年間の年平均の変化率（幾何平均による）はいくらか。
        choices:
          - ＋25%
          - ＋50%
          - 0%
          - −25%
          - ＋100%
        answer: 2
        distractors:
          - 変化率の算術平均（(＋100% − 50%)/2）
          - 変化率を足しただけ
          - 正解
          - 2 年目の変化率 −50% を 2 で割った
          - 1 年目の変化率だけを答えた
        explanation: |
          **方針** 年平均の倍率は、倍率の幾何平均 $\sqrt{2\times 0.5}$。

          **途中式** $\sqrt{2\times 0.5}=1$ → 変化率 0%

          **答え** 0%

          **間違えやすい点** 2 年後の株価は元と同じなので、平均の変化率は 0%。算術平均の 25% は誤り。
  - id: s10p03
    title: 関連の見方
    context: |
      2 つの変数の関連を、表とデータの集計のしかたから考える。
    items:
      - id: s10p03a
        chapter: 3
        terms: [cross-tabulation, independence-test]
        topic: 2つの質的変数が独立ならクロス表の各行の割合がすべて等しくなることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          クロス表で、「性別」と「ある商品を買ったかどうか」が独立（関連がない）であるとき、成り立つことはどれか。
        choices:
          - 男性と女性の人数が等しい
          - 購入者と非購入者の人数が等しい
          - すべてのセルの度数が等しい
          - 男性の購入者と女性の購入者の人数が等しい
          - 男性の中での購入者の割合と、女性の中での購入者の割合が等しい
        answer: 4
        distractors:
          - 独立かどうかは、行の合計の大きさとは関係ない
          - 列の合計の大きさとは関係ない
          - 独立でも、行や列の合計が違えばセルの度数は違う
          - 人数ではなく、それぞれの中での割合が等しい
          - 正解
        explanation: |
          **方針** 独立なら、一方の変数の値によって、もう一方の変数の分布（割合）が変わらない。

          **途中式** 男性の購入率 ＝ 女性の購入率 ＝ 全体の購入率。期待度数はこの考え方で求める。

          **答え** 男女の購入者の割合が等しい

          **間違えやすい点** 人数（度数）ではなく割合で比べる。
      - id: s10p03b
        chapter: 3
        terms: [covariance-and-correlation, spurious-correlation, scatter-plot]
        topic: 地域ごとの平均値どうしの相関が個人のデータの相関より強く出やすいことを判断する
        level: 応用
        definition: false
        type: choice
        question: |
          全国 47 都道府県ごとに「平均の睡眠時間」と「平均の学力テストの点数」の相関係数を求めると 0.7 だった。個人ごとのデータ（何万人分）で同じ 2 つの変数の相関係数を求めた場合について、最も適切な記述はどれか。
        choices:
          - 集計した平均どうしでは個人の散らばりが消えるため、個人のデータの相関は 0.7 よりかなり弱いことがある
          - 個人のデータの相関も、必ず 0.7 になる
          - 個人のデータのほうが数が多いので、相関は必ず 0.7 より強くなる
          - 都道府県の相関が 0.7 なので、睡眠時間を増やせばどの人も点数が上がる
          - 平均値どうしの相関は計算できない
        answer: 0
        distractors:
          - 正解
          - 集計の単位によって相関は変わる
          - データの数と相関の強さは関係ない
          - 集計データの相関から個人の因果関係は言えない
          - 計算はできるが、解釈に注意が必要
        explanation: |
          **方針** 平均をとると、個人ごとのばらつき（関係と無関係な部分）が打ち消され、集計値どうしの相関は強く出やすい。

          **途中式** 都道府県の間の違いには、所得・地域性などの共通の要因も混ざっている。

          **答え** 個人のデータの相関はかなり弱いことがある

          **間違えやすい点** 集団の傾向から個人の関係を結論づけるのは誤り（生態学的誤謬）。
      - id: s10p03c
        chapter: 4
        terms: [residual, least-squares-method, simple-regression]
        topic: 最小二乗法で求めた単回帰の残差の性質を正しく選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          切片を含む単回帰を最小二乗法で当てはめたときの残差 $e_i$ について、必ず成り立つことはどれか。
        choices:
          - 残差はすべて 0 になる
          - 残差の合計は 0 で、残差と説明変数 $x$ の相関も 0 になる
          - 残差の合計は正になる
          - 残差は説明変数 $x$ と正の相関をもつ
          - 残差の 2 乗の合計は、全体の平方和より大きい
        answer: 1
        distractors:
          - すべての点が直線上にあるときだけ 0
          - 正解
          - 合計は必ず 0
          - 最小二乗法では残差と $x$ の相関は 0
          - 残差平方和は全体の平方和以下（決定係数は 0 以上）
        explanation: |
          **方針** 最小二乗法の条件（正規方程式）から、$\sum e_i=0$ と $\sum x_ie_i=0$ が成り立つ。

          **途中式** $\sum e_i=0$ と $\sum x_ie_i=0$ から、残差と $x$ の共分散は 0。

          **答え** 残差の合計は 0、残差と $x$ の相関も 0

          **間違えやすい点** 残差プロットにパターンがあれば、相関は 0 でも直線が合っていない可能性がある。
  - id: s10p04
    title: 時系列の見方
    context: |
      月次の売上の動きを読む。
    items:
      - id: s10p04a
        chapter: 5
        terms: [time-series-components, growth-rate]
        topic: 前年の同じ月が災害で落ち込んでいたために前年同月比が大きく出る反動を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある店の今年 3 月の売上は前年同月比 ＋40% だった。ただし、前年の 3 月は大雪で 1 週間休業していた。この数字の読み方として最も適切なものはどれか。
        choices:
          - 前年同月比なので、特別な事情の影響は必ず除かれている
          - 売上は 1 年で 40% の割合で伸び続けている
          - 前年の 3 月が特別に低かった反動が含まれるので、＋40% をそのまま好調さの目安にはできない
          - 季節変動の影響がそのまま残っている
          - 前年同月比が大きいので、前月比も ＋40% である
        answer: 2
        distractors:
          - 季節変動は除けるが、前年の特別な事情は除けない
          - 1 か月の比較から、伸び続けているとはいえない
          - 正解
          - 同じ月どうしの比較なので、季節変動の影響は除かれる
          - 前月比とは別の比較
        explanation: |
          **方針** 前年同月比は、比べる 1 年前の値に特別な事情があると大きく動く（反動、基準の効果）。

          **途中式** 前年の 3 月が休業で低い → 今年は普通でも大きな伸びに見える。

          **答え** 反動が含まれるので、そのまま好調さの目安にできない

          **間違えやすい点** 2 年前と比べる、前後の月も合わせて見るなどで確かめる。
      - id: s10p04b
        chapter: 5
        terms: [moving-average, time-series-components]
        topic: 最新までの値を平均する後方移動平均が実際の変化より遅れて反応することを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          毎日の値の「直近 7 日間の平均」（後方移動平均）を描く。値が急に上がり始めたとき、この移動平均の動きとして正しいものはどれか。
        choices:
          - 上がり始めてから少し遅れて上がり始め、上がり方も実際の値よりゆるやかになる
          - 実際の値より先に上がり始める
          - 実際の値と同時に、同じだけ上がる
          - 平均なので、まったく上がらない
          - 曜日の変動が大きくなる
        answer: 0
        distractors:
          - 正解
          - 過去の値の平均なので、先に動くことはない
          - 古い値も含むので、同じだけは上がらない
          - 新しい値が加わるにつれて上がる
          - 7 日の平均で曜日の変動はならされる
        explanation: |
          **方針** 後方移動平均は、その日を含む過去 7 日の平均。新しい値が少しずつ入れ替わる。

          **途中式** 急な変化は 7 日かけて平均に反映される → 遅れが生じ、変化がなだらかになる。

          **答え** 少し遅れて、ゆるやかに上がる

          **間違えやすい点** 中心化移動平均は遅れがないが、最新の時点では計算できない。目的に合わせて選ぶ。
  - id: s10p05
    title: 調査の方法
    context: |
      世論調査の方法を考える。
    items:
      - id: s10p05a
        chapter: 6
        terms: [simple-random-sampling, population-and-sample]
        topic: 性別と年代の割合に合わせて調査員が対象を選ぶ割当法が無作為抽出ではないことを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある調査では、母集団の性別・年代の割合と同じになるように人数を割り当て、その人数に達するまで調査員が街頭で声をかけて回答者を選んだ（割当法）。この方法について正しい記述はどれか。
        choices:
          - 性別・年代の構成が同じなので、無作為抽出と同じ性質をもつ
          - 性別・年代の構成は母集団と同じでも、調査員が選ぶので無作為抽出ではなく、偏りが生じうる
          - 層化抽出法そのものである
          - 標本誤差の大きさを確率の理論で正確に評価できる
          - 回答者が多ければ、偏りはなくなる
        answer: 1
        distractors:
          - 構成が同じでも、選ばれ方が偶然に任されていない
          - 正解
          - 層化抽出法は層の中で無作為に選ぶ
          - 無作為でないので、確率の理論による評価はできない
          - 人数を増やしても選び方の偏りは消えない
        explanation: |
          **方針** 無作為抽出は、誰が選ばれるかを偶然（乱数）に任せる方法。

          **途中式** 割当法では、街頭にいる人・声をかけやすい人などに偏る。

          **答え** 無作為抽出ではなく、偏りが生じうる

          **間違えやすい点** 層化抽出法は、層の中で無作為に選ぶ点が割当法と違う。
      - id: s10p05b
        chapter: 6
        terms: [sampling-and-nonsampling-error]
        topic: 回答を一方へ誘導する質問文による偏りが非標本誤差で標本を大きくしても減らないことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある調査票に「多くの専門家が効果を認めている新制度に、あなたは賛成ですか」という質問があった。この質問について最も適切な指摘はどれか。
        choices:
          - 質問文は結果に影響しないので、問題はない
          - 標本を大きくすれば、この偏りは小さくなる
          - 標本誤差の一種で、無作為抽出をすれば生じない
          - 賛成に誘導する表現で、回答が偏る（非標本誤差）。標本を大きくしても偏りは減らない
          - 回答者が専門家でなければ、偏りは生じない
        answer: 3
        distractors:
          - 質問文の表現は回答に大きく影響する
          - 測り方の偏りは標本の大きさで減らない
          - 選び方ではなく、質問文の問題（非標本誤差）
          - 正解
          - 誰が答えても誘導の影響は受ける
        explanation: |
          **方針** 質問文の表現が回答を一方へ誘導すると、測り方の偏り（非標本誤差）が生じる。

          **途中式** 対策は、中立的な表現にする、予備調査で確かめる、など。

          **答え** 誘導による偏りで、標本を大きくしても減らない

          **間違えやすい点** 選択肢の順番や前の質問も回答に影響することがある。
  - id: s10p06
    title: さいころと確率変数
    context: |
      必要なら次の値を使ってよい：$e^{-2}=0.1353$、$P(Z>1)=0.1587$。
    items:
      - id: s10p06a
        chapter: 7
        terms: [events-and-probability, independence-of-events]
        topic: 2個のさいころの目の大きいほうが4以下になる確率を両方とも4以下の確率として求める
        level: 基本
        definition: false
        type: choice
        question: |
          さいころを 2 個振る。出た目の大きいほうが 4 以下である確率はいくらか。
        choices:
          - '0.667'
          - '0.556'
          - '0.194'
          - '0.028'
          - '0.444'
        answer: 4
        distractors:
          - 1 個のさいころが 4 以下の確率
          - 大きいほうが 5 以上である確率（余事象）
          - 大きいほうがちょうど 4 である確率（7/36）を求めた
          - 2 個とも 4 である確率（1/36）を求めた
          - 正解
        explanation: |
          **方針** 「大きいほうが 4 以下」は「2 個とも 4 以下」と同じ。

          **途中式** $(4/6)^2=16/36\approx 0.444$

          **答え** 0.444

          **間違えやすい点** 最大値の条件は、すべての値についての条件に言いかえられる。
      - id: s10p06b
        chapter: 7
        terms: [conditional-probability, counting]
        topic: 2個のさいころの少なくとも一方が6とわかったときに目の和が偶数である条件付き確率を数えて求める
        level: 標準
        definition: false
        type: choice
        question: |
          さいころを 2 個振ったところ、少なくとも一方の目が 6 であることがわかった。このとき、目の和が偶数である確率はいくらか。
        choices:
          - 1/2
          - 5/36
          - 11/36
          - 6/11
          - 5/11
        answer: 4
        distractors:
          - 条件を考えずに、和が偶数の確率を答えた
          - 「6 を含み和が偶数」の確率を 36 通りで割った（条件付きではない）
          - 条件（少なくとも一方が 6）の確率を答えた
          - 和が奇数の確率を答えた
          - 正解
        explanation: |
          **方針** 条件を満たす場合（少なくとも一方が 6）を数え、その中で和が偶数のものを数える。

          **途中式** 少なくとも一方が 6 は $36-25=11$ 通り。そのうち和が偶数は (2,6)(4,6)(6,6)(6,2)(6,4) の 5 通り。$5/11$

          **答え** 5/11

          **間違えやすい点** (6,6) を 2 回数えない。
      - id: s10p06c
        chapter: 8
        terms: [expectation-variance-properties, independence-of-events]
        topic: 独立な2つの確率変数の積の期待値が期待値の積になることを使う
        level: 基本
        definition: false
        type: choice
        question: |
          独立な確率変数 $X$、$Y$ の期待値がそれぞれ 2、3 のとき、$E[XY]$ はいくらか。
        choices:
          - '5'
          - '6'
          - '1.5'
          - '0'
          - 分散がわからないので求められない
        answer: 1
        distractors:
          - 和の期待値を答えた
          - 正解
          - 期待値の比を答えた
          - 独立なら共分散は 0 だが、積の期待値は 0 ではない
          - 独立なら分散がなくても求められる
        explanation: |
          **方針** 独立なら $E[XY]=E[X]E[Y]$（共分散 $E[XY]-E[X]E[Y]$ が 0）。

          **途中式** $2\times 3=6$

          **答え** 6

          **間違えやすい点** 独立でないときは、$E[XY]=E[X]E[Y]+\mathrm{Cov}[X,Y]$。
      - id: s10p06d
        chapter: 8
        terms: [probability-mass-and-density-function, expectation-variance-properties]
        topic: 区間0から2の確率密度関数cxの定数cを全体の面積が1になる条件で決めて期待値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          確率変数 $X$ の確率密度関数が $f(x)=cx\ (0\le x\le 2)$、それ以外では 0 である。定数 $c$ と $E[X]$ の組合せはどれか。
        choices:
          - $c=1$、$E[X]=4/3$
          - $c=1/2$、$E[X]=1$
          - $c=2$、$E[X]=16/3$
          - $c=1/4$、$E[X]=2/3$
          - $c=1/2$、$E[X]=4/3$
        answer: 4
        distractors:
          - 全体の面積が 2 になってしまう
          - 期待値を区間の中央とした（一様分布と取り違えた）
          - 面積を 1 にする条件を逆に使った
          - $c$ を半分にしすぎた（全体の面積が 0.5）
          - 正解
        explanation: |
          **方針** 確率密度関数の全体の面積は 1。期待値は $\int x f(x)\,dx$。

          **途中式** $\int_0^2 cx\,dx=2c=1$ → $c=1/2$。$E[X]=\int_0^2 x\cdot\frac{x}{2}\,dx=\frac{8}{6}=\frac{4}{3}$

          **答え** $c=1/2$、$E[X]=4/3$

          **間違えやすい点** 大きい値ほど密度が高いので、期待値は区間の中央 1 より大きい。
      - id: s10p06e
        chapter: 9
        terms: [poisson-distribution, binomial-distribution]
        topic: 試行回数が多く成功確率が小さい二項分布をポアソン分布で近似して0回の確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          不良率 0.01 の製品を 200 個検査する。不良品が 1 個もない確率を、ポアソン分布で近似して求めるといくらか。
        choices:
          - '0.010'
          - '0.271'
          - '0.865'
          - '0.990'
          - '0.135'
        answer: 4
        distractors:
          - 不良率をそのまま答えた
          - 1 個の確率（$2e^{-2}$）を求めた
          - 1 個以上の確率を求めた
          - 1 個の製品が良品である確率を答えた
          - 正解
        explanation: |
          **方針** $n$ が大きく $p$ が小さい二項分布は、平均 $\lambda=np$ のポアソン分布で近似できる。

          **途中式** $\lambda=200\times 0.01=2$、$P(X=0)\approx e^{-2}=0.135$

          **答え** 0.135

          **間違えやすい点** 正確な二項確率 $0.99^{200}\approx 0.134$ とよく一致する。
      - id: s10p06f
        chapter: 9
        terms: [standard-normal-distribution, normal-distribution]
        topic: 標準正規分布で平均の前後に標準偏差1個分の範囲に入る確率を上側確率から求める
        level: 基本
        definition: false
        type: choice
        question: |
          標準正規分布で、$P(-1<Z<1)$ はいくらか。
        choices:
          - '0.8413'
          - '0.3413'
          - '0.6826'
          - '0.1587'
          - '0.9544'
        answer: 2
        distractors:
          - $P(Z<1)$ を答えた
          - 0 から 1 までの確率だけを答えた
          - 正解
          - 上側確率をそのまま答えた
          - $P(-2<Z<2)$ と取り違えた
        explanation: |
          **方針** 対称性から、両側の裾はどちらも $P(Z>1)=0.1587$。

          **途中式** $1-2\times 0.1587=0.6826$

          **答え** 0.6826

          **間違えやすい点** 正規分布では、平均 ± 標準偏差の範囲におよそ 68% が入る。
  - id: s10p07
    title: 近似の使い方
    context: |
      必要なら次の値を使ってよい：$P(Z>0.05)=0.4801$、$P(Z>0.1)=0.4602$、$P(Z>1)=0.1587$、$P(Z>2)=0.0228$。
    items:
      - id: s10p07a
        chapter: 10
        terms: [sampling-distribution-of-mean, standard-normal-distribution]
        topic: 標本平均が母平均から標本平均の標準偏差の2倍以上離れる確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          正規母集団から抽出した標本平均 $\bar X$ について、$P(|\bar X-\mu|\ge 2\sigma/\sqrt n)$ はいくらか。
        choices:
          - '0.0228'
          - '0.9544'
          - '0.25'
          - '0.0456'
          - '0.3174'
        answer: 3
        distractors:
