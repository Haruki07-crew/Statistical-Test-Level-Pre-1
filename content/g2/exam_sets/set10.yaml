      - id: s10p07b
        chapter: 10
        terms: [normal-approximation-binomial-poisson, continuity-correction]
        topic: 賛成の確率0.5の400人のうちちょうど200人が賛成する確率を連続修正で区間に置きかえて正規近似する
        level: 標準
        definition: false
        type: choice
        question: |
          ある意見に賛成する人の割合が 0.5 の大きな集団から、400 人を無作為に選ぶ。ちょうど 200 人が賛成する確率を、連続修正を行った正規近似で求めるといくらか。
        choices:
          - '0'
          - '0.5000'
          - '0.4801'
          - '0.0398'
          - '0.0199'
        answer: 3
        distractors:
          - 連続型の分布で 1 点の確率を求めた（連続修正をしていない）
          - 平均が 200 なので、200 以下の確率と取り違えた
          - 上側確率 $P(Z>0.05)$ をそのまま答えた
          - 正解
          - 片側（200 から 200.5 まで）だけを求めた
        explanation: |
          **方針** 賛成の人数は $B(400,\ 0.5)$ で、平均 200、標準偏差 $\sqrt{100}=10$ の正規分布で近似する。「ちょうど 200」は連続修正で「199.5 から 200.5 まで」とする。

          **途中式** $P(-0.05<Z<0.05)=1-2\times 0.4801=0.0398$

          **答え** 0.0398

          **間違えやすい点** 正確な二項確率も約 0.0399 で、よく一致する。最も起こりやすい人数でも、確率は 4% 程度しかない。
      - id: s10p07c
        chapter: 10
        terms: [chi-squared-distribution, central-limit-theorem]
        topic: 自由度の大きいカイ二乗分布を平均が自由度で分散が自由度の2倍の正規分布で近似して確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          自由度 50 のカイ二乗分布にしたがう $W$ について、$P(W>60)$ を正規分布で近似して求めるといくらか（自由度 $k$ のカイ二乗分布の平均は $k$、分散は $2k$）。
        choices:
          - '0.0228'
          - '0.1587'
          - '0.4602'
          - '0.8413'
          - '0'
        answer: 1
        distractors:
          - 標準偏差を $\sqrt{50}$ ではなく 5 として z ＝ 2 とした
          - 正解
          - 標準偏差を 100（分散）として z ＝ 0.1 とした
          - 60 以下の確率を求めた
          - 60 は平均より大きいので確率が 0 になると誤った
        explanation: |
          **方針** $W$ は独立な 50 個の標準正規の 2 乗の和なので、中心極限定理により正規分布で近似できる。

          **途中式** 平均 50、分散 100（標準偏差 10）。$(60-50)/10=1$、$P(Z>1)=0.1587$

          **答え** 0.1587

          **間違えやすい点** 正確な値も約 0.157。自由度が大きいとカイ二乗分布は左右対称に近づく。
  - id: s10p08
    title: 推定の逆算と組合せ
    context: |
      必要なら次の値を使ってよい：$z_{0.025}=1.96$、$\chi^2_{0.025}(15)=27.49$、$\chi^2_{0.975}(15)=6.262$。
    items:
      - id: s10p08a
        chapter: 11
        terms: [confidence-interval, standard-error]
        topic: 母平均の95パーセント信頼区間の両端から標本平均と標準誤差を逆算する
        level: 基本
        definition: false
        type: choice
        question: |
          ある論文に、母平均の 95% 信頼区間（正規分布による）が (46.08, 53.92) と書かれていた。標本平均と標準誤差の組合せはどれか。
        choices:
          - 標本平均 50、標準誤差 3.92
          - 標本平均 50、標準誤差 7.84
          - 標本平均 50、標準誤差 2
          - 標本平均 46.08、標準誤差 2
          - 標本平均 50、標準誤差 1.96
        answer: 2
        distractors:
          - 幅の半分を標準誤差とした（1.96 で割っていない）
          - 区間の幅全体を標準誤差とした
          - 正解
          - 下限を標本平均とした
          - 1.96 そのものを標準誤差とした
        explanation: |
          **方針** 区間は 標本平均 ± 1.96 × 標準誤差。中央が標本平均。

          **途中式** 中央 $(46.08+53.92)/2=50$、幅の半分 $3.92=1.96\times 2$

          **答え** 標本平均 50、標準誤差 2

          **間違えやすい点** 標準誤差がわかれば、90% や 99% の区間も作り直せる。
      - id: s10p08b
        chapter: 11
        terms: [ci-two-sample-mean-difference, welch-test]
        topic: 大きさと分散の違う2つの大標本から分散を別々に使って母平均の差の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          A 店の客 50 人の購入額は平均 56 百円・標準偏差 10 百円、B 店の客 100 人は平均 50 百円・標準偏差 5 百円だった。母平均の差（A − B）の 95% 信頼区間（正規近似）に最も近いものはどれか。
        choices:
          - (3.06, 8.94)
          - (3.60, 8.40)
          - (2.25, 9.75)
          - (−15.9, 27.9)
          - (4.37, 7.63)
        answer: 0
        distractors:
          - 正解
          - 2 つの店の標本の大きさを入れ替えた（$\sqrt{100/100+25/50}$）
          - 2 つの標準誤差を足した（$\sqrt 2+0.5$）
          - 分散を標本の大きさで割らなかった（$\sqrt{100+25}$）
          - 分散の和を合計人数 150 で割り、平方根をとらずに使った
        explanation: |
          **方針** 差の標準誤差 $\sqrt{s_A^2/n_A+s_B^2/n_B}$。分散の違いをそのまま使う。

          **途中式** $\sqrt{100/50+25/100}=\sqrt{2.25}=1.5$、$6\pm 1.96\times 1.5=6\pm 2.94$

          **答え** (3.06, 8.94)

          **間違えやすい点** 分散が大きく違うときに、プールした分散を使うのは不適切。
      - id: s10p08c
        chapter: 11
        terms: [point-estimation, ci-proportion]
        topic: 大きさの違う2回の調査の標本比率を合わせて全体の母比率の推定値を人数で重み付けして求める
        level: 標準
