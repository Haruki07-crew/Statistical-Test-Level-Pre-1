          - 比を逆にした（$9\times 16/30$）
        explanation: |
          **方針** $\chi^2=(n-1)s^2/\sigma_0^2$ は、帰無仮説のもとで自由度 $n-1$ のカイ二乗分布にしたがう。右片側なので上側 5% 点と比べる。

          **途中式** $9\times 30/16=16.875<16.92$

          **答え** χ² ＝ 16.875 で、棄却しない

          **間違えやすい点** 不偏分散 30 は 16 のほぼ 2 倍でも、標本が小さいと有意にならないことがある（ぎりぎりで棄却されない）。
      - id: s03p12c
        chapter: 12
        terms: [power-function, z-test-known-variance, type-i-and-ii-errors]
