  - id: s03p13
    title: 2 つの群の比較
    context: |
      必要なら次の値を使ってよい：$z_{0.005}=2.576$、$\chi^2_{0.05}(1)=3.841$、$\chi^2_{0.05}(2)=5.991$。
    items:
      - id: s03p13a
        chapter: 13
        terms: [welch-test, two-sample-t-test, standard-error]
        topic: 分散が等しいとは限らない2群の平均の差をウェルチの方法の標準誤差で割って検定統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 種類の肥料で育てた植物の高さ（cm）を比べた。肥料 A は 8 本で平均 36・不偏分散 40、肥料 B は 10 本で平均 30・不偏分散 10 だった。母分散が等しいとは限らないとして、ウェルチの方法で検定統計量 $t$ を求めると、どれに最も近いか。
        choices:
          - '2.63'
          - '0.85'
          - '2.45'
          - '1.85'
          - '6.00'
        answer: 2
        distractors:
          - 母分散が等しいと仮定してプールした分散を使った
          - 不偏分散を標本の大きさで割らなかった
          - 正解
          - 2 つの群の標準誤差を足した（分散を足していない）
          - 平均の差をそのまま答えた
        explanation: |
          **方針** ウェルチの方法では標準誤差を $\sqrt{s_1^2/n_1+s_2^2/n_2}$ とする。

          **途中式** $\sqrt{40/8+10/10}=\sqrt{6}\approx 2.449$、$t=6/2.449\approx 2.45$

          **答え** 2.45

          **間違えやすい点** 分散の大きく違う 2 群でプールした分散を使うと、検定の精度が悪くなる。自由度もウェルチの近似式で求める。
      - id: s03p13b
        chapter: 13
        terms: [two-sample-proportion-test, proportion-test]
        topic: 2つの群の比率の差の検定で帰無仮説のもとのプールした比率を使って検定統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          新しい画面のデザインを 200 人に見せたところ 120 人が登録し、従来のデザインを別の 200 人に見せたところ 90 人が登録した。帰無仮説「2 つの登録率は等しい」のもとで、2 群を合わせた比率（プールした比率）を使って検定統計量 $z$ を求めると、どれに最も近いか。
        choices:
          - '3.00'
          - '3.04'
          - '4.25'
          - '60.2'
          - '0.30'
        answer: 0
        distractors:
          - 正解
          - プールせずに、各群の比率で標準誤差を計算した
          - $1/n_1+1/n_2$ の代わりに $1/200$ を使った
          - 標準誤差の平方根をとらなかった
          - 標本の大きさで割らなかった
        explanation: |
          **方針** プールした比率 $\hat p=(120+90)/400=0.525$、標準誤差 $\sqrt{\hat p(1-\hat p)(1/n_1+1/n_2)}$。

          **途中式** $\sqrt{0.525\times 0.475\times 0.01}\approx 0.0499$、$z=(0.60-0.45)/0.0499\approx 3.00$

          **答え** 3.00

          **間違えやすい点** 帰無仮説（比率が等しい）のもとでは、共通の比率を 2 群を合わせて推定する。$z=3.00>2.576$ なので有意水準 1% でも棄却される。
      - id: s03p13c
        chapter: 13
        terms: [independence-test, expected-frequency, pearson-chi-square-statistic]
        topic: 性別と支持する案の2行3列のクロス表で期待度数とカイ二乗統計量と自由度2を求めて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの案 A・B・C のうちどれを支持するかを、男性 100 人・女性 100 人にたずねた。

          | | 案 A | 案 B | 案 C |
          |---|---|---|---|
          | 男性 | 24 | 36 | 40 |
          | 女性 | 36 | 24 | 40 |

          独立性のカイ二乗検定（有意水準 5%）の結果として正しいものはどれか。
        choices:
          - χ² ＝ 4.8 で、自由度 1 の点 3.841 より大きいので棄却する
          - χ² ＝ 0.16 で、棄却しない
          - χ² ＝ 4.8 で、自由度 2 の点 5.991 より小さいので棄却しない
          - χ² ＝ 144 で、棄却する
          - χ² ＝ 4.8 で、棄却しないので、性別と支持する案は独立であると証明された
        answer: 2
        distractors:
          - 自由度は (2−1)(3−1)＝2
          - (観測度数 − 期待度数)² を期待度数の 2 乗で割った
          - 正解
          - 期待度数で割らなかった
          - 棄却しないことは、独立の証明ではない
        explanation: |
          **方針** 期待度数 ＝ 行の合計 × 列の合計 ÷ 総数。統計量を自由度 $(2-1)(3-1)=2$ の点と比べる。

          **途中式** 期待度数は案 A・B が 30、案 C が 40。$\chi^2=4\times\dfrac{6^2}{30}+0+0=4.8<5.991$

          **答え** χ² ＝ 4.8 で、棄却しない

          **間違えやすい点** 「関連があるとはいえない」だけで、独立だと証明されたわけではない。
  - id: s03p14
    title: 回帰モデルの選び方と使い方
    context: |
      回帰分析の結果の読み方を考える。
    items:
      - id: s03p14a
        chapter: 14
        terms: [multicollinearity, multiple-regression-model]
        topic: 強く相関する2つの説明変数を同時に重回帰に入れたときに係数の標準誤差が大きくなることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          体重を目的変数とし、説明変数に「身長」と「股下の長さ」（2 つの相関係数は 0.95）を同時に入れて重回帰分析を行った。このとき起こりやすいこととして最も適切なものはどれか。
        choices:
          - 決定係数が、どちらか 1 つだけを入れたときより必ず小さくなる
          - 予測値をまったく計算できなくなる
          - 係数の標準誤差が大きくなり、個々の係数が有意になりにくくなる
          - 相関の強い変数を一緒に入れるほど、係数の推定の精度が上がる
          - 残差の合計が 0 にならなくなる
        answer: 2
        distractors:
          - 説明変数を増やしても決定係数は小さくならない
          - 完全に比例していなければ計算はでき、予測もできる
          - 正解
          - 精度は下がる（多重共線性）
          - 切片を含む最小二乗法では、残差の合計は 0 のまま
        explanation: |
          **方針** 説明変数どうしの相関が非常に強いと、それぞれの効果を分けて推定しにくくなる（多重共線性）。

          **途中式** 係数の標準誤差が大きくなり、t 値が小さくなる。符号が予想と逆になることもある。

          **答え** 係数の標準誤差が大きくなり、有意になりにくくなる

          **間違えやすい点** 予測そのものはできても、係数の解釈が不安定になる。対策は、片方の変数を除く、まとめる、など。
      - id: s03p14b
        chapter: 14
        terms: [adjusted-r-squared, coefficient-of-determination, regression-output]
        topic: 説明変数を1つ加えたモデルで決定係数は増え自由度調整済み決定係数は下がった結果から変数を加える根拠を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          25 件のデータで、説明変数 $x_1,x_2$ のモデル 1 と、$x_1,x_2,x_3$ のモデル 2 を当てはめた。

          | | 決定係数 | 自由度調整済み決定係数 |
          |---|---|---|
          | モデル 1 | 0.700 | 0.673 |
          | モデル 2 | 0.705 | 0.663 |

          正しい記述はどれか。
        choices:
          - 決定係数の大きいモデル 2 を選ぶべきである
          - 自由度調整済み決定係数は、説明変数を増やすと必ず大きくなる
          - モデル 2 は決定係数が下がったので誤っている
          - 説明変数の数が違うモデルの決定係数は、比べることができない
          - $x_3$ を加えると決定係数は増えたが、自由度調整済み決定係数は下がったので、$x_3$ を加える根拠は弱い
        answer: 4
        distractors:
          - 決定係数は説明変数を増やせば必ず増えるので、それだけでは選べない
          - 必ず大きくなるのは決定係数のほう
          - 決定係数は 0.700 から 0.705 に増えている
          - 比べられるが、変数を増やすと決定係数は必ず増えることに注意して、調整した値も見る
          - 正解
        explanation: |
          **方針** 説明変数の数の違うモデルは、自由度調整済み決定係数などで比べる。

          **途中式** モデル 1：$1-0.30\times 24/22\approx 0.673$、モデル 2：$1-0.295\times 24/21\approx 0.663$

          **答え** $x_3$ を加える根拠は弱い

          **間違えやすい点** 決定係数は、役に立たない変数を加えても少しは増える。
      - id: s03p14c
        chapter: 14
        terms: [confidence-and-prediction-interval-regression, simple-regression]
        topic: 回帰による平均の信頼区間と個々の値の予測区間の幅の大小とxが平均から離れたときの変化を判断する
        level: 応用
        definition: false
        type: choice
        question: |
          単回帰で、ある $x$ の値における「$y$ の平均の 95% 信頼区間」と「新しく観測する 1 つの $y$ の 95% 予測区間」を求める。正しい記述はどれか。
        choices:
          - 予測区間は信頼区間より狭い
          - どちらも $x$ の値によらず幅は一定である
          - データの数を増やすと、予測区間の幅は 0 に近づく
          - 信頼区間には、個々の $y$ の約 95% が入る
          - 予測区間は信頼区間より広く、どちらも $x$ が $x$ の平均から離れるほど広くなる
        answer: 4
        distractors:
          - 予測区間は個々の値の散らばり（誤差）も含むので広い
          - 平均から離れるほど、直線の推定の不確かさが大きくなる
          - データを増やしても、個々の値の誤差の分だけ幅が残る
          - それは予測区間の性質で、信頼区間は平均についての区間
          - 正解
        explanation: |
          **方針** 信頼区間は「直線の位置の不確かさ」、予測区間はそれに「個々の値の誤差」を加えたもの。

          **途中式** 標準誤差は、信頼区間が $s\sqrt{1/n+(x-\bar x)^2/S_{xx}}$、予測区間が $s\sqrt{1+1/n+(x-\bar x)^2/S_{xx}}$。

          **答え** 予測区間のほうが広く、どちらも $x$ が平均から離れるほど広い

          **間違えやすい点** データを増やすと信頼区間は 0 に近づくが、予測区間は誤差の分（約 $\pm 1.96s$）が残る。
  - id: s03p15
    title: 品種と肥料の実験
    context: |
      2 つの品種（A1・A2）と 2 種類の肥料（B1・B2）を組み合わせて、収量を比べる実験を行った。各組合せは複数の区画で行った。
    items:
      - id: s03p15a
        chapter: 15
        terms: [main-effect-and-interaction, two-way-anova-with-replication]
        topic: 2つの要因の組合せごとの平均の表から肥料の効果が品種によって違うことを交互作用として読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          各組合せの収量の平均は次のとおりだった。

          | | 肥料 B1 | 肥料 B2 |
          |---|---|---|
          | 品種 A1 | 50 | 60 |
          | 品種 A2 | 55 | 85 |

          この表の読み取りとして最も適切なものはどれか。
        choices:
          - どちらの品種でも B2 のほうが多いので、交互作用はない
          - 品種の主効果はない
          - 平均の差が 30 なので、交互作用の大きさは 30 である
          - 肥料 B2 の効果は A1 では 10、A2 では 30 と違うので、品種と肥料の交互作用があると考えられる
          - 交互作用があると、主効果は計算できない
        answer: 3
        distractors:
          - 効果の向きが同じでも、大きさが違えば交互作用がある
          - A2 の平均（70）は A1（55）より大きい
          - 交互作用は「B2 の効果の違い」（30 − 10 ＝ 20）で表される
          - 正解
          - 主効果は計算できるが、解釈には注意が必要
        explanation: |
          **方針** 一方の要因の効果が、もう一方の要因の水準によって変わるとき、交互作用がある。

          **途中式** B2 − B1 は A1 で $60-50=10$、A2 で $85-55=30$。

          **答え** 交互作用があると考えられる

          **間違えやすい点** 交互作用が有意かどうかは、繰り返しのある二元配置分散分析で検定する。
      - id: s03p15b
        chapter: 15
        terms: [fisher-three-principles, treatment-and-control]
        topic: 各処理を複数の区画で行う反復の目的が誤差の大きさを評価して偶然の差と処理の効果を区別することだと答える
        level: 基本
        definition: true
        type: choice
        question: |
          この実験で、各組合せを 1 つの区画だけでなく複数の区画で行った（反復）。反復の主な目的はどれか。
        choices:
          - 処理の割り付けを無作為にしなくてよくするため
          - 誤差の大きさを評価し、偶然の差と処理の効果を区別できるようにするため
          - 場所による違いを取り除くため
          - 処理の効果を大きくするため
          - 区画ごとに違う処理をするため
        answer: 1
        distractors:
          - 反復しても無作為化は必要
          - 正解
          - これは局所管理（ブロック化）の目的
          - 反復は効果を大きくするものではない
          - 反復は同じ処理を複数の区画で行うこと
        explanation: |
          **方針** フィッシャーの 3 原則のうち反復の役割を考える。

          **途中式** 同じ処理を複数回行うと、同じ処理の中のばらつき（誤差）がわかり、処理の差がそれより大きいかを判断できる。

          **答え** 誤差の大きさを評価するため

          **間違えやすい点** 反復は誤差の評価、無作為化は偏りの防止、局所管理は場の違いの除去。
