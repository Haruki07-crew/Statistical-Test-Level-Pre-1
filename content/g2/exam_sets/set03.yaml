    items:
      - id: s03p08a
        chapter: 8
        terms: [probability-mass-and-density-function, expectation-variance-properties, cumulative-distribution-function]
        topic: 確率密度関数2xの連続型確率変数の期待値と0.5以下になる確率を積分で求める
        level: 標準
        definition: false
        type: choice
        question: |
          $X$ の期待値 $E[X]$ と確率 $P(X\le 0.5)$ の組合せとして正しいものはどれか。
        choices:
          - $E[X]=1/2$、$P(X\le 0.5)=0.5$
          - $E[X]=2/3$、$P(X\le 0.5)=0.5$
          - $E[X]=1$、$P(X\le 0.5)=0.25$
          - $E[X]=2/3$、$P(X\le 0.5)=0.25$
          - $E[X]=2/3$、$P(X\le 0.5)=1$
        answer: 3
        distractors:
          - 0 から 1 の一様分布と取り違えた
          - 確率を区間の長さの割合で求めた（密度が一定ではない）
          - 期待値を $\int_0^1 f(x)\,dx$（全体の確率 1）とした
          - 正解
          - 密度の値 $f(0.5)=1$ を確率とした
        explanation: |
          **方針** $E[X]=\int_0^1 x f(x)\,dx$、$P(X\le 0.5)=\int_0^{0.5} f(x)\,dx$。

          **途中式** $E[X]=\int_0^1 2x^2\,dx=2/3$、$P(X\le 0.5)=\int_0^{0.5}2x\,dx=0.5^2=0.25$

          **答え** $E[X]=2/3$、$P(X\le 0.5)=0.25$

          **間違えやすい点** 連続型では確率は密度の「面積」。密度の値そのものは確率ではない（1 を超えることもある）。
