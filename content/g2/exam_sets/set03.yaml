set: 3
title: 2級 模擬試験 第3回
minutes: 90
problems:
  - id: s03p01
    title: 2 つの高校の部活動と通学時間
    context: |
      2 つの高校の生徒について調べる。
    items:
      - id: s03p01a
        chapter: 1
        terms: [bar-pie-band-chart, cross-tabulation]
        topic: 全体の人数が違う2校の帯グラフの割合から各部の人数を求めて正しい記述を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          A 高校（生徒 400 人）と B 高校（生徒 600 人）の所属の割合を帯グラフにしたところ、A 高校は運動部 45%・文化部 30%・無所属 25%、B 高校は運動部 35%・文化部 40%・無所属 25% だった。正しい記述はどれか。
        choices:
          - 運動部の生徒の人数は、A 高校のほうが多い
          - 無所属の生徒の人数は、両校で等しい
          - B 高校の文化部の割合は、A 高校の 2 倍である
          - 文化部の生徒の人数は、B 高校が A 高校の 2 倍である
          - 帯グラフから、各高校の生徒の人数を読み取ることができる
        answer: 3
        distractors:
          - A は 180 人、B は 210 人で、B のほうが多い
          - 割合は同じ 25% でも、人数は 100 人と 150 人で違う
          - 40% は 30% の約 1.33 倍
          - 正解
          - 帯グラフは割合だけを表し、人数はわからない（この問題では人数を別に示している）
        explanation: |
          **方針** 人数 ＝ 割合 × 全体の人数 で、両校の人数を求めて比べる。

          **途中式** 文化部：A は $400\times 0.30=120$ 人、B は $600\times 0.40=240$ 人 → 2 倍。運動部：A 180 人、B 210 人。無所属：A 100 人、B 150 人。

          **答え** 文化部の生徒の人数は、B 高校が A 高校の 2 倍である

          **間違えやすい点** 割合が高い（低い）ことと人数が多い（少ない）ことは別。全体の人数が違うと、比べる結果が逆になることもある。
      - id: s03p01b
        chapter: 1
        terms: [frequency-distribution-histogram]
        topic: 階級の幅が等しくない度数分布をヒストグラムにするとき幅の広い階級の柱の高さを密度で決める
        level: 標準
        definition: false
        type: choice
        question: |
          A 高校のある学年の通学時間を、0〜10 分（20 人）、10〜20 分（30 人）、20〜40 分（30 人）の 3 つの階級にまとめた。縦軸を「幅 10 分あたりの人数」としてヒストグラムを描くとき、20〜40 分の柱の高さはいくらにすればよいか。
        choices:
          - '15'
          - '30'
          - '60'
          - '1.5'
          - '7.5'
        answer: 0
        distractors:
          - 正解
          - 度数をそのまま高さにした（柱の面積が実際の 2 倍に見える）
          - 度数に幅の比 2 を掛けた
          - 度数を幅 20 そのもので割った（「幅 1 分あたり」になっている）
          - 幅の比 2 で 2 回割った
        explanation: |
          **方針** ヒストグラムは柱の面積が度数に比例するように描く。20〜40 分の幅は基準の 10 分の 2 倍。

          **途中式** $30\div 2=15$（人／10 分）

          **答え** 15

          **間違えやすい点** 幅の広い階級の度数をそのまま高さにすると、その階級にデータが多いように見えてしまう。
  - id: s03p02
    title: ばらつきと平均の求め方
    context: |
      平均やばらつきの指標を、目的に合わせて選ぶ。
    items:
      - id: s03p02a
        chapter: 2
        terms: [coefficient-of-variation, sample-variance-sd]
        topic: 平均の大きさが違う2つの製品の重さのばらつきを変動係数で比べる
        level: 基本
        definition: false
        type: choice
        question: |
          製品 A の重さは平均 150 g・標準偏差 6 g、製品 B の重さは平均 50 g・標準偏差 4 g だった。重さの相対的なばらつきについて正しい記述はどれか。
        choices:
          - 標準偏差の大きい A のほうが、相対的なばらつきも大きい
          - 変動係数は A が 25、B が 12.5 で、A のほうが相対的なばらつきが大きい
          - 変動係数は A が 0.04、B が 0.08 で、B のほうが相対的なばらつきが大きい
          - 変動係数は A が 0.04、B が 0.08 で、A のほうが相対的なばらつきが大きい
          - 単位が同じ g なので、変動係数で比べる意味はない
        answer: 2
        distractors:
          - 標準偏差は平均の大きさの違いを考えていない
          - 平均 ÷ 標準偏差（変動係数の逆数）を計算した
          - 正解
          - 変動係数の大小の読み方が逆
          - 単位が同じでも平均の大きさが大きく違えば、相対的なばらつきは変動係数で比べる
        explanation: |
          **方針** 変動係数 ＝ 標準偏差 ÷ 平均。

          **途中式** A：$6/150=0.04$、B：$4/50=0.08$

          **答え** B のほうが相対的なばらつきが大きい

          **間違えやすい点** 標準偏差そのものは A のほうが大きいが、平均に対する割合では B のほうが大きい。
      - id: s03p02b
        chapter: 2
        terms: [weighted-geometric-harmonic-mean, mean-median-mode]
        topic: 同じ距離を行きと帰りで違う速さで走ったときの平均の速さを調和平均で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある区間を、行きは時速 60 km、帰りは時速 40 km で走った（行きと帰りの距離は同じ）。往復の平均の速さは時速何 km か。
        choices:
          - '50'
          - '49.0'
          - '100'
          - '24'
          - '48'
        answer: 4
        distractors:
          - 2 つの速さの算術平均をとった（かかった時間の違いを考えていない）
          - 2 つの速さの幾何平均をとった
          - 2 つの速さを足しただけ
          - $60\times 40/(60+40)$ で止め、2 倍し忘れた
          - 正解
        explanation: |
          **方針** 平均の速さ ＝ 全体の距離 ÷ 全体の時間。距離が同じなら速さの調和平均になる。

          **途中式** 片道を $d$ km とすると、時間は $d/60+d/40$。平均の速さ $=\dfrac{2d}{d/60+d/40}=\dfrac{2}{1/60+1/40}=48$

          **答え** 時速 48 km

          **間違えやすい点** 遅い帰りのほうが時間が長いので、平均は 50 より遅い側に寄る。
      - id: s03p02c
        chapter: 2
        terms: [sample-variance-sd, mean-median-mode]
        topic: 人数と平均と分散が違う2つの組を合わせた全体の平均と分散を群内と群間の部分に分けて求める
        level: 応用
        definition: false
        type: choice
        question: |
          A 組 10 人の得点は平均 50 点・分散 16、B 組 15 人の得点は平均 60 点・分散 25 だった（分散はどちらも人数 $n$ で割ったもの）。2 つの組を合わせた 25 人の平均と分散（25 で割ったもの）の組合せとして正しいものはどれか。
        choices:
          - 平均 55、分散 20.5
          - 平均 56、分散 45.4
          - 平均 56、分散 21.4
          - 平均 56、分散 24.0
          - 平均 55、分散 45.4
        answer: 1
        distractors:
          - 人数を考えずに、平均も分散も単純に平均した
          - 正解
          - 組の中の分散を人数で重み付けして平均しただけで、組の平均の違いを考えていない
          - 組の平均の違いによる部分だけを計算し、組の中の分散を足していない
          - 平均を人数で重み付けしなかった
        explanation: |
          **方針** 全体の平均は人数で重み付けした平均。全体の分散は「組の中の分散の加重平均」と「組の平均の全体平均からのずれ」の和。

          **途中式**
          - 平均：$(10\times 50+15\times 60)/25=1400/25=56$
          - 組の中：$(10\times 16+15\times 25)/25=21.4$
          - 組の間：$\{10\times(50-56)^2+15\times(60-56)^2\}/25=(360+240)/25=24.0$
          - 分散：$21.4+24.0=45.4$

          **答え** 平均 56、分散 45.4

          **間違えやすい点** 組の平均が違うと、そのずれの分だけ全体の散らばりは大きくなる（分散分析の平方和の分解と同じ考え方）。
  - id: s03p03
    title: 2 つの病院の回復率
    context: |
      ある病気の患者について、2 つの病院の治療の結果を、症状の重さ別に集計した。

      | | 軽症：患者数 | 軽症：回復 | 重症：患者数 | 重症：回復 |
      |---|---|---|---|---|
      | 病院 A | 90 | 81 | 30 | 15 |
      | 病院 B | 20 | 19 | 80 | 44 |
    items:
      - id: s03p03a
        chapter: 3
        terms: [simpsons-paradox, cross-tabulation, spurious-correlation]
        topic: 症状の重さで層別すると回復率の大小が全体と逆になる2つの病院の表を読み取る
        level: 基本
        definition: false
        type: choice
        question: |
          この表から読み取れることとして正しいものはどれか。
        choices:
          - 全体の回復率は A のほうが高いので、A の治療のほうが効果が高いといえる
          - 軽症では A、重症では B の回復率が高い
          - 全体の回復率は A が 0.63、B が 0.80 である
          - 症状の重さは回復率に関係していない
          - 軽症・重症のどちらでも B の回復率が高いが、全体では A の回復率が高い。重症の患者の割合が病院で大きく違うためである
        answer: 4
        distractors:
          - 症状の重さで分けると、どちらでも B のほうが高い。全体の比較だけで判断するのは誤り
          - 軽症でも B（0.95）のほうが A（0.90）より高い
          - A と B を取り違えている（A は 96/120＝0.80、B は 63/100＝0.63）
          - 軽症の回復率は 0.9 前後、重症は 0.5 前後で大きく違う
          - 正解
        explanation: |
          **方針** 層（軽症・重症）ごとの回復率と、全体の回復率を比べる。

          **途中式**
          - 軽症：A $81/90=0.90$、B $19/20=0.95$
          - 重症：A $15/30=0.50$、B $44/80=0.55$
          - 全体：A $96/120=0.80$、B $63/100=0.63$

          **答え** どちらの層でも B が高いが、全体では A が高い

          **間違えやすい点** B は回復しにくい重症の患者を多く受け入れているため、全体の回復率が低くなる（シンプソンのパラドックス）。重症度という第 3 の変数で層別して比べる必要がある。
  - id: s03p04
    title: 広告と売上の対数変換
    context: |
      ある店の 1 か月の売上 $y$（万円）と広告の回数 $x$ について、売上の自然対数を広告の回数で説明する回帰 $\log y = 2.0 + 0.10x$ が得られた。必要なら $e^{0.1}=1.105$ を使ってよい。
    items:
      - id: s03p04a
        chapter: 4
        terms: [log-transformation, simple-regression]
        topic: 目的変数を対数変換した回帰の傾きを説明変数が1増えたときの何パーセントの変化として解釈する
        level: 標準
        definition: false
        type: choice
        question: |
          この回帰式によると、広告の回数が 1 回増えると、売上はどう変わると予測されるか。
        choices:
          - 0.10 万円増える
          - 10 万円増える
          - 約 1.105 倍（約 10.5% 増加）になる
          - $e^{2.0}$ 倍になる
          - 約 1.105 万円増える
        answer: 2
        distractors:
          - 対数をとった値の増え方を、売上そのものの増え方とした
          - 0.10 を 100 倍して万円の増加とした
          - 正解
          - 切片の $e^{2.0}$ は x＝0 のときの売上の予測値で、増え方ではない
          - 倍率を金額の増加と取り違えた
        explanation: |
          **方針** $\log y$ が 0.10 増えると、$y$ は $e^{0.10}$ 倍になる。

          **途中式** $y=e^{2.0}e^{0.10x}$ なので、$x$ が 1 増えると $y$ は $e^{0.1}=1.105$ 倍。

          **答え** 約 1.105 倍（約 10.5% 増加）

          **間違えやすい点** 対数をとった回帰では、傾きは「差」ではなく「比（％の変化）」を表す。傾きが小さいときは、傾き × 100 ％ がおよその増加率になる。
  - id: s03p05
    title: 経済の時系列
    context: |
      経済の統計を読み取る。
    items:
      - id: s03p05a
        chapter: 5
        terms: [price-index, growth-rate, index-number]
        topic: 名目の成長率と物価の上昇率から実質の成長率を比の形で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある国の名目 GDP は前年より 5% 増え、物価（GDP デフレーター）は前年より 2% 上がった。実質 GDP の成長率に最も近いものはどれか。
        choices:
          - 3.0%
          - 7.1%
          - −2.9%
          - 2.9%
          - 7.0%
        answer: 3
        distractors:
          - 成長率を引き算した（近似で、正確な値ではない）
          - 比を掛けた（1.05 × 1.02 − 1）
          - 比を逆にした（1.02 ÷ 1.05 − 1）
          - 正解
          - 成長率を足した
        explanation: |
          **方針** 実質 ＝ 名目 ÷ 物価。成長率は比で計算する。

          **途中式** $1.05/1.02-1\approx 0.0294$

          **答え** 2.9%

          **間違えやすい点** 「5% − 2% ＝ 3%」は変化が小さいときの近似。正確には比で計算する。
      - id: s03p05b
        chapter: 5
        terms: [correlogram, autocovariance-autocorrelation, time-series-components]
        topic: 月次データのコレログラムでラグ12とラグ24の自己相関が大きいことから1年周期の季節変動を読み取る
        level: 基本
        definition: false
        type: choice
        question: |
          ある月次の売上データの標本自己相関（コレログラム）を描いたところ、ラグ 12 とラグ 24 で自己相関が大きな正の値になった。このことから考えられることはどれか。
        choices:
          - 12 か月周期の季節変動がある
          - 12 か月ごとに売上が 0 になる
          - 売上には不規則変動しかない
          - 売上は 1 か月ごとに上がり下がりをくり返している
          - 売上には長期的なトレンドがまったくない
        answer: 0
        distractors:
          - 正解
          - 自己相関は値の大きさではなく、時点をずらした値どうしの関連を表す
          - 不規則変動だけなら、どのラグでも自己相関は 0 に近い
          - その場合はラグ 1 で負の大きな自己相関になる
          - ラグ 12・24 の情報だけでは、トレンドの有無は判断できない
        explanation: |
          **方針** ラグ $k$ の自己相関は、$k$ 時点離れた値どうしの相関。

          **途中式** 12 か月・24 か月離れた月どうし（同じ月）の値が似ている → 1 年周期の季節変動。

          **答え** 12 か月周期の季節変動がある

          **間違えやすい点** 季節変動を除くには、前年同月比や 12 か月移動平均を使う。
  - id: s03p06
    title: 名簿からの抽出と郵送調査
    context: |
      ある会社が 5000 人の会員の名簿から標本を選んで調査する。
    items:
      - id: s03p06a
        chapter: 6
        terms: [systematic-sampling, simple-random-sampling]
        topic: 5000人の名簿から100人を系統抽出法で選ぶとき抽出間隔とスタートから3番目に選ばれる番号を求める
        level: 基本
        definition: false
        type: choice
        question: |
          名簿の 5000 人から 100 人を系統抽出法で選ぶ。1〜50 番の中から無作為に選んだ最初の番号が 23 番だったとき、3 番目に選ばれるのは何番の会員か。
        choices:
          - 73 番
          - 123 番
          - 69 番
          - 173 番
          - 150 番
        answer: 1
        distractors:
          - 2 番目に選ばれる番号
          - 正解
          - 最初の番号を 3 倍した
          - 4 番目に選ばれる番号
          - 抽出間隔を 3 倍しただけで、最初の番号を足していない
        explanation: |
          **方針** 抽出間隔は $5000/100=50$。最初の番号から 50 ずつ足していく。

          **途中式** 23、73、123、…

          **答え** 123 番

          **間違えやすい点** 名簿の並びに周期（50 人ごとに同じ性質の人が並ぶなど）があると、系統抽出法では偏りが生じる。
      - id: s03p06b
        chapter: 6
        terms: [nonresponse-bias, sampling-and-nonsampling-error]
        topic: 回収率30パーセントの郵送調査の結果をそのまま使うときの無回答による偏りを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          無作為に選んだ 1000 人に郵送で調査票を送ったところ、回収率は 30% だった。回答した 300 人の結果をそのまま全体の推定に使うときの問題点として最も適切なものはどれか。
        choices:
          - 回答数が 300 人あれば、回収率が低くても偏りは生じない
          - 回答した人と回答しなかった人で意見が違う可能性があり、推定に偏りが生じうる
          - 回収率が低いと、標本誤差は 0 になる
          - 回答しなかった 700 人の分を回答者の平均で補えば、偏りは必ずなくなる
          - 標本を無作為に選んでいるので、回収率は結果に影響しない
        answer: 1
        distractors:
          - 偏りは回答数を増やしても消えない
          - 正解
          - 回答数が少ないほど標本誤差は大きくなる
          - 回答しない人の意見が回答者と違えば、平均で補っても偏りは残る
          - 回答するかどうかは本人が選ぶので、回答者は無作為な標本ではなくなる
        explanation: |
          **方針** 無回答が無作為に起こるとは限らない。関心の強い人ほど回答しやすい、などの傾向があると偏る（無回答バイアス）。

          **途中式** 選んだ時点では無作為でも、回答者 300 人は自分で回答を選んだ集団になっている。

          **答え** 意見の違いによる偏りが生じうる

          **間違えやすい点** 対策は、督促などで回収率を上げる、回答者と無回答者の属性を比べて調整する、など。
  - id: s03p07
    title: くじ引きと通学手段
    context: |
      確率を求める。
    items:
      - id: s03p07a
        chapter: 7
        terms: [counting, events-and-probability]
        topic: 5人から2人を無作為に選ぶとき特定の1人が選ばれる確率を組合せの数で求める
        level: 基本
        definition: false
        type: choice
        question: |
          A〜E の 5 人から、くじで 2 人の代表を選ぶ。A さんが代表に選ばれる確率はいくらか。
        choices:
          - '0.2'
          - '0.1'
          - '0.5'
          - '0.4'
          - '0.25'
        answer: 3
        distractors:
          - 1 人だけを選ぶ場合の確率とした
          - A を含む特定の 1 組（例えば A と B）が選ばれる確率を求めた
          - 「選ばれる・選ばれない」の 2 通りを同じ確からしさとした
          - 正解
          - A 以外の 4 人の数で割った
        explanation: |
