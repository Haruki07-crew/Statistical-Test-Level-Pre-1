set: 8
title: 2級 模擬試験 第8回
minutes: 90
problems:
  - id: s08p01
    title: 統計の出所と不良の原因
    context: |
      統計データの出所とグラフについて考える。
    items:
      - id: s08p01a
        chapter: 1
        terms: [official-statistics, population-and-sample]
        topic: 国勢調査が全数調査で5年ごとに行われ労働力調査が標本調査であることを答える
        level: 基本
        definition: true
        type: choice
        question: |
          日本の公的統計について正しい記述はどれか。
        choices:
          - 国勢調査は無作為に選んだ一部の世帯を対象とする標本調査である
          - 国勢調査は日本に住むすべての人と世帯を対象とする全数調査で、5 年ごとに行われる
          - 労働力調査は、すべての世帯を対象とする全数調査である
          - 公的統計は、すべて全数調査で作られている
          - 国勢調査は毎月行われている
        answer: 1
        distractors:
          - 国勢調査は全数調査
          - 正解
          - 労働力調査は標本調査
          - 家計調査・労働力調査など、標本調査による公的統計も多い
          - 国勢調査は 5 年ごと
        explanation: |
          **方針** 国勢調査は全数調査、多くの月次の統計（労働力調査など）は標本調査。

          **途中式** 国勢調査は西暦の末尾が 0 と 5 の年に行われる。

          **答え** 国勢調査は全数調査で、5 年ごとに行われる

          **間違えやすい点** 二次データとして公的統計を使うときは、全数か標本か、調査の時点や定義を確かめる。
      - id: s08p01b
        chapter: 1
        terms: [bar-pie-band-chart]
        topic: パレート図の累積割合から上位の原因で全体の何割を占めるかを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          ある製品の不良品 200 件の原因を調べ、件数の多い順に A 100 件、B 50 件、C 30 件、D 20 件だった。パレート図を描いたとき、累積割合の折れ線が初めて 80% 以上になるのはどの原因までを含めたときか。
        choices:
          - A・B の 2 つ（累積 75%）
          - A だけ（累積 50%）
          - A・B・C・D のすべて（累積 100%）
          - C だけ（15%）
          - A・B・C の 3 つ（累積 90%）
        answer: 4
        distractors:
          - 75% は 80% に届かない
          - 50% は 80% に届かない
          - 80% を超えるのは C を含めたとき
          - 累積ではなく 1 つの原因の割合を見た
          - 正解
        explanation: |
          **方針** パレート図は件数の多い順に棒を並べ、累積割合を折れ線で重ねる。

          **途中式** 累積割合は A 50%、A＋B 75%、A＋B＋C 90%、全部で 100%。

          **答え** A・B・C の 3 つ

          **間違えやすい点** 上位の少数の原因で大部分を占めることを見つけ、対策の優先順位を決めるのに使う。
  - id: s08p02
    title: 身長のばらつきと分布の形
    context: |
      子どもと大人の身長などを比べる。
    items:
      - id: s08p02a
        chapter: 2
        terms: [coefficient-of-variation]
        topic: 子どもと大人の身長の相対的なばらつきを変動係数で比べる
        level: 基本
        definition: false
        type: choice
        question: |
          ある小学校 1 年生の身長は平均 110 cm・標準偏差 5 cm、ある会社の大人の身長は平均 165 cm・標準偏差 7 cm だった。変動係数（%）で比べた結果として正しいものはどれか。
        choices:
          - 1 年生は約 4.5%、大人は約 4.2% で、大人のほうが相対的なばらつきが大きい
          - 1 年生は約 4.5%、大人は約 4.2% で、1 年生のほうが相対的なばらつきがやや大きい
          - 標準偏差が大きい大人のほうが、相対的なばらつきも大きい
          - 1 年生は約 22%、大人は約 24% で、大人のほうがばらつきが大きい
          - 単位が同じ cm なので、標準偏差で比べるのが正しい
        answer: 1
        distractors:
          - 4.5% は 4.2% より大きい（大小の読み誤り）
          - 正解
          - 標準偏差は平均の大きさの違いを考えていない
          - 平均 ÷ 標準偏差（変動係数の逆数）を計算した
          - 平均の大きさが違うときは、相対的なばらつきを変動係数で比べる
        explanation: |
          **方針** 変動係数 ＝ 標準偏差 ÷ 平均 × 100（%）。

          **途中式** $5/110\approx 4.5\%$、$7/165\approx 4.2\%$

          **答え** 1 年生のほうが相対的なばらつきがやや大きい

          **間違えやすい点** 標準偏差そのものは大人のほうが大きいが、平均に対する割合では 1 年生のほうが大きい。
      - id: s08p02b
        chapter: 2
        terms: [skewness-kurtosis, box-plot, distribution-shape]
        topic: 左のひげが長く中央値が箱の右寄りの箱ひげ図から左に裾が長く平均が中央値より小さいと判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある試験の得点の箱ひげ図では、左のひげが右のひげよりずっと長く、中央値の線は箱の右寄りにあった。この分布について最も適切なものはどれか。
        choices:
          - 右に裾が長く、平均値は中央値より大きく、歪度は正と考えられる
          - 左に裾が長く、平均値は中央値より小さく、歪度は負と考えられる
          - 左に裾が長く、平均値は中央値より大きく、歪度は正と考えられる
          - 左右対称で、平均値と中央値は等しい
          - 箱ひげ図からは分布の歪みはまったくわからない
        answer: 1
        distractors:
          - 左のひげが長いので、裾は左（小さい値の側）
          - 正解
          - 左に裾が長いと、平均値は小さい値に引っ張られ、歪度は負
          - ひげの長さが大きく違うので対称ではない
          - ひげの長さや中央値の位置から歪みの向きは読み取れる
        explanation: |
          **方針** ひげが長い側に裾が長い。裾の側に平均値が引っ張られる。

          **途中式** 左（小さい値）の側に裾 → 平均値 ＜ 中央値 → 歪度は負。

          **答え** 左に裾が長く、平均値は中央値より小さく、歪度は負

          **間違えやすい点** 易しい試験で多くの人が高得点のときに、このような形になりやすい。
  - id: s08p03
    title: 入学試験の合格率と相関行列
    context: |
      2 つの変数の関係を表やグラフから読む。
    items:
      - id: s08p03a
        chapter: 3
        terms: [correlation-matrix, covariance-and-correlation]
        topic: 4つの科目の相関行列から最も直線的な関係が弱い組を絶対値で選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          4 科目の得点の相関係数行列は次のとおりだった。直線的な関係が最も弱い組はどれか。

          | | 国語 | 英語 | 数学 | 理科 |
          |---|---|---|---|---|
          | 国語 | 1 | 0.62 | 0.15 | 0.21 |
          | 英語 | 0.62 | 1 | 0.33 | 0.30 |
          | 数学 | 0.15 | 0.33 | 1 | −0.71 |
          | 理科 | 0.21 | 0.30 | −0.71 | 1 |
        choices:
          - 数学と理科
          - 国語と英語
          - 英語と理科
          - 国語と国語
          - 国語と数学
        answer: 4
        distractors:
          - −0.71 は負だが、絶対値が大きく関係は強い
          - 0.62 は関係が比較的強い
          - 0.30 は 0.15 より絶対値が大きい
          - 対角は同じ変数どうしで常に 1
          - 正解
        explanation: |
          **方針** 関係の強さは相関係数の絶対値で比べる。

          **途中式** 絶対値が最も小さいのは国語と数学の 0.15。

          **答え** 国語と数学

          **間違えやすい点** 負の値を「弱い関係」と読まない。−0.71 は強い負の関係。
      - id: s08p03b
        chapter: 3
        terms: [simpsons-paradox, cross-tabulation]
        topic: 2つの学部の合格率の表で学部ごとには女性の合格率が高いのに全体では男性が高い理由を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          ある大学の 2 つの学部の入試結果は次のとおりだった。

          | | 男性：受験者 | 男性：合格 | 女性：受験者 | 女性：合格 |
          |---|---|---|---|---|
          | 学部 X | 80 | 48 | 20 | 14 |
          | 学部 Y | 20 | 4 | 80 | 20 |

          この表から読み取れることとして正しいものはどれか。
        choices:
          - 全体で男性の合格率が高いので、入試は男性に有利である
          - 学部 X では男性、学部 Y では女性の合格率が高い
          - 全体の合格率は男性 26%、女性 34% である
          - 学部ごとに分けると、男女の合格率の差は消える
          - どちらの学部でも女性の合格率のほうが高いが、全体では男性のほうが高い。合格率の低い学部 Y を受けた女性が多いためである
        answer: 4
        distractors:
          - 学部ごとに見ると女性のほうが高い。全体だけで判断するのは誤り
          - 学部 X でも女性（70%）が男性（60%）より高い
          - 全体の合格率は男性 52%、女性 34%
          - 差は消えず、向きが逆になる
          - 正解
        explanation: |
          **方針** 学部ごとの合格率と全体の合格率を比べる。

          **途中式**
          - 学部 X：男性 60%、女性 70%
          - 学部 Y：男性 20%、女性 25%
          - 全体：男性 $52/100=52\%$、女性 $34/100=34\%$

          **答え** 学部ごとには女性が高いが、全体では男性が高い

          **間違えやすい点** 女性の多くが合格率の低い学部 Y を受けているため、全体では逆転する（シンプソンのパラドックス）。
  - id: s08p04
    title: 回帰の点検と時系列
    context: |
      回帰の残差と時系列の自己相関を調べる。
    items:
      - id: s08p04a
        chapter: 4
        terms: [residual-plot, simple-regression, log-transformation]
        topic: 残差プロットがU字形の曲線になったことから直線の当てはめが適切でない可能性を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          単回帰の残差を説明変数に対してプロットしたところ、両端で正、中央付近で負の、U 字形のパターンになった。最も適切な判断はどれか。
        choices:
          - 誤差の分散が一定でないことだけを示している
          - 残差がランダムに散らばっているので、直線の当てはめは適切である
          - 決定係数が 1 なので問題はない
          - 関係が直線的でない可能性があり、2 次の項を加える・変数を変換するなどを検討する
          - 残差の合計が 0 でないので、計算が誤っている
        answer: 3
        distractors:
          - 分散が一定でないときは扇形になる。U 字形は形の問題
          - U 字形はランダムではない
          - 決定係数が 1 なら残差はすべて 0
          - 正解
          - 残差の合計は 0 のままでも U 字形になりうる
        explanation: |
          **方針** 残差にはっきりしたパターンがあれば、モデルの形が合っていない。

          **途中式** U 字形 → 曲線的な関係を直線で当てはめた。

          **答え** 関係が直線的でない可能性がある

          **間違えやすい点** 扇形は分散が一定でない、U 字形は直線関係でない、を区別する。
      - id: s08p04b
        chapter: 5
        terms: [correlogram, autocovariance-autocorrelation]
        topic: どのラグでも自己相関がほぼ0のコレログラムから系列に規則的な変動がないと判断する
        level: 基本
        definition: false
        type: choice
        question: |
          ある日次の系列のコレログラムでは、ラグ 1 以降のどのラグの標本自己相関も 0 に近かった。このことから考えられることとして最も適切なものはどれか。
        choices:
          - 強いトレンドがある
          - 7 日周期の曜日の変動がある
          - 時点どうしの関連がほとんどなく、不規則な変動に近い
          - 値がすべて同じ大きさである
          - 前日の値から翌日の値をよく予測できる
        answer: 2
        distractors:
          - トレンドがあると自己相関はゆっくり減る正の値になる
          - 曜日の変動があるとラグ 7 で大きくなる
          - 正解
          - 自己相関が 0 でも値は変動している
          - ラグ 1 の自己相関が 0 に近いので、前日の値からは予測できない
        explanation: |
          **方針** 自己相関がどのラグでも 0 に近いのは、ホワイトノイズのような不規則変動の特徴。

          **途中式** 規則的なパターン（トレンド・周期）があれば、特定のラグで自己相関が大きくなる。

          **答え** 不規則な変動に近い

          **間違えやすい点** コレログラムの形から、トレンド・季節変動・不規則変動を見分ける。
      - id: s08p04c
        chapter: 5
        terms: [growth-rate, weighted-geometric-harmonic-mean]
        topic: 2年間の成長率から幾何平均で年平均成長率を求め算術平均と区別する
        level: 応用
        definition: false
        type: choice
        question: |
          ある会社の売上は、1 年目に 60% 増加し、2 年目に 10% 減少した。2 年間の年平均成長率はいくらか。
        choices:
          - 25%
          - 50%
          - 20%
          - 44%
          - 22%
        answer: 2
        distractors:
          - 成長率の算術平均（(60 − 10)/2）
          - 成長率を足しただけ
          - 正解
          - 2 年間の増加率（1.6 × 0.9 − 1）
          - 2 年間の増加率 44% を 2 で割った
        explanation: |
          **方針** $(1+\bar g)^2=(1.6)(0.9)$。

          **途中式** $1.6\times 0.9=1.44$、$\sqrt{1.44}=1.2$ → 20%

          **答え** 20%

          **間違えやすい点** 平均成長率は幾何平均。算術平均（25%）は大きめになる。
  - id: s08p05
    title: 調査の精度と回収率
    context: |
      標本調査の方法を考える。
    items:
      - id: s08p05a
        chapter: 6
        terms: [cluster-sampling, stratified-sampling]
        topic: 集落抽出法で集落の中の対象が互いに似ているときに精度が下がることを判断する
        level: 基本
        definition: false
        type: choice
        question: |
          市内の小学校をいくつか無作為に選び、選んだ学校の児童全員の睡眠時間を調べた（集落抽出法）。同じ人数を単純無作為抽出で選ぶ場合に比べて、精度が下がりやすいのはどのような場合か。
        choices:
          - 学校の中の児童の睡眠時間がばらばらで、学校どうしの平均がほぼ同じ場合
          - 選ぶ学校の数を増やした場合
          - 学校を無作為に選んだ場合
          - 児童の人数が多い場合
          - 同じ学校の児童どうしの睡眠時間がよく似ていて、学校によって大きく違う場合
        answer: 4
        distractors:
          - この場合は集落抽出でも精度はあまり下がらない
          - 学校の数を増やすと精度は上がる
          - 無作為に選ぶのは偏りを防ぐための前提
          - 人数の多さだけでは精度の低下は決まらない
          - 正解
        explanation: |
          **方針** 集落抽出では、選ばれた集落の中が似ていると、実質的な情報が少なくなる。

          **途中式** 学校の中が似ている → 1 校の全員を調べても、1 人を調べたのとあまり変わらない。

          **答え** 学校の中が似ていて、学校によって大きく違う場合

          **間違えやすい点** 層化抽出はその逆で、層の中が似ているほど精度が上がる。
      - id: s08p05b
        chapter: 6
        terms: [nonresponse-bias, sampling-and-nonsampling-error]
        topic: 郵送調査の回収率が低いときの対策として督促と回答者の属性の比較を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          郵送調査の回収率が 35% と低かった。無回答による偏りを小さくするための対策として最も適切なものはどれか。
        choices:
          - 督促などで回収率を上げ、回答者と無回答者の属性（年齢・地域など）を比べて偏りを確かめる
          - 回答した人の結果を 1/0.35 倍して全体の人数に合わせる
          - 標本の大きさを 3 倍にして、回答数を増やす
          - 回答しなかった人は調査の対象から外して、回答者だけを母集団とする
          - 回答者の平均値を、無回答者の値として補えば偏りはなくなる
        answer: 0
        distractors:
          - 正解
          - 合計を合わせても、回答者の偏りはそのまま残る
          - 回答数は増えても、回答しやすい人に偏ることは変わらない
          - 母集団を勝手に変えると、知りたいことが変わってしまう
          - 無回答者の意見が回答者と違えば、偏りは残る
        explanation: |
          **方針** 無回答バイアスは、回答する人としない人の違いから生じる。回収率を上げ、偏りの大きさを確かめる。

          **途中式** 属性が分かれば、属性ごとの重み付けなどで調整することもできる。

          **答え** 督促で回収率を上げ、属性を比べて偏りを確かめる

          **間違えやすい点** 回答数を増やすだけでは、無回答による偏りは減らない。
  - id: s08p06
    title: 確率と確率変数
    context: |
      確率と確率変数の計算をする。
    items:
      - id: s08p06a
        chapter: 7
        terms: [events-and-probability, counting]
        topic: 3人の誕生月が少なくとも2人同じになる確率を余事象で求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 人の誕生月がそれぞれ 12 か月のどれかに同じ確率で独立に決まるとする。少なくとも 2 人の誕生月が同じである確率に最も近いものはどれか。
        choices:
          - '0.236'
          - '0.764'
          - '0.250'
          - '0.083'
          - '0.007'
        answer: 0
        distractors:
          - 正解
          - 3 人の誕生月がすべて違う確率
          - 3 × (1/12) を求めた
          - 2 人の誕生月が同じ確率 1/12 だけを求めた
          - 3 人とも同じ月である確率（1/144）
        explanation: |
          **方針** 余事象「3 人とも違う月」を求めて 1 から引く。

          **途中式** すべて違う確率 $\dfrac{12\times 11\times 10}{12^3}=\dfrac{1320}{1728}\approx 0.764$。$1-0.764\approx 0.236$

          **答え** 0.236

          **間違えやすい点** 「少なくとも 2 人同じ」は、2 人だけ同じ場合と 3 人とも同じ場合を含む。余事象が簡単。
      - id: s08p06b
        chapter: 7
        terms: [conditional-probability, cross-tabulation]
        topic: 年代とサービスの利用のクロス表から利用者の中で20代である条件付き確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある調査で、20 代 90 人のうち 36 人、30 代 120 人のうち 36 人、40 代 90 人のうち 18 人が、あるサービスを利用していた。利用者から 1 人を選んだとき、その人が 20 代である確率はいくらか。
        choices:
          - '0.30'
          - '0.12'
          - '0.40'
          - '0.33'
          - '0.20'
        answer: 2
        distractors:
          - 全体 300 人のうち 20 代の割合（90/300）
          - 「20 代で利用者」の人数を全体 300 人で割った
          - 正解
          - 3 つの年代を同じ確からしさとした
          - 40 代の利用者の割合（18/90）と取り違えた
        explanation: |
          **方針** 条件は「利用者」なので、利用者全体を分母にする。

          **途中式** 利用者は $36+36+18=90$ 人。そのうち 20 代は 36 人で、$36/90=0.40$。

          **答え** 0.40

          **間違えやすい点** $P(\text{利用}\mid\text{20 代})=36/90=0.40$ とたまたま同じ値だが、意味は違う（分母が 20 代 90 人か、利用者 90 人か）。
      - id: s08p06c
        chapter: 8
        terms: [marginal-distribution, joint-probability-function]
        topic: 2つの確率変数の同時確率表から一方の周辺分布と期待値を行や列の和で求める
        level: 基本
        definition: false
        type: choice
        question: |
          確率変数 $X$（1・2）と $Y$（0・1・2）の同時確率は次のとおりである。$Y$ の期待値はいくらか。

          | | $Y=0$ | $Y=1$ | $Y=2$ |
          |---|---|---|---|
          | $X=1$ | 0.10 | 0.20 | 0.10 |
          | $X=2$ | 0.20 | 0.10 | 0.30 |
        choices:
          - '0.9'
          - '1.0'
          - '1.1'
          - '0.7'
          - '1.6'
        answer: 2
        distractors:
          - $P(Y=2)$ に $X=2$ のセルの 0.30 だけを使った
          - $Y$ の値 0・1・2 を同じ重みで平均した
          - 正解
          - $X=2$ の行の確率をそのまま重みにした
          - $X$ の期待値と取り違えた
        explanation: |
          **方針** $Y$ の周辺確率は列ごとの和。それを重みにして期待値を求める。

          **途中式** $P(Y=0)=0.30$、$P(Y=1)=0.30$、$P(Y=2)=0.40$。$E[Y]=0\times 0.3+1\times 0.3+2\times 0.4=1.1$

          **答え** 1.1

          **間違えやすい点** 周辺確率の合計が 1 になることを確かめる。
      - id: s08p06d
        chapter: 8
        terms: [covariance-and-correlation, sum-of-random-variables]
        topic: 独立な2つの確率変数XとYについてXとその和X+Yの相関係数を共分散から求める
        level: 応用
        definition: false
        type: choice
        question: |
          確率変数 $X$、$Y$ は独立で、$V[X]=4$、$V[Y]=9$ である。$X$ と $X+Y$ の相関係数に最も近いものはどれか。
        choices:
          - '0.31'
          - '0'
          - '0.67'
          - '0.55'
          - '1'
        answer: 3
        distractors:
          - 標準偏差ではなく分散の比 4/13 を答えた
          - $X+Y$ は $X$ を含むので無相関ではない
          - $X$ と $Y$ の標準偏差の比 2/3 を答えた
          - 正解
          - 完全に比例しているわけではない
        explanation: |
          **方針** $\mathrm{Cov}[X,X+Y]=V[X]+\mathrm{Cov}[X,Y]=V[X]$（独立なので $\mathrm{Cov}[X,Y]=0$）。

          **途中式** 相関係数 $=\dfrac{4}{\sqrt 4\times\sqrt{4+9}}=\dfrac{4}{2\sqrt{13}}\approx 0.55$

          **答え** 0.55

          **間違えやすい点** 合計は部分を含むので、部分と合計は正の相関をもつ。
  - id: s08p07
    title: 分布の性質
    context: |
      分布の性質を使う。
    items:
      - id: s08p07a
        chapter: 9
        terms: [binomial-distribution]
        topic: 二項分布B10と0.3で最も起こりやすい成功回数を確率を比べて求める
        level: 基本
        definition: false
        type: choice
        question: |
          成功確率 0.3 の独立な試行を 10 回行う。成功回数のうち、最も起こりやすい（確率が最大の）回数はどれか。
        choices:
          - 0 回
          - 5 回
          - 10 回
          - 3 回
          - 2 回
        answer: 3
        distractors:
          - 0 回の確率は 0.7¹⁰ ≈ 0.028 と小さい
          - 試行の回数の半分を答えた
          - 試行の回数をそのまま答えた
          - 正解
          - 2 回の確率（約 0.233）は 3 回（約 0.267）より小さい
        explanation: |
          **方針** 確率を順に計算して比べる。最頻値は期待値 $np=3$ の近くにある。

          **途中式** $P(2)\approx 0.233$、$P(3)\approx 0.267$、$P(4)\approx 0.200$

          **答え** 3 回

          **間違えやすい点** 二項分布の最頻値は期待値の近くにあり、多くの場合は期待値を超えない最大の整数か、その次の整数。
      - id: s08p07b
        chapter: 9
        terms: [hypergeometric-distribution, binomial-distribution]
        topic: 50個中10個が不良の箱から戻さずに5個取り出したときの不良品の個数の期待値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          50 個の部品のうち 10 個が不良品である箱から、5 個を戻さずに無作為に取り出す。取り出した中の不良品の個数の期待値はいくらか。
        choices:
          - '1.0'
          - '0.2'
          - '2.0'
          - '0.8'
          - '5.0'
        answer: 0
        distractors:
          - 正解
          - 不良品の割合だけを答えた
          - 不良品の数 10 を 5 で割った
          - 分散の式の一部 $5\times 0.2\times 0.8$ を答えた
          - 取り出す個数をそのまま答えた
        explanation: |
          **方針** 超幾何分布の期待値は $n\dfrac{K}{N}$（戻して取り出す二項分布と同じ）。

          **途中式** $5\times 10/50=1.0$

          **答え** 1.0

          **間違えやすい点** 期待値は戻すかどうかによらないが、分散は戻さないほうが小さい（有限母集団修正がかかる）。
  - id: s08p08
    title: 標本分布の性質
    context: |
      必要なら次の値を使ってよい：$F_{0.05}(9,9)=3.179$。
    items:
      - id: s08p08a
        chapter: 10
        terms: [sampling-distribution-of-mean, standard-error]
        topic: 標本平均の標準偏差を3分の1にするのに必要な標本の大きさの倍率を答える
        level: 基本
        definition: false
        type: choice
        question: |
          標本平均の標準偏差を今の 1/3 にするには、標本の大きさを今の何倍にすればよいか。
        choices:
          - 3 倍
          - 1/3 倍
          - 9 倍
          - 6 倍
          - √3 倍
        answer: 2
        distractors:
          - 標準偏差が $1/n$ に比例するとした
          - 小さくするのに標本を減らした
          - 正解
          - 3 を 2 倍した
          - 平方根の関係を逆にした
        explanation: |
          **方針** 標本平均の標準偏差は $\sigma/\sqrt n$。

          **途中式** $1/\sqrt n$ を 1/3 にするには $\sqrt n$ を 3 倍、$n$ を 9 倍。

          **答え** 9 倍

          **間違えやすい点** 精度を上げるのに必要な標本は、2 乗で増える。
      - id: s08p08b
        chapter: 10
        terms: [chebyshev-inequality]
        topic: チェビシェフの不等式から平均の前後に標準偏差の3倍の範囲に入る割合の下限を求める
        level: 標準
        definition: false
        type: choice
        question: |
          分布の形がわからないデータで、平均から標準偏差の 3 倍以内に入るデータの割合は、チェビシェフの不等式から少なくとも何 % といえるか。
        choices:
          - 約 88.9%
          - 約 99.7%
          - 約 66.7%
          - 約 11.1%
          - 約 75.0%
        answer: 0
        distractors:
          - 正解
          - 正規分布を仮定した値
          - $1-1/3$ とした（2 乗していない）
          - 範囲の外の割合の上限を答えた
          - 2 倍以内の場合の下限
        explanation: |
          **方針** $P(|X-\mu|<k\sigma)\ge 1-\dfrac{1}{k^2}$。

          **途中式** $1-1/9\approx 0.889$

          **答え** 約 88.9%

          **間違えやすい点** 正規分布なら約 99.7% だが、チェビシェフの不等式はどんな分布でも成り立つ下限。
      - id: s08p08c
        chapter: 10
        terms: [f-distribution, sample-variance-sd]
        topic: 同じ正規母集団からの2つの標本の不偏分散の比が3.179を超える確率をF分布で求める
        level: 応用
        definition: false
        type: choice
        question: |
          同じ正規母集団から、大きさ 10 の標本を 2 つ独立に抽出し、不偏分散を $S_1^2$、$S_2^2$ とする。$P(S_1^2/S_2^2>3.179)$ はいくらか。
        choices:
          - '0.025'
          - '0.05'
          - '0.10'
          - '0.95'
          - '0'
        answer: 1
        distractors:
          - 両側として半分にした
          - 正解
          - 両側の確率（比が 3.179 を超えるか 1/3.179 を下回る）を答えた
          - 3.179 以下の確率を答えた
          - 同じ母集団でも、標本の分散の比は 1 からずれる
        explanation: |
          **方針** 同じ母分散なら $S_1^2/S_2^2$ は自由度 (9, 9) の F 分布にしたがう。

          **途中式** $F_{0.05}(9,9)=3.179$ なので、$P(S_1^2/S_2^2>3.179)=0.05$。

          **答え** 0.05

          **間違えやすい点** 母分散が同じでも、標本が小さいと分散の比は 3 倍以上になることが 5% ほどある。
  - id: s08p09
    title: 推定
    context: |
      必要なら次の値を使ってよい：$z_{0.05}=1.645$、$z_{0.025}=1.96$、$\chi^2_{0.025}(15)=27.49$、$\chi^2_{0.975}(15)=6.262$。
    items:
      - id: s08p09a
        chapter: 11
        terms: [unbiased-estimator, sample-variance-sd]
        topic: データの個数と合計と2乗和から不偏分散を求める
        level: 基本
        definition: false
        type: choice
        question: |
          5 個のデータについて、合計は 30、2 乗の合計は 200 だった。母分散の不偏推定値（不偏分散）はいくらか。
        choices:
          - '5.0'
          - '4.0'
          - '20.0'
          - '40.0'
          - '2.24'
        answer: 0
        distractors:
          - 正解
          - $n$ で割った
          - 偏差平方和をそのまま答えた
          - 2 乗の合計 200 を $n=5$ で割った
          - 不偏分散の平方根を答えた
        explanation: |
          **方針** 偏差平方和 $=\sum x^2-n\bar x^{\,2}$、不偏分散 $=$ 偏差平方和 $\div(n-1)$。

          **途中式** $\bar x=6$、$200-5\times 36=20$、$20/4=5.0$

          **答え** 5.0

          **間違えやすい点** 2 乗の平均から平均の 2 乗を引く形（$200/5-36=4$）は $n$ で割った分散。
      - id: s08p09b
        chapter: 11
        terms: [ci-two-sample-proportion, standard-error]
        topic: 2つの地域の400人ずつの賛成率の差について母比率の差の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          地域 A と地域 B でそれぞれ 400 人に調査したところ、賛成の割合は A が 0.55、B が 0.45 だった。母比率の差（A − B）の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (0.042, 0.158)
          - (0.051, 0.149)
          - (0.002, 0.198)
          - (0.098, 0.102)
          - (0.031, 0.169)
        answer: 4
        distractors:
          - 1.645 を使った（90% 信頼区間）
          - 標準誤差の計算で、片方の地域の分散だけを使った
          - 2 つの標準誤差を足した（分散ではなく標準偏差を足した）
          - 平方根をとらなかった
          - 正解
        explanation: |
          **方針** 差の標準誤差は $\sqrt{0.55\times 0.45/400+0.45\times 0.55/400}$。

          **途中式** $\sqrt{0.2475/400\times 2}\approx 0.0352$、$0.10\pm 1.96\times 0.0352=0.10\pm 0.069$

          **答え** (0.031, 0.169)

          **間違えやすい点** 2 つの独立な比率の差の分散は、それぞれの分散の和。区間は 0 を含まないので、有意水準 5% で差があるといえる。
      - id: s08p09c
        chapter: 11
        terms: [ci-variance, chi-squared-distribution]
        topic: 正規母集団の16個の標本の不偏分散9から自由度15のカイ二乗分布の点で母分散の95パーセント信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          正規母集団から大きさ 16 の標本を抽出したところ、不偏分散は 9 だった。母分散の 95% 信頼区間に最も近いものはどれか。
        choices:
          - (5.24, 23.00)
          - (0.33, 1.44)
          - (21.56, 4.91)
          - (4.91, 21.56)
          - (2.56, 15.44)
        answer: 3
        distractors:
          - 分子を $(n-1)s^2$ ではなく $ns^2=144$ とした
          - 分子に $(n-1)$ を掛け忘れた
          - 下限と上限を逆にした
          - 正解
          - 不偏分散の標準誤差 $\sqrt{2/(n-1)}\,s^2$ を使って、9 について左右対称な区間を作った
        explanation: |
          **方針** $\left(\dfrac{(n-1)s^2}{\chi^2_{0.025}(15)},\ \dfrac{(n-1)s^2}{\chi^2_{0.975}(15)}\right)$。

          **途中式** $(n-1)s^2=135$、$135/27.49\approx 4.91$、$135/6.262\approx 21.56$

          **答え** (4.91, 21.56)

          **間違えやすい点** 母分散の区間は不偏分散について左右対称にならない。
      - id: s08p09d
        chapter: 11
        terms: [ci-mean-known-variance, confidence-interval]
        topic: 母標準偏差既知のとき母平均の95パーセント片側信頼上限を上側5パーセント点で求める
        level: 応用
        definition: false
        type: choice
        question: |
          母標準偏差 10 の正規母集団から大きさ 25 の標本を取ったところ、標本平均は 50 だった。「母平均は ○○ 以下である」という形の、信頼係数 95% の片側の信頼上限はいくらか。
        choices:
          - '53.92'
          - '53.29'
          - '66.45'
          - '46.71'
          - '50.66'
        answer: 1
        distractors:
          - 両側 95% の区間の上限（1.96）を使った
          - 正解
          - 標準誤差の代わりに母標準偏差 10 を使った
          - 下限を求めた
          - 母標準偏差を $n$ で割った
        explanation: |
          **方針** 片側の 95% 信頼上限は $\bar x+z_{0.05}\sigma/\sqrt n$。

          **途中式** $50+1.645\times 10/5=53.29$

          **答え** 53.29

          **間違えやすい点** 片側の区間は、5% をすべて片方に置くので 1.645 を使う。
  - id: s08p10
    title: 検定のいろいろ
    context: |
      必要なら次の値を使ってよい：$z_{0.025}=1.96$、$z_{0.01}=2.326$、$z_{0.05}=1.645$、$P(Z>1.5)=0.0668$、$F_{0.025}(9,11)=3.588$、$F_{0.025}(11,9)=3.912$、$F_{0.05}(9,11)=2.896$。
    items:
      - id: s08p10a
        chapter: 12
        terms: [null-and-alternative-hypothesis, one-sided-two-sided-test]
        topic: 新しい機械で平均が変わったかを調べる目的から両側の対立仮説を立てる
        level: 基本
        definition: false
        type: choice
        question: |
          従来の機械で作る部品の長さの平均は 50 mm である。新しい機械で平均が「変わったかどうか」（長くなっても短くなっても問題）を調べたい。新しい機械の母平均を $\mu$ とするとき、仮説の組合せとして最も適切なものはどれか。
        choices:
          - 帰無仮説 $\mu=50$、対立仮説 $\mu>50$
          - 帰無仮説 $\mu\neq 50$、対立仮説 $\mu=50$
          - 帰無仮説 $\mu=50$、対立仮説 $\mu<50$
          - 帰無仮説 $\mu>50$、対立仮説 $\mu<50$
          - 帰無仮説 $\mu=50$、対立仮説 $\mu\neq 50$
        answer: 4
        distractors:
          - 長くなる方向だけを調べている
          - 帰無仮説に等号を置く
          - 短くなる方向だけを調べている
          - どちらも等号を含まず、「変化なし」を表していない
          - 正解
        explanation: |
          **方針** どちらの向きの変化も問題なので、両側の対立仮説にする。

          **途中式** 帰無仮説は「変化なし」（$\mu=50$）、対立仮説は「変化あり」（$\mu\neq 50$）。

          **答え** 帰無仮説 $\mu=50$、対立仮説 $\mu\neq 50$

          **間違えやすい点** 両側検定では、上側 $\alpha/2$ 点と比べる。
      - id: s08p10b
        chapter: 12
        terms: [power-function, type-i-and-ii-errors]
        topic: 真の値と帰無仮説の値の差が大きいほど検出力が大きくなることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          前問の検定で、標本の大きさと有意水準を固定する。検出力（新しい機械の平均が本当に変わっているときに棄却する確率）について正しい記述はどれか。
        choices:
          - 真の平均が 50 から離れているほど、検出力は大きい
          - 真の平均によらず、検出力は 0.95 で一定である
          - 真の平均が 50 から離れているほど、検出力は小さい
          - 検出力は有意水準と等しい
          - 真の平均が 50 のとき、検出力は 1 である
        answer: 0
        distractors:
          - 正解
          - 検出力は真の値によって変わる
          - 離れているほど違いを見つけやすい
          - 有意水準は帰無仮説が正しいときに棄却する確率
          - 真の平均が 50 なら、棄却する確率は有意水準（例えば 0.05）
        explanation: |
          **方針** 検出力は、真の値が帰無仮説の値からどれだけ離れているかで決まる。

          **途中式** 差が大きいほど、検定統計量が棄却域に入りやすい。

          **答え** 真の平均が 50 から離れているほど、検出力は大きい

          **間違えやすい点** 小さな差を見つけたいときは、標本を大きくする必要がある。
      - id: s08p10c
        chapter: 12
        terms: [z-test-known-variance, p-value]
        topic: 母標準偏差既知の両側z検定で検定統計量1.5のp値を求めて判断する
        level: 標準
        definition: false
        type: choice
        question: |
          前問の検定で、母標準偏差は 8 mm とわかっている。新しい機械の部品 64 個の平均は 51.5 mm だった。両側の p 値と、有意水準 5% での判断の組合せはどれか。
        choices:
          - p 値 0.0668 で、棄却しない
          - p 値 0.1336 で、棄却する
          - p 値 0.1336 で、棄却しない
          - p 値 0.0668 で、棄却する
          - p 値 0.8664 で、棄却しない
        answer: 2
        distractors:
          - 両側検定なのに片側の確率を p 値とした（判断は同じでも p 値が誤り）
          - 0.1336 は 0.05 より大きい
          - 正解
          - 片側の確率を p 値とし、さらに判断を誤った
          - 1 から両側の p 値を引いた
        explanation: |
          **方針** $z=(\bar x-50)/(8/\sqrt{64})$、両側の p 値は $2P(Z>|z|)$。

          **途中式** $z=1.5/1=1.5$、p 値 $=2\times 0.0668=0.1336>0.05$

          **答え** p 値 0.1336 で、棄却しない

          **間違えやすい点** 「変わったとはいえない」であり、「変わっていない」と証明されたわけではない。
      - id: s08p10e
        chapter: 13
        terms: [f-test-equal-variances, f-distribution]
        topic: 大きさ10と12の2群の不偏分散の比から両側5パーセントの等分散のF検定で棄却されることを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの正規母集団から大きさ 10 と 12 の標本を抽出し、不偏分散は 45 と 12 だった。有意水準 5% の両側検定で「母分散は等しい」を検定する（大きいほうの不偏分散を分子にする）。正しいものはどれか。
        choices:
          - F ＝ 3.75 で、$F_{0.025}(11,9)=3.912$ より小さいので棄却しない
          - F ＝ 3.75 で、$F_{0.025}(9,11)=3.588$ より大きいので棄却する
          - F ＝ 3.75 で、$F_{0.025}(9,11)=3.588$ より大きいが、両側検定なので棄却しない
          - F ＝ 1.94 で、棄却しない
          - F ＝ 0.27 で、棄却しない
        answer: 1
        distractors:
          - 自由度の順番を逆にした
          - 正解
          - 両側検定でも、上側 2.5% 点を超えれば棄却する
          - 標準偏差の比をとった
          - 小さいほうを分子にした
        explanation: |
          **方針** $F=45/12$ を、自由度 $(10-1,\ 12-1)=(9,\ 11)$ の上側 2.5% 点と比べる。

          **途中式** $F=3.75>3.588$

          **答え** 棄却する

          **間違えやすい点** 自由度は分子の標本から順に (9, 11)。片側 5% の点 2.896 と比べるのも誤り。
      - id: s08p10f
        chapter: 13
        terms: [paired-t-test, sum-of-random-variables]
        topic: 同じ人の前後の値に強い正の相関があるとき差の標準偏差が小さくなることを分散の式で求める
        level: 応用
        definition: false
        type: choice
        question: |
          同じ人の前後の測定値 $X$、$Y$ の標準偏差はどちらも 10 で、前後の相関係数は 0.8 だった。差 $Y-X$ の標準偏差に最も近いものはどれか。
        choices:
          - '14.1'
          - '20.0'
          - '0'
          - '6.3'
          - '19.0'
        answer: 3
        distractors:
          - 前後を独立とした（相関を無視）
          - 標準偏差を足した
          - 相関が 1 でないので 0 にはならない
          - 正解
          - 共分散の符号を逆にした（$100+100+160$ の平方根）
        explanation: |
          **方針** $V[Y-X]=V[X]+V[Y]-2\,\mathrm{Cov}[X,Y]$、$\mathrm{Cov}=0.8\times 10\times 10=80$。

          **途中式** $100+100-160=40$、$\sqrt{40}\approx 6.3$

          **答え** 6.3

          **間違えやすい点** 前後の相関が強いほど差の散らばりは小さくなる。だから対応のある検定は、個人差の大きいデータで検出力が高い。
      - id: s08p10g
        chapter: 13
        terms: [two-sample-proportion-test, one-sided-two-sided-test]
        topic: 2つの群の比率の差の右片側検定で検定統計量2.31を有意水準5パーセントと1パーセントの点と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          新しい広告を見た 200 人のうち 60 人（30%）、従来の広告を見た 200 人のうち 40 人（20%）が商品を購入した。「新しい広告のほうが購入率が高い」を対立仮説とし、合わせた比率を使う比率の差の検定を行う。正しいものはどれか。
        choices:
          - z ≈ 2.31 で、有意水準 1% でも棄却する
          - z ≈ 2.31 で、有意水準 5% でも棄却しない
          - z ≈ 0.10 で、棄却しない
          - z ≈ 2.31 で、両側検定の点 1.96 と比べないといけないので判断できない
          - z ≈ 2.31 で、有意水準 5% では棄却するが、1% では棄却しない
        answer: 4
        distractors:
          - 2.31 は 2.326 よりわずかに小さい
          - 2.31 は 1.645 より大きい
          - 比率の差 0.10 をそのまま答えた
          - 対立仮説が片側なので、片側の点と比べる
          - 正解
        explanation: |
          **方針** 合わせた比率 $\hat p=100/400=0.25$、標準誤差 $\sqrt{0.25\times 0.75\times(1/200+1/200)}$。

          **途中式** $\sqrt{0.0009375}\approx 0.0433$、$z=0.10/0.0433\approx 2.31$。$1.645<2.31<2.326$。

          **答え** 5% では棄却し、1% では棄却しない

          **間違えやすい点** 有意水準によって結論が変わる境目の値。
  - id: s08p11
    title: 単回帰の傾きの推測
    context: |
      22 組のデータで単回帰分析を行い、傾きの推定値は 2.0、残差の標準偏差（残差平方和を自由度 20 で割った値の平方根）は 4、説明変数の偏差平方和は 100 だった。
    items:
      - id: s08p11a
        chapter: 14
        terms: [regression-output, regression-coefficient-t-test]
        topic: 回帰の出力のp値から有意水準1パーセントで有意な説明変数を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          別の重回帰分析の出力で、説明変数 A、B、C の係数の p 値は 0.004、0.030、0.270 だった。有意水準 1% で係数が 0 でないといえるものはどれか。
        choices:
          - A と B
          - A、B、C のすべて
          - A だけ
          - B と C
          - どれもない
        answer: 2
        distractors:
          - B の 0.030 は 0.01 より大きい（5% なら有意）
          - C は 5% でも有意でない
          - 正解
          - B・C は 1% で有意でない
          - A の 0.004 は 0.01 より小さい
        explanation: |
          **方針** p 値が有意水準 0.01 より小さいものを選ぶ。

          **途中式** A（0.004）だけが 0.01 未満。

          **答え** A だけ

          **間違えやすい点** 有意水準を 5% から 1% に厳しくすると、有意な変数は減る。
      - id: s08p11b
        chapter: 14
        terms: [regression-coefficient-t-test, standard-error]
        topic: 単回帰の傾きの標準誤差を残差の標準偏差と説明変数の偏差平方和から求めてt値を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          上の単回帰分析で、傾きの標準誤差と t 値の組合せはどれか。
        choices:
          - 標準誤差 0.4、t 値 5.0
          - 標準誤差 0.04、t 値 50
          - 標準誤差 4、t 値 0.5
          - 標準誤差 0.4、t 値 0.8
          - 標準誤差 0.2、t 値 10
        answer: 0
        distractors:
          - 正解
          - 偏差平方和の平方根ではなく偏差平方和で割った
          - 残差の標準偏差をそのまま標準誤差とした
          - 傾きを標準誤差で割るところを掛けた
          - $\sqrt{S_{xx}}$ の代わりに残差の自由度 20 で割った（$4/20$）
        explanation: |
          **方針** 単回帰の傾きの標準誤差は $s/\sqrt{S_{xx}}$。

          **途中式** $4/\sqrt{100}=0.4$、$t=2.0/0.4=5.0$

          **答え** 標準誤差 0.4、t 値 5.0

          **間違えやすい点** 説明変数の散らばり（$S_{xx}$）が大きいほど、傾きは精度よく推定できる。
      - id: s08p11c
        chapter: 14
        terms: [simple-regression, residual-plot]
        topic: 説明変数が他から大きく離れた1点が回帰直線の傾きを大きく動かすことを判断する
        level: 標準
        definition: false
        type: choice
        question: |
          散布図で、説明変数の値がほかのデータから大きく離れた 1 点があった。この点を除いて回帰をやり直すと、傾きが大きく変わった。最も適切な対応はどれか。
        choices:
          - 都合のよい結果が出るほうを選んで報告する
          - その点が結果に大きな影響を与えていることを報告し、入力の誤りでないか確かめたうえで、含めた場合と除いた場合の両方を示す
          - 外れた点は必ず削除しなければならない
          - 傾きが変わるのは計算の誤りなので、気にしなくてよい
          - その点を含めたまま、決定係数だけを報告すればよい
        answer: 1
        distractors:
          - 結果を選んで報告するのは不適切
          - 正解
          - 本当のデータなら、理由なく削除してはいけない
          - 離れた 1 点が傾きを大きく動かすことはよくある
          - 決定係数だけでは影響の大きい点の存在がわからない
        explanation: |
          **方針** 説明変数が他から離れた点は、回帰直線を自分の方に引き寄せる力が強い（影響の大きい点）。

          **途中式** 入力ミスか、本当に特別な事例かを確かめ、結論がその 1 点に依存していることを示す。

          **答え** 確かめたうえで、含めた場合と除いた場合の両方を示す

          **間違えやすい点** 外れ値を機械的に削除するのも、無視するのも適切ではない。
  - id: s08p12
    title: 実験の分析
    context: |
      必要なら $F_{0.05}(2,12)=3.885$ を使ってよい。
    items:
      - id: s08p12a
        chapter: 15
        terms: [two-way-anova-with-replication, main-effect-and-interaction]
        topic: 繰り返しのない二元配置では交互作用を誤差と分けて検定できないことを答える
        level: 基本
        definition: true
        type: choice
        question: |
          2 つの要因の各組合せで 1 回ずつしか測定しない（繰り返しのない）二元配置実験について正しい記述はどれか。
        choices:
          - 交互作用だけを検定でき、主効果は検定できない
          - 繰り返しがなくても、交互作用と誤差を分けて検定できる
          - 2 つの要因の主効果を検定することはできない
          - 交互作用を誤差と分けて検定することができない
          - 繰り返しがないので、平均を計算することができない
        answer: 3
        distractors:
          - 主効果は検定できる（交互作用がないと仮定して）
          - 繰り返しがないと、交互作用と誤差が区別できない
          - 主効果は検定できる
          - 正解
          - 平均は計算できる
        explanation: |
          **方針** 交互作用を検定するには、同じ組合せの中のばらつき（誤差）を知る必要がある。

          **途中式** 繰り返しがないと、交互作用の平方和が誤差の平方和の代わりになる。

          **答え** 交互作用を誤差と分けて検定できない

          **間違えやすい点** 乱塊法（ブロック × 処理）も繰り返しのない二元配置と同じ形で、交互作用はないと仮定して分析する。
      - id: s08p12b
        chapter: 15
        terms: [anova-table, sum-of-squares-decomposition, sample-variance-sd]
        topic: 3群5個ずつの各群の不偏分散から群内の平方和を求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 つの処理群（各 5 個）の不偏分散は 4、6、8 だった。一元配置分散分析の群内（誤差）の平方和はいくらか。
        choices:
          - '18'
          - '90'
          - '6'
          - '72'
          - '30'
        answer: 3
        distractors:
          - 不偏分散を足しただけ（それぞれに 4 を掛けていない）
          - 各群の大きさ 5 を掛けた（$n-1=4$ ではない）
          - 3 つの不偏分散の平均
          - 正解
          - 不偏分散の平均 6 に群の大きさ 5 を掛けた
        explanation: |
          **方針** 各群の偏差平方和 ＝ 不偏分散 ×（群の大きさ − 1）。それを足す。

          **途中式** $4\times 4+4\times 6+4\times 8=16+24+32=72$

          **答え** 72

          **間違えやすい点** 誤差の平均平方は $72/(15-3)=6$ で、群の大きさが等しいときは不偏分散の平均と一致する。
