chapter: 23
questions:
  - id: q23-linear-discriminant-analysis-1
    term: linear-discriminant-analysis
    level: 基本
    type: truefalse
    question: |
      2群がそれぞれ多変量正規分布に従うとき、2群の分散共分散行列が異なっていても、ベイズ判別ルールの判別境界は必ず超平面（2変数なら直線）になる。
    answer: false
    hint: |
      対数密度の差 $\log f_2(\boldsymbol{x})-\log f_1(\boldsymbol{x})$ に $\boldsymbol{x}$ の2次の項が残るかを考える。
    explanation: |
      対数密度の差には
      $$-\frac12\boldsymbol{x}^\top(\Sigma_2^{-1}-\Sigma_1^{-1})\boldsymbol{x}$$
      という2次の項が含まれます。$\Sigma_1=\Sigma_2$ のときだけこの項が消えて境界が超平面（線形判別）になり、異なれば2次曲面（二次判別）になります。

  - id: q23-linear-discriminant-analysis-2
    term: linear-discriminant-analysis
    level: 標準
    type: numeric
    question: |
      2群 $G_1:N_2(\boldsymbol{\mu}_1,\Sigma)$、$G_2:N_2(\boldsymbol{\mu}_2,\Sigma)$ で
      $$\boldsymbol{\mu}_1=\begin{pmatrix}0\\0\end{pmatrix},\quad \boldsymbol{\mu}_2=\begin{pmatrix}2\\1\end{pmatrix},\quad \Sigma=\begin{pmatrix}1&0.5\\0.5&1\end{pmatrix}$$
      とする。線形判別関数 $z(\boldsymbol{x})=(\boldsymbol{\mu}_2-\boldsymbol{\mu}_1)^\top\Sigma^{-1}\bigl(\boldsymbol{x}-\frac{\boldsymbol{\mu}_1+\boldsymbol{\mu}_2}{2}\bigr)$ の、$\boldsymbol{x}=(1.5,\ 0)^\top$ での値を小数第2位まで（四捨五入）求めよ。
    answer: 1.0
    tolerance: 0.005
    hint: |
      先に $(\boldsymbol{\mu}_2-\boldsymbol{\mu}_1)^\top\Sigma^{-1}$ を計算する。$2\times2$ の逆行列は $\frac{1}{ad-bc}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$。
    explanation: |
      $\Sigma^{-1}=\dfrac{1}{0.75}\begin{pmatrix}1&-0.5\\-0.5&1\end{pmatrix}$ なので
      $$(\boldsymbol{\mu}_2-\boldsymbol{\mu}_1)^\top\Sigma^{-1}=\frac{1}{0.75}(2-0.5,\ -1+1)=(2,\ 0)$$
      中点は $(1,\ 0.5)$ で、$\boldsymbol{x}-$中点 $=(0.5,\ -0.5)$。
      $$z=2\times0.5+0\times(-0.5)=1.00>0$$
      なので（事前確率が等しければ）$G_2$ に判別します。

  - id: q23-linear-discriminant-analysis-3
    term: linear-discriminant-analysis
    level: 応用
    type: choice
    question: |
      2群 $G_1,G_2$ の線形判別関数 $z(\boldsymbol{x})=(\boldsymbol{\mu}_2-\boldsymbol{\mu}_1)^\top\Sigma^{-1}\bigl(\boldsymbol{x}-\frac{\boldsymbol{\mu}_1+\boldsymbol{\mu}_2}{2}\bigr)$ の、ある点での値が $z=1$ であった。
      事前確率が $\pi_1=0.8,\ \pi_2=0.2$（誤判別の損失は等しい）のとき、判別結果として正しいものはどれか。ここで $z>\log(\pi_1/\pi_2)$ なら $G_2$ と判別する。
    choices:
      - '$G_1$（しきい値 $\log4\approx1.39$ を下回るため）'
      - '$G_2$（$z>0$ のため）'
      - '$G_2$（しきい値 $\log0.25\approx-1.39$ を上回るため）'
      - '判別できない（事前確率が等しくないと線形判別は使えないため）'
    answer: 0
    hint: |
      事前確率が偏ると、しきい値は0から $\log(\pi_1/\pi_2)$ に動く。$G_1$ が起こりやすいほど $G_2$ と判別しにくくなる。
    explanation: |
      しきい値は $\log(0.8/0.2)=\log4=1.386$ です。$z=1<1.386$ なので $G_1$ に判別します。
      $z>0$ だけで判断するのは事前確率が等しいときのルールです。$\log0.25$ は比を逆にした誤りです。事前確率が異なっても、しきい値を動かせば線形判別はそのまま使えます。

  - id: q23-fisher-linear-discriminant-function-1
    term: fisher-linear-discriminant-function
    level: 基本
    type: choice
    question: |
      2群の標本平均が $\bar{\boldsymbol{x}}_1=(3,2)^\top$、$\bar{\boldsymbol{x}}_2=(1,1)^\top$、プールした分散共分散行列が $S=\begin{pmatrix}2&0\\0&0.5\end{pmatrix}$ である。
      フィッシャーの線形判別関数の係数ベクトル $\boldsymbol{a}$ の方向（定数倍を除く）はどれか。
    choices:
      - '$(1,\ 2)^\top$'
      - '$(2,\ 1)^\top$'
      - '$(4,\ 0.5)^\top$'
      - '$(1,\ -2)^\top$'
    answer: 0
    hint: |
      $\boldsymbol{a}\propto S^{-1}(\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2)$。
    explanation: |
      $\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2=(2,1)^\top$、$S^{-1}=\mathrm{diag}(0.5,\ 2)$ より
      $$\boldsymbol{a}\propto(0.5\times2,\ 2\times1)^\top=(1,\ 2)^\top$$
      平均の差 $(2,1)$ のままでは群内のばらつきを考慮していません。$(4,0.5)$ は $S^{-1}$ の代わりに $S$ を掛けた誤りです。
      ばらつきの小さい第2変数の重みが大きくなる点が要点です。

  - id: q23-fisher-linear-discriminant-function-2
    term: fisher-linear-discriminant-function
    level: 標準
    type: numeric
    question: |
      2群の標本平均が $\bar{\boldsymbol{x}}_1=(3,2)^\top$、$\bar{\boldsymbol{x}}_2=(1,1)^\top$、プールした分散共分散行列が $S=\mathrm{diag}(2,\ 0.5)$ のとき、フィッシャーの基準
      $$\lambda(\boldsymbol{a})=\frac{\{\boldsymbol{a}^\top(\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2)\}^2}{\boldsymbol{a}^\top S\boldsymbol{a}}$$
      の最大値を求めよ。
    answer: 4
    tolerance: 0.01
    hint: |
      最大値は2群間のマハラノビス距離の2乗 $D^2=(\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2)^\top S^{-1}(\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2)$ に等しい。
    explanation: |
      $$D^2=(2,1)\begin{pmatrix}0.5&0\\0&2\end{pmatrix}\begin{pmatrix}2\\1\end{pmatrix}=2+2=4$$
      直接確かめると、$\boldsymbol{a}=(1,2)^\top$ で分子 $(2+2)^2=16$、分母 $2+0.5\times4=4$ なので $16/4=4$ です。

  - id: q23-fisher-linear-discriminant-function-3
    term: fisher-linear-discriminant-function
    level: 応用
    type: truefalse
    question: |
      フィッシャーの線形判別関数で、係数ベクトル $\boldsymbol{a}=S^{-1}(\bar{\boldsymbol{x}}_1-\bar{\boldsymbol{x}}_2)$ の代わりにその $3$ 倍を使っても、判別関数 $y(\boldsymbol{x})=\boldsymbol{a}^\top\bigl(\boldsymbol{x}-\frac{\bar{\boldsymbol{x}}_1+\bar{\boldsymbol{x}}_2}{2}\bigr)$ の符号による判別結果は変わらない。
    answer: true
    hint: |
      $\lambda(c\boldsymbol{a})$ と $\lambda(\boldsymbol{a})$ を比べ、また $y$ の符号が $c>0$ 倍で変わるかを考える。
    explanation: |
      $\lambda(c\boldsymbol{a})=\dfrac{c^2\{\cdots\}^2}{c^2\,\boldsymbol{a}^\top S\boldsymbol{a}}=\lambda(\boldsymbol{a})$ なので、係数は方向だけが決まり長さは任意です。
      $c=3>0$ 倍しても $y(\boldsymbol{x})$ は3倍になるだけで符号は同じなので、判別結果は変わりません（負の定数倍なら判別の向きが逆になります）。

  - id: q23-mahalanobis-distance-1
    term: mahalanobis-distance
    level: 基本
    type: numeric
    question: |
      1変数の分布 $N(50,\ 10^2)$ に対して、点 $x=35$ のマハラノビス距離を小数第1位まで（四捨五入）求めよ。
    answer: 1.5
    tolerance: 0.05
    hint: |
      1変数では $D=|x-\mu|/\sigma$。
    explanation: |
      $$D=\frac{|35-50|}{10}=1.5$$
      1変数のマハラノビス距離は、標準化した値（z 得点）の絶対値です。

  - id: q23-mahalanobis-distance-2
    term: mahalanobis-distance
    level: 標準
    type: numeric
    question: |
      $\boldsymbol{\mu}=(0,0)^\top$、$\Sigma=\begin{pmatrix}4&2\\2&4\end{pmatrix}$ の分布に対して、点 $\boldsymbol{x}=(2,\ -2)^\top$ のマハラノビス距離 $D$ を小数第2位まで（四捨五入）求めよ。
    answer: 2.0
    tolerance: 0.005
    hint: |
      $\Sigma^{-1}=\frac{1}{12}\begin{pmatrix}4&-2\\-2&4\end{pmatrix}$ を使い、$D^2=\boldsymbol{x}^\top\Sigma^{-1}\boldsymbol{x}$ を計算する。
    explanation: |
      $$D^2=\frac{1}{12}\{4\cdot2^2-2\cdot2\cdot2\cdot(-2)+4\cdot(-2)^2\}=\frac{16+16+16}{12}=4$$
      より $D=2.00$ です。同じユークリッド距離の点 $(2,2)$ では $D^2=16/12$、$D=1.15$ です。
      正の相関があるので、相関の向きに逆らう $(2,-2)$ のほうが「珍しい」点になります。

  - id: q23-mahalanobis-distance-3
    term: mahalanobis-distance
    level: 応用
    type: numeric
    question: |
      $\boldsymbol{X}\sim N_3(\boldsymbol{\mu},\Sigma)$ のとき、マハラノビス距離 $D(\boldsymbol{X})$ が $3$ を超える確率を小数第3位まで（四捨五入）求めよ。
      必要なら、自由度3のカイ二乗分布の上側確率 $P(\chi^2_3>x)=2\{1-\Phi(\sqrt x)\}+2\sqrt x\,\phi(\sqrt x)$ と、$1-\Phi(3)=0.00135$、$\phi(3)=0.00443$（$\phi$ は標準正規分布の密度）を用いてよい。
    answer: 0.029
    tolerance: 0.001
    hint: |
      $D^2\sim\chi^2_3$ を使い、$P(D>3)=P(D^2>9)$ とする。
    explanation: |
      $D^2\sim\chi^2_3$ なので
      $$P(D>3)=P(\chi^2_3>9)=0.0293$$
      です。1変数の「$3\sigma$ の外」の確率 $0.0027$ よりずっと大きくなります。次元が上がると、中心から遠い点が増えることに注意します。

  - id: q23-quadratic-discriminant-analysis-1
    term: quadratic-discriminant-analysis
    level: 基本
    type: numeric
    question: |
      5変数・2群の判別で二次判別分析を行う。各群の分散共分散行列（対称行列）を推定するのに必要な母数は、2群合わせていくつか。
    answer: 30
    tolerance: 0.4
    hint: |
      $p\times p$ の対称行列の自由な成分の数は $p(p+1)/2$。
    explanation: |
      1つの分散共分散行列の母数は $5\times6/2=15$ 個です。二次判別では群ごとに推定するので $2\times15=30$ 個、線形判別（共通の $\Sigma$）なら $15$ 個です。
      母数が多いぶん、標本が小さいと二次判別は推定が不安定になります。

  - id: q23-quadratic-discriminant-analysis-2
    term: quadratic-discriminant-analysis
    level: 標準
    type: numeric
    question: |
      1変数で $G_1:N(0,1)$、$G_2:N(0,4)$（分散4）、事前確率は等しい。ベイズ判別ルールで $G_2$ と判別されるのは $|x|>c$ の範囲である。$c$ を小数第3位まで（四捨五入）求めよ。
    answer: 1.36
    tolerance: 0.001
    hint: |
      二次判別関数 $g_k(x)=-\frac{(x-\mu_k)^2}{2\sigma_k^2}-\frac12\log\sigma_k^2$ を等しいとおく。
    explanation: |
      $$-\frac{x^2}{2}=-\frac{x^2}{8}-\frac12\log4\quad\Longrightarrow\quad x^2\Bigl(\frac12-\frac18\Bigr)=\log2\quad\Longrightarrow\quad x^2=\frac{8\log2}{3}=1.848$$
      より $c=1.360$ です。平均が同じでも分散が違えば判別でき、境界は2点（中央が $G_1$、両側が $G_2$）になります。線形判別ではこの形は作れません。

  - id: q23-bayes-discriminant-rule-1
    term: bayes-discriminant-rule
    level: 基本
    type: numeric
    question: |
      2群の事前確率が $\pi_1=0.3,\ \pi_2=0.7$、ある観測値 $x$ での密度が $f_1(x)=0.5,\ f_2(x)=0.1$ である。事後確率 $P(G_1\mid x)$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.682
    tolerance: 0.001
    hint: |
      $P(G_1\mid x)=\dfrac{\pi_1f_1(x)}{\pi_1f_1(x)+\pi_2f_2(x)}$。
    explanation: |
      $$P(G_1\mid x)=\frac{0.3\times0.5}{0.3\times0.5+0.7\times0.1}=\frac{0.15}{0.22}=0.682$$
      事前確率は $G_2$ が大きいものの、密度の比が5倍あるので $G_1$ に判別されます。

  - id: q23-bayes-discriminant-rule-2
    term: bayes-discriminant-rule
    level: 標準
    type: choice
    question: |
      2群の事前確率は等しく、ある観測値での密度の比が $f_2(x)/f_1(x)=0.4$ である。
      $G_2$ の個体を $G_1$ と誤る損失 $c(1\mid2)=5$、$G_1$ の個体を $G_2$ と誤る損失 $c(2\mid1)=1$ のとき、期待損失を最小にする判別はどれか。
    choices:
      - '$G_2$（尤度比 $0.4$ がしきい値 $0.2$ を超える）'
      - '$G_1$（尤度比 $0.4$ が $1$ 未満）'
      - '$G_1$（尤度比 $0.4$ がしきい値 $5$ を下回る）'
      - '$G_1$（事後確率 $P(G_1\mid x)$ が $0.5$ を超える）'
    answer: 0
    hint: |
      $f_2/f_1>\pi_1c(2\mid1)/\{\pi_2c(1\mid2)\}$ なら $G_2$。
    explanation: |
      しきい値は $\dfrac{0.5\times1}{0.5\times5}=0.2$ で、$0.4>0.2$ なので $G_2$ に判別します。
      事後確率だけを見ると $P(G_1\mid x)=1/1.4=0.714$ で $G_1$ が有利ですが、$G_2$ を見逃す損失が5倍大きいので、$G_2$ と判断するほうが期待損失が小さくなります。
      しきい値 $5$ は損失の比を逆にした誤りです。

  - id: q23-bayes-discriminant-rule-3
    term: bayes-discriminant-rule
    level: 応用
    type: numeric
    question: |
      1変数で $G_1:N(0,1)$、$G_2:N(2,1)$、事前確率 $\pi_1=0.75,\ \pi_2=0.25$ とする。
      ベイズ判別ルールで $x>c$ なら $G_2$ と判別するとき、境界 $c$ を小数第3位まで（四捨五入）求めよ。
    answer: 1.549
    tolerance: 0.001
    hint: |
      $\pi_1f_1(c)=\pi_2f_2(c)$ の対数をとって $c$ について解く。
    explanation: |
      $$\log0.75-\frac{c^2}{2}=\log0.25-\frac{(c-2)^2}{2}\quad\Longrightarrow\quad \frac{(c-2)^2-c^2}{2}=-\log3\quad\Longrightarrow\quad -2c+2=-\log3$$
      より $c=1+\frac{\log3}{2}=1.549$ です。事前確率が等しければ中点の $1$ ですが、$G_1$ が起こりやすいぶん境界が $G_2$ 側へ動きます。

  - id: q23-misclassification-rate-1
    term: misclassification-rate
    level: 基本
    type: numeric
    question: |
      共通の分散共分散行列をもつ2つの多変量正規分布の間のマハラノビス距離が $\Delta=2$ である。事前確率が等しいとき、線形判別関数（しきい値0）による誤判別率 $P(2\mid1)$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.159
    tolerance: 0.001
    hint: |
      $P(2\mid1)=\Phi(-\Delta/2)$。
    explanation: |
      $$P(2\mid1)=\Phi(-1)=0.1587$$
      判別得点は各群で分散 $\Delta^2$、平均の差 $\Delta^2$ の正規分布になり、境界は中点です。そのため標準化した距離は $\Delta/2$ になります。

  - id: q23-misclassification-rate-2
    term: misclassification-rate
    level: 標準
    type: numeric
    question: |
      2群 $N_2(\boldsymbol{\mu}_1,\Sigma)$、$N_2(\boldsymbol{\mu}_2,\Sigma)$ で
      $$\boldsymbol{\mu}_1-\boldsymbol{\mu}_2=\begin{pmatrix}1\\-1\end{pmatrix},\qquad \Sigma=\begin{pmatrix}1&0.6\\0.6&1\end{pmatrix}$$
      である。事前確率が等しいとき、線形判別による誤判別率を小数第3位まで（四捨五入）求めよ。
    answer: 0.132
    tolerance: 0.0015
    hint: |
      まず $\Delta^2=(\boldsymbol{\mu}_1-\boldsymbol{\mu}_2)^\top\Sigma^{-1}(\boldsymbol{\mu}_1-\boldsymbol{\mu}_2)$ を求める。
    explanation: |
      $\Sigma^{-1}=\dfrac{1}{0.64}\begin{pmatrix}1&-0.6\\-0.6&1\end{pmatrix}$ より
      $$\Delta^2=\frac{1+1.2+1}{0.64}=5,\qquad \Delta=\sqrt5=2.236$$
      誤判別率は $\Phi(-\sqrt5/2)=\Phi(-1.118)=0.132$ です。（数表で $\Phi(-1.12)$ を引くと $0.131$ で、これも正解とします）
      相関を無視して $\Delta^2=2$ とすると $\Phi(-0.707)=0.240$ となり、判別のしやすさを過小に見積もります。

  - id: q23-misclassification-rate-3
    term: misclassification-rate
    level: 標準
    type: truefalse
    question: |
      判別関数を作るのに使ったデータそのものを判別して数えた誤判別率（見かけの誤判別率）は、新しいデータに対する誤判別率より小さめに出る傾向がある。
    answer: true
    hint: |
      判別関数は、学習データをうまく分けるように係数を合わせている。
    explanation: |
      学習データに合わせて係数を推定しているので、同じデータで評価すると楽観的（小さめ）になります。
      特に変数が多く標本が小さいほど差が大きくなります。新しいデータでの性能を見積もるには、交差検証（1個抜き法など）や検証用データを使います。

  - id: q23-confusion-matrix-1
    term: confusion-matrix
    level: 基本
    type: numeric
    question: |
      200人の判定結果が TP $=40$、FN $=10$、FP $=20$、TN $=130$ であった。誤判別率を小数第3位まで（四捨五入）求めよ。
    answer: 0.15
    tolerance: 0.001
    hint: |
      誤判別率 $=(FP+FN)/n$。
    explanation: |
      $$\frac{20+10}{200}=0.150$$
      正解率は $(40+130)/200=0.850$ で、誤判別率と足すと1になります。

  - id: q23-confusion-matrix-2
    term: confusion-matrix
    level: 標準
    type: choice
    question: |
      3群の判別結果の混同行列（行が実際の群、列が判定した群）が次のとおりである。

      | | 判定1 | 判定2 | 判定3 |
      |---|---|---|---|
      | 実際1 | 30 | 5 | 5 |
      | 実際2 | 4 | 40 | 6 |
      | 実際3 | 1 | 9 | 50 |

      「群2と判定された個体のうち、実際に群2である割合」はどれか。
    choices:
      - '$0.741$'
      - '$0.800$'
      - '$0.267$'
      - '$0.833$'
    answer: 0
    hint: |
      「判定2」の**列**の合計を分母にする。
    explanation: |
      判定2の列の合計は $5+40+9=54$ なので $40/54=0.741$ です（群2の適合率）。
      $0.800=40/50$ は行で割った値（群2の再現率）、$0.267=40/150$ は総数で割った値、$0.833=50/60$ は群3の再現率です。全体の正解率は $120/150=0.800$ です。

  - id: q23-sensitivity-and-specificity-1
    term: sensitivity-and-specificity
    level: 基本
    type: numeric
    question: |
      ある検査で TP $=40$、FN $=10$、FP $=20$、TN $=130$ であった。特異度を小数第3位まで（四捨五入）求めよ。
    answer: 0.867
    tolerance: 0.001
    hint: |
      特異度＝実際に陰性の人のうち、陰性と判定された割合。
    explanation: |
      $$\text{特異度}=\frac{TN}{TN+FP}=\frac{130}{150}=0.867$$
      感度は $40/50=0.800$ です。分母は「実際の状態」で決まることに注意します。

  - id: q23-sensitivity-and-specificity-2
    term: sensitivity-and-specificity
    level: 標準
    type: numeric
    question: |
      感度 $0.90$、特異度 $0.95$ の検査を、有病率 $2\%$ の集団に用いる。陽性と判定された人が実際に陽性である確率（陽性的中率）を小数第3位まで（四捨五入）求めよ。
    answer: 0.269
    tolerance: 0.001
    hint: |
      ベイズの定理。$P(D\mid+)=\dfrac{P(+\mid D)P(D)}{P(+\mid D)P(D)+P(+\mid\bar D)P(\bar D)}$。
    explanation: |
      $$P(D\mid+)=\frac{0.90\times0.02}{0.90\times0.02+0.05\times0.98}=\frac{0.018}{0.067}=0.269$$
      感度・特異度が高くても、有病率が低いと陽性の大部分は偽陽性になります。

  - id: q23-sensitivity-and-specificity-3
    term: sensitivity-and-specificity
    level: 応用
    type: numeric
    question: |
      判別得点が陰性群で $N(0,1)$、陽性群で $N(2,1)$ に従い、得点が $t=1.5$ を超えたら陽性と判定する。ユーデン指数 $J=\text{感度}+\text{特異度}-1$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.625
    tolerance: 0.001
    hint: |
      感度 $=\Phi(\mu_1-t)$、特異度 $=\Phi(t-\mu_0)$（$\sigma=1$）。
    explanation: |
      感度 $=\Phi(2-1.5)=\Phi(0.5)=0.6915$、特異度 $=\Phi(1.5)=0.9332$ なので
      $$J=0.6915+0.9332-1=0.625$$
      です。等分散の正規分布なら $J$ は中点 $t=1$ で最大（$2\Phi(1)-1=0.683$）になります。

  - id: q23-roc-curve-and-auc-1
    term: roc-curve-and-auc
    level: 基本
    type: truefalse
    question: |
      AUC $=0.5$ は、陽性と陰性を完全に判別できることを表す。
    answer: false
    hint: |
      AUC $=P(S_1>S_0)$ の解釈を思い出す。
    explanation: |
      AUC $=0.5$ は、ランダムに選んだ陽性と陰性の得点の大小が五分五分、つまり当て推量と同じ判別力であることを表します。ROC曲線は対角線になります。
      完全に判別できるのは AUC $=1$ のときです。

  - id: q23-roc-curve-and-auc-2
    term: roc-curve-and-auc
    level: 標準
    type: numeric
    question: |
      陽性3人の得点が $0.9,\ 0.7,\ 0.6$、陰性4人の得点が $0.8,\ 0.6,\ 0.5,\ 0.4$ であった。
      同点を $1/2$ と数える方法で AUC を小数第3位まで（四捨五入）求めよ。
    answer: 0.792
    tolerance: 0.001
    hint: |
      陽性と陰性の組 $3\times4=12$ 組で、陽性の得点が大きい組を数える。
    explanation: |
      陽性 $0.9$ は陰性4人すべてより大きい（4組）。$0.7$ は $0.8$ 以外の3人より大きい（3組）。
      $0.6$ は $0.5,\ 0.4$ より大きく（2組）、陰性の $0.6$ と同点（$0.5$ 組）。
      $$\widehat{\text{AUC}}=\frac{4+3+2+0.5}{12}=\frac{9.5}{12}=0.792$$

  - id: q23-roc-curve-and-auc-3
    term: roc-curve-and-auc
    level: 応用
    type: numeric
    question: |
      判別得点が陰性群で $N(0,1)$、陽性群で $N(1.5,1)$ に従い、2群は独立である。AUC を小数第3位まで（四捨五入）求めよ。
    answer: 0.856
    tolerance: 0.0015
    hint: |
      AUC $=P(S_1>S_0)=P(S_1-S_0>0)$ で、$S_1-S_0$ は正規分布に従う。
    explanation: |
      $S_1-S_0\sim N(1.5,\ 2)$ なので
      $$\text{AUC}=P(S_1-S_0>0)=\Phi\!\left(\frac{1.5}{\sqrt2}\right)=\Phi(1.061)=0.856$$
      （数表で $\Phi(1.06)$ を引くと $0.855$ で、これも正解とします）
      分母の $\sqrt2$ は、2つの得点の分散が足されることから来ます。

  - id: q23-precision-recall-f-measure-1
    term: precision-recall-f-measure
    level: 標準
    type: numeric
    question: |
      ある分類器の結果が TP $=30$、FP $=10$、FN $=20$ であった。F値（$F_1$）を小数第3位まで（四捨五入）求めよ。
    answer: 0.667
    tolerance: 0.001
    hint: |
      $F_1=\dfrac{2PR}{P+R}=\dfrac{2TP}{2TP+FP+FN}$。
    explanation: |
      適合率 $P=30/40=0.75$、再現率 $R=30/50=0.6$ です。
      $$F_1=\frac{2\times0.75\times0.6}{0.75+0.6}=\frac{0.9}{1.35}=0.667$$
      $2TP/(2TP+FP+FN)=60/90$ からも同じ値になります。TN は使いません。

  - id: q23-precision-recall-f-measure-2
    term: precision-recall-f-measure
    level: 基本
    type: truefalse
    question: |
      F値（$F_1$）は適合率と再現率の算術平均である。
    answer: false
    hint: |
      $P=0.75,\ R=0.6$ で算術平均と $2PR/(P+R)$ を比べてみる。
    explanation: |
      $F_1$ は**調和平均** $2PR/(P+R)$ です。$P=0.75,\ R=0.6$ なら算術平均は $0.675$、$F_1$ は $0.667$ です。
      調和平均は小さいほうの値に引っぱられるので、どちらか一方だけが高い分類器は $F_1$ が高くなりません。

  - id: q23-k-nearest-neighbors-1
    term: k-nearest-neighbors
    level: 標準
    type: choice
    question: |
      1変数の教師データとして、群Aの点 $1,\ 2,\ 6$ と、群Bの点 $4,\ 5,\ 7,\ 8$ がある。新しい点 $x=5.8$ を $k=1$ と $k=3$ の $k$ 近傍法で判別した結果の組 $(k=1,\ k=3)$ はどれか。
    choices:
      - '$(\text{A},\ \text{B})$'
      - '$(\text{A},\ \text{A})$'
      - '$(\text{B},\ \text{B})$'
      - '$(\text{B},\ \text{A})$'
    answer: 0
    hint: |
      $x=5.8$ から各点までの距離を小さい順に並べる。
    explanation: |
      距離は $6$（A）が $0.2$、$5$（B）が $0.8$、$7$（B）が $1.2$、$4$（B）が $1.8$ … です。
      $k=1$ では最も近い $6$ の群 A、$k=3$ では A1・B2 の多数決で B になります。$k$ の選び方で結果が変わる典型例です。

  - id: q23-k-nearest-neighbors-2
    term: k-nearest-neighbors
    level: 基本
    type: truefalse
    question: |
      ユークリッド距離を使う $k$ 近傍法では、ある変数の単位を変えても（例：m を cm にしても）判別結果は変わらない。
    answer: false
    hint: |
      単位を変えると、その変数の差が距離に占める重みはどうなるか。
    explanation: |
      cm にすると差が100倍になり、その変数が距離をほぼ支配します。そのため「近い点」が入れ替わり、結果が変わりえます。
      $k$ 近傍法ではふつう変数を標準化してから距離を計算します。

  - id: q23-support-vector-machine-1
    term: support-vector-machine
    level: 基本
    type: numeric
    question: |
      ハードマージンSVMの解が $\boldsymbol{w}=(3,\ 4)^\top$ であった。両側を合わせたマージンの幅 $2/\|\boldsymbol{w}\|$ を小数第1位まで（四捨五入）求めよ。
    answer: 0.4
    tolerance: 0.05
    hint: |
      $\|\boldsymbol{w}\|=\sqrt{3^2+4^2}$。
    explanation: |
      $\|\boldsymbol{w}\|=5$ なので幅は $2/5=0.4$ です。片側（境界から最も近い点まで）は $1/\|\boldsymbol{w}\|=0.2$ です。
      $\|\boldsymbol{w}\|^2$ を小さくすることがマージンを広げることに当たります。

  - id: q23-support-vector-machine-2
    term: support-vector-machine
    level: 標準
    type: numeric
    question: |
      判別関数 $f(\boldsymbol{x})=x_1-x_2+0.5$ について、次の3点のヒンジ損失 $\max\{0,\ 1-y_if(\boldsymbol{x}_i)\}$ の合計を小数第1位まで（四捨五入）求めよ。
      $(\boldsymbol{x},y)=((1,1),+1),\ ((0,2),-1),\ ((2,0.5),-1)$
    answer: 3.5
    tolerance: 0.05
    hint: |
      各点で $y_if(\boldsymbol{x}_i)$ を計算し、1以上なら損失0。
    explanation: |
      - $(1,1)$：$f=0.5$、$yf=0.5$ → 損失 $0.5$（正しく判別されているがマージンの内側）
      - $(0,2)$：$f=-1.5$、$yf=1.5$ → 損失 $0$
      - $(2,0.5)$：$f=2.0$、$yf=-2$ → 損失 $3$（誤判別）

      合計は $3.5$ です。誤判別でなくてもマージンの内側なら損失がかかる点が、0-1損失との違いです。

  - id: q23-support-vector-machine-3
    term: support-vector-machine
    level: 応用
    type: truefalse
    question: |
      ハードマージンSVMで、サポートベクトルでない点をマージンの外側にとどまる範囲で少し動かしても、求まる判別境界は変わらない。
    answer: true
    hint: |
      $\boldsymbol{w}=\sum_i\alpha_iy_i\boldsymbol{x}_i$ で、$\alpha_i>0$ となるのはどの点か。
    explanation: |
      サポートベクトル以外の点は $\alpha_i=0$ で、$\boldsymbol{w}$ にも $b$ にも寄与しません。制約 $y_if(\boldsymbol{x}_i)\ge1$ が等号でない（余裕がある）ので、少し動かしても最適解はそのままです。
      境界は境目近くの少数の点（サポートベクトル）だけで決まります。

  - id: q23-kernel-method-1
    term: kernel-method
    level: 標準
    type: numeric
    question: |
      多項式カーネル $K(\boldsymbol{x},\boldsymbol{y})=(\boldsymbol{x}^\top\boldsymbol{y}+1)^2$ について、$\boldsymbol{x}=(1,2)^\top$、$\boldsymbol{y}=(3,1)^\top$ のときの値を求めよ。
    answer: 36
    tolerance: 0.01
    hint: |
      特徴空間の写像を書き出さなくても、元の空間の内積から直接計算できる。
    explanation: |
      $\boldsymbol{x}^\top\boldsymbol{y}=3+2=5$ なので $K=(5+1)^2=36$ です。
      これは $\phi(\boldsymbol{x})=(1,\sqrt2x_1,\sqrt2x_2,x_1^2,\sqrt2x_1x_2,x_2^2)$ という6次元の特徴どうしの内積に等しく、写像を経由せずに計算できるのがカーネル法の利点です。

  - id: q23-decision-tree-1
    term: decision-tree
    level: 標準
    type: numeric
    question: |
      クラスAが10個、クラスBが10個のノードを、左（A8個・B2個）と右（A2個・B8個）に分けた。ジニ不純度の減少量 $\Delta$ を小数第2位まで（四捨五入）求めよ。
    answer: 0.18
    tolerance: 0.005
    hint: |
      $G=1-\sum_cp_c^2$。分割後は個数の割合で重み付けた平均をとる。
    explanation: |
      分割前 $G=1-0.5^2-0.5^2=0.5$。左右ともに $1-0.8^2-0.2^2=0.32$ で、重み付き平均も $0.32$ です。
      $$\Delta=0.5-0.32=0.18$$

  - id: q23-naive-bayes-classifier-1
    term: naive-bayes-classifier
    level: 標準
    type: numeric
    question: |
      メールが迷惑メール（S）である事前確率は $0.4$、通常メール（H）は $0.6$ である。2つの単語の出現（0/1）について
      $P(x_1=1\mid S)=0.8,\ P(x_2=1\mid S)=0.6,\ P(x_1=1\mid H)=0.1,\ P(x_2=1\mid H)=0.3$ とする。
      ナイーブベイズ分類器で、両方の単語が出現したメール（$x_1=x_2=1$）が迷惑メールである事後確率を小数第3位まで（四捨五入）求めよ。
    answer: 0.914
    tolerance: 0.001
    hint: |
      クラスを与えたとき単語の出現は独立と仮定して、確率を掛け合わせる。
    explanation: |
      $$S:\ 0.4\times0.8\times0.6=0.192,\qquad H:\ 0.6\times0.1\times0.3=0.018$$
      $$P(S\mid\boldsymbol{x})=\frac{0.192}{0.192+0.018}=0.914$$

  - id: q23-fisher-linear-discriminant-function-4
    term: fisher-linear-discriminant-function
    level: 応用
    type: derivation
    question: |
      2群の標本平均の差を $\boldsymbol d=\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2$、プールした分散共分散行列を $S$（正定値）とする。
      フィッシャーの基準 $\lambda(\boldsymbol a)=\dfrac{(\boldsymbol a^\top\boldsymbol d)^2}{\boldsymbol a^\top S\boldsymbol a}$ を最大にする $\boldsymbol a$ の方向と、最大値を導け。
    steps:
      - |
        $\lambda(\boldsymbol a)$ は $\boldsymbol a$ の定数倍で変わらないので、方向だけが問題。対数をとって微分すると $\dfrac{2\boldsymbol d}{\boldsymbol a^\top\boldsymbol d}-\dfrac{2S\boldsymbol a}{\boldsymbol a^\top S\boldsymbol a}=\boldsymbol 0$。
      - |
        整理すると $S\boldsymbol a=c\,\boldsymbol d$（$c=\dfrac{\boldsymbol a^\top S\boldsymbol a}{\boldsymbol a^\top\boldsymbol d}$ はスカラー）、よって $\boldsymbol a\propto S^{-1}\boldsymbol d$。
      - |
        $\boldsymbol a=S^{-1}\boldsymbol d$ を代入：$\boldsymbol a^\top\boldsymbol d=\boldsymbol d^\top S^{-1}\boldsymbol d$、$\boldsymbol a^\top S\boldsymbol a=\boldsymbol d^\top S^{-1}SS^{-1}\boldsymbol d=\boldsymbol d^\top S^{-1}\boldsymbol d$。
      - |
        最大値 $\lambda=\dfrac{(\boldsymbol d^\top S^{-1}\boldsymbol d)^2}{\boldsymbol d^\top S^{-1}\boldsymbol d}=\boldsymbol d^\top S^{-1}\boldsymbol d$（2群の平均の間のマハラノビス距離の2乗 $D^2$）。最大であることはコーシー・シュワルツの不等式 $(\boldsymbol a^\top\boldsymbol d)^2\le(\boldsymbol a^\top S\boldsymbol a)(\boldsymbol d^\top S^{-1}\boldsymbol d)$ からわかる。
    answer: '$\boldsymbol a\propto S^{-1}(\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2)$、最大値 $D^2=(\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2)^\top S^{-1}(\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2)$'
    hint: |
      $\log\lambda(\boldsymbol a)=2\log(\boldsymbol a^\top\boldsymbol d)-\log(\boldsymbol a^\top S\boldsymbol a)$ を $\boldsymbol a$ で微分する。
    explanation: |
      停留条件 $S\boldsymbol a\propto\boldsymbol d$ から $\boldsymbol a\propto S^{-1}\boldsymbol d$ で、そのときの値は
      $$\lambda_{\max}=\boldsymbol d^\top S^{-1}\boldsymbol d=D^2$$
      です。フィッシャーの線形判別は「群間の差を群内のばらつきに比べて最も大きく見せる方向」に射影する方法で、その最大の分離度がマハラノビス距離の2乗になります。
      コーシー・シュワルツの不等式を $S^{1/2}\boldsymbol a$ と $S^{-1/2}\boldsymbol d$ に使えば、微分を使わずに最大値であることも示せます。
      よくある間違いは、$\boldsymbol a\propto\boldsymbol d$（群内の相関や分散の違いを無視）とすること、最大値を $\sqrt{\boldsymbol d^\top S^{-1}\boldsymbol d}$ とすることです。

  - id: q23-misclassification-rate-4
    term: misclassification-rate
    level: 応用
    type: derivation
    question: |
      群1が $N_p(\boldsymbol\mu_1,\Sigma)$、群2が $N_p(\boldsymbol\mu_2,\Sigma)$ で事前確率は等しい。$\boldsymbol a=\Sigma^{-1}(\boldsymbol\mu_1-\boldsymbol\mu_2)$ として、
      $Y=\boldsymbol a^\top\Big(\boldsymbol x-\dfrac{\boldsymbol\mu_1+\boldsymbol\mu_2}{2}\Big)>0$ なら群1と判別する。
      マハラノビス距離 $\Delta=\sqrt{(\boldsymbol\mu_1-\boldsymbol\mu_2)^\top\Sigma^{-1}(\boldsymbol\mu_1-\boldsymbol\mu_2)}$ を使って、誤判別率 $P(2\mid1)$ を導け。
    steps:
      - |
        $\boldsymbol x\sim N_p(\boldsymbol\mu_1,\Sigma)$ のとき、$Y$ は $\boldsymbol x$ の1次式なので正規分布に従う。
      - |
        $E[Y]=\boldsymbol a^\top\Big(\boldsymbol\mu_1-\dfrac{\boldsymbol\mu_1+\boldsymbol\mu_2}{2}\Big)=\dfrac12\boldsymbol a^\top(\boldsymbol\mu_1-\boldsymbol\mu_2)=\dfrac{\Delta^2}{2}$。
      - |
        $V[Y]=\boldsymbol a^\top\Sigma\boldsymbol a=(\boldsymbol\mu_1-\boldsymbol\mu_2)^\top\Sigma^{-1}\Sigma\Sigma^{-1}(\boldsymbol\mu_1-\boldsymbol\mu_2)=\Delta^2$。
      - |
        $P(2\mid1)=P(Y\le0)=P\Big(\dfrac{Y-\Delta^2/2}{\Delta}\le-\dfrac{\Delta}{2}\Big)=\Phi\Big(-\dfrac{\Delta}{2}\Big)$。対称性から $P(1\mid2)$ も同じ。
    answer: '$P(2\mid1)=P(1\mid2)=\Phi\Big(-\dfrac{\Delta}{2}\Big)$'
    hint: |
      判別得点 $Y$ は群1のもとで正規分布に従う。その平均と分散をどちらも $\Delta^2$ で表す。
    explanation: |
      群1のもとで判別得点は $Y\sim N(\Delta^2/2,\ \Delta^2)$ なので
      $$P(2\mid1)=P(Y\le0)=\Phi\Big(-\frac{\Delta}{2}\Big)$$
      です。誤判別率は次元 $p$ や $\Sigma$ の形によらず、マハラノビス距離 $\Delta$ だけで決まり、$\Delta$ が大きいほど小さくなります。
      実際には $\boldsymbol\mu_i,\Sigma$ を標本から推定するので、この値は母数を知っているときの理論値です。
      よくある間違いは、$V[Y]$ を1とみなして $\Phi(-\Delta^2/2)$ とすること、また $\Phi(-\Delta)$ としきい値の位置（中点）を忘れることです。
