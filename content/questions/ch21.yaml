chapter: 21
questions:
  - id: q21-simple-random-sampling-1
    term: simple-random-sampling
    level: 基本
    type: choice
    question: |
      大きさ $N=500$ の母集団（母分散 $S^2=\frac{1}{N-1}\sum(Y_i-\bar Y)^2=36$）から $n=50$ を非復元の単純無作為抽出で選ぶ。
      標本平均の標準誤差 $\sqrt{V(\bar y)}$ に最も近い値はどれか。
    choices:
      - '$0.805$'
      - '$0.849$'
      - '$0.764$'
      - '$0.648$'
    answer: 0
    hint: |
      $V(\bar y)=(1-f)S^2/n$、$f=n/N$。標準誤差はその平方根。
    explanation: |
      $f=50/500=0.1$ なので
      $$V(\bar y)=0.9\times\frac{36}{50}=0.648,\qquad\sqrt{0.648}=0.805$$
      です。$0.849=\sqrt{36/50}$ は有限母集団修正を忘れた値、$0.764=0.9\times0.849$ は修正項 $1-f$ を平方根の外で掛けた誤り、$0.648$ は分散のままで平方根をとり忘れた値です。
  - id: q21-simple-random-sampling-2
    term: simple-random-sampling
    level: 応用
    type: numeric
    question: |
      大きさ $N=2000$ の母集団（$S^2=25$）から非復元の単純無作為抽出を行い、標本平均の標準誤差を $0.5$ 以下にしたい。
      必要な最小の標本サイズ $n$ を求めよ。
    answer: 96
    tolerance: 0.1
    hint: |
      $\left(1-\dfrac nN\right)\dfrac{S^2}{n}\le0.25$ を $n$ について解く。修正なしの $n_0=S^2/0.25$ を求め、$n=n_0/(1+n_0/N)$ としてもよい。
    explanation: |
      $\dfrac{25}{n}-\dfrac{25}{2000}\le0.25$ より $\dfrac{25}{n}\le0.2625$、$n\ge95.24$ なので $n=96$ です。
      有限母集団修正なしなら $n_0=25/0.25=100$ で、$n_0/(1+n_0/N)=100/1.05=95.24$ と同じ結果になります。切り上げを忘れて95とすると条件を満たしません。

  - id: q21-simple-random-sampling-3
    term: simple-random-sampling
    level: 標準
    type: truefalse
    question: |
      非復元の単純無作為抽出では、標本分散 $s^2=\frac{1}{n-1}\sum_{i\in s}(y_i-\bar y)^2$ の期待値は、$N-1$ で割った母分散 $S^2$ に等しい。
    answer: true
    hint: |
      小さな母集団（例：$Y=1,2,4,7$ から $n=2$）で、すべての標本について $s^2$ を計算して平均してみる。
    explanation: |
      非復元の単純無作為抽出では $E[s^2]=S^2$（$S^2$ は $N-1$ で割る）が成り立ちます。
      そのため $V(\bar y)=(1-f)S^2/n$ の不偏推定量は $(1-f)s^2/n$ です。$N$ で割る $\sigma^2$ に対しては不偏ではありません。

  - id: q21-horvitz-thompson-estimator-1
    term: horvitz-thompson-estimator
    level: 基本
    type: numeric
    question: |
      ある抽出デザインで3つの単位が標本に入り、値と包含確率は $(y,\pi)=(12,\ 0.2),\ (30,\ 0.5),\ (8,\ 0.1)$ であった。
      母集団総計のホルビッツ・トンプソン推定値を求めよ。
    answer: 200
    tolerance: 0.05
    hint: |
      $\hat Y_{HT}=\sum_{i\in s}y_i/\pi_i$。
    explanation: |
      $$\hat Y_{HT}=\frac{12}{0.2}+\frac{30}{0.5}+\frac{8}{0.1}=60+60+80=200$$
      です。包含確率の小さい単位ほど、母集団の多くの単位を代表するので大きな重みがかかります。

  - id: q21-horvitz-thompson-estimator-2
    term: horvitz-thompson-estimator
    level: 応用
    type: numeric
    question: |
      $N=3$ の母集団 $y=(2,\ 4,\ 9)$ から大きさ2の標本を、$P(\{1,2\})=0.5$、$P(\{1,3\})=0.3$、$P(\{2,3\})=0.2$ の確率で選ぶ。
      総計のホルビッツ・トンプソン推定量の分散を小数第2位まで（四捨五入）求めよ。
    answer: 47.29
    tolerance: 0.01
    hint: |
      まず包含確率 $\pi_i$ を求め、3通りの標本それぞれで $\hat Y_{HT}$ を計算し、その分散を直接求める。
    explanation: |
      $\pi_1=0.8$、$\pi_2=0.7$、$\pi_3=0.5$（和は $n=2$）です。各標本の推定値は
      $$\{1,2\}:\ 2.5+5.714=8.214,\quad \{1,3\}:\ 2.5+18=20.5,\quad \{2,3\}:\ 5.714+18=23.714$$
      で、期待値は $0.5\times8.214+0.3\times20.5+0.2\times23.714=15=Y$（不偏）。分散は
      $$0.5(8.214-15)^2+0.3(20.5-15)^2+0.2(23.714-15)^2=23.02+9.08+15.19=47.29$$
      です。

  - id: q21-horvitz-thompson-estimator-3
    term: horvitz-thompson-estimator
    level: 標準
    type: truefalse
    question: |
      標本サイズ $n$ が固定のデザインで、包含確率が $y_i$ に比例する（$\pi_i=ny_i/Y$）とき、ホルビッツ・トンプソン推定量の分散は0になる。
    answer: true
    hint: |
      このとき各単位の $y_i/\pi_i$ はいくらになるか。
    explanation: |
      $y_i/\pi_i=Y/n$ がすべての単位で同じなので、どの標本でも $\hat Y_{HT}=n\cdot Y/n=Y$ となり、分散は0です。
      現実には $y$ は未知なので、$y$ とほぼ比例する補助変数 $x$ に比例した包含確率（確率比例抽出）を使い、分散を小さくします。

  - id: q21-inclusion-probability-1
    term: inclusion-probability
    level: 基本
    type: numeric
    question: |
      50の集落から10集落を単純無作為抽出し、選ばれた集落（どれも40人）の中からさらに8人を単純無作為抽出する二段抽出を行う。
      ある個人が標本に入る包含確率を小数第2位まで（四捨五入）求めよ。
    answer: 0.04
    tolerance: 0.001
    hint: |
      「その人の集落が選ばれる確率」と「集落の中でその人が選ばれる確率」の積。
    explanation: |
      $$\pi=\frac{10}{50}\times\frac{8}{40}=0.2\times0.2=0.04$$
      です。設計ウェイトは $1/0.04=25$ で、標本の1人が母集団の25人分を代表します。

  - id: q21-inclusion-probability-2
    term: inclusion-probability
    level: 標準
    type: numeric
    question: |
      $N=10$ の母集団から $n=4$ を非復元の単純無作為抽出で選ぶ。特定の2単位 $i,j$ がともに標本に入る2次の包含確率 $\pi_{ij}$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.133
    tolerance: 0.001
    hint: |
      $\pi_{ij}=\dfrac{n(n-1)}{N(N-1)}$。$i$ と $j$ を含む標本の数を数えてもよい。
    explanation: |
      $$\pi_{ij}=\frac{4\times3}{10\times9}=\frac{12}{90}=0.133$$
      です。$\binom{8}{2}/\binom{10}{4}=28/210$ と数えても同じです。
      $\pi_i\pi_j=0.16$ より小さく、非復元抽出では2単位が同時に入りにくいことを表します。

  - id: q21-stratified-sampling-1
    term: stratified-sampling
    level: 基本
    type: numeric
    question: |
      母集団を2層に分け、層1（$N_1=600$）から30人、層2（$N_2=400$）から20人を単純無作為抽出した。
      層ごとの標本平均が $\bar y_1=50$、$\bar y_2=80$ のとき、層化推定量 $\bar y_{st}$ を求めよ。
    answer: 62
    tolerance: 0.05
    hint: |
      $\bar y_{st}=\sum W_h\bar y_h$、$W_h=N_h/N$。
    explanation: |
      $W_1=0.6$、$W_2=0.4$ なので
      $$\bar y_{st}=0.6\times50+0.4\times80=62$$
      です。この例は比例配分なので、全50人の単純平均 $(30\times50+20\times80)/50=62$ とも一致します。

  - id: q21-stratified-sampling-2
    term: stratified-sampling
    level: 標準
    type: numeric
    question: |
      2層の層化抽出で、層1は $N_1=600$、$S_1=10$、$n_1=30$、層2は $N_2=400$、$S_2=20$、$n_2=20$ である。
      層化推定量の分散 $V(\bar y_{st})$ を小数第2位まで（四捨五入）求めよ。
    answer: 4.18
    tolerance: 0.005
    hint: |
      $V(\bar y_{st})=\sum W_h^2(1-n_h/N_h)S_h^2/n_h$。
    explanation: |
      抽出率はどちらも $0.05$ なので
      $$V=0.6^2\times0.95\times\frac{100}{30}+0.4^2\times0.95\times\frac{400}{20}=1.14+3.04=4.18$$
      です。ばらつきの大きい層2が分散の大半を占めています。

  - id: q21-proportional-allocation-1
    term: proportional-allocation
    level: 基本
    type: numeric
    question: |
      3つの層の大きさが $N_1=2000$、$N_2=5000$、$N_3=3000$ の母集団から、全体で $n=200$ を比例配分で層化抽出する。層3の標本サイズを求めよ。
    answer: 60
    tolerance: 0.1
    hint: |
      $n_h=n\,N_h/N$。
    explanation: |
      $$n_3=200\times\frac{3000}{10000}=60$$
      です（$n_1=40$、$n_2=100$）。どの層も抽出率は $200/10000=2\%$ にそろいます。

  - id: q21-proportional-allocation-2
    term: proportional-allocation
    level: 標準
    type: truefalse
    question: |
      比例配分の層化抽出では、層化推定量 $\bar y_{st}=\sum_hW_h\bar y_h$ は全標本の単純平均 $\bar y$ に一致する。
    answer: true
    hint: |
      比例配分では $W_h=n_h/n$ となる。
    explanation: |
      $n_h=nW_h$ より $W_h=n_h/n$ なので
      $$\bar y_{st}=\sum_h\frac{n_h}{n}\bar y_h=\frac1n\sum_h\sum_{i\in s_h}y_{hi}=\bar y$$
      です（自己加重標本）。ただし分散は単純無作為抽出の公式ではなく $\frac{1-f}{n}\sum W_hS_h^2$ で、層間の差の分だけ小さくなります。

  - id: q21-neyman-allocation-1
    term: neyman-allocation
    level: 標準
    type: choice
    question: |
      2層の母集団で、層1は $N_1=600$、$S_1=10$、層2は $N_2=400$、$S_2=20$ である。全体で $n=50$ をネイマン配分するときの層2の標本サイズ（整数に丸める前の値）はどれか。
    choices:
      - '$28.6$'
      - '$20.0$'
      - '$33.3$'
      - '$36.4$'
    answer: 0
    hint: |
      $n_h=n\,N_hS_h/\sum_kN_kS_k$。
    explanation: |
      $N_1S_1=6000$、$N_2S_2=8000$ なので
      $$n_2=50\times\frac{8000}{14000}=28.57$$
      です。$20.0$ は比例配分（$N_h$ に比例）、$33.3$ は $S_h$ だけに比例させた値、$36.4$ は $N_hS_h^2$ に比例させた（分散で配った）誤りです。
      ネイマン配分は比例配分よりも、ばらつきの大きい層2に多く配ります。
  - id: q21-neyman-allocation-2
    term: neyman-allocation
    level: 応用
    type: numeric
    question: |
      2層の母集団（$N=1000$、$W_1=0.6$、$S_1=10$、$W_2=0.4$、$S_2=20$、$n=50$）で、ネイマン配分のときの層化推定量の分散
      $V_{\text{opt}}=\frac1n\left(\sum W_hS_h\right)^2-\frac1N\sum W_hS_h^2$ を小数第2位まで（四捨五入）求めよ。
    answer: 3.7
    tolerance: 0.005
    hint: |
      $\sum W_hS_h=6+8$、$\sum W_hS_h^2=60+160$。
    explanation: |
      $$V_{\text{opt}}=\frac{14^2}{50}-\frac{220}{1000}=3.92-0.22=3.70$$
      です。比例配分のときの $4.18$ より小さく、同じ標本サイズで分散を約11%減らせます。

  - id: q21-neyman-allocation-3
    term: neyman-allocation
    level: 標準
    type: numeric
    question: |
      2層の母集団で $N_1S_1=6000$、$N_2S_2=8000$ である。1人あたりの調査費用が層1で $c_1=4$、層2で $c_2=16$ のとき、
      総費用一定のもとで分散を最小にする配分で全体 $n=50$ を配る。層1の標本サイズを求めよ。
    answer: 30
    tolerance: 0.05
    hint: |
      費用を考えた最適配分は $n_h\propto N_hS_h/\sqrt{c_h}$。
    explanation: |
      $$\frac{N_1S_1}{\sqrt{c_1}}=\frac{6000}{2}=3000,\qquad \frac{N_2S_2}{\sqrt{c_2}}=\frac{8000}{4}=2000$$
      の比 $3:2$ で配るので $n_1=50\times0.6=30$ です。費用の高い層2は、ばらつきが大きくても減らします。
      $\sqrt{\ }$ を付け忘れて $c_h$ で割ると $1500:500$ となり、$n_1=37.5$ になってしまいます。

  - id: q21-cluster-sampling-1
    term: cluster-sampling
    level: 標準
    type: numeric
    question: |
      大きさの等しい $A=100$ の集落から $a=10$ 集落を単純無作為抽出し、選んだ集落は全員を調べる。
      集落平均の分散が $S_b^2=\frac{1}{A-1}\sum(\bar Y_i-\bar Y)^2=4.5$ のとき、$\bar y_{cl}$ の分散を小数第3位まで（四捨五入）求めよ。
    answer: 0.405
    tolerance: 0.001
    hint: |
      集落を1つの単位とみた単純無作為抽出として、$V=(1-a/A)S_b^2/a$。
    explanation: |
      $$V(\bar y_{cl})=\left(1-\frac{10}{100}\right)\frac{4.5}{10}=0.9\times0.45=0.405$$
      です。集落内の人数がいくら多くても、精度を決めるのは選んだ集落の数 $a$ と集落平均のばらつき $S_b^2$ です。

  - id: q21-cluster-sampling-2
    term: cluster-sampling
    level: 基本
    type: truefalse
    question: |
      集落の中の人どうしが似ている（級内相関係数 $\rho$ が正で大きい）ほど、同じ人数を調べる集落抽出の精度は高くなる。
    answer: false
    hint: |
      $V(\bar y_{cl})$ は単純無作為抽出の分散のおよそ $1+(M-1)\rho$ 倍。
    explanation: |
      集落の中が似ていると、同じ集落から何人調べても新しい情報が少なく、分散はおよそ $1+(M-1)\rho$ 倍に増えます。
      集落抽出の精度が高いのは、集落の中が母集団全体のように不均質（$\rho$ が小さいか負）なときです。層化抽出（層の中が均質なほど良い）とは逆なので注意します。

  - id: q21-two-stage-sampling-1
    term: two-stage-sampling
    level: 標準
    type: numeric
    question: |
      大きさ $M=50$ の集落が $A=80$ 個ある。第1段で $a=10$ 集落、第2段で各集落から $m=10$ 人を単純無作為抽出する。
      $S_b^2=6$、$\bar S_w^2=40$ のとき、推定量 $\bar{\bar y}$ の分散を小数第3位まで（四捨五入）求めよ。
    answer: 0.845
    tolerance: 0.001
    hint: |
      $V=\left(1-\frac aA\right)\frac{S_b^2}{a}+\left(1-\frac mM\right)\frac{\bar S_w^2}{am}$。
    explanation: |
      $$V=\left(1-\frac{10}{80}\right)\frac{6}{10}+\left(1-\frac{10}{50}\right)\frac{40}{100}=0.525+0.320=0.845$$
      です。第1項（集落間）と第2項（集落内）を比べると、集落の数 $a$ を増やすほうが分散の削減に効く場面が多くあります。

  - id: q21-two-stage-sampling-2
    term: two-stage-sampling
    level: 基本
    type: choice
    question: |
      二段抽出で、第1段ですべての集落を選ぶ（$a=A$）とき、この抽出法は何と同じになるか。
    choices:
      - '集落を層とする層化抽出'
      - '集落抽出'
      - '系統抽出'
      - '全数調査'
    answer: 0
    hint: |
      分散の式の第1項 $(1-a/A)S_b^2/a$ はどうなるか。各集落の中で何が行われるか。
    explanation: |
      $a=A$ なら第1項が0になり、すべての集落の中で独立に単純無作為抽出することになるので、集落を層とした層化抽出（比例配分）です。
      逆に第2段で全員を調べる（$m=M$）と、第2項が0になって集落抽出になります。

  - id: q21-systematic-sampling-1
    term: systematic-sampling
    level: 基本
    type: numeric
    question: |
      1200人の名簿から40人を系統抽出する。開始点として $1$〜$k$ から乱数で $7$ が選ばれた。5番目に選ばれる人の名簿番号を求めよ。
    answer: 127
    tolerance: 0.1
    hint: |
      抽出間隔 $k=N/n$ を求め、$r,\ r+k,\ r+2k,\dots$ と進む。
    explanation: |
      $k=1200/40=30$ なので、選ばれるのは $7,37,67,97,127,\dots$ で、5番目は
      $$7+4\times30=127$$
      です。$7+5\times30=157$ は6番目です。

  - id: q21-systematic-sampling-2
    term: systematic-sampling
    level: 標準
    type: truefalse
    question: |
      名簿の並びに、抽出間隔 $k$ と同じ周期の変動があるとき、系統抽出の標本平均は単純無作為抽出よりも大きくばらつくことがある。
    answer: true
    hint: |
      周期が $k$ なら、どの開始点を選んでも標本は周期のどの位置の単位ばかりになるか。
    explanation: |
      周期が $k$ に一致すると、選ばれる単位がすべて周期の同じ位置になり（例：毎週月曜日だけ）、標本平均はその位置の値に偏ります。
      開始点によって標本平均が大きく変わるので、分散 $\frac1k\sum(\bar y_r-\bar Y)^2$ は単純無作為抽出より大きくなります。
      逆に、名簿が値の大きさ順に並んでいるときは、層化抽出に近い効果で精度が上がります。

  - id: q21-ratio-estimation-1
    term: ratio-estimation
    level: 基本
    type: numeric
    question: |
      ある地域の農家について、昨年の作付面積の母平均 $\bar X=50$ が分かっている。単純無作為抽出の標本で、今年の収穫量の平均が $\bar y=36$、昨年の作付面積の平均が $\bar x=45$ であった。
      収穫量の母平均の比推定値を求めよ。
    answer: 40
    tolerance: 0.05
    hint: |
      $\bar y_R=\dfrac{\bar y}{\bar x}\bar X$。
    explanation: |
      $$\bar y_R=\frac{36}{45}\times50=0.8\times50=40$$
      です。標本の作付面積がたまたま母平均より小さかった（$45<50$）分を、比例関係を使って上方修正しています。

  - id: q21-ratio-estimation-2
    term: ratio-estimation
    level: 応用
    type: numeric
    question: |
      抽出率 $f=0.1$、$n=40$ の単純無作為抽出で比推定を行う。母集団で $S_y^2=100$、$S_x^2=64$、$S_{xy}=72$、$R=\bar Y/\bar X=1.2$ である。
      比推定量の近似分散 $\frac{1-f}{n}(S_y^2-2RS_{xy}+R^2S_x^2)$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.436
    tolerance: 0.001
    hint: |
      かっこの中を先に計算する。
    explanation: |
      $$S_y^2-2RS_{xy}+R^2S_x^2=100-172.8+92.16=19.36$$
      なので $V(\bar y_R)\approx\dfrac{0.9}{40}\times19.36=0.436$ です。
      標本平均 $\bar y$ の分散 $\dfrac{0.9}{40}\times100=2.25$ の約5分の1で、$x$ と $y$ の相関（$72/(10\times8)=0.9$）が強いほど比推定は有利になります。

  - id: q21-ratio-estimation-3
    term: ratio-estimation
    level: 基本
    type: truefalse
    question: |
      単純無作為抽出のもとで、比推定量 $\bar y_R=(\bar y/\bar x)\bar X$ は母平均 $\bar Y$ の不偏推定量である。
    answer: false
    hint: |
      $E[\bar y/\bar x]$ は $E[\bar y]/E[\bar x]$ に等しいか。
    explanation: |
      比 $\bar y/\bar x$ は確率変数の比で、一般に $E[\bar y/\bar x]\ne E[\bar y]/E[\bar x]$ なので、比推定量はわずかに偏ります。
      偏りはおよそ $\frac{1-f}{n}\cdot\frac{1}{\bar X}(RS_x^2-S_{xy})$ で $1/n$ のオーダーなので、標本が大きければ実用上は無視できます。

  - id: q21-regression-estimation-1
    term: regression-estimation
    level: 標準
    type: choice
    question: |
      補助変数 $x$ の母平均が $\bar X=50$ と分かっている。単純無作為抽出の標本で $\bar y=36$、$\bar x=45$、標本の回帰係数 $b=0.6$ であった。
      回帰推定値 $\bar y_{lr}$ はどれか。
    choices:
      - '$39$'
      - '$40$'
      - '$33$'
      - '$41$'
    answer: 0
    hint: |
      $\bar y_{lr}=\bar y+b(\bar X-\bar x)$。
    explanation: |
      $$\bar y_{lr}=36+0.6\times(50-45)=39$$
      です。$40$ は比推定 $(\bar y/\bar x)\bar X$ の値、$33$ は $\bar x-\bar X$ と符号を逆にした誤り、$41$ は傾きを1として差だけを足した値です。
      比推定は「原点を通る直線（傾き $\bar y/\bar x=0.8$）」で補正するのに対し、回帰推定は推定した傾き $0.6$ で補正します。回帰直線が原点から離れているときは回帰推定のほうが精度が高くなります。
  - id: q21-design-effect-1
    term: design-effect
    level: 標準
    type: choice
    question: |
      30集落から各20人、合計600人を調べる調査で、級内相関係数が $\rho=0.05$ であった。
      計画効果を $\mathrm{deff}\approx1+(\bar M-1)\rho$ で近似するとき、有効標本サイズに最も近いものはどれか。
    choices:
      - '$308$ 人'
      - '$300$ 人'
      - '$1170$ 人'
      - '$30$ 人'
    answer: 0
    hint: |
      $n_{\text{eff}}=n/\mathrm{deff}$。
    explanation: |
      $\mathrm{deff}=1+19\times0.05=1.95$ なので
      $$n_{\text{eff}}=\frac{600}{1.95}=307.7$$
      です。$300$ は $\bar M-1$ を $\bar M$ とした誤り、$1170$ は deff で割らずに掛けた誤り、$30$ は集落の数です。
      小さな級内相関でも集落が大きいと、600人の調査が単純無作為抽出の約308人分の精度しかもたなくなります。
  - id: q21-design-effect-2
    term: design-effect
    level: 応用
    type: numeric
    question: |
      $n=100$ の標本で、半数の50人のウェイトが1、残り50人のウェイトが3であった。
      重み付けによる計画効果のキッシュの近似 $\mathrm{deff}=n\sum w_i^2/(\sum w_i)^2$ を小数第2位まで（四捨五入）求めよ。
    answer: 1.25
    tolerance: 0.005
    hint: |
      $\sum w_i$ と $\sum w_i^2$ を別々に求める。
    explanation: |
      $\sum w_i=50+150=200$、$\sum w_i^2=50+450=500$ なので
      $$\mathrm{deff}=\frac{100\times500}{200^2}=1.25$$
      です。ウェイトの変動係数は $\mathrm{CV}_w=0.5$ で、$1+\mathrm{CV}_w^2=1.25$ とも一致します。ウェイトのばらつきだけで有効標本サイズは80人に減ります。

  - id: q21-sampling-and-nonsampling-error-1
    term: sampling-and-nonsampling-error
    level: 基本
    type: truefalse
    question: |
      全数調査では標本誤差が0になるので、非標本誤差も生じない。
    answer: false
    hint: |
      非標本誤差の例（名簿の漏れ、無回答、回答の誤り、集計ミス）は、全員を調べれば消えるか。
    explanation: |
      全数調査で0になるのは、一部だけを選んだことによる標本誤差だけです。
      カバレッジ誤差・無回答誤差・測定誤差・処理誤差などの非標本誤差は全数調査でも起こり、むしろ規模が大きい分だけ管理が難しくなることもあります。

  - id: q21-sampling-and-nonsampling-error-2
    term: sampling-and-nonsampling-error
    level: 標準
    type: numeric
    question: |
      ある調査の推定量は、非標本誤差による偏りが $1.5$、標本誤差（標準誤差）が $2$ であった。偏りはそのままで標本サイズだけを4倍にすると、
      平均二乗誤差の平方根 $\sqrt{\mathrm{MSE}}$ はいくらになるか。小数第2位まで（四捨五入）求めよ（有限母集団修正は無視する）。
    answer: 1.8
    tolerance: 0.005
    hint: |
      $\mathrm{MSE}=V+\mathrm{Bias}^2$。標準誤差は $1/\sqrt n$ に比例する。
    explanation: |
      もとは $\sqrt{4+2.25}=2.50$ です。標本を4倍にすると標準誤差は $1$ になり
      $$\sqrt{\mathrm{MSE}}=\sqrt{1+2.25}=1.80$$
      です。標準誤差は半分になっても、偏りが残るので全体の誤差は $2.50\to1.80$ にしか減りません。

  - id: q21-probability-proportional-to-size-sampling-1
    term: probability-proportional-to-size-sampling
    level: 標準
    type: numeric
    question: |
      大きさに比例した確率で復元抽出を2回行い、選ばれた単位の値と選ばれる確率が $(y,p)=(30,\ 0.1)$、$(50,\ 0.2)$ であった。
      総計のハンセン・ハーヴィッツ推定値を求めよ。
    answer: 275
    tolerance: 0.05
    hint: |
      $\hat Y_{HH}=\frac1n\sum y_{(k)}/p_{(k)}$。
    explanation: |
      $$\hat Y_{HH}=\frac12\left(\frac{30}{0.1}+\frac{50}{0.2}\right)=\frac{300+250}{2}=275$$
      です。各回の $y/p$ がそれぞれ総計の不偏推定値で、その平均をとっています。$y/p$ がほぼ一定（$y$ が大きさに比例）なら分散は小さくなります。

  - id: q21-nonresponse-bias-1
    term: nonresponse-bias
    level: 標準
    type: truefalse
    question: |
      ある母集団の40%は調査に答えない層である。回答する層の平均は60、回答しない層の平均は45である。
      回答者の平均で母平均を推定すると、偏りは $60-45=15$（15だけ過大）になる。
    answer: false
    hint: |
      $\mathrm{Bias}=W_{nr}(\bar Y_r-\bar Y_{nr})$。母平均 $\bar Y$ は2つの層の加重平均。
    explanation: |
      母平均は $0.6\times60+0.4\times45=54$ なので、偏りは
      $$\mathrm{Bias}=60-54=0.4\times(60-45)=6$$
      です。$15$ は回答者と無回答者の平均の差そのもので、無回答の割合 $W_{nr}=0.4$ を掛け忘れています。
  - id: q21-nonresponse-bias-2
    term: nonresponse-bias
    level: 基本
    type: truefalse
    question: |
      無回答バイアスは、標本サイズを大きくすれば小さくできる。
    answer: false
    hint: |
      偏り $W_{nr}(\bar Y_r-\bar Y_{nr})$ に標本サイズ $n$ は含まれるか。
    explanation: |
      偏りは無回答の割合 $W_{nr}$ と、回答者・無回答者の差 $\bar Y_r-\bar Y_{nr}$ だけで決まり、$n$ を増やしても変わりません。
      減らすには、督促などで回答率を上げる、無回答調整のウェイトや補完を使う、といった別の対策が必要です。

  - id: q21-sampling-weight-1
    term: sampling-weight
    level: 標準
    type: numeric
    question: |
      層化抽出で、ある層（$N_h=5000$）から $n_h=50$ 人を選んだが、回答したのは40人（回答率80%）であった。
      回答率の逆数による無回答調整を行った後の、この層の回答者1人あたりのウェイトを求めよ。
    answer: 125
    tolerance: 0.05
    hint: |
      設計ウェイト $N_h/n_h$ に、回答率の逆数を掛ける。
    explanation: |
      設計ウェイトは $5000/50=100$、回答率の逆数は $1/0.8=1.25$ なので
      $$100\times1.25=125$$
      です。回答者40人のウェイトの合計が $40\times125=5000=N_h$ となり、層の大きさに一致します。

  - id: q21-simple-random-sampling-4
    term: simple-random-sampling
    level: 応用
    type: derivation
    question: |
      大きさ $N$ の有限母集団の値 $Y_1,\dots,Y_N$（平均 $\bar Y$、$S^2=\frac{1}{N-1}\sum(Y_i-\bar Y)^2$）から、大きさ $n$ の標本を非復元の単純無作為抽出で選ぶ。
      個体 $i$ が標本に入れば1となる指示変数 $Z_i$ を使って、標本平均 $\bar y=\frac1n\sum_iZ_iY_i$ の期待値と分散を導け。
    steps:
      - |
        $P(Z_i=1)=\dfrac nN=f$、$i\ne j$ で $P(Z_i=Z_j=1)=\dfrac{n(n-1)}{N(N-1)}$。よって $E[\bar y]=\frac1n\sum f\,Y_i=\bar Y$。
      - |
        $V[Z_i]=f(1-f)$、$\mathrm{Cov}[Z_i,Z_j]=\dfrac{n(n-1)}{N(N-1)}-f^2=-\dfrac{f(1-f)}{N-1}$。
      - |
        $V\big[\sum Z_iY_i\big]=f(1-f)\Big\{\sum_iY_i^2-\dfrac{1}{N-1}\sum_{i\ne j}Y_iY_j\Big\}$。$\sum_{i\ne j}Y_iY_j=(\sum Y_i)^2-\sum Y_i^2$ を使う。
      - |
        中括弧 $=\dfrac{N}{N-1}\Big\{\sum Y_i^2-\dfrac{(\sum Y_i)^2}{N}\Big\}=\dfrac{N}{N-1}\sum(Y_i-\bar Y)^2=NS^2$。
      - |
        $V[\bar y]=\dfrac{1}{n^2}f(1-f)NS^2=\Big(1-\dfrac nN\Big)\dfrac{S^2}{n}$。
    answer: '$E[\bar y]=\bar Y$、$V[\bar y]=\Big(1-\dfrac nN\Big)\dfrac{S^2}{n}$'
    hint: |
      $Z_i$ どうしは独立でない。共分散 $\mathrm{Cov}[Z_i,Z_j]$ を求め、$\sum_{i\ne j}Y_iY_j$ を $(\sum Y_i)^2-\sum Y_i^2$ で書きかえる。
    explanation: |
      非復元抽出では $Z_i$ の間に負の共分散 $-f(1-f)/(N-1)$ があり、これを入れて計算すると
      $$V[\bar y]=\Big(1-\frac nN\Big)\frac{S^2}{n}$$
      となります。$1-n/N$ が有限母集団修正で、全数調査（$n=N$）なら分散0、$N$ が十分大きければ復元抽出の $S^2/n$ に近づきます。
      母分散を $N-1$ で割った $S^2$ で定義すると式がこの形にきれいにまとまる点が要点です（$N$ で割った $\sigma^2$ を使うと $\frac{N-n}{N-1}\frac{\sigma^2}{n}$）。
      よくある間違いは、$Z_i$ を独立とみなして共分散の項を落とすこと、修正項を $\frac{N-n}{N-1}$ と $S^2$ の両方に重ねて掛けることです。

  - id: q21-neyman-allocation-4
    term: neyman-allocation
    level: 応用
    type: derivation
    question: |
      層 $h=1,\dots,H$（大きさ $N_h$、$W_h=N_h/N$、層内の分散 $S_h^2$）の層化抽出で、層化推定量の分散は
      $V=\sum_hW_h^2S_h^2\Big(\dfrac1{n_h}-\dfrac1{N_h}\Big)$ である。$\sum_hn_h=n$ のもとで $V$ を最小にする配分 $n_h$ と、そのときの $V$ をラグランジュ乗数法で導け。
    steps:
      - |
        $-\sum W_h^2S_h^2/N_h$ は $n_h$ によらないので、$\sum_h\dfrac{W_h^2S_h^2}{n_h}$ を最小にすればよい。$L=\sum_h\dfrac{W_h^2S_h^2}{n_h}+\mu\Big(\sum_hn_h-n\Big)$。
      - |
        $\dfrac{\partial L}{\partial n_h}=-\dfrac{W_h^2S_h^2}{n_h^2}+\mu=0$ より $n_h=\dfrac{W_hS_h}{\sqrt\mu}$、つまり $n_h\propto W_hS_h\propto N_hS_h$。
      - |
        $\sum n_h=n$ から $\sqrt\mu=\dfrac{\sum_kW_kS_k}{n}$、$n_h=n\dfrac{N_hS_h}{\sum_kN_kS_k}$。
      - |
        代入：$\dfrac{W_h^2S_h^2}{n_h}=\dfrac{W_hS_h\sum_kW_kS_k}{n}$ を足して $V_{\text{opt}}=\dfrac{(\sum_hW_hS_h)^2}{n}-\dfrac{\sum_hW_hS_h^2}{N}$。
    answer: '$n_h=n\dfrac{N_hS_h}{\sum_kN_kS_k}$、$V_{\text{opt}}=\dfrac1n\Big(\sum_hW_hS_h\Big)^2-\dfrac1N\sum_hW_hS_h^2$'
    hint: |
      $n_h$ を連続量とみなし、$\sum_h W_h^2S_h^2/n_h+\mu(\sum n_h-n)$ を $n_h$ で微分する。$W_h^2/N_h=W_h/N$ に注意。
    explanation: |
      停留条件 $W_h^2S_h^2/n_h^2=\mu$ から $n_h\propto N_hS_h$（層が大きいほど、層内のばらつきが大きいほど多く取る）で、
      $$n_h=n\frac{N_hS_h}{\sum_kN_kS_k},\qquad V_{\text{opt}}=\frac{(\sum W_hS_h)^2}{n}-\frac{\sum W_hS_h^2}{N}$$
      となります。目的関数は $n_h$ について凸なので、この停留点が最小です。
      比例配分 $n_h\propto N_h$ はすべての $S_h$ が等しいときのネイマン配分にあたります。調査費用が層で異なるときは $n_h\propto N_hS_h/\sqrt{c_h}$ になります。
      よくある間違いは、$n_h\propto N_hS_h^2$（分散に比例）とすること、また最後の項 $-\frac1N\sum W_hS_h^2$ を落とすことです。
