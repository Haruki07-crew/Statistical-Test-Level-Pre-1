chapter: 4
questions:
  - id: q04-change-of-variables-1
    term: change-of-variables
    level: 基本
    type: truefalse
    question: |
      連続型確率変数 $X$ の密度関数を $f_X(x)$ とし、$Y=2X+3$ とおく。
      このとき $Y$ の密度関数は $f_Y(y)=f_X\!\left(\dfrac{y-3}{2}\right)$ である。
    answer: false
    hint: |
      $x=(y-3)/2$ を代入するだけでよいか、$dx/dy$ の扱いを考える。
    explanation: |
      逆変換 $x=(y-3)/2$ の微分は $dx/dy=1/2$ なので、正しくは
      $$f_Y(y)=f_X\!\left(\frac{y-3}{2}\right)\left|\frac{dx}{dy}\right|=\frac12 f_X\!\left(\frac{y-3}{2}\right)$$
      です。係数 $1/2$ がないと $\int f_Y(y)\,dy=2$ となり、密度の条件を満たしません。

  - id: q04-change-of-variables-2
    term: change-of-variables
    level: 標準
    type: numeric
    question: |
      $X$ が区間 $(0,1)$ の一様分布に従うとき、$Y=-2\log X$ とおく。
      $P(1<Y<4)$ を小数第3位まで（四捨五入）求めよ。
    answer: 0.471
    tolerance: 0.001
    hint: |
      $Y$ の分布を変数変換で求めるか、$\{1<Y<4\}$ を $X$ の範囲に直す。
    explanation: |
      $x=e^{-y/2}$、$|dx/dy|=\tfrac12 e^{-y/2}$ なので $f_Y(y)=\tfrac12 e^{-y/2}\ (y>0)$、
      つまり $Y$ はレート $1/2$ の指数分布（自由度2のカイ二乗分布）です。
      $$P(1<Y<4)=e^{-1/2}-e^{-2}=0.6065-0.1353=0.4712$$
      $X$ の範囲に直しても $e^{-2}<X<e^{-1/2}$ となり、同じ値になります。

  - id: q04-change-of-variables-3
    term: change-of-variables
    level: 応用
    type: derivation
    question: |
      $X,Y$ が独立にレート1の指数分布（密度 $e^{-x}$, $x>0$）に従うとする。
      $U=X+Y$, $V=X/(X+Y)$ とおき、$(U,V)$ の同時密度を求めて、$U$ と $V$ の分布と独立性を答えよ。
    steps:
      - |
        逆変換は $x=uv$, $y=u(1-v)$（$u>0$, $0<v<1$）。
      - |
        ヤコビアンは
        $$\frac{\partial(x,y)}{\partial(u,v)}=\begin{vmatrix} v & u\\ 1-v & -u\end{vmatrix}=-uv-u(1-v)=-u$$
        なので絶対値は $u$。
      - |
        $f_{X,Y}(x,y)=e^{-(x+y)}=e^{-u}$ より $f_{U,V}(u,v)=u\,e^{-u}$（$u>0$, $0<v<1$）。
      - |
        $u$ だけの関数 $u e^{-u}$ と $v$ だけの関数 $1$ の積に分解できる。
    answer: "$f_{U,V}(u,v)=u e^{-u}\\ (u>0,\\ 0<v<1)$。$U$ は形状2・尺度1のガンマ分布、$V$ は $(0,1)$ の一様分布で、$U$ と $V$ は独立"
    hint: |
      逆変換 $x=x(u,v)$, $y=y(u,v)$ を書き、$\partial(x,y)/\partial(u,v)$ の行列式の絶対値を掛ける。
    explanation: |
      逆変換 $x=uv$, $y=u(1-v)$ のヤコビアンの絶対値は $u$ です。よって
      $$f_{U,V}(u,v)=e^{-u}\cdot u\qquad(u>0,\ 0<v<1)$$
      これは $u e^{-u}$（形状2・尺度1のガンマ分布の密度）と $1$（一様分布の密度）の積なので、
      $U\sim\mathrm{Ga}(2,1)$、$V\sim U(0,1)$ で、両者は独立です。
      ヤコビアンを掛け忘れると $e^{-u}$ となり、$U$ の分布を誤ります。

  - id: q04-log-transformation-1
    term: log-transformation
    level: 標準
    type: numeric
    question: |
      正の確率変数 $X$ の期待値が $50$、標準偏差が $5$ である。
      デルタ法（1次の近似）を使うと、$\log X$（自然対数）の標準偏差は近似的にいくらか。小数第3位まで（四捨五入）答えよ。
    answer: 0.1
    tolerance: 0.001
    hint: |
      $g(x)=\log x$ として $V[g(X)]\approx\{g'(\mu)\}^2V[X]$ を使う。
    explanation: |
      $g'(x)=1/x$ なので
      $$V[\log X]\approx\left(\frac{1}{50}\right)^2\cdot 5^2=0.01,\qquad \text{標準偏差}\approx 0.1$$
      $\log X$ の標準偏差はおよそ元の変動係数 $\sigma/\mu=5/50$ に等しくなります。
      これが「対数をとると、平均に比例してばらつくデータの分散がそろう」理由です。

  - id: q04-log-transformation-2
    term: log-transformation
    level: 基本
    type: choice
    question: |
      データ $1,\ 4,\ 16,\ 64$ を常用対数に変換して平均をとり、その平均を $10^{(\cdot)}$ で元の尺度に戻した値はどれか。
    choices:
      - '$8$（幾何平均）'
      - '$21.25$（算術平均）'
      - '$10$（中央値）'
      - '$3.01$（調和平均）'
    answer: 0
    hint: |
      $\log_{10}$ の平均は $\log_{10}$ の積を個数で割ったもの。
    explanation: |
      $$\frac{1}{4}\sum\log_{10}x_i=\frac14\log_{10}(1\cdot4\cdot16\cdot64)=\frac14\log_{10}4096$$
      なので、戻した値は $4096^{1/4}=8$ で、幾何平均です。
      対数の平均を戻すと算術平均ではなく幾何平均になる（算術平均以下になる）ことに注意します。

  - id: q04-power-transformation-1
    term: power-transformation
    level: 標準
    type: numeric
    question: |
      正の値をとるデータで、各グループの標準偏差が平均の $1.5$ 乗に比例している（$\sigma\propto\mu^{1.5}$）。
      べき乗変換 $Y=X^{\lambda}$ で分散を近似的に一定にするには、$\lambda$ をいくつにすればよいか。
    answer: -0.5
    tolerance: 0.01
    hint: |
      デルタ法で $V[X^{\lambda}]\approx(\lambda\mu^{\lambda-1})^2\sigma^2$ とし、$\mu$ の指数が0になる $\lambda$ を探す。
    explanation: |
      $\sigma=c\mu^{1.5}$ を代入すると
      $$V[X^{\lambda}]\approx\lambda^2\mu^{2(\lambda-1)}c^2\mu^{3}=\lambda^2c^2\mu^{2\lambda+1}$$
      $\mu$ によらないためには $2\lambda+1=0$、つまり $\lambda=-0.5$（$1/\sqrt{X}$ の変換）です。
      一般に $\sigma\propto\mu^{\beta}$ なら $\lambda=1-\beta$ です。

  - id: q04-box-cox-transformation-1
    term: box-cox-transformation
    level: 基本
    type: numeric
    question: |
      Box-Cox 変換 $y^{(\lambda)}=(y^{\lambda}-1)/\lambda$（$\lambda\ne0$）で、$y=9$、$\lambda=-1$ のときの値を小数第3位まで（四捨五入）求めよ。
    answer: 0.889
    tolerance: 0.001
    hint: |
      $9^{-1}=1/9$ を代入する。$\lambda$ が負なので符号に注意。
    explanation: |
      $$y^{(-1)}=\frac{9^{-1}-1}{-1}=1-\frac19=\frac89=0.889$$
      $\lambda<0$ でも分母に $\lambda$ があるおかげで、$y$ が大きいほど変換後の値も大きくなります（順序が保たれる）。

  - id: q04-box-cox-transformation-2
    term: box-cox-transformation
    level: 標準
    type: truefalse
    question: |
      Box-Cox 変換の $\lambda$ を最尤法で選ぶとき、候補の $\lambda$ ごとに変換後のデータの残差平方和を計算し、
      それが最小になる $\lambda$ を選べばよい。
    answer: false
    hint: |
      $\lambda$ を変えると変換後のデータの尺度（単位）も変わる。元のデータ $y$ の尤度に直すには何が必要か。
    explanation: |
      元のデータの対数尤度にはヤコビアン $\prod y_i^{\lambda-1}$ に由来する項 $(\lambda-1)\sum\log y_i$ が入り、
      プロファイル対数尤度は
      $$\ell_p(\lambda)=-\frac n2\log\hat\sigma^2(\lambda)+(\lambda-1)\sum\log y_i+\text{定数}$$
      です。変換後の残差平方和だけでは尺度の違う量を比べることになり、正しく選べません。

  - id: q04-logit-logistic-transformation-1
    term: logit-logistic-transformation
    level: 基本
    type: numeric
    question: |
      確率 $p=0.8$ のロジット $\operatorname{logit}(p)=\log\dfrac{p}{1-p}$（自然対数）を小数第3位まで（四捨五入）求めよ。
    answer: 1.386
    tolerance: 0.001
    hint: |
      まずオッズ $p/(1-p)$ を求める。
    explanation: |
      オッズは $0.8/0.2=4$ なので
      $$\operatorname{logit}(0.8)=\log4=1.386$$
      $p=0.5$ でロジットは0、$p>0.5$ で正になります。

  - id: q04-logit-logistic-transformation-2
    term: logit-logistic-transformation
    level: 標準
    type: choice
    question: |
      ロジスティック回帰モデル $\operatorname{logit}(p)=-2+0.5x$ で、$x$ を $2$ 増やしたときの変化として正しいものはどれか。
    choices:
      - 'オッズ $p/(1-p)$ が $e^{1}\approx2.72$ 倍になる'
      - 'オッズ $p/(1-p)$ が $e^{0.5}\approx1.65$ 倍になる'
      - '確率 $p$ が $e^{1}\approx2.72$ 倍になる'
      - 'オッズ $p/(1-p)$ が $1$ だけ増える'
    answer: 0
    hint: |
      ロジット（対数オッズ）がいくつ増えるかを考え、指数をとる。
    explanation: |
      $x$ を2増やすと対数オッズは $0.5\times2=1$ 増えます。オッズはその指数なので
      $$\frac{\text{新しいオッズ}}{\text{元のオッズ}}=e^{1}\approx2.72$$
      倍になります。確率 $p$ そのものは一定の倍率では変わらず、変化量は $x$ の位置によります。

  - id: q04-logit-logistic-transformation-3
    term: logit-logistic-transformation
    level: 応用
    type: numeric
    question: |
      $n=100$ 回の独立な試行で成功が $20$ 回あり、$\hat p=0.2$ を得た。
      デルタ法を使って $\operatorname{logit}(\hat p)$ の標準誤差を近似的に求めよ（$V[\hat p]$ は $\hat p(1-\hat p)/n$ で推定する）。小数第3位まで（四捨五入）答えよ。
    answer: 0.25
    tolerance: 0.001
    hint: |
      $\dfrac{d}{dp}\operatorname{logit}(p)$ を求め、$V[g(\hat p)]\approx\{g'(p)\}^2V[\hat p]$ に代入する。
    explanation: |
      $\dfrac{d}{dp}\operatorname{logit}(p)=\dfrac{1}{p(1-p)}$ なので
      $$V[\operatorname{logit}(\hat p)]\approx\frac{1}{\{p(1-p)\}^2}\cdot\frac{p(1-p)}{n}=\frac{1}{np(1-p)}=\frac{1}{100\times0.16}=0.0625$$
      標準誤差は $\sqrt{0.0625}=0.25$ です。

  - id: q04-probit-transformation-1
    term: probit-transformation
    level: 基本
    type: numeric
    question: |
      $\operatorname{probit}(0.975)=\Phi^{-1}(0.975)$ の値を小数第3位まで（四捨五入）求めよ（$\Phi$ は標準正規分布の累積分布関数）。
    answer: 1.96
    tolerance: 0.001
    hint: |
      $\Phi(z)=0.975$ となる $z$、つまり標準正規分布の上側2.5%点。
    explanation: |
      $\Phi(1.960)=0.975$ なので $\operatorname{probit}(0.975)=1.960$ です。
      プロビット変換は「確率を標準正規分布の分位点に直す」変換です。

  - id: q04-probit-transformation-2
    term: probit-transformation
    level: 標準
    type: numeric
    question: |
      プロビットモデル $p=\Phi(-1+0.4x)$ で、$x=5$ における限界効果 $\dfrac{dp}{dx}$ を小数第3位まで（四捨五入）求めよ。
      必要なら $\phi(1)=0.2420$（標準正規分布の密度）を使ってよい。
    answer: 0.097
    tolerance: 0.001
    hint: |
      合成関数の微分 $\dfrac{d}{dx}\Phi(a+bx)=b\,\phi(a+bx)$ を使う。
    explanation: |
      $x=5$ で線形予測子は $-1+0.4\times5=1$ なので
      $$\frac{dp}{dx}=0.4\,\phi(1)=0.4\times0.2420=0.0968$$
      係数 $0.4$ そのものは確率の変化量ではなく、密度 $\phi$ を掛けて初めて確率の変化率になります。

  - id: q04-sum-of-random-variables-1
    term: sum-of-random-variables
    level: 基本
    type: choice
    question: |
      それぞれ独立な2つの確率変数の和について、和が**同じ分布族に入らない**ものはどれか。
      （$\mathrm{Bin}(n,p)$ は二項分布、$Po(\lambda)$ はポアソン分布、$N(\mu,\sigma^2)$ は正規分布、$\chi^2(k)$ はカイ二乗分布）
    choices:
      - '$\mathrm{Bin}(5,\,0.3)+\mathrm{Bin}(4,\,0.5)$'
      - '$Po(1)+Po(2)$'
      - '$N(0,\,1)+N(1,\,4)$'
      - '$\chi^2(2)+\chi^2(3)$'
    answer: 0
    hint: |
      再生性の表で、和が同じ族になるための条件がついている分布はどれか。
    explanation: |
      二項分布の再生性 $\mathrm{Bin}(m,p)+\mathrm{Bin}(n,p)=\mathrm{Bin}(m+n,p)$ は**成功確率 $p$ が共通**のときだけ成り立ちます。$p=0.3$ と $0.5$ では和は二項分布になりません（平均 $3.5$、分散 $2.05$ で、$\mathrm{Bin}(9,p)$ の平均と分散の関係を満たさない）。
      ほかはそれぞれ $Po(3)$、$N(1,\,5)$、$\chi^2(5)$ になります。

  - id: q04-sum-of-random-variables-2
    term: sum-of-random-variables
    level: 標準
    type: numeric
    question: |
      $X, Y$ は独立にどちらも一様分布 $U(0,1)$ に従う。$Z=X+Y$ について $P(0.5<Z<1.5)$ を小数第2位まで（四捨五入）求めよ。
    answer: 0.75
    tolerance: 0.005
    hint: |
      畳み込みで $Z$ の密度を求めると、$0<z<2$ で $z=1$ を頂点とする三角形になる。
    explanation: |
      畳み込み $f_Z(z)=\int f_X(x)f_Y(z-x)\,dx$ より、$f_Z(z)=z\ (0<z\le1)$、$f_Z(z)=2-z\ (1<z<2)$ です。
      両端の三角形の面積はそれぞれ $\tfrac12(0.5)^2=0.125$ なので
      $$P(0.5<Z<1.5)=1-0.125-0.125=0.75$$

  - id: q04-sum-of-random-variables-3
    term: sum-of-random-variables
    level: 応用
    type: derivation
    question: |
      $X, Y$ は独立で、それぞれレート $\lambda_1,\ \lambda_2$（$\lambda_1\ne\lambda_2$）の指数分布（密度 $\lambda e^{-\lambda x},\ x>0$）に従う。
      畳み込みを使って $Z=X+Y$ の密度 $f_Z(z)\ (z>0)$ を求めよ。
    steps:
      - |
        $f_Z(z)=\displaystyle\int_0^z \lambda_1e^{-\lambda_1x}\,\lambda_2e^{-\lambda_2(z-x)}\,dx$（$x>0$ かつ $z-x>0$ なので積分範囲は $0<x<z$）。
      - |
        $=\lambda_1\lambda_2e^{-\lambda_2z}\displaystyle\int_0^z e^{-(\lambda_1-\lambda_2)x}\,dx=\lambda_1\lambda_2e^{-\lambda_2z}\cdot\frac{1-e^{-(\lambda_1-\lambda_2)z}}{\lambda_1-\lambda_2}$。
      - |
        整理して $f_Z(z)=\dfrac{\lambda_1\lambda_2}{\lambda_2-\lambda_1}\left(e^{-\lambda_1z}-e^{-\lambda_2z}\right)$。
    answer: '$f_Z(z)=\dfrac{\lambda_1\lambda_2}{\lambda_2-\lambda_1}\left(e^{-\lambda_1 z}-e^{-\lambda_2 z}\right)\quad(z>0)$'
    hint: |
      $f_X(x)f_Y(z-x)$ が0でないのは $0<x<z$ のときだけ。指数部分をまとめて $x$ で積分する。
    explanation: |
      $$f_Z(z)=\int_0^z\lambda_1e^{-\lambda_1x}\lambda_2e^{-\lambda_2(z-x)}dx=\frac{\lambda_1\lambda_2}{\lambda_2-\lambda_1}\left(e^{-\lambda_1z}-e^{-\lambda_2z}\right)$$
      $\int_0^\infty f_Z(z)\,dz=\frac{\lambda_1\lambda_2}{\lambda_2-\lambda_1}\left(\frac1{\lambda_1}-\frac1{\lambda_2}\right)=1$ で密度になっていることが確かめられます。
      期待値は $1/\lambda_1+1/\lambda_2$ です。$\lambda_1=\lambda_2=\lambda$ の極限では $\lambda^2ze^{-\lambda z}$（形状2のガンマ分布）になり、レートが異なる指数分布の和はガンマ分布になりません。

  - id: q04-logit-logistic-transformation-4
    term: logit-logistic-transformation
    level: 標準
    type: derivation
    question: |
      $U$ が一様分布 $U(0,1)$ に従うとき、ロジット変換 $Y=\log\dfrac{U}{1-U}$ の密度関数と累積分布関数を求めよ。
    steps:
      - |
        逆変換はロジスティック関数：$u=\dfrac{e^{y}}{1+e^{y}}$（$y$ は実数全体、$u\in(0,1)$ と1対1）。
      - |
        微分すると $\dfrac{du}{dy}=\dfrac{e^{y}}{(1+e^{y})^2}=u(1-u)>0$。
      - |
        変数変換の公式 $f_Y(y)=f_U(u)\left|\dfrac{du}{dy}\right|$ で、$f_U=1$ なので $f_Y(y)=\dfrac{e^{y}}{(1+e^{y})^2}$。
      - |
        累積分布関数は $F_Y(y)=P(U\le u(y))=u(y)=\dfrac{1}{1+e^{-y}}$。
    answer: '$f_Y(y)=\dfrac{e^{y}}{(1+e^{y})^2}$、$F_Y(y)=\dfrac{1}{1+e^{-y}}$（$-\infty<y<\infty$、標準ロジスティック分布）'
    hint: |
      $y$ を $u$ について解いて逆変換を作り、$|du/dy|$ を掛ける。
    explanation: |
      逆変換 $u=e^y/(1+e^y)$ の導関数は $u(1-u)$ なので
      $$f_Y(y)=\frac{e^{y}}{(1+e^{y})^2},\qquad F_Y(y)=\frac{1}{1+e^{-y}}$$
      です。これは標準ロジスティック分布で、$f_Y(-y)=f_Y(y)$ と0について対称（期待値0）です。
      累積分布関数がちょうどロジスティック関数になるので、ロジスティック回帰は「潜在変数にロジスティック分布の誤差がある」モデルとも読めます。
      よくある間違いは、ヤコビアンを $dy/du=1/\{u(1-u)\}$ のまま掛けてしまうことです（掛けるのは逆変換の導関数 $du/dy$）。

  - id: q04-change-of-variables-4
    term: change-of-variables
    level: 応用
    type: derivation
    question: |
      $X,Y$ が独立に $N(0,1)$ に従う。極座標 $X=R\cos\Theta$、$Y=R\sin\Theta$（$R>0$、$0\le\Theta<2\pi$）に変換して $(R,\Theta)$ の同時密度を求め、
      $R$ と $\Theta$ の独立性、$\Theta$ の分布、$W=R^2$ の分布を答えよ。
    steps:
      - |
        $(X,Y)$ の同時密度は $f(x,y)=\dfrac{1}{2\pi}e^{-(x^2+y^2)/2}$ で、$x^2+y^2=r^2$。
      - |
        ヤコビアン：$\dfrac{\partial(x,y)}{\partial(r,\theta)}=\begin{vmatrix}\cos\theta&-r\sin\theta\\ \sin\theta&r\cos\theta\end{vmatrix}=r$。
      - |
        $g(r,\theta)=\dfrac{1}{2\pi}e^{-r^2/2}\cdot r=\underbrace{\dfrac{1}{2\pi}}_{\theta\text{ の関数}}\times\underbrace{r e^{-r^2/2}}_{r\text{ の関数}}$。積に分かれ、台も長方形なので $R$ と $\Theta$ は独立、$\Theta\sim U(0,2\pi)$。
      - |
        $W=R^2$ と変換：$r=\sqrt w$、$\dfrac{dr}{dw}=\dfrac{1}{2\sqrt w}$ より $f_W(w)=\sqrt w\,e^{-w/2}\cdot\dfrac{1}{2\sqrt w}=\dfrac12e^{-w/2}$（$w>0$）。
    answer: '$g(r,\theta)=\dfrac{1}{2\pi}\,r e^{-r^2/2}$。$R$ と $\Theta$ は独立、$\Theta\sim U(0,2\pi)$、$W=R^2$ は平均2の指数分布（$=\chi^2(2)$）'
    hint: |
      $dx\,dy=r\,dr\,d\theta$。同時密度が $r$ の関数と $\theta$ の関数の積に分かれるかを見る。
    explanation: |
      ヤコビアン $r$ を掛けて
      $$g(r,\theta)=\frac{1}{2\pi}\cdot re^{-r^2/2}\quad(r>0,\ 0\le\theta<2\pi)$$
      となり、$\Theta\sim U(0,2\pi)$ と $R$（レイリー分布）は独立です。さらに $W=R^2=X^2+Y^2$ の密度は $\frac12e^{-w/2}$ で、
      自由度2のカイ二乗分布（平均2の指数分布）と一致します。逆向きに使うと、一様乱数から正規乱数を作るボックス・ミュラー法になります。
      よくある間違いは、ヤコビアン $r$ を掛け忘れて $\frac{1}{2\pi}e^{-r^2/2}$ を密度としてしまうことです（$r$ で積分しても1になりません）。

  # ---------- 4択の追加 ----------
  - id: q04-change-of-variables-5
    term: change-of-variables
    level: 標準
    type: choice
    question: |
      $X$ が区間 $(0,1)$ の一様分布に従うとき、$Y=X^2$ とおく。$0<y<1$ での $Y$ の確率密度関数 $f_Y(y)$ はどれか。
    choices:
      - '$\dfrac{1}{2\sqrt y}$'
      - '$1$'
      - '$2\sqrt y$'
      - '$\sqrt y$'
    answer: 0
    hint: |
      $(0,1)$ で $y=x^2$ は単調なので、逆関数 $x=\sqrt y$ とその微分 $|dx/dy|$ を使う。累積分布関数を経由してもよい。
    explanation: |
      逆関数は $x=\sqrt y$、$\dfrac{dx}{dy}=\dfrac{1}{2\sqrt y}$ なので
      $$f_Y(y)=f_X(\sqrt y)\left|\frac{dx}{dy}\right|=1\times\frac{1}{2\sqrt y}=\frac{1}{2\sqrt y}\quad(0<y<1)$$
      累積分布関数で確かめると $F_Y(y)=P(X\le\sqrt y)=\sqrt y$ で、微分すると同じ式になります。
      - $1$ は $f_X(\sqrt y)$ に置き換えただけで、ヤコビアン $|dx/dy|$ を掛け忘れています（積分すると1になりますが、$P(Y\le0.25)$ が $0.25$ となり、正しい値 $P(X\le0.5)=0.5$ と合いません）。
      - $2\sqrt y$ は $|dy/dx|=2x$ を掛けたもので、微分の向きが逆です。
      - $\sqrt y$ は累積分布関数 $F_Y(y)$ で、密度ではありません。

  - id: q04-box-cox-transformation-3
    term: box-cox-transformation
    level: 基本
    type: choice
    question: |
      $y>0$ に対する Box-Cox 変換 $y^{(\lambda)}=\dfrac{y^{\lambda}-1}{\lambda}$（$\lambda\ne0$）で、
      $\lambda=0$ のときの変換は $\lambda\to0$ の極限で定める。その変換はどれか。
    choices:
      - '$y-1$'
      - '$1-1/y$'
      - '$\log y$'
      - '$0$'
    answer: 2
    hint: |
      $y^{\lambda}=e^{\lambda\log y}$ と書き直し、$\lambda$ が小さいときの展開を使う。
    explanation: |
      $y^{\lambda}=e^{\lambda\log y}=1+\lambda\log y+O(\lambda^2)$ なので
      $$\lim_{\lambda\to0}\frac{y^{\lambda}-1}{\lambda}=\log y$$
      （ロピタルの定理で $\frac{d}{d\lambda}y^\lambda=y^\lambda\log y\to\log y$ としても同じ）。
      こうして $\lambda=0$ に対数変換を入れることで、$\lambda$ について連続な変換の族になります。
      - $y-1$ は $\lambda=1$ の場合（平行移動だけで分布の形は変わらない）です。
      - $1-1/y$ は $\lambda=-1$ の場合です。
      - $0$ は分子 $y^0-1=0$ だけを見たもので、分母も $0$ になる「$0/0$」の極限を考えていません。
