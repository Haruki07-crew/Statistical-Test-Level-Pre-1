# 根拠と参考URLは spec/research/roadmap.md
stages:
  - {'no': 1, title: まず固める基礎, desc: 確率・期待値と分散・主要な分布・推定と検定の基本手順。ほかのすべての章がこの上に乗る。}
  - {'no': 2, title: 得点源, desc: 回帰・分散分析・時系列・主成分分析・ベイズ・マルコフ連鎖など毎回のように出る分野と、推定・検定の理論。}
  - {'no': 3, title: 差がつく応用, desc: 多変量解析の発展、標本調査、欠測と生存時間、確率過程の応用など、押さえると周りと差がつく項目。}
  - {'no': 4, title: 余裕があれば, desc: 出題がまれな発展事項と、ほかの項目に統合済みの用語。直前に眺める程度でよい。}
