level: tb
name: 統計学の教科書
full: 統計学の教科書（学部1年〜修士2年）
short: 統計教科書
desc: 学部1年から修士2年までの統計学を、学年ごとの章に沿って解説する教科書と問題集
theme: "#7a4a24"
asset: "../"
kp: jdt-
textbook: true
kicker: 学部1年〜修士2年
h1: 統計学の教科書
lead: 学部1年のデータの見方から修士2年の高次元統計・因果推論まで、学年ごとの57章に {terms} 語の解説と {qs} 問の問題をまとめています。学部の部分は2級・準1級の辞典の解説を学ぶ順に並べ直したもので、大学院の部分はこの教科書のために書きました。
