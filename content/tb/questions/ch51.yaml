chapter: 51
questions:
  # ---------- カルマンフィルタ (A) ----------
  - id: q51-kalman-filter-1
    term: kalman-filter
    level: 標準
    type: numeric
    question: |
      ローカルレベルモデル（観測誤差の分散 1、水準の変化の分散 0.5）で、前の時点の推定が $a_{t-1}=10$、$P_{t-1}=0.5$ だった。観測 $y_t=12$ が来たときの更新後の推定値 $a_t$ を求めよ。
    answer: 11
    tolerance: 0.0001
    hint: |
      予測の分散 $P_{t|t-1}=P_{t-1}+0.5$、ゲイン $K=P_{t|t-1}/(P_{t|t-1}+1)$ です。
    explanation: |
      $P_{t|t-1}=1$、$K=1/2$ なので $a_t=10+0.5\times(12-10)=11$、$P_t=(1-0.5)\times1=0.5$ です。

  - id: q51-kalman-filter-2
    term: kalman-filter
    level: 応用
    type: numeric
    question: |
      ローカルレベルモデルで、水準の変化の分散と観測誤差の分散の比が $q=1$ のとき、定常状態のカルマンゲイン $K=(-q+\sqrt{q^2+4q})/2$ を求めよ（小数第 3 位まで）。
    answer: 0.618
    tolerance: 0.0005
    hint: |
      $q=1$ を代入します。
    explanation: |
      $K=(-1+\sqrt5)/2\approx0.618$（黄金比の逆数）です。定常状態ではフィルタは平滑化定数 0.618 の指数平滑法と同じになります。

  # ---------- GARCH (A) ----------
  - id: q51-garch-model-1
    term: garch-model
    level: 標準
    type: numeric
    question: |
      GARCH(1,1) で $\alpha=0.10$、$\beta=0.85$ のとき、分散へのショックの半減期 $\log0.5/\log(\alpha+\beta)$ を求めよ（小数第 1 位まで）。
    answer: 13.5
    tolerance: 0.05
    hint: |
      $\alpha+\beta=0.95$ です。
    explanation: |
      $\log0.5/\log0.95\approx13.5$ 期です。$\alpha+\beta$ が 1 に近いほど、高いボラティリティが長く続きます。

  - id: q51-garch-model-2
    term: garch-model
    level: 標準
    type: truefalse
    question: |
      GARCH(1,1) に従う収益率 $r_t$ は自己相関が 0 なので、$r_t$ と $r_{t-1}$ は独立である。
    answer: false
    hint: |
      $r_t^2$ と $r_{t-1}^2$ の関係を考えます。
    explanation: |
      誤りです。$r_t$ は無相関ですが、$\sigma_t^2$ が $r_{t-1}^2$ に依存するので、$r_t^2$ と $r_{t-1}^2$ には正の相関があり、独立ではありません。「無相関」と「独立」の違いの典型例です。

  # ---------- VAR (A) ----------
  - id: q51-var-model-1
    term: var-model
    level: 標準
    type: choice
    question: |
      VAR(1) $y_t=Ay_{t-1}+\varepsilon_t$ が定常になる係数行列はどれか。
    choices:
      - '$\begin{pmatrix}0.9&0.5\\0.1&0.6\end{pmatrix}$'
      - '$\begin{pmatrix}1.0&0.1\\0&0.5\end{pmatrix}$'
      - '$\begin{pmatrix}0.5&0.3\\0.2&0.4\end{pmatrix}$'
      - '$\begin{pmatrix}0.6&0.6\\0.6&0.6\end{pmatrix}$'
    answer: 2
    hint: |
      固有値の絶対値がすべて 1 より小さいかを調べます。対角成分がすべて 1 未満でも定常とは限りません。
    explanation: |
      固有値は順に、約 $1.019$ と $0.481$、$1$ と $0.5$、$0.7$ と $0.2$、$1.2$ と $0$ です。すべて 1 未満なのは 3 番目だけです。1 番目は対角成分がどちらも 1 未満ですが、非対角成分のために固有値が 1 を超え、定常ではありません。

  - id: q51-var-model-2
    term: var-model
    level: 標準
    type: numeric
    question: |
      VAR(1) の係数行列が $A=\begin{pmatrix}0.5&0.2\\0.1&0.6\end{pmatrix}$ のとき、$y_1$ に 1 単位のショックが入ってから 2 期後の $y_2$ の応答（$A^2$ の (2,1) 成分）を求めよ。
    answer: 0.11
    tolerance: 0.0001
    hint: |
      $A^2$ の 2 行 1 列は $0.1\times0.5+0.6\times0.1$ です。
    explanation: |
      $(A^2)_{21}=0.1\times0.5+0.6\times0.1=0.11$ です。1 期後の応答 0.1 より少し大きく、$y_2$ が自分自身の持続性（0.6）でショックを持ち越していることが分かります。

  # ---------- 共和分 (C) ----------
  - id: q51-cointegration-1
    term: cointegration
    level: 標準
    type: choice
    question: |
      互いに独立な 2 本のランダムウォークを、一方をもう一方に回帰した。起こりやすいことはどれか。
    choices:
      - "傾きの t 検定はほとんどの場合で有意にならない"
      - "傾きの t 検定が、関係がないのに高い割合で有意になる"
      - "残差は定常になり、共和分ありと判断される"
      - "決定係数はつねにほぼ 0 になる"
    answer: 1
    hint: |
      単位根のある系列どうしの回帰（見せかけの回帰）を考えます。
    explanation: |
      独立なランダムウォークどうしでも、t 検定は 5% 水準で 80% 以上の割合で有意になり、決定係数もかなり大きくなることがあります（見せかけの回帰）。残差には単位根が残るので、残差の単位根検定で共和分がないことを確かめる必要があります。

  # ---------- 導出の問題 ----------
  - id: q51-kalman-filter-3
    term: kalman-filter
    level: 応用
    type: derivation
    question: |
      ローカルレベルモデル（観測誤差の分散 1、水準の変化の分散 $q$）で、予測の分散 $P=P_{t|t-1}$ が定常になるとき、$P$ の満たす方程式と定常のカルマンゲインを求めよ。
    steps:
      - |
        更新後の分散は $P_t=(1-K)P=\frac{P}{P+1}$（$K=P/(P+1)$）。
      - |
        次の予測の分散は $P_t+q$ なので、定常なら $P=\frac{P}{P+1}+q$、つまり $P^2-qP-q=0$。
      - |
        $P=\frac{q+\sqrt{q^2+4q}}2$、$K=\frac P{P+1}=\frac{-q+\sqrt{q^2+4q}}2$。
    answer: |
      $P^2-qP-q=0$、$K=\dfrac{-q+\sqrt{q^2+4q}}{2}$
    hint: |
      「更新 → 予測」を 1 周しても分散が変わらない、という式を立てます。
    explanation: |
      $K$ が $P/(P+1)$ と $\frac{-q+\sqrt{q^2+4q}}2$ の両方で表せることは、$P^2=q(P+1)$ から確かめられます。定常状態のフィルタは指数平滑法と同じです。

  - id: q51-garch-model-3
    term: garch-model
    level: 標準
    type: derivation
    question: |
      GARCH(1,1) $\sigma_t^2=\omega+\alpha r_{t-1}^2+\beta\sigma_{t-1}^2$（$r_t=\sigma_tz_t$、$E[z_t^2]=1$）が弱定常のとき、無条件分散 $E[r_t^2]$ を求めよ。
    steps:
      - |
        $E[r_t^2]=E[\sigma_t^2]E[z_t^2]=E[\sigma_t^2]$（$z_t$ は過去と独立）。
      - |
        定常なら $E[\sigma_t^2]=\omega+\alpha E[r_{t-1}^2]+\beta E[\sigma_{t-1}^2]=\omega+(\alpha+\beta)E[\sigma^2]$。
      - |
        $E[\sigma^2]=\omega/(1-\alpha-\beta)$（$\alpha+\beta<1$ が必要）。
    answer: |
      $E[r_t^2]=\dfrac{\omega}{1-\alpha-\beta}$
    hint: |
      両辺の期待値をとり、定常性から $E[\sigma_t^2]=E[\sigma_{t-1}^2]$ とおきます。
    explanation: |
      $\alpha+\beta\ge1$ では無条件分散が存在しません。分散の予測が無条件分散に $(\alpha+\beta)^{h-1}$ の速さで戻ることも、同じ漸化式から導けます。

  - id: q51-var-model-3
    term: var-model
    level: 標準
    type: derivation
    question: |
      定常な VAR(1) $y_t=c+Ay_{t-1}+\varepsilon_t$（$E[\varepsilon_t]=0$）の平均 $\mu=E[y_t]$ を求めよ。
    steps:
      - |
        両辺の期待値をとると $\mu=c+A\mu$（定常なので $E[y_t]=E[y_{t-1}]=\mu$）。
      - |
        $(I-A)\mu=c$。定常なら $A$ の固有値はすべて絶対値 1 未満なので $I-A$ は正則。
    answer: |
      $\mu=(I-A)^{-1}c$
    hint: |
      定常性から、期待値が時点によらないことを使います。
    explanation: |
      $A=\begin{pmatrix}0.5&0.2\\0.1&0.6\end{pmatrix}$、$c=(1,0.5)^\top$ なら $\mu\approx(2.778,1.944)$ です。予測 $c+A\hat y$ をくり返すと、この平均に近づきます。

  # ---------- 重要度 C の 2 問目 ----------
  - id: q51-cointegration-2
    term: cointegration
    level: 標準
    type: numeric
    question: |
      誤差修正モデル $\Delta y_t=-0.25\,(y_{t-1}-2x_{t-1})+\varepsilon_t$ で、前の期に $y_{t-1}=10$、$x_{t-1}=3$ だった。$\Delta y_t$ の期待値を求めよ。
    answer: -1
    tolerance: 0.0001
    hint: |
      均衡からのずれは $y_{t-1}-2x_{t-1}$ です。
    explanation: |
      ずれは $10-6=4$ で、期待値は $-0.25\times4=-1$。$y$ は均衡（$y=2x$）の方向へ、ずれの 25% だけ戻ります。
