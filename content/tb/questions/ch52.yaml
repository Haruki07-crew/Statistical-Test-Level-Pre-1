chapter: 52
questions:
  # ---------- 集中不等式 (A) ----------
  - id: q52-concentration-inequality-1
    term: concentration-inequality
    level: 基本
    type: numeric
    question: |
      値が $[0,1]$ に入る独立な確率変数 400 個の平均が、その期待値から 0.05 以上ずれる確率の、ヘフディングの不等式による上界を求めよ（小数第 4 位まで）。
    answer: 0.2707
    tolerance: 0.0001
    hint: |
      $2\exp(-2nt^2/(b-a)^2)$ に $n=400$、$t=0.05$、$b-a=1$ を代入します。
    explanation: |
      $2e^{-2\times400\times0.0025}=2e^{-2}\approx0.2707$ です。分布によらない上界なので、実際の確率（たとえば公平なコインでは約 0.05）よりかなり大きくなります。

  - id: q52-concentration-inequality-2
    term: concentration-inequality
    level: 標準
    type: choice
    question: |
      独立な標準正規変数 $p$ 個の最大値の期待値は、$p$ が大きいときどのくらいの速さで増えるか。
    choices:
      - "$p$ に比例"
      - "$\\sqrt p$ に比例"
      - "$\\sqrt{2\\log p}$ 程度"
      - "増えない（一定）"
    answer: 2
    hint: |
      和集合上界 $P(\max_j Z_j>t)\le p\,e^{-t^2/2}$ が小さくなる $t$ を考えます。
    explanation: |
      $p\,e^{-t^2/2}$ が小さくなるのは $t\approx\sqrt{2\log p}$ のときで、$E\max_jZ_j\le\sqrt{2\log p}$ です（$p=10000$ で約 4.29、実際は約 3.85）。変数が多くても最大値はゆっくりしか増えないことが、高次元統計の $\log p$ の項の源です。

  # ---------- 高次元の回帰 (A) ----------
  - id: q52-high-dimensional-regression-1
    term: high-dimensional-regression
    level: 標準
    type: numeric
    question: |
      説明変数が独立な標準正規、誤差の分散 1 の回帰で、$n=60$、$p=29$ のとき、最小二乗推定量の誤差 $E\|\hat\beta-\beta\|^2=\sigma^2p/(n-p-1)$ を求めよ（小数第 4 位まで）。
    answer: 0.9667
    tolerance: 0.0001
    hint: |
      $29/(60-29-1)$ を計算します。
    explanation: |
      $29/30\approx0.9667$ です。$p=10$ なら $10/49\approx0.20$ ですが、$p$ が $n$ に近づくと分母が 0 に近づき、誤差は急に大きくなります。

  - id: q52-high-dimensional-regression-2
    term: high-dimensional-regression
    level: 基本
    type: truefalse
    question: |
      説明変数の数 $p$ が標本の大きさ $n$ より多い（そして $X$ の行が一次独立な）とき、最小二乗法で訓練データの決定係数を 1 にできる。
    answer: true
    hint: |
      $X\beta=y$ という $n$ 本の方程式に、未知数が $p>n$ 個あります。
    explanation: |
      正しいです。方程式より未知数が多いので、$X\beta=y$ を満たす解が無数にあり、残差 0（決定係数 1）にできます。しかしそれは予測の良さを意味しません。予測の誤差は検証データで評価し、スパース性などの構造を仮定して正則化します。

  # ---------- ラッソの理論 (B) ----------
  - id: q52-lasso-theory-1
    term: lasso-theory
    level: 基本
    type: numeric
    question: |
      直交計画で最小二乗推定値が $z=1.3$ の係数に、$\lambda=0.5$ のラッソ（ソフト閾値）を適用した推定値を求めよ。
    answer: 0.8
    tolerance: 0.0001
    hint: |
      $\mathrm{sign}(z)\max(|z|-\lambda,0)$ です。
    explanation: |
      $1.3-0.5=0.8$ です。$|z|\le0.5$ の係数は 0 になり、残った係数も $\lambda$ だけ縮みます。この縮みが、ラッソの係数を効果の大きさとして解釈しにくい理由です。

  # ---------- 導出の問題 ----------
  - id: q52-concentration-inequality-3
    term: concentration-inequality
    level: 応用
    type: derivation
    question: |
      独立な標準正規変数 $Z_1,\dots,Z_p$ について、和集合上界と正規分布の裾の上界 $P(|Z|>t)\le2e^{-t^2/2}$ を使い、$P(\max_j|Z_j|>t)\le\delta$ となる $t$ を求めよ。
    steps:
      - |
        和集合上界：$P(\max_j|Z_j|>t)\le\sum_jP(|Z_j|>t)\le2p\,e^{-t^2/2}$。
      - |
        $2p\,e^{-t^2/2}=\delta$ を解くと $t=\sqrt{2\log(2p/\delta)}$。
    answer: |
      $t=\sqrt{2\log(2p/\delta)}$
    hint: |
      最大値が $t$ を超えるのは、どれか 1 つが $t$ を超えるときです。
    explanation: |
      $p=1000$、$\delta=0.05$ なら $t\approx4.60$。変数の数が 1000 倍になっても $t$ は $\sqrt{\log p}$ でしか増えません。ラッソの調整パラメータの大きさ $\sigma\sqrt{\log p/n}$ はここから来ます。

  - id: q52-high-dimensional-regression-3
    term: high-dimensional-regression
    level: 応用
    type: derivation
    question: |
      $X$（$n\times p$、$p<n$）を固定した線形回帰 $y=X\beta+\varepsilon$、$\varepsilon\sim N(0,\sigma^2I)$ で、最小二乗推定量の誤差 $E\lVert\hat\beta-\beta\rVert^2$ を $X$ で表せ。
    steps:
      - |
        $\hat\beta-\beta=(X^\top X)^{-1}X^\top\varepsilon$ なので、共分散は $\sigma^2(X^\top X)^{-1}$。
      - |
        $E\lVert\hat\beta-\beta\rVert^2=\mathrm{tr}\,\mathrm{Cov}(\hat\beta)=\sigma^2\,\mathrm{tr}\{(X^\top X)^{-1}\}=\sigma^2\sum_k1/\lambda_k$（$\lambda_k$ は $X^\top X$ の固有値）。
    answer: |
      $E\lVert\hat\beta-\beta\rVert^2=\sigma^2\,\mathrm{tr}\{(X^\top X)^{-1}\}$
    hint: |
      2 乗の長さの期待値は、共分散行列のトレースです。
    explanation: |
      $p$ が $n$ に近いと $X^\top X$ の最小固有値が 0 に近づき、$1/\lambda_{\min}$ が誤差を支配します。説明変数が独立な標準正規なら、平均して $\sigma^2p/(n-p-1)$ になります。
