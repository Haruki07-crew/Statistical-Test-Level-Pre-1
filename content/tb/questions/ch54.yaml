chapter: 54
questions:
  # ---------- 変分推論 (A) ----------
  - id: q54-variational-inference-1
    term: variational-inference
    level: 標準
    type: numeric
    question: |
      事後分布が相関 $\rho=0.8$ の 2 変量正規分布（各周辺の分散 1）のとき、平均場の正規近似（各母数が独立な正規分布）の最適解の標準偏差を求めよ。
    answer: 0.6
    tolerance: 0.0001
    hint: |
      最適な平均場近似の各分散は $1-\rho^2$ です。
    explanation: |
      分散 $1-0.64=0.36$、標準偏差 $0.6$ です。本当の周辺の標準偏差 1 の 6 割しかなく、平均場近似は相関が強いほど不確かさを小さく見積もります。

  - id: q54-variational-inference-2
    term: variational-inference
    level: 基本
    type: truefalse
    question: |
      どんな分布 $q$ についても、ELBO は対数周辺尤度 $\log p(x)$ 以下である。
    answer: true
    hint: |
      $\log p(x)=\mathrm{ELBO}(q)+\mathrm{KL}(q\|p(\theta\mid x))$ です。
    explanation: |
      正しいです。KL 情報量は 0 以上なので $\mathrm{ELBO}\le\log p(x)$ で、等号は $q$ が事後分布に一致するときです。「証拠（エビデンス）の下界」という名前の由来です。

  # ---------- HMC (B) ----------
  - id: q54-hamiltonian-monte-carlo-1
    term: hamiltonian-monte-carlo
    level: 標準
    type: choice
    question: |
      HMC でリープフロッグ法を使う理由として正しいものはどれか。
    choices:
      - "ハミルトニアンを正確に保つので、採択の判定がいらないから"
      - "時間を逆にたどれて体積を保つので、簡単な採択確率で詳細つり合いが成り立つから"
      - "勾配を計算しなくてよいから"
      - "離散の母数にも使えるから"
    answer: 1
    hint: |
      数値解ではハミルトニアンは少しずれます。そのずれを補正するのが採択です。
    explanation: |
      リープフロッグ法は可逆でシンプレクティック（体積保存）なので、提案の密度の比が消え、採択確率が $\min\{1,e^{H-H^*}\}$ という簡単な形になります。ハミルトニアンは近似的にしか保たれないので、採択の判定は必要です。勾配を使うので、離散の母数には直接使えません。

  # ---------- ガウス過程回帰 (A) ----------
  - id: q54-gaussian-process-regression-1
    term: gaussian-process-regression
    level: 標準
    type: numeric
    question: |
      事前分布 $f\sim\mathcal{GP}(0,k)$ で $k(x,x)=1$、観測誤差の分散 $\sigma_n^2=0.25$ とする。点 $x_1$ で 1 個だけ観測したとき、同じ点 $x_1$ での $f$ の事後分散を求めよ。
    answer: 0.2
    tolerance: 0.0001
    hint: |
      $V[f_*]=k(x_*,x_*)-k_*^\top(K+\sigma_n^2I)^{-1}k_*$ で、$K=k_*=1$ です。
    explanation: |
      $1-1/(1+0.25)=0.2$ です。観測値 $y$ がいくらであっても事後分散は同じで、観測の位置だけで決まります（事後平均は $y/1.25$）。

  - id: q54-gaussian-process-regression-2
    term: gaussian-process-regression
    level: 標準
    type: choice
    question: |
      RBF カーネルの長さスケール $\ell$ を小さくしすぎると、どうなりやすいか。
    choices:
      - "推定した関数がほぼ直線になる"
      - "観測点の間で事前分布の平均（0）に戻り、区間も広がって予測が悪くなる"
      - "事後分散がどこでも 0 になる"
      - "周辺尤度がつねに大きくなる"
    answer: 1
    hint: |
      $\ell$ は「どれだけ離れた点まで値が似ているか」です。
    explanation: |
      $\ell$ が小さいと、観測点から少し離れるだけで相関がなくなり、間の点では観測の情報が届かず、事後平均は 0 に、事後分散は事前分散に戻ります。周辺尤度は複雑すぎるモデルに罰則を課すので、ふつうは中くらいの $\ell$ で最大になります。

  # ---------- WAIC (B) ----------
  - id: q54-waic-1
    term: waic
    level: 基本
    type: numeric
    question: |
      ベイズモデルの事後標本から、$\mathrm{lppd}=-50.3$、$p_{\mathrm{WAIC}}=3.2$ が得られた。$\mathrm{WAIC}=-2(\mathrm{lppd}-p_{\mathrm{WAIC}})$ を求めよ。
    answer: 107
    tolerance: 0.0001
    hint: |
      $-2\times(-50.3-3.2)$ です。
    explanation: |
      $-2\times(-53.5)=107$ です。値が小さいモデルほど予測が良いと判断します。$p_{\mathrm{WAIC}}=3.2$ は有効パラメータ数で、正則なモデルならパラメータの数に近い値になります。

  # ---------- ディリクレ過程 (B) ----------
  - id: q54-dirichlet-process-1
    term: dirichlet-process
    level: 標準
    type: numeric
    question: |
      集中度 $\alpha=2$ のディリクレ過程から 10 個のデータをとったとき、異なる値（クラスター）の数の期待値 $\sum_{i=0}^{n-1}\alpha/(\alpha+i)$ を求めよ（小数第 3 位まで）。
    answer: 4.040
    tolerance: 0.0005
    hint: |
      $2/2+2/3+2/4+\cdots+2/11$ です。
    explanation: |
      $1+0.667+0.5+0.4+0.333+0.286+0.25+0.222+0.2+0.182\approx4.040$ です。$i$ 番目のデータが新しいクラスターを作る確率が $\alpha/(\alpha+i)$ なので、その和が期待値になります（中華料理店過程）。

  # ---------- 導出の問題 ----------
  - id: q54-variational-inference-3
    term: variational-inference
    level: 応用
    type: derivation
    question: |
      任意の分布 $q(\theta)$ について、$\log p(x)=\mathrm{ELBO}(q)+\mathrm{KL}\big(q\,\Vert\,p(\theta\mid x)\big)$、$\mathrm{ELBO}(q)=E_q[\log p(x,\theta)]-E_q[\log q(\theta)]$ を導け。
    steps:
      - |
        $\mathrm{KL}(q\Vert p(\cdot\mid x))=E_q[\log q(\theta)]-E_q[\log p(\theta\mid x)]$。
      - |
        $\log p(\theta\mid x)=\log p(x,\theta)-\log p(x)$ を代入すると $\mathrm{KL}=E_q[\log q]-E_q[\log p(x,\theta)]+\log p(x)$。
      - |
        移項して $\log p(x)=E_q[\log p(x,\theta)]-E_q[\log q]+\mathrm{KL}$。
    answer: |
      $\log p(x)=\mathrm{ELBO}(q)+\mathrm{KL}\big(q\Vert p(\theta\mid x)\big)$
    hint: |
      ベイズの定理 $p(\theta\mid x)=p(x,\theta)/p(x)$ を KL の中に入れます。
    explanation: |
      $\log p(x)$ は $q$ によらないので、ELBO を最大にすることは KL を最小にすることと同じです。KL $\ge0$ から ELBO $\le\log p(x)$ も分かります。

  - id: q54-gaussian-process-regression-3
    term: gaussian-process-regression
    level: 標準
    type: derivation
    question: |
      $f\sim\mathcal{GP}(0,k)$、観測 $y=f(x_1)+\varepsilon$（$\varepsilon\sim N(0,\sigma_n^2)$）が 1 個だけのとき、新しい点 $x_*$ での $f(x_*)$ の事後平均と事後分散を求めよ。
    steps:
      - |
        $(f(x_*),y)$ は 2 変量正規で、$V[f(x_*)]=k(x_*,x_*)$、$V[y]=k(x_1,x_1)+\sigma_n^2$、$\mathrm{Cov}=k(x_*,x_1)$。
      - |
        正規分布の条件付き分布より、平均 $\dfrac{k(x_*,x_1)}{k(x_1,x_1)+\sigma_n^2}y$、分散 $k(x_*,x_*)-\dfrac{k(x_*,x_1)^2}{k(x_1,x_1)+\sigma_n^2}$。
    answer: |
      平均 $\dfrac{k(x_*,x_1)\,y}{k(x_1,x_1)+\sigma_n^2}$、分散 $k(x_*,x_*)-\dfrac{k(x_*,x_1)^2}{k(x_1,x_1)+\sigma_n^2}$
    hint: |
      2 変量正規分布の条件付き平均・分散の公式を使います。
    explanation: |
      観測が複数なら、分母の数が行列 $K+\sigma_n^2I$ の逆行列に、$k(x_*,x_1)$ がベクトル $k_*$ に置き換わった一般の公式になります。分散に $y$ が入らないことも分かります。

  # ---------- 重要度 B の 2 問目 ----------
  - id: q54-hamiltonian-monte-carlo-2
    term: hamiltonian-monte-carlo
    level: 応用
    type: numeric
    question: |
      $U(\theta)=\theta^2/2$（標準正規分布）で、$(\theta,p)=(1,0)$ からリープフロッグ法を刻み $\varepsilon=0.5$ で 1 ステップ進めた後のハミルトニアン $H=\theta^2/2+p^2/2$ を求めよ（小数第 4 位まで）。
    answer: 0.4927
    tolerance: 0.0001
    hint: |
      $p\leftarrow p-\frac\varepsilon2\theta$、$\theta\leftarrow\theta+\varepsilon p$、$p\leftarrow p-\frac\varepsilon2\theta$ の順です。
    explanation: |
      $p=-0.25$、$\theta=0.875$、$p=-0.25-0.25\times0.875=-0.46875$ で、$H=0.3828+0.1099\approx0.4927$。最初の $H=0.5$ との差は小さく（数値解の誤差）、採択確率は $\min\{1,e^{0.5-0.4927}\}=1$ です。

  - id: q54-dirichlet-process-2
    term: dirichlet-process
    level: 標準
    type: numeric
    question: |
      $G\sim\mathrm{DP}(\alpha=2,G_0)$ で 8 個の観測 $\theta_1,\dots,\theta_8$ を得た。事後分布の基底分布 $\frac{\alpha G_0+\sum\delta_{\theta_i}}{\alpha+n}$ で、$G_0$ に置かれる重みを求めよ。
    answer: 0.2
    tolerance: 0.0001
    hint: |
      重みは $\alpha/(\alpha+n)$ です。
    explanation: |
      $2/(2+8)=0.2$ で、残りの 0.8 は観測値（経験分布）に置かれます。データが増えるほど、事後分布は経験分布に近づきます。

  - id: q54-waic-2
    term: waic
    level: 標準
    type: choice
    question: |
      WAIC と AIC の関係として正しいものはどれか。
    choices:
      - "WAIC はつねに AIC と等しい"
      - "正則なモデルでデータが多ければ、WAIC は AIC にほぼ等しくなる"
      - "WAIC は真のモデルを選ぶ一致性を持つ規準である"
      - "WAIC は事後分布を使わずに計算する"
    answer: 1
    hint: |
      有効パラメータ数 $p_{\mathrm{WAIC}}$ は、正則なモデルでは何に近づくか。
    explanation: |
      正則なモデルでは $p_{\mathrm{WAIC}}$ がパラメータの数に近づき、WAIC は AIC とほぼ同じになります。WAIC の利点は、AIC の前提が崩れる特異なモデルにも使えることです。真のモデルを選ぶ一致性を目的にするなら BIC を使います。
