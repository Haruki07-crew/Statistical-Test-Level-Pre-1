chapter: 50
questions:
  # ---------- 線形混合モデル (A) ----------
  - id: q50-linear-mixed-model-1
    term: linear-mixed-model
    level: 標準
    type: numeric
    question: |
      ランダム切片モデルで、グループ間の分散 $\sigma_u^2=4$、グループ内の分散 $\sigma^2=12$ とする。観測が 6 個のグループの BLUP の縮小係数 $\lambda=n\sigma_u^2/(n\sigma_u^2+\sigma^2)$ を求めよ（小数第 3 位まで）。
    answer: 0.667
    tolerance: 0.0005
    hint: |
      $n=6$ を代入します。
    explanation: |
      $\lambda=24/(24+12)=2/3\approx0.667$ です。グループ平均と全体の平均の差を、この割合だけ残して予測します（観測が少ないほど全体の平均へ縮む）。級内相関は $4/16=0.25$ です。

  - id: q50-linear-mixed-model-2
    term: linear-mixed-model
    level: 標準
    type: numeric
    question: |
      1 クラスター 20 人、級内相関 $\rho=0.05$ のデータで、全員を独立とみなしたときに平均の分散を何倍過小に見積もるか（デザイン効果 $1+(m-1)\rho$）を求めよ。
    answer: 1.95
    tolerance: 0.0005
    hint: |
      $m=20$ を代入します。
    explanation: |
      $1+19\times0.05=1.95$ 倍です。級内相関が 0.05 と小さくても、クラスターが大きいと標準誤差は約 $\sqrt{1.95}\approx1.40$ 倍に効いてきます。

  # ---------- REML (B) ----------
  - id: q50-reml-1
    term: reml
    level: 標準
    type: numeric
    question: |
      バランスのとれた一元配置の変量効果モデル（4 グループ × 5 観測）で、$MS_A=30$、$MS_E=10$ だった。最尤法（ML）による $\sigma_u^2$ の推定値 $\{(1-1/a)MS_A-MS_E\}/n$ を求めよ。
    answer: 2.5
    tolerance: 0.0001
    hint: |
      $a=4$、$n=5$ です。REML（分散分析法）なら $(MS_A-MS_E)/n$ です。
    explanation: |
      ML は $(0.75\times30-10)/5=2.5$、REML は $(30-10)/5=4$ です。グループが 4 つしかないので、ML は自由度の減少を考えない分だけ小さく見積もります。

  # ---------- GEE (A) ----------
  - id: q50-generalized-estimating-equations-1
    term: generalized-estimating-equations
    level: 標準
    type: truefalse
    question: |
      GEE では、平均のモデルが正しければ、作業相関行列の指定が真の相関と違っていても、回帰係数の推定量は一致性を持つ。
    answer: true
    hint: |
      推定方程式の期待値が 0 になる条件を考えます。
    explanation: |
      正しいです。推定方程式 $\sum D_i^\top V_i^{-1}(y_i-\mu_i)$ の期待値は、平均のモデルが正しければ $V_i$ によらず 0 です。作業相関が外れていても一致性は保たれ、標準誤差はサンドイッチ型で正しく求められます（効率は落ちることがあります）。

  - id: q50-generalized-estimating-equations-2
    term: generalized-estimating-equations
    level: 応用
    type: choice
    question: |
      施設ごとのばらつきがある 2 値データで、ロジスティックの GEE（母集団平均モデル）とランダム切片のロジスティック混合モデル（個体ごとのモデル）の処置効果の係数を比べる。一般に成り立つ関係はどれか。
    choices:
      - "2 つの係数は等しい"
      - "GEE の係数の絶対値のほうが小さい"
      - "GEE の係数の絶対値のほうが大きい"
      - "GEE の係数は符号が逆になる"
    answer: 1
    hint: |
      施設効果で平均すると、ロジットの尺度での効果はどうなるか。
    explanation: |
      非線形のリンクでは、個体ごとの効果を施設効果について平均すると、母集団平均の効果は 0 の方へ薄まります。施設間の SD が 1 の例では、個体ごとの 0.8 に対して母集団平均は約 0.66 でした。線形モデルなら 2 つは一致します。

  # ---------- GLMM (B) ----------
  - id: q50-glmm-1
    term: glmm
    level: 標準
    type: numeric
    question: |
      ロジスティック混合モデルで、ランダム切片の分散が $\sigma^2=4$ だった。潜在変数の尺度での級内相関 $\sigma^2/(\sigma^2+\pi^2/3)$ を求めよ（小数第 3 位まで）。
    answer: 0.549
    tolerance: 0.0005
    hint: |
      ロジスティック分布の分散は $\pi^2/3\approx3.29$ です。
    explanation: |
      $4/(4+3.290)\approx0.549$ です。同じグループの 2 つの観測の、潜在的な連続変数の相関にあたります。個体差がこれだけ大きいと、母集団平均の効果は個体ごとの効果よりかなり小さくなります。

  # ---------- 導出の問題 ----------
  - id: q50-linear-mixed-model-3
    term: linear-mixed-model
    level: 応用
    type: derivation
    question: |
      ランダム切片モデル $y_{ij}=\mu+u_i+\varepsilon_{ij}$（$u_i\sim N(0,\sigma_u^2)$、$\varepsilon_{ij}\sim N(0,\sigma^2)$、$j=1,\dots,n_i$）で、$\mu$ を既知として $E[u_i\mid y_{i1},\dots,y_{in_i}]$ を求めよ。
    steps:
      - |
        $u_i$ と $\bar y_i$ は同時正規で、$\bar y_i$ は十分（$u_i$ に関する情報はグループ平均にまとまる）。$\mathrm{Cov}(u_i,\bar y_i)=\sigma_u^2$、$V[\bar y_i]=\sigma_u^2+\sigma^2/n_i$。
      - |
        正規分布の条件付き期待値より $E[u_i\mid\bar y_i]=\dfrac{\sigma_u^2}{\sigma_u^2+\sigma^2/n_i}(\bar y_i-\mu)$。
    answer: |
      $E[u_i\mid y_i]=\lambda_i(\bar y_i-\mu)$、$\lambda_i=\dfrac{n_i\sigma_u^2}{n_i\sigma_u^2+\sigma^2}$
    hint: |
      2 変量正規分布の条件付き期待値 $\mathrm{Cov}/\mathrm{Var}\times$（偏差）を使います。
    explanation: |
      これが BLUP の縮小係数です。$\mu$ を GLS 推定値に置き換えたものが、実際に使う予測量になります。

  - id: q50-generalized-estimating-equations-3
    term: generalized-estimating-equations
    level: 応用
    type: derivation
    question: |
      GEE の推定方程式 $U(\beta)=\sum_iD_i^\top V_i^{-1}\{y_i-\mu_i(\beta)\}$ が、平均のモデル $E[y_i\mid x_i]=\mu_i(\beta_0)$ が正しければ、作業相関 $R(\alpha)$ によらず $E[U(\beta_0)]=0$ となることを示せ。
    steps:
      - |
        $D_i$ と $V_i$ は $x_i$ と $\beta,\alpha$ だけの関数で、$y_i$ を含まない。
      - |
        $E[U(\beta_0)\mid x]=\sum_iD_i^\top V_i^{-1}E[y_i-\mu_i(\beta_0)\mid x_i]=0$。
      - |
        よって $E[U(\beta_0)]=0$。$V_i$ が真の共分散と違っていてもこの計算は変わらない。
    answer: |
      $E[U(\beta_0)]=0$（作業相関によらない）
    hint: |
      重みの行列 $D_i^\top V_i^{-1}$ は $y$ によらない定数として扱えます。
    explanation: |
      期待値 0 の推定方程式の解は（正則条件のもとで）一致推定量になるので、作業相関を誤っても係数は一致性を保ちます。効率は作業相関が真に近いほど良くなります。
