          - 2 つの湖を合算した 1 つの表からオッズ比を求めた（層別の調整をしていない）
          - 湖 A だけのオッズ比を答えた
          - 湖ごとのオッズ比 2.25 と 1.714 を単純平均した
        explanation: |
          **方針** マンテル・ヘンツェル推定量は $\hat\psi_{MH}=\dfrac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$（$a$：大型・感染あり、$b$：大型・感染なし、$c$：小型・感染あり、$d$：小型・感染なし、$n_k$：層の総数）。

          **途中式**
          湖 A：$a d/n=«A0»\times«A3»/«nA»=«adA»$、$b c/n=«A1»\times«A2»/«nA»=«bcA»$。
          湖 B：$a d/n=«B0»\times«B3»/«nB»=«adB»$、$b c/n=«B1»\times«B2»/«nB»=«bcB»$。
          $$\hat\psi_{MH}=\frac{«adA»+«adB»}{«bcA»+«bcB»}=\frac{«sad»}{«sbc»}=«mh4»$$

          **答え** $«mh»$（湖ごとのオッズ比 «orA» と «orB» の間に入る）

          **間違えやすい点** 2 つの湖を合算した表（大型 «P0»/«P1»、小型 «P2»/«P3»）のオッズ比 «orP» は、湖によって大型の割合と感染率がともに違うことによる交絡を含む。
          各湖の項は層の大きさ $n_k$ で割ってから足す（割らないと $«nos»$）。単純平均 $«orM»$ はマンテル・ヘンツェル推定量ではない。

      - id: s18p07b
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, logit-logistic-transformation]
        topic: 体長を説明変数とする感染のロジスティック回帰で感染確率が半分になる体長とオッズ比の解釈を読む
        level: 基本
        definition: false
        type: choice
        question: |
          湖 A の魚の体長 $x$（cm）を説明変数として、感染の有無をロジスティック回帰に当てはめたところ
          $$\log\frac{p(x)}{1-p(x)}=«b0»+«b1»x$$
          となった（$p(x)$ は体長 $x$ の魚の感染確率）。必要なら $e^{1.2}=«e12»$、$e^{-1.2}=«em12»$ を使え。正しいものはどれか。
        choices:
          - '感染確率が 0.5 になる体長は «x50» cm で、体長が 10 cm 大きいと感染確率が «e12» 倍になる'
          - '感染確率が 0.5 になる体長は «x50» cm で、体長が 10 cm 大きいと感染のオッズが «e12» 倍になる'
          - '感染確率が 0.5 になる体長は «x50» cm で、体長が 10 cm 大きいと感染のオッズが «b10» 倍になる'
          - '体長 «x50» cm 付近では、体長が 1 cm 大きいと感染確率がおよそ «b1» 増える'
          - '体長 20 cm の魚の感染確率は $e^{«lp20»}=«em12»$ である'
        answer: 1
        distractors:
          - オッズの比を確率の比と取り違えた
          - 正解
          - 係数の指数をとり忘れ、10β=1.2 をオッズ比とした
          - 確率の傾き β p(1−p)=0.03 の p(1−p) を掛け忘れた
          - オッズ e^{-1.2} を確率と取り違えた（正しくは 0.3012/1.3012=0.231）
        explanation: |
          **方針** ロジット $=«b0»+«b1»x=0$ のとき $p=0.5$。$x$ が $\Delta$ 増えるとロジット（対数オッズ）が $«b1»\Delta$ 増えるので、オッズは $e^{«b1»\Delta}$ 倍になる。

          **途中式**
          $p=0.5\iff«b0»+«b1»x=0\iff x=«mb0»/«b1»=«x50»$。
          10 cm 大きいとき、オッズ比は $e^{«b1»\times10}=e^{1.2}=«e12»$。
          参考：体長 20 cm ではロジット $=«b0»+«b1»\times20=«lp20»$、オッズ $e^{-1.2}=«em12»$、確率 $«em12»/(1+«em12»)=«p20»$。
          $x=«x50»$ 付近での確率の傾きは $\dfrac{dp}{dx}=«b1»\,p(1-p)=«b1»\times0.25=«slope»$。

          **答え** 感染確率 0.5 の体長は «x50» cm、10 cm 大きいとオッズが «e12» 倍。

          **間違えやすい点** $e^{\beta}$ は**オッズ**の比で、確率の比ではない（確率は 1 を超えられないので、一定の倍率では増えない）。オッズ比は係数そのもの（«b10»）ではなく指数をとったもの。
          確率の変化量は $\beta p(1-p)$ で、$p=0.5$ でも $\beta/4=«slope»$ にとどまる。オッズ $e^{-1.2}$ と確率 «p20» を混同しないこと。

  - id: s18p08
    title: 3種類の餌による成長の比較
    context: |
      養殖魚の稚魚を 3 群に «n» 尾ずつ無作為に分け、餌 A、B、C を 8 週間与えて体重の増加量（g）を測った。各群の平均は A：«mA»、B：«mB»、C：«mC» で、一元配置分散分析の誤差の平均平方は $\mathrm{MSE}=«mse»$（自由度 «dfe»）だった。
    items:
      - id: s18p08a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 3種類の餌の平均増加量の全ての対をテューキーの方法で比べ臨界差と有意な対を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの平均のすべての対を、テューキーの方法（全体の有意水準 5%）で比べる。
          スチューデント化された範囲の分布の上側 5% 点は $q_{0.05}(3,«dfe»)=«q»$（群の数 3、誤差の自由度 «dfe»）、$t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t»$ である。
          臨界差（平均の差がこれを超えれば有意とする値）と、有意な差のある対の組合せとして正しいものはどれか。
        choices:
          - '臨界差 «w2»：A と C の 1 対だけが有意'
          - '臨界差 «w3»：有意な対はない'
          - '臨界差 «w4»：A と B、A と C の 2 対が有意'
          - '臨界差 «lsd»：A と B、A と C の 2 対が有意'
          - '臨界差 «hsd»：A と C の 1 対だけが有意'
        answer: 4
        distractors:
          - q に √(2MSE/n) を掛けた（q を使うときは √(MSE/n)）
          - MSE を n で割り忘れた（q√MSE）
          - q√(MSE/n) をさらに √2 で割った
          - 多重性を考えず、t 分布による最小有意差 t√(2MSE/n) を使った
          - 正解
        explanation: |
          **方針** 各群の大きさが等しいとき、テューキーの方法の臨界差は $q_{0.05}(k,\nu)\sqrt{\mathrm{MSE}/n}$。平均の差の絶対値がこれを超える対を有意とする。

          **途中式**
          $$\text{臨界差}=«q»\times\sqrt{\frac{«mse»}{«n»}}=«q»\times«sq»=«hsd»$$
          平均の差は $|A-B|=«dAB»$、$|A-C|=«dAC»$、$|B-C|=«dBC»$。«hsd» を超えるのは $A$ と $C$ だけ。

          **答え** 臨界差 «hsd»、有意なのは A と C の対だけ。

          **間違えやすい点** 3 対を $t$ 検定で繰り返す最小有意差 $«t»\times\sqrt{2\times«mse»/«n»}=«lsd»$ は全体の有意水準を 5% に保てず、A と B の差 «dAB» まで有意にしてしまう。
          スチューデント化された範囲 $q$ は「平均の最大と最小の差 ÷ 平均の標準誤差 $\sqrt{\mathrm{MSE}/n}$」の分布なので、$\sqrt{2\mathrm{MSE}/n}$ と組み合わせないこと（$t$ 型で書くなら $q/\sqrt2$ と $\sqrt{2\mathrm{MSE}/n}$ の組合せになり、同じ «hsd» になる）。

  - id: s18p09
    title: 給餌量と成長の因果効果
    context: |
      多数の養殖池のデータから、1 日の給餌量 $X$（kg）が 3 か月間の体重増加 $Y$（kg、池の平均）に与える因果効果を知りたい。関係する変数とその因果関係は次の有向非巡回グラフで表せるとする。

      - $Z$：給餌機の型（新型か旧型かを、くじで池に割り当てた）
      - $W$：水温、$A$：藻類の量、$M$：残餌の量、$K$：管理者の点検回数
      - 矢印：$Z\to X$、$W\to X$、$W\to Y$、$W\to A$、$A\to Y$、$X\to Y$、$X\to M$、$M\to Y$、$X\to K$、$Y\to K$

      ここで「因果効果」は $X$ から $Y$ へのすべての経路（$M$ を通るものも含む）による効果とし、変数間の関係は線形とみなす。
    items:
      - id: s18p09a
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, omitted-variable-bias]
        topic: くじで割り当てた給餌機の型を操作変数にして水温が未測定のときの給餌量の効果をワルド推定量で求める
        level: 標準
        definition: false
        type: choice
        question: |
          水温 $W$ を測っていなかった年のデータでは、$Y$ を $X$ に単回帰した傾きは «ols» だった。一方、給餌機の型ごとの平均は次のとおりだった。

          | 給餌機 | $X$ の平均 | $Y$ の平均 |
          |---|---|---|
          | 新型（$Z=1$） | «x1» | «y1» |
          | 旧型（$Z=0$） | «x0» | «y0» |

          $Z$ を操作変数として推定した、給餌量 1 kg あたりの体重増加の効果に最も近い値はどれか。
        choices:
          - '$«iv»$'
          - '$«red»$'
          - '$«inv»$'
          - '$«per»$'
          - '$«ols»$'
        answer: 0
        distractors:
          - 正解
          - Z の Y への効果（誘導形）だけを答え、Z の X への効果で割らなかった
          - 比の分子と分母を逆にした
          - Y の差を新型の X の平均で割った
          - 水温による交絡を含む単回帰の傾きをそのまま使った
        explanation: |
          **方針** $Z$ はくじで割り当てたので $W$ と独立で、$Y$ には $X$ を通してだけ影響する（グラフで $Z$ から出る矢印は $Z\to X$ だけ）。このとき 2 値の操作変数による推定量（ワルド推定量）は
          $\hat\beta_{IV}=\dfrac{\bar Y_{Z=1}-\bar Y_{Z=0}}{\bar X_{Z=1}-\bar X_{Z=0}}$。

          **途中式**
          $$\hat\beta_{IV}=\frac{«y1»-«y0»}{«x1»-«x0»}=\frac{«dy»}{«dx»}=«iv»$$

          **答え** $«iv»$

          **間違えやすい点** 単回帰の傾き «ols» は $X\leftarrow W\to Y$ の経路を通る見かけの関連を含む（水温が高い池ほど給餌量も成長も大きい）ので、効果を過大に見積もる。
          $Z$ の $Y$ への効果 «dy» は「給餌機を変えた効果」で、給餌量 1 kg あたりにするには $Z$ が $X$ を動かした量 «dx» で割る。

      - id: s18p09b
        chapter: 33
        terms: [backdoor-criterion, causal-effect, d-separation]
        topic: 給餌量と成長の有向非巡回グラフでバックドア基準を満たす調整変数の組を選ぶ（中間変数と合流点の子孫を除く）
        level: 応用
        definition: false
        type: choice
        question: |
          水温 $W$、藻類 $A$、残餌 $M$、点検回数 $K$、給餌機 $Z$ がすべて測定できる年のデータで、$X$ から $Y$ への因果効果をバックドア調整で推定したい。
          次のうち、$(X,Y)$ についてバックドア基準を満たす変数の集合はどれか。
        choices:
          - '$\{Z\}$'
          - '$\{A\}$'
          - '$\{W\}$'
          - '$\{W,M\}$'
          - '$\{W,K\}$'
        answer: 2
        distractors:
          - Z は X の原因だがバックドア経路 X←W→Y を遮断しない
          - A は X←W→A→Y は遮断するが X←W→Y を遮断しない
          - 正解
          - M は X の子孫（中間変数）で、調整すると M を通る効果を取り除いてしまう
          - K は X と Y の両方を親にもつ合流点で X の子孫。調整すると X と Y の間に見かけの関連が生じる
        explanation: |
          **方針** バックドア基準：(1) 集合のどの変数も $X$ の子孫でない、(2) $X$ に入る矢印から始まる $X$ と $Y$ の間のすべての経路（バックドア経路）を遮断する。

          **途中式** $X$ に入る矢印は $Z\to X$ と $W\to X$。バックドア経路は
          - $X\leftarrow W\to Y$
          - $X\leftarrow W\to A\to Y$

          （$Z$ からは $X$ 以外への矢印がないので、$Z$ を通るバックドア経路はない。）$\{W\}$ は両方の経路の分岐点 $W$ を条件づけるので両方とも遮断し、$W$ は $X$ の子孫でもない。
          - $\{Z\}$：どちらの経路も遮断しない。
          - $\{A\}$：$X\leftarrow W\to Y$ が開いたまま。
          - $\{W,M\}$、$\{W,K\}$：$M$ と $K$ は $X$ の子孫なので条件 (1) を満たさない。

          **答え** $\{W\}$

          **間違えやすい点** 「関係する変数はできるだけ調整したほうがよい」は誤り。中間変数 $M$ を調整すると $X\to M\to Y$ の効果が消え、合流点 $K$（$X\to K\leftarrow Y$）を調整すると関連が新しく生じる。
          なお $\{W,Z\}$ や $\{W,A\}$ もバックドア基準を満たすが、選択肢にはない。

  - id: s18p10
    title: 湖のプランクトン群集
    context: |
      ある地域の 8 つの湖で、夏の表層水温（℃）と動物プランクトンの種数を調べた。

      | 湖 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
      |---|---|---|---|---|---|---|---|---|
      | 水温 | «t0» | «t1» | «t2» | «t3» | «t4» | «t5» | «t6» | «t7» |
      | 種数 | «s0» | «s1» | «s2» | «s3» | «s4» | «s5» | «s6» | «s7» |
    items:
      - id: s18p10a
        chapter: 13
        terms: [spearman-rank-correlation, kendall-rank-correlation, rank-and-ties]
        topic: 8つの湖の水温と動物プランクトン種数の順位からスピアマンの順位相関係数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          水温と種数のスピアマンの順位相関係数に最も近い値はどれか（同順位はない）。
        choices:
          - '$«r_inv»$'
          - '$«tau»$'
          - '$«r_den»$'
          - '$«rho»$'
          - '$«r_no6»$'
        answer: 3
        distractors:
          - 1 から引くのを忘れ、6Σd²/(n(n²−1)) を答えた
          - ケンドールの順位相関係数を計算した
          - 分母を n²(n−1) とした
          - 正解
          - 係数 6 を掛け忘れた
        explanation: |
          **方針** それぞれの変数を小さい順に順位に直し、順位の差 $d_i$ から $r_s=1-\dfrac{6\sum d_i^2}{n(n^2-1)}$ を計算する（同順位がないとき、順位どうしのピアソン相関係数と一致する）。

          **途中式**

          | 湖 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | 水温の順位 | «rt0» | «rt1» | «rt2» | «rt3» | «rt4» | «rt5» | «rt6» | «rt7» |
          | 種数の順位 | «rs0» | «rs1» | «rs2» | «rs3» | «rs4» | «rs5» | «rs6» | «rs7» |

          $\sum d_i^2=«d2list»=«sd2»$。
          $$r_s=1-\frac{6\times«sd2»}{«n»\times(«n»^2-1)}=1-\frac{«num»}{«den»}=«rho4»$$

          **答え** $«rho»$

          **間違えやすい点** 分母は $n(n^2-1)=«den»$（$n^2(n-1)$ とすると $«r_den»$）。ケンドールの $\tau$（一致対 «conc»、不一致対 «disc» から $«tau»$）とは別の量。

      - id: s18p10b
        chapter: 24
        terms: [average-linkage, hierarchical-clustering, single-linkage, complete-linkage]
        topic: 5つの湖のプランクトン群集の非類似度から群平均法で階層的クラスタリングを行い最後の結合距離を求める
        level: 標準
        definition: false
        type: choice
        question: |
          このうち 5 つの湖 P、Q、R、S、T のプランクトン群集の種組成から、湖どうしの非類似度を次のように定めた。

          | | P | Q | R | S | T |
          |---|---|---|---|---|---|
          | P | 0 | «AB» | «AC» | «AD» | «AE» |
          | Q | «AB» | 0 | «BC» | «BD» | «BE» |
          | R | «AC» | «BC» | 0 | «CD» | «CE» |
          | S | «AD» | «BD» | «CD» | 0 | «DE» |
          | T | «AE» | «BE» | «CE» | «DE» | 0 |

          群平均法（2 つのクラスターの距離を、異なるクラスターに属する湖のすべての組の非類似度の平均とする）で階層的クラスタリングを行う。最後（4 回目）の結合が起こる距離はどれか。
        choices:
          - '$«single»$'
          - '$«wpgma»$'
          - '$«fin»$'
          - '$«ab_de»$'
          - '$«complete»$'
        answer: 2
        distractors:
          - 最短距離法で計算した
          - クラスター距離の平均を、湖の数で重みづけせずに単純平均した（重み付き群平均法）
          - 正解
          - 2 回目の結合の後、{P,Q} と {S,T} を先に結合すると誤った
          - 最長距離法で計算した
        explanation: |
          **方針** 最も近い 2 つのクラスターを結合し、新しいクラスターとほかのクラスターの距離を「すべての組の非類似度の平均」で計算し直すことを繰り返す。

          **途中式**
          1 回目：最小は $d(P,Q)=«AB»$ → $\{P,Q\}$。
          $d(\{P,Q\},R)=(«AC»+«BC»)/2=«ab_c»$、$d(\{P,Q\},S)=«ab_d»$、$d(\{P,Q\},T)=«ab_e»$。
          2 回目：残りの最小は $d(S,T)=«DE»$ → $\{S,T\}$。
          $d(\{P,Q\},\{S,T\})=(«AD»+«AE»+«BD»+«BE»)/4=«ab_de»$、$d(R,\{S,T\})=(«CD»+«CE»)/2=«c_de»$。
          3 回目：最小は $d(R,\{S,T\})=«c_de»$ → $\{R,S,T\}$。
          4 回目：$\{P,Q\}$ と $\{R,S,T\}$ の 6 組の平均
          $$\frac{«AC»+«BC»+«AD»+«AE»+«BD»+«BE»}{6}=\frac{«fin_sum»}{6}=«fin»$$

          **答え** $«fin»$

          **間違えやすい点** 3 回目の後に $\{P,Q\}$ と $\{R,S,T\}$ の距離を、$d(\{P,Q\},R)=«ab_c»$ と $d(\{P,Q\},\{S,T\})=«ab_de»$ の単純平均で $«wpgma»$ とするのは誤り。群平均法では、湖 1 つの $R$ と 2 つの $\{S,T\}$ を個体数で重みづける（$(1\times«ab_c»+2\times«ab_de»)/3=«fin»$）。
          最短距離法なら $«single»$、最長距離法なら $«complete»$ になる。

  - id: s18p11
    title: 二枚貝の近縁種の形態計測
    context: |
      外見がよく似た二枚貝の近縁種 1、2 を、殻の計測値で見分けたい。標本から求めた殻長 $x_1$（mm）と殻高 $x_2$（mm）の平均ベクトルは、種 1 が $(«m11»,«m12»)$、種 2 が $(«m21»,«m22»)$ で、2 種に共通の（プールした）分散共分散行列は
      $$S=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
      だった。
    items:
      - id: s18p11a
        chapter: 23
        terms: [fisher-linear-discriminant-function, linear-discriminant-analysis, mahalanobis-distance]
        topic: 二枚貝2種の殻長と殻高の平均と共通の分散共分散行列から線形判別関数の値を計算して新しい個体を判別する
        level: 標準
        definition: false
        type: choice
        question: |
          線形判別関数 $z(\boldsymbol x)=(\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2)^\top S^{-1}\left(\boldsymbol x-\dfrac{\bar{\boldsymbol x}_1+\bar{\boldsymbol x}_2}{2}\right)$ を使い、$z>0$ なら種 1、$z<0$ なら種 2 と判別する（2 種の事前確率と誤判別の損失は等しいとする）。
          殻長 «x1» mm、殻高 «x2» mm の個体について正しいものはどれか。
        choices:
          - '$z=«zS»$ で正なので種 1'
          - '$z=«zE»$ で正なので種 1'
          - '$z=«z»$ で負なので種 2'
          - '$z=«z»$ で負なので種 1'
          - '$z=0.50$ で正なので種 1'
        answer: 2
        distractors:
          - S の逆行列ではなく S そのものを掛けた
          - S^{-1} を掛けず、平均の差ベクトルとの内積（ユークリッド距離の比較と同じ）で判別した
          - 正解
          - 符号と判別先の対応を逆にした
          - x と中点の差の向きを逆にして符号を誤った
        explanation: |
          **方針** 係数ベクトル $\boldsymbol w=S^{-1}(\bar{\boldsymbol x}_1-\bar{\boldsymbol x}_2)$ を求め、個体と 2 つの平均の中点との差との内積をとる。

          **途中式** $\det S=«s11»\times«s22»-«s12»^2=«det»$、$S^{-1}=\dfrac{1}{«det»}\begin{pmatrix}«s22»&-«s12»\\-«s12»&«s11»\end{pmatrix}$。
          平均の差は $(«d1»,«d2»)$ なので
          $$\boldsymbol w=\frac{1}{«det»}\begin{pmatrix}«s22»\times«d1»-«s12»\times«d2»\\-«s12»\times«d1»+«s11»\times«d2»\end{pmatrix}=\begin{pmatrix}«w1»\\«w2»\end{pmatrix}$$
          中点は $(«mid1»,«mid2»)$、個体との差は $(«dx1»,«dx2»)$。
          $$z=«w1»\times«dx1»+«w2»\times(«dx2»)=«z»<0$$

          **答え** $z=«z»$ で種 2 と判別する。

          **間違えやすい点** $S^{-1}$ を掛けずに平均の差 $(«d1»,«d2»)$ との内積をとると $«zE»>0$ で種 1 になる（相関とばらつきの違いを無視した判別）。$S$ を掛けると $(«Sd1»,«Sd2»)$ との内積で $«zS»$ になる。
          殻高のばらつきが大きいことと殻長・殻高の正の相関を考えると、この個体の殻高の低さが種 2 の特徴として強く効く。

      - id: s18p11b
        chapter: 25
        terms: [factor-score, factor-analysis-model, factor-loading]
        topic: 殻の3つの計測値の1因子モデルで回帰法（トムソン法）による個体の因子得点を求める
        level: 応用
        definition: false
        type: choice
        question: |
          種 1 の個体の殻長・殻高・殻幅をそれぞれ標準化した値 $x_1,x_2,x_3$ に、1 因子モデル
          $$x_j=\lambda_jf+e_j\quad(j=1,2,3),\qquad V[f]=1,\ V[e_j]=\psi_j,\ f\text{ と }e_j\text{ は互いに独立}$$
          を当てはめたところ、因子負荷量は $\lambda=(«l1»,«l2»,«l3»)$、独自分散は $\psi=(«p1»,«p2»,«p3»)$ だった。$f$ と $e_j$ はすべて正規分布に従うとする。
          標準化した計測値が $(«x1f»,«x2f»,«x3f»)$ の個体について、回帰法（トムソン法）による因子得点 $\hat f=E[f\mid\boldsymbol x]$ に最も近い値はどれか。
          なお $\boldsymbol\lambda^\top(\boldsymbol\lambda\boldsymbol\lambda^\top+\Psi)^{-1}=\dfrac{\boldsymbol\lambda^\top\Psi^{-1}}{1+\boldsymbol\lambda^\top\Psi^{-1}\boldsymbol\lambda}$ が成り立つ（$\Psi$ は $\psi_j$ を対角に並べた行列）。
        choices:
          - '$«bart»$'
          - '$«lx»$'
          - '$«mean»$'
          - '$«lsum»$'
          - '$«reg»$'
        answer: 4
        distractors:
          - 分母の 1 を忘れた（バートレット法の因子得点）
          - 負荷量で重みづけた和 λ'x をそのまま答えた
          - 3 つの計測値を単純平均した
          - λ'x/λ'λ（独自分散の違いを無視した最小二乗）を計算した
          - 正解
        explanation: |
          **方針** $(f,\boldsymbol x)$ は同時正規分布で、$\mathrm{Cov}(f,\boldsymbol x)=\boldsymbol\lambda^\top$、$V[\boldsymbol x]=\boldsymbol\lambda\boldsymbol\lambda^\top+\Psi$。条件付き期待値は $E[f\mid\boldsymbol x]=\boldsymbol\lambda^\top(\boldsymbol\lambda\boldsymbol\lambda^\top+\Psi)^{-1}\boldsymbol x$ で、与えられた等式を使うと
          $$\hat f=\frac{\sum_j(\lambda_j/\psi_j)x_j}{1+\sum_j\lambda_j^2/\psi_j}$$

          **途中式** $\lambda_j/\psi_j=(«lp1»,«lp2»,«lp3»)$、$\lambda_j^2/\psi_j=(«q1»,«q2»,«q3»)$。
          $$\text{分子}=«lp1»\times«x1f»+«lp2»\times«x2f»+«lp3»\times(«x3f»)=«num»$$
          $$\text{分母}=1+«q1»+«q2»+«q3»=«den1»$$
          $$\hat f=\frac{«num»}{«den1»}=«reg4»$$

          **答え** $«reg»$

          **間違えやすい点** 分母の 1 を落とすとバートレット法（重み付き最小二乗）の得点 $«num»/«den»=«bart»$ になる。回帰法は事前の $f\sim N(0,1)$ の分だけ 0 の方向に縮む。
          独自分散の小さい（因子をよく反映する）殻長に大きな重みがかかる点も、単純平均 «mean» や $\boldsymbol\lambda^\top\boldsymbol x=«lx»$ とは異なる。

  - id: s18p12
    title: 再導入した個体群の存続
    context: |
      絶滅のおそれのある小型哺乳類を、ある島に «i0» 頭再導入した。単純なモデルとして、個体数は 1 年ごとに独立に、確率 «pu» で 1 頭増え、確率 «qd» で 1 頭減るとする。
      個体数が 0 になったら絶滅、«N» 頭に達したら「定着した」として観察を終える。
    items:
      - id: s18p12a
        chapter: 15
        terms: [random-walk, gambler-ruin-problem, absorbing-state]
        topic: 個体数が1頭ずつ増減するランダムウォークで定着より先に絶滅する確率をギャンブラーの破産問題として求める
        level: 標準
        definition: false
        type: numeric
        question: |
          個体数が «N» 頭に達する前に絶滅する確率を求めよ。
        answer: «ruin»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 個体数 $i$ から始めて先に 0 に達する確率を $u_i$ とすると、1 年目で分けて $u_i=«pu»\,u_{i+1}+«qd»\,u_{i-1}$、$u_0=1$、$u_{«N»}=0$。これはギャンブラーの破産問題と同じで、$r=q/p$ とすると
          $$u_i=\frac{r^i-r^{N}}{1-r^{N}}$$

          **途中式** $r=«qd»/«pu»=2/3$、$r^{«i0»}=«r3»$、$r^{«N»}=«r8»$。
          $$u_{«i0»}=\frac{«r3»-«r8»}{1-«r8»}=\frac{«num»}{«den»}=«ruin4»\cdots$$

          **答え** $«ruin_s»$（定着する確率は $«succ»$）

          **間違えやすい点** 上限の «N» 頭を考えない（いくらでも増えられる）場合の絶滅確率 $r^{«i0»}=«ruin_inf»$ とは異なる。$r$ は（減る確率）/（増える確率）で、逆にすると 1 を超えて確率にならない。

      - id: s18p12b
        chapter: 32
        terms: [box-muller-method, uniform-random-number, normal-distribution]
        topic: 個体群シミュレーションの環境変動をボックス・ミュラー法で2つの一様乱数から正規乱数に変換して作る
        level: 基本
        definition: false
        type: choice
        question: |
          より現実的なシミュレーションでは、年ごとの増加率を $R=«mu»+«sg»Z$（$Z$ は標準正規乱数）とする。区間 $(0,1)$ の一様乱数 $U_1=«u1»$、$U_2=«u2»$ から、ボックス・ミュラー法
          $$Z=\sqrt{-2\log U_1}\,\cos(2\pi U_2)\quad(\log\text{ は自然対数})$$
          で $Z$ を作る。必要なら $\log «u1»=«ln1»$、$\log «u2»=«ln2»$、$\cos(0.4\pi)=«c1»$、$\sin(0.4\pi)=«s1»$、$\cos(0.6\pi)=«c2»$ を使え。
          得られる増加率 $R$ に最も近い値はどれか。
        choices:
          - '$«g»$'
          - '$«g_nosq»$'
          - '$«g_sin»$'
          - '$«g_swap»$'
          - '$«g_no2»$'
        answer: 0
        distractors:
          - 正解
          - 平方根をとり忘れた
          - cos の代わりに sin を使った（もう一方の正規乱数）
          - U1 と U2 の役割を入れ替えた
          - −2 log U1 の 2 を落とした
        explanation: |
          **方針** 式どおり $-2\log U_1$ の平方根と $\cos(2\pi U_2)$ を掛けて $Z$ を作り、$R=«mu»+«sg»Z$ に代入する。

          **途中式** $-2\log «u1»=-2\times(«ln1»)=«m2ln»$、$\sqrt{«m2ln»}=«sqv»$、$2\pi\times«u2»=0.4\pi$ より
          $$Z=«sqv»\times«c1»=«z»,\qquad R=«mu»+«sg»\times«z»=«g5»$$

          **答え** $«g»$

          **間違えやすい点** $U_1$ は半径（$\sqrt{-2\log U_1}$）、$U_2$ は角度（$2\pi U_2$）に使う。入れ替えると $«g_swap»$ になる。
          $\sin$ を使った $\sqrt{-2\log U_1}\sin(2\pi U_2)$ ももう 1 つの独立な標準正規乱数だが、問題で指定した式ではない（$«g_sin»$）。
