      - id: s18p12a
        chapter: 15
        terms: [brownian-motion, reflection-principle]
        topic: 放流魚の位置をブラウン運動とみて一定日数以内に下流の堰に到達する確率を反射原理で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          放流点の «a» km 下流に堰がある。放流から «T» 日以内に魚が少なくとも 1 度は堰の位置に達する確率 $P\left(\max_{0\le t\le«T»}B(t)\ge«a»\right)$ を求めよ。
          必要なら $\Phi(0.17)=«ph017»$、$\Phi(0.33)=«ph033»$、$\Phi(1.00)=«ph1»$ を使え。
        answer: «ok»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 反射原理：初めて $a$ に達した時刻以降の道を折り返すと、$P(\max_{t\le T}B(t)\ge a)=2P(B(T)\ge a)$ が成り立つ。

          **途中式** $B(«T»)\sim N(0,\ «s2»\times«T»)=N(0,«vT»)$、標準偏差 «sd»。
          $$P\left(\max_{t\le«T»}B(t)\ge«a»\right)=2P(B(«T»)\ge«a»)=2\left\{1-\Phi\left(\frac{«a»}{«sd»}\right)\right\}=2\times(1-«ph1»)=«ok4»$$

          **答え** $«ok_s»$

          **間違えやすい点** «T» 日目の位置だけを見た $P(B(«T»)\ge«a»)=«w1»$ は、途中で堰に達してから上流に戻った道を数えていない。
          標準偏差は $\sqrt{«s2»\times«T»}=«sd»$（分散 «vT» で割ると $z=«z_var»$、$\sqrt{«s2»}\times«T»$ で割ると $z=«z_lin»$ になり誤り）。

      - id: s18p12b
        chapter: 32
        terms: [box-muller-method, uniform-random-number, brownian-motion]
        topic: 放流魚の移動のシミュレーションで1日分の変位をボックス・ミュラー法で2つの一様乱数から作る
        level: 基本
        definition: false
        type: choice
        question: |
          このブラウン運動をシミュレーションで再現するため、1 日分の変位 $B(1)-B(0)=\sqrt{«s2»}\,Z$（$Z$ は標準正規乱数）を作る。区間 $(0,1)$ の一様乱数 $U_1=«u1»$、$U_2=«u2»$ から、ボックス・ミュラー法
          $$Z=\sqrt{-2\log U_1}\,\cos(2\pi U_2)\quad(\log\text{ は自然対数})$$
          で $Z$ を作る。必要なら $\log «u1»=«ln1»$、$\log «u2»=«ln2»$、$\cos(0.4\pi)=«c1»$、$\sin(0.4\pi)=«s1»$、$\cos(0.6\pi)=«c2»$ を使え。
          1 日目の変位（km）に最も近い値はどれか。
        choices:
          - '$«g»$'
          - '$«g_swap»$'
          - '$«g_no2»$'
          - '$«g_nosq»$'
          - '$«g_sin»$'
        answer: 0
        distractors:
          - 正解
          - U1 と U2 の役割を入れ替えた
          - −2 log U1 の 2 を落とした
          - 平方根をとり忘れた
          - cos の代わりに sin を使った（もう一方の正規乱数）
        explanation: |
          **方針** 式どおり $-2\log U_1$ の平方根と $\cos(2\pi U_2)$ を掛けて $Z$ を作り、標準偏差 $\sqrt{«s2»}=«k»$ を掛ける。

          **途中式** $-2\log «u1»=-2\times(«ln1»)=«m2ln»$、$\sqrt{«m2ln»}=«sqv»$、$2\pi\times«u2»=0.4\pi$ より
          $$Z=«sqv»\times«c1»=«z»,\qquad B(1)-B(0)=«k»\times«z»=«g4»$$

          **答え** $«g»$ km

          **間違えやすい点** $U_1$ は半径（$\sqrt{-2\log U_1}$）、$U_2$ は角度（$2\pi U_2$）に使う。入れ替えると $«g_swap»$ になる。
          $\sin$ を使った $\sqrt{-2\log U_1}\sin(2\pi U_2)$ ももう 1 つの独立な標準正規乱数だが、問題で指定した式ではない（$«g_sin»$）。
