        chapter: 28
        terms: [phi-coefficient-and-association, two-by-two-table, odds-ratio-interval]
        topic: 50地点での2種の在不在の2×2表から種間の結びつきをファイ係数で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          水系の «n» 地点で、魚種 X と魚種 Y の在・不在を調べた。

          | | Y あり | Y なし | 計 |
          |---|---|---|---|
          | X あり | «a» | «b» | «r1» |
          | X なし | «c» | «d» | «r2» |
          | 計 | «k1» | «k2» | «n» |

          2 種の在不在の結びつきを表すファイ係数（2 つの 0-1 変数の相関係数）を求めよ。
        answer: «phi»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 2×2 表のファイ係数は $\phi=\dfrac{ad-bc}{\sqrt{(a+b)(c+d)(a+c)(b+d)}}$。これは「X あり」「Y あり」を 1 とする 0-1 変数の積率相関係数そのもの。

          **途中式**
          $$\phi=\frac{«a»\times«d»-«b»\times«c»}{\sqrt{«r1»\times«r2»\times«k1»\times«k2»}}=\frac{«adbc»}{\sqrt{«prod»}}=\frac{«adbc»}{«sq»}=«phi4»$$

          **答え** $«phi_s»$（正の結びつき：X がいる地点には Y もいやすい）

          **間違えやすい点** ピアソンのカイ二乗統計量とは $\chi^2=n\phi^2=«chi»$ の関係にあり、混同しないこと。
          オッズ比 $ad/(bc)=«orr»$ やユールの関連係数 $Q=(ad-bc)/(ad+bc)=«yq»$ も結びつきの指標だが、ファイ係数とは別の量。

  - id: s18p11
    title: 希少な二枚貝の調査
    context: |
      池や水路にすむ希少な二枚貝について、生息の確認と形態の測定を行う。
    items:
      - id: s18p11a
        chapter: 23
        terms: [sensitivity-and-specificity, roc-curve-and-auc, confusion-matrix]
        topic: 環境DNAの検出スコアで生息の有無を判定する閾値ごとに感度と特異度を求めユーデン指数が最大の閾値を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          水を採って調べる環境 DNA の検出スコアで、この二枚貝の生息を判定したい。採捕調査で生息が確かめられている池 «np» か所と、いないことが確かめられている池 «na» か所のスコアは次のとおりだった。

          | 生息あり | «pres» |
          |---|---|
          | 生息なし | «absn» |

          「スコアが閾値 $c$ 以上なら生息ありと判定する」とし、$c=3,5,7$ のうちユーデン指数 $J=\text{感度}+\text{特異度}-1$ が最大になるものを選ぶ。正しいものはどれか。
        choices:
          - '$c=3$：感度 «se3» が最も高いので $c=3$ を選ぶ'
          - '$c=7$：感度 «se7»、特異度 «sp7»、$J=«J7»$ が最大'
          - '$c=7$：感度 «se7»、偽陽性率 «fp7» の和 0.625 が最大'
          - '$c=5$：感度 «se5»、特異度 «sp5»、$J=«J5»$ が最大'
          - '$c=5$：感度 «se5»、特異度 «sp5»、$J=1.500$ が最大'
        answer: 3
        distractors:
          - 感度だけで閾値を選んだ（特異度が下がることを無視）
          - J の値を比べ誤った（c=7 の J は 0.375）
          - 特異度の代わりに偽陽性率を足した
          - 正解
          - J から 1 を引き忘れた
        explanation: |
          **方針** 感度＝生息ありの池のうち陽性と判定される割合、特異度＝生息なしの池のうち陰性と判定される割合。閾値ごとに数えて $J$ を比べる。

          **途中式**

          | 閾値 $c$ | 感度 | 特異度 | $J$ |
          |---|---|---|---|
          | 3 | «se3» | «sp3» | «J3» |
          | 5 | «se5» | «sp5» | «J5» |
          | 7 | «se7» | «sp7» | «J7» |

          例えば $c=5$ では、生息ありの 8 か所のうちスコア 5 以上は 6 か所（感度 «se5»）、生息なしの 8 か所のうち 5 未満は 6 か所（特異度 «sp5»）。

          **答え** $c=5$（$J=«J5»$）

          **間違えやすい点** 閾値を下げると感度は上がるが特異度は下がる（ROC 曲線上を動く）。どちらか一方だけで選ばない。ユーデン指数は ROC 曲線上で対角線から最も離れた点に対応する。

      - id: s18p11b
        chapter: 25
        terms: [factor-loading, communality, factor-analysis-model]
        topic: 2因子直交モデルの因子負荷量から殻の2形質のモデル上の相関を求め観測相関との残差で当てはまりを見る
        level: 標準
        definition: false
        type: choice
        question: |
          この二枚貝の殻の 4 形質（標準化した値）に、直交 2 因子モデル（因子どうしは無相関、分散 1）を当てはめたところ、因子負荷量は次のとおりだった。

          | 形質 | 第 1 因子 | 第 2 因子 |
          |---|---|---|
          | 殻長 | «len0» | «len1» |
          | 殻高 | «hgt0» | «hgt1» |
          | 殻幅 | «wid0» | «wid1» |
          | 殻重 | «wt0» | «wt1» |

          殻長と殻幅の観測された相関係数は «robs» である。モデルが再現する殻長と殻幅の相関と、残差（観測 − モデル）の組として正しいものはどれか。
        choices:
          - '再現相関 «f1»、残差 «rf1»'
          - '再現相関 «hh»、残差 «rhh»'
          - '再現相関 «rep»、残差 «res»'
          - '再現相関 «rep»、残差 «mres»'
          - '再現相関 «hl»、残差 «rhl»'
        answer: 2
        distractors:
          - 第 1 因子の負荷量の積だけで、第 2 因子の分を足し忘れた
          - 2 形質の共通性の積を相関とした
          - 正解
          - 残差を「モデル − 観測」で計算した
          - 殻長の共通性を相関と取り違えた
        explanation: |
          **方針** 直交因子モデル $x_j=\lambda_{j1}f_1+\lambda_{j2}f_2+e_j$ では、異なる形質の相関は独自因子が効かず、負荷量の積の和 $\lambda_{i1}\lambda_{j1}+\lambda_{i2}\lambda_{j2}$ になる。

          **途中式**
          $$\rho_{\text{長,幅}}=«len0»\times«wid0»+«len1»\times«wid1»=«p1»+«p2»=«rep»$$
          $$\text{残差}=«robs»-«rep»=«res»$$

          **答え** 再現相関 «rep»、残差 «res»（残差が小さく、この組はよく再現されている）

          **間違えやすい点** 第 1 因子だけでは «f1» で、第 2 因子を通した関連を見落とす。共通性（殻長では $«len0»^2+«len1»^2=«hl»$、独自分散 «ul»）は同じ形質どうしの量で、2 形質の相関ではない。
          直交回転をしても負荷量の積の和（再現相関）と共通性は変わらない。

  - id: s18p12
    title: ミジンコのクローンの増殖
    context: |
      単為生殖で増えるミジンコを 1 個体から飼育する。各個体は互いに独立に、単位時間（日）あたりの率 $\lambda=«lam»$ で 1 個体を産み（死亡はないとする）、個体数 $N(t)$ は $N(0)=1$ の純出生過程（ユール過程）に従うとする。
      このとき $N(t)$ は $P(N(t)=n)=e^{-\lambda t}(1-e^{-\lambda t})^{n-1}$（$n=1,2,\ldots$）の幾何分布に従う。
    items:
      - id: s18p12a
        chapter: 15
        terms: [pure-birth-process, geometric-distribution]
        topic: 1個体から始まる純出生過程（ユール過程）でt日後の個体数が幾何分布に従うことから一定数以上になる確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          飼育開始から «t» 日後に個体数が «k» 個体以上になっている確率 $P(N(«t»)\ge«k»)$ を求めよ。必要なら $e^{-1}=«em»$ を使え。
        answer: «ok»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 幾何分布 $P(N=n)=\pi(1-\pi)^{n-1}$（$\pi=e^{-\lambda t}$）の上側確率は $P(N\ge k)=(1-\pi)^{k-1}$（最初の $k-1$ 回の「試行」がすべて失敗する確率）。

          **途中式** $\lambda t=«lam»\times«t»=«lt»$ より $\pi=e^{-1}=«em»$、$1-\pi=«q»$。
          $$P(N(«t»)\ge«k»)=(1-\pi)^{«k»-1}=«q»^{«km1»}=«ok4»$$

          **答え** $«ok_s»$（参考：平均は $e^{\lambda t}=e\approx«mean»$ 個体）

          **間違えやすい点** 指数は $k-1=«km1»$（$k$ とすると $«q»^{«k»}=«w_k»$ で $P(N\ge«k»+1)$ になる）。ちょうど «k» 個体の確率 $\pi(1-\pi)^{«km1»}=«eq»$ と取り違えないこと。
          ユール過程では個体数が増えるほど出生の率も比例して大きくなるので、ポアソン過程（一定の率で増える）とは分布が違う。

      - id: s18p12b
        chapter: 32
        terms: [box-muller-method, uniform-random-number, normal-distribution]
        topic: 個体群の増殖シミュレーションで日ごとの環境変動をボックス・ミュラー法で2つの一様乱数から正規乱数に変換して作る
        level: 基本
        definition: false
        type: choice
        question: |
          より現実的なシミュレーションでは、日ごとの出生率を $R=«mu»+«sg»Z$（$Z$ は標準正規乱数）として水温などの環境変動を入れる。区間 $(0,1)$ の一様乱数 $U_1=«u1»$、$U_2=«u2»$ から、ボックス・ミュラー法
          $$Z=\sqrt{-2\log U_1}\,\cos(2\pi U_2)\quad(\log\text{ は自然対数})$$
          で $Z$ を作る。必要なら $\log «u1»=«ln1»$、$\log «u2»=«ln2»$、$\cos(0.4\pi)=«c1»$、$\sin(0.4\pi)=«s1»$、$\cos(0.6\pi)=«c2»$ を使え。
          得られる出生率 $R$ に最も近い値はどれか。
        choices:
          - '$«g_swap»$'
          - '$«g»$'
          - '$«g_no2»$'
          - '$«g_nosq»$'
          - '$«g_sin»$'
        answer: 1
        distractors:
          - U1 と U2 の役割を入れ替えた
          - 正解
          - −2 log U1 の 2 を落とした
          - 平方根をとり忘れた
          - cos の代わりに sin を使った（もう一方の正規乱数）
        explanation: |
          **方針** 式どおり $-2\log U_1$ の平方根と $\cos(2\pi U_2)$ を掛けて $Z$ を作り、$R=«mu»+«sg»Z$ に代入する。

          **途中式** $-2\log «u1»=-2\times(«ln1»)=«m2ln»$、$\sqrt{«m2ln»}=«sqv»$、$2\pi\times«u2»=0.4\pi$ より
          $$Z=«sqv»\times«c1»=«z»,\qquad R=«mu»+«sg»\times«z»=«g5»$$

          **答え** $«g»$

          **間違えやすい点** $U_1$ は半径（$\sqrt{-2\log U_1}$）、$U_2$ は角度（$2\pi U_2$）に使う。入れ替えると $«g_swap»$ になる。
          $\sin$ を使った $\sqrt{-2\log U_1}\sin(2\pi U_2)$ ももう 1 つの独立な標準正規乱数だが、問題で指定した式ではない（$«g_sin»$）。
