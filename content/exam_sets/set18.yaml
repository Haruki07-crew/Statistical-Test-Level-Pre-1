    title: 川と湖の魚類調査
    context: |
      ある水系で魚類の調査を行った。小問ごとに別のデータを使う。
    items:
      - id: s18p10a
        chapter: 24
        terms: [number-of-clusters, k-means-method, hierarchical-clustering]
        topic: 体長データを2群と3群に分けたときのカリンスキー・ハラバシュ指標を群内・群間平方和から求めクラスター数を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          ある川で採集したアユ 8 尾の体長（cm）は次のとおりだった。

          | 体長 | 11 | 12 | 13 | 18 | 19 | 20 | 30 | 31 |
          |---|---|---|---|---|---|---|---|---|

          これを 2 群（{11〜20} と {30, 31}）に分ける案と、3 群（{11, 12, 13}、{18, 19, 20}、{30, 31}）に分ける案を、カリンスキー・ハラバシュ指標
          $$\mathrm{CH}(k)=\frac{B/(k-1)}{W/(n-k)}\qquad(B\text{：群間平方和},\ W\text{：群内平方和},\ n\text{：データ数})$$
          で比べる。2 群の案では $\mathrm{CH}(2)=«CH2»$ だった。3 群の案の $\mathrm{CH}(3)$ と、指標が大きいほうを選ぶときの結論の組として正しいものはどれか。
        choices:
          - '$\mathrm{CH}(3)=«ch_inv»$ で、2 群を選ぶ'
          - '$\mathrm{CH}(3)=«ch_raw»$ で、3 群を選ぶ'
          - '$\mathrm{CH}(3)=«ch_n4»$ で、3 群を選ぶ'
          - '$\mathrm{CH}(3)=«ch_nok»$ で、3 群を選ぶ'
          - '$\mathrm{CH}(3)=«CH3»$ で、3 群を選ぶ'
        answer: 4
        distractors:
          - B と W の比を逆にした
          - 自由度で割らずに B/W とした
          - W を割る自由度を n−k ではなく n−k−1 とした
          - B を k−1 で割り忘れた
          - 正解
        explanation: |
          **方針** 全平方和 $T$ を求め、各群の平均からの偏差平方和の合計 $W$ を引いて $B=T-W$ とする。群の数が増えると $W$ は必ず減るので、自由度で割って比べる。

          **途中式** 全体の平均は $154/8=«gm»$、全平方和 $T=«T»$。
          3 群の案：各群の平均は 12、19、30.5 で、$W=2+2+0.5=«W3»$、$B=«T»-«W3»=«Bss3»$。
          $$\mathrm{CH}(3)=\frac{«Bss3»/2}{«W3»/(8-3)}=\frac{«B3h»}{«W3h»}=«CH3»$$
          （2 群の案は $W=«W2»$ で $\mathrm{CH}(2)=«CH2»$。）$«CH3»>«CH2»$ なので 3 群を選ぶ。

          **答え** $\mathrm{CH}(3)=«CH3»$、3 群を選ぶ（年級群が 3 つあると読める）。

          **間違えやすい点** 群内平方和 $W$ だけで比べると群を増やすほど小さくなり、いつも群の多い案が選ばれてしまう。CH 指標は群間の分散と群内の分散の比を自由度で調整したもので、分散分析の $F$ 統計量と同じ形をしている。

