set: 18
title: 模擬試験 第18回
minutes: 90
problems:
  - id: s18p01
    title: 魚の集団の遺伝子頻度
    context: |
      ある湖の魚の集団で、電気泳動で 3 つの遺伝子型をすべて見分けられる（共優性の）遺伝子座を調べた。対立遺伝子は $A$ と $a$ の 2 つで、無作為に採集した «n» 尾の遺伝子型は次のとおりだった。

      | 遺伝子型 | $AA$ | $Aa$ | $aa$ | 計 |
      |---|---|---|---|---|
      | 尾数 | «nAA» | «nAa» | «naa» | «n» |

      対立遺伝子 $A$ の頻度を $p$ とする。個体は互いに独立とする。
    items:
      - id: s18p01a
        chapter: 8
        terms: [maximum-likelihood-estimator, fisher-information, standard-error]
        topic: 共優性の遺伝子型の数から対立遺伝子頻度の最尤推定量の標準誤差をフィッシャー情報量で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          遺伝子型の確率は $AA:p^2$、$Aa:2p(1-p)$、$aa:(1-p)^2$（ハーディ・ワインベルグ平衡）であると仮定する。
          $p$ の最尤推定量 $\hat p$ の標準誤差を、フィッシャー情報量の逆数の平方根に $\hat p$ を代入して求めよ。
        answer: «se»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 対数尤度を $p$ で書き、最尤推定量とフィッシャー情報量 $I(p)=-E[\ell''(p)]$ を求める。標準誤差は $1/\sqrt{I(\hat p)}$。

          **途中式** 遺伝子型の数を $n_{AA},n_{Aa},n_{aa}$ とすると、定数を除いて
          $$\ell(p)=2n_{AA}\log p+n_{Aa}\{\log p+\log(1-p)\}+2n_{aa}\log(1-p)=(2n_{AA}+n_{Aa})\log p+(n_{Aa}+2n_{aa})\log(1-p)$$
          $\ell'(p)=0$ より $\hat p=\dfrac{2n_{AA}+n_{Aa}}{2n}=\dfrac{«cntA»}{«n2»}=«p»$（集団の «n2» 本の遺伝子のうち $A$ の割合）。
          $2n_{AA}+n_{Aa}$ は二項分布 $B(2n,p)$ に従うので期待値は $2np$。よって
          $$I(p)=E\left[\frac{2n_{AA}+n_{Aa}}{p^2}+\frac{n_{Aa}+2n_{aa}}{(1-p)^2}\right]=\frac{2np}{p^2}+\frac{2n(1-p)}{(1-p)^2}=\frac{2n}{p(1-p)}$$
          $$\mathrm{SE}(\hat p)=\sqrt{\frac{\hat p(1-\hat p)}{2n}}=\sqrt{\frac{«p»\times«q»}{«n2»}}=\sqrt{«var»}=«se6»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** 標本の大きさは個体数 $n=«n»$ ではなく遺伝子の本数 $2n=«n2»$。$n$ で割ると $«se_n»$ になる。

      - id: s18p01b
        chapter: 10
        terms: [likelihood-ratio-test, wilks-theorem, degrees-of-freedom-gof]
        topic: 遺伝子型の度数でハーディ・ワインベルグ平衡を尤度比（G統計量）で検定し推定した母数の分だけ自由度を減らす
        level: 応用
        definition: false
        type: choice
        question: |
          帰無仮説「遺伝子型の確率は $p^2,\ 2p(1-p),\ (1-p)^2$（ハーディ・ワインベルグ平衡）」、対立仮説「3 つの遺伝子型の確率は任意（和は 1）」として尤度比検定を行う。
          検定統計量は $G=-2\log\Lambda=2\sum O\log(O/E)$（$O$ は観測度数、$E$ は帰無仮説のもとで $p$ を最尤推定して求めた期待度数、$\log$ は自然対数）とし、有意水準 1% で、$G$ が漸近的に従うカイ二乗分布と比べる。
          必要なら次の値を使え。

          | $\log(«nAA»/«eAA»)$ | $\log(«nAa»/«eAa»)$ | $\log(«naa»/«eaa»)$ |
          |---|---|---|
          | «l1» | «l2» | «l3» |

          | 自由度 | 上側 5% 点 | 上側 1% 点 | 上側 0.5% 点 |
          |---|---|---|---|
          | 1 | «c11» | «c12» | «c13» |
          | 2 | «c21» | «c22» | «c23» |

          正しいものはどれか。
        choices:
          - '$G=«half»$、自由度 1 で、$«c12»$ を超えないので棄却しない'
          - '$G=«G»$、自由度 2 で、$«c22»$ を超えないので棄却しない'
          - '$G=«G»$、自由度 1 で、$«c12»$ を超えるので棄却する'
          - '$G=«G»$、自由度 1 で、両側検定として上側 0.5% 点 $«c13»$ と比べ、超えないので棄却しない'
          - '$G=«Gm»$、自由度 2 で、$«c22»$ を超えるので棄却する'
        answer: 2
        distractors:
          - 2 倍を忘れて Σ O log(O/E) をそのまま G とした
          - 自由度を カテゴリー数−1=2 とし、推定した母数 p の分を引かなかった
          - 正解
          - カイ二乗検定は上側だけで判定するのに、両側として 0.5% 点と比べた
          - 期待度数をメンデル比 1:2:1（50, 100, 50）で作った（別の仮説の検定）
        explanation: |
          **方針** 帰無仮説のもとで $\hat p=«p»$ を使って期待度数を作り、$G$ を計算する。自由度は（対立仮説の自由な母数の数）−（帰無仮説の自由な母数の数）。

          **途中式** 期待度数は
          $$E_{AA}=«n»\times«p2»=«eAA»,\quad E_{Aa}=«n»\times«pq2»=«eAa»,\quad E_{aa}=«n»\times«q2»=«eaa»$$
          $$\sum O\log\frac{O}{E}=«nAA»\times«l1»+«nAa»\times(«l2»)+«naa»\times«l3»=«t1»+(«t2»)+«t3»=«half»$$
          $$G=2\times«half»=«G»$$
          対立仮説の母数は 3 つの確率（和が 1）で自由な数は 2、帰無仮説では $p$ の 1 つなので、自由度は $2-1=1$（ウィルクスの定理）。
          $«G»>«c12»$ なので有意水準 1% で棄却する。

          **答え** $G=«G»$、自由度 1 で棄却する（ハーディ・ワインベルグ平衡からずれている。ヘテロ接合体 $Aa$ が期待より少ない）。

          **間違えやすい点** カテゴリーが 3 つでも、帰無仮説のもとで $p$ を推定しているので自由度は 1 減って 1 になる（自由度 2 とすると «c22» と比べて棄却しない）。
          尤度比検定は $G$ が大きいときだけ棄却する上側の検定なので、1% 点 «c12» と比べる。$-2\log\Lambda$ の 2 倍を忘れないこと。

      - id: s18p01c
        chapter: 29
        terms: [em-algorithm, maximum-likelihood-estimator, missing-data-mechanism]
        topic: 優性の表現型しか観測できない遺伝子座で対立遺伝子頻度をEMアルゴリズムで1回更新する
        level: 標準
        definition: false
        type: numeric
        question: |
          同じ集団の別の遺伝子座では、対立遺伝子 $B$ が $b$ に対して完全に優性で、$BB$ と $Bb$ は同じ表現型（優性形質）になり見分けられない。
          «nn» 尾を調べたところ、優性形質は «nD» 尾、劣性形質（$bb$）は «nR» 尾だった。ハーディ・ワインベルグ平衡を仮定し、$B$ の頻度 $\theta$ を EM アルゴリズムで推定する。
          完全データを遺伝子型の数 $(n_{BB},n_{Bb},n_{bb})$ とし、初期値 $\theta^{(0)}=«p0»$ から E ステップと M ステップを **1 回ずつ**行ったときの $\theta^{(1)}$ を求めよ。
        answer: «p1»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** E ステップでは、優性形質の «nD» 尾を、現在の $\theta$ のもとでの条件付き確率で $BB$ と $Bb$ に振り分けた期待値を求める。M ステップでは、その期待値を遺伝子型の数とみなして完全データの最尤推定量 $(2n_{BB}+n_{Bb})/(2n)$ を計算する。

          **途中式** $\theta^{(0)}=«p0»$ のとき、$P(BB)=«pp0»$、$P(Bb)=2\theta(1-\theta)=«pq0»$、優性形質の確率は $«pp0»+«pq0»=«den0»$。
          $$E[n_{BB}]=«nD»\times\frac{«pp0»}{«den0»}=«eBB_f»\approx«eBB»,\qquad E[n_{Bb}]=«nD»\times\frac{«pq0»}{«den0»}=«eBb_f»\approx«eBb»$$
          $n_{bb}=«nR»$ は観測されている。M ステップは
          $$\theta^{(1)}=\frac{2E[n_{BB}]+E[n_{Bb}]}{2\times«nn»}=\frac{«two_eBB»+«eBb»}{«nn2»}=\frac{«num1»}{«nn2»}=«p1_4»\cdots$$

          **答え** $«p1_s»$

          **間違えやすい点** M ステップの分母は遺伝子の本数 $2n=«nn2»$。分子の $BB$ は $B$ を 2 本もつので 2 倍する（$E[n_{BB}]+E[n_{Bb}]$ を個体数 «nn» で割ると、優性形質の割合 $«p1_wrong»$ になってしまう）。
          この例では反復を続けると最尤推定値 $\hat\theta=1-\sqrt{«nR»/«nn»}=1-«q_mle»=«p_mle»$ に収束する。1 回目の値と取り違えないこと。

  - id: s18p02
    title: 野鳥の産卵数と孵化数
    context: |
      ある野鳥の 1 つの巣の産卵数 $N$ は平均 $\lambda=«lam»$ のポアソン分布に従う。産まれた卵はそれぞれ独立に確率 $h=«h»$ で孵化し、孵化した卵の数を $X$ とする（$N=n$ が与えられたとき $X$ は二項分布 $B(n,h)$ に従う）。
      必要なら $e^{-2.7}=«e27»$、$e^{-4.5}=«e45»$、$e^{-1.8}=«e18»$ を使え。
    items:
      - id: s18p02a
        chapter: 2
        terms: [marginal-probability-function, conditional-probability-function, poisson-distribution]
        topic: ポアソン分布の産卵数と二項分布の孵化から孵化数の周辺確率関数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          1 つの巣で孵化数がちょうど «k» 個である確率 $P(X=«k»)$ に最も近い値はどれか。
        choices:
          - '$«p_cum»$'
          - '$«p_n»$'
          - '$«p_1»$'
          - '$«pk»$'
          - '$«p_w»$'
        answer: 3
        distractors:
          - P(X≦2) を求めた
          - 孵化を考えず、産卵数 N がちょうど 2 個である確率 P(N=2) を求めた
          - 平均 2.7 のポアソン分布で P(X=1) を計算した（k の取り違え）
          - 正解
          - 孵化しない卵の数の平均 λ(1−h)=1.8 を使った
        explanation: |
          **方針** $N$ について和をとって $X$ の周辺確率関数を求める：$P(X=k)=\sum_{n\ge k}P(N=n)P(X=k\mid N=n)$。

          **途中式**
          $$P(X=k)=\sum_{n=k}^{\infty}e^{-\lambda}\frac{\lambda^n}{n!}\binom{n}{k}h^k(1-h)^{n-k}=e^{-\lambda}\frac{(\lambda h)^k}{k!}\sum_{n=k}^{\infty}\frac{\{\lambda(1-h)\}^{n-k}}{(n-k)!}=e^{-\lambda h}\frac{(\lambda h)^k}{k!}$$
          つまり $X$ は平均 $\lambda h=«lam»\times«h»=«mu»$ のポアソン分布に従う。
          $$P(X=«k»)=e^{-«mu»}\times\frac{«mu»^2}{2}=«e27»\times\frac{«mu2»}{2}=«pk5»$$

          **答え** $«pk»$

          **間違えやすい点** 産卵数の分布のまま $P(N=2)=«e45»\times4.5^2/2=«p_n»$ とするのは誤り。ポアソン分布に従う個数を独立に確率 $h$ でふるい分けると、残った個数は平均が $h$ 倍のポアソン分布になる。
          孵化しなかった数の平均 «mu0» を使うと $«p_w»$ になる。

      - id: s18p02b
        chapter: 3
        terms: [conditional-expectation, conditional-probability-function, poisson-distribution]
        topic: 孵化数が観測された巣の産卵数の条件付き期待値をポアソンのふるい分けから求める
        level: 応用
        definition: false
        type: numeric
        question: |
          調査に訪れたとき卵はすでに孵化しており、ある巣では孵化したひなが «k» 羽、殻が残っていない（孵化しなかった卵は数えられない）状態だった。
          この巣の産卵数の条件付き期待値 $E[N\mid X=«k»]$ を求めよ。
        answer: «cond»
        tolerance: 0.05
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.05 の差まで正解とする。
        explanation: |
          **方針** $N=X+Y$（$Y$ は孵化しなかった卵の数）と分ける。ポアソン分布のふるい分けでは $X$ と $Y$ が独立になることを使う。

          **途中式** $N=n$ のときの同時確率は
          $$P(X=x,Y=y)=e^{-\lambda}\frac{\lambda^{x+y}}{(x+y)!}\binom{x+y}{x}h^x(1-h)^y=e^{-\lambda h}\frac{(\lambda h)^x}{x!}\cdot e^{-\lambda(1-h)}\frac{\{\lambda(1-h)\}^y}{y!}$$
          と積に分かれるので、$X$ と $Y$ は独立で、$Y$ は平均 $\lambda(1-h)=«lam»\times«h0»=«mu0»$ のポアソン分布に従う。よって
          $$E[N\mid X=«k»]=«k»+E[Y\mid X=«k»]=«k»+E[Y]=«k»+«mu0»=«cond_s»$$

          **答え** $«cond_s»$

          **間違えやすい点** 「孵化率が «h» なので $«k»/«h»=«c_div»$」とするのは、$N$ が与えられたときの $X$ の期待値 $E[X\mid N]=Nh$ を逆向きに使った誤り。
          $X$ と無関係に $E[N]=«lam»$ と答えるのも、$«k»+«lam»=«c_add»$ とするのも誤り（観測した «k» 個に、平均 «mu0» の見えない卵を足す）。

  - id: s18p03
    title: 養殖魚の体長と体重のばらつき
    context: |
      ある養殖場で育てた魚の体長と体重について調べる。小問ごとに置く仮定が異なるので、それぞれの問題文に従うこと。
    items:
      - id: s18p03a
        chapter: 4
        terms: [change-of-variables, uniform-distribution, power-transformation]
        topic: 一様分布に従う体長の3乗に比例する体重の密度関数を変数変換で求める
        level: 標準
        definition: false
        type: choice
        question: |
          選別機を通した後の出荷魚の体長 $L$（cm）は区間 $[«a»,«b»]$ の一様分布に従い、体重 $W$（g）は $W=L^3/«c»$ で決まるとする。
          $W$ の確率密度関数 $f_W(w)$ として正しいものはどれか。
        choices:
          - '$f_W(w)=\dfrac{1}{«wr»}\quad(«wa»\le w\le «wb»)$'
          - '$f_W(w)=\dfrac{\sqrt[3]{«c»}}{30}\,w^{-2/3}\quad(«wa»\le w\le «wb»)$'
          - '$f_W(w)=\dfrac{\sqrt[3]{«c»}}{10}\,w^{-2/3}\quad(«wa»\le w\le «wb»)$'
          - '$f_W(w)=\dfrac{3}{1000}\,(«c»w)^{2/3}\quad(«wa»\le w\le «wb»)$'
          - '$f_W(w)=\dfrac{\sqrt[3]{«c»}}{30}\,w^{-2/3}\quad(«a»\le w\le «b»)$'
        answer: 1
        distractors:
          - 一様分布を変換しても一様分布のままだと考えた
          - 正解
          - 微分 dl/dw の係数 1/3 を掛け忘れた
          - ヤコビアンを逆向き（dw/dl）に掛けた
          - 台（値のとる範囲）を変換し忘れた
        explanation: |
          **方針** $w=l^3/«c»$ は $l>0$ で単調増加。逆変換 $l=(«c»w)^{1/3}$ を代入し、ヤコビアン $|dl/dw|$ を掛ける。台も変換する。

          **途中式** $f_L(l)=1/10$（$«a»\le l\le «b»$）。$l=«c»^{1/3}w^{1/3}$ より $\dfrac{dl}{dw}=\dfrac{«c»^{1/3}}{3}w^{-2/3}$。
          $$f_W(w)=f_L\big((«c»w)^{1/3}\big)\left|\frac{dl}{dw}\right|=\frac{1}{10}\cdot\frac{\sqrt[3]{«c»}}{3}w^{-2/3}=\frac{\sqrt[3]{«c»}}{30}w^{-2/3}$$
          台は $l=«a»$ のとき $w=«a»^3/«c»=«wa»$、$l=«b»$ のとき $w=«wb»$。
          確認：$\displaystyle\int_{«wa»}^{«wb»}\frac{\sqrt[3]{«c»}}{30}w^{-2/3}dw=\frac{\sqrt[3]{«c»}}{10}\left(«wb»^{1/3}-«wa»^{1/3}\right)=\frac{(«c»\times«wb»)^{1/3}-(«c»\times«wa»)^{1/3}}{10}=\frac{«b»-«a»}{10}=1$。

          **答え** $f_W(w)=\dfrac{\sqrt[3]{«c»}}{30}w^{-2/3}$（$«wa»\le w\le «wb»$）

          **間違えやすい点** 非線形な変換では一様分布は一様分布にならない（重い魚ほど密度が低い）。ヤコビアンは「新しい変数で古い変数を微分したもの」$dl/dw$ で、$dw/dl$ を掛けると積分が 1 にならない。台を «a»〜«b» のままにしないこと。

      - id: s18p03b
        chapter: 6
        terms: [chi-squared-distribution, normal-distribution]
        topic: 10尾の体長の不偏分散が母分散の何倍を超える確率が5%になるかをカイ二乗分布で決める
        level: 基本
        definition: false
        type: choice
        question: |
          別の池の魚の体長は正規分布 $N(\mu,\sigma^2)$ に従うとする。毎月 «n» 尾を無作為に取り上げ、体長の不偏分散 $s^2$（偏差平方和を $n-1$ で割ったもの）を計算する。
          $P(s^2>k\sigma^2)=0.05$ となる定数 $k$ に最も近い値はどれか。必要なら次のカイ二乗分布の上側パーセント点を使え。

          | 自由度 | 上側 5% 点 | 上側 2.5% 点 |
          |---|---|---|
          | 9 | «c95_9» | «c975_9» |
          | 10 | «c95_10» | «c975_10» |
        choices:
          - '$«k_n»$'
          - '$«k_ok»$'
          - '$«k_10n»$'
          - '$«k_10»$'
          - '$«k_25»$'
        answer: 1
        distractors:
          - 自由度 9 の 5% 点を n=10 で割った
          - 正解
          - 自由度を 10 として 10 で割った
          - 自由度 10 の 5% 点を n−1=9 で割った
          - 両側と考えて上側 2.5% 点を使った
        explanation: |
          **方針** 正規母集団からの標本では $(n-1)s^2/\sigma^2$ が自由度 $n-1$ のカイ二乗分布に従う。

          **途中式**
          $$P(s^2>k\sigma^2)=P\left(\frac{(n-1)s^2}{\sigma^2}>(n-1)k\right)=0.05\iff(n-1)k=\chi^2_{0.05}(«n1df»)=«c95_9»$$
          $$k=\frac{«c95_9»}{«n1df»}=«k_ok4»$$

          **答え** $«k_ok»$（不偏分散が母分散の «k_ok» 倍を超えるのは 20 回に 1 回程度）

          **間違えやすい点** 自由度は $n-1=«n1df»$（母平均の代わりに標本平均を使うため 1 減る）。«c95_9» を $n$ で割ると $«k_n»$ になる。片側の確率なので 2.5% 点は使わない。

      - id: s18p03c
        chapter: 11
        terms: [f-test-equal-variances, f-distribution, one-sided-two-sided-test]
        topic: 2つの養殖池の体重のばらつきが等しいかを両側F検定で判定し結論の述べ方を確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          2 つの池 X、Y で育てた魚の体重は、それぞれ正規分布に従うとする。池 X から «m1» 尾、池 Y から «m2» 尾を無作為に取り上げたところ、体重の不偏分散は $s_X^2=«v1»$、$s_Y^2=«v2»$ だった。
          帰無仮説 $\sigma_X^2=\sigma_Y^2$、対立仮説 $\sigma_X^2\ne\sigma_Y^2$ の $F$ 検定を有意水準 5%（両側）で行う。
          $F$ 分布の上側パーセント点は $F_{0.05}(«d1»,«d2»)=«f05»$、$F_{0.025}(«d1»,«d2»)=«f025»$、$F_{0.025}(«d2»,«d1»)=«f025r»$ である（$F(m,n)$ は分子の自由度 $m$、分母の自由度 $n$）。正しいものはどれか。
        choices:
          - '$F=«Fsd»$ で、$«f025»$ を超えないので帰無仮説を棄却しない'
          - '$F=«F»$ で、$«f05»$ を超えるので帰無仮説を棄却する'
          - '$F=«F»$ で、$«f025»$ を超えないので帰無仮説を棄却しない'
          - '$F=«F»$ で、$«f025r»$ を超えないので帰無仮説を棄却しない（自由度 $(«d2»,«d1»)$ と比べる）'
          - '$F=«F»$ で、$«f025»$ を超えないので、2 つの池の母分散は等しいことが示された'
        answer: 2
        distractors:
          - 分散ではなく標準偏差の比を F とした
          - 両側検定なのに上側 5% 点と比べた
          - 正解
          - F 分布の自由度の順番を逆にした
          - 棄却しないことを、帰無仮説が正しいと示されたと解釈した
        explanation: |
          **方針** 大きいほうの不偏分散を分子にして $F=s_X^2/s_Y^2$ とし、自由度（分子 $«m1»-1$、分母 $«m2»-1$）の $F$ 分布の上側 2.5% 点と比べる（両側 5%）。

          **途中式**
          $$F=\frac{s_X^2}{s_Y^2}=\frac{«v1»}{«v2»}=«F»,\qquad\text{自由度 }(«d1»,«d2»)$$
          両側 5% なので棄却域は $F>F_{0.025}(«d1»,«d2»)=«f025»$ または $F<1/F_{0.025}(«d2»,«d1»)=1/«f025r»$。$«F»$ はどちらにも入らない。

          **答え** $F=«F»$、$«f025»$ を超えないので棄却しない。

          **間違えやすい点** 両側検定で大きいほうを分子にしたときは上側 2.5% 点と比べる。上側 5% 点 «f05» と比べると棄却してしまう（片側検定の扱い）。
          自由度の順番は（分子, 分母）。また「棄却しない」は「差があるとはいえない」という意味で、母分散が等しいことを証明したわけではない。

  - id: s18p04
    title: 人工ふ化の孵化率
    context: |
      ある水産試験場で、サケの受精卵 «n» 粒を同じ条件で人工ふ化させたところ、«x» 粒が孵化した。各卵は独立に確率 $p$ で孵化するとみなし、$\hat p=«x»/«n»=«p»$ とする。
      孵化率のような 0 と 1 に近い割合を扱うため、ロジット $\psi=\log\dfrac{p}{1-p}$（自然対数）の尺度で推測を行う。
    items:
      - id: s18p04a
        chapter: 7
        terms: [delta-method, logit-logistic-transformation, asymptotic-normality-of-mle]
        topic: 孵化率の推定値をロジット変換した量の標準誤差をデルタ法で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $\hat\psi=\log\dfrac{\hat p}{1-\hat p}$ の標準誤差を、デルタ法を使い、未知の $p$ に $\hat p$ を代入して求めよ。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** デルタ法：$V[g(\hat p)]\approx\{g'(p)\}^2V[\hat p]$。$g(p)=\log\dfrac{p}{1-p}$、$V[\hat p]=\dfrac{p(1-p)}{n}$。

          **途中式** $g'(p)=\dfrac1p+\dfrac1{1-p}=\dfrac{1}{p(1-p)}$ より
          $$V[\hat\psi]\approx\frac{1}{\{p(1-p)\}^2}\cdot\frac{p(1-p)}{n}=\frac{1}{np(1-p)}$$
          $$\mathrm{SE}(\hat\psi)=\frac{1}{\sqrt{«n»\times«p»\times(1-«p»)}}=\frac{1}{\sqrt{«npq»}}=«se4»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** $\hat p$ 自身の標準誤差 $\sqrt{\hat p(1-\hat p)/n}=«se_p»$ と取り違えないこと。デルタ法では微分 $g'(p)$ を **2 乗**して分散に掛ける。2 乗せずに $V[\hat p]$ に $g'(p)$ を 1 回だけ掛けると $1/n$ になり、その平方根 $1/\sqrt{«n»}=«se_wrong»$ と誤る。

      - id: s18p04b
        chapter: 9
        terms: [confidence-interval, ci-proportion, wald-confidence-interval]
        topic: 孵化率をロジット尺度で作った95%信頼区間を確率の尺度に逆変換する
        level: 標準
        definition: false
        type: choice
        question: |
          前問の標準誤差 $«se4»$ を使い、ロジット尺度で $\hat\psi\pm1.96\times\mathrm{SE}$ の 95% 信頼区間を作ってから、$p=1/(1+e^{-\psi})$ で孵化率 $p$ の尺度に戻す。
          区間の端点は小数第 3 位に丸めてから変換するものとし、必要なら $\log 4=«ln4»$ と次の値を使え。

          | $x$ | 0.986 | 1.051 | 1.322 | 1.450 | 1.722 | 1.786 |
          |---|---|---|---|---|---|---|
          | $e^{-x}$ | «e1» | «e2» | «e3» | «e4» | «e5» | «e6» |

          得られる孵化率 $p$ の 95% 信頼区間に最も近いものはどれか。
        choices:
          - '$«ci_wald»$'
          - '$«ci_naive»$'
          - '$«ci_90»$'
          - '$«ci_ok»$'
          - '$«ci_flip»$'
        answer: 3
        distractors:
          - ロジット変換をせず、確率の尺度でワルド型の区間を作った
          - ロジット尺度の区間に p̂ の標準誤差 0.0327 を使った
          - 1.96 の代わりに 1.645（90% 区間）を使った
          - 正解
          - 逆変換を e^{-ψ}/(1+e^{-ψ}) と誤り、1−p の区間を求めた
        explanation: |
          **方針** ロジット尺度で対称な区間を作り、単調増加な逆変換 $p=1/(1+e^{-\psi})$ で端点をそれぞれ変換する。

          **途中式** $\hat\psi=\log\dfrac{«p»}{1-«p»}=\log4=«ln4»$、半幅は $1.96\times«se4»=«hw»$。
          $$\psi\text{ の区間}:(«ln4»-«hw»,\ «ln4»+«hw»)\approx(«lo»,\ «hi»)$$
          $$p_L=\frac{1}{1+e^{-«lo»}}=\frac{1}{1+«e1»}=«pl»,\qquad p_U=\frac{1}{1+e^{-«hi»}}=\frac{1}{1+«e6»}=«pu»$$

          **答え** $«ci_ok»$（$\hat p=«p»$ に対して左右非対称な区間になる）

          **間違えやすい点** 確率の尺度のワルド区間 $«p»\pm1.96\times«se_p»$ は $«ci_wald»$ で、上下対称になる（割合が 0 や 1 に近いと範囲外にはみ出すこともある）。
          ロジット尺度の標準誤差は前問の «se4» で、$\hat p$ の標準誤差 «se_p» を使うと区間が狭くなりすぎる。逆変換は $e^{\psi}/(1+e^{\psi})=1/(1+e^{-\psi})$ で、$e^{-\psi}/(1+e^{-\psi})$ は $1-p$ になる。

  - id: s18p05
    title: 湿地の希少植物の調査
    context: |
      ある湖岸の湿地で、希少植物の分布を 1 m 四方の方形区（コドラート）を単位に調べる。
    items:
      - id: s18p05a
        chapter: 5
        terms: [negative-binomial-distribution, binomial-distribution, geometric-distribution]
        topic: 希少植物のある方形区を3つ見つけるまでに調べる区画数が5以下である確率を負の二項分布と二項分布の関係で求める
        level: 基本
        definition: false
        type: choice
        question: |
          各方形区には独立に確率 «th» で希少植物が生えているとする。方形区を 1 つずつ調べ、希少植物のある方形区が «k» つ見つかった時点で調査をやめる。
          調べた方形区の総数（«k» つ目に見つかった区画を含む）を $Y$ とするとき、$P(Y\le «m»)$ に最も近い値はどれか。
        choices:
          - '$«fail5»$'
          - '$«ge2»$'
          - '$«only5»$'
          - '$«eq3»$'
          - '$«ok»$'
        answer: 4
        distractors:
          - Y を「見つからなかった区画の数」と取り違え、総数 8 以下の確率を求めた
          - 「5 区画中 2 区画以上」の確率を求めた
          - P(Y=5) だけを求め、Y=3, 4 を足し忘れた
          - 「5 区画中ちょうど 3 区画で見つかる」確率 P(B(5,0.2)=3) を求めた
          - 正解
        explanation: |
          **方針** $Y\le «m»$ は「最初の «m» 区画のうち «k» 区画以上で見つかる」ことと同じ。最初の «m» 区画で見つかる数は二項分布 $B(«m»,«th»)$ に従う。

          **途中式**
          $$P(Y\le «m»)=P(B(«m»,«th»)\ge «k»)=\binom{5}{3}«th»^3«q»^2+\binom{5}{4}«th»^4«q»+«th»^5=«b3»+«b4»+«b5»=«ok5»$$
          負の二項分布の確率関数 $P(Y=y)=\binom{y-1}{2}«th»^3«q»^{y-3}$ を $y=3,4,5$ で足しても $«f3»+«f4»+«f5»=«ok5»$ と一致する。

          **答え** $«ok»$

          **間違えやすい点** $P(Y=«m»)=«only5»$ だけでは $Y=3,4$ が抜ける。負の二項分布は「成功までの失敗回数」で定義する流儀もあるが、ここでは問題文どおり区画の総数を数える（失敗回数で «m» 以下とすると $«fail5»$ になる）。

      - id: s18p05b
        chapter: 21
        terms: [stratified-sampling, proportional-allocation, finite-population-correction]
        topic: 湿地を沿岸帯と内陸帯に分けた比例配分の層別抽出で1区画あたり平均個体数の標準誤差を有限母集団修正つきで求める
        level: 標準
        definition: false
        type: numeric
        question: |
          別の植物の個体数を調べるため、湿地を沿岸帯（«N1» 区画）と内陸帯（«N2» 区画）の 2 つの層に分け、比例配分でそれぞれ «n1» 区画と «n2» 区画を非復元の単純無作為抽出で選んだ。
          1 区画あたりの個体数の標本平均と不偏分散は次のとおりだった。

          | 層 | 区画数 $N_h$ | 標本数 $n_h$ | 標本平均 | 不偏分散 |
          |---|---|---|---|---|
          | 沿岸帯 | «N1» | «n1» | «y1» | «v1» |
          | 内陸帯 | «N2» | «n2» | «y2» | «v2» |

          湿地全体の 1 区画あたり平均個体数の層別推定量について、その標準誤差（推定した分散の平方根）を、有限母集団修正を含めて求めよ。
        answer: «se»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 層別推定量 $\bar y_{st}=\sum W_h\bar y_h$（$W_h=N_h/N$）の分散は、層ごとの単純無作為抽出の分散を $W_h^2$ で重みづけて足したもの：
          $\hat V(\bar y_{st})=\sum_h W_h^2\left(1-\dfrac{n_h}{N_h}\right)\dfrac{s_h^2}{n_h}$。

          **途中式** $W_1=\dfrac{«N1»}{«N1»+«N2»}=«W1»$、$W_2=«W2»$。推定値は $«W1»\times«y1»+«W2»\times«y2»=«mean»$。
          抽出率はどちらの層も $«n1»/«N1»=«n2»/«N2»=0.1$ なので、有限母集団修正は $1-0.1=«f1»$。
          $$\hat V=«W1s»\times«f1»\times\frac{«v1»}{«n1»}+«W2s»\times«f2»\times\frac{«v2»}{«n2»}=«t1»+«t2»=«var»$$
          $$\mathrm{SE}=\sqrt{«var»}=«se4»\cdots$$

          **答え** $«se»$

          **間違えやすい点** 有限母集団修正 $(1-n_h/N_h)$ を付け忘れると $\sqrt{«var_nf»}\approx«se_nf»$ になる。重みは $W_h$ ではなく $W_h^2$ を掛ける。
          分散 $«se_var»$ を答えないこと（問うているのは標準誤差）。

  - id: s18p06
    title: 魚の体長と体重の相対成長
    context: |
      ある魚種の «n» 尾について、体重 $W$（g）と体長 $L$（cm）の自然対数をとり、単回帰 $\log W=\alpha+\beta\log L+\varepsilon$（誤差は独立に $N(0,\sigma^2)$）を最小二乗法で当てはめた。
      傾きの推定値は $\hat\beta=«b»$、その標準誤差は $«se»$ だった。体形が成長によって変わらない（等成長）なら $\beta=«b0»$ である。
    items:
      - id: s18p06a
        chapter: 16
        terms: [regression-coefficient-t-test, log-transformation, multiple-regression-model]
        topic: 体長と体重の両対数回帰の傾きが等成長の値3と異なるかをt検定で判定し成長の型を読む
        level: 標準
        definition: false
        type: choice
        question: |
          帰無仮説 $\beta=«b0»$、対立仮説 $\beta\ne«b0»$ を有意水準 5%（両側）で検定する。
          $t$ 分布の上側パーセント点は $t_{0.025}(23)=«t23»$、$t_{0.005}(23)=«t23h»$、$t_{0.025}(24)=«t24»$ である。正しいものはどれか。
        choices:
          - '$t=«t0»$ で棄却する。等成長ではない'
          - '$t=«t»$ で、自由度 23 の $«t23»$ を超えるので棄却する。体長が大きい魚ほど体長に比べて重くなる（正の相対成長）'
          - '$t=«t»$ で、自由度 23 の $«t23»$ を超えるので棄却する。体長が大きい魚ほど体長に比べて軽くなる（負の相対成長）'
          - '$t=«t_nose»$ で、$«t23»$ を超えないので棄却しない'
          - '$t=«t»$ で、自由度 23 の上側 0.5% 点 $«t23h»$ を超えないので棄却しない'
        answer: 1
        distractors:
          - 帰無仮説の値 3 を引かず、β=0 の検定統計量を計算した
          - 正解
          - 傾きが 3 より大きいことの解釈を逆にした
          - 標準誤差で割り忘れた
          - 有意水準 5% の両側検定なのに 0.5% 点（有意水準 1% の両側）と比べた
        explanation: |
          **方針** 回帰係数の $t$ 検定は $t=(\hat\beta-\beta_0)/\mathrm{SE}(\hat\beta)$ で、自由度は $n-(\text{推定した回帰係数の数})=«n»-2=«df»$。

          **途中式**
          $$t=\frac{«b»-«b0»}{«se»}=«t»$$
          $|t|=«t»>t_{0.025}(«df»)=«t23»$ なので棄却する。

          **答え** 棄却する。$\hat\beta=«b»>«b0»$ なので、$W\propto L^{\beta}$ の指数が 3 より大きく、大きい魚ほど体長の 3 乗に比べて重くなる（正の相対成長）。

          **間違えやすい点** 回帰ソフトの出力にある $t$ 値は $\beta=0$ の検定（$«t0»$）で、等成長かどうかの検定ではない。自由度は切片と傾きの 2 つを推定するので $n-2=«df»$。
          $\beta>3$ は「同じ割合で体長が伸びると体重はそれ以上の割合で増える」ことを意味する。

      - id: s18p06b
        chapter: 17
        terms: [studentized-residual, standardized-residual, outlier-and-influential-point]
        topic: 両対数回帰の1尾の標準化残差からその1尾を除いた残差分散を使う外部スチューデント化残差を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          この回帰で、ある 1 尾の残差を $e_i$、てこ比を $h_{ii}$、全データの残差分散を $s^2=\mathrm{SSE}/(n-2)$ とする。
          標準化残差 $r_i=\dfrac{e_i}{s\sqrt{1-h_{ii}}}$ は $«rr»$ だった。この 1 尾を除いて当てはめた回帰の残差平方和は $\mathrm{SSE}_{(i)}=\mathrm{SSE}-\dfrac{e_i^2}{1-h_{ii}}$ で与えられる。
          $s_{(i)}^2=\mathrm{SSE}_{(i)}/(n-3)$ として、外部スチューデント化残差 $t_i=\dfrac{e_i}{s_{(i)}\sqrt{1-h_{ii}}}$ を求めよ。
        answer: «ext»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $s_{(i)}^2$ を $s^2$ と $r_i$ で表すと、$t_i=r_i\cdot s/s_{(i)}$ が $r_i$ と $n$ だけで書ける。

          **途中式** $\dfrac{e_i^2}{1-h_{ii}}=r_i^2s^2$ と $\mathrm{SSE}=(n-2)s^2$ より
          $$s_{(i)}^2=\frac{(n-2)s^2-r_i^2s^2}{n-3}=s^2\cdot\frac{n-2-r_i^2}{n-3}$$
          $$t_i=r_i\frac{s}{s_{(i)}}=r_i\sqrt{\frac{n-3}{n-2-r_i^2}}=«rr»\times\sqrt{\frac{«np1»}{«np»-«rr2»}}=«rr»\times\sqrt{\frac{«np1»}{«den»}}=«rr»\times«sq»=«ext4»\cdots$$

          **答え** $«ext_s»$（この 1 尾は自由度 «np1» の $t$ 分布で見ても外れ値の候補になる）

          **間違えやすい点** 外れ値の候補を含めたままの $s$ では、その観測の影響で $s$ が大きくなり、残差が小さく見える。そのため外部スチューデント化残差は標準化残差 «rr» より大きくなる。
          分子と分母の自由度を取り違えて $r_i\sqrt{(n-2)/(n-3-r_i^2)}$ とすると $«ext_w»$ になる。

