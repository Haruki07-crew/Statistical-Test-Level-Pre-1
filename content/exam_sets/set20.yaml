set: 20
title: 模擬試験 第20回
minutes: 90
problems:
  - id: s20p01
    title: 太陽光の出力比と買電比の同時分布
    context: |
      ある工場の昼の 1 時間について、屋根置き太陽光発電の出力比 $X$（定格出力に対する割合）と、電力会社からの買電比 $Y$（契約電力に対する割合）を記録している。
      多数の記録から、$(X,Y)$ の同時確率密度関数を次のようにモデル化した。
      $$f(x,y)=\frac{2}{3}(2x+y)\qquad(0<x<1,\ 0<y<1)$$
      （この範囲の外では $f(x,y)=0$。）
    items:
      - id: s20p01a
        chapter: 2
        terms: [joint-probability-density-function, probability-mass-and-density-function]
        topic: 2変数の同時密度関数を領域 y>x で重積分して買電比が出力比を上回る確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          買電比が出力比を上回る確率 $P(Y>X)$ に最も近い値はどれか。
        choices:
          - '$«w_no2»$'
          - '$«p_yx»$'
          - '$«w_half»$'
          - '$«p_xy»$'
          - '$«w_noc»$'
        answer: 1
        distractors:
          - 被積分関数の 2x の係数 2 を落として (x+y) を積分した
          - 正解
          - X と Y が対称だと思い込んで 1/2 とした
          - 積分の範囲を取り違えて P(X>Y) を計算した
          - 密度の定数 2/3 を掛け忘れた
        explanation: |
          **方針** 求める確率は、同時密度を領域 $\{(x,y):0<x<y<1\}$ で重積分したもの。$y$ を固定して $x$ を $0$ から $y$ まで積分し、次に $y$ を $0$ から $1$ まで積分する。

          **途中式**
          $$\int_0^{y}(2x+y)\,dx=\Big[x^2+xy\Big]_0^{y}=y^2+y^2=2y^2$$
          $$P(Y>X)=\frac23\int_0^1 2y^2\,dy=\frac23\times\frac23=\frac49=«p_yx»\cdots$$

          **答え** $«p_yx»$

          **間違えやすい点** 密度が $x$ と $y$ について対称ではない（$x$ の係数が大きい）ので、$1/2$ にはならない。$x$ が大きいほど密度が高いため、$X>Y$ のほうが起こりやすく $P(X>Y)=5/9=«p_xy»$ になる。
          定数 $\frac23$ を掛け忘れると $«w_noc»$ になる（全体の積分が 1 になるように付いている定数である）。

      - id: s20p01b
        chapter: 3
        terms: [quantile-function, marginal-probability-density-function, cumulative-distribution-function]
        topic: 同時密度関数から周辺分布関数を求め2次方程式を解いて出力比の中央値を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          出力比 $X$ の（周辺分布の）中央値を求めよ。
        answer: «med»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $y$ について積分して $X$ の周辺密度を出し、分布関数 $F_X(x)$ を作って $F_X(m)=\frac12$ を解く。

          **途中式**
          $$f_X(x)=\int_0^1\frac23(2x+y)\,dy=\frac23\left(2x+\frac12\right)=\frac{4x+1}{3}\qquad(0<x<1)$$
          $$F_X(x)=\int_0^x\frac{4t+1}{3}\,dt=\frac{2x^2+x}{3}$$
          $F_X(m)=\frac12$ より $4m^2+2m-3=0$。$0<m<1$ の解は
          $$m=\frac{-2+\sqrt{4+48}}{8}=\frac{-2+«disc»}{8}=«med5»\cdots$$

          **答え** $«med_s»$

          **間違えやすい点** 平均 $E[X]=\frac{11}{18}=«meanX»$ とは違う（分布が左に裾を引いているので中央値のほうが大きい）。
          $Y$ の中央値（$F_Y(y)=\frac{2y+y^2}{3}=\frac12$ の解 $«medY»$）と取り違えないこと。2 次方程式の負の解は $0<m<1$ の範囲外なので捨てる。

  - id: s20p02
    title: 送電網の信頼度と計測ノイズ
    context: |
      発電所 S から変電所 T へは、中継の開閉所 A, B を通る 5 本の送電線でつながっている：S–A、S–B、A–T、B–T の 4 本と、A と B を結ぶ連絡線 A–B（ブリッジ構造）。
      どれか 1 つの経路で S から T までつながっていれば送電できる。
    items:
      - id: s20p02a
        chapter: 1
        terms: [law-of-total-probability, independence-of-events]
        topic: ブリッジ構造の送電網が送電できる確率を連絡線の状態で場合分けして全確率の公式で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある期間に各送電線が使える確率は、S–A、S–B、A–T、B–T がそれぞれ «p»、連絡線 A–B が «pe» で、5 本の状態は互いに独立とする。
          S から T へ送電できる確率を求めよ。
        answer: «R»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 連絡線 A–B が使えるかどうかで場合分けし、全確率の公式 $P(\text{送電})=P(\text{送電}\mid E)P(E)+P(\text{送電}\mid E^c)P(E^c)$ を使う（$E$：A–B が使える）。

          **途中式** A–B が使えるとき、A と B は 1 点とみなせるので「S 側の 2 本の並列」と「T 側の 2 本の並列」の直列：
          $$P(\text{送電}\mid E)=\{1-(1-«p»)^2\}^2=«par»^2=«r_e1»$$
          A–B が使えないとき、「S–A–T」と「S–B–T」の 2 つの直列経路の並列：
          $$P(\text{送電}\mid E^c)=1-(1-«p»^2)^2=1-«omser»^2=1-«omser2»=«r_e0»$$
          $$P(\text{送電})=«pe»\times«r_e1»+«qe»\times«r_e0»=«t1»+«t0»=«R5»$$

          **答え** $«R_s»$

          **間違えやすい点** ブリッジ構造は直列と並列の組み合わせだけでは表せない。連絡線を無視すると $«r_e0»$、連絡線が必ず使えると考えると $«r_e1»$ になる。
          経路ごとの確率を足し合わせると、経路どうしが送電線を共有しているので重複して数えてしまう。

      - id: s20p02b
        chapter: 4
        terms: [change-of-variables, normal-distribution]
        topic: 正規分布に従う雑音電圧の2乗で表される雑音電力の密度を単調でない変数変換で求める
        level: 標準
        definition: false
        type: choice
        question: |
          変電所の計測回路で、雑音電圧 $X$（平均 0、分散 $\sigma^2$ の正規分布）が 1 Ω の抵抗で消費する雑音電力 $W=X^2$ の確率密度関数 $f_W(w)$（$w>0$）として正しいものはどれか。
        choices:
          - '$\dfrac{1}{2\sigma\sqrt{2\pi w}}\exp\left(-\dfrac{w}{2\sigma^2}\right)$'
          - '$\dfrac{1}{\sigma\sqrt{2\pi w}}\exp\left(-\dfrac{w}{2\sigma^2}\right)$'
          - '$\dfrac{1}{\sigma\sqrt{2\pi}}\exp\left(-\dfrac{w}{2\sigma^2}\right)$'
          - '$\dfrac{2\sqrt{w}}{\sigma\sqrt{2\pi}}\exp\left(-\dfrac{w}{2\sigma^2}\right)$'
          - '$\dfrac{1}{\sigma\sqrt{2\pi w}}\exp\left(-\dfrac{w^2}{2\sigma^2}\right)$'
        answer: 1
        distractors:
          - x=+√w の枝だけを考え、x=−√w の分を足し忘れた
          - 正解
          - ヤコビアン |dx/dw| を掛け忘れた
          - ヤコビアンを逆に dw/dx=2x で掛けた
          - 指数部に x=√w ではなく x=w を代入した
        explanation: |
          **方針** $w=x^2$ は単調ではなく、1 つの $w>0$ に $x=\sqrt w$ と $x=-\sqrt w$ の 2 つが対応する。分布関数から求めるのが確実：$F_W(w)=P(-\sqrt w\le X\le\sqrt w)$ を $w$ で微分する。

          **途中式** $X$ の密度を $\varphi_\sigma(x)=\dfrac{1}{\sigma\sqrt{2\pi}}e^{-x^2/(2\sigma^2)}$ とすると
          $$F_W(w)=\int_{-\sqrt w}^{\sqrt w}\varphi_\sigma(x)\,dx$$
          $$f_W(w)=\varphi_\sigma(\sqrt w)\cdot\frac{1}{2\sqrt w}+\varphi_\sigma(-\sqrt w)\cdot\frac{1}{2\sqrt w}=\frac{\varphi_\sigma(\sqrt w)}{\sqrt w}=\frac{1}{\sigma\sqrt{2\pi w}}\exp\left(-\frac{w}{2\sigma^2}\right)$$

          **答え** $\dfrac{1}{\sigma\sqrt{2\pi w}}\exp\left(-\dfrac{w}{2\sigma^2}\right)$（$W/\sigma^2$ が自由度 1 のカイ二乗分布に従うことと同じ）

          **間違えやすい点** 単調な変換の公式 $f_X(x(w))\,|dx/dw|$ をそのまま使うと片方の枝しか数えず、密度の積分が $1/2$ になってしまう。単調でない変換では、$x$ の候補ごとの寄与をすべて足す。
          ヤコビアンは $|dx/dw|=\frac{1}{2\sqrt w}$ で、$dw/dx=2x$ ではない。

  - id: s20p03
    title: 微小粒子状物質の濃度分布
    context: |
      ある監視局の $\mathrm{PM_{2.5}}$ の日平均濃度 $C$（μg/m³）は対数正規分布に従う（$\log C$ が正規分布 $N(\mu,\sigma^2)$ に従う。$\log$ は自然対数）とみなせる。
    items:
      - id: s20p03a
        chapter: 6
        terms: [lognormal-distribution, coefficient-of-variation, standard-normal-distribution]
        topic: 対数正規分布の平均と変動係数から母数を逆算して日平均濃度が基準値を超える日の割合を求める
        level: 標準
        definition: false
        type: choice
        question: |
          過去のデータから、$C$ の平均は «m»、変動係数（標準偏差 ÷ 平均）は «cv» だった。対数正規分布では $E[C]=e^{\mu+\sigma^2/2}$、変動係数の 2 乗は $e^{\sigma^2}-1$ である。
          日平均濃度が環境基準の 35 を超える日の割合 $P(C>35)$ に最も近い値はどれか。
          必要なら $\log1.5625=«ln1c»$、$\log15=«ln_m»$、$\log35=«ln35»$ と、次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 1.27 | 1.50 | 1.60 | 1.78 | 2.40 |
          |---|---|---|---|---|---|
          | $\Phi(z)$ | «ph127» | «ph150» | «ph160» | «ph178» | «ph240» |
        choices:
          - '$«w_nohalf»$'
          - '$«w_cv»$'
          - '$«ans»$'
          - '$«w_norm»$'
          - '$«w_var»$'
        answer: 2
        distractors:
          - μ を log(平均) として σ²/2 を引き忘れた（z=1.27）
          - 変動係数 0.75 をそのまま σ とした（z=1.50）
          - 正解
          - 対数をとらず正規分布 N(15, 11.25²) で計算した（z=1.78）
          - 標準化で σ ではなく σ² で割った（z=2.40）
        explanation: |
          **方針** 変動係数から $\sigma^2=\log(1+\text{CV}^2)$、平均から $\mu=\log E[C]-\sigma^2/2$ を求め、$P(C>35)=P(\log C>\log35)$ を標準化する。

          **途中式**
          $$\sigma^2=\log(1+«cv»^2)=\log«opc»=«ln1c»,\qquad\sigma=\sqrt{«ln1c»}=«sig»$$
          $$\mu=\log«m»-\frac{\sigma^2}{2}=«ln_m»-«half»=«mu»$$
          $$P(C>35)=1-\Phi\left(\frac{«ln35»-«mu»}{«sig»}\right)=1-\Phi\left(\frac{«num»}{«sig»}\right)=1-\Phi(«z»)=1-«phiz»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** 対数正規分布の平均は $e^\mu$ ではなく $e^{\mu+\sigma^2/2}$。$\mu=\log15$ とすると $z=«z_nohalf»$ で $«w_nohalf»$ になる（$e^\mu$ は中央値）。
          変動係数は $C$ の標準偏差と平均の比であって、$\log C$ の標準偏差 $\sigma$ そのものではない。対数をとらずに正規分布で近似すると、右に裾の長い分布の上側確率を小さく見積もる（$«w_norm»$）。

      - id: s20p03b
        chapter: 32
        terms: [gibbs-sampling, mcmc, bivariate-normal-distribution]
        topic: 2局の対数濃度の2変量正規分布からギブス・サンプリングで条件付き分布を使い1巡分の値を発生させる
        level: 標準
        definition: false
        type: choice
        question: |
          冬季について、2 つの監視局の対数濃度 $(U,V)$ を、平均 $(«muU»,«muV»)$、標準偏差 $(«sU»,«sV»)$、相関係数 «rho» の 2 変量正規分布とみなす。
          この分布からギブス・サンプリングで標本を作る。現在の値は $(U,V)=(«U0»,«V0»)$ で、1 巡では「$V$ を与えたもとで $U$ を発生」→「新しい $U$ を与えたもとで $V$ を発生」の順に更新する。
          条件付き分布から値を作るのに使う標準正規乱数は、$U$ の更新で $z_1=«z1»$、$V$ の更新で $z_2=«z2»$ だった（値 $=$ 条件付き平均 $+$ 条件付き標準偏差 $\times z$）。1 巡後の $(U,V)$ として正しいものはどれか。
        choices:
          - '$(«U1a»,\ «V1a»)$'
          - '$(«U1»,\ «V1»)$'
          - '$(«U1b»,\ «V1b»)$'
          - '$(«U1c»,\ «V1c»)$'
          - '$(«U1»,\ «V1d»)$'
        answer: 1
        distractors:
          - 条件付き標準偏差に √(1−ρ²) を掛け忘れ、周辺の標準偏差を使った
          - 正解
          - 回帰係数を ρσ_U/σ_V ではなく ρ だけにした
          - 条件付き標準偏差を σ√(1−ρ²) ではなく σ(1−ρ²) とした
          - V の更新に新しい U ではなく古い U=2.6 を使った
        explanation: |
          **方針** 2 変量正規分布の条件付き分布は
          $$U\mid V=v\sim N\left(\mu_U+\rho\frac{\sigma_U}{\sigma_V}(v-\mu_V),\ \sigma_U^2(1-\rho^2)\right)$$
          （$V\mid U$ も同様）。ギブス・サンプリングでは、更新したばかりの値を次の条件に使う。

          **途中式** $\sqrt{1-\rho^2}=«k»$。$U$ の更新：
          $$U_1=«muU»+«rho»\times\frac{«sU»}{«sV»}\times(«V0»-«muV»)+«sU»\times«k»\times«z1»=«muU»+(«tU1»)+«tU2»=«U1»$$
          $V$ の更新（新しい $U_1$ を使う）：
          $$V_1=«muV»+«rho»\times\frac{«sV»}{«sU»}\times(«U1»-«muU»)+«sV»\times«k»\times(«z2»)=«muV»+(«tV1»)+(«tV2»)=«V1»$$

          **答え** $(«U1»,\ «V1»)$

          **間違えやすい点** 条件付き分布のばらつきは $\sigma\sqrt{1-\rho^2}$ で、相関が強いほど小さい。周辺の標準偏差を使うと $(«U1a»,«V1a»)$ になる。
          回帰係数は $\rho\,\sigma_U/\sigma_V$（標準偏差の比が付く）。$V$ の更新に古い $U$ を使うのは、ギブス・サンプリングではなく別の（同時に更新する）方法になってしまう。

  - id: s20p04
    title: 風力発電所の設計風速
    context: |
      風力発電所の建設予定地で、日ごとの最大瞬間風速 $W$（m/s）を調べたところ、$W-«loc»$ は平均 «theta» の指数分布に従い、日ごとに独立とみなせた。
      1 年（«n» 日）の最大値 $M=\max(W_1,\ldots,W_{«n»})$ の分布を使って、設備の設計風速を決める。
    items:
      - id: s20p04a
        chapter: 7
        terms: [extreme-value-distribution, exponential-distribution]
        topic: 日最大風速の超過量が指数分布のとき年最大値をグンベル分布で近似し50年再現期間の風速を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          「50 年に 1 度」の年最大風速、すなわち $P(M\le x)=0.98$ となる $x$ を求めよ。
          $n$ が大きいとき $\left(1-e^{-y}\right)^n\approx\exp\left(-n e^{-y}\right)$（グンベル分布による近似）を使ってよい。
          必要なら $\log 365=«ln365»$、$-\log 0.98=«mlog98»$、$\log «mlog98»=«ln0202»$（$\log$ は自然対数）を使え。
        answer: «x»
        tolerance: 0.1
        answer_format: m/s の単位で、小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 日ごとに独立なので $P(M\le x)=\{P(W\le x)\}^{«n»}$。$y=(x-«loc»)/«theta»$ とおくと $P(W\le x)=1-e^{-y}$ で、極値の近似 $\exp(-n e^{-y})$ を $0.98$ とおいて $y$ を解く。

          **途中式**
          $$\exp\left(-«n»e^{-y}\right)=0.98\iff «n»e^{-y}=-\log0.98=«mlog98»$$
          $$y=\log«n»-\log«mlog98»=«ln365»-(«ln0202»)=«y»$$
          $$x=«loc»+«theta»y=«loc»+«theta»\times«y»=«x3»$$

          **答え** $«xs»$ m/s

          **間違えやすい点** 1 日の最大風速の 98% 点（$«loc»-«theta»\log0.02=«loc»+«theta»\times«ln002a»=«w_day»$、$\log0.02=«ln002»$）と取り違えないこと。年最大値は 365 日分の最大なので、ずっと大きくなる。
          位置の «loc» を足し忘れると $«w_noloc»$ になる。指数分布の最大値は $\log n$ のぶんだけ右にずれ、そのまわりのばらつきはグンベル分布で近似できる。

  - id: s20p05
    title: 騒音計の精度の評価
    context: |
      環境騒音の測定に使う騒音計の精度を調べる。測定値は互いに独立に正規分布に従うとする。
      騒音計 A で基準音源の音を «n» 回測定したところ、標本平均は $\bar x=«xb»$ dB、偏差平方和は $\sum_{i=1}^{«n»}(x_i-\bar x)^2=«S»$（不偏分散 $s^2=«s2»$、$s=«sd»$ dB）だった。
    items:
      - id: s20p05a
        chapter: 9
        terms: [one-sided-confidence-limit, ci-variance, chi-squared-distribution]
        topic: 騒音計の精度の保証として測定値の母標準偏差の95%片側信頼上限をカイ二乗分布の下側の点から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          メーカーは騒音計 A の精度を「測定値の標準偏差 $\sigma$ は $U$ dB 以下」と、信頼係数 95% で保証したい。$\sigma$ の 95% 片側信頼上限（$P(\sigma\le U)=0.95$ となる $U$）を求めよ。
          必要なら、自由度 15 のカイ二乗分布の下側 5% 点 «c15l»、下側 2.5% 点 «c15ll»、上側 5% 点 «c15u»、自由度 16 のカイ二乗分布の下側 5% 点 «c16l» を使え。
        answer: «U»
        tolerance: 0.001
        answer_format: dB の単位で、小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 偏差平方和を $S=\sum(X_i-\bar X)^2$ とすると、$S/\sigma^2$ は自由度 $n-1$ のカイ二乗分布に従う（ピボット）。$\sigma$ の上限を作るには、「$S/\sigma^2$ が下側 5% 点以上になる」確率 0.95 の式を $\sigma$ について解く。

          **途中式** 自由度 $«df»$ の下側 5% 点を $\chi^2_{L}=«c15l»$ とすると
          $$P\left(\frac{S}{\sigma^2}\ge\chi^2_L\right)=0.95\iff P\left(\sigma^2\le\frac{S}{\chi^2_L}\right)=0.95$$
          $$U^2=\frac{«S»}{«c15l»}=«U2»,\qquad U=\sqrt{«U2»}=«U5»$$

          **答え** $«U_s»$ dB

          **間違えやすい点** 上限には**下側**の点を使う。上側 5% 点 «c15u» を使うと $«w_up»$ dB で、これは片側の**下限**になる。
          両側 95% 区間の上限（下側 2.5% 点 «c15ll»）は $«w_two»$ dB で、片側の保証より大きい（保守的）。自由度は $n-1=«df»$ で、16 とすると $«w_16»$ dB。平方根をとり忘れると分散の上限 $«U2s»$ になる。
          標本の標準偏差 $s=«sd»$ より 4 割ほど大きいのは、16 回の測定では $\sigma$ の推定の不確かさが大きいためである。

      - id: s20p05b
        chapter: 8
        terms: [mean-squared-error, unbiased-estimator, maximum-likelihood-estimator]
        topic: 正規母集団の分散を偏差平方和の定数倍で推定するとき平均二乗誤差を最小にする割る数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $\sigma^2$ を偏差平方和の定数倍 $c\sum_{i=1}^{«n»}(X_i-\bar X)^2$ で推定する。平均二乗誤差 $E\left[\left(c\sum(X_i-\bar X)^2-\sigma^2\right)^2\right]$ を最小にする $c$ と、そのときの推定値の組として正しいものはどれか。
        choices:
          - '$c=1/«nm1»$、推定値 $«e15»$'
          - '$c=1/«n»$、推定値 $«e16»$'
          - '$c=1/«n1»$、推定値 $«e17»$'
          - '$c=1/«nm2»$、推定値 $«e14»$'
          - '$c=1/«np2»$、推定値 $«e18»$'
        answer: 2
        distractors:
          - 不偏推定量（n-1 で割る）が平均二乗誤差も最小だと思い込んだ
          - 最尤推定量（n で割る）が平均二乗誤差最小だと思い込んだ
          - 正解
          - 割る数の向きを逆に n-2 とした
          - n+2 で割る（平均が既知で自由度が n のときの結果）と混同した
        explanation: |
          **方針** $V=\sum(X_i-\bar X)^2$ とすると $V/\sigma^2\sim\chi^2(n-1)$ なので $E[V]=(n-1)\sigma^2$、$V[V]=2(n-1)\sigma^4$。平均二乗誤差を「分散 $+$ バイアスの 2 乗」に分けて $c$ の 2 次関数として最小化する。

          **途中式**
          $$\mathrm{MSE}(c)=c^2\cdot2(n-1)\sigma^4+\{c(n-1)-1\}^2\sigma^4$$
          $c$ で微分して 0 とおくと
          $$4(n-1)c+2(n-1)\{c(n-1)-1\}=0\iff c(n+1)=1\iff c=\frac{1}{n+1}=\frac{1}{«n1»}$$
          推定値は $«S»/«n1»=«e17»$。このときの $\mathrm{MSE}=\frac{2\sigma^4}{n+1}=«m17»\,\sigma^4$ で、不偏推定量の $\frac{2\sigma^4}{n-1}=«m15»\,\sigma^4$ や最尤推定量の $\frac{(2n-1)\sigma^4}{n^2}=«m16»\,\sigma^4$ より小さい。

          **答え** $c=1/«n1»$、推定値 $«e17»$

          **間違えやすい点** 不偏性と平均二乗誤差の最小は別の基準である。$n-1$ で割る不偏推定量はバイアスが 0 でも分散が大きく、少し小さめに推定する $n+1$ 割りのほうが平均二乗誤差は小さい。
          この結果は正規分布を仮定したもので、分布が違えば最適な割る数も変わる。

      - id: s20p05c
        chapter: 11
        terms: [z-test-known-variance, power-of-t-test, type-i-and-ii-errors]
        topic: 母標準偏差が既知の騒音計で0.5dBの偏りを両側z検定で検出する検出力を正規分布から求める
        level: 基本
        definition: false
        type: choice
        question: |
          メーカーの仕様では、この型の騒音計の測定値の母標準偏差は $\sigma=«sig»$ dB（既知）である。基準音源を $n=«n»$ 回測り、帰無仮説 $\mu=94.0$ を両側 5% の $z$ 検定（棄却点 1.96）で調べる計画を立てる。
          実際には測定値に $+«delta»$ dB の偏りがある（$\mu=94.5$）とき、この検定が帰無仮説を棄却する確率（検出力）に最も近いものはどれか。
          必要なら標準正規分布の分布関数の値 $\Phi(0.54)=«ph054»$、$\Phi(0.86)=«ph086»$、$\Phi(1.34)=«ph134»$、$\Phi(2.50)=«ph250»$ を使え。
        choices:
          - '$«w_one»$'
          - '$«pw»$'
          - '$«w_beta»$'
          - '$«w_nosqrt»$'
          - '$«w_nocrit»$'
        answer: 1
        distractors:
          - 両側検定なのに片側の棄却点 1.645 を使った
          - 正解
          - 第2種の誤りの確率 β を答えた
          - 標準誤差を σ/√n ではなく σ とした
          - 棄却点を引かず、Φ(δ√n/σ) とした
        explanation: |
          **方針** $\mu=94.5$ のとき $Z=\dfrac{\bar X-94.0}{\sigma/\sqrt n}$ は平均 $\dfrac{\delta}{\sigma/\sqrt n}$、分散 1 の正規分布に従う。検出力は $P(|Z|>1.96)$。

          **途中式** $\sigma/\sqrt n=«sig»/4=0.20$ なので $Z\sim N(«shift»,1)$。
          $$P(Z>1.96)=P(Z-«shift»>1.96-«shift»)=1-\Phi(-«za»)=\Phi(«za»)=«pw4»$$
          反対側 $P(Z<-1.96)=\Phi(-1.96-«shift»)=\Phi(-4.46)$ はほぼ 0。よって検出力 $\approx«pw»$。

          **答え** $«pw»$

          **間違えやすい点** 両側検定の棄却点は 1.96。片側の 1.645 を使うと $\Phi(0.86)=«w_one»$ と大きめになる。
          $\beta=1-«pw»=«w_beta»$ は見逃す確率で、検出力ではない。標準誤差を $\sigma$ とすると $1-\Phi(1.34)=«w_nosqrt»$ と極端に小さくなる。

  - id: s20p06
    title: 大気環境の監視局のデータ分析
    context: |
      ある県は、県内の大気汚染の常時監視局で二酸化窒素（$\mathrm{NO_2}$）や微小粒子状物質（$\mathrm{PM_{2.5}}$）などを測っている。
      以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s20p06a
        chapter: 24
        terms: [number-of-clusters, non-hierarchical-clustering, k-means-method]
        topic: クラスター数の候補ごとの群内平方和からカリンスキー・ハラバシュ指標を計算してクラスター数を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          «n» の監視局を、標準化した年平均濃度で k 平均法により分類する。全平方和は «T» で、クラスター数 $k$ ごとの群内平方和 $W_k$ は次の通りだった。

          | $k$ | 2 | 3 | 4 |
          |---|---|---|---|
          | $W_k$ | «W2» | «W3» | «W4» |

          カリンスキー・ハラバシュ指標 $\mathrm{CH}(k)=\dfrac{B_k/(k-1)}{W_k/(n-k)}$（$B_k$ は群間平方和）が最大になる $k$ を選ぶとき、正しい記述はどれか。
        choices:
          - '$\mathrm{CH}$ は $k=2$ で最大（«ch2»）なので $k=2$ を選ぶ'
          - '群内平方和は $k=4$ で最小（«W4»）なので $k=4$ を選ぶ'
          - '$\mathrm{CH}(3)=«ch3»$ が最大なので $k=3$ を選ぶ'
          - '群間と群内の平方和の比 $B_k/W_k$ は $k=4$ で最大（«bw4»）なので $k=4$ を選ぶ'
          - '$\mathrm{CH}$ を $\dfrac{B_k/k}{W_k/(n-k)}$ と計算すると $k=3$ で最大（«chk3»）なので $k=3$ を選ぶ'
        answer: 0
        distractors:
          - 正解
          - 群内平方和はクラスターを増やすほど必ず小さくなるので、最小で選んではいけない
          - CH(2)=27.0 のほうが大きい
          - 自由度で割らずに平方和の比を比べた
          - 群間平方和の自由度を k−1 ではなく k とした
        explanation: |
          **方針** $B_k=(\text{全平方和})-W_k$。群間と群内の平均平方の比を、それぞれの自由度 $k-1$、$n-k$ で割って比べる（分散分析の $F$ 比と同じ形）。

          **途中式** $B_2=«B2»$、$B_3=«B3»$、$B_4=«B4»$。
          $$\mathrm{CH}(2)=\frac{«B2»/1}{«W2»/18}=«ch2»,\quad \mathrm{CH}(3)=\frac{«B3»/2}{«W3»/17}=«ch3»,\quad \mathrm{CH}(4)=\frac{«B4»/3}{«W4»/16}=«ch4»$$
          最大は $k=2$。

          **答え** $k=2$ を選ぶ

          **間違えやすい点** 群内平方和はクラスター数を増やすほど小さくなる（$k=n$ で 0）ので、それだけでは決められない。CH 指標は、クラスターを増やすことで失う自由度を考えに入れている。
          エルボー法など他の基準では別の $k$ が選ばれることもある。

      - id: s20p06b
        chapter: 25
        terms: [undirected-graphical-model, precision-matrix, graphical-model]
        topic: 4指標の精度行列の0の位置から無向グラフを描き分離にもとづく条件付き独立（大域マルコフ性）を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          4 つの指標 $\mathrm{NO_2}$（$x_1$）、$\mathrm{PM_{2.5}}$（$x_2$）、浮遊粒子状物質（$x_3$）、光化学オキシダント（$x_4$）の日平均値を 4 変量正規分布とみなし、
          精度行列（分散共分散行列の逆行列）$K=(k_{ij})$ を推定したところ次のようになった。
          $$K=«Kmat»$$
          この精度行列に対応する無向グラフィカルモデルについて、正しい記述はどれか。
        choices:
          - "$x_1$ と $x_3$ は無相関（周辺で独立）である"
          - "$x_1$ と $x_3$ は $x_2$ を与えると条件付き独立だが、$x_4$ だけを与えても条件付き独立にはならない"
          - "$x_3$ と $x_4$ は $x_1,\ x_2$ を与えると条件付き独立である"
          - "$x_1$ と $x_4$ は $x_3$ を与えると条件付き独立である"
          - "$x_2$ と $x_4$ は $x_3$ を与えると条件付き独立である"
        answer: 1
        distractors:
          - 精度行列の 0 を共分散の 0 と取り違えた（周辺の共分散 σ13 は 0 でない）
          - 正解
          - k34≠0 で x3 と x4 は辺で直接結ばれており、何を与えても分離されない
          - x3 を与えても経路 x1–x2–x4 が残る
          - k24≠0 で x2 と x4 は辺で直接結ばれている
        explanation: |
          **方針** 多変量正規分布では、$k_{ij}=0$ と「$x_i$ と $x_j$ は残りのすべての変数を与えると条件付き独立」が同値である。$k_{ij}\ne0$ の組に辺を引いた無向グラフでは、頂点の集合 $S$ が $x_i$ と $x_j$ を結ぶすべての経路を遮る（分離する）とき、$S$ を与えると $x_i$ と $x_j$ は条件付き独立になる（大域マルコフ性）。

          **途中式** 0 でない非対角成分は $k_{12},k_{23},k_{24},k_{34}$ なので、辺は $1–2$、$2–3$、$2–4$、$3–4$ の 4 本（$1–3$、$1–4$ には辺がない）。
          - $x_1$ から $x_3$ への経路は $1–2–3$ と $1–2–4–3$ で、どちらも $x_2$ を通るので、$\{x_2\}$ は分離する。$\{x_4\}$ だけでは $1–2–3$ が残る。
          - $3–4$、$2–4$ は辺そのものなので、何を与えても分離できない。$\{x_3\}$ では $1–2–4$ が残る。
          - 周辺の分散共分散行列 $K^{-1}$ の $(1,3)$ 成分は $«s13»$ で 0 ではないので、$x_1$ と $x_3$ は無相関ではない。

          **答え** 「$x_1$ と $x_3$ は $x_2$ を与えると条件付き独立だが、$x_4$ だけを与えても条件付き独立にはならない」

          **間違えやすい点** 精度行列の 0 は「ほかを与えたときの」条件付き独立を表し、共分散の 0（周辺の無相関）とは別物である。
          偏相関係数は $-k_{ij}/\sqrt{k_{ii}k_{jj}}$ で求まる（たとえば $x_2$ と $x_3$ は $«pc23»$）。条件付き独立になるかどうかは、どの変数を与えるかで変わる。

  - id: s20p07
    title: 電力需要予測の誤差の構造
    context: |
      ある電力会社は、前々日に作る最大電力需要の予測を使っている。予測誤差 $X_t$（万kW）を調べたところ、2 日続けて同じ気象の読み違いの影響を受けるため、MA(1) モデル
      $$X_t=\varepsilon_t+«th»\varepsilon_{t-1}$$
      （$\varepsilon_t$ は平均 0 のホワイトノイズ）がよく当てはまった。
    items:
      - id: s20p07a
        chapter: 27
        terms: [partial-autocorrelation, ma-model, autocovariance-autocorrelation]
        topic: MA(1)モデルの自己相関から2次の偏自己相関を求め偏自己相関が途切れないことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          $X_t$ の 2 次の偏自己相関係数 $\phi_{22}$（$X_{t-1}$ の影響を除いたときの $X_t$ と $X_{t-2}$ の相関）に最も近い値はどれか。
        choices:
          - '$«w_zero»$'
          - '$«w_r1sq»$'
          - '$«phi22»$'
          - '$«w_noden»$'
          - '$«w_r1»$'
        answer: 2
        distractors:
          - MA モデルでは偏自己相関が途切れると取り違えた（途切れるのは自己相関）
          - 符号と分母を誤り ρ1^2 とした
          - 正解
          - 分母 1−ρ1^2 で割り忘れた
          - 1 次の自己相関 ρ1 を答えた
        explanation: |
          **方針** 2 次の偏自己相関は、ユール・ウォーカー方程式を 2 次まで解いた最後の係数で
          $$\phi_{22}=\frac{\rho_2-\rho_1^2}{1-\rho_1^2}$$
          MA(1) では $\rho_1=\theta/(1+\theta^2)$、$\rho_k=0\ (k\ge2)$。

          **途中式**
          $$\rho_1=\frac{«th»}{1+«th»^2}=«r1»,\qquad\rho_2=0$$
          $$\phi_{22}=\frac{0-«r1»^2}{1-«r1»^2}=\frac{-«r1sq»}{«om»}=«phi22_4»$$

          **答え** $«phi22»$

          **間違えやすい点** MA($q$) では**自己相関**が $q$ 次の先で 0 に途切れ、**偏自己相関**は途切れずに減衰する（AR($p$) はその逆）。MA(1) の偏自己相関を 0 とするのは逆の取り違え。
          コレログラムで「自己相関が 1 次で途切れ、偏自己相関がゆっくり減る」ことが MA(1) を選ぶ手がかりになる。

  - id: s20p08
    title: 系統用蓄電池の残量の変動
    context: |
      電力系統の周波数調整に使う蓄電池の残量を 0〜«N» の «N»+1 段階で表す。«mins» 分ごとに、残量は確率 1/2 で 1 段階増え、確率 1/2 で 1 段階減る（ほかの時点とは独立）。
      残量が 0（下限）か «N»（上限）に達すると、運用を切り替える。
    items:
      - id: s20p08a
        chapter: 15
        terms: [random-walk, gambler-ruin-problem]
        topic: 対称ランダムウォークで蓄電池の残量が上限か下限に達するまでの期待時間を破産問題の期待継続時間として求める
        level: 応用
        definition: false
        type: choice
        question: |
          いま残量が «k» 段階のとき、下限か上限のどちらかに達するまでの時間の期待値に最も近いものはどれか。
        choices:
          - '$«w_k2»$ 時間'
          - '$«hours»$ 時間'
          - '$«w_nk2»$ 時間'
          - '$«w_Nk»$ 時間'
          - '$«w_half»$ 時間'
        answer: 1
        distractors:
          - 期待ステップ数を k^2 とした（片側の壁しかない場合の目安と混同）
          - 正解
          - 期待ステップ数を (N−k)^2 とした
          - 期待ステップ数を N×k とした
          - 1 ステップを 15 分ではなく 7.5 分と数えた（期待ステップ数を半分にした）
        explanation: |
          **方針** 残量 $j$ から吸収されるまでの期待ステップ数を $D_j$ とすると、1 ステップ後の位置で場合分けして
          $$D_j=1+\frac12D_{j-1}+\frac12D_{j+1}\quad(0<j<N),\qquad D_0=D_N=0$$
          この差分方程式の解は $D_j=j(N-j)$（ギャンブラーの破産問題の期待継続時間）。

          **途中式** $D_j=j(N-j)$ を代入すると $1+\frac12(j-1)(N-j+1)+\frac12(j+1)(N-j-1)=j(N-j)$ が成り立ち、境界条件も満たす。
          $$D_{«k»}=«k»\times(«N»-«k»)=«k»\times«Nk»=«steps»\ \text{ステップ}$$
          1 ステップは «mins» 分 $=«dt»$ 時間なので $«steps»\times«dt»=«hours»$ 時間。

          **答え** $«hours»$ 時間

          **間違えやすい点** 期待ステップ数は両側の壁までの距離の積 $j(N-j)$ で、中央から始めるほど長い。片側の距離の 2 乗では両方の壁の影響が入らない。
          ステップ数を時間に直すのを忘れないこと。

