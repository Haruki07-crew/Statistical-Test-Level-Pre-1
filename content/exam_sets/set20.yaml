    context: |
      ある電力会社は、気象予報をもとにした外部のモデルで翌日の最大電力需要を予測している（この会社のデータからパラメータは推定していない）。
      直近 «n» 日間の予測誤差（実績 $-$ 予測）を調べた。
    items:
      - id: s20p07a
        chapter: 27
        terms: [white-noise, correlogram, autocovariance-autocorrelation]
        topic: 予測誤差の標本自己相関からリュング・ボックス統計量を求め白色雑音かどうかを判定する
        level: 標準
        definition: false
        type: choice
        question: |
          予測誤差の標本自己相関は $r_1=«r1»$、$r_2=«r2»$、$r_3=«r3»$ だった。ラグ 3 までのリュング・ボックス統計量
          $$Q=n(n+2)\sum_{k=1}^{3}\frac{r_k^2}{n-k}$$
          で「予測誤差は白色雑音（自己相関がない）」という帰無仮説を有意水準 5% で検定する。
          自由度 3 と 4 のカイ二乗分布の上側 5% 点は «c3» と «c4» である。正しい記述はどれか。
        choices:
          - '$Q=«bp»$ で «c3» を超えないので棄却しない'
          - '$Q=«lb»$ で «c3» を超えるので棄却する。予測誤差に自己相関が残っている'
          - '$Q=«lb»$ で、自由度 4 の点 «c4» を超えないので棄却しない'
          - '$Q=«w_sq»$ で «c3» を超えないので棄却しない'
          - '$Q=«lb»$ で «c3» を超えるので棄却する。予測誤差は白色雑音とみなせる'
        answer: 1
        distractors:
          - 小標本の補正のないボックス・ピアース統計量 n Σ r_k^2 を計算した
          - 正解
          - 自由度をラグの数 +1 と数えた
          - n(n+2) と 1/(n-k) の重みを付けずに r_k^2 を足しただけにした
          - 棄却の意味を逆に解釈した
        explanation: |
          **方針** パラメータを推定していない系列なので、$Q$ は帰無仮説のもとで近似的に自由度 3（ラグの数）のカイ二乗分布に従う。

          **途中式**
          $$\frac{«r1»^2}{«nm1»}+\frac{«r2»^2}{«nm2»}+\frac{«r3»^2}{«nm3»}=«a1»+«a2»+«a3»=«asum»$$
          $$Q=«n»\times(«n»+2)\times«asum»=«nn2»\times«asum»=«lb»$$
          $«lb»>«c3»$ なので棄却する。

          **答え** $Q=«lb»$ で棄却（予測誤差に自己相関が残っている）

          **間違えやすい点** ボックス・ピアース統計量 $n\sum r_k^2=«bp»$ は小標本で小さめに出やすく、この例では結論が変わる。リュング・ボックスは $(n+2)/(n-k)$ の重みでこれを補正したもの。
          自由度はラグの数 3。ARMA モデルの残差に使うときは、推定したパラメータの数だけ自由度を減らす。

      - id: s20p07b
        chapter: 11
        terms: [normality-test, skewness-kurtosis]
        topic: 予測誤差の標本歪度と尖度からジャック・ベラ統計量を求め正規性を検定する
        level: 基本
        definition: false
        type: choice
        question: |
          同じ «n» 日間の予測誤差の標本歪度は «sk»、標本尖度（正規分布で 3 になる定義）は «ku» だった。ジャック・ベラ統計量
          $$JB=\frac{n}{6}\left\{S^2+\frac{(K-3)^2}{4}\right\}$$
          （$S$：歪度、$K$：尖度）で正規性を有意水準 5% で検定する。自由度 2 と 3 のカイ二乗分布の上側 5% 点は «c2» と «c3» である。正しい記述はどれか。
        choices:
          - '$JB=«jb»$ で «c2» を超えるので、正規分布という帰無仮説を棄却する'
          - '$JB=«w_raw»$ で «c2» を大きく超えるので棄却する'
          - '$JB=«w_non»$ で «c2» を超えないので棄却しない'
          - '$JB=«jb»$ で、自由度 3 の点 «c3» を超えないので棄却しない'
          - '$JB=«jb»$ で棄却する。尖度が 3 より小さく、正規分布より裾が軽いことが主な原因である'
        answer: 0
        distractors:
          - 正解
          - 尖度から 3 を引き忘れた
          - n/6 を掛け忘れた
          - 自由度を 3 と数えた（歪度と尖度の 2 つなので自由度 2）
          - 尖度 4.2 は 3 より大きく、裾は正規分布より重い
        explanation: |
          **方針** 正規分布では歪度 0、尖度 3。そこからのずれを合わせた $JB$ は、正規性の帰無仮説のもとで近似的に自由度 2 のカイ二乗分布に従う。

          **途中式**
          $$S^2=«sk»^2=«sk2»,\qquad\frac{(K-3)^2}{4}=\frac{«ek»^2}{4}=«ek2»$$
          $$JB=\frac{«n»}{6}\times(«sk2»+«ek2»)=«n6»\times«w_non»=«jb»$$
          $«jb»>«c2»$ なので棄却する。

          **答え** $JB=«jb»$ で棄却する

          **間違えやすい点** 尖度の定義は 2 通りある（正規分布で 3 になるものと、3 を引いて 0 になる超過尖度）。ここでは 3 を引く。引き忘れると $«w_raw»$ になる。
          正の歪度は右の裾が長いこと、尖度 $«ku»>3$ は正規分布より裾が重いことを表す。

  - id: s20p08
    title: 系統用蓄電池の残量の変動
    context: |
      電力系統の周波数調整に使う蓄電池は、充電と放電を細かく繰り返す。基準時点からの残量の変化 $B(t)$（kWh、$t$ は時間）を、ドリフトのないブラウン運動（$B(0)=0$、$B(t)\sim N(0,\sigma^2t)$、$\sigma^2=«sig2»$ kWh²/時）でモデル化する。
    items:
      - id: s20p08a
        chapter: 15
        terms: [brownian-motion, reflection-principle]
        topic: ブラウン運動の鏡像原理で蓄電池の残量が4時間以内に下限に達する確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          残量が基準より «a» kWh 減ると放電を止める運用である。«t» 時間のうちに一度でも $B(t)\le-«a»$ となる確率に最も近い値はどれか。
          必要なら $\Phi(1.50)=«ph15»$、$\Phi(0.75)=«ph075»$ を使え（$\Phi$ は標準正規分布の分布関数）。
        choices:
          - '$«w_one»$'
          - '$«ans»$'
          - '$«w_t»$'
          - '$«w_t1»$'
          - '$«w_comp»$'
        answer: 1
        distractors:
          - 時刻 4 の時点で下回っている確率だけを求め、途中で達して戻る経路を数えなかった
          - 正解
          - 標準偏差を σ√t ではなく σt とした
          - 標準偏差を σt とし、さらに鏡像の 2 倍もしなかった
          - 一度も達しない確率（余事象）を答えた
        explanation: |
          **方針** 鏡像原理：対称なブラウン運動では、ある時点で水準 $-a$ に達した経路を、その時点以降で上下に折り返した経路も同じ確率で起こる。このため
          $$P\left(\min_{0\le s\le t}B(s)\le-a\right)=2P(B(t)\le-a)$$

          **途中式** $B(«t»)\sim N(0,«sig2»\times«t»)$ なので標準偏差は $\sqrt{«sig2»\times«t»}=«sd»$。
          $$P(B(«t»)\le-«a»)=1-\Phi\left(\frac{«a»}{«sd»}\right)=1-\Phi(«z»)=«tail»$$
          $$P\left(\min_{0\le s\le «t»}B(s)\le-«a»\right)=2\times«tail»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** 時刻 «t» の時点の値だけを見ると $«w_one»$ で、途中で下限に達してから戻った経路を見落とす。鏡像原理で 2 倍になる。
          ブラウン運動の分散は時間に比例するので、標準偏差は $\sigma\sqrt t$。$\sigma t$ とすると $z=«zw»$ になり確率を大きく見積もる。

  - id: s20p09
    title: 夏の日最大電力需要の重回帰
    context: |
      ある地域の夏季 «n» 日について、日最大電力需要 $y$（万kW）を最高気温 $x_1$（℃）と平均湿度 $x_2$（%）で重回帰する（最小二乗法、誤差は独立に同じ分散の正規分布）。
      偏差平方和・偏差積和は次の通りだった。

      | $S_{11}$ | $S_{22}$ | $S_{12}$ | $S_{yy}$ | $S_{1y}$ | $S_{2y}$ |
      |---|---|---|---|---|---|
      | «S11» | «S22» | «S12» | «Syy» | «S1y» | «S2y» |

      （$S_{11}=\sum(x_{1i}-\bar x_1)^2$、$S_{12}=\sum(x_{1i}-\bar x_1)(x_{2i}-\bar x_2)$、$S_{1y}=\sum(x_{1i}-\bar x_1)(y_i-\bar y)$ など。）
    items:
      - id: s20p09a
        chapter: 16
        terms: [normal-equations, regression-coefficient-t-test, least-squares-method]
        topic: 偏差平方和・積和から正規方程式を解き残差平方和と逆行列の対角成分から最高気温の係数のt値を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          最高気温の偏回帰係数 $\hat\beta_1$ について、帰無仮説 $\beta_1=0$ を検定する $t$ 統計量の値を求めよ。
        answer: «t1»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 正規方程式 $\begin{pmatrix}S_{11}&S_{12}\\S_{12}&S_{22}\end{pmatrix}\begin{pmatrix}\hat\beta_1\\\hat\beta_2\end{pmatrix}=\begin{pmatrix}S_{1y}\\S_{2y}\end{pmatrix}$ を解き、残差平方和から誤差分散を推定する。$\hat\beta_1$ の分散は $s^2$ に逆行列の $(1,1)$ 成分を掛けたもの。

          **途中式** $\Delta=S_{11}S_{22}-S_{12}^2=«S11»\times«S22»-«S12»^2=«det»$。
          $$\hat\beta_1=\frac{S_{22}S_{1y}-S_{12}S_{2y}}{\Delta}=\frac{«b1n»}{«det»}=«b1»,\qquad\hat\beta_2=\frac{S_{11}S_{2y}-S_{12}S_{1y}}{\Delta}=\frac{«b2n»}{«det»}=«b2»$$
          残差平方和 $S_e=S_{yy}-\hat\beta_1S_{1y}-\hat\beta_2S_{2y}=«Syy»-«reg1»-«reg2»=«rss»$、$s^2=S_e/(n-3)=«rss»/«dfe»=«s2»$。
          逆行列の $(1,1)$ 成分は $S_{22}/\Delta=«S22»/«det»=«c11»$ なので
          $$\mathrm{SE}(\hat\beta_1)=\sqrt{«s2»\times«c11»}=«se1»,\qquad t=\frac{«b1»}{«se1»}=«t1_4»\cdots$$

          **答え** $«t1_s»$（自由度 «dfe»）

          **間違えやすい点** 単回帰の式 $\sqrt{s^2/S_{11}}$ を標準誤差に使うと、湿度との相関（$r=0.8$）による標準誤差の膨らみを無視して $t=«w_simple»$ になる。
          誤差分散の自由度は $n-(\text{説明変数の数})-1=«dfe»$。$n-2$ で割ると $«w_df»$ になる。単回帰の傾き $S_{1y}/S_{11}=«slope»$ と偏回帰係数は別物。

      - id: s20p09b
        chapter: 17
        terms: [leverage, hat-matrix, outlier-and-influential-point]
        topic: 説明変数どうしの相関を考えて逆行列から重回帰のてこ比を求め組み合わせが珍しい日を見つける
        level: 標準
        definition: false
        type: choice
        question: |
          ある日は、最高気温が平均より «dx1» ℃高いのに、湿度は平均より 3 % 低かった（$x_1-\bar x_1=«dx1»$、$x_2-\bar x_2=«dx2»$）。
          この日のてこ比 $h_{ii}$ と、目安 $2p/n$（$p$ は切片を含む係数の数）との比較として正しいものはどれか。
        choices:
          - '$h_{ii}=«w_ind»$ で、目安 «cut» を下回る'
          - '$h_{ii}=«h»$ で、目安 «cut» を上回る'
          - '$h_{ii}=«w_non»$ で、目安 «cut» を上回る'
          - '$h_{ii}=«w_sign»$ で、目安 «cut» を下回る'
          - '$h_{ii}=«h»$ だが、てこ比は目的変数の値で決まるので、この日の需要が平年並みなら影響はない'
        answer: 1
        distractors:
          - 説明変数の相関を無視して 1/n + Δ1²/S11 + Δ2²/S22 とした
          - 正解
          - 切片の分 1/n を足し忘れた
          - 逆行列の非対角成分の符号を誤った（−S12 を +S12 とした）
          - てこ比は説明変数の値だけで決まり、目的変数の値によらない
        explanation: |
          **方針** 切片を含む重回帰のてこ比は
          $$h_{ii}=\frac1n+\boldsymbol d_i^\top S^{-1}\boldsymbol d_i,\qquad S=\begin{pmatrix}S_{11}&S_{12}\\S_{12}&S_{22}\end{pmatrix},\ \boldsymbol d_i=\begin{pmatrix}x_{1i}-\bar x_1\\x_{2i}-\bar x_2\end{pmatrix}$$
          で、説明変数の「平均からのずれ」を、説明変数どうしの相関を考えて測ったもの。

          **途中式** $S^{-1}=\dfrac{1}{«det»}\begin{pmatrix}«S22»&-«S12»\\-«S12»&«S11»\end{pmatrix}$ より
          $$\boldsymbol d^\top S^{-1}\boldsymbol d=\frac{«S22»\times«dx1»^2-2\times«S12»\times«dx1»\times(«dx2»)+«S11»\times(«dx2»)^2}{«det»}=\frac{«qa»+«qb»+«qc»}{«det»}=«q»$$
          $$h_{ii}=\frac{1}{«n»}+«q»=«inv_n»+«q»=«h5»$$
          $p=3$ なので目安は $2\times3/«n»=«cut»$。$«h»>«cut»$ で、てこ比が大きい。

          **答え** $h_{ii}=«h»$ で、目安を上回る

          **間違えやすい点** 気温と湿度は正の相関（$r=0.8$）をもつので、「暑いのに乾いている」組み合わせは、それぞれの変数のずれは小さくても珍しい。相関を無視すると $«w_ind»$ で見逃す。
          てこ比は説明変数だけで決まる。目的変数の値によっては、この日が回帰係数に大きな影響を与えうる。

      - id: s20p09c
        chapter: 19
        terms: [principal-component-regression, multicollinearity, eigenvalue-and-eigenvector]
        topic: 相関の強い2つの標準化説明変数で第1主成分だけを使う主成分回帰の係数を求め最小二乗推定と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          $x_1,x_2,y$ をそれぞれ標準化すると、相関係数は $r_{12}=«r12»$、$r_{1y}=«r1y»$、$r_{2y}=«r2y»$ になる。
          説明変数の相関行列の第 1 主成分 $z_1=(x_1+x_2)/\sqrt2$（固有値 $1+r_{12}$）だけを使って $y$ を回帰する主成分回帰を行い、その結果を $x_1,x_2$ の係数に戻した。標準化した係数 $(\hat\beta_1,\hat\beta_2)$ として正しいものはどれか。
        choices:
          - '$(«ols1»,\ «ols2»)$'
          - '$(«pcr»,\ «pcr»)$'
          - '$(«w_nolam»,\ «w_nolam»)$'
          - '$(«w_nonorm»,\ «w_nonorm»)$'
          - '$(«pc2»,\ «mpc2»)$'
        answer: 1
        distractors:
          - 主成分回帰ではなく通常の最小二乗推定（標準化偏回帰係数）を答えた
          - 正解
          - 主成分の分散（固有値 1.8）で割るのを忘れた
          - 固有ベクトルを長さ 1 に正規化せず (1,1) のまま使った
          - 固有値の小さい第2主成分だけを使った
        explanation: |
          **方針** 標準化した変数では、$z_1$ の分散は固有値 $\lambda_1=1+r_{12}$、$z_1$ と $y$ の共分散は $(r_{1y}+r_{2y})/\sqrt2$。$y$ を $z_1$ に回帰した係数 $\gamma_1$ を、$z_1=(x_1+x_2)/\sqrt2$ を使って $x_1,x_2$ の係数に戻す。

          **途中式** $\lambda_1=«lam1»$、$\mathrm{Cov}(z_1,y)=\dfrac{«r1y»+«r2y»}{\sqrt2}=«vr»$。
          $$\gamma_1=\frac{«vr»}{«lam1»}=«gam»,\qquad\hat\beta_1=\hat\beta_2=\frac{\gamma_1}{\sqrt2}=\frac{r_{1y}+r_{2y}}{2(1+r_{12})}=\frac{«rsum»}{2\times«lam1»}=«pcr4»$$
          比較：最小二乗推定は $\hat\beta_1=\dfrac{r_{1y}-r_{12}r_{2y}}{1-r_{12}^2}=«ols1»$、$\hat\beta_2=«ols2»$。

          **答え** $(«pcr»,\ «pcr»)$

          **間違えやすい点** 固有値 $1-r_{12}=«lam2»$ の小さい第 2 主成分の方向は推定が不安定で、最小二乗推定の 2 つの係数の大きな差はこの方向から来ている。主成分回帰はこの方向を捨てて分散を下げる（その代わりバイアスが入る）。
          主成分得点の分散は 1 ではなく固有値なので、回帰係数は共分散を固有値で割る。

  - id: s20p10
    title: 配電区域の停電件数
    context: |
      ある電力会社の配電区域の停電件数を分析する。以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s20p10a
        chapter: 12
        terms: [poisson-parameter-test, poisson-distribution]
        topic: 1年間の停電件数の合計から月あたりの停電率が過去の水準より増えたかをポアソン母数の検定で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          過去の停電件数は月平均 «lam0» 件のポアソン分布に従っていた。今年は «months» か月で合計 «tot» 件だった。
          月あたりの平均件数が増えたかを、合計件数の正規近似（連続修正なし）による片側検定（有意水準 5%、上側 5% 点 1.645）で調べる。正しい記述はどれか。
        choices:
          - '$z=«z»$ で 1.645 を超えるので、帰無仮説「月平均 «lam0» 件」を棄却する'
          - '$z=«w_mon»$ で 1.645 を超えないので棄却しない'
          - '$z=«w_var»$ で 1.645 を超えないので棄却しない'
          - '月ごとの件数は 12 個しかないので正規近似は使えず、この検定はできない'
          - '今年の月平均 «mbar» 件は «lam0» 件より大きいので、検定をするまでもなく増えたといえる'
        answer: 0
        distractors:
          - 正解
          - 月平均の差を 1 か月分の標準偏差 √5 で割り、12 か月分の情報を使わなかった
          - 標準偏差ではなく分散 60 で割った
          - 合計件数は平均 60 のポアソン分布で、正規近似が十分よく使える
          - 偶然のばらつきでも月平均は 5 を超えうるので、検定が必要
        explanation: |
          **方針** 帰無仮説のもとで、12 か月の合計 $T$ は平均 $«lam0»\times«months»=«mu0»$ のポアソン分布（分散も «mu0»）に従う。$z=(T-«mu0»)/\sqrt{«mu0»}$ で正規近似する。

          **途中式**
          $$z=\frac{«tot»-«mu0»}{\sqrt{«mu0»}}=\frac{«tot»-«mu0»}{«sq»}=«z4»\cdots$$
          $«z»>1.645$ なので棄却する。

          **答え** $z=«z»$ で棄却する（停電が増えたと判断する）

          **間違えやすい点** ポアソン分布では平均と分散が等しいので、標準誤差は $\sqrt{«mu0»}$。月平均で比べるなら $(«mbar»-«lam0»)/\sqrt{«lam0»/«months»}$ と、標準誤差を $\sqrt{12}$ で割る必要がある（割り忘れると $«w_mon»$）。
          合計件数の平均が大きいので、正規近似はよく当てはまる。

      - id: s20p10b
        chapter: 18
        terms: [deviance, poisson-regression, generalized-linear-model]
        topic: ポアソン回帰の当てはめ値と観測件数から逸脱度を対数の値を使って計算する
        level: 標準
        definition: false
        type: choice
        question: |
          4 つの区域の年間の大規模停電件数 $y_i$ を、切片と説明変数 1 つ（架空線の割合）の対数線形ポアソン回帰で当てはめたところ、当てはめ値 $\hat\mu_i$ は次のようになった。

          | 区域 | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | $y_i$ | «y1» | «y2» | «y3» | «y4» |
          | $\hat\mu_i$ | «m1» | «m2» | «m3» | «m4» |

          このモデルの逸脱度（飽和モデルとの比較）$D=2\sum_i\left\{y_i\log\dfrac{y_i}{\hat\mu_i}-(y_i-\hat\mu_i)\right\}$ に最も近い値はどれか。
          必要なら $\log1.5=«ln15»$、$\log(2/3)=«ln23»$、$\log(11/9)=«ln119»$ を使え。
        choices:
          - '$«w_half»$'
          - '$«D»$'
          - '$«w_sign»$'
          - '$«w_log10»$'
          - '$«w_noy»$'
        answer: 1
        distractors:
          - 全体の 2 倍を掛け忘れた
          - 正解
          - 対数の中を μ/y と逆にした
          - 常用対数で計算した
          - y_i を掛けずに log(y/μ) を足しただけにした
        explanation: |
          **方針** 切片を含むポアソン回帰の最尤推定では $\sum\hat\mu_i=\sum y_i$ となるので、$\sum(y_i-\hat\mu_i)=0$ で第 2 項は消える。残りの $\sum y_i\log(y_i/\hat\mu_i)$ を計算する。

          **途中式** $\sum y_i=«ysum»=\sum\hat\mu_i$。
          $$\sum y_i\log\frac{y_i}{\hat\mu_i}=«y1»\times«ln15»+«y2»\times(«ln23»)+«y3»\times«ln119»+«y4»\times(«ln23»)$$
          $$=«k1»+(«k2»)+«k3»+(«k4»)=«tsum»,\qquad D=2\times«tsum»=«D»$$

          **答え** $«D»$（自由度 $4-2=2$ のカイ二乗分布の 5% 点 5.991 よりずっと小さく、当てはまりは悪くない）

          **間違えやすい点** 逸脱度は対数尤度の差の 2 倍。2 倍を忘れると $«w_half»$ になる。自然対数で計算すること。
          観測値が 0 の区域があるときは $0\log0=0$ とする。

  - id: s20p11
    title: 住宅の断熱改修の実験
    context: |
      住宅の断熱改修による暖房電力量の削減効果を調べる実験を行った。以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s20p11a
        chapter: 20
        terms: [split-plot-design, sum-of-squares-decomposition, fixed-and-random-effects]
        topic: 断熱材を1次因子・設定温度を2次因子とする分割区法で断熱材の効果を1次誤差でF検定する
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの地区（ブロック）それぞれで、3 棟の住宅に 3 種類の断熱材（因子 A、1 次因子）を無作為に割り付け、各住宅の中で 2 つの部屋に 2 通りの暖房設定温度（因子 B、2 次因子）を無作為に割り付けた（分割区法）。
          平方和と自由度は次の通りだった。

          | 要因 | ブロック | A | 1次誤差 | B | A×B | 2次誤差 |
          |---|---|---|---|---|---|---|
          | 平方和 | «ss_blk» | «ss_A» | «ss_E1» | «ss_B» | «ss_AB» | «ss_E2» |
          | 自由度 | «df_blk» | «df_A» | «df_E1» | «df_B» | «df_AB» | «df_E2» |

          断熱材の効果の $F$ 検定（有意水準 5%）について正しいものはどれか。必要なら $F_{0.05}(2,4)=«F24»$、$F_{0.05}(2,6)=«F26»$、$F_{0.05}(2,10)=«F210»$ を使え。
        choices:
          - '$F=«F_e2»$ で、$F_{0.05}(2,6)=«F26»$ を超えるので有意である'
          - '$F=«FA»$ で、$F_{0.05}(2,4)=«F24»$ を超えないので有意でない'
          - '$F=«F_pool»$ で、$F_{0.05}(2,10)=«F210»$ を超えるので有意である'
          - '$F=«FA»$ で、$F_{0.05}(2,6)=«F26»$ を超えるので有意である'
          - '$F=«F_raw»$ で、$F_{0.05}(2,4)=«F24»$ を超えないので有意でない'
        answer: 1
        distractors:
          - 1 次因子の検定に 2 次誤差（部屋の間のばらつき）を使った
          - 正解
          - 1 次誤差と 2 次誤差をプールした
          - F 値は正しいが、分母の自由度を 2 次誤差の 6 とした
          - 平方和の比をそのまま F とした（自由度で割っていない）
        explanation: |
          **方針** 分割区法では誤差が 2 段階ある。1 次因子 A は住宅（1 次単位）ごとに割り付けたので、住宅間のばらつきである **1 次誤差** で検定する。2 次因子 B と交互作用 A×B は 2 次誤差で検定する。

          **途中式**
          $$F_A=\frac{«ss_A»/«df_A»}{«ss_E1»/«df_E1»}=\frac{«ms_A»}{«ms_E1»}=«FA»$$
          分母の自由度は 1 次誤差の «df_E1» なので、$F_{0.05}(2,4)=«F24»$ と比べる。$«FA»<«F24»$ で有意でない。

          **答え** $F=«FA»$ で有意でない

          **間違えやすい点** 部屋の間のばらつき（2 次誤差、平均平方 «ms_E2»）は住宅の間のばらつきより小さい。これを A の検定に使うと $F=«F_e2»$ となり、効果を過大に評価する。
          分割区法では 1 次因子の検定は自由度が小さく検出力が低い。そのぶん、2 次因子と交互作用は精度よく調べられる。

      - id: s20p11b
        chapter: 13
        terms: [permutation-test, nonparametric-methods-overview]
        topic: 改修した3棟としない3棟の暖房電力量の合計について並べ替え検定の正確な片側p値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          6 棟の試験住宅から無作為に 3 棟を選んで断熱改修し、ひと月の暖房電力量（kWh/日）を比べた。
          改修した住宅：«u1»、«u2»、«u3»　改修しない住宅：«n1»、«n2»、«n3»
          「改修に効果はない（どの住宅の値も、改修の有無の割り付けによらない）」という帰無仮説のもとで、改修群の合計が観測値以下になる確率（片側 $p$ 値）を、割り付けをすべて並べ替えて求めたい。$p$ 値はどれか。
        choices:
          - '$«w_lt»$'
          - '$«p»$'
          - '$«w_two»$'
          - '$«w_perm»$'
          - '$«w_ge»$'
        answer: 1
        distractors:
          - 観測値と等しい場合を数えなかった（「以下」ではなく「未満」）
          - 正解
          - 両側の p 値にした
          - 3 棟の選び方を順列 6×5×4=120 通りで数えた
          - 向きを逆にして「以上」になる確率を求めた
        explanation: |
          **方針** 帰無仮説のもとでは 6 つの値は割り付けによらず決まっているので、どの 3 棟が改修群になるかの $\binom63=«ntot»$ 通りが同じ確率で起こる。各割り付けで改修群の合計を計算し、観測値 «obs» 以下になるものを数える。

          **途中式** 観測された改修群の合計は $«u1»+«u2»+«u3»=«obs»$（平均 «mu_up»、改修しない群の平均 «mu_no»）。6 つの値の中から 3 つを選んで合計が «obs» 以下になるのは
          $$\{38,41,43\}\ (122),\qquad\{38,41,45\}\ (124)$$
          の «cnt» 通りだけ（次に小さい $\{38,41,47\}$ と $\{38,43,45\}$ はどちらも 126）。
          $$p=\frac{«cnt»}{«ntot»}=«p»$$

          **答え** $«p»$

          **間違えやすい点** 観測された割り付け自身も「観測値以下」に含める（含めないと $«w_lt»$）。並べ替え検定は無作為な割り付けを根拠にしていて、正規分布を仮定しない。
          この例では 6 棟しかないので、最も極端な割り付けでも $p=1/20=0.05$ にしかならない。小さな実験では検出力が限られる。

  - id: s20p12
    title: 家庭の省エネ行動の調査
    context: |
      ある市が、家庭の電力使用量と省エネ行動について調査した。以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s20p12a
        chapter: 21
        terms: [nonresponse-bias, simple-random-sampling, two-stage-sampling]
        topic: 郵送調査の無回答者から副次標本をとり訪問調査するハンセン・ハーウィッツの方法で平均使用量を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          単純無作為抽出した «n» 世帯に郵送で月間電力使用量（kWh）を尋ねたところ、«n1» 世帯が回答し、その平均は «ybar1» だった。
          無回答の «n2» 世帯から無作為に «m2» 世帯を選んで訪問調査したところ（全世帯から回答を得た）、その平均は «ybar2» だった。
          無回答者の副次標本を使う方法（ハンセン・ハーウィッツ法）で、市全体の平均使用量を推定せよ。
        answer: «est»
        tolerance: 0.1
        answer_format: kWh の単位で、小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 標本を「郵送で回答する層」と「回答しない層」に分け、それぞれの割合 $n_1/n$、$n_2/n$ で重み付けする。無回答の層の平均は副次標本の平均で推定する。

          **途中式**
          $$\hat{\bar Y}=\frac{n_1}{n}\bar y_1+\frac{n_2}{n}\bar y_2=«w1»\times«ybar1»+«w2»\times«ybar2»=«est_s»$$

          **答え** $«est_s»$ kWh

          **間違えやすい点** 回答者だけの平均 «w_resp» は、使用量の多い世帯ほど回答しない傾向があると偏る（無回答バイアス）。
          副次標本の人数（«m2»）で重み付けして $(«n1»\times«ybar1»+«m2»\times«ybar2»)/(«n1»+«m2»)=«w_sub»$ とするのは誤り。訪問した 1 世帯は無回答者 $«n2»/«m2»=4$ 世帯を代表している。

      - id: s20p12b
        chapter: 26
        terms: [structural-equation-modeling, goodness-of-fit-indices]
        topic: 構造方程式モデルと独立モデルのカイ二乗値と自由度から比較適合度指標CFIを求める
        level: 標準
        definition: false
        type: choice
        question: |
          省エネ意識が省エネ行動を通じて使用量に影響するという構造方程式モデルを当てはめたところ、適合度のカイ二乗値は «chi»（自由度 «df»）、
          観測変数がすべて無相関とする独立モデル（基準モデル）では «chi0»（自由度 «df0»）だった。比較適合度指標 CFI に最も近い値はどれか。
        choices:
          - '$«nfi»$'
          - '$«tli»$'
          - '$«cfi»$'
          - '$«w_cfi0»$'
          - '$«w_ratio»$'
        answer: 2
        distractors:
          - 自由度を引かない NFI（1 − χ²/χ0²）を計算した
          - 自由度あたりのカイ二乗値を比べる TLI を計算した
          - 正解
          - 基準モデルの側だけ自由度を引き忘れた
          - χ²/df の比を 1 から引いた
        explanation: |
          **方針** CFI は「カイ二乗値 $-$ 自由度」（非心度の推定値）が、基準モデルに比べてどれだけ減ったかを表す：
          $$\mathrm{CFI}=1-\frac{\max(\chi^2-df,0)}{\max(\chi_0^2-df_0,\ \chi^2-df,\ 0)}$$

          **途中式**
          $$\mathrm{CFI}=1-\frac{«chi»-«df»}{«chi0»-«df0»}=1-\frac{«nc»}{«nc0»}=«cfi5»$$

          **答え** $«cfi»$（0.95 以上でよい当てはまりとされることが多い）

          **間違えやすい点** NFI $=1-\chi^2/\chi_0^2=«nfi»$ は自由度を考えないので、標本が小さいと低めに出る。TLI $=\dfrac{\chi_0^2/df_0-\chi^2/df}{\chi_0^2/df_0-1}=«tli»$ は別の指標。
          CFI は 0 から 1 の範囲に収まるよう $\max$ で切っている。

      - id: s20p12c
        chapter: 33
        terms: [causal-effect, backdoor-criterion, path-analysis]
        topic: 線形構造方程式で交絡因子だけを調整した回帰係数が総合効果になり中間変数も調整すると直接効果になることを求める
        level: 応用
        definition: false
        type: choice
        question: |
          世帯人数 $X$、省エネ診断の受診（の程度）$T$、暖房の設定温度の引き下げ $M$、電力使用量 $Y$（いずれも標準化した量）について、次の線形構造方程式を仮定する（誤差 $\varepsilon$ は互いに独立で、$X$ とも独立。$V[X]=V[T]=1$）。
          $$T=«aXT»X+\varepsilon_T,\quad M=«a»T+\varepsilon_M,\quad Y=«c»T+(«b»)M+«d»X+\varepsilon_Y$$
          十分大きな標本で、$Y$ を $T$ と $X$ の 2 つに重回帰したときの $T$ の係数に最も近い値はどれか。
        choices:
          - '$«c_s»$'
          - '$«total»$'
          - '$«naive»$'
          - '$«ab»$'
          - '$«w_bias»$'
        answer: 1
        distractors:
          - 中間変数 M も調整したときの係数（直接効果）を答えた
          - 正解
          - 交絡因子 X を調整しなかったときの係数を答えた
          - M を経由する間接効果だけを答えた
          - 交絡による偏りの向きを逆にした
        explanation: |
          **方針** $X$ は $T$ と $Y$ の共通原因（交絡因子）、$M$ は $T$ から $Y$ への経路の途中にある中間変数。バックドア基準を満たすのは $\{X\}$ で、$X$ だけを調整すると $T$ の総合効果（直接効果 $+$ 間接効果）が得られる。

          **途中式** $M$ を代入すると
          $$Y=\{«c»+«a»\times(«b»)\}T+«d»X+(«b»\varepsilon_M+\varepsilon_Y)$$
          残りの誤差は $T$ とも $X$ とも無相関なので、$Y$ を $T,X$ に回帰した $T$ の係数は
          $$«c»+(«ab»)=«total»$$

          **答え** $«total»$（直接効果 $«c»$ と、$M$ を通る間接効果 $«a»\times(«b»)=«ab»$ の和）

          **間違えやすい点** $M$ まで調整すると間接効果が消えて直接効果 $«c»$ だけになる（中間変数を調整してはいけない）。
          $X$ を調整しないと、$\mathrm{Cov}(T,Y)/V[T]=«total»+«d»\times«aXT»=«naive»$ となり、世帯人数の多い家庭ほど受診しやすく使用量も多いことによる偏り $+«bias»$ が入る。

  - id: s20p13
    title: 日射計の欠測と平均値代入
    context: |
      太陽光発電所の日射計が故障し、ある月（«n» 日）のうち «miss» 日の日射量が欠測した。欠測は故障の時期だけで決まり、日射量の大きさとは無関係（MCAR）とみなせる。
      観測できた «r» 日の日射量（kWh/m²）の不偏分散は «s2» だった。
    items:
      - id: s20p13a
        chapter: 29
        terms: [single-imputation, mcar, missing-data-mechanism]
        topic: 欠測日を観測日の平均で単一代入したデータから計算した不偏分散が過小になる大きさを求める
        level: 基本
        definition: false
        type: numeric
        question: |
          欠測した «miss» 日に観測日の平均値を代入し、«n» 日分のデータとして不偏分散（$n-1$ で割る）を計算すると、いくらになるか。
        answer: «v»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 代入した値は観測日の平均そのものなので、平均は変わらず、偏差平方和にも寄与しない（偏差 0）。偏差平方和は観測日の分だけで、割る数だけが $n-1$ に増える。

          **途中式** 観測日の偏差平方和 $=(r-1)s^2=«rm1»\times«s2»=«ss»$。
          $$\frac{«ss»}{«n»-1}=\frac{«ss»}{«nm1»}=«v4»\cdots$$
          （もとの $s^2$ の $«rm1»/«nm1»=«ratio»$ 倍。）

          **答え** $«v_s»$

          **間違えやすい点** 平均値代入をすると、平均の推定には偏りがなくても（MCAR のとき）、ばらつきを過小評価し、標準誤差も小さく出る（データが «n» 個あるように見えてしまう）。
          $r s^2/n=«w_n»$ と計算しないこと。不確かさを正しく反映するには、多重代入などを使う。
