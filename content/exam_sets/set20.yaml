          - 住宅と週の平方和も誤差に含めて一元配置として解析した
          - 平方和の比をそのまま F とした（自由度で割っていない）
          - 住宅だけをブロックとする乱塊法として解析し、週の平方和を誤差に入れた
        explanation: |
          **方針** $k\times k$ ラテン方格の平方和の分解は「総 $=$ 行 $+$ 列 $+$ 処理 $+$ 誤差」、自由度は $k^2-1=(k-1)+(k-1)+(k-1)+(k-1)(k-2)$。

          **途中式** 誤差平方和 $=«ss_tot»-«ss_r»-«ss_c»-«ss_t»=«ss_e»$、誤差の自由度 $=(«k»-1)(«k»-2)=«df_e»$。
          $$F=\frac{«ss_t»/«df_t»}{«ss_e»/«df_e»}=\frac{«ms_t»}{«ms_e»}=«F»$$
          $«F»>F_{0.05}(3,6)=«F36»$ なので、断熱材の効果は 5% 水準で有意。

          **答え** $F=«F»$ で有意である

          **間違えやすい点** 自由度の合計 «df_tot» から行・列・処理の $3\times3=9$ を引くと誤差は 6。列（週）を引き忘れて 9 とすると $F=«w9»$ になる（誤差の平均平方を小さく見積もる）。
          住宅と週の違いを誤差に入れてしまうと誤差が大きくなり、$F=«w1»$ で効果を見逃す。ラテン方格は 2 つの局所管理（ブロック）を同時に行う計画である。

  - id: s20p13
    title: 世帯の電力使用量の調査
    context: |
      ある市の «N» 世帯について、家庭の月間電力使用量（kWh）を調べる。
      以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s20p13a
        chapter: 21
        terms: [simple-random-sampling, finite-population-correction, required-sample-size]
        topic: 有限母集団修正を考慮して世帯の平均電力使用量を所定の誤差で推定する単純無作為抽出の標本数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          非復元の単純無作為抽出で $n$ 世帯を選び、標本平均 $\bar y$ で市全体の平均使用量を推定する。過去の調査から母集団の分散（$N-1$ で割ったもの）は $S^2=«S»^2$ とみなせる。
          $\bar y$ の分散は $V[\bar y]=\left(1-\dfrac{n}{N}\right)\dfrac{S^2}{n}$ である。正規近似で 95% 信頼区間の半幅 $1.96\sqrt{V[\bar y]}$ を «e» kWh 以下にするのに必要な最小の $n$ を求めよ。
        answer: «nreq»
        tolerance: 0.5
        answer_format: 整数で答えよ。±0.5 未満の差まで正解とする。
        explanation: |
          **方針** $1.96\sqrt{(1-n/N)S^2/n}\le e$ を $n$ について解く。$n_0=(1.96S/e)^2$ とおくと $n\ge\dfrac{n_0}{1+n_0/N}$。

          **途中式**
          $$\left(\frac1n-\frac1N\right)S^2\le\left(\frac{e}{1.96}\right)^2\iff \frac1n\le\frac{1}{n_0}+\frac1N\iff n\ge\frac{n_0}{1+n_0/N}$$
          $$n_0=\left(\frac{1.96\times«S»}{«e»}\right)^2=«zS»^2=«n0»,\qquad n\ge\frac{«n0»}{1+«n0»/«N»}=\frac{«n0»}{1+«n0N»}=«nraw»$$
          整数に切り上げて $n=«nreq»$。

          **答え** $«nreq»$ 世帯

          **間違えやすい点** 有限母集団修正を付けないと $n_0$ を切り上げて «w_nofpc» 世帯になり、必要以上に多く調べることになる。母集団に対して標本が 1 割を超えるような場合は修正の効果が大きい。
          「必要な最小の $n$」なので四捨五入ではなく切り上げる。

      - id: s20p13b
        chapter: 26
        terms: [quantification-type-1, dummy-variable]
        topic: 数量化I類のダミー変数回帰の係数をカテゴリーの構成比で重み付き平均0に基準化してスコアと定数項を求める
        level: 標準
        definition: false
        type: choice
        question: |
          調査した世帯の使用量を、2 つのアイテム「住宅の形態（戸建て・集合住宅）」と「世帯人数（1 人・2 人・3 人以上）」で説明する数量化 I 類を行う。
          集合住宅と 1 人を基準（係数 0）にしたダミー変数の回帰で、定数項 «const»、戸建て «b_house»、2 人 «b2»、3 人以上 «b3» を得た。
          標本の構成比は、戸建て «w_house»・集合住宅 «w_apt»、1 人 «w1»・2 人 «w2»・3 人以上 «w3» である。
          各アイテムのカテゴリースコアを、構成比で重み付けた平均が 0 になるように基準化したとき、基準化後の定数項と「2 人」のカテゴリースコアの組として正しいものはどれか。
        choices:
          - '定数項 «const»、2 人のスコア «b2»'
          - '定数項 «const_n»、2 人のスコア «sc2»'
          - '定数項 «w_un_const»、2 人のスコア «w_un_sc2»'
          - '定数項 «w_c_noh»、2 人のスコア «sc2»'
          - '定数項 «w_c_neg»、2 人のスコア «sc2»'
        answer: 1
        distractors:
          - 基準化をせず、ダミー変数の係数のままにした
          - 正解
          - 構成比で重み付けず、カテゴリーの単純平均で基準化した
          - 住宅の形態のアイテムの分を定数項に移し忘れた
          - 各アイテムの重み付き平均を定数項から引いた（足すべき）
        explanation: |
          **方針** 各アイテムのスコアからそのアイテムの重み付き平均を引き、引いた分を定数項に足す。予測値（定数項 $+$ 各スコア）はどの世帯でも変わらない。

          **途中式** 住宅の形態の重み付き平均 $=«w_house»\times«b_house»+«w_apt»\times0=«mh»$ なので、戸建て $«b_house»-«mh»=«sc_house»$、集合住宅 $0-«mh»=«sc_apt»$。
          世帯人数の重み付き平均 $=«w1»\times0+«w2»\times«b2»+«w3»\times«b3»=«mp»$ なので、1 人 $«sc1»$、2 人 $«b2»-«mp»=«sc2»$、3 人以上 $«b3»-«mp»=«sc3»$。
          定数項 $=«const»+«mh»+«mp»=«const_n»$（標本全体の予測値の平均）。

          **答え** 定数項 «const_n»、2 人のスコア «sc2»

          **間違えやすい点** 基準化しても各アイテムのレンジ（最大スコア $-$ 最小スコア：住宅の形態 «b_house»、世帯人数 «b3»）は変わらない。基準化で変わるのはスコアの原点だけで、どのアイテムの影響が大きいかの判断（レンジの比較）には影響しない。
          重みを付けずに単純平均で基準化すると、構成比が偏っているときに定数項が全体平均からずれる。

      - id: s20p13c
        chapter: 33
        terms: [causal-effect, backdoor-criterion]
        topic: 住宅形態ごとの傾向スコアの逆数で重み付けして省エネ家電への買い替えが電力使用量に与える平均因果効果を推定する
        level: 応用
        definition: false
        type: numeric
        question: |
          市の買い替え補助で省エネ家電に買い替えたか（$T=1$）否か（$T=0$）が月間使用量 $Y$ に与える平均因果効果 $E[Y(1)]-E[Y(0)]$ を、無作為に選んだ «Ntot» 世帯の観察データから推定する。
          住宅の形態だけが交絡因子で、形態が同じなら買い替えは使用量の潜在的な値と無関係に決まるとする。

          | 住宅の形態 | 世帯数 | 買い替えた世帯数 | その平均使用量 | 買い替えない世帯数 | その平均使用量 |
          |---|---|---|---|---|---|
          | 戸建て | «Nh» | «h1» | «hy1» | «h0» | «hy0» |
          | 集合住宅 | «Na» | «a1» | «ay1» | «a0» | «ay0» |

          形態ごとの買い替えの割合を傾向スコア $e(x)$ とし、逆確率重み付け（IPW）推定量
          $$\hat E[Y(1)]=\frac{1}{n}\sum_{i}\frac{T_iY_i}{e(x_i)},\qquad \hat E[Y(0)]=\frac{1}{n}\sum_{i}\frac{(1-T_i)Y_i}{1-e(x_i)}$$
          で平均因果効果を推定せよ（$n=«Ntot»$）。
        answer: «ate»
        tolerance: 0.1
        answer_format: kWh の単位で、小数第1位まで（小数第2位を四捨五入）で答えよ。負の値は符号もつけて答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 傾向スコアは戸建て $e=«h1»/«Nh»=«e_h»$、集合住宅 $e=«a1»/«Na»=«e_a»$。各世帯の使用量を「その世帯が受けた処置の確率」の逆数で重み付けすると、交絡因子の分布をそろえた比較になる。各群の和は「世帯数 $\times$ 平均」で求まる。

          **途中式**
          $$\hat E[Y(1)]=\frac{1}{«Ntot»}\left(\frac{«h1»\times«hy1»}{«e_h»}+\frac{«a1»\times«ay1»}{«e_a»}\right)=\frac{«t1h»+«t1a»}{«Ntot»}=«m1»$$
          $$\hat E[Y(0)]=\frac{1}{«Ntot»}\left(\frac{«h0»\times«hy0»}{«ome_h»}+\frac{«a0»\times«ay0»}{«ome_a»}\right)=\frac{«t0h»+«t0a»}{«Ntot»}=«m0»$$
          $$\hat E[Y(1)]-\hat E[Y(0)]=«m1»-«m0»=«ate_s»$$

          **答え** $«ate_s»$ kWh（買い替えで月に約 28 kWh 減る）

          **間違えやすい点** 形態を無視して単純に比べると、買い替えた世帯の平均 «naive1» と買い替えない世帯の平均 «naive0» の差は $+«naive»$ で、符号が逆になる。使用量の多い戸建てほど買い替えやすいという交絡のためである。
          重みは傾向スコアの**逆数**。$1-e(x)$ の側（買い替えない世帯）も、形態ごとに違う重みになることに注意する。
          この例では、形態ごとの差を世帯数で重み付けたバックドア調整 $\frac{«Nh»}{«Ntot»}(«hy1»-«hy0»)+\frac{«Na»}{«Ntot»}(«ay1»-«ay0»)=«std»$ と一致する（傾向スコアを標本の割合で推定したため）。

  - id: s20p14
    title: 日射計の欠測と多重代入
    context: |
      太陽光発電所の日射計が故障し、1 年のうち一部の日の日射量が欠測した。欠測を、気象衛星のデータなどを使った代入モデルで $m=«m»$ 回の多重代入により補い、それぞれの補完データで年間の日平均日射量（kWh/m²）とその推定量の分散を求めた。

      | 代入 | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | 推定値 $\hat Q_j$ | «Q1» | «Q2» | «Q3» | «Q4» | «Q5» |
      | 分散 $U_j$ | «U1» | «U2» | «U3» | «U4» | «U5» |
    items:
      - id: s20p14a
        chapter: 29
        terms: [multiple-imputation, rubins-rules]
        topic: 日射量の欠測を5回の多重代入で補った推定値をルービンのルールで統合し標準誤差を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ルービンのルールで 5 つの結果を統合したとき、統合した推定値の標準誤差を求めよ。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 統合推定値は $\bar Q=\frac1m\sum\hat Q_j$。全分散は「代入内分散の平均 $\bar U$」と「代入間分散 $B=\frac{1}{m-1}\sum(\hat Q_j-\bar Q)^2$」から $T=\bar U+\left(1+\frac1m\right)B$。標準誤差は $\sqrt T$。

          **途中式** $\bar Q=«qb»$。偏差は $«d1»,\ «d2»,\ «d3»,\ «d4»,\ «d5»$ で、2 乗和は $«sqd»$。
          $$\bar U=«W»,\qquad B=\frac{«sqd»}{«m»-1}=«B»$$
          $$T=«W»+«fac»\times«B»=«W»+«fB»=«T»,\qquad \sqrt{T}=«se5»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** 代入内分散 $\bar U$ だけを使うと $\sqrt{«W»}=«w_W»$ で、欠測による不確かさを無視して標準誤差を小さく見積もる。
          $(1+1/m)$ を掛け忘れると $«w_nofac»$、$B$ を $m$ で割ると $«w_Bm»$ になる。$1/m$ の項は、代入の回数が有限であるために $\bar Q$ 自体がばらつく分の補正である。
