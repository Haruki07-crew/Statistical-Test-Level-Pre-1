  - id: s15p07
    title: 病棟・病院間の比較
    context: |
      ある医療法人で、院内感染と在院日数について病棟や病院の間の違いを調べている。
    items:
      - id: s15p07a
        chapter: 12
        terms: [two-sample-proportion-test, proportion-test]
        topic: 2病棟の院内感染率の差をプールした比率の標準誤差によるz検定で比べ別の標準誤差では結論が変わることを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          病棟 A では入院患者 «nA» 人中 «xA» 人、病棟 B では «nB» 人中 «xB» 人に院内感染が起きた。
          「2 病棟の感染率は等しい」という帰無仮説を、帰無仮説のもとでの共通の比率（プールした比率）を使う $z$ 検定で、**両側**有意水準 5% で検定する。正しいものはどれか。
        choices:
          - "$z=«z1»$ で 1.96 を超えるので、帰無仮説を棄却する"
          - "$z=«z»$ で 1.96 を超えないので、帰無仮説を棄却しない"
          - "$z=«z»$ で 1.645 を超えるので、帰無仮説を棄却する"
          - "$z=«zbad»$ で 1.96 を超えるので、帰無仮説を棄却する"
          - "感染率の比が «rr» で 1 より大きいので、帰無仮説を棄却する"
        answer: 1
        distractors:
          - プールせずに各病棟の比率で標準誤差を作った
          - 正解
          - 両側検定なのに片側 5% 点 1.645 と比べた
          - 標準誤差の (1/n_A+1/n_B) を 1/(n_A+n_B) とした
          - 標本の比率の比を見ただけで、ばらつきを考えなかった
        explanation: |
          **方針** 帰無仮説のもとでは 2 病棟の感染率は共通なので、合わせた比率 $\hat p$ で標準誤差 $\sqrt{\hat p(1-\hat p)(1/n_A+1/n_B)}$ を作る。

          **途中式** $\hat p_A=«xA»/«nA»=«pA»$、$\hat p_B=«xB»/«nB»=«pB»$、$\hat p=«xs»/«ns»=«pp»$。
          $$SE=\sqrt{«pp»\times«qq»\times\left(\frac1{«nA»}+\frac1{«nB»}\right)}=\sqrt{«ppq»\times«inv»}=«se0»$$
          $$z=\frac{«pA»-«pB»}{«se0»}=\frac{«dp»}{«se0»}=«z»$$
          $|z|<1.96$ なので棄却しない。

          **答え** $z=«z»$、両側 5% で棄却しない。

          **間違えやすい点** 各病棟の比率で標準誤差を作る（$SE=«se1»$）と $z=«z1»$ となり、境界付近では結論が逆になる。検定ではプールした比率、信頼区間では各群の比率を使うのが基本。
          両側検定なので 1.96 と比べる。比率の比 «rr» が大きく見えても、件数が少ないと偶然の範囲に入ることがある。

      - id: s15p07b
        chapter: 31
        terms: [jeffreys-prior, noninformative-prior, posterior-distribution]
        topic: 二項分布のフィッシャー情報量からジェフリーズ事前分布を作り感染が少ない病棟の感染率の事後平均を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          新しく開設した病棟 C では、入院患者 «n» 人中 «x» 人に院内感染が起きた。感染率 $p$ に対し、二項分布のフィッシャー情報量 $I(p)$ の平方根に比例する事前分布（ジェフリーズ事前分布）を置くとき、$p$ の事後平均を求めよ。
          なお、密度が $p^{a-1}(1-p)^{b-1}$ に比例するベータ分布 $\text{Be}(a,b)$ の平均は $a/(a+b)$ である。
        answer: «jm»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 1 回のベルヌーイ試行のフィッシャー情報量は $1/\{p(1-p)\}$（$n$ 回なら $n/\{p(1-p)\}$）。その平方根に比例する事前分布は $p^{-1/2}(1-p)^{-1/2}$、すなわち $\text{Be}(1/2,1/2)$。二項尤度 $p^x(1-p)^{n-x}$ を掛けて事後分布を読み取る。

          **途中式**
          $$\pi(p\mid x)\propto p^{-1/2}(1-p)^{-1/2}\cdot p^{«x»}(1-p)^{«n»-«x»}=p^{«a»-1}(1-p)^{«b»-1}$$
          事後分布は $\text{Be}(«a»,«b»)$ で、事後平均は
          $$\frac{«a»}{«a»+«b»}=\frac{«a»}{«ab»}=«jm5»$$

          **答え** $«jm4»$

          **間違えやすい点** 一様事前分布 $\text{Be}(1,1)$ なら $(x+1)/(n+2)=«w_unif»$、最尤推定値は $x/n=«w_mle»$ で、それぞれ別の値。ジェフリーズ事前分布は「成功・失敗を半件ずつ足す」ことにあたり、一様分布より事前の情報が弱い。
          $I(p)$ の平方根であり、$I(p)$ そのもの（$p^{-1}(1-p)^{-1}$、正規化できない）ではない。

  - id: s15p08
    title: 集中治療室の病床の埋まり具合
    context: |
      ある病院の集中治療室（ICU）には 3 床ある。1 日ごとの使用中の病床数 $X_t\in\{0,1,2,3\}$ を、次のようなマルコフ連鎖とみなす。
      1 日の間に起きる変化は高々 1 人分とし、

      - 空き床があれば（$X_t<3$）、確率 «up» で 1 人入室して $X_{t+1}=X_t+1$
      - $X_t=k\ (k\ge1)$ のとき、確率 $0.2k$ で 1 人退室して $X_{t+1}=X_t-1$
      - それ以外は変化なし（満床のときの入室希望は他院へ回す）

      とする。たとえば $X_t=1$ のとき、増える確率 «up»、減る確率 «d1»、変わらない確率 «st1» である。
    items:
      - id: s15p08a
        chapter: 14
        terms: [detailed-balance, stationary-distribution, ergodicity]
        topic: ICUの使用病床数の出生死滅型マルコフ連鎖で詳細つり合い条件から定常分布を求め満床の長期割合を出す
        level: 応用
        definition: false
        type: numeric
        question: |
          長い期間で見て、ICU が満床（$X_t=3$）である日の割合（定常分布の $\pi_3$）を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 隣どうしの状態の間でしか移らない出生死滅型の連鎖では、定常分布が詳細つり合い条件 $\pi_kP(k\to k+1)=\pi_{k+1}P(k+1\to k)$ を満たす。これを順に使って $\pi_0$ で表し、和を 1 にする。

          **途中式**
          $$\pi_1=\pi_0\times\frac{«up»}{«d1»}=«w1»\pi_0,\quad \pi_2=\pi_1\times\frac{«up»}{«d2»}=«w2»\pi_0,\quad \pi_3=\pi_2\times\frac{«up»}{«d3»}=\frac43\pi_0$$
          $$\pi_0\left(1+2+2+\frac43\right)=\frac{19}{3}\pi_0=1\iff\pi_0=\frac3{19}$$
          $$\pi_3=\frac43\times\frac3{19}=\frac4{19}=«ans4»$$

          **答え** $«ans»$（約 21% の日が満床）

          **間違えやすい点** 4 状態を等しく $1/4=«w_eq»$ とするのは誤り。退室確率は在室人数に比例して増えるので、各状態の重みは異なる。
          この連鎖は既約で非周期的（変化しない確率が正）なので、定常分布はただ 1 つで、長期の割合に一致する。

  - id: s15p09
    title: 看護ケアの実験計画と比較
    context: |
      ある病院の看護部で、ケアの方法を改善するための実験を行っている。
    items:
      - id: s15p09a
        chapter: 20
        terms: [fisher-three-principles, randomized-block-design]
        topic: 手指消毒法の比較実験の手順をフィッシャーの3原則（反復・無作為化・局所管理）に対応づける
        level: 基本
        definition: true
        type: choice
        question: |
          3 種類の手指消毒法 A, B, C を比べる実験を、次の手順で計画した。

          - (ア) 病棟によって手指の汚れ方が違うので、病棟ごとに 3 つの方法をすべて試し、病棟の違いを比較から除く。
          - (イ) 各病棟で、どの看護師にどの方法を割り当てるかを乱数で決める。
          - (ウ) 各病棟で、それぞれの方法を複数の看護師で行い、同じ条件の中のばらつき（誤差）を見積もれるようにする。

          (ア)・(イ)・(ウ) にあたるフィッシャーの 3 原則の組合せとして正しいものはどれか。
        choices:
          - "(ア) 無作為化、(イ) 局所管理、(ウ) 反復"
          - "(ア) 反復、(イ) 無作為化、(ウ) 局所管理"
          - "(ア) 局所管理、(イ) 反復、(ウ) 無作為化"
          - "(ア) 局所管理、(イ) 無作為化、(ウ) 反復"
          - "(ア) 局所管理、(イ) 無作為化、(ウ) 交絡"
        answer: 3
        distractors:
          - 病棟に分けることを無作為化と取り違えた
          - 病棟ごとに全方法を試すことを反復と取り違えた
          - 乱数による割り付けを反復と取り違えた
          - 正解
          - 反復を交絡と取り違えた（交絡は効果を区別できなくなることで、原則ではない）
        explanation: |
          **方針** フィッシャーの 3 原則は、反復（誤差の大きさを見積もる）、無作為化（系統的な偏りを偶然の誤差に変える）、局所管理（実験の場をブロックに分けて、ブロックの違いを比較から除く）。

          **途中式** (ア) 病棟をブロックとし、ブロックの中で処理を比べるので局所管理（乱塊法）。
          (イ) 割り当てを乱数で決めるので無作為化。看護師の熟練度などの見えない要因が特定の方法に偏るのを防ぐ。
          (ウ) 同じ条件を複数回行うので反復。誤差分散を推定でき、検定ができるようになる。

          **答え** (ア) 局所管理、(イ) 無作為化、(ウ) 反復

          **間違えやすい点** 局所管理は「ブロック内を均一にして比べる」ことで、無作為化と組み合わせて使う（ブロック内での割り付けは無作為に行う）。交絡は効果どうしを区別できなくなることで、3 原則には含まれない。

      - id: s15p09b
        chapter: 13
        terms: [wilcoxon-signed-rank-test, rank-and-ties]
        topic: 新旧マットレスの体圧の差6組にウィルコクソンの符号付き順位検定を行い全64通りの数え上げで正確な片側p値を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          褥瘡予防のため、入所者 «n» 人に旧マットレスと新マットレスの両方を使ってもらい、仙骨部の体圧（mmHg）を測った。差（旧 − 新）は次のとおり（0 や同順位はない）。

          $$«d1»,\ «d2»,\ «d3»,\ «d4»,\ «d5»,\ «d6»$$

          帰無仮説「差の分布は 0 について対称」、対立仮説「新マットレスのほうが体圧が低い（差の分布が正の側にずれる）」として、ウィルコクソンの符号付き順位検定を行う。
          差の絶対値に小さい順に 1〜«n» の順位をつけ、正の差の順位の和 $W^+$ を統計量とする。帰無仮説のもとでの $W^+$ の**正確な**分布（正規近似を使わない）による片側 $p$ 値 $P(W^+\ge w^+_{\text{obs}})$ を求めよ（$w^+_{\text{obs}}$ は $W^+$ の観測値）。
        answer: «p»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 差の絶対値に順位をつけ、正の差の順位を足す。帰無仮説のもとでは各順位の符号が独立に確率 1/2 で正負になるので、$2^{«n»}=«N»$ 通りが等確率。$W^+$ が観測値以上になる通りを数える。

          **途中式** 絶対値の小さい順に順位をつけると、«d2»→1、«d3»→2、«d5»→3、«d6»→4、«d1»→5、«d4»→6。負の差は «d3»（順位 2）だけなので
          $$W^+=«tot»-2=«wp»\qquad(W^-=«wm»)$$
          $W^+\ge«wp»$ は $W^-\le2$ と同じで、負の順位の組が「なし」「1 だけ」「2 だけ」の «cnt» 通り。
          $$p=\frac{«cnt»}{«N»}=«p6»$$

          **答え** $«p»$（片側 5% で有意）

          **間違えやすい点** 「$W^+$ が観測値と等しい場合」だけでなく、それより極端な場合も数える。両側検定なら 2 倍の $«w_two»$ になる。標本が小さいので正規近似ではなく正確な分布を使う。

  - id: s15p10
    title: 腎機能の予測モデル
    context: |
      慢性腎臓病の外来患者 «n» 人について、推算糸球体濾過量 eGFR（mL/分/1.73m²）を目的変数とする回帰モデルを検討している。
    items:
      - id: s15p10a
        chapter: 17
        terms: [dfbetas, outlier-and-influential-point, leverage]
        topic: 1人を除いて当てはめ直した傾きの変化と除外後の残差標準偏差から単回帰の傾きのDFBETASを求める
        level: 応用
        definition: false
        type: choice
        question: |
          eGFR を年齢 $x$（歳）に単回帰した。全 «n» 人での傾きは $\hat\beta_1=«bb»$、残差標準偏差は $s=«sa»$、年齢の偏差平方和は $S_{xx}=\sum(x_i-\bar x)^2=«sxx»$ だった。
          ある患者 $i$ を除いて当てはめ直すと、傾きは $\hat\beta_{1(i)}=«bi»$、残差標準偏差は $s_{(i)}=«si»$ になった。
          $$\text{DFBETAS}_{1,i}=\frac{\hat\beta_1-\hat\beta_{1(i)}}{s_{(i)}\sqrt{c_{11}}}$$
          （$c_{11}$ は $(X^\top X)^{-1}$ の傾きに対応する対角成分で、単回帰では $1/S_{xx}$）の値に最も近いものはどれか。
        choices:
          - "$«c_sall»$"
          - "$«dfb»$"
          - "$«c_pos»$"
          - "$«c_raw»$"
          - "$«c_nosq»$"
        answer: 1
        distractors:
          - 分母に除外前の残差標準偏差 s=8.5 を使った
          - 正解
          - 差の向きを逆（除外後 − 除外前）にした
          - 傾きの変化量だけを答え、標準誤差で割らなかった
          - √c11 の平方根をとらず 1/S_xx をそのまま使った
        explanation: |
          **方針** DFBETAS は「その 1 人を除いたときの係数の変化」を、その 1 人を除いた残差標準偏差で作った係数の標準誤差で割ったもの。目安として $|\text{DFBETAS}|>2/\sqrt n$ なら影響が大きい。

          **途中式** $\sqrt{c_{11}}=1/\sqrt{«sxx»}=1/«sq»$ なので、分母は $«si»/«sq»=«den»$。
          $$\text{DFBETAS}_{1,i}=\frac{«bb»-(«bi»)}{«den»}=\frac{«db»}{«den»}=«dfb»$$

          **答え** $«dfb»$。絶対値は目安 $2/\sqrt{«n»}=«cut»$ を超えるので、この患者は傾きに大きな影響を与えている。

          **間違えやすい点** 分母には除外後の $s_{(i)}=«si»$ を使う（除外前の «sa» だと $«c_sall»$）。差は「全データ − 除外後」の順で、符号は「この人がいると傾きがどちらに動くか」を表す（ここでは負の向きに急になる）。
          $c_{11}$ は平方根をとって使う。

      - id: s15p10b
        chapter: 19
        terms: [elastic-net, lasso, ridge-regression]
        topic: 直交化した説明変数のエラスティックネット推定値を最小二乗推定値の軟閾値処理と縮小から求める
        level: 標準
        definition: false
        type: choice
        question: |
          多数の検査値を主成分で直交化した 3 つの説明変数 $z_1,z_2,z_3$（$Z^\top Z=I$）を使い、eGFR（中心化済み）$y$ を予測する。最小二乗推定値は $\hat b=(«b1»,\ «b2»,\ «b3»)$ だった。
          目的関数
          $$\frac12\|y-Z\beta\|^2+\lambda_1\sum_{j}|\beta_j|+\frac{\lambda_2}{2}\sum_j\beta_j^2,\qquad \lambda_1=«l1»,\ \lambda_2=«l2»$$
          を最小にするエラスティックネット推定値として正しいものはどれか。
        choices:
          - "$«lasso»$"
          - "$«ridge»$"
          - "$«en»$"
          - "$«rthen»$"
          - "$«nozero»$"
        answer: 2
        distractors:
          - ラッソの軟閾値処理だけを行い、リッジの縮小 1/(1+λ2) を忘れた
          - リッジの縮小だけを行い、軟閾値処理を忘れた
          - 正解
          - 先に 1/(1+λ2) 倍してから λ1 で軟閾値処理した（順序が違う）
          - b_j の絶対値が λ1 より小さい成分を 0 にせず、負の値を残した
        explanation: |
          **方針** $Z^\top Z=I$ なら目的関数は成分ごとに $\frac12(\beta_j-\hat b_j)^2+\lambda_1|\beta_j|+\frac{\lambda_2}{2}\beta_j^2$（＋定数）に分かれる。微分して解くと
          $$\hat\beta_j=\frac{\operatorname{sign}(\hat b_j)\,(|\hat b_j|-\lambda_1)_+}{1+\lambda_2}$$
          （軟閾値処理のあと $1/(1+\lambda_2)$ 倍）。

          **途中式** 軟閾値処理 $(|\hat b_j|-«l1»)_+$ に符号をつけると $(«st1»,\ «st2»,\ «st3»)$（$|«b3»|<«l1»$ なので 0）。これを $1+\lambda_2=«opl»$ で割って
          $$\hat\beta=«en»$$

          **答え** $«en»$

          **間違えやすい点** 軟閾値処理だけならラッソ $«lasso»$、縮小だけならリッジ $«ridge»$。エラスティックネットは両方を行い、変数選択（0 になる成分）と縮小を同時にする。
          先に縮小すると閾値の効き方が変わり $«rthen»$ になる。$|\hat b_j|\le\lambda_1$ の成分は 0 にする（負にはしない）。

      - id: s15p10c
        chapter: 30
        terms: [bias-variance-tradeoff, generalization-error, overfitting]
        topic: 2つの予測モデルの偏りと分散から新しい患者の期待予測誤差を分解して比べる
        level: 標準
        definition: false
        type: choice
        question: |
          新しい患者 1 人の eGFR を予測する 2 つの方法を、学習データを何度も取り直すシミュレーションで評価した。その患者の条件での予測値について

          - モデル A（変数が少ない）：偏り（予測値の平均 − 真の平均）«bA»、予測値の分散 «vA»
          - モデル B（変数が多い）：偏り «bB»、予測値の分散 «vB»

          だった。新しい観測そのものの誤差分散（どのモデルでも減らせない誤差）は $\sigma^2=«s2»$ である。
          期待二乗予測誤差が小さいほうのモデルと、その値の組として正しいものはどれか。
        choices:
          - "モデル A（«e_nosqA»）"
          - "モデル B（«eB»）"
          - "モデル B（«e_nos2B»）"
          - "モデル A（«e_rawA»）"
          - "モデル B（«e_novB»）"
        answer: 1
        distractors:
          - 偏りを 2 乗しなかった（A 12.00、B 14.00 となり A を選んだ）
          - 正解
          - 減らせない誤差 σ² を足し忘れた
          - 偏りを 2 乗せず σ² も足さなかった
          - 予測値の分散を足し忘れた
        explanation: |
          **方針** 新しい観測 $y_0$ に対する期待二乗予測誤差は $E[(y_0-\hat y_0)^2]=\sigma^2+(\text{偏り})^2+(\text{予測値の分散})$ と分解できる。

          **途中式**
          $$\text{A}:\ «s2»+«bA»^2+«vA»=«s2»+«bA2»+«vA»=«eA»,\qquad \text{B}:\ «s2»+«bB»^2+«vB»=«s2»+«bB2»+«vB»=«eB»$$

          **答え** モデル B（«eB»）。わずかな差だが、B の偏りの小ささが分散の大きさを上回る。

          **間違えやすい点** 偏りは 2 乗して足す（2 乗しないと A が «e_nosqA»、B が «e_nosqB» となり結論が逆になる）。
          変数を増やすと偏りは減るが分散は増える（偏りと分散のトレードオフ）。どちらが有利かは両者の大きさで決まり、いつも単純なモデルや複雑なモデルがよいわけではない。

  - id: s15p11
    title: 入院費用のガンマ回帰
    context: |
      ある病院の入院 1 件あたりの医療費 $Y$（万円）について、手術の有無 $x_1$（あり 1、なし 0）と年齢 $x_2$（10 歳を 1 単位）を説明変数とする一般化線形モデルを当てはめた。
      $Y$ はガンマ分布に従い、リンク関数は対数：$\log E[Y]=\beta_0+\beta_1x_1+\beta_2x_2$ とする。推定値は $\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
      ガンマ分布の GLM では分散関数が $V[Y]=\phi\,\{E[Y]\}^2$（$\phi$ は一定の分散母数）となる。
    items:
      - id: s15p11a
        chapter: 18
        terms: [generalized-linear-model, link-function, exponential-dispersion-family]
        topic: 対数リンクのガンマ回帰の係数から期待入院費の倍率を求め分散関数から標準偏差の倍率を読む
        level: 標準
        definition: false
        type: choice
        question: |
          「手術あり・80 歳」の患者と「手術なし・60 歳」の患者を比べる。前者の期待医療費と医療費の標準偏差は、それぞれ後者の何倍と推定されるか。
          必要なら $e^{0.6}=«e6»$、$e^{0.5}=«e5»$、$\sqrt{«e6»}=«sq»$ を使え。
        choices:
          - "期待値 «c_ok» 倍、標準偏差は変わらない"
          - "期待値 «c_ok» 倍、標準偏差 «c_sq» 倍"
          - "期待値 «c_lin» 倍、標準偏差 «c_lin» 倍"
          - "期待値 «c_one» 倍、標準偏差 «c_one» 倍"
          - "期待値 «c_ok» 倍、標準偏差 «c_ok» 倍"
        answer: 4
        distractors:
          - 正規分布の線形回帰のように分散が一定だと考えた
          - ポアソン分布のように分散が平均に比例すると考えた
          - 対数リンクの係数を指数変換せず 1+0.6 とした
          - 年齢の差 20 歳を 1 単位と数えた（10 歳が 1 単位）
          - 正解
        explanation: |
          **方針** 対数リンクでは係数の和を指数変換したものが期待値の倍率になる。分散関数 $V[Y]=\phi\mu^2$ から標準偏差は $\sqrt\phi\,\mu$ で、平均に比例する。

          **途中式** 説明変数の差は $x_1$ が 1、$x_2$ が 2（20 歳）なので
          $$\frac{\mu_{\text{前者}}}{\mu_{\text{後者}}}=\exp(«b1»\times1+«b2»\times2)=e^{«lin»}=«e6»$$
          標準偏差の比は $\sqrt\phi\,\mu$ の比なので同じく $«e6»$ 倍。

          **答え** 期待値・標準偏差とも «c_ok» 倍（変動係数 $\sqrt\phi$ は一定）

          **間違えやすい点** 年齢の単位は 10 歳なので 20 歳差は 2 単位（1 単位と数えると $e^{«b12»}=«c_one»$）。
          ガンマ分布の GLM は「費用が大きい人ほどばらつきも大きい」データに向いている。分散が一定（正規）なら標準偏差は変わらず、分散が平均に比例（ポアソン）なら $\sqrt{«e6»}=«c_sq»$ 倍になる。

  - id: s15p12
    title: 在宅療養者の生活実態調査
    context: |
      ある県で在宅療養者の生活実態を調べる。対象者を都市部と山間部の 2 層に分け、層ごとに単純無作為抽出で «n» 人を調べる。
      1 人あたりの調査費用（訪問の交通費など）は山間部のほうが高い。

      | 層 | 対象者数 $N_h$ | 層内の標準偏差 $S_h$（予備調査） | 1 人あたりの費用 $c_h$（千円） |
      |---|---|---|---|
      | 都市部 | «N1» | «S1» | «c1» |
      | 山間部 | «N2» | «S2» | «c2» |
    items:
      - id: s15p12a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation, proportional-allocation]
        topic: 層によって1人あたりの調査費用が違うときの最適配分で山間部の在宅療養者の標本数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          全体の標本数を «n» 人に固定したうえで、費用を考えた最適配分（$n_h\propto N_hS_h/\sqrt{c_h}$）を行うとき、山間部に割り当てる人数を求めよ。
        answer: «ans»
        tolerance: 0.4
        answer_format: 四捨五入した整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 層別平均の分散 $\sum W_h^2S_h^2/n_h$ を、総費用 $\sum c_hn_h$ の制約のもとで最小にすると $n_h\propto N_hS_h/\sqrt{c_h}$ となる。費用が高い層ほど、1 人あたりの調査を控えめにする。

          **途中式** 各層の重みは
          $$\text{都市部}:\ \frac{«N1»\times«S1»}{\sqrt{«c1»}}=«w1»,\qquad \text{山間部}:\ \frac{«N2»\times«S2»}{\sqrt{«c2»}}=\frac{«N2»\times«S2»}{«sc2»}=«w2»$$
          $$n_{\text{山間部}}=«n»\times\frac{«w2»}{«w1»+«w2»}=«n»\times\frac{«w2»}{«wsum»}=«n2raw»$$

          **答え** $«ans»$ 人

          **間違えやすい点** 費用を考えないネイマン配分（$n_h\propto N_hS_h$）なら «ney» 人、比例配分なら «prop» 人になる。費用は平方根で効く（$c_h$ そのもので割ると «w_c» 人）。

  - id: s15p13
    title: 検査値による患者の階層的クラスタリング
    context: |
      ある外来で、症状の似た患者をまとめるため、患者 5 人（A〜E）の複数の検査値を標準化してユークリッド距離を求めた。

      | | A | B | C | D | E |
      |---|---|---|---|---|---|
      | A | 0 | «dAB» | «dAC» | «dAD» | «dAE» |
      | B | «dAB» | 0 | «dBC» | «dBD» | «dBE» |
      | C | «dAC» | «dBC» | 0 | «dCD» | «dCE» |
      | D | «dAD» | «dBD» | «dCD» | 0 | «dDE» |
      | E | «dAE» | «dBE» | «dCE» | «dDE» | 0 |
    items:
      - id: s15p13a
        chapter: 24
        terms: [single-linkage, complete-linkage, dendrogram]
        topic: 5人の患者の距離行列に最短距離法と最長距離法を適用しデンドログラムを2クラスターで切った分け方の違い（連鎖効果）を比べる
        level: 標準
        definition: false
        type: choice
        question: |
          この距離行列に、最短距離法（クラスター間の距離を、2 つのクラスターから 1 人ずつ選んだ組の距離の最小値とする）と、最長距離法（同じく最大値とする）で階層的クラスタリングを行う。
          それぞれのデンドログラムを、ちょうど 2 つのクラスターになる高さで切ったときの分け方の組として正しいものはどれか。
        choices:
          - "最短距離法：«single»、最長距離法：«complete»"
          - "最短距離法：«complete»、最長距離法：«single»"
          - "最短距離法：«single»、最長距離法：«single»"
          - "最短距離法：«complete»、最長距離法：«complete»"
          - "最短距離法：«single»、最長距離法：«wrong»"
        answer: 0
        distractors:
          - 正解
          - 2 つの方法の結果を取り違えた
          - 最長距離法でも、併合したクラスターとの距離を最小値で更新した（最短距離法と同じ計算をした）
          - 最短距離法でも、併合したクラスターとの距離を最大値で更新した（最長距離法と同じ計算をした）
          - 最長距離法で、A と B を併合したあとのクラスター {A,B} と C の距離だけ最小値 «dBC» で更新した
        explanation: |
          **方針** どちらの方法も、いちばん距離の小さい 2 つのクラスターを併合し、新しいクラスターとほかのクラスターの距離を更新することを、クラスターが 2 つになるまで繰り返す。違いは更新のしかた（最短距離法は最小値、最長距離法は最大値）だけである。

          **途中式** 最短距離法：A と B を高さ «sh1» で併合。{A,B} と C の距離は $\min(«dAC»,«dBC»)=«dBC»$ なので高さ «sh2» で {A,B,C}、続いて {A,B,C} と D の距離は C と D の «dCD»（最小値）なので、高さ «sh3» で {A,B,C,D} ができる。残りは E だけで、2 クラスターは «single»（E はあとで高さ «s_e» で併合される）。

          最長距離法：A と B を高さ «ch1» で併合。{A,B} とほかの距離は最大値で更新され、C へ «ab_c»、D へ «ab_d»、E へ «ab_e»。いちばん小さいのは C と D の «dCD» なので高さ «ch2» で {C,D}。
          次に {C,D} と E の距離は $\max(«dCE»,«dDE»)=«cd_e»$、{A,B} と {C,D} の距離は «ab_cd»、{A,B} と E は «ab_e» なので、高さ «ch3» で {C,D,E} ができる。

          **答え** 最短距離法：«single»、最長距離法：«complete»

          **間違えやすい点** 最短距離法は「どこか 1 組でも近ければつながる」ので、近い患者が鎖のように並ぶと 1 つの大きなクラスターと孤立した点に分かれやすい（連鎖効果）。最長距離法は全員どうしが近いことを求めるので、大きさのそろったまとまりができやすい。
          最長距離法では、併合のたびに「最大値」で距離を更新し直す。途中で 1 回でも最小値を使うと（{A,B} と C を «dBC» とすると）、先に {A,B,C} ができて «wrong» という誤った結果になる。

  - id: s15p14
    title: 看護職員の職務満足の分析
    context: |
      ある病院で、看護職員の職務満足と離職意向を質問紙で調べている。
    items:
      - id: s15p14a
        chapter: 25
        terms: [factor-score, factor-analysis-model, factor-loading]
        topic: 1因子モデルの負荷量と独自分散からバートレット法で職員1人の因子得点を求める
        level: 標準
        definition: false
        type: choice
        question: |
          職務満足の 3 項目（標準化済み）に 1 因子モデル $x_i=\lambda_iF+e_i$（$V[F]=1$、独自分散 $\psi_i=1-\lambda_i^2$）を当てはめ、負荷量 $\lambda=(«l1»,\ «l2»,\ «l3»)$ を得た。
          ある職員の標準化得点は $x=(«x1»,\ «x2»,\ «x3»)$ だった。バートレット法（独自分散の逆数で重み付けした最小二乗）による因子得点
          $$\hat F=\frac{\sum_i\lambda_ix_i/\psi_i}{\sum_i\lambda_i^2/\psi_i}$$
          に最も近いものはどれか。
        choices:
          - "$«mx»$"
          - "$«unw»$"
          - "$«thom»$"
          - "$«bart»$"
          - "$«lx»$"
        answer: 3
        distractors:
          - 3 項目の得点を単純に平均した
          - 独自分散で重み付けせず Σλx/Σλ² とした
          - 分母に 1 を足す回帰法（トムソン法）の因子得点を計算した
          - 正解
          - 分母で割らず Σλx をそのまま答えた
        explanation: |
          **方針** バートレット法は、$x_i=\lambda_iF+e_i$ を $F$ についての回帰とみて、誤差の分散 $\psi_i$ の逆数で重み付けした最小二乗で $F$ を推定する。

          **途中式** $\psi=(«psi1»,\ «psi2»,\ «psi3»)$。
          $$\sum\frac{\lambda_ix_i}{\psi_i}=«u1»+«u2»+(«u3»)=«num»,\qquad \sum\frac{\lambda_i^2}{\psi_i}=«v1»+«v2»+«v3»=«den»$$
          $$\hat F=\frac{«num»}{«den»}=«bart4»$$

          **答え** $«bart»$

          **間違えやすい点** 回帰法（トムソン法）は分母が $1+\sum\lambda_i^2/\psi_i=«den1»$ で、$«thom»$ と 0 の側に縮む。バートレット法は不偏だが分散が大きく、回帰法は偏りがあるが平均二乗誤差が小さい。
          独自分散が小さい（負荷量が大きい）項目ほど信頼できるので重みが大きくなる。

      - id: s15p14b
        chapter: 26
        terms: [canonical-correlation-analysis, canonical-variate]
        topic: 組の中では無相関な2変数ずつの組の間の相関行列から第1正準相関係数を固有値として求める
        level: 応用
        definition: false
        type: numeric
        question: |
          職務満足の 2 尺度 $(u_1,u_2)$ と離職意向の 2 尺度 $(v_1,v_2)$（どれも標準化済み）について、組の中の相関は $r(u_1,u_2)=r(v_1,v_2)=0$ で、組の間の相関行列は
          $$R_{uv}=\begin{pmatrix}r(u_1,v_1)&r(u_1,v_2)\\ r(u_2,v_1)&r(u_2,v_2)\end{pmatrix}=\begin{pmatrix}«r11»&«r12»\\ «r21»&«r22»\end{pmatrix}$$
          だった。第 1 正準相関係数を求めよ。
        answer: «rho»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 正準相関係数の 2 乗は $R_{uu}^{-1}R_{uv}R_{vv}^{-1}R_{vu}$ の固有値。組の中が無相関なので $R_{uu}=R_{vv}=I$ となり、$R_{uv}R_{uv}^\top$ の最大固有値の平方根が第 1 正準相関係数になる。

          **途中式**
          $$M=R_{uv}R_{uv}^\top=\begin{pmatrix}«m11»&«m12»\\ «m12»&«m22»\end{pmatrix}$$
          固有方程式 $\lambda^2-(\text{トレース})\lambda+\det M=0$ で、トレース $«tr»$、$\det M=«m11»\times«m22»-«m12»^2=«det»$。
          $$\lambda_1=\frac{«tr»+\sqrt{«tr»^2-4\times«det»}}{2}=\frac{«tr»+\sqrt{«disc»}}{2}=\frac{«tr»+«sqd»}{2}=«lam1»$$
          $$\rho_1=\sqrt{«lam1»}=«rho4»$$

          **答え** $«rho»$

          **間違えやすい点** 固有値 $«w_lam»$ は正準相関係数の 2 乗なので平方根をとる。個々の相関の最大値 «r11» より大きくなるのは、各組の変数を最もよく組み合わせた合成変数どうしの相関だからである。
