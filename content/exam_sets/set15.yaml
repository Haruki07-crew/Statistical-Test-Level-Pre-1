    items:
      - id: s15p07a
        chapter: 13
        terms: [spearman-rank-correlation, rank-and-ties]
        topic: 2人の看護師が入所者8人の褥瘡リスクを順位づけした結果の一致をスピアマンの順位相関係数で表す
        level: 基本
        definition: false
        type: numeric
        question: |
          看護師 P と看護師 Q が、入所者 «n» 人の褥瘡リスクを独立に評価し、リスクの高い順に順位をつけた（同順位なし）。

          | 入所者 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | P の順位 | «a1» | «a2» | «a3» | «a4» | «a5» | «a6» | «a7» | «a8» |
          | Q の順位 | «b1» | «b2» | «b3» | «b4» | «b5» | «b6» | «b7» | «b8» |

          スピアマンの順位相関係数を求めよ。
        answer: «rs»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 同順位がないとき、スピアマンの順位相関係数は順位差 $d_i$ を使って $r_S=1-\dfrac{6\sum d_i^2}{n(n^2-1)}$ で求められる（順位どうしのピアソン相関係数と一致する）。

          **途中式** 順位差 $d_i$（P−Q）は $«dlist»$ で、$\sum d_i^2=«d2list»=«d2»$。
          $$r_S=1-\frac{6\times«d2»}{«n»\times(«n»^2-1)}=1-\frac{«six»}{«nn»}=«rs4»\cdots$$

          **答え** $«rs»$（2 人の評価はよく一致している）

          **間違えやすい点** 分母は $n(n^2-1)=«nn»$ で、$n^3=«n3»$ とすると $«w_n2»$ になる。順位差は 2 乗してから足す（差をそのまま足すと必ず 0 になる）。

      - id: s15p07b
        chapter: 18
        terms: [ordered-logit-model, odds-and-odds-ratio, logistic-regression]
        topic: 比例オッズモデルの閾値と係数から寝たきりの入所者が中間の重症度カテゴリーになる確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          褥瘡の重症度 $Y$ を 1（なし）、2（軽度）、3（重度）の 3 段階とし、寝たきりなら $x=1$、そうでなければ $x=0$ として、比例オッズモデル
          $$\log\frac{P(Y\le j\mid x)}{1-P(Y\le j\mid x)}=\theta_j-\beta x\qquad(j=1,2)$$
          を当てはめたところ、$\hat\theta_1=«th1»$、$\hat\theta_2=«th2»$、$\hat\beta=«beta»$ だった（$\beta>0$ は寝たきりのほうが重症度が高くなりやすいことを表す）。
          寝たきりの入所者（$x=1$）が軽度（$Y=2$）になる確率の推定値に最も近いものはどれか。
          必要なら $e^{0.3}=«e03»$、$e^{-1.3}=«em13»$、$e^{-1.2}=«em12»$、$e^{-2.8}=«em28»$ を使え。
        choices:
          - "$«c_x0»$"
          - "$«c_p3»$"
          - "$«ans»$"
          - "$«c_p1»$"
          - "$«c_cum»$"
        answer: 2
        distractors:
          - x=0（寝たきりでない入所者）で計算した
          - P(Y=3)=1−P(Y≦2) を答えた
          - 正解
          - P(Y=1)=P(Y≦1) を答えた
          - 累積確率 P(Y≦2) を P(Y=2) と取り違えた
        explanation: |
          **方針** 比例オッズモデルは累積確率 $P(Y\le j)$ をロジットでモデル化する。各カテゴリーの確率は累積確率の差 $P(Y=2)=P(Y\le2)-P(Y\le1)$ で求める。

          **途中式** $x=1$ のとき、線形予測子は $\theta_1-\beta=«l1»$、$\theta_2-\beta=«l2»$。ロジットの逆変換 $P=1/(1+e^{-\eta})$ より
          $$P(Y\le1\mid x=1)=\frac{1}{1+e^{0.3}}=\frac{1}{1+«e03»}=«P1»,\qquad P(Y\le2\mid x=1)=\frac{1}{1+e^{-1.3}}=\frac{1}{1+«em13»}=«P2»$$
          $$P(Y=2\mid x=1)=«P2»-«P1»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** モデルが表すのは累積確率なので、$P(Y\le2)=«c_cum»$ をそのまま答えない。
          $x=0$ で計算すると $1/(1+e^{-2.8})-1/(1+e^{-1.2})=«P2x0»-«P1x0»=«c_x0»$ になる。符号の約束（$\theta_j-\beta x$）を確かめ、$\eta=\theta_j-\beta$ に $-$ を付けて $e^{-\eta}$ に入れること。

