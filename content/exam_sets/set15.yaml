    items:
      - id: s15p08a
        chapter: 14
        terms: [absorbing-state, first-passage-time, markov-chain, transition-probability-matrix]
        topic: 自立と要支援を行き来する高齢者が吸収状態の要介護に移るまでの平均年数を一次方程式から求める
        level: 応用
        definition: false
        type: numeric
        question: |
          今年「自立」の人が、初めて「要介護」に移るまでの年数の期待値を求めよ（1 年後に要介護になった場合を 1 年と数える）。
        answer: «m1»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 自立・要支援から出発したときの要介護までの平均年数を $m_1,m_2$ とおく。1 年たつごとに 1 を数え、1 年後の状態で場合分けする（第一歩分析）。

          **途中式**
          $$m_1=1+«a11»m_1+«a12»m_2,\qquad m_2=1+«a21»m_1+«a22»m_2$$
          第 2 式から $«omb»m_2=1+«a21»m_1$、すなわち $m_2=«c0»+«c1»m_1$。第 1 式に代入すると
          $$m_1=1+«a11»m_1+«a12»(«c0»+«c1»m_1)=«rhs»+(«a11»+«a12c1»)m_1$$
          $$«lhs»\,m_1=«rhs»\iff m_1=«m1s»$$
          （このとき $m_2=«m2»$）

          **答え** $«m1»$ 年

          **間違えやすい点** 要支援から自立へ戻る推移（«a21»）を無視すると $m_2=1/«omb»$、$m_1=(1+«a12»\times«c0»)/(1-«a11»)=«w_m1»$ となり短く見積もってしまう。
          自立から直接要介護になる確率 «a13» だけを見て $1/«a13»=«w_once»$ とするのも誤り。要介護（吸収状態）の $m=0$ の項は式から消える。

  - id: s15p09
    title: 退院支援プログラムの効果
    context: |
      ある病院で、退院支援プログラムへの参加 $X$（参加 1、不参加 0）が 30 日以内の再入院 $Y$（再入院 1、なし 0）を減らすかを観察データから調べたい。
      ただし、重症の患者ほどプログラムを勧められやすく、重症度は再入院にも影響するため、参加者と不参加者を単純に比べると効果を正しく推定できない。
      そこで、入院した曜日によって退院支援の担当者が面談できるかどうかが決まることに着目し、$Z=1$（平日入院）、$Z=0$（休日入院）を操作変数として使う。
      $Z$ は患者の重症度と無関係で、$Y$ には $X$ を通してのみ影響すると仮定する。

      | | 参加した割合 $P(X=1\mid Z)$ | 再入院の割合 $P(Y=1\mid Z)$ |
      |---|---|---|
      | 平日入院（$Z=1$） | «px1» | «py1» |
      | 休日入院（$Z=0$） | «px0» | «py0» |
    items:
      - id: s15p09a
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 入院曜日を操作変数にして退院支援プログラム参加が再入院率に与える効果をワルド推定量で求める
        level: 標準
        definition: false
        type: choice
        question: |
          操作変数法（2 値の操作変数によるワルド推定量）で、プログラム参加が再入院の確率に与える効果（参加による再入院確率の差）を推定した値に最も近いものはどれか。
        choices:
          - "$«c_itt»$"
          - "$«c_mul»$"
          - "$«iv»$"
          - "$«c_sign»$"
          - "$«c_px1»$"
        answer: 2
        distractors:
          - Z による再入院率の差（誘導形の効果）をそのまま答え、参加率の差で割らなかった
          - 参加率の差で割らずに掛けた
          - 正解
          - 分子の差の向きを逆にとり、符号が反対になった
          - 分母に参加率の差ではなく Z=1 の参加率 0.70 を使った
        explanation: |
          **方針** 2 値の操作変数 $Z$ によるワルド推定量は
          $$\hat\beta_{IV}=\frac{P(Y=1\mid Z=1)-P(Y=1\mid Z=0)}{P(X=1\mid Z=1)-P(X=1\mid Z=0)}$$
          で、$Y$ を $X$ に回帰する 2 段階最小二乗法の推定値と一致する。$Z$ が $Y$ を動かした分を、$Z$ が $X$ を動かした分で割って「参加 1 単位あたり」に直す。

          **途中式**
          $$\hat\beta_{IV}=\frac{«py1»-«py0»}{«px1»-«px0»}=\frac{«dy»}{«dx»}=«iv»$$

          **答え** $«iv»$（参加すると再入院の確率が約 15 ポイント下がると推定される）

          **間違えやすい点** 分子の $«c_itt»$ は「平日入院であること」の効果で、参加率が «dx» しか違わないため参加そのものの効果より薄まっている。参加率の差で割って割り戻す。
          分母は参加率の**差** «dx» であり、$Z=1$ の参加率 «px1» で割ると $«c_px1»$ になる。重症度という交絡があるので、参加者と不参加者の再入院率を直接比べる方法は使えない。

  - id: s15p10
    title: 手指消毒法の比較実験
    context: |
      3 種類の手指消毒法 A, B, C を比べるため、看護師 18 人を無作為に 6 人ずつに割り付け、消毒後の指先の細菌数（対数変換した値）を測った。
      各群の平均は A：«mA»、B：«mB»、C：«mC» で、一元配置分散分析の誤差の平均平方は $MSE=«mse»$（自由度 «dfe»）だった。
      必要なら、ステューデント化された範囲の分布の上側 5% 点 $q_{0.05}(3,«dfe»)=«q»$、$t$ 分布の上側 2.5% 点 $t_{0.025}(«dfe»)=«t»$ を使え。
    items:
      - id: s15p10a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 3種類の手指消毒法の平均細菌数をテューキー法で多重比較し有意差のある組を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          テューキーの方法で 3 群のすべての対を有意水準 5% で比較する（群全体の第 1 種の誤りの確率を 5% に抑える）。
          有意差の基準（2 群の平均の差がこれを超えれば有意）と、有意となる組の組合せとして正しいものはどれか。
        choices:
          - "基準 «hsd2»、有意な組はない"
          - "基準 «hsd»、A と C の組だけが有意"
          - "基準 «lsd»、A と B、A と C の 2 組が有意"
          - "基準 «hsdns»、3 組すべてが有意"
          - "基準 «hsdN»、A と B、A と C の 2 組が有意"
        answer: 1
        distractors:
          - q の点に √(2MSE/n) を掛けた（q はすでに範囲の分布なので √2 が余分）
          - 正解
          - 多重性を調整しない t 検定（最小有意差 LSD）の基準を使った
          - √(MSE/n) の平方根をとり忘れて q×MSE/n とした
          - 1 群の大きさ n=6 の代わりに全体の 18 で割った
        explanation: |
          **方針** 各群の大きさが等しいとき、テューキー法の基準は $HSD=q_{0.05}(k,\nu)\sqrt{MSE/n}$（$k$ は群の数、$\nu$ は誤差の自由度、$n$ は 1 群の大きさ）。平均の差の絶対値がこれを超えた組を有意とする。

          **途中式**
          $$HSD=«q»\times\sqrt{\frac{«mse»}{«n»}}=«q»\times\sqrt{«msen»}=«q»\times«sqmsen»=«hsd4»$$
          平均の差は $|B-A|=«dBA»$、$|C-A|=«dCA»$、$|C-B|=«dCB»$。基準 «hsd» を超えるのは $C-A$ だけ。

          **答え** 基準 «hsd»、A と C の組だけが有意。

          **間違えやすい点** ステューデント化された範囲 $q$ は「最大の平均 − 最小の平均」を $\sqrt{MSE/n}$ で割った量の分布なので、2 標本 $t$ のような $\sqrt{2MSE/n}$ は使わない（使うと基準 «hsd2»）。
          多重性を調整しない $t$ 検定の基準 $t_{0.025}\sqrt{2MSE/n}=«lsd»$ では A と B の差 «dBA» も有意になり、3 つの比較全体の第 1 種の誤りの確率が 5% を超える。

  - id: s15p11
    title: 介護施設の入居者満足度調査
    context: |
      ある介護事業者が運営する施設の入居者 «N» 人を、要介護度によって 3 つの層に分け、満足度（100 点満点）を調べる。

      | 層 | 入居者数 $N_h$ | 層内の標準偏差 $S_h$（過去の調査） | 層の平均（過去の調査） |
      |---|---|---|---|
      | 軽度 | «N1» | «S1» | «m1» |
      | 中度 | «N2» | «S2» | «m2» |
      | 重度 | «N3» | «S3» | «m3» |
    items:
      - id: s15p11a
        chapter: 21
        terms: [stratified-sampling, proportional-allocation, simple-random-sampling]
        topic: 要介護度で3層に分けた比例配分の層別抽出で入居者満足度の平均の推定量の標準誤差を求める
        level: 標準
        definition: false
        type: choice
        question: |
          全体で «n» 人を、入居者数に比例して各層に配分（比例配分）し、各層の中では単純無作為抽出する。
          層別抽出による全体平均の推定量 $\bar y_{st}=\sum_h W_h\bar y_h$（$W_h=N_h/N$）の標準誤差に最も近いものはどれか。
          有限母集団修正は無視し、層内の標準偏差は表の値を使え。
        choices:
          - "$«c_w2»$"
          - "$«c_avg»$"
          - "$«se»$"
          - "$«c_var»$"
          - "$«c_srs»$"
        answer: 2
        distractors:
          - W_h^2 S_h^2 を n_h ではなく全体の n で割った
          - 層内の標準偏差を W_h で平均してから √n で割った
          - 正解
          - 分散を答え、平方根をとらなかった
          - 層別せずに単純無作為抽出したときの標準誤差（層間の変動を含む）を答えた
        explanation: |
          **方針** $V(\bar y_{st})=\sum_h W_h^2S_h^2/n_h$。比例配分では $n_h=nW_h$ なので $V(\bar y_{st})=\frac1n\sum_h W_hS_h^2$ となる。

          **途中式** $W_h=(«W1»,«W2»,«W3»)$、$n_h=(«n1»,«n2»,«n3»)$。
          $$\sum_h W_hS_h^2=«W1»\times«S1»^2+«W2»\times«S2»^2+«W3»\times«S3»^2=«t1»+«t2»+«t3»=«within»$$
          $$V(\bar y_{st})=\frac{«within»}{«n»}=«vst»,\qquad SE=\sqrt{«vst»}=«se4»$$

          **答え** $«se»$

          **間違えやすい点** 分散 «vst» を標準誤差と取り違えない。$W_h^2$ を使うときは各層の標本数 $n_h$ で割る（全体の $n$ で割ると $«c_w2»$）。
          層別しない単純無作為抽出では、層の平均の違い（層間変動 «between»）も誤差に入って分散が $(«within»+«between»)/«n»=«vsrs»$、標準誤差 «c_srs» と大きくなる。層の平均が違うほど層別の効果が大きい。

      - id: s15p11b
        chapter: 29
        terms: [multiple-imputation, rubins-rules, missing-data-mechanism]
        topic: 回答に欠測がある満足度調査を5回の多重代入で解析しルービンのルールで平均の標準誤差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          実際の調査では一部の質問に無回答があったため、多重代入法で $m=«m»$ 個の補完データを作り、それぞれで全体平均の推定値 $\hat Q_j$ と、その分散の推定値 $U_j$ を求めた。

          | 補完データ $j$ | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $\hat Q_j$ | «Q1» | «Q2» | «Q3» | «Q4» | «Q5» |
          | $U_j$ | «U1» | «U2» | «U3» | «U4» | «U5» |

          ルービンのルールで統合した全体平均の推定値の標準誤差を求めよ。
          ただし代入間分散 $B$ は $\hat Q_j$ の不偏分散（$m-1$ で割る）とする。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ルービンのルールでは、統合推定値は $\bar Q=\frac1m\sum\hat Q_j$、全分散は $T=\bar U+\left(1+\frac1m\right)B$（$\bar U$ は代入内分散の平均、$B$ は代入間分散）。標準誤差は $\sqrt T$。

          **途中式** $\bar Q=«sumQ»/«m»=«qb»$、$\bar U=«sumU»/«m»=«Wv»$。
          偏差 $\hat Q_j-\bar Q$ は $«devs»$ で、その 2 乗の和は «ssq» なので $B=«ssq»/(«m»-1)=«B»$。
          $$T=«Wv»+\left(1+\frac15\right)\times«B»=«Wv»+«Bfac»=«T»,\qquad SE=\sqrt{«T»}=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** $B$ に $(1+1/m)$ を掛け忘れると $\sqrt{«Wv»+«B»}=«w_noadj»$、代入間分散を無視すると $\sqrt{«Wv»}=«w_W»$ となり、欠測による不確かさを過小評価する。
          全分散 $T=«T»$ をそのまま答えないこと（問われているのは標準誤差）。

  - id: s15p12
    title: 看護ケア満足度尺度の因子構造
    context: |
      看護ケアの満足度を測る 5 項目の質問紙を開発した。各項目を標準化したうえで（相関行列にもとづいて）2 因子の直交因子モデルを当てはめ、バリマックス回転したところ、因子負荷量は次のとおりだった。

      | 項目 | 第 1 因子 | 第 2 因子 |
      |---|---|---|
      | 1 説明のわかりやすさ | «l1a» | «l1b» |
      | 2 質問への対応 | «l2a» | «l2b» |
      | 3 意思の尊重 | «l3a» | «l3b» |
      | 4 ナースコールへの応答の速さ | «l4a» | «l4b» |
      | 5 訪室の頻度 | «l5a» | «l5b» |
    items:
      - id: s15p12a
        chapter: 25
        terms: [factor-loading, communality, factor-analysis-model, varimax-rotation]
        topic: 2因子直交モデルの回転後の因子負荷量から第2因子の寄与率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          第 2 因子の寄与率（5 項目の分散の合計に対する、第 2 因子で説明される分散の割合）に最も近いものはどれか。
        choices:
          - "$«c_ss»$"
          - "$«c_f1»$"
          - "$«ans»$"
          - "$«c_sum»$"
          - "$«c_share»$"
        answer: 2
        distractors:
          - 割合にせず、第2因子の負荷量の2乗和（寄与）を答えた
          - 第1因子の寄与率を答えた
          - 正解
          - 負荷量を2乗せずに足して5で割った
          - 分母を5項目の分散の合計ではなく共通性の合計（2因子の寄与の和）にした
        explanation: |
          **方針** 直交因子モデルでは、因子 $j$ が説明する分散（寄与）は負荷量の 2 乗和 $\sum_i\lambda_{ij}^2$。標準化した 5 項目の分散の合計は 5 なので、寄与率は寄与 ÷ 5。

          **途中式** 第 2 因子の寄与は
          $$«sq1»+«sq2»+«sq3»+«sq4»+«sq5»=«ss2»$$
          寄与率は $«ss2»/«p»=«ans»$。

          **答え** $«ans»$（第 1 因子は $«ss1»/«p»=«c_f1»$）

          **間違えやすい点** 負荷量は 2 乗してから足す（そのまま足すと $«c_sum»$）。分母を 2 因子の寄与の合計 $«comm»$ にした $«c_share»$ は「共通因子で説明される部分の中での割合」で、寄与率ではない。
          直交回転では各項目の共通性（行の 2 乗和）と 2 因子の寄与の合計は回転前と変わらないが、各因子の寄与の分け方は回転で変わる。

      - id: s15p12b
        chapter: 26
        terms: [goodness-of-fit-indices, structural-equation-modeling]
        topic: 確認的因子分析モデルの適合度カイ二乗と自由度と標本の大きさからRMSEAを求める
        level: 基本
        definition: false
        type: choice
        question: |
          この結果をもとに、項目 1〜3 は第 1 因子だけ、項目 4・5 は第 2 因子だけに負荷をもち、2 因子間に相関を認める確認的因子分析モデルを、別の «N» 人の回答に当てはめた。
          適合度のカイ二乗統計量は $\chi^2=«chi2»$、自由度は $df=«df»$ だった。
          RMSEA を $\sqrt{\max(\chi^2-df,\,0)\big/\{df\,(N-1)\}}$ で求めるとき、その値に最も近いものはどれか。
        choices:
          - "$«c_nosqrt»$"
          - "$«rmsea»$"
          - "$«c_nosub»$"
          - "$«c_nodf»$"
          - "$«c_ratio»$"
        answer: 1
        distractors:
          - 平方根をとらなかった
          - 正解
          - χ^2 から自由度を引かなかった
          - 分母の自由度 df を掛け忘れた
          - RMSEA ではなく χ^2/df を答えた
        explanation: |
          **方針** RMSEA は「自由度 1 あたり、標本 1 人あたりのモデルの当てはまりの悪さ」を表す。$\chi^2-df$ は非心度の推定値である。

          **途中式**
          $$RMSEA=\sqrt{\frac{«chi2»-«df»}{«df»\times(«N»-1)}}=\sqrt{\frac{«diff»}{«dN»}}=\sqrt{«inner»}=«rmsea4»$$

          **答え** $«rmsea»$。よく使われる目安（0.05 以下で良好、0.1 以上で不適合）では、その間の「まずまず」の当てはまりにあたる。

          **間違えやすい点** $\chi^2$ から $df$ を引き忘れると $«c_nosub»$、$df$ で割り忘れると $«c_nodf»$ になる。$\chi^2/df=«c_ratio»$ は別の簡便な指標で、RMSEA ではない。
          $\chi^2$ 検定は標本が大きいとわずかなずれでも棄却しやすいため、RMSEA のような指標を合わせて見る。

