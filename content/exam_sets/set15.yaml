set: 15
title: 模擬試験 第15回
minutes: 90
problems:
  - id: s15p01
    title: せん妄のスクリーニングと睡眠薬
    context: |
      ある総合病院の看護部では、入院中の高齢患者のせん妄を早く見つけるため、2 種類の簡易スクリーニング票 A, B を検討している。
      過去の検証データから、A の感度は «seA»、特異度は «spA»、B の感度は «seB»、特異度は «spB» である。
      せん妄の有無が与えられたもとで、A と B の判定は互いに独立とする（条件付き独立）。
    items:
      - id: s15p01a
        chapter: 1
        terms: [conditional-independence, conditional-probability, independence-of-events]
        topic: 2つのスクリーニング票をどちらか陽性なら陽性とする並列判定の感度と特異度を条件付き独立から求める
        level: 基本
        definition: false
        type: choice
        question: |
          A と B を両方行い、**どちらか一方でも陽性なら「せん妄の疑いあり」**と判定する方式にする。この方式の感度と特異度の組として正しいものはどれか。
        choices:
          - "感度 «se_ser»、特異度 «sp_ser»"
          - "感度 «se_par»、特異度 «sp_ser»"
          - "感度 «se_par»、特異度 «sp_par»"
          - "感度 «se_ser»、特異度 «sp_par»"
          - "感度 «se_avg»、特異度 «sp_avg»"
        answer: 2
        distractors:
          - 「両方陽性なら陽性」とする直列判定の感度と特異度を求めた
          - 感度は正しいが、特異度まで「どちらかが陰性なら陰性」として計算した
          - 正解
          - 感度に両方陽性の確率を使い、特異度だけ正しく計算した
          - 2 つの票の感度と特異度をそれぞれ単純平均した
        explanation: |
          **方針** せん妄ありの人が「陰性」と判定されるのは A も B も陰性のときだけ。せん妄なしの人が「陰性」と判定されるのも A も B も陰性のとき。条件付き独立なので、それぞれ確率の積で求める。

          **途中式** せん妄ありの人について、A・B がともに陰性（偽陰性）になる確率は $(1-«seA»)(1-«seB»)=«fnA»\times«fnB»=«fn2»$。よって
          $$\text{感度}=1-«fn2»=«se_par»$$
          せん妄なしの人について、両方とも陰性になる確率が特異度：
          $$\text{特異度}=«spA»\times«spB»=«sp_par»$$

          **答え** 感度 «se_par»、特異度 «sp_par»

          **間違えやすい点** 「どちらか陽性で陽性」にすると見逃しが減って感度は上がるが、誤って陽性とする機会が増えるので特異度は下がる。
          両方陽性で陽性とする直列判定（感度 $«seA»\times«seB»=«se_ser»$、特異度 $1-(1-«spA»)(1-«spB»)=«sp_ser»$）と取り違えないこと。条件付き独立でなければ、この積の計算は使えない。

      - id: s15p01b
        chapter: 28
        terms: [odds-ratio-interval, cohort-and-case-control-study, two-by-two-table]
        topic: 症例対照研究の2×2表から睡眠薬使用とせん妄のオッズ比の95%信頼区間を対数変換（ウルフの方法）で求める
        level: 標準
        definition: false
        type: choice
        question: |
          睡眠薬の使用とせん妄の関係を調べるため、せん妄を発症した患者（症例）«na» 人と、発症しなかった患者（対照）«nc» 人を選び、入院中の睡眠薬の使用を調べた。

          | | 使用あり | 使用なし |
          |---|---|---|
          | 症例 | «a» | «b» |
          | 対照 | «c» | «d» |

          オッズ比の対数の標準誤差を $\sqrt{1/a+1/b+1/c+1/d}$ とし、対数オッズ比について正規近似で 95% 信頼区間を作って指数変換したもの（ウルフの方法）として、最も近いものはどれか。
          必要なら $\log(8/3)=«lnor»$ と、次の値を使え。

          | $x$ | 0.298 | 0.408 | 0.743 | 1.219 | 1.554 | 1.664 |
          |---|---|---|---|---|---|---|
          | $e^x$ | «y1» | «y2» | «y3» | «y4» | «y5» | «y6» |
        choices:
          - "$(«eL90»,\\ «eU90»)$"
          - "$(«eLv»,\\ «eUv»)$"
          - "$(«symL»,\\ «symU»)$"
          - "$(«eL»,\\ «eU»)$"
          - "$(«Ls»,\\ «Us»)$"
        answer: 3
        distractors:
          - 95% ではなく 90% の点 1.645 を使った
          - 標準誤差の代わりに分散（平方根をとる前の値 0.1215）を使った
          - 対数をとらずにオッズ比の尺度で対称な区間（デルタ法の標準誤差 OR×SE）を作った
          - 正解
          - 対数オッズ比の区間のまま指数変換しなかった
        explanation: |
          **方針** 症例対照研究では症例と対照の人数を研究者が決めるので、発症率やリスク比は推定できないが、オッズ比は推定できる。オッズ比は対数をとると正規分布に近づくので、対数尺度で区間を作って指数変換で戻す。

          **途中式** オッズ比は $\dfrac{«a»\times«d»}{«b»\times«c»}=«OR»$、その対数は $\log(8/3)=«lnor»$。
          $$SE=\sqrt{\frac1{«a»}+\frac1{«b»}+\frac1{«c»}+\frac1{«d»}}=\sqrt{«vsum»}=«se»$$
          $1.96\times«se»=«hw»$ なので、対数オッズ比の区間は $(«lnor»-«hw»,\ «lnor»+«hw»)=(«L»,\ «U»)$。指数変換して
          $$(e^{«L»},\ e^{«U»})=(«y1»,\ «y6»)$$

          **答え** $(«eL»,\ «eU»)$。区間が 1 を含まないので、睡眠薬の使用はせん妄と関連があるといえる。

          **間違えやすい点** 区間はオッズ比 «OR» について左右対称ではない（対数尺度で対称）。オッズ比の尺度で $«OR»\pm«symhw»$ とすると $(«symL»,\ «symU»)$ になり、下限が 1 を下回って結論まで変わる。
          指数変換を忘れると $(«Ls»,\ «Us»)$ という対数尺度の区間のままになる。また、症例対照研究から「睡眠薬使用者のせん妄の発症率」を計算してリスク比を求めることはできない。

  - id: s15p02
    title: 術後の生存と追跡
    context: |
      ある手術を受けた患者の、術後の死亡までの時間 $T$（単位：月）を考える。
    items:
      - id: s15p02a
        chapter: 2
        terms: [hazard-function, survival-function, cumulative-distribution-function]
        topic: 術後早期に高い区分的に一定なハザード関数から1か月生存した患者が12か月までに死亡する条件付き確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $T$ のハザード関数（1 か月あたり）が、術後の時期によって次のように一定であるとする。
          $$h(t)=\begin{cases}«h1» & (0\le t<1)\\ «h2» & (1\le t<4)\\ «h3» & (t\ge4)\end{cases}$$
          術後 1 か月の時点で生存している患者が、術後 12 か月までに死亡する条件付き確率 $P(T\le12\mid T>1)$ を求めよ。
          必要なら $e^{-0.14}=«e14»$、$e^{-0.20}=«e20»$、$e^{-0.12}=«e12»$ を使え。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 生存関数は $S(t)=\exp\left(-\int_0^t h(u)\,du\right)$。条件付き生存確率 $P(T>12\mid T>1)=S(12)/S(1)$ は、1 か月から 12 か月までのハザードの積分だけで決まる。

          **途中式** 1 か月から 12 か月までの累積ハザードは
          $$\int_1^{12}h(u)\,du=«h2»\times(4-1)+«h3»\times(12-4)=«H3»+«H8»=«H»$$
          $$P(T>12\mid T>1)=e^{-«H»}=«e14»,\qquad P(T\le12\mid T>1)=1-«e14»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** 術後 1 か月までの高いハザード «h1» は、1 か月生存した条件のもとでは使わない。含めると $1-e^{-«H0_12»}=«w_unc»$（術後すぐからの死亡確率）になる。
          ハザードを全期間 «h3» とみなすと $1-e^{-0.12}=«w_flat»$ と小さく見積もる。$e^{-«H»}=«w_surv»$ は生存する確率で、死亡する確率ではない。

      - id: s15p02b
        chapter: 29
        terms: [kaplan-meier-estimator, greenwood-formula, censored-data]
        topic: 打ち切りを含む術後患者10人のカプラン・マイヤー推定値の標準誤差をグリーンウッドの公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある施設でこの手術を受けた患者 10 人を追跡し、次の時間（月）を得た。「+」は転院などによる打ち切り（その時点まで生存を確認）を表す。

          $$2,\ 3^+,\ 4,\ 4,\ 6^+,\ 7,\ 9^+,\ 10,\ 12^+,\ 12^+$$

          カプラン・マイヤー法で術後 7 か月の生存率 $\hat S(7)$ を推定し、その標準誤差をグリーンウッドの公式
          $$\widehat{V}[\hat S(t)]=\hat S(t)^2\sum_{t_j\le t}\frac{d_j}{n_j(n_j-d_j)}$$
          （$n_j$ は時刻 $t_j$ の直前のリスク集合の大きさ、$d_j$ はその時刻の死亡数）で求めよ。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 死亡が起きた時刻ごとにリスク集合 $n_j$ と死亡数 $d_j$ を数え、生存率を掛け合わせる。打ち切られた人はその時刻以降のリスク集合から外す。

          **途中式**

          | 時刻 $t_j$ | $n_j$ | $d_j$ | $\hat S(t_j)$ | $d_j/\{n_j(n_j-d_j)\}$ |
          |---|---|---|---|---|
          | 2 | 10 | 1 | «S1» | «g1» |
          | 4 | 8 | 2 | «S2» | «g2» |
          | 7 | 5 | 1 | «S3» | «g3» |

          （3 か月の打ち切りで 4 か月のリスク集合は 8 人、6 か月の打ち切りで 7 か月のリスク集合は 5 人）
          $$\widehat V=«S3»^2\times(«g1»+«g2»+«g3»)=«S2sq»\times«gsum»=«var»,\qquad SE=\sqrt{«var»}=«se5»$$

          **答え** $«se»$（$\hat S(7)=«S3»$）

          **間違えやすい点** 打ち切りを含むデータに二項分布の式 $\sqrt{\hat S(1-\hat S)/10}=«w_bin»$ を使うと、途中で減っていくリスク集合を無視することになる。
          グリーンウッドの公式は $\hat S(t)^2$ を掛ける（2 乗し忘れると $«w_nosq»$）。打ち切られた人をリスク集合から外す時期にも注意する。

  - id: s15p03
    title: 薬物の血中濃度と生物学的同等性
    context: |
      ある薬の血中濃度について、臨床薬理部門で解析を行っている。
    items:
      - id: s15p03a
        chapter: 3
        terms: [coefficient-of-variation, lognormal-distribution, moments]
        topic: 対数正規分布に従う血中濃度の変動係数を対数スケールの分散から求める
        level: 基本
        definition: false
        type: choice
        question: |
          投与 2 時間後の血中濃度 $C$ は、$\log C$ が平均 $\mu$、分散 $\sigma^2=«s2»$ の正規分布に従う（$C$ は対数正規分布に従う）とする。
          対数正規分布では $E[C]=e^{\mu+\sigma^2/2}$、$V[C]=e^{2\mu+\sigma^2}(e^{\sigma^2}-1)$ である。
          $C$ の変動係数（標準偏差 ÷ 平均）に最も近いものはどれか。必要なら $e^{0.2}=«e02»$、$e^{0.1}=«e01»$ を使え。
        choices:
          - "$«c_s2»$"
          - "$«c_nosqrt»$"
          - "$«c_half»$"
          - "$«c_sig»$"
          - "$«cv»$"
        answer: 4
        distractors:
          - 対数スケールの分散 σ² をそのまま答えた
          - 分散の比（変動係数の 2 乗）を答え、平方根をとらなかった
          - e^{σ²} の代わりに e^{σ²/2} を使った
          - 対数スケールの標準偏差 σ を変動係数とみなした（σ が小さいときの近似）
          - 正解
        explanation: |
          **方針** 変動係数は $\sqrt{V[C]}/E[C]$。$\mu$ を含む部分は打ち消し合う。

          **途中式**
          $$\frac{\sqrt{V[C]}}{E[C]}=\frac{e^{\mu+\sigma^2/2}\sqrt{e^{\sigma^2}-1}}{e^{\mu+\sigma^2/2}}=\sqrt{e^{\sigma^2}-1}=\sqrt{«e02»-1}=\sqrt{«em1»}=«cv4»$$

          **答え** $«cv»$（$\mu$、つまり濃度の水準によらず一定）

          **間違えやすい点** $\sigma$ が小さいときは $\sqrt{e^{\sigma^2}-1}\approx\sigma$ だが、$\sigma=\sqrt{«s2»}=«c_sig»$ はここでは近似として粗い。
          平方根を忘れると $«c_nosqrt»$、$e^{\sigma^2/2}$ を使うと $\sqrt{«e01»-1}=«c_half»$ になる。

      - id: s15p03b
        chapter: 7
        terms: [delta-method, standard-error, central-limit-theorem]
        topic: 試験薬と標準薬の平均AUCの比の標準誤差を独立な2つの標本平均のデルタ法で近似する
        level: 標準
        definition: false
        type: choice
        question: |
          試験薬と標準薬を別々の被験者群に投与し（並行群間比較）、血中濃度時間曲線下面積（AUC）を測った。

          | 群 | 人数 | AUC の平均 | 標準偏差 |
          |---|---|---|---|
          | 試験薬 T | «nT» | «mT» | «sT» |
          | 標準薬 R | «nR» | «mR» | «sR» |

          平均の比 $\hat R=\bar X_T/\bar X_R=«R»$ の標準誤差を、2 つの標本平均が独立であるとしてデルタ法で近似したとき、最も近いものはどれか。母平均・母標準偏差は表の値で置き換えてよい。
        choices:
          - "$«w_T»$"
          - "$«ans»$"
          - "$«w_noR»$"
          - "$«w_add»$"
          - "$«w_sd»$"
        answer: 1
        distractors:
          - 分母の標準薬の平均のばらつきを無視した
          - 正解
          - 相対誤差の式に比 R を掛け忘れた
          - 2 つの相対標準誤差を 2 乗和の平方根ではなく単純に足した
          - 標本平均の標準誤差ではなく個々の値の標準偏差（変動係数）を使った
        explanation: |
          **方針** $g(a,b)=a/b$ の 1 次近似 $g(\bar X_T,\bar X_R)\approx g(\mu_T,\mu_R)+\frac{1}{\mu_R}(\bar X_T-\mu_T)-\frac{\mu_T}{\mu_R^2}(\bar X_R-\mu_R)$ から、独立なら
          $$V[\hat R]\approx\frac{V[\bar X_T]}{\mu_R^2}+\frac{\mu_T^2}{\mu_R^4}V[\bar X_R]=R^2\left(\frac{CV_T^2}{n_T}+\frac{CV_R^2}{n_R}\right)$$
          （$CV$ は変動係数）。

          **途中式** $CV_T=«sT»/«mT»=«cvT»$、$CV_R=«sR»/«mR»=«cvR»$。
          $$\frac{CV_T^2}{n_T}+\frac{CV_R^2}{n_R}=«cvT2n»+«cvR2n»=«inner»,\qquad SE(\hat R)\approx«R»\times\sqrt{«inner»}=«R»\times«root»=«ans»$$

          **答え** $«ans»$

          **間違えやすい点** 比の分母も確率変数なので、標準薬側のばらつきも入る（無視すると $«w_T»$）。相対誤差は 2 乗して足してから平方根をとる（単純に足すと $«w_add»$）。
          個々の値の変動係数ではなく、標本平均の相対誤差 $CV/\sqrt n$ を使う。

  - id: s15p04
    title: 体温計と血糖測定器の精度比較
    context: |
      病棟で使う医療機器の精度を比べている。
      電子体温計 A と B で、基準温度 37.00℃ の恒温槽をそれぞれ $n_A=«nA»$ 回、$n_B=«nB»$ 回測定した。測定値は互いに独立で、それぞれ正規分布に従うとする。
      標本標準偏差は不偏分散の平方根とする。
    items:
      - id: s15p04a
        chapter: 6
        terms: [f-distribution, chi-squared-distribution]
        topic: 母分散の等しい2台の体温計の標本標準偏差の比が一定値を超える確率をF分布で求める
        level: 標準
        definition: false
        type: choice
        question: |
          A と B の測定のばらつき（母標準偏差）が実際には等しいとき、A の標本標準偏差 $S_A$ が B の標本標準偏差 $S_B$ の «k» 倍を超える確率 $P(S_A>«k»S_B)$ に最も近いものはどれか。
          自由度 $(m,n)$ の $F$ 分布に従う $F$ について、次の値を使え。

          | 自由度 $(m,n)$ | $(9,7)$ | $(9,7)$ | $(7,9)$ | $(10,8)$ |
          |---|---|---|---|---|
          | 確率 | $P(F>«k2»)=«F1»$ | $P(F>«k»)=«F2»$ | $P(F>«k2»)=«F3»$ | $P(F>«k2»)=«F4»$ |
        choices:
          - "$«F2»$"
          - "$«F3»$"
          - "$«F4»$"
          - "$«F1»$"
          - "$«F1c»$"
        answer: 3
        distractors:
          - 標準偏差の比を 2 乗せず 1.5 をそのまま F 分布の値と比べた
          - F 分布の自由度の順番を逆にした
          - 自由度を n−1 ではなく測定回数 n にした
          - 正解
          - 上側確率と下側確率を取り違えた
        explanation: |
          **方針** 母分散が等しいとき $F=S_A^2/S_B^2$ は自由度 $(n_A-1,\,n_B-1)=(«dfA»,«dfB»)$ の $F$ 分布に従う。$S_A>«k»S_B$ を分散の比の条件に直す。

          **途中式**
          $$P(S_A>«k»S_B)=P\left(\frac{S_A^2}{S_B^2}>«k»^2\right)=P(F_{«dfA»,«dfB»}>«k2»)=«F1»$$

          **答え** $«F1»$

          **間違えやすい点** 標準偏差の比を 2 乗して分散の比にする（2 乗しないと $«F2»$）。自由度は（分子, 分母）=（A の $n-1$, B の $n-1$）＝$(«dfA»,«dfB»)$ で、逆にすると $«F3»$、測定回数のままだと $«F4»$ になる。
          母分散が等しくても、標本数が少ないと標本標準偏差が 1.5 倍以上違うことは 15% 程度の確率で起こる。

      - id: s15p04b
        chapter: 9
        terms: [ci-two-sample-mean-difference, t-distribution, confidence-interval]
        topic: 2台の体温計の測定誤差の平均の差の95%信頼区間をプールした分散のt区間で求める
        level: 標準
        definition: false
        type: choice
        question: |
          測定値から基準温度を引いた誤差（℃）は次のとおりだった。

          | 体温計 | 回数 | 誤差の平均 | 標準偏差 |
          |---|---|---|---|
          | A | «nA» | «mA» | «sA» |
          | B | «nB» | «mB» | «sB» |

          2 台の母分散は等しいと仮定して、誤差の母平均の差 $\mu_A-\mu_B$ の 95% 信頼区間（両側）を求めよ。
          $t$ 分布の上側パーセント点 $t_{0.025}(«df»)=«t025»$、$t_{0.05}(«df»)=«t05»$ を使え。最も近いものはどれか。
        choices:
          - "$(«zL»,\\ «zU»)$"
          - "$(«oneL»,\\ «oneU»)$"
          - "$(«okL»,\\ «okU»)$"
          - "$(«nofL»,\\ «nofU»)$"
          - "$(«welL»,\\ «welU»)$"
        answer: 2
        distractors:
          - t 分布ではなく標準正規分布の 1.96 を使った
          - 両側 95% なのに上側 5% 点 1.746 を使った
          - 正解
          - プールした標準偏差に √(1/n_A+1/n_B) を掛け忘れた
          - 等分散を仮定せず、各群の分散で標準誤差を作った（ウェルチ型の標準誤差に自由度 16 の点を使った）
        explanation: |
          **方針** プールした分散 $s_p^2=\dfrac{(n_A-1)s_A^2+(n_B-1)s_B^2}{n_A+n_B-2}$ を作り、$(\bar x_A-\bar x_B)\pm t_{0.025}(n_A+n_B-2)\,s_p\sqrt{1/n_A+1/n_B}$ とする。

          **途中式**
          $$s_p^2=\frac{«dfA»\times«sA»^2+«dfB»\times«sB»^2}{«df»}=\frac{«ssA»+«ssB»}{«df»}=«sp2»$$
          $$SE=\sqrt{«sp2»\times\left(\frac1{«nA»}+\frac1{«nB»}\right)}=\sqrt{«sp2»\times«inv»}=\sqrt{«se2»}=«se»$$
          $$«diff»\pm«t025»\times«se»=«diff»\pm«hw»$$

          **答え** $(«okL»,\ «okU»)$。0 を含まないので、A の方が平均して高めに測ると判断できる。

          **間違えやすい点** 標本が小さいので 1.96 ではなく自由度 «df» の $t$ 分布の点を使う（1.96 だと $(«zL»,\ «zU»)$ と狭すぎる）。
          両側 95% には上側 2.5% 点を使う。等分散を仮定するのでプールした分散を使い、各群の分散を別々に使うウェルチ型とは区別する。

      - id: s15p04c
        chapter: 16
        terms: [least-squares-method, regression-coefficient-t-test, coefficient-of-determination]
        topic: 血糖測定器の検証回帰で血糖の単位をmg/dLからmmol/Lに変えたときの係数とt値と決定係数の変化を読む
        level: 基本
        definition: false
        type: choice
        question: |
          新しい血糖測定器の値 $y$ を、検査室の基準法の値 $x$（どちらも mg/dL）に単回帰したところ、
          $\hat y=«b0»+«b1»x$（傾きの標準誤差 «se1»、決定係数 «R2»）だった。
          $x$ と $y$ を**両方とも** mmol/L に換算（どちらも 18 で割る）して回帰し直したとき、正しいものはどれか。
        choices:
          - "切片は «b0m»、傾きは «b1y» になり、傾きの $t$ 値は 1/18 になる"
          - "切片は «b0»、傾きは «b1» のまま変わらない"
          - "切片は «b0m»、傾きは «b1» のまま、傾きの $t$ 値と決定係数も変わらない"
          - "切片は «b0m»、傾きは «b1» のままだが、傾きの $t$ 値は 1/18 になる"
          - "切片は «b0m»、傾きは «b1x» になり、決定係数は変わらない"
        answer: 2
        distractors:
          - y だけを換算したときの傾きと考え、t 値も変わるとした
          - 切片も単位をもつ（y の単位）ことを見落とした
          - 正解
          - 標準誤差だけ変わり、傾きは変わらないと考えた
          - 傾きを 18 で割るべきところを 18 倍した
        explanation: |
          **方針** $x'=x/18$、$y'=y/18$ を代入して式を書き直す。傾きの単位は「$y$ の単位 / $x$ の単位」、切片の単位は「$y$ の単位」である。

          **途中式** $y=«b0»+«b1»x$ の両辺を 18 で割ると
          $$\frac{y}{18}=\frac{«b0»}{18}+«b1»\times\frac{x}{18}\iff y'=«b0m»+«b1»x'$$
          傾きの標準誤差も傾きと同じ比率で変わる（ここでは変わらず «se1»）ので、$t$ 値 $«b1»/«se1»=«t1»$ は変わらない。予測値と観測値の相関は単位によらないので決定係数 «R2» も変わらない。

          **答え** 切片は «b0m»、傾きは «b1» のまま、$t$ 値と決定係数も変わらない。

          **間違えやすい点** $y$ だけ換算すれば傾きは $«b1»/18=«b1y»$ になるが、両方を同じ倍率で換算すると傾きは変わらない。
          $t$ 値・決定係数・$p$ 値は、説明変数や目的変数を定数倍しても変わらない量である。

  - id: s15p05
    title: 輸液ポンプのバッテリー寿命
    context: |
      ある病棟には同じ型の輸液ポンプが «n» 台あり、停電時には内蔵バッテリーで動く。
      満充電からのバッテリーの持続時間は、互いに独立に平均 $\theta$ 時間の指数分布（密度 $\frac1\theta e^{-x/\theta}$、$x>0$）に従うとする。
    items:
      - id: s15p05a
        chapter: 8
        terms: [order-statistics, exponential-distribution]
        topic: 指数分布に従う5台のバッテリーのうち2台目が切れるまでの期待時間を順序統計量の間隔から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $\theta=«mu»$ とする。«n» 台を同時に満充電の状態からバッテリー駆動に切り替えたとき、**2 台目**のバッテリーが切れるまでの時間の期待値（時間）を求めよ。
        answer: «e2»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 順序統計量 $X_{(1)}<X_{(2)}<\cdots$ を考える。指数分布の無記憶性から、$k$ 台が動いているときに次の 1 台が切れるまでの時間は、平均 $\theta/k$ の指数分布に従う（$k$ 個の独立な指数分布の最小値）。

          **途中式** 最初の 1 台が切れるまでは «n» 台が動いているので、$E[X_{(1)}]=\theta/«n»=«t1»$。
          その後は残り «n1» 台が新品と同じ状態で動き続けるので、次の 1 台が切れるまでの追加時間の期待値は $\theta/«n1»=«t2»$。
          $$E[X_{(2)}]=\frac{\theta}{«n»}+\frac{\theta}{«n1»}=«t1»+«t2»=«e2s»$$

          **答え** $«e2»$ 時間

          **間違えやすい点** 2 台目は最初の 1 台の時間の 2 倍（$2\theta/«n»=«w_2n»$）ではない。1 台切れると動いている台数が減るので、次の故障までの間隔は長くなる。
          $E[X_{(1)}]=«w_min»$ は 1 台目である。

      - id: s15p05b
        chapter: 10
        terms: [uniformly-most-powerful-test, monotone-likelihood-ratio, chi-squared-distribution]
        topic: 指数分布に従うバッテリー持続時間の合計を使い平均の片側一様最強力検定の棄却域をカイ二乗分布から求める
        level: 応用
        definition: false
        type: choice
        question: |
          新しい業者のバッテリーに替えたところ、持続時間が短くなったのではないかと心配されている。新しいバッテリー «n» 個の持続時間 $X_1,\ldots,X_{«n»}$ を測り、
          帰無仮説 $H_0:\theta=«mu»$、対立仮説 $H_1:\theta<«mu»$ を有意水準 5% で検定する。
          一様最強力検定の棄却域として正しいものはどれか。
          $2\sum X_i/\theta$ は自由度 $2n$ のカイ二乗分布に従う。自由度 10 のカイ二乗分布の下側 5% 点は «lo10»、上側 5% 点は «hi10»、自由度 5 の下側 5% 点は «lo5» である。
        choices:
          - "$\\sum X_i\\ge «c_up»$ のとき棄却"
          - "$\\sum X_i\\le «c_no2»$ のとき棄却"
          - "$\\sum X_i\\le «c»$ のとき棄却"
          - "$\\sum X_i\\le «c_df5»$ のとき棄却"
          - "$\\sum X_i\\le «c_norm»$ のとき棄却"
        answer: 2
        distractors:
          - 対立仮説の向きを逆にとり、上側に棄却域を置いた
          - 2ΣX/θ の 2 を忘れ、θ×(下側 5% 点) を限界値にした
          - 正解
          - 自由度を 2n=10 ではなく n=5 とした
          - 中心極限定理による正規近似で棄却限界を作った（大きさがちょうど 5% にならず、一様最強力でもない）
        explanation: |
          **方針** 尤度は $\theta^{-n}\exp(-\sum x_i/\theta)$ で、$\theta_1<\theta_0$ のときの尤度比 $L(\theta_1)/L(\theta_0)$ は $\sum x_i$ の減少関数（単調尤度比）。ネイマン・ピアソンの補題から、どの $\theta_1<«mu»$ に対しても「$\sum X_i$ が小さいとき棄却」が最強力となり、棄却域が $\theta_1$ によらないので一様最強力検定になる。

          **途中式** $H_0$ のもとで $2\sum X_i/«mu»\sim\chi^2_{«twon»}$。
          $$P\left(\frac{2\sum X_i}{«mu»}\le«lo10»\right)=0.05\iff \sum X_i\le\frac{«mu»\times«lo10»}{2}=«c»$$

          **答え** $\sum X_i\le«c»$ のとき棄却

          **間違えやすい点** 「持続時間が短くなった」が対立仮説なので棄却域は下側（上側の $\sum X_i\ge«c_up»$ は逆）。
          自由度は $2n=«twon»$（$n$ とすると $«c_df5»$）、ピボットは $2\sum X_i/\theta$（2 を忘れると $«c_no2»$）。正規近似 $n\theta-1.645\,\theta\sqrt n=«c_norm»$ は標本が小さいと大きさが 5% からずれる。

  - id: s15p06
    title: まれな血液型の献血者
    context: |
      ある血液センターでは、まれな血液型の献血者を探している。献血に来る人がこの血液型である確率は «p» で、各人は互いに独立とする。
    items:
      - id: s15p06a
        chapter: 5
        terms: [geometric-distribution, bernoulli-distribution]
        topic: まれな血液型の献血者が見つかるまでの人数の幾何分布の無記憶性から追加で調べる人数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          今日はすでに «done» 人を調べたが、まだ見つかっていない。ここから先、あと $k$ 人以内に少なくとも 1 人見つかる確率が 0.5 以上となる最小の $k$ を求めよ。
          必要なら $\log0.5=«l5»$、$\log«q»=«l95»$（自然対数）を使え。
        answer: «ans»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 初めて見つかるまでの人数は幾何分布に従い、無記憶性 $P(X>a+k\mid X>a)=P(X>k)$ をもつ。すでに «done» 人調べて見つからなかったことは、これから先の確率に影響しない。

          **途中式** あと $k$ 人調べても見つからない確率は $«q»^k$。条件は
          $$1-«q»^k\ge0.5\iff «q»^k\le0.5\iff k\ge\frac{\log0.5}{\log«q»}=\frac{«l5»}{«l95»}=«kraw»$$
          よって最小の整数は $k=«ans»$。確認すると $«q»^{«km1»}=«q13»>0.5$、$«q»^{«ans»}=«q14»\le0.5$。

          **答え** $«ans»$ 人

          **間違えやすい点** すでに調べた «done» 人を差し引いたり（「そろそろ見つかるはず」）、足したり（$«w_tot»$）しない。独立な試行では過去の失敗は将来の確率を変えない。
          平均 $1/p$ と、ここで求めた「半分の確率で見つかる人数」は違う。幾何分布は右に裾が長いので、後者のほうが小さい。

  - id: s15p07
    title: 病棟・病院間の比較
    context: |
      ある医療法人で、院内感染と在院日数について病棟や病院の間の違いを調べている。
    items:
      - id: s15p07a
        chapter: 12
        terms: [two-sample-proportion-test, proportion-test]
        topic: 2病棟の院内感染率の差をプールした比率の標準誤差によるz検定で比べ別の標準誤差では結論が変わることを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          病棟 A では入院患者 «nA» 人中 «xA» 人、病棟 B では «nB» 人中 «xB» 人に院内感染が起きた。
          「2 病棟の感染率は等しい」という帰無仮説を、帰無仮説のもとでの共通の比率（プールした比率）を使う $z$ 検定で、**両側**有意水準 5% で検定する。正しいものはどれか。
        choices:
          - "$z=«z1»$ で 1.96 を超えるので、帰無仮説を棄却する"
          - "$z=«z»$ で 1.96 を超えないので、帰無仮説を棄却しない"
          - "$z=«z»$ で 1.645 を超えるので、帰無仮説を棄却する"
          - "$z=«zbad»$ で 1.96 を超えるので、帰無仮説を棄却する"
          - "感染率の比が «rr» で 1 より大きいので、帰無仮説を棄却する"
        answer: 1
        distractors:
          - プールせずに各病棟の比率で標準誤差を作った
          - 正解
          - 両側検定なのに片側 5% 点 1.645 と比べた
          - 標準誤差の (1/n_A+1/n_B) を 1/(n_A+n_B) とした
          - 標本の比率の比を見ただけで、ばらつきを考えなかった
        explanation: |
          **方針** 帰無仮説のもとでは 2 病棟の感染率は共通なので、合わせた比率 $\hat p$ で標準誤差 $\sqrt{\hat p(1-\hat p)(1/n_A+1/n_B)}$ を作る。

          **途中式** $\hat p_A=«xA»/«nA»=«pA»$、$\hat p_B=«xB»/«nB»=«pB»$、$\hat p=«xs»/«ns»=«pp»$。
          $$SE=\sqrt{«pp»\times«qq»\times\left(\frac1{«nA»}+\frac1{«nB»}\right)}=\sqrt{«ppq»\times«inv»}=«se0»$$
          $$z=\frac{«pA»-«pB»}{«se0»}=\frac{«dp»}{«se0»}=«z»$$
          $|z|<1.96$ なので棄却しない。

          **答え** $z=«z»$、両側 5% で棄却しない。

          **間違えやすい点** 各病棟の比率で標準誤差を作る（$SE=«se1»$）と $z=«z1»$ となり、境界付近では結論が逆になる。検定ではプールした比率、信頼区間では各群の比率を使うのが基本。
          両側検定なので 1.96 と比べる。比率の比 «rr» が大きく見えても、件数が少ないと偶然の範囲に入ることがある。

      - id: s15p07b
        chapter: 31
        terms: [empirical-bayes, normal-normal-model, hierarchical-bayes-model]
        topic: 5病院の平均在院日数を正規・正規モデルの経験ベイズで全体平均の方向へ縮小した推定値を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          同じ法人の 5 病院の、ある疾患の平均在院日数 $y_i$（日）は «y1»、«y2»、«y3»、«y4»、«y5» だった。
          次の階層モデルを考える：病院 $i$ の真の平均 $\theta_i$ は $N(\mu,\tau^2)$ に従い、$\theta_i$ が与えられたとき $y_i\sim N(\theta_i,\sigma^2)$ で、$\sigma^2=«sig2»$ は既知とする。
          $\mu$ を $y_i$ の平均で、$\tau^2$ を「$y_i$ の不偏分散 $-\ \sigma^2$」で推定し（経験ベイズ）、病院 2（$y_2=«y2»$）の $\theta_2$ の事後平均を求めよ。
        answer: «est»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 正規・正規モデルでは $\theta_i$ の事後平均は $\mu+(1-B)(y_i-\mu)$、縮小係数 $B=\dfrac{\sigma^2}{\sigma^2+\tau^2}$。周辺分布 $y_i\sim N(\mu,\sigma^2+\tau^2)$ を使って $\mu$ と $\tau^2$ をデータから推定する。

          **途中式** $\hat\mu=\bar y=«yb»$。偏差の 2 乗和は $«devsq»=«ss»$ なので、不偏分散は $«ss»/(«m»-1)=«s2u»$。
          $$\hat\tau^2=«s2u»-«sig2»=«tau2»,\qquad \hat B=\frac{«sig2»}{«sig2»+«tau2»}=«B»$$
          $$\hat\theta_2=«yb»+(1-«B»)\times(«y2»-«yb»)=«yb»+«omB»\times«dev»=«est4»$$

          **答え** $«est»$ 日

          **間違えやすい点** $B$ は「観測値の精度が低いほど全体平均へ寄せる」割合で、偏差に掛けるのは $1-B$（逆にすると $«w_rev»$）。
          $\tau^2$ の推定に $n$ で割った分散 $«s2n»$ を使うと $«w_n»$ になる。縮小推定は、たまたま大きく出た病院の値を割り引く。

  - id: s15p08
    title: 集中治療室の病床の埋まり具合
    context: |
      ある病院の集中治療室（ICU）には 3 床ある。1 日ごとの使用中の病床数 $X_t\in\{0,1,2,3\}$ を、次のようなマルコフ連鎖とみなす。
      1 日の間に起きる変化は高々 1 人分とし、

      - 空き床があれば（$X_t<3$）、確率 «up» で 1 人入室して $X_{t+1}=X_t+1$
      - $X_t=k\ (k\ge1)$ のとき、確率 $0.2k$ で 1 人退室して $X_{t+1}=X_t-1$
      - それ以外は変化なし（満床のときの入室希望は他院へ回す）

      とする。たとえば $X_t=1$ のとき、増える確率 «up»、減る確率 «d1»、変わらない確率 «st1» である。
    items:
      - id: s15p08a
        chapter: 14
        terms: [detailed-balance, stationary-distribution, ergodicity]
        topic: ICUの使用病床数の出生死滅型マルコフ連鎖で詳細つり合い条件から定常分布を求め満床の長期割合を出す
        level: 応用
        definition: false
        type: numeric
        question: |
          長い期間で見て、ICU が満床（$X_t=3$）である日の割合（定常分布の $\pi_3$）を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 隣どうしの状態の間でしか移らない出生死滅型の連鎖では、定常分布が詳細つり合い条件 $\pi_kP(k\to k+1)=\pi_{k+1}P(k+1\to k)$ を満たす。これを順に使って $\pi_0$ で表し、和を 1 にする。

          **途中式**
          $$\pi_1=\pi_0\times\frac{«up»}{«d1»}=«w1»\pi_0,\quad \pi_2=\pi_1\times\frac{«up»}{«d2»}=«w2»\pi_0,\quad \pi_3=\pi_2\times\frac{«up»}{«d3»}=\frac43\pi_0$$
          $$\pi_0\left(1+2+2+\frac43\right)=\frac{19}{3}\pi_0=1\iff\pi_0=\frac3{19}$$
          $$\pi_3=\frac43\times\frac3{19}=\frac4{19}=«ans4»$$

          **答え** $«ans»$（約 21% の日が満床）

          **間違えやすい点** 4 状態を等しく $1/4=«w_eq»$ とするのは誤り。退室確率は在室人数に比例して増えるので、各状態の重みは異なる。
          この連鎖は既約で非周期的（変化しない確率が正）なので、定常分布はただ 1 つで、長期の割合に一致する。

  - id: s15p09
