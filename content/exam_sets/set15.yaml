          各検査値を外来全体の標準偏差で割って（標準化して）からユークリッド距離を求めるとき、3 人のうち最も近い 2 人の組とその距離として正しいものはどれか。
        choices:
          - "P と R（距離 «rPR»）"
          - "P と Q（距離 «vPQ»）"
          - "P と Q（距離 «c_sq»）"
          - "P と Q（距離 «sPQ»）"
          - "P と Q（距離 «c_man»）"
        answer: 3
        distractors:
          - 標準化せずにもとの単位のままユークリッド距離を求めた（血圧の差が距離をほぼ決めてしまう）
          - 標準偏差ではなく分散で割った
          - 平方根をとらず、距離の2乗を答えた
          - 正解
          - ユークリッド距離ではなく差の絶対値の和（マンハッタン距離）を求めた
        explanation: |
          **方針** 各変数の差を標準偏差で割ってから 2 乗和の平方根をとる。単位や散らばりの大きさが違う変数をそのまま使うと、数値の大きい変数（血圧）だけで距離が決まってしまう。

          **途中式** 血圧の差を «sda» で割った値は P–Q：$«dPQa»/«sda»=«zPQa»$、P–R：$«dPRa»/«sda»=«zPRa»$、Q–R：$«dQRa»/«sda»=«zQRa»$。HbA1c の差（«sdb» で割っても同じ）は P–Q：«dPQb»、P–R：«dPRb»、Q–R：«dQRb»。
          $$d(P,Q)^2=\left(\frac{«dPQa»}{«sda»}\right)^2+«dPQb»^2=«qPQ»+«hPQ»=«s2PQ»$$
          $$d(P,R)^2=\left(\frac{«dPRa»}{«sda»}\right)^2+«dPRb»^2=«qPR»+«hPR»=«s2PR»$$
          $$d(Q,R)^2=\left(\frac{«dQRa»}{«sda»}\right)^2+«dQRb»^2=«qQR»+«hQR»=«s2QR»$$
          距離は $d(P,Q)=«sPQ3»$、$d(P,R)=«sPR3»$、$d(Q,R)=«sQR3»$ で、最小は P と Q。

          **答え** P と Q（距離 «sPQ»）

          **間違えやすい点** 標準化しないと $d(P,Q)=«rPQ»$、$d(P,R)=«rPR»$ となり、HbA1c が大きく違う P と R が最も近いと判断されてしまう。
          分散で割ると $«vPQ»$、平方根を忘れると $«c_sq»$ になる。標準化するかどうかでクラスタリングの結果が変わるので、変数の単位がそろっていないときは標準化を検討する。

  - id: s15p14
    title: 転倒予防プログラムの多施設研究
    context: |
      介護施設で転倒予防プログラムの効果を調べるため、2 つの施設で入居者をプログラム群と対照群に分け、1 年間に転倒したかどうかを記録した。

      | 施設 | 群 | 転倒あり | 転倒なし |
      |---|---|---|---|
      | 施設 1 | プログラム | «a1» | «b1» |
      | 施設 1 | 対照 | «c1» | «d1» |
      | 施設 2 | プログラム | «a2» | «b2» |
      | 施設 2 | 対照 | «c2» | «d2» |
    items:
      - id: s15p14a
        chapter: 28
        terms: [mantel-haenszel-estimator, three-way-table, odds-ratio-interval]
        topic: 2施設で層別した転倒予防プログラムの2×2表からマンテル・ヘンツェルの共通オッズ比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          施設を層として、転倒についての「プログラム群の対照群に対するオッズ比」をマンテル・ヘンツェル法で統合した共通オッズ比の推定値を求めよ。
        answer: «mh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 層 $k$ の表を $a_k$（プログラム・転倒あり）、$b_k$（プログラム・なし）、$c_k$（対照・あり）、$d_k$（対照・なし）、総数 $n_k$ とすると
          $$\hat\psi_{MH}=\frac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$$

          **途中式** 施設 1：$n_1=«n1»$、$a_1d_1/n_1=«a1»\times«d1»/«n1»=«ad1»$、$b_1c_1/n_1=«b1»\times«c1»/«n1»=«bc1»$。
          施設 2：$n_2=«n2»$、$a_2d_2/n_2=«a2»\times«d2»/«n2»=«ad2»$、$b_2c_2/n_2=«b2»\times«c2»/«n2»=«bc2»$。
          $$\hat\psi_{MH}=\frac{«ad1»+«ad2»}{«bc1»+«bc2»}=\frac{«num»}{«den»}=«mh4»$$

          **答え** $«mh»$（施設の違いを調整しても、プログラム群の転倒のオッズは対照群の半分程度）

          **間違えやすい点** 施設を無視して 2 つの表を足し合わせると $«A»\times«D»/(«B»\times«C»)=«crude»$ となり、施設の違いが交絡したときに偏る。
          施設ごとのオッズ比（«or1»、«or2»）を単純に平均するのもマンテル・ヘンツェル推定量ではない。各項を層の総数 $n_k$ で割るのを忘れないこと。

      - id: s15p14b
        chapter: 31
        terms: [beta-binomial-model, predictive-distribution, conjugate-prior]
        topic: ベータ事前分布と二項データから次の2人の入居者がともに転倒しない事後予測確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          3 つ目の施設でプログラムを始めた。プログラム参加者が 1 年間転倒しない確率 $p$ に、これまでの経験からベータ分布 $\text{Be}(«a0»,«b0»)$（密度 $\propto p^{«a0»-1}(1-p)^{«b0»-1}$）を事前分布として置く。
          最初の参加者 «nn» 人のうち «x» 人が 1 年間転倒しなかった（各人は $p$ が与えられたもとで独立とする）。
          次に参加する 2 人がともに 1 年間転倒しない事後予測確率を求めよ。
        answer: «pred»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ベータ分布は二項尤度の共役事前分布なので、事後分布は $\text{Be}(«a0»+«x»,\ «b0»+«nn»-«x»)=\text{Be}(«ax»,«bx»)$。
          2 人とも転倒しない確率は、$p$ が与えられたもとで $p^2$ なので、事後分布での $E[p^2]$ を求める。

          **途中式** $\text{Be}(\alpha,\beta)$ では $E[p^2]=\dfrac{\alpha(\alpha+1)}{(\alpha+\beta)(\alpha+\beta+1)}$。$\alpha=«ax»$、$\beta=«bx»$ を代入して
          $$E[p^2\mid\text{データ}]=\frac{«ax»\times«ax1»}{«abn»\times«abn1»}=\frac{«pnum»}{«pden»}=«pred5»$$

          **答え** $«pred»$

          **間違えやすい点** 事後平均 $«ax»/«abn»=«pmean»$ を 2 乗した $«w_sq»$ は $\{E[p]\}^2$ で、$E[p^2]=\{E[p]\}^2+V[p]$ より事後分散の分だけ小さい。
          2 人の結果は $p$ を通じて相関しているので、1 人目の予測確率を単純に 2 乗してはいけない。最尤推定値を使った $(«x»/«nn»)^2=«w_mle»$ も事前分布の情報を無視している。
