      - id: s15p09b
        chapter: 13
        terms: [jonckheere-terpstra-test, normal-approximation-rank-tests, concordant-discordant-pairs]
        topic: 3用量群の鎮痛スコアに順序のある対立仮説のヨンクヒール・タプストラ検定を行い正規近似の統計量を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          別の小規模試験で、用量の低・中・高の各群 4 人の鎮痛スコアは次のとおりだった（同順位なし）。

          | 群 | スコア |
          |---|---|
          | 低 | «g11», «g12», «g13», «g14» |
          | 中 | «g21», «g22», «g23», «g24» |
          | 高 | «g31», «g32», «g33», «g34» |

          「用量が高いほどスコアが高い」という順序のある対立仮説を、ヨンクヒール・タプストラ検定で調べる。
          統計量 $J$ は、低と中、低と高、中と高の 3 つの組それぞれで「用量の低い群の値 < 用量の高い群の値」となる対の数を数えて合計したものである。
          帰無仮説（3 群の分布が同じ）のもとで、群の大きさを $n_i$、$N=\sum n_i$ とすると
          $$E[J]=\frac{N^2-\sum n_i^2}{4},\qquad V[J]=\frac{N^2(2N+3)-\sum n_i^2(2n_i+3)}{72}$$
          である。標準化した統計量 $z=(J-E[J])/\sqrt{V[J]}$ を求めよ。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 順序を考えない比較（クラスカル・ウォリス検定）ではなく、群の並び（低 < 中 < 高）に沿った対の数を数えて、順序のある対立仮説に対する検出力を高める。

          **途中式** 対の数は次のとおり。

          - 低と中：低の 1 は中の 4 つすべてより小さい（4）、3 と 4 は 6, 8, 9 より小さい（3 ずつ）、7 は 8, 9 より小さい（2）で、$U_{12}=«u12»$
          - 低と高：低の 1, 3, 4 は高の 4 つすべてより小さく、7 は 10, 11, 12 より小さいので $U_{13}=«u13»$
          - 中と高：中の 2 は 4 つ、6, 8, 9 は 10, 11, 12 の 3 つずつより小さいので $U_{23}=«u23»$

          $J=«u12»+«u13»+«u23»=«J»$。$N=«N»$、$\sum n_i^2=«sumn2»$ より
          $$E[J]=\frac{«N2»-«sumn2»}{4}=«EJ»,\qquad V[J]=\frac{«N2»\times«twoN3»-«vsub»}{72}=\frac{«vnum»}{72}=«VJ»$$
          $$z=\frac{«J»-«EJ»}{\sqrt{«VJ»}}=\frac{«JmE»}{«sdJ»}=«z4»$$

          **答え** $«z»$（片側 5% の 1.645 を超え、用量が高いほどスコアが高い傾向があるといえる）

          **間違えやすい点** $\sqrt{V[J]}$ ではなく $V[J]$ で割ると $«w_noc»$ になる。対の向き（低い用量の値 < 高い用量の値）をそろえて数える。

  - id: s15p10
    title: 年齢と腎機能の回帰
    context: |
      慢性腎臓病の外来患者 «n» 人について、推算糸球体濾過量 eGFR（mL/分/1.73m²）を目的変数 $y$、年齢 $x$（歳）を説明変数とする回帰を考える。
      65 歳を境に低下が速くなるという臨床の見方を確かめるため、次の 1 次スプライン（折れ線）モデル S も当てはめた。
      $$y=\beta_0+\beta_1x+\beta_2(x-65)_++\varepsilon,\qquad (x-65)_+=\max(x-65,\,0)$$
      最小二乗推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
    items:
      - id: s15p10a
        chapter: 19
        terms: [spline-regression, polynomial-regression]
        topic: 年齢65歳に節点をもつ1次スプライン回帰の係数から80歳の患者のeGFRの予測値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          モデル S による 80 歳の患者の eGFR の予測値に最も近いものはどれか。
        choices:
          - "$«c_x»$"
          - "$«yhat»$"
          - "$«c_rep»$"
          - "$«c_nos»$"
          - "$«c_sign»$"
        answer: 1
        distractors:
          - (x−65)_+ ではなく x そのものに β2 を掛けた
          - 正解
          - 65 歳以降は傾きが β1 から β2 に置き換わると考えた
          - スプラインの項を無視して直線部分だけで予測した
          - (x−65)_+ を (65−x) と符号を逆にした
        explanation: |
          **方針** $x\ge65$ では $(x-65)_+=x-65$ なので、65 歳以降の傾きは $\beta_1+\beta_2$ になる（65 歳でつながった折れ線）。

          **途中式**
          $$\hat y=«b0»+(«b1»)\times«x»+(«b2»)\times(«x»-«kn»)=«b0»+(«t1»)+(«t2»)=«yhat»$$
          65 歳以降の傾きは $«b1»+(«b2»)=«slope2»$（1 歳あたり）。

          **答え** $«yhat»$

          **間違えやすい点** スプライン項の係数 $\beta_2$ は「65 歳以降に傾きが**追加で**変わる量」で、65 歳以降の傾きそのものではない（置き換えると $«c_rep»$）。
          $(x-65)_+$ は 65 歳未満で 0、それ以上で $x-65$ であり、$x$ に直接 $\beta_2$ を掛けない（$«c_x»$）。

      - id: s15p10b
        chapter: 17
        terms: [dfbetas, outlier-and-influential-point, leverage]
        topic: 1人を除いて当てはめ直した傾きの変化と除外後の残差標準偏差から単回帰の傾きのDFBETASを求める
        level: 応用
        definition: false
        type: choice
        question: |
          比較のため、直線モデル L：$y=\beta_0+\beta_1x+\varepsilon$ も当てはめた。全 «n» 人での傾きは $\hat\beta_1=«bb»$、残差標準偏差は $s=«sa»$、年齢の偏差平方和は $S_{xx}=\sum(x_i-\bar x)^2=«sxx»$ だった。
          ある患者 $i$ を除いて当てはめ直すと、傾きは $\hat\beta_{1(i)}=«bi»$、残差標準偏差は $s_{(i)}=«si»$ になった。
          $$\text{DFBETAS}_{1,i}=\frac{\hat\beta_1-\hat\beta_{1(i)}}{s_{(i)}\sqrt{c_{11}}}$$
          （$c_{11}$ は $(X^\top X)^{-1}$ の傾きに対応する対角成分で、単回帰では $1/S_{xx}$）の値に最も近いものはどれか。
        choices:
          - "$«c_sall»$"
          - "$«dfb»$"
          - "$«c_pos»$"
          - "$«c_raw»$"
          - "$«c_nosq»$"
        answer: 1
        distractors:
          - 分母に除外前の残差標準偏差 s=8.5 を使った
          - 正解
          - 差の向きを逆（除外後 − 除外前）にした
          - 傾きの変化量だけを答え、標準誤差で割らなかった
          - √c11 の平方根をとらず 1/S_xx をそのまま使った
        explanation: |
          **方針** DFBETAS は「その 1 人を除いたときの係数の変化」を、その 1 人を除いた残差標準偏差で作った係数の標準誤差で割ったもの。目安として $|\text{DFBETAS}|>2/\sqrt n$ なら影響が大きい。

          **途中式** $\sqrt{c_{11}}=1/\sqrt{«sxx»}=1/«sq»$ なので、分母は $«si»/«sq»=«den»$。
          $$\text{DFBETAS}_{1,i}=\frac{«bb»-(«bi»)}{«den»}=\frac{«db»}{«den»}=«dfb»$$

          **答え** $«dfb»$。絶対値は目安 $2/\sqrt{«n»}=«cut»$ を超えるので、この患者は傾きに大きな影響を与えている。

          **間違えやすい点** 分母には除外後の $s_{(i)}=«si»$ を使う（除外前の «sa» だと $«c_sall»$）。差は「全データ − 除外後」の順で、符号は「この人がいると傾きがどちらに動くか」を表す（ここでは負の向きに急になる）。
          $c_{11}$ は平方根をとって使う。

      - id: s15p10c
        chapter: 30
        terms: [aicc, aic, overfitting]
        topic: 標本が小さい回帰モデルの比較でAICとAICcの選ぶモデルが分かれることを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          正規誤差を仮定して最尤法で当てはめた 3 つのモデルを比べる。モデル Q はモデル S に年齢の 2 乗と糖尿病の有無の 2 項を加えたものである。$k$ は推定するパラメータの数（回帰係数と誤差分散の合計）。

          | モデル | $-2\log L$ | $k$ |
          |---|---|---|
          | L | «Ll» | «Lk» |
          | S | «Sl» | «Sk» |
          | Q | «Ql» | «Qk» |

          $AIC=-2\log L+2k$、$AICc=AIC+\dfrac{2k(k+1)}{n-k-1}$（$n=«n»$）とし、それぞれ最小のモデルを選ぶ。正しいものはどれか。
        choices:
          - "AIC でも AICc でもモデル Q を選ぶ"
          - "AIC ではモデル Q、AICc ではモデル S を選ぶ"
          - "AIC ではモデル S、AICc ではモデル Q を選ぶ"
          - "AIC でも AICc でもモデル S を選ぶ"
          - "AIC でも AICc でもモデル L を選ぶ"
        answer: 1
        distractors:
          - AICc の補正項を足し忘れ、AIC と同じ比較をした
          - 正解
          - 補正の向きを取り違え、パラメータの多いモデルほど有利になると考えた
          - AIC でも補正後の値を比べた（AIC の計算で補正項を加えてしまった）
          - −2logL の符号を逆にして（2logL+2k で）比べた
        explanation: |
          **方針** AICc は標本が小さいときの AIC の偏りを補正したもので、パラメータが多いほど補正項 $2k(k+1)/(n-k-1)$ が大きくなる。

          **途中式**

          | モデル | AIC | 補正項 | AICc |
          |---|---|---|---|
          | L | «Laic» | $«Lnum»/«Lden»=«Lpen»$ | «Laicc» |
          | S | «Saic» | $«Snum»/«Sden»=«Spen»$ | «Saicc» |
          | Q | «Qaic» | $«Qnum»/«Qden»=«Qpen»$ | «Qaicc» |

          AIC の最小は Q（«Qaic»）、AICc の最小は S（«Saicc»）。

          **答え** AIC ではモデル Q、AICc ではモデル S を選ぶ。

          **間違えやすい点** $n=«n»$ に対して $k=«Qk»$ は小さくないので、AIC は複雑なモデルを選びやすく過学習の危険がある。AICc の補正は $n$ が大きいと 0 に近づき、AIC と同じ結論になる。
          $k$ には誤差分散も数える。

  - id: s15p11
    title: 入院費用のガンマ回帰
    context: |
      ある病院の入院 1 件あたりの医療費 $Y$（万円）について、手術の有無 $x_1$（あり 1、なし 0）と年齢 $x_2$（10 歳を 1 単位）を説明変数とする一般化線形モデルを当てはめた。
      $Y$ はガンマ分布に従い、リンク関数は対数：$\log E[Y]=\beta_0+\beta_1x_1+\beta_2x_2$ とする。推定値は $\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
      ガンマ分布の GLM では分散関数が $V[Y]=\phi\,\{E[Y]\}^2$（$\phi$ は一定の分散母数）となる。
    items:
      - id: s15p11a
        chapter: 18
        terms: [generalized-linear-model, link-function, exponential-dispersion-family]
        topic: 対数リンクのガンマ回帰の係数から期待入院費の倍率を求め分散関数から標準偏差の倍率を読む
        level: 標準
        definition: false
        type: choice
        question: |
          「手術あり・80 歳」の患者と「手術なし・60 歳」の患者を比べる。前者の期待医療費と医療費の標準偏差は、それぞれ後者の何倍と推定されるか。
          必要なら $e^{0.6}=«e6»$、$e^{0.5}=«e5»$、$\sqrt{«e6»}=«sq»$ を使え。
        choices:
          - "期待値 «c_ok» 倍、標準偏差は変わらない"
          - "期待値 «c_ok» 倍、標準偏差 «c_sq» 倍"
          - "期待値 «c_lin» 倍、標準偏差 «c_lin» 倍"
          - "期待値 «c_one» 倍、標準偏差 «c_one» 倍"
          - "期待値 «c_ok» 倍、標準偏差 «c_ok» 倍"
        answer: 4
        distractors:
          - 正規分布の線形回帰のように分散が一定だと考えた
          - ポアソン分布のように分散が平均に比例すると考えた
          - 対数リンクの係数を指数変換せず 1+0.6 とした
          - 年齢の差 20 歳を 1 単位と数えた（10 歳が 1 単位）
          - 正解
        explanation: |
          **方針** 対数リンクでは係数の和を指数変換したものが期待値の倍率になる。分散関数 $V[Y]=\phi\mu^2$ から標準偏差は $\sqrt\phi\,\mu$ で、平均に比例する。

          **途中式** 説明変数の差は $x_1$ が 1、$x_2$ が 2（20 歳）なので
          $$\frac{\mu_{\text{前者}}}{\mu_{\text{後者}}}=\exp(«b1»\times1+«b2»\times2)=e^{«lin»}=«e6»$$
          標準偏差の比は $\sqrt\phi\,\mu$ の比なので同じく $«e6»$ 倍。

          **答え** 期待値・標準偏差とも «c_ok» 倍（変動係数 $\sqrt\phi$ は一定）

          **間違えやすい点** 年齢の単位は 10 歳なので 20 歳差は 2 単位（1 単位と数えると $e^{«b12»}=«c_one»$）。
          ガンマ分布の GLM は「費用が大きい人ほどばらつきも大きい」データに向いている。分散が一定（正規）なら標準偏差は変わらず、分散が平均に比例（ポアソン）なら $\sqrt{«e6»}=«c_sq»$ 倍になる。

  - id: s15p12
    title: 介護施設入居者の認知症調査
    context: |
      ある県の介護施設 «Nf» か所の入居者のうち、認知症の診断がある人の総数を推定したい。
      まず «Nf» 施設から «nf» 施設を単純無作為抽出し（第 1 段）、選んだ各施設で入居者から «m» 人を非復元単純無作為抽出して（第 2 段）、診断の有無を調べた。

      | 施設 | 入居者数 $M_i$ | 調べた人数 | 診断ありの人数 |
      |---|---|---|---|
      | 1 | «M1» | «m» | «x1» |
      | 2 | «M2» | «m» | «x2» |
      | 3 | «M3» | «m» | «x3» |
      | 4 | «M4» | «m» | «x4» |
    items:
      - id: s15p12a
        chapter: 21
        terms: [two-stage-sampling, simple-random-sampling, sampling-weight]
        topic: 介護施設を第1段入居者を第2段とする2段抽出で県全体の認知症の入居者数を不偏推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          各施設の総数を「入居者数 × 標本中の割合」で推定し、それを第 1 段の抽出率で割り戻す不偏推定量で、«Nf» 施設全体の診断ありの入居者数を推定せよ。
        answer: «ans»
        tolerance: 0.4
        answer_format: 整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 2 段抽出の総数の不偏推定量は $\hat Y=\dfrac{N}{n}\sum_{i}\hat Y_i$、$\hat Y_i=M_i\times(\text{施設 }i\text{ の標本中の割合})$。

          **途中式** 各施設の推定総数は
          $$«M1»\times«p1»=«y1»,\quad «M2»\times«p2»=«y2»,\quad «M3»\times«p3»=«y3»,\quad «M4»\times«p4»=«y4»$$
          合計 «ysum»。第 1 段の抽出率は $«nf»/«Nf»$ なので
          $$\hat Y=\frac{«Nf»}{«nf»}\times«ysum»=«fac»\times«ysum»=«ans»$$

          **答え** $«ans»$ 人

          **間違えやすい点** 標本の陽性数をそのまま割り戻す（$«fac»\times(«x1»+«x2»+«x3»+«x4»)=«w_ign»$）と、施設の規模の違いを無視することになる。
          4 施設分の合計 «ysum» で止めず、選ばれなかった施設の分まで $N/n$ 倍して割り戻す。割合の単純平均 «pbar» に平均入居者数 «Mbar» と施設数を掛けた $«w_avg»$ は、規模と割合の組合せを無視しており、この推定量とは一致しない。

  - id: s15p13
    title: HbA1c による患者群の判別
    context: |
      ある糖尿病外来で、患者の HbA1c（%）の分布を 2 つの正規分布の混合で表すモデルを当てはめた。
      成分 1（血糖管理が良好な群）は混合比 «pi1»、平均 «mu1»、標準偏差 «sd1»、成分 2（管理不良の群）は混合比 «pi2»、平均 «mu2»、標準偏差 «sd2» だった。
    items:
      - id: s15p13a
        chapter: 24
        terms: [mixture-model-clustering, non-hierarchical-clustering]
        topic: 2成分の正規混合モデルによるクラスタリングでHbA1cがある値の患者が管理不良群に属する事後確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          HbA1c が «x»% の患者が成分 2（管理不良の群）に属する事後確率（負担率）に最も近いものはどれか。
          標準正規分布の密度 $\varphi(z)$ は $\varphi(1)=«phi1»$、$\varphi(2)=«phi2»$ である。
        choices:
          - "$«c_comp»$"
          - "$«ans»$"
          - "$«c_nosd»$"
          - "$«c_nopi»$"
          - "$«c_none»$"
        answer: 1
        distractors:
          - 成分 1 に属する確率を答えた
          - 正解
          - 正規密度を標準偏差で割り忘れた（φ(z) をそのまま使った）
          - 混合比を掛け忘れた
          - 混合比も標準偏差も考えず φ(z) だけを比べた
        explanation: |
          **方針** ベイズの定理で $P(\text{成分}2\mid x)=\dfrac{\pi_2f_2(x)}{\pi_1f_1(x)+\pi_2f_2(x)}$。正規密度は $f_k(x)=\varphi\left((x-\mu_k)/\sigma_k\right)/\sigma_k$。

          **途中式** 標準化すると $z_1=(«x»-«mu1»)/«sd1»=«z1»$、$z_2=(«x»-«mu2»)/«sd2»=-«z2»$（$\varphi$ は左右対称）。
          $$f_1(«x»)=\frac{«phi2»}{«sd1»}=«f1»,\qquad f_2(«x»)=\frac{«phi1»}{«sd2»}=«f2»$$
          $$\pi_1f_1=«pi1»\times«f1»=«w1»,\qquad \pi_2f_2=«pi2»\times«f2»=«w2»$$
          $$P(\text{成分}2\mid x)=\frac{«w2»}{«w1»+«w2»}=\frac{«w2»}{«wsum»}=«ans4»$$

          **答え** $«ans»$（ほぼ五分五分で、どちらの群か判断しにくい患者）

          **間違えやすい点** 標準偏差の違う成分を比べるので、$\varphi(z)$ を $\sigma_k$ で割るのを忘れない（忘れると $«c_nosd»$）。混合比を掛け忘れると $«c_nopi»$ となり、管理不良群が少数派であることを無視してしまう。
          混合モデルによるクラスタリングは、k 平均法のように 1 つの群に割り当てるのではなく、所属の確率を与える。

  - id: s15p14
    title: 看護職員の職務満足の分析
    context: |
      ある病院で、看護職員の職務満足を測る質問紙を分析している。
    items:
      - id: s15p14a
        chapter: 25
        terms: [promax-rotation, communality, factor-loading]
        topic: 斜交回転した2因子モデルで因子パターンと因子間相関から項目の共通性を求める
        level: 標準
        definition: false
        type: choice
        question: |
          標準化した項目に 2 因子モデルを当てはめ、プロマックス回転（斜交回転）をしたところ、項目「上司からの支援」の因子パターン（負荷量）は第 1 因子 «l1»、第 2 因子 «l2»、2 つの因子の相関は «ph» だった（因子の分散は 1）。
          この項目の共通性に最も近いものはどれか。
        choices:
          - "$«c_orth»$"
          - "$«c_ph2»$"
          - "$«h»$"
          - "$«c_u»$"
          - "$«c_one»$"
        answer: 2
        distractors:
          - 直交モデルと同じように負荷量の 2 乗和だけを計算し、因子間相関を無視した
          - 交差項に因子間相関の 2 乗を使った
          - 正解
          - 共通性ではなく独自性（1 − 共通性）を答えた
          - 因子間相関を 1 とみなした（2 因子が同じものになる）
        explanation: |
          **方針** 項目 $=\lambda_1F_1+\lambda_2F_2+\text{独自因子}$ で、$V[F_1]=V[F_2]=1$、$\text{Cov}(F_1,F_2)=\phi$。共通因子部分の分散が共通性である。

          **途中式**
          $$h^2=V[\lambda_1F_1+\lambda_2F_2]=\lambda_1^2+\lambda_2^2+2\lambda_1\lambda_2\phi=«l1s»+«l2s»+2\times«l1»\times«l2»\times«ph»=«l1s»+«l2s»+«cross»=«h»$$

          **答え** $«h»$

          **間違えやすい点** 斜交回転では因子が相関するので、負荷量の 2 乗和 $«c_orth»$ は共通性にならない（交差項 «cross» が加わる）。
          直交回転なら共通性は負荷量の 2 乗和に等しく回転で変わらないが、斜交回転では因子パターンだけでなく因子間相関も見る必要がある。

      - id: s15p14b
        chapter: 26
        terms: [nonmetric-mds, multidimensional-scaling]
        topic: 非計量多次元尺度法で配置の距離と単調回帰の値からクラスカルのストレスを求める
        level: 基本
        definition: false
        type: choice
        question: |
          職務満足の 4 つの側面（給与・人間関係・仕事内容・勤務体制）について、職員の回答から求めた非類似度をもとに非計量多次元尺度法で 2 次元の配置を求めた。
          6 つの組を非類似度の小さい順に並べ、配置上の距離 $d$ と、単調回帰で得た値 $\hat d$ を示す。

          | 組（非類似度の小さい順） | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | 距離 $d$ | «d1» | «d2» | «d3» | «d4» | «d5» | «d6» |
          | 単調回帰の値 $\hat d$ | «h1» | «h2» | «h3» | «h4» | «h5» | «h6» |

          クラスカルのストレス $\sqrt{\sum(d-\hat d)^2\big/\sum d^2}$ に最も近いものはどれか。
        choices:
          - "$«c_nosqrt»$"
          - "$«st»$"
          - "$«c_num»$"
          - "$«c_rms»$"
          - "$«c_rt»$"
        answer: 1
        distractors:
          - 平方根をとらなかった
          - 正解
          - 差の 2 乗和だけを答え、Σd² で割らなかった
          - Σd² ではなく組の数 6 で割った
          - 差の 2 乗和の平方根をとっただけで、割らなかった
        explanation: |
          **方針** ストレスは、配置の距離が非類似度の順序（単調回帰の値）からどれだけずれているかを、距離の大きさで基準化した量。0 に近いほど当てはまりがよい。

          **途中式** 差の 2 乗は $«sq»$ で、和は «num»。距離の 2 乗の和は $«dsq»=«den»$。
          $$\text{ストレス}=\sqrt{\frac{«num»}{«den»}}=\sqrt{«ratio»}=«st4»$$

          **答え** $«st»$（クラスカルの目安では 0.05〜0.1 は「まずまず」）

          **間違えやすい点** 分母は距離の 2 乗和で、組の数ではない（$\sqrt{«num»/6}=«c_rms»$ は別の量）。
          単調回帰の値 $\hat d$ は、距離 $d$ を非類似度の順序に合うように（単調非減少に）直したもので、順序が逆転している組（2 と 3、5 と 6）は平均でならされている。
