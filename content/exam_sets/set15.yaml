set: 15
title: 模擬試験 第15回
minutes: 90
problems:
  - id: s15p01
    title: 臨床検査室の検体処理と精度管理
    context: |
      ある病院の臨床検査室では、検体の処理時間と測定の精度を管理している。

      - 病棟から検査室までの搬送時間を $X$、検査室に届いてから結果が出るまでの分析時間を $Y$（どちらも単位は時間）とする。
        過去の記録から、$(X,Y)$ の同時確率密度関数は次のように表せるとする。
        $$f(x,y)=x+y\qquad(0<x<1,\ 0<y<1),\qquad\text{それ以外では }0$$
      - 血糖の管理試料を同じ日に «n» 回測定する。各測定値は互いに独立に正規分布 $N(\mu,\sigma^2)$ に従うとし、
        標本標準偏差 $S$ は不偏分散 $S^2=\frac{1}{n-1}\sum(X_i-\bar X)^2$ の平方根とする。

      必要なら、自由度 9 のカイ二乗分布に従う $W$ についての次の値を使え。

      | $c$ | «craw» | «cnosq» | «cok» | «cn» |
      |---|---|---|---|---|
      | $P(W>c)$ | «q1» | «q2» | «q3» | «q4» |

      また、自由度 9 のカイ二乗分布の下側 2.5% 点は «lo»、上側 2.5% 点は «hi» である。
    items:
      - id: s15p01a
        chapter: 2
        terms: [joint-probability-density-function, marginal-probability-density-function, conditional-probability-density-function]
        topic: 搬送時間と分析時間の同時密度から周辺密度と条件付き密度を求め搬送時間が与えられたときの分析時間の条件付き確率
        level: 応用
        definition: false
        type: choice
        question: |
          搬送時間がちょうど 15 分（$X=«x0»$）だった検体について、分析時間が 30 分を超える条件付き確率 $P(Y>«y0»\mid X=«x0»)$ はいくらか。
        choices:
          - "$«c_comp»$"
          - "$«c_joint»$"
          - "$«c_marg»$"
          - "$«cond»$"
          - "$«c_le»$"
        answer: 3
        distractors:
          - 求める確率の余事象 P(Y≦1/2 | X=1/4) を答えた
          - 同時密度を y で積分しただけで、周辺密度 f_X(1/4) で割らなかった
          - X の値を無視して周辺確率 P(Y>1/2) を答えた
          - 正解
          - 「X=1/4」を「X≦1/4」とみなして条件付けた
        explanation: |
          **方針** 条件付き密度 $f_{Y\mid X}(y\mid x)=f(x,y)/f_X(x)$ を作り、$y>«y0»$ の範囲で積分する。まず周辺密度 $f_X(x)$ を求める。

          **途中式** 周辺密度は
          $$f_X(x)=\int_0^1(x+y)\,dy=x+\frac12\quad(0<x<1),\qquad f_X\!\left(«x0»\right)=«fx»$$
          したがって
          $$P\left(Y>«y0»\mid X=«x0»\right)=\frac{1}{f_X(«x0»)}\int_{1/2}^{1}\left(\frac14+y\right)dy=\frac{1}{«fx»}\left(\frac14\times\frac12+\frac{1-(1/2)^2}{2}\right)=\frac{«t1»+«t2»}{«fx»}=\frac{«num»}{«fx»}=\frac23$$

          **答え** $«cond»$

          **間違えやすい点** 同時密度を $y$ で積分しただけ（$«c_joint»$）では条件付き確率にならない。必ず $f_X(«x0»)=«fx»$ で割って正規化する。
          搬送時間を無視した周辺確率 $P(Y>«y0»)=\int_{1/2}^1\left(y+\frac12\right)dy=«c_marg»$ とも違う。
          「$X=«x0»$」を「$X\le«x0»$」と読み替えると $P(X\le«x0»,Y>«y0»)/P(X\le«x0»)=«jle»/«FX»=«c_le»$ となり、別の量になる。

      - id: s15p01b
        chapter: 6
        terms: [chi-squared-distribution, normal-distribution]
        topic: 管理試料の繰り返し測定で標本標準偏差が真の標準偏差の一定倍を超える確率をカイ二乗分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          この検査室では、«n» 回の測定の標本標準偏差 $S$ が $«k»\sigma$ を超えると「精度異常」の警告を出す。ここで $\sigma$ は測定系が正常なときの母標準偏差である。
          測定系が正常なとき、警告が出る確率（誤警告の確率）に最も近いものはどれか。
        choices:
          - "$«b_raw»$"
          - "$«b_nosq»$"
          - "$«b_ok»$"
          - "$«b_n»$"
          - "$«b_comp»$"
        answer: 2
        distractors:
          - (n-1) を掛けずに S^2/σ^2=2.25 をカイ二乗分布の値として使った
          - S を 2 乗せず (n-1)×1.5=13.5 とした
          - 正解
          - 自由度の n-1=9 ではなく n=10 を掛けて 22.5 とした
          - 上側確率と下側確率を取り違えた
        explanation: |
          **方針** 正規母集団からの標本では $W=(n-1)S^2/\sigma^2$ が自由度 $n-1$ のカイ二乗分布に従う。$S>«k»\sigma$ を $W$ の条件に書き直す。

          **途中式**
          $$P(S>«k»\sigma)=P\left(\frac{(n-1)S^2}{\sigma^2}>(n-1)\times«k»^2\right)=P(W>«df»\times«k2»)=P(W>«cok»)=«b_ok»$$

          **答え** $«b_ok»$（正常でも約 1.6% の確率で誤警告が出る）

          **間違えやすい点** 掛けるのは標本の大きさ $n=«n»$ ではなく自由度 $n-1=«df»$（$n$ を掛けると $P(W>«cn»)=«b_n»$）。
          $S$ を 2 乗し忘れて $«df»\times«k»=«cnosq»$ とすると $«b_nosq»$ になる。「超える」確率なので上側確率を使い、$1-«b_ok»=«b_comp»$ としないこと。

      - id: s15p01c
        chapter: 9
        terms: [ci-variance, pivotal-quantity, confidence-interval]
        topic: 管理試料の測定値の標本標準偏差から測定の母標準偏差の95%信頼区間をカイ二乗分布で作る
        level: 標準
        definition: false
        type: choice
        question: |
          ある日の «n» 回の測定では、標本標準偏差が $S=«S»$（mg/dL）だった。測定の母標準偏差 $\sigma$ の 95% 信頼区間（両側、等裾）として正しいものはどれか。
        choices:
          - "$(«w_zlo»,\\ «w_zhi»)$"
          - "$(«sdlo»,\\ «sdhi»)$"
          - "$(«w_nlo»,\\ «w_nhi»)$"
          - "$(«w_vlo»,\\ «w_vhi»)$"
          - "$(«w_slo»,\\ «w_shi»)$"
        answer: 1
        distractors:
          - 正規近似 S±1.96 S/√(2(n-1)) を使った
          - 正解
          - (n-1)S^2 の代わりに n S^2 を使った
          - 母分散 σ^2 の区間を答え、平方根をとらなかった
          - S^2 ではなく S をピボットに入れた
        explanation: |
          **方針** ピボット量 $(n-1)S^2/\sigma^2\sim\chi^2_{«df»}$ を使って $\sigma^2$ の区間を作り、端点の平方根をとって $\sigma$ の区間にする。

          **途中式** $(n-1)S^2=«df»\times«S2»=«ss»$。
          $$P\left(«lo»<\frac{«ss»}{\sigma^2}<«hi»\right)=0.95\iff\frac{«ss»}{«hi»}<\sigma^2<\frac{«ss»}{«lo»}$$
          $\sigma^2$ の区間は $(«vlo4»,\ «vhi4»)$。平方根をとると $\sigma$ の区間は $(«sdlo4»,\ «sdhi4»)$。

          **答え** $(«sdlo»,\ «sdhi»)$。区間は $S=«S»$ に対して右に長い（非対称）。

          **間違えやすい点** 下限には上側 2.5% 点 «hi»、上限には下側 2.5% 点 «lo» を使う（大きい方の点で割ると小さい端になる）。
          $nS^2=«ssn»$ を使うと $(«w_nlo»,\ «w_nhi»)$、平方根を忘れると母分散の区間 $(«w_vlo»,\ «w_vhi»)$ になる。
          正規近似 $S\pm1.96\,S/\sqrt{2(n-1)}$ では $(«w_zlo»,\ «w_zhi»)$ となり、小標本ではカイ二乗分布による正確な区間と合わない。

  - id: s15p02
    title: 輸液ポンプのアラームの誤報
    context: |
      ある病棟では 3 社（A, B, C）の輸液ポンプを使っている。病棟で鳴る閉塞アラームのうち、A 社製のポンプからのものが «wA»、B 社製が «wB»、C 社製が «wC» の割合を占める。
      アラームが実際には閉塞のない「誤報」である割合は、A 社製で «fA»、B 社製で «fB»、C 社製で «fC» である。
    items:
      - id: s15p02a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: 3社の輸液ポンプのアラームのうち誤報だったものが特定の会社製である事後確率をベイズの定理で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある閉塞アラームが誤報だったとわかった。このアラームが C 社製のポンプから出たものである確率に最も近いものはどれか。
        choices:
          - "$«c_prior»$"
          - "$«c_joint»$"
          - "$«post»$"
          - "$«c_lik»$"
          - "$«c_not»$"
        answer: 2
        distractors:
          - 誤報という情報を使わず事前の割合 0.2 を答えた
          - 同時確率 P(C かつ誤報) を答え、P(誤報) で割らなかった
          - 正解
          - 各社の誤報率だけを足して 1 になるように割り、アラームの割合（事前確率）を無視した
          - 「誤報でなかった」アラームが C 社製である確率を求めた
        explanation: |
          **方針** 全確率の公式で $P(\text{誤報})$ を求め、ベイズの定理で $P(C\mid\text{誤報})$ を計算する。

          **途中式** 各社について「その会社製で誤報」の確率は
          $$«wA»\times«fA»=«jA»,\qquad «wB»\times«fB»=«jB»,\qquad «wC»\times«fC»=«jC»$$
          $P(\text{誤報})=«jA»+«jB»+«jC»=«pf»$。よって
          $$P(C\mid\text{誤報})=\frac{«jC»}{«pf»}=«post4»\cdots$$

          **答え** $«post»$

          **間違えやすい点** 事前の割合 $«c_prior»$ のままではない（C 社は誤報率が高いので、誤報とわかると確率が上がる）。
          分子の $«jC»$ で止めたり、誤報率だけを比べて $«fC»/(«fA»+«fB»+«fC»)=«c_lik»$ としたりしないこと。

      - id: s15p02b
        chapter: 5
        terms: [negative-binomial-distribution, geometric-distribution, binomial-distribution]
        topic: アラームが独立に一定の確率で誤報になるとき3回目の誤報がちょうど10回目に起こる確率を負の二項分布で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          B 社製のポンプについて、各アラームは互いに独立に確率 «p» で誤報になるとする。
          あるポンプのアラームを最初から数えたとき、**3 回目の誤報がちょうど «m» 回目のアラームで起こる**確率を求めよ。
        answer: «ans»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 「«m» 回目がちょうど 3 回目の誤報」は、「最初の «mm1» 回で誤報がちょうど «km1» 回」かつ「«m» 回目が誤報」と同じ。試行回数で数えた負の二項分布の確率である。

          **途中式**
          $$P=\binom{«mm1»}{«km1»}p^{«k»}(1-p)^{«mk»}=«comb»\times«p»^{«k»}\times«q»^{«mk»}=«comb»\times«pk»\times«q7»=«ans6»$$

          **答え** $«ans»$

          **間違えやすい点** 最後の «m» 回目は必ず誤報なので、組合せは $\binom{«mm1»}{«km1»}=«comb»$ であり、$\binom{«m»}{«k»}=«c103»$ ではない（それは「«m» 回中ちょうど 3 回が誤報」の二項確率 $«w_bin»$）。
          $\binom{«mm1»}{3}$ とすると $«w_c93»$ になる。負の二項分布には「失敗回数で数える」流儀もあるが、ここでは試行回数で数えている。

  - id: s15p03
    title: 病棟の転倒件数
    context: |
      ある病院で、病床数がほぼ同じ 8 つの病棟について、同じ月の入院患者の転倒件数を数えたところ次のとおりだった。

      | 病棟 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
      |---|---|---|---|---|---|---|---|---|
      | 転倒件数 | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» | «x7» | «x8» |

      必要ならカイ二乗分布の次の点を使え：自由度 7 の上側 5% 点 «c7»、上側 2.5% 点 «c7h»、自由度 8 の上側 5% 点 «c8»。
    items:
      - id: s15p03a
        chapter: 12
        terms: [dispersion-test, poisson-distribution, chi-squared-distribution]
        topic: 8病棟の転倒件数が同じ平均のポアソン分布に従うかを分散指数検定で調べ過分散を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          「8 病棟の件数は同じ平均のポアソン分布に従う」という帰無仮説を、分散指数統計量 $D=\sum_{i=1}^{8}(x_i-\bar x)^2/\bar x$ を用いて、
          **過分散（分散が平均より大きい）を対立仮説とする片側検定**で、有意水準 5% で検定する。正しいものはどれか。
        choices:
          - "$D=«D1»$ で、自由度 8 の上側 5% 点 «c8» を超えないので、ポアソン分布と矛盾しない"
          - "$D=«D1»$ で、自由度 7 の上側 5% 点 «c7» を超えるので、帰無仮説を棄却し過分散と判断する"
          - "分散と平均の比 «ratio» は «c7» より小さいので、ポアソン分布と矛盾しない"
          - "$D=«D1»$ で、自由度 7 の上側 5% 点 «c7» を超えるので、帰無仮説を棄却し過小分散（分散が平均より小さい）と判断する"
          - "$D=«D1»$ で、自由度 7 の上側 2.5% 点 «c7h» を超えないので、ポアソン分布と矛盾しない"
        answer: 1
        distractors:
          - 自由度を病棟数 8 とした（平均を推定した分の 1 を引き忘れた）
          - 正解
          - 不偏分散と平均の比（分散指数）そのものをカイ二乗分布の点と比べた
          - 計算と判定は正しいが、大きな D が意味する方向（過分散）を逆に解釈した
          - 片側検定なのに両側検定の 2.5% 点と比べた
        explanation: |
          **方針** ポアソン分布では分散と平均が等しい。帰無仮説のもとで $D=\sum(x_i-\bar x)^2/\bar x$ は近似的に自由度 $k-1$ のカイ二乗分布に従う（平均 $\lambda$ を $\bar x$ で推定した分、自由度が 1 減る）。$D$ が大きいほど分散が平均より大きいことを示す。

          **途中式** $\bar x=«sumx»/«k»=«xb»$。偏差の 2 乗の和は
          $$\sum(x_i-\bar x)^2=«dev2»=«ssd»$$
          $$D=\frac{«ssd»}{«xb»}=«D1»$$
          自由度 $«k»-1=«km1»$ の上側 5% 点 «c7» を超えるので帰無仮説を棄却する。

          **答え** $D=«D1»>«c7»$ で棄却し、過分散と判断する（病棟によって転倒の起こりやすさが違うことが疑われる）。

          **間違えやすい点** 自由度を 8 とすると «c8» と比べて棄却しない誤った結論になる。
          $D$ は不偏分散と平均の比 $«s2»/«xb»=«ratio»$ に $k-1$ を掛けたもので、比そのものをカイ二乗分布の点と比べてはいけない。
          対立仮説は過分散の片側なので、両側の 2.5% 点 «c7h» と比べるのも誤り。

      - id: s15p03b
        chapter: 10
        terms: [randomized-test, significance-level, rejection-region]
        topic: ポアソン分布の片側検定で有意水準をちょうど5%にするランダム化検定の境界点での棄却確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          病棟 1 では従来、転倒件数が平均 «lam» 件/月のポアソン分布に従っていた。転倒予防策を導入したあとの «months» か月間の転倒件数の合計 $T$ は、平均 $\mu$ のポアソン分布に従うとする。
          帰無仮説 $H_0:\mu=«mu0»$、対立仮説 $H_1:\mu<«mu0»$ の検定を、次の形のランダム化検定で行う。
          $$T\le1\text{ なら棄却},\qquad T=2\text{ なら確率 }\gamma\text{ で棄却},\qquad T\ge3\text{ なら棄却しない}$$
          有意水準がちょうど 5% になるような $\gamma$ を求めよ。必要なら $e^{-6}=«e6»$ を使え。
        answer: «gamma»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $H_0$ のもとで棄却する確率は $P(T\le1)+\gamma P(T=2)$。これが 0.05 になるように $\gamma$ を決める。

          **途中式** $H_0$ のもとで $T\sim\text{Po}(«mu0»)$ なので
          $$P(T=0)=e^{-6}=«p0»,\quad P(T=1)=6e^{-6}=«p1»,\quad P(T=2)=\frac{6^2}{2}e^{-6}=18e^{-6}=«p2»$$
          $P(T\le1)=«cdf1»$（5% より小さい）、$P(T\le2)=«cdf2»$（5% を超える）。よって境界の $T=2$ でランダム化が必要で
          $$«cdf1»+\gamma\times«p2»=0.05\iff\gamma=\frac{0.05-«cdf1»}{«p2»}=\frac{«num»}{«p2»}=«gamma4»\cdots$$

          **答え** $\gamma=«gamma»$

          **間違えやすい点** 0.05 を $P(T\le2)$ で割って $«w_ratio»$ とするのは誤り。$T\le1$ はすでに確率 1 で棄却しているので、残り $0.05-P(T\le1)$ を $P(T=2)$ で割る。
          $1-\gamma=«w_comp»$ は「$T=2$ のとき棄却しない」確率である。ランダム化しなければ、有意水準 5% 以下で選べる棄却域は $T\le1$（実際の大きさ «cdf1»）までになる。

  - id: s15p04
    title: 入院日数の分布
    context: |
      ある病院の一般病棟では、入院日数（日）を記録している。入院日数は 0 以上の値をとる。
    items:
      - id: s15p04a
        chapter: 7
        terms: [markov-inequality, chebyshev-inequality]
        topic: 平均だけがわかっている入院日数が長期になる患者の割合の上界をマルコフの不等式で求める
        level: 基本
        definition: false
        type: choice
        question: |
          過去の記録から、入院日数 $X$ の平均は «mu» 日であることだけがわかっている（分布の形や分散は仮定しない）。
          入院日数が «a» 日以上になる患者の割合 $P(X\ge«a»)$ について、マルコフの不等式から確実にいえる上界はどれか。
        choices:
          - "$«c_exp»$"
          - "$«c_sq»$"
          - "$«c_ok»$"
          - "$«c_dev»$"
          - "$«c_comp»$"
        answer: 2
        distractors:
          - 指数分布を仮定して e^{-60/12}=e^{-5} を計算した（分布を仮定しているので「確実にいえる」上界ではない）
          - 比 μ/a を 2 乗した（チェビシェフの不等式の形と混同した）
          - 正解
          - 分母を a ではなく平均からの距離 a-μ=48 にした
          - 上界ではなく 1-μ/a を答えた
        explanation: |
          **方針** 非負の確率変数 $X$ と $a>0$ について、マルコフの不等式 $P(X\ge a)\le E[X]/a$ が成り立つ。平均だけで使える。

          **途中式**
          $$P(X\ge«a»)\le\frac{E[X]}{«a»}=\frac{«mu»}{«a»}=«c_ok»$$

          **答え** $«c_ok»$（入院日数が «a» 日以上の患者は多くても 2 割）

          **間違えやすい点** チェビシェフの不等式は分散が必要で、形も $\sigma^2/k^2$ と 2 乗になる。平均だけのときは $(«mu»/«a»)^2=«c_sq»$ のように 2 乗してはいけない。
          指数分布などを仮定すると $e^{-5}\approx«e5»$ のように小さくなるが、分布を仮定しない保証ではない。マルコフの上界は平均だけからいえる最良の値で、0 と «a» の 2 点だけをとる分布で等号が成り立つ。

      - id: s15p04b
        chapter: 8
        terms: [method-of-moments, gamma-distribution, point-estimation]
        topic: 入院日数をガンマ分布とみて標本平均と標本分散から形状母数をモーメント法で推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          ある月に退院した患者 «n» 人の入院日数について、標本平均は $\bar x=«xb»$、標本分散（$n$ で割ったもの）は $«v»$ だった。
          入院日数が形状 $k$、尺度 $\theta$ のガンマ分布（平均 $k\theta$、分散 $k\theta^2$）に従うとして、
          標本平均と標本分散（$n$ で割ったもの）を母平均・母分散に等しいとおくモーメント法で $k$ を推定せよ。
        answer: «k»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $k\theta=\bar x$、$k\theta^2=v$ を連立して解く。2 式を割ると $\theta=v/\bar x$、これを戻すと $k=\bar x^2/v$。

          **途中式**
          $$\hat\theta=\frac{v}{\bar x}=\frac{«v»}{«xb»}=«th»,\qquad \hat k=\frac{\bar x^2}{v}=\frac{«xb2»}{«v»}=«k4»$$

          **答え** $\hat k=«k»$（尺度 $\hat\theta=«th»$）

          **間違えやすい点** $\bar x/v=«w_inv»$ は形状ではなく尺度の逆数（レート）の推定値である。
          問題文の指定どおり $n$ で割った標本分散を使う。不偏分散 $«v»\times«n»/(«n»-1)=«vu»$ を使うと $«w_unb»$ になる。

  - id: s15p05
    title: 高齢者の歩行速度と身体機能
    context: |
      ある自治体の介護予防事業で、65 歳以上の参加者 «n» 人について、通常歩行速度 $W$（m/秒）、握力 $G$（kg）、年齢 $A$（歳）、下肢筋力 $L$ を測定した。
      $W,G,A$ の相関係数は次のとおりだった。

      | | $W$ | $G$ | $A$ |
      |---|---|---|---|
      | $W$ | 1 | «rwg» | «rwa» |
      | $G$ | «rwg» | 1 | «rga» |
      | $A$ | «rwa» | «rga» | 1 |
    items:
      - id: s15p05a
        chapter: 3
        terms: [partial-correlation-coefficient, spurious-correlation, covariance-and-correlation]
        topic: 年齢の影響を除いた歩行速度と握力の偏相関係数を3つの相関係数から求める
        level: 標準
        definition: false
        type: choice
        question: |
          年齢 $A$ の影響を除いた、歩行速度 $W$ と握力 $G$ の偏相関係数 $r_{WG\cdot A}$ に最も近いものはどれか。
        choices:
          - "$«c_num»$"
          - "$«pc»$"
          - "$«c_nosqrt»$"
          - "$«c_lin»$"
          - "$«c_raw»$"
        answer: 1
        distractors:
          - 分子 r_WG − r_WA r_GA だけを答え、分母で割らなかった
          - 正解
          - 分母の平方根をとらなかった
          - 分母で相関係数を 2 乗せず (1−|r_WA|)(1−|r_GA|) とした
          - 年齢の影響を除かず、もとの相関係数を答えた
        explanation: |
          **方針** 偏相関係数の公式 $r_{WG\cdot A}=\dfrac{r_{WG}-r_{WA}r_{GA}}{\sqrt{(1-r_{WA}^2)(1-r_{GA}^2)}}$ を使う。これは $W$ と $G$ をそれぞれ $A$ に回帰した残差どうしの相関である。

          **途中式** 分子は $«rwg»-(«rwa»)\times(«rga»)=«rwg»-«prod»=«num»$。分母は
          $$\sqrt{(1-«rwa2»)(1-«rga2»)}=\sqrt{«den2»}=«den»$$
          $$r_{WG\cdot A}=\frac{«num»}{«den»}=«pc»$$

          **答え** $«pc»$

          **間違えやすい点** $r_{WA}r_{GA}$ は負×負で正になる。年齢が両方を下げるため、もとの相関 «rwg» の一部は年齢を介した見かけの相関で、年齢を固定すると «pc» まで弱まる。
          分母の平方根を忘れると $«c_nosqrt»$、相関係数を 2 乗せずに使うと $«c_lin»$ になる。

      - id: s15p05b
        chapter: 16
        terms: [partial-f-test, multiple-regression-model, f-distribution]
        topic: 年齢だけのモデルに握力と下肢筋力を追加したときの残差平方和の減少から部分F検定の統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          歩行速度 $W$ を目的変数とし、切片を含む次の 2 つの線形回帰モデルを最小二乗法で当てはめた。

          - モデル R（縮小モデル）：説明変数は $A$ だけ。残差平方和 «rss1»
          - モデル F（完全モデル）：説明変数は $A,G,L$ の 3 つ。残差平方和 «rss3»

          「$G$ と $L$ の係数はともに 0」という帰無仮説を検定する部分 $F$ 統計量の値に最も近いものはどれか。
        choices:
          - "$«F_inv»$"
          - "$«F_rss1»$"
          - "$«F»$"
          - "$«F_57»$"
          - "$«F_q1»$"
        answer: 2
        distractors:
          - 分子と分母を逆にした
          - 分母に縮小モデルの残差平方和を使った
          - 正解
          - 完全モデルの残差の自由度を n−3=57 とし、切片の分を引き忘れた
          - 分子の自由度（追加した変数の数 2）で割らなかった
        explanation: |
          **方針** 部分 $F$ 統計量は $F=\dfrac{(RSS_R-RSS_F)/q}{RSS_F/(n-p-1)}$。$q$ は追加した変数の数、$p$ は完全モデルの説明変数の数（切片を除く）。帰無仮説のもとで自由度 $(q,\,n-p-1)$ の $F$ 分布に従う。

          **途中式** $q=«q»$、$n-p-1=«n»-3-1=«dfe»$。
          $$F=\frac{(«rss1»-«rss3»)/«q»}{«rss3»/«dfe»}=\frac{«mnum»}{«mse»}=«F4»$$

          **答え** $«F»$。$F_{0.05}(«q»,«dfe»)\approx«f05»$ を超えるので、握力と下肢筋力の少なくとも一方は年齢を考慮しても歩行速度の説明に役立つと判断される。

          **間違えやすい点** 残差の自由度は切片の分も引いて $«dfe»$（57 とすると $«F_57»$）。分子は追加した変数の数 «q» で割る（割らないと $«F_q1»$）。分母は完全モデルの残差平均平方で、縮小モデルを使うと $«F_rss1»$ になる。

      - id: s15p05c
        chapter: 30
        terms: [mallows-cp, model-selection, variable-selection]
        topic: 完全モデルの残差平均平方を誤差分散の推定値にしてマローズのCpで歩行速度の回帰モデルを選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          さらに次の 4 つのモデル（すべて切片を含む）を比べる。$k$ は切片を含む回帰係数の個数である。

          | モデル | 説明変数 | 残差平方和 $RSS$ | $k$ |
          |---|---|---|---|
          | M1 | $A$ | «M1rss» | «M1k» |
          | M2 | $A,G$ | «M2rss» | «M2k» |
          | M3 | $A,L$ | «M3rss» | «M3k» |
          | M4 | $A,G,L$ | «M4rss» | «M4k» |

          マローズの $C_p=RSS/\hat\sigma^2-n+2k$ で選ぶ。$\hat\sigma^2$ は M4 の残差平均平方（残差平方和を残差の自由度で割ったもの）とし、$C_p$ が最小のモデルを選ぶ。選ばれるモデルとその $C_p$ の組として正しいものはどれか。
        choices:
          - "M2（$C_p=«M2cpn»$）"
          - "M2（$C_p=«M2cp»$）"
          - "M4（$C_p=«M4cp»$）"
          - "M2（$C_p=«M2cpN»$）"
          - "M1（$C_p=«M1cp»$）"
        answer: 1
        distractors:
          - k に切片を数えなかった（2k を 2×説明変数の数とした）
          - 正解
          - 残差平方和が最小のモデルを選んだ（M4 の Cp は常に k と等しくなる）
          - σ^2 の推定に残差平方和を n=60 で割った値を使った
          - 説明変数が最も少ないモデルを選んだ
        explanation: |
          **方針** $\hat\sigma^2$ は前問と同じ完全モデルの残差平均平方 $«rss3»/«dfe»=«mse»$。各モデルの $RSS/\hat\sigma^2$ を求めて $-n+2k$ を加える。

          **途中式**

          | モデル | $RSS/\hat\sigma^2$ | $C_p=RSS/\hat\sigma^2-«n»+2k$ |
          |---|---|---|
          | M1 | «M1ratio» | «M1cp» |
          | M2 | «M2ratio» | «M2cp» |
          | M3 | «M3ratio» | «M3cp» |
          | M4 | «M4ratio» | «M4cp» |

          最小は M2。

          **答え** M2（$C_p=«M2cp»$）。下肢筋力を加えても残差平方和の減り方が小さく、パラメータを増やす罰則に見合わない。

          **間違えやすい点** $k$ は切片を含めて数える（数えないと M2 の $C_p$ は «M2cpn»）。$\hat\sigma^2$ は残差の自由度 «dfe» で割る（$n$ で割ると «mse_n» となり M2 の値は «M2cpN»）。
          残差平方和は変数を増やすほど小さくなるので、それだけで M4 を選んではいけない。完全モデル M4 の $C_p$ は定義から必ず $k=«M4k»$ になる。

  - id: s15p06
    title: 血糖測定器の検量線の外れ値
    context: |
      新しい血糖測定器の検量線を作るため、濃度が既知の標準液 «n» 本を測定し、測定値を既知濃度に単回帰した（切片あり）。
      全 «n» 点で当てはめた残差分散（残差平方和を $n-2$ で割ったもの）は $s^2=«s2»$ だった。
      ある 1 本の標準液 $i$ について、残差は $e_i=«e»$、てこ比は $h_i=«h»$ だった。
    items:
      - id: s15p06a
        chapter: 17
        terms: [studentized-residual, standardized-residual, leverage, outlier-and-influential-point]
        topic: 残差とてこ比と残差分散から1点を除いた残差分散を求め外部スチューデント化残差で検量線の外れ値を判定する
        level: 応用
        definition: false
        type: choice
        question: |
          標準液 $i$ を除いて当てはめ直したときの残差分散 $s_{(i)}^2$ は、再計算しなくても関係式
          $$(n-2)s^2=(n-3)s_{(i)}^2+\frac{e_i^2}{1-h_i}$$
          から求められる。外部スチューデント化残差 $t_i=\dfrac{e_i}{s_{(i)}\sqrt{1-h_i}}$ の値に最も近いものはどれか。
        choices:
          - "$«c_raw»$"
          - "$«c_int»$"
          - "$«c_noh»$"
          - "$«ti»$"
          - "$«c_n2»$"
        answer: 3
        distractors:
          - 残差を s で割っただけで、てこ比も 1 点除去も考えなかった
          - 全点の s を使った内部スチューデント化残差（標準化残差）を答えた
          - s_(i) は正しく求めたが √(1−h_i) で割り忘れた
          - 正解
          - s_(i)^2 を求めるとき n−3 ではなく n−2 で割った
        explanation: |
          **方針** まず関係式から $s_{(i)}^2$ を求め、定義式に代入する。外部スチューデント化残差は、その点を除いた誤差分散の推定値を使うので、外れ値の影響で分母が大きくなる問題を避けられる。

          **途中式**
          $$s_{(i)}^2=\frac{(n-2)s^2-e_i^2/(1-h_i)}{n-3}=\frac{«n2»\times«s2»-«e2»/«omh»}{«n3»}=\frac{«ns2»-«e2h»}{«n3»}=\frac{«diff»}{«n3»}=«s2i»$$
          $s_{(i)}=«si»$、$\sqrt{1-h_i}=\sqrt{«omh»}=«sqomh»$ なので
          $$t_i=\frac{«e»}{«si»\times«sqomh»}=\frac{«e»}{«den»}=«ti4»$$

          **答え** $«ti»$。自由度 «n3» の $t$ 分布の上側 2.5% 点 «t9» を大きく超え、この標準液の測定は外れ値と判断される。

          **間違えやすい点** 内部スチューデント化残差（標準化残差）$r_i=«e»/(«sd»\times«sqomh»)=«c_int»$ は、外れ値自身が $s$ を大きくするため値が控えめに出る。
          $t_i$ は $r_i$ から $t_i=r_i\sqrt{(n-3)/(n-2-r_i^2)}=«c_int»\times\sqrt{«n3»/(«n2»-«ri2»)}=«alt»$ としても求められる。
          $s_{(i)}^2$ の分母は 1 点除いた残差の自由度 $n-3=«n3»$ で、$n-2$ とすると $«c_n2»$ になる。

