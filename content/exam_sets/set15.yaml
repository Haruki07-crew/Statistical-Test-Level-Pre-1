          **間違えやすい点** 平均の感染確率 $\bar p=«mean»/«n»=«pb»$ の二項分布とみなすと $«n»\times«pb»\times(1-«pb»)=«w_bin»$ となり、分散を過大に見積もる。確率がばらつくと、合計の分散は同じ平均の二項分布より小さくなる（$\sum p_i(1-p_i)=n\bar p(1-\bar p)-\sum(p_i-\bar p)^2$）。
