          - x(1-x)^2 ≤ 1 として M=12 を使った
        explanation: |
          **方針** 1回の提案の採択確率は $1/M$ なので、採用 1 個あたりの提案回数の期待値は $M$（幾何分布の期待値）。$M=\max f(x)$ を微分で求める。

          **途中式**
          $$f'(x)=12\{(1-x)^2-2x(1-x)\}=12(1-x)(1-3x)=0\ \Rightarrow\ x=\frac13$$
          $$M=f\!\left(\tfrac13\right)=12\times\frac13\times\frac49=\frac{16}{9}\approx«M_s»$$
          採択率は $9/16=«acc»$。1000 個に必要な提案回数の期待値は $1000\times16/9\approx«N_ok»$。

          **答え** «N_ok»

          **間違えやすい点** $M$ は最頻値 $x=1/3$ での密度で、中央の $x=1/2$ や平均 $0.4$ での値ではない（それらは $f$ を上から抑えられない）。採択率 $1/M$ と必要回数 $M$ を取り違えると «N_inv» になる。$M$ を大きくとっても正しいサンプルは得られるが、効率が落ちる（$M=12$ なら «N_crude» 回）。
