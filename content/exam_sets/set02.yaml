  - id: s02p12
    title: 株式の日次収益率の時系列モデル
    context: |
      ある株式の日次収益率 $X_t$ を MA(1) モデル
      $$X_t=\mu+\varepsilon_t+\theta\varepsilon_{t-1},\qquad \varepsilon_t\sim\text{WN}(0,\sigma^2)$$
      で表す。長期間のデータから、標本分散（自己共分散 $\gamma_0$ の推定値）は 2.5、1次の標本自己相関は 0.40、2次以上の標本自己相関はほぼ 0 だった。
    items:
      - id: s02p12a
        chapter: 27
        terms: [ma-model, invertibility, autocovariance-autocorrelation]
        topic: MA(1)モデルの1次自己相関と分散から反転可能な係数と誤差分散をモーメント法で求める
        level: 応用
        definition: false
        type: choice
        question: |
          理論上の自己相関・分散と標本の値を等しいとおき（モーメント法）、反転可能性を満たすように $\theta$ と $\sigma^2$ を求める。組として正しいものを選べ。
        choices:
          - '$\theta=«thb»$、$\sigma^2=«s2_big»$'
          - '$\theta=«th_ar»$、$\sigma^2=«s2_ar»$'
          - '$\theta=«th»$、$\sigma^2=«s2_raw»$'
          - '$\theta=«th»$、$\sigma^2=«s2_ok»$'
          - '$\theta=«th»$、$\sigma^2=«s2_mul»$'
        answer: 3
        distractors:
          - 反転可能でない（|θ|>1 の）解を選んだ
          - AR(1) と混同して θ=ρ1 とした
          - 誤差分散を γ0 そのものとした
          - 正解
          - γ0 を (1+θ^2) で割るところを掛けた
        explanation: |
          **方針** MA(1) では $\gamma_0=(1+\theta^2)\sigma^2$、$\rho_1=\dfrac{\theta}{1+\theta^2}$、$\rho_k=0\ (k\ge2)$。$\rho_1=0.40$ を $\theta$ の2次方程式として解き、$|\theta|<1$ の解を選ぶ。

          **途中式**
          $$\frac{\theta}{1+\theta^2}=0.4\ \Rightarrow\ 0.4\theta^2-\theta+0.4=0\ \Rightarrow\ \theta=\frac{1\pm\sqrt{1-0.64}}{0.8}=\frac{1\pm0.6}{0.8}$$
          解は $\theta=«thb»$ と $\theta=«th»$。反転可能性 $|\theta|<1$ より $\theta=«th»$。
          $$\sigma^2=\frac{\gamma_0}{1+\theta^2}=\frac{2.5}{«one_th2»}=«s2_ok»$$

          **答え** $\theta=«th»$、$\sigma^2=«s2_ok»$

          **間違えやすい点** $\theta$ と $1/\theta$ は同じ自己相関を与えるので、反転可能性で一つに決める（$\theta=«thb»$ は反転可能でない）。AR(1) なら $\rho_2=\rho_1^2=«rho2ar»$ となるはずで、2次の自己相関がほぼ 0 であることが MA(1) を選ぶ根拠になる。
