        explanation: |
          **方針** 交互作用項がないので、$C$ を 0 から 1 にするとロジットは $L$ によらず 0.6 増え、オッズ比は $e^{0.6}$ で一定。確率の差は4つの予測確率を計算して比べる。

          **途中式** $P=1/(1+e^{-\eta})$ より
          $$L=1:\ \frac{1}{1+«e08»}\approx«p11»\ (C=1),\quad \frac{1}{1+«e14»}\approx«p10»\ (C=0),\quad \text{差}\ «d1»$$
          $$L=0:\ \frac{1}{1+«e16»}\approx«p01»\ (C=1),\quad \frac{1}{1+«e22»}\approx«p00»\ (C=0),\quad \text{差}\ «d0»$$
