        topic: 相関行列の主成分分析で固有値と固有ベクトルの成分から主成分負荷量を求める
        level: 基本
        definition: false
        type: choice
        question: |
          5 項目の相関行列で主成分分析をしたところ、第1主成分の固有値は 2.35、長さ 1 に正規化した固有ベクトルの「信頼」の成分は 0.52 だった。
          第1主成分得点と「信頼」（標準化した値）との相関係数（主成分負荷量）に最も近いものを選べ。
        choices:
          - '«L_div»'
          - '«L_vec»'
          - '«L_sq»'
          - '«L_ok»'
          - '«L_lam»'
        answer: 3
        distractors:
          - 固有ベクトルの成分を √固有値 で割った
          - 固有ベクトルの成分をそのまま負荷量とした
          - 負荷量の2乗（第1主成分で説明される「信頼」の分散の割合）を答えた
          - 正解
          - √ をとらずに固有値をそのまま掛けた
        explanation: |
          **方針** 主成分得点 $z_1=\boldsymbol a^\top\boldsymbol x$ の分散は固有値 $\lambda_1$、$z_1$ と標準化変数 $x_j$ の共分散は $\lambda_1a_j$。相関はこれを $\sqrt{\lambda_1}\times1$ で割る。

          **途中式**
          $$\mathrm{Corr}(z_1,x_j)=\frac{\lambda_1a_j}{\sqrt{\lambda_1}}=\sqrt{\lambda_1}\,a_j=\sqrt{2.35}\times0.52\approx«sq»\times0.52\approx«L_ok»$$

          **答え** «L_ok»

          **間違えやすい点** 固有ベクトルの成分（0.52）そのものは負荷量ではない。負荷量の2乗 «L_sq» は「信頼」の分散のうち第1主成分で説明される割合で、全主成分について足すと 1 になる。$\lambda_1a_j=«L_lam»$ は共分散で、相関は 1 を超えない。
      - id: s02p11b
        chapter: 25
        terms: [precision-matrix, undirected-graphical-model, partial-correlation-coefficient]
        topic: 3項目の精度行列（分散共分散行列の逆行列）の成分から偏相関係数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          「高級感」「信頼」「価格満足」の 3 項目（この順）を標準化し、分散共分散行列（相関行列）の逆行列（精度行列）を求めたところ
          $$\Omega=\begin{pmatrix}1.6&-0.6&0.4\\-0.6&2.0&-0.9\\0.4&-0.9&1.5\end{pmatrix}$$
          だった。「信頼」を与えたもとでの「高級感」と「価格満足」の偏相関係数を求めよ。
        answer: «pc»
        tolerance: 0.001
        answer_format: 小数第3位まで（四捨五入）で答えよ（負の値なら符号もつける）。±0.001 の差まで正解とする。
        explanation: |
          **方針** 精度行列 $\Omega=(\omega_{ij})$ から、残りの変数すべてを与えたもとでの偏相関は $\rho_{ij\cdot\text{rest}}=-\dfrac{\omega_{ij}}{\sqrt{\omega_{ii}\omega_{jj}}}$。3 変数なので「残り」は「信頼」だけ。

          **途中式**
          $$\rho_{13\cdot2}=-\frac{0.4}{\sqrt{1.6\times1.5}}=-\frac{0.4}{\sqrt{2.4}}\approx-\frac{0.4}{«sq13»}\approx«pc_s»$$

          **答え** «pc_s»

          **間違えやすい点** マイナスの符号を忘れやすい（精度行列の非対角成分が正なら偏相関は負）。精度行列の成分が 0 なら、その2変数は残りを与えたもとで条件付き独立（正規分布のとき）で、無向グラフィカルモデルでは辺を引かない。
