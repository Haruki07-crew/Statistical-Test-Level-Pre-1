        topic: ロイヤル会員を交絡因子としたバックドア調整でクーポンの平均因果効果を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          クーポンはロイヤル会員の 80%、一般会員の 20% に配られており、ロイヤル会員に偏っていた。ロイヤル会員かどうか $L$ がクーポン配布と購入の両方に影響し、$L$ 以外に交絡はないとする。
          また、上のモデルが真の購入確率を正しく表すとし、会員全体に占めるロイヤル会員の割合は 30% とする。
          バックドア調整で、クーポン配布の平均因果効果 $P(Y=1\mid do(C=1))-P(Y=1\mid do(C=0))$ を求め、パーセントポイントで答えよ（例: 0.123 なら 12.3）。
        answer: «ace»
        tolerance: 0.1
        answer_format: パーセントポイント単位で小数第1位まで（四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** $L$ はバックドア基準を満たすので、$P(Y=1\mid do(C=c))=\sum_{l}P(Y=1\mid C=c,L=l)P(L=l)$。$L$ の層ごとの確率の差を、会員全体での $L$ の分布で重みづけて平均する。

          **途中式** (a) で求めた4つの予測確率を使うと
          $$0.3\times(«p11»-«p10»)+0.7\times(«p01»-«p00»)=0.3\times«d1»+0.7\times«d0»\approx«t1»+«t0»=«ace_frac»$$
          パーセントポイントで約 «ace»。

          **答え** «ace»

          **間違えやすい点** 重みには「クーポンを受け取った人の中のロイヤル会員の割合」ではなく、会員全体での $L$ の分布を使う。配布した人としなかった人の購入率を単純に比べると約 «naive» ポイントになり、ロイヤル会員に偏って配った分だけ効果を過大評価する。係数 0.6 はロジット（対数オッズ）の差で、確率の差ではない。
