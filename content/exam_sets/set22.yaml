set: 22
title: 模擬試験 第22回
minutes: 90
problems:
  - id: s22p01
    title: 入荷検品と破損率の調査
    context: |
      ある物流倉庫に、同じ型の段ボール箱 «N» 箱が入荷した。このうち «D» 箱は輸送中に中身が破損しているが、外から見ても区別できない。
    items:
      - id: s22p01a
        chapter: 1
        terms: [conditional-probability, independence-of-events]
        topic: 非復元で1箱ずつ開封するとき3箱目で初めて破損箱に当たる確率を乗法定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          検品担当者が «N» 箱を無作為な順に 1 箱ずつ開けていく（開けた箱は戻さない）。**3 箱目で初めて**破損箱が見つかる確率を求めよ。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「1 箱目が無傷」「2 箱目が無傷」「3 箱目が破損」が順に起こる確率を、乗法定理 $P(A\cap B\cap C)=P(A)P(B\mid A)P(C\mid A\cap B)$ で掛け合わせる。開けた箱は戻さないので、条件付き確率の分母と分子が 1 ずつ減る。

          **途中式** 無傷の箱は $«N»-«D»=«G»$ 箱。
          $$P=\frac{«G»}{«N»}\times\frac{«G1»}{«N1»}\times\frac{«D»}{«N2»}=\frac{«num»}{«den»}=«pa5»\cdots$$

          **答え** $«pa_s»$

          **間違えやすい点** 開けた箱を戻す（復元抽出）とみなして $(«G»/«N»)^2\times«D»/«N»=«with_rep»$ としないこと。各回の確率は前の結果に依存するので、独立な試行の積ではない。
          また「3 箱目までに少なくとも 1 箱見つかる確率」$1-\frac{«G»}{«N»}\cdot\frac{«G1»}{«N1»}\cdot\frac{«G»-2}{«N2»}=«atleast»$ と取り違えないこと。

      - id: s22p01b
        chapter: 9
        terms: [required-sample-size, ci-proportion, wald-confidence-interval]
        topic: 事前の見込みを使って破損率の95%信頼区間の半幅を3ポイント以内にする箱数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          この業者の輸送全体での破損率 $p$ を推定したい。今回の入荷から見込み値を $p_0=«D»/«N»=«p0»$ とし、
          多数の箱を無作為に調べて、正規近似による $p$ の 95% 信頼区間 $\hat p\pm 1.96\sqrt{\hat p(1-\hat p)/n}$ の**半幅**が «e» 以下になるようにしたい。
          $\hat p$ が見込み値どおり $p_0$ になるとしたとき、必要な最小の箱数 $n$ を求めよ。標準正規分布の上側 2.5% 点は «z» とする。
        answer: «nreq»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 半幅 $1.96\sqrt{p_0(1-p_0)/n}\le e$ を $n$ について解き、整数に切り上げる。

          **途中式**
          $$n\ge\frac{1.96^2\,p_0(1-p_0)}{e^2}=\frac{«z2»\times«p0»\times«q0»}{«e2»}=\frac{«z2»\times«pq»}{«e2»}=«nraw»\cdots$$

          **答え** 切り上げて $n=«nreq»$ 箱

          **間違えやすい点** 見込み値がないときの安全側の値 $p_0=0.5$ を使うと $«n_halfraw»$ を切り上げて «n_half» 箱となり、見込み値を使う場合より多くなる。
          半幅ではなく区間の幅（$2e$）を «e» としてしまうと «n_width» 箱、両側 95% の点 «z» の代わりに 1.645 を使うと «n_645» 箱になる。«nraw» を切り捨てて «nlow» にすると半幅が «e» をわずかに超える。

  - id: s22p02
    title: 商品の日々の需要と欠品
    context: |
      ある EC 倉庫で扱う商品について、1 日の注文数（需要）は日ごとに独立に、平均 $\lambda$ のポアソン分布に従うとする。
    items:
      - id: s22p02a
        chapter: 5
        terms: [poisson-distribution, sum-of-random-variables]
        topic: ポアソン分布の再生性でリードタイム中の需要が手持ち在庫を超える欠品確率を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          $\lambda=«lam»$ とする。在庫が «stock» 個になった時点で発注すると、入荷までに «L» 日かかる（リードタイム）。
          この «L» 日間の需要の合計が «stock» 個を**超える**と欠品が起こる。欠品が起こる確率を求めよ。必要なら $e^{-«mu»}=«em3»$ を使え。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 独立なポアソン分布の和はポアソン分布（再生性）なので、«L» 日間の需要 $S$ は平均 $«L»\lambda=«mu»$ のポアソン分布に従う。欠品は $S\ge «stock1»$、余事象 $S\le«stock»$ の確率を足し上げる。

          **途中式** $P(S=k)=e^{-«mu»}«mu»^k/k!$ の $e^{-«mu»}$ を除いた部分を $k=0,\ldots,«stock»$ で並べると
          $$«t0»+«t1»+«t2»+«t3»+«t4»+«t5»=«tsum»$$
          $$P(S\le«stock»)=«em3»\times«tsum»=«cdf»,\qquad P(S\ge«stock1»)=1-«cdf»=«pa5»$$

          **答え** $«pa_s»$

          **間違えやすい点** 「超える」なので «stock» 個ちょうどは欠品ではない。$P(S\ge«stock»)$ とすると $«p_ge5»$ になる。
          また 1 日分の平均 «lam» のまま計算しないこと。«L» 日分の需要の平均は $«L»\times«lam»=«mu»$。

      - id: s22p02b
        chapter: 8
        terms: [rao-blackwell-theorem, unbiased-estimator, sufficient-statistic, complete-statistic]
        topic: ポアソン需要で注文ゼロの日の確率をラオ・ブラックウェル化した不偏推定量で推定する
        level: 応用
        definition: false
        type: choice
        question: |
          $\lambda$ が未知のとき、「注文が 1 件もない日」の確率 $\theta=P(X=0)=e^{-\lambda}$ を推定したい。
          «n» 日間の注文数 $X_1,\ldots,X_{«n»}$ を記録したところ、合計は $T=\sum X_i=«T»$ 件で、注文ゼロの日は «zero_days» 日だった。
          不偏推定量 $I(X_1=0)$（1 日目の注文が 0 なら 1、そうでなければ 0）を十分統計量 $T$ で条件付けて得られる推定量 $E[I(X_1=0)\mid T]$ の値に最も近いものはどれか。
          必要なら $e^{-«lh»}=«em12»$ を使え。
        choices:
          - "$«prop0»$"
          - "$«umvu»$"
          - "$«mle»$"
          - "$«w_T1»$"
          - "$«w_rev»$"
        answer: 1
        distractors:
          - 注文ゼロの日の割合（不偏だが T だけの関数ではなく分散が大きい）を答えた
          - 正解
          - 最尤推定量 exp(-T/n)（不変性）を答えた。不偏ではない
          - 指数を T ではなく T-1 にした
          - 条件付き分布の母数を取り違え (1-1/T)^n とした
        explanation: |
          **方針** $T=t$ が与えられたとき、$(X_1,\ldots,X_n)$ の条件付き分布は試行回数 $t$、確率 $(1/n,\ldots,1/n)$ の多項分布になる（ポアソン分布の和で条件付けた性質）。
          よって $X_1\mid T=t$ は二項分布 $B(t,1/n)$ に従い、$P(X_1=0\mid T=t)=(1-1/n)^t$。ラオ・ブラックウェルの定理によりこれは不偏で、$T$ は完備十分統計量なので一様最小分散不偏推定量になる。

          **途中式**
          $$E[I(X_1=0)\mid T=«T»]=\left(1-\frac{1}{«n»}\right)^{«T»}=«ratio»^{«T»}=«umvu4»\cdots$$

          **答え** $«umvu»$

          **間違えやすい点** 最尤推定量 $e^{-\bar X}=e^{-«lh»}=«em12»$ は不変性から得られるが、不偏ではない。注文ゼロの日の割合 $«zero_days»/«n»=«prop0»$ は不偏だが、$T$ に含まれる情報を使い切っていないため分散が大きい。
          二項分布 $B(t,1/n)$ の「失敗」が $t$ 回続く確率なので、指数は $T$ そのもの（$T-1$ ではない）。

      - id: s22p02c
        chapter: 32
        terms: [metropolis-hastings, mcmc]
        topic: ポアソン分布を目標とする±1提案のメトロポリス法で現在の状態から移動する確率
        level: 標準
        definition: false
        type: choice
        question: |
          推定値 $\hat\lambda=«lh»$ のポアソン分布 $\pi(x)\propto «lh»^x/x!$（$x=0,1,2,\ldots$）から、メトロポリス法で需要のシナリオを発生させる。
          現在の状態が $x$ のとき、確率 1/2 ずつで $x+1$ か $x-1$ を提案し（$x-1<0$ の提案は $\pi=0$ なので必ず棄却）、
          受理確率 $\min\{1,\ \pi(\text{提案})/\pi(x)\}$ で受理して移動し、棄却されたら $x$ にとどまる。
          現在 $x=«x»$ のとき、次の 1 ステップで状態が変わる確率に最も近いものはどれか。
        choices:
          - "$«onlyup»$"
          - "$«stay»$"
          - "$«move»$"
          - "$«inv»$"
          - "$«nofact»$"
        answer: 2
        distractors:
          - 上向きの提案の受理確率だけを答え、提案確率 1/2 も下向きの移動も考えなかった
          - 移動しない（とどまる）確率を答えた
          - 正解
          - 受理確率の比を逆（π(x)/π(提案)）にした
          - 目標分布の x! を落とし π(x)∝λ^x として比を計算した
        explanation: |
          **方針** 提案は対称（上下とも確率 1/2）なので、受理確率は目標分布の比だけで決まる。上向き・下向きそれぞれについて「提案の確率 × 受理確率」を足す。

          **途中式** ポアソン分布の比は $\dfrac{\pi(x+1)}{\pi(x)}=\dfrac{\lambda}{x+1}$、$\dfrac{\pi(x-1)}{\pi(x)}=\dfrac{x}{\lambda}$。$x=«x»$ では
          $$\text{上向き}：\min\left\{1,\frac{«lh»}{«xp»}\right\}=«up»,\qquad \text{下向き}：\min\left\{1,\frac{«x»}{«lh»}\right\}=\min\{1,«down_raw»\}=1$$
          $$P(\text{移動})=\frac12\times«up»+\frac12\times1=«move»$$

          **答え** $«move»$

          **間違えやすい点** 受理確率の比は「提案先 ÷ 現在」。逆にすると $«inv»$ になる。$x!$ を落とすと $«nofact»$ になる。
          比が 1 を超えるときは受理確率を 1 で打ち切る（$«down_raw»$ のまま使わない）。とどまる確率 $1-«move»=«stay»$ と取り違えないこと。

  - id: s22p03
    title: 出荷準備とピッキングの作業時間
    context: |
      ある EC 物流センターで、注文を受けてから出荷できるまでの作業時間を分析する。
    items:
      - id: s22p03a
        chapter: 2
        terms: [moment-generating-function, gamma-distribution]
        topic: 2つの処理経路の混合分布の積率母関数を2回微分して出荷準備時間の分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          注文の «w1» の割合は手元の棚の商品で、出荷準備時間（時間）は平均 1 の指数分布に従う。残り «w2» は別倉庫からの取り寄せで、
          形状 «k2»・**尺度** «th2»（平均 «g1c»）のガンマ分布に従う。無作為に選んだ注文の出荷準備時間 $T$ の積率母関数は
          $$M(t)=E\left[e^{tT}\right]=\frac{«w1»}{1-t}+\frac{«w2»}{(1-«th2»t)^{«k2»}}\qquad(t<1/«th2»)$$
          である。$M(t)$ を用いて $V[T]$ を求めよ。最も近い値はどれか。
        choices:
          - "$«Vind»$"
          - "$«Vw»$"
          - "$«V»$"
          - "$«M2mM1»$"
          - "$«E2»$"
        answer: 2
        distractors:
          - T を 0.6X+0.4Y（独立な和）とみなし 0.6²V[X]+0.4²V[Y] とした
          - 各経路の分散の重み付き平均だけを計算し、経路による平均の違いを足し忘れた
          - 正解
          - M''(0) から M'(0) を引いた（確率母関数の公式と混同した）
          - 2次のモーメント E[T²]=M''(0) を分散と取り違えた
        explanation: |
          **方針** $M'(0)=E[T]$、$M''(0)=E[T^2]$ なので、$V[T]=M''(0)-\{M'(0)\}^2$。

          **途中式** 微分すると
          $$M'(t)=\frac{«w1»}{(1-t)^2}+\frac{«w2»\times«k2»\times«th2»}{(1-«th2»t)^{«k2p»}},\qquad M''(t)=\frac{2\times«w1»}{(1-t)^3}+\frac{«w2»\times«k2»\times«k2p»\times«th2»^2}{(1-«th2»t)^{«k2»+2}}$$
          $$M'(0)=«d1»+«d2»=«E1»,\qquad M''(0)=«dd1»+«dd2»=«E2»$$
          $$V[T]=«E2»-«E1»^2=«E2»-«E1sq»=«V»$$

          **答え** $«V»$

          **間違えやすい点** 混合分布の積率母関数は各成分の積率母関数の**重み付き和**であり、独立な確率変数の和（積率母関数の積）ではない。$0.6^2V[X]+0.4^2V[Y]$ とすると $«Vind»$ になる。
          各経路の分散の重み付き平均 $«w1»\times1+«w2»\times«vg»=«Vw»$ だけでは、経路によって平均が違うことによるばらつきが抜ける（全分散の公式の $V[E[T\mid\text{経路}]]$ の項）。
          $M''(0)-M'(0)$ は確率母関数で階乗モーメントを扱うときの形で、ここでは使わない。

      - id: s22p03b
        chapter: 4
        terms: [sum-of-random-variables, uniform-distribution, change-of-variables]
        topic: 一様分布に従うピッキングと梱包の時間の和（台形分布）が基準時間を超える確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 件の注文のピッキング時間 $X$（分）は区間 $[«a1»,«b1»]$ の一様分布、梱包時間 $Y$（分）は区間 $[«a2»,«b2»]$ の一様分布に従い、$X$ と $Y$ は独立とする。
          合計時間 $S=X+Y$ が «c» 分を超える確率 $P(S>«c»)$ に最も近いものはどれか。
        choices:
          - "$«pb_400»$"
          - "$«pb»$"
          - "$«pb_uni»$"
          - "$«pb_noh»$"
          - "$«pb_comp»$"
        answer: 1
        distractors:
          - 同時密度を 1/400（区間の長さを両方 20 とした）として面積を割った
          - 正解
          - 和も区間 [15,45] の一様分布になると思い込んだ
          - 三角形の面積の 1/2 を掛け忘れた
          - P(S≦38) の側（余事象）を答えた
        explanation: |
          **方針** $(X,Y)$ は長方形 $[«a1»,«b1»]\times[«a2»,«b2»]$ 上の一様分布で、同時密度は $1/\{(«b1»-«a1»)(«b2»-«a2»)\}=1/«tot»$。
          $\{x+y>«c»\}$ にあたる部分の面積を求めて «tot» で割る。和 $S$ の密度は畳み込みで台形になり、上端 $«smax»$ の近くでは直線的に 0 に下がる。

          **途中式** $x+y>«c»$ となるのは長方形の右上の角の部分で、$x$ は $«xlo»$ から $«b1»$、$y$ は $«ylo»$ から $«b2»$ の範囲にある直角二等辺三角形（2 辺の長さ $«smax»-«c»=«leg»$）。
          $$P(S>«c»)=\frac{\frac12\times«leg»\times«leg»}{«tot»}=\frac{«area»}{«tot»}=«pb»$$
          畳み込みで書くと、$«b1»+«a2»\le s\le«smax»$ で $f_S(s)=(«smax»-s)/«tot»$ なので $\int_{«c»}^{«smax»}\frac{«smax»-s}{«tot»}ds=\frac{«leg»^2}{2\times«tot»}$ と同じになる。

          **答え** $«pb»$

          **間違えやすい点** 一様分布の和は一様分布ではない（区間 $[«smin»,«smax»]$ の一様分布とみなすと $«pb_uni»$）。三角形の面積の $\frac12$ を忘れると $«pb_noh»$ になる。

      - id: s22p03c
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 4つのピッキング方式の平均作業時間をテューキーの方法で多重比較し有意な対を決める
        level: 標準
        definition: false
        type: choice
        question: |
          4 つのピッキング方式 A, B, C, D を比べるため、作業者 «N» 人を各方式に «nn» 人ずつ無作為に割り付け、1 注文あたりの作業時間（分）を測った。
          各方式の平均は A «mA»、B «mB»、C «mC»、D «mD» で、一元配置分散分析の誤差の平均平方は $«mse»$（自由度 «dfe»）だった。
          テューキーの方法で、全体の有意水準 5% のもとで平均に差があると判定される組をすべて選んだものはどれか。
          スチューデント化された範囲の上側 5% 点は $q_{0.05}(4,«dfe»)=«q»$、$t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t»$ である。
        choices:
          - "なし"
          - "A と D のみ"
          - "A と C、A と D"
          - "A と B、A と C、A と D"
          - "A と B、A と C、A と D、B と D"
        answer: 2
        distractors:
          - 標準誤差を付けずに q×√MSE を基準にした
          - 基準を q×√(2MSE/n) とし、√2 で割るのを忘れた
          - 正解
          - 多重性を調整しない t による最小有意差（LSD）を使った
          - t×√(MSE/n) を基準にし、差の標準誤差に 2 を入れ忘れた（しかも多重性を調整していない）
        explanation: |
          **方針** 各群の大きさが等しいテューキーの方法では、2 群の平均の差の絶対値が $q_{0.05}(k,\nu)\sqrt{\mathrm{MSE}/n}$ を超える組を有意とする（$k=4$ 群、$\nu=«dfe»$）。

          **途中式**
          $$q\sqrt{\frac{\mathrm{MSE}}{n}}=«q»\times\sqrt{\frac{«mse»}{«nn»}}=«q»\times\sqrt{«msen»}=«q»\times«se1»=«hsd»$$
          平均の差は A−B $«dAB»$、A−C $«dAC»$、A−D $«dAD»$、B−C $«dBC»$、B−D $«dBD»$、C−D $«dCD»$。«hsd» を超えるのは A−C と A−D。

          **答え** A と C、A と D

          **間違えやすい点** $q$ 分布の点は「範囲」の分布なので、差の標準誤差 $\sqrt{2\mathrm{MSE}/n}$ と組み合わせるときは $q/\sqrt2$ を使う。$q\sqrt{2\mathrm{MSE}/n}=«hsd2»$ とすると A−D だけになる。
          $t$ による最小有意差 $«t»\times\sqrt{2\times«mse»/«nn»}=«lsd»$ は 1 組ごとの有意水準を 5% にする方法で、6 組を同時に比べると誤って差ありとする確率が 5% を超える（A−B まで有意になってしまう）。

  - id: s22p04
    title: コールセンターの着信と通話
    context: |
      ある EC 事業者のコールセンターでは、問い合わせの電話がポアソン過程に従ってかかってくる。1 件の通話時間は互いに独立に、平均 «mean» 分の指数分布に従う。
    items:
      - id: s22p04a
        chapter: 6
        terms: [gamma-distribution, exponential-distribution, poisson-distribution]
        topic: 指数分布の通話4件の合計時間（ガンマ分布）が30分以内に終わる確率をポアソン分布との関係で求める
        level: 標準
        definition: false
        type: choice
        question: |
          あるオペレーターが、待っている «k» 件の通話を続けて処理する（通話の間の空き時間はないとする）。«k» 件すべてを «tt» 分以内に終える確率に最も近いものはどれか。
          必要なら $e^{-«m»}=«em5»$ を使え。
        choices:
          - "$«p_comp»$"
          - "$«p_off»$"
          - "$«p_norm»$"
          - "$«p_exp»$"
          - "$«pa»$"
        answer: 4
        distractors:
          - 余事象 P(N≦3) を答えた
          - 「4件目の終了が30分以内」を N≧5 と1つずらした
          - 平均24分・標準偏差12分の正規分布で近似した
          - 合計時間を平均24分の指数分布とみなした
          - 正解
        explanation: |
          **方針** 合計時間 $S$ は形状 «k»・尺度 «mean» のガンマ分布（アーラン分布）に従う。通話の終了をレート $1/«mean»$ のポアソン過程の点とみると、
          「«k» 件目の終了が «tt» 分以内」は「«tt» 分間の終了回数 $N$ が «k» 以上」と同じ。$N$ は平均 $«tt»/«mean»=«m»$ のポアソン分布に従う。

          **途中式**
          $$P(S\le«tt»)=P(N\ge«k»)=1-e^{-«m»}\left(1+«m»+\frac{«m»^2}{2}+\frac{«m»^3}{6}\right)=1-«em5»\times(«q0»+«q1»+«q2»+«q3»)$$
          $$=1-«em5»\times«s3»=1-«cdf»=«pa4»\cdots$$

          **答え** $«pa»$

          **間違えやすい点** $N\ge«k»$ の余事象は $N\le«km1»$（«k» を含めない）。$N\ge«k»+1$ とすると $«p_off»$ になる。
          4 件の和は指数分布ではない（平均 «emean» 分の指数分布とみなすと $«p_exp»$）。正規近似（平均 «emean»、標準偏差 «esd»）は件数が少なく右に歪んだ分布なので粗い（$«p_norm»$）。

      - id: s22p04b
        chapter: 15
        terms: [mmc-queue, birth-death-process, traffic-intensity]
        topic: オペレーター2人のコールセンター（M/M/2）で出生死滅過程の定常分布から電話が待たされる確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          電話は 1 時間あたり平均 «lam» 件の到着率でかかってきて、オペレーター «c» 人が対応する（M/M/2 待ち行列。2 人とも通話中なら到着した電話は待ち、待ちの上限はない）。
          系内の電話の数（通話中＋待ち）の定常分布を考える。到着した電話がすぐにはつながらず**待たされる**確率を求めよ。
        answer: «pw»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 系内の数 $n$ は出生死滅過程で、出生率は常に $\lambda=«lam»$、死亡率は $n=1$ のとき $\mu$、$n\ge2$ のとき $2\mu$（$\mu=60/«mean»=«mu»$ 件/時）。
          詳細つり合い $\lambda\pi_{n-1}=\mu_n\pi_n$ から $\pi_n$ を $\pi_0$ で表し、和を 1 にする。ポアソン到着なので、到着した電話が見る状態の分布は定常分布と同じ（PASTA）。待たされるのは $n\ge2$ のとき。

          **途中式** $a=\lambda/\mu=«a»$、$\rho=\lambda/(2\mu)=«rho»$ とおくと
          $$\pi_1=a\pi_0,\qquad \pi_n=\frac{a^2}{2}\rho^{\,n-2}\pi_0\ (n\ge2)$$
          $$\sum_{n\ge2}\pi_n=\frac{a^2/2}{1-\rho}\pi_0=\frac{«a2h»}{1-«rho»}\pi_0=«tail»\pi_0$$
          $$\pi_0=\frac{1}{1+«a»+«tail»}=\frac{1}{«den»}=«pi0»,\qquad P(\text{待つ})=«tail»\times\pi_0=«pw4»\cdots$$

          **答え** $«pw_s»$

          **間違えやすい点** M/M/1 の「待つ確率 $=\rho$」をそのまま使うと $«pw_mm1»$ になる。2 人のときは $n=1$ で 1 人が空いているので、$n\ge1$ ではなく $n\ge2$ で待つ。
          また $n\ge2$ では 2 人とも働くので死亡率は $2\mu$ になる（$\mu$ のままだと $\rho=\lambda/\mu>1$ になり定常分布が存在しない）。

      - id: s22p04c
        chapter: 7
        terms: [delta-method, poisson-distribution]
        topic: ポアソン件数の平方根変換の分散をデルタ法で近似し平均によらないことを見る
        level: 基本
        definition: false
        type: choice
        question: |
          時間帯によって着信数の平均が違うので、1 時間の着信数 $N$（平均 $\lambda$ のポアソン分布）を $\sqrt{N}$ に変換して分析する。
          $\lambda=«lc»$ のとき、デルタ法（1 次のテイラー近似）による $V[\sqrt N]$ の近似値はどれか。
        choices:
          - "$«dv_nolam»$"
          - "$«dv_nosq»$"
          - "$«dv»$"
          - "$«dv_sd»$"
          - "$«dv_raw»$"
        answer: 2
        distractors:
          - 微分係数の2乗だけを答え、元の分散 λ を掛け忘れた
          - 微分係数を2乗しなかった（g'(λ) をそのまま答えた）
          - 正解
          - 変換前の標準偏差 √λ を答えた
          - 変換前の分散 λ を答えた
        explanation: |
          **方針** デルタ法：$g$ が微分可能なら $V[g(N)]\approx\{g'(E[N])\}^2V[N]$。$g(x)=\sqrt x$、$E[N]=V[N]=\lambda$。

          **途中式** $g'(x)=\dfrac{1}{2\sqrt x}$ より
          $$V[\sqrt N]\approx\left(\frac{1}{2\sqrt{\lambda}}\right)^2\lambda=\frac{1}{4\lambda}\times\lambda=\frac14$$
          $\lambda=«lc»$ でも $\frac{1}{4\times«lc»}\times«lc»=«dv»$。

          **答え** $«dv»$（$\lambda$ によらない。これが平方根変換を分散安定化変換と呼ぶ理由）

          **間違えやすい点** 微分係数は 2 乗して元の分散 $\lambda$ を掛ける。$g'(\lambda)=«gp»$ をそのまま答えたり、$\{g'(\lambda)\}^2=«gp2»$ で止めたりしない。

  - id: s22p05
    title: 配送センターの品質モニタリング
    context: |
      ある物流会社は、配送センターごとの誤配送や欠品を毎月監視している。
    items:
      - id: s22p05a
        chapter: 10
        terms: [holm-method, multiple-testing, bonferroni-correction]
        topic: ホルム法で5つの配送センターの誤配送率の検定p値を逐次判定し有意となる拠点の数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          5 つの配送センター A〜E について、誤配送率が全社の基準値より高いかをそれぞれ検定し、次の $p$ 値を得た。

          | センター | A | B | C | D | E |
          |---|---|---|---|---|---|
          | $p$ 値 | «pA» | «pB» | «pC» | «pD» | «pE» |

          ホルムの方法で、5 つの検定全体で誤って 1 つ以上棄却する確率（ファミリーワイズエラー率）を 5% 以下に抑えるとき、帰無仮説が棄却されるセンターの数はどれか。
        choices:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
        answer: 2
        distractors:
          - p 値の大きいほうから順に α/1 と比べ、最初で止めた
          - ボンフェローニ法（すべて 0.05/5 と比較）を使った
          - 正解
          - 一度棄却されなかったところで止めずに、残りの検定も続けて判定した
          - 多重性を調整せず、それぞれ 5% で判定した
        explanation: |
          **方針** ホルム法は $p$ 値を小さい順に並べ、$i$ 番目を $\alpha/(m-i+1)$ と比べる。条件を満たさなかったところで止め、それより前のものだけを棄却する。

          **途中式** 小さい順に C «pC»、A «pA»、E «pE»、D «pD»、B «pB»（$m=«m»$）。
          - 1 番目 C：$«pC»\le0.05/5=«a1»$ → 棄却
          - 2 番目 A：$«pA»\le0.05/4=«a2»$ → 棄却
          - 3 番目 E：$«pE»>0.05/3=«a3»$ → 棄却せず、ここで止める（D、B も棄却しない）

          **答え** «holm» センター（C と A）

          **間違えやすい点** ボンフェローニ法ではすべてを $0.05/5=«a1»$ と比べ «bonf» センターだけになる（ホルム法はこれより常に検出力が高い）。
          3 番目で止めずに D（$«pD»\le0.05/2=«a4»$）まで棄却すると «nonstop» センターとなり、ファミリーワイズエラー率の保証が崩れる。調整なしなら «raw» センター。

      - id: s22p05b
        chapter: 13
        terms: [runs-test, nonparametric-methods-overview]
        topic: 欠品の有無が続いた日の並びに連の検定を正規近似で行い統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          あるセンターで «NN» 日間、欠品があった日を S、なかった日を N として並べると次のようになった。

          «seq»

          欠品の起こり方が日の並びについてランダム（S と N の並びがすべて同様に確からしい）という帰無仮説のもとで、連（同じ記号が続くひとまとまり）の総数 $R$ を使った連の検定を行う。
          $R$ を正規近似で標準化した統計量 $z=(R-E[R])/\sqrt{V[R]}$（連続修正なし）の値に最も近いものはどれか。
        choices:
          - "$«z_s»$"
          - "$«z_n»$"
          - "$«z»$"
          - "$«z_e»$"
          - "$«z_v»$"
        answer: 2
        distractors:
          - S の連の数（3）だけを R とした
          - V[R] の分母 N²(N−1) を N³ にした
          - 正解
          - E[R] の +1 を忘れた
          - 標準偏差ではなく分散で割った
        explanation: |
          **方針** S の個数 $n_1$、N の個数 $n_2$（$N=n_1+n_2$）を固定したとき、連の総数 $R$ の平均と分散は
          $$E[R]=1+\frac{2n_1n_2}{N},\qquad V[R]=\frac{2n_1n_2(2n_1n_2-N)}{N^2(N-1)}$$

          **途中式** $n_1=«n1»$、$n_2=«n2»$、$N=«NN»$。連は NNNN / SSS / NNNNN / SSSS / NNN / S の $R=«R»$ 個。
          $$E[R]=1+\frac{«n12»}{«NN»}=«ER»,\qquad V[R]=\frac{«n12»\times(«n12»-«NN»)}{«NN»^2\times(«NN»-1)}=\frac{«VRnum»}{«VRden»}=«VR»$$
          $$z=\frac{«R»-«ER»}{\sqrt{«VR»}}=\frac{«diffR»}{«sdR»}=«z»$$

          **答え** $«z»$（連が少なすぎる。欠品の日がかたまって起こる傾向がある）

          **間違えやすい点** 連は S と N の両方を数える（S の連だけだと «runsS» 個）。$E[R]$ の $1+$ を忘れると $«z_e»$、分散で割ると $«z_v»$ になる。

  - id: s22p06
    title: 配送ルート改善後の時間と燃料
    context: |
      ある配送会社が配送ルートを見直したあと、無作為に選んだ «n» 本のルートで 1 便あたりの配送時間 $X_1$（分）と燃料消費量 $X_2$（L）を測った。
      標本平均は $(\bar x_1,\bar x_2)=(«x1»,«x2»)$、不偏分散共分散行列は
      $$S=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
      だった。$(X_1,X_2)$ は 2 変量正規分布に従うとする。
    items:
      - id: s22p06a
        chapter: 11
        terms: [hotelling-t2, multivariate-normal-distribution, f-distribution]
        topic: 配送時間と燃料消費の2変量の平均が目標値と異なるかをホテリングのT²検定で調べる
        level: 応用
        definition: false
        type: choice
        question: |
          母平均ベクトルが目標値 $\mu_0=(«m1»,«m2»)$ に等しいかを、ホテリングの $T^2=n(\bar x-\mu_0)^\top S^{-1}(\bar x-\mu_0)$ を $F$ 分布に変換して有意水準 5% で検定する。
          正しいものはどれか。$F_{0.05}(2,10)=«Fc»$ とする。
        choices:
          - "$F=«Fn»$ で、$«Fc»$ を超えないので棄却しない"
          - "$F=«F»$ で、$«Fc»$ を超えないので棄却しない"
          - "$F=«Fdiag»$ で、$«Fc»$ を超えるので棄却する"
          - "$T^2=«T2»$ を $«Fc»$ と比べ、超えるので棄却する"
          - "$F=«Fnon»$ で、$«Fc»$ を超えないので棄却しない"
        answer: 1
        distractors:
          - 変換の係数の分母を p(n-1) ではなく p·n にした
          - 正解
          - 共分散を無視し、対角成分だけで逆行列を作った
          - T² を F に変換せずにそのまま F 分布の点と比べた
          - T² の n を掛け忘れた
        explanation: |
          **方針** $T^2$ を求め、$\dfrac{n-p}{p(n-1)}T^2$ が帰無仮説のもとで自由度 $(p,\,n-p)$ の $F$ 分布に従うことを使う（$p=2$）。

          **途中式** $d=\bar x-\mu_0=(«d1»,«d2»)$。$\det S=«s11»\times«s22»-«s12»^2=«det»$、
          $$S^{-1}=\frac{1}{«det»}\begin{pmatrix}«s22»&-«s12»\\-«s12»&«s11»\end{pmatrix}$$
          $$d^\top S^{-1}d=\frac{«s22»\times«d1»^2-2\times«s12»\times«d1»\times«d2»+«s11»\times«d2»^2}{«det»}=\frac{«qnum»}{«det»}=«q»$$
          $$T^2=«n»\times«q»=«T2»,\qquad F=\frac{«n»-2}{2\times(«n»-1)}T^2=\frac{«np»}{«pn1»}\times«T2»=«F»$$
          自由度 $(2,«np»)$ の上側 5% 点 «Fc» を超えないので、帰無仮説は棄却しない。

          **答え** $F=«F»$、棄却しない

          **間違えやすい点** 2 つの変数の正の共分散を無視すると $F=«Fdiag»$ となり、結論が逆になる。配送時間と燃料はともに上振れしやすいので、両方が少し高いことは「同じ情報の重複」として割り引かれる。
          $T^2$ は $F$ 分布に従わないので、係数を掛けずに $F$ 分布の点と比べてはいけない。

  - id: s22p07
    title: 配送センターの残業時間の回帰分析
    context: |
      «n» か所の配送センターについて、1 日あたりの残業時間 $Y$（時間）を回帰分析する。
      モデル 1 は説明変数に出荷件数と作業人員の 2 つを使い（切片を含めて係数 «k1» 個）、残差平方和は «rss1» だった。
      モデル 2 はさらにセンターの地域（4 地域）を表すダミー変数 3 個を加えたもの（係数 «k2» 個）で、残差平方和は «rss2» だった。誤差は独立に同じ分散の正規分布に従うとする。
    items:
      - id: s22p07a
        chapter: 16
        terms: [partial-f-test, dummy-variable, multiple-regression-model]
        topic: 地域ダミー3個をまとめて加える意味があるかを残差平方和の差から部分F検定で調べる
        level: 標準
        definition: false
        type: numeric
        question: |
          「地域ダミー 3 個の係数がすべて 0」という帰無仮説を検定する $F$ 統計量の値を求めよ。
        answer: «F»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 入れ子のモデルの比較では、残差平方和の減り方を加えた係数の数で割り、大きいモデルの誤差分散の推定値で割る：
          $$F=\frac{(S_1-S_2)/q}{S_2/(n-k_2)}$$
          帰無仮説のもとで自由度 $(q,\,n-k_2)$ の $F$ 分布に従う。

          **途中式** $q=«k2»-«k1»=«q»$、$n-k_2=«n»-«k2»=«dfe»$。
          $$F=\frac{(«rss1»-«rss2»)/«q»}{«rss2»/«dfe»}=\frac{«msq»}{«mse»}=«F4»\cdots$$

          **答え** $«F_s»$（$F_{0.05}(3,«dfe»)=«Fc»$ を下回るので、5% では地域の効果があるとはいえない）

          **間違えやすい点** 誤差の自由度は大きいほうのモデルの $n-k_2=«dfe»$（切片も数える。«dfe»+1 とすると $«F35»$）。分子を $q$ で割り忘れると $«Fnoq»$。
          分母に小さいモデルの残差平方和を使う（$«rss1»/«dfe1»$）と $«F1»$ になる。

      - id: s22p07b
        chapter: 17
        terms: [studentized-residual, standardized-residual, leverage, outlier-and-influential-point]
        topic: 生の残差とてこ比から1点を除いた誤差分散を求め外部スチューデント化残差を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          モデル 2 で、あるセンターの残差は $e_i=«e»$、てこ比は $h_{ii}=«h»$ だった。このセンターの**外部スチューデント化残差**
          （そのセンターを除いて推定した誤差分散 $s_{(i)}^2$ を使い、$t_i=e_i/\{s_{(i)}\sqrt{1-h_{ii}}\}$ としたもの）に最も近い値はどれか。
          必要なら、1 点を除いたときの残差平方和は $S_2-e_i^2/(1-h_{ii})$ になることを使え。
        choices:
          - "$«e_s»$"
          - "$«e_si»$"
          - "$«rint»$"
          - "$«t»$"
          - "$«e_s1h»$"
        answer: 3
        distractors:
          - 残差を全体の s で割っただけで、てこ比を考えなかった
          - s_(i) で割ったが √(1−h) を掛け忘れた
          - 内部スチューデント化残差（標準化残差、全体の s を使う）を答えた
          - 正解
          - √(1−h) ではなく (1−h) を掛けた
        explanation: |
          **方針** 1 点を除いた残差平方和を自由度 $n-k_2-1$ で割って $s_{(i)}^2$ を作り、$\sqrt{1-h_{ii}}$ と合わせて残差を割る。

          **途中式** $\dfrac{e_i^2}{1-h_{ii}}=\dfrac{«e»^2}{«omh»}=«e2h»$ より
          $$s_{(i)}^2=\frac{«rss2»-«e2h»}{«dfe»-1}=\frac{«s2inum»}{«dfe_1»}=«s2i»,\qquad s_{(i)}=«sdi»$$
          $$t_i=\frac{«e»}{«sdi»\times\sqrt{«omh»}}=\frac{«e»}{«sdi»\times«sqh»}=\frac{«e»}{«den_t»}=«t4»\cdots$$

          **答え** $«t»$

          **間違えやすい点** 全体の $s^2=«rss2»/«dfe»=«s2»$（$s=«sd»$）を使うと内部スチューデント化残差 $«e»/(«sd»\times«sqh»)=«rint»$ になる。外れ値の候補は自分自身が $s$ を大きくしているので、除いて推定すると値が大きくなる。
          てこ比を無視した $e_i/s=«e_s»$ は、てこ比が大きい点の残差が小さくなりやすいことを考えていない。

  - id: s22p08
    title: 配送遅延と顧客満足度
    context: |
      ある通販サイトでは、配達後のアンケートで満足度を「1：不満」「2：普通」「3：満足」の 3 段階で聞いている。
      満足度 $Y$ を配達の遅延日数 $x$ で説明する比例オッズモデル（累積ロジットモデル）
      $$\log\frac{P(Y\le j\mid x)}{1-P(Y\le j\mid x)}=\alpha_j+\beta x\qquad(j=1,2)$$
      を当てはめたところ、$\hat\alpha_1=«a1»$、$\hat\alpha_2=«a2»$、$\hat\beta=«b»$ だった（$\beta>0$ は遅延が長いほど低い満足度に寄ることを表す）。
    items:
      - id: s22p08a
        chapter: 18
        terms: [ordered-logit-model, odds-and-odds-ratio, logit-logistic-transformation]
        topic: 比例オッズモデルで遅延2日の顧客が「普通」と答える確率を累積確率の差から求める
        level: 応用
        definition: false
        type: choice
        question: |
          遅延日数 $x=«x»$ の顧客が「2：普通」と答える確率の推定値に最も近いものはどれか。必要なら $e^{0.4}=«e04»$、$e^{-2.1}=«em21»$ を使え。
        choices:
          - "$«P3s»$"
          - "$«wsign»$"
          - "$«P1s»$"
          - "$«pmid»$"
          - "$«P2s»$"
        answer: 3
        distractors:
          - 「3：満足」の確率 1−P(Y≦2) を答えた
          - 係数の符号を逆（α_j − βx）にして計算した
          - 「1：不満」の確率 P(Y≦1) を答えた
          - 正解
          - 累積確率 P(Y≦2) をそのまま答えた
        explanation: |
          **方針** モデルが与えるのは累積確率 $P(Y\le j)$。$P(Y=2)=P(Y\le2)-P(Y\le1)$ として、それぞれをロジスティック関数 $1/(1+e^{-\eta})$ で求める。

          **途中式** $x=«x»$ では
          $$\eta_1=«a1»+«b»\times«x»=«l1»,\qquad \eta_2=«a2»+«b»\times«x»=«l2»$$
          $$P(Y\le1)=\frac{1}{1+e^{«nl1»}}=\frac{1}{«den1»}=«P1»,\qquad P(Y\le2)=\frac{1}{1+e^{-«l2»}}=\frac{1}{«den2»}=«P2»$$
          $$P(Y=2)=«P2»-«P1»=«pmid4»$$

          **答え** $«pmid»$

          **間違えやすい点** 累積確率 $«P2s»$ や $P(Y\le1)=«P1s»$ を答えないこと。パラメータ化の符号の流儀（$\alpha_j-\beta x$ と書くソフトもある）は問題文の式に従う。逆にすると $«wsign»$ になる。
          比例オッズモデルでは、遅延 1 日あたりの累積オッズ比 $e^{\hat\beta}$ が $j$ によらず共通である。

  - id: s22p09
    title: 送料と注文数の因果効果
    context: |
      ある EC 事業者は、送料が注文数に与える効果を知りたい。ただし送料は需要の強い時期に高めに設定されることがあり、観測できない「需要の強さ」が送料と注文数の両方に影響している可能性がある。
    items:
      - id: s22p09a
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 燃料価格を操作変数として送料が注文数に与える効果を相関と標準偏差から推定し最小二乗推定と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          地域・週ごとのデータで、注文数 $Y$（件）、送料 $X$（円）、燃料価格指数 $Z$ を集めた。モデルは $Y=\beta_0+\beta X+u$ で、$u$ は $X$ と相関するが $Z$ とは無相関、$Z$ は $X$ と相関すると考える。
          標本の標準偏差と相関係数は次のとおり。

          | | 標準偏差 | | 相関係数 |
          |---|---|---|---|
          | $Z$ | «sz» | $r_{ZX}$ | «rzx» |
          | $X$ | «sx» | $r_{ZY}$ | «rzy» |
          | $Y$ | «sy» | $r_{XY}$ | «rxy» |

          $Z$ を操作変数とする $\beta$ の推定値（2 段階最小二乗推定値）に最も近いものはどれか。
        choices:
          - "$«rf»$"
          - "$«iv»$"
          - "$«inv»$"
          - "$«rr»$"
          - "$«ols»$"
        answer: 1
        distractors:
          - 誘導形（Y を Z に回帰した傾き）をそのまま答えた
          - 正解
          - 共分散の比を逆（Cov(Z,X)/Cov(Z,Y)）にした
          - 相関係数の比 r_ZY/r_ZX をとり、標準偏差の換算を忘れた
          - 操作変数を使わない最小二乗推定値を答えた
        explanation: |
          **方針** 説明変数が 1 つで操作変数も 1 つのとき、2 段階最小二乗推定値は $\hat\beta_{IV}=\dfrac{\mathrm{Cov}(Z,Y)}{\mathrm{Cov}(Z,X)}$。共分散は相関係数 × 標準偏差 × 標準偏差で戻す。

          **途中式**
          $$\mathrm{Cov}(Z,X)=«rzx»\times«sz»\times«sx»=«czx»,\qquad \mathrm{Cov}(Z,Y)=«rzy»\times«sz»\times«sy»=«czy»$$
          $$\hat\beta_{IV}=\frac{«czy»}{«czx»}=«iv»$$
          2 段階で書くと、1 段目 $X$ を $Z$ に回帰した傾き $«czx»/«vz»=«g1»$、2 段目に相当する誘導形の傾き $«czy»/«vz»=«pi»$ の比 $«pi»/«g1»=«iv»$ と同じ。

          **答え** $«iv»$（送料を 1 円上げると注文数が $«iv_abs»$ 件減ると推定される）

          **間違えやすい点** 最小二乗推定値 $r_{XY}s_Y/s_X=«rxy»\times«sy»/«sx»=«ols»$ は、需要が強いときに送料も高いという正の相関 $\mathrm{Cov}(X,u)>0$ のせいで 0 の側に偏る（効果を過小評価する）。
          誘導形の傾き $«rf»$ は「燃料価格 1 単位」あたりの効果で、送料 1 円あたりの効果ではない。

      - id: s22p09b
        chapter: 33
        terms: [backdoor-criterion, d-separation, causal-effect]
        topic: 合流点と中間変数を含む因果グラフでバックドア基準を満たす調整変数の組を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          別の施策として、送料無料クーポンの配布 $X$ が購入額 $Y$ に与える効果（総合効果）を調べる。変数と因果の向き（矢印）は次のとおりとする。
          - 観測できる変数：$A$（過去 1 年の購入回数）、$C$（アプリ通知の許可の有無）、$M$（配布後のサイト訪問回数）
          - 観測できない変数：$P$（価格への敏感さ）、$Q$（所得）
          - 矢印：$A\to X$、$A\to Y$、$X\to M$、$M\to Y$、$X\to Y$、$P\to X$、$P\to C$、$Q\to C$、$Q\to Y$

          $X$ から $Y$ への因果効果を推定するために調整する変数の組のうち、バックドア基準を満たすものはどれか。
        choices:
          - "調整しない（空集合）"
          - "$\\{A\\}$"
          - "$\\{A,C\\}$"
          - "$\\{A,M\\}$"
          - "$\\{A,C,M\\}$"
        answer: 1
        distractors:
          - A を通る裏口の経路 X←A→Y が開いたままになる
          - 正解
          - 合流点 C で条件付けると経路 X←P→C←Q→Y が開く（P も Q も観測できないので閉じられない）
          - M は X の子孫なので調整してはいけない（M を通る効果も消える）
          - C で裏口が開き、さらに X の子孫 M も含む
        explanation: |
          **方針** バックドア基準：(1) 調整する変数に $X$ の子孫を含まない、(2) $X$ に入る矢印から始まる $X$ と $Y$ の間の経路（裏口の経路）をすべて閉じる。合流点（$\to C\leftarrow$）は条件付けなければ閉じていて、条件付けると開く。

          **途中式** 裏口の経路は次の 2 本。
          - $X\leftarrow A\to Y$：$A$ は分岐点。$A$ で条件付けると閉じる。
          - $X\leftarrow P\to C\leftarrow Q\to Y$：$C$ が合流点なので、$C$ で条件付けなければ閉じている。$C$ を調整すると開き、$P$ や $Q$ は観測できないので閉じ直せない。

          $M$ は $X\to M$ により $X$ の子孫で、条件 (1) に反する。したがって条件を満たすのは $\{A\}$ だけ。

          **答え** $\{A\}$

          **間違えやすい点** 「関係のありそうな変数はすべて調整するほどよい」わけではない。合流点 $C$ を調整すると、もともとなかった偏り（合流点バイアス）が生まれる。
          中間変数 $M$ を調整すると、$X\to M\to Y$ を通る効果が取り除かれ、総合効果ではなくなる。

  - id: s22p10
    title: 倉庫の実地棚卸
    context: |
      ある倉庫には «Npop» 品目（SKU）があり、システム上の帳簿在庫数 $x$ は全品目でわかっていて、1 品目あたりの平均は $\bar X=«Xbar»$ 個である。
      実際の在庫数 $y$ を数えるのは手間がかかるので、«n» 品目を単純無作為抽出して実地棚卸を行った。
    items:
      - id: s22p10a
        chapter: 21
        terms: [regression-estimation, ratio-estimation, simple-random-sampling]
        topic: 帳簿在庫を補助変数にした回帰推定量で倉庫全体の実在庫の総数を推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          抽出した «n» 品目では、帳簿在庫の平均 $\bar x=«xbar»$、実在庫の平均 $\bar y=«ybar»$ で、標本の共分散 $s_{xy}=«sxy»$、帳簿在庫の標本分散 $s_x^2=«sxx»$ だった。
          帳簿在庫を補助変数とする回帰推定量（傾きは標本から推定した $b=s_{xy}/s_x^2$）で、倉庫全体の実在庫の**総数**を推定せよ。
        answer: «tot»
        tolerance: 0.5
        answer_format: 整数で答えよ（許容範囲 ±0.5、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 回帰推定量は、標本の平均 $\bar y$ を、補助変数の標本平均と母平均のずれ $\bar X-\bar x$ の分だけ傾き $b$ で補正する：$\hat{\bar Y}_{reg}=\bar y+b(\bar X-\bar x)$。総数はこれに品目数 $N$ を掛ける。

          **途中式** $b=«sxy»/«sxx»=«b»$。
          $$\hat{\bar Y}_{reg}=«ybar»+«b»\times(«Xbar»-«xbar»)=«ybar»+«adj»=«yreg»$$
          $$\hat Y_{reg}=«Npop»\times«yreg»=«tot_s»$$

          **答え** $«tot_s»$ 個

          **間違えやすい点** 補正の向きに注意：標本の帳簿在庫が母平均より小さい（$\bar x<\bar X$）ので、実在庫の推定は上方に補正する（逆向きにすると «tot_rev»）。
          比推定 $N\bar y\bar X/\bar x=«tot_rat»$ は原点を通る直線を仮定した推定で、回帰推定量とは異なる。単純な $N\bar y=«tot_srs»$ は補助情報を使っていない。

  - id: s22p11
    title: 物流拠点の評価指標の多変量解析
    context: |
      ある物流会社の «p» つの指標（出荷件数、誤配送率、平均リードタイム、人件費、在庫回転率）を全国の拠点について集め、それぞれ標準化した。
    items:
      - id: s22p11a
        chapter: 22
        terms: [kaiser-criterion, cumulative-contribution-ratio, pca-on-correlation-matrix]
        topic: 相関行列の固有値からカイザー基準と累積寄与率80%基準で採用する主成分の数を比べる
        level: 基本
        definition: true
        type: choice
        question: |
          相関行列の主成分分析で、固有値は大きい順に «ev1»、«ev2»、«ev3»、«ev4»、«ev5» だった。
          採用する主成分の数について正しいものはどれか（カイザー基準は「固有値が 1 以上の主成分を採る」、累積寄与率基準は「累積寄与率が初めて 80% 以上になるところまで採る」とする）。
        choices:
          - "カイザー基準では 3 個、累積寄与率 80% 基準では 2 個"
          - "カイザー基準では 2 個、累積寄与率 80% 基準では 3 個"
          - "どちらの基準でも 2 個"
          - "どちらの基準でも 3 個"
          - "カイザー基準では 2 個、累積寄与率 80% 基準では 4 個"
        answer: 1
        distractors:
          - 2つの基準の結果を取り違えた
          - 正解
          - 累積寄与率を第2主成分までで 80% を超えると誤算した（固有値の和でなく最大固有値などで割った）
          - 固有値 0.80 を 1 以上と読み違え、累積寄与率も誤った
          - 累積寄与率 80%「を超えた次」まで採った
        explanation: |
          **方針** 相関行列の固有値の和は変数の数 «p» に等しい。寄与率は固有値 ÷ «p»。カイザー基準は「元の変数 1 個分（分散 1）以上の情報をもつ主成分」を採る考え方。

          **途中式** 固有値が 1 以上なのは «ev1» と «ev2» の 2 個。累積寄与率は
          $$\frac{«ev1»}{«p»}=«c1»\%,\quad \frac{«ev1»+«ev2»}{«p»}=«c2»\%,\quad \frac{«ev1»+«ev2»+«ev3»}{«p»}=«c3»\%$$
          で、初めて 80% 以上になるのは第 3 主成分まで。

          **答え** カイザー基準では «kaiser» 個、累積寄与率 80% 基準では «k80» 個

          **間違えやすい点** 基準によって採る数が変わることはよくある。カイザー基準は相関行列（標準化したデータ）の場合の目安で、分散共分散行列の固有値にそのまま「1 以上」を当てはめてはいけない。

      - id: s22p11b
        chapter: 25
        terms: [factor-rotation, communality, factor-loading]
        topic: 直交回転行列で2因子の負荷量を回転し共通性と独自分散が変わらないことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          同じ «p» 指標に 2 因子の直交因子モデルを当てはめた（因子は互いに無相関で分散 1）。誤配送率の因子負荷量は $(«l1»,\ «l2»)$ だった。
          解釈しやすくするため、負荷量の行ベクトルに右から直交行列
          $$T=\begin{pmatrix}«cs»&-«sn»\\«sn»&«cs»\end{pmatrix}$$
          を掛けて回転する（$\Lambda^{*}=\Lambda T$）。回転後の誤配送率の負荷量と独自分散の組として正しいものはどれか。
        choices:
          - "負荷量 $(«r1»,\\ «r2»)$、独自分散 $«u2»$"
          - "負荷量 $(«r1»,\\ «r2»)$、独自分散 $«u_sum»$"
          - "負荷量 $(«rt1»,\\ «rt2»)$、独自分散 $«u2»$"
          - "負荷量 $(«r1»,\\ «r2»)$、独自分散 $«h2»$"
          - "負荷量 $(«l1»,\\ «l2»)$、独自分散 $«u2»$"
        answer: 0
        distractors:
          - 正解
          - 共通性を負荷量の2乗和ではなく負荷量の和で求めた
          - 行ベクトルに T ではなく T の転置を掛けた（回転の向きが逆）
          - 共通性と独自分散を取り違えた
          - 回転しても負荷量は変わらないと考えた
        explanation: |
          **方針** 行ベクトル $(l_1,l_2)$ に $T$ を右から掛ける。直交回転では各変数の負荷量の 2 乗和（共通性）が変わらないので、独自分散 $=1-$ 共通性 も変わらない。

          **途中式**
          $$(«l1»,\ «l2»)\begin{pmatrix}«cs»&-«sn»\\«sn»&«cs»\end{pmatrix}=(«a11»+«a12»,\ «a21»+«a22»)=(«r1»,\ «r2»)$$
          回転前の共通性 $«l1»^2+«l2»^2=«h2»$、回転後 $«r1»^2+«r2»^2=«r1sq»+«r2sq»=«h2r»$ で等しい。独自分散は $1-«h2»=«u2»$。

          **答え** 負荷量 $(«r1»,\ «r2»)$、独自分散 $«u2»$

          **間違えやすい点** 共通性は負荷量の 2 乗の和（和ではない。和 $«lsum»$ から $1-«lsum»=«u_sum»$ とするのは誤り）。回転で変わるのは各因子への負荷の配分（因子ごとの寄与）で、変数ごとの共通性は変わらない。
          $T$ の転置を掛けると $(«rt1»,\ «rt2»)$ となり、問題の指定と逆向きの回転になる。

  - id: s22p12
    title: 地域と時間帯指定による配送時間の数量化
    context: |
      ある宅配業者が、荷物 «nall» 個の集荷から配達までの時間 $Y$（時間）を、2 つの質的な項目「地域」（都市・郊外・離島）と「時間帯指定」（なし・あり）で説明する数量化 I 類を行った。
      平均は $\bar y=«ybar»$ 時間。各カテゴリーの個数と、基準カテゴリー（都市、なし）を 0 としたダミー変数の回帰による推定値（カテゴリースコア）は次のとおり。

      | 項目 | カテゴリー | 個数 | 基準を 0 としたスコア |
      |---|---|---|---|
      | 地域 | 都市 | «nU» | 0 |
      | 地域 | 郊外 | «nS» | «bS» |
      | 地域 | 離島 | «nI» | «bI» |
      | 時間帯指定 | なし | «nN» | 0 |
      | 時間帯指定 | あり | «nY» | «bY» |
    items:
      - id: s22p12a
        chapter: 26
        terms: [quantification-type-1, dummy-variable]
        topic: 数量化I類のカテゴリースコアを度数で重み付き平均0に基準化して予測値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          各項目のカテゴリースコアを、個数で重み付けた平均が 0 になるように基準化すると、予測式は「$\bar y$ ＋ 地域のスコア ＋ 時間帯指定のスコア」と書ける。
          「郊外・時間帯指定あり」の荷物の配送時間の予測値はどれか。
        choices:
          - "$«w_noint»$"
          - "$«w_unw»$"
          - "$«w_cat»$"
          - "$«pred»$"
          - "$«w_raw»$"
        answer: 3
        distractors:
          - 基準化したスコアだけを足し、全体平均を足し忘れた
          - 個数で重み付けず、カテゴリーの単純平均を引いて基準化した
          - 時間帯指定「なし」のスコアを使った
          - 正解
          - 基準化していないスコアに全体平均を足した（切片は全体平均ではない）
        explanation: |
          **方針** 項目ごとに、スコアの個数による重み付き平均を引く。最小二乗のあてはめ値の平均は $\bar y$ に一致するので、基準化後の定数項は $\bar y$ になる。

          **途中式** 地域の重み付き平均：$\dfrac{«nU»\times0+«nS»\times«bS»+«nI»\times«bI»}{«nall»}=«mreg»$。基準化すると 都市 $«scU»$、郊外 $«scS»$、離島 $«scI»$。
          時間帯指定の重み付き平均：$\dfrac{«nY»\times«bY»}{«nall»}=«mtim»$。基準化すると なし $«stN»$、あり $«stY»$。
          $$\hat y=«ybar»+«scS»+«stY»=«pred»$$
          （基準カテゴリー方式の切片は $«ybar»-«mreg»-«mtim»=«c0»$ で、$«c0»+«bS»+«bY»=«pred»$ と一致する。）

          **答え** $«pred»$ 時間

          **間違えやすい点** 基準化前のスコアに $\bar y$ を足す（$«w_raw»$）と、基準カテゴリー方式の切片 «c0» の代わりに平均を使うことになり誤り。
          基準化は個数による重み付き平均で行う（単純平均 «ureg»・«utim» を引くと $«w_unw»$）。なお、項目の影響の大きさはスコアの範囲（レンジ：地域 «bI»、時間帯指定 «bY»）で比べ、基準化してもレンジは変わらない。

  - id: s22p13
    title: 週次出荷量の時系列モデル
    context: |
      ある倉庫の週次出荷量から季節変動と傾向を除いた系列 $X_t$ に、AR(2) モデル
      $$X_t=«f1»X_{t-1}+«f2»X_{t-2}+\varepsilon_t$$
      を当てはめた（$\varepsilon_t$ は平均 0 のホワイトノイズ）。
    items:
      - id: s22p13a
        chapter: 27
        terms: [partial-autocorrelation, ar-model, stationarity-condition, yule-walker-equations]
        topic: AR(2)の係数から定常性を確かめ1次の自己相関と2次の偏自己相関を求める
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルについて正しいものはどれか。$\rho_1$ は 1 次の自己相関係数、$\phi_{22}$ は 2 次の偏自己相関係数を表す。
        choices:
          - "定常であり、$\\rho_1=«f1»$、$\\phi_{22}=«f2»$"
          - "定常であり、$\\rho_1=«rho1»$、$\\phi_{22}=«f2»$"
          - "定常であり、$\\rho_1=«rho1»$、$\\phi_{22}=«rho2»$"
          - "定常であり、$\\rho_1=«rho1_plus»$、$\\phi_{22}=«f2»$"
          - "係数の和が正なので定常ではなく、自己相関は定まらない"
        answer: 1
        distractors:
          - 1次の自己相関を φ1 と同じとした（AR(1) の公式を使った）
          - 正解
          - 2次の偏自己相関を2次の自己相関 ρ2 と取り違えた
          - ρ1=φ1/(1−φ2) の分母の符号を誤った
          - 定常条件を誤解した（係数の符号は定常性に関係しない）
        explanation: |
          **方針** AR(2) の定常条件は $\phi_1+\phi_2<1$、$\phi_2-\phi_1<1$、$|\phi_2|<1$。ユール・ウォーカー方程式 $\rho_1=\phi_1+\phi_2\rho_1$、$\rho_2=\phi_1\rho_1+\phi_2$ から自己相関を求める。AR(2) の 2 次の偏自己相関は $\phi_2$ に等しい。

          **途中式** $\phi_1+\phi_2=«fs»<1$、$\phi_2-\phi_1=«fd»<1$、$|\phi_2|=«f2»<1$ なので定常。
          $$\rho_1=\frac{\phi_1}{1-\phi_2}=\frac{«f1»}{«omf2»}=«rho1»,\qquad \rho_2=«f1»\times\rho_1+«f2»=«rho2_4»$$
          $$\phi_{22}=\frac{\rho_2-\rho_1^2}{1-\rho_1^2}=\frac{«rho2_4»-«rho1sq»}{1-«rho1sq»}=\frac{«pnum»}{«pden»}=«pacf2»$$

          **答え** 定常であり、$\rho_1=«rho1»$、$\phi_{22}=«f2»$

          **間違えやすい点** $\rho_1=\phi_1$ は AR(1) のときだけ。偏自己相関 $\phi_{22}$ は $X_{t-1}$ の影響を除いた $X_t$ と $X_{t-2}$ の相関で、$\rho_2=«rho2»$ とは異なる。3 次以上の偏自己相関は 0 になる（AR(2) の次数の見分け方）。

  - id: s22p14
    title: 梱包方式と誤配送の層別分析
    context: |
      ある物流会社が、新しい梱包・ラベル方式（新）と従来の方式（旧）で誤配送の起こりやすさを比べた。2 つの倉庫 A、B で集計した件数は次のとおり。

      | 倉庫 | 方式 | 誤配送あり | 誤配送なし | 計 |
      |---|---|---|---|---|
      | A | 新 | «Aa» | «Ab» | «nAn» |
      | A | 旧 | «Ac» | «Ad» | «nAo» |
      | B | 新 | «Ba» | «Bb» | «nBn» |
      | B | 旧 | «Bc» | «Bd» | «nBo» |
    items:
      - id: s22p14a
        chapter: 28
        terms: [mantel-haenszel-estimator, three-way-table, odds-ratio-interval]
        topic: 倉庫で層別した梱包方式と誤配送の2×2表からマンテル・ヘンツェルの共通オッズ比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          倉庫で層別し、「新」の「旧」に対する誤配送のオッズ比が倉庫によらず共通であるとみなして、マンテル・ヘンツェル推定量で共通オッズ比を推定せよ。
        answer: «mh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 層 $k$ の表を「新・あり $a_k$、新・なし $b_k$、旧・あり $c_k$、旧・なし $d_k$、計 $n_k$」とすると
          $$\hat\psi_{MH}=\frac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$$

          **途中式** $n_A=«nA»$、$n_B=«nB»$。
          $$\frac{a_Ad_A}{n_A}=\frac{«Aa»\times«Ad»}{«nA»}=«adA»,\quad \frac{b_Ac_A}{n_A}=\frac{«Ab»\times«Ac»}{«nA»}=«bcA»$$
          $$\frac{a_Bd_B}{n_B}=\frac{«Ba»\times«Bd»}{«nB»}=«adB»,\quad \frac{b_Bc_B}{n_B}=\frac{«Bb»\times«Bc»}{«nB»}=«bcB»$$
          $$\hat\psi_{MH}=\frac{«adA»+«adB»}{«bcA»+«bcB»}=\frac{«sad»}{«sbc»}=«mh4»\cdots$$

          **答え** $«mh_s»$（新方式では誤配送のオッズが約 4 割強に下がる）

          **間違えやすい点** 2 つの倉庫を合計した表のオッズ比 $\frac{«ta»\times«td»}{«tb»\times«tc»}=«crude»$ は、倉庫ごとに新方式の割合と誤配送の起こりやすさが違うため偏る（交絡）。
          層ごとのオッズ比（A «orA»、B «orB»）の単純平均 «avg» もマンテル・ヘンツェル推定量とは異なる。分子と分母を逆にすると「旧」の「新」に対するオッズ比 «inv» になる。
