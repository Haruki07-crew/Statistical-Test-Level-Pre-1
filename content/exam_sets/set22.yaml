          - 1 日前ではなく 2 日前の誤差 ε2 を使った
        explanation: |
          **方針** 観測値から誤差を順に復元する：$\varepsilon_t=x_t-«mu»-«th»\varepsilon_{t-1}$。1 期先の予測は未来の誤差の期待値 0 を代入して $\hat x_{4}=«mu»+«th»\varepsilon_3$、2 期先は既知の誤差が入らないので $\hat x_5=«mu»$。

          **途中式**
          $$\varepsilon_1=«x1»-«mu»-«th»\times0=«e1»,\quad \varepsilon_2=«x2»-«mu»-«th»\times«e1»=«e2»,\quad \varepsilon_3=«x3»-«mu»-«th»\times(«e2»)=«e3»$$
          $$\hat x_4=«mu»+«th»\times«e3»=«mu»+«the3»=«f1»,\qquad \hat x_5=E[«mu»+\varepsilon_5+«th»\varepsilon_4]=«f2»$$

          **答え** $(\hat x_4,\hat x_5)=(«f1»,\ «f2»)$

          **間違えやすい点** 誤差 $\varepsilon_3$ は $x_3-«mu»$ ではない（前日の誤差の影響を引く）。そのまま使うと $«naive»$ になる。
          MA(1) の自己相関は 1 次だけなので、2 期先以降の予測は平均 «mu» に一致する（予測誤差分散は 1 期先 $\sigma^2$、2 期先以降 $(1+«th»^2)\sigma^2=«v2»\sigma^2$）。誤差を逐次復元できるのは反転可能（$|\theta|<1$）だからである。

  - id: s22p13
    title: 倉庫作業の要因実験のブロック化
    context: |
      倉庫のピッキング作業について、3 つの因子 A（棚の配置：従来・新）、B（ピッキングリストの順番：注文順・経路順）、C（カート：小・大）の $2^3$ 要因実験を行う。
      8 通りの処理を 1 日で終えられないので、2 日に分けて 4 通りずつ行う（日をブロックとする）。処理は、高水準の因子の小文字で表す（(1) はすべて低水準、ab は A と B が高水準で C は低水準）。
    items:
      - id: s22p13a
        chapter: 20
        terms: [confounding, factorial-design, randomized-block-design]
        topic: 2の3乗要因実験を2ブロックに分けるとき3因子交互作用ABCをブロックと交絡させる処理の分け方を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          主効果と 2 因子交互作用はすべて日の違いの影響を受けずに推定したい。そのため、最も重要でない 3 因子交互作用 ABC を日（ブロック）と交絡させる。2 日への処理の分け方として正しいものはどれか。
        choices:
          - "1 日目 {(1), a, b, ab}、2 日目 {c, ac, bc, abc}"
          - "1 日目 {(1), a, bc, abc}、2 日目 {b, c, ab, ac}"
          - "1 日目 {(1), ab, c, abc}、2 日目 {a, b, ac, bc}"
          - "1 日目 {«minus»}、2 日目 {«plus»}"
          - "1 日目 {(1), b, ac, abc}、2 日目 {a, c, ab, bc}"
        answer: 3
        distractors:
          - C の水準で分けたので主効果 C が日と交絡する
          - B と C の符号の積で分けたので交互作用 BC が日と交絡する
          - A と B の符号の積で分けたので交互作用 AB が日と交絡する
          - 正解
          - A と C の符号の積で分けたので交互作用 AC が日と交絡する
        explanation: |
          **方針** 各処理で、高水準を +1、低水準を −1 とした A・B・C の符号の積（ABC の対比の係数）を求め、+1 の処理と −1 の処理に分ける。すると日の差は ABC の対比にだけ含まれ、ほかの効果の対比では各日に + と − が 2 つずつ現れて打ち消し合う。

          **途中式** ABC の符号は、高水準の文字の数が奇数なら +1、偶数（0 を含む）なら −1。
          - −1：(1), ab, ac, bc
          - +1：a, b, c, abc

          たとえば A の対比（a, ab, ac, abc が +）は、1 日目に ab, ac の 2 つ、2 日目に a, abc の 2 つを + として含むので、日の差が打ち消される。

          **答え** 1 日目 {«minus»}、2 日目 {«plus»}

          **間違えやすい点** 日の分け方の符号と一致する効果が日と交絡する。{(1), a, b, ab} と {c, ac, bc, abc} に分けると、C の効果と日の差を区別できなくなる。
          交絡させた ABC は推定できなくなる（日の差と区別できない）ので、重要でない高次の交互作用を選ぶ。
