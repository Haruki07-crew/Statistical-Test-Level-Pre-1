        level: 基本
        definition: false
        type: choice
        question: |
          水準間の平方和のうち、積載量に比例する直線的な傾向の成分を、直交多項式の 1 次の係数 $(-1,\ 0,\ 1)$ による対比で取り出す。
          その平方和と、誤差の平均平方で割った $F$ 値の組として正しいものはどれか。
        choices:
          - "平方和 $«ss_non»$、$F=«F_non»$"
          - "平方和 $«ss1»$、$F=«F1»$"
          - "平方和 $«ss_noc»$、$F=«F_noc»$"
          - "平方和 $«ssa»$、$F=«Fa»$"
          - "平方和 $«L1sq»$、$F=12.50$"
        answer: 1
        distractors:
          - 各水準の人数 n を掛け忘れた
          - 正解
          - 係数の2乗和 Σc²=2 で割り忘れた
          - 1次の成分ではなく水準間平方和全体を使い、自由度 2 で割った F を答えた
          - n も Σc² も使わず対比の2乗をそのまま平方和とした
        explanation: |
          **方針** 各水準 $n$ 人の対比 $L=\sum c_i\bar y_i$ の平方和は $SS_L=nL^2/\sum c_i^2$（自由度 1）。$F=SS_L/\mathrm{MSE}$。

          **途中式**
          $$L_1=-«m1»+0\times«m2»+«m3»=«L1»,\qquad SS_1=\frac{«n»\times«L1»^2}{(-1)^2+0^2+1^2}=«ss1»,\qquad F=\frac{«ss1»}{«mse»}=«F1»$$
          確認：2 次の係数 $(1,-2,1)$ では $L_2=«L2»$、$SS_2=«ss2»$ で、$SS_1+SS_2=«ssa»$ が水準間平方和に一致する。

          **答え** 平方和 $«ss1»$、$F=«F1»$（$F_{0.05}(1,«dfe»)=«f112»$ を大きく超え、直線的に増える傾向がある）

          **間違えやすい点** 対比の平方和では、係数の 2 乗和で割って尺度をそろえる。直交多項式の対比は互いに直交するので、水準間の平方和を 1 次と 2 次の成分に分解できる。

  - id: s22p14
    title: 3倉庫の出荷量の同時分布
    context: |
      ある地域の 3 つの倉庫の日次出荷量（百個）$(X_1,X_2,X_3)$ は 3 変量正規分布に従い、平均ベクトルと分散共分散行列は
      $$\mu=\begin{pmatrix}«m1»\\«m2»\\«m3»\end{pmatrix},\qquad \Sigma=\begin{pmatrix}«s11»&«s12»&«s13»\\«s12»&«s22»&«s23»\\«s13»&«s23»&«s33»\end{pmatrix}$$
      である。
    items:
      - id: s22p14a
        chapter: 6
        terms: [multivariate-normal-distribution, bivariate-normal-distribution, normal-distribution]
        topic: 3倉庫の出荷量の多変量正規分布で1つの倉庫の値が分かったときの残り2つの合計の条件付き分布から確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある日、倉庫 3 の出荷量が $X_3=«x3»$ と先に分かった。この日の倉庫 1 と 2 の合計 $S=X_1+X_2$ が «c» を超える確率に最も近いものはどれか。
          標準正規分布の分布関数は $\Phi(0.77)=«f077»$、$\Phi(0.94)=«f094»$、$\Phi(1.32)=«f132»$、$\Phi(1.92)=«f192»$ とする（標準化した値は小数第 2 位に丸めて使え）。
        choices:
          - "$«p_unc»$"
          - "$«p_nocov»$"
          - "$«pa»$"
          - "$«p_nov»$"
          - "$«p_comp»$"
        answer: 2
        distractors:
          - X3 の情報を使わず S の周辺分布で計算した
          - S の分散で X1 と X2 の共分散を足し忘れた
          - 正解
          - 条件付き平均は直したが、分散を条件付き分散に直さなかった
          - S が 210 以下になる確率（余事象）を答えた
        explanation: |
          **方針** $(S,X_3)$ は 2 変量正規分布に従う。$S$ の平均・分散と $X_3$ との共分散を求め、条件付き分布 $S\mid X_3=x_3\sim N\!\left(\mu_S+\dfrac{\sigma_{S3}}{\sigma_{33}}(x_3-\mu_3),\ \sigma_S^2-\dfrac{\sigma_{S3}^2}{\sigma_{33}}\right)$ を使う。

          **途中式**
          $$\mu_S=«m1»+«m2»=«ms»,\quad \sigma_S^2=«s11»+«s22»+2\times«s12»=«vs»,\quad \sigma_{S3}=«s13»+«s23»=«cs»$$
          $$E[S\mid X_3=«x3»]=«ms»+\frac{«cs»}{«s33»}\times«dx3»=«cm»,\qquad V[S\mid X_3]=«vs»-\frac{«cs»^2}{«s33»}=«vs»-«cs2»=«cv»$$
          $$P(S>«c»\mid X_3=«x3»)=1-\Phi\left(\frac{«c»-«cm»}{\sqrt{«cv»}}\right)=1-\Phi(«zraw»)\approx1-\Phi(«z»)=«pa»$$

          **答え** $«pa»$

          **間違えやすい点** $X_3$ が平均より大きいと、正の相関をもつ $S$ の予測も上がる（$«ms»\to«cm»$）と同時に、ばらつきは小さくなる（分散 $«vs»\to«cv»$）。平均だけ直して分散を直さないと $«p_nov»$ になる。
          $X_3$ の情報を使わなければ $«p_unc»$ と大きく過小評価する。
