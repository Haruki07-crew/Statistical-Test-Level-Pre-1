set: 22
title: 模擬試験 第22回
minutes: 90
problems:
  - id: s22p01
    title: 入荷検品と破損率の調査
    context: |
      ある物流倉庫に、同じ型の段ボール箱 «N» 箱が入荷した。このうち «D» 箱は輸送中に中身が破損しているが、外から見ても区別できない。
    items:
      - id: s22p01a
        chapter: 1
        terms: [conditional-probability, independence-of-events]
        topic: 非復元で1箱ずつ開封するとき3箱目で初めて破損箱に当たる確率を乗法定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          検品担当者が «N» 箱を無作為な順に 1 箱ずつ開けていく（開けた箱は戻さない）。**3 箱目で初めて**破損箱が見つかる確率を求めよ。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「1 箱目が無傷」「2 箱目が無傷」「3 箱目が破損」が順に起こる確率を、乗法定理 $P(A\cap B\cap C)=P(A)P(B\mid A)P(C\mid A\cap B)$ で掛け合わせる。開けた箱は戻さないので、条件付き確率の分母と分子が 1 ずつ減る。

          **途中式** 無傷の箱は $«N»-«D»=«G»$ 箱。
          $$P=\frac{«G»}{«N»}\times\frac{«G1»}{«N1»}\times\frac{«D»}{«N2»}=\frac{«num»}{«den»}=«pa5»\cdots$$

          **答え** $«pa_s»$

          **間違えやすい点** 開けた箱を戻す（復元抽出）とみなして $(«G»/«N»)^2\times«D»/«N»=«with_rep»$ としないこと。各回の確率は前の結果に依存する。
          また「3 箱目までに少なくとも 1 箱見つかる確率」$1-\frac{«G»}{«N»}\cdot\frac{«G1»}{«N1»}\cdot\frac{«G2»}{«N2»}=«atleast»$ と取り違えないこと。

      - id: s22p01b
        chapter: 9
        terms: [required-sample-size, ci-proportion, wald-confidence-interval]
        topic: 見込みの破損率を使って比率の95%信頼区間の半幅を3ポイント以内にする箱数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          この業者の輸送全体での破損率 $p$ を推定したい。最初の入荷から見込み値を $p_0=«D»/«N»=«p0»$ とし、
          多数の箱を無作為に調べて、正規近似による $p$ の 95% 信頼区間 $\hat p\pm 1.96\sqrt{\hat p(1-\hat p)/n}$ の**半幅**が «e» 以下になるようにしたい。
          $\hat p$ が見込み値どおり $p_0$ になるとしたとき、必要な最小の箱数 $n$ を求めよ。標準正規分布の上側 2.5% 点は «z» とする。
        answer: «nreq»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 半幅 $1.96\sqrt{p_0(1-p_0)/n}\le e$ を $n$ について解き、整数に切り上げる。

          **途中式**
          $$n\ge\frac{1.96^2\,p_0(1-p_0)}{e^2}=\frac{«z2»\times«p0»\times«q0»}{«e2»}=\frac{«z2»\times«pq»}{«e2»}=«nraw»\cdots$$

          **答え** 切り上げて $n=«nreq»$ 箱

          **間違えやすい点** 見込み値がないときの安全側の値 $p_0=0.5$ を使うと $«n_halfraw»$ となり «n_half» 箱必要になる。
          半幅ではなく区間の幅（$2e$）を «e» としてしまうと «n_width» 箱、上側 5% 点 1.645 を使うと «n_645» 箱になる。«nraw» を切り捨てて «nlow» にすると半幅が «e» をわずかに超える。

  - id: s22p02
    title: 需要と欠品・仕入れ量
    context: |
      ある EC 倉庫では、商品ごとに 1 日の注文数（需要）を予測して在庫を管理している。
    items:
      - id: s22p02a
        chapter: 5
        terms: [poisson-distribution, sum-of-random-variables]
        topic: ポアソン分布の再生性でリードタイム中の需要が手持ち在庫を超える欠品確率を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある商品の 1 日の注文数は、日ごとに独立に平均 «lam» のポアソン分布に従う。在庫が «stock» 個になった時点で発注すると、入荷までに «L» 日かかる（リードタイム）。
          この «L» 日間の注文数の合計が «stock» 個を**超える**と欠品が起こる。欠品が起こる確率を求めよ。必要なら $e^{-«mu»}=«em3»$ を使え。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 独立なポアソン分布の和はポアソン分布（再生性）なので、«L» 日間の注文数 $S$ は平均 $«L»\times«lam»=«mu»$ のポアソン分布に従う。欠品は $S\ge «stock1»$。余事象 $S\le«stock»$ の確率を足し上げる。

          **途中式** $P(S=k)=e^{-«mu»}«mu»^k/k!$ の $e^{-«mu»}$ を除いた部分を $k=0,\ldots,«stock»$ で並べると
          $$«t0»+«t1»+«t2»+«t3»+«t4»+«t5»=«tsum»$$
          $$P(S\le«stock»)=«em3»\times«tsum»=«cdf»,\qquad P(S\ge«stock1»)=1-«cdf»=«pa5»$$

          **答え** $«pa_s»$

          **間違えやすい点** 「超える」なので «stock» 個ちょうどは欠品ではない。$P(S\ge«stock»)$ とすると $«p_ge5»$ になる。
          また 1 日分の平均 «lam» のまま計算しないこと。«L» 日分の注文数の平均は $«mu»$。

      - id: s22p02b
        chapter: 19
        terms: [quantile-regression]
        topic: 欠品と売れ残りの損失の比から分位点回帰で使う分位点を決めセール日の仕入れ量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          別の生鮮商品は毎朝仕入れ、その日に売れ残ると廃棄する。1 個あたりの損失は、欠品（需要に足りない分）が «cu» 円、売れ残りが «co» 円である。
          1 日の需要 $Y$ を、セール日なら $x=1$、そうでなければ $x=0$ とする変数で説明する分位点回帰を、いくつかの分位点 $\tau$ で当てはめた結果は次のとおり。

          | $\tau$ | 0.20 | 0.25 | 0.50 | 0.75 | 0.80 |
          |---|---|---|---|---|---|
          | 推定式 $\hat Q_\tau(Y\mid x)$ | $«a20»+«b20»x$ | $«a25»+«b25»x$ | $«a50»+«b50»x$ | $«a75»+«b75»x$ | $«a80»+«b80»x$ |

          期待損失を最小にする仕入れ量は、需要の条件付き分布のある分位点になる。次のセール日（$x=1$）の仕入れ量として適切なものはどれか。
        choices:
          - "$«q20»$ 個"
          - "$«q25»$ 個"
          - "$«q50»$ 個"
          - "$«q75»$ 個"
          - "$«q80»$ 個"
        answer: 4
        distractors:
          - 分位点を 売れ残り/(欠品+売れ残り)=0.2 と逆にした
          - 分位点を 売れ残り/欠品=0.25 とした
          - 損失の非対称性を考えず中央値（τ=0.5）を使った
          - 分位点を 1−売れ残り/欠品=0.75 とした
          - 正解
        explanation: |
          **方針** 仕入れ量 $q$ の期待損失 $E[c_u(Y-q)^{+}+c_o(q-Y)^{+}]$ を $q$ で微分すると $-c_u\{1-F(q)\}+c_oF(q)$。これを 0 とおくと $F(q)=\dfrac{c_u}{c_u+c_o}$（新聞売り子問題）。
          分位点回帰は、チェック関数 $\rho_\tau(u)=u\{\tau-I(u<0)\}$ の和を最小にして条件付き $\tau$ 分位点を推定する方法で、この $\tau$ の推定式を使えばよい。

          **途中式**
          $$\tau=\frac{c_u}{c_u+c_o}=\frac{«cu»}{«cucoh»}=«tau»$$
          $$\hat Q_{«tau»}(Y\mid x=1)=«a80»+«b80»\times1=«q80»$$

          **答え** $«q80»$ 個

          **間違えやすい点** 欠品の損失が大きいほど多めに仕入れるので、$\tau$ は 0.5 より大きい。逆に $c_o/(c_u+c_o)=«tau_rev»$ とすると $«q20»$ 個と少なすぎる。
          中央値（$\tau=0.5$）の予測は損失が対称なときの答え。セールのない日（$x=0$）なら $«q80x0»$ 個になる。

      - id: s22p02c
        chapter: 7
        terms: [delta-method, poisson-distribution]
        topic: ポアソン件数の平方根変換の分散をデルタ法で近似し平均によらないことを見る
        level: 基本
        definition: false
        type: choice
        question: |
          商品によって 1 日の注文数の平均が大きく違うので、1 日の注文数 $N$（平均 $\lambda$ のポアソン分布）を $\sqrt{N}$ に変換してから分析する。
          $\lambda=«lc»$ のとき、デルタ法（1 次のテイラー近似）による $V[\sqrt N]$ の近似値はどれか。
        choices:
          - "$«dv_nolam»$"
          - "$«dv_nosq»$"
          - "$«dv»$"
          - "$«dv_sd»$"
          - "$«dv_raw»$"
        answer: 2
        distractors:
          - 微分係数の2乗だけを答え、元の分散 λ を掛け忘れた
          - 微分係数を2乗しなかった（g'(λ) をそのまま答えた）
          - 正解
          - 変換前の標準偏差 √λ を答えた
          - 変換前の分散 λ を答えた
        explanation: |
          **方針** デルタ法：$g$ が微分可能なら $V[g(N)]\approx\{g'(E[N])\}^2V[N]$。$g(x)=\sqrt x$、$E[N]=V[N]=\lambda$。

          **途中式** $g'(x)=\dfrac{1}{2\sqrt x}$ より
          $$V[\sqrt N]\approx\left(\frac{1}{2\sqrt{\lambda}}\right)^2\lambda=\frac{1}{4\lambda}\times\lambda=\frac14$$
          $\lambda=«lc»$ でも $\frac{1}{4\times«lc»}\times«lc»=«dv»$。

          **答え** $«dv»$（$\lambda$ によらない。平方根変換を分散安定化変換と呼ぶ理由）

          **間違えやすい点** 微分係数は 2 乗して元の分散 $\lambda$ を掛ける。$g'(\lambda)=«gp»$ をそのまま答えたり、$\{g'(\lambda)\}^2=«gp2»$ で止めたりしない。

  - id: s22p03
    title: 出荷準備時間と配達時刻
    context: |
      ある EC 物流センターで、注文を受けてから出荷できるまでの時間や、配達の時刻を分析する。
    items:
      - id: s22p03a
        chapter: 2
        terms: [hazard-function, survival-function]
        topic: 平均の異なる2つの指数分布の混合で出荷準備時間のハザード関数が時間とともに下がることを求める
        level: 標準
        definition: false
        type: choice
        question: |
          注文の «w1» の割合は手元の棚の商品で、出荷準備時間（時間）は平均 «m1» の指数分布に従う。残り «w2» は別倉庫からの取り寄せで、平均 «m2» の指数分布に従う。
          無作為に選んだ注文の出荷準備時間 $T$ について、$t=«t»$ 時間におけるハザード関数 $h(«t»)=f(«t»)/S(«t»)$（$f$ は密度、$S$ は生存関数）に最も近い値はどれか。
          必要なら $e^{-3}=«em3»$、$e^{-1}=«em1»$ を使え。
        choices:
          - "$«f3»$"
          - "$«S3»$"
          - "$«h»$"
          - "$«invmean»$"
          - "$«h0»$"
        answer: 2
        distractors:
          - 生存関数で割らずに密度 f(3) を答えた
          - 生存関数 S(3) を答えた
          - 正解
          - 指数分布とみなして 1/E[T] を答えた
          - 各経路のハザード（レート）を割合で平均した（これは t=0 での値で、時間によって変わることを見落とした）
        explanation: |
          **方針** 混合分布では、密度と生存関数がそれぞれ重み付き和になる。ハザードはその比で、各経路のハザードの重み付き平均にはならない。

          **途中式**
          $$S(t)=«w1»e^{-t}+«w2»e^{-t/«m2»},\qquad f(t)=«w1»e^{-t}+\frac{«w2»}{«m2»}e^{-t/«m2»}$$
          $t=«t»$ では $e^{-t}=«em3»$、$e^{-t/«m2»}=e^{-«t3»}=«em1»$ なので
          $$S(«t»)=«S1»+«S2»=«S»,\qquad f(«t»)=«f1»+«f2»=«f»$$
          $$h(«t»)=\frac{«f»}{«S»}=«h4»\cdots$$

          **答え** $«h»$

          **間違えやすい点** 各経路のハザードは一定（1 と $1/«m2»$）だが、混合した全体のハザードは $t=0$ の $«h0»$ から時間とともに下がり、$1/«m2»$ に近づく。
          時間がたつほど「まだ終わっていない注文」に取り寄せの注文が多く残るためである。

      - id: s22p03b
        chapter: 8
        terms: [order-statistics, efficient-estimator, beta-distribution]
        topic: 一様分布に従う配達時刻5件の標本中央値の分散を順序統計量のベータ分布から求め標本平均と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          配達時刻は、指定された «th» 分の時間枠の開始からの経過時間（分）で表すと、区間 $[0,«th»]$ の一様分布に従うとする。独立な «n» 件の配達時刻から時間枠の中心 $«th»/2$ を推定するとき、
          標本中央値（小さいほうから «k» 番目の値）の分散は、標本平均の分散の何倍か。最も近いものはどれか。
        choices:
          - "$«ratio_inv»$"
          - "$1.000$"
          - "$«pi2»$"
          - "$«ratio»$"
          - "$«asym»$"
        answer: 3
        distractors:
          - 比を逆にした（標本平均の分散 ÷ 標本中央値の分散）
          - どちらも不偏なので分散も等しいと考えた
          - 正規分布での大標本の比 π/2 をそのまま使った
          - 正解
          - 標本中央値の漸近分散 1/(4nf²) を n=5 にそのまま当てはめた
        explanation: |
          **方針** 区間 $[0,1]$ の一様分布からの大きさ $n$ の標本で、$k$ 番目に小さい値はベータ分布 $\mathrm{Be}(k,\,n-k+1)$ に従う。尺度 «th» を掛ければ分散は $«th»^2$ 倍になる。

          **途中式** $n=«n»$、$k=«k»$ なので中央値は $«th»\times\mathrm{Be}(«ba»,«bb»)$。ベータ分布 $\mathrm{Be}(a,b)$ の分散は $\dfrac{ab}{(a+b)^2(a+b+1)}$ より
          $$V[\text{中央値}]=«th»^2\times\frac{«ba»\times«bb»}{«bab»^2\times«bab1»}=\frac{«th2»}{28}=«vmed»$$
          $$V[\bar X]=\frac{«th»^2/12}{«n»}=\frac{«th2»}{60}=«vmean»,\qquad \frac{«vmed»}{«vmean»}=\frac{60}{28}=«ratio»$$

          **答え** 約 $«ratio»$ 倍（標本平均のほうが精度が高い）

          **間違えやすい点** どちらも対称性から不偏だが、分散は異なる。正規分布で知られる比 $\pi/2\approx«pi2»$ は正規分布の大標本での値で、一様分布には当てはまらない。
          中央値の漸近分散 $1/\{4nf(m)^2\}$ は大標本での近似で、$n=«n»$ では $«asym»$ 倍と過大になる。

  - id: s22p04
    title: 配送エリアの距離
    context: |
      ある配送拠点は、半径 $a=«a»$ km の円形の配送エリアの中心にある。配送先はエリア内に一様に（面積に比例して）分布しているとし、拠点から配送先までの直線距離を $R$（km）とする。
    items:
      - id: s22p04a
        chapter: 4
        terms: [change-of-variables, cumulative-distribution-function, uniform-distribution]
        topic: 円形の配送エリアに一様に分布する配送先までの距離の分布を求め平均距離を出す
        level: 標準
        definition: false
        type: choice
        question: |
          距離 $R$ の期待値 $E[R]$ はどれか。
        choices:
          - "$«E13»$ km"
          - "$«Ehalf»$ km"
          - "$«ER»$ km"
          - "$«Erms»$ km"
          - "$«E34»$ km"
        answer: 2
        distractors:
          - 密度を 2(a−r)/a² と中心ほど多いと取り違えた
          - 距離が [0,a] の一様分布に従うと考えた（面積の広がりを無視した）
          - 正解
          - E[R²] の平方根を答えた
          - 球の内部の一様分布（密度 3r²/a³）と取り違えた
        explanation: |
          **方針** まず分布関数を面積の比で求め、微分して密度を得てから期待値を計算する。

          **途中式** 半径 $r$ の円の面積は $\pi r^2$ なので、$0\le r\le a$ で
          $$F_R(r)=P(R\le r)=\frac{\pi r^2}{\pi a^2}=\frac{r^2}{a^2},\qquad f_R(r)=\frac{2r}{a^2}$$
          $$E[R]=\int_0^a r\cdot\frac{2r}{a^2}\,dr=\frac{2a}{3}=\frac{2\times«a»}{3}=«ER»$$

          **答え** $«ER»$ km

          **間違えやすい点** 「面積に一様」と「距離に一様」は違う。遠い距離ほど円周が長く配送先が多いので、密度は $r$ に比例する。距離が一様だと考えると $«Ehalf»$ km と小さくなる。
          $E[R^2]=a^2/2=«Er2»$ の平方根 $«Erms»$ は $E[R]$ ではない（$E[R]^2\le E[R^2]$）。

      - id: s22p04b
        chapter: 32
        terms: [importance-sampling, monte-carlo-integration]
        topic: 一様分布を提案分布とする重要度サンプリングで配送距離の期待値を推定するときの重みと推定値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $E[R]$ を重要度サンプリングで推定する練習をする。提案分布として区間 $[0,«a»]$ の一様分布（密度 $g(r)=1/«a»$）から «nis» 個の値
          $$r_1=«r1»,\ r_2=«r2»,\ r_3=«r3»,\ r_4=«r4»$$
          を得た。前問の $R$ の密度を $f$ として、推定量 $\dfrac{1}{«nis»}\sum_{i=1}^{«nis»} r_i\,\dfrac{f(r_i)}{g(r_i)}$（重みの和で割らない形）の値に最も近いものはどれか。
        choices:
          - "$«invw»$"
          - "$«naive»$"
          - "$«sn»$"
          - "$«is»$"
          - "$«ER»$"
        answer: 3
        distractors:
          - 重みを g/f と逆にした（どの r でも a/2 になる）
          - 重みを付けずに提案分布の値をそのまま平均した
          - 重みの和で割る（自己正規化した）推定量を計算した
          - 正解
          - 推定値ではなく理論値 2a/3 を答えた
        explanation: |
          **方針** 目標の密度 $f(r)=2r/a^2$ と提案の密度 $g(r)=1/a$ の比 $w(r)=f(r)/g(r)=2r/a$ を重みにして、$r\,w(r)$ を平均する。$E_g[R\,w(R)]=E_f[R]$ なので不偏である。

          **途中式** 重み $w=2r/«a»$ は $«w1», «w2», «w3», «w4»$。$r\,w$ は $«rw1», «rw2», «rw3», «rw4»$ で、和は $«srw»$。
          $$\frac{«srw»}{«nis»}=«is4»$$

          **答え** $«is»$

          **間違えやすい点** 重みは「目標 ÷ 提案」。逆にすると $r\cdot\frac{a}{2r}=a/2$ となり、データによらず $«invw»$ になる。重みなしの平均 $«naive»$ は提案分布（一様分布）の平均の推定になってしまう。
          重みの和 $«sw»$ で割る自己正規化推定量 $«sn»$ も一つの方法だが、問題で指定した形ではない。真の値 $«ER»$ との差は標本が少ないことによるばらつき。

  - id: s22p05
    title: コールセンターの回線と応答改善
    context: |
      ある EC 事業者のコールセンターでは、問い合わせの電話が 1 時間あたり平均 «lam» 件のポアソン過程に従ってかかってくる。
    items:
      - id: s22p05a
        chapter: 15
        terms: [birth-death-process, queueing-theory, traffic-intensity]
        topic: 待合せのない3回線のコールセンターでアーランの損失式から1時間に受け付けられる電話の件数を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          このセンターには回線（オペレーター）が «cc» 本あり、待合せの仕組みがない。«cc» 本とも通話中のときにかかってきた電話は話し中となり、失われる。
          通話時間は互いに独立に平均 «mean» 分の指数分布に従う。通話中の本数の定常分布を考えるとき、**1 時間あたりに受け付けられる（つながる）電話の件数**の期待値を求めよ。
        answer: «acc»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 通話中の本数 $n=0,1,2,3$ は出生死滅過程で、出生率 $\lambda=«lam»$（$n<3$ のとき）、死亡率 $n\mu$（$\mu=60/«mean»=«muh»$ 件/時）。
          詳細つり合いから $\pi_n\propto a^n/n!$（$a=\lambda/\mu$）。ポアソン到着なので、到着した電話が話し中になる確率は $\pi_3$（アーランの損失式）。

          **途中式** $a=«lam»/«muh»=«aa»$。$a^n/n!$ は $n=0,1,2,3$ で $«e0», «e1», «e2», «e3»$、和は $«esum»$。
          $$B=\pi_3=\frac{«e3»}{«esum»}=«B»$$
          $$\lambda(1-B)=«lam»\times«omB»=«acc4»\cdots$$

          **答え** $«acc_s»$ 件

          **間違えやすい点** 待合せがあるモデル（M/M/3）と取り違えないこと。待合せがないときは $n\ge4$ の状態がなく、分布は $a^n/n!$ を $n=0$〜$3$ で正規化するだけ。
          求めるのは受け付けられる件数で、失われる件数 $\lambda B=«lost»$ 件ではない。

      - id: s22p05b
        chapter: 10
        terms: [p-value, multiple-testing, chi-squared-distribution]
        topic: 3拠点で独立に行った検定のp値をフィッシャーの方法で統合して全体として有意かを判定する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい自動応答の導入で応答率が上がるかを、3 つの拠点で独立に片側検定した。$p$ 値は «pv1»、«pv2»、«pv3» で、どの拠点も 5% では有意でなかった。
          「3 拠点すべてで効果がない」という帰無仮説を、フィッシャーの方法（$X=-2\sum\log p_i$ が帰無仮説のもとで自由度 $2k$ のカイ二乗分布に従う、$k$ は検定の数）で有意水準 5% で検定する。正しいものはどれか。
          必要なら $\log«pv1»=«lp1»$、$\log«pv2»=«lp2»$、$\log«pv3»=«lp3»$（自然対数）、$\chi^2_{0.05}(3)=«c3f»$、$\chi^2_{0.05}(6)=«c6»$ を使え。
        choices:
          - "$X=«Xf»$ が $\\chi^2_{0.05}(6)=«c6»$ を超えるので、3 拠点を総合すると有意"
          - "$X=«Xh»$ が $\\chi^2_{0.05}(6)=«c6»$ を超えないので有意でない"
          - "$X=«Xf»$ が $\\chi^2_{0.05}(3)=«c3f»$ を超えるので有意（自由度は検定の数 3）"
          - "どの拠点も 5% で有意でないので、統合しても有意にはなりえない"
          - "最小の $p$ 値 «pmin» をボンフェローニ法で 3 倍した «bon» が 0.05 を超えるので有意でない"
        answer: 0
        distractors:
          - 正解
          - −2 を掛け忘れ、対数の和の符号を変えただけで比べた
          - 自由度を 2k ではなく k とした
          - 個々の検定が有意でなければ統合しても有意にならないと誤解した
          - 「すべてで効果がない」の検定を、どれかの拠点の効果を調べる多重比較と取り違えた
        explanation: |
          **方針** 帰無仮説のもとで各 $p$ 値は独立に区間 $(0,1)$ の一様分布に従い、$-2\log p_i$ は自由度 2 のカイ二乗分布（平均 2 の指数分布）に従う。$k$ 個の和は自由度 $2k$ のカイ二乗分布。

          **途中式**
          $$\sum\log p_i=«lp1»+(«lp2»)+(«lp3»)=«lsum»,\qquad X=-2\times(«lsum»)=«Xf»$$
          自由度 $2\times3=6$ の上側 5% 点 «c6» を超えるので棄却する。

          **答え** $X=«Xf»$、3 拠点を総合すると 5% で有意

          **間違えやすい点** 1 つずつでは有意でない弱い証拠も、同じ向きにそろっていれば統合して有意になりうる。自由度は検定の数の 2 倍。
          ボンフェローニ法は「どの拠点で効果があるか」を個別に判定する方法で、全体の帰無仮説の検定としては検出力が低い。

  - id: s22p06
    title: 配送業者と倉庫の比較
    context: |
      ある物流会社は、委託先の配送業者の比較と、自社倉庫の作業手順の改善を調べている。
    items:
      - id: s22p06a
        chapter: 13
        terms: [rank-and-ties, wilcoxon-rank-sum-test, normal-approximation-rank-tests]
        topic: 同順位を含む配送日数の順位和検定で中間順位と同順位補正をした分散から正規近似の統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          配送業者 A と B に荷物を託し、届くまでの日数を記録した。

          | 業者 | 配送日数 |
          |---|---|
          | A | «TA» |
          | B | «TB» |

          同じ値には中間順位（平均の順位）を与え、A の順位和 $W$ を使うウィルコクソンの順位和検定を正規近似で行う。同順位の補正をした分散
          $$V[W]=\frac{n_1n_2}{12}\left\{(N+1)-\frac{\sum(t^3-t)}{N(N-1)}\right\}$$
          （$t$ は同じ値の組の個数、$n_1=«n1»$、$n_2=«n2»$、$N=«NN»$）を使った標準化統計量 $z=(W-E[W])/\sqrt{V[W]}$（連続修正なし）に最も近いものはどれか。
        choices:
          - "$«znaive»$"
          - "$«zN»$"
          - "$«zt»$"
          - "$«zt0»$"
          - "$«zv»$"
        answer: 2
        distractors:
          - 中間順位を使わず、同じ値に小さい順位から A を先に割り当てた
          - 同順位なしの分散の (N+1) を N にした
          - 正解
          - 同順位の補正をしなかった
          - 標準偏差ではなく分散で割った
        explanation: |
          **方針** 全体を小さい順に並べて順位をつけ、同じ値には順位の平均を与える。$E[W]=n_1(N+1)/2$ は同順位があっても変わらないが、分散は同順位の分だけ小さくなる。

          **途中式** 並べると 1(A), 2(A, A, B), 3(A, B), 4(B, B), 5(B)。順位は 1 → 1、2 → 2〜4 の平均 3、3 → 5〜6 の平均 5.5、4 → 7〜8 の平均 7.5、5 → 9。
          $$W=1+3+3+5.5=«W»,\qquad E[W]=\frac{«n1»\times(«NN»+1)}{2}=«EW»$$
          同じ値の組は $t=3,2,2$ で $\sum(t^3-t)=24+6+6=«tsum3»$、$N(N-1)=«NN1»$。
          $$V[W]=\frac{«n12»}{12}\left(10-\frac{«tsum3»}{«NN1»}\right)=«VW»,\qquad z=\frac{«dW»}{\sqrt{«VW»}}=\frac{«dW»}{«sdW»}=«zt3»\approx«zt»$$

          **答え** $«zt»$

          **間違えやすい点** 同順位の補正をしないと分散が $«VW0»$ と大きくなり $z=«zt0»$。標本が小さく同順位が多いときは、正規近似より正確な順列分布（並べ替え）による $p$ 値が望ましい。

      - id: s22p06b
        chapter: 11
        terms: [paired-t-test, two-sample-t-test, t-statistic]
        topic: 同じ作業者の新旧手順の作業時間の標準偏差と相関係数から差の標準偏差を求め対応のあるt統計量を出す
        level: 応用
        definition: false
        type: choice
        question: |
          新しいピッキング手順を試すため、作業者 «npd» 人に旧手順と新手順の両方で同じ注文を処理してもらい、1 人ごとの作業時間（秒）を測った。
          旧手順の平均 «mo»・標準偏差 «so»、新手順の平均 «mn»・標準偏差 «sn»（標準偏差は不偏分散の平方根）で、同じ作業者の旧と新の時間の相関係数は «rc» だった。
          「平均作業時間に差がない」という帰無仮説の対応のある $t$ 検定の統計量 $t$ に最も近いものはどれか。
        choices:
          - "$«tvar»$"
          - "$«tnosq»$"
          - "$«tplus»$"
          - "$«tu»$"
          - "$«tp»$"
        answer: 4
        distractors:
          - 差の標準偏差の代わりに差の分散を使った
          - 標準誤差で √n で割り忘れた
          - 差の分散で共分散を引くべきところを足した
          - 対応を無視して2標本の標準誤差 √((s1²+s2²)/n) を使った
          - 正解
        explanation: |
          **方針** 対応のある $t$ 検定は差 $D=$ 旧 − 新 の 1 標本 $t$ 検定。差の分散は $s_D^2=s_1^2+s_2^2-2rs_1s_2$ で、相関が正なら 2 群の分散の和より小さくなる。

          **途中式**
          $$s_D^2=«so2»+«sn2»-2\times«rc»\times«so»\times«sn»=«so2»+«sn2»-«cov2»=«vd»,\qquad s_D=«sdd»$$
          $$t=\frac{«mo»-«mn»}{s_D/\sqrt{«npd»}}=\frac{«dm»}{«sdd»/«sqn»}=\frac{«dm»}{«sed»}=«tp4»\cdots$$
          自由度は $«npd»-1=«dfp»$。

          **答え** $«tp»$

          **間違えやすい点** 同じ作業者の時間には正の相関があるので、対応を無視して $\sqrt{(s_1^2+s_2^2)/n}$ を使うと $t=«tu»$ と小さくなり、作業者の個人差を誤差に含めてしまう。
          共分散の符号に注意（$-2rs_1s_2$）。足すと $«tplus»$ になる。

  - id: s22p07
    title: 配送センターの残業時間の回帰分析
    context: |
      配送センターの 1 日あたりの残業時間 $Y$（時間）を回帰分析する。$x$ は 1 日の出荷件数（百件）、$A$ は自動仕分け機があれば 1、なければ 0 のダミー変数である。
    items:
      - id: s22p07a
        chapter: 16
        terms: [interaction-term, dummy-variable, multiple-regression-model]
        topic: 交互作用項を含む回帰で自動仕分けのあるセンターとないセンターの予測残業時間が等しくなる出荷件数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          40 か所のセンターのデータに交互作用項を含むモデルを当てはめたところ
          $$\hat y=«b0»+«b1»x+«g»A«d»\,xA$$
          となった。自動仕分け機のあるセンターとないセンターで、予測残業時間が等しくなる出荷件数 $x$（百件）はどれか。
        choices:
          - "$«w1»$"
          - "$«xs»$"
          - "$«w2»$"
          - "$«w3»$"
          - "等しくなる $x$ はない（2 本の直線は平行）"
        answer: 1
        distractors:
          - ダミーの係数を自動仕分け機のないセンターの傾き 0.50 で割った
          - 正解
          - ダミーの係数を自動仕分け機のあるセンターの傾き 0.20 で割った
          - 交互作用の係数の符号を取り違えた
          - 交互作用項を無視して傾きが共通だと考えた
        explanation: |
          **方針** $A=0$ と $A=1$ を代入して 2 本の直線を作り、等しくなる $x$ を求める。交互作用項があると傾きが群で異なる。

          **途中式**
          $$A=0:\ \hat y=«b0»+«b1»x,\qquad A=1:\ \hat y=(«b0»+«g»)+(«b1»«d»)x=«b0A»+«slopeA»x$$
          差は $«g»«d»x$ なので、$«g»-«dabs»x=0$ より $x=«g»/«dabs»=«xs»$。

          **答え** $x=«xs»$（500 件）。これより出荷件数が多いと、自動仕分け機のあるセンターのほうが残業が短い（例：$x=«x8»$ で «yA8» 時間 対 «yB8» 時間）。

          **間違えやすい点** 交互作用項があると、ダミーの係数 «g» は「$x=0$ のときの差」であり、どの $x$ でも同じ差ではない。
          差 $«g»«d»x$ を 0 にする $x$ は、ダミーの係数を**交互作用の係数**で割って求める（傾き 0.50 で割ると $«w1»$ になる）。

      - id: s22p07b
        chapter: 17
        terms: [residual-plot, multiple-regression-model, residual]
        topic: 追加変数プロット（偏回帰プロット）の2種類の残差から重回帰の出荷件数の係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          別の地域の 5 センターで、残業時間 $Y$ を出荷件数 $x_1$ と作業人員 $x_2$ で説明する重回帰を考える。$x_1$ の効果を見るため、
          $Y$ を $x_2$（と切片）に回帰した残差 $e_Y$ と、$x_1$ を $x_2$（と切片）に回帰した残差 $e_1$ を求めて散布図（追加変数プロット）を描いた。

          | センター | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $e_1$ | −2 | −1 | 0 | 1 | 2 |
          | $e_Y$ | −1.6 | −0.4 | 0.2 | 0.6 | 1.2 |

          なお、$Y$ を $x_1$ だけに回帰した単回帰の傾きは «bsimple» だった。重回帰における $x_1$ の偏回帰係数に最も近いものはどれか。
        choices:
          - "$«bav»$"
          - "$«bsimple»$"
          - "$«rav»$"
          - "$«bcov»$"
          - "$«binv»$"
        answer: 0
        distractors:
          - 正解
          - x2 の影響を除かない単回帰の傾きを答えた
          - 傾きではなく 2 つの残差の相関係数を答えた
          - 積和を Σe1² ではなくデータ数 n で割った
          - e1 を e_Y に回帰した傾き（向きが逆）を答えた
        explanation: |
          **方針** フリッシュ・ウォー・ロベルの定理により、$e_Y$ を $e_1$ に回帰した傾き（原点を通る。どちらの残差も平均 0）は、重回帰の $x_1$ の係数に一致する。

          **途中式**
          $$\sum e_1e_Y=«p1»+«p2»+0+«p4»+«p5»=«avsxy»,\qquad \sum e_1^2=4+1+0+1+4=«avsxx»$$
          $$\hat\beta_1=\frac{\sum e_1e_Y}{\sum e_1^2}=\frac{«avsxy»}{«avsxx»}=«bav»$$

          **答え** $«bav»$

          **間違えやすい点** 単回帰の傾き «bsimple» には、$x_2$ を通じた影響も混ざっている。追加変数プロットの「横軸」は $x_1$ そのものではなく $x_2$ の影響を除いた残差。
          散布図の傾きは $\sum e_1e_Y/\sum e_1^2$ で、相関係数 $«avsxy»/\sqrt{«avsxx»\times«avsyy»}=«rav»$ とは異なる。プロット上で離れた点は、$x_1$ の係数への影響が大きい点として見つけられる。

  - id: s22p08
    title: 誤配送と破損の分析
    context: |
      ある物流会社が、配送センターの誤配送件数と、梱包の等級と破損の関係を調べた。
    items:
      - id: s22p08a
        chapter: 18
        terms: [deviance, poisson-regression, offset-term]
        topic: オフセットつきポアソン回帰の当てはめ件数から逸脱度を計算し残差自由度のカイ二乗分布で適合度を判定する
        level: 応用
        definition: false
        type: choice
        question: |
          4 つのセンターの 1 か月の誤配送件数 $y_i$ に、取扱件数の対数をオフセットとし、自動仕分け機の有無を説明変数とするポアソン回帰（切片を含めて係数 2 個）を当てはめた。観測件数と当てはめ件数 $\hat\mu_i$ は次のとおり。

          | センター | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | 観測 $y_i$ | «y1» | «y2» | «y3» | «y4» |
          | 当てはめ $\hat\mu_i$ | «m1» | «m2» | «m3» | «m4» |
          | $\log(y_i/\hat\mu_i)$ | «l1» | «l2» | «l3» | «l4» |

          逸脱度 $D=2\sum\{y_i\log(y_i/\hat\mu_i)-(y_i-\hat\mu_i)\}$ による適合度の判定として正しいものはどれか。$\chi^2_{0.05}(2)=5.99$、$\chi^2_{0.05}(3)=7.81$ とする。
        choices:
          - "$D=«Dh»$ で、自由度 2 の 5% 点 5.99 を下回り、当てはまりが悪いとはいえない"
          - "$D=«D»$ で、自由度 2 の 5% 点 5.99 を下回り、当てはまりが悪いとはいえない"
          - "$D=«D»$ で、自由度 3 の 5% 点 7.81 を下回り、当てはまりが悪いとはいえない"
          - "$D=«X2»$ で、自由度 2 の 5% 点 5.99 を下回り、当てはまりが悪いとはいえない"
          - "$D=«D»$ は自由度 2 を上回るので過分散であり、当てはまりが悪い"
        answer: 1
        distractors:
          - 逸脱度の 2 倍を忘れた
          - 正解
          - 自由度をデータ数−1=3 とした（推定した係数は 2 個）
          - ピアソンのカイ二乗統計量を逸脱度と取り違えた
          - 逸脱度が自由度を少し超えただけで過分散・不適合と判断した
        explanation: |
          **方針** 逸脱度は飽和モデルとの対数尤度の差の 2 倍。データ数 4 から推定した係数の数 2 を引いた自由度 2 のカイ二乗分布と比べる。
          切片のあるポアソン回帰では $\sum(y_i-\hat\mu_i)=0$ になる（ここでも $50-50=0$）。

          **途中式** $y_i\log(y_i/\hat\mu_i)$ は $«tt1», «tt2», «tt3», «tt4»$ で、和は $«tsum»$。$\sum(y_i-\hat\mu_i)=0$ なので
          $$D=2\times«tsum»=«D»$$
          自由度 $4-2=2$ の上側 5% 点 5.99 を下回る。

          **答え** $D=«D»$、当てはまりが悪いとはいえない

          **間違えやすい点** 自由度は「データ数 − 推定した係数の数」。ピアソンのカイ二乗統計量 $\sum(y_i-\hat\mu_i)^2/\hat\mu_i=«X2»$ も同じ自由度で使えるが、逸脱度とは別の値である。
          逸脱度が自由度（期待値）をわずかに上回るのは偶然の範囲で、直ちに過分散とはいえない。

      - id: s22p08b
        chapter: 28
        terms: [ordinal-contingency-table, concordant-discordant-pairs, contingency-table]
        topic: 梱包等級と破損の程度の順序のある分割表で一致対と不一致対を数えグッドマン・クラスカルのγを求める
        level: 基本
        definition: false
        type: numeric
        question: |
          梱包の等級（高・中・低）と届いた荷物の破損の程度（なし・軽微・重大）を調べた。

          | 梱包等級 | なし | 軽微 | 重大 |
          |---|---|---|---|
          | 高 | «T11» | «T12» | «T13» |
          | 中 | «T21» | «T22» | «T23» |
          | 低 | «T31» | «T32» | «T33» |

          行は「高 → 低」、列は「なし → 重大」の順に順序があるとみて、グッドマン・クラスカルの $\gamma=(C-D)/(C+D)$（$C$ は一致対、$D$ は不一致対の数）を求めよ。
        answer: «gam»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。負の値なら符号もつけよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 2 つの荷物の組で、等級が低いほうが破損も重いなら一致対、破損が軽いなら不一致対。どちらかが同じ（同順位）の組は数えない。
          あるセルの度数に、それより「下の行かつ右の列」のセルの度数の和を掛けて足すと $C$、「下の行かつ左の列」の和を掛けて足すと $D$。

          **途中式**
          $$C=«T11»\times(«T22»+«T23»+«T32»+«T33»)+«T12»\times(«T23»+«T33»)+«T21»\times(«T32»+«T33»)+«T22»\times«T33»=«C»$$
          $$D=«T12»\times(«T21»+«T31»)+«T13»\times(«T21»+«T22»+«T31»+«T32»)+«T22»\times«T31»+«T23»\times(«T31»+«T32»)=«Dd»$$
          $$\gamma=\frac{«C»-«Dd»}{«C»+«Dd»}=\frac{«CmD»}{«CpD»}=«gam4»\cdots$$

          **答え** $«gam_s»$（梱包等級が低いほど破損が重い傾向）

          **間違えやすい点** 一致と不一致の向きを取り違えると符号が逆の $«gam_neg»$ になる。同順位の組を分母に入れないので、$\gamma$ は同順位の多い表で大きめに出やすい。

  - id: s22p09
    title: 配送遅延の原因
    context: |
      ある地域の配送は、悪天候 $W$ か仕分けセンターのトラブル $K$ のどちらか（または両方）が起きた日に必ず遅延し、どちらも起きなければ遅延しない。
      $W$ と $K$ は互いに独立で、$P(W)=«pw»$、$P(K)=«pk»$ とする。因果グラフは $W\to\text{遅延}\leftarrow K$ である。
    items:
      - id: s22p09a
        chapter: 33
        terms: [d-separation, causal-effect]
        topic: 独立な2つの原因の合流点である配送遅延で条件付けると原因どうしが従属になることを条件付き確率で確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          遅延が起きた日に悪天候だった確率 $P(W\mid\text{遅延})$ と、遅延が起き、さらに仕分けトラブルもあったとわかった日に悪天候だった確率 $P(W\mid\text{遅延},K)$ の組として正しいものはどれか。
        choices:
          - "$«pw_d»$ と $«pw_d»$"
          - "$«pw_dk»$ と $«pw_dk»$"
          - "$«pw_d»$ と $«pw_dk»$"
          - "$«pw_d»$ と $0$"
          - "$«pw_add»$ と $«pw_dk»$"
        answer: 2
        distractors:
          - W と K は独立なので K を知っても変わらないと考えた（合流点で条件付けると独立でなくなる）
          - W と K は独立なので遅延の有無にもよらず事前確率のままと考えた
          - 正解
          - K で遅延が説明されるので W は起きていないと考えた
          - P(遅延) を P(W)+P(K) として重なりを引き忘れた
        explanation: |
          **方針** 遅延 $=W\cup K$。ベイズの定理で条件付き確率を計算する。$W$ と $K$ は周辺では独立（経路 $W\to\text{遅延}\leftarrow K$ は合流点で閉じている）だが、合流点で条件付けると経路が開く（d 分離されなくなる）。

          **途中式** $P(\text{遅延})=1-(1-«pw»)(1-«pk»)=1-«qw»\times«qk»=«pdel»$。$W$ が起きれば必ず遅延するので
          $$P(W\mid\text{遅延})=\frac{P(W)}{P(\text{遅延})}=\frac{«pw»}{«pdel»}=«pw_d»$$
          $K$ も起きたとわかれば遅延は必ず起きているので、$W$ と $K$ の独立性から
          $$P(W\mid\text{遅延},K)=\frac{P(W\cap K)}{P(K)}=P(W)=«pw_dk»$$

          **答え** $«pw_d»$ と $«pw_dk»$（$K$ がわかると $W$ の確率が下がる。「説明による打ち消し」）

          **間違えやすい点** 「遅延した日だけ」を集めて分析すると、もともと独立な悪天候と仕分けトラブルの間に負の関連が現れる（合流点バイアス・選択バイアス）。
          因果効果の推定で合流点を調整変数に入れてはいけない理由である。

  - id: s22p10
    title: パレット単位の破損調査
    context: |
      ある倉庫には «Npal» 枚のパレットがあり、パレットごとに積まれている箱の数は異なる。箱単位の破損率を調べるため、パレットを «n» 枚単純無作為抽出し、選んだパレットの箱をすべて調べた（集落抽出）。

      | パレット | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | 箱の数 $M_i$ | «M1» | «M2» | «M3» | «M4» | «M5» |
      | 破損箱の数 $a_i$ | «a1» | «a2» | «a3» | «a4» | «a5» |
    items:
      - id: s22p10a
        chapter: 21
        terms: [cluster-sampling, ratio-estimation, standard-error]
        topic: 箱数の異なるパレットを集落とした集落抽出で箱単位の破損率を比推定し標準誤差を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          箱単位の破損率を $\hat p=\sum a_i/\sum M_i$ で推定する。その標準誤差を、比推定量の分散の推定式
          $$\hat V(\hat p)=\frac{1-f}{n\bar M^2}\cdot\frac{1}{n-1}\sum_{i=1}^{n}(a_i-\hat pM_i)^2$$
          （$f=n/N$ は抽出率、$\bar M$ は抽出したパレットの平均箱数）の平方根として求めよ。
        answer: «se»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 集落（パレット）ごとの破損数 $a_i$ と箱数 $M_i$ の比として破損率を推定する。ばらつきは「箱」ではなく「パレット」の単位で評価する（箱は独立に抽出していない）。

          **途中式** $\hat p=«sa»/«sM»=«p»$、$\bar M=«sM»/«n»=«Mbar»$、$f=«n»/«Npal»=«f»$。
          残差 $a_i-\hat pM_i$ は $«e1», «e2», «e3», «e4», «e5»$ で、2 乗和は $«ssr»$。$\dfrac{«ssr»}{«n»-1}=«sr2»$。
          $$\hat V(\hat p)=\frac{«omf»}{«n»\times«Mbar2»}\times«sr2»=«V»,\qquad \sqrt{\hat V}=«se6»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** 「箱 «sM» 個の単純無作為抽出」とみなした二項分布の標準誤差 $\sqrt{«p»\times(1-«p»)/«sM»}=«se_bin»$ は、集落抽出の標準誤差ではない（ここでは破損がパレット間で均等に近いため、集落抽出のほうが小さい）。
          有限母集団修正 $1-f$ を落とすと $«se_nofpc»$、$n-1$ の代わりに $n$ で割ると $«se_n»$ になる。

  - id: s22p11
    title: 物流拠点の運営データの多変量解析
    context: |
      ある物流会社が、全国の物流拠点の運営データを多変量解析やグラフィカルモデルで整理している。
    items:
      - id: s22p11a
        chapter: 22
        terms: [principal-component-analysis, low-rank-approximation, principal-component-score]
        topic: 等相関の3指標の第1主成分だけで標準化した拠点の値を近似したときの再構成誤差を求める
        level: 標準
        definition: false
        type: choice
        question: |
          出荷件数・人件費・床面積の 3 指標の相関係数は、どの 2 つの間も «rr» だった。このとき相関行列の第 1 主成分の固有ベクトルは $(1,1,1)/\sqrt3$（固有値 «ev1»）である。
          ある拠点の標準化した値は $z=(«z1»,\ «z2»,\ «z3»)$ だった。この拠点の値を第 1 主成分だけで近似したとき、近似の誤差の 2 乗和 $\|z-\hat z\|^2$ に最も近いものはどれか。
        choices:
          - "$«sc2»$"
          - "$«w_nosq»$"
          - "$«rss»$"
          - "$«tot»$"
          - "$«w_un»$"
        answer: 2
        distractors:
          - 第1主成分得点の2乗（近似で説明できた部分）を答えた
          - 全体の2乗和から得点を2乗せずに引いた
          - 正解
          - 近似する前の2乗和を答えた
          - 固有ベクトルを長さ1に正規化せず (1,1,1) のまま射影した
        explanation: |
          **方針** 第 1 主成分得点 $t=v^\top z$（$v$ は長さ 1 の固有ベクトル）を求め、近似 $\hat z=t\,v$ との差の 2 乗和を計算する。直交射影なので $\|z\|^2=t^2+\|z-\hat z\|^2$ も成り立つ。

          **途中式** $t=\dfrac{«z1»+«z2»+(«z3»)}{\sqrt3}=\dfrac{«sz»}{\sqrt3}=«score»$。$\hat z=t\cdot\dfrac{(1,1,1)}{\sqrt3}=\dfrac{«sz»}{3}(1,1,1)=(«recon»,«recon»,«recon»)$。
          $$z-\hat z=(«e1»,\ «e2»,\ «e3»),\qquad \|z-\hat z\|^2=«e1»^2+«e2»^2+(«e3»)^2=«rss»$$
          確認：$\|z\|^2=«tot»$、$t^2=«sc2»$ で、$«tot»-«sc2»=«rss»$。

          **答え** $«rss»$

          **間違えやすい点** 射影には長さ 1 に正規化したベクトルを使う。$(1,1,1)$ のまま $\hat z=«sz»\times(1,1,1)$ とすると $«w_un»$ になる。
          この拠点は指標の「全体の水準」は平均並みで、指標間の「違い」（出荷件数が多く床面積が小さい）が大きいため、第 1 主成分だけでは近似しにくい。

      - id: s22p11b
        chapter: 25
        terms: [directed-acyclic-graph, undirected-graphical-model, graphical-model]
        topic: 物流指標の有向非巡回グラフをモラル化して無向グラフにするときに加える辺を親どうしの結合から求める
        level: 標準
        definition: false
        type: choice
        question: |
          拠点の運営データについて、次の有向非巡回グラフ（DAG）を考える。変数は 天候 $W$、需要 $M$、配送遅延 $D$、配置人員 $S$、残業 $O$、苦情 $C$ で、矢印は
          $$W\to D,\quad M\to D,\quad M\to S,\quad S\to O,\quad D\to C,\quad O\to C$$
          である。この DAG と同じ同時分布の因数分解を表す無向グラフを作るため、モラル化（同じ子をもつ親どうしを辺で結び、矢印の向きを取り除く）を行う。新たに加わる辺として正しいものはどれか。
        choices:
          - "$W-M$ の 1 本"
          - "$W-M$ と $D-O$ の 2 本"
          - "$W-M$、$D-O$、$M-O$ の 3 本"
          - "辺は加わらず、矢印の向きを取り除くだけでよい"
          - "$D-O$ の 1 本"
        answer: 1
        distractors:
          - 苦情 C の親 D と O を結び忘れた
          - 正解
          - 祖父母 M と孫 O まで結んだ（親どうしだけを結ぶ）
          - 合流点の親どうしを結ばないと、元の DAG にない条件付き独立を表してしまうことを見落とした
          - 遅延 D の親 W と M を結び忘れた
        explanation: |
          **方針** DAG の同時分布は $p(W)p(M)p(D\mid W,M)p(S\mid M)p(O\mid S)p(C\mid D,O)$ と因数分解される。各因子に現れる変数どうしが無向グラフで互いに結ばれている必要があるので、2 つ以上の親をもつ子について、その親どうしを結ぶ。

          **途中式** 親が 2 つ以上あるのは
          - $D$：親は $W$ と $M$ → $W-M$ を加える
          - $C$：親は $D$ と $O$ → $D-O$ を加える

          $S$ と $O$ の親は 1 つだけなので加える辺はない。

          **答え** $W-M$ と $D-O$ の 2 本

          **間違えやすい点** 向きを取り除くだけでは、たとえば無向グラフ上で $W$ と $M$ が $D$ で分離され「$D$ を与えると $W$ と $M$ が独立」と読めてしまうが、DAG では $D$ は合流点で、$D$ を条件にすると $W$ と $M$ は独立でなくなる。
          モラル化した無向グラフは、DAG の条件付き独立の一部を失う（$W$ と $M$ の周辺独立は表せない）代わりに、DAG にない独立性を誤って表すことはない。

      - id: s22p11c
        chapter: 26
        terms: [structural-equation-modeling, goodness-of-fit-indices]
        topic: 拠点評価の構造方程式モデルの自由度を観測変数の数と自由母数の数から数えRMSEAを求める
        level: 基本
        definition: false
        type: numeric
        question: |
          拠点の「運営力」と「顧客満足」という 2 つの潜在変数を、観測変数 «pobs» 個で測る構造方程式モデルを、«nobs» 拠点のデータに当てはめた。
          推定した自由母数は «qfree» 個、適合度のカイ二乗値は $\chi^2=«chi»$ だった。モデルの自由度 $df$ を数え、
          $$\mathrm{RMSEA}=\sqrt{\frac{\max(\chi^2-df,\ 0)}{df\,(n-1)}}$$
          を求めよ（$n$ は拠点数）。
        answer: «rmsea»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 自由度は「観測変数の分散共分散行列の異なる要素の数」−「自由母数の数」。観測変数が $p$ 個なら異なる要素は $p(p+1)/2$ 個（分散 $p$ 個と共分散 $p(p-1)/2$ 個）。

          **途中式** $p=«pobs»$ なので $\dfrac{«pobs»\times7}{2}=«mom»$。$df=«mom»-«qfree»=«dfm»$。
          $$\mathrm{RMSEA}=\sqrt{\frac{«chi»-«dfm»}{«dfm»\times«n1»}}=\sqrt{\frac{«rnum»}{«rden»}}=\sqrt{«rratio»}=«rmsea4»\cdots$$

          **答え** $«rmsea_s»$（目安の 0.05 以下や 0.08 以下を上回り、当てはまりはよいとはいえない）

          **間違えやすい点** 分散を数え忘れて共分散だけ $p(p-1)/2=15$ 個とすると $df=«dfw»$ となり、RMSEA は $«rm_w»$ になる。分子で自由度を引き忘れると $«rm_nosub»$。
          RMSEA は「自由度 1 あたりの当てはまりの悪さ」を標本の大きさで調整した指標で、カイ二乗値そのものと違い標本が大きいだけでは悪くならない。

  - id: s22p12
    title: 日次出荷量の短期予測
    context: |
      ある倉庫の日次出荷量（百個）$X_t$ に、MA(1) モデル
      $$X_t=«mu»+\varepsilon_t+«th»\,\varepsilon_{t-1}$$
      を当てはめた（$\varepsilon_t$ は平均 0、分散 $\sigma^2$ のホワイトノイズ）。直近 3 日の出荷量は $x_1=«x1»$、$x_2=«x2»$、$x_3=«x3»$ で、$x_1$ の前日の誤差は $\varepsilon_0=0$ とみなす。
    items:
      - id: s22p12a
        chapter: 27
        terms: [ma-model, forecasting, invertibility]
        topic: MA(1)モデルで誤差を逐次計算して1期先と2期先の予測値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          4 日目と 5 日目の出荷量の予測値 $(\hat x_4,\ \hat x_5)$ の組として正しいものはどれか。
        choices:
          - "$(«naive»,\\ «f2»)$"
          - "$(«f1»,\\ «f2»)$"
          - "$(«f1»,\\ «ar2»)$"
          - "$(«naive»,\\ «nai2»)$"
          - "$(«wrong»,\\ «f2»)$"
        answer: 1
        distractors:
          - 直近の誤差を x3−平均 とし、誤差を逐次計算しなかった
          - 正解
          - 2期先も AR(1) のように係数を掛けて平均に近づけた（MA(1) は2期先で平均に戻る）
          - AR(1) とみなして平均からの偏差に係数を掛け続けた
          - 1 日前ではなく 2 日前の誤差 ε2 を使った
        explanation: |
          **方針** 観測値から誤差を順に復元する：$\varepsilon_t=x_t-«mu»-«th»\varepsilon_{t-1}$。1 期先の予測は未来の誤差の期待値 0 を代入して $\hat x_{4}=«mu»+«th»\varepsilon_3$、2 期先は既知の誤差が入らないので $\hat x_5=«mu»$。

          **途中式**
          $$\varepsilon_1=«x1»-«mu»-«th»\times0=«e1»,\quad \varepsilon_2=«x2»-«mu»-«th»\times«e1»=«e2»,\quad \varepsilon_3=«x3»-«mu»-«th»\times(«e2»)=«e3»$$
          $$\hat x_4=«mu»+«th»\times«e3»=«mu»+«the3»=«f1»,\qquad \hat x_5=E[«mu»+\varepsilon_5+«th»\varepsilon_4]=«f2»$$

          **答え** $(\hat x_4,\hat x_5)=(«f1»,\ «f2»)$

          **間違えやすい点** 誤差 $\varepsilon_3$ は $x_3-«mu»$ ではない（前日の誤差の影響を引く）。そのまま使うと $«naive»$ になる。
          MA(1) の自己相関は 1 次だけなので、2 期先以降の予測は平均 «mu» に一致する（予測誤差分散は 1 期先 $\sigma^2$、2 期先以降 $(1+«th»^2)\sigma^2=«v2»\sigma^2$）。誤差を逐次復元できるのは反転可能（$|\theta|<1$）だからである。

