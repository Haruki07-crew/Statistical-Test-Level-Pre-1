    title: 施肥量・日照と収量の相関
    context: |
      水田の多数の圃場で、収量 $Y$、窒素施肥量 $X_1$、生育期の日照時間 $X_2$ を調べたところ、相関係数は次のとおりだった。

      | | $Y$ と $X_1$ | $Y$ と $X_2$ | $X_1$ と $X_2$ |
      |---|---|---|---|
      | 相関係数 | «ry1» | «ry2» | «r12» |

      谷あいの圃場ほど施肥量が多く日照が短いため、$X_1$ と $X_2$ は負の相関をもつ。
    items:
      - id: s09p08a
        chapter: 3
        terms: [covariance-and-correlation, expectation-variance-properties]
        topic: 標準化した施肥量と日照時間の和で作った指標と収量の相関係数を共分散の性質から求める
        level: 基本
        definition: false
        type: choice
        question: |
          施肥量と日照時間をそれぞれ標準化した $Z_1,Z_2$ を足して、「生育条件指標」$W=Z_1+Z_2$ を作った。$W$ と収量 $Y$ の相関係数に最も近い値はどれか。
        choices:
          - "$«w_avg»$"
          - "$«w_nocov»$"
          - "$«rz»$"
          - "$«w_one»$"
          - "$«w_sum»$"
        answer: 2
        distractors:
          - 2つの相関係数を平均した
          - W の分散で Z1 と Z2 の共分散を無視して 2 とした
          - 正解
          - W の分散で共分散の 2 倍を付け忘れた
          - W の標準偏差で割らず、共分散 Cov(Y,W) を相関係数とした
        explanation: |
          **方針** 相関係数は $\mathrm{Cov}(Y,W)/\sqrt{V[Y]V[W]}$。$Y$ も標準化して考えてよい（相関係数は尺度によらない）。共分散の双線形性と、和の分散 $V[Z_1+Z_2]=V[Z_1]+V[Z_2]+2\mathrm{Cov}(Z_1,Z_2)$ を使う。

          **途中式** 標準化した変数では共分散は相関係数に等しいので
          $$\mathrm{Cov}(Y,W)=r_{Y1}+r_{Y2}=«ry1»+«ry2»=«cz»,\qquad V[W]=1+1+2\times(«r12»)=«vz»$$
          $$\mathrm{Corr}(Y,W)=\frac{«cz»}{\sqrt{«vz»}}=\frac{«cz»}{«sqvz»}=«rz4»\cdots$$

          **答え** $«rz»$

          **間違えやすい点** $Z_1$ と $Z_2$ は負の相関をもつので、和の分散は 2 より小さい «vz» になる。共分散を無視すると $«cz»/\sqrt2=«w_nocov»$ と過小になる。
          相関係数の平均（$«w_avg»$）は意味のある量ではない。$W$ の相関がどちらの単相関より大きくなるのは、負の相関の分だけ $W$ のばらつきが小さくなるため。

      - id: s09p08b
        chapter: 16
        terms: [normal-equations, standardized-partial-regression-coefficient, coefficient-of-determination]
        topic: 2つの説明変数と目的変数の相関係数から正規方程式を解いて標準化偏回帰係数と決定係数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          3 変数をすべて標準化して、$Y$ を $X_1$ と $X_2$ に重回帰する（最小二乗法）。このときの決定係数 $R^2$ を求めよ。
        answer: «R2»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 標準化した変数の正規方程式は、相関行列を使って
          $$\begin{pmatrix}1&r_{12}\\r_{12}&1\end{pmatrix}\begin{pmatrix}\beta_1\\\beta_2\end{pmatrix}=\begin{pmatrix}r_{Y1}\\r_{Y2}\end{pmatrix}$$
          となる。これを解いて標準化偏回帰係数を求め、$R^2=\beta_1r_{Y1}+\beta_2r_{Y2}$ を使う。

          **途中式**
          $$\beta_1=\frac{r_{Y1}-r_{12}r_{Y2}}{1-r_{12}^2}=\frac{«bn1»}{«c2»}=«b1»,\qquad\beta_2=\frac{r_{Y2}-r_{12}r_{Y1}}{1-r_{12}^2}=\frac{«bn2»}{«c2»}=«b2»$$
          $$R^2=«b1»\times«ry1»+«b2»\times«ry2»=«t1»+«t2»=«R2f»\cdots$$

          **答え** $«R2»$

          **間違えやすい点** 説明変数どうしに相関があるので、$R^2$ は単相関の 2 乗の和 $«ry1»^2+«ry2»^2=«w_sumsq»$ にはならない。ここでは $X_1$ と $X_2$ が負の相関をもつので、和より大きくなる。
          **別解** $R^2=\dfrac{r_{Y1}^2+r_{Y2}^2-2r_{Y1}r_{Y2}r_{12}}{1-r_{12}^2}=\dfrac{«R2num»}{«c2»}$ でも同じ値になる。

      - id: s09p08c
        chapter: 19
        terms: [ridge-regression, regularization, multicollinearity]
        topic: 相関のある2つの標準化説明変数のリッジ回帰推定値を和と差の方向に分けて求める
        level: 応用
        definition: false
        type: choice
        question: |
          前問と同じ標準化した変数で、リッジ回帰
          $$\min_{\beta_1,\beta_2}\ \frac1n\sum_{i=1}^n\left(y_i-\beta_1x_{1i}-\beta_2x_{2i}\right)^2+\lambda\left(\beta_1^2+\beta_2^2\right),\qquad\lambda=«lam»$$
          を行う（標準化は $\frac1n\sum x_{ji}^2=1$ となるように行い、標本相関係数は上の表の値とする）。推定値 $(\hat\beta_1,\hat\beta_2)$ の組として最も近いものはどれか。
        choices:
          - "$(«o1»,\\ «o2»)$"
          - "$(«h1»,\\ «h2»)$"
          - "$(«i1»,\\ «i2»)$"
          - "$(«m1»,\\ «m2»)$"
          - "$(«k1»,\\ «k2»)$"
        answer: 4
        distractors:
          - 罰則を無視して最小二乗推定値（標準化偏回帰係数）を答えた
          - 最小二乗推定値を一律に 1/(1+λ) 倍した（直交計画でしか成り立たない）
          - 説明変数間の相関を無視し、単相関を 1+λ で割った
          - 正規方程式で λ を対角に足すべきところを引いた
          - 正解
        explanation: |
          **方針** 目的関数を微分して 0 とおくと $(R+\lambda I)\boldsymbol\beta=\boldsymbol r$（$R$ は説明変数の相関行列、$\boldsymbol r=(r_{Y1},r_{Y2})^\top$）。$R$ の固有ベクトルは $(1,1)$ と $(1,-1)$ なので、和 $u=\beta_1+\beta_2$ と差 $v=\beta_1-\beta_2$ に分けると 1 次方程式になる。

          **途中式** 2 本の式を足すと $(1+r_{12}+\lambda)u=r_{Y1}+r_{Y2}$、引くと $(1-r_{12}+\lambda)v=r_{Y1}-r_{Y2}$。
          $$u=\frac{«us»}{«ud»}=«u»,\qquad v=\frac{«vs»}{«vd»}=«v»$$
          $$\hat\beta_1=\frac{u+v}{2}=«k1»,\qquad\hat\beta_2=\frac{u-v}{2}=«k2»$$

          **答え** $(«k1»,\ «k2»)$

          **間違えやすい点** 「最小二乗推定値の $1/(1+\lambda)$ 倍」は説明変数が直交（無相関）のときだけ成り立つ。相関があると、縮み方は固有値 $1\pm r_{12}$ の方向ごとに違い、$1/(1+r_{12}+\lambda)$ と $1/(1-r_{12}+\lambda)$ で別々に縮む。
          リッジ回帰では $\lambda$ を相関行列の対角に**足す**ので、推定値は最小二乗推定値 $(«o1»,\ «o2»)$ より 0 に近づく。

