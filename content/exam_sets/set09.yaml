          | $i$ | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $h_{ii}$ | «h1» | «h2» | «h3» | «h4» | «h5» | «h6» |
          | $e_i/(1-h_{ii})$ | «pr1» | «pr2» | «pr3» | «pr4» | «pr5» | «pr6» |
          | 2 乗 | «pq1» | «pq2» | «pq3» | «pq4» | «pq5» | «pq6» |

          2 乗の合計（PRESS）は $«press»$ で
          $$\mathrm{CV}=\frac{«press»}{6}=«cv4»$$

          **答え** $«cv3»$

          **間違えやすい点** 残差の 2 乗の平均 $\sum e_i^2/6=«w_train»$（訓練誤差）は、当てはめに使った点で測るので予測誤差を小さく見積もる。CV はその約 «ratio» 倍で、特にてこ比の大きい 6 回目は残差 «e6» が $1-h_{66}=«om6»$ で割られて «pr6» に膨らむ。
          6 で割らずに PRESS（$«press»$）を答えたり、$1-h_{ii}$ を 2 乗せずに $e_i^2/(1-h_{ii})$ の平均（$«w_nosq2»$）としたりしない。

  - id: s09p10
    title: 林業試験地の調査と試験
    context: |
      県の林業試験場が、スギ林の材積の調査と苗木の比較試験を行っている。
    items:
      - id: s09p10a
        chapter: 21
        terms: [probability-proportional-to-size-sampling, two-stage-sampling, inclusion-probability]
        topic: 立木本数に比例する確率で林区を復元抽出し林区内で副次抽出したときハンセン・ハーヴィッツ推定量で森林全体の材積を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          «Np» の林区からなるスギ林があり、立木の総数は台帳から $M_0=«M0»$ 本とわかっている。第 1 段として、各回、林区 $i$ をその立木の本数 $M_i$ に比例する確率 $p_i=M_i/M_0$ で選ぶ抽出を «np» 回、復元で行った（確率比例抽出）。選ばれたのは異なる «np» 林区で、各林区ではその林区の全立木から «mp» 本を単純無作為に選んで材積を測った。
          選んだ林区の立木の本数 $M_i$ と、測った «mp» 本の 1 本あたり平均材積 $\bar y_i$（m³）は次のとおりである。

          | 林区 | 1 | 2 | 3 |
          |---|---|---|---|
          | 立木の本数 $M_i$ | «M1» | «M2» | «M3» |
          | 1 本あたり平均材積 $\bar y_i$ | «yb1» | «yb2» | «yb3» |

          林区 $i$ の総材積の推定値を $\hat\tau_i=M_i\bar y_i$ とし、ハンセン・ハーヴィッツ推定量 $\hat\tau=\dfrac1n\sum_i\dfrac{\hat\tau_i}{p_i}$ で森林全体の材積の総量を推定せよ（$n=«np»$）。
        answer: «est»
        tolerance: 0.5
        answer_format: 小数第1位を四捨五入して整数で答えよ。±0.5 の差まで正解とする。
        explanation: |
          **方針** 確率比例抽出では、選ばれた林区の総量を選ばれる確率 $p_i$ で割ると、それぞれが森林全体の総量の不偏推定値になる。«np» 回分を平均する。

          **途中式** $\dfrac{\hat\tau_i}{p_i}=\dfrac{M_i\bar y_i}{M_i/M_0}=M_0\bar y_i$ なので、$M_i$ は約分されて
          $$\hat\tau=\frac{M_0}{n}\sum_i\bar y_i=\frac{«M0»}{«np»}\times(«yb1»+«yb2»+«yb3»)=«fac»\times«ysum»=«est1»$$

          **答え** $«est»$ m³

          **間違えやすい点** 林区を等確率で選んだときの推定量 $\dfrac{N}{n}\sum_iM_i\bar y_i=«w_eq»$ を使うのは誤り。大きい林区ほど選ばれやすいので、そのまま足すと大きい林区の分を過大に数える。$p_i$ で割って選ばれやすさを打ち消すのがこの推定量の考え方である。
          選んだ林区の 1 本あたり材積を本数で重み付けた比推定 $M_0\sum_iM_i\bar y_i/\sum_iM_i=«w_ratio»$ も、大きい林区を二重に重視することになり、この抽出法の推定量としては偏る。

      - id: s09p10b
        chapter: 20
        terms: [latin-square-design, sum-of-squares-decomposition, f-distribution]
        topic: 5行5列のラテン方格の苗木試験で誤差自由度を数えて産地のF値を求め判定する
        level: 標準
        definition: false
        type: choice
        question: |
          5 つの産地 A〜E のスギ苗木の成長量を比べるため、斜面を標高で 5 行、東西方向に 5 列に区切り、各行・各列に各産地が 1 回ずつ現れる 5×5 のラテン方格で植えた。
          1 年後の伸長量（cm）の平方和は、行 «ssr»、列 «ssc»、産地 «sst»、総平方和 «sstot» だった（交互作用はないとする）。
          $F_{0.05}(4,12)=«F412»$、$F_{0.05}(12,4)=«F124»$、$F_{0.05}(4,16)=«F416»$、$F_{0.05}(4,20)=«F420»$ とする。産地の効果の $F$ 検定について正しいものはどれか。
        choices:
          - "$F=«w_rb»$ で、$«F416»$ を超えるので産地による差があるといえる"
          - "$F=«F»$ で、$«F412»$ を超えるので産地による差があるといえる"
          - "$F=«w_one»$ で、$«F420»$ を超えるので産地による差があるといえる"
          - "$F=«w_20»$ で、$«F420»$ を超えるので産地による差があるといえる"
          - "$F=«F»$ で、$«F124»$ を超えないので産地による差があるとはいえない"
        answer: 1
        distractors:
          - 列のブロックを無視し、行だけの乱塊法として列の平方和を誤差に含めた
          - 正解
          - 行も列も無視し、一元配置として解析した
          - 誤差平方和は正しいが、誤差自由度を総自由度から産地の自由度だけを引いた 20 とした
          - F 分布の自由度の順番を逆にした
        explanation: |
          **方針** ラテン方格では総平方和を 行・列・処理（産地）・誤差 に分解する。$k\times k$ のラテン方格の自由度は行・列・処理がそれぞれ $k-1$、誤差は $(k-1)(k-2)$。

          **途中式** 誤差平方和 $=«sstot»-«ssr»-«ssc»-«sst»=«sse»$。自由度は産地 $«dft»$、誤差 $(5-1)(5-2)=«dfe»$（総自由度 $«dftot»=4+4+4+12$）。

          | 要因 | 平方和 | 自由度 | 平均平方 |
          |---|---|---|---|
          | 行 | «ssr» | 4 | |
          | 列 | «ssc» | 4 | |
          | 産地 | «sst» | «dft» | «mst» |
          | 誤差 | «sse» | «dfe» | «mse» |

          $F=«mst»/«mse»=«F»>F_{0.05}(4,12)=«F412»$。

          **答え** $F=«F»$、有意水準 5% で産地による差があるといえる。

          **間違えやすい点** 行と列の 2 方向のブロックを両方とも誤差から取り除くので、誤差自由度は 12 と小さい。列を無視すると誤差に列の変動が混ざり $F=«w_rb»$、一元配置では $F=«w_one»$ と検出力が落ちる。
          $F$ 分布の自由度は（分子 = 産地 4、分母 = 誤差 12）の順。

  - id: s09p11
    title: テーピングと足首の捻挫
    context: |
      ある地域リーグの大学バスケットボール選手 «ntot» 人を 1 シーズン追跡し（コホート研究）、足首にテーピングをしていたかどうかと捻挫の有無を調べた。

      | | 捻挫あり | 捻挫なし | 計 |
      |---|---|---|---|
      | テーピングあり | «x1» | «m1» | «n1» |
      | テーピングなし | «x0» | «m0» | «n0» |
    items:
      - id: s09p11a
        chapter: 28
        terms: [relative-risk, cohort-and-case-control-study, odds-ratio-interval]
        topic: テーピングと捻挫のコホート研究で相対危険の95%信頼区間を対数変換で求める
        level: 標準
        definition: false
        type: choice
        question: |
          テーピングなしに対するテーピングありの捻挫の相対危険（リスク比）の 95% 信頼区間を、対数相対危険の正規近似
          （標準誤差 $\sqrt{\frac{1}{a}-\frac{1}{n_1}+\frac{1}{c}-\frac{1}{n_0}}$、$a,c$ は各群の捻挫数、$n_1,n_0$ は各群の人数）で求める。
          標準正規分布の上側 2.5% 点は 1.96、$\log 0.5=«lnrr»$ とし、必要なら次の値を使え。最も近い区間はどれか。

          | $x$ | «ex0» | «ex1» | «ex2» | «ex3» | «ex4» | «ex5» |
          |---|---|---|---|---|---|---|
          | $e^{x}$ | «ev0» | «ev1» | «ev2» | «ev3» | «ev4» | «ev5» |
        choices:
          - "$(«elo»,\\ «ehi»)$"
          - "$(«w1lo»,\\ «w1hi»)$"
          - "$(«w2lo»,\\ «w2hi»)$"
          - "$(«w3lo»,\\ «w3hi»)$"
          - "$(«w4lo»,\\ «w4hi»)$"
        answer: 0
        distractors:
          - 正解
          - 標準誤差の -1/n1, -1/n0 の項を入れ忘れた
          - 対数をとらずに相対危険そのものに正規近似を当てはめた
          - 両側95%なのに片側の 1.645 を使った
          - 対数スケールの区間を指数変換し忘れた
        explanation: |
          **方針** 相対危険の推定量は分布が右に歪むので、対数をとってから正規近似で区間を作り、端点を指数変換して戻す。

          **途中式** 捻挫の割合はテーピングあり $«x1»/«n1»=«p1»$、なし $«x0»/«n0»=«p0»$ で、相対危険は $«p1»/«p0»=«rr»$、$\log«rr»=«lnrr»$。
          $$\mathrm{se}=\sqrt{\frac{1}{«x1»}-\frac{1}{«n1»}+\frac{1}{«x0»}-\frac{1}{«n0»}}=\sqrt{«inv1»-«inv2»+«inv3»-«inv4»}=\sqrt{«v»}=«se»$$
          $1.96\times«se»=«hw»$ より、対数スケールの区間は $«lnrr»\pm«hw»=(«lo»,\ «hi»)$。指数変換して
          $$(e^{«lo»},\ e^{«hi»})=(«elo»,\ «ehi»)$$

          **答え** $(«elo»,\ «ehi»)$。1 を含まないので、テーピングありの捻挫のリスクは有意に低い。

          **間違えやすい点** 相対危険の標準誤差には $-1/n_1$、$-1/n_0$ が入る（オッズ比の $1/a+1/b+1/c+1/d$ とは形が違う）。落とすと $\sqrt{1/«x1»+1/«x0»}=«sew»$ で区間がやや広がる。
          対数をとらずに $«rr»\pm1.96\times«se»$ とすると $(«w2lo»,\ «w2hi»)$ と負の値を含む不自然な区間になる。区間は $«rr»$ について対称でないのが正しい。

  - id: s09p12
    title: マラソン選手の記録の予測
    context: |
      ある市民ランナーのフルマラソンの実力 $\mu$（分）を、練習記録から得た事前分布と大会の記録から推定する。
      事前分布は $\mu\sim N(«m0»,\,«tau»^2)$ とし、$\mu$ が与えられたとき各大会の記録は独立に $N(\mu,\,«sig»^2)$ に従うとする。
      この選手の最近 «n» 大会の記録の平均は «xbar» 分だった。
    items:
      - id: s09p12a
        chapter: 31
        terms: [normal-normal-model, predictive-distribution, posterior-distribution]
        topic: 正規事前分布と正規観測から次のレースの記録が基準を下回る事後予測確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          次の大会でこの選手の記録が «c» 分を下回る確率を、事後予測分布を用いて求める。最も近い値はどれか。
          標準化した値は小数第2位に丸め、必要なら次の標準正規分布の分布関数の値を使え。

          | $z$ | 0.25 | 0.51 | 0.56 | 1.00 | 1.34 |
          |---|---|---|---|---|---|
          | $\Phi(z)$ | «phi025» | «phi051» | «phi056» | «phi100» | «phi134» |
        choices:
          - "$«ans»$"
          - "$«w_data»$"
          - "$«w_plug»$"
          - "$«w_post»$"
          - "$«w_prior»$"
        answer: 0
        distractors:
          - 正解
          - 事前分布を使わず、標本平均 172 と観測の標準偏差 8 だけで計算した
          - 事後平均を使ったが、μ の不確かさを無視して観測の分散 64 だけを使った
          - 事後予測分布ではなく μ の事後分布の分散を使った（μ<170 の確率）
          - データを使わず、事前予測分布 N(180, 36+64) で計算した
        explanation: |
          **方針** 正規分布どうしの共役性から、$\mu$ の事後分布は正規分布で、精度（分散の逆数）は事前の精度とデータの精度の和、平均は精度で重み付けた平均。次の記録 $\tilde x=\mu+\varepsilon$ の事後予測分布は、平均が事後平均、分散が「事後分散 + 観測の分散」の正規分布。

          **途中式** 事前の精度 $1/«tau2»=«pr0»$、データの精度 $«n»/«sig2»=«pr1»$、事後の精度 $«prec»$。
          $$\text{事後平均}=\frac{«m0»/«tau2»+«xbar»\times«n»/«sig2»}{1/«tau2»+«n»/«sig2»}=«m0»+«w»\times(«xbar»-«m0»)=«pm»,\qquad\text{事後分散}=\frac{1}{«prec»}=«pv»$$
          事後予測分布は $N(«pm»,\ «pv»+«sig2»)=N(«pm»,\ «predv»)$、標準偏差 $«predsd»$。
          $$P(\tilde x<«c»)=\Phi\left(\frac{«c»-«pm»}{«predsd»}\right)\approx\Phi(-«z»)=1-«phi051»=«ans»$$

          **答え** $«ans»$

          **間違えやすい点** 事後分散 $«pv»$ だけを使うと「実力 $\mu$ が «c» 分未満である確率」（$z=-«zpost»$ で $«w_post»$）になり、1 回のレースのばらつきが抜ける。
          逆に事後平均に観測の分散 $«sig2»$ だけを使う（$z=-«zplug»$ で $«w_plug»$）と、$\mu$ の推定の不確かさを無視している。予測では両方の分散を足す。
          なお、標準化した値を丸めずに $«zraw»$ のまま正確な $\Phi$ を使うと $«pexact»$ になるが、問題の指示どおり $-«z»$ に丸めて表の値を使うと $«ans»$ になる。どちらでも最も近い選択肢は $«ans»$ である。
