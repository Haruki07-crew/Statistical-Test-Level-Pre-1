    title: 河川の濁度の回帰モデル
    context: |
      ある河川で、流量 $x$（m³/s）から濁度 $y$ を予測する単回帰 $y=\alpha+\beta x+\varepsilon$ を、6 回の観測に最小二乗法で当てはめた。流量と残差 $e_i$ は次のとおりである。6 回目は大雨の後の観測である。

      | $i$ | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|
      | $x_i$ | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» |
      | $e_i$ | «e1» | «e2» | «e3» | «e4» | «e5» | «e6» |

      てこ比を $h_{ii}$ とし、$i$ 番目の観測を除いて当てはめ直した直線による $x_i$ での予測値を $\hat y_{(i)}$ とすると、$y_i-\hat y_{(i)}=\dfrac{e_i}{1-h_{ii}}$ が成り立つ（当てはめ直さずに計算できる）。
    items:
      - id: s09p09a
        chapter: 17
        terms: [dffits, leverage, outlier-and-influential-point]
        topic: 残差は小さいがてこ比の大きい1点のDFFITSを除いた誤差分散から求め影響点の目安と比べて判定する
        level: 標準
        definition: false
        type: choice
        question: |
          6 回目の観測の影響を DFFITS
          $$\mathrm{DFFITS}_6=\frac{\hat y_6-\hat y_{6(6)}}{s_{(6)}\sqrt{h_{66}}}$$
          で調べる。ここで $\hat y_6$ は 6 点すべてで当てはめた直線の $x_6$ での値、$\hat y_{6(6)}$ は 6 回目を除いて当てはめ直した直線の $x_6$ での値、$s_{(6)}$ は 6 回目を除いた 5 点の回帰による誤差の標準偏差の推定値である。
          6 点の回帰による誤差分散の推定値は $s^2=«s2»$、6 回目を除いた推定値は $s_{(6)}^2=«s62»$ だった。影響が大きいかどうかの目安を $|\mathrm{DFFITS}|>2\sqrt{p/n}$（$p$ は切片を含む係数の数）とするとき、正しいものはどれか。
        choices:
          - "$\\mathrm{DFFITS}_6=«w_noh»$ で、目安 $«thr»$ を下回るので、6 回目の影響は小さい"
          - "$\\mathrm{DFFITS}_6=«w_t6»$ で、目安 $«thr»$ を下回るので、6 回目の影響は小さい"
          - "$\\mathrm{DFFITS}_6=«w_nosq»$ で、目安 $«thr»$ を超えるので、6 回目は影響の大きい観測である"
          - "$\\mathrm{DFFITS}_6=«dff»$ で、目安 $«thr»$ を超えるので、6 回目は影響の大きい観測である"
          - "$\\mathrm{DFFITS}_6=«w_s»$ で、目安 $«thr»$ を超えるので、6 回目は影響の大きい観測である"
        answer: 3
        distractors:
          - 予測値の差を h e/(1-h) ではなく h e とし、1-h で割り忘れた
          - 外部スチューデント化残差 e/(s_(6)√(1-h)) を DFFITS と取り違え、因子 √(h/(1-h)) を掛け忘れた
          - 因子 √(h/(1-h)) の平方根をとり忘れ、h/(1-h) を掛けた
          - 正解
          - 6 回目を除いた s_(6) ではなく、6 点すべての s を使った
        explanation: |
          **方針** 与えられた関係から $\hat y_6-\hat y_{6(6)}$ を残差とてこ比で表し、定義に代入する。てこ比は単回帰の公式 $h_{ii}=\dfrac1n+\dfrac{(x_i-\bar x)^2}{S_{xx}}$（$S_{xx}=\sum(x_j-\bar x)^2$）で求める。

          **途中式** $\bar x=«xb»$、偏差は $-3,-2,-1,0,1,5$、$S_{xx}=«sxx»$ なので
          $$h_{66}=\frac16+\frac{«dev62»}{«sxx»}=«h6»,\qquad 1-h_{66}=«om6»$$
          $y_6-\hat y_6=e_6$ と $y_6-\hat y_{6(6)}=e_6/(1-h_{66})$ の差をとると
          $$\hat y_6-\hat y_{6(6)}=\frac{e_6}{1-h_{66}}-e_6=\frac{h_{66}e_6}{1-h_{66}}$$
          よって
          $$\mathrm{DFFITS}_6=\frac{e_6\sqrt{h_{66}}}{s_{(6)}(1-h_{66})}=\frac{«e6»\times«sqh6»}{«s6»\times«om6»}=«dff4»$$
          目安は $p=2$、$n=6$ で $2\sqrt{2/6}=«thr»$。$«dff»>«thr»$ なので影響が大きい。

          **答え** $\mathrm{DFFITS}_6=«dff»$ で目安を超え、6 回目は影響の大きい観測である。

          **間違えやすい点** 6 回目の残差 «e6» は 6 点の中で 2 番目に小さく、外部スチューデント化残差 $e_6/(s_{(6)}\sqrt{1-h_{66}})=«w_t6»$ も小さい。しかしてこ比が «h6» と大きいので、直線が 6 回目に強く引き寄せられて残差が小さく見えているだけで、除くと予測値が大きく動く。DFFITS は外部スチューデント化残差に $\sqrt{h_{66}/(1-h_{66})}=«fac6»$ を掛けたもので、この因子を落とすと $«w_t6»$ と過小評価する。
          $s$ は 6 回目自身の影響を受けるので、DFFITS では 6 回目を除いた $s_{(6)}$ を使う（$s$ を使うと $«w_s»$）。

      - id: s09p09b
        chapter: 30
        terms: [leave-one-out-cv, cross-validation, generalization-error]
        topic: 6点の単回帰で一個抜き交差検証の予測二乗誤差の平均を残差とてこ比から当てはめ直さずに求め訓練誤差と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          このモデルの予測精度を一個抜き交差検証（LOOCV）で評価する。各 $i$ について $i$ 番目を除いて当てはめ直し、$i$ 番目を予測したときの誤差の 2 乗の平均
