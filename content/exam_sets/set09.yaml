        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 前提に示した関係 $y_i-\hat y_{(i)}=e_i/(1-h_{ii})$ を使えば、6 回当てはめ直さなくてよい。てこ比は $h_{ii}=\dfrac16+\dfrac{(x_i-\bar x)^2}{«sxx»}$。

