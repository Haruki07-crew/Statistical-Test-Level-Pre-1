set: 9
title: 模擬試験 第9回
minutes: 90
problems:
  - id: s09p01
    title: 野鳥の鳴き声の自動識別
    context: |
      湿地に録音機を置き、野鳥の鳴き声を 3 種 A, B, C のどれかに自動で判定するプログラムを作っている。
    items:
      - id: s09p01a
        chapter: 23
        terms: [k-nearest-neighbors, mahalanobis-distance]
        topic: 単位の違う2つの特徴量を標準化するかどうかで3近傍法の判定が変わることを距離の計算で確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          判定には $k$ 近傍法（$k=3$、ユークリッド距離、多数決）を使う。種が確認済みの学習用の録音 7 件の、主要周波数 $f$（Hz）と 1 回の鳴き声の長さ $\ell$（秒）は次のとおりである。

          | 番号 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
          |---|---|---|---|---|---|---|---|
          | $f$（Hz） | «f1» | «f2» | «f3» | «f4» | «f5» | «f6» | «f7» |
          | $\ell$（秒） | «l1» | «l2» | «l3» | «l4» | «l5» | «l6» | «l7» |
          | 種 | «y1» | «y2» | «y3» | «y4» | «y5» | «y6» | «y7» |

          新しい録音は $f=«nf»$、$\ell=«nl»$ だった。(i) 特徴量をそのまま使う場合と、(ii) 各特徴量を、過去に蓄積した多数の録音から求めた標準偏差（$f$ は «sf» Hz、$\ell$ は «sl» 秒）で割って標準化してから距離を測る場合とで、判定される種の組として正しいものはどれか。
        choices:
          - "(i) C、(ii) A"
          - "(i) B、(ii) B"
          - "(i) B、(ii) A"
          - "(i) B、(ii) C"
          - "(i) A、(ii) A"
        answer: 2
        distractors:
          - 最も近い1件だけで判定し（1近傍）、そのままの距離では5番のCになった
          - 標準化後も周波数の差だけで距離を測った
          - 正解
          - 標準化後に最も近い3件の多数決を取り違えた
          - そのままの距離でも長さの差が効くと考えた
        explanation: |
          **方針** 新しい録音との距離を全 7 件について計算し、近い 3 件の種の多数決をとる。単位が大きく違う特徴量をそのまま使うと、数値の大きい周波数（数百 Hz の差）が距離をほぼ決めてしまう。

          **途中式** (i) そのまま：$\sqrt{(\Delta f)^2+(\Delta\ell)^2}$ はほぼ $|\Delta f|$ に等しく、順に «dr1», «dr2», «dr3», «dr4», «dr5», «dr6», «dr7»（小数第 1 位まで）。近い 3 件は «rawnn» で、多数決は B。
          (ii) 標準化：$(\Delta f/«sf»)^2+(\Delta\ell/«sl»)^2$ は順に «ds1», «ds2», «ds3», «ds4», «ds5», «ds6», «ds7»。近い 3 件は «stdnn» で、多数決は A。

          **答え** (i) B、(ii) A

          **間違えやすい点** ユークリッド距離は単位に依存する。周波数を kHz で表せば逆に長さが距離を支配するので、単位の取り方で判定が変わらないよう、標準化（各特徴量を標準偏差で割る）してから距離を測るのが普通である。
          (i) で 5 番と 6 番はどちらも周波数の差が 50 Hz で、長さの差の分だけ 5 番がわずかに近い。1 近傍法なら C になるが、3 近傍法の多数決は B。

      - id: s09p01b
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: 野外の種構成が検証データと違うとき識別結果から真の種である事後確率を求める（事前確率の差し替え）
        level: 標準
        definition: false
        type: choice
        question: |
          完成したプログラムを、種が確認済みの検証用の録音（計 «nAll» 件）で判定させたところ、次の結果（混同行列）になった。行が真の種、列が判定結果である。

          | 真の種 ＼ 判定 | A | B | C | 計 |
          |---|---|---|---|---|
          | A | «a1» | «a2» | «a3» | «nA» |
          | B | «b1» | «b2» | «b3» | «nB» |
          | C | «c1» | «c2» | «c3» | «nC» |

          このプログラムを別の森林で使う。この森林で録音される鳴き声の種の割合は A «piA»、B «piB»、C «piC» とわかっている。
          各種の鳴き声が「A」と判定される確率は、上の検証用データの行ごとの割合と同じとみなす。
          この森林で「A」と判定された鳴き声が、本当に種 A のものである確率に最も近い値はどれか。
        choices:
          - "$«w_prec»$"
          - "$«post»$"
          - "$«w_eq»$"
          - "$«w_rec»$"
          - "$«w_joint»$"
        answer: 1
        distractors:
          - 検証用データの適合率 84/111 をそのまま使い、種の割合（事前確率）の違いを無視した
          - 正解
          - 事前確率を掛け忘れ、3種を同じ割合とみなした
          - P(判定A | 真にA)（再現率）と P(真にA | 判定A) を取り違えた
          - 分母で割らず、同時確率 P(真にA かつ 判定A) を答えた
        explanation: |
          **方針** 求めるのは $P(\text{真にA}\mid\text{判定A})$。行ごとの割合から $P(\text{判定A}\mid\text{種})$ を読み取り、この森林の種の割合を事前確率としてベイズの定理を使う。

          **途中式** 検証用データの行の割合から
          $P(\text{判定A}\mid A)=«a1»/«nA»=«lA»$、$P(\text{判定A}\mid B)=«b1»/«nB»=«lB»$、$P(\text{判定A}\mid C)=«c1»/«nC»=«lC»$。
          全確率の公式で
          $$P(\text{判定A})=«piA»\times«lA»+«piB»\times«lB»+«piC»\times«lC»=«jA»+«jB»+«jC»=«den»$$
          $$P(\text{真にA}\mid\text{判定A})=\frac{«jA»}{«den»}=«post4»\cdots$$

          **答え** $«post»$

          **間違えやすい点** 検証用データの適合率 $«w_prec»$ は、検証用データの種の割合（A が 1/6）のもとでの値。A がずっと少ない森林では、B や C の誤判定の割合が相対的に増えるので、判定 A の信頼度は下がる。
          適合率は種の割合に依存し、再現率 $P(\text{判定A}\mid A)$ は依存しない。この 2 つを取り違えると $«w_rec»$ になる。

  - id: s09p02
    title: 試合形式と勝ち抜く確率
    context: |
      実力差のある 2 者が対戦するとき、試合形式によって強い側が最終的に勝つ確率がどう変わるかを調べる。どの対戦でも、各試合（各ポイント）の結果は互いに独立とする。
    items:
      - id: s09p02a
        chapter: 5
        terms: [negative-binomial-distribution, binomial-distribution]
        topic: 7戦4勝制のシリーズがちょうど第6戦で決着する確率を負の二項分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          野球の 7 戦 4 勝制のシリーズ（先に 4 勝したチームが優勝し、その時点でシリーズは終わる。引き分けはない）で、チーム A は各試合に確率 «sp» で勝つ。
          シリーズが**ちょうど第 6 戦で**決着する確率に最も近い値はどれか。
        choices:
          - "$«w_a»$"
          - "$«w_c6»$"
          - "$«w_c6a»$"
          - "$«w_b»$"
          - "$«six»$"
        answer: 4
        distractors:
          - A が第6戦で優勝する場合だけを数え、B が優勝する場合を落とした
          - 第6戦に勝つ条件を入れず、6試合中4勝の二項確率 C(6,4) を両チームについて足した
          - 第6戦に勝つ条件を入れず、A について 6試合中4勝の二項確率だけを答えた
          - B が第6戦で優勝する場合だけを数えた
          - 正解
        explanation: |
          **方針** 「第 6 戦で A が優勝」は「最初の 5 試合で A がちょうど 3 勝し、第 6 戦に A が勝つ」こと（4 勝目までの試合数は負の二項分布）。B が優勝する場合も同様に数えて足す。

          **途中式** $q=1-«sp»=«sq»$ とする。
          $$P(\text{A が第6戦で優勝})=\binom{5}{3}p^3q^2\times p=10\,p^4q^2=10\times«p4q2»=«a6»$$
          $$P(\text{B が第6戦で優勝})=\binom{5}{3}q^3p^2\times q=10\,q^4p^2=10\times«q4p2»=«b6»$$
          $$P(\text{第6戦で決着})=«a6»+«b6»=«six4»$$

          **答え** $«six»$

          **間違えやすい点** 最後の試合は必ず優勝する側の勝ちなので、「6 試合中 4 勝」の $\binom64$ ではなく「5 試合中 3 勝」の $\binom53$ を使う。$\binom64$ にすると、第 5 戦までに 4 勝して終わっている場合まで数えてしまう（$«w_c6»$）。
          「どちらかが優勝」なので、A と B の両方の場合を足す。

      - id: s09p02b
        chapter: 14
        terms: [absorption-probability, markov-chain, absorbing-state]
        topic: テニスのゲームで途中のスコアから勝つ確率をデュースの吸収確率を使って求める
        level: 応用
        definition: false
        type: choice
        question: |
          テニスの 1 ゲームでは、先に 4 ポイントを取った側が勝つ。ただし 3 対 3（40-40、デュース）になった後は、どちらかが 2 ポイント差をつけた時点で勝ちとなる（0, 1, 2, 3 ポイントをそれぞれ 0, 15, 30, 40 と呼ぶ）。
          サーブ側の選手は、各ポイントを確率 $p=«p»$ で取る。スコアがサーブ側から見て 15-30 のとき、サーブ側がこのゲームに勝つ確率に最も近い値はどれか。
        choices:
          - "$«w_D»$"
          - "$«ans»$"
          - "$«w_nod»$"
          - "$«w_alt»$"
          - "$«w_opp»$"
        answer: 1
        distractors:
          - 15-30 からの確率ではなく、デュースから勝つ確率を答えた
          - 正解
          - デュースの規則を無視し、先に4ポイント取れば勝ちとした
          - デュースから勝つ確率を 1 ポイントの勝率 p と同じとした
          - 相手がこのゲームに勝つ確率を答えた
        explanation: |
          **方針** スコアを状態とするマルコフ連鎖で、「勝ち」「負け」が吸収状態。まずデュースから勝つ確率 $D$ を求め、15-30 から先の状態について 1 歩先で条件づけた式を立てる。30-30 とデュースは、どちらも「先に 2 点差をつけた側が勝つ」点で同じ状態とみなせる。

          **途中式** $q=1-p=«q»$。デュースから 2 ポイント続けて取れば勝ち、1 対 1 に分ければデュースに戻るので
          $$D=p^2+2pq\,D\ \Rightarrow\ D=\frac{p^2}{1-2pq}=\frac{p^2}{p^2+q^2}=\frac{«p2»}{«den»}=«D»$$
          30-40 からは、取ればデュース、取られれば負けなので $P(30\text{-}40)=pD=«P3040»$。
          15-40 からは、取れば 30-40、取られれば負けなので $P(15\text{-}40)=p\times«P3040»=«P1540»$。
          15-30 からは、取れば 30-30（$=D$）、取られれば 15-40 なので
          $$P(15\text{-}30)=p\,D+q\,P(15\text{-}40)=«t1»+«q»\times«P1540»=«t1»+«t2»=«ans4»\cdots$$

          **答え** $«ans»$

          **間違えやすい点** 30-30 はデュースと同じ状態（どちらも 2 点差がつくまで続く）であることに注意。デュースからの勝率を $p$ としたり、2 点差の規則を無視して「あと 3 点を先に取るか」で計算したりすると（$«w_nod»$）値がずれる。
          $p>0.5$ なのでデュースからの勝率 $«w_D»$ は $p$ より大きくなる（強い側に有利になる仕組み）。

  - id: s09p03
    title: 湖の魚の体長調査
    context: |
      ある湖で、刺し網で捕獲した魚の体長から湖の魚の大きさを調べている。
    items:
      - id: s09p03a
        chapter: 29
        terms: [truncated-data, censored-data, normal-distribution]
        topic: 網目より大きい魚だけが捕れる切断データで捕獲された魚の平均体長を逆ミルズ比から求める
        level: 標準
        definition: false
        type: choice
        question: |
          湖の魚の体長 $X$（cm）は平均 «mu»、標準偏差 «sg» の正規分布に従う。網の目が粗く、体長が «c» cm を超える魚だけが（体長によらず同じ確率で）捕れ、それ以下の魚は記録に一切残らない。
          捕獲された魚の体長の期待値 $E[X\mid X>«c»]$（cm、小数第 1 位まで）に最も近い値はどれか。標準正規分布の密度関数 $\phi$ と分布関数 $\Phi$ の値 $\phi(«a»)=«phi»$、$\Phi(«a»)=«Phi»$ を使え。
        choices:
          - "$«w_nod»$"
          - "$«w_Phi»$"
          - "$«w_mu»$"
          - "$«m»$"
          - "$«w_c»$"
        answer: 3
        distractors:
          - 逆ミルズ比の分母 1-Φ(a) で割り忘れた
          - 分母に上側確率 1-Φ(a) ではなく Φ(a) を使った
          - 切断を無視して母平均を答えた
          - 正解
          - 母平均ではなく切断点 20 に σλ を足した
        explanation: |
          **方針** これは「切断」データ：«c» cm 以下の魚は存在すら記録されない（打ち切りのように「«c» 以下だった」という情報も残らない）。$X=\mu+\sigma Z$ と標準化し、$E[Z\mid Z>a]=\dfrac{\phi(a)}{1-\Phi(a)}$（逆ミルズ比）を使う。

          **途中式** $a=(«c»-«mu»)/«sg»=«a»$。$Z>a$ のときの $Z$ の期待値は
          $$E[Z\mid Z>a]=\frac{\int_a^\infty z\phi(z)\,dz}{1-\Phi(a)}=\frac{\phi(a)}{1-\Phi(a)}=\frac{«phi»}{1-«Phi»}=\frac{«phi»}{«tail»}=«lam»$$
          （$\int_a^\infty z\phi(z)dz=\left[-\phi(z)\right]_a^\infty=\phi(a)$ を使った。）
          $$E[X\mid X>«c»]=«mu»+«sg»\times«lam»=«mu»+«add»=«m3»\approx«m»$$

          **答え** $«m»$ cm

          **間違えやすい点** 捕獲された魚だけの平均は母平均 «mu» より大きく偏る（切断による偏り）。分子の $\phi(a)$ だけ（$«w_nod»$）では条件付けの割り算が抜けている。
          条件は $X>«c»$ なので割るのは上側の確率 $1-\Phi(a)=«tail»$（$\Phi(a)$ で割ると $«w_Phi»$）。

  - id: s09p04
    title: 観測所の気象データ
    context: |
      ある地方気象台の観測所で、風・降水量・気温などを長期間記録している。
    items:
      - id: s09p04a
        chapter: 6
        terms: [chi-squared-distribution, normal-distribution, exponential-distribution]
        topic: 風の東西成分と南北成分が独立な正規分布のとき風速が閾値を超える確率を自由度2のカイ二乗分布で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある観測所では $U$ と $V$ が互いに独立で、どちらも平均 0、標準偏差 $\sigma=«sig»$ の正規分布に従うとみなせる。
          風速 $W=\sqrt{U^2+V^2}$ が «w» m/s を超える確率 $P(W>«w»)$ に最も近い値はどれか。
          必要なら、カイ二乗分布の上側確率 $P(\chi^2_\nu>x)$ の次の値を使え（$\nu$ は自由度）。

          | $x$ | 2.5 | 3.125 | 6.25 |
          |---|---|---|---|
          | $\nu=1$ | «t1a» | «t1b» | «t1c» |
          | $\nu=2$ | «t2a» | «t2b» | «t2c» |
        choices:
          - "$«ans»$"
          - "$«w_df1»$"
          - "$«w_nosq»$"
          - "$«w_half»$"
          - "$«w_comp»$"
        answer: 0
        distractors:
          - 正解
          - 2 つの成分の平方和なのに自由度 1 のカイ二乗分布を使った
          - W/σ=2.5 を 2 乗せずにカイ二乗分布の値と比べた
          - 自由度2のカイ二乗の密度の 1/2 と混同し、閾値をさらに 2 で割った
          - 超える確率ではなく、超えない確率を答えた
        explanation: |
          **方針** $U/\sigma$、$V/\sigma$ は独立な標準正規分布なので、$(U^2+V^2)/\sigma^2=W^2/\sigma^2$ は自由度 2 のカイ二乗分布に従う。

          **途中式**
          $$P(W>«w»)=P\left(\frac{W^2}{\sigma^2}>\frac{«w»^2}{«sig»^2}\right)=P\left(\chi^2_2>\frac{«w2»}{«sig2»}\right)=P(\chi^2_2>«thr»)=«ans»$$
          自由度 2 のカイ二乗分布は平均 2 の指数分布なので、$P(\chi^2_2>x)=e^{-x/2}$ であり、$e^{-«thr»/2}=e^{-«thr2»}\approx«ans»$ と確かめられる（$W$ はレイリー分布に従う）。

          **答え** $«ans»$

          **間違えやすい点** 平方和の成分は 2 つなので自由度は 2（自由度 1 とすると $«w_df1»$）。閾値は $W$ ではなく $W^2/\sigma^2$ で比べる（$W/\sigma=2.5$ をそのまま使うと $«w_nosq»$）。
          指数分布の形 $e^{-x/2}$ をカイ二乗の表と二重に使い、$x=«thr2»$ を表で引くと $«w_half»$ になる。

      - id: s09p04b
        chapter: 7
        terms: [markov-inequality, chebyshev-inequality, exponential-distribution]
        topic: 指数分布の日降水量が平均の5倍以上になる確率をマルコフとチェビシェフの上界と正確な値で比べる
        level: 基本
        definition: false
        type: choice
        question: |
          この観測所では、雨の日の日降水量 $X$（mm）は平均 «th» の指数分布に従う（標準偏差も «th»）。$P(X\ge«xa»)$ について、
          (ア) マルコフの不等式による上界、(イ) チェビシェフの不等式による上界、(ウ) 指数分布による正確な値、の組として正しいものはどれか。$e^{-5}=«e5»$ とする。
        choices:
          - "(ア) $«mk»$、(イ) $«w_chsd»$、(ウ) $«e5»$"
          - "(ア) $«mk»$、(イ) $«ch»$、(ウ) $«e5»$"
          - "(ア) $«w_mk»$、(イ) $«ch»$、(ウ) $«e5»$"
          - "(ア) $«mk»$、(イ) $«ch»$、(ウ) $«w_ex»$"
          - "(ア) $«mk»$、(イ) $«w_chk»$、(ウ) $«e5»$"
        answer: 1
        distractors:
          - チェビシェフの上界を σ²/k² ではなく σ/k とした
          - 正解
          - マルコフの上界 μ/a を 1 から引いた
          - 正確な値として P(X<60) を答えた
          - チェビシェフの不等式で、平均からのずれ k=48 ではなく 60 を使った
        explanation: |
          **方針** マルコフの不等式は非負の確率変数に対し $P(X\ge a)\le E[X]/a$。チェビシェフの不等式は $P(|X-\mu|\ge k)\le\sigma^2/k^2$ で、$X\ge«xa»$ は $X-«th»\ge«dev»$ に含まれるので $k=«dev»$ とする。正確な値は $P(X\ge x)=e^{-x/\theta}$。

          **途中式**
          (ア) $«th»/«xa»=«mk»$
          (イ) $P(X\ge«xa»)\le P(|X-«th»|\ge«dev»)\le\dfrac{«th2»}{«dev»^2}=\dfrac{«th2»}{«dev2»}=«ch»$
          (ウ) $e^{-«xa»/«th»}=e^{-5}=«e5»$

          **答え** (ア) $«mk»$、(イ) $«ch»$、(ウ) $«e5»$

          **間違えやすい点** どちらの不等式も分布によらない上界なので、正確な値よりかなり大きい。分散の情報も使うチェビシェフのほうがマルコフより鋭い。
          チェビシェフの $k$ は「平均からのずれ」なので $«xa»-«th»=«dev»$（$«xa»$ を使うと $«w_chk»$）。

      - id: s09p04c
        chapter: 22
        terms: [principal-component-analysis, principal-component-loading, eigenvalue-and-eigenvector, pca-on-correlation-matrix]
        topic: 相関行列の主成分分析で上位2主成分が1つの変数の分散を説明する割合を固有値と固有ベクトルから求める
        level: 標準
        definition: false
        type: choice
        question: |
          日平均の気温・湿度・日照時間の 3 変数を標準化して相関行列の主成分分析を行ったところ、固有値と（長さ 1 の）固有ベクトルは次のようになった。

          | | 第1主成分 | 第2主成分 | 第3主成分 |
          |---|---|---|---|
          | 固有値 | «l1» | «l2» | «l3» |
          | 気温 | «v11» | «v12» | «v13» |
          | 湿度 | «v21» | «v22» | «v23» |
          | 日照時間 | «v31» | «v32» | «v33» |

          第 1・第 2 主成分の 2 つで、標準化した**湿度**の分散のうち何割が説明されるか。最も近い値はどれか。
        choices:
          - "$«w_pc1»$"
          - "$«w_unw»$"
          - "$«w_cum»$"
          - "$«w_pc3»$"
          - "$«ansc»$"
        answer: 4
        distractors:
          - 第1主成分の分だけを答えた
          - 固有ベクトルの成分の2乗を固有値で重み付けずに足した
          - 変数ごとの割合ではなく、第2主成分までの累積寄与率を答えた
          - 説明されずに残る第3主成分の分を答えた
          - 正解
        explanation: |
          **方針** 標準化した変数 $z_j$ は主成分得点 $y_k$ を使って $z_j=\sum_ka_{jk}y_k$ と書け、$y_k$ どうしは無相関で $V[y_k]=\lambda_k$。よって $V[z_j]=1=\sum_k\lambda_ka_{jk}^2$ と分解でき、第 $k$ 主成分の分は $\lambda_ka_{jk}^2$（主成分負荷量 $\sqrt{\lambda_k}a_{jk}$ の 2 乗）。

          **途中式** 湿度の行 $a_{2k}=(«v21»,\ «v22»,\ «v23»)$ を使って
          $$\lambda_1a_{21}^2+\lambda_2a_{22}^2=«l1»\times«sq1»+«l2»\times«sq2»=«tc1»+«tc2»=«ansc4»\cdots$$
          確認：第 3 主成分の分は $«l3»\times«sq3»=«tc3»$ で、$1-«tc3»=«alt»$ と（丸めの範囲で）一致する。

          **答え** $«ansc»$

          **間違えやすい点** 累積寄与率 $(\lambda_1+\lambda_2)/3=«w_cum»$ は 3 変数全体の平均の割合で、湿度だけの割合とは違う。
          固有ベクトルの成分の 2 乗 $a_{jk}^2$ は「主成分の中での変数の重み」で、変数の分散の分解には固有値 $\lambda_k$ を掛ける必要がある（掛けないと $«w_unw»$）。

  - id: s09p05
    title: 湿地の野鳥調査
    context: |
      ある湿地で、野鳥の個体数・出現数・繁殖を調べている。
    items:
      - id: s09p05a
        chapter: 8
        terms: [maximum-likelihood-estimator, hypergeometric-distribution, likelihood-function]
        topic: 標識再捕獲法で個体数の最尤推定量を尤度の比から整数で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          ある種のシギの個体数 $N$ を推定するため、1 回目に «M» 羽を捕獲して足環を付けて放した。十分に混ざった後の 2 回目に «n» 羽を捕獲したところ、そのうち «m» 羽に足環が付いていた。
          2 回目の捕獲は $N$ 羽から «n» 羽を非復元で無作為に選ぶものとし、足環付きの羽数 $X$ は超幾何分布
          $$L(N)=P(X=«m»)=\frac{\binom{«M»}{«m»}\binom{N-«M»}{«n»-«m»}}{\binom{N}{«n»}}$$
          に従うとする。$N$ は整数であることに注意して、$N$ の最尤推定値を求めよ。
        answer: «nhat»
        tolerance: 0.4
        answer_format: 整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** $N$ は整数なので微分は使えない。隣り合う $N$ の尤度の比 $L(N)/L(N-1)$ が 1 以上になる範囲を調べ、尤度が増加から減少に変わる $N$ を探す。

          **途中式** 二項係数を書き下して約分すると
          $$\frac{L(N)}{L(N-1)}=\frac{(N-«M»)(N-«n»)}{N\,(N-«M»-«n»+«m»)}$$
          これが 1 以上になる条件は
          $$(N-«M»)(N-«n»)\ge N(N-«M»-«n»+«m»)\iff «M»\times«n»\ge «m»N\iff N\le\frac{«Mn»}{«m»}=«lp»$$
          したがって $L(N)$ は $N\le «lp»$ の範囲では増え続け（$L(N)\ge L(N-1)$）、それを超えると減る。整数で最大になるのは $N=«nhat»$。

          **答え** $«nhat»$ 羽

          **間違えやすい点** 連続量とみなした推定値 $Mn/m=«lp»$ を四捨五入して «w_ceil» とするのは誤り。$N=«w_ceil»$ では $L(«w_ceil»)/L(«nhat»)<1$ となり尤度が下がる。最尤推定値は $Mn/m$ の整数部分（$Mn/m$ が整数なら $Mn/m-1$ と $Mn/m$ の 2 つ）。
          また、少なくとも $M+n-m=«lower»$ 羽はいることを確かめておくとよい。

      - id: s09p05b
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, link-function]
        topic: 累積ロジットモデルの切片と係数から湿地で朝に観察数の区分が中程度になる確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          調査ごとの観察数を「少」「中」「多」の 3 区分 $Y=1,2,3$ で記録し、累積ロジットモデル（比例オッズモデル）
          $$P(Y\le j)=\frac{1}{1+\exp\{-(\theta_j-\eta)\}},\quad j=1,2,\qquad \eta=\gamma_1x_1+\gamma_2x_2$$
          を当てはめた（$x_1$ は湿地なら 1・草地なら 0、$x_2$ は朝なら 1・夕方なら 0）。推定値は $\hat\theta_1=«th1»$、$\hat\theta_2=«th2»$、$\hat\gamma_1=«g1»$、$\hat\gamma_2=«g2»$ だった。
          湿地で朝に調査したとき、区分が「中」（$Y=2$）になる確率を求めよ。必要なら $e^{1.3}=«e13»$、$e^{-1.3}=«em13»$、$e^{0.3}=«e03»$、$e^{-0.3}=«em03»$ を使え。
        answer: «pm»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 累積確率 $P(Y\le1)$ と $P(Y\le2)$ を求め、その差が $P(Y=2)$。このモデルでは $\eta$ が大きいほど累積確率が下がり、上の区分（観察数が多い）になりやすい。

          **途中式** $\eta=«g1»+«g2»=«eta»$。
          $$P(Y\le1)=\frac{1}{1+e^{-(«th1»-«eta»)}}=\frac{1}{1+e^{1.3}}=\frac{1}{«d1»}=«F1»$$
          $$P(Y\le2)=\frac{1}{1+e^{-(«th2»-«eta»)}}=\frac{1}{1+e^{-0.3}}=\frac{1}{«d2»}=«F2»$$
          $$P(Y=2)=«F2»-«F1»=«pm4»\cdots$$

          **答え** $«pm3»$

          **間違えやすい点** $P(Y\le2)=«w_F2»$ は「少または中」の確率で、「中」だけではない。「多」の確率は $1-P(Y\le2)=«w_hi»$、「少」は $«w_lo»$。
          符号の約束（$\theta_j-\eta$ か $\theta_j+\eta$ か）はソフトウェアによって違うので、問題文の式に従う。

      - id: s09p05c
        chapter: 2
        terms: [probability-generating-function, binomial-distribution]
        topic: 産卵数の確率母関数に孵化しない確率を代入する母関数の合成でひながちょうど1羽の確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          この湿地のある鳥の 1 巣の産卵数 $N$ は 2, 3, 4 個で、その確率はそれぞれ «p2e», «p3e», «p4e» である。$N$ の確率母関数は $G(s)=«p2e»s^2+«p3e»s^3+«p4e»s^4$。
          各卵は $N$ と独立に、互いに独立に確率 «ph» で孵化する。孵化したひなの数 $Y$ の確率母関数は $H(s)=G(«qh»+«ph»s)$ となる。
          1 巣で孵化するひながちょうど 1 羽である確率 $P(Y=1)$ に最も近い値はどれか。
        choices:
          - "$«w_nop»$"
          - "$«w_G0»$"
          - "$«w_non»$"
          - "$«P1»$"
          - "$«w_P2»$"
        answer: 3
        distractors:
          - 合成関数の微分で内側の微分 0.8 を掛け忘れた
          - P(Y=0)=H(0) を答えた
          - 二項確率 n×0.8×0.2^(n-1) の係数 n（G を微分したときに出る指数）を落とし、Σ P(N=n)×0.8×0.2^(n-1) とした
          - 正解
          - ひなが2羽の確率 P(Y=2) を答えた
        explanation: |
          **方針** 確率母関数では $P(Y=k)=H^{(k)}(0)/k!$。$P(Y=1)=H'(0)$ を合成関数の微分で求める。

          **途中式** $H(s)=G(«qh»+«ph»s)$ より $H'(s)=«ph»\,G'(«qh»+«ph»s)$、したがって $H'(0)=«ph»\,G'(«qh»)$。
          $G'(s)=2\times«p2e»s+3\times«p3e»s^2+4\times«p4e»s^3$ に $s=«qh»$ を代入すると
          $$G'(«qh»)=«gp1»+«gp2»+«gp3»=«Gp»$$
          $$P(Y=1)=«ph»\times«Gp»=«P1f»$$

          **答え** $«P1»$

          **間違えやすい点** 合成関数の微分では内側 $«qh»+«ph»s$ の微分 «ph» を掛ける（忘れると $«w_nop»$）。$H(0)=G(«qh»)=«G0f»$ は 1 羽も孵らない確率。
          条件づけで計算するとき、二項確率 $\binom{n}{1}«ph»\cdot«qh»^{n-1}$ の係数 $n$ を落とすと $«w_non»$ になる。
          **別解** $N$ で条件づけると $Y\mid N=n\sim B(n,«ph»)$ なので $P(Y=1)=\sum_n P(N=n)\,n\times«ph»\times«qh»^{n-1}$ で、同じ値になる。

  - id: s09p06
    title: 新品種の種子の検査
    context: |
      種苗会社が交配で作った新品種の種子の性質を確かめている。
    items:
      - id: s09p06a
        chapter: 12
        terms: [kolmogorov-smirnov-test, goodness-of-fit-test, cumulative-distribution-function]
        topic: 5粒の発芽日数の経験分布関数と仮定した指数分布の分布関数の最大のずれからコルモゴロフ・スミルノフ統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          新品種の種子 5 粒の発芽までの日数は «x1», «x2», «x3», «x4», «x5» だった。これが平均 5 日の指数分布（分布関数 $F(x)=1-e^{-x/5}$）に従うかを、1 標本のコルモゴロフ・スミルノフ検定で調べる。
          $F(«x1»)=«F1»$、$F(«x2»)=«F2»$、$F(«x3»)=«F3»$、$F(«x4»)=«F4»$、$F(«x5»)=«F5»$、$n=5$ のときの検定統計量 $D$ の両側 5% の棄却限界値は «crit» とする。正しいものはどれか。
        choices:
          - "$D=«Dp»$ で、«crit» より小さいので棄却しない"
          - "$D=«D»$ で、«crit» より小さいので、発芽日数が平均 5 日の指数分布に従うことが示された"
          - "$D=«D»$ で、«crit» より小さいので棄却しない"
          - "$D=«mid»$ で、«crit» より小さいので棄却しない"
          - "$D=«D»$ で、«crit» より小さいので棄却する"
        answer: 2
        distractors:
          - 経験分布関数の跳ぶ直後の値 i/n とだけ比べ、跳ぶ直前の値 (i-1)/n との差を見落とした
          - 棄却されないことを帰無仮説が正しいことの証明と取り違えた
          - 正解
          - 経験分布関数の値を (i-0.5)/n とした
          - 棄却限界値との大小で結論を逆にした
        explanation: |
          **方針** $D=\sup_x|F_n(x)-F(x)|$。経験分布関数 $F_n$ は各観測値で $1/n$ ずつ跳ぶ階段関数なので、各観測値 $x_{(i)}$ で跳ぶ直後 $i/n$ と直前 $(i-1)/n$ の両方と $F(x_{(i)})$ を比べる。

          **途中式**

          | $i$ | $x_{(i)}$ | $F(x_{(i)})$ | $i/n-F$ | $F-(i-1)/n$ |
          |---|---|---|---|---|
          | 1 | «x1» | «F1» | «dp1» | «dm1» |
          | 2 | «x2» | «F2» | «dp2» | «dm2» |
          | 3 | «x3» | «F3» | «dp3» | «dm3» |
          | 4 | «x4» | «F4» | «dp4» | «dm4» |
          | 5 | «x5» | «F5» | «dp5» | «dm5» |

          $D^+=\max(i/n-F)=«Dp»$、$D^-=\max(F-(i-1)/n)=«Dm»$ で、$D=\max(D^+,D^-)=«D4»$。

          **答え** $D=«D»<«crit»$ なので棄却しない。

          **間違えやすい点** 最初の観測値の直前では $F_n=0$ なので、$F(«x1»)-0=«F1»$ が最大のずれになる。$i/n$ とだけ比べると $«Dp»$ と過小になる。
          棄却しないことは「指数分布に従う」ことの証明ではない。$n=5$ では検出力が低く、かなり違う分布でも棄却されにくい。

      - id: s09p06b
        chapter: 9
        terms: [required-sample-size, ci-proportion, confidence-interval]
        topic: 予備試験の発芽率から95パーセント信頼区間の幅の半分を3ポイント以内にする必要な種子数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          新品種の発芽率 $p$ を、正規近似による 95% 信頼区間 $\hat p\pm1.96\sqrt{\hat p(1-\hat p)/n}$ で推定する。予備試験から発芽率はおよそ «p0» と見込まれる。
          $p(1-p)$ に «p0» を代入した値を使って、信頼区間の幅の半分が «e» 以下になる最小の種子数 $n$ を求めよ。
        answer: «nreq»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 幅の半分 $1.96\sqrt{p(1-p)/n}\le e$ を $n$ について解く。

          **途中式**
          $$n\ge\frac{1.96^2\,p(1-p)}{e^2}=\frac{«z2»\times«pq»}{«e2»}=«nraw»$$

          **答え** 切り上げて $n=«nreq»$ 粒

          **間違えやすい点** 「幅」と「幅の半分」の取り違え（幅全体を «e» にするなら $e=0.03$ ではなく半分の 0.015 を使う。逆に幅の半分を $2e$ とすると «w_w» 粒になる）。
          予備情報がなく最も安全な $p=0.5$ を使うと «w_half» 粒、両側 95% なのに 1.645 を使うと «w_z1» 粒になる。四捨五入ではなく切り上げる。

  - id: s09p07
    title: 流域の観測所の比較
    context: |
      ある川の流域にある観測所のデータを比べる。
    items:
      - id: s09p07a
        chapter: 10
        terms: [multiple-testing, bonferroni-correction, type-i-and-ii-errors]
        topic: 20地点で独立に検定したとき少なくとも1地点が誤って有意になる確率とボンフェローニ補正後の値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          流域の «k» 地点で、それぞれ「年平均気温に上昇傾向がない」という帰無仮説を検定する。地点ごとの検定は互いに独立で、実際にはすべての地点で帰無仮説が正しいとする。
          (ア) 各地点を有意水準 5% で検定したとき、少なくとも 1 地点で誤って有意になる確率、
          (イ) ボンフェローニ補正をして各地点を有意水準 $0.05/«k»$ で検定したときの同じ確率、の組として正しいものはどれか。
          必要なら $0.95^{20}=«p95»$、$0.9975^{20}=«p9975»$ を使え。
        choices:
          - "(ア) $«w_union»$、(イ) $0.050$"
          - "(ア) $«p95»$、(イ) $«p9975»$"
          - "(ア) $«fw»$、(イ) $«w_bal»$"
          - "(ア) $«fw»$、(イ) $«fb»$"
          - "(ア) $0.050$、(イ) $«fb»$"
        answer: 3
        distractors:
          - 和の上界 20×0.05 をそのまま確率とし、補正後もちょうど 0.05 とした
          - 誤って有意になる地点が1つもない確率を答えた
          - 補正後の確率として、1地点あたりの有意水準 0.0025 を答えた
          - 正解
          - 多重性を無視し、補正前も 1 地点の有意水準 5% のままとした
        explanation: |
          **方針** 「少なくとも 1 地点で誤って有意」の余事象は「どの地点でも有意にならない」。独立なので確率は積になる。

          **途中式**
          (ア) $1-(1-0.05)^{«k»}=1-«p95»=«fw»$
          (イ) 各地点の有意水準は $0.05/«k»=«bal»$ なので $1-(1-«bal»)^{«k»}=1-«p9975»=«fb»$

          **答え** (ア) $«fw»$、(イ) $«fb»$

          **間違えやすい点** ボンフェローニの不等式 $P(\bigcup A_i)\le\sum P(A_i)$ は上界で、補正前の $«k»\times0.05=1$ は確率そのものではない。補正後の値は $0.05$ 以下になり、独立な場合は $«fb»$ とわずかに小さい（保守的）。
          (イ) は「少なくとも 1 地点」の確率（ファミリーワイズの誤り率）で、1 地点あたりの水準 $«bal»$ とは違う。

      - id: s09p07b
        chapter: 11
        terms: [hotelling-t2, f-distribution, variance-covariance-matrix]
        topic: 気温と降水量の平年差の2変量平均がゼロかをホテリングのT2統計量とF分布で検定する
        level: 応用
        definition: false
        type: choice
        question: |
          観測所 A の最近 «nT» 年の年平均気温の平年差 $d_1$（℃）と年降水量の平年差 $d_2$（10 mm 単位）について、
          標本平均ベクトルは $\bar{\boldsymbol d}=(«d1»,\ «d2»)^\top$、不偏分散共分散行列は
          $$S=\begin{pmatrix}«s11» & «s12»\\ «s12» & «s22»\end{pmatrix}$$
          だった。2 変量正規分布を仮定し、母平均ベクトルが $\boldsymbol0$ という帰無仮説をホテリングの $T^2=n\,\bar{\boldsymbol d}^\top S^{-1}\bar{\boldsymbol d}$ で検定する。
          $\frac{n-p}{p(n-1)}T^2$（$p=2$）が自由度 $(p,\,n-p)$ の $F$ 分布に従うことを使う。
          $F_{0.05}(2,18)=«F218»$、$F_{0.05}(18,2)=«F182»$、$F_{0.05}(2,19)=«F219»$ とする。正しいものはどれか。
        choices:
          - "$T^2=«T2»$、$F=«Fc»$ で、有意水準 5% で棄却する"
          - "$T^2=«T2»$ をそのまま $F$ 統計量とし、$F=«T2»$ で棄却する"
          - "$T^2=«w_T2nod»$ で、有意水準 5% で棄却しない"
          - "$T^2=«w_diagT»$、$F=«w_diagF»$ で、有意水準 5% で棄却する"
          - "$T^2=«T2»$、$F=«Fc»$ で、有意水準 5% で棄却しない"
        answer: 0
        distractors:
          - 正解
          - T^2 を F 分布に従う量へ変換する係数 (n-p)/(p(n-1)) を掛け忘れた
          - n を掛け忘れた
          - 共分散を無視して各変数の t^2 を足した
          - F 分布の自由度の順番を逆にして 19.44 と比べた
        explanation: |
          **方針** 2 次の行列の逆行列は $S^{-1}=\frac{1}{\det S}\begin{pmatrix}s_{22}&-s_{12}\\-s_{12}&s_{11}\end{pmatrix}$。2 次形式 $\bar{\boldsymbol d}^\top S^{-1}\bar{\boldsymbol d}$ を計算して $n$ を掛け、$F$ に変換する。

          **途中式** $\det S=«s11»\times«s22»-(«s12»)^2=«det»$。
          $$\bar{\boldsymbol d}^\top S^{-1}\bar{\boldsymbol d}=\frac{s_{22}\bar d_1^2-2s_{12}\bar d_1\bar d_2+s_{11}\bar d_2^2}{\det S}=\frac{«qa»+(«qb»)+«qc»}{«det»}=\frac{«qsum»}{«det»}=«q»$$
          $$T^2=«nT»\times«q»=«T2»,\qquad F=\frac{«nT»-2}{2\times(«nT»-1)}T^2=\frac{18}{38}\times«T2»=«Fc»$$
          $«Fc»>F_{0.05}(2,18)=«F218»$ なので棄却する。

          **答え** $T^2=«T2»$、$F=«Fc»$、有意水準 5% で棄却する（気温と降水量の平年差の平均はゼロベクトルとはいえない）。

          **間違えやすい点** $T^2$ そのものは $F$ 分布に従わない。係数 $\frac{n-p}{p(n-1)}$ を掛け、自由度は（分子 $p$、分母 $n-p$）$=(2,18)$。
          気温が高い年ほど降水量が少ない（負の共分散）ので、共分散を無視して各変数の $t^2$ を足すと（$T^2=«w_diagT»$）検定統計量を誤る。

      - id: s09p07c
        chapter: 26
        terms: [classical-mds, multidimensional-scaling]
        topic: 古典的多次元尺度法で距離の2乗の行列を二重中心化した内積行列の成分を求める
        level: 標準
        definition: false
        type: choice
        question: |
          A, B を含む流域の 4 観測所 1〜4 について、気候の特徴量（標準化済み）から求めたユークリッド距離の 2 乗 $d_{ij}^2$ が次のとおりだった。

          | | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | 1 | 0 | «d12» | «d13» | «d14» |
          | 2 | «d12» | 0 | «d23» | «d24» |
          | 3 | «d13» | «d23» | 0 | «d34» |
          | 4 | «d14» | «d24» | «d34» | 0 |

          古典的多次元尺度法（計量 MDS）では、距離の 2 乗の行列を二重中心化して、重心を原点とする座標の内積行列 $B=(b_{ij})$ を作る。$b_{14}$ の値として正しいものはどれか。
        choices:
          - "$«w_nocent»$"
          - "$«w_sign»$"
          - "$«b14»$"
          - "$«w_nohalf»$"
          - "$«w_gm»$"
        answer: 2
        distractors:
          - 中心化をせず、-d14^2/2 をそのまま内積とした
          - 先頭の -1/2 の符号を落とした
          - 正解
          - 係数 1/2 を掛け忘れた
          - 全体平均の項の符号を誤り、足すべきところで引いた
        explanation: |
          **方針** 二重中心化の公式 $b_{ij}=-\dfrac12\left(d_{ij}^2-\bar d_{i\cdot}^2-\bar d_{\cdot j}^2+\bar d_{\cdot\cdot}^2\right)$ を使う。$\bar d_{i\cdot}^2$ は $i$ 行の平均、$\bar d_{\cdot\cdot}^2$ は全成分の平均。

          **途中式** 行の合計は 1 行目 $0+«d12»+«d13»+«d14»=«rs1»$、4 行目 $«d14»+«d24»+«d34»+0=«rs4»$ なので、行の平均は $\bar d_{1\cdot}^2=«rm1»$、$\bar d_{4\cdot}^2=«rm4»$（対称なので列の平均も同じ）。
          全成分の合計は «tot2» なので $\bar d_{\cdot\cdot}^2=«tot2»/16=«gm»$。
          $$b_{14}=-\frac12\left(«d14»-«rm1»-«rm4»+«gm»\right)=-\frac12\times«inner»=«b14f»$$

          **答え** $«b14»$

          **間違えやすい点** 内積 $\boldsymbol{x}_i^\top\boldsymbol{x}_j$ は座標の原点の取り方に依存するので、重心を原点にするための中心化が必要。$-d_{14}^2/2=«w_nocent»$ は中心化をしていない値。
          全体平均は「引きすぎた分を戻す」ので符号はプラス。負の値は、重心から見て観測所 1 と 4 が反対側にあることを表す。

          **別解** 座標 $(0,0),(6,0),(1,4),(5,5)$ はこの距離を再現する。重心 $(3,\,2.25)$ を引くと観測所 1 は $(-3,-2.25)$、4 は $(2,\,2.75)$ で、内積は $-6-6.1875=-12.1875$ と一致する。

