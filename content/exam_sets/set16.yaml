        chapter: 7
        terms: [berry-esseen-theorem, central-limit-theorem, lindeberg-levy-clt]
        topic: 寿命の2乗の標本平均の正規近似の誤差をベリー・エッセンの不等式で一定以下に保証する標本の大きさを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          (a) の最尤推定量 $\hat\theta=\frac1n\sum Y_i$（$Y_i=T_i^2$）の分布を正規分布で近似するとき、その誤差を保証したい。
          独立同一分布の $Y_i$（平均 $\theta$、分散 $\sigma^2$、$\rho=E[|Y-\theta|^3]<\infty$）について、ベリー・エッセンの不等式
          $$\sup_x\left|P\left(\frac{\sqrt n(\hat\theta-\theta)}{\sigma}\le x\right)-\Phi(x)\right|\le\frac{C\rho}{\sigma^3\sqrt n},\qquad C=«C»$$
          が成り立つ。$Y=T^2$ の分布を (a) の密度から求めると $\rho=(12/e-2)\theta^3\approx«rho3»\,\theta^3$ となる。右辺が «eps» 以下になる最小の $n$ を求めよ。
        answer: «nreq»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** $Y=T^2$ の分布を求めて $\sigma$ を $\theta$ で表し、$\rho/\sigma^3$ が $\theta$ によらない定数になることを使って $n$ について解く。

          **途中式** $P(Y>y)=P(T>\sqrt y)=e^{-y/\theta}$ なので、$Y$ は平均 $\theta$ の指数分布に従い $\sigma=\theta$。よって $\rho/\sigma^3=«rho3»$。
          $$\frac{«C»\times«rho3»}{\sqrt n}\le«eps»\iff\sqrt n\ge\frac{«Cr»}{«eps»}=«root»\iff n\ge«root2»$$
          よって最小の $n$ は «nreq»。

          **答え** $«nreq»$

          **間違えやすい点** $\sqrt n$ について解いたところで止めると «w_nosq» になる。$\rho$ は 3 次の**絶対**中心モーメントで、歪度 $E[(Y-\theta)^3]/\sigma^3=2$ と取り違えると «w_skew» になる。
          この不等式は分布によらずに近似の誤差を保証するもので、実際の誤差はふつうこれよりずっと小さい。

