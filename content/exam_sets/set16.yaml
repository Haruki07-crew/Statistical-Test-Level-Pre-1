      - id: s16p04b
        chapter: 18
        terms: [logistic-likelihood-estimation, logistic-regression, odds-and-odds-ratio]
        topic: 2値の説明変数だけのロジスティック回帰で傾きの最尤推定値が2×2表の対数オッズ比になることを使って求める
        level: 基本
        definition: false
        type: choice
        question: |
          同型機 100 機について、この部位にき裂があったか（$Y=1$）を、沿岸の空港を拠点にしているか（$x=1$：沿岸 «n1» 機、$x=0$：内陸 «n0» 機）で説明するロジスティック回帰
          $$\log\frac{P(Y=1)}{1-P(Y=1)}=\beta_0+\beta_1x$$
          を最尤法で当てはめる。き裂があったのは沿岸で «a1» 機、内陸で «a0» 機だった。$\beta_1$ の最尤推定値に最も近いものはどれか。
          必要なら $\ln «OR»=«lnOR»$、$\ln 2.25=«lnRR»$、$\ln 1.5=«lncnt»$、$\ln 0.818=«lno1»$ を使え。
        choices:
          - "$«lno1_s»$"
          - "$«lncnt_s»$"
          - "$«lnrr_s»$"
          - "$«lnor_s»$"
          - "$«OR_s»$"
        answer: 3
        distractors:
          - 沿岸群の対数オッズ（β0+β1 にあたる値）を答えた
          - き裂のある機数の比 18/12 の対数をとった
          - き裂の割合の比（相対危険）の対数をとった
          - 正解
          - 対数をとらずオッズ比そのものを答えた
        explanation: |
          **方針** 説明変数が 2 値だけのとき、モデルは 2 つの群の確率を自由に表せる（飽和モデル）ので、最尤推定値は各群の観測割合をそのまま再現する。したがって $\hat\beta_0$ は内陸群の対数オッズ、$\hat\beta_1$ は 2 群の対数オッズ比になる。

          **途中式** 各群の観測オッズは
          $$\text{沿岸}:\frac{«a1»}{«b1»}=«o1»,\qquad \text{内陸}:\frac{«a0»}{«b0»}=«o0»$$
          $$\hat\beta_1=\ln\frac{«o1»}{«o0»}=\ln«OR»=«lnOR»$$
          （$\hat\beta_0=\ln«o0»=«b0hat»$。尤度方程式 $\sum(y_i-\hat p_i)=0$、$\sum x_i(y_i-\hat p_i)=0$ は、各群で $\hat p$ が観測割合に等しいときに成り立つ。）

          **答え** $«lnor_s»$

          **間違えやすい点** ロジスティック回帰の係数は**オッズ比の対数**であり、割合の比（相対危険 $«p1»/«p0»=«RR»$）の対数 $«lnrr_s»$ ではない。$e^{\hat\beta_1}=«OR_s»$ がオッズ比になる。
          なお、$\hat\beta_1$ の標準誤差は $\sqrt{1/«a1»+1/«b1»+1/«a0»+1/«b0»}=«se1»$ で、2×2 表の対数オッズ比の標準誤差と一致する。

      - id: s16p04c
        chapter: 5
        terms: [poisson-distribution, conditional-probability-function, binomial-distribution]
        topic: ポアソン分布に従うき裂のうち各々が確率qで検出されるとき検出数が与えられたもとでの実際のき裂数の条件付き期待値
        level: 応用
        definition: false
        type: numeric
        question: |
          ある 1 機について、点検間隔の間に新たに生じるき裂の数 $N$ は、この機体の履歴から定めた平均 $\lambda=«lam»$ のポアソン分布に従うとする。
          渦流探傷検査では、各き裂は互いに独立に確率 $q=«q»$ で検出される。今回の点検で «k» 個のき裂が検出された。
          この機体に実際にあるき裂の数の条件付き期待値 $E[N\mid\text{検出数}=«k»]$ を求めよ。
        answer: «c_ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ポアソン分布に従う個数を確率 $q$ で独立に振り分けると、検出数 $K$ と見逃し数 $M=N-K$ は**独立**に、それぞれ平均 $\lambda q$、$\lambda(1-q)$ のポアソン分布に従う（ポアソン分布の分解）。

          **途中式** 同時確率を書くと
          $$P(K=k,M=m)=e^{-\lambda}\frac{\lambda^{k+m}}{(k+m)!}\binom{k+m}{k}q^k(1-q)^m=e^{-\lambda q}\frac{(\lambda q)^k}{k!}\cdot e^{-\lambda(1-q)}\frac{\{\lambda(1-q)\}^m}{m!}$$
          と積に分かれるので $K$ と $M$ は独立。よって $K=«k»$ が与えられても $M$ の分布は変わらず
          $$E[N\mid K=«k»]=«k»+E[M]=«k»+«lam»\times(1-«q»)=«k»+«lq»=«c_ans4»$$

          **答え** $«c_ans2»$

          **間違えやすい点** 検出数を検出確率で割って $«k»/«q»=«c_scale»$ とするのは、$\lambda$ が未知のときの推定の考え方で、条件付き期待値ではない。
          条件を使わずに $«k»+\lambda=«c_add»$ としたり、$1-q$ と $q$ を取り違えて $«c_q»$ としたりしないこと。

  - id: s16p05
    title: 軸受寿命のワイブル解析
    context: |
      ある軸受の寿命 $T$（単位：千時間）は、形状母数 2 のワイブル分布
      $$f(t)=\frac{2t}{\theta}\exp\left(-\frac{t^2}{\theta}\right)\quad(t>0),\qquad R(t)=P(T>t)=\exp\left(-\frac{t^2}{\theta}\right)$$
      に従うとする（$\theta>0$ は未知母数で、尺度母数 $\eta$ を使うと $\theta=\eta^2$）。«n» 個の軸受の寿命試験で次の値を得た。

      $$«t1»,\ «t2»,\ «t3»,\ «t4»,\ «t5»,\ «t6»,\ «t7»,\ «t8»\qquad\left(\textstyle\sum t_i=«S1»,\ \sum t_i^2=«S2»\right)$$
    items:
      - id: s16p05a
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, fisher-information]
        topic: 形状母数が既知のワイブル分布の母数θを寿命データの2乗和から最尤推定する
        level: 基本
        definition: false
        type: choice
        question: |
          $\theta$ の最尤推定値に最も近い値はどれか。
        choices:
          - "$«a_ok»$"
          - "$«a_n1»$"
          - "$«a_mm»$"
          - "$«a_mean»$"
          - "$«a_inv»$"
        answer: 0
        distractors:
          - 正解
          - 2 乗和を n-1 で割った
          - 標本平均の 2 乗を答えた
          - 標本平均を答えた
          - 逆数 n/Σt^2 を答えた（レートの形と取り違えた）
        explanation: |
          **方針** 対数尤度を $\theta$ で微分して 0 とおく。

          **途中式**
          $$\ell(\theta)=\sum_{i=1}^{n}\left\{\ln(2t_i)-\ln\theta-\frac{t_i^2}{\theta}\right\},\qquad \ell'(\theta)=-\frac{n}{\theta}+\frac{\sum t_i^2}{\theta^2}=0$$
          より
          $$\hat\theta=\frac{\sum t_i^2}{n}=\frac{«S2»}{«n»}=«th»$$
          $\ell''(\hat\theta)=n/\hat\theta^2-2\sum t_i^2/\hat\theta^3=-n/\hat\theta^2<0$ なので最大である。

          **答え** $«a_ok»$

          **間違えやすい点** $T^2$ は平均 $\theta$ の指数分布に従うので、$\hat\theta$ は $T^2$ の標本平均になる。不偏性のために $n-1$ で割る必要はない（$E[\hat\theta]=\theta$ で、もともと不偏）。
          $\theta$ は $T$ の平均ではないので、標本平均 $«a_mean»$ やその 2 乗 $«a_mm»$ は答えにならない。

      - id: s16p05b
        chapter: 7
        terms: [weak-law-of-large-numbers, continuous-mapping-theorem, convergence-in-probability]
        topic: ワイブル母数の最尤推定量の一致性を大数の法則で示し連続写像定理から信頼度の推定量の性質を正しく述べた文を選ぶ
        level: 標準
        definition: true
        type: choice
        question: |
          (a) の推定量 $\hat\theta_n=\frac1n\sum_{i=1}^nT_i^2$ と、それを代入した信頼度の推定量 $\hat R_n=\exp(-1/\hat\theta_n)$（1 千時間での信頼度 $R=\exp(-1/\theta)$ の推定量）について、正しい記述はどれか。
        choices:
          - "$\\hat\\theta_n$ は大数の弱法則により $\\theta$ に確率収束し、$\\exp(-1/u)$ は $u>0$ で連続なので、連続写像定理により $\\hat R_n$ も $R$ に確率収束する"
          - "$\\hat\\theta_n$ は $\\theta$ の不偏推定量なので、$\\hat R_n$ もすべての $n$ で $R$ の不偏推定量である"
          - "中心極限定理により、$\\hat\\theta_n$ は $n$ によらず正確に正規分布に従う"
          - "$\\hat\\theta_n$ は定数 $\\theta$ に分布収束するが、確率収束するとはいえない"
          - "$\\hat R_n$ は $\\hat\\theta_n$ の連続関数なので、$\\sqrt n(\\hat R_n-R)$ の漸近分散は $\\sqrt n(\\hat\\theta_n-\\theta)$ の漸近分散と等しい"
        answer: 0
        distractors:
          - 正解
          - 非線形な変換では不偏性は保たれない（イェンセンの不等式）
          - 中心極限定理は n→∞ の極限の主張で、有限の n では近似にすぎない（T^2 は指数分布なので正確には正規でない）
          - 定数への分布収束は確率収束と同値
          - 漸近分散には変換の微分の2乗が掛かる（デルタ法）
        explanation: |
          **方針** 一致性（確率収束）と、連続関数による変換で保たれる性質・保たれない性質を区別する。

          **途中式** $Y_i=T_i^2$ は独立に平均 $\theta$ の指数分布に従い、分散 $\theta^2$ は有限なので、大数の弱法則より $\hat\theta_n\to\theta$（確率収束）。
          $g(u)=\exp(-1/u)$ は $u>0$ で連続なので、連続写像定理により $\hat R_n=g(\hat\theta_n)\to g(\theta)=R$（確率収束）。
          一方、$g$ は線形でないので $E[\hat R_n]=E[g(\hat\theta_n)]\ne g(E[\hat\theta_n])$ で、一般に $\hat R_n$ は不偏でない。漸近分散はデルタ法により $\{g'(\theta)\}^2\theta^2$ で、$\sqrt n(\hat\theta_n-\theta)$ の漸近分散 $\theta^2$ とは異なる。

          **答え** 選択肢 0（$\hat\theta_n$ の一致性と連続写像定理による $\hat R_n$ の一致性）

          **間違えやすい点** 「連続関数で変換しても保たれる」のは確率収束（一致性）や分布収束であり、不偏性や分散は保たれない。
          極限が定数のときは分布収束と確率収束は同値である。$\hat\theta_n$ は和がガンマ分布に従うので、有限の $n$ では正規分布ではない。

  - id: s16p06
    title: 新型ブレーキパッドの制動距離試験
    context: |
      新型ブレーキパッドを付けた試験車で、時速 100 km からの制動距離（m）を «n» 回測ったところ、標本平均 $\bar x=«xbar»$、不偏分散の平方根 $s=«sd»$ だった。
      測定値は互いに独立に正規分布 $N(\mu,\sigma^2)$ に従うとする。社内基準では、制動距離の平均は «mu0» m 以下でなければならない。
    items:
      - id: s16p06a
        chapter: 11
        terms: [one-sample-t-test, t-distribution, t-statistic]
        topic: 制動距離の平均が社内基準を超えるかを1標本t検定（片側）で判定する
        level: 基本
        definition: false
        type: choice
        question: |
          帰無仮説 $H_0:\mu=«mu0»$、対立仮説 $H_1:\mu>«mu0»$ として、有意水準 5% の $t$ 検定を行う。
          必要なら次の値を使え：自由度 9 の $t$ 分布の上側 5% 点 «tc1»、上側 2.5% 点 «tc2»、自由度 10 の $t$ 分布の上側 5% 点 «tc10»。正しい記述はどれか。
        choices:
          - "$t=«t_s»$ で、«tc1» を超えないので帰無仮説を棄却しない"
          - "$t=«t»$ で、«tc2» を超えないので帰無仮説を棄却しない"
          - "$t=«t»$ で、自由度 9 の上側 5% 点 «tc1» を超えるので帰無仮説を棄却し、平均は基準を超えると判断する"
          - "$t=«t_n»$ で、«tc1» を超えるので帰無仮説を棄却する"
          - "$t=«t»$ で、自由度 10 の上側 5% 点 «tc10» を超えるので帰無仮説を棄却する"
        answer: 2
        distractors:
          - 標準誤差 s/√n でなく s で割った
          - 片側検定なのに両側の棄却点（上側 2.5% 点）と比べた
          - 正解
          - √n でなく n で割った
          - 自由度を n-1=9 でなく n=10 とした
        explanation: |
          **方針** 分散が未知なので、標本平均を標準誤差 $s/\sqrt n$ で標準化した $t$ 統計量が、帰無仮説のもとで自由度 $n-1$ の $t$ 分布に従うことを使う。対立仮説が $\mu>«mu0»$ なので上側の片側検定。

          **途中式**
          $$t=\frac{\bar x-\mu_0}{s/\sqrt n}=\frac{«xbar»-«mu0»}{«sd»/«sqn»}=\frac{«diff»}{«se»}=«t4»$$
          自由度 $«n»-1=«df»$ の上側 5% 点 «tc1» を超えるので棄却する。

          **答え** $t=«t»$、帰無仮説を棄却する。

          **間違えやすい点** 両側の点 «tc2» と比べると「棄却しない」になり結論が逆になる。片側か両側かは対立仮説の形で決まる。
          自由度は $n-1=«df»$（$n=«n»$ ではない）。$s$ で割ると $«t_s»$、$n$ で割ると $«t_n»$ になる。

      - id: s16p06b
        chapter: 9
        terms: [ci-two-sample-mean-difference, welch-test, t-distribution]
        topic: 従来パッドと新型パッドの制動距離の平均の差の95%信頼区間を分散の異なるウェルチの方法で求める
        level: 標準
        definition: false
        type: choice
        question: |
          比較のため、従来パッドを付けた同じ試験車で «n2» 回測ったところ、標本平均 «x2»、不偏分散の平方根 «sd2» だった（測定値は独立に正規分布に従い、母分散が等しいとは限らない）。
          平均の差 $\mu_{従来}-\mu_{新型}$ の 95% 信頼区間を、ウェルチの方法（サタスウェイトの近似自由度を**小数点以下切り捨て**て整数にする）で求める。
          必要なら $t_{0.025}(9)=«t9»$、$t_{0.025}(10)=«t10»$、$t_{0.025}(16)=«t16»$ を使え。最も近いものはどれか。
        choices:
          - "$«ci_pool»$"
          - "$«ci_ok»$"
          - "$«ci_z»$"
          - "$«ci_16»$"
          - "$«ci_10»$"
        answer: 1
        distractors:
          - 等分散を仮定したプールした分散の t 区間（自由度 16）を使った
          - 正解
          - 標準正規分布の点 1.96 を使った
          - 標準誤差はウェルチのものを使ったが、自由度を n1+n2-2=16 とした
          - 近似自由度を切り捨てでなく四捨五入して 10 とした
        explanation: |
          **方針** 母分散が等しいとは限らないので、標準誤差は $\sqrt{s_1^2/n_1+s_2^2/n_2}$ とし、自由度をサタスウェイトの式で近似する。

          **途中式** $s_{新}^2/n_{新}=«sd»^2/«n»=«v1»$、$s_{従}^2/n_{従}=«sd2»^2/«n2»=«v2»$ より
          $$\text{SE}=\sqrt{«v1»+«v2»}=\sqrt{«vs»}=«seW»$$
          $$\nu=\frac{«vs»^2}{«v1»^2/«df»+«v2»^2/(«n2»-1)}=\frac{«dfn»}{«dfd1»+«dfd2»}=«dfW»\ \to\ 9$$
          $$«x2»-«xbar»\pm«t9»\times«seW»=«dd»\pm«hwW»\quad\Longrightarrow\quad«ci_ok»$$

          **答え** $«ci_ok»$（0 を含むので、5% 水準では差があるとはいえない）

          **間違えやすい点** 従来パッドの方がばらつきがずっと大きい（$s=«sd2»$ と «sd»）ので、等分散を仮定してプールすると（$s_p^2=«sp2»$）標準誤差を過小評価し、区間 $«ci_pool»$ は 0 を含まず結論が変わる。
          近似自由度は小さい方の標本の自由度に近づくことが多く、$n_1+n_2-2$ をそのまま使うのは誤り。

  - id: s16p07
    title: 社用トラックの臨時整備費の予算
    context: |
      ある運送会社はトラック «m» 台を保有している。各トラックの臨時整備（故障による部品交換など）は、互いに独立に 1 年あたり平均 «rate» 回のポアソン過程に従って起こる。
      1 回の整備費用（万円）は互いに独立で同じ分布に従い、平均 «mu»、標準偏差 «sd» で、整備の発生とも独立とする。
    items:
      - id: s16p07a
        chapter: 15
        terms: [compound-poisson-process, superposition-thinning-poisson, poisson-process]
        topic: 多数のトラックの臨時整備を重ね合わせた複合ポアソン過程の年間総費用の分散から超過確率5%の予算を正規近似で決める
        level: 応用
        definition: false
        type: numeric
        question: |
          会社全体の 1 年間の臨時整備費の総額 $S$ が予算 $B$ を超える確率がおよそ 5% になるように $B$（万円）を決めたい。
          $S$ を平均と分散の等しい正規分布で近似し、標準正規分布の上側 5% 点を «z» として $B$ を求めよ。
        answer: «B»
        tolerance: 0.4
        answer_format: 万円単位で小数第1位を四捨五入した整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 独立なポアソン過程の重ね合わせはポアソン過程なので、会社全体の整備回数 $N$ は平均 $«m»\times«rate»$ のポアソン分布に従う。$S=\sum_{i=1}^{N}X_i$ は複合ポアソン分布で、
          $$E[S]=\lambda E[X],\qquad V[S]=\lambda E[X^2]$$
          （$\lambda=E[N]$）。

          **途中式** $\lambda=«m»\times«rate»=«lam»$、$E[X^2]=V[X]+E[X]^2=«sd2»+«mu2»=«EX2»$。
          $$E[S]=«lam»\times«mu»=«ES»,\qquad V[S]=«lam»\times«EX2»=«VS»,\qquad \sqrt{V[S]}=«sdS»$$
          $$B=«ES»+«z»\times«sdS»=«ES»+«add»=«B2»$$

          **答え** $«B»$

          **間違えやすい点** $V[S]=\lambda V[X]$ とすると、回数のばらつきによる部分 $\lambda E[X]^2$ が抜けて $B=«w_var»$ と予算が不足する。全分散の公式 $V[S]=E[N]V[X]+V[N]E[X]^2$ で $V[N]=E[N]$ とおいても同じ式になる。
          1 回分の標準偏差 «sd» を足すだけ（«w_sd»）にしないこと。

  - id: s16p08
    title: 社用トラックの整備費の重回帰
    context: |
      ある運送会社が保有するトラック «n» 台について、年間整備費 $y$（万円）を目的変数、走行距離・車齢・積載率・山間部走行割合の «p» 個を説明変数とする線形回帰（切片あり）を最小二乗法で当てはめたところ、残差平方和は «sse» だった。
      誤差は互いに独立に $N(0,\sigma^2)$ に従うとする。
    items:
      - id: s16p08a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, hat-matrix, multiple-regression-model]
        topic: 重回帰で指定した条件のトラックの平均整備費の95%信頼区間を計画行列の二次形式から求め予測区間と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          ある条件（説明変数の値を並べたベクトルを $\boldsymbol x_0$、切片の 1 を含む）のトラックについて、当てはめ値は $\hat y_0=«yhat»$ で、$\boldsymbol x_0^\top(X^\top X)^{-1}\boldsymbol x_0=«h0»$ だった（$X$ は計画行列）。
          この条件のトラック全体の**平均**整備費 $E[y\mid\boldsymbol x_0]$ の 95% 信頼区間として最も近いものはどれか。$t$ 分布の上側 2.5% 点は $t_{0.025}(35)=«tc»$ とする。
        choices:
          - "$«ci_pred»$"
          - "$«ci_ok»$"
          - "$«ci_z»$"
          - "$«ci_nosq»$"
          - "$«ci_n»$"
        answer: 1
        distractors:
          - 1 台の値についての予測区間（1+x0'(X'X)^{-1}x0）を答えた
          - 正解
          - σ^2 を推定しているのに標準正規分布の点 1.96 を使った
          - 二次形式 0.10 の平方根をとらずに標準誤差に掛けた
          - 誤差分散を自由度でなく n で割って推定した
        explanation: |
          **方針** $\hat y_0=\boldsymbol x_0^\top\hat{\boldsymbol\beta}$ の分散は $\sigma^2\boldsymbol x_0^\top(X^\top X)^{-1}\boldsymbol x_0$。$\sigma^2$ を $s^2=S_e/(n-p-1)$ で推定すると、自由度 $n-p-1$ の $t$ 分布を使った区間になる。

          **途中式** $s^2=«sse»/(«n»-«p»-1)=«sse»/«df»=«s2»$。
          $$\text{SE}(\hat y_0)=\sqrt{«s2»\times«h0»}=\sqrt{«s2h»}=«se»$$
          $$«yhat»\pm«tc»\times«se»=«yhat»\pm«hw»\quad\Longrightarrow\quad «ci_ok»$$

          **答え** $«ci_ok»$

          **間違えやすい点** 1 台の整備費を予測するなら新しい誤差の分も加わり、$\pm«tc»\sqrt{«s2»\times(1+«h0»)}=\pm«pred_hw»$ の予測区間 $«ci_pred»$ になる。「平均」の信頼区間と「1 台」の予測区間を区別する。
          $\boldsymbol x_0^\top(X^\top X)^{-1}\boldsymbol x_0$ は、$\boldsymbol x_0$ が観測値の 1 つならそのてこ比にあたる。

      - id: s16p08b
        chapter: 17
        terms: [residual-plot, heteroscedasticity, weighted-least-squares]
        topic: 当てはめ値の大きさごとの残差の標準偏差から誤差分散が当てはめ値の2乗に比例すると読み取り重み付き最小二乗の重みを選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          このモデルの残差を当てはめ値に対してプロットすると、当てはめ値が大きいほど残差が大きく広がっていた。当てはめ値をおよそ 3 つの範囲に分けて残差の標準偏差を求めると次のようになった。

          | 当てはめ値の範囲の中心 | «f1» | «f2» | «f3» |
          |---|---|---|---|
          | 残差の標準偏差 | «r1» | «r2» | «r3» |

          この結果の読み取りと対処として最も適切なものはどれか。
        choices:
          - "誤差の分散が当てはめ値にほぼ比例しているので、重み $1/\\hat y_i$ の重み付き最小二乗法を使う"
          - "誤差の標準偏差が当てはめ値にほぼ比例しているので、重み $1/\\hat y_i^2$ の重み付き最小二乗法を使う（または目的変数を対数変換する）"
          - "不均一分散があると最小二乗推定量は偏りをもつので、係数の推定値そのものが信用できない"
          - "残差の広がりが変わるのは誤差の系列相関のためなので、ダービン・ワトソン検定で調べる"
          - "ばらつきの大きい観測を重視するため、重み $\\hat y_i^2$ の重み付き最小二乗法を使う"
        answer: 1
        distractors:
          - 標準偏差と分散を取り違えた（分散/当てはめ値は 0.22・0.40・0.62 と増えていて一定でない）
          - 正解
          - 不均一分散でも最小二乗推定量は不偏。問題になるのは標準誤差と効率
          - 系列相関は観測の順序に沿った残差の関係で、当てはめ値に対する広がりとは別の問題
          - 重みは分散の逆数にする（ばらつきの大きい観測を軽く扱う）
        explanation: |
          **方針** 残差の標準偏差と当てはめ値の比、分散と当てはめ値の比のどちらが一定かを調べ、誤差分散のモデル $V[\varepsilon_i]\propto\hat y_i^{\,k}$ の $k$ を決める。重みは分散の逆数にとる。

          **途中式** 標準偏差 ÷ 当てはめ値：$«r1»/«f1»=«q1»$、$«r2»/«f2»=«q2»$、$«r3»/«f3»=«q3»$ でほぼ一定。
          分散 ÷ 当てはめ値：$«v1»$、$«v2»$、$«v3»$ と増えていく。
          よって $\sqrt{V[\varepsilon_i]}\propto\hat y_i$、すなわち $V[\varepsilon_i]\propto\hat y_i^2$ で、重みは $w_i=1/\hat y_i^2$。

          **答え** 重み $1/\hat y_i^2$ の重み付き最小二乗法（または対数変換）

          **間違えやすい点** 標準偏差が比例するのか分散が比例するのかで重みが変わる。分散が当てはめ値に比例する（ポアソン型）なら重み $1/\hat y_i$ や平方根変換になる。
          不均一分散のもとでも最小二乗推定量は不偏だが、通常の標準誤差が正しくなくなり、推定の効率も落ちる。

  - id: s16p09
    title: 予防点検の効果の評価
    context: |
      ある自動車メーカーは、予防点検を受けたか（$X=1$：受けた、$X=0$：受けない）が 1 年以内の故障（$Y=1$：故障あり）に与える因果効果を調べたい。専門家の知識から、次の関係（有向非巡回グラフの矢印）を想定した。

      - $Z$：寒冷地での運用（$Z\to X$、$Z\to Y$）
      - $M$：主要部品の摩耗度（$X\to M$、$M\to Y$）
      - $C$：整備記録の詳細さ（$X\to C$、$Y\to C$）

      矢印はこの 6 本だけとする。多数の車両の観察データから次の割合を得た。

      | | 寒冷地（$Z=1$） | それ以外（$Z=0$） |
      |---|---|---|
      | $P(Z)$ | «pz» | «pz0» |
      | $P(X=1\mid Z)$ | «px1» | «px0» |
      | $P(Y=1\mid X=1,Z)$ | «y11» | «y10» |
      | $P(Y=1\mid X=0,Z)$ | «y01» | «y00» |
    items:
      - id: s16p09a
        chapter: 33
        terms: [backdoor-criterion, causal-effect, d-separation]
        topic: 寒冷地を交絡因子とするバックドア調整で予防点検を受けた車についての平均因果効果（ATT）を求める
        level: 標準
        definition: false
        type: choice
        question: |
          **予防点検を受けた車**について、点検を受けなかったとした場合と比べて故障確率がどれだけ変わったか（処置群の平均因果効果 $E[Y^{(1)}-Y^{(0)}\mid X=1]$）を、グラフから正しい調整をして求める。最も近い値はどれか。
        choices:
          - "$«naive»$"
          - "$«ate»$"
          - "$«att»$"
          - "$«avg»$"
          - "$«atc»$"
        answer: 2
        distractors:
          - 調整せずに点検を受けた車と受けなかった車の故障率の差をとった（Z による交絡が残る）
          - 母集団全体の平均因果効果（重み P(Z)）を答えた
          - 正解
          - 2 つの層の効果を単純平均した
          - 点検を受けなかった車の分布 P(Z|X=0) で重み付けた（ATC）
        explanation: |
          **方針** $X$ に入る矢印は $Z\to X$ だけなので、$\{Z\}$ はバックドア基準を満たす（$M$ は $X$ の子孫の媒介変数、$C$ は合流点なので調整しない）。$Z$ の層ごとの差を求め、**点検を受けた車での** $Z$ の分布 $P(Z\mid X=1)$ で重み付ける。

          **途中式** 層ごとの効果：寒冷地 $«y11»-«y01»=«e1»$、それ以外 $«y10»-«y00»=«e0»$。
          $P(X=1,Z=1)=«pz»\times«px1»=«j1»$、$P(X=1,Z=0)=«pz0»\times«px0»=«j0»$、$P(X=1)=«pX1»$ より
          $$P(Z=1\mid X=1)=\frac{«j1»}{«pX1»}=«w1»,\qquad P(Z=0\mid X=1)=«w0»$$
          $$\text{ATT}=(«e1»)\times«w1»+(«e0»)\times«w0»=«att4»$$

          **答え** $«att»$

          **間違えやすい点** 重みを $P(Z)$ にすると全体の平均因果効果 $«ate»$ になる。点検を受けた車は寒冷地に多く、寒冷地では効果が大きいので、ATT は ATE より絶対値が大きい。
          調整しない単純な差は $«naive»$ で、寒冷地（故障しやすい）ほど点検を受けるという交絡のため効果を過小に見せる。

      - id: s16p09b
        chapter: 19
        terms: [endogeneity, omitted-variable-bias, multiple-regression-model]
        topic: 転記誤差のある点検回数を説明変数にした回帰の係数の減衰を交絡因子で調整した残差分散と誤差分散から補正する
        level: 応用
        definition: false
        type: choice
        question: |
          別の分析で、年間の点検回数 $X^\ast$ と年間の故障件数 $Y$ の関係を調べた。点検回数は紙の記録から転記しており、記録上の回数は真の回数 $X$ に誤差 $U$ が加わった $X^\ast=X+U$ である。
          $U$ は $X$・$Z$・$Y$ の誤差と独立で、分散は «vu» とわかっている。$Y$ を $X^\ast$ と $Z$ に重回帰すると $X^\ast$ の係数は «bo» だった。
          また $X^\ast$ の分散は «vtot»、$X^\ast$ を $Z$ に回帰した残差の分散は «vres» だった。真のモデル $Y=\alpha+\beta X+\gamma Z+\varepsilon$ の $\beta$ の推定値に最も近いものはどれか（標本は十分大きいとする）。
        choices:
          - "$«w_u»$"
          - "$«beta»$"
          - "$«w_tot»$"
          - "$«w_raw»$"
          - "$«w_mul»$"
        answer: 1
        distractors:
          - 信頼性比を (残差分散)/(誤差分散) とした
          - 正解
          - Z を調整した残差分散でなく X* 全体の分散で信頼性比を作った
          - 測定誤差による減衰を補正しなかった
          - 補正の向きを逆にして信頼性比を掛けた
        explanation: |
          **方針** 説明変数に測定誤差があると、最小二乗推定量は 0 の方向に偏る（減衰）。$Z$ も説明変数に入っているときは、$Z$ で説明できない部分（$Z$ に回帰した残差）の分散で信頼性比を作る（フリッシュ・ウォー・ロベルの定理）。
          $$\operatorname{plim}\hat\beta^\ast=\beta\times\frac{V[X\mid Z\text{ の残差}]}{V[X\mid Z\text{ の残差}]+V[U]}$$

          **途中式** $X^\ast$ の残差分散 «vres» のうち «vu» は誤差なので、真の $X$ の残差分散は $«vres»-«vu»=«vx»$。信頼性比は $«vx»/«vres»=«rel»$。
          $$\hat\beta=\frac{«bo»}{«rel»}=«bo»\times\frac{«vres»}{«vx»}=«beta»$$

          **答え** $«beta»$

          **間違えやすい点** $X^\ast$ 全体の分散 «vtot» を使うと $«bo»\times«vtot»/(«vtot»-«vu»)=«w_tot»$ になる。$Z$ と相関する部分は重回帰で取り除かれているので、信頼性比は残差分散で作る。
          減衰を補正するのだから、推定値は観測された係数より絶対値が**大きく**なる。

  - id: s16p10
    title: 潤滑油4種類の摩耗量の多重比較
    context: |
      4 種類の潤滑油 A〜D について、それぞれ «m» 台の試験装置で一定時間運転したあとの軸の摩耗量（μm）を測った。各潤滑油の平均は次のとおりで、一元配置分散分析の誤差の平均平方は $V_E=«mse»$（自由度 «dfe»）だった。

      | 潤滑油 | A | B | C | D |
      |---|---|---|---|---|
      | 平均摩耗量 | «mA» | «mB» | «mC» | «mD» |
    items:
      - id: s16p10a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 4種類の潤滑油の平均摩耗量の全対比較をテューキーの方法で行い有意な対の数を数える
        level: 標準
        definition: false
        type: choice
        question: |
          全体の有意水準を 5% に保つテューキーの方法で、6 組すべての平均の差を比べる。スチューデント化された範囲の分布の上側 5% 点は $q_{0.05}(4,20)=«qc»$、
          $t$ 分布の上側 2.5% 点は $t_{0.025}(20)=«tc»$ とする。差が有意になる最小の値（HSD）と、有意になる対の数の組として正しいものはどれか。
        choices:
          - "HSD $=«h_2»$、有意な対は «k_2» 組"
          - "HSD $=«h_lsd»$、有意な対は «k_lsd» 組"
          - "HSD $=«h_nom»$、有意な対は «k_nom» 組"
          - "HSD $=«h_ok»$、有意な対は «k_ok» 組"
          - "HSD $=«h_half»$、有意な対は «k_half» 組"
        answer: 3
        distractors:
          - q に √(2V_E/m) を掛けた（t 検定の標準誤差と混同した）
          - テューキーの方法でなく t 分布の点による最小有意差（LSD）を使った（多重性を調整していない）
          - V_E を m で割り忘れた
          - 正解
          - √(V_E/(2m)) を掛けた
        explanation: |
          **方針** 各群の大きさが等しいとき、テューキーの方法では 2 群の平均の差の絶対値が
          $$\text{HSD}=q_{0.05}(k,\phi_E)\sqrt{\frac{V_E}{m}}$$
          を超えれば有意とする（$k$ は群の数、$\phi_E$ は誤差の自由度、$m$ は各群の大きさ）。

          **途中式**
          $$\text{HSD}=«qc»\times\sqrt{\frac{«mse»}{«m»}}=«qc»\times«smsen»=«hsd4»$$
          差の絶対値：B−A $=«dBA»$、C−A $=«dCA»$、D−A $=«dDA»$、C−B $=«dCB»$、D−B $=«dDB»$、D−C $=«dDC»$。
          «hsd» を超えるのは D−A と D−B の «k_ok» 組。

          **答え** HSD $=«h_ok»$、有意な対は «k_ok» 組

          **間違えやすい点** $q$ 分布の点には $\sqrt{V_E/m}$ を掛ける（$t$ 検定の $\sqrt{2V_E/m}$ ではない。$q$ 分布の点には $\sqrt2$ がすでに含まれており、群が 2 つなら $q_{0.05}(2,\phi)=\sqrt2\,t_{0.025}(\phi)$ で $t$ 検定と一致する）。$\sqrt{2V_E/m}$ を掛けると $«h_2»$。
          $t$ 分布の点で 6 回検定する（LSD $=«tc»\times\sqrt{2\times«mse»/«m»}=«h_lsd»$）と、全体の第 1 種の誤りの確率が 5% を大きく超える。

  - id: s16p11
    title: 社用車のブレーキ整備費と新型パッドの効果
    context: |
      ある会社は社用車 «N» 台のブレーキについて、整備費の調査と新型パッドの効果の調査を行った。
    items:
      - id: s16p11a
        chapter: 21
        terms: [ratio-estimation, simple-random-sampling, finite-population-correction]
        topic: 走行距離を補助変数にした比推定量の分散を単純無作為抽出の標本平均の分散と比べて相対効率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          «N» 台から «nn» 台を非復元で単純無作為抽出し、年間のブレーキ整備費 $y$（千円）を調べた。年間走行距離 $x$（千 km）は台帳から全台についてわかっている。
          標本では $\bar y=«ybar»$、$\bar x=«xbar»$、$y$ の不偏分散 «sy2»、$x$ の不偏分散 «sx2»、共分散 «sxy» だった。
          1 台あたりの平均整備費を、比推定量 $\hat{\bar Y}_R=(\bar y/\bar x)\bar X$（$\bar X$ は全台の平均走行距離）で推定する。その近似分散
          $$V[\hat{\bar Y}_R]\approx\frac{1-f}{n}\left(S_y^2-2RS_{xy}+R^2S_x^2\right)\qquad(f=n/N,\ R=\bar Y/\bar X)$$
          に標本の値を代入したものと、標本平均 $\bar y$ の分散 $\frac{1-f}{n}S_y^2$ の推定値との比 $V[\hat{\bar Y}_R]/V[\bar y]$ を求めよ（$R$ は $\bar y/\bar x$ で推定する）。
        answer: «eff»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 2 つの分散の式は $(1-f)/n$ が共通なので、括弧の中どうしの比をとればよい。

          **途中式** $\hat R=«ybar»/«xbar»=«R»$。
          $$S_y^2-2\hat RS_{xy}+\hat R^2S_x^2=«sy2»-2\times«R»\times«sxy»+«R2»\times«sx2»=«sy2»-«t2»+«t3»=«num»$$
          $$\frac{V[\hat{\bar Y}_R]}{V[\bar y]}=\frac{«num»}{«sy2»}=«eff_s»$$

          **答え** $«eff_s»$（比推定で分散が約 4 分の 1 になる）

          **間違えやすい点** 中央の項の 2 を落とすと $«w_no2»$ となり、比推定の方が悪いように見える。比推定が有利になるのは、相関係数 $\rho=«sxy»/\sqrt{«sy2»\times«sx2»}=«rho»$ が $\frac12\cdot\frac{C_x}{C_y}$（変動係数の比の半分）より大きいときである。
          回帰推定量なら近似分散の比は $1-\rho^2=«w_reg»$ で、比推定量はそれより大きくなる（原点を通る直線の関係でなければ回帰推定の方が効率がよい）。

      - id: s16p11b
        chapter: 28
        terms: [risk-difference, relative-risk, two-by-two-table]
        topic: 新型と従来のパッドの早期摩耗率の差（リスク差）から1台の早期摩耗を防ぐのに必要な新型の装着台数（NNT）を求める
        level: 標準
        definition: false
        type: choice
        question: |
          社用車を無作為に 2 群に分け、«n1» 台に新型パッド、«n0» 台に従来パッドを付けて 1 年間使ったところ、早期摩耗が起きたのは新型で «w1» 台、従来で «w0» 台だった。
          従来パッドの代わりに新型パッドを付けることで、早期摩耗を 1 台減らすのに平均して何台に新型を付ける必要があるか（NNT、切り上げて整数）。最も適切なものはどれか。
        choices:
          - "«w_rr» 台"
          - "«w_pct» 台"
          - "«w_p0» 台"
          - "«w_p1» 台"
          - "«nnt» 台"
        answer: 4
        distractors:
          - 相対危険の減少 1-RR の逆数をとった
          - リスク差を百分率の数字 6 のまま答えた
          - 従来群の摩耗率の逆数をとった
          - 新型群の摩耗率の逆数をとった
          - 正解
        explanation: |
          **方針** 1 台あたり早期摩耗が減る確率はリスク差 $p_{従来}-p_{新型}$。その逆数が、1 台の早期摩耗を防ぐのに必要な台数（NNT）になる。

          **途中式** $p_{新型}=«w1»/«n1»=«p1»$、$p_{従来}=«w0»/«n0»=«p0»$。
          $$\text{RD}=«p0»-«p1»=«rd»,\qquad \text{NNT}=\frac{1}{«rd»}=«nnt_raw»\ \to\ «nnt»\ \text{台}$$

          **答え** «nnt» 台

          **間違えやすい点** 相対危険 $«p1»/«p0»=«rr»$ はもとの摩耗率の大きさによらない比で、効果の「台数」を表すには差（リスク差）が必要。$1/(1-\text{RR})$ や各群の率の逆数は NNT ではない。
          同じ相対危険でも、もとの摩耗率が低ければリスク差は小さく、NNT は大きくなる。

  - id: s16p12
    title: エンジン振動データの多変量解析
    context: |
      ある航空機エンジンの点検で、振動スペクトルからいくつかの特徴量を作り、多数のエンジンについて記録した。特徴量を標準化して（相関行列にもとづく）主成分分析を行った。
    items:
      - id: s16p12a
        chapter: 22
        terms: [biplot, principal-component-loading, pca-on-correlation-matrix]
        topic: 相関行列の主成分分析で第1・第2主成分の負荷量から2つの特徴量の相関係数を近似する（バイプロットの読み取り）
        level: 基本
        definition: false
        type: choice
        question: |
          3 つの特徴量の、第 1・第 2 主成分に対する負荷量（主成分得点と変数の相関係数）は次のとおりだった。

          | 特徴量 | 第 1 主成分 | 第 2 主成分 |
          |---|---|---|
          | $x_1$（低周波の振幅） | «l11» | «l12» |
          | $x_2$（高周波の振幅） | «l21» | «l22» |
          | $x_3$（回転数との位相差） | «l31» | «l32» |

          第 1・第 2 主成分だけを使って、$x_1$ と $x_2$ の相関係数を近似した値に最も近いものはどれか。
        choices:
          - "$«w_pc2»$"
          - "$«r12»$"
          - "$«w_cos»$"
          - "$«w_pc1»$"
          - "$«w_sign»$"
        answer: 1
        distractors:
          - 第 2 主成分の積だけを使った
          - 正解
          - 負荷量ベクトルのなす角の余弦（長さで割った値）を答えた
          - 第 1 主成分の積だけを使った
          - 第 2 主成分の積の符号を逆にした
        explanation: |
          **方針** 相関行列 $R$ は固有値分解で $R=\sum_m\lambda_m\boldsymbol e_m\boldsymbol e_m^\top$ と書け、負荷量は $l_{jm}=\sqrt{\lambda_m}e_{jm}$ なので、$r_{jk}=\sum_m l_{jm}l_{km}$（すべての主成分についての和）。上位の主成分だけで和をとると相関係数の近似になる。

          **途中式**
          $$r_{12}\approx«l11»\times«l21»+«l12»\times(«l22»)=«p1»+(«p2»)=«r12»$$

          **答え** $«r12»$

          **間違えやすい点** 第 1 主成分だけでは $«w_pc1»$ で、第 2 主成分の方向で $x_1$ と $x_2$ が逆を向いている分を引く必要がある。
          バイプロットで変数の矢印のなす角の余弦は $«w_cos»$ だが、これが相関係数に一致するのは 2 つの主成分で各変数の分散がほぼ説明され、矢印の長さが 1 に近いとき（$x_1$ では $«l11»^2+«l12»^2=«h1»$）に限られる。

      - id: s16p12b
        chapter: 24
        terms: [centroid-method, lance-williams-formula, hierarchical-clustering]
        topic: 重心法で2つのクラスターを併合したあとの第3のクラスターとの距離をランス・ウィリアムズの更新式で求める
        level: 標準
        definition: false
        type: choice
        question: |
          エンジンを振動の特徴（標準化した 2 つの主成分得点）で階層的にクラスタリングする。距離は**重心どうしのユークリッド距離の 2 乗**とし、重心法で併合する。
          ある段階でクラスターは A（«nA» 台）、B（«nB» 台）、C（«nC» 台）の 3 つで、重心間の距離の 2 乗は次のとおりだった。

          | | A–B | A–C | B–C |
          |---|---|---|---|
          | 距離の 2 乗 | «dAB» | «dAC» | «dBC» |

          最も近い A と B を併合したとき、新しいクラスター A∪B と C の距離（重心間の距離の 2 乗）に最も近い値はどれか。
        choices:
          - "$«single»$"
          - "$«lw»$"
          - "$«median»$"
          - "$«nolast»$"
          - "$«ward»$"
        answer: 1
        distractors:
          - 最短距離法のように A–C と B–C の小さい方をとった
          - 正解
          - クラスターの大きさを無視して重み 1/2 ずつとした（メジアン法）
          - ランス・ウィリアムズの式の最後の項（A–B の距離の補正）を忘れた
          - ウォード法の更新式を使った
        explanation: |
          **方針** 重心法では、併合後の重心は大きさで重み付けた平均 $\bar{\boldsymbol x}_{AB}=(n_A\bar{\boldsymbol x}_A+n_B\bar{\boldsymbol x}_B)/(n_A+n_B)$。これと C の重心の距離の 2 乗は、ランス・ウィリアムズの更新式
          $$d^2(A\cup B,C)=\frac{n_A}{n_A+n_B}d^2(A,C)+\frac{n_B}{n_A+n_B}d^2(B,C)-\frac{n_An_B}{(n_A+n_B)^2}d^2(A,B)$$
          で、元の距離だけから求められる。

          **途中式** $n_A+n_B=«nn»$ なので
          $$d^2=«wA»\times«dAC»+«wB»\times«dBC»-«wAB»\times«dAB»=«t1»+«t2»-«t3»=«lw»$$

          **答え** $«lw»$

          **間違えやすい点** 最後の補正項を忘れると $«nolast»$、重みを 1/2 ずつにするとメジアン法の $«median»$ になる。
          補正項は、重みつき平均の点までの距離の 2 乗が、各点までの距離の 2 乗の重みつき平均より小さくなるぶん（平行軸の定理）である。

          **別解** たとえば A の重心を $(0,0)$、B を $(2,0)$、C を $(3,3)$ に置くと表の距離になる。併合後の重心は $(«gx»,0)$ で、C までの距離の 2 乗は $(3-«gx»)^2+3^2=«lw»$。

  - id: s16p13
    title: エンジンオイルの劣化指標の予測
    context: |
      あるディーゼルエンジンでは、オイル交換後、一定走行距離ごとにオイルの劣化指標 $y_t$ を測っている。指標は単調に増える傾向があるので、差分 $\Delta y_t=y_t-y_{t-1}$ に定数項つきの AR(1) モデル
      $$\Delta y_t=«c»+«phi»\,\Delta y_{t-1}+\varepsilon_t$$
      を当てはめた（$\varepsilon_t$ は平均 0 のホワイトノイズ）。これは ARIMA(1,1,0) モデルである。直近 2 回の測定値は $y_{T-1}=«y0»$、$y_T=«y1»$ だった。
    items:
      - id: s16p13a
        chapter: 27
        terms: [arima-model, forecasting, ar-model]
        topic: 差分がAR(1)に従うARIMA(1,1,0)モデルで劣化指標の2期先の予測値を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          時点 $T$ までの情報にもとづく $y_{T+2}$ の予測値（条件付き期待値）を求めよ。
        answer: «f2»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** まず差分の予測値を AR(1) の式で 1 期ずつ求め（未来の $\varepsilon$ は 0 で置き換える）、それを最後の観測値に足し上げて水準に戻す。

          **途中式** $\Delta y_T=«y1»-«y0»=«d»$。
          $$\widehat{\Delta y}_{T+1}=«c»+«phi»\times«d»=«d1»,\qquad \widehat{\Delta y}_{T+2}=«c»+«phi»\times«d1»=«d2»$$
          $$\hat y_{T+2}=y_T+\widehat{\Delta y}_{T+1}+\widehat{\Delta y}_{T+2}=«y1»+«d1»+«d2»=«f2s»$$

          **答え** $«f2s»$

          **間違えやすい点** 2 期先の差分だけを足すと $«w_last»$（1 期先の増分を足し忘れ）。$\widehat{\Delta y}_{T+2}$ を $c+\phi^2\Delta y_T$ とすると定数項の伝わりを落として $«w_phi2»$ になる。
          直近の増分 $«d»$ が続くとすると $«w_lin»$。水準 $y_t$ そのものを AR(1) とみなすのも誤りである。差分の予測値は平均 $c/(1-\phi)=«mu»$ に近づいていく。

  - id: s16p14
    title: 損傷指標のモンテカルロ評価と対称変量法
    context: |
      ある部品の疲労損傷の指標の期待値 $\theta=E[U^2]$（$U$ は区間 $(0,1)$ の一様分布に従う）をモンテカルロ法で求める方法を比べる（方法の比較のため、真の値 $\theta=1/3$ はわかっているものとする）。
      一様乱数を $2n$ 個使う次の 2 つの推定量を考える。

      - 方法 1：独立な $U_1,\ldots,U_{2n}$ から $\hat\theta_1=\dfrac{1}{2n}\sum_{i=1}^{2n}U_i^2$
      - 方法 2（対称変量法）：独立な $U_1,\ldots,U_n$ と、それと対になる $1-U_i$ を使い、$\hat\theta_2=\dfrac{1}{n}\sum_{i=1}^{n}\dfrac{U_i^2+(1-U_i)^2}{2}$
    items:
      - id: s16p14a
        chapter: 32
        terms: [variance-reduction, monte-carlo-integration, uniform-random-number]
        topic: 対称変量法で一様乱数の2乗の期待値を推定するときの分散の比を共分散から求める
        level: 応用
        definition: false
        type: choice
        question: |
          分散の比 $V[\hat\theta_2]/V[\hat\theta_1]$ に最も近い値はどれか。必要なら $E[U^k]=1/(k+1)$ と $E[U^2(1-U)^2]=«EUU»$ を使え。
        choices:
          - "$«w_single»$"
          - "$«ok»$"
          - "$«w_rho2»$"
          - "$«w_nocov»$"
          - "$«w_sign»$"
        answer: 1
        distractors:
          - 方法 2 の 1 対の平均の分散を、方法 1 の乱数 1 個の分散と比べた（使う乱数の数をそろえていない）
          - 正解
          - 分散の比を 1-ρ^2 とした（相関の使い方の誤り）
          - U と 1-U の共分散を無視した（独立とみなした）
          - 共分散の符号を逆にして足した
        explanation: |
          **方針** $U$ と $1-U$ は同じ分布に従い、$g(u)=u^2$ が単調なので $g(U)$ と $g(1-U)$ は負の相関をもつ。1 対の平均の分散 $\{V[g(U)]+\mathrm{Cov}(g(U),g(1-U))\}/2$ を、独立な 2 個の平均の分散 $V[g(U)]/2$ と比べる（どちらも乱数 2 個ぶん）。

          **途中式**
          $$V[U^2]=E[U^4]-(E[U^2])^2=\frac15-\frac19=«var»$$
          $$\mathrm{Cov}(U^2,(1-U)^2)=E[U^2(1-U)^2]-E[U^2]E[(1-U)^2]=«EUU»-\frac19=«cov»$$
          （$1-U$ も一様分布なので $E[(1-U)^2]=1/3$）。1 対の平均の分散は
          $$\frac{«var»+(«cov»)}{2}=\frac{«sumvc»}{2}=«pair»$$
          独立な 2 個の平均の分散は $«var»/2=«indep2»$。$n$ で割るのは共通なので
          $$\frac{V[\hat\theta_2]}{V[\hat\theta_1]}=\frac{«pair»}{«indep2»}=«ok»$$

          **答え** $«ok»$（相関係数 $\rho=«rho»$ で、比は $1+\rho$ に等しい）

          **間違えやすい点** 共分散を無視すると比は 1 で、対称変量法の効果がなくなる。比べるときは使う乱数の数（$2n$ 個）をそろえる。1 対の平均の分散を乱数 1 個の分散と比べると $«w_single»$ と効果を過大に見積もる。
          共分散が負になるのは $g$ が単調なときで、単調でない関数では対称変量法で分散が増えることもある。
