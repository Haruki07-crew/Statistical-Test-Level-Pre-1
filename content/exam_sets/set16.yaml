          - "$t=«t_n»$ で、«tc1» を超えるので帰無仮説を棄却する"
          - "$t=«t»$ で、自由度 10 の上側 5% 点 «tc10» を超えるので帰無仮説を棄却する"
        answer: 2
        distractors:
