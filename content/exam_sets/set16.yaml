          $$«b0»+«b1»\ln a_{90}=«z90»\quad\Longrightarrow\quad \ln a_{90}=\frac{«z90»-(«b0»)}{«b1»}=«la»$$
          $$a_{90}=e^{«la»}=«x_ok»$$

          **答え** 約 $«a_ok»$ mm

