set: 16
title: 模擬試験 第16回
minutes: 90
problems:
  - id: s16p01
    title: 対気速度センサーの三重冗長と異常検知
    context: |
      ある旅客機は対気速度を 3 つのセンサーで測り、2 つ以上が正常なら多数決で正しい値を出す（2-out-of-3 構成）。
      1 回の飛行で厳しい着氷条件に遭遇する確率は $«c»$ である。着氷条件に遭遇しない飛行では、各センサーは**互いに独立に**確率 $«p»$ で故障し、
      着氷条件に遭遇した飛行では、各センサーは**互いに独立に**確率 $«q»$ で故障する（着氷の有無が与えられたもとで条件付き独立）。
    items:
      - id: s16p01a
        chapter: 1
        terms: [law-of-total-probability, conditional-independence, independence-of-events]
        topic: 着氷という共通原因を含む3重冗長センサーの多数決が誤る確率を全確率の公式で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          1 回の飛行で、正常なセンサーが 2 つ未満になり多数決の出力が誤る確率を求めよ。
        answer: «ans»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** センサーどうしは着氷の有無が与えられたときだけ独立である。そこで着氷の有無で場合分けし、それぞれで「3 個中 2 個以上が故障する確率」を二項分布で求めて、全確率の公式で合わせる。

          **途中式** 各センサーが独立に確率 $x$ で故障するとき、故障が 2 個以上になる確率は
          $$g(x)=3x^2(1-x)+x^3$$
          着氷あり：$g(«q»)=3\times«q2»\times«q1»+«q3»=«fq»$

          着氷なし：$g(«p»)=3\times«p2»\times«p1»+«p3»=«fp»$

          全確率の公式より
          $$P(\text{誤り})=«c»\times«fq»+«c1»\times«fp»=«t1»+«t2»=«ans7»$$

          **答え** $«ans_s»$

          **間違えやすい点** センサーの故障の周辺確率 $«c»\times«q»+«c1»\times«p»=«pbar»$ を求め、3 つが独立だとして $g(«pbar»)$ とすると $«w_noice»$ ではなく $«w_bar»$ になり、誤る確率を 4 分の 1 以下に過小評価する。着氷のもとでは 3 つが同時に壊れやすく、周辺的には独立でない（共通原因故障）。
          着氷を無視すると $«w_noice»$、着氷ありの項だけだと $«w_ice»$ になる。

      - id: s16p01b
        chapter: 23
        terms: [fisher-linear-discriminant-function, linear-discriminant-analysis, mahalanobis-distance]
        topic: 2つの特徴量の共通の共分散行列の逆行列からフィッシャーの線形判別関数を作りセンサー故障の有無を判別する
        level: 標準
        definition: false
        type: choice
        question: |
          健全性監視システムは、飛行ごとに 2 つの特徴量 $\boldsymbol x=(x_1,x_2)^\top$（$x_1$：センサー出力のばらつき、$x_2$：他のセンサーとの差）を記録する。
          過去のデータから、正常な飛行の平均は $\boldsymbol\mu_N=(«mN1»,«mN2»)^\top$、センサー故障があった飛行の平均は $\boldsymbol\mu_F=(«mF1»,«mF2»)^\top$、
          2 群に共通の分散共分散行列は
          $$\Sigma=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
          と推定された。2 群の事前確率と誤判別の損失は等しいとし、フィッシャーの線形判別関数
          $$h(\boldsymbol x)=\boldsymbol w^\top\boldsymbol x-\boldsymbol w^\top\frac{\boldsymbol\mu_N+\boldsymbol\mu_F}{2},\qquad \boldsymbol w=\Sigma^{-1}(\boldsymbol\mu_F-\boldsymbol\mu_N)$$
          が正なら「故障」と判定する。新しい飛行の特徴量が $\boldsymbol x=(«x1»,«x2»)^\top$ のとき、正しいものはどれか。
        choices:
          - "$\\boldsymbol w=«wok»$、$h=«h_ok»$ で「故障」と判定する"
          - "$\\boldsymbol w=«wd»$、$h=«h_d»$ で「正常」と判定する"
          - "$\\boldsymbol w=«wsign»$、$h=«h_sign»$ で「故障」と判定する"
          - "$\\boldsymbol w=«wok»$、$h=«h_ok»$ で「正常」と判定する"
          - "$\\boldsymbol w=«wdiag»$、$h=«h_diag»$ で「故障」と判定する"
        answer: 0
        distractors:
          - 正解
          - 逆行列を掛けず平均の差をそのまま係数にした（共分散を無視したユークリッド距離の判別）
          - 2×2 の逆行列で非対角成分の符号を変え忘れた
          - h の符号と判定の向きを逆にした
          - 分散で割るだけで共分散（非対角成分）を無視した
        explanation: |
          **方針** 共通の共分散行列をもつ 2 群の線形判別では、係数 $\boldsymbol w=\Sigma^{-1}(\boldsymbol\mu_F-\boldsymbol\mu_N)$ を求め、2 つの平均の中点で $h=0$ となるようにしきい値を置く。これはマハラノビス距離の近い方の群に判定するのと同じである。

          **途中式** $\det\Sigma=«s11»\times«s22»-«s12»^2=«det»$ より
          $$\Sigma^{-1}=\frac{1}{«det»}\begin{pmatrix}«s22»&-«s12»\\-«s12»&«s11»\end{pmatrix},\qquad \boldsymbol\mu_F-\boldsymbol\mu_N=\begin{pmatrix}«d1»\\«d2»\end{pmatrix}$$
          $$\boldsymbol w=\frac{1}{«det»}\begin{pmatrix}«s22»\times«d1»-«s12»\times«d2»\\-«s12»\times«d1»+«s11»\times«d2»\end{pmatrix}=\begin{pmatrix}«w1»\\«w2»\end{pmatrix}$$
          中点は $(«m1»,«m2»)$ なので $\boldsymbol w^\top(\text{中点})=«w1»\times«m1»+«w2»\times«m2»=«cok»$。
          $$h=«w1»\times«x1»+«w2»\times«x2»-«cok»=«wx»-«cok»=«h_ok»>0$$
          よって「故障」と判定する。

          **答え** $\boldsymbol w=«wok»$、$h=«h_ok»$ で「故障」

          **間違えやすい点** 逆行列を掛けずに $\boldsymbol w=«wd»$ とすると、しきい値 «c_d» に対して «wx_d» となり「正常」と判定してしまう。$x_1$ と $x_2$ は正の相関をもつので、$x_1$ が大きく $x_2$ が小さいという組合せは、正常群の典型からは外れている。
          2×2 行列の逆行列は対角成分を入れ替え、非対角成分の符号を変えて行列式で割る。

  - id: s16p02
    title: 油圧ポンプの冷待機と故障モード
    context: |
      ある航空機の油圧ポンプは、シールの故障（故障率 $\lambda_s=«ls»$/時間）とモーターの故障（故障率 $\lambda_m=«lm»$/時間）の 2 つの原因で止まる。
      2 つの故障までの時間は互いに独立な指数分布に従い、どちらかが先に起きた時点でポンプは止まる。このとき 1 台のポンプの寿命は故障率 $\lambda=\lambda_s+\lambda_m=«lam»$ の指数分布（平均 «mean1» 時間）に従う。
    items:
      - id: s16p02a
        chapter: 6
        terms: [gamma-distribution, exponential-distribution, poisson-process]
        topic: 予備2台を順に使う冷待機系の総寿命（ガンマ分布）が運用時間を超える確率をポアソン確率の和で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある油圧系統では、このポンプ 1 台が稼働し、同じポンプ 2 台が予備として待機している。稼働中のポンプが止まると直ちに予備に切り替わる（切り替えは必ず成功し、待機中のポンプは劣化しない）。
          3 台目が止まると系統が停止する。各ポンプの寿命は互いに独立とする。系統が «t» 時間の運用の間に停止しない確率に最も近い値はどれか。必要なら $e^{-2}=«e2»$ を使え。
        choices:
          - "$«a_none»$"
          - "$«a_par»$"
          - "$«a_one»$"
          - "$«a_ok»$"
          - "$«a_up3»$"
        answer: 3
        distractors:
          - 予備を無視してポンプ 1 台の生存確率 e^{-2} を答えた
          - 3 台を同時に稼働させる並列系（ホットスタンバイ）とみなして 1-(1-e^{-2})^3 とした
          - 予備を 1 台分しか数えず、故障 1 回以下の確率にした
          - 正解
          - 故障 3 回以下の確率まで足した（停止は 3 回目の故障なので 2 回以下まで）
        explanation: |
          **方針** 系統の寿命 $T_3$ は独立な 3 つの指数分布の和なので、形状 3・レート $\lambda$ のガンマ分布（アーラン分布）に従う。止まったポンプを次々に取り替える過程はレート $\lambda$ のポアソン過程なので、「$T_3>t$」は「時刻 $t$ までの故障回数 $N(t)$ が 2 回以下」と同じである。

          **途中式** $\lambda t=«lam»\times«t»=«lt»$ より $N(«t»)$ は平均 «lt» のポアソン分布に従う。
          $$P(T_3>«t»)=P(N(«t»)\le 2)=e^{-2}\left(1+2+\frac{2^2}{2!}\right)=«e2»\times«sum3»=«a_ok4»$$

          **答え** $«a_ok»$

          **間違えやすい点** 系統が止まるのは 3 回目の故障なので、足すのは故障 0・1・2 回の確率まで。3 回まで足すと $«a_up3»$ になる。
          3 台を同時に動かす並列系と取り違えると $1-(1-«e2»)^3=«a_par»$ になる（並列系では待機中も劣化するので冷待機より信頼度が低い）。予備を無視すると $«a_none»$。

          **別解** ガンマ分布の生存関数を部分積分しても $e^{-\lambda t}\{1+\lambda t+(\lambda t)^2/2\}$ が得られる。

      - id: s16p02b
        chapter: 2
        terms: [hazard-function, joint-probability-density-function, survival-function]
        topic: 2つの故障モードが競合する指数寿命のポンプが一定時間稼働したあと次の期間内に特定の原因で止まる確率を寿命と原因の同時分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          ポンプ 1 台の寿命を $T$、止まった原因を $J$（シールなら $J=s$、モーターなら $J=m$）とする。ある 1 台がすでに 300 時間止まらずに稼働している。
          このポンプが次の 200 時間以内に**シールの故障で**止まる確率 $P(T\le 500,\ J=s\mid T>300)$ に最も近い値はどれか。
          必要なら $e^{-0.4}=«e04»$、$e^{-0.6}=«e06»$、$e^{-1}=«e1»$、$e^{-0.24}=«e024»$ を使え。
        choices:
          - "$«b_joint»$"
          - "$«b_ok»$"
          - "$«b_alone»$"
          - "$«b_any»$"
          - "$«b_frac»$"
        answer: 1
        distractors:
          - 条件 T>300 で割らず、同時確率 P(300<T≦500, J=s) を答えた
          - 正解
          - モーターの故障との競合を無視して、シールの寿命だけで 1-e^{-0.24} とした
          - 原因を問わず 200 時間以内に止まる確率を答えた
          - 時間を無視して、原因がシールである確率だけを答えた
        explanation: |
          **方針** $(T,J)$ の同時分布を求める。$T=t$ でシールの故障が起きるのは「シールが時刻 $t$ に壊れ、モーターは $t$ まで壊れていない」ときなので、
          $$f(t,J=s)=\lambda_se^{-\lambda_st}\cdot e^{-\lambda_mt}=\lambda_se^{-\lambda t}\qquad(\lambda=\lambda_s+\lambda_m)$$
          これは $\dfrac{\lambda_s}{\lambda}\times\lambda e^{-\lambda t}$ と分解でき、$T$ と $J$ は独立で $P(J=s)=\lambda_s/\lambda$ である。

          **途中式** $\lambda_s/\lambda=«ls»/«lam»=«frac»$。$T$ は故障率 $\lambda=«lam»$ の指数分布で、無記憶性より $P(T\le500\mid T>300)=1-e^{-«lam»\times200}=1-«e04»=«q04»$。
          $$P(T\le500,\ J=s\mid T>300)=\frac{\int_{300}^{500}\lambda_se^{-\lambda t}dt}{e^{-300\lambda}}=\frac{\lambda_s}{\lambda}\left(1-e^{-200\lambda}\right)=«frac»\times«q04»=«b_ok4»$$

          **答え** $«b_ok»$

          **間違えやすい点** 条件 $T>300$ で割らないと $«frac»\times(e^{-0.6}-e^{-1})=«b_joint»$ になる。
          シールの寿命だけを見て $1-e^{-0.0012\times200}=«b_alone»$ とすると、先にモーターが壊れて止まる場合（このときシールの故障は観測されない）を数えてしまう。各原因のハザード $\lambda_s$、$\lambda_m$ の和がポンプ全体のハザードになり、原因の確率はハザードの比になる。

  - id: s16p03
    title: 工具寿命データの変換と加工の並び
    context: |
      ある機械加工ラインで、切削工具の寿命と加工した部品の寸法を調べている。
    items:
      - id: s16p03a
        chapter: 4
        terms: [box-cox-transformation, change-of-variables, log-transformation]
        topic: 工具寿命の回帰でボックス・コックス変換の候補ごとの残差平方和からヤコビアンを含むプロファイル対数尤度を比べて変換を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          工具寿命 $y_i>0$（分）を切削速度に単回帰するとき、目的変数をボックス・コックス変換
          $$y^{(\lambda)}=\frac{y^\lambda-1}{\lambda}\ (\lambda\ne0),\qquad y^{(0)}=\ln y$$
          してから当てはめる。変換後の誤差は独立に $N(0,\sigma^2)$ に従うとし、$\sigma^2$ と回帰係数は最尤推定する。
          $n=«n»$ 本の工具について $\sum\ln y_i=«sumlog»$ で、$\lambda=0,\ 0.5,\ 1$ のときの変換後の残差平方和 $\mathrm{SSE}_\lambda$ は «sse0»、«sse5»、«sse1» だった。
          **もとの $y$ の尤度**にもとづくプロファイル対数尤度 $\ell(\lambda)$（$\lambda$ によらない定数は除く）を 3 つの $\lambda$ で比べる。
          必要なら $\ln(«sse0»/«n»)=«lr0»$、$\ln(«sse5»/«n»)=«lr5»$、$\ln(«sse1»/«n»)=«lr1»$ を使え。$(\ell(0),\ \ell(0.5),\ \ell(1))$ と選ばれる $\lambda$ の組として正しいものはどれか。
        choices:
          - "$«nojac3»$ で、$\\lambda=0$（対数変換）を選ぶ"
          - "$«ok3»$ で、$\\lambda=0$（対数変換）を選ぶ。残差平方和が最も小さいから"
          - "$«rev3»$ で、$\\lambda=0$（対数変換）を選ぶ"
          - "$«ok3»$ で、$\\lambda=1$（変換しない）を選ぶ"
          - "$«nfull3»$ で、$\\lambda=0$（対数変換）を選ぶ"
        answer: 3
        distractors:
          - 変数変換のヤコビアンの項を入れず、変換後の残差平方和だけで比べた
          - 尤度は正しく計算したが、尺度の違う残差平方和を直接比べて選んだ
          - ヤコビアンの項の符号を逆にした
          - 正解
          - プロファイル対数尤度の係数 n/2 を n とした
        explanation: |
          **方針** $\lambda$ によって目的変数の尺度が変わるので、変換後の残差平方和は直接比べられない。もとの $y$ の密度に直すと、変数変換のヤコビアン $\prod_i|dy_i^{(\lambda)}/dy_i|=\prod_iy_i^{\lambda-1}$ が掛かる。

          **途中式** $\sigma^2$ の最尤推定値 $\mathrm{SSE}_\lambda/n$ を代入すると、もとの $y$ の対数尤度は定数を除いて
          $$\ell(\lambda)=-\frac n2\ln\frac{\mathrm{SSE}_\lambda}{n}+(\lambda-1)\sum_{i}\ln y_i$$
          - $\lambda=0$：$-«nh»\times(«lr0»)+(-1)\times«sumlog»=«a0»«j0»=«l0»$
          - $\lambda=0.5$：$-«nh»\times(«lr5»)+(-0.5)\times«sumlog»=«a5»«j5»=«l5»$
          - $\lambda=1$：$-«nh»\times«lr1»+0=«l1»$

          最大は $\lambda=1$ なので、変換しないモデルが選ばれる。

          **答え** $«ok3»$、$\lambda=1$

          **間違えやすい点** ヤコビアンの項 $(\lambda-1)\sum\ln y_i$ を忘れると $«nojac3»$ となり、残差平方和の最も小さい対数変換を選んでしまう。$\ln y$ の残差平方和は $y$ の残差平方和と単位が違うので、そのまま比べてはいけない。

      - id: s16p03b
        chapter: 13
        terms: [runs-test, normal-approximation-rank-tests, nonparametric-methods-overview]
        topic: 加工順に並べた寸法誤差の符号の列から連の検定の正規近似で工具摩耗などによる並びの偏りを調べる
        level: 標準
        definition: false
        type: choice
        question: |
          このラインの旋盤で連続して加工した «N» 個の寸法誤差の符号（呼び寸法より大きければ $+$、小さければ $-$）を加工順に並べると次のようになった。

          `«seq»`

          符号の並びがランダムかどうかを、連の数にもとづく連の検定（正規近似、**連続修正なし**、両側、有意水準 5%）で調べる。
          $+$ の個数を $n_1$、$-$ の個数を $n_2$、$N=n_1+n_2$ とすると、帰無仮説のもとで連の数 $R$ は
          $$E[R]=1+\frac{2n_1n_2}{N},\qquad V[R]=\frac{2n_1n_2(2n_1n_2-N)}{N^2(N-1)}$$
          をもつ。標準正規分布の上側 2.5% 点は 1.96 とする。正しい記述はどれか。
        choices:
          - "$z=«z_noone»$ で $|z|<1.96$ なので、並びがランダムでないとはいえない"
          - "$z=«z»$ で $|z|>1.96$ なので棄却する。連が少なく、同じ符号がかたまって現れている"
          - "$z=«z_var»$ で $|z|<1.96$ なので、並びがランダムでないとはいえない"
          - "$z=«z»$ で $|z|>1.96$ なので棄却する。連が多く、符号が頻繁に入れ替わっている"
          - "$z=«z»$ で $|z|>1.96$ なので棄却し、寸法誤差の平均が 0 でないと結論する"
        answer: 1
        distractors:
          - 期待値の 1 を落として E[R]=2n1n2/N とした
          - 正解
          - 標準偏差ではなく分散で割った
          - z が負（連が期待より少ない）ことの解釈を逆にした
          - 連の検定は並びのランダム性の検定であり、平均（位置）についての結論は出せない
        explanation: |
          **方針** 同じ符号が続く区切りを 1 つの「連」と数える。連が少なすぎれば同じ符号がかたまり（工具摩耗などのドリフト）、多すぎれば規則的に交互に並んでいることを示す。

          **途中式** $n_1=«n1»$、$n_2=«n2»$、$N=«N»$。並びは «runlist» なので $R=«runs»$。
          $$E[R]=1+\frac{«nn»}{«N»}=«ER»,\qquad V[R]=\frac{«nn»\times(«nn»-«N»)}{«N»^2\times(«N»-1)}=\frac{«VRnum»}{«VRden»}=«VR»$$
          $$z=\frac{«runs»-«ER»}{\sqrt{«VR»}}=\frac{«runs»-«ER»}{«sdR»}=«z»$$
          $|z|>1.96$ なので帰無仮説（ランダムな並び）を棄却する。$z<0$、つまり連が期待より少ないので、同じ符号が続きやすい。

          **答え** $z=«z»$ で棄却し、同じ符号がかたまって現れている。

          **間違えやすい点** $E[R]$ の「1+」を落とすと $E[R]=«ER0»$ で $z=«z_noone»$ になり、結論が逆になる。分散で割ると $«z_var»$。
          この検定は並びのランダム性だけを調べるもので、平均が 0 かどうかは $+$ と $-$ の個数（符号検定など）で調べる。

