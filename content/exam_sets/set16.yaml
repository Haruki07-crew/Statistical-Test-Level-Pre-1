    context: |
      ある軸受の寿命 $T$（単位：千時間）は、形状母数 2 のワイブル分布
      $$f(t)=\frac{2t}{\theta}\exp\left(-\frac{t^2}{\theta}\right)\quad(t>0),\qquad R(t)=P(T>t)=\exp\left(-\frac{t^2}{\theta}\right)$$
      に従うとする（$\theta>0$ は未知母数で、尺度母数 $\eta$ を使うと $\theta=\eta^2$）。«n» 個の軸受の寿命試験で次の値を得た。

      $$«t1»,\ «t2»,\ «t3»,\ «t4»,\ «t5»,\ «t6»,\ «t7»,\ «t8»\qquad\left(\textstyle\sum t_i=«S1»,\ \sum t_i^2=«S2»\right)$$
    items:
      - id: s16p05a
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, fisher-information]
        topic: 形状母数が既知のワイブル分布の母数θを寿命データの2乗和から最尤推定する
        level: 基本
        definition: false
        type: choice
        question: |
          $\theta$ の最尤推定値に最も近い値はどれか。
        choices:
          - "$«a_ok»$"
          - "$«a_n1»$"
          - "$«a_mm»$"
          - "$«a_mean»$"
          - "$«a_inv»$"
        answer: 0
        distractors:
          - 正解
          - 2 乗和を n-1 で割った
          - 標本平均の 2 乗を答えた
          - 標本平均を答えた
          - 逆数 n/Σt^2 を答えた（レートの形と取り違えた）
        explanation: |
          **方針** 対数尤度を $\theta$ で微分して 0 とおく。

          **途中式**
          $$\ell(\theta)=\sum_{i=1}^{n}\left\{\ln(2t_i)-\ln\theta-\frac{t_i^2}{\theta}\right\},\qquad \ell'(\theta)=-\frac{n}{\theta}+\frac{\sum t_i^2}{\theta^2}=0$$
          より
          $$\hat\theta=\frac{\sum t_i^2}{n}=\frac{«S2»}{«n»}=«th»$$
          $\ell''(\hat\theta)=n/\hat\theta^2-2\sum t_i^2/\hat\theta^3=-n/\hat\theta^2<0$ なので最大である。

          **答え** $«a_ok»$

          **間違えやすい点** $T^2$ は平均 $\theta$ の指数分布に従うので、$\hat\theta$ は $T^2$ の標本平均になる。不偏性のために $n-1$ で割る必要はない（$E[\hat\theta]=\theta$ で、もともと不偏）。
          $\theta$ は $T$ の平均ではないので、標本平均 $«a_mean»$ やその 2 乗 $«a_mm»$ は答えにならない。

