set: 6
title: 模擬試験 第6回
minutes: 90
problems:
  - id: s06p01
    title: 動画配信サービスの会員の継続期間
    context: |
      ある動画配信サービスでは、加入してから解約するまでの期間 $T$（単位：月）について、過去の会員データから次の生存関数のモデルを当てはめている。
      $$S(t)=P(T>t)=\left(\frac{\theta}{\theta+t}\right)^{\alpha}\quad(t\ge 0),\qquad \alpha=«al»,\ \theta=«th»$$
      $T$ は連続型の確率変数で、密度関数を $f(t)$ とする。
    items:
      - id: s06p01a
        chapter: 2
        terms: [hazard-function, survival-function, probability-mass-and-density-function]
        topic: 裾の重い生存関数モデルから加入6か月時点の解約ハザードを求める
        level: 基本
        definition: false
        type: choice
        question: |
          加入から «t» か月の時点のハザード（瞬間解約率）$h(«t»)=\dfrac{f(«t»)}{S(«t»)}$ に最も近い値はどれか。
        choices:
          - "$«h0»$"
          - "$«f»$"
          - "$«fF»$"
          - "$«h»$"
          - "$«a1»$"
        answer: 3
        distractors:
          - t に 6 を代入し忘れ、加入直後のハザード h(0)=α/θ を答えた
          - 密度 f(6) をそのままハザードと取り違えた
          - S(6) ではなく分布関数 F(6)=1-S(6) で割った
          - 正解
          - 密度の分母の指数 α+1 を係数にしてしまった
        explanation: |
          **方針** ハザードは $h(t)=f(t)/S(t)=-\dfrac{d}{dt}\log S(t)$。対数をとってから微分すると計算が短い。

          **途中式** $\log S(t)=\alpha\{\log\theta-\log(\theta+t)\}$ なので
          $$h(t)=-\frac{d}{dt}\log S(t)=\frac{\alpha}{\theta+t}$$
          $t=«t»$ を代入して
          $$h(«t»)=\frac{«al»}{«th»+«t»}=\frac{«al»}{«tht»}=«h»$$
          （確認：$S(«t»)=«ratio»^{«al»}=«St»$、$f(«t»)=h(«t»)S(«t»)=«f4»$ で、$f(«t»)/S(«t»)=«h»$。）

          **答え** $«h»$（1 か月あたり）

          **間違えやすい点** ハザードは「その時点まで継続している会員」に限った解約の速さなので、分母は $S(t)$。密度 $f(«t»)=«f»$ そのものや、$f/F=«fF»$ ではない。
          また $h(t)=\alpha/(\theta+t)$ は $t$ とともに小さくなる（長く続けた会員ほど解約しにくい）ので、$h(0)=«h0»$ とは異なる。

      - id: s06p01b
        chapter: 3
        terms: [conditional-expectation, survival-function, expectation-variance-properties]
        topic: 生存関数の積分で6か月継続した会員の平均残存期間（条件付き期待値）を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          加入から «t» か月を超えて継続している会員について、その後さらに継続する期間の期待値（平均残存期間）
          $m(«t»)=E[T-«t»\mid T>«t»]$ を求めよ。
          ただし、非負の確率変数 $W$ について $E[W]=\displaystyle\int_0^\infty P(W>w)\,dw$ が成り立つことを使ってよい。
        answer: «mrl»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $T>t$ という条件のもとで $T-t$ の生存関数は $P(T-t>u\mid T>t)=S(t+u)/S(t)$。これを $u$ について 0 から $\infty$ まで積分する。

          **途中式**
          $$m(t)=\frac{1}{S(t)}\int_0^\infty S(t+u)\,du=\frac{1}{S(t)}\int_t^\infty \theta^{\alpha}(\theta+v)^{-\alpha}\,dv$$
          $\alpha>1$ なので積分は収束し、
          $$\int_t^\infty \theta^{\alpha}(\theta+v)^{-\alpha}\,dv=\frac{\theta^{\alpha}(\theta+t)^{1-\alpha}}{\alpha-1}$$
          これを $S(t)=\theta^{\alpha}(\theta+t)^{-\alpha}$ で割ると
          $$m(t)=\frac{\theta+t}{\alpha-1}=\frac{«tht»}{«al1»}=«mrl4»\cdots$$

          **答え** $«mrl»$ か月

          **間違えやすい点** $E[T\mid T>«t»]=«t»+m(«t»)=«mrl_cond»$ は「加入からの通算期間」で、問われている残りの期間ではない。
          加入直後の平均 $E[T]=m(0)=\theta/(\alpha-1)=«ET»$ より長くなる点が、ハザードが減少するこのモデルの特徴である。
          分母を $\alpha$ にする（$«mrl_al»$）のは積分 $\int(\theta+v)^{-\alpha}dv=(\theta+v)^{1-\alpha}/(1-\alpha)$ の計算ミス。

      - id: s06p01c
        chapter: 29
        terms: [cox-proportional-hazards-model, hazard-ratio, survival-function]
        topic: 比例ハザードモデルのハザード比から年額プランの継続率を基準プランの生存関数のべき乗で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          料金プランによる違いを調べるため、年額プランなら $z=1$、月額プランなら $z=0$ とする比例ハザードモデル
          $$h(t\mid z)=h_0(t)\,e^{\beta z}$$
          を当てはめたところ、$\hat\beta=-0.693$（$e^{-0.693}=«hr»$）だった。また、月額プランの会員が 12 か月を超えて継続する確率は $S_0(12)=«S0»$ と推定された。
          このモデルのもとで、年額プランの会員が 12 か月を超えて継続する確率 $S_1(12)$ を求めよ。
        answer: «S1»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 生存関数は累積ハザード $H(t)=\int_0^t h(u)\,du$ を使って $S(t)=e^{-H(t)}$。比例ハザードでは累積ハザードも $e^{\beta z}$ 倍になるので、$S_1(t)=S_0(t)^{e^{\beta}}$ となる。

          **途中式** $H_1(t)=\int_0^t h_0(u)e^{\beta}du=e^{\beta}H_0(t)$ より
          $$S_1(t)=\exp\{-e^{\beta}H_0(t)\}=\left\{e^{-H_0(t)}\right\}^{e^{\beta}}=S_0(t)^{e^{\beta}}$$
          $e^{\hat\beta}=«hr»$ なので
          $$S_1(12)=«S0»^{«hr»}=\sqrt{«S0»}=«S1_4»\cdots$$

          **答え** $«S1»$

          **間違えやすい点** ハザード比 0.5 は「解約の確率が半分」ではない。解約確率 $1-«S0»$ を半分にして $1-«hr»\times(1-«S0»)=«S1_half»$ とするのは誤り。
          生存確率そのものを $«hr»$ 倍する（$«S1_mul»$）のも、べき乗の向きを逆にして $«S0»^2=«S1_sq»$ とするのも誤り。ハザード比が 1 より小さいので、年額プランの継続率は月額プランより高くなる。

  - id: s06p02
    title: 店舗とECの年間購入額
    context: |
      ある小売チェーンの会員について、年間の店舗での購入額 $X$ と EC サイトでの購入額 $Y$（単位：万円）は互いに独立で、
      $X$ は形状 2、$Y$ は形状 3、どちらも共通の尺度 $\theta>0$ のガンマ分布に従うとする。
      ここで形状 $k$、尺度 $\theta$ のガンマ分布の密度は $\dfrac{x^{k-1}e^{-x/\theta}}{\Gamma(k)\theta^{k}}\ (x>0)$ である。
      合計購入額を $U=X+Y$、EC の比率を $V=\dfrac{Y}{X+Y}$ とおく。
    items:
      - id: s06p02a
        chapter: 4
        terms: [change-of-variables, gamma-distribution, beta-distribution, sum-of-random-variables]
        topic: 独立なガンマ分布に従う店舗とECの購入額から合計とEC比率への2変数変換で分布と独立性を導く
        level: 応用
        definition: false
        type: choice
        question: |
          $(U,V)$ の同時分布について正しいものはどれか。ただし $\mathrm{Beta}(a,b)$ は密度が $v^{a-1}(1-v)^{b-1}$ に比例する $(0,1)$ 上のベータ分布である。
        choices:
          - "$U$ は形状 5・尺度 $2\\theta$ のガンマ分布、$V$ は $\\mathrm{Beta}(3,2)$ に従い、$U$ と $V$ は独立である"
          - "$U$ は形状 5・尺度 $\\theta$ のガンマ分布、$V$ は $\\mathrm{Beta}(2,3)$ に従い、$U$ と $V$ は独立である"
          - "$U$ は形状 5・尺度 $\\theta$ のガンマ分布、$V$ は $\\mathrm{Beta}(3,2)$ に従うが、$U$ が大きいほど $V$ も大きくなる傾向があり独立ではない"
          - "$U$ は形状 5・尺度 $\\theta$ のガンマ分布、$V$ は $\\mathrm{Beta}(3,2)$ に従い、$U$ と $V$ は独立である"
          - "$U$ は形状 5・尺度 $\\theta$ のガンマ分布で、$V$ の分布は $\\theta$ の値によって変わる"
        answer: 3
        distractors:
          - 尺度も足し合わせてしまった（形状は足せるが尺度は共通のまま）
          - ベータ分布の母数の順番を取り違えた（V は Y の比率なので Y の形状が第1母数）
          - 同時密度が u の部分と v の部分の積に分解できることを見落とした
          - 正解
          - 比率 V では尺度 θ が約分されて消えることを見落とした
        explanation: |
          **方針** 逆変換 $x=u(1-v)$、$y=uv$ を代入し、ヤコビアンを掛けて $(U,V)$ の同時密度を求める。同時密度が「$u$ だけの関数 × $v$ だけの関数」に分解できれば独立で、それぞれの分布が読み取れる。

          **途中式** ヤコビ行列式は
          $$\frac{\partial(x,y)}{\partial(u,v)}=\begin{vmatrix}1-v & -u\\ v & u\end{vmatrix}=u(1-v)+uv=u$$
          $X,Y$ の同時密度は $\dfrac{x\,e^{-x/\theta}}{\Gamma(2)\theta^{2}}\cdot\dfrac{y^{2}e^{-y/\theta}}{\Gamma(3)\theta^{3}}$ なので
          $$f_{U,V}(u,v)\propto u(1-v)\cdot u^{2}v^{2}\cdot e^{-u/\theta}\cdot u=\underbrace{u^{4}e^{-u/\theta}}_{u\text{ のみ}}\times\underbrace{v^{2}(1-v)}_{v\text{ のみ}}\quad(u>0,\ 0<v<1)$$
          よって $U$ と $V$ は独立で、$U$ は形状 $2+3=5$・尺度 $\theta$ のガンマ分布、$V$ は密度が $v^{3-1}(1-v)^{2-1}$ に比例する $\mathrm{Beta}(3,2)$ に従う。

          **答え** $U$ は形状 5・尺度 $\theta$ のガンマ分布、$V\sim\mathrm{Beta}(3,2)$ で、両者は独立。

          **間違えやすい点** ヤコビアン $u$ を掛け忘れると $u$ の指数が 3 になり、形状 4 と誤る。尺度が共通なので和の尺度は $\theta$ のまま（形状だけが足される）。
          ベータ分布の第 1 母数は「分子 $Y$ の形状」3。$U$ と $V$ は独立なので、合計購入額の多い会員ほど EC 比率が高いといった関係はこのモデルでは生じない。

      - id: s06p02b
        chapter: 6
        terms: [beta-distribution, cumulative-distribution-function]
        topic: ベータ分布の分布関数を多項式で積分してEC比率が6割以上の会員の割合を求める
        level: 標準
        definition: false
        type: choice
        question: |
          前問の結果を使って、EC の比率が «v» 以上である確率 $P(V\ge «v»)$ を求めよ。最も近い値はどれか。
        choices:
          - "$«unif»$"
          - "$«ok»$"
          - "$«sw»$"
          - "$«comp»$"
          - "$«half»$"
        answer: 1
        distractors:
          - V を (0,1) 上の一様分布とみなした
          - 正解
          - ベータ分布の母数を逆にして Beta(2,3) で計算した
          - P(V≦0.6)（余事象）を答えた
          - 平均 E[V]=0.6 を中央値と取り違え、確率を 1/2 とした
        explanation: |
          **方針** $\mathrm{Beta}(3,2)$ の密度は $\dfrac{\Gamma(5)}{\Gamma(3)\Gamma(2)}v^{2}(1-v)=12v^{2}(1-v)$。多項式なので直接積分できる。

          **途中式** 分布関数は
          $$F(v)=\int_0^v 12(w^{2}-w^{3})\,dw=4v^{3}-3v^{4}$$
          $v=«v»$ を代入して $F(«v»)=4\times«v3»-3\times«v4»=«F4»-«F3»=«F»$。
          $$P(V\ge «v»)=1-«F»=«ans4»$$

          **答え** $«ok»$

          **間違えやすい点** $\mathrm{Beta}(2,3)$（密度 $12v(1-v)^2$）で計算すると $«sw»$ になる。$E[V]=3/5=«v»$ だが、ベータ分布 $\mathrm{Beta}(3,2)$ は左に裾を引く非対称な分布なので、平均以上の確率は $1/2$ ではない（実際は $1/2$ より大きい）。

  - id: s06p03
    title: 顧客推奨度アンケート
    context: |
      ある EC サイトでは、購入者に「このサイトを友人に勧める可能性」を 0〜10 点で尋ね、9〜10 点を推奨者、7〜8 点を中立者、0〜6 点を批判者に分類している。
      回答者は互いに独立に、確率 $p_1$ で推奨者、$p_2$ で中立者、$p_3$ で批判者になるとし（$p_1+p_2+p_3=1$）、$p_1-p_3$ を推奨度スコアと呼ぶ。
    items:
      - id: s06p03a
        chapter: 9
        terms: [wald-confidence-interval, ci-proportion, multinomial-distribution]
        topic: 同じ回答者から求めた推奨者割合と批判者割合の差（推奨度スコア）のワルド型信頼区間を多項分布の共分散を使って作る
        level: 応用
        definition: false
        type: numeric
        question: |
          «m» 人に回答してもらったところ、推奨者 «a1» 人、中立者 «a2» 人、批判者 «a3» 人だった。
          推奨度スコア $p_1-p_3$ の 95% 信頼区間を、標本の割合を代入した標準誤差による正規近似（ワルド型）で作るとき、その**下限**を求めよ。
          標準正規分布の上側 2.5% 点は 1.96 とする。
        answer: «lo»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 推奨者数 $N_1$ と批判者数 $N_3$ は多項分布に従い、$V[N_i]=mp_i(1-p_i)$、$\mathrm{Cov}(N_1,N_3)=-mp_1p_3$。
          推定量 $\hat p_1-\hat p_3=(N_1-N_3)/m$ の分散を求め、標本の割合を代入して標準誤差を作る。

          **途中式**
          $$V[\hat p_1-\hat p_3]=\frac{p_1(1-p_1)+p_3(1-p_3)+2p_1p_3}{m}=\frac{p_1+p_3-(p_1-p_3)^2}{m}$$
          （右の形は 1 人ごとに推奨 $=1$、中立 $=0$、批判 $=-1$ とおいた値の分散 $E[d^2]-E[d]^2$ からも得られる。）
          $\hat p_1=«a1»/«m»=«q1»$、$\hat p_3=«a3»/«m»=«q3»$、推定値 $\hat d=«q1»-«q3»=«d»$。
          $$\widehat{V}=\frac{«q13»-«dsq»}{«m»}=\frac{«vv»}{«m»}=«vvm»,\qquad \mathrm{SE}=\sqrt{«vvm»}=«se»$$
          $$\text{下限}=«d»-1.96\times«se»=«d»-«hw»=«lo4»\cdots$$

          **答え** $«lo»$（区間はおよそ $[«lo»,\ «hi»]$）

          **間違えやすい点** 2 つの割合は同じ回答者から求めたもので独立ではない（1 人が推奨者と批判者を兼ねることはないので負の共分散をもつ）。
          独立な 2 標本の比率の差の式 $\sqrt{(«v1»+«v3»)/«m»}=«se_ind»$ を使うと、共分散の項 $2\hat p_1\hat p_3=2\times«c13»$ を落として標準誤差を過小評価し、下限が $«lo_ind»$ と高くなりすぎる。

  - id: s06p04
    title: 新規会員の初回購入までの訪問回数
    context: |
      ある EC サイトで、新規会員が初めて購入するまでの訪問回数 $X$（購入した訪問を含む）は
      $$P(X=x)=p(1-p)^{x-1}\quad(x=1,2,\ldots)$$
      の幾何分布に従うとする（$p$ は 1 回の訪問で購入する確率、$E[X]=1/p$）。
      新規会員 «n» 人を独立に観測したところ、訪問回数の合計は $\sum x_i=«sx»$ だった。
    items:
      - id: s06p04a
        chapter: 8
        terms: [cramer-rao-inequality, fisher-information, unbiased-estimator, efficient-estimator]
        topic: 平均訪問回数1/pの不偏推定量の分散のクラメール・ラオ下限を求め標本平均が下限を達成することを確かめる
        level: 標準
        definition: false
        type: numeric
        question: |
          平均訪問回数 $\tau(p)=E[X]=1/p$ を推定したい。$\tau(p)$ の不偏推定量の分散のクラメール・ラオ下限を求め、そこに $p$ の最尤推定値 $\hat p=n/\sum x_i$ を代入した値を答えよ。
        answer: «crlb»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 1 観測あたりのフィッシャー情報量 $I(p)$ を求め、$\tau(p)$ の不偏推定量の分散の下限 $\dfrac{\{\tau'(p)\}^2}{nI(p)}$ を計算する。

          **途中式** $\log f(x;p)=\log p+(x-1)\log(1-p)$ を 2 回微分すると $-\dfrac{1}{p^2}-\dfrac{x-1}{(1-p)^2}$。$E[X-1]=(1-p)/p$ を代入して
          $$I(p)=\frac{1}{p^2}+\frac{1}{p(1-p)}=\frac{1}{p^2(1-p)}$$
          $\tau'(p)=-1/p^2$ なので
          $$\text{下限}=\frac{(1/p^2)^2}{n/\{p^2(1-p)\}}=\frac{1-p}{np^2}$$
          $\hat p=«n»/«sx»=«p»$ を代入して
          $$\frac{1-«p»}{«n»\times«p»^2}=\frac{«q»}{«p2n»}=«crlb4»$$
          一方、標本平均 $\bar X$ は $1/p$ の不偏推定量で $V[\bar X]=V[X]/n=(1-p)/(np^2)$ となり、下限に一致する（有効推定量）。

          **答え** $«crlb»$

          **間違えやすい点** $\tau'(p)^2$ を掛け忘れると、$p$ 自身の推定量の下限 $p^2(1-p)/n=«cr_noinv»$ になる。分散と標準偏差（$\sqrt{«crlb»}=«cr_sd»$）を取り違えないこと。
          幾何分布の分散は $(1-p)/p^2$ で、$(1-p)/p$ ではない（後者を使うと $«cr_pq»$）。

      - id: s06p04b
        chapter: 10
        terms: [likelihood-ratio-test, wilks-theorem, wald-test, score-test]
        topic: 幾何分布の購入確率が従来の値かを尤度比統計量で検定し、同じ仮説のワルド統計量・スコア統計量と値を区別する
        level: 応用
        definition: false
        type: choice
        question: |
          従来の購入確率は $p_0=«p0»$ だった。$H_0:p=«p0»$、$H_1:p\ne «p0»$ を有意水準 5% の尤度比検定で調べる。
          検定統計量 $G^2=2\{\ell(\hat p)-\ell(p_0)\}$ は $H_0$ のもとで近似的に自由度 1 のカイ二乗分布に従う。
          必要なら $\log(«p»/«p0»)=«ln1»$、$\log(«q»/0.80)=«ln2»$（自然対数）、自由度 1 のカイ二乗分布の上側 5% 点 3.841、上側 10% 点 2.706 を使え。
          正しいものはどれか。
        choices:
          - "$G^2=«half»$ で、$3.841$ 未満なので $H_0$ を棄却しない"
          - "$G^2=«wald»$ で、$3.841$ 未満なので $H_0$ を棄却しない"
          - "$G^2=«G»$ で、$3.841$ 未満なので $H_0$ を棄却しない"
          - "$G^2=«score»$ で、$3.841$ 未満なので $H_0$ を棄却しない"
          - "$G^2=«G»$ で、$2.706$ を超えるので有意水準 5% で $H_0$ を棄却する"
        answer: 2
        distractors:
          - 対数尤度の差に 2 を掛け忘れた
          - 尤度比ではなくワルド統計量 (p̂-p0)^2/{p̂^2(1-p̂)/n} を計算した
          - 正解
          - 尤度比ではなくスコア統計量 U(p0)^2/I_n(p0)（p0 で評価したスコアと情報量）を計算した
          - 両側検定なのに上側 10% 点（片側 5% のつもり）と比べた
        explanation: |
          **方針** 最尤推定値は $\ell'(p)=n/p-(\sum x_i-n)/(1-p)=0$ を解いて $\hat p=n/\sum x_i=«n»/«sx»=«p»$。対数尤度 $\ell(p)=n\log p+(\sum x_i-n)\log(1-p)$ に $\hat p$ と $p_0=«p0»$ を代入して差をとる。

          **途中式** 失敗した訪問の合計は $\sum x_i-n=«sx»-«n»=«fail»$ なので
          $$\ell(\hat p)-\ell(p_0)=«n»\log\frac{«p»}{«p0»}+«fail»\log\frac{«q»}{0.80}=«n»\times«ln1»+«fail»\times(«ln2»)=«t1»+(«t2»)=«half3»$$
          $$G^2=2\times«half3»=«G3»<3.841$$

          **答え** $G^2=«G»$ で、5% 水準で $H_0$ は棄却されない。

          **間違えやすい点** 2 倍を忘れると $«half»$。同じ仮説に対する漸近的に同等な検定でも統計量の値は異なり、ワルド統計量 $(\hat p-p_0)^2/\{\hat p^2(1-\hat p)/n\}$ は $«wald»$、スコア統計量 $U(p_0)^2/I_n(p_0)$（$U(p_0)=\ell'(p_0)=«U0»$、$I_n(p_0)=n/\{p_0^2(1-p_0)\}=«I0»$）は $«score»$ になる。問われているのは尤度比統計量である。
          対立仮説は $p\ne p_0$（両側）で、$G^2$ は右側だけで棄却する検定だが基準は上側 5% 点 3.841 である（2.706 は $|Z|>1.645$ に当たり、両側 10% の基準）。

  - id: s06p05
    title: 価格の自動収集と注文データ
    context: |
      あるネットショップは、競合サイトの価格の自動収集と、自社の注文データの分析を行っている。
    items:
      - id: s06p05a
        chapter: 7
        terms: [cauchy-distribution, order-statistics, convergence-in-distribution, weak-law-of-large-numbers]
        topic: ときどき大きく外れる価格読み取り誤差がコーシー分布に従うとき標本中央値の漸近標準誤差を求め標本平均と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          競合の価格を読み取るツールは、ときどき桁を誤るなど大きく外れた値を返す。同じ商品の価格を «n» 回独立に読み取った値 $X_1,\ldots,X_{«n»}$ は、
          位置 $\theta$（真の価格）、尺度 $\gamma=«gam»$ のコーシー分布（密度 $f(x)=\dfrac{1}{\pi\gamma\{1+((x-\theta)/\gamma)^2\}}$）に従うとする。
          $\theta$ を標本中央値 $\tilde X$ で推定する。連続分布の標本中央値が近似的に平均 $\theta$（母集団の中央値）、分散 $\dfrac{1}{4nf(\theta)^2}$ の正規分布に従うことを使うとき、
          $\tilde X$ の標準誤差に最も近い値はどれか。$\pi=«pi»$ とせよ。
        choices:
          - "$«x_var»$"
          - "$«x_half»$"
          - "$«x_mean»$"
          - "$«x_ok»$"
          - "$«x_dbl»$"
        answer: 3
        distractors:
          - 分散を答え、平方根をとり忘れた
          - 分散の式の 4 を標準誤差でも 4 で割った（2 で割るべき）
          - 尺度 γ を標準偏差とみなし γ/√n とした（コーシー分布には分散がない）
          - 正解
          - 分散の式の 4 を落とし、1/(√n f(θ)) とした
        explanation: |
          **方針** 中央値（$=\theta$）での密度 $f(\theta)=1/(\pi\gamma)$ を求め、漸近分散 $1/\{4nf(\theta)^2\}$ の平方根をとる。

          **途中式** $f(\theta)=\dfrac{1}{\pi\gamma}=\dfrac{1}{«pig»}=«fm»$。
          $$\mathrm{SE}(\tilde X)=\frac{1}{2\sqrt n\,f(\theta)}=\frac{\pi\gamma}{2\sqrt n}=\frac{«pig»}{2\times«sqn»}=«x_ok»$$

          **答え** $«x_ok»$

          **間違えやすい点** コーシー分布は平均も分散ももたないので、標本平均の標準誤差 $\gamma/\sqrt n$ のような式は使えない。実際、標本平均 $\bar X$ は $n$ によらず元と同じコーシー分布に従い、大数の法則が成り立たない（いくら読み取りを増やしても精度が上がらない）。
          これに対し標本中央値は $1/\sqrt n$ の速さで $\theta$ に近づく。外れ値の多いデータで中央値が頑健といわれる理由の一つである。

      - id: s06p05b
        chapter: 32
        terms: [bootstrap, expectation-variance-properties]
        topic: 5件の注文額から作るブートストラップ標本平均の分散を理論的に求める（割る数がnになる理由）
        level: 標準
        definition: false
        type: choice
        question: |
          ある時間帯の注文 5 件の金額は «x1», «x2», «x3», «x4», «x5»（千円）だった。この 5 個の値から復元抽出で大きさ 5 のブートストラップ標本を作り、その平均を $\bar x^{*}$ とする。
          ブートストラップ標本をすべての可能性にわたって考えたとき（無限回くり返したときの極限）、$\bar x^{*}$ の分散に等しい値はどれか。
        choices:
          - "$«bsd»$"
          - "$«ok»$"
          - "$«unb»$"
          - "$«sig»$"
          - "$«s2»$"
        answer: 1
        distractors:
          - 分散ではなく標準偏差を答えた
          - 正解
          - 経験分布の分散ではなく不偏分散（n-1 で割る）を n で割った
          - 1 個の値の分散（経験分布の分散）を答え、n で割り忘れた
          - 不偏分散そのものを答えた
        explanation: |
          **方針** ブートストラップ標本の各値は、元の 5 個の値をそれぞれ確率 1/5 でとる「経験分布」から独立に取り出される。経験分布の分散を $\hat\sigma^2$ とすると $V^{*}[\bar x^{*}]=\hat\sigma^2/n$。

          **途中式** 元の平均は «xm»、偏差平方和は $(«x1»-«xm»)^2+(«x2»-«xm»)^2+(«x3»-«xm»)^2+(«x4»-«xm»)^2+(«x5»-«xm»)^2=«ss»$。
          経験分布の分散は割る数が $n$ で $\hat\sigma^2=«ss»/«nb»=«sig2»$。
          $$V^{*}[\bar x^{*}]=\frac{\hat\sigma^2}{n}=\frac{«sig2»}{«nb»}=«ok»$$

          **答え** $«ok»$

          **間違えやすい点** ブートストラップでは経験分布を「母集団」とみなすので、その分散は $n$ で割ったもの（«sig2»）であり、不偏分散 «s2v» ではない。不偏分散を使うと $«unb»$ になる。
          このためブートストラップの標準誤差は、通常の標準誤差 $s/\sqrt n$ よりわずかに小さくなる。

  - id: s06p06
    title: 広告費と売上の関係
    context: |
      ある小売チェーンの «n» 店舗について、月間の広告費 $x$（万円）と売上 $y$（万円）を集計した。
    items:
      - id: s06p06a
        chapter: 11
        terms: [test-correlation-coefficient, t-distribution, one-sided-two-sided-test]
        topic: 40店舗のデータで無相関の検定が両側5%で有意になる相関係数の境界値をt分布の点から逆算する
        level: 標準
        definition: false
        type: choice
        question: |
          $(x,y)$ が 2 変量正規分布に従うとし、母相関係数について $H_0:\rho=0$、$H_1:\rho\ne0$ を有意水準 5% で検定する。
          検定統計量は $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$（$r$ は標本相関係数）である。$H_0$ が棄却されるような $|r|$ の最小値（境界値）に最も近いものはどれか。
          自由度 «df» の $t$ 分布の上側 2.5% 点は «t2»、上側 5% 点は «t1»、標準正規分布の上側 2.5% 点は 1.960 である。
        choices:
          - "$«r_r2»$"
          - "$«r_one»$"
          - "$«r_z»$"
          - "$«r_ok»$"
          - "$«r_nosq»$"
        answer: 3
        distractors:
          - 境界値の 2 乗（決定係数の境界）を答えた
          - 両側検定なのに上側 5% 点（片側）を使った
          - t 分布の代わりに標準正規分布の 1.960 を使った
          - 正解
          - 分母の √(1-r²) を 1 とみなし、t/√(n-2) とした
        explanation: |
          **方針** $|t|=t_{0.025}(n-2)$ となる $|r|$ を求める。$t$ は $|r|$ の増加関数なので、境界値より大きい $|r|$ で棄却される。

          **途中式** $c=t_{0.025}(«df»)=«t2»$ とおき、$\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}=c$ を 2 乗して $r^2(n-2)=c^2(1-r^2)$。よって
          $$r^2=\frac{c^2}{n-2+c^2},\qquad |r|=\frac{c}{\sqrt{n-2+c^2}}=\frac{«t2»}{\sqrt{«df»+«t2sq»}}=\frac{«t2»}{\sqrt{«den»}}=\frac{«t2»}{«sden»}=«r_ok»$$

          **答え** $«r_ok»$（$|r|$ がこれ以上なら 5% で有意）

          **間違えやすい点** 対立仮説は $\rho\ne0$（両側）なので 2.5% 点を使う（5% 点では $«r_one»$）。自由度は $n-2=«df»$。
          $n$ が大きいと境界値は $2/\sqrt n$ 程度まで小さくなり、弱い相関でも有意になることに注意する（有意性と相関の強さは別）。

      - id: s06p06b
        chapter: 19
        terms: [polynomial-regression, least-squares-method, multiple-regression-model]
        topic: 広告費の2次多項式回帰の当てはめ式から粗利から広告費を引いた利益を最大にする広告費を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          同じデータに 2 次の多項式回帰を当てはめたところ、次の式が得られた。
          $$\hat y=«b0»+«b1»x-«b2»x^2$$
          売上の «mg» 倍が粗利になるとき、当てはめ式にもとづく「粗利 − 広告費」$=«mg»\hat y-x$ を最大にする広告費 $x$（万円）を求めよ。
        answer: «xs»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $g(x)=«mg»\hat y-x$ は上に凸な 2 次関数なので、$g'(x)=0$ となる点で最大になる。

          **途中式**
          $$g'(x)=«mg»\times(«b1»-2\times«b2»x)-1=«mb1»-«mb2»x-1=0$$
          $$x=\frac{«mb1»-1}{«mb2»}=\frac{«num»}{«mb2»}=«xs4»\cdots$$

          **答え** $«xs»$ 万円

          **間違えやすい点** 売上 $\hat y$ 自体を最大にする広告費 $«b1»/(2\times«b2»)=«xmax»$ は、広告費のコストを無視している。粗利率を掛け忘れると $«xnomg»$、微分で 2 を落とすと $«xno2»$ になる。
          また、多項式回帰の当てはめ式は観測された広告費の範囲内でしか信頼できない（範囲外への外挿は危険）。

  - id: s06p07
    title: 新商品のテスト販売
    context: |
      ある菓子メーカーが新商品のテスト販売を行い、価格とパッケージを検討している。
    items:
      - id: s06p07a
        chapter: 13
        terms: [jonckheere-terpstra-test, mann-whitney-u-test, normal-approximation-rank-tests]
        topic: 価格帯が高いほど販売数が少ないという順序のある対立仮説をヨンクヒール・タプストラ検定の正規近似で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          9 店舗を 3 店ずつ低価格・中価格・高価格に無作為に割り当て、1 週間の販売数（百個）を測った。

          | 価格帯 | 店舗 1 | 店舗 2 | 店舗 3 |
          |---|---|---|---|
          | 低 | «L1» | «L2» | «L3» |
          | 中 | «M1» | «M2» | «M3» |
          | 高 | «H1» | «H2» | «H3» |

          「価格帯が高いほど販売数が少ない」という順序のある対立仮説を、ヨンクヒール・タプストラ検定で調べる。
          統計量 $J$ は、価格帯の組（低・中）（低・高）（中・高）それぞれについて「安いほうの店の販売数 > 高いほうの店の販売数」となる店の組の数を数えて合計したものである。
          帰無仮説（価格帯による差がない）のもとで、群の大きさを $n_i$、$N=\sum n_i$ として
          $E[J]=\dfrac{N^2-\sum n_i^2}{4}$、$V[J]=\dfrac{N^2(2N+3)-\sum n_i^2(2n_i+3)}{72}$ である。
          正規近似による標準化した値 $Z=(J-E[J])/\sqrt{V[J]}$ に最も近いものはどれか。
        choices:
          - "$«j_rev»$"
          - "$«j_adj»$"
          - "$«j_var»$"
          - "$«j_ok»$"
          - "$«j_sq»$"
        answer: 3
        distractors:
          - 大小の向きを逆にして「安いほうが少ない」組を数えた
          - 隣り合う価格帯（低・中）と（中・高）だけを数え、（低・高）を数え忘れた
          - 標準偏差ではなく分散で割った
          - 正解
          - 分散の代わりに期待値の平方根で割った
        explanation: |
          **方針** 各組の店舗のペア（3×3=9 通りずつ）について大小を数え、マン・ホイットニー型の数を合計する。期待値と分散の式に代入して標準化する。

          **途中式** 低と中：低 «L1» は «M1» より大きく «M2», «M3» より小さいので 1、低 «L2»・«L3» はすべてより大きいので 3 ずつ。合計 «uLM»。
          低と高：すべて低のほうが大きく «uLH»。中と高：中 «M1» は «H1», «H2» より大きく «H3» より小さいので 2、中 «M2»・«M3» は 3 ずつ。合計 «uMH»。
          $$J=«uLM»+«uLH»+«uMH»=«J»$$
          $N=9$、$\sum n_i^2=«sn2»$ より
          $$E[J]=\frac{«N2»-«sn2»}{4}=«EJ»,\qquad V[J]=\frac{«num1»-«num2»}{72}=«VJ»,\qquad \sqrt{V[J]}=«SJ»$$
          $$Z=\frac{«J»-«EJ»}{«SJ»}=«j_ok»$$

          **答え** $«j_ok»$（上側 5% 点 1.645 を超え、価格が高いほど販売数が少ない傾向があるといえる）

          **間違えやすい点** 順序のある対立仮説なので、すべての価格帯の組（隣り合わない低・高も含む）を数える。向きを逆に数えると $J'=27-J=«Jrev»$ で $Z=«j_rev»$ になる。
          クラスカル・ウォリス検定は「どこかに差がある」を調べる検定で、順序の情報を使わないぶん、このような傾向の検出力が低い。

      - id: s06p07b
        chapter: 20
        terms: [fractional-factorial-design, confounding, factorial-design, main-effect-and-interaction]
        topic: パッケージの4因子を8回で調べる2の4-1乗の一部実施要因計画で定義関係から別名を求め主効果を推定する
        level: 標準
        definition: false
        type: choice
        question: |
          パッケージの色 A、ロゴの位置 B、価格表示 C、キャッチコピー D（いずれも 2 水準で、$+$ と $-$ で表す）の効果を、試作品 8 個で調べる。
          A, B, C は $2^3$ 型の全組合せとし、D の水準は A, B, C の符号の積で決める（$D=ABC$）。購入意向スコア $y$ は次のとおり。

          | 試作品 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | A | «A1» | «A2» | «A3» | «A4» | «A5» | «A6» | «A7» | «A8» |
          | B | «B1» | «B2» | «B3» | «B4» | «B5» | «B6» | «B7» | «B8» |
          | C | «C1» | «C2» | «C3» | «C4» | «C5» | «C6» | «C7» | «C8» |
          | D | «D1» | «D2» | «D3» | «D4» | «D5» | «D6» | «D7» | «D8» |
          | $y$ | «y1» | «y2» | «y3» | «y4» | «y5» | «y6» | «y7» | «y8» |

          D の主効果（$+$ の平均 − $-$ の平均）の推定値と、D の主効果と区別できない（別名の関係にある）効果の組として正しいものはどれか。
        choices:
          - "D の主効果は $«f_ok»$ で、交互作用 $AB$ と別名の関係にある"
          - "D の主効果は $«f_half»$ で、交互作用 $ABC$ と別名の関係にある"
          - "D の主効果は $«f_ok»$ で、交互作用 $ABC$ と別名の関係にある"
          - "D の主効果は $«f_tot»$ で、交互作用 $ABC$ と別名の関係にある"
          - "D の主効果は $«f_ok»$ で、主効果はどの効果とも別名の関係にならない"
        answer: 2
        distractors:
          - 別名を求めるとき定義関係 I=ABCD に D を掛ける計算を誤った（AB と別名なのは CD）
          - 効果ではなく回帰係数（効果の半分）を答えた
          - 正解
          - 対比の合計を 4 で割り忘れた
          - 一部実施では主効果も高次の交互作用と交絡することを見落とした
        explanation: |
          **方針** $D=ABC$ より定義関係は $I=ABCD$。ある効果の別名は、その効果に $ABCD$ を掛けて 2 乗になった文字を消したもの。D の効果は D 列の符号で対比をとる。

          **途中式** 別名：$D\times ABCD=ABCD^2=ABC$。よって D の主効果と ABC 交互作用は同じ列で表され、区別できない。
          D が $+$ の試作品の合計は «Dp»、$-$ の合計は «Dm» なので
          $$\text{D の効果}=\frac{«Dp»}{4}-\frac{«Dm»}{4}=\frac{«Ddiff»}{4}=«f_ok»$$

          **答え** D の主効果は $«f_ok»$ で、ABC と別名の関係にある。

          **間違えやすい点** 回帰係数（$\pm1$ の符号に掛かる係数）は効果の半分の $«f_half»$。8 回で 4 因子を調べる代わりに、主効果は 3 因子交互作用と、2 因子交互作用どうしは $AB=CD$、$AC=BD$、$AD=BC$ と別名になる（分解能 IV）。3 因子交互作用が無視できると考えて主効果を解釈する。

  - id: s06p08
    title: アプリとWebからの注文
    context: |
      あるネットスーパーには、アプリから 1 時間あたり平均 «la» 件、Web ブラウザから平均 «lw» 件の注文が、互いに独立なポアソン過程に従って届く。
    items:
      - id: s06p08a
        chapter: 15
        terms: [superposition-thinning-poisson, poisson-process, interarrival-time]
        topic: 2経路の注文のポアソン過程を重ね合わせ、次の注文が5分以上来ずしかもアプリ経由である確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある時刻から見て、次に届く注文について「到着まで «tmin» 分以上かかり、しかもアプリからの注文である」確率に最も近い値はどれか。
          必要なら $e^{-0.5}=«e05»$、$e^{-1.5}=«e15»$、$e^{-2}=«e20»$ を使え。
        choices:
          - "$«app»$"
          - "$«web»$"
          - "$«noroute»$"
          - "$«ok»$"
          - "$«cdf»$"
        answer: 3
        distractors:
          - 待ち時間をアプリの注文だけの到着率で計算した
          - 待ち時間を Web の注文だけの到着率で計算した
          - アプリ経由である確率を掛け忘れた
          - 正解
          - 5 分以内に来る確率 1-e^{-2} を使った
        explanation: |
          **方針** 独立なポアソン過程を重ね合わせると、到着率 $\lambda_A+\lambda_W$ のポアソン過程になる。次の到着までの時間は指数分布に従い、それがどちらの経路かは確率 $\lambda_A/(\lambda_A+\lambda_W)$ で、到着時間とは独立に決まる。

          **途中式** 合計の到着率は $«la»+«lw»=«lsum»$ 件/時、5 分では平均 $«lsum»\times«tmin»/60=«lt»$ 件。
          $$P(\text{5 分以上来ない})=e^{-«lt»}=«e20»,\qquad P(\text{アプリ})=\frac{«la»}{«lsum»}=«pa»$$
          $$P=«e20»\times«pa»=«ok»$$

          **答え** $«ok»$

          **間違えやすい点** 「次の注文」はどちらの経路でもよいので、待ち時間は合計の到着率で決まる。アプリの到着率だけで $e^{-0.5}$ とすると $«app»$。
          指数分布どうしの競争では、最初に来た時刻と、どちらが勝ったかが独立になることを使っている。

  - id: s06p09
    title: 日用品の価格と販売数量
    context: |
      ある日用品の価格と販売数量の関係を分析する。対数はすべて自然対数とする。
    items:
      - id: s06p09a
        chapter: 16
        terms: [multiple-regression-model, dummy-variable, log-transformation]
        topic: 両対数の重回帰で価格の係数を弾力性として読み10%値下げとチラシ掲載を同時に行ったときの販売数量の倍率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          多数の店舗×週のデータに、次の回帰モデルを最小二乗法で当てはめた。
          $$\log Q=\beta_0+\beta_1\log P+\beta_2 D+\varepsilon$$
          $Q$ は販売数量、$P$ は価格、$D$ はチラシに掲載した週なら 1、そうでなければ 0。推定値は $\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
          誤差 $\varepsilon$ は $P,D$ と独立で同じ分布に従うとする。チラシに載せていない週と比べて、価格を 10% 下げてチラシにも載せた週の販売数量の期待値は何倍になると推定されるか。
          必要なら $0.9^{-1.8}=«pw»$、$e^{0.6}=«ex6»$ を使え。
        answer: «ratio»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $Q=e^{\beta_0}P^{\beta_1}e^{\beta_2D}e^{\varepsilon}$ と書ける。2 つの条件の期待値の比をとると、$e^{\beta_0}$ と $E[e^{\varepsilon}]$ は約分されて消える。

          **途中式** 価格を $P$ から $0.9P$ に、$D$ を 0 から 1 にすると
          $$\frac{E[Q\mid 0.9P,\ D=1]}{E[Q\mid P,\ D=0]}=\frac{(0.9P)^{\beta_1}e^{\beta_2}}{P^{\beta_1}}=0.9^{\beta_1}e^{\beta_2}$$
          $$0.9^{-1.8}\times e^{0.6}=«pw»\times«ex6»=«ratio4»\cdots$$

          **答え** $«ratio»$ 倍

          **間違えやすい点** 両対数モデルの係数 $\beta_1$ は弾力性で、「価格 1% の変化で数量が約 $|\beta_1|$% 変わる」は小さな変化での近似。10% の値下げで $1.8\times10\%=18\%$ 増と線形に足し合わせ、チラシ効果 $0.6$ も足して $1+0.18+0.6=«add»$ 倍とするのは誤り。
          対数モデルの効果は掛け算で効くので、2 つの効果の倍率どうしを掛ける（足して $«pw»+«ex6»-1=«addm»$ としない）。

      - id: s06p09b
        chapter: 17
        terms: [dfbetas, leverage, outlier-and-influential-point]
        topic: 6週分の単回帰で1週を除いて当てはめ直したときの傾きの変化量（DFBETA）をてこ比と残差から再当てはめなしに求める
        level: 応用
        definition: false
        type: numeric
        question: |
          ある 1 店舗の 6 週間について、販売数量 $y$ を価格 $x$ に単回帰した。価格の平均からの偏差 $d_i=x_i-\bar x$ と最小二乗法の残差 $e_i$ は次のとおりである（$S_{xx}=\sum d_i^2=«Sxx»$）。

          | 週 | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $d_i$ | «d1» | «d2» | «d3» | «d4» | «d5» | «d6» |
          | $e_i$ | «e1» | «e2» | «e3» | «e4» | «e5» | «e6» |

          第 6 週を除いた 5 週で当てはめ直したときの傾きを $\hat\beta_{1(6)}$、6 週すべてで求めた傾きを $\hat\beta_1$ とする。
          観測を 1 つ除いたときの係数の変化を表す公式 $\hat{\boldsymbol\beta}-\hat{\boldsymbol\beta}_{(i)}=\dfrac{(X^{\top}X)^{-1}\boldsymbol x_i e_i}{1-h_{ii}}$（$h_{ii}$ はてこ比）を使って、$\hat\beta_{1(6)}-\hat\beta_1$ を求めよ。
        answer: «dfb»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で、符号もつけて答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 単回帰では、説明変数を中心化すると $(X^{\top}X)^{-1}\boldsymbol x_i$ の傾きの成分は $d_i/S_{xx}$ になる。てこ比は $h_{ii}=1/n+d_i^2/S_{xx}$。

          **途中式** 第 6 週のてこ比は
          $$h_{66}=\frac16+\frac{«d6»^2}{«Sxx»}=«h6»,\qquad 1-h_{66}=«h6n»$$
          傾きの変化は
          $$\hat\beta_{1(6)}-\hat\beta_1=-\frac{d_6e_6}{S_{xx}(1-h_{66})}=-\frac{«d6»\times«e6»}{«Sxx»\times«h6n»}=-\frac{«de6»}{«Sh»}=«dfb4»$$

          **答え** $«dfb»$（第 6 週を除くと傾きが «db_sign» 小さくなる）

          **間違えやすい点** $1-h_{ii}$ で割り忘れると $«db_noh»$ で、てこ比の大きい観測ほど影響を過小評価する。符号の向き（除いた後 − 除く前）にも注意する（逆にすると $«db_sign»$）。
          これを $\hat\beta_{1(i)}$ の標準誤差で割ったものが DFBETAS で、影響の大きい観測の目安に使う。

  - id: s06p10
    title: 会員満足度調査の集計
    context: |
      ある通販サイトは、会員の年代構成が 20 代 «W1»%、30〜40 代 «W2»%、50 代以上 «W3»% であることを会員名簿から把握している。
      会員に満足度（5 点満点）を尋ねるアンケートを行ったところ、次の回答が得られた。回答の傾向は、同じ年代の中では回答者と非回答者で変わらないとする。

      | 年代 | 回答者数 | 満足度の平均 |
      |---|---|---|
      | 20 代 | «n1» | «y1» |
      | 30〜40 代 | «n2» | «y2» |
      | 50 代以上 | «n3» | «y3» |
    items:
      - id: s06p10a
        chapter: 21
        terms: [sampling-weight, stratified-sampling, nonresponse-bias]
        topic: 年代構成が既知の会員アンケートを事後層化のウェイトで補正して満足度の平均を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          年代ごとの構成比を会員全体に合わせる事後層化（ウェイト付け）によって、会員全体の満足度の平均を推定する。推定値に最も近いものはどれか。
        choices:
          - "$«un»$"
          - "$«simple»$"
          - "$«ok»$"
          - "$«inv»$"
          - "$«wavg»$"
        answer: 2
        distractors:
          - 回答者全体の単純平均を答えた（回答者の年代の偏りを補正していない）
          - 3 つの年代の平均を単純平均した（構成比を無視した）
          - 正解
          - ウェイトを逆数（回答者の構成比 ÷ 会員の構成比）にした
          - 1 人あたりのウェイトと年代平均の積を 3 で割った
        explanation: |
          **方針** 事後層化推定量は $\hat{\bar Y}=\sum_h W_h\bar y_h$（$W_h$ は会員全体の構成比、$\bar y_h$ は年代 $h$ の回答者の平均）。1 人ずつのウェイト $W_h/(n_h/n)$ を付けて加重平均しても同じになる。

          **途中式**
          $$\hat{\bar Y}=«Wd1»\times«y1»+«Wd2»\times«y2»+«Wd3»\times«y3»=«t1»+«t2»+«t3»=«ok»$$
          （回答者の構成比は «sh1»%、«sh2»%、«sh3»% なので、1 人あたりのウェイトは順に «w1»、«w2»、«w3»。）

          **答え** $«ok»$

          **間違えやすい点** 回答者は 50 代以上に偏っており（会員の «W3»% に対し回答者の «sh3»%）、満足度の高い年代を多く数えた単純平均 $«un»$ は過大になる。
          ウェイトは「会員の構成比 ÷ 回答者の構成比」で、少なく回答された年代ほど大きくする。なお、この補正が偏りを除けるのは、年代の中では回答の有無が満足度と無関係という仮定のもとだけである。

  - id: s06p11
    title: 配送方法の選択
    context: |
      ある EC サイトで、注文者が選ぶ配送方法（標準配送・速達・店舗受取）を、購入金額 $x$（万円）を説明変数とする多項ロジットモデルで分析した。
      標準配送を基準カテゴリーとし、推定された線形予測子は
      $$\eta_{\text{速達}}=-1.2+0.8x,\qquad \eta_{\text{店舗}}=-0.5-0.3x\qquad(\eta_{\text{標準}}=0)$$
      で、カテゴリー $j$ を選ぶ確率は $P(j)=\dfrac{e^{\eta_j}}{\sum_k e^{\eta_k}}$ である。
    items:
      - id: s06p11a
        chapter: 18
        terms: [multinomial-logit-model, logistic-regression, link-function]
        topic: 基準カテゴリーのある多項ロジットモデルで購入金額2万円の注文者が速達を選ぶ確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          購入金額 $x=«x»$ 万円の注文者が速達を選ぶ確率に最も近い値はどれか。必要なら $e^{«e1»}=«E1»$、$e^{«e2»}=«E2»$ を使え。
        choices:
          - "$«store»$"
          - "$«base»$"
          - "$«ok»$"
          - "$«bin»$"
          - "$«nobase»$"
        answer: 2
        distractors:
          - 店舗受取を選ぶ確率を答えた
          - 基準カテゴリー（標準配送）を選ぶ確率を答えた
          - 正解
          - 店舗受取を無視し、速達と標準の 2 値ロジスティックとして計算した
          - 分母に基準カテゴリーの e^0=1 を入れ忘れた
        explanation: |
          **方針** $x=«x»$ を代入して各カテゴリーの線形予測子を求め、ソフトマックス（基準カテゴリーは $e^0=1$）で確率にする。

          **途中式** $\eta_{\text{速達}}=-1.2+0.8\times«x»=«e1»$、$\eta_{\text{店舗}}=-0.5-0.3\times«x»=«e2»$。
          $$\sum_k e^{\eta_k}=1+«E1»+«E2»=«den»$$
          $$P(\text{速達})=\frac{«E1»}{«den»}=«ok»$$
          （同様に $P(\text{標準})=«base»$、$P(\text{店舗})=«store»$ で、3 つの和は 1。）

          **答え** $«ok»$

          **間違えやすい点** 基準カテゴリーの線形予測子は 0 なので $e^0=1$ が分母に入る。$e^{\eta_{\text{速達}}}=«E1»$ は「速達と標準のオッズ」で、確率ではない。3 カテゴリーあるので 2 値のロジスティック $«E1»/(1+«E1»)=«bin»$ とも異なる。

  - id: s06p12
    title: 会員の購買データの多変量解析
    context: |
      ある EC サイトの会員の購買データを、いくつかの多変量解析の手法で調べる。
    items:
      - id: s06p12a
        chapter: 22
        terms: [singular-value-decomposition, low-rank-approximation, principal-component-analysis, contribution-ratio]
        topic: 中心化した会員×商品カテゴリーのデータ行列の特異値から2次元の低ランク近似で説明される平方和の割合を求める
        level: 標準
        definition: false
        type: choice
        question: |
          会員 $n$ 人 × 商品カテゴリー 4 つの購入額の行列を列ごとに中心化した行列 $X$（$n\times4$）の特異値は、大きい順に «sv1», «sv2», «sv3», «sv4» だった。
          $X$ を特異値分解の上位 2 成分だけで近似したとき（第 2 主成分までを使うのと同じ）、$X$ の全要素の平方和のうち近似で説明される割合に最も近いものはどれか。
        choices:
          - "$«sv_one»$"
          - "$«sv_nosq»$"
          - "$«sv_sq»$"
          - "$«sv_ok»$"
          - "$«sv_res»$"
        answer: 3
        distractors:
          - 第 1 成分だけの割合を答えた
          - 特異値を 2 乗せずに割合を計算した
          - 求めた割合をさらに 2 乗した
          - 正解
          - 近似で説明されずに残る平方和の割合を答えた
        explanation: |
          **方針** $X=\sum_k\sigma_k u_kv_k^{\top}$ と分解すると、全要素の平方和は $\sum_k\sigma_k^2$。上位 2 成分の近似（エッカート・ヤングの定理より最良の階数 2 近似）で説明されるのは $\sigma_1^2+\sigma_2^2$。
          共分散行列 $X^{\top}X/(n-1)$ の固有値は $\sigma_k^2/(n-1)$ なので、これは第 2 主成分までの累積寄与率と同じ。

          **途中式**
          $$\frac{\sigma_1^2+\sigma_2^2}{\sum_k\sigma_k^2}=\frac{«sv1»^2+«sv2»^2}{«sv1»^2+«sv2»^2+«sv3»^2+«sv4»^2}=\frac{«top2»}{«tot»}=«sv_ok»$$

          **答え** $«sv_ok»$

          **間違えやすい点** 寄与率は特異値ではなくその 2 乗（主成分の分散に比例する量）で計算する。特異値のまま $(«sv1»+«sv2»)/(«sv1»+«sv2»+«sv3»+«sv4»)$ とすると $«sv_nosq»$ になる。

      - id: s06p12b
        chapter: 24
        terms: [mixture-model-clustering, normal-mixture-distribution, bayes-theorem]
        topic: 2成分の混合正規モデルによるクラスタリングで購入金額からある会員の各クラスターへの所属確率（負担率）を求める
        level: 基本
        definition: false
        type: choice
        question: |
          会員の月間購入金額（万円）を、2 つのクラスターからなる混合正規モデルで表した。推定された母数は、
          クラスター 1 が混合比率 «w1»・平均 «m1»・標準偏差 1、クラスター 2 が混合比率 «w2»・平均 «m2»・標準偏差 1 である。
          購入金額が «x0» 万円の会員がクラスター 1 に属する事後確率（負担率）に最も近い値はどれか。
          標準正規分布の密度の値 $\phi(«z1»)=«ph1»$、$\phi(«z2»)=«ph2»$ を使え。
        choices:
          - "$«h_hard»$"
          - "$«h_prior»$"
          - "$«h_now»$"
          - "$«h_ok»$"
          - "$«h_other»$"
        answer: 3
        distractors:
          - k 平均法のように近い平均のクラスターに確率 1 で割り当てた
          - データを使わず混合比率（事前確率）を答えた
          - 混合比率を掛け忘れ、密度の比だけで計算した
          - 正解
          - クラスター 2 に属する事後確率を答えた
        explanation: |
          **方針** ベイズの定理で、クラスター $k$ の負担率は $\dfrac{\pi_k f_k(x)}{\sum_j\pi_j f_j(x)}$。標準偏差が 1 なので $f_k(x)=\phi(x-\mu_k)$。

          **途中式** $x-\mu_1=«x0»-«m1»=«z1»$、$\mu_2-x=«m2»-«x0»=«z2»$（$\phi$ は左右対称）。
          $$\pi_1f_1(x)=«w1»\times«ph1»=«num1»,\qquad \pi_2f_2(x)=«w2»\times«ph2»=«num2»$$
          $$\frac{«num1»}{«num1»+«num2»}=\frac{«num1»}{«den»}=«h_ok»$$

          **答え** $«h_ok»$

          **間違えやすい点** 混合モデルによるクラスタリングは、会員を 1 つのクラスターに決めつけず、所属の確率（ソフトな割り当て）を与える。混合比率を掛け忘れると $«h_now»$。EM 法ではこの負担率を重みにして各クラスターの平均・分散・比率を更新する。

      - id: s06p12c
        chapter: 23
        terms: [decision-tree, misclassification-rate]
        topic: 翌月購入を予測する決定木の分岐でジニ不純度の減少量を求め誤分類率では減らない例と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          翌月に購入するかどうかを予測する決定木を作る。ある節点には会員 «N» 人（うち購入者 «P» 人）がいる。
          「メールを開封したか」で分けると、開封した «nl» 人のうち購入者 «pl» 人、開封しなかった «nr» 人のうち購入者 «pr» 人になる。
          ジニ不純度 $1-\sum_k p_k^2$ の、分岐による減少量（親の不純度 − 子の不純度を人数で重みづけた平均）に最も近い値はどれか。
        choices:
          - "$«g_mis»$"
          - "$«g_unw»$"
          - "$«g_ok»$"
          - "$«g_after»$"
          - "$«g_par»$"
        answer: 2
        distractors:
          - ジニ不純度ではなく誤分類率で減少量を計算した
          - 子の不純度を人数で重みづけずに単純平均した
          - 正解
          - 減少量ではなく分岐後の不純度を答えた
          - 分岐前（親）の不純度を答えた
        explanation: |
          **方針** 各節点のジニ不純度を、購入者の割合 $p$ から $1-p^2-(1-p)^2=2p(1-p)$ で計算し、子は人数比で重みづけて平均する。

          **途中式** 親：$p=«P»/«N»$ より $2\times0.3\times0.7=«gp»$。
          開封：$p=«pfr»$ で $«gl»$。未開封：$p=«pr»/«nr»=«prr»$ で $2\times\frac16\times\frac56=«gr»$。
          $$\text{分岐後}=\frac{«nl»}{«N»}\times«gl»+\frac{«nr»}{«N»}\times«gr»=«glw»+«grw»=«after4»$$
          $$\text{減少量}=«gp»-«after4»=«dec4»$$

          **答え** $«g_ok»$

          **間違えやすい点** 誤分類率（多数派で予測したときの誤り率）は、分岐前が $«mis_p»$、分岐後も「どちらの子でも非購入と予測」で $«mis_a»$ のまま減らない。ジニ不純度は、この分岐で子の純度が上がったことを捉えられるので分岐の評価に向く。
          子の不純度は人数で重みづける（単純平均すると $«g_unw»$）。

  - id: s06p13
    title: 販促メールの効果検証
    context: |
      ある EC サイトが会員に販促メールを配信し、その効果を検証する。
    items:
      - id: s06p13a
        chapter: 28
        terms: [yates-correction, two-by-two-table, contingency-table]
        topic: メール開封と購入の2×2分割表でイェーツの連続修正をしたカイ二乗統計量を求める
        level: 基本
        definition: false
        type: choice
        question: |
          メールを受け取った «n» 人について、開封の有無と 1 週間以内の購入の有無を集計した。

          | | 購入した | 購入しない | 計 |
          |---|---|---|---|
          | 開封した | «a» | «b» | «r1» |
          | 開封しない | «c» | «d» | «r2» |
          | 計 | «k1» | «k2» | «n» |

          開封と購入の独立性を調べるため、イェーツの連続修正を行ったカイ二乗統計量を計算する。その値に最も近いものはどれか。
        choices:
          - "$«y_phi»$"
          - "$«y_z»$"
          - "$«y_full»$"
          - "$«y_ok»$"
          - "$«y_no»$"
        answer: 3
        distractors:
          - カイ二乗統計量から求めたφ係数（連関の強さ）を答えた
          - 統計量の平方根（標準正規の値）を答えた
          - 連続修正で n/2 ではなく n を引いた
          - 正解
          - 連続修正をしなかった
        explanation: |
          **方針** 2×2 表のイェーツ補正つきカイ二乗統計量は
          $$\chi^2=\frac{n\left(|ad-bc|-n/2\right)^2}{(a+b)(c+d)(a+c)(b+d)}$$
          で、自由度 1 のカイ二乗分布と比べる。

          **途中式** $ad-bc=«ad»-«bc»=«adbc»$、$|ad-bc|-n/2=«adbc»-«half»=«adj»$。
          $$\chi^2=\frac{«n»\times«adj»^2}{«r1»\times«r2»\times«k1»\times«k2»}=\frac{«n»\times«adj2»}{«den»}=«y_ok»$$

          **答え** $«y_ok»$（自由度 1 の上側 5% 点 3.841 を超え、開封と購入は独立でないといえる）

          **間違えやすい点** 補正なしでは $«y_no»$。補正は $|ad-bc|$ から $n/2$ を引く（$n$ を引くと $«y_full»$）。連続修正は統計量を小さくし、検定を保守的にする。

      - id: s06p13b
        chapter: 5
        terms: [geometric-distribution, conditional-probability, bernoulli-distribution]
        topic: 5通続けて購入しなかった会員があと3通以内に購入する確率を幾何分布の無記憶性で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある会員は、販促メールを受け取るたびに独立に確率 «pp» で購入するとする。この会員が最初の «k0» 通ではいずれも購入しなかったとき、
          次の «k1» 通（«k0p» 通目から «k01» 通目）のうちに初めて購入する条件付き確率に最も近い値はどれか。
        choices:
          - "$«f_unc»$"
          - "$«f_joint»$"
          - "$«f_ok»$"
          - "$«f_add»$"
          - "$«f_no»$"
        answer: 2
        distractors:
          - 条件を無視し、8 通目までに購入する確率を答えた
          - 条件付き確率ではなく「5 通は買わず 6〜8 通目で買う」同時確率を答えた
          - 正解
          - 3 通それぞれの購入確率 0.2 を足した
          - 3 通とも購入しない確率を答えた
        explanation: |
          **方針** 初めて購入する通数 $X$ は $P(X>k)=(1-p)^k$ の幾何分布に従う。条件付き確率の定義から計算すると、無記憶性 $P(X>k_0+k_1\mid X>k_0)=P(X>k_1)$ が現れる。

          **途中式**
          $$P(X\le «k01»\mid X>«k0»)=\frac{P(«k0»<X\le «k01»)}{P(X>«k0»)}=\frac{«q»^{«k0»}-«q»^{«k01»}}{«q»^{«k0»}}=1-«q»^{«k1»}=1-«q3»=«f_ok»$$
          （分子 $«q5»-«q8»\approx«f_joint»$、分母 $«q5»$。）

          **答え** $«f_ok»$

          **間違えやすい点** 「5 通も買わなかったのだから次は買いやすい（または買いにくい）」とはならない。購入が毎回独立で確率一定なら、これまでの結果は今後の確率に影響しない（無記憶性）。
          同時確率 $«f_joint»$ を答えるのは、条件 $X>«k0»$ の確率で割り忘れた誤り。確率を足して $3\times«pp»=«f_add»$ とするのは、複数回購入する重なりを無視している。

      - id: s06p13c
        chapter: 33
        terms: [d-separation, backdoor-criterion, partial-correlation-coefficient]
        topic: 独立な2つの要因を合流点の問い合わせで条件づけると生じる負の偏相関（合流点バイアス）を線形構造方程式から求める
        level: 基本
        definition: false
        type: choice
        question: |
          会員の「広告への関心」$X$ と「価格への敏感さ」$Y$ は互いに独立で、どちらも標準正規分布に従うとする。
          問い合わせの多さ $C$ は $C=X+Y+\varepsilon$（$\varepsilon$ は $X,Y$ と独立な標準正規分布）で決まる（因果グラフ $X\to C\leftarrow Y$）。
          $C$ の値が同じ会員どうしで見たときの $X$ と $Y$ の相関係数（$C$ を与えたときの偏相関係数）はどれか。
        choices:
          - "$«k_zero»$"
          - "$«k_pos»$"
          - "$«k_cov»$"
          - "$«k_ok»$"
          - "$«k_noe»$"
        answer: 3
        distractors:
          - X と Y はもともと独立なので、C で条件づけても独立のままと考えた
          - 符号を取り違えた（C が一定なら一方が大きいと他方は小さい）
          - 条件付き共分散を相関係数と取り違え、条件付き分散で割らなかった
          - 正解
          - 誤差 ε を無視して C=X+Y とし、完全な負の相関とした
        explanation: |
          **方針** $(X,Y,C)$ は多変量正規分布。$C$ を与えたときの条件付き共分散・分散は $\mathrm{Cov}(X,Y\mid C)=\mathrm{Cov}(X,Y)-\dfrac{\mathrm{Cov}(X,C)\mathrm{Cov}(Y,C)}{V[C]}$ などで求まる。

          **途中式** $V[C]=1+1+1=«vc»$、$\mathrm{Cov}(X,C)=\mathrm{Cov}(Y,C)=1$、$\mathrm{Cov}(X,Y)=0$ より
          $$\mathrm{Cov}(X,Y\mid C)=0-\frac{1\times1}{«vc»}=«cxyc»,\qquad V[X\mid C]=V[Y\mid C]=1-\frac{1}{«vc»}=«vxc»$$
          $$\rho_{XY\cdot C}=\frac{«cxyc»}{«vxc»}=«k_ok»$$

          **答え** $«k_ok»$

          **間違えやすい点** $C$ は $X$ と $Y$ の合流点で、$X$–$C$–$Y$ の経路はふだん閉じているが、$C$ で条件づける（問い合わせの多い会員だけを分析するなど）と開き、無関係な $X$ と $Y$ の間に見かけの負の相関が生じる（合流点バイアス、選択バイアス）。
          そのため因果効果の推定では、合流点やその子孫を調整変数に入れてはいけない。
