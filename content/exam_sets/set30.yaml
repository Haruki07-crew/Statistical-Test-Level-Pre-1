set: 30
title: 模擬試験 第30回
minutes: 90
problems:
  - id: s30p01
    title: 部活動の試合と体力テスト
    context: |
      ある高校の部活動について、試合の結果と体力テストの成績を調べる。小問ごとに別のデータを扱う。
    items:
      - id: s30p01a
        chapter: 1
        terms: [independence-of-events, conditional-probability, inclusion-exclusion-principle]
        topic: 独立な2人の選手のシュートでちょうど一方だけが成功する確率を互いに排反な2つの場合の和として求め少なくとも一方が成功する確率と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          PK 戦で、選手 A のシュートが成功する確率は «pa»、選手 B は «pb» で、2 人の結果は独立とする。2 人のうち**ちょうど 1 人だけ**が成功する確率として正しいものはどれか。
        choices:
          - '$«atleast»$'
          - '$«both»$'
          - '$«sum»$'
          - '$«w_ind»$'
          - '$«one»$'
        answer: 4
        distractors:
          - 少なくとも 1 人が成功する確率を求めた
          - 2 人とも成功する確率を求めた
          - 2 人の成功確率を足した（確率は 1 を超えうる値になる）
          - 1 から 2 人とも成功する確率を引いた（2 人とも失敗する場合も含めた）
          - 正解
        explanation: |
          **方針** 「A だけ成功」と「B だけ成功」は同時には起こらない（互いに排反）ので、それぞれの確率を独立性で求めて足す。

          **途中式**
          - A だけ成功：$«pa»\times(1-«pb»)=«a_only»$
          - B だけ成功：$(1-«pa»)\times«pb»=«b_only»$
          - 合計：$«a_only»+«b_only»=«one»$

          **答え** $«one»$

          **間違えやすい点** 「少なくとも 1 人」は $1-(1-«pa»)(1-«pb»)=«atleast»$ で、2 人とも成功する場合（$«both»$）も含む。「ちょうど 1 人」はそれを除いた $«atleast»-«both»=«one»$ とも計算できる。
          「独立」と「排反」は別の概念で、独立な事象 A と B は（確率が正なら）同時に起こりうる。
      - id: s30p01b
        chapter: 3
        terms: [conditional-expectation, joint-probability-function, expectation-variance-properties]
        topic: 週の練習日数の区分と体力テストの等級の同時確率表から練習日数を与えたときの等級の条件付き期待値を求め全体の期待値と比べる
        level: 基本
        definition: false
        type: numeric
        question: |
          部員の週の練習日数の区分 $X$（0：2 日以下、1：3〜4 日、2：5 日以上）と体力テストの等級 $Y$（1・2・3、大きいほど良い）の同時確率は次のとおりである。

          | $X$＼$Y$ | 1 | 2 | 3 |
          |---|---|---|---|
          | 0 | 0.10 | 0.15 | 0.05 |
          | 1 | 0.05 | 0.20 | 0.15 |
          | 2 | 0.02 | 0.08 | 0.20 |

          $X=1$ を与えたときの $Y$ の条件付き期待値 $E[Y\mid X=1]$ を求めよ。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 条件付き確率は同時確率を周辺確率で割ったもの：$P(Y=y\mid X=1)=P(X=1,Y=y)/P(X=1)$。

          **途中式**
          - $P(X=1)=0.05+0.20+0.15=0.40$
          - 条件付き確率：$(0.125,\ 0.5,\ 0.375)$
          - $E[Y\mid X=1]=1\times0.125+2\times0.5+3\times0.375=«ans_s»$

          **答え** $«ans_s»$

          **間違えやすい点** 同時確率をそのまま重みにして $1\times0.05+2\times0.20+3\times0.15=0.90$ とすると、周辺確率 0.40 で割り忘れている。
          条件付き期待値は $X=0,1,2$ で «e0»、«ans_s»、«e2» と増え、それらを $X$ の周辺確率で平均すると全体の期待値 $E[Y]=«ey»$ になる（繰り返し期待値の法則）。
  - id: s30p02
    title: トレーニングアプリの乱数
    context: |
      トレーニングアプリで、コイン投げを繰り返して 0 と 1 の間の数を作る仕組みを考える。$B_1,B_2,\ldots$ は独立に確率 1/2 で 0 か 1 をとる。
    items:
      - id: s30p02a
        chapter: 2
        terms: [characteristic-function, uniform-distribution, sum-of-random-variables]
        topic: 独立なコイン投げの結果を2進数の各桁とする数の分布を特性関数の無限積が一様分布の特性関数になることから特定する
        level: 応用
        definition: false
        type: choice
        question: |
          $U=\sum_{k=1}^{\infty}B_k/2^k$（2 進数の小数 $0.B_1B_2B_3\ldots$）とし、$Y=2U-1=\sum_{k=1}^\infty S_k/2^k$（$S_k=2B_k-1$ は確率 1/2 で $\pm1$）とする。
          $S_k/2^k$ の特性関数は $\cos(t/2^k)$ で、恒等式 $\prod_{k=1}^{\infty}\cos(t/2^k)=\dfrac{\sin t}{t}$ が成り立つ。$U$ の分布として正しいものはどれか。
        choices:
          - '中心極限定理により、$U$ は平均 1/2 の正規分布に従う'
          - '$U$ は 0 と 1 の 2 点だけをとる離散分布に従う'
          - '$Y$ の特性関数は $\sin t/t$ で、これは区間 $(-1,1)$ の一様分布の特性関数なので、$U$ は区間 $(0,1)$ の一様分布に従う'
          - '$Y$ の特性関数は $\sin t/t$ で、これは標準正規分布の特性関数なので、$U$ は正規分布に従う'
          - '$U$ の特性関数は各項の特性関数の和になるので、分布は特定できない'
        answer: 2
        distractors:
          - 項の大きさが急に小さくなる和なので、中心極限定理の条件を満たさない
          - 無限個の桁で、区間全体に値をとる
          - 正解
          - 標準正規分布の特性関数は e^{−t²/2}
          - 独立な和の特性関数は積になる
        explanation: |
          **方針** 独立な確率変数の和の特性関数は、それぞれの特性関数の積。特性関数は分布を一意に決める。

          **途中式**
          - $E[e^{itS_k/2^k}]=\frac12e^{it/2^k}+\frac12e^{-it/2^k}=\cos(t/2^k)$
          - $\varphi_Y(t)=\prod_k\cos(t/2^k)=\dfrac{\sin t}{t}$
          - 区間 $(-1,1)$ の一様分布の特性関数は $\displaystyle\int_{-1}^1\frac12e^{itx}dx=\frac{\sin t}{t}$ で一致する。よって $Y\sim U(-1,1)$、$U=(Y+1)/2\sim U(0,1)$

          **答え** $U$ は区間 $(0,1)$ の一様分布に従う

          **間違えやすい点** 中心極限定理は、同程度の大きさの多数の項の和に当てはまる。ここでは $k$ 番目の項が $1/2^k$ と急に小さくなるので、最初の数項が分布を決め、正規分布にはならない。
          この性質は、コイン投げ（一様な 0・1）から一様乱数を作れることを示している。
  - id: s30p03
    title: 記録の分布
    context: |
      陸上競技と用具の記録について、分布のモデルを考える。小問ごとに別のデータを扱う。
    items:
      - id: s30p03a
        chapter: 4
        terms: [probit-transformation, normal-distribution, standard-normal-distribution]
        topic: 練習方法の違う2群でマラソンを4時間以内に走る割合をプロビット変換して正規分布の標準偏差を単位とした記録の差を求める
        level: 標準
        definition: false
        type: choice
        question: |
          市民ランナーのマラソンの記録は、どちらの群でも同じ標準偏差の正規分布に従うとする。4 時間以内に走る人の割合は、従来の練習の群で «p1»、新しい練習の群で «p2» だった。
          2 群の記録の平均の差は、標準偏差の何倍か。$\Phi^{-1}(0.30)=-0.524$、$\Phi^{-1}(0.60)=0.253$ とする。
        choices:
          - '«w_diff» 倍（割合の差そのもの）'
          - '«w_ratio» 倍（割合の比）'
          - '«shift» 倍（新しい練習の群の方が速い）'
          - '«w_sum» 倍'
          - '割合しかわからないので、平均の差は求められない'
        answer: 2
        distractors:
          - 割合の差は標準偏差を単位とした差ではない
          - 割合の比は正規分布の位置の差を表さない
          - 正解
          - プロビット値の差ではなく和をとった（符号を誤った）
          - 正規分布で標準偏差が等しいと仮定すれば、プロビット変換で差を求められる
        explanation: |
          **方針** 記録が $N(\mu,\sigma^2)$ に従うとき、4 時間以内の割合は $\Phi((240-\mu)/\sigma)$。割合をプロビット変換 $\Phi^{-1}$ すると $(240-\mu)/\sigma$ が得られる。

          **途中式**
          - 従来：$(240-\mu_1)/\sigma=\Phi^{-1}(«p1»)=-0.524$
          - 新しい練習：$(240-\mu_2)/\sigma=\Phi^{-1}(«p2»)=0.253$
          - 差：$(\mu_1-\mu_2)/\sigma=0.253-(-0.524)=«shift»$

          **答え** 約 «shift» 倍

          **間違えやすい点** 割合の差（«w_diff»）は、平均の差が同じでも、分布のどのあたりで割合を測るかで変わる。プロビット変換は、割合を正規分布の尺度に戻して比べられるようにする。
          標準偏差が群で違うと、この方法では平均の差と標準偏差の違いを区別できない。
      - id: s30p03b
        chapter: 6
        terms: [survival-function, order-statistics, hazard-function]
        topic: ワイブル分布に従う5つの部品の寿命の最小値がまたワイブル分布に従うことから直列につないだ器具の寿命の尺度と一定期間もつ確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          トレーニング器具は 5 つの部品を直列につないだもので、どれか 1 つが壊れると使えなくなる。各部品の寿命（年）は独立に、生存関数 $S(t)=\exp\{-(t/10)^2\}$ のワイブル分布（形状 2、尺度 10）に従う。
          器具の寿命の分布と、器具が 3 年以上もつ確率の組として正しいものはどれか。必要なら $e^{-0.45}=0.638$、$e^{-0.09}=0.914$ を使え。
        choices:
          - '形状 2、尺度 $10/\sqrt5\approx«sc»$ のワイブル分布で、3 年以上もつ確率は «p3»'
          - '形状 2、尺度 $10/5=2$ のワイブル分布で、3 年以上もつ確率は «w_p3»'
          - '形状 2、尺度 10 のワイブル分布で、3 年以上もつ確率は «w_one»'
          - '形状 10、尺度 10 のワイブル分布で、3 年以上もつ確率は «p3»'
          - '平均 2 年の指数分布で、3 年以上もつ確率は $e^{-1.5}$'
        answer: 0
        distractors:
          - 正解
          - 尺度を部品の数で割った（形状が 2 なので √5 で割る）
          - 部品 1 つの寿命の分布のまま
          - 形状は変わらない（部品の数は尺度にだけ効く）
          - 最小値の分布は指数分布にはならない（形状 2 のまま）
        explanation: |
          **方針** 直列の器具の寿命は 5 つの寿命の最小値 $T=\min T_i$。独立なので $P(T>t)=\prod P(T_i>t)=S(t)^5$。

          **途中式**
          $$P(T>t)=\exp\{-5(t/10)^2\}=\exp\{-(t/(10/\sqrt5))^2\}$$
          形状 2、尺度 $10/\sqrt5=«sc»$ のワイブル分布。
          $$P(T>3)=\exp\{-5\times0.09\}=e^{-0.45}=«p3»$$

          **答え** 尺度 «sc» のワイブル分布、3 年以上もつ確率は «p3»

          **間違えやすい点** ワイブル分布の最小値は、形状が同じで尺度が $n^{-1/m}$ 倍（$m$ は形状）のワイブル分布になる。部品 1 つなら 3 年以上もつ確率は $e^{-0.09}=0.914$ と高いが、直列に 5 つつなぐと «p3» まで下がる。
  - id: s30p04
    title: 収束と推定の性質
    context: |
      選手の記録のデータから推定や近似を行うときの、理論的な性質を考える。小問ごとに別の状況を扱う。
    items:
      - id: s30p04a
        chapter: 7
        terms: [convergence-in-distribution, convergence-in-probability, almost-sure-convergence]
        topic: 標準正規分布に従う変数の符号を交互に変えた列が分布収束するが確率収束しない例から収束の概念の違いを選ぶ
        level: 標準
        definition: true
        type: choice
        question: |
          $Z$ は標準正規分布に従う確率変数とし、$X_n=(-1)^nZ$（$n$ が偶数なら $Z$、奇数なら $-Z$）とする。$n\to\infty$ のときの $X_n$ の収束について、正しいものはどれか。
        choices:
          - '$X_n$ は $Z$ に確率収束し、したがって概収束もする'
          - '$X_n$ の分布が $n$ によって変わるので、分布収束もしない'
          - '分布収束すれば確率収束するので、$X_n$ は $Z$ に確率収束する'
          - '$X_n$ は 0 に確率収束する'
          - '$X_n$ の分布はどの $n$ でも標準正規分布なので $Z$ に分布収束するが、$|X_n-Z|$ は奇数の $n$ で $2|Z|$ となり、$X_n$ は $Z$ に確率収束しない'
        answer: 4
        distractors:
          - 奇数の n では X_n=−Z で、Z から離れたまま
          - −Z も標準正規分布に従うので、分布はどの n でも同じ
          - 分布収束は確率収束より弱く、逆は一般には成り立たない
          - X_n の分布は標準正規分布のままで、0 に集中しない
          - 正解
        explanation: |
          **方針** 分布収束は分布関数（分布の形）だけの収束で、確率変数どうしが近づくことは要求しない。確率収束は $P(|X_n-X|>\varepsilon)\to0$ を要求する。

          **途中式**
          - 標準正規分布は 0 について対称なので、$-Z$ も標準正規分布に従う。よって $X_n$ の分布関数はどの $n$ でも $\Phi$ で、$Z$ に分布収束する
          - 奇数の $n$ では $|X_n-Z|=2|Z|$ で、$P(2|Z|>\varepsilon)$ は 0 に近づかない（たとえば $\varepsilon=1$ で約 0.62）

          **答え** 分布収束するが、確率収束しない

          **間違えやすい点** 概収束 ⇒ 確率収束 ⇒ 分布収束 の順に弱くなる。逆向きは一般には成り立たないが、極限が定数のときは分布収束と確率収束は同値になる。
      - id: s30p04b
        chapter: 8
        terms: [fisher-information, likelihood-function, negative-binomial-distribution]
        topic: 決めた回数のシュートの成功数（二項分布）と決めた成功数までのシュート数（負の二項分布）の成功確率についてのフィッシャー情報量を比べ期待される回数が同じなら情報量が等しいことを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          選手のシュートの成功確率 $p$ を推定する 2 つの計画を考える。各シュートは独立とする。

          - 計画 1：シュートを $n=«n»$ 回打ち、成功数 $X$（二項分布）を記録する
          - 計画 2：成功が $r=«r»$ 回になるまで打ち、打った回数 $N$（負の二項分布）を記録する

          $p=«p»$ のとき、それぞれの計画の $p$ についてのフィッシャー情報量の組として正しいものはどれか。
        choices:
          - '計画 1 は «i1»、計画 2 は «w_i2» で、計画 1 の方が情報が多い'
          - '計画 1 は «i1»、計画 2 は «w_i3» で、計画 2 の方が情報が多い'
          - '計画 1 は «w_i1»、計画 2 は «i2»'
          - '計画 2 は打つ回数が事前に決まっていないので、フィッシャー情報量は定義できない'
          - '計画 1 は $\dfrac{n}{p(1-p)}=«i1»$、計画 2 は $\dfrac{r}{p^2(1-p)}=«i2»$ で等しい。計画 2 の打つ回数の期待値 $r/p=«en»$ が計画 1 の $n$ と同じだから'
        answer: 4
        distractors:
          - 負の二項分布の情報量を r/(p(1−p)) とした（p で 1 回割り忘れた）
          - 負の二項分布の情報量を r/(p²(1−p)²) とした
          - 二項分布の情報量を n/p とした
          - 確率変数の分布が決まっていれば、フィッシャー情報量は定義できる
          - 正解
        explanation: |
          **方針** フィッシャー情報量は対数尤度の 2 階微分の期待値の符号を変えたもの。二項分布 $L\propto p^X(1-p)^{n-X}$、負の二項分布 $L\propto p^r(1-p)^{N-r}$ で、どちらも $p$ の関数の形は同じ（尤度の比例部分が同じ）。

          **途中式**
          - 計画 1：$-\dfrac{d^2}{dp^2}\log L=\dfrac{X}{p^2}+\dfrac{n-X}{(1-p)^2}$、$E[X]=np$ より $I_1=\dfrac{n}{p(1-p)}=«i1»$
          - 計画 2：$-\dfrac{d^2}{dp^2}\log L=\dfrac{r}{p^2}+\dfrac{N-r}{(1-p)^2}$、$E[N]=r/p$ より $I_2=\dfrac{r}{p^2}+\dfrac{r(1-p)/p}{(1-p)^2}=\dfrac{r}{p^2(1-p)}=«i2»$

          **答え** どちらも «i1» で等しい

          **間違えやすい点** どちらの計画でも最尤推定値は「成功数 ÷ 打った回数」になる（尤度の形が同じ）。計画 2 の情報量は、打つ回数の期待値 $r/p$ を計画 1 の $n$ に置き換えたものに等しい。
          ただし、$p$ の値によって計画 2 の打つ回数は大きく変わり、$p$ が小さいほど多くの回数が必要になる。
  - id: s30p05
    title: トレーニング効果の評価
    context: |
      新しいトレーニングの効果を評価する。小問ごとに別のデータを扱う。
    items:
      - id: s30p05a
        chapter: 9
        terms: [ci-paired-difference, t-distribution, confidence-interval]
        topic: 同じ10人の選手のトレーニング前後の垂直跳びの差の平均と標準偏差から対応のある差の95%信頼区間の下限を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          10 人の選手の垂直跳び（cm）をトレーニングの前後で測った。「後 − 前」の差の平均は «d»、差の標準偏差は «sd» だった（差は正規分布に従うとする）。
          差の母平均の 95% 信頼区間の下限を求めよ。$t_{0.025}(9)=2.262$ とする。
        answer: «lo»
        tolerance: 0.01
        answer_format: cm の単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 同じ選手を前後で測っているので、差 $d_i$ を 1 つの標本とみて、平均の $t$ 区間を作る。

          **途中式**
          $$«d»-2.262\times\frac{«sd»}{\sqrt{10}}=«d»-2.262\times«se»=«d»-«h»=«lo_s»$$

          **答え** $«lo_s»$ cm（区間は $(«lo_s»,\ «hi»)$ で 0 を含まない）

          **間違えやすい点** 前と後を別々の 2 標本とみなすと、選手ごとの跳躍力の違い（大きなばらつき）が誤差に入り、区間が大きく広がる。
          自由度は差の個数 − 1 = 9 で、20 − 2 ではない。
      - id: s30p05b
        chapter: 10
        terms: [randomized-test, significance-level, poisson-distribution]
        topic: 1試合あたりのファウル数のポアソン平均の片側検定で有意水準をちょうど5%にするために境界の値で確率的に棄却するランダム化検定の確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある選手の 1 試合のファウル数 $X$ は、これまで平均 2 のポアソン分布に従っていた。ファウルが増えたかを、$H_0:\lambda=2$、$H_1:\lambda>2$ で、1 試合の観測から有意水準ちょうど 5% で検定したい。
          $P(X\ge5)=«p5»$、$P(X\ge6)=«p6»$、$P(X=5)=«pm5»$ とする（$\lambda=2$ のとき）。ランダム化検定の棄却の仕方として正しいものはどれか。
        choices:
          - '$X\ge6$ なら棄却し、$X=5$ なら確率 «g» で棄却する'
          - '$X\ge5$ なら必ず棄却する（有意水準は «p5»）'
          - '$X\ge6$ なら棄却し、$X=5$ なら確率 «w_g» で棄却する'
          - '$X\ge6$ なら棄却し、$X=5$ なら確率 0.5 で棄却する'
          - 'ポアソン分布は離散分布なので、有意水準をちょうど 5% にすることはできない'
        answer: 0
        distractors:
          - 正解
          - 有意水準が 5% を超えてしまう
          - 足りない分を P(X=5) ではなく P(X≥5) で割った
          - 確率は (0.05−P(X≥6))/P(X=5) で決まる
          - 境界の値で確率的に棄却すれば、ちょうど 5% にできる
        explanation: |
          **方針** 確率的に棄却しない部分だけでは有意水準が 5% に届かない（$P(X\ge6)=«p6»$）。足りない分を、境界 $X=5$ のときに確率 $\gamma$ で棄却して補う：$P(X\ge6)+\gamma P(X=5)=0.05$。

          **途中式**
          $$\gamma=\frac{0.05-«p6»}{«pm5»}=\frac{«num»}{«pm5»}=«g4»$$

          **答え** $X\ge6$ で棄却、$X=5$ なら確率 «g» で棄却

          **間違えやすい点** $X\ge5$ を棄却域にすると有意水準は «p5» で 5% を超える。ランダム化検定は理論上の最強力検定を作るときに使われるが、同じデータで結論が変わりうるので、実際には $p$ 値を報告することが多い。
  - id: s30p06
    title: スポーツ障害の発生
    context: |
      スポーツ障害の起こり方を、競技や練習量で比べる。小問ごとに別のデータを扱う。
    items:
      - id: s30p06a
        chapter: 12
        terms: [homogeneity-test, pearson-chi-square-statistic, expected-frequency]
        topic: 3つの競技の部員100人ずつのうち1年間にけがをした人数の割合が等しいかを2×3分割表の一様性のカイ二乗検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの競技の部員をそれぞれ 100 人ずつ選び、1 年間にけがをしたかを調べた。

          | | 陸上 | サッカー | ラグビー |
          |---|---|---|---|
          | けがあり | «a1» | «a2» | «a3» |
          | けがなし | «b1» | «b2» | «b3» |

          けがをする割合が 3 つの競技で等しいかを、有意水準 5% で検定する。自由度 2 の上側 5% 点は 5.99、自由度 5 では 11.07 とする。正しい記述はどれか。
        choices:
          - '$X^2=«X2»$（自由度 5）で 11.07 を下回り、違うとはいえない'
          - '$X^2=«X2»$（自由度 2）で 5.99 を上回り、けがをする割合は競技によって違う'
          - '$X^2=«w_half»$（けがありの行だけで計算）で 5.99 を下回り、違うとはいえない'
          - '$X^2=«X2»$ で 5.99 を上回るので、ラグビーはサッカーよりけがをしやすいことが示された'
          - '各競技の人数を研究者が決めたので、カイ二乗検定は使えない'
        answer: 1
        distractors:
          - 自由度は (2−1)(3−1)=2
          - 正解
          - けがなしの行も含めて足す
          - 全体の検定で有意でも、どの 2 つの競技に差があるかは別に調べる
          - 列の合計を固定した抽出でも、一様性の検定として使える
        explanation: |
          **方針** 各競技の人数（列の合計）を固定して比べる一様性の検定。期待度数は、全体のけがの割合 $«ptot»$ を各競技の 100 人に掛けたもの。

          **途中式**
          - 期待度数：けがあり «e1»、けがなし «e2»（どの競技も同じ）
          - $X^2=\sum\dfrac{(O-E)^2}{E}=«X2»$（自由度 $(2-1)(3-1)=2$）

          **答え** $X^2=«X2»$ で、けがをする割合は競技によって違う

          **間違えやすい点** 計算は独立性の検定と同じだが、行や列の合計を研究者が固定したときは「一様性（割合が等しいか）」の検定として解釈する。
          有意になったあとでどの競技どうしが違うかを調べるときは、多重比較の調整が必要になる。
      - id: s30p06b
        chapter: 13
        terms: [jonckheere-terpstra-test, rank-and-ties, nonparametric-methods-overview]
        topic: 練習量の少ない中くらい多いの3群の筋肉痛の日数で順序のある対立仮説を調べるヨンクヒール・タプストラ統計量を群の組ごとの大小の数から求める
        level: 基本
        definition: false
        type: choice
        question: |
          練習量で 3 群に分けた選手の、1 か月の筋肉痛の日数は次のとおりだった。

          | 群 | 日数 |
          |---|---|
          | 少ない | «g1» |
          | 中くらい | «g2» |
          | 多い | «g3» |

          練習量が多いほど日数が多いという順序のある対立仮説を調べるヨンクヒール・タプストラ統計量 $J$（群の組 (少,中)、(少,多)、(中,多) について、前の群の値 < 後の群の値 となる組の数の合計）の値として正しいものはどれか。
        choices:
          - '$J=«w_one»$（少ない群と多い群の組だけ）'
          - '$J=«w_rev»$（前の群の値 > 後の群の値 の数）'
          - '$J=«J»$'
          - '$J=«w_max»$（組の総数）'
          - '$J=«w_mean»$（帰無仮説のもとでの期待値）'
        answer: 2
        distractors:
          - 3 つの群の組すべてについて足す
          - 大小の向きを逆にした
          - 正解
          - 組の総数 27 は J がとりうる最大値
          - 期待値は (27)/2=13.5 で、観測値ではない
        explanation: |
          **方針** 各群の組について、マン・ホイットニーの $U$（前の群の値 < 後の群の値 となる組の数）を求めて足す。

          **途中式**
          - (少, 中)：«u12»、(少, 多)：«u13»、(中, 多)：«u23»
          - $J=«u12»+«u13»+«u23»=«J»$（最大は $3\times3\times3=27$、帰無仮説のもとの期待値は 13.5）

          **答え** $J=«J»$

          **間違えやすい点** クラスカル・ウォリス検定は「どこかの群が違う」ことを調べるが、ヨンクヒール・タプストラ検定は「順に大きくなる」という順序のある対立仮説に絞るので、その向きの違いを検出しやすい。
  - id: s30p07
    title: 選手の状態の推移
    context: |
      ある選手の状態は、休養中（R）、練習中（T）、故障中（I）の 3 つを、時間とともに連続的に移り変わる。1 日あたりの推移の強さ（推移率）は次のとおりで、連続時間マルコフ連鎖に従うとする。

      | 推移 | R→T | T→R | T→I | I→R |
      |---|---|---|---|---|
      | 推移率（1/日） | «qRT» | «qTR» | «qTI» | «qIR» |

      ほかの推移は起こらない。
    items:
      - id: s30p07a
        chapter: 14
        terms: [continuous-time-markov-chain, stationary-distribution, limiting-distribution]
        topic: 休養と練習と故障の3状態の連続時間マルコフ連鎖で生成行列と定常分布の方程式を解き長い期間のうち故障中である時間の割合を求める
        level: 標準
        definition: false
        type: choice
        question: |
          長い期間で見たとき、この選手が故障中である時間の割合として正しいものはどれか。
        choices:
          - '$«w_uni»$'
          - '$«piI»$'
          - '$«w_rate»$'
          - '$«piT»$'
          - '$«w_jump»$'
        answer: 1
        distractors:
          - 3 つの状態に同じ時間いるとした
          - 正解
          - 推移率の比だけで割合を決めた
          - 練習中の割合を答えた
          - 推移の回数の割合（埋め込まれた連鎖の定常分布）を時間の割合と取り違えた
        explanation: |
          **方針** 定常分布 $\pi$ は $\pi Q=0$、$\sum\pi_i=1$ を満たす（$Q$ は生成行列で、対角成分は出ていく推移率の和の符号を変えたもの）。各状態について「出ていく流れ = 入ってくる流れ」を書くと解きやすい。

          **途中式**
          - R：$«qRT»\pi_R=«qTR»\pi_T+«qIR»\pi_I$
          - I：$«qIR»\pi_I=«qTI»\pi_T$ より $\pi_I=\pi_T/6$
          - R の式に代入：$0.5\pi_R=0.3\pi_T+0.1\pi_T=0.4\pi_T$ より $\pi_R=0.8\pi_T$
          - $\pi_T(0.8+1+1/6)=1$ より $\pi_T=«piT»$、$\pi_I=«piI»$、$\pi_R=«piR»$

          **答え** $«piI»$

          **間違えやすい点** 連続時間の連鎖では、状態にとどまる時間（平均 $1/$出ていく推移率の和）も考える必要がある。推移の回数だけを数える埋め込まれた連鎖の定常分布とは違う。
  - id: s30p08
    title: 記録の回帰分析
    context: |
      選手の記録を回帰分析で調べる。小問ごとに別のデータを扱う。
    items:
      - id: s30p08a
        chapter: 16
        terms: [overall-f-test-regression, sum-of-squares-decomposition, multiple-regression-model]
        topic: 3つの体力指標で記録を説明する重回帰の分散分析表の平方和から回帰全体のF統計量を求め有意性を判定する
        level: 基本
        definition: false
        type: choice
        question: |
          «n» 人の選手の 100 m 走の記録を、3 つの体力指標で説明する重回帰（切片あり）を当てはめた。回帰の平方和は «ssr»、残差の平方和は «sse» だった。
          「3 つの係数がすべて 0」を帰無仮説とする $F$ 検定の統計量と判定の組として正しいものはどれか。$F_{0.05}(3,26)=2.98$ とする。
        choices:
          - '$F=«w_F»$ で 2.98 を上回り、回帰は有意である'
          - '$F=«w_F2»$ で 2.98 を下回り、回帰は有意でない'
          - '$F=«F»$ で 2.98 を上回るので、3 つの係数はどれも 0 でない'
          - '$F=«F»$ で 2.98 を上回り、回帰は有意である'
          - '決定係数が 0.5 を下回るので、回帰は有意でない'
        answer: 3
        distractors:
          - 平均平方ではなく平方和の比をとった
          - 残差の自由度を n−1 とした
          - 回帰全体が有意でも、個々の係数がすべて 0 でないとは限らない
          - 正解
          - 決定係数の大きさだけでは有意性は決まらない
        explanation: |
          **方針** $F=\dfrac{\text{回帰の平方和}/p}{\text{残差の平方和}/(n-p-1)}$（$p=3$）。

          **途中式**
          $$F=\frac{«ssr»/3}{«sse»/26}=\frac{«msr»}{«mse»}=«F»$$
          決定係数は $«ssr»/(«ssr»+«sse»)=«r2»$。

          **答え** $F=«F»$ で有意

          **間違えやすい点** 回帰全体の $F$ 検定は「少なくとも 1 つの係数が 0 でない」かを調べる。どの係数が効いているかは、個々の $t$ 検定で調べる。
          決定係数が小さくても、標本が大きければ回帰全体は有意になりうる。
      - id: s30p08b
        chapter: 16
        terms: [coefficient-of-determination, least-squares-method, sum-of-squares-decomposition]
        topic: 原点を通る回帰で原点まわりの平方和を分母にした決定係数が平均まわりの決定係数よりずっと大きく出ることを平方和から確かめる
        level: 標準
        definition: false
        type: numeric
        question: |
          別の分析で、トレーニング時間 $x$ と消費エネルギー $y$ の «m» 組のデータに、原点を通る回帰 $y=\beta x+\varepsilon$ を当てはめた。$\sum y_i^2=«sy2»$、$\bar y=«yb»$、残差平方和は «rss» だった。
          原点を通る回帰でソフトウェアがよく表示する決定係数 $R_0^2=1-\dfrac{\text{残差平方和}}{\sum y_i^2}$ の値を求めよ。
        answer: «r0»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 原点を通る回帰では、平方和の分解が原点まわり（$\sum y_i^2$）で成り立つので、ソフトウェアは $\sum y_i^2$ を分母にした決定係数を表示することが多い。

          **途中式**
          - $R_0^2=1-«rss»/«sy2»=«r0_s»$
          - 平均まわりの平方和 $\sum(y_i-\bar y)^2=«sy2»-«m»\times«yb»^2=«syy»$ を使うと $1-«rss»/«syy»=«rc»$

          **答え** $«r0_s»$

          **間違えやすい点** $R_0^2$ は $y$ の平均が 0 から離れているだけで大きくなり、切片のあるモデルの決定係数（平均まわり）とは比べられない。原点を通るモデルを使うときは、理論的に原点を通る根拠があるか、残差を確かめる。
  - id: s30p09
    title: 運動量の回帰モデル
    context: |
      フィットネスクラブの会員の運動量を、一般化線形モデルなどで分析する。小問ごとに別のモデルを扱う。
    items:
      - id: s30p09a
        chapter: 18
        terms: [tobit-model, censored-data, normal-distribution]
        topic: 運動しない会員の運動時間が0に集まるトービットモデルで年齢の係数から運動時間の期待値への限界効果が係数に正の値をとる確率を掛けたものになることを求める
        level: 応用
        definition: false
        type: choice
        question: |
          週の運動時間 $y$（時間）は、潜在変数 $y^*=\boldsymbol x^\top\boldsymbol\beta+\varepsilon$（$\varepsilon\sim N(0,\sigma^2)$）を使って $y=\max(0,\ y^*)$ と表されるとする（トービットモデル）。
          ある会員の属性で $\boldsymbol x^\top\boldsymbol\beta=«xb»$、$\sigma=«s»$、ある説明変数（週の自由時間）の係数は «b» だった。この説明変数が 1 増えたときの、観測される運動時間の期待値 $E[y\mid\boldsymbol x]$ の変化（限界効果）として正しいものはどれか。$\Phi(0.5)=0.6915$ とする。
        choices:
          - '«b»（係数そのもの）'
          - '«w_phi»（係数に密度 $\phi(0.5)$ を掛けた値）'
          - '«me»（係数 «b» に、運動時間が正になる確率 $\Phi(«xb»/«s»)=0.6915$ を掛けた値）'
          - '«w_half»（係数に、0 に打ち切られる確率を掛けた値）'
          - '«w_sig»（係数を $\sigma$ で割った値）'
        answer: 2
        distractors:
          - 係数は潜在変数 y* への効果で、0 で打ち切られた y への効果ではない
          - 掛けるのは密度ではなく分布関数
          - 正解
          - 正になる確率ではなく、0 に打ち切られる確率 1−Φ(0.5) を掛けた
          - σ で割るのはプロビットの係数への換算
        explanation: |
          **方針** トービットモデルでは $E[y\mid\boldsymbol x]=\Phi(z)\,\boldsymbol x^\top\boldsymbol\beta+\sigma\phi(z)$（$z=\boldsymbol x^\top\boldsymbol\beta/\sigma$）。これを $x_j$ で微分すると、$\phi$ の項が打ち消し合って $\beta_j\Phi(z)$ が残る。

          **途中式** $z=«xb»/«s»=0.5$、$\partial E[y]/\partial x_j=«b»\times0.6915=«me4»$

          **答え** «me»

          **間違えやすい点** 係数 «b» は潜在変数 $y^*$ への効果で、観測される運動時間への効果は、0 に打ち切られる会員がいる分だけ小さくなる。運動している会員だけで最小二乗法を当てはめると、選択の偏りで係数を過小評価する。
      - id: s30p09b
        chapter: 18
        terms: [poisson-regression, interaction-term, offset-term]
        topic: 来館回数のポアソン回帰でパーソナル指導と朝の時間帯の主効果と交互作用の係数から両方を利用する会員の来館率の比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          会員の月の来館回数を、パーソナル指導の利用 $x_1$（1/0）と朝の時間帯の利用 $x_2$（1/0）で説明するポアソン回帰（対数リンク）
          $$\log\mu=\beta_0+«b1»x_1+«b2»x_2«b12s»x_1x_2$$
          を当てはめた。両方を利用する会員（$x_1=x_2=1$）の来館率は、どちらも利用しない会員の何倍か。必要なら $e^{0.5}=1.6487$ を使え。
        answer: «rr»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 対数リンクでは、係数の和の指数が率の比になる。両方を利用する会員では、2 つの主効果と交互作用の係数がすべて加わる。

          **途中式** $\exp(«b1»+«b2»«b12s»)=\exp(0.5)=«rr4»$

          **答え** $«rr_s»$ 倍

          **間違えやすい点** 主効果だけを足すと $e^{0.7}=2.01$ 倍になるが、交互作用（−0.2）がある。交互作用の係数が負なのは、2 つを一緒に利用したときの効果が、それぞれの効果の積より小さいことを表す。
  - id: s30p10
    title: 練習法の実験と会員調査
    context: |
      練習法の比較実験と、会員の調査を計画する。小問ごとに別の問題を扱う。
    items:
      - id: s30p10a
        chapter: 20
        terms: [split-plot-design, fixed-and-random-effects, two-way-anova-with-replication]
        topic: 分割区法で施設単位に割り付けた練習方式と施設内で割り付けた補助具の実験で補助具の効果と交互作用を2次誤差で割ってF値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          4 つの地域（ブロック）それぞれで、3 つの施設に 3 種類の練習方式 A を 1 つずつ割り付け（主区）、各施設の中で 2 種類の補助具 B を割り付けた（細区）。分散分析表は次のとおり。

          | 要因 | 平方和 | 自由度 |
          |---|---|---|
          | ブロック | «SBk» | 3 |
          | A | «SA» | 2 |
          | 1 次誤差（ブロック × A） | «SE1» | 6 |
          | B | «SB» | 1 |
          | A×B | «SAB» | 2 |
          | 2 次誤差 | «SE2» | 9 |

          補助具 B の効果の $F$ 値として正しいものはどれか。
        choices:
          - '$F=«w_FB1»$（1 次誤差の平均平方で割る）'
          - '$F=«w_pool»$（2 つの誤差をまとめた平均平方で割る）'
          - '$F=«FA»$（A の平均平方を 1 次誤差で割った値と同じ）'
          - '$F=«FB»$（B の平均平方を 2 次誤差の平均平方で割る）'
          - '$F=«w_ss»$（平方和の比）'
        answer: 3
        distractors:
          - 1 次誤差は主区の因子（A）の検定に使う
          - 誤差の大きさが違うので、2 つの誤差はまとめない
          - これは A の F 値
          - 正解
          - 平均平方（平方和 ÷ 自由度）の比をとる
        explanation: |
          **方針** 分割区法には誤差が 2 つある。主区（施設）単位で割り付けた A は 1 次誤差で、施設の中で割り付けた B と A×B は 2 次誤差で検定する。

          **途中式**
          - 2 次誤差の平均平方 $«SE2»/9=«ms2»$
          - $F_B=«SB»/«ms2»=«FB»$、$F_{A\times B}=(«SAB»/2)/«ms2»=«FAB»$
          - 参考：$F_A=(«SA»/2)/(«SE1»/6)=«FA»$

          **答え** $F=«FB»$

          **間違えやすい点** 施設の中の比較（B）は施設間のばらつきを含まないので精度が高く、施設単位の比較（A）は精度が低い。A を 2 次誤差で割ると、A の効果を過大に評価してしまう。
      - id: s30p10b
        chapter: 21
        terms: [stratified-sampling, proportional-allocation, simple-random-sampling]
        topic: 会員を利用頻度で3層に分けた層別抽出で層ごとの平均満足度と層の割合から全体の平均満足度を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          会員を利用頻度で 3 層に分け、層ごとに単純無作為抽出で満足度（100 点満点）を調べた。

          | 層 | 会員数の割合 $W_h$ | 標本の平均 $\bar y_h$ |
          |---|---|---|
          | 月 1 回以下 | «W1» | «y1» |
          | 月 2〜7 回 | «W2» | «y2» |
          | 月 8 回以上 | «W3» | «y3» |

          全体の平均満足度の層別推定値を求めよ。
        answer: «ans»
        tolerance: 0.05
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.05 の差まで正解とする。
        explanation: |
          **方針** 層別推定量は $\bar y_{\rm st}=\sum W_h\bar y_h$。

          **途中式** $«W1»\times«y1»+«W2»\times«y2»+«W3»\times«y3»=«t1»+«t2»+«t3»=«ans_s»$

          **答え** $«ans_s»$ 点

          **間違えやすい点** 3 つの層の平均を単純に平均すると «w_simple» 点になり、会員の少ない月 8 回以上の層を重く見すぎる。比例配分で抽出した標本なら、標本全体の平均が層別推定値と一致する（自己加重）。
  - id: s30p11
    title: 選手の分類と体力測定の因子
    context: |
      選手のデータを多変量解析で分析する。小問ごとに別のデータを扱う。
    items:
      - id: s30p11a
        chapter: 23
        terms: [precision-recall-f-measure, confusion-matrix, sensitivity-and-specificity]
        topic: 感度と偽陽性率が同じけがの予測モデルでもけがをする選手の割合が10%から1%に下がると適合率が大きく下がることを求める
        level: 標準
        definition: false
        type: choice
        question: |
          けがの危険が高い選手を見つける予測モデルの感度（再現率）は «tpr»、偽陽性率は «fpr» である。けがをする選手の割合が 10% のチームと 1% のチームで、このモデルの適合率（陽性と判定した選手のうち実際にけがをする割合）の組として正しいものはどれか。
        choices:
          - 'どちらのチームでも «tpr»（感度と同じ）'
          - '10% のチームで «pr10»、1% のチームで «pr1»'
          - '10% のチームで «pr10»、1% のチームでも «pr10»（感度と偽陽性率が同じなので）'
          - '10% のチームで «w10»、1% のチームで «w1»'
          - 'どちらのチームでも «w_spec»（特異度と同じ）'
        answer: 1
        distractors:
          - 適合率は感度とは別の量
          - 正解
          - 適合率は割合（有病率）によって変わる
          - 偽陽性の数に (1−割合) を掛け忘れた
          - 特異度は陰性の選手の中での割合
        explanation: |
          **方針** 適合率 $=\dfrac{\text{割合}\times\text{感度}}{\text{割合}\times\text{感度}+(1-\text{割合})\times\text{偽陽性率}}$。

          **途中式**
          - 10%：$\dfrac{0.1\times«tpr»}{0.1\times«tpr»+0.9\times«fpr»}=\dfrac{0.09}{0.135}=«pr10»$
          - 1%：$\dfrac{0.01\times«tpr»}{0.01\times«tpr»+0.99\times«fpr»}=\dfrac{0.009}{0.0585}=«pr1»$

          **答え** 10% で «pr10»、1% で «pr1»

          **間違えやすい点** ROC 曲線（感度と偽陽性率）は割合によらないが、適合率は割合に強く依存する。まれな事象では、適合率と再現率の曲線（PR 曲線）で性能を見ることが多い。
      - id: s30p11b
        chapter: 24
        terms: [dendrogram, hierarchical-clustering, number-of-clusters]
        topic: 6人の選手の階層的クラスタリングの併合の高さの列からデンドログラムを高さ3で切ったときのクラスターの数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          6 人の選手を階層的クラスタリングで分類したところ、2 つのクラスターが併合された高さ（距離）は、併合の順に «hs» だった。
          デンドログラムを高さ «cut» で横に切ったときのクラスターの数を求めよ。
        answer: «k»
        tolerance: 0.5
        answer_format: 整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 6 人から始めて、1 回併合するごとにクラスターは 1 つ減る。高さ «cut» より低い併合だけが行われた状態のクラスターの数を数える。

          **途中式** «cut» より低い併合は «below» の «nb» 回なので、$6-«nb»=«k»$。

          **答え** $«k»$ 個

          **間違えやすい点** 併合の回数は 6 − 1 = 5 回で、すべて併合すると 1 つになる。切る高さを、併合の高さが大きく跳ぶところ（ここでは 2.2 と 4.0 の間）に置くと、まとまりのよいクラスターが得られることが多い。
      - id: s30p11c
        chapter: 25
        terms: [promax-rotation, factor-loading, communality]
        topic: 斜交回転後の因子パターンと因子間相関から因子構造（変数と因子の相関）を求めパターンとの違いを読む
        level: 応用
        definition: false
        type: choice
        question: |
          4 つの体力測定（50 m 走・立ち幅跳び・長座体前屈・上体起こし）の標準化した値に 2 因子モデルを当てはめ、プロマックス回転（斜交回転）をした。因子パターン（各因子の偏回帰係数）は次のとおりで、因子間の相関は «phi» である。

          | 測定 | 第 1 因子 | 第 2 因子 |
          |---|---|---|
          | 50 m 走 | 0.8 | 0.0 |
          | 立ち幅跳び | 0.7 | 0.1 |
          | 長座体前屈 | 0.1 | 0.7 |
          | 上体起こし | 0.0 | 0.8 |

          立ち幅跳びと第 2 因子の相関（因子構造の成分）と、立ち幅跳びの共通性の組として正しいものはどれか。
        choices:
          - '相関 «s22»、共通性 «h2»'
          - '相関 0.1（パターンと同じ）、共通性 «w_h2»'
          - '相関 «s22»、共通性 «w_h2»'
          - '相関 0.1、共通性 «h2»'
          - '相関 «w_s»、共通性 «h2»'
        answer: 0
        distractors:
          - 正解
          - 斜交回転では、パターン（偏回帰係数）と構造（相関）は違う
          - 共通性に因子間の相関の項を入れ忘れた（直交のときの式）
          - 構造はパターンに因子間相関の行列を掛けたもの
          - 因子間相関を掛ける成分を取り違えた
        explanation: |
          **方針** 因子構造（変数と因子の相関）は、パターン $P$ に因子間相関の行列 $\Phi$ を掛けた $P\Phi$。共通性は $P\Phi P^\top$ の対角成分。

          **途中式**
          - 立ち幅跳びと第 2 因子の相関：$0.7\times«phi»+0.1\times1=«s22»$
          - 共通性：$0.7^2+0.1^2+2\times0.7\times0.1\times«phi»=0.49+0.01+«cross»=«h2»$

          **答え** 相関 «s22»、共通性 «h2»

          **間違えやすい点** 直交回転ではパターンと構造が一致し、共通性は負荷量の 2 乗和になる。斜交回転では、立ち幅跳びは第 2 因子に直接はほとんど効かない（パターン 0.1）が、第 1 因子を通して第 2 因子と相関する（構造 «s22»）。
          解釈はふつうパターンで行い、構造もあわせて報告する。
  - id: s30p12
    title: 体重の記録と会員の継続
    context: |
      フィットネスクラブの会員の記録を分析する。小問ごとに別のデータを扱う。
    items:
      - id: s30p12a
        chapter: 27
        terms: [state-space-model, forecasting, seasonal-adjustment]
        topic: 毎朝の体重を真の体重のランダムウォークに測定誤差が加わる局所水準モデルとみてカルマンフィルタの定常状態の利得を求め指数平滑法の平滑化定数と対応づける
        level: 標準
        definition: false
        type: choice
        question: |
          毎朝の体重の測定値 $y_t$ を、真の体重 $\mu_t$ に測定誤差が加わった局所水準モデル
          $$y_t=\mu_t+\varepsilon_t,\quad\varepsilon_t\sim N(0,\ «se2»),\qquad \mu_t=\mu_{t-1}+\eta_t,\quad\eta_t\sim N(0,\ «sh2»)$$
          で表す。カルマンフィルタを長く続けると、更新式 $\hat\mu_t=\hat\mu_{t-1}+K(y_t-\hat\mu_{t-1})$ の利得 $K$ は一定の値に近づく。予測の誤差分散（$\sigma_\varepsilon^2$ を単位）$P$ は $P=\dfrac{P}{P+1}+q$（$q=\sigma_\eta^2/\sigma_\varepsilon^2$）を満たし、$K=P/(P+1)$ である。$K$ の値と解釈の組として正しいものはどれか。
        choices:
          - '$K=«K»$。平滑化定数 «K» の単純指数平滑法と同じ予測になる'
          - '$K=«w_q»$。$q$ そのものが利得になる'
          - '$K=1$。最新の測定値をそのまま真の体重の推定値にする'
          - '$K=«K»$。ただし、カルマンフィルタと指数平滑法は無関係である'
          - '$K=«w_P»$（予測の誤差分散 $P$ そのもの）'
        answer: 0
        distractors:
          - 正解
          - q と K は別の量（K は P/(P+1)）
          - 測定誤差があるので、最新の値だけに頼らない（K<1）
          - 局所水準モデルの定常なカルマンフィルタは単純指数平滑法と一致する
          - 利得は P/(P+1)
        explanation: |
          **方針** 定常状態では $P$ が一定になる。$P=\dfrac{P}{P+1}+q$ を整理すると $P^2-qP-q=0$。

          **途中式** $q=«sh2»/«se2»=«q»$。$P^2-«q»P-«q»=0$ より $P=\dfrac{«q»+\sqrt{«q»^2+4\times«q»}}{2}=«P»$、$K=\dfrac{«P»}{«P»+1}=«K»$

          **答え** $K=«K»$（平滑化定数 «K» の指数平滑法と同じ）

          **間違えやすい点** 測定誤差に比べて真の体重の変化が大きい（$q$ が大きい）ほど、$K$ は 1 に近づき、最新の測定値を重く見る。$q$ が小さいほど、過去の値を長く平均する。
      - id: s30p12b
        chapter: 29
        terms: [truncated-data, kaplan-meier-estimator, censored-data]
        topic: 調査開始時にすでに在籍していた会員を含む継続期間のデータで遅れて観察に入る会員をリスク集合に加える時点に注意してカプラン・マイヤー推定値を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          会員 6 人の在籍期間（入会からの月数）を調べた。調査開始時にすでに在籍していた会員は、その時点の在籍月数から観察を始めた（左側切断、遅れて観察に入る）。

          | 会員 | ア | イ | ウ | エ | オ | カ |
          |---|---|---|---|---|---|---|
          | 観察開始（月） | 0 | 0 | 2 | 4 | 0 | 5 |
          | 観察終了（月） | 3 | 8 | 5 | 6 | 10 | 9 |
          | 終了の理由 | 退会 | 打ち切り | 退会 | 退会 | 打ち切り | 退会 |

          時点 $t$ のリスク集合を「観察開始 $<t\le$ 観察終了」の会員として、9 か月の継続率のカプラン・マイヤー推定値 $\hat S(9)$ を求めよ。
        answer: «S9»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 退会が起きた時点ごとに、その時点で観察中の会員の数（リスク集合）$n$ と退会数 $d$ を数え、$1-d/n$ を掛けていく。観察開始前の会員はリスク集合に入れない。

          **途中式**
          - $t=3$：ア・イ・ウ・オの 4 人（エとカはまだ観察前）、退会 1 → $3/4$
          - $t=5$：イ・ウ・エ・オの 4 人（カは 5 か月から観察なので入らない）、退会 1 → $3/4$
          - $t=6$：イ・エ・オ・カの 4 人、退会 1 → $3/4$
          - $t=9$：オ・カの 2 人（イは 8 か月で打ち切り）、退会 1 → $1/2$
          - $\hat S(9)=(3/4)^3\times1/2=«S9_4»$

          **答え** $«S9_s»$

          **間違えやすい点** 遅れて観察に入った会員を最初からリスク集合に入れると、「その時点までは退会しないことが分かっている会員」で分母を水増しし、継続率を過大に見積もる（この場合 «w_naive»）。
          左側切断（観察に入るまでに退会した人はそもそも含まれない）と、右側打ち切り（観察の終わりに退会していない）を区別する。
  - id: s30p13
    title: 予測モデルとシミュレーション
    context: |
      会員の退会を予測するモデルの評価と、ベイズ推定の計算方法を検討する。小問ごとに別の問題を扱う。
    items:
      - id: s30p13a
        chapter: 30
        terms: [cross-validation, model-selection, training-test-split]
        topic: 99人のデータを5つに分けた交差検証で各分割の誤差を人数で重み付けして平均し2つのモデルを比べる
        level: 標準
        definition: false
        type: choice
        question: |
          99 人のデータを 5 つの分割（20, 20, 20, 20, 19 人）に分け、5 分割交差検証で 2 つのモデル A・B の予測の平均二乗誤差を求めた。各分割を検証用にしたときの平均二乗誤差は次のとおり。

          | 分割 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | モデル A | «a» |
          | モデル B | «b» |

          交差検証による予測誤差の推定値（全員についての平均）と、選ぶモデルの組として正しいものはどれか。モデル A の学習データでの平均二乗誤差は 3.2、B は 3.6 だった。
        choices:
          - '学習データでの誤差が小さい A を選ぶ'
          - 'A は «cva»、B は «cvb» で、分割ごとのばらつきが小さい A を選ぶ'
          - 'A は «w_a»、B は «w_b»（最も小さい分割の値）で、最小値の小さい B を選ぶ'
          - 'A は «cva»、B は «cvb» で、交差検証の誤差が小さい B を選ぶ'
          - '分割によって誤差の大小が入れ替わるので、交差検証では比べられない'
        answer: 3
        distractors:
          - 学習データでの誤差は複雑なモデルほど小さくなり、予測の良さを表さない
          - 平均の予測誤差で比べる
          - 最小の分割だけを見ると楽観的になる
          - 正解
          - 分割ごとのばらつきがあっても、平均で比べる
        explanation: |
          **方針** 交差検証の推定値は、各分割の誤差を人数で重み付けした平均（全員の予測誤差の平均）。

          **途中式**
          - A：$(20\times(«a_sum4»)+19\times«a5»)/99=«cva4»$
          - B：$(20\times(«b_sum4»)+19\times«b5»)/99=«cvb4»$

          **答え** A «cva»、B «cvb» で B を選ぶ

          **間違えやすい点** 学習データの誤差は、モデルが複雑なほど小さくなる（過学習）。交差検証では、各データを学習に使わなかったモデルで予測するので、新しいデータへの予測の良さを推定できる。
          分割の人数がほぼ等しいときは、単純な平均（A «sa»、B «sb»）とほとんど変わらない。
      - id: s30p13b
        chapter: 32
        terms: [burn-in-convergence, mcmc, metropolis-hastings]
        topic: 初期値から事後分布の範囲に移るまでの最初の反復を捨てるバーンインの考え方でMCMCの出力から事後平均の推定値を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          会員の平均退会率についての事後分布から、メトロポリス・ヘイスティングス法で 2000 回の標本を作った。初期値を事後分布からかなり離れた値にしたため、トレースプロット（反復回数に対する値のグラフ）は最初の約 200 回で大きく下がり、その後は一定の範囲で上下していた。
          2000 回すべての平均は «m_all»、最初の 200 回を除いた 1800 回の平均は «m_post» だった。事後平均の推定値と、その理由の組として最も適切なものはどれか。
        choices:
          - '«m_all»。標本の数が多いほど推定は正確なので、すべて使う'
          - '«m_post»。最初の 200 回は初期値の影響が残っている（定常分布に達していない）ので、バーンインとして捨てる'
          - '«m_post»。最初の 200 回は乱数の質が悪いので捨てる'
          - '«m_all»。MCMC の標本は互いに独立なので、どの部分を使っても同じ'
          - '«w_mid»（2 つの平均の平均）'
        answer: 1
        distractors:
          - 定常分布に達していない部分を含めると偏る
          - 正解
          - 捨てる理由は乱数の質ではなく、初期値の影響
          - MCMC の標本は自己相関をもち、独立ではない
          - 根拠のない平均
        explanation: |
          **方針** MCMC は、十分な反復のあとで目標の分布（事後分布）からの標本とみなせる。初期値の影響が残る最初の部分（バーンイン）は推定から除く。

          **途中式** トレースプロットで値が落ち着くまでの約 200 回を捨て、残りの 1800 回の平均 «m_post» を事後平均の推定値にする。

          **答え** «m_post»

          **間違えやすい点** バーンインの長さは、トレースプロットや、初期値を変えた複数の連鎖が同じ範囲に収まるか（収束診断）で判断する。標本は自己相関をもつので、1800 個の独立な標本と同じ精度ではない（有効標本サイズは小さい）。
