        choices:
          - "$«o_ign»$"
          - "$«o_ev»$"
          - "$«o_ok»$"
          - "$«o_surv»$"
          - "$«o_s4»$"
        answer: 2
        distractors:
          - 打ち切りのデータを捨て、復旧した 7 件だけで割合を求めた
          - 打ち切りを復旧とみなして、10 件中 6 時間を超えた件数の割合を求めた
          - 正解
          - 打ち切りをすべて 6 時間を超えても未復旧とみなした
          - 時刻 6 での復旧を反映する前の値 S(4) を答えた
        explanation: |
          **方針** 復旧が起きた時刻 $t_j$ ごとに、そのときのリスク集合の大きさ $n_j$ と復旧数 $d_j$ から $(1-d_j/n_j)$ を掛けていく。打ち切りは、その時刻以降のリスク集合から外れるだけ。

          **途中式**

          | 時刻 | リスク集合 $n_j$ | 復旧 $d_j$ | $\hat S(t)$ |
          |---|---|---|---|
          | 1 | «n1» | «d1» | «S1» |
          | 2 | «n2» | «d2» | $«S1»\times8/9=«S2»$ |
          | 3 | «n3» | «d3» | $«S2»\times6/7=«S3»$ |
          | 4 | «n4» | «d4» | $«S3»\times4/6=«S4»$ |
          | 6 | «n6» | «d6» | $«S4»\times2/3=«S6»$ |

          時刻 3 のリスク集合は、1・2・$2^{+}$ の 3 件を除いた 7 件。時刻 6 では、$5^{+}$ も外れて 6・$8^{+}$・9 の 3 件になる。

          **答え** $«o_ok»$

          **間違えやすい点** 打ち切りを捨てると（$1/7=«o_ign»$）、長くかかりそうなインシデントを除くことになり、復旧の遅れを過小評価する。
          打ち切りを復旧とみなす（$«o_ev»$）のも、全部未復旧とみなす（$«o_surv»$）のも誤り。カプラン・マイヤー法は、打ち切りまでは「復旧していない」という情報だけを使う。

  - id: s08p13
    title: 負荷試験ツールの乱数
    context: |
      Web サーバの負荷試験ツールを作っている。ツールは一様乱数 $U\sim U(0,1)$ をもとに、リクエストの内容と送信のタイミングを作る。
    items:
      - id: s08p13a
        chapter: 32
        terms: [inverse-transform-sampling, uniform-random-number]
        topic: パレート分布に従うファイルサイズを逆関数法で生成するとき一様乱数に対応する値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ダウンロードされるファイルの大きさ $X$（KB）を、分布関数
          $$F(x)=1-\left(\frac{«xm»}{x}\right)^{«a»}\quad(x\ge«xm»)$$
          のパレート分布から、逆関数法 $X=F^{-1}(U)$ で発生させる。$U=«u»$ が得られたときの $X$ に最も近い値はどれか。
          必要なら $«qu»^{0.4}=«pp»$、$«qu»^{-0.4}=«pm»$、$«u»^{-0.4}=«pum»$、$«qu»^{-2.5}=«pbig»$ を使え。
        choices:
          - "$«o_p»$"
          - "$«o_u»$"
          - "$«o_mean»$"
          - "$«o_ok»$"
          - "$«o_big»$"
        answer: 3
        distractors:
          - 逆関数を解くときに指数の符号を誤り (1−u)^{1/α} とした（xm より小さい値は出ないはず）
          - F(x)=u を解くときに 1−u と u を取り違えた
          - 乱数に関係なくパレート分布の平均 α xm/(α−1) を答えた
          - 正解
          - 指数を −1/α ではなく −α とした
        explanation: |
          **方針** $F(x)=u$ を $x$ について解く。

          **途中式**
          $$1-\left(\frac{«xm»}{x}\right)^{«a»}=u\iff\left(\frac{«xm»}{x}\right)^{«a»}=1-u\iff x=«xm»\,(1-u)^{-1/«a»}$$
          $u=«u»$ では $1-u=«qu»$、$-1/«a»=-«ainv»$ なので
          $$x=«xm»\times«qu»^{-0.4}=«xm»\times«pm»=«x»$$

          **答え** $«o_ok»$

          **間違えやすい点** $1-u$ と $u$ を取り違えると $«o_u»$（$U$ と $1-U$ は同じ分布なので乱数としては使えるが、「$U=«u»$ に対応する値」としては誤り）。
          指数を $1/«a»$ にすると $«o_p»$ となり、台 $x\ge«xm»$ の外に出てしまう。

      - id: s08p13b
        chapter: 8
        terms: [order-statistics, method-of-moments, unbiased-estimator, efficient-estimator]
        topic: 一様分布の上端のモーメント推定量と最大値に基づく不偏推定量の分散の比を求める
        level: 応用
        definition: false
        type: choice
        question: |
          ツールは、各リクエストの送信を $U(0,\theta)$ に従う時間だけランダムに遅らせる。設定値 $\theta$ が記録から消えたため、観測した «n» 個の遅延 $X_1,\ldots,X_{«n»}$（独立）から $\theta$ を推定する。
          モーメント法による $T_1=2\bar X$ と、最大値 $X_{(«n»)}$ を使った不偏推定量 $T_2=\dfrac{«n1»}{«n»}X_{(«n»)}$ はどちらも不偏である。
          $V[T_2]/V[T_1]$ に最も近い値はどれか。
        choices:
          - "$«b_raw»$"
          - "$«b_ok»$"
          - "$«b_mse»$"
          - "$«b_one»$"
          - "$«b_inv»$"
        answer: 1
        distractors:
          - 係数 (n+1)/n を掛ける前の X(n) の分散で比べた
          - 正解
          - T2 の代わりに最尤推定量 X(n) の平均二乗誤差で比べた
          - どちらも不偏なので分散も等しいと考えた
          - 比の向きを逆にした
        explanation: |
          **方針** $V[T_1]=4V[\bar X]=4\cdot\dfrac{\theta^2}{12n}$。最大値 $Y=X_{(n)}$ は密度 $ny^{n-1}/\theta^n$（$0<y<\theta$）をもつので、$E[Y]$ と $E[Y^2]$ を積分で求める。

          **途中式**
          $$V[T_1]=\frac{4}{n}\cdot\frac{\theta^2}{12}=\frac{\theta^2}{3n}=«vmom»$$
          $$E[Y]=\frac{n}{n+1}\theta,\quad E[Y^2]=\frac{n}{n+2}\theta^2,\quad V[Y]=\frac{n\theta^2}{(n+1)^2(n+2)}$$
          $$V[T_2]=\left(\frac{n+1}{n}\right)^2V[Y]=\frac{\theta^2}{n(n+2)}=«vmax»$$
          $$\frac{V[T_2]}{V[T_1]}=\frac{3n}{n(n+2)}=\frac{3}{n+2}=«ratio_f»=«ratio»$$

          **答え** $«b_ok»$

          **間違えやすい点** 同じ不偏推定量でも分散は大きく違う。$T_2$ の分散は $1/n^2$ の速さで小さくなり、$1/n$ の $T_1$ よりずっと速い（台の端が母数に依存する分布では、クラメール・ラオの下限の前提が成り立たない）。
          係数を掛ける前の $X_{(n)}$ は偏りがあるので、分散だけで比べるのは不適切（比は $«b_raw»$）。最尤推定量 $X_{(n)}$ の平均二乗誤差 $2\theta^2/\{(n+1)(n+2)\}$ で比べると $«b_mse»$。

  - id: s08p14
    title: プッシュ通知の購入への効果
    context: |
      あるアプリで、プッシュ通知を送るか（$X=1$／$X=0$）、24 時間以内にアプリを開いたか（$M=1$／$M=0$）、購入したか（$Y=1$／$Y=0$）の大量の観察データがある。
      通知の送り先は過去の利用頻度などをもとに担当者が決めており、利用意欲 $U$（観測されない）が $X$ と $Y$ の両方に影響している可能性がある。
      一方、次の仮定は妥当と考えられる：(i) 通知は「アプリを開く」ことを通じてのみ購入に影響する、(ii) $U$ は $M$ に直接は影響しない（$X\to M$ には交絡がない）、(iii) $M\to Y$ の交絡は $X$ を与えればふさがれる。
      観察データから次の確率が得られた。

      $P(X=1)=«px»$、$P(M=1\mid X=1)=«pm1»$、$P(M=1\mid X=0)=«pm0»$

      | $P(Y=1\mid X,M)$ | $M=1$ | $M=0$ |
      |---|---|---|
      | $X=1$ | «y11» | «y10» |
      | $X=0$ | «y01» | «y00» |
    items:
      - id: s08p14a
        chapter: 33
        terms: [frontdoor-criterion, causal-effect, backdoor-criterion]
        topic: 観測されない交絡があるプッシュ通知の購入への平均因果効果をアプリ起動を媒介にしたフロントドア調整で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          フロントドア基準による調整で、平均因果効果 $P(Y=1\mid do(X=1))-P(Y=1\mid do(X=0))$ を求めよ。
        answer: «ace»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $U$ が観測されないのでバックドア調整はできない。仮定 (i)〜(iii) のもとで $M$ はフロントドア基準を満たし
          $$P(Y=1\mid do(x))=\sum_m P(m\mid x)\sum_{x'}P(Y=1\mid x',m)P(x')$$
          で求められる。内側の和は「$M=m$ に介入したときの購入確率」（$X$ でバックドア調整）にあたる。

          **途中式** 内側の和：
          $$m=1:\ «y11»\times«px»+«y01»\times«qx»=«a11»+«a01»=«in1»,\qquad m=0:\ «y10»\times«px»+«y00»\times«qx»=«a10»+«a00»=«in0»$$
          外側の和：
          $$P(Y=1\mid do(X=1))=«pm1»\times«in1»+«qm1»\times«in0»=«do1»,\qquad P(Y=1\mid do(X=0))=«pm0»\times«in1»+«qm0»\times«in0»=«do0»$$
          $$\text{平均因果効果}=«do1»-«do0»=«ace_s»$$
          （同じ値は $\{P(M=1\mid X=1)-P(M=1\mid X=0)\}\times(«in1»-«in0»)=«dpm»\times«dinner»$ としても得られる。）

          **答え** $«ace_s»$

          **間違えやすい点** 単純な比較 $P(Y=1\mid X=1)-P(Y=1\mid X=0)=«obs1»-«obs0»=«naive»$ は、利用意欲の高い人に通知が送られやすいことによる交絡を含むので過大になる。
          内側の和で $P(Y\mid x,m)$ の $x$ を介入した値に固定してしまうと単純比較と同じになる。内側では $x'$ を観測された分布 $P(x')$ で平均する。
