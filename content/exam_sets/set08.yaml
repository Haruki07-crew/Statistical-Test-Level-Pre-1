          - "$R$ を与えると、$C$ と $M$ は条件付き独立である。"
          - "$R$ と $E$ は辺で直接結ばれていないので、（何も与えなくても）独立である。"
          - "精度行列の $(C,M)$ 成分が 0 なので、$C$ と $M$ の相関係数も 0 である。"
        answer: 0
        distractors:
          - 正解
          - R から T へは M を通る道も残っているので、C だけでは分離できない
          - C と M は T を通る道でもつながっているので、R だけでは分離できない
          - 辺がないことは周辺の独立ではなく、ほかの変数を与えたときの条件付き独立を表す
          - 精度行列の 0 は偏相関が 0 であることを表し、相関係数が 0 とは限らない
        explanation: |
          **方針** ガウス型グラフィカルモデルでは、変数の集合 $S$ がグラフ上で $A$ と $B$ を分離する（$A$ から $B$ へのどの道も $S$ を通る）とき、$S$ を与えると $A$ と $B$ は条件付き独立（大域マルコフ性）。

          **途中式** $E$ に接する辺は $T-E$ だけなので、$E$ へ行く道はすべて $T$ を通る。よって $T$ は $R$ と $E$ を分離し、選択肢 0 は正しい。
          選択肢 1：$R-M-T$ の道が $C$ を通らないので分離されない。選択肢 2：$C-T-M$ の道が $R$ を通らない。
          選択肢 3：$R$ と $E$ は $R-C-T-E$ の道でつながっていて、一般に相関がある。選択肢 4：精度行列の成分が 0 なのは「ほかの 3 変数を与えたときの偏相関が 0」で、周辺の相関は $C-R-M$ などの道を通じて 0 でない。

