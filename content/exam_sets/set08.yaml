          **間違えやすい点** 辺がないこと（精度行列の 0）は**条件付き**独立で、周辺の独立ではない。分離を調べるときは、すべての道を確かめる。

  - id: s08p11
    title: Web トラフィックの時系列予測
    context: |
      あるサイトの 1 時間あたりのアクセス数（千件、平均を引く前）$X_t$ を、平均 «mean» のまわりの定常な AR(2) モデル
      $$X_t-«mean»=\phi_1(X_{t-1}-«mean»)+\phi_2(X_{t-2}-«mean»)+\varepsilon_t$$
      （$\varepsilon_t$ は平均 0 のホワイトノイズ）で表す。長い期間の記録から求めた標本自己相関は、ラグ 1 で $r_1=«r1»$、ラグ 2 で $r_2=«r2»$ だった。
    items:
      - id: s08p11a
        chapter: 27
        terms: [ar-model, yule-walker-equations, forecasting, partial-autocorrelation]
        topic: 標本自己相関からユール・ウォーカー方程式でAR(2)の係数を求め1期先のアクセス数を予測する
        level: 応用
        definition: false
        type: numeric
        question: |
          ユール・ウォーカー方程式で $\phi_1,\phi_2$ を推定し、直近 2 時間のアクセス数が $X_{T-1}=«xT1»$、$X_T=«xT»$ のとき、1 時間先の予測値 $\hat X_{T+1}$ を求めよ（平均は «mean» とする）。
        answer: «fc»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** AR(2) のユール・ウォーカー方程式 $\rho_1=\phi_1+\phi_2\rho_1$、$\rho_2=\phi_1\rho_1+\phi_2$ に標本自己相関を代入して解き、平均からの偏差で 1 期先を予測する。

          **途中式** 連立方程式
          $$«r1»=\phi_1+«r1»\phi_2,\qquad «r2»=«r1»\phi_1+\phi_2$$
          を解くと（分母は $1-r_1^2=«det»$）
          $$\phi_1=\frac{r_1(1-r_2)}{1-r_1^2}=\frac{«n1»}{«det»}=«phi1f»\approx«phi1»,\qquad \phi_2=\frac{r_2-r_1^2}{1-r_1^2}=\frac{«n2»}{«det»}=«phi2f»\approx«phi2»$$
          （$\phi_1+\phi_2=«stat1»<1$、$\phi_2-\phi_1=«stat2»<1$、$|\phi_2|<1$ なので定常条件を満たす。）
          偏差は $X_T-«mean»=«dT»$、$X_{T-1}-«mean»=«dT1»$ なので
          $$\hat X_{T+1}=«mean»+«phi1f»\times«dT»+\left(«phi2f»\right)\times«dT1»=«mean»+«t1»+(«t2»)=«fc4»\cdots$$

          **答え** $«fc_s»$

          **間違えやすい点** AR(1) とみなして $\phi_1=r_1$ とすると $«fc_ar1»$。$\phi_2$ を $r_2-r_1^2$（分母 $1-r_1^2$ で割り忘れ）とし、$\phi_1=r_1$ のままにすると $«fc_naive»$。
          平均を引かずに $X$ そのものに係数を掛けると $«fc_nomean»$ と大きく外れる。なお $\hat\phi_2$ はラグ 2 の偏自己相関の推定値でもある。

