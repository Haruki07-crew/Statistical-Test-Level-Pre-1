        topic: 2つの兆候を条件付き独立とみなすナイーブベイズで一方の兆候が出ていないときの攻撃の事後確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ログインの試みが攻撃である事前確率を «pi» とする。兆候 $F_1$（短時間に多数のログイン失敗）と $F_2$（普段と違う国からの接続）について、
          $P(F_1\mid\text{攻撃})=«f1a»$、$P(F_1\mid\text{正常})=«f1n»$、$P(F_2\mid\text{攻撃})=«f2a»$、$P(F_2\mid\text{正常})=«f2n»$ とし、
          ナイーブベイズ（攻撃か正常かを与えれば $F_1$ と $F_2$ は条件付き独立）を仮定する。
          ある試みで $F_1$ は**出ており**、$F_2$ は**出ていなかった**。この試みが攻撃である事後確率に最も近い値はどれか。
        choices:
          - "$«b_num»$"
          - "$«b_ok»$"
          - "$«b_no2»$"
          - "$«b_yes»$"
          - "$«b_nopri»$"
        answer: 1
        distractors:
          - 正規化（全確率で割る）をせず分子だけを答えた
          - 正解
          - F2 が出ていないという情報を使わなかった
          - F2 が出ていない確率ではなく出ている確率 P(F2|・) を使った
          - 事前確率を無視して尤度だけで比べた
        explanation: |
          **方針** ベイズの定理で、事後確率 ∝ 事前確率 × $P(F_1=1\mid\cdot)\,P(F_2=0\mid\cdot)$（条件付き独立により積になる）。両クラスで計算して正規化する。

          **途中式** $P(F_2=0\mid\text{攻撃})=1-«f2a»=«g2a»$、$P(F_2=0\mid\text{正常})=1-«f2n»=«g2n»$。
          $$\text{攻撃}:\ «pi»\times«f1a»\times«g2a»=«na»,\qquad \text{正常}:\ «qpi»\times«f1n»\times«g2n»=«nn»$$
          $$P(\text{攻撃}\mid F_1=1,F_2=0)=\frac{«na»}{«na»+«nn»}=\frac{«na»}{«nsum»}=«post4»\cdots$$

          **答え** $«b_ok»$

          **間違えやすい点** 「出ていない」兆候も情報になる。攻撃のときは $F_2$ が出やすいので、出ていないことは攻撃の可能性を下げる（$F_1$ だけなら $«b_no2»$）。
          事前確率 «pi» を無視すると $«b_nopri»$ と過大になる。

