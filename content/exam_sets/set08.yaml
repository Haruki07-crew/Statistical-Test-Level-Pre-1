        chapter: 29
        terms: [kaplan-meier-estimator, censored-data, survival-function]
        topic: 打ち切りを含むインシデント復旧時間のカプラン・マイヤー推定で6時間を超えても未復旧である確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          カプラン・マイヤー法で「復旧までの時間が 6 時間を超える確率」$S(6)$ を推定する。復旧と打ち切りが同じ時刻にあるときは、打ち切りはその時刻の復旧のあとに起きたとみなす（その時刻のリスク集合に含める）。
