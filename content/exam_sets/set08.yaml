set: 8
title: 模擬試験 第8回
minutes: 90
problems:
  - id: s08p01
    title: 冗長構成の Web サービスとディスクの寿命
    context: |
      ある Web サービスは、ロードバランサ $L$（1 台）→ アプリケーションサーバ $A_1, A_2$（2 台を並列に置き、少なくとも 1 台が動いていればよい）→ データベース $D$（1 台）の順につながっている。
      サービスが動くのは、$L$ と $D$ が動き、かつ $A_1, A_2$ の少なくとも一方が動いているときである。
      ある時点で各機器が動いている確率は $L$ が «pl»、$A_1$ と $A_2$ がそれぞれ «pa»、$D$ が «pd» で、機器の状態は互いに独立とする。
    items:
      - id: s08p01a
        chapter: 1
        terms: [conditional-probability, independence-of-events, law-of-total-probability]
        topic: 直並列構成のサービスが停止したとき原因がロードバランサの停止である条件付き確率
        level: 基本
        definition: false
        type: choice
        question: |
          ある時点でサービスが停止していることがわかった。このときロードバランサ $L$ が停止している条件付き確率に最も近い値はどれか。
        choices:
          - "$«a_ql»$"
          - "$«a_down»$"
          - "$«a_ser»$"
          - "$«a_naive»$"
          - "$«a_ok»$"
        answer: 4
        distractors:
          - 条件を付けずに L が停止している確率そのものを答えた
          - サービスが停止している確率 P(停止) を答えた
          - 並列の 2 台を直列とみなし、2 台とも動く必要があるとしてサービスの停止確率を計算した
          - 停止の原因どうしの重なりを無視し、各機器の停止確率の単純な和で割った
          - 正解
        explanation: |
          **方針** 「$L$ が停止」ならば必ず「サービスが停止」なので、$P(L\text{停止}\cap\text{サービス停止})=P(L\text{停止})$。
          あとは $P(\text{サービス停止})$ を直列・並列の規則で求めて、条件付き確率の定義で割る。

          **途中式** 並列部分が動く確率は $1-(1-«pa»)^2=1-«qa»^2=1-«qa2»=«par»$。直列部分は掛け算なので
          $$P(\text{サービス稼働})=«pl»\times«par»\times«pd»=«up»,\qquad P(\text{サービス停止})=1-«up»=«down»$$
          $$P(L\text{停止}\mid\text{サービス停止})=\frac{P(L\text{停止})}{P(\text{サービス停止})}=\frac{«ql»}{«down»}=«cond4»\cdots$$

          **答え** $«a_ok»$

          **間違えやすい点** 条件を付けないと $«a_ql»$ のまま。停止の原因（$L$ の停止 «ql»、並列部分の全滅 «qa2»、$D$ の停止 «qd»）を足した $«naive_den»$ で割ると $«a_naive»$ となり、
          2 つ以上が同時に止まる場合を重複して数えてしまう（正しい分母 $«down»$ はこの和より少し小さい）。
          並列の 2 台を直列と誤ると、稼働確率が $«upser»$ となり $«a_ser»$ になる。

      - id: s08p01b
        chapter: 2
        terms: [hazard-function, survival-function, cumulative-distribution-function]
        topic: 時間に比例して増えるハザード関数から稼働中のディスクがさらに1年故障しない条件付き確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          アプリケーションサーバのディスクの寿命 $T$（単位：年）のハザード関数（故障率関数）が $h(t)=«c»\,t$（$t\ge 0$）であるとする。
          すでに «t0» 年間故障せずに動いているディスクが、さらに «dt» 年間（つまり «t1» 年目の終わりまで）故障しない条件付き確率 $P(T>«t1»\mid T>«t0»)$ を求めよ。
          必要なら $e^{-0.1}=«e01»$、$e^{-0.4}=«e04»$、$e^{-0.5}=«e05»$、$e^{-0.9}=«e09»$ を使え。
        answer: «surv»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 生存関数はハザード関数の積分（累積ハザード）$H(t)=\int_0^t h(u)\,du$ を使って $S(t)=e^{-H(t)}$ と書ける。条件付き生存確率は $S(«t1»)/S(«t0»)$。

          **途中式**
          $$H(t)=\int_0^t «c»\,u\,du=«ch»\,t^2,\qquad H(«t0»)=«H0»,\quad H(«t1»)=«H1»$$
          $$P(T>«t1»\mid T>«t0»)=\frac{P(T>«t1»)}{P(T>«t0»)}=\frac{e^{-«H1»}}{e^{-«H0»}}=e^{-(«H1»-«H0»)}=e^{-«expo»}=«e05»$$

          **答え** $«surv_s»$

          **間違えやすい点** 指数分布のような無記憶性はない（ハザードが時間とともに増える）。経過時間を無視して $S(«dt»)=e^{-«ch»}=«mem»$ とすると誤り。
          条件を付けずに $S(«t1»)=e^{-«H1»}=«uncond»$ を答えたり、故障する側の確率 $1-«e05»=«w_cdf»$ を答えたりしないこと。
          また、ハザードの値 $h(«t0»)=«hz»$ を一定とみなして $e^{-«hz»}$ とするのも、1 年の間にハザードが増えることを無視している。

  - id: s08p02
    title: 2 段階で処理される API リクエスト
    context: |
      ある API では、1 件のリクエストが「認証」と「本処理」の 2 段階で処理される。認証にかかる時間 $T_1$ はレート $\lambda_1=«l1»$（平均 «m1» ミリ秒）の指数分布、
      本処理にかかる時間 $T_2$ はレート $\lambda_2=«l2»$（平均 «m2» ミリ秒）の指数分布に従い、$T_1$ と $T_2$ は独立とする（レート $\lambda$ の指数分布の密度は $\lambda e^{-\lambda t}$、$t>0$）。
      1 件の処理時間は $T=T_1+T_2$（ミリ秒）である。
    items:
      - id: s08p02a
        chapter: 4
        terms: [sum-of-random-variables, change-of-variables, exponential-distribution]
        topic: レートの異なる2段の指数処理時間の和の密度関数を畳み込みで求める
        level: 標準
        definition: false
        type: choice
        question: |
          $T=T_1+T_2$ の確率密度関数 $f_T(t)$（$t>0$）として正しいものはどれか。
        choices:
          - '$«coef»\left(e^{-0.5t}-e^{-0.25t}\right)$'
          - '$«lp»\,e^{-«ls»t}$'
          - '$«coef»\left(0.5e^{-0.5t}+0.25e^{-0.25t}\right)$'
          - '$«lp»\left(e^{-0.25t}-e^{-0.5t}\right)$'
          - '$«coef»\left(e^{-0.25t}-e^{-0.5t}\right)$'
        answer: 4
        distractors:
          - 畳み込みの積分の符号を取り違えて負の密度にした
          - 畳み込みではなく 2 つの密度を同じ t で掛け合わせた
          - 和の分布を 2 つの分布の重み 1/2 ずつの混合分布と取り違えた
          - 積分の結果の 1/(λ1−λ2) を掛け忘れた
          - 正解
        explanation: |
          **方針** 独立な 2 変数の和の密度は畳み込み $f_T(t)=\int_0^t f_{T_1}(s)f_{T_2}(t-s)\,ds$ で求める。

          **途中式**
          $$f_T(t)=\int_0^t \lambda_1e^{-\lambda_1 s}\,\lambda_2e^{-\lambda_2(t-s)}\,ds=\lambda_1\lambda_2e^{-\lambda_2 t}\int_0^t e^{-(\lambda_1-\lambda_2)s}\,ds
          =\frac{\lambda_1\lambda_2}{\lambda_1-\lambda_2}\left(e^{-\lambda_2 t}-e^{-\lambda_1 t}\right)$$
          $\lambda_1\lambda_2=«lp»$、$\lambda_1-\lambda_2=0.25$ を代入すると
          $$f_T(t)=\frac{«lp»}{0.25}\left(e^{-0.25t}-e^{-0.5t}\right)=«coef»\left(e^{-0.25t}-e^{-0.5t}\right)$$
          確認：$\int_0^\infty f_T(t)\,dt=«coef»\,(4-2)=1$、また $t>0$ で $e^{-0.25t}>e^{-0.5t}$ なので正の値をとる。

          **答え** $«coef»\left(e^{-0.25t}-e^{-0.5t}\right)$

          **間違えやすい点** $\lambda_1\lambda_2/(\lambda_1-\lambda_2)$ の係数を落とすと積分が $«lp»\times2=0.25$ になり密度にならない。
          指数の差の向きを逆にすると負の値になる。積 $f_{T_1}(t)f_{T_2}(t)$ や混合分布は「和」の分布ではない。

      - id: s08p02b
        chapter: 7
        terms: [chebyshev-inequality, central-limit-theorem, weak-law-of-large-numbers]
        topic: 2段処理時間の平均の推定精度を保証する標本数をチェビシェフの不等式と中心極限定理で比べる
        level: 応用
        definition: false
        type: choice
        question: |
          独立な $n$ 件のリクエストの処理時間の標本平均 $\bar T$ で、真の平均 $\mu=E[T]$ を推定する。
          $P(|\bar T-\mu|<«eps»)\ge 1-«alpha»$ を保証するのに必要な最小の $n$ を、(i) チェビシェフの不等式、(ii) 中心極限定理による正規近似（$\bar T$ を正規分布とみなす）の 2 通りで求めた。
          正しい組はどれか。標準正規分布の上側 2.5% 点は «z»、上側 5% 点は «z1» とする。
        choices:
          - '«o0»'
          - '«o1»'
          - '«o2»'
          - '«o3»'
          - '«o4»'
        answer: 2
        distractors:
          - 正規近似で両側の評価なのに片側の 5% 点 1.645 を使った
          - 分散を (標準偏差の和)^2 として計算した（独立な和の分散は分散の和）
          - 正解
          - 許容誤差 0.5 を 2 乗し忘れた
          - チェビシェフと中心極限定理の結果を取り違えた
        explanation: |
          **方針** まず $V[T]$ を求める。独立な和なので $V[T]=V[T_1]+V[T_2]$、指数分布の分散は $1/\lambda^2$。
          (i) は $P(|\bar T-\mu|\ge\varepsilon)\le V[T]/(n\varepsilon^2)$、(ii) は $«z»\sqrt{V[T]/n}\le\varepsilon$ を $n$ について解く。

          **途中式** $V[T]=\dfrac{1}{«l1»^2}+\dfrac{1}{«l2»^2}=«v1»+«v2»=«var»$、$\varepsilon^2=«eps2»$。
          (i) $\dfrac{«var»}{n\times«eps2»}\le«alpha»$ より $n\ge\dfrac{«var»}{«alpha»\times«eps2»}=«cheb_raw»$、よって $n=«cheb»$。
          (ii) $n\ge\dfrac{«z»^2\times«var»}{«eps2»}=\dfrac{«z2»\times«var»}{«eps2»}=«clt_raw»$、よって $n=«clt»$（切り上げ）。

          **答え** «o2»

          **間違えやすい点** チェビシェフの不等式は分布の形を問わない代わりに評価が粗く、必要な $n$ が大きくなる（$1600$ と $308$ で約 5 倍）。
          両側の評価なので上側 2.5% 点 «z» を使う（«z1» だと $«clt1»$）。分散は標準偏差の和の 2 乗 $(«m1»+«m2»)^2=«varsd»$ ではなく分散の和 «var»。

  - id: s08p03
    title: 2 つの時刻源による時刻合わせ
    context: |
      あるサーバは、2 つの時刻源（NTP サーバ）から時刻のずれを測っている。時刻源 1 と 2 による測定誤差 $X_1,X_2$（単位：ミリ秒）は、
      平均がともに 0、標準偏差が $\sigma_1=«s1»$、$\sigma_2=«s2»$、相関係数 $\rho=«rho»$ の 2 変量正規分布に従う（同じネットワーク経路を一部共有しているため正の相関がある）。
    items:
      - id: s08p03a
        chapter: 3
        terms: [expectation-variance-properties, covariance-and-correlation]
        topic: 相関のある2つの時刻源の測定誤差を重み付き平均して分散が最小になる重みと最小分散
        level: 標準
        definition: false
        type: numeric
        question: |
          2 つの測定を重み $w$ と $1-w$ で合わせた $Y=wX_1+(1-w)X_2$ を誤差とする推定を使う。$V[Y]$ を最小にする $w$ を選んだときの、$V[Y]$ の最小値を求めよ。
        answer: «vmin»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $V[Y]$ を $w$ の 2 次関数として書き、微分して 0 とおく。共分散 $\mathrm{Cov}(X_1,X_2)=\rho\sigma_1\sigma_2$ を忘れない。

          **途中式** $\mathrm{Cov}(X_1,X_2)=«rho»\times«s1»\times«s2»=«cov»$。
          $$V[Y]=w^2\cdot«v1»+(1-w)^2\cdot«v2»+2w(1-w)\cdot«cov»$$
          $$\frac{dV}{dw}=2w\cdot«v1»-2(1-w)\cdot«v2»+2(1-2w)\cdot«cov»=0\ \Longrightarrow\ w=\frac{\sigma_2^2-\rho\sigma_1\sigma_2}{\sigma_1^2+\sigma_2^2-2\rho\sigma_1\sigma_2}=\frac{«v2»-«cov»}{«v1»+«v2»-2\times«cov»}=«w_frac»$$
          これを代入すると、最小値は
          $$V_{\min}=\frac{\sigma_1^2\sigma_2^2-(\rho\sigma_1\sigma_2)^2}{\sigma_1^2+\sigma_2^2-2\rho\sigma_1\sigma_2}=\frac{«p1v1»-«cov2»}{«den»}=\frac{«vnum»}{«den»}=«vmin4»\cdots$$

          **答え** $«vmin_s»$

          **間違えやすい点** 相関を無視すると $w=\sigma_2^2/(\sigma_1^2+\sigma_2^2)=«w0»$、分散 $«v0»$ となり、実際より小さく見積もってしまう（正の相関があると、2 つ合わせても誤差が打ち消し合いにくい）。
          単純平均 $w=0.5$ の分散は $«v_half»$ で、最適な重みのほうが小さい。精度の高い（分散の小さい）時刻源 2 に大きい重み $1-w$ がかかることも確かめるとよい。

      - id: s08p03b
        chapter: 6
        terms: [bivariate-normal-distribution, conditional-probability-density-function, normal-distribution]
        topic: 2変量正規の一方の誤差が観測されたときもう一方の誤差が閾値を超える条件付き確率
        level: 標準
        definition: false
        type: choice
        question: |
          ある時点で、別の高精度な基準時計との比較から時刻源 1 の誤差が $X_1=«x1»$ ミリ秒だったとわかった。このとき時刻源 2 の誤差が «thr» ミリ秒を超える条件付き確率 $P(X_2>«thr»\mid X_1=«x1»)$ に最も近い値はどれか。
          標準化した値は小数第 2 位に丸めて、次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 0.26 | 0.58 | 0.67 | 1.33 |
          |---|---|---|---|---|
          | $\Phi(z)$ | «f026» | «f058» | «f067» | «f133» |
        choices:
          - "$«o_unc»$"
          - "$«o_ok»$"
          - "$«o_sd»$"
          - "$«o_rev»$"
          - "$«o_var»$"
        answer: 1
        distractors:
          - 条件を使わず X2 の周辺分布で P(X2>4) を求めた
          - 正解
          - 条件付き平均は使ったが、標準偏差を周辺の 3 のままにした
          - 回帰の傾きを ρσ1/σ2 と逆にして条件付き平均を 4 とした
          - 標準偏差ではなく条件付き分散 6.75 で割って標準化した
        explanation: |
          **方針** 2 変量正規分布では、$X_1=x_1$ を与えたときの $X_2$ の条件付き分布は正規分布で、
          平均 $\rho\dfrac{\sigma_2}{\sigma_1}x_1$、分散 $\sigma_2^2(1-\rho^2)$ である（平均 0 の場合）。

          **途中式**
          $$E[X_2\mid X_1=«x1»]=«rho»\times\frac{«s2»}{«s1»}\times«x1»=«slope»\times«x1»=«cm»,\qquad V[X_2\mid X_1=«x1»]=«v2»\times«rho2»=«cv»$$
          条件付き標準偏差は $\sqrt{«cv»}=«csd»$。
          $$P(X_2>«thr»\mid X_1=«x1»)=P\left(Z>\frac{«thr»-«cm»}{«csd»}\right)=P(Z>«zraw»)\approx1-\Phi(«zok»)=1-«f067»=«o_ok»$$

          **答え** $«o_ok»$

          **間違えやすい点** 条件を無視すると $1-\Phi(«z_unc»)=«o_unc»$ と小さく出る（$X_1$ が大きいので $X_2$ も大きくなりやすい）。
          条件付き分散は $\sigma_2^2(1-\rho^2)$ で周辺の分散より小さい。標準偏差を 3 のままにすると $«o_sd»$。
          回帰の傾きは「$X_2$ の $X_1$ への回帰」なので $\rho\sigma_2/\sigma_1$。逆の $\rho\sigma_1/\sigma_2$ にすると平均が «cm_rev» となり $«o_rev»$ になる。

  - id: s08p04
    title: API ゲートウェイの待ち行列
    context: |
      ある API ゲートウェイには、リクエストが平均 1 秒あたり $\lambda=«lam»$ 件のポアソン過程に従って到着する。処理装置は 1 台で、1 件の処理時間は平均 $1/\mu$ 秒（$\mu=«mu»$ 件/秒）の指数分布に従い、
      到着順に 1 件ずつ処理する（待合室の容量は無限）。すなわち M/M/1 待ち行列とする。
    items:
      - id: s08p04a
        chapter: 15
        terms: [mm1-queue, littles-law, traffic-intensity]
        topic: M/M/1待ち行列のAPIゲートウェイで処理が始まるまでの平均待ち時間をリトルの公式から求める
        level: 基本
        definition: false
        type: choice
        question: |
          定常状態で、到着したリクエストが**処理が始まるまでに**待つ平均時間（処理時間を含まない）に最も近い値はどれか（単位：ミリ秒）。
        choices:
          - "$«o_s»$ ミリ秒"
          - "$«o_a»$ ミリ秒"
          - "$«o_lqmu»$ ミリ秒"
          - "$«o_ok»$ ミリ秒"
          - "$«o_w»$ ミリ秒"
        answer: 3
        distractors:
          - 平均処理時間 1/μ を答えた
          - 平均到着間隔 1/λ を答えた
          - リトルの公式で待ち行列の長さ Lq を λ ではなく μ で割った
          - 正解
          - 処理時間を含む平均滞在時間 W を答えた
        explanation: |
          **方針** 利用率 $\rho=\lambda/\mu$ から系内の平均人数 $L=\rho/(1-\rho)$ を求め、リトルの公式 $L=\lambda W$ で平均滞在時間 $W$ を出す。待ち時間は $W$ から平均処理時間 $1/\mu$ を引く。

          **途中式** $\rho=«lam»/«mu»=«rho»<1$ なので定常状態がある。
          $$L=\frac{\rho}{1-\rho}=\frac{«rho»}{1-«rho»}=«L»,\qquad W=\frac{L}{\lambda}=\frac{«L»}{«lam»}=«Wfrac»\ \text{秒}\approx«W_ms»\ \text{ミリ秒}$$
          $$W_q=W-\frac{1}{\mu}=\frac{1}{3}-\frac{1}{«mu»}=\frac{«rho»}{«dmu»}=«Wq»\ \text{秒}\approx«Wq_ms»\ \text{ミリ秒}$$
          （確認：待ち行列の平均の長さ $L_q=\rho^2/(1-\rho)=«Lq»$ を使って $W_q=L_q/\lambda=«Lq»/«lam»=«Wq»$ 秒。）

          **答え** $«o_ok»$ ミリ秒

          **間違えやすい点** 「待ち時間」と「滞在時間（待ち＋処理）」の区別。$W=«W_ms»$ ミリ秒は処理時間 «S_ms» ミリ秒を含む。
          リトルの公式は「人数 = 到着率 × 時間」なので、割る数は処理率 $\mu$ ではなく到着率 $\lambda$。

  - id: s08p05
    title: リリース判定のテストと障害件数
    context: |
      あるソフトウェアの新版を出すかどうかを、(1) リリース前の自動テストと (2) 試験運用での障害件数から判断する。
    items:
      - id: s08p05a
        chapter: 9
        terms: [one-sided-confidence-limit, clopper-pearson-interval, required-sample-size]
        topic: 不具合ゼロ件のとき失敗率の片側95%上側信頼限界が目標以下になる必要テスト回数を正確法で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          自動テストでは、各回が独立に確率 $p$ で失敗すると考える。$n$ 回実行して失敗が 0 回だったときの $p$ の片側 95% 上側信頼限界 $p_U$ を、二項分布に基づく正確な方法
          （$P(\text{失敗 }0\text{ 回}\mid p_U)=(1-p_U)^n=«alpha»$ を満たす $p_U$）で定める。
          失敗 0 回のときに $p_U\le«p0»$ となるために必要な最小の実行回数 $n$ を求めよ。
          必要なら $\ln «alpha»=«ln_a»$、$\ln 0.025=«ln_a2»$、$\ln «q0»=«ln_q»$ を使え。
        answer: «n»
        tolerance: 0.5
        answer_format: 整数で答えよ。±0.5 未満の差まで正解とする（ちょうど一致する整数のみ正解）。
        explanation: |
          **方針** $p_U$ は $n$ が大きいほど小さくなる。$p_U\le«p0»$ は $(1-«p0»)^n\le«alpha»$（$p=«p0»$ でも 0 回が起こる確率が 5% 以下）と同じ。両辺の対数をとって $n$ について解く。

          **途中式**
          $$(«q0»)^n\le«alpha»\iff n\ln«q0»\le\ln«alpha»\iff n\ge\frac{\ln«alpha»}{\ln«q0»}=\frac{«ln_a»}{«ln_q»}=«nraw»$$
          （$\ln«q0»<0$ で割るので不等号の向きが変わる。）よって最小の整数は $n=«n»$。

          **答え** $«n»$

          **間違えやすい点** 片側の 95% 限界なので 0.05 を使う。両側 95% 区間の上限（0.025）にすると $n=«n_two»$ になる。
          よく知られた「3 の法則」$p_U\approx3/n$ では $n=«rule3»$、$\ln(1-p)\approx-p$ と近似すると $n=«n_approx»$ になるが、どちらも近似で、正確な値は «n»。
          失敗が 0 回なので、ワルド型 $\hat p\pm z\sqrt{\hat p(1-\hat p)/n}$ は幅 0 になって使えない。

      - id: s08p05b
        chapter: 12
        terms: [poisson-two-sample-test, binomial-test, poisson-parameter-test]
        topic: 稼働時間の異なる新旧版の障害件数を総件数で条件づけた二項分布の正規近似で比べる
        level: 標準
        definition: false
        type: choice
        question: |
          試験運用で、旧版は «t_old» 時間の稼働で障害 «y_old» 件、新版は «t_new» 時間の稼働で障害 «y_new» 件だった。障害はそれぞれの版で一定の率のポアソン過程に従って起こるとする。
          「障害の率は新旧で等しい」という帰無仮説を、総件数 «tot» 件を与えたときの新版の件数の条件付き分布（二項分布）を正規近似して検定する（連続修正はしない）。
          検定統計量 $z$ の値に最も近いものはどれか。
        choices:
          - "$z=«o_half»$"
          - "$z=«o_ok»$"
          - "$z=«o_cc»$"
          - "$z=«o_np»$"
          - "$z=«o_var»$"
        answer: 1
        distractors:
          - 稼働時間の違いを無視して二項分布の確率を 1/2 とした
          - 正解
          - 指示に反して連続修正（+0.5）を行った
          - 分散を np(1-p) ではなく np（ポアソン分布の分散）とした
          - 標準偏差ではなく分散で割った
        explanation: |
          **方針** 独立なポアソン変数 $Y_{\text{旧}}\sim Po(\lambda t_{\text{旧}})$、$Y_{\text{新}}\sim Po(\lambda t_{\text{新}})$ の和を $m$ と固定すると、帰無仮説のもとで
          $Y_{\text{新}}\sim B\left(m,\ \dfrac{t_{\text{新}}}{t_{\text{旧}}+t_{\text{新}}}\right)$ となる。これを正規近似する。

          **途中式** $m=«tot»$、$p=\dfrac{«t_new»}{«ttot»}=«pn»$。
          $$E=«tot»\times\frac13=«e»,\qquad V=«tot»\times\frac13\times\frac23=«v»,\qquad z=\frac{«y_new»-«e»}{\sqrt{«v»}}=\frac{-6}{«sdv»}=«z4»\cdots$$

          **答え** $z=«o_ok»$（両側 5% の棄却限界 ±1.96 を超えるので、新版の障害率は旧版と有意に異なり、低いと判断できる）

          **間違えやすい点** 稼働時間が違うので、件数を 1:1 で比べてはいけない（$p=1/2$ だと $«o_half»$）。
          条件付き分布は二項分布なので分散は $mp(1-p)$。ポアソンの分散 $mp$ を使うと $«o_np»$ になる。率で見ると旧版 «rate_old» 件/時、新版 «rate_new» 件/時。

  - id: s08p06
    title: CI のビルド時間の比較
    context: |
      継続的インテグレーション（CI）のビルド環境を新しいランナーに移す前に、同じ «n» 個のコミットを旧ランナーと新ランナーの両方でビルドし、ビルド時間（秒）を測った。

      | コミット | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
      |---|---|---|---|---|---|---|---|---|
      | 旧ランナー | «old_row» |
      | 新ランナー | «new_row» |
      | 差（旧 − 新） | «d_row» |
    items:
      - id: s08p06a
        chapter: 11
        terms: [paired-t-test, one-sample-t-test, t-distribution]
        topic: 同じコミットを新旧ランナーでビルドした時間の差に対応のあるt検定を行う統計量
        level: 基本
        definition: false
        type: choice
        question: |
          ビルド時間の差が正規分布に従うとして、対応のある $t$ 検定で「新旧の平均ビルド時間は等しい」かを調べる。検定統計量 $t$ の値に最も近いものはどれか。
          標本分散は $n-1$ で割る不偏分散とする。
        choices:
          - "$«o_unp»$"
          - "$«o_nosq»$"
          - "$«o_ok»$"
          - "$«o_n»$"
          - "$«o_n1»$"
        answer: 2
        distractors:
          - 対応を無視し、等分散を仮定した 2 標本 t 検定にした
          - 標準誤差を出すときに √n で割り忘れた
          - 正解
          - 差の分散を n で割る標本分散にした
          - 標準誤差を s/√(n−1) とした
        explanation: |
          **方針** 同じコミットを両方でビルドしているので、コミットごとの差 $d_i$ を 1 標本とみなして $t=\bar d/(s_d/\sqrt n)$ を計算する（自由度 $n-1=«n1»$）。

          **途中式** 差の合計は «dsum» なので $\bar d=«dsum»/«n»=«dbar»$。偏差の 2 乗和は
          $$\sum(d_i-\bar d)^2=«ss»,\qquad s_d^2=\frac{«ss»}{«n1»}=«sd2»,\qquad s_d=«sd»$$
          $$t=\frac{\bar d}{s_d/\sqrt{n}}=\frac{«dbar»}{«sd»/\sqrt{«n»}}=\frac{«dbar»}{«se»}=«t4»\cdots$$

          **答え** $«o_ok»$（自由度 «n1» の $t$ 分布の上側 2.5% 点 «tc» を超えるので、両側 5% で有意）

          **間違えやすい点** 対応を無視して 2 標本 $t$ 検定をすると、コミットごとのビルド時間のばらつき（プールした分散 «sp2»）が誤差に入り $t=«o_unp»$ と小さくなる。
          対応のあるデータでは、コミットによる違いを差をとることで取り除くのがポイント。$\sqrt{n}$ で割るのを忘れると $«o_nosq»$ になる。

      - id: s08p06b
        chapter: 13
        terms: [sign-test, binomial-test, nonparametric-methods-overview]
        topic: 対応のある差の符号だけを使う符号検定の正確な片側p値を二項分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          差の分布に正規性を仮定せず、同じデータに符号検定を行う。「新ランナーのほうが速い（差が正になりやすい）」を対立仮説とする片側検定の正確な $p$ 値に最も近い値はどれか（差が 0 のコミットはない）。
        choices:
          - "$«s_up»$"
          - "$«s_eq»$"
          - "$«s_ok»$"
          - "$«s_two»$"
          - "$«s_low»$"
        answer: 2
        distractors:
          - 観測値ちょうどの 6 を含めずに P(X≥7) とした
          - P(X=6) だけを答えた
          - 正解
          - 片側検定なのに 2 倍して両側の p 値にした
          - 逆側の裾 P(X≤6) を答えた
        explanation: |
          **方針** 帰無仮説（差の中央値が 0）のもとで、正の差の個数 $X$ は $B(«n»,\,1/2)$ に従う。観測値以上に極端な（正が多い）側の確率を足す。

          **途中式** 正の差は «pos» 個、負の差は «neg» 個。
          $$P(X\ge«pos»)=\frac{\binom{8}{6}+\binom{8}{7}+\binom{8}{8}}{2^8}=\frac{«c8»+«c7»+«c6»}{«pow2»}=\frac{«tail»}{«pow2»}=«pv4»\cdots$$

          **答え** $«s_ok»$（5% で有意ではない）

          **間違えやすい点** $p$ 値は「観測値**以上**」なので $X=6$ を含める（含めないと $«s_up»$）。片側の対立仮説なので 2 倍しない。
          符号検定は差の大きさを捨てるため、前問の $t$ 検定（有意）より検出力が低く、同じデータでも有意にならないことがある。

  - id: s08p07
    title: Web ページの表示時間の回帰分析
    context: |
      ある Web サイトの «n» ページについて、表示時間 $y$（秒）を、画像の容量 $x_1$（MB）、外部スクリプトの数 $x_2$、サーバの平均負荷 $x_3$ などで説明する線形回帰モデルを最小二乗法で当てはめた。
      以下の回帰はすべて同じ «n» ページのデータで、切片を含む。
    items:
      - id: s08p07a
        chapter: 16
        terms: [variance-inflation-factor, multicollinearity, multiple-regression-model]
        topic: 補助回帰の決定係数からVIFを求め係数の標準誤差が何倍に膨らむかを読む
        level: 基本
        definition: false
        type: choice
        question: |
          $x_1$ をほかの説明変数 $x_2,x_3$ に回帰したときの決定係数は «r2» だった。$x_1$ の分散拡大要因 VIF と、
          「$x_1$ がほかの説明変数と無相関だった場合」に比べて $x_1$ の係数の標準誤差が何倍になっているかの組として正しいものはどれか（ほかの条件は同じとする）。
        choices:
          - "VIF $=«omr2»$、標準誤差は $0.4$ 倍"
          - "VIF $=«inv»$、標準誤差は $«invsq»$ 倍"
          - "VIF $=«vif»$、標準誤差は $«vif»$ 倍"
          - "VIF $=«vif»$、標準誤差は $«sq»$ 倍"
          - "VIF $=«sq»$、標準誤差は $1.6$ 倍"
        answer: 3
        distractors:
          - VIF を 1−R² と取り違えた（これは許容度）
          - VIF を 1/R² とした
          - 標準誤差は分散の平方根なので √VIF 倍になることを忘れた
          - 正解
          - VIF を √{1/(1−R²)} と取り違え、標準誤差もさらに平方根をとった
        explanation: |
          **方針** $\mathrm{VIF}_1=1/(1-R_1^2)$（$R_1^2$ は $x_1$ を他の説明変数に回帰した決定係数）。係数の**分散**が VIF 倍になるので、標準誤差は $\sqrt{\mathrm{VIF}}$ 倍になる。

          **途中式**
          $$\mathrm{VIF}_1=\frac{1}{1-«r2»}=\frac{1}{«omr2»}=«vif»,\qquad \sqrt{«vif»}=«sq»$$

          **答え** VIF $=«vif»$、標準誤差は $«sq»$ 倍

          **間違えやすい点** $1-R_1^2=«omr2»$ は「許容度」で VIF の逆数。VIF は分散の倍率で、標準誤差（$t$ 値の分母）の倍率はその平方根。
          VIF が 5〜10 を超えると多重共線性を疑う目安とされることが多い。

      - id: s08p07b
        chapter: 17
        terms: [breusch-pagan-test, heteroscedasticity, residual]
        topic: 残差二乗の補助回帰の決定係数からブルーシュ・ペーガン検定（nR²型）で不均一分散を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          $y$ を $x_1,x_2,x_3$ に回帰したモデルの残差 $e_i$ について、$e_i^2$ を $x_1,x_2,x_3$（と切片）に回帰したところ決定係数は «r2bp» だった。
          これを使って $nR^2$ 型のブルーシュ・ペーガン検定（帰無仮説：誤差は均一分散）を行う。正しい記述はどれか。
          カイ二乗分布の上側確率点は次のとおり：自由度 2 の 5% 点 «c2_05»、自由度 3 の 5% 点 «c3_05»・1% 点 «c3_01»、自由度 4 の 5% 点 «c4_05»・1% 点 «c4_01»。
        choices:
          - "検定統計量は $«lm»$ で、自由度 3 のカイ二乗分布の 5% 点を超えるので、有意水準 5% で均一分散の仮説を棄却する。"
          - "検定統計量は $«lm»$ で、自由度 4 のカイ二乗分布の 5% 点を超えないので、有意水準 5% で均一分散の仮説を棄却しない。"
          - "検定統計量は決定係数そのものの $«r2bp»$ で、どの点よりもずっと小さいので、均一分散の仮説を棄却しない。"
          - "検定統計量は $«lm»$ で、自由度 3 のカイ二乗分布の 1% 点も超えるので、有意水準 1% でも均一分散の仮説を棄却する。"
          - "検定統計量は $\\sqrt{nR^2}=«sqlm»$ で、標準正規分布の上側 2.5% 点 1.96 を超えるので、有意水準 5% で均一分散の仮説を棄却する。"
        answer: 0
        distractors:
          - 正解
          - 自由度に切片も数えて 4 とした
          - 検定統計量に n を掛け忘れた
          - 9.00 < 11.34 なので 1% では棄却できない（臨界値の読み違い）
          - nR² の平方根を標準正規と比べるという誤った方法
        explanation: |
          **方針** 帰無仮説のもとで $nR^2$ は漸近的に、補助回帰の説明変数の数（切片を除く）を自由度とするカイ二乗分布に従う。

          **途中式** $nR^2=«n»\times«r2bp»=«lm»$、自由度は $x_1,x_2,x_3$ の 3。
          $$«c3_05»<«lm»<«c3_01»$$
          なので、5% では棄却するが 1% では棄却しない。

          **答え** 選択肢 0（検定統計量 $«lm»$、自由度 3 で 5% 有意）

          **間違えやすい点** 自由度は切片を数えない（4 にすると $«lm»<«c4_05»$ で結論が逆になる）。決定係数のままでは検定統計量にならない。
          不均一分散が疑われるときは、係数の推定はそのままでも、標準誤差を頑健な標準誤差（ホワイトの標準誤差）に替えるなどの対処をする。

      - id: s08p07c
        chapter: 19
        terms: [omitted-variable-bias, multiple-regression-model, endogeneity]
        topic: 説明変数を落とした単回帰の傾きと説明変数間の相関から欠落変数バイアスを差し引いて重回帰の係数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          簡単のため、説明変数を $x_1$ と $x_2$ の 2 つに絞る。$y$ を $x_1$ だけに回帰した傾きは «b_short»（秒/MB）だった。
          $y$ を $x_1,x_2$ に回帰したときの $x_2$ の係数は «b2»（秒/本）で、標本で $x_1$ と $x_2$ の相関係数は «rr»、標準偏差は $x_1$ が «sx1»（MB）、$x_2$ が «sx2»（本）である。
          $y$ を $x_1,x_2$ に回帰したときの $x_1$ の係数に最も近い値はどれか。
        choices:
          - "$«o_ok»$"
          - "$«o_nod»$"
          - "$«o_rev»$"
          - "$«o_same»$"
          - "$«o_sign»$"
        answer: 0
        distractors:
          - 正解
          - 補助回帰の傾き δ を掛け忘れ、x2 の係数をそのまま引いた
          - 補助回帰の傾きを r·s1/s2 と逆向きにした
          - 変数を加えても x1 の係数は変わらないと考えた
          - バイアスを引くべきところを足した
        explanation: |
          **方針** 同じデータの最小二乗法では、単回帰の傾き $\tilde b_1$ と重回帰の係数 $b_1,b_2$ の間に
          $$\tilde b_1=b_1+b_2\hat\delta$$
          が厳密に成り立つ（$\hat\delta$ は $x_2$ を $x_1$ に回帰した傾き）。$b_2\hat\delta$ が欠落変数バイアス。

          **途中式** $x_2$ を $x_1$ に回帰した傾きは
          $$\hat\delta=r\,\frac{s_{x_2}}{s_{x_1}}=«rr»\times\frac{«sx2»}{«sx1»}=«delta»$$
          $$b_1=\tilde b_1-b_2\hat\delta=«b_short»-«b2»\times«delta»=«b_short»-«bias»=«b1»$$

          **答え** $«o_ok»$

          **間違えやすい点** 回帰の傾きは「目的変数の標準偏差 / 説明変数の標準偏差」に相関を掛ける。ここでは $x_2$ を $x_1$ で説明するので $s_{x_2}/s_{x_1}$（逆にすると $\hat\delta=«delta_w»$、答えは $«o_rev»$）。
          画像の多いページは外部スクリプトも多い（正の相関）ため、$x_2$ を落とした単回帰は $x_1$ の効果を過大に見積もっていた。

  - id: s08p08
    title: エラーログの集計
    context: |
      ある会社では «N» 台の Web サーバが動いている。各サーバの 1 日のエラー件数を調べる。
    items:
      - id: s08p08a
        chapter: 21
        terms: [horvitz-thompson-estimator, inclusion-probability, probability-proportional-to-size-sampling]
        topic: ログ量に比例した包含確率で選んだサーバのエラー件数からホルビッツ・トンプソン推定量で総件数を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          全サーバのログを読むのは手間なので、ログの量に比例した確率で 3 台を非復元で選んだ。選ばれた 3 台の包含確率 $\pi_i$（そのサーバが標本に入る確率）とエラー件数 $y_i$ は次のとおり。

          | サーバ | 1 | 2 | 3 |
          |---|---|---|---|
          | $\pi_i$ | «p1» | «p2» | «p3» |
          | $y_i$ | «y1» | «y2» | «y3» |

          «N» 台全体の 1 日のエラー件数の合計を、ホルビッツ・トンプソン推定量で推定せよ。
        answer: «ht»
        tolerance: 0.5
        answer_format: 整数で答えよ。±0.5 未満の差まで正解とする。
        explanation: |
          **方針** ホルビッツ・トンプソン推定量は $\hat Y=\sum_{i\in s}y_i/\pi_i$。各標本を「包含確率の逆数」台ぶんの代表とみなして足し上げる。

          **途中式**
          $$\hat Y=\frac{«y1»}{«p1»}+\frac{«y2»}{«p2»}+\frac{«y3»}{«p3»}=«h1»+«h2»+«h3»=«ht»$$

          **答え** $«ht»$

          **間違えやすい点** 単純無作為抽出の推定 $N\bar y=«N»\times«ybar»=«Nybar»$ は、ログの多い（エラーも多い）サーバが選ばれやすいことを無視しているので大きく偏る。
          $\pi_i$ で割るところを掛けないこと。包含確率の合計は抽出台数の期待値で、ここに出ていないサーバの $\pi_i$ も含めると 3 になる。

      - id: s08p08b
        chapter: 18
        terms: [poisson-regression, offset-term, link-function]
        topic: リクエスト数をオフセットにしたポアソン回帰の係数から新版サーバの期待エラー件数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          サーバごとの 1 日のエラー件数 $Y$ を、処理したリクエスト数 $m$（千件）と新版ソフトのダミー変数 $v$（新版なら 1、旧版なら 0）で説明する、
          対数リンクのポアソン回帰
          $$\log E[Y]=\log m+\beta_0+\beta_1 v$$
          （$\log m$ は係数を 1 に固定したオフセット項）を当てはめ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$ を得た。
          新版で 1 日に «m» 千件のリクエストを処理するサーバの期待エラー件数に最も近い値はどれか。必要なら $e^{-0.85}=«e085»$、$e^{-1.20}=«e120»$、$e^{0.35}=«e035»$ を使え。
        choices:
          - "$«o_nooff»$"
          - "$«o_old»$"
          - "$«o_ok»$"
          - "$«o_add»$"
          - "$«o_nob0»$"
        answer: 2
        distractors:
          - オフセット（リクエスト数）を掛け忘れた
          - 新版のダミーの効果を入れず旧版の値を答えた
          - 正解
          - 新版の効果を率に掛けずに係数をそのまま足した
          - 切片 β0 を入れ忘れた
        explanation: |
          **方針** 対数リンクなので $E[Y]=m\cdot e^{\beta_0+\beta_1 v}$。オフセットにより「千件あたりのエラー率 $e^{\beta_0+\beta_1v}$」にリクエスト数を掛けた形になる。

          **途中式** 新版（$v=1$）の線形予測子は $«b0»+«b1»=«lin»$、千件あたりの率は $e^{«lin»}=«e085»$。
          $$E[Y]=«m»\times«e085»=«mu»$$

          **答え** $«o_ok»$

          **間違えやすい点** オフセットを忘れると率のまま $«o_nooff»$。$e^{\beta_1}=«e035»$ は「新版の率が旧版の何倍か（率比）」で、旧版の期待件数 $«m»\times«e120»=«o_old»$ に掛けても同じ $«o_ok»$ になる。
          係数 «b1» を率に足すのは対数リンクの読み方として誤り。

