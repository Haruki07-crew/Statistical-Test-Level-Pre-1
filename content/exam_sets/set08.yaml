        tolerance: 0.05
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.05 の差まで正解とする。
        explanation: |
          **方針** B の水準ごとに A の効果を求め、その差の半分をとる。これは対比 $\{(1)-a-b+ab+c-ac-bc+abc\}/4$ と同じ。

          **途中式** B が高水準のときの A の効果：$\{(ab-b)+(abc-bc)\}/2=\{(«dA_hi1»)+(«dA_hi2»)\}/2=«hiB»$。
          B が低水準のときの A の効果：$\{(a-(1))+(ac-c)\}/2=\{(«dA_lo1»)+(«dA_lo2»)\}/2=«loB»$。
          $$AB=\frac{«hiB»-(«loB»)}{2}=«ab_s»$$
          対比で書くと $\{(1)-a-b+ab+c-ac-bc+abc\}/4=«contrast»/4=«ab_s»$ で一致する。

