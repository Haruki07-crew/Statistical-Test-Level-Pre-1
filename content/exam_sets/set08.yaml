        type: choice
        question: |
          サーバの監視指標 5 つ、リクエスト数 $R$、CPU 使用率 $C$、メモリ使用量 $M$、応答時間 $T$、エラー率 $E$ が多変量正規分布に従うとし、
          精度行列（分散共分散行列の逆行列）の非対角成分のうち 0 でないものを辺で結んだところ、辺は $R-C$、$R-M$、$C-T$、$M-T$、$T-E$ の 5 本だった。
