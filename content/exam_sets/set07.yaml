set: 7
title: 模擬試験 第7回
minutes: 90
problems:
  - id: s07p01
    title: 家財保険の請求と保険料
    context: |
      ある損害保険会社は家財保険を販売している。不正請求の調査、1 契約あたりの年間支払額の分布、保険料の設定を順に検討する。
    items:
      - id: s07p01a
        chapter: 1
        terms: [conditional-probability, independence-of-events]
        topic: 2件の保険請求のうち少なくとも1件が不正と判明したとき両方とも不正である条件付き確率（少なくとも1つという条件の扱い）
        level: 基本
        definition: false
        type: numeric
        question: |
          ある契約者から同時期に 2 件の請求があった。過去の傾向から、請求 1 が不正である確率は «p1»、請求 2 が不正である確率は «p2» で、2 件の不正は独立とする。
          調査の結果「2 件のうち**少なくとも 1 件**は不正である」ことがわかった（どちらが不正かはまだわからない）。このとき 2 件とも不正である条件付き確率を求めよ。
        answer: «cond»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「2 件とも不正」は「少なくとも 1 件は不正」に含まれるので、条件付き確率は $P(\text{両方})/P(\text{少なくとも1件})$。少なくとも 1 件の確率は余事象（どちらも不正でない）から求める。

          **途中式** 独立なので
          $$P(\text{両方不正})=«p1»\times«p2»=«both»$$
          $$P(\text{少なくとも1件不正})=1-P(\text{どちらも不正でない})=1-«q1»\times«q2»=1-«none»=«atl»$$
          $$P(\text{両方不正}\mid\text{少なくとも1件不正})=\frac{«both»}{«atl»}=«cond4»\cdots$$

          **答え** $«cond»$

          **間違えやすい点** 「請求 1 が不正」とわかった場合なら、残りの請求 2 が不正である確率は独立性からそのまま $«p2»$ である。「少なくとも 1 件」という条件はそれより弱い情報なので、答えはずっと小さくなる。
          条件を付けずに $«both»$ と答えるのも誤り。条件付き確率では分母を「わかった事象」の確率に取り替える。

      - id: s07p01b
        chapter: 2
        terms: [moment-generating-function, moments, expectation-variance-properties]
        topic: 支払なしの確率の塊とガンマ分布の混合を表す積率母関数を2回微分して年間支払額の分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 契約の年間支払額 $S$（万円）の積率母関数が
          $$M_S(t)=E\left[e^{tS}\right]=«w0»+«w1»\,(1-«th»t)^{-«k»}\qquad\left(t<\tfrac{1}{«th»}\right)$$
          であることがわかっている。$V[S]$ に最も近い値はどれか。
        choices:
          - "$«v_m2»$"
          - "$«v_gam»$"
          - "$«var»$"
          - "$«v_cond»$"
          - "$«v_m2m»$"
        answer: 2
        distractors:
          - M''(0)=E[S^2] を分散と取り違えた
          - 支払が起きたときのガンマ分布の分散だけを答え、支払なしの確率を無視した
          - 正解
          - 支払があるときの分散に確率 0.2 を掛けただけで、平均の違いによる分散を落とした
          - E[S^2] から E[S]^2 ではなく E[S] を引いた
        explanation: |
          **方針** $M_S'(0)=E[S]$、$M_S''(0)=E[S^2]$ を使い、$V[S]=E[S^2]-(E[S])^2$。
          （$M_S(t)$ は「確率 «w0» で 0（支払なし）、確率 «w1» で形状 «k»・尺度 «th» のガンマ分布」の混合分布の積率母関数である。）

          **途中式**
          $$M_S'(t)=«w1»\times«k»\times«th»\,(1-«th»t)^{-«k1»},\qquad M_S''(t)=«w1»\times«k»\times«k1»\times«th»^2\,(1-«th»t)^{-4}$$
          $$E[S]=M_S'(0)=«a1»,\qquad E[S^2]=M_S''(0)=«a2»$$
          $$V[S]=«m2»-«m1»^2=«m2»-«m1sq»=«var»$$

          **答え** $«var»$

          **間違えやすい点** 定数項 «w0» は微分で消えるが、確率 «w0» で 0 になることは期待値・2 次モーメントに «w1» が掛かる形で効いている。ガンマ分布の分散 $«gvar»$ をそのまま答えるのは誤り。
          全分散の公式で確かめると、$V[S]=E[V[S\mid I]]+V[E[S\mid I]]=«w1»\times«gvar»+«w1»\times«w0»\times«gmean»^2=«var»$（$I$ は支払の有無）。支払の有無による平均の違いの分を落とすと $«v_cond»$ になる。

      - id: s07p01c
        chapter: 7
        terms: [central-limit-theorem, expectation-variance-properties]
        topic: 独立な契約の年間支払総額が保険料収入を超える確率を1%以下に抑える1契約あたり保険料を中心極限定理で決める
        level: 応用
        definition: false
        type: numeric
        question: |
          前問の支払額の分布をもつ契約が «n» 件あり、各契約の支払額は互いに独立とする。全契約から同じ保険料 $P$ 万円を集めるとき、
          年間の支払総額が保険料収入の合計 «n»$P$ を超える確率が 1% 以下になる最小の $P$ を、中心極限定理による正規近似で求めよ。
          標準正規分布の上側 1% 点は «z» とし、必要なら前問の結果を使え。
        answer: «prem»
        tolerance: 0.01
        answer_format: 万円単位で小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 支払総額 $T=S_1+\cdots+S_{«n»}$ は独立同分布の和なので、中心極限定理により平均 $nE[S]$、分散 $nV[S]$ の正規分布で近似できる。$P(T>nP)\le0.01$ を $P$ について解く。

          **途中式** $E[S]=«m1»$、$V[S]=«var»$（前問）より $E[T]=«n»\times«m1»=«tot_mean»$、$T$ の標準偏差は $\sqrt{«n»\times«var»}=«sqn»\times\sqrt{«var»}=«sqn»\times«sdv»=«tot_sd»$。
          $$P(T>«n»P)\approx P\left(Z>\frac{«n»P-«tot_mean»}{«tot_sd»}\right)\le0.01\iff «n»P\ge«tot_mean»+«z»\times«tot_sd»$$
          両辺を «n» で割ると
          $$P\ge«m1»+\frac{«z»\times«sdv»}{\sqrt{«n»}}=«m1»+«load»=«prem4»$$

          **答え** $«prem»$ 万円（純保険料 «m1» 万円に安全割増 «load» 万円を加えたもの）

          **間違えやすい点** 割増は $z\sigma/\sqrt{n}$ で、$n$ で割るのではない（総額の標準偏差は $\sqrt{n}$ 倍にしかならない）。分散 «var» を標準偏差の代わりに使うと $«w_var»$ 万円、上側 5% 点 1.645 を使うと $«w_1645»$ 万円になる。
          支払額の分布は 0 に塊があり大きく右に歪んでいるが、«n» 件の和なら正規近似が使える。契約数が増えるほど 1 件あたりの割増は $1/\sqrt{n}$ で小さくなる。

  - id: s07p02
    title: 火災保険の大口損害
    context: |
      ある保険会社の火災保険で、1 億円を超えた大口損害の損害額 $X$（億円）は、パレート分布
      $$f(x)=\frac{\alpha\,\theta^{\alpha}}{x^{\alpha+1}}\qquad(x>\theta)$$
      に従うとする。$\theta>0$ は損害額の下限（ここでは 1 億円）、$\alpha>0$ は裾の厚さを表す母数で、$\alpha$ が小さいほど巨額の損害が起こりやすい。
    items:
      - id: s07p02a
        chapter: 4
        terms: [change-of-variables, log-transformation]
        topic: パレート分布に従う損害額を下限で割って対数をとった量の密度を変数変換で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $Y=\log(X/\theta)$（自然対数）の確率密度関数 $g(y)$（$y>0$）として正しいものはどれか。
        choices:
          - "$\\dfrac{\\alpha}{\\theta}e^{-(\\alpha+1)y}$"
          - "$\\alpha e^{-\\alpha y}$"
          - "$1-e^{-\\alpha y}$"
          - "$\\dfrac{\\alpha}{(1+y)^{\\alpha+1}}$"
          - "$\\alpha y^{-\\alpha-1}$"
        answer: 1
        distractors:
          - x=θe^y を密度に代入しただけで、ヤコビアン dx/dy=θe^y を掛け忘れた
          - 正解
          - 密度ではなく分布関数を答えた
          - 逆変換を x=θ(1+y) と誤った
          - x を y に置き換えただけで変換をしていない
        explanation: |
          **方針** $y=\log(x/\theta)$ は $x>\theta$ で単調増加。逆変換 $x=\theta e^{y}$ を密度に代入し、ヤコビアン $|dx/dy|$ を掛ける。

          **途中式** $x=\theta e^{y}$、$\dfrac{dx}{dy}=\theta e^{y}$ より
          $$g(y)=f(\theta e^{y})\cdot\theta e^{y}=\frac{\alpha\theta^{\alpha}}{\theta^{\alpha+1}e^{(\alpha+1)y}}\cdot\theta e^{y}=\alpha e^{-\alpha y}\qquad(y>0)$$
          確認として、$P(Y>y)=P(X>\theta e^{y})=\left(\dfrac{\theta}{\theta e^{y}}\right)^{\alpha}=e^{-\alpha y}$ を微分して符号を変えても同じ式になる。

          **答え** $\alpha e^{-\alpha y}$（レート $\alpha$ の指数分布）

          **間違えやすい点** ヤコビアンを掛け忘れると $\dfrac{\alpha}{\theta}e^{-(\alpha+1)y}$ になり、積分しても 1 にならない（$\theta$ が残るのもおかしい）。
          対数をとるとパレート分布が指数分布になるので、$\alpha$ の推定などは指数分布の問題に帰着できる。

      - id: s07p02b
        chapter: 3
        terms: [quantile-function, conditional-expectation]
        topic: パレート分布に従う大口損害の99%分位点（VaR）と分位点を超えたときの条件付き期待値（期待ショートフォール）を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          $\theta=«theta»$、$\alpha=«alpha»$ とする。損害額の 99% 分位点（VaR）を $v$（$P(X\le v)=0.99$）とするとき、
          損害額が $v$ を超えた場合の平均損害額 $E[X\mid X>v]$（期待ショートフォール）を求めよ。必要なら $100^{1/3}=«cube»$ を使え。
        answer: «es»
        tolerance: 0.01
        answer_format: 億円単位で小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 分布関数 $F(x)=1-(\theta/x)^{\alpha}$ を逆に解いて分位点を求める。次に、$X>v$ という条件のもとでの $X$ の分布を求め、その期待値を計算する。

          **途中式** $1-(1/v)^{«alpha»}=0.99$ より $v^{«alpha»}=100$、$v=100^{1/3}=«var99»$。
          $x>v$ で $P(X>x\mid X>v)=\dfrac{(\theta/x)^{\alpha}}{(\theta/v)^{\alpha}}=(v/x)^{\alpha}$ なので、条件付き分布は下限 $v$・形状 $\alpha$ のパレート分布。形状 $\alpha\,(>1)$ のパレート分布の期待値は（下限）$\times\alpha/(\alpha-1)$ だから
          $$E[X\mid X>v]=\frac{\alpha}{\alpha-1}v=\frac{«alpha»}{«a1»}\times«var99»=«es4»$$
          （積分で書くと $\dfrac{1}{0.01}\displaystyle\int_v^{\infty}x\cdot\frac{«alpha»}{x^{«alpha»+1}}\,dx=100\times\frac{«alpha»}{«a1»}v^{-2}=\frac{«alpha»}{«a1»}v$。）

          **答え** $«es»$ 億円（VaR $«var99»$ 億円の «fac» 倍）

          **間違えやすい点** VaR（分位点）そのものは «var99» 億円で、それを超えたときの平均はさらに大きい。指数分布のような無記憶性を当てはめて「VaR + 全体の平均 «mean»」とすると $«w_mem»$ 億円になるが、パレート分布では超過分の平均が閾値に比例して大きくなる（裾が重い）。

  - id: s07p03
    title: 運用会社の成績評価
    context: |
      ある年金基金は、委託先の運用成績を統計的に評価している。
    items:
      - id: s07p03a
        chapter: 10
        terms: [randomized-test, significance-level, binomial-test]
        topic: 勝ち月数の二項検定で有意水準をちょうど5%にするランダム化検定の境界値での棄却確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          あるファンドマネージャーの 12 か月の成績のうち、ベンチマークを上回った月数を $X$ とする。各月は独立で、上回る確率を $p$ とすると $X\sim B(12,p)$。
          $H_0:p=0.5$ 対 $H_1:p>0.5$ の検定で、「$X\ge10$ なら棄却、$X=9$ なら確率 $\gamma$ で棄却（くじを引く）、$X\le8$ なら棄却しない」というランダム化検定を考える。
          有意水準がちょうど 0.05 になる $\gamma$ を求めよ。必要なら $2^{12}=«tot»$ を使え。
        answer: «gam»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 二項分布は離散なので、ランダム化しない検定では有意水準をちょうど 5% にできない。境界の値 $X=9$ で確率 $\gamma$ だけ棄却し、$P(X\ge10)+\gamma P(X=9)=0.05$ となるよう $\gamma$ を決める。

          **途中式** $H_0$ のもとで各結果の確率は $\binom{12}{x}/«tot»$。
          $$P(X\ge10)=\frac{66+12+1}{«tot»}=\frac{«t10»}{«tot»},\qquad P(X=9)=\frac{\binom{12}{9}}{«tot»}=\frac{«c9»}{«tot»}$$
          $$\frac{«t10»}{«tot»}+\gamma\frac{«c9»}{«tot»}=0.05\iff «t10»+«c9»\gamma=0.05\times«tot»=«target»$$
          $$\gamma=\frac{«target»-«t10»}{«c9»}=\frac{«num»}{«c9»}=«gam4»\cdots$$

          **答え** $«gam»$

          **間違えやすい点** 棄却域を $X\ge10$ だけにすると有意水準は $«a10»$、$X\ge9$ にすると $«a9»$ で、どちらも 0.05 にならない。
          $\gamma$ は「$X=9$ のときに棄却する確率」で、$P(X=9)$ を掛けてから有意水準に足す。$0.05-P(X\ge10)$ をそのまま答えないこと。

      - id: s07p03b
        chapter: 13
        terms: [kruskal-wallis-test, rank-and-ties, nonparametric-methods-overview]
        topic: 3つの運用スタイルのファンドの年間収益率をクラスカル・ウォリス検定で比べる
        level: 標準
        definition: false
        type: choice
        question: |
          運用スタイルの違う 3 つのグループから 4 本ずつファンドを選び、ある年の収益率（%）を調べた（同順位はない）。
          | バリュー | «a0» | «a1» | «a2» | «a3» |
          |---|---|---|---|---|
          | グロース | «b0» | «b1» | «b2» | «b3» |
          | インデックス | «c0» | «c1» | «c2» | «c3» |
          「3 グループの収益率の分布は同じ」という帰無仮説を、クラスカル・ウォリス検定（統計量 $H$ をカイ二乗分布で近似）で有意水準 5% で調べる。
          カイ二乗分布の上側 5% 点は自由度 2 で 5.991、自由度 3 で 7.815、上側 2.5% 点は自由度 2 で 7.378 である。正しいものはどれか。
        choices:
          - "$H\\approx«H»$ で、自由度 3 の上側 5% 点 7.815 を超えないので帰無仮説を棄却しない"
          - "$H\\approx«H»$ で、自由度 2 の上側 5% 点 5.991 を超えるので帰無仮説を棄却する"
          - "$H\\approx«H»$ で、自由度 2 の上側 5% 点 5.991 を超えるので、3 グループの収益率の分布はどの 2 つも互いに異なると結論する"
          - "$H\\approx«Hw»$ で、自由度 2 の上側 5% 点 5.991 を超えるので帰無仮説を棄却する"
          - "$H\\approx«H»$ で、自由度 2 の上側 2.5% 点 7.378 を超えないので有意水準 5% で帰無仮説を棄却しない"
        answer: 1
        distractors:
          - 自由度をグループ数 3 とした
          - 正解
          - 棄却は「少なくとも1つのグループが他と異なる」ことを示すだけで、どの2つも異なるとは言えない
          - 統計量の最後の項を 3(N+1) ではなく 3N とした
          - 上側だけで判定する検定なのに、両側のように α を半分にして 2.5% 点と比べた
        explanation: |
          **方針** 12 本全体で順位を付け、グループごとの順位和 $R_j$ から
          $H=\dfrac{12}{N(N+1)}\sum_j\dfrac{R_j^2}{n_j}-3(N+1)$ を計算する。帰無仮説のもとで $H$ は近似的に自由度「グループ数 − 1」のカイ二乗分布に従い、大きいときだけ棄却する（上側検定）。

          **途中式** 小さい順に 1〜12 の順位を付けると、順位和はバリュー $R_1=1+2+4+6=«R1»$、グロース $R_2=3+5+9+10=«R2»$、インデックス $R_3=7+8+11+12=«R3»$（合計 78 で確認）。
          $$\sum_j\frac{R_j^2}{4}=\frac{«R1»^2+«R2»^2+«R3»^2}{4}=«Ssq»$$
          $$H=\frac{12}{12\times13}\times«Ssq»-3\times13=«H4»\cdots$$
          自由度は $3-1=2$。$«H»>5.991$ なので有意水準 5% で棄却する。

          **答え** $H\approx«H»$、自由度 2 の 5% 点を超えるので帰無仮説を棄却する。

          **間違えやすい点** 自由度はグループ数 3 ではなく $3-1=2$。$H$ は群間の順位のずれの 2 乗に相当し、大きい値だけが帰無仮説に反するので、上側 5% 点と比べる（2.5% 点にしない）。
          棄却して言えるのは「3 つの分布がすべて同じではない」ことで、どのグループの組に差があるかは多重比較で別に調べる。

      - id: s07p03c
        chapter: 8
        terms: [mean-squared-error, unbiased-estimator, point-estimation]
        topic: 平均収益率の標本平均を定数倍した縮小推定量の平均二乗誤差を最小にする定数と最小値を求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある戦略の月次超過収益率 $X_1,\ldots,X_{«m»}$（%）は独立に平均 $\mu$、標準偏差 $\sigma$ の分布に従う。$\mu$ の推定量として、標本平均 $\bar X$ を定数倍した $c\bar X$ を考える。
          仮に $\mu=«mu»$、$\sigma=«sig»$ であるとき、平均二乗誤差 $\mathrm{MSE}(c)=E\left[(c\bar X-\mu)^2\right]$ を最小にする $c$ と、そのときの MSE の組として正しいものはどれか。
        choices:
          - "«c_one»"
          - "«c_swap»"
          - "«c_ok»"
          - "«c_nobias»"
          - "«c_sig»"
        answer: 2
        distractors:
          - 不偏推定量（c=1）が MSE も最小だと思い込んだ
          - 最適な c の分子に μ^2 ではなく σ^2/n を置いた（分子と分母の項を取り違えた）
          - 正解
          - MSE を分散 c^2σ^2/n だけで計算し、偏りの2乗を足し忘れた
          - 標本平均の分散 σ^2/n の代わりに 1 個の分散 σ^2 を使った
        explanation: |
          **方針** MSE は「分散 + 偏りの 2 乗」に分解できる。$c\bar X$ の分散は $c^2\sigma^2/n$、偏りは $(c-1)\mu$。$c$ の 2 次関数を最小化する。

          **途中式** $\sigma^2/n=«sig»^2/«m»=«v»$、$\mu^2=«mu2»$ より
          $$\mathrm{MSE}(c)=c^2\frac{\sigma^2}{n}+(1-c)^2\mu^2=«v»\,c^2+«mu2»\,(1-c)^2$$
          $c$ で微分して 0 とおくと $2c\,\sigma^2/n-2(1-c)\mu^2=0$ より
          $$c^*=\frac{\mu^2}{\mu^2+\sigma^2/n}=\frac{«mu2»}{«den»}=«cs»$$
          $$\mathrm{MSE}(c^*)=\frac{\mu^2\cdot\sigma^2/n}{\mu^2+\sigma^2/n}=\frac{«mu2»\times«v»}{«den»}=«mse_s»$$

          **答え** $c=«cs»$、最小の MSE は $«mse_s»$（$\bar X$ 自身の MSE $«mse1»$ の «ratio» 倍）

          **間違えやすい点** 不偏推定量 $\bar X$（$c=1$）は偏りが 0 でも分散が大きく、MSE が最小とは限らない。偏りを少し認めて分散を減らすと MSE を小さくできる（偏りと分散のトレードオフ）。
          ただし $c^*$ は未知の $\mu$ に依存するので、実際にはこの $c^*$ をそのまま使うことはできない。月次の平均収益率のように「平均に比べてばらつきが大きい」量ほど、縮小の効果が大きい。

  - id: s07p04
    title: 新しいローン商品の延滞率
    context: |
      ある銀行は新しい個人向けローン商品を発売した。最初の «n» 件のうち、1 年以内に延滞したのは «x» 件だった。各ローンは独立に確率 $p$ で延滞するとする。
    items:
      - id: s07p04a
        chapter: 9
        terms: [wilson-interval, wald-confidence-interval, ci-proportion]
        topic: 延滞がわずか2件のときに延滞率のウィルソンの95%信頼区間（スコア区間）を求めワルド区間と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          正規近似のスコア検定 $\left|\hat p-p\right|\le1.96\sqrt{p(1-p)/n}$ を $p$ について解いて得られる 95% 信頼区間（ウィルソンの区間）に最も近いものはどれか。
          $\hat p=x/n$ で、標準正規分布の上側 2.5% 点は 1.96、上側 5% 点は 1.645 とする。
        choices:
          - "$«ci_wald»$"
          - "$«ci_ok»$"
          - "$«ci_clip»$"
          - "$«ci_90»$"
          - "$«ci_mix»$"
        answer: 1
        distractors:
          - 標準誤差に推定値 p̂ を使うワルド型の区間を作った（下限が負になる）
          - 正解
          - ワルド型の区間の負の下限を 0 で切っただけ
          - 上側5%点 1.645 を使った（90%区間）
          - ウィルソンの区間の幅を、中心を補正せずに p̂ の周りに付けた
        explanation: |
          **方針** 不等式の両辺を 2 乗すると $p$ の 2 次不等式 $(\hat p-p)^2\le z^2p(1-p)/n$ になる。これを解くと、中心 $\dfrac{x+z^2/2}{n+z^2}$、半幅 $\dfrac{z}{n+z^2}\sqrt{n\hat p(1-\hat p)+z^2/4}$ の区間が得られる。

          **途中式** $z^2=«z2»$、$\hat p=«ph»$。
          $$\text{中心}=\frac{«x»+«z2h»}{«n»+«z2»}=\frac{«xz»}{«nz2»}=«cen»$$
          $$\text{半幅}=\frac{1.96}{«nz2»}\sqrt{«n»\times«ph»\times(1-«ph»)+«z24»}=\frac{1.96}{«nz2»}\sqrt{«npq»+«z24»}=\frac{1.96\times«sq»}{«nz2»}=«hw»$$
          区間は $(«cen»-«hw»,\ «cen»+«hw»)=(«lo»,\ «hi»)$。

          **答え** $«ci_ok»$

          **間違えやすい点** ワルド区間 $\hat p\pm1.96\sqrt{\hat p(1-\hat p)/n}=«ph»\pm«wald_hw»$ は下限が負になり、延滞件数が少ないときは被覆確率も 95% を大きく下回る。0 で切っても直らない。
          ウィルソンの区間は中心が $\hat p$ より 0.5 の側へ寄り、$[0,1]$ の中に収まる。

  - id: s07p05
    title: 中小企業向け融資の延滞
    context: |
      ある地方銀行は、中小企業向け融資の延滞の状況を、業種や企業規模で分けて調べている。
    items:
      - id: s07p05a
        chapter: 5
        terms: [fisher-exact-test, hypergeometric-distribution]
        topic: 件数の少ない業種別の延滞の2×2表でフィッシャーの正確検定の片側p値を超幾何確率から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          新しく始めた創業支援融資 «N» 件の 1 年後の状況は次の通りだった。
          | | 延滞あり | 延滞なし | 計 |
          |---|---|---|---|
          | 飲食業 | «d1» | «nd1» | «n1» |
          | その他 | «d2» | «nd2» | «n2» |
          | 計 | «K» | «NK» | «N» |
          「飲食業は延滞しやすい」かを、周辺度数を固定したフィッシャーの正確検定（片側）で調べる。片側 $p$ 値を求めよ。必要なら $\binom{«N»}{«n1»}=«tot»$ を使え。
        answer: «pval»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 周辺度数を固定すると、帰無仮説（業種と延滞が独立）のもとで飲食業の延滞件数 $X$ は超幾何分布に従う：«N» 件のうち延滞 «K» 件の中から、飲食業の «n1» 件を無作為に選んだときの延滞件数。片側 $p$ 値は観測値 «d1» 以上となる確率。

          **途中式**
          $$P(X=k)=\frac{\binom{«K»}{k}\binom{«NK»}{«n1»-k}}{\binom{«N»}{«n1»}}$$
          $$P(X=4)=\frac{\binom{5}{4}\binom{9}{2}}{«tot»}=\frac{«c54»\times«c92»}{«tot»}=\frac{«p4c»}{«tot»},\qquad P(X=5)=\frac{\binom{5}{5}\binom{9}{1}}{«tot»}=\frac{«p5c»}{«tot»}$$
          （延滞は全部で 5 件なので $X\le5$。）
          $$p\text{ 値}=\frac{«p4c»+«p5c»}{«tot»}=\frac{«psum»}{«tot»}=«pval4»\cdots$$

          **答え** $«pval»$（5% 水準では有意でない）

          **間違えやすい点** $p$ 値は観測値「以上」の確率なので、$P(X=4)=«p4»$ だけでは足りない。
          期待度数が 5 未満のセルがあるので、カイ二乗検定の近似はあてにならず、正確検定を使う場面である。

      - id: s07p05b
        chapter: 28
        terms: [loglinear-model, three-way-table, expected-frequency]
        topic: 業種と規模と延滞の3元分割表で業種を与えると規模と延滞が条件付き独立な対数線形モデルの期待度数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          既存の融資 «tt» 件を、業種（製造業・サービス業）、企業規模（小規模・中規模以上）、延滞の有無で集計した。
          | 業種 | 規模 | 延滞あり | 延滞なし |
          |---|---|---|---|
          | 製造業 | 小規模 | «tMSD» | «tMSN» |
          | 製造業 | 中規模以上 | «tMLD» | «tMLN» |
          | サービス業 | 小規模 | «tVSD» | «tVSN» |
          | サービス業 | 中規模以上 | «tVLD» | «tVLN» |
          業種を $A$、規模を $B$、延滞を $C$ とし、「業種を与えたとき規模と延滞は条件付き独立」という対数線形モデル $[AB][AC]$ を当てはめる。
          このモデルのもとでの「製造業・小規模・延滞あり」のセルの期待度数（最尤推定値）として正しいものはどれか。
        choices:
          - "$«e_mut»$"
          - "$«e_abc»$"
          - "$«e_ok»$"
          - "$«e_acb»$"
          - "$«e_obs»$"
        answer: 2
        distractors:
          - 3つの変数が互いに独立なモデル [A][B][C] の期待度数を計算した
          - 延滞が業種・規模の組と独立なモデル [AB][C] の期待度数を計算した
          - 正解
          - 規模が業種・延滞の組と独立なモデル [AC][B] の期待度数を計算した
          - 観測度数をそのまま答えた（飽和モデル）
        explanation: |
          **方針** $[AB][AC]$ は「業種ごとに見ると規模と延滞が独立」というモデルで、期待度数は業種ごとの独立モデルの式 $\hat m_{ijk}=\dfrac{n_{ij+}\,n_{i+k}}{n_{i++}}$ で求まる（$n_{ij+}$ などは添字を足し合わせた周辺度数）。

          **途中式** 製造業の合計 $n_{1++}=«nA»$、製造業・小規模 $n_{11+}=«tMSD»+«tMSN»=«nAB»$、製造業・延滞あり $n_{1+1}=«tMSD»+«tMLD»=«nAC»$。
          $$\hat m_{111}=\frac{«nAB»\times«nAC»}{«nA»}=«e_ok»$$

          **答え** $«e_ok»$

          **間違えやすい点** 3 変数すべての独立 $[A][B][C]$ なら $\dfrac{n_{1++}n_{+1+}n_{++1}}{n^2}=\dfrac{«nA»\times«nB»\times«nC»}{«tt»^2}=«e_mut»$ になる。どの周辺度数を固定するかはモデルの「生成元」（$[AB]$ と $[AC]$）で決まる。
          観測度数 «tMSD» と期待度数 «e_ok» の差は、製造業の中で小規模企業ほど延滞しやすい（$B$ と $C$ の関連がある）ことを示唆しており、適合度は $G^2$ などで調べる。

  - id: s07p06
    title: 株価指数の日次データの分析
    context: |
      ある証券会社のアナリストは、株価指数の日次の対数収益率（%）の性質を調べている。
    items:
      - id: s07p06a
        chapter: 12
        terms: [kolmogorov-smirnov-test, cumulative-distribution-function, goodness-of-fit-test]
        topic: 5日分の標準化した収益率の経験分布関数と標準正規分布関数の最大のずれからコルモゴロフ・スミルノフ統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある 5 日間の収益率を、過去 10 年の長期データから求めた平均と標準偏差で標準化した値（今回のデータからは推定していない）を小さい順に並べると、次のようになった。標準正規分布の分布関数 $\Phi$ の値も示す。
          | 標準化した値 $x_{(i)}$ | «x0» | «x1» | «x2» | «x3» | «x4» |
          |---|---|---|---|---|---|
          | $\Phi(x_{(i)})$ | «F0» | «F1» | «F2» | «F3» | «F4» |
          「標準化した値は標準正規分布に従う」という帰無仮説のコルモゴロフ・スミルノフ検定（1 標本）について正しいものはどれか。$n=5$、有意水準 5% の棄却限界値は «cv» とする。
        choices:
          - "$D\\approx«Dp»$ で、«cv» を超えないので帰無仮説を棄却しない"
          - "$D\\approx«D»$ で、«cv» を超えないので帰無仮説を棄却しない"
          - "$D\\approx«D»$ で、«cv» を超えないので、収益率が正規分布に従うことが示された"
          - "$D\\approx«D»$ で、有意水準 0.05 を超えるので帰無仮説を棄却する"
          - "$D\\approx«D»$ で、«cv» を超えないので帰無仮説を棄却しない。なお、標準化に今回の 5 日分の平均と標準偏差を使っても同じ限界値で検定できる"
        answer: 1
        distractors:
          - 経験分布関数の各段の上端（i/n）とのずれだけを見て、段の下端（(i-1)/n）とのずれを見落とした
          - 正解
          - 棄却しないことは帰無仮説が正しいことの証明ではない
          - 統計量 D を有意水準 α と比べてしまった
          - 母数をデータから推定すると通常の限界値は使えない（リリフォース型の補正が必要）
        explanation: |
          **方針** 経験分布関数 $F_n$ は各データ点で $1/n$ ずつ跳ぶ階段関数なので、$D=\sup_x|F_n(x)-\Phi(x)|$ は各点の跳ぶ直後のずれ $i/n-\Phi(x_{(i)})$ と直前のずれ $\Phi(x_{(i)})-(i-1)/n$ の最大値として求まる。

          **途中式**
          | $i$ | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $i/5-\Phi(x_{(i)})$ | «dp0» | «dp1» | «dp2» | «dp3» | «dp4» |
          | $\Phi(x_{(i)})-(i-1)/5$ | «dm0» | «dm1» | «dm2» | «dm3» | «dm4» |
          最大値は $\Phi(x_{(5)})-4/5=«F4»-0.8=«dm4»$ なので $D\approx«D»$。$«D»<«cv»$ なので棄却しない。

          **答え** $D\approx«D»$、5% 水準で棄却しない。

          **間違えやすい点** 段の上端とのずれだけを見ると $«Dp»$ になり、最大のずれ（5 番目の点の直前）を見落とす。
          今回は母数を外部の長期データから決めているので通常の限界値が使える。同じデータから平均と標準偏差を推定して標準化すると $D$ が小さくなりやすく、そのままの限界値では検定が保守的になる（リリフォース検定などを使う）。
          また $n=5$ では検出力がとても低く、「棄却しない」は正規性の証拠としては弱い。

      - id: s07p06b
        chapter: 27
        terms: [unit-root, forecasting, arima-model]
        topic: ドリフト付きランダムウォークに従う対数株価の25日先の予測区間を予測誤差分散が期間に比例することから求める
        level: 基本
        definition: false
        type: choice
        question: |
          株価指数の対数を $p_t$ とし、ドリフト付きランダムウォーク $p_t=p_{t-1}+\mu+\varepsilon_t$（$\varepsilon_t$ は独立に $N(0,\sigma^2)$）に従うとする。
          日次の対数収益率（%）で $\mu=«mu»$、$\sigma=«sig»$ とするとき、今日から «h» 営業日後までの対数収益率 $p_{T+«h»}-p_T$（%）の 95% 予測区間に最も近いものはどれか。標準正規分布の上側 2.5% 点は 1.96、上側 5% 点は 1.645 とする。
        choices:
          - "$«rw_one»$"
          - "$«rw_h»$"
          - "$«rw_ok»$"
          - "$«rw_nod»$"
          - "$«rw_90»$"
        answer: 2
        distractors:
          - 1日分の標準偏差のまま予測区間を作った
          - 標準偏差を √h 倍ではなく h 倍した（分散を h^2 倍にした）
          - 正解
          - ドリフトを無視して中心を 0 にした
          - 上側5%点 1.645 を使った（90%区間）
        explanation: |
          **方針** $p_{T+h}-p_T=h\mu+\sum_{j=1}^{h}\varepsilon_{T+j}$ で、誤差は独立なので分散は $h\sigma^2$。予測誤差の分散が $h$ に比例して増え続けるのが、単位根をもつ（非定常な）過程の特徴である。

          **途中式** 平均 $«h»\times«mu»=«m»$、分散 $«h»\times«sig»^2=«varh»$、標準偏差 $\sqrt{«varh»}=«sd»$。
          $$«m»\pm1.96\times«sd»=«m»\pm«hw»$$

          **答え** $«rw_ok»$（%）

          **間違えやすい点** 標準偏差は $\sqrt{h}$ 倍（$h$ 倍ではない）。分散が $h$ 倍なので「時間の平方根に比例してリスクが増える」。
          定常な AR(1) 過程なら予測誤差の分散は一定値に収束するが、ランダムウォークでは上限なく広がる。

  - id: s07p07
    title: 社債の格付けと投資判断
    context: |
      ある機関投資家は、社債の格付けの推移と、発行企業の財務情報をもとに投資判断をしている。
    items:
      - id: s07p07a
        chapter: 14
        terms: [n-step-transition-probability, chapman-kolmogorov-equation, transition-probability-matrix]
        topic: 格付け推移行列の2乗から現在A格の企業が2年後にデフォルトしている確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          格付けを「A」「B」「D（デフォルト）」の 3 状態とし、1 年ごとの推移確率を次のように仮定する（行が今年、列が翌年。D からは抜けない）。
          | | A | B | D |
          |---|---|---|---|
          | A | «aa» | «ab» | «ad» |
          | B | «ba» | «bb» | «bd» |
          | D | 0 | 0 | 1 |
          現在 A 格の企業が、2 年後にデフォルトの状態にある確率に最も近いものはどれか。
        choices:
          - "$«w_dbl»$"
          - "$«w_ind»$"
          - "$«two»$"
          - "$«w_noabs»$"
          - "$«w_sq»$"
        answer: 2
        distractors:
          - 1年のデフォルト確率を単純に2倍した
          - 格付けが変わらないとみなし、毎年 0.02 でデフォルトする独立な試行とした
          - 正解
          - 1年目にデフォルトしてそのままの経路（D→D）を数え忘れた
          - 2年続けて A→D が起こる確率とした
        explanation: |
          **方針** 2 年後の推移確率は推移行列の 2 乗の成分（チャップマン・コルモゴロフ方程式）：$P^{(2)}_{AD}=\sum_kP_{Ak}P_{kD}$。1 年後の状態 $k$ で場合分けする。

          **途中式**
          $$P^{(2)}_{AD}=P_{AA}P_{AD}+P_{AB}P_{BD}+P_{AD}P_{DD}=«aa»\times«ad»+«ab»\times«bd»+«ad»\times1=«t1»+«t2»+«t3»=«two»$$

          **答え** $«two»$

          **間違えやすい点** 1 年目に B 格へ格下げされると、2 年目のデフォルト確率は «bd» に上がる。格付けの変化を無視して $1-(1-«ad»)^2=«w_ind»$ とすると、この経路の分だけ過小評価する。
          D は吸収状態なので、1 年目にデフォルトした企業は 2 年後も D にいる（$P_{DD}=1$ の項を忘れない）。

      - id: s07p07b
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, link-function]
        topic: 格付けの順序ロジットモデルで閾値と係数とレバレッジから中位の格付けになる確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          企業の格付けを順序のある 3 区分 $Y=1$（高格付け）、$Y=2$（中位）、$Y=3$（低格付け）とし、レバレッジ指標 $x$ を説明変数とする順序ロジットモデル
          $$P(Y\le j\mid x)=\frac{1}{1+\exp\{-(\theta_j-\beta x)\}}\qquad(j=1,2)$$
          を当てはめたところ、$\hat\theta_1=«th1»$、$\hat\theta_2=«th2»$、$\hat\beta=«beta»$ だった。$x=«x»$ の企業が中位（$Y=2$）に格付けされる確率に最も近いものはどれか。
          必要なら $e^{1.5}=«e15»$、$e^{-0.5}=«em05»$ を使え。
        choices:
          - "$«o_L2»$"
          - "$«o_L1»$"
          - "$«p2»$"
          - "$«o_p3»$"
          - "$«o_ge2»$"
        answer: 2
        distractors:
          - 累積確率 P(Y≦2) をそのまま答えた
          - P(Y≦1)（高格付けの確率）を答えた
          - 正解
          - 低格付け P(Y=3) を答えた
          - P(Y≧2) を答えた
        explanation: |
          **方針** 順序ロジットモデルは累積確率をロジスティック関数で表す。区分ごとの確率は累積確率の差 $P(Y=2)=P(Y\le2)-P(Y\le1)$ で求める。

          **途中式** $\hat\beta x=«beta»\times«x»=«bx»$。
          $$P(Y\le1)=\frac{1}{1+e^{-(«th1»-«bx»)}}=\frac{1}{1+e^{1.5}}=\frac{1}{1+«e15»}=«L1»$$
          $$P(Y\le2)=\frac{1}{1+e^{-(«th2»-«bx»)}}=\frac{1}{1+e^{-0.5}}=\frac{1}{1+«em05»}=«L2»$$
          $$P(Y=2)=«L2»-«L1»=«p2_4»$$

          **答え** $«p2»$

          **間違えやすい点** モデルが直接与えるのは累積確率 $P(Y\le j)$ で、$P(Y=2)$ ではない。
          この形（$\theta_j-\beta x$）では $\beta>0$ のとき $x$ が大きいほど $P(Y\le j)$ が小さくなり、低い格付けに移りやすい。符号の付け方は流儀によって $\theta_j+\beta x$ と書くこともあるので、式を確認する。

      - id: s07p07c
        chapter: 31
        terms: [bayes-decision-theory, posterior-distribution, bayes-theorem]
        topic: 業績下方修正の情報で格付けシナリオの事後確率を求め事後期待損失が最小の社債投資方針を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          ある社債について、1 年後のシナリオを「格付け維持」「格下げ」「デフォルト」の 3 つとし、事前確率を «pr1»、«pr2»、«pr3» とする。
          この企業が業績の下方修正を発表した。下方修正が発表される確率は、各シナリオのもとでそれぞれ «lk1»、«lk2»、«lk3» とする。
          投資方針ごとの損失（億円、負の値は利益）は次の通り。
          | 方針 | 維持 | 格下げ | デフォルト |
          |---|---|---|---|
          | 全額投資 | −4 | 3 | 20 |
          | ヘッジつき半額投資 | −2 | 0.5 | 3 |
          | 見送り | 0 | 0 | 0 |
          下方修正の情報を使ったベイズ決定（事後期待損失の最小化）について正しいものはどれか。
        choices:
          - "事前確率で計算した期待損失は全額投資が $«elpf»$ で最小なので、全額投資を選ぶ"
          - "事後確率が最大のシナリオ（維持）で損失が最小になる全額投資を選ぶ"
          - "最悪の場合の損失が最小になる見送りを選ぶのが、ベイズ決定である"
          - "事後期待損失は全額投資 $«elf»$、ヘッジつき半額投資 $«elh»$、見送り $«els»$ で、ヘッジつき半額投資を選ぶ"
          - "事後確率は事前確率と変わらないので、方針は下方修正の前と同じでよい"
        answer: 3
        distractors:
          - 下方修正の情報を使わず事前確率で期待損失を計算した
          - 最も確からしいシナリオだけで判断し、他のシナリオの損失を無視した（MAP の代入）
          - ミニマックス基準とベイズ決定を混同した
          - 正解
          - 尤度がシナリオで違うので事後確率は変わる
        explanation: |
          **方針** ベイズの定理で事後確率を求め、各方針の損失を事後確率で重み付けした事後期待損失を比べて、最小のものを選ぶ。

          **途中式** 事前確率 × 尤度は $«pr1»\times«lk1»=«j1»$、$«pr2»\times«lk2»=«j2»$、$«pr3»\times«lk3»=«j3»$ で合計 «tj»。事後確率は
          $$(«po1»,\ «po2»,\ «po3»)=\left(\tfrac49,\ \tfrac39,\ \tfrac29\right)$$
          事後期待損失は
          $$\text{全額}:\ -4\times\tfrac49+3\times\tfrac39+20\times\tfrac29=«elf»$$
          $$\text{ヘッジ}:\ -2\times\tfrac49+0.5\times\tfrac39+3\times\tfrac29=«elh»$$
          $$\text{見送り}:\ 0$$
          最小はヘッジつき半額投資。

          **答え** 事後期待損失が最小のヘッジつき半額投資を選ぶ（選択肢の 4 番目）。

          **間違えやすい点** 下方修正の前（事前確率）なら全額投資の期待損失 $«elpf»$ が最小だが、デフォルトの事後確率が «pr3» から «po3» に上がったので判断が変わる。
          事後確率が最大のシナリオだけを見ると、確率は小さいが損失の大きいデフォルトを無視してしまう。最悪の損失を最小にするのはミニマックス基準で、ベイズ決定とは別の考え方である。

  - id: s07p08
    title: 中古マンション価格の回帰分析
    context: |
