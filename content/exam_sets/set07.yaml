    items:
      - id: s07p08a
        chapter: 16
        terms: [dummy-variable, log-transformation, multiple-regression-model]
        topic: 対数価格のヘドニック回帰で駅近ダミーの係数から他の条件が同じ物件の価格が何パーセント高いかを求める
        level: 基本
        definition: false
        type: choice
        question: |
          取引価格の自然対数 $\log y$ を目的変数とし、専有面積・築年数・「駅から徒歩 5 分以内なら 1、それ以外は 0」のダミー変数を説明変数とする重回帰を当てはめたところ、ダミー変数の係数の推定値は «b» だった。
          この推定値の解釈として最も適切なものはどれか。必要なら $e^{0.18}=«eb»$、$e^{-0.18}=«emb»$、$10^{0.18}=«tb»$ を使え。
        choices:
          - "面積と築年数が同じなら、駅から 5 分以内の物件の価格は約 «pct_b»% 高い"
          - "面積と築年数が同じなら、駅から 5 分以内の物件の価格は約 «b» 百万円高い"
          - "面積と築年数が同じなら、駅から 5 分以内の物件の価格は約 «pct»% 高い"
          - "面積と築年数が同じなら、駅から 5 分以内でない物件の価格は約 «pct_m»% 高い"
          - "面積と築年数が同じなら、駅から 5 分以内の物件の価格は約 «pct_t»% 高い"
        answer: 2
        distractors:
          - 係数を百分率の差とそのまま読んだ（小さい係数でのみ成り立つ近似）
          - 対数でなく価格そのもののモデルと取り違えた
          - 正解
          - 比較の向きを逆にし、しかも 1-e^{-0.18} を「高い」と読んだ
          - 自然対数を常用対数と取り違えた
        explanation: |
          **方針** 他の説明変数が同じとき、ダミーが 0 から 1 に変わると $\log y$ が «b» 増える。対数の差は比の対数なので、価格の比は $e^{«b»}$ になる。

          **途中式**
          $$\log y_1-\log y_0=«b»\iff\frac{y_1}{y_0}=e^{«b»}=«eb»$$
          よって価格は $(«eb»-1)\times100=«pct»$% 高い。

          **答え** 約 «pct»% 高い

          **間違えやすい点** 係数をそのまま «pct_b»% と読むのは、係数が十分小さいときの近似 $e^{b}\approx1+b$ にすぎない。«b» 程度では差が無視できない。
          逆向き（5 分以内の物件から見た 5 分以内でない物件）なら、価格は $1-e^{-«b»}=$ 約 «pct_m»% 低い。どちらを基準にした比較かを区別する。

      - id: s07p08b
        chapter: 17
        terms: [robust-standard-error, heteroscedasticity, residual]
        topic: 5件の物件の単回帰で残差と面積の偏差から不均一分散に頑健なホワイトの標準誤差（HC0）を計算する
        level: 標準
        definition: false
        type: numeric
        question: |
          ある駅の周辺の 5 件で、価格 $y$（百万円）を専有面積 $x$（m²）に単回帰した。面積の平均は $\bar x=«xbar»$、偏差平方和は $S_{xx}=«Sxx»$ で、最小二乗法による残差 $e_i$ は次の通り。
          | 物件 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $x_i$ | «x0» | «x1» | «x2» | «x3» | «x4» |
          | $y_i$ | «y0» | «y1» | «y2» | «y3» | «y4» |
          | 残差 $e_i$ | «e0» | «e1» | «e2» | «e3» | «e4» |
          誤差の分散が物件ごとに違ってもよいとする、傾きの推定量の頑健な標準誤差（ホワイトの標準誤差、自由度による補正をしない HC0 型）
          $$\widehat{\mathrm{SE}}(\hat\beta_1)=\frac{\sqrt{\sum_{i}(x_i-\bar x)^2e_i^2}}{S_{xx}}$$
          を求めよ。表の残差の値をそのまま使ってよい。
        answer: «hc0»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 傾きの推定量は $\hat\beta_1=\sum_i(x_i-\bar x)y_i/S_{xx}$ と $y_i$ の線形結合なので、誤差の分散が $\sigma_i^2$ と異なるとき $V[\hat\beta_1]=\sum_i(x_i-\bar x)^2\sigma_i^2/S_{xx}^2$。未知の $\sigma_i^2$ を $e_i^2$ で置き換えたものがホワイトの推定量である。

          **途中式** 偏差 $x_i-\bar x$ は $«d0»,\ «d1»,\ «d2»,\ «d3»,\ «d4»$。各物件の $(x_i-\bar x)^2e_i^2$ は
          $$«tt0»,\quad «tt1»,\quad «tt2»,\quad «tt3»,\quad «tt4»$$
          で、合計 $«sumt»$。
          $$\widehat{\mathrm{SE}}(\hat\beta_1)=\frac{\sqrt{«sumt»}}{«Sxx»}=\frac{«sqsum»}{«Sxx»}=«hc0_6»\cdots$$

          **答え** $«hc0»$

          **間違えやすい点** 分母は $S_{xx}$（$S_{xx}$ の平方根ではない）。$\sqrt{\sum(x_i-\bar x)^2e_i^2/S_{xx}}$ とすると $«w_nosq»$ になる。
          通常の標準誤差 $\sqrt{s^2/S_{xx}}$（$s^2=\sum e_i^2/(n-2)$）は $«ols»$ で、等分散を仮定している。ホワイトの標準誤差は $x$ が平均から遠い物件の残差を重く見る。HC0 は小標本では過小になりやすく、$n/(n-2)$ を掛ける HC1 などの補正もある。

      - id: s07p08c
        chapter: 30
        terms: [mallows-cp, model-selection, overfitting]
        topic: 全変数モデルの誤差分散を使ったマローズのCpで中古マンション価格の入れ子の3モデルを比べる
        level: 標準
        definition: false
        type: choice
        question: |
          «n» 件のデータで、価格（百万円）を目的変数とする次の 3 つのモデル（いずれも定数項を含む）を最小二乗法で当てはめた。
          | モデル | 説明変数 | 残差平方和 |
          |---|---|---|
          | M1 | 専有面積 | «s1» |
          | M2 | 専有面積・築年数 | «s2m» |
          | M3 | 専有面積・築年数・駅徒歩 | «s3» |
          マローズの $C_p=\dfrac{\text{残差平方和}}{\hat\sigma^2}-n+2p$（$p$ は定数項を含む回帰係数の数、$\hat\sigma^2$ は最大のモデル M3 の残差平方和を自由度 $n-4$ で割った値）でモデルを選ぶ。正しいものはどれか。
        choices:
          - "残差平方和が最も小さい M3 を選ぶ"
          - "$C_p$ は M1 が $«cq1»$、M2 が $«cq2»$、M3 が $«cq3»$ で、M2 を選ぶ"
          - "$C_p$ は M1 が $«cn1»$、M2 が $«cn2»$、M3 が $«cn3»$ で、M2 を選ぶ"
          - "$C_p$ は M1 が $«cp1»$、M2 が $«cp2»$、M3 が $«cp3»$ で、M2 を選ぶ"
          - "M2 の $C_p$ は $p=3$ より小さいので、M2 は偏りが大きく不適切である"
        answer: 3
        distractors:
          - 説明変数を増やせば残差平方和は必ず減るので、残差平方和では比べられない
          - p は定数項を含めて数える約束なのに定数項を除いて数えた（どの C_p も 2 小さくなる）
          - σ^2 の推定で M3 の残差平方和を自由度 n-4 ではなく n で割った
          - 正解
          - C_p が p より小さいのは偏りが小さいことと矛盾しない（偏りが大きいと C_p は p より大きくなる）
        explanation: |
          **方針** $\hat\sigma^2$ を最大のモデルから求め、各モデルの $C_p$ を計算して最小のものを選ぶ。$C_p$ は予測の平均二乗誤差の推定量（を $\sigma^2$ で割ったもの）で、残差平方和の小ささと係数の数への罰則のバランスをとる。

          **途中式** $\hat\sigma^2=«sse_full»/(«n»-4)=«sse_full»/«dfr»=«s2»$。
          $$C_p(\text{M1})=«r1»-«n»+4=«cp1»,\quad C_p(\text{M2})=«r2»-«n»+6=«cp2»,\quad C_p(\text{M3})=«r3»-«n»+8=«cp3»$$
          最小は M2。

          **答え** $C_p$ は M1 $«cp1»$、M2 $«cp2»$、M3 $«cp3»$ で M2 を選ぶ（選択肢の 4 番目）。

          **間違えやすい点** 最大のモデルでは定義から必ず $C_p=p$（ここでは 4）になる。残差平方和は変数を加えるほど小さくなるので、それだけで比べると常に最大のモデルを選んでしまう（過学習）。
          偏りのないモデルでは $E[C_p]\approx p$ で、$C_p$ が $p$ を大きく超えるモデルは偏りが大きい。

  - id: s07p09
    title: 輸出額の回帰と罰則つき推定
    context: |
      ある経済研究所は、ある国の月次の輸出額の変化を、為替レートの変化 $x_1$ と海外景気指数の変化 $x_2$ で説明する線形回帰 $y=\beta_1x_1+\beta_2x_2+\varepsilon$ を考えている。
      目的変数と説明変数はそれぞれ平均 0、長さ（2 乗和の平方根）1 に基準化してあり（定数項なし）、
      $$X^{\top}X=\begin{pmatrix}1&«rho»\\«rho»&1\end{pmatrix},\qquad X^{\top}y=\begin{pmatrix}«g1»\\«g2»\end{pmatrix}$$
      である（$x_1$ と $x_2$ の相関係数は «rho»）。
    items:
      - id: s07p09a
        chapter: 19
        terms: [ridge-regression, multicollinearity, regularization]
        topic: 相関の強い2つの基準化説明変数のリッジ回帰で罰則つき正規方程式を解き係数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          罰則つき最小二乗
          $$\hat\beta^{\mathrm{ridge}}=\arg\min_{\beta}\left\{\lVert y-X\beta\rVert^2+\lambda(\beta_1^2+\beta_2^2)\right\},\qquad\lambda=«lam»$$
          の解として正しいものはどれか。
        choices:
          - "$«c_ols»$"
          - "$«c_orth»$"
          - "$«c_ok»$"
          - "$«c_half»$"
          - "$«c_simple»$"
        answer: 2
        distractors:
          - 罰則を付けない最小二乗推定値を答えた
          - 説明変数が直交する場合の式 b/(1+λ) を、相関があるのにそのまま使った
          - 正解
          - 目的関数に 1/2 が付く流儀と混同し、対角に λ/2 を足した
          - 各説明変数で別々に単回帰した傾き（相関を無視）を答えた
        explanation: |
          **方針** 目的関数を $\beta$ で微分して 0 とおくと、罰則つき正規方程式 $(X^{\top}X+\lambda I)\beta=X^{\top}y$ が得られる。2 × 2 の連立方程式を解く。

          **途中式**
          $$\begin{pmatrix}«l1»&«rho»\\«rho»&«l1»\end{pmatrix}\begin{pmatrix}\beta_1\\\beta_2\end{pmatrix}=\begin{pmatrix}«g1»\\«g2»\end{pmatrix}$$
          行列式は $«l1sq»-«rho2»=«det»$。逆行列を掛けて
          $$\beta_1=\frac{«l1»\times«g1»-«rho»\times«g2»}{«det»}=\frac{«a1»-«a2»}{«det»}=«b1»,\qquad \beta_2=\frac{-«rho»\times«g1»+«l1»\times«g2»}{«det»}=\frac{-«a3»+«a4»}{«det»}=«b2»$$

          **答え** $«c_ok»$

          **間違えやすい点** 最小二乗推定値は $(«o1»,\ «o2»)$。説明変数の相関が強いと、最小二乗では一方に効果が偏りやすい（分散が大きい）。リッジ回帰は全体を縮めるだけでなく、相関の強い変数どうしの係数を近づける。この例では $\beta_2$ はむしろ大きくなる。
          $b_j/(1+\lambda)$ と係数ごとに縮める式は $X^{\top}X=I$（直交）のときだけ成り立つ。

  - id: s07p10
    title: 営業研修の効果の比較
    context: |
      ある証券会社は、3 種類の営業研修 A, B, C の効果を比べるため、新人営業担当者を無作為に «n» 人ずつ各研修に割り付け、研修後 3 か月の契約件数を調べた。
      一元配置分散分析の結果、誤差の平均平方は $\mathrm{MS}_e=«mse»$（自由度 «dfe»）で、各研修の平均は A «mA»、B «mB»、C «mC» だった。
    items:
      - id: s07p10a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, multiple-testing]
        topic: 3種類の営業研修の平均契約件数をテューキーの方法でスチューデント化範囲の点から全組比較する
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの研修のすべての組をテューキーの方法（全体の有意水準 5%）で比較する。スチューデント化された範囲の上側 5% 点は $q(3,«dfe»;0.05)=«q»$、
          $t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t»$ とする。正しいものはどれか。
        choices:
          - "比較の基準値は約 $«lsd»$ で、A と B、A と C の 2 組が有意である"
          - "比較の基準値は約 $«hsd»$ で、A と B の組だけが有意である"
          - "比較の基準値は約 $«w2»$ で、どの組も有意でない"
          - "比較の基準値は約 $«wN»$ で、A と B、A と C の 2 組が有意である"
          - "比較の基準値は約 $«hsd»$ で、A と B の組だけが有意である。したがって A の平均は B と C のどちらよりも大きいと結論できる"
        answer: 1
        distractors:
          - 多重性を考えず、2群のt検定の基準（最小有意差）を使った
          - 正解
          - q に √2 が含まれていることを忘れ、√(2MSe/n) を掛けた
          - 1群あたりの人数 n ではなく全体の人数 N で割った
          - A と C の差は有意でないので、A が C より大きいとは結論できない
        explanation: |
          **方針** テューキーの方法では、平均の差の絶対値が $q(k,\nu;0.05)\sqrt{\mathrm{MS}_e/n}$ を超える組を有意とする（各群の人数が等しい場合）。すべての組の比較を合わせて有意水準 5% になる。

          **途中式**
          $$q\sqrt{\frac{\mathrm{MS}_e}{n}}=«q»\times\sqrt{\frac{«mse»}{«n»}}=«q»\times«se»=«hsd»$$
          差は $|A-B|=«dAB»$、$|A-C|=«dAC»$、$|C-B|=«dCB»$。«hsd» を超えるのは A と B の組だけ。

          **答え** 基準値 約 $«hsd»$ で、A と B の組だけが有意（選択肢の 2 番目）。

          **間違えやすい点** 2 群の $t$ 検定を繰り返す基準 $t_{0.025}\sqrt{2\mathrm{MS}_e/n}=«t»\times\sqrt{2\times«mse»/«n»}=«lsd»$ では A と C の組も有意になるが、比較を繰り返すぶん全体の第 1 種の誤りが 5% を超える。
          スチューデント化された範囲は（範囲）÷（1 群の平均の標準誤差）の分布なので、$\sqrt{2}$ は付けない。

  - id: s07p11
    title: 住宅の時価の標本調査
    context: |
      ある地区には «N» 戸の住宅があり、全戸の固定資産税評価額の平均は $\bar X=«Xbar»$（百万円）であることが台帳からわかっている。
      この地区の住宅の時価（想定取引価格）の平均を推定するため、単純無作為抽出で «n» 戸を選び、評価額 $x$ と不動産鑑定による時価 $y$（百万円）を調べた。
    items:
      - id: s07p11a
        chapter: 21
        terms: [regression-estimation, simple-random-sampling, ratio-estimation]
        topic: 固定資産税評価額を補助変数にした回帰推定量で地区の住宅1戸あたりの平均時価を推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          標本から次の値が得られた（分散・共分散は $n-1$ で割った値）。
          | 評価額の平均 $\bar x$ | 時価の平均 $\bar y$ | 評価額の分散 $s_{x}^2$ | 時価の分散 $s_{y}^2$ | 共分散 $s_{xy}$ |
          |---|---|---|---|---|
          | «xb» | «yb» | «sxx» | «syy» | «sxy» |
          評価額を補助変数とする回帰推定量で、地区全体の住宅 1 戸あたりの平均時価を推定せよ。
        answer: «reg»
        tolerance: 0.01
        answer_format: 百万円単位で小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 回帰推定量は $\bar y_{\mathrm{reg}}=\bar y+b(\bar X-\bar x)$、$b=s_{xy}/s_x^2$。標本の評価額の平均が母集団の平均からずれている分を、$y$ の $x$ への回帰の傾きで補正する。

          **途中式**
          $$b=\frac{«sxy»}{«sxx»}=«b»,\qquad \bar X-\bar x=«Xbar»-«xb»=«dx»$$
          $$\bar y_{\mathrm{reg}}=«yb»+«b»\times«dx»=«yb»+«adj»=«reg_s»$$

          **答え** $«reg»$ 百万円

          **間違えやすい点** 標本の評価額が母集団より低めなので、時価の標本平均 «yb» も低めに出ていると考えて上方に補正する（符号を逆にすると $«w_sign»$）。
          比推定量 $\bar y\,\bar X/\bar x=«rat»$ は回帰直線が原点を通る場合に適した推定量で、回帰推定量とは一般に異なる。
          $x$ と $y$ の相関は $r=«rho»$ で、回帰推定量の分散は単純な標本平均のおよそ $1-r^2=«red»$ 倍に減る。

  - id: s07p12
    title: 金利の期間構造の主成分分析
    context: |
      国債の 2 年・5 年・10 年金利の日次変化（単位：ベーシスポイント、平均を引いたもの）を、分散共分散行列にもとづいて主成分分析した。
      固有値と、第 1・第 2 主成分の固有ベクトル（長さ 1）は次の通りである。

      | | 固有値 | 2 年 | 5 年 | 10 年 |
      |---|---|---|---|---|
      | 第 1 主成分 | «l1» | «v11» | «v12» | «v13» |
      | 第 2 主成分 | «l2» | «v21» | «v22» | «v23» |
      | 第 3 主成分 | «l3» | | | |
    items:
      - id: s07p12a
        chapter: 22
        terms: [principal-component-score, eigenvalue-and-eigenvector, principal-component-analysis]
        topic: 3年限の金利変化の分散共分散行列による主成分分析で固有ベクトルからある日の第1主成分得点を計算する
        level: 基本
        definition: false
        type: choice
        question: |
          ある日の金利変化（平均を引いた値）は、2 年 $+«x1»$、5 年 $+«x2»$、10 年 $+«x3»$ だった。この日の第 1 主成分得点に最も近いものはどれか。
        choices:
          - "$«sc_sum»$"
          - "$«sc2»$"
          - "$«sc_std»$"
          - "$«sc»$"
          - "$«sc_lam»$"
        answer: 3
        distractors:
          - 固有ベクトルの重みを付けず、変化をそのまま足した
          - 第2主成分の固有ベクトルを使った
          - 主成分得点を第1固有値の平方根で割った
          - 正解
          - 主成分得点に固有値を掛けた
        explanation: |
          **方針** 第 1 主成分得点は、平均を引いたデータと第 1 固有ベクトルの内積 $z_1=v_{11}x_1+v_{12}x_2+v_{13}x_3$ である。

          **途中式**
          $$z_1=«v11»\times«x1»+«v12»\times«x2»+«v13»\times«x3»=«t1»+«t2»+«t3»=«sc3»$$

          **答え** $«sc»$

          **間違えやすい点** 第 1 固有ベクトルの成分はすべて正でほぼ等しいので、第 1 主成分は「金利全体の水準」の変化を表す（寄与率は $«l1»/(«l1»+«l2»+«l3»)=«contrib»$）。第 2 主成分は短期と長期で符号が逆で「傾き」を表す。
          主成分得点の分散が固有値になるので、得点を $\sqrt{\lambda_1}=«sqrtl1»$ で割るのは「標準化した得点」で、主成分得点そのものではない。

  - id: s07p13
    title: 景気指標の構造の分析
    context: |
      ある経済研究所は、鉱工業生産・有効求人倍率・小売販売額・住宅着工・設備投資・消費者態度指数の 6 つの景気指標の関係を、多変量解析で調べている。
    items:
      - id: s07p13a
        chapter: 25
        terms: [maximum-likelihood-factor-analysis, number-of-factors, factor-analysis-model]
        topic: 6つの景気指標の最尤因子分析で適合度カイ二乗検定の自由度を数え検定可能な最大の因子数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          6 つの指標の分散共分散行列に、$m$ 因子の直交因子モデル（独自因子の分散も推定する）を最尤法で当てはめ、「$m$ 因子モデルが正しい」という帰無仮説をカイ二乗適合度検定で調べる。
          $m=2$ のときの検定の自由度と、自由度が正（検定ができる）となる最大の因子数 $m$ の組として正しいものはどれか。
        choices:
          - "自由度 «d2_rot»、最大の因子数 2"
          - "自由度 «d2»、最大の因子数 2"
          - "自由度 «d2»、最大の因子数 3"
          - "自由度 «d1»、最大の因子数 2"
          - "自由度 «d2_sign»、最大の因子数 «m_sign»"
        answer: 1
        distractors:
          - 因子負荷量の回転の不定性 m(m-1)/2 を自由なパラメータから引き忘れた
          - 正解
          - m=3 のとき自由度が 0（飽和）で検定できないことを見落とした
          - m=1 のときの自由度を答えた
          - 自由度の公式の符号を誤り ((p-m)^2+(p+m))/2 とした
        explanation: |
          **方針** 自由度 = （分散共分散行列の異なる要素の数）−（モデルの自由なパラメータの数）。パラメータは因子負荷量 $pm$ 個と独自分散 $p$ 個だが、因子の回転で同じ共分散行列を与えるので $m(m-1)/2$ 個の制約がある。まとめると $\dfrac{(p-m)^2-(p+m)}{2}$。

          **途中式** $p=«p»$ のとき、共分散行列の異なる要素は $«p»\times7/2=«nmom»$ 個。$m=2$ では自由なパラメータが $«p»\times2+«p»-1=«par2»$ 個なので
          $$\text{自由度}=«nmom»-«par2»=«d2»=\frac{(6-2)^2-(6+2)}{2}$$
          $m=1$ では $\dfrac{25-7}{2}=«d1»$、$m=3$ では $\dfrac{9-9}{2}=«d3»$。

          **答え** $m=2$ の自由度 «d2»、自由度が正となる最大の因子数は 2。

          **間違えやすい点** 回転の不定性を引き忘れるとパラメータが «par2raw» 個になり、自由度を «d2_rot» と数えてしまう。
          $m=3$ では自由度 0 で、モデルは共分散行列にちょうど合わせられる（制約がない）ので、当てはまりを検定できない。

      - id: s07p13b
        chapter: 26
        terms: [path-analysis, structural-equation-modeling]
        topic: 政策金利から住宅着工を経て建設業の雇用に至るパス解析で直接効果と間接効果から総合効果を求める
        level: 基本
        definition: false
        type: choice
        question: |
          政策金利の変化 $R$、住宅着工の変化 $H$、建設業の雇用の変化 $E$ を標準化し、パス図「$R\to H$、$H\to E$、$R\to E$」の逐次モデルを当てはめた。
          標準化パス係数は $R\to H$ が $«a»$、$H\to E$ が $«b»$、$R\to E$ が $«c»$ だった。$R$ が $E$ に与える総合効果として正しいものはどれか。
        choices:
          - "$«ind»$"
          - "$«w_dir»$"
          - "$«tot»$"
          - "$«w_sum»$"
          - "$«w_prod»$"
        answer: 2
        distractors:
          - 間接効果だけを答えた
          - 直接効果だけを答えた
          - 正解
          - 3つのパス係数をすべて足した
          - 3つのパス係数をすべて掛けた
        explanation: |
          **方針** 総合効果 = 直接効果 + 間接効果。間接効果は経路に沿ったパス係数の積で求める。

          **途中式** 間接効果（$R\to H\to E$）は $«a»\times«b»=«ind»$、直接効果は $«c»$。
          $$\text{総合効果}=«c»+(«ind»)=«tot»$$

          **答え** $«tot»$

          **間違えやすい点** 直接効果 $«c»$ だけを見ると金利の雇用への影響を小さく見積もる。住宅着工を通じた経路の影響 $«ind»$ のほうが大きい。
          外生変数が $R$ だけのこのモデルでは、総合効果は $R$ と $E$ の相関係数に一致する。
