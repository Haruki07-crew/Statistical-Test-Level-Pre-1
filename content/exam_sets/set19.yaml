          - "$«inv»$"
          - "$«crude»$"
          - "$«avg»$"
          - "$«mh»$"
          - "$«or1»$"
        answer: 3
        distractors:
          - 分子と分母を逆にし、SMS なしの SMS ありに対するオッズ比を求めた
          - 層を無視して 2 つの表を合計してからオッズ比を求めた
          - 層ごとのオッズ比 2.67 と 1.56 を単純に平均した
          - 正解
          - 延滞 30 日未満の層のオッズ比だけを答えた
        explanation: |
          **方針** 層 $k$ の表を $(a_k,b_k;c_k,d_k)$、総数を $n_k$ とすると、マンテル・ヘンツェル推定量は
          $$\hat\psi_{MH}=\frac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$$
          で、層ごとのオッズ比を層の大きさなどで重み付けしてまとめたものになる。

          **途中式**
          - 30 日未満（$n_1=«n1»$）：$a_1d_1/n_1=«a1»\times«d1»/«n1»=«ad1»$、$b_1c_1/n_1=«b1»\times«c1»/«n1»=«bc1»$
          - 30 日以上（$n_2=«n2»$）：$a_2d_2/n_2=«a2»\times«d2»/«n2»=«ad2»$、$b_2c_2/n_2=«b2»\times«c2»/«n2»=«bc2»$
          - $\hat\psi_{MH}=\dfrac{«ad1»+«ad2»}{«bc1»+«bc2»}=\dfrac{«num»}{«den»}=«mh4»\cdots$

          **答え** $«mh»$

          **間違えやすい点** 層を合計した表（SMS あり：解消 «A»・未解消 «B»、SMS なし：解消 «C»・未解消 «D»）のオッズ比 «crude» は、層の情報を捨てている。層によって SMS の割合が違えば交絡で偏り、この例のように割合が同じ（どちらの層も 50%）でも、オッズ比は層を合計すると値が変わる性質があるので «mh» とは一致しない。
          層ごとのオッズ比 «or1» と «or2» の単純平均 «avg» は、マンテル・ヘンツェル推定量とは異なる。

      - id: s19p13b
        chapter: 31
        terms: [beta-binomial-model, predictive-distribution, conjugate-prior]
        topic: ベータ事前分布と少数の貸出実績から次の2件がともに延滞する事後予測確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          新しい少額ローン商品の延滞率 $\theta$ に、類似商品の実績から事前分布 $\mathrm{Beta}(«al»,«be»)$（密度 $\propto\theta^{«al»-1}(1-\theta)^{«be»-1}$、平均 0.04）をおく。
          発売後の «nn» 件の貸出のうち «y» 件が延滞した。$\theta$ が与えられたもとで各貸出の延滞は独立とする。
          次に貸し出す 2 件が**ともに**延滞する事後予測確率に最も近い値を選べ。
        choices:
          - "$«w_prior»$"
          - "$«w_plug»$"
          - "$«w_bad»$"
          - "$«pred»$"
          - "$«w_mle»$"
        answer: 3
        distractors:
          - データを使わず事前平均 0.04 の 2 乗を答えた
          - 事後平均 0.05 を θ に代入して 2 乗した（θ の不確かさを無視した）
          - 事後分布の第2母数に延滞しなかった件数 47 ではなく貸出件数 50 を足した
          - 正解
          - 事前分布を無視して最尤推定値 3/50 の 2 乗を答えた
        explanation: |
          **方針** ベータ分布は二項分布の共役事前分布で、事後分布は $\mathrm{Beta}(\alpha+y,\ \beta+n-y)$。予測確率は $\theta^2$ の事後期待値 $E[\theta^2\mid\text{データ}]$ である。

          **途中式**
          - 事後分布：$\mathrm{Beta}(«al»+«y»,\ «be»+«ny»)=\mathrm{Beta}(«ap»,«bp»)$、事後平均 $«ap»/«apb»=«pmean»$
          - $\mathrm{Beta}(a,b)$ では $E[\theta^2]=\dfrac{a(a+1)}{(a+b)(a+b+1)}$
          - $P(\text{2 件とも延滞}\mid\text{データ})=\dfrac{«ap»\times«ap1»}{«apb»\times«apb1»}=\dfrac{«pnum»}{«pden»}=«pred6»\cdots$

          **答え** $«pred»$

          **間違えやすい点** 事後平均を代入した $«pmean»^2=«w_plug»$ は、$\theta$ の不確かさ（事後分散）を無視しているので小さくなる。$E[\theta^2]=\{E[\theta]\}^2+V[\theta]$ である。
          事後分布の第 2 母数に足すのは延滞しなかった件数 $«nn»-«y»=«ny»$ で、貸出件数 «nn» ではない。
