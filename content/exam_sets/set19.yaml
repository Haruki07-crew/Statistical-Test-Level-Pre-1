set: 19
title: 模擬試験 第19回
minutes: 90
problems:
  - id: s19p01
    title: カードローンの延滞（調査の設計と予測モデル）
    context: |
      ある銀行は、カードローンの 1 年以内の延滞率を調べる調査を計画し、延滞を予測するモデルも作っている。
    items:
      - id: s19p01a
        chapter: 10
        terms: [p-value, significance-level, null-and-alternative-hypothesis]
        topic: 9万件の大標本で延滞率が基準の5%より0.2ポイント高いことが両側z検定で有意になっても差が実務上小さいことを信頼区間で読む
        level: 標準
        definition: false
        type: choice
        question: |
          全国の契約から無作為に抽出した «sn» 件で 1 年以内の延滞率を調べたところ «ph»% だった。社内の基準値は «p0»% である。
          延滞率が基準値と異なるかを、帰無仮説の比率で標準誤差を作る $z$ 検定（両側）で調べた。
          また、延滞率の 95% 信頼区間（ワルド型）も求めた。社内では、延滞率が基準値から 1 ポイント以上変わったときに審査基準を見直すことにしている。
          正しい記述はどれか。必要なら $\Phi(2.75)=«ph275»$ を使え。
        choices:
          - '$z=«z»$ で両側 $p$ 値は約 «pv»。5% 水準で有意だが、95% 信頼区間 («lo»%, «hi»%) から差は 0.05〜0.35 ポイント程度で、見直しの目安 1 ポイントより小さい'
          - '$z=«z»$ で両側 $p$ 値は約 «pv» ときわめて小さいので、延滞率は大きく上昇しており、審査基準を見直すべきである'
          - '標本が «sn» 件と大きすぎるので、$z$ 検定は使えない'
          - '両側 $p$ 値 «pv» は「延滞率が «p0»% である確率」なので、延滞率が «p0»% である確率は 0.6% しかない'
          - '5% 水準で有意だが、差は 0.2 ポイントと小さいので、標本をさらに増やせば有意でなくなる'
        answer: 0
        distractors:
          - 正解
          - p 値の小ささは差の大きさではなく、差の大きさは推定値や信頼区間で見る
          - 標本が大きいほど正規近似はよく当てはまる
          - p 値は帰無仮説が正しい確率ではない
          - 同じ差なら、標本を増やすほど z は大きくなり、より有意になる
        explanation: |
          **方針** 帰無仮説 $p=0.05$ のもとでの標準誤差 $\sqrt{p_0(1-p_0)/n}$ で $z$ を作る。差の大きさは、$p$ 値ではなく推定値と信頼区間で判断する。

          **途中式**
          - $\sqrt{0.05\times0.95/«sn»}=«se0»$、$z=\dfrac{0.052-0.050}{«se0»}=«z3»\approx«z»$
          - 両側 $p$ 値 $=2\{1-\Phi(2.75)\}=2\times(1-«ph275»)=«pv»$
          - 信頼区間：$\sqrt{0.052\times0.948/«sn»}=«se1»$、半幅 $1.96\times«se1»=0.00145$ より («lo»%, «hi»%)。基準値との差は «dlo»〜«dhi» ポイント。

          **答え** 5% 水準で有意。ただし差は高々 0.35 ポイント程度で、実務上の目安（1 ポイント）より小さい

          **間違えやすい点** 標本が非常に大きいと、実務上は無視できる小さな差でも有意になる。「統計的に有意」は「差が 0 ではなさそう」という意味で、「差が大きい」という意味ではない。
          検定の結果とあわせて、差の推定値と信頼区間を報告する。
      - id: s19p01b
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, cohort-and-case-control-study]
        topic: 延滞者を全件・非延滞者を一部だけ抽出した学習データのロジスティック回帰の切片を補正して母集団の延滞確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          延滞はまれなので、学習データには延滞した契約を**全件**、延滞しなかった契約は**無作為に 10%** だけ入れ（抽出は延滞の有無だけで決まる）、スコア $x$ を説明変数とするロジスティック回帰
          $\log\dfrac{p}{1-p}=\beta_0+\beta_1x$ を当てはめた。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=-«b1»$ だった（$p$ は延滞確率、対数は自然対数）。
          このモデルを使って、**全契約（母集団）**のうちスコア $x=«x»$ の契約の延滞確率を推定する。最も近い値を選べ。必要なら $e^{1.6}=«e16»$、$\log10=«ln10»$ を使え。
        choices:
          - "$«p_raw10»$"
          - "$«p_ok»$"
          - "$«p_odds»$"
          - "$«p_raw»$"
          - "$«p_rev»$"
        answer: 1
        distractors:
          - 補正前の確率 0.168 に抽出率 0.1 を掛けた（補正はオッズに掛ける）
          - 正解
          - 補正後のオッズ 0.0202 をそのまま確率とした
          - 抽出の偏りを補正せず、学習データのモデルのまま確率を求めた
          - 補正の向きを逆にし、オッズを 10 倍した
        explanation: |
          **方針** 延滞の有無だけで抽出率が決まるとき、学習データの延滞のオッズは母集団のオッズの (延滞者の抽出率)/(非延滞者の抽出率) $=1/«f0»=10$ 倍になる。
          そのため傾き $\beta_1$（オッズ比）は変わらず、切片だけが $\log10$ ずれる。母集団の切片は $\hat\beta_0-\log10$。

          **途中式**
          - 学習データでの線形予測子：$«b0»-«b1»\times«x»=«eta»$、学習データのオッズ $e^{-1.6}=1/«e16»=«odds_s»$
          - 母集団のオッズ：$«odds_s»\div10=«odds_p»$（切片を $\log10=«ln10»$ 下げるのと同じ）
          - 確率：$p=\dfrac{\text{オッズ}}{1+\text{オッズ}}=\dfrac{1}{1+10\times«e16»}=\dfrac{1}{«den»}=«p_ok5»\cdots$

          **答え** $«p_ok»$

          **間違えやすい点** 補正しないと $«p_raw»$ となり、延滞を大きく見積もる。補正はオッズ（ロジットの尺度）で行い、確率に 0.1 を掛ける（$«p_raw10»$）のは誤り。
          症例対照研究でオッズ比は推定できるが絶対的な確率は推定できないのと同じ理由で、抽出率がわかって初めて切片を補正できる。

  - id: s19p02
    title: カードの不正利用
    context: |
      あるカード会社は、不正利用の被害額や発生までの時間と、不正の検知ルールの性能を調べている。小問ごとに別のデータを扱う。
    items:
      - id: s19p02a
        chapter: 11
        terms: [test-ci-relationship-mean-difference, two-sample-t-test, pooled-variance]
        topic: 新しい検知ルールの導入前後の不正1件あたりの被害額をプールした分散の2標本t区間で比べ95%区間と99%区間から5%と1%の有意性を読む
        level: 標準
        definition: false
        type: choice
        question: |
          新しい検知ルールの導入前と導入後に、不正利用をそれぞれ «n1» 件ずつ無作為に選び、1 件あたりの被害額（万円）を調べた。
          平均は導入前 «m1»、導入後 «m2»、プールした標準偏差は $s_p=«sp»$ だった（2 群とも正規分布で母分散は等しいとする）。
          平均の差（導入前 − 導入後）について、正しい記述はどれか。$t$ 分布の上側点は $t_{0.025}(«df»)=«t025»$、$t_{0.005}(«df»)=«t005»$ とする。
        choices:
          - '95% 信頼区間は $(«lo95»,\ «hi95»)$ で 0 を含まないので 5% 水準で有意。99% 信頼区間 $(«lo99»,\ «hi99»)$ は 0 を含むので、1% 水準では有意でない'
          - '95% 信頼区間 $(«lo95»,\ «hi95»)$ が 0 を含まないので、1% 水準でも有意である'
          - '95% 信頼区間は $(«wlo»,\ «whi»)$ で、0 を含まないので 5% 水準で有意である'
          - '$t=«t»$ で 5% 水準で有意だが、95% 信頼区間は 0 を含むことがある'
          - '5% 水準で有意なので、平均の差が «d» 万円である確率は 95% である'
        answer: 0
        distractors:
          - 正解
          - 99% の区間は 95% の区間より広いので、95% 区間が 0 を含まなくても 99% 区間は 0 を含むことがある
          - 差の標準誤差を 1 群だけの s_p/√n で計算した（2 群の和の √(1/n1+1/n2) を使う）
          - 両側 5% の t 検定で有意であることと、95% 信頼区間が 0 を含まないことは同値
          - 信頼区間や有意水準は、差が特定の値である確率ではない
        explanation: |
          **方針** 差の標準誤差は $s_p\sqrt{1/n_1+1/n_2}$。両側の $t$ 検定（有意水準 $\alpha$）で棄却されることと、$100(1-\alpha)\%$ 信頼区間が 0 を含まないことは同値。

          **途中式**
          - 標準誤差：$«sp»\times\sqrt{1/«n1»+1/«n2»}=«se»$、$t=«d»/«se»=«t»$
          - 95%：$«d»\pm«t025»\times«se»=«d»\pm«h95»$ より $(«lo95»,\ «hi95»)$（0 を含まない → 5% で有意）
          - 99%：$«d»\pm«t005»\times«se»=«d»\pm«h99»$ より $(«lo99»,\ «hi99»)$（0 を含む → 1% では有意でない）

          **答え** 5% 水準では有意、1% 水準では有意でない

          **間違えやすい点** 信頼区間は「差の大きさ」と「有意かどうか」の両方を示す。$t=«t»$ は $t_{0.025}=«t025»$ と $t_{0.005}=«t005»$ の間にあり、両側 $p$ 値は 0.01 と 0.05 の間になる。
          区間は差が «lo95»〜«hi95» 万円の範囲にありうることを示していて、差が «d» 万円である確率が 95% という意味ではない。
      - id: s19p02b
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, exponential-distribution]
        topic: 情報が漏れてから最初の不正利用までの日数を最小日数だけずれた指数分布とみて位置と尺度の最尤推定値を尤度の単調性から求める
        level: 応用
        definition: false
        type: choice
        question: |
          カード情報が漏れてから最初の不正利用までの日数 $X$ は、偽造などの準備に最低 $\mu$ 日かかり、その後は平均 $\theta$ 日の指数分布に従う（ずれのある指数分布）とする。
          $$f(x)=\frac1\theta\exp\left(-\frac{x-\mu}{\theta}\right)\quad(x\ge\mu),\qquad f(x)=0\quad(x<\mu)$$
          «nn» 件の日数は «xs» だった（合計 «sum»）。$(\mu,\theta)$ の最尤推定値の組として正しいものはどれか。
        choices:
          - '$(\hat\mu,\hat\theta)=(«mn»,\ «th»)$'
          - '$(\hat\mu,\hat\theta)=(«mn»,\ «xb»)$'
          - '$(\hat\mu,\hat\theta)=(«mm_mu»,\ «sd»)$'
          - '$(\hat\mu,\hat\theta)=(«muu»,\ «thu»)$'
          - '対数尤度を $\mu$ で微分して 0 とおいた式に解がないので、最尤推定値は存在しない'
        answer: 0
        distractors:
          - 正解
          - θ̂ を平均そのものとした（最小日数のずれを引いていない）
          - 平均と標準偏差を使うモーメント法の推定値
          - 偏りを補正した不偏推定量で、最尤推定値ではない
          - 尤度が μ について単調増加なので、範囲の端（最小値）で最大になる
        explanation: |
          **方針** 尤度は $x_i\ge\mu$（すべての $i$）のときだけ正。$\theta$ を固定すると、尤度は $\mu$ について増加関数なので、許される範囲の右端 $\mu=\min x_i$ で最大になる。その後で $\theta$ について微分する。

          **途中式**
          $$L(\mu,\theta)=\theta^{-n}\exp\left\{-\frac{\sum x_i-n\mu}{\theta}\right\}\quad(\mu\le x_{(1)})$$
          - $\mu$ が大きいほど $-\sum(x_i-\mu)/\theta$ が大きくなるので $\hat\mu=x_{(1)}=«mn»$
          - $\dfrac{\partial\log L}{\partial\theta}=-\dfrac n\theta+\dfrac{\sum(x_i-\hat\mu)}{\theta^2}=0$ より $\hat\theta=\bar x-x_{(1)}=«xb»-«mn»=«th»$

          **答え** $(\hat\mu,\hat\theta)=(«mn»,\ «th»)$

          **間違えやすい点** 台（$x\ge\mu$）が母数に依存するときは、微分して 0 とおく方法がそのまま使えない。一様分布 $U(0,\theta)$ の最尤推定値が最大値になるのと同じ考え方である。
          $x_{(1)}$ は真の $\mu$ より必ず大きい（$E[x_{(1)}]=\mu+\theta/n$）ので、偏りを補正した推定量は «muu»、«thu» になる。
      - id: s19p02c
        chapter: 1
        terms: [bayes-theorem, conditional-independence, conditional-probability]
        topic: 条件付き独立でない2つの不正検知ルールが同時に陽性のときの不正の事後確率を同時陽性率から求め独立の仮定と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          取引の «pf»（0.2%）が不正である。2 つの検知ルール A・B の陽性率は次のとおりで、どちらも「同じ特徴（深夜・高額など）」に反応するため、不正・正常のどちらの取引でも A と B の陽性は独立ではない。

          | | A が陽性 | B が陽性 | A と B がともに陽性 |
          |---|---|---|---|
          | 不正な取引 | «sa_f» | «sb_f» | «both_f» |
          | 正常な取引 | «sa_l» | «sb_l» | «both_l» |

          A と B がともに陽性だった取引が不正である確率に最も近い値を選べ。
        choices:
          - "$«w_a»$"
          - "$«post»$"
          - "$«w_ind»$"
          - "$«w_like»$"
          - "$«w_noprior»$"
        answer: 1
        distractors:
          - A が陽性という情報だけで事後確率を求めた
          - 正解
          - 不正・正常のそれぞれで A と B が独立（条件付き独立）とみなし、陽性率の積を使った
          - 条件の向きを逆にし、P(ともに陽性 | 不正) を答えた
          - 不正の割合（事前確率）を使わずに尤度だけで比べた
        explanation: |
          **方針** ベイズの定理で $P(\text{不正}\mid A\cap B)=\dfrac{P(\text{不正})P(A\cap B\mid\text{不正})}{P(\text{不正})P(A\cap B\mid\text{不正})+P(\text{正常})P(A\cap B\mid\text{正常})}$。同時陽性率は表の値をそのまま使う。

          **途中式**
          - 分子：$«pf»\times«both_f»=«nf»$
          - 正常の項：$(1-«pf»)\times«both_l»=«nl»$
          - $P=\dfrac{«nf»}{«nf»+«nl»}=\dfrac{«nf»}{«dsum»}=«post4»\cdots$

          **答え** $«post»$

          **間違えやすい点** 正常な取引で A と B が独立なら同時陽性率は $«sa_l»\times«sb_l»=«prodl»$ のはずだが、実際は «both_l» と大きい。条件付き独立を仮定すると $«w_ind»$ となり、2 つのルールを重ねた効果を大きく見積もってしまう。

  - id: s19p03
    title: 定期預金の満期前解約と現在価値
    context: |
      ある銀行の長期の定期預金について、契約から満期前に解約されるまでの時間 $T$（年）が、レート $\lambda=«lam»$ の指数分布（密度 $f_T(t)=\lambda e^{-\lambda t}$、$t>0$、平均 «mean» 年）に従うとみなす。
      解約時点で 1 単位の払い戻しが生じるとし、それを年率 $\delta=«delta»$ の連続複利で現在に割り引いた係数 $D=e^{-\delta T}$（$0<D<1$）を考える。
    items:
      - id: s19p03a
        chapter: 4
        terms: [change-of-variables, exponential-distribution, cumulative-distribution-function]
        topic: 指数分布に従う解約時期を連続複利で割り引いた係数の密度関数を変数変換で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $D=e^{-\delta T}$ の確率密度関数 $f_D(d)$（$0<d<1$）として正しいものはどれか。
        choices:
          - "$«lam»\\,d^{«k»}$"
          - "$d^{«k»}$"
          - "$«k»d^{«km1»}$"
          - "$«k»(1-d)^{«km1»}$"
          - "$«inv»\\,d^{«invm1»}$"
        answer: 2
        distractors:
          - ヤコビアン |dt/dd|=1/(δd) を掛け忘れ、f_T(t(d)) だけを書いた
          - 密度ではなく分布関数 F_D(d) を答えた
          - 正解
          - D が T の減少関数であることを見落とし、P(D≦d)=P(T≦−log d/δ) として向きを逆にした
          - 指数を λ/δ ではなく δ/λ とした
        explanation: |
          **方針** $d=e^{-\delta t}$ は $t$ の減少関数。分布関数を経由して求めると向きを間違えにくい。逆変換は $t=-\log d/\delta$。

          **途中式**
          - $F_D(d)=P(e^{-\delta T}\le d)=P\left(T\ge-\dfrac{\log d}{\delta}\right)=\exp\left(\dfrac{\lambda}{\delta}\log d\right)=d^{\lambda/\delta}=d^{«k»}$（$\lambda/\delta=«lam»/«delta»=«k»$）
          - $f_D(d)=F_D'(d)=«k»d^{«km1»}\quad(0<d<1)$
          - ヤコビアンで確かめると $f_T\left(-\dfrac{\log d}{\delta}\right)\left|\dfrac{dt}{dd}\right|=\lambda d^{\lambda/\delta}\cdot\dfrac{1}{\delta d}=\dfrac{\lambda}{\delta}d^{\lambda/\delta-1}$ で一致する。

          **答え** $«k»d^{«km1»}$（ベータ分布 $\mathrm{Beta}(«k»,1)$）

          **間違えやすい点** ヤコビアン $1/(\delta d)$ を掛け忘れると $«lam»\,d^{«k»}$ になり、積分しても 1 にならない。$D$ は $T$ の減少関数なので「$D\le d$」は「$T\ge\cdots$」に対応する。

      - id: s19p03b
        chapter: 2
        terms: [moment-generating-function, expectation-variance-properties, exponential-distribution]
        topic: 指数分布の積率母関数を負の点で評価して割引現在価値の期待値と標準偏差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $T$ の積率母関数は $M_T(s)=E[e^{sT}]=\dfrac{\lambda}{\lambda-s}$（$s<\lambda$）である。これを使って、解約時に払い戻す 100 万円の現在価値 $100D$（万円）の**標準偏差**を求めよ。
        answer: «sd»
        tolerance: 0.01
        answer_format: 万円単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $E[D]=E[e^{-\delta T}]=M_T(-\delta)$、$E[D^2]=E[e^{-2\delta T}]=M_T(-2\delta)$ として積率母関数を負の点で評価する。途中は分数のまま計算する。

          **途中式**
          - $E[D]=M_T(-«delta»)=\dfrac{«lam»}{«lam»+«delta»}=«ed»$
          - $E[D^2]=M_T(-2\times«delta»)=\dfrac{«lam»}{«lam»+0.1}=«ed2_f»$
          - $V[D]=«ed2_f»-(«ed»)^2=«ed2_f»-«ed_sq»=«vd_f»$
          - $V[100D]=100^2\times«vd_f»=«vpv»$、標準偏差 $\sqrt{«vpv»}=«sd4»\cdots$

          **答え** $«sd_s»$ 万円（期待値は «pv_mean» 万円）

          **間違えやすい点** $M_T(\delta)$ と符号を誤ると $\lambda/(\lambda-\delta)=«w_plus»>1$ となり、$0<D<1$ に反する。分散 «w_var» のまま答えたり、$E[(100D)^2]$ の平方根 $«w_nosq»$ を答えたりしないこと。
          前問の $\mathrm{Beta}(«k»,1)$ の分散 $\dfrac{«k»\times1}{(«k»+1)^2(«k»+2)}=«vd_f»$ とも一致する。

  - id: s19p04
    title: 家計と取引の調査
    context: |
      ある銀行は、市内の世帯を対象に、家計の消費や取引の利用状況の調査を行う。
    items:
      - id: s19p04a
        chapter: 21
        terms: [regression-estimation, simple-random-sampling, required-sample-size]
        topic: 補助変数との相関から回帰推定量の分散の縮小率を求め同じ精度に必要な標本の大きさを単純無作為抽出と比べる
        level: 基本
        definition: false
        type: numeric
        question: |
          市の世帯の平均の月間消費支出を推定したい。標本平均（単純無作為抽出）で目標の精度を得るには «n0» 世帯が必要と見積もられている。
          税務データから全世帯の所得がわかっており、消費支出と所得の相関係数は $\rho=«rho»$ と見込まれる。所得を補助変数とする回帰推定量を使うと、標本が大きいとき推定量の分散は標本平均の分散の $(1-\rho^2)$ 倍になる。
          回帰推定量で同じ精度（同じ分散）を得るのに必要な世帯数を求めよ（世帯の総数は十分大きく、有限母集団修正は無視する）。
        answer: «nreg»
        tolerance: 0.5
        answer_format: 整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 分散は標本の大きさに反比例する。標本平均の分散 $S^2/n$ に対し、回帰推定量の分散は近似的に $(1-\rho^2)S^2/n$。同じ分散になる $n$ を求める。

          **途中式**
          - $\dfrac{S^2}{«n0»}=\dfrac{(1-\rho^2)S^2}{n}$ より $n=«n0»\times(1-\rho^2)$
          - $1-\rho^2=1-«rho2»=«f»$
          - $n=«n0»\times«f»=«nreg»$

          **答え** «nreg» 世帯

          **間違えやすい点** 縮小率は $1-\rho$ ではなく $1-\rho^2$（$1-\rho$ とすると «w_1r»）。分散の比なので、標準偏差の比 $\sqrt{1-\rho^2}$ を掛けるのも誤り（«w_sq»）。
          相関が強いほど補助情報が効くが、$\rho=0.5$ でも分散は 75% にしかならない。比推定量は回帰直線が原点を通るときに回帰推定量と同じ効率になる。

      - id: s19p04b
        chapter: 26
        terms: [quantification-type-3, correspondence-analysis, multiple-correspondence-analysis]
        topic: 世帯アンケートの回答パターン（世帯×選択肢の0と1の表）に数量化III類を当てはめるときの目的と解の性質を選ぶ
        level: 標準
        definition: true
        type: choice
        question: |
          世帯アンケートで、利用している金融サービス（ネット銀行、証券口座、保険、カードローンなど）を複数選択で答えてもらい、「世帯 × 選択肢」の 0・1 の表（回答パターン）を作った。
          この表に数量化 III 類を当てはめる。数量化 III 類の説明として正しいものはどれか。
        choices:
          - '回答した（1 の）組について、世帯のスコアと選択肢のスコアの相関が最大になるように両方のスコアを決める方法で、0・1 の表に対応分析を当てはめたものと同じ解になる'
          - '目的変数（外的基準）を質的な説明変数で予測するための方法で、選択肢のスコアは回帰係数として求める'
          - '選択された回数が多い選択肢ほど、大きなスコアを与えるように決める'
          - 'すべての世帯と選択肢に同じスコアを与える解は相関が 1 になるので、これを第 1 の解として採用する'
          - '第 1 の解の固有値は、世帯のスコアと選択肢のスコアの相関係数そのものである'
        answer: 0
        distractors:
          - 正解
          - これは外的基準のある数量化 I 類（量的な目的変数）や II 類（質的な目的変数）の説明
          - スコアは選ばれた回数ではなく、同じ世帯に一緒に選ばれる選択肢どうしが近くなるように決まる
          - すべて同じスコアの解は意味のない自明な解で、取り除いてから第 1 の解を選ぶ
          - 固有値は相関係数の 2 乗
        explanation: |
          **方針** 数量化 III 類は外的基準のない方法で、反応のパターンが似た世帯どうし、一緒に選ばれやすい選択肢どうしが近いスコアになるように、両方を同時に数量化する。

          **途中式** 回答のある（1 の）セルを「世帯スコア $y_i$ と選択肢スコア $x_j$ の組」とみて、その相関が最大になる $x$、$y$ を求める。これは固有値問題になり、0・1 の表を分割表とみた対応分析と同じ解になる。
          - すべてのスコアが同じ自明な解（相関 1）は除く。
          - 固有値は相関係数の 2 乗で、大きい順に第 1、第 2 の解を採用する。

          **答え** 世帯と選択肢のスコアの相関を最大にする方法で、対応分析と同じ解

          **間違えやすい点** 数量化 I 類（量的な外的基準の予測）・II 類（質的な外的基準の判別）は外的基準がある方法で、III 類・IV 類は外的基準がない方法である。
          複数の質問の選択肢をまとめて扱う場合は、多重対応分析と同じ解になる。
  - id: s19p05
    title: 住宅ローン金利の回帰モデル
    context: |
      ある銀行が住宅ローン «n» 件について、適用金利の上乗せ幅 $y$（%）を与信スコア $x$ で説明する単回帰モデル $y=\beta_0+\beta_1x+\varepsilon$（誤差は独立に $N(0,\sigma^2)$）を最小二乗法で当てはめた。
      スコアの平均は $\bar x=«xbar»$、偏差平方和は $S_{xx}=«sxx»$、残差の標準偏差（残差平方和を自由度 $n-2=«dfe»$ で割った平方根）は $s=«sd»$ だった。
    items:
      - id: s19p05a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, least-squares-method, t-distribution]
        topic: スコアが一定の契約全体の平均上乗せ幅の95%信頼区間の半幅を平均の推定の標準誤差から求め予測区間と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          スコア $x_0=«x0»$ の契約**全体の平均**の上乗せ幅 $E[y\mid x_0]$ の 95% 信頼区間を作る。区間の半幅（推定値 ± の幅）に最も近いものを選べ。$t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t18»$ である。
        choices:
          - "$«w_nodev»$"
          - "$«w_lin»$"
          - "$«w_z»$"
          - "$«half»$"
          - "$«w_pred»$"
        answer: 3
        distractors:
          - 平均からの距離の項 (x0−x̄)^2/Sxx を落とした
          - (x0−x̄) を 2 乗し忘れた
          - t 分布の点ではなく標準正規分布の 1.96 を使った
          - 正解
          - 平均ではなく 1 件の新しい契約の予測区間（1 を足す）の半幅を答えた
        explanation: |
          **方針** 平均応答の推定値 $\hat y_0=\hat\beta_0+\hat\beta_1x_0$ の分散は $\sigma^2\left\{\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}\right\}$。$\sigma$ を $s$ で置き換え、自由度 $n-2$ の $t$ 分布を使う。

          **途中式**
          - $\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}=\dfrac1{«n»}+\dfrac{(«x0»-«xbar»)^2}{«sxx»}=«k1»+«k2»=«k»$
          - 標準誤差 $=«sd»\times\sqrt{«k»}=«sd»\times«sqk»=«se_m»$
          - 半幅 $=«t18»\times«se_m»=«half4»\cdots$

          **答え** 約 $«half»$（%）

          **間違えやすい点** 1 件の新しい契約の上乗せ幅を予測する予測区間は、誤差 $\varepsilon$ の分の 1 を足して $s\sqrt{1+«k»}$ を使い、半幅は約 «w_pred» と広くなる。平均の区間は $n$ を増やせば 0 に近づくが、予測区間はそうならない。
          $x_0$ が $\bar x$ から離れるほど、どちらの区間も広くなる。

      - id: s19p05b
        chapter: 30
        terms: [bic, model-selection, marginal-likelihood]
        topic: 2つの回帰モデルのBICの差からベイズ因子を近似し等しい事前確率のもとでのモデルの事後確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          上乗せ幅のモデルとして、M1（スコアだけ）と M2（スコアと地域ダミー）を比べたところ、BIC（$-2\log L+k\log n$）は M1 が «bic1»、M2 が «bic2» だった。
          BIC がモデルの周辺尤度の近似 $-2\log p(\text{データ}\mid M)$ になることを使い、2 つのモデルの事前確率を等しくしたときの M1 の事後確率を近似する。最も近い値を選べ。
          必要なら $e^{2.1}=«e21»$、$e^{-2.1}=«em21»$、$e^{4.2}=«e42»$ を使え。
        choices:
          - "$«w_m2»$"
          - "$«w_ratio»$"
          - "$«w_exp»$"
          - "$«post»$"
          - "$«w_no2»$"
        answer: 3
        distractors:
          - M2 の事後確率を答えた
          - BIC の値そのものの比を確率とした
          - 事後確率を 1−e^{−ΔBIC/2} とした
          - 正解
          - ベイズ因子を e^{ΔBIC/2} ではなく e^{ΔBIC} とした
        explanation: |
          **方針** $p(\text{データ}\mid M)\approx\exp(-\mathrm{BIC}/2)$ なので、ベイズ因子 $B_{12}\approx\exp\{(\mathrm{BIC}_2-\mathrm{BIC}_1)/2\}$。事前確率が等しければ、事後確率は $B_{12}/(1+B_{12})$。

          **途中式**
          - $\Delta=\mathrm{BIC}_2-\mathrm{BIC}_1=«bic2»-«bic1»=«dbic»$
          - $B_{12}\approx e^{«dbic»/2}=e^{2.1}=«e21»$
          - $P(M_1\mid\text{データ})\approx\dfrac{«e21»}{1+«e21»}=«post»$

          **答え** $«post»$

          **間違えやすい点** BIC は $-2\times$（対数周辺尤度）の近似なので、差を 2 で割ってから指数をとる。2 で割らないと $«w_no2»$ と過大になる。
          BIC の差 2〜6 は「M1 を支持する正の証拠」程度とされ、AIC の差とは解釈の根拠が異なる。

  - id: s19p06
    title: 月次の預金流出額の時系列回帰
    context: |
      ある銀行が、月次のデータに回帰モデルを当てはめて、預金の動きを分析している。小問ごとに別のモデルを扱う。
    items:
      - id: s19p06a
        chapter: 16
        terms: [multiple-regression-model, ar-model, regression-coefficient-t-test]
        topic: 前月の流出額を説明変数に含む回帰で市場金利が上がり続けたときの流出額の増加を月ごとに足し合わせ長期の効果と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          月 $t$ の預金流出額 $y_t$（億円）を、市場金利 $x_t$（%）と前月の流出額 $y_{t-1}$ で説明する回帰
          $$y_t=a+«b»\,x_t+«c»\,y_{t-1}+\varepsilon_t$$
          が得られた。ある月（1 か月目とする）から市場金利が 1 ポイント上がり、その後もその水準が続くとする。
          ほかの条件は変わらないとき、3 か月目の流出額は、金利が上がらなかった場合に比べて何億円増えると予測されるか。
        answer: «eff3»
        tolerance: 0.001
        answer_format: 億円の単位で、小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 金利の上昇は、その月に «b» だけ流出額を増やし、翌月以降は前月の流出額を通じて «c» 倍ずつ持ち越される。金利は上がり続けるので、毎月新たに «b» が加わる。

          **途中式**
          - 1 か月目：$«e1»$
          - 2 か月目：$«b»+«c»\times«e1»=«e2»$
          - 3 か月目：$«b»+«c»\times«e2»=«b»(1+«c»+«c2»)=«eff3_s»$

          **答え** $«eff3_s»$ 億円

          **間違えやすい点** 1 か月目の効果 «b» を 3 倍した «w_b3» ではない（持ち越しは «c» 倍ずつ減る）。金利が上がり続けたときの長期の効果は $«b»/(1-«c»)=«lr»$ 億円に近づく。
          前月の値を説明変数に入れたモデルでは、係数 «b» は「その月だけの効果（短期の効果）」を表す。
      - id: s19p06b
        chapter: 27
        terms: [unit-root, durbin-watson-statistic, time-series]
        topic: 互いに独立なランダムウォークどうしを回帰すると決定係数やt値が大きくダービン・ワトソン比が小さくなる見かけの回帰を見抜き対処を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          別の分析で、«n» か月分の預金残高の対数 $y_t$ を、ある株価指数の対数 $x_t$ に単回帰したところ、傾きの $t$ 値は «t»、決定係数は «r2»、残差のダービン・ワトソン比は «dw» だった。
          $y_t$ と $x_t$ はどちらも、それぞれの前月の値に独立な誤差を足した形（ランダムウォーク）で動くことがわかっている。この結果の解釈として最も適切なものはどれか。
        choices:
          - 両方とも単位根をもつ系列どうしなので、関係がなくても $t$ 値や決定係数が大きく出る見かけの回帰の疑いが強い。ダービン・ワトソン比が決定係数よりずっと小さいこともその兆候で、差分をとって回帰し直すなどして確かめる
          - $t$ 値 «t» は 1% 点を大きく上回るので、株価指数と預金残高には強い関係がある
          - 決定係数が «r2» と高いので、モデルは預金残高の変動を十分に説明している
          - ダービン・ワトソン比が小さいのは誤差の分散が不均一だからで、不均一分散に頑健な標準誤差を使えば検定はそのまま使える
          - 標本が «n» か月と多いので、中心極限定理により $t$ 分布による検定はそのまま使える
        answer: 0
        distractors:
          - 正解
          - 単位根をもつ系列どうしでは、t 値は関係がなくても大きくなり、t 分布の点と比べられない
          - 決定係数の高さは、ともに時間とともに動く傾向（確率的トレンド）によるものかもしれない
          - DW が小さいのは誤差の正の系列相関で、不均一分散ではない
          - 単位根をもつ系列では、標本を増やしても t 値は t 分布に近づかない（むしろ大きくなっていく）
        explanation: |
          **方針** 互いに独立なランダムウォークどうしを回帰しても、どちらも時間とともにさまようため、たまたま同じ向きに動いた区間で強い関係があるように見える（見かけの回帰）。残差もランダムウォークのように強い正の系列相関をもつ。

          **途中式**
          - 単回帰では $R^2=\dfrac{t^2}{t^2+(n-2)}=\dfrac{«t2»}{«r2den»}=«r2»$ で、問題の値と整合する。
          - ダービン・ワトソン比 «dw» は 2 よりはるかに小さく、残差に強い正の系列相関がある。目安として $R^2>DW$ のときは見かけの回帰を疑う。
          - 対処：差分 $\Delta y_t$ を $\Delta x_t$ に回帰する、単位根検定や共和分の検定を行う。

          **答え** 見かけの回帰の疑いが強い。差分をとるなどして確かめる

          **間違えやすい点** 単位根をもつ系列どうしの回帰では、$t$ 統計量は $t$ 分布に従わず、標本が大きいほど大きくなるので、「有意」になりやすい。
          ただし、2 つの系列が共通の確率的トレンドをもつ（共和分）場合は、水準どうしの回帰にも意味がある。
  - id: s19p07
    title: 少額ローンの審査と損失
    context: |
      ある銀行は、少額ローンの審査と、貸倒れによる損失の管理を見直している。
    items:
      - id: s19p07a
        chapter: 23
        terms: [kernel-method, support-vector-machine, linear-discriminant-analysis]
        topic: 1つの特徴量の両端に延滞者が集まり1本のしきい値で分けられないデータを2乗の特徴量を加えて分ける考え方と多項式カーネルの値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          少額ローンの申込者 7 人について、前月からの利用額の変化率を標準化した値 $x$ と、その後の延滞の有無は次のとおりだった。

          | 延滞あり | «bad» |
          |---|---|
          | 延滞なし | «good» |

          $x$ の値だけで延滞の有無を分ける方法について、正しい記述はどれか。
        choices:
          - '$x$ に 1 本のしきい値を置くだけでは分けられないが、$x^2$ を特徴量に加える（$x\mapsto(x,x^2)$ と写す）と直線で分けられる。多項式カーネル $K(x,z)=(1+xz)^2$ を使えば、写した先の内積を写像を計算せずに求められ、$K(«xa»,«xb»)=«kv»$ である'
          - '$x$ を標準化し直せば、1 本のしきい値で分けられる'
          - 'しきい値を $x=0$ に置けば、7 人とも正しく分けられる'
          - 'カーネル法では、写した先の空間の次元が高いほど、新しい申込者への判定の誤りは必ず小さくなる'
          - '$x$ に 1 本のしきい値を置くだけでは分けられないので、判別分析ではなく $k$-平均法でクラスターに分けるしかない'
        answer: 0
        distractors:
          - 正解
          - 標準化は平行移動と拡大縮小なので、点の並び順は変わらず分けられないまま
          - 延滞ありは x の負の側と正の側の両方にあるので、1 本のしきい値では分けられない
          - 次元を上げすぎると学習データに過剰に適合し、新しいデータでの誤りが増えることがある
          - k-平均法はラベルを使わない方法で、判別の問題には特徴量の変換やカーネル法で対応できる
        explanation: |
          **方針** 延滞ありは $x$ の両端（大きく減った人と大きく増えた人）、延滞なしは中央にある。$x^2$ は「0 からの離れ具合」を表すので、$x^2$ のしきい値で分けられる。

          **途中式**
          - $x^2$：延滞あり «bad2»、延滞なし «good2»。たとえば $x^2=1.5$ を境にすれば完全に分かれる。
          - $(x,x^2)$ の平面では、これは直線 $x^2=1.5$ による分割になる。
          - 多項式カーネル：$K(«xa»,«xb»)=(1+(«xa»)\times«xb»)^2=(«kin»)^2=«kv»$。これは $\phi(x)=(1,\sqrt2x,x^2)$ と写したときの内積 $\phi(x)^\top\phi(z)$ に等しい。

          **答え** $x^2$ を加えると直線で分けられる（カーネルの値は «kv»）

          **間違えやすい点** カーネル法は、写像 $\phi$ を直接計算せず、内積 $K(x,z)$ だけで高次元の空間での線形の判別（サポートベクターマシンなど）を行う方法である。
          高次元にすれば学習データはいつでも分けやすくなるが、新しいデータへの当てはまりが良くなるとは限らない。
      - id: s19p07b
        chapter: 19
        terms: [ridge-regression, bias-in-penalized-estimation, bias-variance-tradeoff]
        topic: 直交計画のリッジ推定量の偏りと分散から平均二乗誤差を最小にする正則化パラメータと最小値を求める
        level: 応用
        definition: false
        type: choice
        question: |
          審査モデルの説明変数を互いに直交し $X^\top X=I$ となるように変換した。ある変数の係数の最小二乗推定量 $b$ は、平均 $\beta$、分散 $\sigma^2$ の不偏推定量である。
          リッジ回帰 $\min_\beta\|y-X\beta\|^2+\lambda\|\beta\|^2$ では、この係数の推定量は $b/(1+\lambda)$ になる。
          $\beta=«beta»$、$\sigma^2=«sig2»$ とするとき、$b/(1+\lambda)$ の平均二乗誤差を最小にする $\lambda$ と、そのときの平均二乗誤差の組として正しいものを選べ。
        choices:
          - "$\\lambda=0$、平均二乗誤差 «w_ols»"
          - "$\\lambda=«w_inv»$、平均二乗誤差 «mse_inv»"
          - "$\\lambda=«lam»$、平均二乗誤差 «w_var»"
          - "$\\lambda=«lam»$、平均二乗誤差 «mse»"
          - "$\\lambda=«lam»$、平均二乗誤差 «w_bias»"
        answer: 3
        distractors:
          - 不偏な最小二乗推定量（λ=0）が平均二乗誤差も最小にすると考えた
          - 最小にする λ を β^2/σ^2 と逆にした
          - 分散だけを平均二乗誤差とし、偏りの2乗を足し忘れた
          - 正解
          - 偏りの2乗だけを平均二乗誤差とし、分散を足し忘れた
        explanation: |
          **方針** 平均二乗誤差 = 偏りの 2 乗 + 分散。$E[b/(1+\lambda)]=\beta/(1+\lambda)$ なので偏りは $-\lambda\beta/(1+\lambda)$、分散は $\sigma^2/(1+\lambda)^2$。

          **途中式**
          - $\mathrm{MSE}(\lambda)=\dfrac{\lambda^2\beta^2+\sigma^2}{(1+\lambda)^2}$
          - $\lambda$ で微分すると分子は $2(1+\lambda)\{\lambda\beta^2(1+\lambda)-(\lambda^2\beta^2+\sigma^2)\}=2(1+\lambda)(\lambda\beta^2-\sigma^2)$ に比例し、$\lambda=\sigma^2/\beta^2=«lam»$ で最小
          - $\mathrm{MSE}=\dfrac{«lb2»+«sig2»}{«d15»}=\dfrac{«num»}{«d15»}=«mse»$

          **答え** $\lambda=«lam»$、平均二乗誤差 «mse»（最小二乗推定量の «w_ols» より小さい）

          **間違えやすい点** リッジ推定量は偏りをもつが、分散を減らすことで平均二乗誤差を最小二乗推定量より小さくできる（偏りと分散のトレードオフ）。最適な $\lambda$ は未知の $\beta$ に依存するので、実際には交差検証などで選ぶ。

      - id: s19p07c
        chapter: 31
        terms: [bayes-decision-theory, posterior-distribution, beta-binomial-model]
        topic: ベータ事後分布のもとで新商品の1件あたりの期待利益を求め貸出を続けるかをベイズ決定で判断する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい少額ローン商品の貸倒れ率 $\theta$ に、事前分布 $\mathrm{Beta}(«al»,«be»)$（平均 «prior_m»）をおく。発売後の «nn» 件のうち «y» 件が貸倒れた（$\theta$ が与えられたもとで各件は独立）。
          1 件の貸出は、貸倒れなければ «gain» 万円の利益、貸倒れれば «loss» 万円の損失になる。事後分布のもとでの 1 件あたりの期待利益が正なら貸出を続ける、という基準で判断する。
          期待利益と判断の組として正しいものを選べ。
        choices:
          - 期待利益 «w_mle» 万円で、貸出をやめる
          - 期待利益 «w_map» 万円で、貸出を続ける
          - 期待利益 «prof» 万円で、貸出を続ける
          - 期待利益 «w_prior» 万円で、貸出を続ける
          - 期待利益 «w_bad» 万円で、貸出を続ける
        answer: 2
        distractors:
          - 事前分布を無視して最尤推定値 4/50 を代入した
          - 事後分布の最頻値（MAP）を代入した。利益は θ の1次式なので事後平均を使う
          - 正解
          - データを使わず事前平均を代入した
          - 事後分布の第2母数に貸倒れなかった件数 46 ではなく件数 50 を足した
        explanation: |
          **方針** 利益は $«gain»(1-\theta)-«loss»\theta=«gain»-«gl»\theta$ で $\theta$ の 1 次式なので、その事後期待値は $\theta$ に事後平均を代入した値になる。

          **途中式**
          - 事後分布：$\mathrm{Beta}(«al»+«y»,\ «be»+«ny»)=\mathrm{Beta}(«ap»,«bp»)$、事後平均 $«ap»/«apb»=«pm»$
          - 期待利益 $=«gain»-«gl»\times«pm»=«prof»$ 万円 $>0$
          - 損益分岐点は $\theta^*=«gain»/«gl»=«thstar»$ で、事後平均はこれより小さい

          **答え** 期待利益 «prof» 万円で、貸出を続ける

          **間違えやすい点** 最尤推定値 $«mle»$ だけを見ると損益分岐点を超えるので「やめる」になるが、事前情報を合わせた事後平均 «pm» では続ける判断になる。
          推定の損失関数が 2 乗損失なら事後平均、絶対損失なら事後中央値、0-1 損失なら事後最頻値がベイズ推定量になるが、ここでは利益が $\theta$ の 1 次式なので事後平均だけで決まる。

  - id: s19p08
    title: 支店の事務ミス
    context: |
      ある銀行は、支店の窓口事務の誤りを点検し、新しい事務手順の効果も調べている。小問ごとに別のデータを扱う。
    items:
      - id: s19p08a
        chapter: 5
        terms: [poisson-distribution, binomial-distribution, independence-of-events]
        topic: 1日のミス件数がポアソン分布に従う10支店のうちミスが0件の支店がちょうど2つである確率を0件の確率を成功確率とする二項分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          各支店の 1 日のミス件数は、互いに独立に平均 «lam» のポアソン分布に従うとする。ある日、«nb» 支店のうち、ミスが 0 件だった支店がちょうど «k» 支店である確率に最も近いものはどれか。
          必要なら $e^{-1.5}=«e15»$ を使え。
        choices:
          - '$«ok»$'
          - '$«w_ge»$'
          - '$«w_po»$'
          - '$«w_p»$'
          - '$«w_q»$'
        answer: 0
        distractors:
          - 正解
          - ちょうど 2 支店ではなく 2 支店以上の確率を求めた
          - 0 件の支店の数を平均 10×e^{-1.5} のポアソン分布で近似した
          - 0 件の確率ではなく 1.5/10 を成功確率にした
          - 二項係数と残り 8 支店の確率を掛け忘れた
        explanation: |
          **方針** 1 支店でミスが 0 件の確率は $P(X=0)=e^{-1.5}$。支店は独立なので、0 件の支店の数は二項分布 $B(«nb»,\ e^{-1.5})$ に従う。

          **途中式**
          $$\binom{«nb»}{«k»}(e^{-1.5})^2(1-e^{-1.5})^8=«c»\times«e15»^2\times«q1»^8=«c»\times«q2»\times«q8»=«ok4»$$

          **答え** $«ok»$

          **間違えやすい点** 「ミスが 0 件」という事象を成功とみる二項分布で、成功確率はポアソン分布から求める $e^{-\lambda}$。
          10 支店の合計件数は平均 15 のポアソン分布に従うが、「0 件の支店の数」はそれとは別の確率変数である。
      - id: s19p08b
        chapter: 13
        terms: [kruskal-wallis-test, rank-and-ties, nonparametric-methods-overview]
        topic: 3つの事務手順を4支店ずつで試した1か月のミス件数の順位和からクラスカル・ウォリス検定統計量を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          3 つの事務手順 A・B・C を、それぞれ無作為に選んだ 4 支店で 1 か月試し、ミス件数を数えた。

          | 手順 | ミス件数 |
          |---|---|
          | A | «gA» |
          | B | «gB» |
          | C | «gC» |

          手順によってミス件数の分布の位置が違うかを、クラスカル・ウォリス検定で調べる。検定統計量
          $$H=\frac{12}{N(N+1)}\sum_{j}\frac{R_j^2}{n_j}-3(N+1)$$
          （$N$ は全体の支店数、$R_j$ は手順 $j$ の順位和、$n_j$ はその支店数）の値を求めよ。
        answer: «H»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 12 支店のミス件数をまとめて小さい順に 1〜12 の順位をつけ、手順ごとに順位を足す。

          **途中式**
          - 順位：A は «rA»（和 «RA»）、B は «rB»（和 «RB»）、C は «rC»（和 «RC»）
          - $\sum R_j^2/n_j=(«RA»^2+«RB»^2+«RC»^2)/4=«sR2»$
          - $H=\dfrac{12}{12\times13}\times«sR2»-3\times13=«H4»$

          **答え** $«H_s»$（自由度 2 のカイ二乗分布の上側 5% 点 «c95» を上回り、手順による違いがあるといえる）

          **間違えやすい点** 順位は手順ごとではなく、全体をまとめてつける。順位和の合計は $N(N+1)/2=78$ になることで計算を確かめられる。
          件数そのものではなく順位を使うので、外れた値の影響を受けにくい。各群が小さいときは、カイ二乗近似より正確な分布の表を使うこともある。
  - id: s19p09
    title: ATM の引出額と稼働状態
    context: |
      ある銀行は、ATM に補充する現金の量と保守の体制を決めるため、ATM の利用と稼働の状態を調べている。
    items:
      - id: s19p09a
        chapter: 9
        terms: [confidence-interval, variance-stabilizing-transform, wald-confidence-interval]
        topic: ATMの四半期の障害件数から平方根変換による正規近似でポアソン平均の95%信頼区間を作る
        level: 標準
        definition: false
        type: choice
        question: |
          ある ATM の四半期の障害件数 $X$ は平均 $\mu$ のポアソン分布に従うとし、観測値は $X=«x»$ 件だった。
          $\sqrt X$ は近似的に平均 $\sqrt\mu$、分散 $1/4$ の正規分布に従う（分散安定化変換）ことを使って $\sqrt\mu$ の 95% 信頼区間を作り、それを 2 乗して $\mu$ の 95% 信頼区間とする。正しいものを選べ。
        choices:
          - "$«ci_raw»$"
          - "$«ci_no2»$"
          - "$«ci_wald»$"
          - "$«ci_ok»$"
          - "$«ci_se»$"
        answer: 3
        distractors:
          - √μ の区間のまま 2 乗して戻さなかった
          - 標準偏差を 1/2 ではなく 1 とした
          - 変換せずに X ± 1.96√X（ワルド型）で作った
          - 正解
          - 変換後の標準偏差を、デルタ法の 1/2 ではなく 1/(2√X) とした
        explanation: |
          **方針** デルタ法で $V[\sqrt X]\approx\left(\dfrac{1}{2\sqrt\mu}\right)^2\mu=\dfrac14$ と、$\mu$ によらない分散になる。$\sqrt\mu$ の区間 $\sqrt x\pm1.96\times\dfrac12$ を作り、端点を 2 乗する。

          **途中式**
          - $\sqrt{«x»}=«rt»$、半幅 $1.96\times\dfrac12=«h»$
          - $\sqrt\mu$ の区間：$(«rt»-«h»,\ «rt»+«h»)=(«rlo»,\ «rhi»)$
          - 2 乗して $\mu$ の区間：$(«rlo»^2,\ «rhi»^2)=«ci_ok»$

          **答え** $«ci_ok»$

          **間違えやすい点** ワルド型の区間 $«ci_wald»$ は左右対称だが、変換した区間は右に長く、ポアソン分布の非対称性をよく反映する（正確な区間に近い）。
          平方根を変換したので、区間の端点も 2 乗して元の尺度に戻す。

      - id: s19p09b
        chapter: 15
        terms: [independent-stationary-increments, poisson-process, counting-process]
        topic: ATMの利用者のポアソン到着で最初の10分の人数がわかったとき30分までの人数の期待値と分散を独立増分から求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある ATM の利用者は、1 分あたり «plam» 人のポアソン過程に従って到着する。開店から «t1» 分で «pk» 人が到着した。
          開店から «t2» 分までに到着する人数（最初の «pk» 人を含む）の条件付き期待値と条件付き分散の組として正しいものはどれか。
        choices:
          - '期待値 «E»、分散 «V»'
          - '期待値 «w_E0»、分散 «w_E0»'
          - '期待値 «w_sc»、分散 «w_sc»'
          - '期待値 «E»、分散 «E»'
          - '期待値 «w_short»、分散 «w_short_v»'
        answer: 0
        distractors:
          - 正解
          - 最初の 10 分の情報を使わなかった
          - 最初の 10 分の到着の割合で 30 分まで比例させた
          - すでに到着した 8 人は確定していて、ばらつかない
          - 残りの時間を 20 分ではなく 10 分とした
        explanation: |
          **方針** ポアソン過程は独立増分をもつので、«t1» 分以降の到着数は、それまでの到着数と独立に平均 $\lambda\times(«t2»-«t1»)$ のポアソン分布に従う。

          **途中式**
          - $N(«t2»)=«pk»+\{N(«t2»)-N(«t1»)\}$、後半は平均・分散ともに $«plam»\times«dt»=«fut»$ のポアソン分布
          - 期待値 $=«pk»+«fut»=«E»$、分散 $=«fut»$（«pk» は確定した値なので分散に寄与しない）

          **答え** 期待値 «E»、分散 «V»

          **間違えやすい点** 最初の «t1» 分にたまたま多く来ても、それ以降の到着の起こりやすさは変わらない（独立増分と定常増分）。
          条件付きでない $N(«t2»)$ は平均・分散とも «w_E0» のポアソン分布に従うが、途中の情報があると分散は小さくなる。
  - id: s19p10
    title: 督促SMSの効果（延滞日数で層別）
    context: |
      返済が遅れている顧客に、SMS で督促した群としなかった群で、翌月までに延滞が解消したかを延滞日数の層別に集計した。

      | 層 | 督促 | 解消 | 未解消 | 計 |
      |---|---|---|---|---|
      | 延滞 30 日未満 | SMS あり | «ltya» | «ltyb» | «ltyt» |
      | 延滞 30 日未満 | SMS なし | «ltna» | «ltnb» | «ltnt» |
      | 延滞 30 日以上 | SMS あり | «geya» | «geyb» | «geyt» |
      | 延滞 30 日以上 | SMS なし | «gena» | «genb» | «gent» |
    items:
      - id: s19p10a
        chapter: 28
        terms: [hierarchical-loglinear-model, loglinear-model, three-way-table]
        topic: 層と督促と解消の3元分割表に階層的対数線形モデルを当てはめG²と自由度を比べて均質連関モデルを選び督促と解消の関連を解釈する
        level: 標準
        definition: false
        type: choice
        question: |
          層を $L$、督促を $S$、解消を $R$ として、階層的対数線形モデルを当てはめた。各モデルの尤度比統計量 $G^2$（飽和モデルとの比較）と自由度は次のとおり。

          | モデル | 意味 | $G^2$ | 自由度 |
          |---|---|---|---|
          | $[LS][R]$ | 解消は層とも督促とも独立 | «G_ind» | 3 |
          | $[LS][LR]$ | 層を与えると督促と解消は独立 | «G_ci» | 2 |
          | $[LS][LR][SR]$ | 均質連関（3 因子交互作用なし） | «G_h» | 1 |
          | $[LSR]$ | 飽和モデル | 0 | 0 |

          カイ二乗分布の上側 5% 点は、自由度 1 で «c1»、2 で «c2»、3 で «c3» とする。有意水準 5% でモデルを選んだときの結論として正しいものはどれか。
        choices:
          - '$[LS][LR][SR]$ を選ぶ。$G^2=«G_h»$ は «c1» を下回り、督促と解消の関連（オッズ比）は 2 つの層で等しいとみてよい。$[LS][LR]$ との差 «G_d»（自由度 1）は «c1» を上回るので、層を与えても督促と解消は関連している'
          - '$[LS][LR]$ を選ぶ。$[LS][R]$ から $G^2$ が «G_ind» から «G_ci» に大きく下がったので十分に当てはまり、層を与えると督促と解消は独立である'
          - '$[LS][LR][SR]$ を選ぶ。項 $[SR]$ は、督促と解消の関連の強さが層によって違うことを表す'
          - '飽和モデル $[LSR]$ を選ぶ。$G^2=0$ で最もよく当てはまるので、督促の効果は層によって違うと判断する'
          - '$[LS][R]$ を選ぶ。$G^2=«G_ind»$ は自由度 3 の点 «c3» を上回るので、このモデルはよく当てはまる'
        answer: 0
        distractors:
          - 正解
          - G²=10.76 は自由度 2 の点 5.99 を上回るので、[LS][LR] は当てはまらない
          - 層によって関連の強さが違うことを表すのは 3 因子交互作用 [LSR] で、[SR] は層に共通の関連
          - 飽和モデルはいつでも G²=0 になる。当てはまる最も簡単なモデルを選ぶ
          - G² が棄却点を上回るのは、モデルが当てはまらないことを意味する
        explanation: |
          **方針** 階層的モデルでは、当てはまる（$G^2$ が棄却点を下回る）モデルの中で最も簡単なものを選ぶ。入れ子のモデルどうしは $G^2$ の差を自由度の差のカイ二乗分布と比べる。

          **途中式**
          - $[LS][R]$：«G_ind» $>$ «c3»、$[LS][LR]$：«G_ci» $>$ «c2» で、どちらも当てはまらない。
          - $[LS][LR][SR]$：«G_h» $<$ «c1» で当てはまる（3 因子交互作用は不要）。
          - $[LS][LR]$ と $[LS][LR][SR]$ の差：«G_ci» − «G_h» = «G_d» $>$ «c1»。項 $[SR]$ は必要。

          **答え** 均質連関モデル $[LS][LR][SR]$。督促と解消は、層を与えても関連があり、その強さ（オッズ比）は層に共通とみてよい

          **間違えやすい点** 層ごとの標本オッズ比は «or1» と «or2» で違って見えるが、この程度の違いは偶然の範囲内（$G^2=«G_h»$）。
          $[LS][LR]$ との差の検定は、層ごとの督促の効果をまとめて調べるコクラン・マンテル・ヘンツェル検定とほぼ同じこと（層に共通の関連があるか）を調べている。
  - id: s19p11
    title: 投資信託と貸出債権のリスク
    context: |
      ある銀行が、販売する投資信託と、保有する貸出債権のリスクを評価する。小問ごとに別のデータを扱う。
    items:
      - id: s19p11a
        chapter: 3
        terms: [variance-covariance-matrix, expectation-variance-properties, covariance-and-correlation]
        topic: 3本の投資信託の年間収益率の分散共分散行列と投資比率から組み合わせ（ポートフォリオ）の収益率の標準偏差を二次形式で求める
        level: 標準
        definition: false
        type: choice
        question: |
          3 本の投資信託の年間収益率（%）の分散共分散行列は次のとおりである。
          $$\Sigma=\begin{pmatrix}«s00»&«s01»&«s02»\\«s10»&«s11»&«s12»\\«s20»&«s21»&«s22»\end{pmatrix}$$
          資金を «w1»、«w2»、«w3» の割合で 3 本に分けて投資したとき、全体の年間収益率の標準偏差（%）に最も近いものはどれか。
        choices:
          - '$«sd»$'
          - '$«w_diag»$'
          - '$«w_avg»$'
          - '$«w_once»$'
          - '$«w_lin»$'
        answer: 0
        distractors:
          - 正解
          - 共分散の項を無視した
          - 標準偏差を投資比率で加重平均した（分散の性質を使っていない）
          - 共分散の項を 2 倍し忘れた
          - 分散の項に投資比率を 2 乗せずに掛けた
        explanation: |
          **方針** 収益率は $w_1X_1+w_2X_2+w_3X_3$ で、その分散は二次形式 $w^\top\Sigma w=\sum_iw_i^2\sigma_{ii}+2\sum_{i<j}w_iw_j\sigma_{ij}$。

          **途中式**
          - 分散の項：$0.25\times400+0.09\times225+0.04\times100=«diag»$
          - 共分散の項：$2\times(0.5\times0.3\times120+0.5\times0.2\times(-60)+0.3\times0.2\times30)=2\times«off»=«off2»$
          - 分散 $=«var»$、標準偏差 $=\sqrt{«var»}=«sd»$

          **答え** $«sd»$（%）

          **間違えやすい点** 標準偏差の加重平均 «w_avg» より小さくなるのは、相関が 1 より小さい（第 1 と第 3 の信託は相関 «c13» で逆に動く）ためで、分散投資の効果である。
          相関係数は、たとえば第 1 と第 2 の信託で $120/(20\times15)=«c12»$。
      - id: s19p11b
        chapter: 7
        terms: [central-limit-theorem, continuity-correction, normal-approximation-binomial-poisson]
        topic: 貸倒れ確率の異なる3つの格付けの債権の貸倒れ件数の合計を平均と分散の和から正規近似し連続修正つきで一定件数以上になる確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          保有する貸出債権は、格付けごとに次の件数と 1 年以内の貸倒れ確率をもち、債権どうしは独立に貸倒れるとする。

          | 格付け | 件数 | 貸倒れ確率 |
          |---|---|---|
          | 高 | «n1» | «p1» |
          | 中 | «n2» | «p2» |
          | 低 | «n3» | «p3» |

          1 年間の貸倒れ件数の合計 $X$ が «k» 件以上になる確率を、$X$ の平均と分散を使った正規近似（連続修正つき）で求めよ。
          $z$ は小数第 2 位に丸めて、$\Phi(2.06)=«ph206»$、$\Phi(2.08)=«ph»$、$\Phi(2.19)=«ph219»$ の中から使え。
        answer: «ans»
        tolerance: 0.0002
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0002 の差まで正解とする。
        explanation: |
          **方針** $X$ は確率の異なるベルヌーイ変数 600 個の和。平均と分散はそれぞれの和で、独立な変数が多数あり 1 つが全体を支配しないので、中心極限定理（リンデベルグの条件）により正規分布で近似できる。

          **途中式**
          - 平均：$200\times0.01+300\times0.04+100\times0.08=«mu»$
          - 分散：$«v1»+«v2»+«v3»=«v»$、標準偏差 «sdv»
          - $P(X\ge«k»)\approx P\left(Z\ge\dfrac{«km»-«mu»}{«sdv»}\right)=1-\Phi(«z»)=1-«ph»=«ans4»$

          **答え** $«ans4»$

          **間違えやすい点** 連続修正をしないと $z=«znc»$ で $1-«ph219»=0.0143$ と小さくなる。
          全体の平均の確率 $\bar p=22/600$ の二項分布とみると分散は «vh» で、$z=«zh»$、$1-«ph206»=0.0197$ となる。確率がばらつくと分散 $\sum p_i(1-p_i)$ は $n\bar p(1-\bar p)$ より小さくなる。
          なお、二項分布を畳み込んだ正確な値は約 0.023 で、件数の分布が右に歪んでいるため、正規近似は上側の確率をやや小さく見積もる。
  - id: s19p12
    title: 金融リテラシー調査の主成分
    context: |
      ある金融機関が、家計管理・貯蓄・投資の 3 項目の金融リテラシーの得点（標準化しない）を調べたところ、標本の分散共分散行列は次のとおりだった。

      $$S=\begin{pmatrix}«S00»&«S01»&«S02»\\«S10»&«S11»&«S12»\\«S20»&«S21»&«S22»\end{pmatrix}$$
    items:
      - id: s19p12a
        chapter: 22
        terms: [eigenvalue-and-eigenvector, contribution-ratio, principal-component]
        topic: 分散共分散行列に第1固有ベクトルを掛けて固有値を求め第1主成分の寄与率を出す
        level: 標準
        definition: false
        type: numeric
        question: |
          分散共分散行列による主成分分析で、第 1 主成分の係数ベクトル（単位ベクトル）は $e_1=\left(\dfrac23,\ \dfrac23,\ \dfrac13\right)^\top$ であることがわかっている。
          第 1 主成分の寄与率を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $e_1$ は $S$ の固有ベクトルなので $Se_1=\lambda_1e_1$。第 1 主成分の分散は固有値 $\lambda_1$ で、寄与率は $\lambda_1$ を固有値の総和（= $S$ の対角成分の和）で割ったもの。

          **途中式**
          - $Se_1=\dfrac13\begin{pmatrix}«S00»\times2+«S01»\times2+«S02»\\ «S10»\times2+«S11»\times2+«S12»\\ «S20»\times2+«S21»\times2+«S22»\end{pmatrix}=\dfrac13\begin{pmatrix}«Se0»\\«Se0»\\«Se2»\end{pmatrix}=«lam»\,e_1$ なので $\lambda_1=«lam»$
          - 固有値の総和 $=\mathrm{tr}\,S=«S00»+«S11»+«S22»=«tr»$
          - 寄与率 $=«lam»/«tr»=«ans4»\cdots$

          **答え** $«ans_s»$

          **間違えやすい点** 固有値の総和は行列のすべての成分の和ではなく、対角成分（各変数の分散）の和である（すべての成分の和で割ると «w_sum»）。
          係数ベクトルを単位ベクトルにしないまま $(2,2,1)$ で $e^\top Se$ を計算すると 9 倍の値になる。$\lambda_1=e_1^\top Se_1$（レイリー商）でも同じ値が得られる。

  - id: s19p13
    title: 支店と曜日の窓口待ち時間
    context: |
      ある銀行の 4 支店（A〜D）で、月・水・金の 3 つの曜日に 1 日ずつ、窓口の平均待ち時間（分）を測った。

      | 支店 | 月 | 水 | 金 | 平均 |
      |---|---|---|---|---|
      | A | «yA0» | «yA1» | «yA2» | «mA» |
      | B | «yB0» | «yB1» | «yB2» | «mB» |
      | C | «yC0» | «yC1» | «yC2» | «mC» |
      | D | «yD0» | «yD1» | «yD2» | «mD» |
      | 平均 | «c0» | «c1» | «c2» | «gm» |

      全体の平方和は «sst» である。
    items:
      - id: s19p13a
        chapter: 20
        terms: [two-way-anova-without-replication, sum-of-squares-decomposition, randomized-block-design]
        topic: 繰り返しのない二元配置で曜日の効果を除いて支店の窓口待ち時間の差をF値で調べる
        level: 標準
        definition: false
        type: numeric
        question: |
          支店と曜日の 2 因子で、繰り返しのない二元配置の分散分析（交互作用は誤差に含める）を行う。支店の効果を調べる $F$ 値を求めよ。
        answer: «F»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 全体の平方和を、支店の平方和・曜日の平方和・残差（誤差）の平方和に分ける。支店の平方和は「支店平均 − 全平均」の 2 乗和に曜日の数 3 を掛け、曜日の平方和は「曜日平均 − 全平均」の 2 乗和に支店の数 4 を掛ける。

          **途中式**
          - 支店：$3\times\{(«dA»)^2+(«dB»)^2+(«dC»)^2+(«dD»)^2\}=«ssa»$、自由度 «dfa»
          - 曜日：$4\times\{(«dc0»)^2+(«dc1»)^2+(«dc2»)^2\}=«ssb»$、自由度 «dfb»
          - 誤差：$«sst»-«ssa»-«ssb»=«sse»$、自由度 $3\times2=«dfe»$
          - $F=\dfrac{«ssa»/«dfa»}{«sse»/«dfe»}=\dfrac{«msa»}{«mse»}=«F_s»$

          **答え** $«F_s»$（$F_{0.05}(3,6)=«fcrit»$ を大きく超え、支店による差がある）

          **間違えやすい点** 曜日の効果を無視して一元配置にすると、曜日の変動が誤差に入り $F=«F1»$（自由度 3, «dfe1»）と小さくなる。曜日をブロックとして除くことで、支店の比較の精度が上がる（乱塊法と同じ考え方）。
