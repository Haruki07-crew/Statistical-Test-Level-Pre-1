set: 19
title: 模擬試験 第19回
minutes: 90
problems:
  - id: s19p01
    title: カードローンの延滞（調査の設計と予測モデル）
    context: |
      ある銀行は、カードローンの 1 年以内の延滞率を調べる調査を計画し、延滞を予測するモデルも作っている。
    items:
      - id: s19p01a
        chapter: 10
        terms: [sample-size-determination-test, power-function, proportion-test]
        topic: 延滞率が基準を上回ることを検出力80%で検出する1標本の比率の片側検定に必要な標本の大きさを求める
        level: 標準
        definition: false
        type: choice
        question: |
          従来の延滞率は $p_0=«p0»$ である。新しい審査基準で延滞率が $p_1=«p1»$ に上がっていたら、それを有意水準 5% の片側検定（$H_0:p=«p0»$、$H_1:p>«p0»$、正規近似、検定統計量の分母は帰無仮説のもとの標準偏差）で、検出力 80% で検出したい。
          必要な契約件数 $n$ の最小値に最も近いものを選べ。標準正規分布の上側 5% 点は «za»、上側 20% 点は «zb»、上側 2.5% 点は «z2» である。
        choices:
          - "$«w_nob»$"
          - "$«w_p0»$"
          - "$«nreq»$"
          - "$«w_two»$"
          - "$«w_p1»$"
        answer: 2
        distractors:
          - 検出力の条件を入れず、棄却限界だけで n を決めた（検出力は約50%になる）
          - 対立仮説のもとの標準偏差も √(p0 q0) とした
          - 正解
          - 片側検定なのに両側の 1.96 を使った
          - 帰無仮説のもとの標準偏差も √(p1 q1) とした
        explanation: |
          **方針** 棄却限界は $H_0$ のもとで $\hat p>p_0+z_{0.05}\sqrt{p_0q_0/n}$。$H_1$ のもとで $\hat p$ がこれを超える確率を 0.8 にするので、$p_0+z_{0.05}\sqrt{p_0q_0/n}=p_1-z_{0.2}\sqrt{p_1q_1/n}$ を $n$ について解く。

          **途中式**
          - $\sqrt{p_0q_0}=\sqrt{«pq0»}=«s0»$、$\sqrt{p_1q_1}=\sqrt{«pq1»}=«s1»$
          - $\sqrt n=\dfrac{z_{0.05}\sqrt{p_0q_0}+z_{0.2}\sqrt{p_1q_1}}{p_1-p_0}=\dfrac{«za»\times«s0»+«zb»\times«s1»}{«dp»}=\dfrac{«t0»+«t1»}{«dp»}=«root»$
          - $n=«root»^2=«sq»$ → 切り上げて «nreq»

          **答え** $«nreq»$ 件

          **間違えやすい点** 帰無仮説のもとと対立仮説のもとで $\hat p$ の標準偏差が違う（$\sqrt{p_0q_0/n}$ と $\sqrt{p_1q_1/n}$）ことに注意する。検出力の項 $z_{0.2}$ を忘れると «w_nob» 件となり、検出力は約 50% しかない。

      - id: s19p01b
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, cohort-and-case-control-study]
        topic: 延滞者を全件・非延滞者を一部だけ抽出した学習データのロジスティック回帰の切片を補正して母集団の延滞確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          延滞はまれなので、学習データには延滞した契約を**全件**、延滞しなかった契約は**無作為に 10%** だけ入れ（抽出は延滞の有無だけで決まる）、スコア $x$ を説明変数とするロジスティック回帰
          $\log\dfrac{p}{1-p}=\beta_0+\beta_1x$ を当てはめた。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=-«b1»$ だった（$p$ は延滞確率、対数は自然対数）。
          このモデルを使って、**全契約（母集団）**のうちスコア $x=«x»$ の契約の延滞確率を推定する。最も近い値を選べ。必要なら $e^{1.6}=«e16»$、$\log10=«ln10»$ を使え。
        choices:
          - "$«p_raw10»$"
          - "$«p_ok»$"
          - "$«p_odds»$"
          - "$«p_raw»$"
          - "$«p_rev»$"
        answer: 1
        distractors:
          - 補正前の確率 0.168 に抽出率 0.1 を掛けた（補正はオッズに掛ける）
          - 正解
          - 補正後のオッズ 0.0202 をそのまま確率とした
          - 抽出の偏りを補正せず、学習データのモデルのまま確率を求めた
          - 補正の向きを逆にし、オッズを 10 倍した
        explanation: |
          **方針** 延滞の有無だけで抽出率が決まるとき、学習データの延滞のオッズは母集団のオッズの (延滞者の抽出率)/(非延滞者の抽出率) $=1/«f0»=10$ 倍になる。
          そのため傾き $\beta_1$（オッズ比）は変わらず、切片だけが $\log10$ ずれる。母集団の切片は $\hat\beta_0-\log10$。

          **途中式**
          - 学習データでの線形予測子：$«b0»-«b1»\times«x»=«eta»$、学習データのオッズ $e^{-1.6}=1/«e16»=«odds_s»$
          - 母集団のオッズ：$«odds_s»\div10=«odds_p»$（切片を $\log10=«ln10»$ 下げるのと同じ）
          - 確率：$p=\dfrac{\text{オッズ}}{1+\text{オッズ}}=\dfrac{1}{1+10\times«e16»}=\dfrac{1}{«den»}=«p_ok5»\cdots$

          **答え** $«p_ok»$

          **間違えやすい点** 補正しないと $«p_raw»$ となり、延滞を大きく見積もる。補正はオッズ（ロジットの尺度）で行い、確率に 0.1 を掛ける（$«p_raw10»$）のは誤り。
          症例対照研究でオッズ比は推定できるが絶対的な確率は推定できないのと同じ理由で、抽出率がわかって初めて切片を補正できる。

  - id: s19p02
    title: カードの不正利用
    context: |
      あるカード会社は、加盟店での不正利用の件数と、不正の検知ルールの性能を調べている。
    items:
      - id: s19p02a
        chapter: 12
        terms: [dispersion-test, poisson-distribution, chi-squared-distribution]
        topic: 日ごとの不正利用件数に分散指数検定を当てはめポアソン分布より散らばりが大きいかを調べる
        level: 標準
        definition: false
        type: choice
        question: |
          ある加盟店で不正利用と判定された取引の件数を «n» 日間記録したところ、日ごとの件数は «data» だった（合計 $«T»$ 件、平均 $\bar x=«m»$、$\sum x_i^2=«sx2»$）。
          日ごとの件数が独立に同じポアソン分布に従う（帰無仮説）か、ポアソン分布より散らばりが大きい（過大分散、対立仮説）かを、分散指数
          $$D=\frac{\sum_{i=1}^{n}(x_i-\bar x)^2}{\bar x}$$
          で調べる。帰無仮説のもとで $D$ は近似的に自由度 $n-1$ のカイ二乗分布に従う。有意水準 5% の**片側**検定（$D$ が大きいとき棄却）とする。
          カイ二乗分布の上側 5% 点は、自由度 11 で «chi11»、自由度 12 で «chi12»、自由度 11 の上側 95% 点は «chi11_lo» である。$D$ の値と結論の組として正しいものを選べ。
        choices:
          - $D=«D»$ で «chi11» より小さいので、帰無仮説を棄却しない（過大分散があるとはいえない）
          - $D=«D»$ で «chi11_lo» より大きいので、帰無仮説を棄却する（過大分散がある）
          - $D=«D_raw»$ で «chi11» より大きいので、帰無仮説を棄却する（過大分散がある）
          - $D=«ratio»$ で «chi11» より小さいので、帰無仮説を棄却しない（過大分散があるとはいえない）
          - $D=«D»$ で «chi11» より小さいので、日ごとの件数がポアソン分布に従うことが示された
        answer: 0
        distractors:
          - 正解
          - 上側 5% 点の代わりに上側 95% 点（下側 5% 点）と比べた
          - 平均を引かずに Σx_i^2 / x̄ を計算した
          - 不偏分散と平均の比 s^2/x̄ を統計量と取り違えた（自由度 n−1 のカイ二乗分布に従うのは (n−1)s^2/x̄）
          - 棄却されないことを、帰無仮説が正しいことの証明と取り違えた
        explanation: |
          **方針** ポアソン分布では平均と分散が等しい。分散指数 $D=(n-1)s^2/\bar x$ は「不偏分散と平均の比」の $n-1$ 倍で、ポアソン分布なら近似的に $\chi^2(n-1)$ に従う。過大分散なら $D$ が大きくなるので、上側で棄却する。

          **途中式**
          - $\sum(x_i-\bar x)^2=\sum x_i^2-n\bar x^2=«sx2»-«n»\times«m»^2=«sx2»-«nm2»=«ss»$
          - $D=«ss»/«m»=«D»$、自由度 $«n»-1=«df»$
          - $«D»<«chi11»$ なので有意水準 5% で棄却しない

          **答え** $D=«D»$ で、過大分散があるとはいえない（選択肢 0）

          **間違えやすい点** 棄却しないことは「ポアソン分布に従うことが示された」ことを意味しない（«n» 日分のデータでは検出力も低い）。統計量は不偏分散と平均の比 $«ratio»$ そのものではなく、その $n-1$ 倍である。片側検定の棄却限界は上側 5% 点 «chi11» で、下側の点 «chi11_lo» と比べるのは誤り。

      - id: s19p02b
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, poisson-distribution]
        topic: 不正が1件以上あったカードだけの件数からゼロ切断ポアソン分布の母数を尤度方程式で推定する
        level: 応用
        definition: false
        type: choice
        question: |
          不正利用の被害が確認されたカード «ncard» 枚について、1 枚あたりの不正取引の件数を数えたところ、合計 «ntx» 件（平均 «xb» 件）だった。被害が 0 件のカードは記録に現れないので、
          件数 $X$ は「平均 $\lambda$ のポアソン分布を $X\ge1$ に制限した」ゼロ切断ポアソン分布 $P(X=x)=\dfrac{e^{-\lambda}\lambda^x}{x!\,(1-e^{-\lambda})}$（$x=1,2,\dots$）に従うとする。
          $\lambda$ の最尤推定値に最も近いものを選べ。必要なら次の値を使え。

          | $\lambda$ | «lc0» | «lc1» | «lc2» | «lc3» | «lc4» |
          |---|---|---|---|---|---|
          | $e^{-\lambda}$ | «ec0» | «ec1» | «ec2» | «ec3» | «ec4» |
        choices:
          - "$«lc0»$"
          - "$«lc1»$"
          - "$«lc2»$"
          - "$«lc3»$"
          - "$«lc4»$"
        answer: 2
        distractors:
          - どのカードにも必ずある 1 件を引き、平均から 1 を引いた値を答えた
          - 平均の逆数をとった（指数分布の最尤推定量と混同した）
          - 正解
          - 尤度方程式の右辺に x̄ を代入して λ = x̄(1−e^{−x̄}) と1回だけ計算した
          - 切断を無視して普通のポアソン分布の最尤推定量 x̄ を答えた
        explanation: |
          **方針** 対数尤度を $\lambda$ で微分して 0 とおくと、尤度方程式 $\bar x=\dfrac{\lambda}{1-e^{-\lambda}}$（切断分布の平均 = 標本平均）が得られる。選択肢の値を代入して確かめる。

          **途中式**
          - $\ell(\lambda)=\sum x_i\log\lambda-n\lambda-n\log(1-e^{-\lambda})+\text{定数}$
          - $\ell'(\lambda)=\dfrac{\sum x_i}{\lambda}-n-\dfrac{ne^{-\lambda}}{1-e^{-\lambda}}=\dfrac{\sum x_i}{\lambda}-\dfrac{n}{1-e^{-\lambda}}=0$ より $\bar x=\dfrac{\lambda}{1-e^{-\lambda}}$
          - 各候補の $\lambda/(1-e^{-\lambda})$：«lc0» → «gc0»、«lc1» → «gc1»、«lc2» → «gc2»、«lc3» → «gc3»、«lc4» → «gc4»
          - $\bar x=«xb»$ に一致するのは $\lambda=«lam»$

          **答え** $«lam»$

          **間違えやすい点** 0 件のカードが観測されないので、標本平均 «xb» は $\lambda$ を過大に見せる。切断を無視すると $\hat\lambda=«xb»$ となる。
          $\lambda/(1-e^{-\lambda})$ は $\lambda$ の増加関数なので、解はただ 1 つに決まる。

      - id: s19p02c
        chapter: 1
        terms: [bayes-theorem, conditional-independence, conditional-probability]
        topic: 条件付き独立でない2つの不正検知ルールが同時に陽性のときの不正の事後確率を同時陽性率から求め独立の仮定と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          取引の «pf»（0.2%）が不正である。2 つの検知ルール A・B の陽性率は次のとおりで、どちらも「同じ特徴（深夜・高額など）」に反応するため、不正・正常のどちらの取引でも A と B の陽性は独立ではない。

          | | A が陽性 | B が陽性 | A と B がともに陽性 |
          |---|---|---|---|
          | 不正な取引 | «sa_f» | «sb_f» | «both_f» |
          | 正常な取引 | «sa_l» | «sb_l» | «both_l» |

          A と B がともに陽性だった取引が不正である確率に最も近い値を選べ。
        choices:
          - "$«w_a»$"
          - "$«post»$"
          - "$«w_ind»$"
          - "$«w_like»$"
          - "$«w_noprior»$"
        answer: 1
        distractors:
          - A が陽性という情報だけで事後確率を求めた
          - 正解
          - 不正・正常のそれぞれで A と B が独立（条件付き独立）とみなし、陽性率の積を使った
          - 条件の向きを逆にし、P(ともに陽性 | 不正) を答えた
          - 不正の割合（事前確率）を使わずに尤度だけで比べた
        explanation: |
          **方針** ベイズの定理で $P(\text{不正}\mid A\cap B)=\dfrac{P(\text{不正})P(A\cap B\mid\text{不正})}{P(\text{不正})P(A\cap B\mid\text{不正})+P(\text{正常})P(A\cap B\mid\text{正常})}$。同時陽性率は表の値をそのまま使う。

          **途中式**
          - 分子：$«pf»\times«both_f»=«nf»$
          - 正常の項：$(1-«pf»)\times«both_l»=«nl»$
          - $P=\dfrac{«nf»}{«nf»+«nl»}=\dfrac{«nf»}{«dsum»}=«post4»\cdots$

          **答え** $«post»$

          **間違えやすい点** 正常な取引で A と B が独立なら同時陽性率は $«sa_l»\times«sb_l»=«prodl»$ のはずだが、実際は «both_l» と大きい。条件付き独立を仮定すると $«w_ind»$ となり、2 つのルールを重ねた効果を大きく見積もってしまう。

  - id: s19p03
    title: 定期預金の満期前解約と現在価値
    context: |
      ある銀行の長期の定期預金について、契約から満期前に解約されるまでの時間 $T$（年）が、レート $\lambda=«lam»$ の指数分布（密度 $f_T(t)=\lambda e^{-\lambda t}$、$t>0$、平均 «mean» 年）に従うとみなす。
      解約時点で 1 単位の払い戻しが生じるとし、それを年率 $\delta=«delta»$ の連続複利で現在に割り引いた係数 $D=e^{-\delta T}$（$0<D<1$）を考える。
    items:
      - id: s19p03a
        chapter: 4
        terms: [change-of-variables, exponential-distribution, cumulative-distribution-function]
        topic: 指数分布に従う解約時期を連続複利で割り引いた係数の密度関数を変数変換で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $D=e^{-\delta T}$ の確率密度関数 $f_D(d)$（$0<d<1$）として正しいものはどれか。
        choices:
          - "$«lam»\\,d^{«k»}$"
          - "$d^{«k»}$"
          - "$«k»d^{«km1»}$"
          - "$«k»(1-d)^{«km1»}$"
          - "$«inv»\\,d^{«invm1»}$"
        answer: 2
        distractors:
          - ヤコビアン |dt/dd|=1/(δd) を掛け忘れ、f_T(t(d)) だけを書いた
          - 密度ではなく分布関数 F_D(d) を答えた
          - 正解
          - D が T の減少関数であることを見落とし、P(D≦d)=P(T≦−log d/δ) として向きを逆にした
          - 指数を λ/δ ではなく δ/λ とした
        explanation: |
          **方針** $d=e^{-\delta t}$ は $t$ の減少関数。分布関数を経由して求めると向きを間違えにくい。逆変換は $t=-\log d/\delta$。

          **途中式**
          - $F_D(d)=P(e^{-\delta T}\le d)=P\left(T\ge-\dfrac{\log d}{\delta}\right)=\exp\left(\dfrac{\lambda}{\delta}\log d\right)=d^{\lambda/\delta}=d^{«k»}$（$\lambda/\delta=«lam»/«delta»=«k»$）
          - $f_D(d)=F_D'(d)=«k»d^{«km1»}\quad(0<d<1)$
          - ヤコビアンで確かめると $f_T\left(-\dfrac{\log d}{\delta}\right)\left|\dfrac{dt}{dd}\right|=\lambda d^{\lambda/\delta}\cdot\dfrac{1}{\delta d}=\dfrac{\lambda}{\delta}d^{\lambda/\delta-1}$ で一致する。

          **答え** $«k»d^{«km1»}$（ベータ分布 $\mathrm{Beta}(«k»,1)$）

          **間違えやすい点** ヤコビアン $1/(\delta d)$ を掛け忘れると $«lam»\,d^{«k»}$ になり、積分しても 1 にならない。$D$ は $T$ の減少関数なので「$D\le d$」は「$T\ge\cdots$」に対応する。

      - id: s19p03b
        chapter: 2
        terms: [moment-generating-function, expectation-variance-properties, exponential-distribution]
        topic: 指数分布の積率母関数を負の点で評価して割引現在価値の期待値と標準偏差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $T$ の積率母関数は $M_T(s)=E[e^{sT}]=\dfrac{\lambda}{\lambda-s}$（$s<\lambda$）である。これを使って、解約時に払い戻す 100 万円の現在価値 $100D$（万円）の**標準偏差**を求めよ。
        answer: «sd»
        tolerance: 0.01
        answer_format: 万円単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $E[D]=E[e^{-\delta T}]=M_T(-\delta)$、$E[D^2]=E[e^{-2\delta T}]=M_T(-2\delta)$ として積率母関数を負の点で評価する。途中は分数のまま計算する。

          **途中式**
          - $E[D]=M_T(-«delta»)=\dfrac{«lam»}{«lam»+«delta»}=«ed»$
          - $E[D^2]=M_T(-2\times«delta»)=\dfrac{«lam»}{«lam»+0.1}=«ed2_f»$
          - $V[D]=«ed2_f»-(«ed»)^2=«ed2_f»-«ed_sq»=«vd_f»$
          - $V[100D]=100^2\times«vd_f»=«vpv»$、標準偏差 $\sqrt{«vpv»}=«sd4»\cdots$

          **答え** $«sd_s»$ 万円（期待値は «pv_mean» 万円）

          **間違えやすい点** $M_T(\delta)$ と符号を誤ると $\lambda/(\lambda-\delta)=«w_plus»>1$ となり、$0<D<1$ に反する。分散 «w_var» のまま答えたり、$E[(100D)^2]$ の平方根 $«w_nosq»$ を答えたりしないこと。
          前問の $\mathrm{Beta}(«k»,1)$ の分散 $\dfrac{«k»\times1}{(«k»+1)^2(«k»+2)}=«vd_f»$ とも一致する。

  - id: s19p04
    title: 顧客アンケート調査
    context: |
      ある銀行は、個人顧客と法人顧客を対象に、取引の満足度や利用状況のアンケート調査を行う。
    items:
      - id: s19p04a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation, proportional-allocation]
        topic: 調査費用が層で異なるときの最適配分（N_h S_h/√c_h に比例）で法人顧客の層の標本数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          顧客を個人と法人の 2 層に分けて層別抽出し、年間の取引額の平均を推定する。各層の大きさ・取引額の標準偏差（万円）・1 件あたりの調査費用は次のとおりである。

          | 層 | 顧客数 $N_h$ | 標準偏差 $S_h$ | 1 件の調査費用 $c_h$ |
          |---|---|---|---|
          | 個人 | «N1» | «S1» | «c1» |
          | 法人 | «N2» | «S2» | «c2» |

          標本の合計を «ntot» 件とし、費用を考えた最適配分（$n_h$ を $N_hS_h/\sqrt{c_h}$ に比例させる）で配分するとき、法人の層の標本数を求めよ。
        answer: «n2»
        tolerance: 0.5
        answer_format: 整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 決まった総費用のもとで推定量の分散を最小にする（またはその逆）配分は $n_h\propto N_hS_h/\sqrt{c_h}$。費用が等しければネイマン配分 $n_h\propto N_hS_h$ になる。

          **途中式**
          - 個人：$«N1»\times«S1»/\sqrt{«c1»}=«w1»$
          - 法人：$«N2»\times«S2»/\sqrt{«c2»}=«N2»\times«S2»/«sc2»=«w2»$
          - 法人の標本数：$«ntot»\times\dfrac{«w2»}{«w1»+«w2»}=«ntot»\times\dfrac{«w2»}{«wsum»}=«n2_s»$

          **答え** «n2» 件（個人は «n1» 件）

          **間違えやすい点** 費用を無視したネイマン配分では法人に約 «w_ney» 件、比例配分では約 «w_prop» 件となる。$c_h$ の平方根ではなく $c_h$ そのもので割ると約 «w_cost» 件になる。
          法人はばらつきが大きいので多めに、1 件の調査費用が高いので少なめに配分される。

