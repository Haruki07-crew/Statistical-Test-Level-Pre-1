          - 総イナーシャ «in_j»、次元数 «dim_ok»
        answer: 2
        distractors:
          - 総イナーシャを J/Q とし、次元数から質問ごとの自明な次元を除かなかった
          - 次元数を J−1 とし、質問ごとの制約（各質問で 1 つだけ選ぶ）を Q 個ではなく 1 個と数えた
          - 正解
          - 総イナーシャを Q で割り忘れた
          - 総イナーシャを Q ではなく J で割った
        explanation: |
          **方針** 指示行列の対応分析では、総イナーシャは回答の中身によらず $(J-Q)/Q$ となる（$J$ はカテゴリーの総数、$Q$ は質問の数）。各質問の列の和はすべての行で 1 になるという制約が $Q$ 個あるので、意味のある次元は $J-Q$ 個まで。

          **途中式**
          - $J=«c1q»+«c2q»+«c3q»=«J»$、$Q=«Q»$
          - 総イナーシャ $=(«J»-«Q»)/«Q»=«in_ok»$
          - 次元の数 $=«J»-«Q»=«dim_ok»$

          **答え** 総イナーシャ «in_ok»、次元数 «dim_ok»

          **間違えやすい点** 多重対応分析の総イナーシャはデータに依存しないので、通常の対応分析のように「総イナーシャの大きさで関連の強さを測る」ことはできない（そのため各次元の寄与率は小さく出やすく、修正した寄与率が使われることもある）。

