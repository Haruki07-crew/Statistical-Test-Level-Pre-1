      - id: s19p07b
        chapter: 3
        terms: [skewness-kurtosis, expectation-variance-properties, bernoulli-distribution]
        topic: 貸倒れの有無で決まる1件の損失の歪度を求め独立な100件を束ねたときの損失合計の歪度を求める
        level: 標準
        definition: false
        type: choice
        question: |
          既存の少額ローンでは、1 件ごとに確率 $p=«p»$ で貸倒れが起き、そのとき損失 $c$（定数）が生じる。各件の貸倒れは互いに独立とする。
          歪度を $E[(X-\mu)^3]/\sigma^3$ で定めるとき、«nl» 件分の損失の合計の歪度に最も近い値を選べ。
        choices:
          - "$«w_n»$"
          - "$«skn»$"
          - "$«w_num»$"
          - "$«sk1»$"
          - "$«w_x»$"
        answer: 1
        distractors:
          - 合計の歪度を 1 件の歪度の 1/n とした
          - 正解
          - 3 次の中心モーメントを σ^3 で割らなかった（1−2p だけを答えた）
          - 1 件の損失の歪度を答えた
          - 合計にすると歪度が √n 倍になると逆に考えた
        explanation: |
          **方針** 歪度は尺度によらないので $c=1$（ベルヌーイ分布）で考えてよい。独立な和では、分散も 3 次の中心モーメント（3 次キュムラント）も足し算になる。

          **途中式**
          - 1 件：$\sigma^2=p(1-p)=«pq»$、$\sigma=«spq»$、$E[(X-p)^3]=p(1-p)(1-2p)$
          - 1 件の歪度 $=\dfrac{p(1-p)(1-2p)}{\{p(1-p)\}^{3/2}}=\dfrac{1-2p}{\sqrt{p(1-p)}}=\dfrac{«q2p»}{«spq»}=«sk1»$
          - $n$ 件の合計：分散 $np(1-p)$、3 次の中心モーメント $np(1-p)(1-2p)$ なので歪度 $=\dfrac{«sk1»}{\sqrt{n}}=\dfrac{«sk1»}{10}=«skn»$

          **答え** $«skn»$

          **間違えやすい点** 分母は $\sigma^3$ なので $(\sqrt n)^3$ 倍になり、分子の $n$ 倍と合わせて歪度は $1/\sqrt n$ 倍になる（$1/n$ 倍ではない）。
          件数を増やしても損失合計の分布はまだ右に裾が長く、正規近似では大きな損失の確率を過小評価しやすい。

      - id: s19p07c
        chapter: 31
        terms: [bayes-decision-theory, posterior-distribution, beta-binomial-model]
        topic: ベータ事後分布のもとで新商品の1件あたりの期待利益を求め貸出を続けるかをベイズ決定で判断する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい少額ローン商品の貸倒れ率 $\theta$ に、事前分布 $\mathrm{Beta}(«al»,«be»)$（平均 «prior_m»）をおく。発売後の «nn» 件のうち «y» 件が貸倒れた（$\theta$ が与えられたもとで各件は独立）。
          1 件の貸出は、貸倒れなければ «gain» 万円の利益、貸倒れれば «loss» 万円の損失になる。事後分布のもとでの 1 件あたりの期待利益が正なら貸出を続ける、という基準で判断する。
          期待利益と判断の組として正しいものを選べ。
        choices:
          - 期待利益 «w_mle» 万円で、貸出をやめる
          - 期待利益 «w_map» 万円で、貸出を続ける
          - 期待利益 «prof» 万円で、貸出を続ける
          - 期待利益 «w_prior» 万円で、貸出を続ける
          - 期待利益 «w_bad» 万円で、貸出を続ける
        answer: 2
        distractors:
          - 事前分布を無視して最尤推定値 4/50 を代入した
          - 事後分布の最頻値（MAP）を代入した。利益は θ の1次式なので事後平均を使う
          - 正解
          - データを使わず事前平均を代入した
          - 事後分布の第2母数に貸倒れなかった件数 46 ではなく件数 50 を足した
        explanation: |
          **方針** 利益は $«gain»(1-\theta)-«loss»\theta=«gain»-«gl»\theta$ で $\theta$ の 1 次式なので、その事後期待値は $\theta$ に事後平均を代入した値になる。

          **途中式**
          - 事後分布：$\mathrm{Beta}(«al»+«y»,\ «be»+«ny»)=\mathrm{Beta}(«ap»,«bp»)$、事後平均 $«ap»/«apb»=«pm»$
          - 期待利益 $=«gain»-«gl»\times«pm»=«prof»$ 万円 $>0$
          - 損益分岐点は $\theta^*=«gain»/«gl»=«thstar»$ で、事後平均はこれより小さい

          **答え** 期待利益 «prof» 万円で、貸出を続ける

          **間違えやすい点** 最尤推定値 $«mle»$ だけを見ると損益分岐点を超えるので「やめる」になるが、事前情報を合わせた事後平均 «pm» では続ける判断になる。
          推定の損失関数が 2 乗損失なら事後平均、絶対損失なら事後中央値、0-1 損失なら事後最頻値がベイズ推定量になるが、ここでは利益が $\theta$ の 1 次式なので事後平均だけで決まる。

  - id: s19p08
    title: 支店の事務ミス
    context: |
      ある銀行の支店で、窓口事務の誤りと、その点検の方法を調べている。
    items:
      - id: s19p08a
        chapter: 1
        terms: [inclusion-exclusion-principle, conditional-probability]
        topic: 4人分の通帳を無作為に返したとき誰も自分の通帳を受け取らない確率を包除原理で求める（完全順列）
        level: 基本
        definition: false
        type: choice
        question: |
          窓口で «np» 人の顧客から預かった通帳を、係員が取り違えて無作為に返してしまった（«np» 冊の返し方 $«np»!$ 通りが等確率）。
          «np» 人の誰も自分の通帳を受け取らない確率に最も近い値はどれか。
        choices:
          - "$«w_ind»$"
          - "$«w_e»$"
          - "$«der»$"
          - "$«w_trunc»$"
          - "$«w_comp»$"
        answer: 2
        distractors:
          - 各人が自分の通帳を受け取らない事象を独立とみなし (3/4)^4 とした
          - 人数が多いときの極限 e^{-1} を答えた
          - 正解
          - 包除原理を 2 人ずつの項で打ち切った
          - 少なくとも 1 人が自分の通帳を受け取る確率（余事象）を答えた
        explanation: |
          **方針** $A_i$ を「$i$ 番目の人が自分の通帳を受け取る」事象とし、包除原理で $P(A_1\cup\cdots\cup A_4)$ を求めて 1 から引く。$k$ 人を指定して全員が自分のを受け取る確率は $(4-k)!/4!$。

          **途中式**
          $$P\left(\bigcup A_i\right)=\binom41\frac{3!}{4!}-\binom42\frac{2!}{4!}+\binom43\frac{1!}{4!}-\binom44\frac{0!}{4!}=1-\frac12+\frac16-\frac1{24}$$
          $$P(\text{誰も自分のを受け取らない})=1-1+\frac12-\frac16+\frac1{24}=\frac{«nder»}{«fact»}=«der»$$

          **答え** $«der»$

          **間違えやすい点** 「$i$ 番目が自分のを受け取らない」事象どうしは独立ではないので、$(3/4)^4=«w_ind»$ とはできない。人数が増えると確率は $e^{-1}\approx«w_e»$ に近づくが、4 人ではまだ «der» である。

      - id: s19p08b
        chapter: 5
        terms: [hypergeometric-distribution, binomial-distribution]
        topic: 誤りを含む伝票の束から非復元で抜き取って誤りを少なくとも1件見つける確率を超幾何分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある支店の 1 日分の伝票 «N» 件のうち、ちょうど «D» 件に誤りがある。監査人が «n» 件を非復元で無作為に抜き取るとき、誤りのある伝票を少なくとも 1 件見つける確率に最も近い値はどれか。
        choices:
          - "$«w_p1»$"
          - "$«w_binom»$"
          - "$«ans»$"
          - "$«w_p0»$"
          - "$«w_mean»$"
        answer: 2
        distractors:
          - ちょうど 1 件見つける確率 P(X=1) を答えた
          - 復元抽出とみなし、二項分布で 1−0.94^10 とした
          - 正解
          - 余事象の確率 P(X=0) を答えた
          - 見つかる件数の期待値 nD/N を確率と取り違えた
        explanation: |
          **方針** 見つかる誤りの件数 $X$ は超幾何分布に従う。「少なくとも 1 件」は余事象 $X=0$ から求める。

          **途中式**
          $$P(X=0)=\frac{\binom{«ND»}{«n»}}{\binom{«N»}{«n»}}=\frac{40\cdot39\cdot38}{50\cdot49\cdot48}=\frac{«p0_num»}{«p0_den»}=«p0»$$
          （$\binom{47}{10}/\binom{50}{10}=\dfrac{47!\,40!}{37!\,50!}$ で、約分すると上の形になる）
          $$P(X\ge1)=1-«p0»=«ans4»\cdots$$

          **答え** $«ans»$

          **間違えやすい点** 非復元抽出では 1 件抜くごとに誤りのない伝票の割合が変わる。二項分布で $1-(1-«D»/«N»)^{«n»}=1-«q94»=«w_binom»$ とすると、見つける確率を低く見積もる。

  - id: s19p09
    title: ATM の引出額と稼働状態
    context: |
      ある銀行は、ATM に補充する現金の量と保守の体制を決めるため、ATM の利用と稼働の状態を調べている。
    items:
      - id: s19p09a
        chapter: 9
        terms: [ci-two-sample-mean-difference, welch-test, t-distribution]
        topic: 分散の異なる2台のATMの平均引出額の差のウェルチ型95%信頼区間を近似自由度から求める
        level: 標準
        definition: false
        type: choice
        question: |
          駅前の ATM で «n1» 日、住宅地の ATM で «n2» 日の 1 日の引出総額（百万円）を記録した。平均と不偏分散は、駅前 «m1»・«v1»、住宅地 «m2»・«v2» だった。
          各 ATM の日々の引出総額は互いに独立に正規分布に従い、2 台の母分散は等しいとは限らないとする。
          平均の差（駅前 − 住宅地）の 95% 信頼区間を、ウェルチ・サタースウェイトの近似自由度（小数点以下を切り捨てる）の $t$ 分布で作るとき、正しいものを選べ。
          $t$ 分布の上側 2.5% 点は、自由度 9 で «t9»、13 で «t13»、23 で «t23» である（標準正規分布では 1.96）。
        choices:
          - "$«ci_pool»$"
          - "$«ci_23»$"
          - "$«ci_ok»$"
          - "$«ci_z»$"
          - "$«ci_9»$"
        answer: 2
        distractors:
          - 等分散を仮定したプールした分散の t 区間で作った
          - 標準誤差は正しいが、自由度を n1+n2−2=23 とした
          - 正解
          - t 分布ではなく標準正規分布の 1.96 を使った
          - 自由度を小さいほうの標本の n−1=9 とした（保守的な近似）
        explanation: |
          **方針** 標準誤差は $\sqrt{s_1^2/n_1+s_2^2/n_2}$。自由度は $\nu=\dfrac{(s_1^2/n_1+s_2^2/n_2)^2}{\dfrac{(s_1^2/n_1)^2}{n_1-1}+\dfrac{(s_2^2/n_2)^2}{n_2-1}}$ で近似する。

          **途中式**
          - $s_1^2/n_1=«v1»/«n1»=«a»$、$s_2^2/n_2=«v2»/«n2»=«b»$、標準誤差 $\sqrt{«ab»}=«se»$
          - $\nu=\dfrac{«ab2»}{«a2»+«b2»}=«nu»$ → 切り捨てて «nuf»
          - 半幅 $=«t13»\times«se»=«half»$、差 $=«m1»-«m2»=«diff»$

          **答え** $«ci_ok»$

          **間違えやすい点** 分散が大きく違い（«v1» と «v2»）、標本の大きさも違うので、プールした分散を使う区間 $«ci_pool»$ は信頼係数が正しく保たれない。
          ウェルチの自由度は $\min(n_1,n_2)-1$ と $n_1+n_2-2$ の間の値になる。

      - id: s19p09b
        chapter: 14
        terms: [stationary-distribution, positive-recurrence, first-passage-time]
        topic: ATMの正常・軽障害・停止の3状態マルコフ連鎖の定常分布から停止状態への平均再帰時間を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある ATM の 1 日ごとの状態（正常 N、軽障害 M、停止 S）は、時間的に一様なマルコフ連鎖に従い、推移確率行列は次のとおりである。

          | 今日 ＼ 翌日 | N | M | S |
          |---|---|---|---|
          | N | «Pnn» | «Pnm» | «Pns» |
          | M | «Pmn» | «Pmm» | «Pms» |
          | S | «Psn» | «Psm» | «Pss» |

          この連鎖の定常分布は $(\pi_N,\pi_M,\pi_S)=(«piN»,\ «piM»,\ «piS»)$ である。停止状態 S にある日から数えて、次に S にいる日までの平均日数に最も近い値を選べ。
        choices:
          - "$«w_pi»$"
          - "$«w_stay»$"
          - "$«w_m1»$"
          - "$«ret»$"
          - "$«w_geo»$"
        answer: 3
        distractors:
          - 定常確率そのものを答えた
          - S にとどまる日数の平均 1/(1−P_SS) を答えた
          - 平均再帰時間 1/π_S から 1 を引いた
          - 正解
          - 正常状態から 1 日で停止する確率 0.04 の逆数を答えた
        explanation: |
          **方針** 既約で正再帰的なマルコフ連鎖では、状態 $i$ に戻るまでの平均時間（平均再帰時間）は $1/\pi_i$ である。長い期間では $\pi_i$ の割合の日が状態 $i$ にあるので、平均して $1/\pi_i$ 日に 1 回訪れる。

          **途中式**
          - 定常分布の確認：$\pi_S=«piN»\times«Pns»+«piM»\times«Pms»+«piS»\times«Pss»=\dfrac{2.4+0.6+2}{71}=\dfrac{5}{71}$
          - 平均再帰時間 $=1/\pi_S=71/5=«ret»$ 日

          **答え** $«ret»$ 日

          **間違えやすい点** 「S の日から次に S にいる日まで」は、翌日も S にとどまる場合（1 日で戻る）も含む。S に続けてとどまる平均日数 $1/(1-«Pss»)=«w_stay»$ とは別の量である。

  - id: s19p10
    title: 督促文面の小規模試行
    context: |
      返済が遅れている顧客 6 人を無作為に 3 人ずつに分け、新しい督促文面 A と従来の文面 B を送った。翌月の入金額（万円）は次のとおりだった。

      | 文面 | 入金額 |
      |---|---|
      | A | «A» |
      | B | «B» |
    items:
      - id: s19p10a
        chapter: 13
        terms: [permutation-test, nonparametric-methods-overview]
        topic: 3人ずつの無作為割り付けで入金額の平均の差を使う並べ替え検定の正確な片側p値を全20通りから求める
        level: 標準
        definition: false
        type: numeric
        question: |
          「文面の効果はない」という帰無仮説のもとでは、6 つの値がどちらの群に入るかは割り付けの偶然だけで決まる。
          A の平均 − B の平均を統計量とし、「A のほうが入金額が多い」を対立仮説とする並べ替え検定の正確な片側 p 値を求めよ。
        answer: «p»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 6 人から A 群の 3 人を選ぶ割り付けは $\binom63=«ncomb»$ 通りで、帰無仮説のもとではどれも等確率。6 つの値の合計 «tot» は一定なので、平均の差が大きいことは A 群の合計が大きいことと同じ。

          **途中式**
          - 観測：A の合計 «obs»、B の合計 «obsB»、平均の差 $«mA»-«mB»=«dobs»$
          - A 群の合計が «obs» 以上になる選び方：$\{12,11,9\}$（32）と $\{12,11,8\}$（31）の «ge» 通り（次に大きい $\{12,11,7\}$ は 30）
          - p 値 $=«ge»/«ncomb»=«p_s»$

          **答え** $«p_s»$

          **間違えやすい点** 観測値と同じ値（等号）も「観測以上に極端」に含める。含めないと $«w_gt»$ になる。両側にすると $«w_two»$。
          この標本の大きさでは、最も極端な割り付けでも p 値は $1/20=0.05$ までしか小さくならない。

  - id: s19p11
    title: 投資信託のシャープレシオ
    context: |
      ある銀行が販売する投資信託の、無リスク金利を上回る月次の超過収益率を «n» か月分調べたところ、標本平均は «mu»%、標本標準偏差は «sd»% だった。
      月次の超過収益率は互いに独立に正規分布 $N(\mu,\sigma^2)$ に従うとする。シャープレシオ $\mathrm{SR}=\mu/\sigma$ を $\widehat{\mathrm{SR}}=\bar x/s=«sr»$ で推定する。
    items:
      - id: s19p11a
        chapter: 7
        terms: [delta-method, asymptotic-normality-of-mle, standard-error]
        topic: 月次超過収益率のシャープレシオの推定値の標準誤差を平均と分散の2変量デルタ法で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          正規分布のもとで、$\bar X$ と $S^2$ は独立で、$V[\bar X]=\sigma^2/n$、$V[S^2]\approx2\sigma^4/n$ である。
          $g(\mu,\sigma^2)=\mu/\sqrt{\sigma^2}$ に 2 変量のデルタ法を使い、$\mu,\sigma$ に推定値を代入して $\widehat{\mathrm{SR}}$ の標準誤差を求めよ。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 2 変量のデルタ法：$V[g]\approx\left(\dfrac{\partial g}{\partial\mu}\right)^2V[\bar X]+\left(\dfrac{\partial g}{\partial\sigma^2}\right)^2V[S^2]$（共分散は 0）。

          **途中式**
          - $\dfrac{\partial g}{\partial\mu}=\dfrac1\sigma$、$\dfrac{\partial g}{\partial\sigma^2}=-\dfrac{\mu}{2\sigma^3}$
          - $V\approx\dfrac1{\sigma^2}\cdot\dfrac{\sigma^2}{n}+\dfrac{\mu^2}{4\sigma^6}\cdot\dfrac{2\sigma^4}{n}=\dfrac{1}{n}\left(1+\dfrac{\mathrm{SR}^2}{2}\right)$
          - 代入：$\dfrac{1+«sr2h»}{«n»}=«var»$、標準誤差 $\sqrt{«var»}=«se4»\cdots$

          **答え** $«se_s»$

          **間違えやすい点** 分母の $s$ も推定値なので、その変動の分（$\mathrm{SR}^2/2$ の項）を忘れると $\sqrt{1/«n»}=«w_mean»$ になる。単位（%）は比をとると消えるので、$\mu,\sigma$ を % のまま代入してよい。
          推定値 «sr» に対して標準誤差が «se_s» と大きく、«n» か月程度ではシャープレシオはかなり不確かである。

  - id: s19p12
    title: 金融リテラシー調査の主成分
    context: |
      ある金融機関が、家計管理・貯蓄・投資の 3 項目の金融リテラシーの得点を調べ、相関行列で主成分分析を行った。
      第 1・第 2 主成分の固有値と固有ベクトル（単位ベクトル）は次のとおりだった。

      | | 固有値 | 家計管理 | 貯蓄 | 投資 |
      |---|---|---|---|---|
      | 第 1 主成分 | «l1» | «e11» | «e12» | «e13» |
      | 第 2 主成分 | «l2» | «e21» | «e22» | «e23» |
    items:
      - id: s19p12a
        chapter: 22
        terms: [principal-component-loading, pca-on-correlation-matrix, eigenvalue-and-eigenvector]
        topic: 相関行列の主成分の固有値と固有ベクトルから第2主成分までで説明される1つの変数の分散の割合を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          標準化した「家計管理」の得点の分散（= 1）のうち、第 1 主成分と第 2 主成分で説明される割合を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 相関行列の主成分分析では、変数 $j$ と第 $k$ 主成分の相関（主成分負荷量）は $\sqrt{\lambda_k}\,e_{kj}$ で、その 2 乗 $\lambda_ke_{kj}^2$ が第 $k$ 主成分で説明される変数 $j$ の分散の割合になる。

          **途中式**
          - 第 1 主成分：$«l1»\times«e11»^2=«l1»\times«e11sq»=«a1»$
          - 第 2 主成分：$«l2»\times«e21»^2=«l2»\times«e21sq»=«a2»$
          - 合計 $=«a1»+«a2»=«ans4»\cdots$

          **答え** $«ans_s»$

          **間違えやすい点** 固有ベクトルの成分の 2 乗和 $«e11»^2+«e21»^2=«w_e2»$ だけでは固有値の重みが入っていない。固有ベクトルの成分は「主成分の係数」で、変数との相関（負荷量）にするには $\sqrt{\lambda_k}$ を掛ける。
          全主成分まで足すと各変数で 1 になる（残りは第 3 主成分が説明する）。

  - id: s19p13
    title: 支店と曜日の窓口待ち時間
    context: |
      ある銀行の 4 支店（A〜D）で、月・水・金の 3 つの曜日に 1 日ずつ、窓口の平均待ち時間（分）を測った。

      | 支店 | 月 | 水 | 金 | 平均 |
      |---|---|---|---|---|
      | A | «yA0» | «yA1» | «yA2» | «mA» |
      | B | «yB0» | «yB1» | «yB2» | «mB» |
      | C | «yC0» | «yC1» | «yC2» | «mC» |
      | D | «yD0» | «yD1» | «yD2» | «mD» |
      | 平均 | «c0» | «c1» | «c2» | «gm» |

      全体の平方和は «sst» である。
    items:
      - id: s19p13a
        chapter: 20
        terms: [two-way-anova-without-replication, sum-of-squares-decomposition, randomized-block-design]
        topic: 繰り返しのない二元配置で曜日の効果を除いて支店の窓口待ち時間の差をF値で調べる
        level: 標準
        definition: false
        type: numeric
        question: |
          支店と曜日の 2 因子で、繰り返しのない二元配置の分散分析（交互作用は誤差に含める）を行う。支店の効果を調べる $F$ 値を求めよ。
        answer: «F»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 全体の平方和を、支店の平方和・曜日の平方和・残差（誤差）の平方和に分ける。支店の平方和は「支店平均 − 全平均」の 2 乗和に曜日の数 3 を掛け、曜日の平方和は「曜日平均 − 全平均」の 2 乗和に支店の数 4 を掛ける。

          **途中式**
          - 支店：$3\times\{(«dA»)^2+(«dB»)^2+(«dC»)^2+(«dD»)^2\}=«ssa»$、自由度 «dfa»
          - 曜日：$4\times\{(«dc0»)^2+(«dc1»)^2+(«dc2»)^2\}=«ssb»$、自由度 «dfb»
          - 誤差：$«sst»-«ssa»-«ssb»=«sse»$、自由度 $3\times2=«dfe»$
          - $F=\dfrac{«ssa»/«dfa»}{«sse»/«dfe»}=\dfrac{«msa»}{«mse»}=«F_s»$

          **答え** $«F_s»$（$F_{0.05}(3,6)=«fcrit»$ を大きく超え、支店による差がある）

          **間違えやすい点** 曜日の効果を無視して一元配置にすると、曜日の変動が誤差に入り $F=«F1»$（自由度 3, «dfe1»）と小さくなる。曜日をブロックとして除くことで、支店の比較の精度が上がる（乱塊法と同じ考え方）。

  - id: s19p14
    title: 不正被害の症例対照研究
    context: |
      カードの不正利用の被害にあった口座（症例）«na» 件と、被害のない口座から無作為に選んだ対照 «nc» 件について、過去 1 年に海外のサイトで利用したことがあるかを調べた。

      | | 海外サイト利用あり | なし | 計 |
      |---|---|---|---|
      | 被害あり（症例） | «a» | «b» | «na» |
      | 被害なし（対照） | «c» | «d» | «nc» |
    items:
      - id: s19p14a
        chapter: 28
        terms: [odds-ratio-interval, cohort-and-case-control-study, two-by-two-table]
        topic: 不正被害の症例対照研究で海外サイト利用のオッズ比の95%信頼区間を対数変換（ウルフの方法）で求める
        level: 標準
        definition: false
        type: choice
        question: |
          海外サイト利用の被害に対するオッズ比の 95% 信頼区間を、対数オッズ比の標準誤差 $\sqrt{1/a+1/b+1/c+1/d}$ を使う方法で求める。正しいものを選べ。
          必要なら $\log(8/3)=«lnor»$、$e^{0.6066}=1.834$、$e^{1.3550}=3.877$、$e^{0.6667}=1.948$、$e^{1.2949}=3.651$ を使え。
        choices:
          - "$«ci_raw»$"
          - "$«ci_ok»$"
          - "$«ci_90»$"
          - "$«ci_log»$"
          - "$«ci_half»$"
        answer: 1
        distractors:
          - 対数をとらずにオッズ比の尺度で ±1.96×標準誤差 とした
          - 正解
          - 90% の係数 1.645 を使った
          - 対数オッズ比の区間のまま、指数で戻さなかった
          - 標準誤差に症例の 2 つのセル 1/a+1/b だけを使った
        explanation: |
          **方針** オッズ比 $\dfrac{ad}{bc}$ の対数は正規分布に近いので、対数の尺度で区間を作ってから指数で戻す。

          **途中式**
          - オッズ比 $=\dfrac{«a»\times«d»}{«b»\times«c»}=«or»$（$=8/3$）、$\log=«lnor»$
          - 標準誤差 $=\sqrt{\dfrac1{«a»}+\dfrac1{«b»}+\dfrac1{«c»}+\dfrac1{«d»}}=\sqrt{«sum»}=«se»$、$1.96\times«se»=«h»$
          - 対数の区間：$(«lnor»-«h»,\ «lnor»+«h»)=(«lo»,\ «hi»)$
          - 指数で戻す：$(e^{«lo»},\ e^{«hi»})=(«elo»,\ «ehi»)$

          **答え** $«ci_ok»$（1 を含まないので、海外サイトの利用は被害と関連があるといえる）

          **間違えやすい点** 症例対照研究では、症例と対照の数を調査者が決めているので、被害率や相対危険（リスク比）は直接推定できない。オッズ比はどちらの向きに条件付けても同じ値になるので推定でき、被害がまれなら相対危険の近似になる。
          区間はオッズ比 «or3» について左右対称ではない（対数の尺度で対称）。
