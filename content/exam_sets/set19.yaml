          **答え** $«d_s»$（2 よりかなり小さいので、正の系列相関が疑われる。$d\approx2(1-\hat\rho)$ より $\hat\rho\approx«w_rd»$、残差から直接求めた 1 次の自己相関は «r1»）

          **間違えやすい点** 分子と分母を逆にすると $«w_inv»$ になる。差の平方和を残差平方和で割ったあとさらに 2 で割らないこと（$«w_half»$）。
          $d$ は 0〜4 の値をとり、2 に近いと系列相関なし、0 に近いと正の系列相関、4 に近いと負の系列相関を示す。

