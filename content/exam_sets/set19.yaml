        type: choice
        question: |
          アンケートの 3 つの質問（主な取引チャネル：«c1q» 区分、取引の目的：«c2q» 区分、取引年数：«c3q» 区分）の回答に多重対応分析を行う。どの回答者も各質問でちょうど 1 つの区分を選び、欠測はない。
          回答者 × 全カテゴリー（計 «J» 列）の 0/1 の指示行列に対応分析を行うとき、総イナーシャと、意味のある（自明でない）次元の最大数の組として正しいものを選べ（回答者の数はカテゴリーの数より十分多いとする）。
        choices:
