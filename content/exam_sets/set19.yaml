          $d$ は 0〜4 の値をとり、2 に近いと系列相関なし、0 に近いと正の系列相関、4 に近いと負の系列相関を示す。

      - id: s19p06b
        chapter: 27
        terms: [ma-model, autocovariance-autocorrelation, white-noise]
        topic: MA(2)モデルの係数から1次から3次の自己相関係数を求め3次以降が0になることを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          系列相関をとり入れるため、誤差 $u_t$ を MA(2) モデル
          $$u_t=\varepsilon_t+«t1»\varepsilon_{t-1}-«mt2»\varepsilon_{t-2}$$
          （$\varepsilon_t$ は平均 0、分散 $\sigma^2$ のホワイトノイズ）で表す。$u_t$ の 1〜3 次の自己相関係数 $\rho(1)$、$\rho(2)$、$\rho(3)$ の組として正しいものを選べ。
        choices:
          - "$«c_th»$"
          - "$«c_nox»$"
          - "$«c_ok»$"
          - "$«c_nog»$"
          - "$«c_dec»$"
        answer: 2
        distractors:
          - MA の係数そのものを自己相関とした
          - ρ(1) の分子で θ1θ2 の項を落とした
          - 正解
          - 自己共分散を γ(0) で割らなかった
          - AR モデルのように 3 次以降も減衰しながら残ると考えた
        explanation: |
          **方針** $\theta_1=«t1»$、$\theta_2=«t2»$ とおく。$\varepsilon$ が互いに無相関なので、自己共分散は共通する $\varepsilon$ の係数の積の和になる。

          **途中式**
          - $\gamma(0)=(1+\theta_1^2+\theta_2^2)\sigma^2=(1+0.25+0.09)\sigma^2=«g0»\sigma^2$
          - $\gamma(1)=(\theta_1+\theta_1\theta_2)\sigma^2=(«t1»+(«t1t2»))\sigma^2=«num1»\sigma^2$、$\rho(1)=«num1»/«g0»=«rho1»$
          - $\gamma(2)=\theta_2\sigma^2$、$\rho(2)=«t2»/«g0»=«rho2»$
          - $k\ge3$ では共通する $\varepsilon$ がないので $\gamma(3)=0$、$\rho(3)=0$

          **答え** $«c_ok»$

          **間違えやすい点** MA($q$) の自己相関は $q$ 次より先で 0 に切れる（AR モデルのように減衰しながら続くのではない）。この性質がコレログラムで MA の次数を見分ける手がかりになる。

