      スコアの平均は $\bar x=«xbar»$、偏差平方和は $S_{xx}=«sxx»$、残差の標準偏差（残差平方和を自由度 $n-2=«dfe»$ で割った平方根）は $s=«sd»$ だった。
    items:
      - id: s19p05a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, least-squares-method, t-distribution]
        topic: スコアが一定の契約全体の平均上乗せ幅の95%信頼区間の半幅を平均の推定の標準誤差から求め予測区間と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          スコア $x_0=«x0»$ の契約**全体の平均**の上乗せ幅 $E[y\mid x_0]$ の 95% 信頼区間を作る。区間の半幅（推定値 ± の幅）に最も近いものを選べ。$t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t18»$ である。
        choices:
          - "$«w_nodev»$"
          - "$«w_lin»$"
          - "$«w_z»$"
          - "$«half»$"
          - "$«w_pred»$"
        answer: 3
        distractors:
          - 平均からの距離の項 (x0−x̄)^2/Sxx を落とした
          - (x0−x̄) を 2 乗し忘れた
          - t 分布の点ではなく標準正規分布の 1.96 を使った
          - 正解
          - 平均ではなく 1 件の新しい契約の予測区間（1 を足す）の半幅を答えた
        explanation: |
          **方針** 平均応答の推定値 $\hat y_0=\hat\beta_0+\hat\beta_1x_0$ の分散は $\sigma^2\left\{\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}\right\}$。$\sigma$ を $s$ で置き換え、自由度 $n-2$ の $t$ 分布を使う。

          **途中式**
          - $\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}=\dfrac1{«n»}+\dfrac{(«x0»-«xbar»)^2}{«sxx»}=«k1»+«k2»=«k»$
          - 標準誤差 $=«sd»\times\sqrt{«k»}=«sd»\times«sqk»=«se_m»$
          - 半幅 $=«t18»\times«se_m»=«half4»\cdots$

          **答え** 約 $«half»$（%）

          **間違えやすい点** 1 件の新しい契約の上乗せ幅を予測する予測区間は、誤差 $\varepsilon$ の分の 1 を足して $s\sqrt{1+«k»}$ を使い、半幅は約 «w_pred» と広くなる。平均の区間は $n$ を増やせば 0 に近づくが、予測区間はそうならない。
          $x_0$ が $\bar x$ から離れるほど、どちらの区間も広くなる。

      - id: s19p05b
        chapter: 30
        terms: [bic, model-selection, marginal-likelihood]
        topic: 2つの回帰モデルのBICの差からベイズ因子を近似し等しい事前確率のもとでのモデルの事後確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          上乗せ幅のモデルとして、M1（スコアだけ）と M2（スコアと地域ダミー）を比べたところ、BIC（$-2\log L+k\log n$）は M1 が «bic1»、M2 が «bic2» だった。
          BIC がモデルの周辺尤度の近似 $-2\log p(\text{データ}\mid M)$ になることを使い、2 つのモデルの事前確率を等しくしたときの M1 の事後確率を近似する。最も近い値を選べ。
          必要なら $e^{2.1}=«e21»$、$e^{-2.1}=«em21»$、$e^{4.2}=«e42»$ を使え。
        choices:
          - "$«w_m2»$"
          - "$«w_ratio»$"
          - "$«w_exp»$"
          - "$«post»$"
          - "$«w_no2»$"
        answer: 3
        distractors:
          - M2 の事後確率を答えた
          - BIC の値そのものの比を確率とした
          - 事後確率を 1−e^{−ΔBIC/2} とした
          - 正解
          - ベイズ因子を e^{ΔBIC/2} ではなく e^{ΔBIC} とした
        explanation: |
          **方針** $p(\text{データ}\mid M)\approx\exp(-\mathrm{BIC}/2)$ なので、ベイズ因子 $B_{12}\approx\exp\{(\mathrm{BIC}_2-\mathrm{BIC}_1)/2\}$。事前確率が等しければ、事後確率は $B_{12}/(1+B_{12})$。

          **途中式**
          - $\Delta=\mathrm{BIC}_2-\mathrm{BIC}_1=«bic2»-«bic1»=«dbic»$
          - $B_{12}\approx e^{«dbic»/2}=e^{2.1}=«e21»$
          - $P(M_1\mid\text{データ})\approx\dfrac{«e21»}{1+«e21»}=«post»$

          **答え** $«post»$

          **間違えやすい点** BIC は $-2\times$（対数周辺尤度）の近似なので、差を 2 で割ってから指数をとる。2 で割らないと $«w_no2»$ と過大になる。
          BIC の差 2〜6 は「M1 を支持する正の証拠」程度とされ、AIC の差とは解釈の根拠が異なる。

