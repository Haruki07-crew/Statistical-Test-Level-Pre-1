          回答者 × 全カテゴリー（計 «J» 列）の 0/1 の指示行列に対応分析を行うとき、総イナーシャと、意味のある（自明でない）次元の最大数の組として正しいものを選べ（回答者の数はカテゴリーの数より十分多いとする）。
