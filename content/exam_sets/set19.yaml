set: 19
title: 模擬試験 第19回
minutes: 90
problems:
  - id: s19p01
    title: カードローンの延滞（店頭とWeb）
    context: |
      ある銀行は、カードローンの 1 年以内の延滞を、申込経路（店頭・Web）ごとに調べ、延滞を予測するモデルも作っている。
    items:
      - id: s19p01a
        chapter: 12
        terms: [two-sample-proportion-test, proportion-test, pearson-chi-square-statistic]
        topic: 店頭とWebの申込者の延滞率の差をプールした割合を使う2標本の比率の検定で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ店頭申込の «n1» 件のうち «x1» 件、Web 申込の «n2» 件のうち «x2» 件が 1 年以内に延滞した。
          「2 つの経路の延滞率は等しい」という帰無仮説を、帰無仮説のもとで共通の延滞率（2 群を合わせた割合）を使って標準誤差を求める $z$ 検定で調べる（連続修正はしない）。
          検定統計量 $z=(\hat p_{\text{Web}}-\hat p_{\text{店頭}})/\text{標準誤差}$ の値に最も近いものを選べ。
        choices:
          - "$«z_add»$"
          - "$«z_yates»$"
          - "$«z»$"
          - "$«z_un»$"
          - "$«chi»$"
        answer: 2
        distractors:
          - 標準誤差を √(p̄q̄/n1)+√(p̄q̄/n2) と、平方根を別々にとって足した
          - 指定に反して連続修正 (1/n1+1/n2)/2 を差から引いた
          - 正解
          - 共通の割合を使わず、群ごとの割合で標準誤差を作った（ワルド型）
          - z ではなく、同値な 2×2 分割表のカイ二乗統計量 z^2 を答えた
        explanation: |
          **方針** 帰無仮説 $p_{\text{店頭}}=p_{\text{Web}}$ のもとでは両群の延滞率は共通なので、2 群を合わせた割合 $\bar p$ で差の分散 $\bar p(1-\bar p)(1/n_1+1/n_2)$ を作る。

          **途中式**
          - $\hat p_{\text{店頭}}=«x1»/«n1»=«p1»$、$\hat p_{\text{Web}}=«x2»/«n2»=«p2»$
          - $\bar p=(«x1»+«x2»)/(«n1»+«n2»)=«xs»/«ns»=«pb»$
          - 分散：$«pb»\times«qb»\times(1/«n1»+1/«n2»)=«pb»\times«qb»\times«inv»=«var0»$、標準誤差 $=«se»$
          - $z=«dp»/«se»=«z4»\cdots$

          **答え** $«z»$（両側 5% の棄却限界 1.96 を超えるので、延滞率に差があるといえる）

          **間違えやすい点** 群ごとの割合で標準誤差を作ると $«z_un»$ になる（信頼区間ではこちらを使うが、検定では帰無仮説のもとの共通の割合を使う）。
          この $z$ の 2 乗 $«chi»$ は、2×2 分割表の独立性のカイ二乗統計量（連続修正なし）と一致する。

      - id: s19p01b
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, cohort-and-case-control-study]
        topic: 延滞者を全件・非延滞者を一部だけ抽出した学習データのロジスティック回帰の切片を補正して母集団の延滞確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          延滞はまれなので、学習データには延滞した契約を**全件**、延滞しなかった契約は**無作為に 10%** だけ入れ（抽出は延滞の有無だけで決まる）、スコア $x$ を説明変数とするロジスティック回帰
          $\log\dfrac{p}{1-p}=\beta_0+\beta_1x$ を当てはめた。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=-«b1»$ だった（$p$ は延滞確率、対数は自然対数）。
          このモデルを使って、**全契約（母集団）**のうちスコア $x=«x»$ の契約の延滞確率を推定する。最も近い値を選べ。必要なら $e^{1.6}=«e16»$、$\log10=«ln10»$ を使え。
        choices:
          - "$«p_raw10»$"
          - "$«p_ok»$"
          - "$«p_odds»$"
          - "$«p_raw»$"
          - "$«p_rev»$"
        answer: 1
        distractors:
          - 補正前の確率 0.168 に抽出率 0.1 を掛けた（補正はオッズに掛ける）
          - 正解
          - 補正後のオッズ 0.0202 をそのまま確率とした
          - 抽出の偏りを補正せず、学習データのモデルのまま確率を求めた
          - 補正の向きを逆にし、オッズを 10 倍した
        explanation: |
          **方針** 延滞の有無だけで抽出率が決まるとき、学習データの延滞のオッズは母集団のオッズの (延滞者の抽出率)/(非延滞者の抽出率) $=1/«f0»=10$ 倍になる。
          そのため傾き $\beta_1$（オッズ比）は変わらず、切片だけが $\log10$ ずれる。母集団の切片は $\hat\beta_0-\log10$。

          **途中式**
          - 学習データでの線形予測子：$«b0»-«b1»\times«x»=«eta»$、学習データのオッズ $e^{-1.6}=1/«e16»=«odds_s»$
          - 母集団のオッズ：$«odds_s»\div10=«odds_p»$（切片を $\log10=«ln10»$ 下げるのと同じ）
          - 確率：$p=\dfrac{\text{オッズ}}{1+\text{オッズ}}=\dfrac{1}{1+10\times«e16»}=\dfrac{1}{«den»}=«p_ok5»\cdots$

          **答え** $«p_ok»$

          **間違えやすい点** 補正しないと $«p_raw»$ となり、延滞を大きく見積もる。補正はオッズ（ロジットの尺度）で行い、確率に 0.1 を掛ける（$«p_raw10»$）のは誤り。
          症例対照研究でオッズ比は推定できるが絶対的な確率は推定できないのと同じ理由で、抽出率がわかって初めて切片を補正できる。

  - id: s19p02
    title: 加盟店の不正利用の発生間隔
    context: |
      ある加盟店で不正利用が起きる時間間隔 $X_1,\dots,X_{«n»}$（日）を «n» 回分記録した。$X_i$ は互いに独立に、レート $\lambda$ の指数分布（密度 $\lambda e^{-\lambda x}$、$x>0$、平均 $1/\lambda$ 日）に従うとする。
      合計 $S=\sum X_i$ は形状 «n»・レート $\lambda$ のガンマ分布に従い、$2\lambda S$ は自由度 $2n=«df»$ のカイ二乗分布に従う。観測された合計は $S=«S»$ 日だった。
    items:
      - id: s19p02a
        chapter: 8
        terms: [cramer-rao-inequality, unbiased-estimator, efficient-estimator]
        topic: 指数分布のレートの不偏推定量の分散をクラメール・ラオの下限と比べて効率を求める（下限に達しない例）
        level: 応用
        definition: false
        type: choice
        question: |
          $\lambda$ の不偏推定量 $\tilde\lambda=(n-1)/S$ について、$E[1/S]=\lambda/(n-1)$、$E[1/S^2]=\lambda^2/\{(n-1)(n-2)\}$ が成り立つ。
          クラメール・ラオの下限を $V[\tilde\lambda]$ で割った比（効率）を、$n=«n»$ として求めよ。
        choices:
          - "$«w_nm1»$"
          - "$«eff»$"
          - "$«one»$"
          - "$«w_nm2»$"
          - "$«w_inv»$"
        answer: 1
        distractors:
          - 分散を λ^2/(n−1) と誤り、比を (n−1)/n とした
          - 正解
          - 不偏推定量なら必ず下限に達すると誤解した
          - クラメール・ラオの下限を λ^2/(n−1) と誤った
          - 比を逆に V[λ~]/下限 とした
        explanation: |
          **方針** $V[\tilde\lambda]=E[\tilde\lambda^2]-\lambda^2$ を与えられたモーメントで求め、1 個あたりのフィッシャー情報量 $I(\lambda)$ から下限 $1/\{nI(\lambda)\}$ を求める。

          **途中式**
          - $V[\tilde\lambda]=(n-1)^2E[1/S^2]-\lambda^2=\dfrac{(n-1)\lambda^2}{n-2}-\lambda^2=\dfrac{\lambda^2}{n-2}$
          - $\log f(x)=\log\lambda-\lambda x$ より $\dfrac{\partial^2}{\partial\lambda^2}\log f=-\dfrac1{\lambda^2}$、$I(\lambda)=1/\lambda^2$、下限は $\lambda^2/n$
          - 効率 $=\dfrac{\lambda^2/n}{\lambda^2/(n-2)}=\dfrac{n-2}{n}=\dfrac{«nm2»}{«n»}=«eff»$

          **答え** $«eff»$

          **間違えやすい点** 不偏推定量の分散は下限以上だが、下限に達するとは限らない（指数分布では、平均 $1/\lambda$ の不偏推定量 $\bar X$ は下限に達するが、$\lambda$ の不偏推定量は達しない）。
          $\tilde\lambda$ は一様最小分散不偏推定量だが、効率は 1 より小さい。$n\to\infty$ で効率は 1 に近づく。

      - id: s19p02b
        chapter: 10
        terms: [uniformly-most-powerful-test, power-function, chi-squared-distribution]
        topic: 指数分布の発生率の上昇を検出する一様最強力検定の棄却域をカイ二乗分布で決め対立仮説のもとでの検出力を求める
        level: 応用
        definition: false
        type: choice
        question: |
          帰無仮説 $H_0:\lambda=«lam0»$（平均 10 日に 1 回）、対立仮説 $H_1:\lambda>«lam0»$（不正が増えた）を、有意水準 5% の一様最強力検定で調べる。この検定は $S$ が小さいときに棄却する。
          自由度 «df» のカイ二乗分布の分布関数 $F(x)$ の値は次のとおりである（$F(«q05»)=0.050$ なので、«q05» は下側 5% 点）。

          | $x$ | 5.43 | 10.85 | 21.70 | 31.41 | 43.40 |
          |---|---|---|---|---|---|
          | $F(x)$ | «F543» | «F1085» | «F2170» | «F3141» | «F4340» |

          $\lambda=«lam1»$ のときの、この検定の検出力に最も近い値を選べ。
        choices:
          - "$«size»$"
          - "$«w_one»$"
          - "$«power»$"
          - "$«w_ratio»$"
          - "$«w_two»$"
        answer: 2
        distractors:
          - 検出力ではなく有意水準（帰無仮説のもとで棄却する確率）を答えた
          - 棄却しない確率（第2種の過誤の確率）を答えた
          - 正解
          - λ1/λ0 を逆に使い、F(0.5×10.85) とした
          - 棄却域を作るときに 2λ の 2 を落として S ≤ 108.5 とした
        explanation: |
          **方針** 指数分布は単調尤度比をもつので、$\lambda$ が大きい側への片側検定では $S$ が小さいときに棄却する検定が一様最強力になる。棄却限界を $H_0$ のもとの分布で決め、検出力は $H_1$ のもとの分布で計算する。

          **途中式**
          - $H_0$ のもとで $2\times«lam0»\times S\sim\chi^2(«df»)$。$P(2\times«lam0»S\le«q05»)=0.05$ より棄却域は $S\le«q05»/(2\times«lam0»)=«cut»$
          - 観測値 $S=«S»$ は棄却域に入る（$2\times«lam0»\times«S»=«stat»<«q05»$）
          - $\lambda=«lam1»$ では $2\times«lam1»\times S\sim\chi^2(«df»)$。検出力 $=P(S\le«cut»)=P(\chi^2(«df»)\le2\times«lam1»\times«cut»)=F(«arg»)=«power»$

          **答え** $«power»$

          **間違えやすい点** 棄却域は $H_0$ の分布で、検出力は $H_1$ の分布で計算する。$\lambda$ が 2 倍になるとカイ二乗の尺度の値も 2 倍（«q05» → «arg»）になる。$\lambda$ が大きいほど間隔が短くなるので、$S$ が小さい側で棄却する。

      - id: s19p02c
        chapter: 30
        terms: [kullback-leibler-divergence, model-selection, expected-log-likelihood]
        topic: 真の指数分布に対して平均を半分と2倍にした2つの候補分布のカルバック・ライブラー情報量を比べる
        level: 標準
        definition: false
        type: choice
        question: |
          真の間隔の分布がレート «lam0» の指数分布（平均 10 日）であるとする。候補のモデルとして、A：レート 0.2（平均 5 日）、B：レート 0.05（平均 20 日）の指数分布を考える。
          真の分布 $f$ から候補 $g$ へのカルバック・ライブラー情報量 $D(f\,\|\,g)=E_f[\log f(X)-\log g(X)]$ で近さを測るとき、A と B の値と、より近い候補の組として正しいものを選べ。必要なら $\log2=«ln2»$ を使え。
        choices:
          - "A: «klA»、B: «klB»。A のほうが近い"
          - "A: «klB»、B: «klA»。A のほうが近い"
          - "A: «klA_s»、B: «klB_s»。B のほうが近い"
          - "A: «klA»、B: «klB»。B のほうが近い"
          - A と B は平均がどちらも 2 倍ずれているので、値は等しい
        answer: 3
        distractors:
          - 値は正しいが、情報量が大きいほうを近いと読んだ
          - f と g を入れ替えて D(g||f) を計算した
          - log(λ/λ0) の符号を取り違えた（情報量は負にならない）
          - 正解
          - カルバック・ライブラー情報量が対称で、比のずれだけで決まると誤解した
        explanation: |
          **方針** $f(x)=\lambda_0e^{-\lambda_0x}$、$g(x)=\lambda e^{-\lambda x}$ とすると $\log f-\log g=\log(\lambda_0/\lambda)-(\lambda_0-\lambda)x$。$E_f[X]=1/\lambda_0$ を代入する。

          **途中式**
          - $D(f\|g)=\log\dfrac{\lambda_0}{\lambda}+\dfrac{\lambda}{\lambda_0}-1$
          - A（$\lambda=0.2$）：$\log0.5+2-1=1-«ln2»=«klA»$
          - B（$\lambda=0.05$）：$\log2+0.5-1=«ln2»-0.5=«klB»$

          **答え** A: «klA»、B: «klB» で、B のほうが近い

          **間違えやすい点** カルバック・ライブラー情報量は非対称で、$D(g\|f)$ を計算すると A と B の値が入れ替わり、結論が逆になる。値は常に 0 以上で、小さいほど近い。
          AIC は、この情報量のうちモデルによって変わる部分（期待対数尤度）を推定して比べる規準である。

  - id: s19p03
    title: 定期預金の満期前解約と現在価値
    context: |
      ある銀行の長期の定期預金について、契約から満期前に解約されるまでの時間 $T$（年）が、レート $\lambda=«lam»$ の指数分布（密度 $f_T(t)=\lambda e^{-\lambda t}$、$t>0$、平均 «mean» 年）に従うとみなす。
      解約時点で 1 単位の払い戻しが生じるとし、それを年率 $\delta=«delta»$ の連続複利で現在に割り引いた係数 $D=e^{-\delta T}$（$0<D<1$）を考える。
    items:
      - id: s19p03a
        chapter: 4
        terms: [change-of-variables, exponential-distribution, cumulative-distribution-function]
        topic: 指数分布に従う解約時期を連続複利で割り引いた係数の密度関数を変数変換で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $D=e^{-\delta T}$ の確率密度関数 $f_D(d)$（$0<d<1$）として正しいものはどれか。
        choices:
          - "$«lam»\\,d^{«k»}$"
          - "$d^{«k»}$"
          - "$«k»d^{«km1»}$"
          - "$«k»(1-d)^{«km1»}$"
          - "$«inv»\\,d^{«invm1»}$"
        answer: 2
        distractors:
          - ヤコビアン |dt/dd|=1/(δd) を掛け忘れ、f_T(t(d)) だけを書いた
          - 密度ではなく分布関数 F_D(d) を答えた
          - 正解
          - D が T の減少関数であることを見落とし、P(D≦d)=P(T≦−log d/δ) として向きを逆にした
          - 指数を λ/δ ではなく δ/λ とした
        explanation: |
          **方針** $d=e^{-\delta t}$ は $t$ の減少関数。分布関数を経由して求めると向きを間違えにくい。逆変換は $t=-\log d/\delta$。

          **途中式**
          - $F_D(d)=P(e^{-\delta T}\le d)=P\left(T\ge-\dfrac{\log d}{\delta}\right)=\exp\left(\dfrac{\lambda}{\delta}\log d\right)=d^{\lambda/\delta}=d^{«k»}$（$\lambda/\delta=«lam»/«delta»=«k»$）
          - $f_D(d)=F_D'(d)=«k»d^{«km1»}\quad(0<d<1)$
          - ヤコビアンで確かめると $f_T\left(-\dfrac{\log d}{\delta}\right)\left|\dfrac{dt}{dd}\right|=\lambda d^{\lambda/\delta}\cdot\dfrac{1}{\delta d}=\dfrac{\lambda}{\delta}d^{\lambda/\delta-1}$ で一致する。

          **答え** $«k»d^{«km1»}$（ベータ分布 $\mathrm{Beta}(«k»,1)$）

          **間違えやすい点** ヤコビアン $1/(\delta d)$ を掛け忘れると $«lam»\,d^{«k»}$ になり、積分しても 1 にならない。$D$ は $T$ の減少関数なので「$D\le d$」は「$T\ge\cdots$」に対応する。

      - id: s19p03b
        chapter: 2
        terms: [moment-generating-function, expectation-variance-properties, exponential-distribution]
        topic: 指数分布の積率母関数を負の点で評価して割引現在価値の期待値と標準偏差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $T$ の積率母関数は $M_T(s)=E[e^{sT}]=\dfrac{\lambda}{\lambda-s}$（$s<\lambda$）である。これを使って、解約時に払い戻す 100 万円の現在価値 $100D$（万円）の**標準偏差**を求めよ。
        answer: «sd»
        tolerance: 0.01
        answer_format: 万円単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $E[D]=E[e^{-\delta T}]=M_T(-\delta)$、$E[D^2]=E[e^{-2\delta T}]=M_T(-2\delta)$ として積率母関数を負の点で評価する。途中は分数のまま計算する。

          **途中式**
          - $E[D]=M_T(-«delta»)=\dfrac{«lam»}{«lam»+«delta»}=«ed»$
          - $E[D^2]=M_T(-2\times«delta»)=\dfrac{«lam»}{«lam»+0.1}=«ed2_f»$
          - $V[D]=«ed2_f»-(«ed»)^2=«ed2_f»-«ed_sq»=«vd_f»$
          - $V[100D]=100^2\times«vd_f»=«vpv»$、標準偏差 $\sqrt{«vpv»}=«sd4»\cdots$

          **答え** $«sd_s»$ 万円（期待値は «pv_mean» 万円）

          **間違えやすい点** $M_T(\delta)$ と符号を誤ると $\lambda/(\lambda-\delta)=«w_plus»>1$ となり、$0<D<1$ に反する。分散 «w_var» のまま答えたり、$E[(100D)^2]$ の平方根 $«w_nosq»$ を答えたりしないこと。
          前問の $\mathrm{Beta}(«k»,1)$ の分散 $\dfrac{«k»\times1}{(«k»+1)^2(«k»+2)}=«vd_f»$ とも一致する。

  - id: s19p04
    title: 家計の金融行動調査
    context: |
      ある市の世帯から «n» 世帯を単純無作為抽出し、郵送で家計の金融資産・決済手段・カード利用などを調べた。
    items:
      - id: s19p04a
        chapter: 21
        terms: [nonresponse-bias, sampling-and-nonsampling-error, simple-random-sampling]
        topic: 非回答世帯の一部を追跡調査した結果を使って回答者だけの平均の非回答バイアスを補正し金融資産の平均を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          «n» 世帯のうち郵送で回答したのは «nr» 世帯で、その金融資産の平均は «ybr»（百万円）だった。回答しなかった «nn» 世帯から «m» 世帯を無作為に選んで訪問調査したところ、平均は «ybm»（百万円）だった。
          回答層と非回答層の割合で重み付けて、市全体の世帯の金融資産の平均を推定せよ。
        answer: «est»
        tolerance: 0.01
        answer_format: 百万円単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 標本を回答層と非回答層の 2 つの層とみて、非回答層の平均は訪問調査した副標本の平均で推定する（ハンセン・ハーウィッツの方法）。層の重みは標本の中の割合。

          **途中式**
          - 回答層の割合 $«nr»/«n»=«rr»$、非回答層の割合 $«nn»/«n»=«rn»$
          - 推定値 $=«rr»\times«ybr»+«rn»\times«ybm»=«est_s»$

          **答え** $«est_s»$ 百万円

          **間違えやすい点** 回答者だけの平均 «ybr» は、資産の少ない世帯ほど回答しにくいことによる非回答バイアス（約 «bias»）を含む。訪問した «m» 世帯を回答者に単純に足して平均すると $«w_m»$ となり、非回答層の重みが小さすぎる（«m» 世帯は «nn» 世帯を代表している）。

      - id: s19p04b
        chapter: 26
        terms: [multiple-correspondence-analysis, correspondence-analysis, quantification-type-3]
        topic: 3つの質問の多重対応分析で指示行列の総イナーシャと非自明な次元の数をカテゴリー数から求める
        level: 標準
        definition: true
        type: choice
        question: |
          調査票の 3 つの質問（主な決済手段：«c1» 区分、貯蓄の目的：«c2» 区分、住居：«c3» 区分）の回答に多重対応分析を行う。どの回答者も各質問でちょうど 1 つの区分を選び、欠測はない。
          回答者 × 全カテゴリー（計 «J» 列）の 0/1 の指示行列に対応分析を行うとき、総イナーシャと、意味のある（自明でない）次元の最大数の組として正しいものを選べ（回答者の数はカテゴリーの数より十分多いとする）。
        choices:
          - 総イナーシャ «in_jq»、次元数 «J»
          - 総イナーシャ «in_ok»、次元数 «dim_j1»
          - 総イナーシャ «in_ok»、次元数 «dim_ok»
          - 総イナーシャ «in_nq»、次元数 «dim_ok»
          - 総イナーシャ «in_j»、次元数 «dim_ok»
        answer: 2
        distractors:
          - 総イナーシャを J/Q とし、次元数から質問ごとの自明な次元を除かなかった
          - 次元数を J−1 とし、質問ごとの制約（各質問で 1 つだけ選ぶ）を Q 個ではなく 1 個と数えた
          - 正解
          - 総イナーシャを Q で割り忘れた
          - 総イナーシャを Q ではなく J で割った
        explanation: |
          **方針** 指示行列の対応分析では、総イナーシャは回答の中身によらず $(J-Q)/Q$ となる（$J$ はカテゴリーの総数、$Q$ は質問の数）。各質問の列の和はすべての行で 1 になるという制約が $Q$ 個あるので、意味のある次元は $J-Q$ 個まで。

          **途中式**
          - $J=«c1»+«c2»+«c3»=«J»$、$Q=«Q»$
          - 総イナーシャ $=(«J»-«Q»)/«Q»=«in_ok»$
          - 次元の数 $=«J»-«Q»=«dim_ok»$

          **答え** 総イナーシャ «in_ok»、次元数 «dim_ok»

          **間違えやすい点** 多重対応分析の総イナーシャはデータに依存しないので、通常の対応分析のように「総イナーシャの大きさで関連の強さを測る」ことはできない（そのため各次元の寄与率は小さく出やすく、修正した寄与率が使われることもある）。

      - id: s19p04c
        chapter: 19
        terms: [quantile-regression, least-squares-method]
        topic: 月収でカード利用額の上位10%の水準を表す分位点回帰の候補直線をチェック関数の合計で比べる
        level: 標準
        definition: false
        type: choice
        question: |
          5 世帯の月収 $x$ と月間カード利用額 $y$（万円）は次のとおりだった。

          | $x$ | «x0» | «x1» | «x2» | «x3» | «x4» |
          |---|---|---|---|---|---|
          | $y$ | «y0» | «y1» | «y2» | «y3» | «y4» |

          $y$ の条件付き 90% 分位点を直線で表す分位点回帰（$\tau=«tau»$）の目的関数は、残差 $u=y-\hat y$ について
          $\rho_\tau(u)=\tau u\ (u\ge0)$、$\rho_\tau(u)=(\tau-1)u\ (u<0)$ の合計である。
          候補の直線 A：$\hat y=2+0.3x$、B：$\hat y=4+0.3x$、C：$\hat y=5+0.3x$ について、目的関数の値と、3 つのうちで選ぶ直線の組として正しいものを選べ。
        choices:
          - "«c_rev»"
          - "«c_sq»"
          - "«c_ok»"
          - "«c_abs»"
          - "«c_tabs»"
        answer: 2
        distractors:
          - τ と 1−τ を逆にし、正の残差に 0.1、負の残差に 0.9 を掛けた
          - 分位点回帰ではなく最小二乗法の残差平方和で比べた
          - 正解
          - 中央値回帰（τ=0.5）の損失で比べた
          - 残差の符号を区別せず、すべての |u| に 0.9 を掛けた
        explanation: |
          **方針** 各直線の残差を求め、正の残差には $\tau=«tau»$、負の残差には $1-\tau=«tau1»$ を絶対値に掛けて足す。90% 分位点の直線では、データが直線より上に出る（残差が正）ことを重く罰するので、直線は上寄りになる。

          **途中式**
          - A の残差：«rA0», «rA1», «rA2», «rA3», «rA4» → すべて 0 以上で合計 8 なので $0.9\times8=«LA»$
          - B の残差：«rB0», «rB1», «rB2», «rB3», «rB4» → 負の合計の絶対値 4、正の合計 2 なので $0.1\times4+0.9\times2=«LB»$
          - C の残差：«rC0», «rC1», «rC2», «rC3», «rC4» → 負の合計の絶対値 8、正の合計 1 なので $0.1\times8+0.9\times1=«LC»$

          **答え** «c_ok»

          **間違えやすい点** 残差平方和や $\tau=0.5$ の損失で比べると B が選ばれるが、それは平均や中央値の直線の考え方である。90% 分位点では、直線より上に来る点が約 10% になるように、直線を上に寄せたほうが損失が小さい。

  - id: s19p05
    title: 住宅ローン金利の重回帰
    context: |
      ある銀行が住宅ローン «n» 件について、適用金利の上乗せ幅 $y$（%）を、返済負担率 $x_1$（%）と借入比率 $x_2$（10% 単位）で説明する重回帰モデル $y=\beta_0+\beta_1x_1+\beta_2x_2+\varepsilon$ を最小二乗法で当てはめる。
      平均からの偏差の平方和・積和は $S_{11}=«s11»$、$S_{22}=«s22»$、$S_{12}=«s12»$、$S_{1y}=«s1y»$、$S_{2y}=«s2y»$ だった。誤差は互いに独立に $N(0,\sigma^2)$ に従うとする。
    items:
      - id: s19p05a
        chapter: 16
        terms: [normal-equations, regression-coefficient-t-test, multicollinearity]
        topic: 中心化した2変数の積和行列の逆行列から偏回帰係数とその標準誤差を求めt値を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          誤差分散の推定値（残差平方和を自由度 $n-3=«dfe»$ で割ったもの）は $\hat\sigma^2=«s2»$ だった。返済負担率の偏回帰係数 $\hat\beta_1$ の $t$ 値に最も近いものを選べ。
        choices:
          - "$«w_simple»$"
          - "$«t»$"
          - "$«w_slope»$"
          - "$«w_elem»$"
          - "$«w_nosq»$"
        answer: 1
        distractors:
          - 偏回帰係数は正しいが、標準誤差を単回帰と同じ √(σ^2/S11) とし、説明変数間の相関による膨らみを無視した
          - 正解
          - 単回帰の傾き S1y/S11 と単回帰の標準誤差を使った
          - 逆行列の (1,1) 成分を S11/det と取り違えた
          - 分散を標準誤差と取り違え、平方根をとらずに割った
        explanation: |
          **方針** 中心化した説明変数の積和行列 $A=\begin{pmatrix}S_{11}&S_{12}\\S_{12}&S_{22}\end{pmatrix}$ について、正規方程式は $A\hat\beta=(S_{1y},S_{2y})^\top$、係数の分散共分散行列は $\sigma^2A^{-1}$。

          **途中式**
          - $\det A=«s11»\times«s22»-«s12»^2=«det»$
          - $\hat\beta_1=\dfrac{S_{22}S_{1y}-S_{12}S_{2y}}{\det A}=\dfrac{«n1»-«n2»}{«det»}=\dfrac{«b1n»}{«det»}=«b1»$
          - $(A^{-1})_{11}=S_{22}/\det A=«s22»/«det»=«v11»$、$V[\hat\beta_1]=«s2»\times«v11»=«var1»$、標準誤差 $«se1»$
          - $t=«b1»/«se1»=«t4»\cdots$

          **答え** $«t»$

          **間違えやすい点** $x_1$ と $x_2$ に相関があると、$(A^{-1})_{11}=1/\{S_{11}(1-r_{12}^2)\}$ となり標準誤差が単回帰の $1/\sqrt{1-r_{12}^2}$ 倍に膨らむ。単回帰の標準誤差 $«se_simple»$ を使うと $t=«w_simple»$ と過大になる。
          単回帰の傾き $«s1y»/«s11»=«b_simple»$ は $x_2$ の影響を含んでおり、偏回帰係数とは異なる。

