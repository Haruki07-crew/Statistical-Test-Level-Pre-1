        answer: «vimp»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 平均で埋めた値は平均からの偏差が 0 なので、偏差平方和は回答者の分だけのまま変わらない。一方、割る数は $n-1$ に増える。

          **途中式**
          - 回答者の偏差平方和：$(«nobs»-1)\times«s2»=«nobs1»\times«s2»=«num»$
          - 代入後も平均は $\bar y$ のままで、偏差平方和も «num»
          - 代入後の不偏分散：$«num»/(«n»-1)=«num»/«n1»=«vimp5»\cdots$

          **答え** $«vimp_s»$

          **間違えやすい点** 平均値代入をすると、平均は変わらないが分散が元の約 «ratio_v» 倍に小さくなり、標準誤差も過小になる（実際より精度が高く見える）。さらに欠測が MAR や MNAR なら平均にも偏りが残る。この欠点を補うのが、ばらつきを加えて複数回代入する多重代入法である。

      - id: s21p12c
        chapter: 19
        terms: [log-transformation, lognormal-distribution, multiple-regression-model]
        topic: 対数変換した家庭学習時間の回帰の予測値を元の尺度に戻すとき誤差分散の補正を加えて条件付き平均を求める
        level: 標準
        definition: false
        type: choice
        question: |
          家庭学習時間が正の生徒について、家庭学習時間 $y$ の自然対数 $\log y$ を目的変数とする回帰を当てはめた。ある属性の生徒の当てはめ値（$\log y$ の条件付き平均の推定値）は «mu»、誤差分散の推定値は «v» だった。
          誤差が正規分布に従うとして、この属性の生徒の家庭学習時間 $y$（時間）の条件付き平均の推定値として最も適切なものはどれか。
          必要なら $e^{0.32}=«e032»$、$e^{0.50}=«e050»$、$e^{0.68}=«e068»$、$e^{0.86}=«e086»$ を使え。
        choices:
          - "$«d_med»$"
          - "$«d_minus»$"
          - "$«d_full»$"
          - "$«ans»$"
          - "$«d_log»$"
        answer: 3
        distractors:
          - 当てはめ値を指数変換しただけ（中央値の推定値）
          - 補正の符号を逆にした
          - 補正を σ²/2 ではなく σ² とした
          - 正解
          - 対数の尺度の値のまま答えた
        explanation: |
          **方針** $\log y=\mu+\varepsilon$、$\varepsilon\sim N(0,\sigma^2)$ なら $y$ は対数正規分布に従い、$E[y]=e^{\mu+\sigma^2/2}$。$e^{\mu}$ は平均ではなく中央値（幾何平均）である。

          **途中式**
          - $\mu+\sigma^2/2=«mu»+«v»/2=«mu»+«vh»=«mv»$
          - $E[y]=e^{«mv»}=«e068»$

          **答え** $«ans»$ 時間

          **間違えやすい点** 当てはめ値をそのまま指数変換した $e^{«mu»}=«d_med»$ は中央値の推定で、平均を小さく見積もる（$e^x$ は下に凸なので $E[e^{\varepsilon}]>e^{E[\varepsilon]}=1$）。補正は $\sigma^2/2$ で、$\sigma^2$ ではない（$e^{«mvf»}=«d_full»$）。

  - id: s21p13
    title: 学習スタイルのグループ分けと判別
    context: |
      学習ログをもとに、生徒をグループに分けたり、退会しそうな生徒を見分けたりする。
    items:
      - id: s21p13a
        chapter: 24
        terms: [distance-measures, standardization-before-clustering, hierarchical-clustering]
        topic: 3つの標準化した特徴量でユークリッド・マンハッタン・チェビシェフ距離を計算し最も近い生徒が距離の選び方で変わることを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          学習時間・正答率・ログイン回数の 3 つの特徴量を標準化した値で、生徒 C に近い生徒を探す。生徒 A, B, C の値は次のとおり。

          | 生徒 | 学習時間 | 正答率 | ログイン回数 |
          |---|---|---|---|
          | A | «dm_a1» | «dm_a2» | «dm_a3» |
          | B | «dm_b1» | «dm_b2» | «dm_b3» |
          | C | «dm_c1» | «dm_c2» | «dm_c3» |

          C に近いのは A と B のどちらかを、ユークリッド距離・マンハッタン距離（市街地距離）・チェビシェフ距離（各成分の差の絶対値の最大）で調べる。
          （ユークリッド距離での近い方、マンハッタン距離での近い方、チェビシェフ距離での近い方）の組として正しいものはどれか。
        choices:
          - （B, A, B）
          - （B, B, B）
          - （A, A, B）
          - （B, B, A）
          - （B, A, A）
        answer: 0
        distractors:
          - 正解
          - どの距離でも近い生徒は変わらないと考えた
          - ユークリッド距離で差を 2 乗せずに絶対値のまま足した（マンハッタン距離と同じになる）
          - マンハッタン距離とチェビシェフ距離の定義を取り違えた
          - チェビシェフ距離を差の絶対値の最大ではなく最小とした
        explanation: |
          **方針** C との差のベクトルを作り、3 つの距離 $\sqrt{\sum d_k^2}$、$\sum|d_k|$、$\max_k|d_k|$ をそれぞれ計算して比べる。

          **途中式** 差の絶対値は A が $(«dm_da1»,\ «dm_da2»,\ «dm_da3»)$、B が $(«dm_db1»,\ «dm_db2»,\ «dm_db3»)$。

          | | ユークリッド | マンハッタン | チェビシェフ |
          |---|---|---|---|
          | A | $\sqrt{«dm_sa»}=«dm_ea»$ | «dm_ma» | «dm_ca» |
          | B | $\sqrt{«dm_sb»}=«dm_eb»$ | «dm_mb» | «dm_cb» |

          **答え** （B, A, B）

          **間違えやすい点** A は 1 つの特徴量（学習時間）だけが大きく違い、B は 3 つとも中くらいに違う。マンハッタン距離は小さな差の積み重ねを重く見るので A が近くなり、チェビシェフ距離は最大の差だけを見るので B が近くなる。ユークリッド距離はその中間で、ここでは僅差で B が近い。
          階層的クラスタリングや k 平均法の結果は、標準化の有無だけでなく距離の選び方でも変わる。

      - id: s21p13b
        chapter: 23
        terms: [decision-tree, misclassification-rate]
        topic: 退会予測の決定木の分岐でエントロピーによる情報利得を子ノードの人数で重み付けして求める
        level: 標準
        definition: false
        type: numeric
        question: |
          退会を予測する決定木を作る。生徒 «n» 人のうち翌月に退会したのは «nq» 人だった。特徴「直近 1 週間のログインが 2 回以下」で分けると、該当する «nl» 人のうち退会 «ql» 人、該当しない «nr» 人のうち退会 «qr» 人だった。
          ノードの不純度を 2 を底とするエントロピー $H=-\sum_k p_k\log_2p_k$ で測るとき、この分岐による情報利得（親ノードのエントロピーから、子ノードのエントロピーを人数の割合で重み付けした平均を引いた値）を求めよ。
          必要なら、2 クラスの割合が $q$ と $1-q$ のときのエントロピー $h(q)$ の値 $h(0.4)=«hroot»$、$h(1/6)=«hl»$、$h(3/14)=«hr»$ を使え。
        answer: «ig»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 親ノードの退会の割合は $«nq»/«n»=0.4$、子ノードはそれぞれ $«ql»/«nl»$ と $«qr»/«nr»$。$h(q)=h(1-q)$ なので、退会と継続のどちらの割合で書いても同じ値になる。

          **途中式**
          - 親ノード：$h(0.4)=«hroot»$
          - 子ノードの重み付き平均：$\dfrac{«nl»}{«n»}\times«hl»+\dfrac{«nr»}{«n»}\times«hr»=«wl»\times«hl»+«wr»\times«hr»=«cl»+«cr»=«child»$
          - 情報利得：$«hroot»-«child»=«ig3»$

          **答え** $«ig_s»$

          **間違えやすい点** 子ノードのエントロピーは人数の割合で重み付けする（単純平均にすると «d_avg»）。$h(1/6)$ は「該当する 6 人のうち継続 1 人」の割合で、$h(5/6)$ と同じ値である。決定木は、情報利得（またはジニ不純度の減少）が最大になる分岐を選ぶ。

