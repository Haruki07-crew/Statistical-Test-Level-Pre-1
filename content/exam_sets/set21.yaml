set: 21
title: 模擬試験 第21回
minutes: 90
problems:
  - id: s21p01
    title: 学習アプリの4択問題
    context: |
      ある学習アプリでは、単元ごとに 4 択問題を出題している。
    items:
      - id: s21p01a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: 4択問題に正解した生徒が当て推量ではなく本当に知っていた確率をうっかりミスも含めてベイズの定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある単元の問題について、生徒がその内容を理解している確率は «pk» である。理解している生徒は確率 «ok» で正解する（うっかりミスで誤答することがある）。
          理解していない生徒は «k» つの選択肢から等しい確率で 1 つを選ぶ。
          無作為に選んだ生徒がこの問題に正解したとき、その生徒が内容を理解している条件付き確率を求めよ。
        answer: «post»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「理解している」を $U$、「正解する」を $C$ とする。全確率の公式で $P(C)$ を求め、ベイズの定理で $P(U\mid C)=P(C\mid U)P(U)/P(C)$ を計算する。

          **途中式**
          - $P(C\cap U)=P(U)P(C\mid U)=«pk»\times«ok»=«num»$
          - $P(C\cap\bar U)=P(\bar U)P(C\mid\bar U)=«pk1»\times\frac{1}{«k»}=«gq»$
          - $P(C)=«num»+«gq»=«den»$
          - $P(U\mid C)=\dfrac{«num»}{«den»}=«post5»\cdots$

          **答え** $«post_s»$

          **間違えやすい点** うっかりミスを無視して $P(C\mid U)=1$ とすると $«pk»/(«pk»+«gq»)=«noslip»$ になる。事前確率 «pk» のまま答えたり、$P(C)=«den»$ を答えたりしないこと。正解したという情報で、理解している確率は «pk» から上がる。

      - id: s21p01b
        chapter: 31
        terms: [beta-binomial-model, predictive-distribution, conjugate-prior]
        topic: ベータ事前分布と小テストの正答数から次の2問を続けて正解する事後予測確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          別の単元で、ある生徒の正答率 $\theta$ に事前分布としてベータ分布 $Be(«a»,«b»)$（密度 $\propto\theta^{«a»-1}(1-\theta)^{«b»-1}$）を置く。
          $\theta$ が与えられたとき、各問題の正誤は独立で、正解の確率は $\theta$ とする。この生徒が «n» 問を解いて «y» 問正解した。
          このデータのもとで、次の 2 問を続けて正解する確率（事後予測確率）に最も近い値はどれか。
        choices:
          - "$«pm2»$"
          - "$«mle2»$"
          - "$«pm3»$"
          - "$«pred»$"
          - "$«prior2»$"
        answer: 3
        distractors:
          - 事後平均を2乗した（2問の正誤は事後分布のもとでは独立ではない）
          - 最尤推定値 6/8 を2乗した
          - 次の1問だけを正解する確率（事後平均）を答えた
          - 正解
          - データを使わず事前分布のもとで2問続けて正解する確率を求めた
        explanation: |
          **方針** ベータ分布は二項尤度の共役事前分布なので、事後分布は $Be(«a»+«y»,\ «b»+«ny»)=Be(«A»,«B»)$ になる。次の 2 問を続けて正解する確率は $E[\theta^2\mid\text{データ}]$ である。

          **途中式**
          - 事後分布：$\theta^{«a»-1}(1-\theta)^{«b»-1}\times\theta^{«y»}(1-\theta)^{«ny»}\propto\theta^{«A»-1}(1-\theta)^{«B»-1}$
          - $Be(\alpha,\beta)$ について $E[\theta^2]=\dfrac{\alpha(\alpha+1)}{(\alpha+\beta)(\alpha+\beta+1)}$
          - $E[\theta^2\mid\text{データ}]=\dfrac{«A»\times«A1»}{«AB»\times«AB1»}=\dfrac{«pnum»}{«pden»}=«pred4»\cdots$

          **答え** $«pred»$

          **間違えやすい点** 事後平均 $«A»/«AB»=«pm»$ を 2 乗すると $«pm2»$ になるが、$E[\theta^2]=\{E[\theta]\}^2+V[\theta]$ なので事後分散の分だけ小さすぎる。$\theta$ が不確かなとき、1 問目の正解は 2 問目の正解の確率を上げる情報になる（2 問の正誤は周辺では独立でない）。

  - id: s21p02
    title: 新作問題の正答率
    context: |
      学習アプリに新しく加えた問題を «n» 人の生徒が解き、«T» 人が正解した。各生徒の正誤は独立で、正解の確率は共通の $p$ とする。
      正解者数 $T$ は二項分布 $B(«n»,p)$ に従い、$\hat p=T/«n»=«ph»$ である。
    items:
      - id: s21p02a
        chapter: 8
        terms: [unbiased-estimator, binomial-distribution, point-estimation]
        topic: 二項分布の正解者数の関数として1人の正誤のばらつきp(1-p)の不偏推定量を作る
        level: 応用
        definition: false
        type: choice
        question: |
          1 人の生徒の正誤（正解 1・不正解 0）の分散は $p(1-p)$ である。$T$ の関数で $p(1-p)$ の**不偏**推定量となるものを使うと、推定値はいくらか。
        choices:
          - "$«mle»$"
          - "$«unb»$"
          - "$«shr»$"
          - "$«vph»$"
          - "$«both»$"
        answer: 1
        distractors:
          - 最尤推定量 p̂(1−p̂) をそのまま使った（下向きの偏りがある）
          - 正解
          - 偏りの補正を逆向きにして (n−1)/n を掛けた
          - p̂ の分散 p̂(1−p̂)/n と取り違えた
          - 分子と分母の両方を n−1 で割るなど補正を過大にした
        explanation: |
          **方針** $E[T(n-T)]$ を計算し、$p(1-p)$ の何倍になっているかを調べて定数で割る。

          **途中式**
          - $E[T]=np$、$E[T^2]=V[T]+(E[T])^2=np(1-p)+n^2p^2$
          - $E[T(n-T)]=nE[T]-E[T^2]=n^2p-np+np^2-n^2p^2=n(n-1)p(1-p)$
          - よって $\dfrac{T(n-T)}{n(n-1)}$ は $p(1-p)$ の不偏推定量
          - 推定値：$\dfrac{«T»\times«nT»}{«n»\times«n1»}=\dfrac{«Tnum»}{«uden»}=«unb5»\cdots$

          **答え** $«unb»$

          **間違えやすい点** 最尤推定量 $\hat p(1-\hat p)=«mle»$ は $E[\hat p(1-\hat p)]=\frac{n-1}{n}p(1-p)$ なので小さめに偏る。$\frac{n}{n-1}$ を掛けると不偏になる（$«mle»\times\frac{«n»}{«n1»}=«unb»$）。逆に $\frac{n-1}{n}$ を掛けると $«shr»$ になる。$p(1-p)/n$（$\hat p$ の分散）とも区別すること。
          なお $T$ は完備十分統計量なので、$T$ の関数である不偏推定量はこれ 1 つに決まる。

      - id: s21p02b
        chapter: 7
        terms: [delta-method, central-limit-theorem, standard-error]
        topic: 正答率の推定値をロジット変換した値の標準誤差をデルタ法で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          問題の難易度を対数オッズ（ロジット）$g(p)=\log\dfrac{p}{1-p}$（自然対数）で表すことにした。
          $g(\hat p)$ の標準誤差を、デルタ法を用い、未知の $p$ を $\hat p$ で置き換えて求めよ。
        answer: «se_logit»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** デルタ法では $V[g(\hat p)]\approx\{g'(p)\}^2V[\hat p]$。$V[\hat p]=p(1-p)/n$ を使う。

          **途中式**
          - $g(p)=\log p-\log(1-p)$ より $g'(p)=\dfrac1p+\dfrac1{1-p}=\dfrac{1}{p(1-p)}$
          - $V[g(\hat p)]\approx\dfrac{1}{\{p(1-p)\}^2}\cdot\dfrac{p(1-p)}{n}=\dfrac{1}{np(1-p)}$
          - $\hat p$ を代入：$n\hat p(1-\hat p)=«n»\times«ph»\times«qh»=«npq»$
          - 標準誤差 $=\dfrac{1}{\sqrt{«npq»}}=«se_logit5»\cdots$

          **答え** $«se_logit_s»$

          **間違えやすい点** $\hat p$ の標準誤差 $\sqrt{\hat p(1-\hat p)/n}=«se_p»$ を答えるのは誤り（変換の微分を掛けていない）。分散と標準誤差を取り違えて $1/«npq»$ としたり、逆数を取り忘れて $\sqrt{«npq»}=«se_inv»$ としたりしないこと。

      - id: s21p02c
        chapter: 9
        terms: [wilson-interval, ci-proportion, wald-confidence-interval]
        topic: 正答率40人中28人のウィルソンの95%信頼区間をワルド型の区間と区別して求める
        level: 標準
        definition: false
        type: choice
        question: |
          $p$ の 95% 信頼区間を、ウィルソンの方法（スコア検定 $\left|\dfrac{\hat p-p}{\sqrt{p(1-p)/n}}\right|\le z$ を $p$ について解いた区間）で求める。
          最も近いものはどれか。標準正規分布の上側 2.5% 点は «z»、上側 5% 点は «z90» とする。
        choices:
          - "$(«dl»,\\ «du»)$"
          - "$(«ccl»,\\ «ccu»)$"
          - "$(«ncl»,\\ «ncu»)$"
          - "$(«w90l»,\\ «w90u»)$"
          - "$(«wl»,\\ «wu»)$"
        answer: 4
        distractors:
          - 分母の p を p̂ で置き換えたワルド型の区間 p̂±1.96√(p̂(1−p̂)/n) を答えた
          - ワルド型の区間に連続修正 1/(2n) を加えた
          - ウィルソンの区間の幅は正しいが、中心をずらさず p̂ のままにした
          - 95% なのに上側 5% 点 1.645 を使った
          - 正解
        explanation: |
          **方針** 不等式 $(\hat p-p)^2\le z^2p(1-p)/n$ を $p$ の 2 次不等式として解く。解は中心 $\dfrac{T+z^2/2}{n+z^2}$、半幅 $\dfrac{z\sqrt{\hat p(1-\hat p)/n+z^2/(4n^2)}}{1+z^2/n}$ の区間になる。

          **途中式** $z^2=«z2»$ として
          - 中心：$\dfrac{«T»+«z2h»}{«n»+«z2»}=\dfrac{«cnum»}{«cden»}=«cen»$
          - 根号の中：$\dfrac{«pq»}{«n»}+\dfrac{«z2»}{4\times«n»^2}=«t1»+«t2»=«tsum»$、平方根は $«tsq»$
          - 半幅：$\dfrac{«z»\times«tsq»}{1+«z2»/«n»}=\dfrac{«z»\times«tsq»}{«hden»}=«half»$
          - 区間：$«cen»\pm«half»$ より $(«wl»,\ «wu»)$

          **答え** $(«wl»,\ «wu»)$

          **間違えやすい点** ワルド型 $\hat p\pm z\sqrt{\hat p(1-\hat p)/n}$ は $(«dl»,\ «du»)$ で、$\hat p$ を中心に左右対称になる。ウィルソンの区間は中心が $1/2$ の側に縮み（«cen»）、$\hat p$ に対して非対称になる。中心を $\hat p$ のままにすると $(«ncl»,\ «ncu»)$ になる。

  - id: s21p03
    title: 自習室の空席待ち
    context: |
      図書館の自習室は 3 席とも利用中である。席 1・2・3 の残りの利用時間（分）は互いに独立に、平均がそれぞれ «m1»・«m2»・«m3» 分の指数分布に従う。
      いまから来た生徒は、最初に空いた席を使う。
    items:
      - id: s21p03a
        chapter: 6
        terms: [exponential-distribution, survival-function]
        topic: 平均の異なる3つの指数分布の最小値として最初に席が空くまでの待ち時間が一定時間を超える確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          生徒が «t» 分を超えて待つ確率に最も近い値はどれか。
          必要なら $e^{-0.25}=«e025»$、$e^{-0.5}=«e05»$、$e^{-0.75}=«e075»$、$e^{-1.5}=«e15»$ を使え。
        choices:
          - "$«ans»$"
          - "$«d_short»$"
          - "$«d_mid»$"
          - "$«d_cmp»$"
          - "$«d_max»$"
        answer: 0
        distractors:
          - 正解
          - 平均が最も短い席 1 だけを考えた
          - 平均 30 分の席 2 を代表として 1 席だけで考えた
          - 待ち時間が 15 分以下の確率（分布関数）を答えた
          - 最小値ではなく最大値（3 席すべてが空くまで）の上側確率を求めた
        explanation: |
          **方針** 待ち時間は $W=\min(X_1,X_2,X_3)$。$W>t$ は「3 席とも $t$ 分後もまだ使われている」ことなので、独立性から上側確率の積になる。

          **途中式**
          - 平均 $\mu$ の指数分布の上側確率は $P(X>t)=e^{-t/\mu}$
          - $P(W>t)=e^{-t/«m1»}e^{-t/«m2»}e^{-t/«m3»}=\exp\left\{-t\left(\frac1{«m1»}+\frac1{«m2»}+\frac1{«m3»}\right)\right\}=e^{-«rate»t}$
          - $W$ はレート «rate»（平均 «mean» 分）の指数分布に従う
          - $P(W>«t»)=e^{-«rate»\times«t»}=e^{-1.5}=«e15»$

          **答え** $«ans»$

          **間違えやすい点** レート（$1/\text{平均}$）を足すのであって、平均を足したり 1 席だけで考えたりしない（席 1 だけなら $e^{-0.75}=«d_short»$）。
          「3 席すべてが空くまで」と取り違えると $1-(1-«e075»)(1-«e05»)(1-«e025»)=1-«qprod»=«d_max»$ になる。

  - id: s21p04
    title: 図書館の延滞返却
    context: |
      ある図書館の 1 日の貸出冊数 $N$ は平均 «lam» のポアソン分布に従う。貸し出した本はそれぞれ独立に確率 «p» で延滞され、延滞するかどうかは $N$ とも独立である。
      ある日に貸し出された本のうち延滞される冊数を $Y$ とする。
    items:
      - id: s21p04a
        chapter: 2
        terms: [probability-generating-function, poisson-distribution, conditional-variance]
        topic: ポアソン個の本がそれぞれ確率pで延滞されるときの延滞冊数の確率母関数を合成して分布と分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $Y$ の確率母関数 $G_Y(s)=E[s^Y]$ と分散 $V[Y]$ の組として正しいものはどれか。
        choices:
          - '$G_Y(s)=(«q»+«p»s)^{«lam»}$、$V[Y]=«v_bin»$'
          - '$G_Y(s)=«q»+«p»e^{«lam»(s-1)}$、$V[Y]=«v_rev»$'
          - '$G_Y(s)=e^{«mu»(s-1)}$、$V[Y]=«mu»$'
          - '$G_Y(s)=e^{«mu»(s-1)}$、$V[Y]=«v_bin»$'
          - '$G_Y(s)=e^{«lam»(s-1)}(«q»+«p»s)$、$V[Y]=«v_prod»$'
        answer: 2
        distractors:
          - 貸出冊数を平均の 120 冊に固定して二項分布とした
          - 合成の順序を逆にして G_B(G_N(s)) とした
          - 正解
          - 分布は正しいが分散を E[N]p(1−p) だけにし、V[N]p² の項を落とした
          - 合成ではなく確率母関数の積（独立な和）とした
        explanation: |
          **方針** $Y=\sum_{i=1}^{N}B_i$（$B_i$ は延滞なら 1）。独立な個数 $N$ 個の和の確率母関数は、外側に $N$ の確率母関数、内側に $B_i$ の確率母関数を入れた合成 $G_Y(s)=G_N(G_B(s))$ になる。

          **途中式**
          - $G_N(u)=e^{«lam»(u-1)}$、$G_B(s)=«q»+«p»s$
          - $E[s^Y]=E\left[E[s^Y\mid N]\right]=E\left[(«q»+«p»s)^N\right]=G_N(«q»+«p»s)$
          - $G_Y(s)=\exp\{«lam»(«q»+«p»s-1)\}=\exp\{«lam»\times«p»(s-1)\}=e^{«mu»(s-1)}$
          - これは平均 «mu» のポアソン分布の確率母関数なので $V[Y]=«mu»$

          **答え** $G_Y(s)=e^{«mu»(s-1)}$、$V[Y]=«mu»$

          **間違えやすい点** 全分散の公式で確かめると $V[Y]=E[N]p(1-p)+V[N]p^2=«t1»+«t2»=«mu»$。第 2 項を落とすと二項分布の $«v_bin»$ になる。
          合成の順序を逆にした $G_B(G_N(s))$ は「確率 «p» で 1 日分の貸出冊数全部を数える」量の確率母関数で、分散は $«v_rev»$ と大きく違う。

      - id: s21p04b
        chapter: 12
        terms: [dispersion-test, poisson-distribution, chi-squared-distribution]
        topic: 10日間の延滞冊数がポアソン分布に従うかを分散指数検定で調べ過分散を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          前問のモデルが正しければ、$Y$ は日によらず同じポアソン分布に従い、分散と平均が等しい。実際に «nd» 日間の延滞冊数を記録したところ次のようになった。

          «data»（合計 «sumx»）

          各日の $Y$ が独立に同じポアソン分布に従うという帰無仮説を、分散が平均より大きい（過分散）という対立仮説に対して、分散指数検定（有意水準 5% の上側片側検定）で調べる。
          統計量と結論の組として正しいものを選べ。必要なら自由度 9 と 10 のカイ二乗分布の上側 5% 点 «c9»、«c10» を使え。
        choices:
          - "統計量は «D»。自由度 10 の上側 5% 点 «c10» を超えないので帰無仮説を棄却しない"
          - "統計量は «ratio»。«c9» を超えないので帰無仮説を棄却しない"
          - "統計量は «nD»。自由度 10 の上側 5% 点 «c10» を超えるので帰無仮説を棄却する"
          - "統計量は «D»。自由度 9 の上側 5% 点 «c9» を超えるので帰無仮説を棄却し、過分散と判断する"
          - "統計量は «D»。«c9» を超えるので帰無仮説を棄却し、分散は平均より小さいと判断する"
        answer: 3
        distractors:
          - 平均を推定した分の自由度を引き忘れ、自由度を日数 10 とした
          - 分散と平均の比 s²/x̄ そのものをカイ二乗分布の点と比べた
          - 統計量を n×不偏分散/平均 とし、自由度も 10 とした
          - 正解
          - 上側で棄却したのに、過分散と過小分散の向きを取り違えた
        explanation: |
          **方針** ポアソン分布では分散と平均が等しい。分散指数 $D=\dfrac{\sum(y_i-\bar y)^2}{\bar y}$ は、帰無仮説のもとで近似的に自由度 $n-1$ のカイ二乗分布に従う（平均を推定するので自由度が 1 減る）。過分散のとき $D$ は大きくなるので上側で棄却する。

          **途中式**
          - $\bar y=«sumx»/«nd»=«xbar»$
          - $\sum(y_i-\bar y)^2=«ss»$（不偏分散は $«ss»/9=«s2»$）
          - $D=«ss»/«xbar»=«D»$
          - 自由度 $«nd»-1=«df»$ の上側 5% 点 «c9» と比べて $«D»>«c9»$ なので棄却する

          **答え** 統計量 «D»、帰無仮説を棄却し、過分散と判断する

          **間違えやすい点** 自由度を 10 にすると «c10» と比べて棄却しない結論になってしまう。$D$ は「(n−1)×不偏分散/平均」であり、比 $s^2/\bar y=«ratio»$ そのものではない。
          $D$ が上側で大きいことは「分散が平均より大きい」ことを意味する。過分散のときは、日によって貸出の多さや延滞率が変わるなど、モデルの仮定（共通の $\lambda$ と $p$）を見直す必要がある。

  - id: s21p05
    title: 補習講座と合格
    context: |
      2 つの高校で、放課後の補習講座の受講と、ある検定試験の合否を調べた。

      | 学校 | 受講・合格 | 受講・不合格 | 非受講・合格 | 非受講・不合格 | 計 |
      |---|---|---|---|---|---|
      | A 校 | «a1» | «b1» | «c1» | «d1» | «n1» |
      | B 校 | «a2» | «b2» | «c2» | «d2» | «n2» |
    items:
      - id: s21p05a
        chapter: 5
        terms: [fisher-exact-test, hypergeometric-distribution, p-value]
        topic: 少人数の高校の2×2表でフィッシャーの正確検定の片側p値を超幾何分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          人数の少ない A 校だけで、「受講者のほうが合格しやすい」を対立仮説とする片側のフィッシャーの正確検定を行う。
          周辺度数（受講者 «m» 人・合格者 «K» 人）を固定したとき、p 値に最も近い値はどれか。なお $\binom{«n1»}{«m»}=«tot»$ である。
        choices:
          - "$«d_eq»$"
          - "$«p»$"
          - "$«d_two»$"
          - "$«d_ge5»$"
          - "$«d_cmp»$"
        answer: 1
        distractors:
          - 観測された表の確率 P(X=6) だけを答え、より極端な表 X=7 を足し忘れた
          - 正解
          - 両側検定の p 値を答えた
          - X≧5 の確率を足した（観測値より極端でない表まで含めた）
          - P(X≦6)（反対側）を答えた
        explanation: |
          **方針** 周辺度数を固定すると、受講者の中の合格者数 $X$ は超幾何分布に従う：$P(X=x)=\dfrac{\binom{«K»}{x}\binom{«nK»}{«m»-x}}{\binom{«n1»}{«m»}}$（合格者 «K» 人・不合格者 «nK» 人の中から受講者 «m» 人を選ぶ）。片側 p 値は、観測値 «a1» 以上の確率である。

          **途中式**
          - $P(X=6)=\dfrac{\binom{8}{6}\binom{6}{1}}{«tot»}=\dfrac{«C86»\times«C61»}{«tot»}=\dfrac{«P6n»}{«tot»}$
          - $P(X=7)=\dfrac{\binom{8}{7}\binom{6}{0}}{«tot»}=\dfrac{«C87»\times«C60»}{«tot»}=\dfrac{«P7n»}{«tot»}$
          - $p=\dfrac{«P6n»+«P7n»}{«tot»}=\dfrac{«Pn»}{«tot»}=«p4»\cdots$

          **答え** $«p»$（5% をわずかに超えるので、有意水準 5% では棄却できない）

          **間違えやすい点** 観測した表の確率 $«P6n»/«tot»=«d_eq»$ だけでは p 値ではない。p 値は「観測値と同じかより極端な結果」の確率なので $X=7$ も足す。両側 p 値（«d_two»）と取り違えないこと。

      - id: s21p05b
        chapter: 28
        terms: [mantel-haenszel-estimator, three-way-table, two-by-two-table]
        topic: 2校の2×2表から学校で層別したマンテル・ヘンツェルの共通オッズ比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          学校で層別し、受講と合格の共通オッズ比（合格のオッズの、受講者の非受講者に対する比）をマンテル・ヘンツェル推定量で求めよ。
        answer: «mh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 層 $k$ の 2×2 表を $(a_k,b_k;c_k,d_k)$、総数を $n_k$ とすると、マンテル・ヘンツェル推定量は $\hat\psi_{MH}=\dfrac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$。

          **途中式**
          - 分子：$\dfrac{«a1»\times«d1»}{«n1»}+\dfrac{«a2»\times«d2»}{«n2»}=«ad1»+«ad2»=«num»$
          - 分母：$\dfrac{«b1»\times«c1»}{«n1»}+\dfrac{«b2»\times«c2»}{«n2»}=«bc1»+«bc2»=«den»$
          - $\hat\psi_{MH}=«num»/«den»=«mh4»\cdots$

          **答え** $«mh_s»$

          **間違えやすい点** 2 校を合計した表のオッズ比は $«crude»$ で、学校の違いを調整していない。層ごとのオッズ比（A 校 $«orA»$、B 校 $«orB»$）の単純平均 $«orAvg»$ も誤り。マンテル・ヘンツェル推定量は層の大きさで重みを付けるので、人数の少ない A 校の極端なオッズ比に引きずられにくい。

  - id: s21p06
    title: 入試成績と1年次のGPA
    context: |
      ある大学で、入学者 «n» 人の 1 年次の GPA $y$ を、共通テストの得点 $x_1$、面接の評点 $x_2$、調査書の評点 $x_3$ で説明する線形回帰モデル（切片あり、誤差は独立に $N(0,\sigma^2)$）を当てはめた。
      モデルごとの残差平方和は次のとおりである。

      | モデル | 説明変数 | 残差平方和 |
      |---|---|---|
      | M1 | $x_1$ | «r1» |
      | M2 | $x_1,x_2$ | «r2» |
      | M3 | $x_1,x_3$ | «r3» |
      | M4 | $x_1,x_2,x_3$ | «r4» |
    items:
      - id: s21p06a
        chapter: 16
        terms: [partial-f-test, multiple-regression-model, f-distribution]
        topic: 入試の面接と調査書の2変数をまとめて加える意味があるかを残差平方和から部分F検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          M1 に $x_2,x_3$ を加えることに意味があるか（帰無仮説 $\beta_2=\beta_3=0$）を、有意水準 5% の F 検定で調べる。
          統計量と結論の組として正しいものを選べ。必要なら $F_{0.05}(2,36)=«f236»$、$F_{0.05}(3,36)=«f336»$、$F_{0.05}(2,38)=«f238»$ を使え。
        choices:
          - "$F=«F_noq»$、棄却する"
          - "$F=«F_q3»$、$«f336»$ を超えないので棄却しない"
          - "$F=«F»$、$«f236»$ を超えるので棄却する"
          - "$F=«F_red»$、$«f238»$ を超えるので棄却する"
          - "$F=«F_nodf»$、棄却しない"
        answer: 2
        distractors:
          - 残差平方和の差を制約の数 2 で割り忘れた
          - 分子の自由度を M4 の説明変数の数 3 とした
          - 正解
          - 分母に M4 ではなく M1（縮小モデル）の残差分散を使った
          - 分母の残差平方和を自由度 36 で割り忘れた
        explanation: |
          **方針** 入れ子のモデルを比べる部分 F 検定：$F=\dfrac{(S_{M1}-S_{M4})/q}{S_{M4}/(n-k)}$。$q$ は制約の数（加える変数の数）、$n-k$ は M4 の残差の自由度（$k$ は切片を含む係数の数）。帰無仮説のもとで $F\sim F(q,n-k)$。

          **途中式**
          - $q=«q»$、$n-k=«n»-4=«dfe»$
          - 分子：$(«r1»-«r4»)/«q»=«diff»/«q»=«dq»$
          - 分母：$«r4»/«dfe»=«sig2»$
          - $F=«dq»/«sig2»=«F4»\cdots\approx«F»$
          - $F_{0.05}(«q»,«dfe»)=«f236»$ を超えるので棄却する

          **答え** $F=«F»$、棄却する（面接と調査書の少なくとも一方は GPA の説明に役立つ）

          **間違えやすい点** 分子の自由度は「M4 の説明変数の数 3」ではなく「加えた変数の数 2」。分母は大きいほうのモデル M4 の残差分散を使う（帰無仮説が正しくなくても $\sigma^2$ を偏りなく推定できるため）。M1 の残差分散 $«r1»/«df1»=«rss1df»$ を使うと $«F_red»$ になる。

      - id: s21p06b
        chapter: 17
        terms: [studentized-residual, standardized-residual, leverage]
        topic: その観測を除いた残差分散を求め直してGPAの外部スチューデント化残差を計算する
        level: 応用
        definition: false
        type: numeric
        question: |
          M4 で、ある学生 $i$ の残差は $e_i=«e»$、てこ比は $h_{ii}=«h»$ だった。この学生を除いて M4 を当てはめ直したときの誤差分散の推定値 $s_{(i)}^2$ を使った外部スチューデント化残差
          $$t_i=\frac{e_i}{s_{(i)}\sqrt{1-h_{ii}}}$$
          を求めよ。ただし当てはめ直しはせず、$\sum_j e_j^2$ と $e_i$、$h_{ii}$ から $s_{(i)}^2$ を求めること。
        answer: «ti»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 観測 $i$ を除いた残差平方和は $S-\dfrac{e_i^2}{1-h_{ii}}$ になり、自由度は 1 減って $n-k-1$ になる（$S$ は全体の残差平方和、$k$ は切片を含む係数の数）。

          **途中式**
          - $\dfrac{e_i^2}{1-h_{ii}}=\dfrac{«e2»}{«h1»}=«e2h»$
          - 除いた残差平方和：$«r4»-«e2h»=«rem»$
          - $s_{(i)}^2=\dfrac{«rem»}{«n»-4-1}=\dfrac{«rem»}{«dfe1»}=«s2i»$、$s_{(i)}=«si»$
          - $\sqrt{1-h_{ii}}=\sqrt{«h1»}=«sh»$
          - $t_i=\dfrac{«e»}{«si»\times«sh»}=\dfrac{«e»}{«den_t»}=«ti4»\cdots$

          **答え** $«ti_s»$

          **間違えやすい点** 全体の $\hat\sigma^2=«r4»/«dfe»=«sig2»$ を使うと内部スチューデント化残差（標準化残差）$r_i=«e»/(«sig»\times«sh»)\approx«ri»$ になる。外れ値の疑いのある観測を除いて分散を推定し直すので、$|t_i|$ は $|r_i|$ より大きくなる。$t_i$ は帰無仮説のもとで自由度 $n-k-1=«dfe1»$ の $t$ 分布に従う。

      - id: s21p06c
        chapter: 30
        terms: [mallows-cp, model-selection, variable-selection]
        topic: 4つの候補モデルの残差平方和からマローズのCpを計算してGPA予測のモデルを選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          マローズの $C_p=\dfrac{S_p}{\hat\sigma^2}-n+2k$ が最小のモデルを選ぶ。ここで $S_p$ はそのモデルの残差平方和、$k$ は切片を含む係数の数、$\hat\sigma^2$ はすべての変数を含む M4 の残差平方和を残差の自由度で割った値である。
          選ばれるモデルとその $C_p$ の値の組として正しいものを選べ。
        choices:
          - "M2、$C_p=«cp2»$"
          - "M2、$C_p=«cp2_noint»$"
          - "M2、$C_p=«cp2_n»$"
          - "M4、$C_p=«cp4»$"
          - "M4、$C_p=«cp4_no2»$"
        answer: 0
        distractors:
          - 正解
          - k に切片を数えなかった（どのモデルも 2 だけ小さくなる）
          - σ² の推定に残差平方和を n=40 で割った値を使った
          - 残差平方和が最小のモデルを選んだ（Cp は最小ではない）
          - 罰則項を 2k ではなく k とした
        explanation: |
          **方針** $\hat\sigma^2=«r4»/«dfe»=«sig2»$ を使い、各モデルの $C_p$ を計算して最小のものを選ぶ。

          **途中式**
          - M1（$k=2$）：$«r1»/«sig2»-«n»+4=«q1»-«nk1»=«cpv1»$
          - M2（$k=3$）：$«r2»/«sig2»-«n»+6=«q2»-«nk2»=«cpv2»$
          - M3（$k=3$）：$«r3»/«sig2»-«n»+6=«q3»-«nk3»=«cpv3»$
          - M4（$k=4$）：$«r4»/«sig2»-«n»+8=«q4»-«nk4»=«cpv4»$
          - 最小は M2

          **答え** M2、$C_p=«cp2»$

          **間違えやすい点** 残差平方和だけを見ると変数の多い M4 が常に最小になる。$C_p$ は変数を増やすことの罰則 $2k$ を加えている。なお M4 の $C_p$ は定義から必ず $k=4$ になる。罰則を $k$ にすると M4 が $«cp4_no2»$ で最小となり誤った選択になる。

  - id: s21p07
    title: 模擬試験の5教科
    context: |
      ある高校の模擬試験の結果を分析する。
    items:
      - id: s21p07a
        chapter: 3
        terms: [expectation-variance-properties, covariance-and-correlation]
        topic: 数学と英語の得点の相関から英語を2倍に重み付けした総合点の標準偏差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          数学の得点 $X$ の標準偏差は «sx» 点、英語の得点 $Y$ の標準偏差は «sy» 点、$X$ と $Y$ の相関係数は «rho» である。
          英語の配点を 2 倍にした総合点 $S=X+«w»Y$ の標準偏差に最も近い値はどれか。
        choices:
          - "$«d_nocov»$"
          - "$«d_w1»$"
          - "$«d_once»$"
          - "$«sd»$"
          - "$«d_sum»$"
        answer: 3
        distractors:
          - 共分散の項を忘れた（X と Y を無相関とみなした）
          - 係数 2 を分散に 2 乗せずにそのまま掛けた
          - 共分散の項を 2 倍し忘れた
          - 正解
          - 標準偏差をそのまま足した（相関係数 1 の場合）
        explanation: |
          **方針** $V[aX+bY]=a^2V[X]+b^2V[Y]+2ab\,\mathrm{Cov}(X,Y)$、$\mathrm{Cov}(X,Y)=\rho\sigma_X\sigma_Y$ を使う。

          **途中式**
          - $\mathrm{Cov}(X,Y)=«rho»\times«sx»\times«sy»=«cov»$
          - $V[S]=«vx»+«w»^2\times«vy»+2\times«w»\times«cov»=«vx»+«w2vy»+«covterm»=«v»$
          - 標準偏差 $\sqrt{«v»}\approx«sd»$

          **答え** $«sd»$

          **間違えやすい点** 共分散を忘れると $\sqrt{«v_nocov»}=«d_nocov»$。係数は分散では 2 乗されるので $«w»^2\times«vy»=«w2vy»$。共分散の項は $2ab$ 倍（ここでは 4 倍）であることにも注意。

      - id: s21p07b
        chapter: 22
        terms: [kaiser-criterion, cumulative-contribution-ratio, pca-on-correlation-matrix]
        topic: 5教科の相関行列の固有値からカイザー基準と累積寄与率で残す主成分の数を判断する
        level: 基本
        definition: true
        type: choice
        question: |
          5 教科の得点の**相関行列**で主成分分析を行ったところ、固有値は大きい順に «l1»、«l2»、«l3»、«l4»、«l5» だった。正しい記述はどれか。
        choices:
          - カイザー基準（固有値が 1 以上の主成分を残す）では、第 1 主成分と第 2 主成分の 2 つを残す。
          - '第 2 主成分の主成分得点の分散は $«l2»^2$ である。'
          - '固有値の合計 $«ltot»$ は、5 教科の素点の分散の合計に等しい。'
          - 累積寄与率が 80% 以上になるまで残すという基準では、2 つの主成分で足りる。
          - 'カイザー基準で残すのは第 1 主成分だけで、その寄与率は $«c1»\%$ である。'
        answer: 4
        distractors:
          - 第 2 固有値 0.92 は 1 未満なので残さない
          - 主成分得点の分散は固有値そのもの（2 乗しない）
          - 相関行列を使ったので固有値の合計は変数の数 5（標準化した変数の分散の合計）であり、素点の分散の合計ではない
          - 2 つでは累積寄与率 75.4% で 80% に届かず、3 つ必要
          - 正解
        explanation: |
          **方針** 相関行列の主成分分析では、各変数を標準化しているので固有値の合計は変数の数（5）に等しい。第 $j$ 主成分得点の分散は第 $j$ 固有値、寄与率は固有値÷合計。

          **途中式**
          - 合計：$«l1»+«l2»+«l3»+«l4»+«l5»=«ltot»$
          - 寄与率：第 1 主成分 $«l1»/«ltot»=«c1»\%$
          - 累積寄与率：2 つまで $«c12»\%$、3 つまで $«c123»\%$
          - カイザー基準：固有値 1 以上は第 1 主成分だけ

          **答え** 「カイザー基準で残すのは第 1 主成分だけで、その寄与率は $«c1»\%$ である」

          **間違えやすい点** カイザー基準の「1」は、相関行列のとき 1 つの変数がもつ分散の大きさ（標準化した分散 1）にあたる。第 2 固有値 «l2» は 1 に近いが 1 未満である。累積寄与率 80% の基準では 3 つ（«c123»%）必要になり、基準によって残す数が変わる。

  - id: s21p08
    title: 学習アプリのレベル判定
    context: |
      ある学習アプリでは、生徒のレベルを毎日 1 回のテストで判定する。レベルは「初級」「中級」「上級」の 3 つで、翌日のレベルは今日のレベルだけで決まるマルコフ連鎖に従う。上級に達すると以後は上級のままとする。

      | 今日＼翌日 | 初級 | 中級 | 上級 |
      |---|---|---|---|
      | 初級 | «p11» | «p12» | 0 |
      | 中級 | «p21» | «p22» | «p23» |
      | 上級 | 0 | 0 | 1 |
    items:
      - id: s21p08a
        chapter: 14
        terms: [first-passage-time, absorbing-state, transition-probability-matrix]
        topic: 中級から初級に戻ることもあるレベル遷移で初級の生徒が上級に達するまでの平均日数を一歩目で条件づけて求める
        level: 応用
        definition: false
        type: numeric
        question: |
          今日初級と判定された生徒が、初めて上級と判定されるまでの日数（推移の回数）の期待値を求めよ。
        answer: «m1»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 初級・中級から上級に達するまでの平均日数を $m_1,m_2$ とおく。1 日目の推移で条件づけると「1 日たって、移った先からの平均日数を足す」連立方程式が立つ。

          **途中式**
          - $m_1=1+«p11»m_1+«p12»m_2$
          - $m_2=1+«p21»m_1+«p22»m_2$（上級に移ればそこで終わるので項はない）
          - 第 1 式より $«a11»m_1=1+«p12»m_2$、よって $m_1=«c1»+m_2$
          - 第 2 式に代入：$«a22»m_2=1+«p21»(«c1»+m_2)$ より $«lhs»m_2=«rhs»$、$m_2=«m2»$
          - $m_1=«c1»+«m2»=«m1_s»$

          **答え** $«m1_s»$ 日

          **間違えやすい点** 中級から上級への 1 段階だけを見て $1/«p23»\approx«d_23»$ としたり、各段階の幾何分布の平均を足して $1/«p12»+1/«p23»\approx«d_geo»$ としたりすると、中級から初級に戻る可能性を無視したことになる。中級の生徒の平均日数 $m_2=«m2»$ と取り違えないこと。

  - id: s21p09
    title: アプリの学習時間と得点
    context: |
      ある中学校で、学習アプリの週あたりの利用時間（時間）と、定期試験の得点の関係を調べた。
    items:
      - id: s21p09a
        chapter: 11
        terms: [test-correlation-coefficient, t-distribution]
        topic: 学習時間と得点の標本相関係数から無相関の検定のt統計量を求める
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ «n» 人の生徒について、利用時間と得点の標本相関係数は $r=«r»$ だった。2 変数が 2 変量正規分布に従うとして、母相関係数が 0 という帰無仮説の検定統計量 $t$ の値に最も近いものはどれか。
        choices:
          - "$«d_noden»$"
          - "$«t»$"
          - "$«d_n»$"
          - "$«d_nosq»$"
          - "$«d_nonum»$"
        answer: 1
        distractors:
          - 分母の √(1−r²) で割り忘れた
          - 正解
          - √(n−2) の代わりに √n を使った
          - 分母の 1−r² の平方根をとり忘れた
          - 分子の √(n−2) を掛け忘れた
        explanation: |
          **方針** 母相関係数 0 のもとで $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ は自由度 $n-2$ の $t$ 分布に従う。

          **途中式**
          - $\sqrt{n-2}=\sqrt{«n2»}=«sqn2»$、分子 $«r»\times«sqn2»=«num»$
          - $1-r^2=1-«r2»=«r21»$、$\sqrt{«r21»}=«sq»$
          - $t=«num»/«sq»=«t4»\cdots$

          **答え** $«t»$（自由度 «n2» の $t$ 分布の上側 2.5% 点 2.060 を超えるので、両側 5% で有意）

          **間違えやすい点** 自由度は $n-2$（平均を 2 つ推定する）で、$\sqrt{n}$ を使うと $«d_n»$ になる。分母は $\sqrt{1-r^2}$ で、平方根をとり忘れると $«d_nosq»$ になる。

      - id: s21p09b
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 有料機能の無料提供の抽選を操作変数として学習時間が得点に与える効果をワルド推定量で求める
        level: 応用
        definition: false
        type: choice
        question: |
          学習時間の長い生徒はもともと意欲が高いので、得点を利用時間に回帰した最小二乗推定の傾き «ols»（1 時間あたりの点数）は、利用時間の効果を過大に見積もっているおそれがある。
          そこで、抽選で選んだ生徒（当選群）にだけアプリの有料機能を無料で提供した。結果は次のとおりである。

          | | 利用時間の平均 | 得点の平均 |
          |---|---|---|
          | 当選群 | «x1» | «y1» |
          | 落選群 | «x0» | «y0» |

          抽選の当落は利用時間を通してだけ得点に影響するとして、当落を操作変数とした利用時間の効果（1 時間あたりの得点の増加）の推定値に最も近いものはどれか。
        choices:
          - "$«d_itt»$"
          - "$«d_inv»$"
          - "$«ols»$"
          - "$«iv»$"
          - "$«d_ratio»$"
        answer: 3
        distractors:
          - 当落による得点の差（意図した介入による効果）をそのまま答えた
          - 比の分子と分母を逆にした
          - 交絡の影響を受けた最小二乗推定の傾きを答えた
          - 正解
          - 当選群の得点の平均を利用時間の平均で割った
        explanation: |
          **方針** 操作変数 $Z$（当選 1・落選 0）が 2 値のとき、操作変数推定量（2 段階最小二乗推定量と一致）は $\hat\beta_{IV}=\dfrac{\mathrm{Cov}(Z,Y)}{\mathrm{Cov}(Z,X)}=\dfrac{\bar y_1-\bar y_0}{\bar x_1-\bar x_0}$（ワルド推定量）になる。

          **途中式**
          - 得点の差：$«y1»-«y0»=«dy»$
          - 利用時間の差：$«x1»-«x0»=«dx»$
          - $\hat\beta_{IV}=«dy»/«dx»=«iv»$

          **答え** $«iv»$

          **間違えやすい点** 得点の差 «dy» は「当選したこと」の効果で、当選によって利用時間が «dx» 時間増えたことを通じた効果である。1 時間あたりに直すには利用時間の差で割る。
          抽選は意欲と無関係（無作為）なので、当落を通した比較は意欲による交絡を受けない。最小二乗推定の «ols» より小さいのは、意欲の高い生徒ほど長く利用していた（正の交絡）ためと解釈できる。

  - id: s21p10
    title: 指導法の多重比較
    context: |
      数学の単元で 3 つの指導法 A（動画）、B（演習中心）、C（対面）を比べるため、生徒 «N» 人を各 «n» 人ずつ無作為に割り付けた。
      単元テストの平均点は A «mA» 点、B «mB» 点、C «mC» 点で、一元配置分散分析の誤差の平均平方は $MS_E=«mse»$（自由度 «dfe»）だった。
    items:
      - id: s21p10a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 3つの指導法の平均点の全対比較をテューキー法の臨界差で判定しt検定の繰り返しと比べる
        level: 標準
        definition: false
        type: choice
        question: |
          テューキー法（有意水準 5%）で 3 つの対をすべて比較する。平均点の差がこの値を超えたら有意とする臨界差と、有意になる対の組として正しいものはどれか。
          スチューデント化された範囲の上側 5% 点は $q_{0.05}(3,«dfe»)=«q»$、$t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«tv»$ とする。
        choices:
          - "臨界差 «hsd»。有意なのは C と A の対だけ"
          - "臨界差 «big»。有意な対はない"
          - "臨界差 «lsd»。有意なのは B と A、C と A の対"
          - "臨界差 «nosq»。有意な対はない"
          - "臨界差 «half»。有意なのは B と A、C と A の対"
        answer: 0
        distractors:
          - 正解
          - 臨界差を q√(2MS_E/n) とし、√2 を余計に掛けた
          - 多重比較の調整をしない t 検定（最小有意差 LSD）を繰り返した
          - 根号をとらずに q×MS_E/n とした
          - q を √2 で割り、さらに √(MS_E/n) を掛けた（√2 の扱いを二重にした）
        explanation: |
          **方針** 各群 $n$ 人のとき、テューキー法の臨界差は $HSD=q_{0.05}(a,\phi_E)\sqrt{MS_E/n}$（$a$ は群の数、$\phi_E$ は誤差の自由度）。平均の差の絶対値がこれを超える対を有意とする。

          **途中式**
          - $\sqrt{MS_E/n}=\sqrt{«mse»/«n»}=\sqrt{«msen»}=«sq»$
          - $HSD=«q»\times«sq»=«hsd4»\cdots\approx«hsd»$
          - 差：B−A $=«dBA»$、C−A $=«dCA»$、C−B $=«dCB»$
          - «hsd» を超えるのは C−A だけ

          **答え** 臨界差 «hsd»、有意なのは C と A の対だけ

          **間違えやすい点** 調整なしの $t$ 検定を 3 回繰り返すと臨界差は $«tv»\times\sqrt{2\times«mse»/«n»}=«tv»\times«sq2»=«lsd»$ で、B−A も有意になるが、全体の第 1 種の誤りが 5% を超える。
          テューキー法の $q$ には平均の差の標準誤差 $\sqrt{2MS_E/n}$ の $\sqrt2$ がすでに含まれているので、$q\sqrt{2MS_E/n}=«big»$ とすると厳しすぎる。

      - id: s21p10b
        chapter: 10
        terms: [holm-method, bonferroni-correction, multiple-testing]
        topic: 5つの単元の効果のp値にホルム法を当てはめボンフェローニ法との違いを見る
        level: 基本
        definition: false
        type: choice
        question: |
          別の調査で、学習アプリの 5 つの単元ア〜オのそれぞれについて効果の検定を行い、次の p 値を得た。

          | 単元 | ア | イ | ウ | エ | オ |
          |---|---|---|---|---|---|
          | p 値 | «pa» | «pi» | «pu» | «pe» | «po» |

          ホルム法で、全体の第 1 種の誤り（familywise error rate）を 5% 以下に抑えるとき、効果ありと判定される単元はどれか。
        choices:
          - イのみ
          - イとオ
          - イ・エ・オ
          - ア・イ・エ・オ
          - なし
        answer: 2
        distractors:
          - 閾値を検定の数ではなく対の数 10 で割った 0.005 とした
          - すべての p 値をボンフェローニ法の 0.05/5=0.01 と比べた
          - 正解
          - 多重性を調整せずに 0.05 と比べた（またはBH法で偽発見率を制御した）
          - p 値の大きいほうから閾値 0.05 と比べ、最大の 0.20 で手続きを止めた
        explanation: |
          **方針** ホルム法では p 値を小さい順に並べ、$k$ 番目を $\alpha/(m-k+1)$ と比べる。条件を満たさなくなった時点で止め、それより前の仮説だけを棄却する（$m=5$、$\alpha=0.05$）。

          **途中式**
          - 1 番目 イ $«pi»\le0.05/5=«a5»$：棄却
          - 2 番目 オ $«po»\le0.05/4=«a4»$：棄却
          - 3 番目 エ $«pe»\le0.05/3=«a3»$：棄却
          - 4 番目 ア $«pa»>0.05/2=«a2»$：ここで止める（ウも棄却しない）

          **答え** イ・エ・オ

          **間違えやすい点** ボンフェローニ法ではすべてを $0.05/5=«a5»$ と比べるので、エ（«pe»）は棄却されずイとオだけになる。ホルム法はボンフェローニ法と同じく familywise error rate を抑えつつ、より多くの仮説を棄却できる。ア（«pa»）は 0.05 未満だが、多重性を調整すると有意でない。

  - id: s21p11
    title: 学習アプリの満足度と継続
    context: |
      学習アプリの利用者を対象に、満足度と継続を分析した。
    items:
      - id: s21p11a
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, link-function]
        topic: 3段階の満足度の順序ロジットモデルで解説動画を使う利用者が中間の段階になる確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          満足度 $Y$（1：不満、2：普通、3：満足）を、解説動画の利用 $x$（利用 1、未利用 0）で説明する順序ロジットモデル
          $$P(Y\le j\mid x)=\frac{\exp(\theta_j-\beta x)}{1+\exp(\theta_j-\beta x)}\quad(j=1,2)$$
          を当てはめたところ、$\hat\theta_1=«th1»$、$\hat\theta_2=«th2»$、$\hat\beta=«beta»$ だった（$\beta>0$ なら満足度の高い側に移る）。
          解説動画を利用している人の満足度が「普通」である確率の推定値に最も近いものはどれか。
          必要なら $e^{-2.3}=«e_m23»$、$e^{-1.5}=«e_m15»$、$e^{-0.7}=«e_m07»$、$e^{-0.3}=«e_m03»$、$e^{0.5}=«e_05»$、$e^{1.3}=«e_13»$ を使え。
        choices:
          - "$«ans»$"
          - "$«d_p1»$"
          - "$«d_sign»$"
          - "$«d_x0»$"
          - "$«d_cum»$"
        answer: 0
        distractors:
          - 正解
          - P(Y=1)（不満の確率）を答えた
          - θ_j−βx の符号を取り違えて θ_j+βx とした
          - 解説動画を利用していない人（x=0）の確率を求めた
          - 累積確率 P(Y≦2) をそのまま答えた
        explanation: |
          **方針** 順序ロジットモデルでは累積確率がロジスティック関数で与えられるので、$P(Y=2)=P(Y\le2)-P(Y\le1)$ と差をとる。

          **途中式**（$x=1$）
          - $\theta_1-\beta=«th1»-«beta»=«eta1»$、$P(Y\le1)=\dfrac{1}{1+e^{1.3}}=\dfrac{1}{1+«e_13»}=«c1»$
          - $\theta_2-\beta=«th2»-«beta»=«eta2»$、$P(Y\le2)=\dfrac{1}{1+e^{-0.7}}=\dfrac{1}{1+«e_m07»}=«c2»$
          - $P(Y=2)=«c2»-«c1»=«ans4»$

          **答え** $«ans»$

          **間違えやすい点** 累積確率 $P(Y\le2)=«d_cum»$ は「普通以下」の確率で、「普通」の確率ではない。このモデルの書き方では $\beta x$ を引くので、$\theta_j+\beta x$ とすると $«d_sign»$ になる。動画を使わない人（$x=0$）では $«d_x0»$ である。

      - id: s21p11b
        chapter: 23
        terms: [roc-curve-and-auc, confusion-matrix]
        topic: 退会予測スコアの順位から退会者と継続者のすべての組を比べてAUCを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          翌月に退会するかを予測するスコア（大きいほど退会しやすい）を、«np» 人の退会者と «nn» 人の継続者で評価した。

          - 退会者のスコア：«pos»
          - 継続者のスコア：«neg»

          ROC 曲線の下の面積（AUC）を求めよ。
        answer: «auc»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** AUC は「退会者と継続者を 1 人ずつ無作為に選んだとき、退会者のスコアのほうが大きい確率」に等しい（同点は 1/2 と数えるが、ここでは同点はない）。«np»×«nn»＝«pairs» 組を数える。

          **途中式**
          - 退会者 0.82：継続者 6 人すべてより大きい → «w1»
          - 退会者 0.64：0.70 以外の 5 人より大きい → «w2»
          - 退会者 0.55：0.70 以外の 5 人より大きい → «w3»
          - 退会者 0.31：0.25、0.18、0.12 の 3 人より大きい → «w4»
          - 合計 «wins» 組、$AUC=«wins»/«pairs»=«auc4»\cdots$

          **答え** $«auc_s»$

          **間違えやすい点** ROC 曲線を描いて台形の面積を足しても同じ値になる（同点がないので階段状の面積）。AUC は特定のしきい値での正解率や再現率ではなく、すべてのしきい値をまとめた順位づけの良さの指標である。

  - id: s21p12
    title: 全校生徒の学習調査
    context: |
      生徒数 «N» 人のある高校で、家庭学習についての調査を行う。
    items:
      - id: s21p12a
        chapter: 21
        terms: [required-sample-size, finite-population-correction, simple-random-sampling]
        topic: 生徒800人の高校で比率の誤差の幅を抑える標本の大きさを有限母集団修正つきで求める
        level: 基本
        definition: false
        type: numeric
        question: |
          全校生徒から非復元の単純無作為抽出で $n$ 人を選び、「毎日 1 時間以上家庭学習をする」生徒の割合 $p$ を標本比率 $\hat p$ で推定する。
          $\hat p$ の分散は $V[\hat p]=\dfrac{N-n}{N-1}\cdot\dfrac{p(1-p)}{n}$ である。正規近似のもとで、95% 信頼区間の誤差の幅 $1.96\sqrt{V[\hat p]}$ を、$p$ の値によらず «e» 以下にするために必要な最小の $n$ を求めよ。
        answer: «ans»
        tolerance: 0.4
        answer_format: 整数で答えよ。±0.4 の差まで正解とする（ちょうどの整数のみ正解）。
        explanation: |
          **方針** $p(1-p)$ は $p=0.5$ で最大 0.25 になるので、そのときに条件を満たす $n$ を求める。有限母集団修正を含めた不等式を $n$ について解く。

          **途中式**
          - 修正なしの大きさ：$n_0=\dfrac{1.96^2\times0.25}{«e»^2}=«n0»$
          - 条件 $\dfrac{N-n}{N-1}\cdot\dfrac{0.25}{n}\le\dfrac{«e»^2}{1.96^2}=\dfrac{0.25}{n_0}$ を変形すると $n_0(N-n)\le n(N-1)$、すなわち
            $n\ge\dfrac{Nn_0}{N-1+n_0}=\dfrac{«N»\times«n0»}{«N1»+«n0»}=\dfrac{«nnum»}{«nden»}=«nreq»$
          - 整数に切り上げて «ans»

          **答え** «ans» 人

          **間違えやすい点** 有限母集団修正を忘れると $n_0=«n0»$ を切り上げて «n0up» 人となり、必要以上に多くなる。近似式 $n_0/(1+n_0/N)=«nsimple»$ でも切り上げると同じ «ans» になる。四捨五入ではなく切り上げること（«nreq» を切り捨てると条件を満たさない）。

      - id: s21p12b
        chapter: 29
        terms: [rubins-rules, multiple-imputation, missing-data-mechanism]
        topic: 学力調査の欠測を5回多重代入した推定値と標準誤差からルービンのルールで全体の標準誤差を求める
        level: 標準
        definition: false
        type: choice
        question: |
          調査の数学の得点には欠測があったため、欠測が MAR であると仮定して多重代入を «m» 回行った。各代入データでの平均点の推定値と、その分散の推定値（標準誤差の 2 乗）は次のとおりである。

          - 推定値：«est»
          - 分散の推定値：«se2»

          ルービンのルールでまとめた平均点の標準誤差に最も近い値はどれか。
        choices:
          - "$«d_W»$"
          - "$«d_Bm»$"
          - "$«d_WB»$"
          - "$«d_T»$"
          - "$«seT»$"
        answer: 4
        distractors:
          - 代入間の分散を無視し、代入内の分散の平均だけを使った
          - 代入間の分散を m で割ってから足した
          - 代入間の分散に (1+1/m) を掛け忘れた
          - 全分散 T（分散）を標準誤差と取り違えた
          - 正解
        explanation: |
          **方針** ルービンのルールでは、点推定は推定値の平均 $\bar Q$、全分散は $T=\bar W+(1+1/m)B$。$\bar W$ は代入内の分散の平均、$B$ は推定値の代入間の不偏分散（$m-1$ で割る）。

          **途中式**
          - $\bar Q=«qbar»$
          - $\bar W=«W»$
          - $B=\dfrac{\sum(Q_j-\bar Q)^2}{«m»-1}=\dfrac{«ssB»}{4}=«B»$
          - $T=«W»+\left(1+\frac1{«m»}\right)\times«B»=«W»+«BT»=«T»$
          - 標準誤差 $\sqrt{«T»}=«seT4»\cdots$

          **答え** $«seT»$

          **間違えやすい点** 1 回だけ代入した値を本物のデータとして扱うと、代入による不確かさ $B$ が抜けて標準誤差を過小評価する（$\sqrt{«W»}=«d_W»$）。$(1+1/m)$ の $1/m$ は、代入の回数が有限であることによる上乗せである。

  - id: s21p13
    title: 学習ログによる生徒のグループ分け
    context: |
      4 人の生徒 A〜D を、学習ログから作った 2 つの特徴量（標準化済み）で階層的にクラスタリングする。2 人の間の**平方ユークリッド距離**は次のとおりである。

      | | A | B | C | D |
      |---|---|---|---|---|
      | A | 0 | «dAB» | «dAC» | «dAD» |
      | B | «dAB» | 0 | «dBC» | «dBD» |
      | C | «dAC» | «dBC» | 0 | «dCD» |
      | D | «dAD» | «dBD» | «dCD» | 0 |
    items:
      - id: s21p13a
        chapter: 24
        terms: [centroid-method, lance-williams-formula, hierarchical-clustering]
        topic: 平方ユークリッド距離の行列から重心法で併合を進めランス・ウィリアムズの式で最後の併合距離を求める
        level: 応用
        definition: false
        type: choice
        question: |
          重心法（クラスター間の距離を、重心どうしの平方ユークリッド距離とする）で併合を進める。最後（3 回目）の併合距離に最も近いものはどれか。
        choices:
          - "$«d_single»$"
          - "$«ans»$"
          - "$«d_half»$"
          - "$«d_noterm»$"
          - "$«d_complete»$"
        answer: 1
        distractors:
          - 最短距離法（各メンバーとの距離の最小値）で求めた
          - 正解
          - クラスターの大きさを無視して重み 1/2・1/2・−1/4 を使った
          - ランス・ウィリアムズの式の最後の項（併合した2つの距離の項）を忘れた
          - 最長距離法（各メンバーとの距離の最大値）で求めた
        explanation: |
          **方針** 重心法のランス・ウィリアムズの式：クラスター $I$（$n_I$ 人）と $J$（$n_J$ 人）を併合したとき、別のクラスター $K$ との距離は
          $$d(K,I\cup J)=\frac{n_I}{n_I+n_J}d(K,I)+\frac{n_J}{n_I+n_J}d(K,J)-\frac{n_In_J}{(n_I+n_J)^2}d(I,J)$$
          （平方ユークリッド距離のとき、重心どうしの距離に正確に一致する）。

          **途中式**
          - 1 回目：最小の «dAB» で A と B を併合
          - $d(C,AB)=\frac12\times«dAC»+\frac12\times«dBC»-\frac14\times«dAB»=«u1»+«u2»-«u3»=«dC_AB»$
          - $d(D,AB)=\frac12\times«dAD»+\frac12\times«dBD»-\frac14\times«dAB»=«v1»+«v2»-«u3»=«dD_AB»$
          - 2 回目：«dC_AB»、«dD_AB»、$d(C,D)=«dCD»$ のうち最小の «dC_AB» で C と {A,B} を併合
          - 3 回目：$n_I=2$（{A,B}）、$n_J=1$（C）として
            $d(D,ABC)=\frac23\times«dD_AB»+\frac13\times«dCD»-\frac{2}{9}\times«dC_AB»=«t1»+«t2»-«t3»=«ans0»$

          **答え** $«ans»$

          **間違えやすい点** 重みはクラスターの人数に比例させる（2/3 と 1/3）。1/2 ずつにすると $«d_half»$ になる（これはメディアン法）。最後の項 $-\frac{n_In_J}{(n_I+n_J)^2}d(I,J)$ を忘れると $«d_noterm»$。最短距離法なら $«d_single»$、最長距離法なら $«d_complete»$ で、方法によって併合距離が変わる。
