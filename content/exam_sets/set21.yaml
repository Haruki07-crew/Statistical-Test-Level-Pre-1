set: 21
title: 模擬試験 第21回
minutes: 90
problems:
  - id: s21p01
    title: 文化祭の抽選箱
    context: |
      文化祭の抽選会で、箱の中に赤玉 «r» 個と白玉 «w» 個が入っている。1 人目が玉を 1 個無作為に取り出して色を記録し、その玉を箱に戻したうえで、取り出したのと同じ色の玉を «add» 個箱に加える。続いて 2 人目が箱から玉を 1 個無作為に取り出す。
    items:
      - id: s21p01a
        chapter: 1
        terms: [law-of-total-probability, bayes-theorem, conditional-probability]
        topic: 取り出した玉と同じ色の玉を加えるポリアの壺で2人目が赤のとき1人目も赤だった確率をベイズの定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          2 人目が赤玉を取り出したとき、1 人目も赤玉を取り出していた条件付き確率を求めよ。
        answer: «ans»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 1 人目の色で場合分けして全確率の公式で $P(\text{2 人目が赤})$ を求め、ベイズの定理で $P(\text{1 人目が赤}\mid\text{2 人目が赤})$ を出す。1 人目の色によって箱の中身が変わることに注意する。

          **途中式**
          - $P(R_1)=«r»/«N»$。1 人目が赤なら箱は赤 «ra»・白 «w» になるので $P(R_2\mid R_1)=«ra»/«Na»$
          - 1 人目が白なら箱は赤 «r»・白 «w»+«add» になるので $P(R_2\mid W_1)=«r»/«Na»$
          - $P(R_2)=\dfrac{«r»}{«N»}\cdot\dfrac{«ra»}{«Na»}+\dfrac{«w»}{«N»}\cdot\dfrac{«r»}{«Na»}=\dfrac{«j_num»+«o_num»}{«den»}=\dfrac{«s_num»}{«den»}=«pr2»$
          - $P(R_1\mid R_2)=\dfrac{«j_num»/«den»}{«s_num»/«den»}=\dfrac{«j_num»}{«s_num»}=«ans6»\cdots$

          **答え** $«ans_s»$

          **間違えやすい点** 2 人目が赤だったという情報を使わずに $P(R_1)=«d_prior»$ と答えるのは誤り。玉を加えずに取り出したまま戻さない場合（$\frac{«r»-1}{«N»-1}=«d_norep»$）とも違う。なお $P(R_2)=«pr2»$ は $P(R_1)$ と等しく、この壺では何人目でも赤の確率は同じになる。

  - id: s21p02
    title: 新作問題の正答率
    context: |
      学習アプリに新しく加えた問題を «n» 人の生徒が解き、«T» 人が正解した。各生徒の正誤は独立で、正解の確率は共通の $p$ とする。
      正解者数 $T$ は二項分布 $B(«n»,p)$ に従い、$\hat p=T/«n»=«ph»$ である。
    items:
      - id: s21p02a
        chapter: 8
        terms: [unbiased-estimator, binomial-distribution, point-estimation]
        topic: 二項分布の正解者数の関数として1人の正誤のばらつきp(1-p)の不偏推定量を作る
        level: 応用
        definition: false
        type: choice
        question: |
          1 人の生徒の正誤（正解 1・不正解 0）の分散は $p(1-p)$ である。$T$ の関数で $p(1-p)$ の**不偏**推定量となるものを使うと、推定値はいくらか。
        choices:
          - "$«mle»$"
          - "$«unb»$"
          - "$«shr»$"
          - "$«vph»$"
          - "$«both»$"
        answer: 1
        distractors:
          - 最尤推定量 p̂(1−p̂) をそのまま使った（下向きの偏りがある）
          - 正解
          - 偏りの補正を逆向きにして (n−1)/n を掛けた
          - p̂ の分散 p̂(1−p̂)/n と取り違えた
          - 分子と分母の両方を n−1 で割るなど補正を過大にした
        explanation: |
          **方針** $E[T(n-T)]$ を計算し、$p(1-p)$ の何倍になっているかを調べて定数で割る。

          **途中式**
          - $E[T]=np$、$E[T^2]=V[T]+(E[T])^2=np(1-p)+n^2p^2$
          - $E[T(n-T)]=nE[T]-E[T^2]=n^2p-np+np^2-n^2p^2=n(n-1)p(1-p)$
          - よって $\dfrac{T(n-T)}{n(n-1)}$ は $p(1-p)$ の不偏推定量
          - 推定値：$\dfrac{«T»\times«nT»}{«n»\times«n1»}=\dfrac{«Tnum»}{«uden»}=«unb5»\cdots$

          **答え** $«unb»$

          **間違えやすい点** 最尤推定量 $\hat p(1-\hat p)=«mle»$ は $E[\hat p(1-\hat p)]=\frac{n-1}{n}p(1-p)$ なので小さめに偏る。$\frac{n}{n-1}$ を掛けると不偏になる（$«mle»\times\frac{«n»}{«n1»}=«unb»$）。逆に $\frac{n-1}{n}$ を掛けると $«shr»$ になる。$p(1-p)/n$（$\hat p$ の分散）とも区別すること。
          なお $T$ は完備十分統計量なので、$T$ の関数である不偏推定量はこれ 1 つに決まる。

      - id: s21p02b
        chapter: 7
        terms: [consistent-estimator, convergence-in-probability, chebyshev-inequality]
        topic: 正答率のいくつかの推定量について偏りと分散の極限から一致性の有無を判定する
        level: 標準
        definition: true
        type: choice
        question: |
          一般に $n$ 人が解いたときの正解者数を $T_n$、1 人目の生徒の正誤（正解 1・不正解 0）を $X_1$ とする。$p$ の推定量の一致性（$n\to\infty$ のとき推定量が $p$ に確率収束すること）について、正しい記述はどれか。
        choices:
          - '$(T_n+1)/(n+2)$ は $p$ の不偏推定量でないので、一致推定量でもない。'
          - '$X_1$ は $E[X_1]=p$ を満たす不偏推定量なので、一致推定量である。'
          - '$(T_n+n)/(2n)$ は分散が $0$ に近づくので、$p$ の一致推定量である。'
          - 一致推定量であれば、有限の $n$ でも必ず不偏推定量である。
          - '$T_n/n$ は、任意の $\varepsilon>0$ について $P(|T_n/n-p|>\varepsilon)\to0$ を満たす一致推定量であり、このことはチェビシェフの不等式から示せる。'
        answer: 4
        distractors:
          - 偏りは (1−2p)/(n+2) で 0 に近づき分散も 0 に近づくので一致推定量である
          - X_1 の分布は n によらず分散 p(1−p) のままで p に確率収束しない
          - 分散は 0 に近づくが (1+p)/2 に確率収束するので p の一致推定量ではない
          - (T_n+1)/(n+2) は一致推定量だが不偏ではない（反例）
          - 正解
        explanation: |
          **方針** 推定量 $\hat\theta_n$ の平均二乗誤差 $E[(\hat\theta_n-p)^2]=(\text{偏り})^2+\text{分散}$ が 0 に近づけば、チェビシェフ（マルコフ）の不等式から一致推定量になる。偏りと分散の極限を 1 つずつ調べる。

          **途中式**
          - $T_n/n$：偏り 0、分散 $p(1-p)/n\to0$。$P(|T_n/n-p|>\varepsilon)\le\dfrac{p(1-p)}{n\varepsilon^2}\to0$ なので一致推定量
          - $(T_n+1)/(n+2)$：期待値 $\dfrac{np+1}{n+2}\to p$、分散 $\dfrac{np(1-p)}{(n+2)^2}\to0$ なので、不偏ではないが一致推定量
          - $X_1$：$n$ によらず分布が変わらないので $p$ に確率収束しない（$0<p<1$ のとき）
          - $(T_n+n)/(2n)=\frac12\cdot\frac{T_n}{n}+\frac12\to\dfrac{1+p}{2}$ に確率収束するので、$p$ の一致推定量ではない

          **答え** 「$T_n/n$ は … 一致推定量であり、このことはチェビシェフの不等式から示せる」

          **間違えやすい点** 不偏性と一致性は別の性質である。不偏でも一致しない例（$X_1$）、不偏でなくても一致する例（$(T_n+1)/(n+2)$）がある。分散が 0 に近づくだけでは不十分で、偏りも 0 に近づく必要がある。

  - id: s21p03
    title: 自習室と学習スペース
    context: |
      図書館の自習室は 3 席とも利用中である。席 1・2・3 の残りの利用時間（分）は互いに独立に、平均がそれぞれ «m1»・«m2»・«m3» 分の指数分布に従う。
    items:
      - id: s21p03a
        chapter: 6
        terms: [exponential-distribution, inclusion-exclusion-principle, order-statistics]
        topic: 平均の異なる3つの指数分布の最大値の期待値を包除原理で求めすべての席が空くまでの平均時間を出す
        level: 応用
        definition: false
        type: choice
        question: |
          閉館の準備のため、3 席すべてが空くまで待つ。すべての席が空くまでの時間 $M=\max(X_1,X_2,X_3)$（分）の期待値に最も近いものはどれか（$X_i$ は席 $i$ の残りの利用時間）。
        choices:
          - "$«d_min»$ 分"
          - "$«d_maxm»$ 分"
          - "$«d_sum»$ 分"
          - "$«emax»$ 分"
          - "$«d_nolast»$ 分"
        answer: 3
        distractors:
          - 最初に席が空くまでの時間（最小値）の期待値を求めた
          - 平均が最も長い席 3 の平均だけを答えた
          - 3 席を順番に使い終えるとみて平均を足した
          - 正解
          - 包除原理の最後の項（3 席とも使用中の項）を足し忘れた
        explanation: |
          **方針** 非負の確率変数では $E[M]=\int_0^\infty P(M>t)\,dt$。$P(M>t)=1-\prod_i(1-e^{-t/\mu_i})$ を展開すると、包除原理の形で指数関数の和になり、項ごとに積分できる。平均 $\mu$ の指数分布について $\int_0^\infty e^{-t/\mu}dt=\mu$。

          **途中式**
          - $P(M>t)=\sum_i e^{-t/\mu_i}-\sum_{i<j}e^{-t(1/\mu_i+1/\mu_j)}+e^{-t(1/\mu_1+1/\mu_2+1/\mu_3)}$
          - 1 席ずつの項：$«m1»+«m2»+«m3»=«msum»$
          - 2 席ずつの項（レートの和の逆数）：$\dfrac{1}{1/«m1»+1/«m2»}=«p12»$、$\dfrac{1}{1/«m1»+1/«m3»}=«p13»$、$\dfrac{1}{1/«m2»+1/«m3»}=«p23»$、合計 «psum»
          - 3 席の項：$\dfrac{1}{1/«m1»+1/«m2»+1/«m3»}=«allm»$
          - $E[M]=«msum»-«psum»+«allm»=«emax»$

          **答え** $«emax»$ 分

          **間違えやすい点** 最初に空くまでの時間（最小値）はレートの和 $1/«allm»$ の指数分布で平均 «allm» 分だが、最大値は指数分布にならない。平均を足した «d_sum» 分は 3 席を順に使い終える場合の値で、同時に使われている状況とは違う。最大値は最も長い平均 «d_maxm» 分より大きくなる。

      - id: s21p03b
        chapter: 2
        terms: [probability-mass-and-density-function, cumulative-distribution-function, quantile-function]
        topic: 直線的に減る密度の正規化定数を決め分布関数を2次方程式で解いて学習スペースの利用時間の中央値を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          予約制の学習スペースでは、1 回の利用時間 $X$（時間）の密度関数が
          $$f(x)=c\,(«L»-x)\quad(0\le x\le «L»),\qquad f(x)=0\quad(\text{それ以外})$$
          であるとする（$c$ は定数）。$X$ の中央値を求めよ。
        answer: «med»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 全確率が 1 になるように $c$ を決め、分布関数 $F(x)$ を求めて $F(m)=1/2$ を解く。

          **途中式**
          - $\displaystyle\int_0^{«L»}(«L»-x)\,dx=«L2h»$ より $c=1/«cinv»$
          - $F(x)=\dfrac1{«cinv»}\displaystyle\int_0^{x}(«L»-u)\,du=\dfrac{«L»x-x^2/2}{«cinv»}\quad(0\le x\le«L»)$
          - $F(m)=\dfrac12$ より $«L»m-\dfrac{m^2}{2}=«L»$、すなわち $m^2-«twoL»m+«twoL»=0$
          - $m=«L»\pm\sqrt{16-8}=«L»\pm2\sqrt2=«L»\pm«sq»$。$0\le m\le«L»$ を満たすのは $m=«L»-«sq»=«med4»$

          **答え** $«med_s»$ 時間

          **間違えやすい点** 2 次方程式のもう 1 つの解 $«big»$ は範囲 $0\le x\le«L»$ の外なので捨てる。密度が右下がりなので、中央値は区間の中点 $«d_mid2»$ より小さく、平均 $E[X]=«L»/3\approx«xmean»$ とも異なる。

  - id: s21p04
    title: 図書館の貸出と蔵書点検
    context: |
      市立図書館の本館と分館の利用状況を分析する。
    items:
      - id: s21p04a
        chapter: 30
        terms: [aic, model-selection, maximum-likelihood-estimator]
        topic: 貸出件数に当てはめた3つのモデルのAICから赤池重みを求めAIC最小のモデルの重みを出す
        level: 応用
        definition: false
        type: numeric
        question: |
          分館の 1 時間あたりの貸出件数（200 時間分）に次の 3 つのモデルを当てはめた。

          | モデル | 内容 | 推定するパラメータの数 | 最大対数尤度 |
          |---|---|---|---|
          | M1 | ポアソン分布（平均一定） | «k1» | $«ll1»$ |
          | M2 | ポアソン回帰（切片と週末ダミー） | «k2» | $«ll2»$ |
          | M3 | 負の二項回帰（切片・週末ダミー・過分散パラメータ） | «k3» | $«ll3»$ |

          AIC $=-2\times(\text{最大対数尤度})+2\times(\text{パラメータの数})$ とし、モデル $m$ の赤池重みを $w_m=\dfrac{\exp(-\Delta_m/2)}{\sum_j\exp(-\Delta_j/2)}$（$\Delta_m$ は AIC の最小値との差）と定める。AIC が最小のモデルの赤池重みを求めよ。
          必要なら $e^{-2.5}=«e1»$、$e^{-0.4}=«e3»$ を使え。
        answer: «w»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 各モデルの AIC を計算して最小値との差 $\Delta_m$ を求め、$\exp(-\Delta_m/2)$ を合計 1 になるように割る。

          **途中式**
          - AIC：M1 $=«a1»$、M2 $=«a2»$、M3 $=«a3»$。最小は M2
          - $\Delta$：M1 «dl1»、M2 0、M3 «dl3»
          - $\exp(-\Delta/2)$：M1 $e^{-2.5}=«e1»$、M2 $1$、M3 $e^{-0.4}=«e3»$、合計 «wsum»
          - M2 の赤池重み：$1/«wsum»=«w5»\cdots$

          **答え** $«w_s»$

          **間違えやすい点** 負の二項回帰の過分散パラメータを数え忘れると M3 の AIC が «aw3» になり、M3 を最小と取り違える。$\Delta$ を 2 で割り忘れないこと。赤池重みは「候補の中でどのモデルが最も良いか」の相対的な重みで、M2 が真のモデルである確率そのものではない。

      - id: s21p04b
        chapter: 12
        terms: [proportion-test, continuity-correction, one-sided-two-sided-test]
        topic: 延滞率が過去の値より高いかを帰無仮説の比率で標準誤差を作る1標本の比率の検定で連続修正つきのz値を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          本館の延滞率は、過去には «pct»% だった。ある月に本館で貸し出した本から無作為に «n» 件を選ぶと «x» 件が延滞していた。
          延滞率が «pct»% より高くなったかを片側検定する。延滞件数の二項分布を正規分布で近似し、平均と標準偏差は**帰無仮説の延滞率 «p0»** を使って求め、**連続修正（0.5）**を行う。検定統計量 $z$ の値を求めよ。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 帰無仮説のもとで延滞件数 $X\sim B(«n»,«p0»)$。上側の確率 $P(X\ge«x»)$ を正規近似するので、連続修正で «x» を $«x»-0.5$ に置き換えて標準化する。

          **途中式**
          - 平均 $np_0=«n»\times«p0»=«mu»$、分散 $np_0(1-p_0)=«var»$、標準偏差 $\sqrt{«var»}=«sd»$
          - $z=\dfrac{(«x»-0.5)-«mu»}{«sd»}=\dfrac{«num»}{«sd»}=«z4»\cdots$

          **答え** $«z_s»$（片側 5% の棄却点 1.645 を超えるので、延滞率は高くなったといえる）

          **間違えやすい点** 連続修正をしないと $z=«z_nc»$。上側の確率なので 0.5 を引く（足すと «z_plus» になる）。標準誤差に標本比率 $\hat p=«phat»$ を使うと «z_ph» になるが、検定では帰無仮説の値 $p_0$ で標準誤差を作る。

      - id: s21p04c
        chapter: 21
        terms: [systematic-sampling, inclusion-probability, simple-random-sampling]
        topic: 蔵書目録から一定間隔で本を選ぶ系統抽出の抽出間隔と包含確率と周期性による偏りを読み取る
        level: 基本
        definition: true
        type: choice
        question: |
          本館の蔵書 «N» 冊の状態を点検するため、目録の通し番号を使って «ns» 冊を系統抽出する（開始番号を無作為に 1 つ選び、そこから一定の間隔で選ぶ）。正しい記述はどれか。
        choices:
          - '起こりうる標本は、単純無作為抽出と同じく $\binom{«N»}{«ns»}$ 通りある。'
          - どの本も選ばれる確率は等しいので、単純無作為抽出の分散の公式を使えば、1 つの標本から標本平均の分散を常に偏りなく推定できる。
          - 目録が書架ごとに並び、どの書架もちょうど «k» 冊で、書架の 1 番目が必ず大型本であっても、標本に偏りは生じない。
          - 目録の先頭に近い本ほど選ばれやすく、包含確率は本によって異なる。
          - '抽出間隔は «k» で、開始番号は 1〜«k» から無作為に選ぶ。どの本の包含確率も $1/«k»$ だが、2 冊が同時に選ばれる確率は本の組によって $0$ か $1/«k»$ になる。'
        answer: 4
        distractors:
          - 開始番号で標本が決まるので、起こりうる標本は 40 通りしかない
          - 2 冊が同時に選ばれる確率が単純無作為抽出と違うので、単純無作為抽出の分散の公式は一般には使えない
          - 間隔が書架の冊数と一致すると、開始番号 1 のとき大型本だけが選ばれるなど周期性による偏りが生じる
          - 開始番号を無作為に選べば、どの本も選ばれる確率は 1/40 で等しい
          - 正解
        explanation: |
          **方針** 系統抽出は「開始番号 1 つを無作為に選ぶ」だけの抽出である。抽出間隔は $k=N/n$、起こりうる標本は $k$ 通りで、それぞれ確率 $1/k$。

          **途中式**
          - 間隔：$«N»/«ns»=«k»$。開始番号 $r$ を 1〜«k» から等確率で選び、$r, r+«k», r+2\times«k»,\ldots$ を抽出する
          - 各本は «k» 通りの標本のうちちょうど 1 つに含まれるので、包含確率は $1/«k»$
          - 2 冊の番号の差が «k» の倍数なら同じ標本に入り（同時に選ばれる確率 $1/«k»$）、そうでなければ決して同時には選ばれない（確率 0）

          **答え** 「抽出間隔は «k» で…2 冊が同時に選ばれる確率は本の組によって 0 か $1/«k»$ になる」

          **間違えやすい点** 1 冊ごとの包含確率は単純無作為抽出と同じでも、2 冊が同時に選ばれる確率（2 次の包含確率）が違うので、推定量の分散は単純無作為抽出とは異なる。並び順に間隔と同じ周期があると、標本が大きく偏る。逆に、目録が無関係な順に並んでいれば、単純無作為抽出に近い精度になる。

  - id: s21p05
    title: 補習講座の効果
    context: |
      ある高校で、放課後の補習講座の受講と、模擬試験の結果を調べた。
    items:
      - id: s21p05a
        chapter: 9
        terms: [ci-two-sample-mean-difference, welch-test, t-distribution]
        topic: 母分散が等しいと仮定できない2群の模試得点の平均の差の95%信頼区間をウェルチの方法とサタスウェイトの自由度で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある学年の受講者 «n1» 人の得点は平均 «m1» 点・不偏分散の平方根 «s1» 点、非受講者 «n2» 人の得点は平均 «m2» 点・不偏分散の平方根 «s2» 点だった。
          2 群の得点はそれぞれ正規分布に従うが、母分散が等しいとは仮定できないので、ウェルチの方法で母平均の差（受講者−非受講者）の 95% 信頼区間を求める。自由度はサタスウェイトの近似で計算し、小数点以下を切り捨てて整数にする。最も近いものはどれか。
          必要なら $t_{0.025}(9)=«t9»$、$t_{0.025}(16)=«t16»$、$t_{0.025}(20)=«t20»$、標準正規分布の上側 2.5% 点 1.96 を使え。
        choices:
          - "$(«pl_l»,\\ «pl_u»)$"
          - "$(«d20_l»,\\ «d20_u»)$"
          - "$(«ok_l»,\\ «ok_u»)$"
          - "$(«z_l»,\\ «z_u»)$"
          - "$(«d9_l»,\\ «d9_u»)$"
        answer: 2
        distractors:
          - 等分散を仮定してプールした分散と自由度 20 で区間を作った
          - 標準誤差はウェルチのものだが、自由度を n1+n2−2=20 とした
          - 正解
          - t 分布ではなく標準正規分布の 1.96 を使った
          - 自由度を小さいほうの標本の n−1=9 とする保守的な近似を使った
        explanation: |
          **方針** ウェルチの方法では標準誤差を $\sqrt{s_1^2/n_1+s_2^2/n_2}$ とし、自由度をサタスウェイトの近似 $\nu=\dfrac{(s_1^2/n_1+s_2^2/n_2)^2}{\frac{(s_1^2/n_1)^2}{n_1-1}+\frac{(s_2^2/n_2)^2}{n_2-1}}$ で求める。

          **途中式**
          - $s_1^2/n_1=«v1»$、$s_2^2/n_2=«v2»$、和 «vs»、標準誤差 $\sqrt{«vs»}=«se»$
          - $\nu$ の分子 $«vs»^2=«dfn»$、分母 $\dfrac{«v1»^2}{«n1»-1}+\dfrac{«v2»^2}{«n2»-1}=«dfd1»+«dfd2»=«dfd»$ より $\nu=«df»$ → 切り捨てて «dfi»
          - 半幅：$«t16»\times«se»=«h»$
          - 区間：$«d»\pm«h»$ より $(«ok_l»,\ «ok_u»)$

          **答え** $(«ok_l»,\ «ok_u»)$（0 を含まないので、有意水準 5% で差があるといえる）

          **間違えやすい点** 2 群の不偏分散と標本の大きさが異なるので、自由度は $n_1+n_2-2=20$ より小さくなる。等分散を仮定してプールした分散と自由度 20 を使うと $(«pl_l»,\ «pl_u»)$ になる。自由度を 9 とする近似は保守的で、区間が広くなる。

      - id: s21p05b
        chapter: 28
        terms: [relative-risk, odds-and-odds-ratio, risk-difference]
        topic: 補習の受講と合格の2×2表からリスク比とオッズ比と1人の合格を増やすのに必要な受講者数（NNT）を求めて区別する
        level: 標準
        definition: false
        type: choice
        question: |
          別の学年では、生徒を受講者と非受講者に分けて追跡し、検定試験の合否を調べた。

          | | 合格 | 不合格 |
          |---|---|---|
          | 受講 | «a» | «b» |
          | 非受講 | «c» | «dd» |

          受講者の非受講者に対する合格率の比（リスク比）、合格のオッズ比、および NNT（合格率の差の逆数。受講者を何人増やすと合格者が平均 1 人増えるかの目安）の組として正しいものはどれか。
        choices:
          - リスク比 «rr»、オッズ比 «rr»、NNT «nnt»
          - リスク比 «or»、オッズ比 «rr»、NNT «nnt»
          - リスク比 «rr_col»、オッズ比 «or»、NNT «nnt»
          - リスク比 «rr»、オッズ比 «or»、NNT «nnt»
          - リスク比 «rr»、オッズ比 «or»、NNT «d_nnt»
        answer: 3
        distractors:
          - オッズ比を合格率の比と同じものとみなした
          - リスク比とオッズ比を取り違えた
          - 合格率ではなく、合格者・不合格者のうち受講者の割合の比を求めた（条件の向きが逆）
          - 正解
          - NNT を受講者の合格率の逆数とした
        explanation: |
          **方針** 行（受講・非受講）ごとの合格率を求め、その比・差と、オッズ（合格/不合格）の比を計算する。

          **途中式**
          - 合格率：受講 $«a»/«n_t»=«r1»$、非受講 $«c»/«n_c»=«r0»$
          - リスク比：$«r1»/«r0»=«rr»$
          - オッズ比：$\dfrac{«a»/«b»}{«c»/«dd»}=\dfrac{«a»\times«dd»}{«b»\times«c»}=«or»$
          - 合格率の差 $«r1»-«r0»=«rd»$、NNT $=1/«rd»=«nnt»$

          **答え** リスク比 «rr»、オッズ比 «or»、NNT «nnt»

          **間違えやすい点** 合格がまれでない（合格率が 4〜6 割）ので、オッズ比はリスク比より 1 から遠くなり、リスク比の近似にはならない。合格者のうち受講者の割合（$«pa»$）と不合格者のうち受講者の割合（$«pb»$）の比 «rr_col» は、条件の向きが逆で合格率の比ではない。NNT は差の逆数で、比の逆数ではない。

  - id: s21p06
    title: 入試区分と1年次のGPA
    context: |
      ある大学で、1 年次の GPA $y$ を、共通テストの得点 $x$（100 点満点に換算）と入試区分のダミー変数 $D$（推薦入試 1、一般入試 0）で説明する回帰モデル
      $$y=\beta_0+\beta_1x+\beta_2D+\beta_3Dx+\varepsilon$$
      を最小二乗法で当てはめたところ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$、$\hat\beta_3=«b3»$ だった。
    items:
      - id: s21p06a
        chapter: 16
        terms: [interaction-term, dummy-variable, multiple-regression-model]
        topic: 入試区分ダミーと共通テスト得点の交互作用項を含む回帰で区分間の予測値の差と2本の回帰直線が交わる得点を求める
        level: 標準
        definition: false
        type: choice
        question: |
          共通テストの得点が «x» 点の学生について、推薦入学者の予測 GPA と一般入学者の予測 GPA の差（推薦−一般）と、両者の予測 GPA が等しくなる共通テストの得点の組として正しいものはどれか。
        choices:
          - 差 «b2»、等しくなる得点 «cross» 点
          - 差 «diff»、等しくなる得点 «cross» 点
          - 差 «d_sign»、等しくなる得点 −«cross» 点
          - 差 «diff»、等しくなる得点 «d_b1» 点
          - 差 «diff»、2 本の直線は平行なので等しくなる得点はない
        answer: 1
        distractors:
          - 交互作用項を無視し、ダミーの係数をそのまま差とした
          - 正解
          - 交互作用の係数の符号を取り違えた
          - 交互作用の係数ではなく x の係数 β1 で割った
          - ダミー変数は切片だけをずらすと考え、交互作用で傾きが変わることを忘れた
        explanation: |
          **方針** $D=1$ と $D=0$ の式を別々に書くと、推薦入学者の式は切片 $\beta_0+\beta_2$、傾き $\beta_1+\beta_3$ の直線になる。2 つの直線の差は $\beta_2+\beta_3x$ で、$x$ によって変わる。

          **途中式**
          - 一般入試（$D=0$）：$\hat y=«b0»+«b1»x$。$x=«x»$ で $«g_gen»$
          - 推薦入試（$D=1$）：$\hat y=(«b0»+«b2»)+(«b1»+(«b3»))x=«b02»+«slope»x$。$x=«x»$ で $«g_rec»$
          - 差：$\hat\beta_2+\hat\beta_3\times«x»=«b2»+(«b3x»)=«diff»$
          - 等しくなる得点：$«b2»+(«b3»)x=0$ より $x=«b2»/«nb3»=«cross»$

          **答え** 差 «diff»、等しくなる得点 «cross» 点

          **間違えやすい点** 交互作用項があるとき、ダミーの係数 $\hat\beta_2=«b2»$ は「$x=0$ のときの差」であり、得点が «x» 点の学生の差ではない。差は得点が上がるほど «nb3» ずつ縮み、«cross» 点を超えると一般入学者のほうが高くなる。

      - id: s21p06b
        chapter: 17
        terms: [residual-plot, heteroscedasticity, robust-standard-error]
        topic: 当てはめ値に対する残差プロットが漏斗型に広がるときの不均一分散の影響と対処を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルの残差を当てはめ値に対してプロットしたところ、残差は 0 の上下に対称に散らばっていたが、当てはめ値が大きいほど散らばりが大きくなる漏斗（じょうご）型だった。
          残差の正規 Q-Q プロットはほぼ直線上に並び、データは学生ごとに独立に集めたものである。正しい記述はどれか。
        choices:
          - 誤差の分散が一定でない（不均一分散）ため、最小二乗推定量は偏りをもつ。係数の推定値そのものが信頼できない。
          - 正規 Q-Q プロットが直線的なので、誤差分散が一定という仮定にも問題はない。
          - 漏斗型は誤差の系列相関を示すので、ダービン・ワトソン比で検定し、コクラン・オーカット法で当てはめ直すべきである。
          - 誤差分散が一定という仮定が疑われる。係数の最小二乗推定量は不偏のままだが、通常の標準誤差やそれに基づく t 検定は信頼できないので、頑健な標準誤差や重み付き最小二乗法を検討する。
          - 説明変数を追加して決定係数を高くすれば、漏斗型は必ず解消する。
        answer: 3
        distractors:
          - 不均一分散でも、誤差の期待値が 0 なら最小二乗推定量は不偏である
          - Q-Q プロットは正規性を見るもので、分散の一様性とは別の仮定である
          - 漏斗型は分散の大きさの変化であり、系列相関（時間順の残差の相関）ではない。学生ごとの独立なデータで系列相関は考えにくい
          - 正解
          - 決定係数を上げても誤差分散の形が変わるとは限らない
        explanation: |
          **方針** 残差プロットの漏斗型は、誤差の分散が当てはめ値とともに大きくなる不均一分散を示す。最小二乗推定量の不偏性は「誤差の期待値が 0」で決まり、分散が一定であることは不要である。一方、通常の標準誤差の公式は分散一定を前提にしている。

          **途中式**
          - 不偏性：$E[\hat\beta]=\beta+(X^\top X)^{-1}X^\top E[\varepsilon]=\beta$（分散の形によらない）
          - 分散：$V[\hat\beta]=(X^\top X)^{-1}X^\top\Sigma X(X^\top X)^{-1}$ は、$\Sigma=\sigma^2I$ のときだけ $\sigma^2(X^\top X)^{-1}$ になる
          - したがって通常の標準誤差は誤りうる → ホワイトの頑健な標準誤差や、分散に応じた重みの重み付き最小二乗法を使う。対数変換で分散がそろうこともある

          **答え** 「誤差分散が一定という仮定が疑われる。…頑健な標準誤差や重み付き最小二乗法を検討する」

          **間違えやすい点** 不均一分散の影響は「推定値の偏り」ではなく「標準誤差（推定の精度の評価）の誤り」と、最小二乗推定量が最良でなくなること。正規性・分散の一様性・独立性はそれぞれ別の診断で確かめる。

  - id: s21p07
    title: 学力調査の分析
    context: |
      ある県の学力調査の結果を分析する。
    items:
      - id: s21p07a
        chapter: 11
        terms: [z-test-known-variance, p-value, one-sided-two-sided-test]
        topic: 母標準偏差が既知の全国学力調査の得点で学校の平均が全国平均を上回るかをz検定の片側p値で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          全国の得点は平均 «mu0» 点・標準偏差 «sig» 点の正規分布に従うことがわかっている。ある学校の生徒 «n» 人の平均点は «xbar» 点だった。
          この学校の生徒の母平均が全国平均より高いかを、標準偏差は全国と同じ «sig» 点として片側検定する。p 値に最も近いものはどれか。
          必要なら $\Phi(0.3)=«phi03»$、$\Phi(0.72)=«phi072»$、$\Phi(1.8)=«phi18»$ を使え（$\Phi$ は標準正規分布の分布関数）。
        choices:
          - "$«d_sd»$"
          - "$«d_var»$"
          - "$«p»$"
          - "$«d_two»$"
          - "$«d_cmp»$"
        answer: 2
        distractors:
          - 標本平均の標準偏差ではなく、個人の標準偏差 15 で割った
          - 標準誤差の代わりに分散 σ²/n で割った
          - 正解
          - 片側検定なのに両側の p 値を答えた
          - 上側確率ではなく Φ(1.8) をそのまま答えた
        explanation: |
          **方針** 母標準偏差 $\sigma$ が既知なので、$z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}$ は帰無仮説のもとで標準正規分布に従う。対立仮説は「高い」なので上側の片側 p 値を求める。

          **途中式**
          - 標準誤差：$«sig»/\sqrt{«n»}=«se»$
          - $z=(«xbar»-«mu0»)/«se»=«dx»/«se»=«z»$
          - p 値：$P(Z\ge«z»)=1-\Phi(«z»)=1-«phi18»=«p4»$

          **答え** $«p»$（有意水準 5% で、全国平均より高いといえる）

          **間違えやすい点** 標本平均のばらつきは $\sigma/\sqrt n$ で、個人のばらつき $\sigma$ ではない（$\sigma$ で割ると $z=«zsd»$、p 値 «d_sd»）。対立仮説が「高い」と向きを決めているので片側 p 値を使い、2 倍しない。

      - id: s21p07b
        chapter: 22
        terms: [pca-on-correlation-matrix, eigenvalue-and-eigenvector, contribution-ratio]
        topic: 2教科の相関行列の主成分分析で固有値1±rと和と差の固有ベクトルから寄与率と主成分の意味を読む
        level: 基本
        definition: false
        type: choice
        question: |
          国語と数学の得点の相関係数は «rho» だった。2 教科の得点の**相関行列**で主成分分析を行う。正しい記述はどれか。
        choices:
          - '第 1 主成分の寄与率は $«c_r»\%$ で、固有ベクトルの向きは相関係数の値によって変わる。'
          - '固有値は $«l1sq»$ と $«l2sq»$ である。'
          - '固有値は $«l1»$ と $«l2»$ で、第 1 主成分の寄与率は $«c_sq»\%$ である。'
          - '国語と数学の相関係数が $-«rho»$ であれば、第 1 主成分の寄与率は $20\%$ に下がる。'
          - '固有値は $«l1»$ と $«l2»$ で、第 1 主成分の寄与率は $«c1»\%$ である。第 2 主成分は 2 教科の標準化得点の差に比例し、どちらの教科が得意かを表す。'
        answer: 4
        distractors:
          - 寄与率は (1+r)/2=80%。2 変数の相関行列の固有ベクトルは r（正）によらず (1,1)/√2 と (1,−1)/√2
          - 固有値は 1±r で、1±r² ではない
          - 寄与率は 1.6/2=80% で、0.8 を 2 乗しない
          - 相関が負のときも固有値は 1.6 と 0.4 で寄与率は 80%（第 1 主成分が差の方向になる）
          - 正解
        explanation: |
          **方針** 相関行列 $R=\begin{pmatrix}1&r\\r&1\end{pmatrix}$ の固有方程式 $(1-\lambda)^2-r^2=0$ を解く。

          **途中式**
          - $\lambda=1\pm r$ より $\lambda_1=«l1»$、$\lambda_2=«l2»$（合計は変数の数 2）
          - $\lambda_1=1+r$ の固有ベクトルは $(1,1)/\sqrt2$、$\lambda_2=1-r$ の固有ベクトルは $(1,-1)/\sqrt2$（$r>0$ のとき）
          - 第 1 主成分の寄与率：$«l1»/2=«c1»\%$
          - 第 1 主成分は標準化得点の和（総合力）、第 2 主成分は差（国語と数学のどちらが得意か）に比例する

          **答え** 「固有値は «l1» と «l2» で、第 1 主成分の寄与率は «c1»% である。第 2 主成分は…差に比例し…」

          **間違えやすい点** 2 変数の相関行列では、固有ベクトルは $r$ の大きさによらず和と差の方向になり、固有値だけが $r$ で決まる。相関が負なら和と差の役割が入れ替わるだけで、寄与率は $(1+|r|)/2$ のままである。

  - id: s21p08
    title: 学習アプリの利用ログ
    context: |
      ある学習アプリの利用ログを分析する。
    items:
      - id: s21p08a
        chapter: 3
        terms: [skewness-kurtosis, moments]
        topic: 1日のログイン回数の離散分布から4次の中心モーメントを計算して正規分布で0となる尖度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある生徒の 1 日のログイン回数 $X$ の分布は次のとおりである。

          | $x$ | «x0» | «x1» | «x2» | «x3» |
          |---|---|---|---|---|
          | $P(X=x)$ | «p0» | «p1» | «p2» | «p3» |

          $X$ の尖度を $E[(X-\mu)^4]/\sigma^4-3$（正規分布で 0 になる定義）とするとき、最も近い値はどれか。
        choices:
          - "$«d_m4»$"
          - "$«d_m2»$"
          - "$«d_no3»$"
          - "$«ex»$"
          - "$«d_raw»$"
        answer: 3
        distractors:
          - 4 次の中心モーメントを σ⁴ で割り忘れた
          - σ⁴ ではなく分散 σ² で割った
          - 3 を引き忘れた（正規分布で 3 になる定義の値）
          - 正解
          - 中心化せずに原点まわりの 4 次モーメント E[X⁴] を使った
        explanation: |
          **方針** 平均 $\mu$、分散 $\sigma^2$、4 次の中心モーメント $E[(X-\mu)^4]$ を順に求め、$\sigma^4=(\sigma^2)^2$ で割って 3 を引く。

          **途中式**
          - $\mu=«x0»\times«p0»+«x1»\times«p1»+«x2»\times«p2»+«x3»\times«p3»=«mu»$
          - 偏差 $x-\mu$：$«dv0»,\ «dv1»,\ «dv2»,\ «dv3»$
          - $\sigma^2=«sq0»+«sq1»+«sq2»+«sq3»=«m2»$、$\sigma^4=«m2»^2=«m22»$
          - $E[(X-\mu)^4]=«f0»+«f1»+«f2»+«f3»=«m4»$
          - $E[(X-\mu)^4]/\sigma^4=«m4»/«m22»=«ku4»$、尖度 $=«ku4»-3=«ex4»\cdots$

          **答え** $«ex»$（正規分布より裾が重い）

          **間違えやすい点** 尖度には「正規分布で 3」と「正規分布で 0」の 2 つの定義があり、問題の定義では 3 を引く（引かないと «d_no3»）。4 乗の値の大部分は外れた値 «x3» 回から来ている。中心化を忘れて $E[X^4]=«raw4»$ を使うと «d_raw» と大きくずれる。

      - id: s21p08b
        chapter: 5
        terms: [geometric-distribution, bernoulli-distribution, expectation-variance-properties]
        topic: 1日5回までの上限がある挑戦で正解するまでの挑戦回数の期待値を打ち切られた幾何分布の上側確率の和で求める
        level: 標準
        definition: false
        type: choice
        question: |
          このアプリの「チャレンジ問題」には 1 日に «cap» 回まで挑戦できる。ある生徒が各回に正解する確率は «p» で、各回の結果は独立とする。この生徒は、正解するか «cap» 回挑戦し終えるまで挑戦を続ける。
          1 日の挑戦回数の期待値と、その日に 1 回も正解できない確率の組として正しいものはどれか。
        choices:
          - 期待値 «d_inf» 回、確率 «none»
          - 期待値 «en» 回、確率 «none»
          - 期待値 «d_succ» 回、確率 «none»
          - 期待値 «en» 回、確率 «d_cmp»
          - 期待値 «en» 回、確率 «d_m1»
        answer: 1
        distractors:
          - 上限を無視して幾何分布の期待値 1/p を使った
          - 正解
          - 正解した場合の k·P(初めて k 回目で正解) だけを足し、5 回とも失敗した日の 5 回を数え忘れた
          - 1 回以上正解する確率を答えた
          - 失敗の回数を 1 つ少なく数えて 0.7⁴ とした
        explanation: |
          **方針** 正解までの挑戦回数 $X$ は幾何分布 $P(X>k)=(1-p)^k$ に従い、1 日の挑戦回数は $N=\min(X,«cap»)$。非負整数の確率変数では $E[N]=\sum_{k\ge0}P(N>k)$ を使う。

          **途中式**
          - $k=0,1,\ldots,«cap»-1$ では $P(N>k)=P(X>k)=«q»^k$、$k\ge«cap»$ では $P(N>k)=0$
          - $E[N]=\sum_{k=0}^{«cap»-1}«q»^k=«qps»=«en4»$（$=(1-«q»^{«cap»})/«p»$）
          - 1 回も正解できない確率：$P(X>«cap»)=«q»^{«cap»}=«none5»$

          **答え** 期待値 «en» 回、確率 «none»

          **間違えやすい点** 上限があるので期待値は $1/p=«d_inf»$ より小さい。$\sum_{k=1}^{«cap»}k\,p(1-p)^{k-1}=«d_succ»$ は正解できた日の分だけで、«cap» 回とも失敗した日（確率 «none»）の «cap» 回を足し忘れている。

