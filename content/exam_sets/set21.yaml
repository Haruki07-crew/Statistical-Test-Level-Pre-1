          - （確認）上級に着く経路は 初→初→中→上 $«path1»$、初→中→中→上 $«path2»$、初→中→上→上 $«path3»$ の 3 通りで、合計 «ans_s»

          **答え** $«ans_s»$

          **間違えやすい点** 初級から上級へは 1 日では行けないので、中級を経由する経路をすべて数える。2 日後の値 «d_two» や、1 つの経路だけの確率と取り違えないこと。

