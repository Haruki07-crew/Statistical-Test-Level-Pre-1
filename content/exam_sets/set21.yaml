          **途中式**
          - 自由度：A は $3-1=«dA»$、B は $4-1=«dB»$、A×B は $«dA»\times«dB»=«dAB»$、誤差は $3\times4\times(«rr»-1)=«dE»$
          - プール前：交互作用の平均平方 $«SAB»/«dAB»=«MSAB»$、誤差の平均平方 $«SE»/«dE»=«MSE»$、交互作用の F 値 $«FAB»$
          - プール後の誤差：平方和 $«SE»+«SAB»=«SEp»$、自由度 $«dE»+«dAB»=«dEp»$、平均平方 $«SEp»/«dEp»=«MSEp»$
          - 指導法：平均平方 $«SA»/«dA»=«MSA»$、$F=«MSA»/«MSEp»=«FA»$

