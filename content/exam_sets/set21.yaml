    title: 習熟判定テスト
    context: |
      学習アプリの単元の最後に確認テストを行い、全問正解したら「習熟」と判定して次の単元に進ませる。各問の正誤は独立で、1 問の正答率は、まだ習熟していない生徒では «p0»、習熟した生徒では «p1» とする。
    items:
      - id: s21p10a
        chapter: 10
        terms: [type-i-and-ii-errors, binomial-distribution, power-function]
        topic: 全問正解で習熟と判定するテストで第1種の誤りを5%以下にする最小の問題数とそのときの第2種の誤りの確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          帰無仮説を「まだ習熟していない（正答率 «p0»）」、対立仮説を「習熟した（正答率 «p1»）」とし、$n$ 問すべて正解したときに帰無仮説を棄却する（習熟と判定する）検定とみなす。
          第 1 種の誤りの確率を «alpha» 以下にする最小の問題数 $n$ と、そのときの第 2 種の誤りの確率の組として正しいものはどれか。
          必要なら $0.6^5=«a5»$、$0.6^6=«a6»$、$0.6^7=«a7»$、$0.6^8=«a8»$、$0.9^5=«b5»$、$0.9^6=«b6»$、$0.9^8=«b8»$ を使え。
        choices:
          - $n=5$、第 2 種 «d_n5»
          - $n=«n»$、第 2 種 «d_pow»
          - $n=«n»$、第 2 種 «beta»
          - $n=«n»$、第 2 種 «d_a»
          - $n=«n2»$、第 2 種 «d_n8»
        answer: 2
        distractors:
          - 第 1 種の誤りの確率が 0.0778 で 0.05 を超えることを見落とした
          - 第 2 種の誤りの確率の代わりに検出力 0.9⁶ を答えた
          - 正解
          - 第 2 種の誤りの確率の代わりに第 1 種の誤りの確率を答えた
          - 片側の基準なのに 0.05 を半分にして 0.025 以下とした
        explanation: |
          **方針** 全問正解の確率は $p^n$。第 1 種の誤り＝帰無仮説が正しい（$p=«p0»$）のに全問正解する確率 $«p0»^n$、第 2 種の誤り＝対立仮説が正しい（$p=«p1»$）のに全問正解しない確率 $1-«p1»^n$。

          **途中式**
          - $n=5$：$0.6^5=«a5»>«alpha»$ で条件を満たさない
          - $n=6$：$0.6^6=«a6»\le«alpha»$ なので最小の $n$ は «n»
          - 第 2 種：$1-0.9^6=1-«b6»=«beta4»$

          **答え** $n=«n»$、第 2 種 «beta»

          **間違えやすい点** 問題数を増やすと第 1 種の誤りは減るが、全問正解を求める規則のままでは習熟した生徒も 1 問は間違えやすくなり、第 2 種の誤りが増える（$n=5$ で «d_n5»、$n=6$ で «beta»）。両方を小さくするには、問題数を増やしたうえで「$n$ 問中 $c$ 問以上」のように基準を選び直す。

