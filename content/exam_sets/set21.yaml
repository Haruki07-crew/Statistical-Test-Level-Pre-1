    items:
      - id: s21p11a
        chapter: 20
        terms: [effect-size-eta-squared, two-way-anova-with-replication, sum-of-squares-decomposition]
        topic: 二元配置の分散分析の平方和から指導法の効果量η²と偏η²を求めて区別する
        level: 標準
        definition: false
        type: choice
        question: |
          各学校で生徒を 3 つの指導法に無作為に割り付け（各組合せに同じ人数）、単元テストの得点に繰り返しのある二元配置の分散分析を行ったところ、平方和は次のとおりだった。

          | 要因 | 指導法 A | 学校 B | 交互作用 A×B | 誤差 | 合計 |
          |---|---|---|---|---|---|
          | 平方和 | «SA» | «SB» | «SAB» | «SE» | «ST» |

          指導法の効果量 $\eta^2$ と偏 $\eta^2$ の組として正しいものはどれか。
        choices:
          - "$\\eta^2=«peta»$、偏 $\\eta^2=«eta»$"
          - "$\\eta^2=«eta»$、偏 $\\eta^2=«d_ae»$"
          - "$\\eta^2=«eta»$、偏 $\\eta^2=«peta»$"
          - "$\\eta^2=«eta»$、偏 $\\eta^2=«d_int»$"
          - "$\\eta^2=«d_ae»$、偏 $\\eta^2=«peta»$"
        answer: 2
        distractors:
          - η² と偏 η² を取り違えた
          - 偏 η² の分母を誤差の平方和だけにした
          - 正解
          - 偏 η² の分母に交互作用の平方和も入れた
          - η² の分母を全体ではなく誤差の平方和にした
        explanation: |
          **方針** $\eta^2=S_A/S_T$ は全変動のうち指導法で説明される割合。偏 $\eta^2=S_A/(S_A+S_E)$ は、他の要因（学校・交互作用）による変動を除いたうえでの割合である。

          **途中式**
          - $\eta^2=«SA»/«ST»=«eta»$
          - 偏 $\eta^2=\dfrac{«SA»}{«SA»+«SE»}=\dfrac{«SA»}{«SAE»}=«peta»$

          **答え** $\eta^2=«eta»$、偏 $\eta^2=«peta»$

          **間違えやすい点** 学校の違いによる変動 «SB» が大きいので、$\eta^2$ は小さく見える。偏 $\eta^2$ は学校の影響を除いて評価するので大きくなる。どちらを報告したかを明記しないと、他の研究と比べられない。分母に交互作用を入れると $«SA»/«SAABE»=«d_int»$ になる。

      - id: s21p11b
        chapter: 31
        terms: [empirical-bayes, hierarchical-bayes-model, normal-normal-model]
        topic: 8校の平均点の散らばりから学校間分散を推定し経験ベイズで1校の平均点を全体平均の方向に縮小推定する
        level: 応用
        definition: false
        type: choice
        question: |
          ある指導法で学んだ生徒の平均点を学校ごとに求めた。各校 «nn» 人で、生徒の得点の学校内の標準偏差は «sw» 点（既知）とする。
          学校 $j$ の真の平均 $\theta_j$ は平均 $\mu$・分散 $\tau^2$ の正規分布に従い、学校の平均点 $\bar y_j$ は $\theta_j$ が与えられたとき平均 $\theta_j$・分散 $«sw»^2/«nn»$ の正規分布に従うとする。
          «J» 校の平均点の平均は «mbar» 点、平均点の不偏分散は «vm» だった。$\mu$ を «mbar»、$\tau^2$ をモーメント法で推定する経験ベイズ法で、平均点 «yx» 点の学校 X の $\theta_X$ を推定する。最も近い値はどれか。
        choices:
          - "$«d_raw»$"
          - "$«d_rev»$"
          - "$«d_vm»$"
          - "$«d_half»$"
          - "$«eb»$"
        answer: 4
        distractors:
          - 縮小せず学校 X の平均点をそのまま答えた
          - 縮小係数の向きを逆にし、全体平均の側に寄せすぎた
          - 学校間分散 τ² を平均点の分散 13 のままとし、標本誤差の分散を引き忘れた
          - 学校の平均点と全体平均を単純に平均した
          - 正解
        explanation: |
          **方針** 周辺では $\bar y_j\sim N(\mu,\ \tau^2+\sigma^2/n)$ なので、平均点の分散から標本誤差の分散 $\sigma^2/n$ を引くと $\tau^2$ の推定値になる。事後平均は $\bar y_j$ と $\mu$ の重み付き平均 $\mu+(1-B)(\bar y_j-\mu)$、縮小係数 $B=\dfrac{\sigma^2/n}{\sigma^2/n+\tau^2}$。

          **途中式**
          - 標本誤差の分散：$«sw»^2/«nn»=«se2»$
          - $\hat\tau^2=«vm»-«se2»=«tau2»$
          - $B=\dfrac{«se2»}{«se2»+«tau2»}=\dfrac{«se2»}{«shr»}=«B»$
          - $\hat\theta_X=«mbar»+(1-«B»)\times(«yx»-«mbar»)=«mbar»+«B1»\times«dy»=«eb4»\cdots$

          **答え** $«eb»$

          **間違えやすい点** 平均点の散らばり «vm» には、学校の真の差 $\tau^2$ と、生徒 «nn» 人から平均を求めたことによる誤差 «se2» の両方が含まれる。誤差を引かずに $\tau^2=«vm»$ とすると縮小が弱くなり «d_vm» になる。学校 X の平均点が高いのは真の差だけでなく偶然の分もあるので、全体平均の方向に縮める。

  - id: s21p12
    title: 家庭学習時間の調査
    context: |
      ある高校で、生徒の 1 日あたりの家庭学習時間（時間）を調査した。家庭学習をまったくしない生徒（0 時間）も一定数いる。
    items:
      - id: s21p12a
        chapter: 18
        terms: [tobit-model, censored-data, standard-normal-distribution]
        topic: 家庭学習時間が0に集まるトービットモデルで学習しない生徒の割合と観測される学習時間の期待値を求める
        level: 応用
        definition: false
        type: choice
        question: |
          家庭学習時間 $y$ を、潜在変数 $y^*=x^\top\beta+\varepsilon$（$\varepsilon\sim N(0,\sigma^2)$）を使って $y=\max(0,\ y^*)$ と表すトービットモデルを当てはめた。
          ある属性の生徒では $x^\top\hat\beta=«xb»$、$\hat\sigma=«sig»$ だった。この属性の生徒で家庭学習時間が 0 である確率と、観測される家庭学習時間 $y$ の期待値 $E[y]$ の組として最も近いものはどれか。
          必要なら $\Phi(0.6)=«Phi»$、$\phi(0.6)=«phi»$ を使え（$\Phi$、$\phi$ は標準正規分布の分布関数と密度関数）。
        choices:
          - "$P(y=0)=«p0»$、$E[y]=«Ey»$"
          - "$P(y=0)=«d_p»$、$E[y]=«Ey»$"
          - "$P(y=0)=«p0»$、$E[y]=«xb»$"
          - "$P(y=0)=«p0»$、$E[y]=«Epos»$"
          - "$P(y=0)=«p0»$、$E[y]=«d_noterm»$"
        answer: 0
        distractors:
          - 正解
          - P(y*>0)=Φ(0.6) を 0 時間の確率と取り違えた
          - 潜在変数の期待値 x'β を観測値の期待値とした（0 で打ち切られることを無視）
          - 正の値をとる生徒だけの条件付き期待値 E[y|y>0] を答えた
          - E[y]=Φ(c)x'β+σφ(c) の第2項 σφ を落とした
        explanation: |
          **方針** $y=0$ は $y^*\le0$、すなわち $\varepsilon\le-x^\top\beta$ のとき。$c=x^\top\beta/\sigma$ とおくと $P(y=0)=\Phi(-c)=1-\Phi(c)$。観測値の期待値は $E[y]=P(y^*>0)E[y^*\mid y^*>0]=\Phi(c)\,x^\top\beta+\sigma\phi(c)$。

          **途中式**
          - $c=«xb»/«sig»=«z»$
          - $P(y=0)=1-\Phi(«z»)=1-«Phi»=«p0_4»$
          - $E[y]=«Phi»\times«xb»+«sig»\times«phi»=«t1»+«t2»=«Ey4»$

          **答え** $P(y=0)=«p0»$、$E[y]=«Ey»$

          **間違えやすい点** $x^\top\beta=«xb»$ は潜在変数の平均で、0 未満の部分が 0 に置き換えられるので観測値の期待値は異なる。正の生徒だけの平均 $E[y\mid y>0]=x^\top\beta+\sigma\phi(c)/\Phi(c)\approx«Epos»$ とも区別する。0 の多いデータを普通の最小二乗法で当てはめると、係数が 0 の方向に偏る。

      - id: s21p12b
        chapter: 29
        terms: [single-imputation, missing-data-mechanism, complete-case-analysis]
        topic: 家庭学習時間の欠測を観測値の平均で単一代入したときの不偏分散の過小評価を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          «n» 人に調査したところ、«miss» 人の家庭学習時間が無回答だった。回答した «nobs» 人の平均は $\bar y$、不偏分散は «s2» だった。
          無回答の «miss» 人の値をすべて回答者の平均 $\bar y$ で埋め（平均値代入）、«n» 人分のデータとして不偏分散を計算するといくらになるか。
        answer: «vimp»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 平均で埋めた値は平均からの偏差が 0 なので、偏差平方和は回答者の分だけのまま変わらない。一方、割る数は $n-1$ に増える。

          **途中式**
          - 回答者の偏差平方和：$(«nobs»-1)\times«s2»=«nobs1»\times«s2»=«num»$
          - 代入後も平均は $\bar y$ のままで、偏差平方和も «num»
          - 代入後の不偏分散：$«num»/(«n»-1)=«num»/«n1»=«vimp5»\cdots$

          **答え** $«vimp_s»$

          **間違えやすい点** 平均値代入をすると、平均は変わらないが分散が元の約 «ratio_v» 倍に小さくなり、標準誤差も過小になる（実際より精度が高く見える）。さらに欠測が MAR や MNAR なら平均にも偏りが残る。この欠点を補うのが、ばらつきを加えて複数回代入する多重代入法である。

      - id: s21p12c
        chapter: 19
        terms: [quantile-regression, robust-standard-error]
        topic: 定数項だけの分位点回帰でチェック関数の和を最小にする値として家庭学習時間の80%分位点を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある学級の «ny» 人の家庭学習時間は次のとおりだった（小さい順）。

          «y»

          定数 $c$ だけのモデルで分位点回帰（$\tau=«tau»$）を行う。すなわち、チェック関数 $\rho_\tau(u)=u\{\tau-I(u<0)\}$ を使った損失 $\sum_i\rho_\tau(y_i-c)$ を最小にする $c$ を求める。最も適切な値はどれか。
        choices:
          - "$«ymed»$"
          - "$«ymean»$"
          - "$«q_low»$"
          - "$«qk»$"
          - "$«q_high»$"
        answer: 3
        distractors:
          - τ=0.5（中央値）の場合を答えた
          - 二乗誤差を最小にする値（平均）を答えた
          - nτ=7.2 を切り捨てて 7 番目の値を答えた
          - 正解
          - 最大値（9 番目）を選び、上側に寄せすぎた
        explanation: |
          **方針** $c$ をわずかに増やすと、$c$ より上にある観測 1 つにつき損失が $\tau$ だけ減り、下にある観測 1 つにつき $1-\tau$ だけ増える。損失が減るのは $\tau\times(\text{上の個数})>(1-\tau)\times(\text{下の個数})$ の間である。

          **途中式**
          - $c$ を $y_{(7)}=«q_low»$ と $y_{(8)}=«qk»$ の間に置くと、下に «km1» 個、上に 2 個：増やしたときの変化 $0.2\times7-0.8\times2=1.4-1.6<0$ なので、まだ損失は減る
          - $c$ を $y_{(8)}=«qk»$ と $y_{(9)}=«q_high»$ の間に置くと、下に «k» 個、上に «nk» 個：変化 $0.2\times«k»-0.8\times«nk»=1.6-0.8>0$ なので損失は増える
          - よって最小点は $c=y_{(8)}=«qk»$（$n\tau=«nt»$ を切り上げた «k» 番目）

          **答え** $«qk»$

          **間違えやすい点** 二乗誤差なら平均 «ymean»、絶対誤差（$\tau=0.5$）なら中央値 «ymed» が最小点になる。分位点回帰は外れ値（6.0 時間）の影響を受けにくく、分布の上側や下側の傾向を調べるのに使われる。

  - id: s21p13
    title: 学習スタイルのグループ分けと判別
    context: |
      学習ログをもとに、生徒をグループに分けたり、退会しそうな生徒を見分けたりする。
    items:
      - id: s21p13a
        chapter: 24
        terms: [single-linkage, dendrogram, complete-linkage]
        topic: 5人の非類似度行列に最短距離法を適用しデンドログラムをある高さで切ったときのクラスターを最長距離法と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          5 人の生徒 A〜E の学習パターンの非類似度が次のように求められた。

          | | A | B | C | D | E |
          |---|---|---|---|---|---|
          | A | 0 | 1.0 | 3.5 | 6.0 | 5.5 |
          | B | 1.0 | 0 | 2.0 | 5.0 | 4.8 |
          | C | 3.5 | 2.0 | 0 | 4.0 | 4.2 |
          | D | 6.0 | 5.0 | 4.0 | 0 | 2.5 |
          | E | 5.5 | 4.8 | 4.2 | 2.5 | 0 |

          最短距離法（単連結法）で階層的クラスタリングを行い、デンドログラムを高さ 3.0 で切る（併合距離が 3.0 未満の併合だけを行う）。得られるクラスターはどれか。
        choices:
          - "{A, B}、{C}、{D, E}"
          - "{A, B, C}、{D, E}"
          - "{A, B, C, D, E}"
          - "{A, B}、{C, D, E}"
          - "{A}、{B, C}、{D, E}"
        answer: 1
        distractors:
          - 最長距離法で求めた（C と {A,B} の距離が 3.5 になり、高さ 3.0 では併合されない）
          - 正解
          - 切る高さを最後の併合距離 4.0 より上にとった
          - C を最も近いクラスターではなく D と E の側に入れた
          - 最初の併合を A と B ではなく B と C にした（最小の非類似度 1.0 を見落とした）
        explanation: |
          **方針** 最短距離法では、クラスター間の距離を「メンバー間の非類似度の最小値」とし、最も近いクラスターから順に併合する。

          **途中式**
          - 1 回目：最小の 1.0 で A と B を併合
          - $d(C,\{A,B\})=\min(3.5,\ 2.0)=2.0$、$d(D,\{A,B\})=\min(6.0,\ 5.0)=5.0$、$d(E,\{A,B\})=\min(5.5,\ 4.8)=4.8$
          - 2 回目：残りの最小は 2.0 で C と {A,B} を併合
          - 3 回目：$d(D,E)=2.5$ で D と E を併合
          - 4 回目：$d(\{A,B,C\},\{D,E\})=\min(6.0,5.5,5.0,4.8,4.0,4.2)=4.0$ で全体が 1 つになる
          - 高さ 3.0 で切ると {A,B,C} と {D,E}

          **答え** {A, B, C}、{D, E}

          **間違えやすい点** 最長距離法では $d(C,\{A,B\})=\max(3.5,\ 2.0)=3.5$ となり、高さ 3.0 では C が単独で残る。最短距離法は鎖のように 1 つずつつながりやすい（A と C の非類似度 3.5 は大きいのに、B を介して同じクラスターになる）。

      - id: s21p13b
        chapter: 23
        terms: [support-vector-machine, linear-discriminant-analysis]
        topic: ハードマージンの線形サポートベクターマシンの重みベクトルのノルムからマージンの幅を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          2 つの特徴量 $(x_1,x_2)$ から翌月の退会（$+1$）と継続（$-1$）を判別する線形サポートベクターマシン（ハードマージン）を学習したところ、判別関数は $f(x)=«w1»x_1+«w2»x_2+(«b»)$ となった。
          サポートベクターは $f(x)=\pm1$ の上にある。2 つのクラスを分けるマージンの幅（$f(x)=1$ と $f(x)=-1$ の 2 直線の間の距離）を求めよ。
        answer: «margin»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 平行な 2 直線 $w^\top x+b=1$ と $w^\top x+b=-1$ の距離は $\dfrac{|1-(-1)|}{\|w\|}=\dfrac{2}{\|w\|}$。

          **途中式**
          - $\|w\|^2=«w1»^2+«w2»^2=«w1s»+«w2s»=«nw2»$、$\|w\|=«nw»$
          - マージンの幅 $=2/«nw»=«margin4»\cdots$

          **答え** $«margin_s»$

          **間違えやすい点** 判別境界 $f(x)=0$ から片側のサポートベクターまでの距離は $1/\|w\|=«d_half»$ で、その 2 倍が幅である。$\|w\|$ を 2 乗のまま使って $2/«nw2»=«d_sq»$ としないこと。サポートベクターマシンは、このマージンを最大にする（$\|w\|$ を最小にする）判別境界を選ぶ。
