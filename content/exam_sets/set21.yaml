set: 21
title: 模擬試験 第21回
minutes: 90
problems:
  - id: s21p01
    title: 答案の返却
    context: |
      ある先生が «n» 人の生徒の答案を採点したあと、名前を見ずに無作為に 1 枚ずつ配り直してしまった（«n» 枚の並べ方 «fact» 通りが等しい確率で起こる）。
    items:
      - id: s21p01a
        chapter: 1
        terms: [inclusion-exclusion-principle, conditional-probability, independence-of-events]
        topic: 5人の答案を無作為に配り直したとき誰も自分の答案を受け取らない確率を包除原理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          どの生徒も自分の答案を受け取らない確率を求めよ。
        answer: «ans»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 生徒 $i$ が自分の答案を受け取る事象を $A_i$ とし、少なくとも 1 人が自分の答案を受け取る確率 $P(A_1\cup\cdots\cup A_{«n»})$ を包除原理で求めて 1 から引く。

          **途中式**
          - 特定の $k$ 人がそろって自分の答案を受け取る確率は $\dfrac{(«n»-k)!}{«n»!}$。その選び方は $\binom{«n»}{k}$ 通りなので、包除原理の第 $k$ 項は $\binom{«n»}{k}\dfrac{(«n»-k)!}{«n»!}=\dfrac1{k!}$
          - $P(A_1\cup\cdots\cup A_{«n»})=1-\dfrac1{2!}+\dfrac1{3!}-\dfrac1{4!}+\dfrac1{5!}$
          - 求める確率 $=1-P(A_1\cup\cdots\cup A_{«n»})=\dfrac1{2!}-\dfrac1{3!}+\dfrac1{4!}-\dfrac1{5!}=\dfrac{60-20+5-1}{120}=\dfrac{«der»}{«fact»}=«ans6»\cdots$

          **答え** $«ans_s»$

          **間違えやすい点** 各生徒が自分の答案を受け取らない確率 $4/5$ を独立とみなして $(4/5)^5=«ind»$ とするのは誤り（$A_i$ どうしは独立でない）。生徒が多いときの近似値 $e^{-1}=«e1»$ とも小数第 4 位で異なる。余事象（少なくとも 1 人が受け取る確率 «one»）と取り違えないこと。

  - id: s21p02
    title: 新作問題の正答率
    context: |
      学習アプリに新しく加えた問題を «n» 人の生徒が解き、«T» 人が正解した。各生徒の正誤は独立で、正解の確率は共通の $p$ とする。
      正解者数 $T$ は二項分布 $B(«n»,p)$ に従い、$\hat p=T/«n»=«ph»$ である。
    items:
      - id: s21p02a
        chapter: 8
        terms: [unbiased-estimator, binomial-distribution, point-estimation]
        topic: 二項分布の正解者数の関数として1人の正誤のばらつきp(1-p)の不偏推定量を作る
        level: 応用
        definition: false
        type: choice
        question: |
          1 人の生徒の正誤（正解 1・不正解 0）の分散は $p(1-p)$ である。$T$ の関数で $p(1-p)$ の**不偏**推定量となるものを使うと、推定値はいくらか。
        choices:
          - "$«mle»$"
          - "$«unb»$"
          - "$«shr»$"
          - "$«vph»$"
          - "$«both»$"
        answer: 1
        distractors:
          - 最尤推定量 p̂(1−p̂) をそのまま使った（下向きの偏りがある）
          - 正解
          - 偏りの補正を逆向きにして (n−1)/n を掛けた
          - p̂ の分散 p̂(1−p̂)/n と取り違えた
          - 分子と分母の両方を n−1 で割るなど補正を過大にした
        explanation: |
          **方針** $E[T(n-T)]$ を計算し、$p(1-p)$ の何倍になっているかを調べて定数で割る。

          **途中式**
          - $E[T]=np$、$E[T^2]=V[T]+(E[T])^2=np(1-p)+n^2p^2$
          - $E[T(n-T)]=nE[T]-E[T^2]=n^2p-np+np^2-n^2p^2=n(n-1)p(1-p)$
          - よって $\dfrac{T(n-T)}{n(n-1)}$ は $p(1-p)$ の不偏推定量
          - 推定値：$\dfrac{«T»\times«nT»}{«n»\times«n1»}=\dfrac{«Tnum»}{«uden»}=«unb5»\cdots$

          **答え** $«unb»$

          **間違えやすい点** 最尤推定量 $\hat p(1-\hat p)=«mle»$ は $E[\hat p(1-\hat p)]=\frac{n-1}{n}p(1-p)$ なので小さめに偏る。$\frac{n}{n-1}$ を掛けると不偏になる（$«mle»\times\frac{«n»}{«n1»}=«unb»$）。逆に $\frac{n-1}{n}$ を掛けると $«shr»$ になる。$p(1-p)/n$（$\hat p$ の分散）とも区別すること。
          なお $T$ は完備十分統計量なので、$T$ の関数である不偏推定量はこれ 1 つに決まる。

      - id: s21p02b
        chapter: 7
        terms: [consistent-estimator, convergence-in-probability, chebyshev-inequality]
        topic: 正答率のいくつかの推定量について偏りと分散の極限から一致性の有無を判定する
        level: 標準
        definition: true
        type: choice
        question: |
          一般に $n$ 人が解いたときの正解者数を $T_n$、1 人目の生徒の正誤（正解 1・不正解 0）を $X_1$ とする。$p$ の推定量の一致性（$n\to\infty$ のとき推定量が $p$ に確率収束すること）について、正しい記述はどれか。
        choices:
          - '$(T_n+1)/(n+2)$ は $p$ の不偏推定量でないので、一致推定量でもない。'
          - '$X_1$ は $E[X_1]=p$ を満たす不偏推定量なので、一致推定量である。'
          - '$(T_n+n)/(2n)$ は分散が $0$ に近づくので、$p$ の一致推定量である。'
          - 一致推定量であれば、有限の $n$ でも必ず不偏推定量である。
          - '$T_n/n$ は、任意の $\varepsilon>0$ について $P(|T_n/n-p|>\varepsilon)\to0$ を満たす一致推定量であり、このことはチェビシェフの不等式から示せる。'
        answer: 4
        distractors:
          - 偏りは (1−2p)/(n+2) で 0 に近づき分散も 0 に近づくので一致推定量である
          - X_1 の分布は n によらず分散 p(1−p) のままで p に確率収束しない
          - 分散は 0 に近づくが (1+p)/2 に確率収束するので p の一致推定量ではない
          - (T_n+1)/(n+2) は一致推定量だが不偏ではない（反例）
          - 正解
        explanation: |
          **方針** 推定量 $\hat\theta_n$ の平均二乗誤差 $E[(\hat\theta_n-p)^2]=(\text{偏り})^2+\text{分散}$ が 0 に近づけば、チェビシェフ（マルコフ）の不等式から一致推定量になる。偏りと分散の極限を 1 つずつ調べる。

          **途中式**
          - $T_n/n$：偏り 0、分散 $p(1-p)/n\to0$。$P(|T_n/n-p|>\varepsilon)\le\dfrac{p(1-p)}{n\varepsilon^2}\to0$ なので一致推定量
          - $(T_n+1)/(n+2)$：期待値 $\dfrac{np+1}{n+2}\to p$、分散 $\dfrac{np(1-p)}{(n+2)^2}\to0$ なので、不偏ではないが一致推定量
          - $X_1$：$n$ によらず分布が変わらないので $p$ に確率収束しない（$0<p<1$ のとき）
          - $(T_n+n)/(2n)=\frac12\cdot\frac{T_n}{n}+\frac12\to\dfrac{1+p}{2}$ に確率収束するので、$p$ の一致推定量ではない

          **答え** 「$T_n/n$ は … 一致推定量であり、このことはチェビシェフの不等式から示せる」

          **間違えやすい点** 不偏性と一致性は別の性質である。不偏でも一致しない例（$X_1$）、不偏でなくても一致する例（$(T_n+1)/(n+2)$）がある。分散が 0 に近づくだけでは不十分で、偏りも 0 に近づく必要がある。

  - id: s21p03
    title: 自習室と学習スペース
    context: |
      図書館の自習室は 3 席とも利用中である。席 1・2・3 の残りの利用時間（分）は互いに独立に、平均がそれぞれ «m1»・«m2»・«m3» 分の指数分布に従う。
      いまから来た生徒は、最初に空いた席を使う。
    items:
      - id: s21p03a
        chapter: 6
        terms: [exponential-distribution, survival-function]
        topic: 平均の異なる3つの指数分布の最小値として最初に席が空くまでの待ち時間が一定時間を超える確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          生徒が «t» 分を超えて待つ確率に最も近い値はどれか。
          必要なら $e^{-0.25}=«e025»$、$e^{-0.5}=«e05»$、$e^{-0.75}=«e075»$、$e^{-1.5}=«e15»$ を使え。
        choices:
          - "$«ans»$"
          - "$«d_short»$"
          - "$«d_mid»$"
          - "$«d_cmp»$"
          - "$«d_max»$"
        answer: 0
        distractors:
          - 正解
          - 平均が最も短い席 1 だけを考えた
          - 平均 30 分の席 2 を代表として 1 席だけで考えた
          - 待ち時間が 15 分以下の確率（分布関数）を答えた
          - 最小値ではなく最大値（3 席すべてが空くまで）の上側確率を求めた
        explanation: |
          **方針** 待ち時間は $W=\min(X_1,X_2,X_3)$。$W>t$ は「3 席とも $t$ 分後もまだ使われている」ことなので、独立性から上側確率の積になる。

          **途中式**
          - 平均 $\mu$ の指数分布の上側確率は $P(X>t)=e^{-t/\mu}$
          - $P(W>t)=e^{-t/«m1»}e^{-t/«m2»}e^{-t/«m3»}=\exp\left\{-t\left(\frac1{«m1»}+\frac1{«m2»}+\frac1{«m3»}\right)\right\}=e^{-«rate»t}$
          - $W$ はレート «rate»（平均 «mean» 分）の指数分布に従う
          - $P(W>«t»)=e^{-«rate»\times«t»}=e^{-1.5}=«e15»$

          **答え** $«ans»$

          **間違えやすい点** レート（$1/\text{平均}$）を足すのであって、平均を足したり 1 席だけで考えたりしない（席 1 だけなら $e^{-0.75}=«d_short»$）。
          「3 席すべてが空くまで」と取り違えると $1-(1-«e075»)(1-«e05»)(1-«e025»)=1-«qprod»=«d_max»$ になる。

      - id: s21p03b
        chapter: 2
        terms: [probability-mass-and-density-function, cumulative-distribution-function, quantile-function]
        topic: 直線的に減る密度の正規化定数を決め分布関数を2次方程式で解いて学習スペースの利用時間の中央値を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          予約制の学習スペースでは、1 回の利用時間 $X$（時間）の密度関数が
          $$f(x)=c\,(«L»-x)\quad(0\le x\le «L»),\qquad f(x)=0\quad(\text{それ以外})$$
          であるとする（$c$ は定数）。$X$ の中央値を求めよ。
        answer: «med»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 全確率が 1 になるように $c$ を決め、分布関数 $F(x)$ を求めて $F(m)=1/2$ を解く。

          **途中式**
          - $\displaystyle\int_0^{«L»}(«L»-x)\,dx=«L2h»$ より $c=1/«cinv»$
          - $F(x)=\dfrac1{«cinv»}\displaystyle\int_0^{x}(«L»-u)\,du=\dfrac{«L»x-x^2/2}{«cinv»}\quad(0\le x\le«L»)$
          - $F(m)=\dfrac12$ より $«L»m-\dfrac{m^2}{2}=«L»$、すなわち $m^2-«twoL»m+«twoL»=0$
          - $m=«L»\pm\sqrt{16-8}=«L»\pm2\sqrt2=«L»\pm«sq»$。$0\le m\le«L»$ を満たすのは $m=«L»-«sq»=«med4»$

          **答え** $«med_s»$ 時間

          **間違えやすい点** 2 次方程式のもう 1 つの解 $«big»$ は範囲 $0\le x\le«L»$ の外なので捨てる。密度が右下がりなので、中央値は区間の中点 $«d_mid2»$ より小さく、平均 $E[X]=«L»/3\approx«xmean»$ とも異なる。

  - id: s21p04
    title: 図書館の貸出と蔵書点検
    context: |
      市立図書館の本館と分館の利用状況を分析する。
    items:
      - id: s21p04a
        chapter: 30
        terms: [kullback-leibler-divergence, expected-log-likelihood, model-selection]
        topic: 貸出件数の真のポアソン分布と想定したポアソン分布のカルバック・ライブラー情報量を求め向きによる非対称性を見る
        level: 応用
        definition: false
        type: numeric
        question: |
          分館の 1 時間あたりの貸出件数は、実際には平均 «l1» のポアソン分布 $P$ に従っているが、予測モデルでは平均 «l2» のポアソン分布 $Q$ を仮定している。
          真の分布 $P$ からみたモデル $Q$ のカルバック・ライブラー情報量
          $$D(P\,\|\,Q)=E_P\left[\log\frac{p(X)}{q(X)}\right]$$
          （$p,q$ はそれぞれの確率関数、対数は自然対数）を求めよ。必要なら $\log1.2=«ln12»$ を使え。
        answer: «kl»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ポアソン分布の確率関数 $p(x)=e^{-\lambda_1}\lambda_1^x/x!$、$q(x)=e^{-\lambda_2}\lambda_2^x/x!$ の比をとると $x!$ が消え、$X$ の 1 次式になる。その期待値を $P$ のもとでとる。

          **途中式**
          - $\log\dfrac{p(x)}{q(x)}=x\log\dfrac{\lambda_1}{\lambda_2}-\lambda_1+\lambda_2$
          - $E_P[X]=\lambda_1=«l1»$ なので $D(P\|Q)=\lambda_1\log\dfrac{\lambda_1}{\lambda_2}-\lambda_1+\lambda_2$
          - $=«l1»\times\log\dfrac{«l1»}{«l2»}-«l1»+«l2»=«l1»\times«ln12»-1=«t1»-1=«kl4»$

          **答え** $«kl_s»$

          **間違えやすい点** カルバック・ライブラー情報量は非対称で、期待値をどちらの分布でとるかで値が変わる。逆向きの $D(Q\|P)=«l2»\log\frac{«l2»}{«l1»}-«l2»+«l1»=-«t2»+1\approx«kl_rev»$ とは異なる。AIC は、真の分布からみたこの情報量（期待対数尤度）を小さくするモデルを選ぶ考え方に基づく。

      - id: s21p04b
        chapter: 12
        terms: [two-sample-proportion-test, proportion-test]
        topic: 本館と分館の延滞率が等しいかをプールした比率を使う2標本の比率の差のz検定で調べる
        level: 標準
        definition: false
        type: numeric
        question: |
          ある月に本館で貸し出した本から無作為に «n1» 件を選ぶと «x1» 件が延滞し、分館で貸し出した本から無作為に «n2» 件を選ぶと «x2» 件が延滞していた。
          2 館の延滞率が等しいという帰無仮説の検定で、**帰無仮説のもとでプールした比率**を使って標準誤差を求めた検定統計量 $z$ の値を求めよ。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 帰無仮説 $p_1=p_2$ のもとでは共通の延滞率を 2 館合わせた比率 $\hat p$ で推定し、$z=\dfrac{\hat p_1-\hat p_2}{\sqrt{\hat p(1-\hat p)(1/n_1+1/n_2)}}$ とする。

          **途中式**
          - $\hat p_1=«x1»/«n1»=«p1»$、$\hat p_2=«x2»/«n2»=«p2»$、差 $«dp»$
          - $\hat p=\dfrac{«x1»+«x2»}{«n1»+«n2»}=«pp»$
          - 分散：$«pp»\times«qq»\times\left(\dfrac1{«n1»}+\dfrac1{«n2»}\right)=«ppq»\times«inv»=«var0»$、標準誤差 $\sqrt{«var0»}=«se0»$
          - $z=«dp»/«se0»=«z4»\cdots$

          **答え** $«z_s»$（両側 5% の棄却点 1.96 を超えるので、延滞率に差があるといえる）

          **間違えやすい点** 2 館それぞれの比率で標準誤差 $\sqrt{\hat p_1(1-\hat p_1)/n_1+\hat p_2(1-\hat p_2)/n_2}=«se_u»$ を作ると $z=«z_u»$ になる。これは差の信頼区間（ワルド型）で使う標準誤差で、帰無仮説のもとでの検定統計量とは別物である。

      - id: s21p04c
        chapter: 21
        terms: [systematic-sampling, inclusion-probability, simple-random-sampling]
        topic: 蔵書目録から一定間隔で本を選ぶ系統抽出の抽出間隔と包含確率と周期性による偏りを読み取る
        level: 基本
        definition: true
        type: choice
        question: |
          本館の蔵書 «N» 冊の状態を点検するため、目録の通し番号を使って «ns» 冊を系統抽出する（開始番号を無作為に 1 つ選び、そこから一定の間隔で選ぶ）。正しい記述はどれか。
        choices:
          - '起こりうる標本は、単純無作為抽出と同じく $\binom{«N»}{«ns»}$ 通りある。'
          - どの本も選ばれる確率は等しいので、単純無作為抽出の分散の公式を使えば、1 つの標本から標本平均の分散を常に偏りなく推定できる。
          - 目録が書架ごとに並び、どの書架もちょうど «k» 冊で、書架の 1 番目が必ず大型本であっても、標本に偏りは生じない。
          - 目録の先頭に近い本ほど選ばれやすく、包含確率は本によって異なる。
          - '抽出間隔は «k» で、開始番号は 1〜«k» から無作為に選ぶ。どの本の包含確率も $1/«k»$ だが、2 冊が同時に選ばれる確率は本の組によって $0$ か $1/«k»$ になる。'
        answer: 4
        distractors:
          - 開始番号で標本が決まるので、起こりうる標本は 40 通りしかない
          - 2 冊が同時に選ばれる確率が単純無作為抽出と違うので、単純無作為抽出の分散の公式は一般には使えない
          - 間隔が書架の冊数と一致すると、開始番号 1 のとき大型本だけが選ばれるなど周期性による偏りが生じる
          - 開始番号を無作為に選べば、どの本も選ばれる確率は 1/40 で等しい
          - 正解
        explanation: |
          **方針** 系統抽出は「開始番号 1 つを無作為に選ぶ」だけの抽出である。抽出間隔は $k=N/n$、起こりうる標本は $k$ 通りで、それぞれ確率 $1/k$。

          **途中式**
          - 間隔：$«N»/«ns»=«k»$。開始番号 $r$ を 1〜«k» から等確率で選び、$r, r+«k», r+2\times«k»,\ldots$ を抽出する
          - 各本は «k» 通りの標本のうちちょうど 1 つに含まれるので、包含確率は $1/«k»$
          - 2 冊の番号の差が «k» の倍数なら同じ標本に入り（同時に選ばれる確率 $1/«k»$）、そうでなければ決して同時には選ばれない（確率 0）

          **答え** 「抽出間隔は «k» で…2 冊が同時に選ばれる確率は本の組によって 0 か $1/«k»$ になる」

          **間違えやすい点** 1 冊ごとの包含確率は単純無作為抽出と同じでも、2 冊が同時に選ばれる確率（2 次の包含確率）が違うので、推定量の分散は単純無作為抽出とは異なる。並び順に間隔と同じ周期があると、標本が大きく偏る。逆に、目録が無関係な順に並んでいれば、単純無作為抽出に近い精度になる。

  - id: s21p05
    title: 補習講座の効果
    context: |
      ある高校で、放課後の補習講座の受講と、模擬試験の結果を調べた。
    items:
      - id: s21p05a
        chapter: 9
        terms: [ci-two-sample-mean-difference, pooled-variance, t-distribution]
        topic: 受講者と非受講者の模試得点の平均の差の95%信頼区間を等分散を仮定したプールした分散のt区間で作る
        level: 標準
        definition: false
        type: choice
        question: |
          ある学年の受講者 «n1» 人の得点は平均 «m1» 点・不偏分散の平方根 «s1» 点、非受講者 «n2» 人の得点は平均 «m2» 点・不偏分散の平方根 «s2» 点だった。
          2 群の得点がそれぞれ等しい分散の正規分布に従うと仮定して、母平均の差（受講者−非受講者）の 95% 信頼区間を求める。最も近いものはどれか。
          必要なら $t_{0.025}(20)=«t20»$、$t_{0.025}(22)=«t22»$、標準正規分布の上側 2.5% 点 «z» を使え。
        choices:
          - "$(«z_l»,\\ «z_u»)$"
          - "$(«d22_l»,\\ «d22_u»)$"
          - "$(«ok_l»,\\ «ok_u»)$"
          - "$(«u_l»,\\ «u_u»)$"
          - "$(«w_l»,\\ «w_u»)$"
        answer: 2
        distractors:
          - t 分布ではなく標準正規分布の 1.96 を使った（0 を含まなくなる）
          - 自由度を n1+n2=22 とした
          - 正解
          - 等分散を仮定しているのに、プールせず s1²/n1+s2²/n2 で標準誤差を作った
          - 標準誤差を sp(1/n1+1/n2) とし、平方根をとり忘れた
        explanation: |
          **方針** プールした分散 $s_p^2=\dfrac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}$ を使うと、$\dfrac{(\bar x_1-\bar x_2)-(\mu_1-\mu_2)}{s_p\sqrt{1/n_1+1/n_2}}$ は自由度 $n_1+n_2-2$ の $t$ 分布に従う。

          **途中式**
          - $s_p^2=\dfrac{«n11»\times«v1»+«n21»\times«v2»}{«df»}=\dfrac{«ssum»}{«df»}=«sp2»$、$s_p=«sp»$
          - 標準誤差：$«sp»\times\sqrt{\dfrac1{«n1»}+\dfrac1{«n2»}}=«sp»\times«f»=«se»$
          - 半幅：$«t20»\times«se»=«h»$
          - 区間：$«d»\pm«h»$ より $(«ok_l»,\ «ok_u»)$

          **答え** $(«ok_l»,\ «ok_u»)$（0 を含むので、有意水準 5% で差があるとはいえない）

          **間違えやすい点** 自由度は $n_1+n_2-2=«df»$。標本が小さいので $t$ 分布の点を使い、1.96 を使うと区間が $(«z_l»,\ «z_u»)$ と狭くなって 0 を含まず、結論が変わってしまう。

      - id: s21p05b
        chapter: 28
        terms: [odds-ratio-interval, two-by-two-table, odds-and-odds-ratio]
        topic: 補習の受講と合格の2×2表から合格のオッズ比の95%信頼区間を対数オッズ比の標準誤差（ウルフの方法）で求める
        level: 標準
        definition: false
        type: choice
        question: |
          別の学年では、検定試験の合否について次の結果だった。

          | | 合格 | 不合格 |
          |---|---|---|
          | 受講 | «a» | «b» |
          | 非受講 | «c» | «dd» |

          受講者の非受講者に対する合格のオッズ比の 95% 信頼区間を、対数オッズ比の正規近似（ウルフの方法）で求める。最も近いものはどれか。
          必要なら $\log 2.25=«lnOR»$（自然対数）、$e^{«lo»}=«elo»$、$e^{«hi»}=«ehi»$、$e^{«lo2»}=«elo2»$、$e^{«hi2»}=«ehi2»$ を使え。
        choices:
          - "$(«lg_l»,\\ «lg_u»)$"
          - "$(«sy_l»,\\ «sy_u»)$"
          - "$(«sq_l»,\\ «sq_u»)$"
          - "$(«nl_l»,\\ «nl_u»)$"
          - "$(«ci_l»,\\ «ci_u»)$"
        answer: 4
        distractors:
          - 対数オッズ比の区間を指数変換し忘れた
          - オッズ比そのものに 1.96×OR×SE を足し引きする左右対称の区間にした
          - 対数オッズ比の分散 0.2431 を標準誤差と取り違えた（平方根をとり忘れた）
          - オッズ比 2.25 に対数尺度の標準誤差 0.4930 の 1.96 倍をそのまま足し引きした
          - 正解
        explanation: |
          **方針** 対数オッズ比 $\log\hat\psi$ の標準誤差は $\sqrt{1/a+1/b+1/c+1/d}$。対数の尺度で $\pm1.96\times$ 標準誤差の区間を作り、指数関数で戻す。

          **途中式**
          - $\hat\psi=\dfrac{«a»\times«dd»}{«b»\times«c»}=«OR»$、$\log\hat\psi=«lnOR»$
          - 分散：$\dfrac1{«a»}+\dfrac1{«b»}+\dfrac1{«c»}+\dfrac1{«dd»}=«v»$、標準誤差 $\sqrt{«v»}=«seL»$
          - 半幅：$1.96\times«seL»=«hL»$
          - 対数の尺度：$«lnOR»\pm«hL»$ より $(«lo»,\ «hi»)$
          - 戻す：$(e^{«lo»},\ e^{«hi»})=(«elo»,\ «ehi»)$

          **答え** $(«ci_l»,\ «ci_u»)$（1 を含むので、有意水準 5% で合格のしやすさに差があるとはいえない）

          **間違えやすい点** 区間はオッズ比 «OR» に対して左右非対称になる。オッズ比の尺度で直接 ±1.96×標準誤差 とすると、分布の歪みを無視することになる。対数の尺度の区間 $(«lg_l»,\ «lg_u»)$ をそのまま答えないこと。

  - id: s21p06
    title: 入試区分と1年次のGPA
    context: |
      ある大学で、1 年次の GPA $y$ を、共通テストの得点 $x$（100 点満点に換算）と入試区分のダミー変数 $D$（推薦入試 1、一般入試 0）で説明する回帰モデル
      $$y=\beta_0+\beta_1x+\beta_2D+\beta_3Dx+\varepsilon$$
      を最小二乗法で当てはめたところ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$、$\hat\beta_3=«b3»$ だった。
    items:
      - id: s21p06a
        chapter: 16
        terms: [interaction-term, dummy-variable, multiple-regression-model]
        topic: 入試区分ダミーと共通テスト得点の交互作用項を含む回帰で推薦入学者の傾きと区分間の予測値の差を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          共通テストの得点が «x» 点の学生について、推薦入学者の予測 GPA と一般入学者の予測 GPA の差（推薦−一般）と、推薦入学者における得点 1 点あたりの予測 GPA の増加量の組として正しいものはどれか。
        choices:
          - "差 «b2»、傾き «b1»"
          - "差 «diff»、傾き «slope»"
          - "差 «d_sign»、傾き «s_sign»"
          - "差 «diff»、傾き «b1»"
          - "差 «b2»、傾き «slope»"
        answer: 1
        distractors:
          - 交互作用項を無視し、ダミーの係数と x の係数をそのまま読んだ
          - 正解
          - 交互作用の係数の符号を取り違えた
          - 差は正しいが、推薦入学者の傾きに交互作用を足し忘れた
          - 傾きは正しいが、差にダミーの係数だけを使った（交互作用が x 点で効くことを忘れた）
        explanation: |
          **方針** $D=1$ と $D=0$ の式を別々に書くと、推薦入学者の式は切片 $\beta_0+\beta_2$、傾き $\beta_1+\beta_3$ の直線になる。2 つの直線の差は $\beta_2+\beta_3x$ で、$x$ によって変わる。

          **途中式**
          - 一般入試（$D=0$）：$\hat y=«b0»+«b1»x$。$x=«x»$ で $«g_gen»$
          - 推薦入試（$D=1$）：$\hat y=(«b0»+«b2»)+(«b1»+(«b3»))x=«b02»+«slope»x$。$x=«x»$ で $«g_rec»$
          - 差：$\hat\beta_2+\hat\beta_3\times«x»=«b2»+(«b3x»)=«diff»$
          - 推薦入学者の傾き：$«b1»+(«b3»)=«slope»$

          **答え** 差 «diff»、傾き «slope»

          **間違えやすい点** 交互作用項があるとき、ダミーの係数 $\hat\beta_2=«b2»$ は「$x=0$ のときの差」であり、得点が «x» 点の学生の差ではない。$\hat\beta_1$ は一般入学者だけの傾きである。

      - id: s21p06b
        chapter: 17
        terms: [residual-plot, heteroscedasticity, robust-standard-error]
        topic: 当てはめ値に対する残差プロットが漏斗型に広がるときの不均一分散の影響と対処を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルの残差を当てはめ値に対してプロットしたところ、残差は 0 の上下に対称に散らばっていたが、当てはめ値が大きいほど散らばりが大きくなる漏斗（じょうご）型だった。
          残差の正規 Q-Q プロットはほぼ直線上に並び、データは学生ごとに独立に集めたものである。正しい記述はどれか。
        choices:
          - 誤差の分散が一定でない（不均一分散）ため、最小二乗推定量は偏りをもつ。係数の推定値そのものが信頼できない。
          - 正規 Q-Q プロットが直線的なので、誤差分散が一定という仮定にも問題はない。
          - 漏斗型は誤差の系列相関を示すので、ダービン・ワトソン比で検定し、コクラン・オーカット法で当てはめ直すべきである。
          - 誤差分散が一定という仮定が疑われる。係数の最小二乗推定量は不偏のままだが、通常の標準誤差やそれに基づく t 検定は信頼できないので、頑健な標準誤差や重み付き最小二乗法を検討する。
          - 説明変数を追加して決定係数を高くすれば、漏斗型は必ず解消する。
        answer: 3
        distractors:
          - 不均一分散でも、誤差の期待値が 0 なら最小二乗推定量は不偏である
          - Q-Q プロットは正規性を見るもので、分散の一様性とは別の仮定である
          - 漏斗型は分散の大きさの変化であり、系列相関（時間順の残差の相関）ではない。学生ごとの独立なデータで系列相関は考えにくい
          - 正解
          - 決定係数を上げても誤差分散の形が変わるとは限らない
        explanation: |
          **方針** 残差プロットの漏斗型は、誤差の分散が当てはめ値とともに大きくなる不均一分散を示す。最小二乗推定量の不偏性は「誤差の期待値が 0」で決まり、分散が一定であることは不要である。一方、通常の標準誤差の公式は分散一定を前提にしている。

          **途中式**
          - 不偏性：$E[\hat\beta]=\beta+(X^\top X)^{-1}X^\top E[\varepsilon]=\beta$（分散の形によらない）
          - 分散：$V[\hat\beta]=(X^\top X)^{-1}X^\top\Sigma X(X^\top X)^{-1}$ は、$\Sigma=\sigma^2I$ のときだけ $\sigma^2(X^\top X)^{-1}$ になる
          - したがって通常の標準誤差は誤りうる → ホワイトの頑健な標準誤差や、分散に応じた重みの重み付き最小二乗法を使う。対数変換で分散がそろうこともある

          **答え** 「誤差分散が一定という仮定が疑われる。…頑健な標準誤差や重み付き最小二乗法を検討する」

          **間違えやすい点** 不均一分散の影響は「推定値の偏り」ではなく「標準誤差（推定の精度の評価）の誤り」と、最小二乗推定量が最良でなくなること。正規性・分散の一様性・独立性はそれぞれ別の診断で確かめる。

  - id: s21p07
    title: 学力調査の分析
    context: |
      ある県の学力調査の結果を分析する。
    items:
      - id: s21p07a
        chapter: 11
        terms: [z-test-known-variance, p-value, one-sided-two-sided-test]
        topic: 母標準偏差が既知の全国学力調査の得点で学校の平均が全国平均を上回るかをz検定の片側p値で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          全国の得点は平均 «mu0» 点・標準偏差 «sig» 点の正規分布に従うことがわかっている。ある学校の生徒 «n» 人の平均点は «xbar» 点だった。
          この学校の生徒の母平均が全国平均より高いかを、標準偏差は全国と同じ «sig» 点として片側検定する。p 値に最も近いものはどれか。
          必要なら $\Phi(0.3)=«phi03»$、$\Phi(0.72)=«phi072»$、$\Phi(1.8)=«phi18»$ を使え（$\Phi$ は標準正規分布の分布関数）。
        choices:
          - "$«d_sd»$"
          - "$«d_var»$"
          - "$«p»$"
          - "$«d_two»$"
          - "$«d_cmp»$"
        answer: 2
        distractors:
          - 標本平均の標準偏差ではなく、個人の標準偏差 15 で割った
          - 標準誤差の代わりに分散 σ²/n で割った
          - 正解
          - 片側検定なのに両側の p 値を答えた
          - 上側確率ではなく Φ(1.8) をそのまま答えた
        explanation: |
          **方針** 母標準偏差 $\sigma$ が既知なので、$z=\dfrac{\bar x-\mu_0}{\sigma/\sqrt n}$ は帰無仮説のもとで標準正規分布に従う。対立仮説は「高い」なので上側の片側 p 値を求める。

          **途中式**
          - 標準誤差：$«sig»/\sqrt{«n»}=«se»$
          - $z=(«xbar»-«mu0»)/«se»=«dx»/«se»=«z»$
          - p 値：$P(Z\ge«z»)=1-\Phi(«z»)=1-«phi18»=«p4»$

          **答え** $«p»$（有意水準 5% で、全国平均より高いといえる）

          **間違えやすい点** 標本平均のばらつきは $\sigma/\sqrt n$ で、個人のばらつき $\sigma$ ではない（$\sigma$ で割ると $z=«zsd»$、p 値 «d_sd»）。対立仮説が「高い」と向きを決めているので片側 p 値を使い、2 倍しない。

      - id: s21p07b
        chapter: 22
        terms: [pca-on-correlation-matrix, eigenvalue-and-eigenvector, contribution-ratio]
        topic: 2教科の相関行列の主成分分析で固有値1±rと和と差の固有ベクトルから寄与率と主成分の意味を読む
        level: 基本
        definition: false
        type: choice
        question: |
          国語と数学の得点の相関係数は «rho» だった。2 教科の得点の**相関行列**で主成分分析を行う。正しい記述はどれか。
        choices:
          - '第 1 主成分の寄与率は $«c_r»\%$ で、固有ベクトルの向きは相関係数の値によって変わる。'
          - '固有値は $«l1sq»$ と $«l2sq»$ である。'
          - '固有値は $«l1»$ と $«l2»$ で、第 1 主成分の寄与率は $«c_sq»\%$ である。'
          - '国語と数学の相関係数が $-«rho»$ であれば、第 1 主成分の寄与率は $20\%$ に下がる。'
          - '固有値は $«l1»$ と $«l2»$ で、第 1 主成分の寄与率は $«c1»\%$ である。第 2 主成分は 2 教科の標準化得点の差に比例し、どちらの教科が得意かを表す。'
        answer: 4
        distractors:
          - 寄与率は (1+r)/2=80%。2 変数の相関行列の固有ベクトルは r（正）によらず (1,1)/√2 と (1,−1)/√2
          - 固有値は 1±r で、1±r² ではない
          - 寄与率は 1.6/2=80% で、0.8 を 2 乗しない
          - 相関が負のときも固有値は 1.6 と 0.4 で寄与率は 80%（第 1 主成分が差の方向になる）
          - 正解
        explanation: |
          **方針** 相関行列 $R=\begin{pmatrix}1&r\\r&1\end{pmatrix}$ の固有方程式 $(1-\lambda)^2-r^2=0$ を解く。

          **途中式**
          - $\lambda=1\pm r$ より $\lambda_1=«l1»$、$\lambda_2=«l2»$（合計は変数の数 2）
          - $\lambda_1=1+r$ の固有ベクトルは $(1,1)/\sqrt2$、$\lambda_2=1-r$ の固有ベクトルは $(1,-1)/\sqrt2$（$r>0$ のとき）
          - 第 1 主成分の寄与率：$«l1»/2=«c1»\%$
          - 第 1 主成分は標準化得点の和（総合力）、第 2 主成分は差（国語と数学のどちらが得意か）に比例する

          **答え** 「固有値は «l1» と «l2» で、第 1 主成分の寄与率は «c1»% である。第 2 主成分は…差に比例し…」

          **間違えやすい点** 2 変数の相関行列では、固有ベクトルは $r$ の大きさによらず和と差の方向になり、固有値だけが $r$ で決まる。相関が負なら和と差の役割が入れ替わるだけで、寄与率は $(1+|r|)/2$ のままである。

  - id: s21p08
    title: 学習アプリの利用ログ
    context: |
      ある学習アプリの利用ログを分析する。
    items:
      - id: s21p08a
        chapter: 3
        terms: [skewness-kurtosis, moments]
        topic: 1日のログイン回数の離散分布から3次の中心モーメントと標準偏差で歪度を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある生徒の 1 日のログイン回数 $X$ の分布は次のとおりである。

          | $x$ | «x0» | «x1» | «x2» | «x3» |
          |---|---|---|---|---|
          | $P(X=x)$ | «p0» | «p1» | «p2» | «p3» |

          $X$ の歪度 $E[(X-\mu)^3]/\sigma^3$ に最も近い値はどれか。
        choices:
          - "$«d_m3»$"
          - "$«d_m2»$"
          - "$«d_raw»$"
          - "$«sk»$"
          - "$«d_4»$"
        answer: 3
        distractors:
          - 3 次の中心モーメントを σ³ で割り忘れた
          - σ³ ではなく分散 σ² で割った
          - 中心化せずに原点まわりの 3 次モーメント E[X³] を σ³ で割った
          - 正解
          - σ³ ではなく σ⁴ で割った
        explanation: |
          **方針** 平均 $\mu$、分散 $\sigma^2$、3 次の中心モーメント $E[(X-\mu)^3]$ を順に求め、$\sigma^3$ で割る。

          **途中式**
          - $\mu=«x0»\times«p0»+«x1»\times«p1»+«x2»\times«p2»+«x3»\times«p3»=«mu»$
          - 偏差 $x-\mu$：$«dv0»,\ «dv1»,\ «dv2»,\ «dv3»$
          - $\sigma^2=«sq0»+«sq1»+«sq2»+«sq3»=«m2»$、$\sigma=«sd»$
          - $E[(X-\mu)^3]=(«c0»)+(«c1»)+«c2»+«c3»=«m3»$
          - $\sigma^3=«m2»\times«sd»=«sd3»$、歪度 $=«m3»/«sd3»=«sk4»\cdots$

          **答え** $«sk»$（右に裾が長い分布）

          **間違えやすい点** 歪度は単位をもたないように $\sigma^3$ で割る。3 次の中心モーメント «d_m3» のままや、$\sigma^2$ で割った «d_m2» は誤り。中心化を忘れて $E[X^3]=«raw3»$ を使うと «d_raw» と大きくずれる。

      - id: s21p08b
        chapter: 5
        terms: [geometric-distribution, bernoulli-distribution]
        topic: 応用問題に正解するまでの挑戦回数の幾何分布で何回か失敗したあとの確率と期待回数を無記憶性から求める
        level: 標準
        definition: false
        type: choice
        question: |
          このアプリの「チャレンジ問題」には何度でも挑戦でき、ある生徒が各回に正解する確率は «p» で、各回の結果は独立とする。
          この生徒はすでに «past» 回続けて失敗した。これから «k» 回以内に正解する確率と、これからの挑戦回数（正解する回を含む）の期待値の組として正しいものはどれか。
        choices:
          - "確率 «within»、期待値 «d_tot» 回"
          - "確率 «d_all»、期待値 «ex» 回"
          - "確率 «within»、期待値 «d_fail» 回"
          - "確率 «d_exact»、期待値 «ex» 回"
          - "確率 «within»、期待値 «ex» 回"
        answer: 4
        distractors:
          - これまでの失敗 3 回を期待値に足した
          - 通算 5 回以内に正解する確率を求め、すでに失敗した条件を使わなかった
          - 期待値として正解までの失敗回数 (1−p)/p を答えた
          - ちょうど 2 回目で正解する確率 (1−p)p を答えた
          - 正解
        explanation: |
          **方針** 正解までの挑戦回数 $X$ は幾何分布 $P(X=x)=(1-p)^{x-1}p\ (x=1,2,\ldots)$ に従い、無記憶性 $P(X>s+t\mid X>s)=P(X>t)$ をもつ。すでに «past» 回失敗していても、これからの挑戦回数は最初から始めるのと同じ分布になる。

          **途中式**
          - $P(X>x)=(1-p)^x$
          - $P(X\le«past»+«k»\mid X>«past»)=1-\dfrac{(1-p)^{«past»+«k»}}{(1-p)^{«past»}}=1-(1-p)^{«k»}=1-«q»^{«k»}=1-«q2»=«within»$
          - これからの挑戦回数の期待値：$E[X]=1/p=1/«p»=«ex»$

          **答え** 確率 «within»、期待値 «ex» 回

          **間違えやすい点** 「何回も失敗したから次は当たりやすい」とは考えない（各回は独立）。条件を使わずに通算の確率 $1-«q»^{5}=«d_all»$ を求めるのは誤り。期待値に過去の失敗回数を足すと «d_tot» になってしまう。

  - id: s21p09
    title: 学習アプリのレベル変動
    context: |
      ある学習アプリでは、生徒のレベルを毎日 1 回のテストで判定する。レベルは「初級」「中級」「上級」の 3 つで、翌日のレベルは今日のレベルだけで決まるマルコフ連鎖に従う。

      | 今日＼翌日 | 初級 | 中級 | 上級 |
      |---|---|---|---|
      | 初級 | «p11» | «p12» | 0 |
      | 中級 | «p21» | «p22» | «p23» |
      | 上級 | 0 | «p32» | «p33» |
    items:
      - id: s21p09a
        chapter: 14
        terms: [stationary-distribution, detailed-balance, positive-recurrence]
        topic: 隣のレベルにだけ移る3状態の連鎖の定常分布を詳細つり合いで求め上級に戻るまでの平均日数（平均再帰時間）を出す
        level: 応用
        definition: false
        type: numeric
        question: |
          今日上級と判定された生徒について、次に上級と判定される日までの日数（翌日も上級なら 1 日）の期待値を求めよ。
        answer: «ret»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** この連鎖は既約で周期をもたない有限の連鎖なので、ただ 1 つの定常分布 $\pi$ をもち、状態 $i$ の平均再帰時間は $1/\pi_i$ である。隣の状態にだけ移る連鎖なので、詳細つり合いの式 $\pi_ip_{ij}=\pi_jp_{ji}$ で定常分布が求まる。

          **途中式**
          - 初級と中級：$\pi_1\times«p12»=\pi_2\times«p21»$ より $\pi_2=«r2»\pi_1$
          - 中級と上級：$\pi_2\times«p23»=\pi_3\times«p32»$ より $\pi_3=\dfrac{«p23»}{«p32»}\pi_2=«r3»\pi_1$
          - 合計 1：$\pi_1(1+«r2»+«r3»)=1$ より $\pi_1=1/«tot»=«pi1»$、$\pi_3=«r3»/«tot»=«pi3»$
          - 平均再帰時間：$1/\pi_3=«tot»/«r3»=«ret4»\cdots$

          **答え** $«ret_s»$ 日

          **間違えやすい点** 上級から下がる確率だけを見て $1/«p32»=«d_stay»$ などとしない。初級の平均再帰時間 $1/\pi_1=«d_pi1»$ と取り違えないこと。定常分布 $\pi_3=«pi3»$ は「長い期間のうち上級である日の割合」で、その逆数が戻るまでの平均日数になる。

  - id: s21p10
    title: 習熟判定テスト
    context: |
      学習アプリの単元の最後に «n» 問の確認テストを行い、«c» 問以上正解したら「習熟」と判定して次の単元に進ませる。各問の正誤は独立で、1 問の正答率は、まだ習熟していない生徒では «p0»、習熟した生徒では «p1» とする。
    items:
      - id: s21p10a
        chapter: 10
        terms: [type-i-and-ii-errors, rejection-region, binomial-distribution]
        topic: 5問中4問以上で合格とする習熟判定テストの第1種と第2種の誤りの確率を二項分布で求める
        level: 標準
        definition: false
        type: choice
        question: |
          帰無仮説を「まだ習熟していない（正答率 «p0»）」、対立仮説を「習熟した（正答率 «p1»）」とし、«c» 問以上の正解で帰無仮説を棄却する（習熟と判定する）検定とみなす。
          第 1 種の誤りの確率と第 2 種の誤りの確率の組として最も近いものはどれか。
          必要なら $0.6^4=«w64»$、$0.6^5=«w65»$、$0.9^4=«w94»$、$0.9^5=«w95»$ を使え。
        choices:
          - "第 1 種 «beta»、第 2 種 «alpha»"
          - "第 1 種 «alpha»、第 2 種 «beta»"
          - "第 1 種 «alpha»、第 2 種 «d_pow»"
          - "第 1 種 «d_1a»、第 2 種 «beta»"
          - "第 1 種 «d_ax»、第 2 種 «d_bx»"
        answer: 1
        distractors:
          - 第 1 種と第 2 種を取り違えた
          - 正解
          - 第 2 種の誤りの確率の代わりに検出力を答えた
          - 第 1 種の誤りの確率として、帰無仮説が正しいときに正しく受容する確率を答えた
          - 「4 問以上」の境界の 4 問を含め忘れ、5 問全問正解だけを合格とした
        explanation: |
          **方針** 正解数 $X$ は二項分布 $B(«n»,p)$ に従う。第 1 種の誤り＝帰無仮説が正しい（$p=«p0»$）のに棄却する確率 $P(X\ge«c»\mid p=«p0»)$、第 2 種の誤り＝対立仮説が正しい（$p=«p1»$）のに棄却しない確率 $P(X\le«c»-1\mid p=«p1»)$。

          **途中式**
          - $P(X=4\mid«p0»)=5\times«w64»\times«q0»=«a4»$、$P(X=5\mid«p0»)=«w65»$
          - 第 1 種：$«a4»+«a5»=«alpha5»$
          - $P(X=4\mid«p1»)=5\times«w94»\times«q1»=«b4»$、$P(X=5\mid«p1»)=«w95»$、検出力 $«b4»+«b5»=«power»$
          - 第 2 種：$1-«power»=«beta5»$

          **答え** 第 1 種 «alpha»、第 2 種 «beta»

          **間違えやすい点** 第 2 種の誤りの確率は「1−検出力」で、検出力 «d_pow» そのものではない。この判定では、まだ習熟していない生徒の約 3 人に 1 人が習熟と判定されてしまう。第 1 種の誤りを減らすには合格の基準を厳しくする（問題数を増やす）必要があり、そうすると第 2 種の誤りが増える。

  - id: s21p11
