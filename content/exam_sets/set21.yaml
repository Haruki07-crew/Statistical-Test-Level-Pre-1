          **間違えやすい点** プールするときは平方和と自由度の両方を誤差に合わせる。プールしない場合の $F=«d_nopool»$ と比べると、誤差の自由度が増え平均平方も小さくなっている。プールは交互作用が無視できると判断したときだけ行う。

      - id: s21p11b
        chapter: 31
        terms: [gamma-poisson-model, predictive-distribution, negative-binomial-distribution]
        topic: ポアソン・ガンマモデルの事後予測分布（負の二項分布）から次の授業で質問が0件となる確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          指導法 C を使う学級で、1 回の授業中に生徒から出る質問の数は平均 $\lambda$ のポアソン分布に従い、授業ごとに独立とする。$\lambda$ の事前分布を形状 «a0»・レート «b0» のガンマ分布（密度 $\propto\lambda^{2}e^{-\lambda}$、平均 «a0»）とする。
          «m» 回の授業で質問は合計 «tot» 件だった。次の 1 回の授業で質問が 1 件も出ない事後予測確率に最も近いものはどれか。
          必要なら $(6/7)^{12}=«v12»$、$(6/7)^{15}=«v15»$、$e^{-2.4}=«v24»$、$e^{-2.5}=«v25»$ を使え。
        choices:
          - "$«d_pm»$"
          - "$«d_mle»$"
          - "$«d_prior»$"
          - "$«d_data»$"
          - "$«ans»$"
        answer: 4
        distractors:
          - 事後平均 2.5 をλに代入して e^{-2.5} とした（λの不確かさを無視）
          - 最尤推定値 2.4 を代入した
          - データを使わず事前予測分布の (1/2)^3 を答えた
          - 事後分布の形状に事前の形状 3 を足し忘れた
          - 正解
        explanation: |
          **方針** ポアソン分布にガンマ事前分布は共役で、事後分布は形状 $a+\sum x$・レート $b+m$ のガンマ分布になる。次の観測が 0 件の確率を事後分布で平均する：$P(Y=0)=E[e^{-\lambda}]=\left(\dfrac{\text{レート}}{\text{レート}+1}\right)^{\text{形状}}$。

          **途中式**
          - 事後分布：形状 $«a0»+«tot»=«ash»$、レート $«b0»+«m»=«brt»$（事後平均 $«ash»/«brt»=«pm»$）
          - $P(Y=0)=\displaystyle\int_0^\infty e^{-\lambda}\,\frac{«brt»^{«ash»}\lambda^{«ash1»}e^{-«brt»\lambda}}{\Gamma(«ash»)}\,d\lambda=\left(\frac{«brt»}{«brt1»}\right)^{«ash»}=«v15»$

          **答え** $«ans»$（事後予測分布は負の二項分布）

          **間違えやすい点** 事後平均を代入した $e^{-«pm»}=«d_pm»$ は $\lambda$ の不確かさを無視しており、予測確率を小さく見積もる（$e^{-\lambda}$ は下に凸なので $E[e^{-\lambda}]\ge e^{-E[\lambda]}$）。最尤推定値 «mle» を代入した «d_mle» も同様。事後の形状は事前の形状と観測合計の和である。

  - id: s21p12
    title: 家庭学習時間の調査
    context: |
      ある高校で、生徒の 1 日あたりの家庭学習時間（時間）を調査した。家庭学習をまったくしない生徒（0 時間）も一定数いる。
    items:
      - id: s21p12a
        chapter: 18
        terms: [logistic-regression, logit-logistic-transformation, odds-and-odds-ratio]
        topic: 家庭学習をするかどうかのロジスティック回帰で予測確率と説明変数の限界効果βp(1−p)を求める
        level: 応用
        definition: false
        type: choice
        question: |
          家庭学習をするかどうか（1 日の家庭学習時間が 0 より大きいか）を、1 週間の通塾日数 $x$ などを説明変数とするロジスティック回帰 $\log\dfrac{p}{1-p}=x^\top\beta$ で分析した。$x$ の係数の推定値は «beta» で、ある属性の生徒では線形予測子 $x^\top\hat\beta$ が «eta» だった。
          この属性の生徒が家庭学習をする確率 $\hat p$ と、通塾日数についての限界効果 $\partial\hat p/\partial x$ の組として最も近いものはどれか。
          必要なら $e^{«eta»}=«e04»$ を使え。
        choices:
          - $\hat p=«pp»$、限界効果 «me»
          - $\hat p=«d_q»$、限界効果 «me»
          - $\hat p=«pp»$、限界効果 «d_b»
          - $\hat p=«pp»$、限界効果 «d_bp»
          - $\hat p=«pp»$、限界効果 «d_bq»
        answer: 0
        distractors:
          - 正解
          - 家庭学習をしない確率 1−p を答えた
          - 係数 β（対数オッズの変化）をそのまま確率の変化とした
          - 微分を βp とした（1−p を掛け忘れた）
          - 微分を β(1−p) とした（p を掛け忘れた）
        explanation: |
          **方針** $\hat p=\dfrac{e^{\eta}}{1+e^{\eta}}$（$\eta=x^\top\hat\beta$）。ロジスティック関数の微分は $\dfrac{dp}{d\eta}=p(1-p)$ なので、$\dfrac{\partial p}{\partial x}=\beta\,p(1-p)$。

          **途中式**
          - $\hat p=\dfrac{«e04»}{«e04p»}=«pp4»$、$1-\hat p=«qq4»$
          - 限界効果：$«beta»\times«pp4»\times«qq4»=«me4»$

          **答え** $\hat p=«pp»$、限界効果 «me»

          **間違えやすい点** 係数 «beta» は対数オッズの変化（オッズは $e^{«beta»}$ 倍）で、確率の変化ではない。確率の変化は $p$ によって変わり、$p=0.5$ のとき最大の $\beta/4$ になる。通塾日数を 1 日増やしたときの実際の確率の変化（$«e07»-«pp4»=«dexact»$）は、限界効果による近似とほぼ同じになる。

      - id: s21p12b
        chapter: 29
        terms: [single-imputation, missing-data-mechanism, complete-case-analysis]
        topic: 家庭学習時間の欠測を観測値の平均で単一代入したときの不偏分散の過小評価を求める
        level: 基本
        definition: false
