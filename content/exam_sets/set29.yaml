set: 29
title: 模擬試験 第29回
minutes: 90
problems:
  - id: s29p01
    title: 健康診断の検査
    context: |
      ある会社の健康診断で使う検査の性能と、測定の誤差を調べる。小問ごとに別の検査を扱う。
    items:
      - id: s29p01a
        chapter: 1
        terms: [bayes-theorem, conditional-probability, sensitivity-and-specificity]
        topic: 検査前確率10%の人に感度80%・特異度90%の検査が陽性だったときの検査後確率をオッズと陽性尤度比の積で求める
        level: 基本
        definition: false
        type: choice
        question: |
          問診の結果から、ある人が糖尿病である確率（検査前確率）は «pre» と見積もられた。感度 «sens»、特異度 «spec» の検査を行ったところ陽性だった。
          陽性尤度比 $\mathrm{LR}_+=\dfrac{\text{感度}}{1-\text{特異度}}$ を使って、検査後に糖尿病である確率を求めると、最も近いものはどれか。
        choices:
          - '$«post»$'
          - '$«w_sens»$'
          - '$«w_lrneg»$'
          - '$«w_mult»$'
          - '$«w_ppv50»$'
        answer: 0
        distractors:
          - 正解
          - 感度そのものを検査後確率とした
          - 陽性の結果なのに陰性尤度比（1−感度）/特異度を使った
          - 検査前確率に感度を掛けただけで、偽陽性を考えていない
          - 検査前確率を 0.5 とみなした
        explanation: |
          **方針** ベイズの定理はオッズで書くと「検査後オッズ = 検査前オッズ × 尤度比」。陽性の結果の尤度比は $\mathrm{LR}_+=$ 感度 /（1 − 特異度）。

          **途中式**
          - $\mathrm{LR}_+=«sens»/(1-«spec»)=«LR»$
          - 検査前オッズ $=«pre»/(1-«pre»)=«po0»$
          - 検査後オッズ $=«po0»\times«LR»=«po1»$、確率 $=«po1»/(1+«po1»)=«post4»$

          **答え** 約 $«post»$

          **間違えやすい点** 確率に尤度比をそのまま掛けてはいけない（オッズに掛ける）。検査前確率が低いと、性能の良い検査で陽性でも、検査後確率は半分程度にしかならない。
          検査を続けて行うときは、検査が条件付き独立なら、検査後オッズにさらに次の検査の尤度比を掛ければよい。
      - id: s29p01b
        chapter: 6
        terms: [normal-distribution, standard-normal-distribution, expectation-variance-properties]
        topic: 正規分布に従う体温計の誤差の絶対値（半正規分布）の期待値と誤差の絶対値が標準偏差を超える確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある体温計の測定値と真の体温の差（誤差、℃）は $N(0,\ «sg»^2)$ に従う。誤差の絶対値 $|X|$ の期待値と、$|X|>«sg»$ となる確率の組として正しいものはどれか。
          $\sqrt{2/\pi}=0.7979$、$\Phi(1)=0.8413$ とする。
        choices:
          - '$E|X|=«ea»$、$P(|X|>«sg»)=«pa»$'
          - '$E|X|=0$、$P(|X|>«sg»)=«pa»$'
          - '$E|X|=«sg»$、$P(|X|>«sg»)=«pa»$'
          - '$E|X|=«ea»$、$P(|X|>«sg»)=«w_one»$'
          - '$E|X|=«w_half»$、$P(|X|>«sg»)=«pa»$'
        answer: 0
        distractors:
          - 正解
          - E[X]=0 と E|X| を取り違えた
          - 絶対値の平均は標準偏差より小さい
          - 片側の確率だけを求めた
          - 標準偏差の半分とした
        explanation: |
          **方針** $|X|$ は半正規分布に従う。$E|X|=2\displaystyle\int_0^\infty x\frac{1}{\sqrt{2\pi}\sigma}e^{-x^2/(2\sigma^2)}dx=\sigma\sqrt{2/\pi}$。

          **途中式**
          - $E|X|=«sg»\times0.7979=«ea»$（℃）
          - $P(|X|>\sigma)=2\{1-\Phi(1)\}=2\times(1-0.8413)=«pa»$

          **答え** $E|X|=«ea»$、$P(|X|>«sg»)=«pa»$

          **間違えやすい点** 誤差の平均は 0 でも、誤差の大きさ（絶対値）の平均は $0.80\sigma$ になる。平均絶対偏差と標準偏差の比 $\sqrt{2/\pi}$ は、正規分布かどうかを見る目安にも使われる。
          $P(|X|>\sigma)$ は両側の確率で、約 3 分の 1 の測定で誤差が 1 標準偏差を超える。
  - id: s29p02
    title: 体格指標の関係
    context: |
      健康診断のデータで、体重 $W$（kg）、腹囲 $C$（cm）、体脂肪率 $F$（%）の関係を調べる。小問ごとに別の分析を扱う。
    items:
      - id: s29p02a
        chapter: 3
        terms: [correlation-matrix, variance-covariance-matrix, covariance-and-correlation]
        topic: 体重と腹囲と体脂肪率の分散共分散行列を各変数の標準偏差で割って相関行列に直し腹囲と体脂肪率の相関係数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          $(W,C,F)$ の分散共分散行列は
          $$\Sigma=\begin{pmatrix}«s11»&«s12»&«s13»\\«s12»&«s22»&«s23»\\«s13»&«s23»&«s33»\end{pmatrix}$$
          である。相関行列の、腹囲と体脂肪率の成分（相関係数）を求めよ。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 相関行列の成分は $r_{ij}=\sigma_{ij}/\sqrt{\sigma_{ii}\sigma_{jj}}$。対角成分（分散）の平方根で行と列を割る。

          **途中式** $r_{CF}=\dfrac{«s23»}{\sqrt{«s22»\times«s33»}}=\dfrac{«s23»}{«sd2»\times«sd3»}=«ans_s»$

          **答え** $«ans_s»$

          **間違えやすい点** 共分散 «s23» は単位（cm × %）に依存するので、ほかの組の共分散と大きさを比べられない。相関係数にそろえると、体重と腹囲 «r12»、体重と体脂肪率 «r13» と比べられる。
          行列で書くと $R=D^{-1/2}\Sigma D^{-1/2}$（$D$ は分散を並べた対角行列）。
      - id: s29p02b
        chapter: 16
        terms: [coefficient-of-determination, least-squares-method, covariance-and-correlation]
        topic: 目的変数の血圧の測定誤差で決定係数が信頼性の割合だけ小さくなることから測定の信頼性が0.8のときの決定係数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある集団で、真の収縮期血圧 $Y$ を腹囲で説明する単回帰の決定係数は «r2t» であることがわかっている。
          実際に測る血圧は $Y^*=Y+u$（測定誤差 $u$ は $Y$ とも腹囲とも独立で平均 0）で、測定の信頼性 $V[Y]/V[Y^*]$ は «rel» である。
          観測した血圧 $Y^*$ を腹囲に回帰したときの決定係数（母集団での値）を求めよ。
        answer: «ans2»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 目的変数だけに独立な誤差が加わると、傾きは変わらず（腹囲との共分散は同じ）、目的変数の分散だけが大きくなる。決定係数は「説明される分散 ÷ 目的変数の分散」なので、信頼性の割合だけ小さくなる。

          **途中式**
          - 説明される分散 $\beta^2V[X]=«r2t»V[Y]$ は変わらない
          - $R^{*2}=\dfrac{«r2t»V[Y]}{V[Y^*]}=«r2t»\times«rel»=«ans2_s»$

          **答え** $«ans2_s»$

          **間違えやすい点** 目的変数の測定誤差は傾きを偏らせない（推定の精度は下がる）。一方、説明変数の測定誤差は傾きを 0 の方へ偏らせる（減衰）。
          決定係数が小さいことは、関係が弱いことだけでなく、測定が粗いことでも起こる。
  - id: s29p03
    title: 禁煙後の再喫煙
    context: |
      禁煙外来を終えた人が再び喫煙するまでの時間 $T$（日）は、平均 «mean» 日の指数分布に従うとする。ただし、追跡の電話は 1 週間に 1 回なので、記録されるのは「何週目に再喫煙したか」だけである。
    items:
      - id: s29p03a
        chapter: 4
        terms: [change-of-variables, exponential-distribution, geometric-distribution]
        topic: 指数分布に従う再喫煙までの日数を週単位に切り捨てた値が幾何分布に従うことを変数変換で示し再喫煙までの満了した週数の期待値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          満了した週の数 $K=\lfloor T/7\rfloor$（$K=0,1,2,\ldots$）の分布と期待値の組として正しいものはどれか。必要なら $e^{-0.35}=«e035»$ を使え。
        choices:
          - '$P(K=k)=(1-q)q^k$（$q=e^{-0.35}=«e035»$）の幾何分布で、$E[K]=«EK»$'
          - '平均 $«mean»/7=«w_div»$ のポアソン分布で、$E[K]=«w_div»$'
          - '$P(K=k)=(1-q)q^k$（$q=«e035»$）の幾何分布で、$E[K]=«w_inv»$'
          - '平均 $«w_div»$ 週の指数分布で、$E[K]=«w_div»$'
          - '$P(K=k)=q(1-q)^k$（$q=«e035»$）の幾何分布で、$E[K]=«w_swap»$'
        answer: 0
        distractors:
          - 正解
          - 切り捨てた週数は連続分布でもポアソン分布でもない
          - 失敗の回数ではなく試行の回数の期待値 1/(1−q) を答えた
          - 切り捨てると離散分布になる
          - 「その週を生き残る確率」q と「その週に再喫煙する確率」1−q を取り違えた
        explanation: |
          **方針** $P(K=k)=P(7k\le T<7(k+1))$ を指数分布の生存関数 $e^{-t/«mean»}$ で計算する。

          **途中式**
          $$P(K=k)=e^{-7k/«mean»}-e^{-7(k+1)/«mean»}=(1-q)q^k,\qquad q=e^{-7/«mean»}=e^{-0.35}=«e035»$$
          これは成功確率 $1-q=«p»$ の幾何分布（失敗の回数を数える流儀）で
          $$E[K]=\frac{q}{1-q}=\frac{«e035»}{«p»}=«EK4»$$

          **答え** 幾何分布で $E[K]=«EK»$

          **間違えやすい点** 指数分布の無記憶性に対応して、幾何分布も無記憶性をもつ。週単位の記録から平均を推定するときは、$E[T]/7=«w_div»$ と $E[K]$ のずれ（切り捨てによる約 0.5 週）に注意する。
  - id: s29p04
    title: 家族内の高血圧
    context: |
      4 人家族の中で高血圧の人の数 $X$ を考える。家族は食習慣や遺伝を共有するので、家族ごとに高血圧になる確率 $\theta$ が異なり、$\theta$ は平均 0.25 のベータ分布 $\mathrm{Beta}(1,3)$ に従い、$\theta$ が与えられたもとで 4 人は独立に確率 $\theta$ で高血圧になるとする（ベータ二項分布）。
    items:
      - id: s29p04a
        chapter: 5
        terms: [binomial-distribution, beta-distribution, conditional-variance]
        topic: 家族ごとに確率がベータ分布でばらつくベータ二項分布で家族に高血圧の人がいない確率と人数の分散を求め確率が一定の二項分布と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          家族に高血圧の人が 1 人もいない確率 $P(X=0)$ と、$X$ の分散の組として正しいものはどれか。$\theta$ が全家族で 0.25 に固定された二項分布 $B(4,\ 0.25)$ と比べた記述も含めて選べ。
        choices:
          - '$P(X=0)=«p0»$、$V[X]=«v»$。二項分布（$P(X=0)=«bp0»$、分散 «bv»）より 0 人の家族が多く、人数のばらつきも大きい'
          - '$P(X=0)=«bp0»$、$V[X]=«bv»$。平均の確率が同じなので二項分布と同じになる'
          - '$P(X=0)=«p0»$、$V[X]=«bv»$。0 人の確率は増えるが、分散は二項分布と同じ'
          - '$P(X=0)=«w_p0»$、$V[X]=«v»$'
          - '$P(X=0)=«p0»$、$V[X]=«w_v»$。確率がばらつくと分散は二項分布より小さくなる'
        answer: 0
        distractors:
          - 正解
          - 確率のばらつきを無視した
          - 全分散の公式で、条件付き期待値の分散の分が加わる
          - 1 人が高血圧でない確率 1−E[θ] を 4 人分掛け合わせていない
          - 確率がばらつくと分散は大きくなる（過分散）
        explanation: |
          **方針** $P(X=0)=E[(1-\theta)^4]$。$\mathrm{Beta}(1,3)$ の密度 $3(1-\theta)^2$ で積分する。分散は全分散の公式 $V[X]=E[V[X\mid\theta]]+V[E[X\mid\theta]]$。

          **途中式**
          - $P(X=0)=\displaystyle\int_0^1(1-\theta)^4\cdot3(1-\theta)^2d\theta=\frac37=«p04»$
          - $E[\theta]=0.25$、$V[\theta]=\dfrac{1\times3}{4^2\times5}=0.0375$、$E[\theta^2]=0.1$
          - $E[V[X\mid\theta]]=4(E[\theta]-E[\theta^2])=4\times0.15=0.6$、$V[E[X\mid\theta]]=16\times0.0375=0.6$、$V[X]=«v»$
          - 二項分布 $B(4,0.25)$：$P(X=0)=0.75^4=«bp0»$、分散 $4\times0.25\times0.75=«bv»$

          **答え** $P(X=0)=«p0»$、$V[X]=«v»$

          **間違えやすい点** 家族の中で結果が似る（級内相関 $\rho=1/(1+3+1)=0.2$ がある）と、分散は二項分布の $1+(n-1)\rho=1.6$ 倍になる。0 人の家族と多人数の家族がともに増える。
  - id: s29p05
    title: 同じ人の繰り返し測定
    context: |
      家庭血圧のように、同じ人を何度も測るときの推定の性質を考える。小問ごとに別の状況を扱う。
    items:
      - id: s29p05a
        chapter: 7
        terms: [weak-law-of-large-numbers, convergence-in-probability, covariance-and-correlation]
        topic: 同じ人の血圧の測定値どうしに一定の相関があると測定回数を増やしても平均の分散が0にならず大数の法則が成り立たないことを分散の式から確かめる
        level: 標準
        definition: false
        type: numeric
        question: |
          ある人の朝の血圧を «n» 日測る。各日の測定値の分散は «s2»（mmHg²）で、どの 2 日の測定値の相関係数も «rho» である（体調の長い波を共有するため）。
          «n» 日の平均値の標準偏差（mmHg）を求めよ。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $V\left[\dfrac1n\sum X_i\right]=\dfrac{1}{n^2}\left\{\sum V[X_i]+\sum_{i\ne j}\mathrm{Cov}(X_i,X_j)\right\}=\dfrac{\sigma^2\{1+(n-1)\rho\}}{n}$。

          **途中式**
          $$V[\bar X]=\frac{«s2»\times(1+«n1»\times«rho»)}{«n»}=«v»,\qquad\sqrt{«v»}=«ans4»$$

          **答え** $«ans_s»$ mmHg

          **間違えやすい点** 相関を無視すると $\sqrt{«s2»/«n»}=«w_ind»$ で、ばらつきを小さく見積もる。$n\to\infty$ でも $V[\bar X]\to\rho\sigma^2=«lim»$ で 0 にならない（標準偏差 «limsd»）ので、大数の法則（平均の確率収束）は成り立たない。
          独立性（または相関が十分速く弱まること）が大数の法則の前提である。
      - id: s29p05b
        chapter: 8
        terms: [cramer-rao-inequality, unbiased-estimator, mean-squared-error]
        topic: 正規分布の分散の不偏分散とクラメール・ラオの下限と最尤推定量の平均二乗誤差を比べ下限を下回る推定量があっても矛盾しない理由を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          ある測定値は $N(\mu,\sigma^2)$（$\mu$ も $\sigma^2$ も未知）に従い、$n=«m»$ 個の独立な測定値から $\sigma^2$ を推定する。
          不偏分散 $s^2$ の分散、$\sigma^2$ の不偏推定量に対するクラメール・ラオの下限、最尤推定量 $\hat\sigma^2=\frac{n-1}{n}s^2$ の平均二乗誤差（いずれも $\sigma^4$ を単位とする）について、正しい記述はどれか。
        choices:
          - '$V[s^2]=«vs2»$、下限 $«cr»$、最尤推定量の平均二乗誤差 «mse»。最尤推定量は下限を下回るが、偏りがあるので下限の対象ではなく、矛盾しない'
          - '$V[s^2]=«vs2»$、下限 $«cr»$。$s^2$ は下限を達成するので有効推定量である'
          - '$V[s^2]=«cr»$、下限 $«cr»$、最尤推定量の平均二乗誤差 «mse»。最尤推定量が下限を下回るのは計算の誤りである'
          - '$V[s^2]=«vs2»$、下限 $«cr»$、最尤推定量の平均二乗誤差 «w_mse»'
          - '$V[s^2]=«vs2»$、下限 $«cr»$。下限より分散の小さい推定量は、偏りがあってもなくても存在しない'
        answer: 0
        distractors:
          - 正解
          - 2/(n−1) は 2/n より大きく、s² は下限を達成しない（漸近的には達成する）
          - V[s²]=2σ⁴/(n−1)
          - 偏りの 2 乗を入れ忘れた（分散だけ）
          - 下限は不偏推定量についての限界で、偏りを許せば平均二乗誤差はもっと小さくできる
        explanation: |
          **方針** $(n-1)s^2/\sigma^2\sim\chi^2_{n-1}$ より $V[s^2]=2\sigma^4/(n-1)$。$\sigma^2$ についてのフィッシャー情報量は 1 個あたり $1/(2\sigma^4)$ なので、下限は $2\sigma^4/n$。最尤推定量の平均二乗誤差は分散と偏りの 2 乗の和。

          **途中式**
          - $V[s^2]=2/«m1»=«vs2»$、下限 $2/«m»=«cr»$
          - $\hat\sigma^2$：分散 $\left(\frac{«m1»}{«m»}\right)^2\times\frac{2}{«m1»}=«vm»$、偏り $-\sigma^2/«m»$ の 2 乗 $«b2»$、平均二乗誤差 $«vm»+«b2»=«mse»$（$=(2n-1)/n^2$）

          **答え** 最尤推定量は下限を下回るが、偏りがあるので矛盾しない

          **間違えやすい点** クラメール・ラオの下限は「不偏推定量の分散」の下限で、偏りのある推定量の平均二乗誤差には当てはまらない。$s^2$ は下限を達成しない（有効推定量ではない）が、$\mu$ が未知のときの一様最小分散不偏推定量である。
  - id: s29p06
    title: まれな有害事象の発生率
    context: |
      ある新しいサプリメントの販売後調査で、1 年間に重い有害事象が $X=4$ 件報告された。件数は平均 $\lambda$ のポアソン分布に従うとする。
    items:
      - id: s29p06a
        chapter: 9
        terms: [likelihood-based-confidence-interval, confidence-interval, likelihood-ratio-test]
        topic: 4件の有害事象の件数から尤度比統計量が3.84以下となるλの範囲として尤度にもとづく95%信頼区間を表から読み取りワルド型や正確な区間と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          尤度比統計量 $G(\lambda)=2\{X\log(X/\lambda)-X+\lambda\}$ が自由度 1 のカイ二乗分布の上側 5% 点 3.84 以下となる $\lambda$ の集合を、尤度にもとづく 95% 信頼区間とする。$G(\lambda)$ の値は次のとおり。

          | $\lambda$ | 1.00 | 1.25 | 1.50 | 9.0 | 9.4 | 10.0 |
          |---|---|---|---|---|---|---|
          | $G(\lambda)$ | «g100» | «g125» | «g150» | «g900» | «g940» | «g1000» |

          区間に最も近いものと、ほかの区間との関係の組として正しいものはどれか。
        choices:
          - '約 $(1.2,\ 9.3)$。ワルド型 $4\pm1.96\times2=(0.08,\ 7.92)$ より右にずれ、ポアソン分布の右に長い形を反映する'
          - '約 $(0.08,\ 7.92)$。尤度にもとづく区間はワルド型と一致する'
          - '約 $(1.5,\ 9.0)$。$G$ が 3.84 を超える $\lambda$ の集合が区間である'
          - '約 $(1.2,\ 9.3)$。区間は推定値 4 について左右対称である'
          - '約 $(1.0,\ 10.0)$。表の端の値がそのまま区間になる'
        answer: 0
        distractors:
          - 正解
          - 尤度の形は非対称で、ワルド型の区間とは一致しない
          - 3.84 以下の λ が区間（1.5 と 9.0 は内側の点）
          - 4−1.2=2.8、9.3−4=5.3 で非対称
          - G(1.0)=5.09 と G(10.0)=4.67 は 3.84 を超えるので外側
        explanation: |
          **方針** 尤度比統計量が 3.84 以下の $\lambda$ は、有意水準 5% の尤度比検定で棄却されない値。その集合が信頼区間になる（検定と区間の対応）。

          **途中式**
          - 下側：$G(1.00)=«g100»>3.84$、$G(1.25)=«g125»<3.84$ なので下限は 1.00 と 1.25 の間で 1.25 に近い（約 1.24）
          - 上側：$G(9.0)=«g900»<3.84$、$G(9.4)=«g940»>3.84$ なので上限は約 9.3
          - ワルド型：$\hat\lambda\pm1.96\sqrt{\hat\lambda}=4\pm3.92=(0.08,\ 7.92)$

          **答え** 約 $(1.2,\ 9.3)$

          **間違えやすい点** 件数が少ないとき、ワルド型の区間は左右対称で下限が 0 に近づきすぎ、上限は小さすぎる。尤度にもとづく区間は、正確な区間 $(1.09,\ 10.24)$ に近く、変数変換をしても形が変わらない利点がある。
  - id: s29p07
    title: 新しい減塩指導の評価
    context: |
      ある保健センターが、新しい減塩指導の効果を、従来の指導と比べて評価する。小問ごとに別の評価を扱う。
    items:
      - id: s29p07a
        chapter: 10
        terms: [null-and-alternative-hypothesis, one-sided-two-sided-test, power-function]
        topic: 新しい指導が従来より血圧を下げる効果で3mmHgより劣らないことを示す非劣性検定の帰無仮説を立てz統計量で判定し優越性の検定と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          新しい指導は手間が少ないので、効果が従来の指導より「大きく劣らなければ」採用したい。血圧の低下量の平均の差（新 − 従来）の推定値は «d» mmHg、標準誤差は «se» mmHg だった（正規近似）。
          非劣性の許容幅を «Delta» mmHg とし、有意水準は片側 2.5%（1.96）とする。正しい記述はどれか。
        choices:
          - '帰無仮説「差 $\le-«Delta»$」に対し $z=(«d»+«Delta»)/«se»=«z»>1.96$ で棄却し、非劣性が示された。ただし優越性（差 $>0$）は示されていない'
          - '帰無仮説「差 $=0$」に対し $z=«d»/«se»=«zs»$ で棄却されないので、新しい指導は従来と同等である'
          - '帰無仮説「差 $\ge-«Delta»$」に対し $z=«z»$ で棄却し、新しい指導は劣っていることが示された'
          - '差の推定値が負なので、新しい指導は劣っており、非劣性は示せない'
          - '帰無仮説「差 $\le-«Delta»$」に対し $z=(«d»-«Delta»)/«se»=«w_z»$ で棄却されない'
        answer: 0
        distractors:
          - 正解
          - 差が有意でないことは同等の証明にならない（非劣性は許容幅を使って検定する）
          - 示したいこと（劣らない）を対立仮説に置く
          - 推定値が負でも、許容幅の範囲内なら非劣性は示せる
          - 許容幅は足す（差 + Δ）
        explanation: |
          **方針** 示したい「劣っていない（差 $>-\Delta$）」を対立仮説、その否定「差 $\le-\Delta$」を帰無仮説に置く。統計量は $(\hat d+\Delta)/\mathrm{SE}$。

          **途中式** $z=\dfrac{«d»+«Delta»}{«se»}=\dfrac{«dD»}{«se»}=«z»>1.96$ なので棄却し、非劣性を結論する。
          優越性の検定（帰無仮説「差 $\le0$」）では $z=«zs»$ で、優越は示されない。

          **答え** 非劣性は示されたが、優越性は示されていない

          **間違えやすい点** 許容幅 $\Delta$ は、データを見る前に臨床的な根拠で決めておく。片側 2.5% の非劣性検定は、差の 95% 信頼区間の下限 $«d»-1.96\times«se»=«lo»$ が $-«Delta»$ より上にあるかで判断するのと同じである。
      - id: s29p07b
        chapter: 11
        terms: [hotelling-t2, two-sample-t-test, multivariate-normal-distribution]
        topic: 収縮期と拡張期の血圧の低下量の平均ベクトルの差を2標本のホテリングのT2で検定し1変数ずつのt検定では有意にならない差が検出されることを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          別の研究で、指導 A・B を各 «n» 人に行い、収縮期と拡張期の血圧の低下量の平均ベクトルの差（A − B）は $\boldsymbol d=(«d1»,\ «d2»)$ だった。プールした分散共分散行列は
          $$S=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
          である。2 標本のホテリングの $T^2=\dfrac{n_1n_2}{n_1+n_2}\boldsymbol d^\top S^{-1}\boldsymbol d$ を $F=\dfrac{n_1+n_2-p-1}{p(n_1+n_2-2)}T^2$（$p=2$、自由度 $(2,\ 37)$）に直して検定する。$F_{0.05}(2,37)=3.25$、$t_{0.025}(38)=2.024$ とする。正しい記述はどれか。
        choices:
          - '$T^2=«T2»$、$F=«F»$ で有意。1 変数ずつの $t$ は «t1» と «t2» でどちらも有意でないが、2 つの差の組み合わせ（正の相関に逆らう向き）は珍しい'
          - '$T^2=«T2»$、$F=«F»$ で有意。1 変数ずつの $t$ も両方とも有意である'
          - '1 変数ずつの $t$ がどちらも有意でないので、多変量の検定も必ず有意でない'
          - '$T^2=«w_T2»$（相関を無視して 2 つの $t^2$ を足した）で、有意でない'
          - '$T^2=«T2»$ を自由度 2 のカイ二乗分布の点 5.99 と比べて有意である'
        answer: 0
        distractors:
          - 正解
          - 1 変数の t は 1.26 と 1.19 で 2.024 を下回る
          - 多変量では、相関を考えた組み合わせで差が検出されることがある
          - 相関を考えると T² は大きくなる（逆向きの差は相関に反する）
          - 小標本では F に直して比べる（カイ二乗近似は大標本のとき）
        explanation: |
          **方針** $S^{-1}=\dfrac{1}{«det»}\begin{pmatrix}«s22»&-«s12»\\-«s12»&«s11»\end{pmatrix}$ を使って二次形式を計算する。

          **途中式**
          - $\boldsymbol d^\top S^{-1}\boldsymbol d=\dfrac{«s22»\times«d1»^2-2\times«s12»\times«d1»\times(«d2»)+«s11»\times(«d2»)^2}{«det»}=«q»$
          - $T^2=10\times«q»=«T2»$、$F=\dfrac{37}{2\times38}\times«T2»=«F»>3.25$
          - 1 変数：$«d1»/\sqrt{«s11»\times0.1}=«t1»$、$«d2s»/\sqrt{«s22»\times0.1}=«t2»$

          **答え** 多変量の検定は有意、1 変数ずつでは有意でない

          **間違えやすい点** 収縮期と拡張期は正の相関（0.6）をもつので、「収縮期の低下は A の方が大きいのに、拡張期の低下は B の方が大きい」という逆向きの差の組み合わせは、偶然では起こりにくい。1 変数ずつの検定を並べると、このような情報を見落とす。
  - id: s29p08
    title: 睡眠時間の比較
    context: |
      夜勤のある職場とない職場で、従業員の平日の睡眠時間を比べる。
    items:
      - id: s29p08a
        chapter: 13
        terms: [median-test, nonparametric-methods-overview, independence-test]
        topic: 2つの職場の睡眠時間を全体の中央値より長いか短いかの2×2表にまとめメディアン検定の統計量を求めて分布の位置の違いを判定する
        level: 基本
        definition: false
        type: choice
        question: |
          夜勤のある職場の 20 人と、ない職場の 20 人の睡眠時間をまとめた 40 人の中央値を求め、各人が中央値より長いか短いかを数えた（中央値に一致する人はいない）。

          | | 中央値より長い | 中央値より短い |
          |---|---|---|
          | 夜勤あり | «a» | «b» |
          | 夜勤なし | «c» | «d» |

          この 2×2 表のピアソンのカイ二乗統計量（メディアン検定の統計量）と、有意水準 5% での判定の組として正しいものはどれか（自由度 1 の上側 5% 点は 3.84）。
        choices:
          - '$X^2=«X2»$ で 3.84 を上回り、2 つの職場で睡眠時間の分布の位置が違う'
          - '$X^2=«X2»$ で 3.84 を上回り、夜勤のある職場では睡眠時間の平均が 1 時間短い'
          - '$X^2=«w_half»$ で 3.84 を下回り、違うとはいえない'
          - '$X^2=«X2»$ で、自由度 3 の点 7.81 を下回るので、違うとはいえない'
          - '睡眠時間の値そのものを使っていないので、検定はできない'
        answer: 0
        distractors:
          - 正解
          - メディアン検定は位置の違いを調べるもので、平均の差の大きさは分からない
          - 期待度数ではなく、セルの数で割った（計算の誤り）
          - 2×2 表の自由度は 1
          - 中央値より上か下かだけを使う検定として成り立つ（外れ値に強い）
        explanation: |
          **方針** 帰無仮説（2 つの職場の分布が同じ）のもとでは、どちらの職場でも中央値より長い人の割合は 1/2。期待度数はすべて 10。

          **途中式**
          $$X^2=\sum\frac{(O-E)^2}{E}=\frac{(«a»-10)^2+(«b»-10)^2+(«c»-10)^2+(«d»-10)^2}{10}=«X2»$$

          **答え** $X^2=«X2»$ で、分布の位置が違う

          **間違えやすい点** メディアン検定は値の大小（中央値の上か下か）だけを使うので、外れ値の影響を受けにくいが、順位を使うウィルコクソンの順位和検定より検出力は低い。
  - id: s29p09
    title: 減量プログラムの体重の動き
    context: |
      減量プログラムの参加者の体重の目標からのずれ $S_t$（kg）は、毎週、等しい確率で 1 kg 増えるか 1 kg 減るかのどちらかで、週ごとに独立とする（対称なランダムウォーク）。始めは $S_0=0$ である。
    items:
      - id: s29p09a
        chapter: 15
        terms: [martingale, random-walk, gambler-ruin-problem]
        topic: 対称なランダムウォークがマルチンゲールであることと任意抽出定理から体重のずれが−2kgに達する前に+3kgに達する確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ずれが $+3$ kg（指導を強める）か $-2$ kg（目標達成）のどちらかに初めて達したところで判定する。$+3$ に先に達する確率と、その求め方の組として正しいものはどれか。
        choices:
          - '«p»。$S_t$ はマルチンゲールなので、止めた時点の期待値も 0 で、$3p+(-2)(1-p)=0$ を解く'
          - '0.5。増える確率と減る確率が等しいので、どちらに先に達する確率も等しい'
          - '«w_swap»。$3p+(-2)(1-p)=0$ を解くと、$-2$ に先に達する確率がこの値'
          - '«p»。$S_t^2$ がマルチンゲールなので、$9p+4(1-p)=0$ を解く'
          - '«w_ratio»。目標までの距離の比 3:2 で決まる'
        answer: 0
        distractors:
          - 正解
          - 境界までの距離が違うので 1/2 にはならない
          - +3 に先に達する確率と −2 に先に達する確率を取り違えた
          - S_t² はマルチンゲールではない（S_t²−t がマルチンゲール）
          - 遠い境界ほど先に達しにくい（確率は距離の逆の比）
        explanation: |
          **方針** 公平なゲームでは $E[S_{t+1}\mid S_0,\ldots,S_t]=S_t$（マルチンゲール）。止めるまでの時間が有限で $S_t$ が有界なら、任意抽出定理により止めた時点 $\tau$ の期待値も $E[S_\tau]=S_0=0$。

          **途中式** $+3$ に先に達する確率を $p$ とすると
          $$E[S_\tau]=3p+(-2)(1-p)=0\ \Rightarrow\ 5p=2\ \Rightarrow\ p=«p»$$

          **答え** «p»

          **間違えやすい点** 近い方の境界（−2）に先に達しやすい。これは破産問題で、所持金 2 から始めて 5 に達する確率 $2/5$ と同じ計算である。
          さらに $S_t^2-t$ もマルチンゲールなので、$E[\tau]=E[S_\tau^2]=9p+4(1-p)=6$（週）も求められる。
  - id: s29p10
    title: 健康状態の回帰モデル
    context: |
      健康診断のデータに回帰モデルを当てはめる。小問ごとに別のモデルを扱う。
    items:
      - id: s29p10a
        chapter: 17
        terms: [normal-qq-plot, residual, normal-distribution]
        topic: 回帰の残差の正規QQプロットで両端が直線の上側に曲がるパターンから残差の分布が右に歪んでいることを読み取る
        level: 基本
        definition: true
        type: choice
        question: |
          中性脂肪の値をそのまま目的変数にした回帰の残差について、横軸に標準正規分布の理論分位点、縦軸に残差の標本分位点をとった正規 QQ プロットを描いた。
          点は、左端では直線より上、中央では直線にほぼ沿い、右端では直線より大きく上に外れて、全体として下に凸な曲線になった。この読み取りとして最も適切なものはどれか。
        choices:
          - '残差の分布は右に歪んでいる（右の裾が長い）。目的変数を対数変換するなどを検討する'
          - '残差の分布は左に歪んでいる（左の裾が長い）'
          - '残差の分布は正規分布より裾が軽い（両裾が短い）'
          - '残差の分散が説明変数によって変わっている（不均一分散）'
          - '点が直線から外れるのは標本の大きさのためで、分布の形については何もわからない'
        answer: 0
        distractors:
          - 正解
          - 左に歪んでいれば上に凸な曲線になる
          - 裾が軽いと、左端は直線より上、右端は直線より下（S 字）になる
          - QQ プロットは分布の形を見るもので、分散と説明変数の関係は残差プロットで見る
          - 系統的な曲がりは分布の形を表す
        explanation: |
          **方針** QQ プロットで点が直線から系統的に外れる形から、分布の形を読む。下に凸（両端が上に曲がる）は、小さい側の分位点が正規分布より詰まり、大きい側が伸びている、つまり右の裾が長いことを示す。

          **途中式** 右に歪んだ分布では、右側の分位点が正規分布より大きくなる（右端が上に外れる）。左側の分位点は正規分布ほど小さくならない（左端も直線より上）。その結果、点の並びは下に凸になる。

          **答え** 右に歪んでいる。対数変換などを検討する

          **間違えやすい点** 両端が逆向きに外れる S 字は、裾の重さ・軽さを表す（右端が上・左端が下なら裾が重い）。右に歪んだ量（中性脂肪、所得など）は、対数をとると正規分布に近づくことが多い。
      - id: s29p10b
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, odds-ratio-interval]
        topic: 自己評価の健康状態の3段階を運動習慣で説明する比例オッズモデルで各段階の確率を求め累積オッズ比がどの区切りでも等しいことを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          自己評価の健康状態 $Y$（1：良い、2：ふつう、3：悪い）を、運動習慣がない（$x=1$）かある（$x=0$）かで説明する比例オッズモデル
          $$\log\frac{P(Y\le j)}{P(Y>j)}=c_j-\beta x\qquad(j=1,2),\qquad c_1=«c1»,\ c_2=«c2»,\ \beta=«b»$$
          を当てはめた。運動習慣のない人が「悪い」と答える確率と、モデルの性質の組として正しいものはどれか。
          必要なら $e^{0.7}=2.0138$、$e^{0.8}=2.2255$、$e^{1.5}=4.4817$ を使え。
        choices:
          - '«p3x1»。「悪い以上」と「ふつう以上」のどちらの区切りでも、運動習慣がない人の累積オッズは $e^{0.8}\approx2.23$ 倍（比例オッズ）'
          - '«p3x0»。「悪い以上」と「ふつう以上」のどちらの区切りでも、累積オッズは $e^{0.8}\approx2.23$ 倍'
          - '«p3x1»。累積オッズの比は区切りごとに違い、「悪い以上」では $e^{1.5}$ 倍、「ふつう以上」では $e^{-1.0}$ 倍'
          - '«w_add»。運動習慣がない人の「悪い」の確率は、ある人の確率に 0.8 を足した値'
          - '«p3x1»。比例オッズモデルでは、各段階の確率の比がどこでも $e^{0.8}$ 倍になる'
        answer: 0
        distractors:
          - 正解
          - 運動習慣がある人（x=0）の確率を答えた
          - 比例オッズモデルでは累積オッズ比は区切りによらず一定
          - 係数は確率ではなく対数オッズに効く
          - 一定なのは累積オッズの比で、各段階の確率の比ではない
        explanation: |
          **方針** $P(Y=3)=P(Y>2)=\dfrac{1}{1+e^{c_2-\beta x}}$。$\beta>0$ なので、$x=1$ のとき $Y$ が大きい（悪い）側に移る。

          **途中式**
          - $x=1$：$P(Y=3)=\dfrac{1}{1+e^{1.5-0.8}}=\dfrac{1}{1+2.0138}=«p3x14»$
          - $x=0$：$P(Y=3)=\dfrac{1}{1+e^{1.5}}=\dfrac{1}{5.4817}=«p3x04»$
          - 累積オッズ $\dfrac{P(Y>j)}{P(Y\le j)}=e^{-(c_j-\beta x)}$ の比は、$j=1,2$ のどちらでも $e^{\beta}=e^{0.8}$

          **答え** «p3x1»。累積オッズ比は区切りによらず $e^{0.8}$

          **間違えやすい点** 比例オッズの仮定のもとでは、1 つの係数で「どの区切りでも悪い側に移るオッズが何倍になるか」を表せる。区切りごとに効果が違うときは、この仮定が成り立たない。
      - id: s29p10c
        chapter: 19
        terms: [principal-component-regression, multicollinearity, bias-in-penalized-estimation]
        topic: 3つの栄養素摂取量の主成分回帰で各主成分の係数の分散が固有値に反比例することから小さい固有値の主成分を除いたときの分散の減り方を求める
        level: 標準
        definition: false
        type: choice
        question: |
          血糖値を、互いに相関の強い 3 つの栄養素の摂取量（標準化済み）で説明する。説明変数の相関行列の固有値は «l1»、«l2»、«l3» で、主成分得点 $z_k$ に回帰すると、係数 $\gamma_k$ の推定量の分散は $\sigma^2/\{(n-1)\lambda_k\}$ になる（主成分どうしは無相関）。
          3 つの主成分の係数の分散の合計（$\sigma^2/(n-1)$ を単位とする）と、固有値 «l3» の主成分を除いたときの合計の組として正しいものはどれか。
        choices:
          - 'すべて入れると «vall»、第 3 主成分を除くと «v12»。除くと分散は大きく減るが、第 3 主成分の効果が 0 でなければ偏りが生じる'
          - 'すべて入れると «vall»、第 3 主成分を除くと «v12»。除いても偏りは生じない'
          - 'すべて入れると «w_sum»（固有値の和）、第 3 主成分を除くと «w_sum12»'
          - 'すべて入れると «vall»、第 1 主成分を除くと最も分散が減る'
          - '主成分は無相関なので、どの主成分を除いても分散は変わらない'
        answer: 0
        distractors:
          - 正解
          - 除いた主成分の効果が 0 でなければ偏りが生じる
          - 分散は固有値に反比例する（固有値の和ではない）
          - 分散が最も大きいのは固有値の最も小さい主成分の係数
          - 各係数の分散は固有値によって大きく違う
        explanation: |
          **方針** 主成分得点の分散は固有値 $\lambda_k$ に比例するので、係数の推定の分散は $1/\lambda_k$ に比例する。固有値が 0 に近い主成分（多重共線性の方向）の係数は非常に不安定。

          **途中式**
          - $1/«l1»+1/«l2»+1/«l3»=«i1»+«i2»+«i3»=«vall»$
          - 第 3 主成分を除くと $«i1»+«i2»=«v12»$

          **答え** «vall» から «v12» に減る（偏りと引き換え）

          **間違えやすい点** 主成分回帰は、分散の大きい方向だけを使って推定を安定させる方法で、リッジ回帰と同じく「偏りと分散のトレードオフ」を利用している。目的変数に関係するのが小さい固有値の方向だと、除くことで大きな偏りが生じる。
  - id: s29p11
    title: 食事法の比較と健診の標本設計
    context: |
      食事指導の比較実験と、健診データの標本調査を計画する。小問ごとに別の問題を扱う。
    items:
      - id: s29p11a
        chapter: 20
        terms: [incomplete-block-design, randomized-block-design, fisher-three-principles]
        topic: 6種類の献立を10人に3種類ずつ試す釣り合い型不完備ブロック計画で各献立の反復数と同じ人で出会う回数から効率因子を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          6 種類の献立（処理）を比べるため、10 人（ブロック）にそれぞれ 3 種類ずつ試してもらう釣り合い型不完備ブロック計画を使う（どの 2 つの献立も、同じ回数だけ同じ人のもとで試される）。
          各献立の反復数を $r$、2 つの献立が同じ人で試される回数を $\lambda$ とするとき、完全なブロック計画に対する効率因子 $E=\dfrac{\lambda t}{rk}$（$t$ は処理数、$k$ はブロックの大きさ）を求めよ。
        answer: «E»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 試行の総数から $bk=tr$、同じブロックに入る組の数から $\lambda(t-1)=r(k-1)$ が成り立つ。

          **途中式**
          - $r=bk/t=10\times3/6=«r»$
          - $\lambda=r(k-1)/(t-1)=«r»\times2/5=«lam»$
          - $E=\dfrac{«lam»\times6}{«r»\times3}=«E4»$

          **答え** $«E_s»$

          **間違えやすい点** 効率因子は、同じ反復数の完全な乱塊法と比べた、処理の差の推定の分散の比（の逆数）を表し、1 より小さい。1 人がすべての献立を試せないときに、比較の精度をどれだけ保てるかの目安になる。
      - id: s29p11b
        chapter: 21
        terms: [stratified-sampling, proportional-allocation, finite-population-correction]
        topic: 年齢層で層別して無作為抽出した健診受診者の層ごとの平均から市全体の要受診者の総数を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          ある市の健診受診者を年齢層で 3 層に分け、層ごとに単純無作為抽出して「要再検査」かどうかを調べた。

          | 層 | 受診者数 $N_h$ | 抽出数 $n_h$ | 要再検査の人数 |
          |---|---|---|---|
          | 40 歳未満 | «N1» | «n1» | «y1» |
          | 40〜59 歳 | «N2» | «n2» | «y2» |
          | 60 歳以上 | «N3» | «n3» | «y3» |

          市全体の要再検査の人数を、層別推定量 $\sum N_h\hat p_h$ で推定せよ。
        answer: «tot»
        tolerance: 0.5
        answer_format: 人の単位で、整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 層ごとの割合 $\hat p_h=(\text{要再検査の人数})/n_h$ を求め、層の受診者数を掛けて足す。

          **途中式**
          $$«N1»\times\frac{«y1»}{«n1»}+«N2»\times\frac{«y2»}{«n2»}+«N3»\times\frac{«y3»}{«n3»}=«t1»+«t2»+«t3»=«tot»$$

          **答え** $«tot»$ 人

          **間違えやすい点** 抽出率が層で違う（60 歳以上を多めに抽出）ので、全標本の割合 $«ysum»/«nsum»$ に総受診者数 «Nsum» を掛けると «w_pool» 人となり、要再検査の多い高齢層の影響で過大になる。
  - id: s29p12
    title: 生活習慣の多変量解析
    context: |
      健康診断と生活習慣のアンケートのデータを多変量解析で分析する。小問ごとに別のデータを扱う。
    items:
      - id: s29p12a
        chapter: 23
        terms: [naive-bayes-classifier, bayes-discriminant-rule, normal-distribution]
        topic: 収縮期血圧と空腹時血糖の2つの特徴を条件付き独立な正規分布とみるガウス型ナイーブベイズで受診者が高リスク群に属する事後確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          受診者を高リスク群 A と低リスク群 B に分ける。各群で、収縮期血圧 $x_1$ と空腹時血糖（を変換した値）$x_2$ は独立な正規分布に従うとみなす（ナイーブベイズ）。

          | | $x_1$ の平均 | $x_2$ の平均 |
          |---|---|---|
          | 群 A | 140 | 6.8 |
          | 群 B | 120 | 5.6 |

          標準偏差は両群とも $x_1$ で 10、$x_2$ で 0.5、事前確率は A が 0.3、B が 0.7 である。$\boldsymbol x=(«x1»,\ «x2»)$ の受診者が群 A に属する事後確率に最も近いものはどれか。必要なら $e^{3.12}=22.65$ を使え。
        choices:
          - '$«post»$'
          - '$«w_noprior»$'
          - '$0.300$'
          - '$«w_one»$'
          - '$«w_inv»$'
        answer: 0
        distractors:
          - 正解
          - 事前確率を等しいとみなした
          - 事前確率のまま（データを使っていない）
          - x1 だけで判定した
          - 群 A と B を取り違えた
        explanation: |
          **方針** 対数尤度比 $\log\dfrac{f_A(\boldsymbol x)}{f_B(\boldsymbol x)}=\sum_j\dfrac{(x_j-\mu_{Bj})^2-(x_j-\mu_{Aj})^2}{2\sigma_j^2}$（標準偏差が両群で等しいので正規化定数は消える）。事後オッズ = 事前オッズ × 尤度比。

          **途中式**
          - $x_1$：$z_A=(«x1»-140)/10=«zA1»$、$z_B=(«x1»-120)/10=«zB1»$ → $(«zB1»^2-(«zA1»)^2)/2=«h1»$
          - $x_2$：$z_A=«zA2»$、$z_B=«zB2»$ → $(«zB2»^2-(«zA2»)^2)/2=«h2»$
          - 対数尤度比 $=«h1»+«h2»=3.12$、事後オッズ $=\dfrac{0.3}{0.7}\times22.65=«odds»$、事後確率 $=«odds»/(1+«odds»)=«post4»$

          **答え** $«post»$

          **間違えやすい点** ナイーブベイズは特徴が群の中で独立だと仮定して尤度を掛け合わせる。実際には血圧と血糖には相関があることが多く、そのときは同じ情報を二重に数えて、事後確率を極端にしやすい。
      - id: s29p12b
        chapter: 24
        terms: [average-linkage, lance-williams-formula, hierarchical-clustering]
        topic: 群平均法で2人と3人のクラスターを併合したあとの別の受診者までの距離をランス・ウィリアムズの更新式で人数の重み付き平均として求める
        level: 基本
        definition: false
        type: numeric
        question: |
          生活習慣のデータで受診者を群平均法により階層的にクラスタリングしている。クラスター $P$（2 人）と $Q$（3 人）を併合して $P\cup Q$ を作る。
          別の受診者 $R$ までの群平均距離は、$d(R,P)=«dRP»$、$d(R,Q)=«dRQ»$ だった。併合後の $d(R,P\cup Q)$ を求めよ。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 群平均法では、併合後の距離は 2 つのクラスターの人数で重み付けした平均になる（ランス・ウィリアムズの更新式で $\alpha_P=n_P/(n_P+n_Q)$、$\alpha_Q=n_Q/(n_P+n_Q)$、$\beta=\gamma=0$）。

          **途中式** $d(R,P\cup Q)=\dfrac{2\times«dRP»+3\times«dRQ»}{5}=«ans_s»$

          **答え** $«ans_s»$

          **間違えやすい点** 人数で重み付けせずに単純平均すると «w_simple» になる（これは重み付き群平均法（WPGMA）の更新）。最短距離法なら小さい方 «dRP»、最長距離法なら大きい方 «dRQ» になる。
      - id: s29p12c
        chapter: 26
        terms: [quantification-theory, contingency-table, pearson-chi-square-statistic]
        topic: 運動頻度の3カテゴリーに数量を与えて生活習慣病の有無を判別する数量化II類で相関比を最大にするカテゴリースコアと最大の相関比がカイ二乗値÷総数になることを求める
        level: 応用
        definition: false
        type: choice
        question: |
          生活習慣病の有無（2 群）を、運動頻度（なし／週 1〜2 回／週 3 回以上）という 1 つの質的変数で判別したい。«n» 人の集計は次のとおり。

          | | なし | 週 1〜2 回 | 週 3 回以上 |
          |---|---|---|---|
          | 病気あり | «a1» | «a2» | «a3» |
          | 病気なし | «b1» | «b2» | «b3» |

          数量化 II 類では、各カテゴリーに数量（スコア）を与え、2 群の間の変動と全体の変動の比（相関比 $\eta^2$）が最大になるように決める。説明変数が 1 つだけのこの場合について、正しい記述はどれか。
        choices:
          - 'スコアは各カテゴリーの「病気あり」の割合 («q1», «q2», «q3»)（の 1 次変換）でよく、最大の相関比は $X^2/n=«eta»$（$X^2$ は 2×3 表のピアソンのカイ二乗統計量 «X2»）'
          - 'スコアは各カテゴリーの人数 («c1», «c2», «c3») に比例し、最大の相関比は «eta»'
          - 'スコアは (0, 1, 2) と等間隔に決まり、最大の相関比は «w_lin»'
          - '最大の相関比は $X^2=«X2»$ そのもので、1 を超えることもある'
          - '数量化 II 類は外的基準のない方法なので、相関比は使わない'
        answer: 0
        distractors:
          - 正解
          - 人数ではなく群の割合が判別に効く
          - 等間隔のスコアは最適とは限らず、相関比は最大値より小さくなる
          - 相関比は 0 以上 1 以下（X² を n で割る）
          - 数量化 II 類は質的な外的基準（群）を判別する方法
        explanation: |
          **方針** 説明変数が 1 つのとき、カテゴリー $j$ のスコアを $s_j$ とすると、群の指示変数との相関の 2 乗が相関比になる。これは各カテゴリーの群の割合 $q_j$ をスコアにしたときに最大になる。

          **途中式**
          - 「病気あり」の割合：$«a1»/«c1»=«q1»$、$«a2»/«c2»=«q2»$、$«a3»/«c3»=«q3»$
          - 2×3 表の期待度数はすべて 20 で、$X^2=\sum(O-E)^2/E=«X2»$
          - 最大の相関比 $\eta^2=X^2/n=«X2»/«n»=«eta»$

          **答え** スコアは群の割合、最大の相関比は $X^2/n=«eta»$

          **間違えやすい点** 数量化 II 類は、質的な説明変数を使う判別分析で、外的基準（群）がある方法である（III 類は外的基準がない）。説明変数が 1 つなら、2×k 表のカイ二乗統計量と直接つながる。
  - id: s29p13
    title: 体温の変動と回答の欠測
    context: |
      健康管理アプリのデータを分析する。小問ごとに別のデータを扱う。
    items:
      - id: s29p13a
        chapter: 27
        terms: [ar-model, stationarity-condition, autocovariance-autocorrelation]
        topic: 体温の時間ごとのずれをAR(2)モデルで表し特性方程式が複素数の根をもつことから減衰しながら振動する周期と1次・2次の自己相関を求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 時間ごとの体温の平均からのずれ $X_t$ が AR(2) モデル $X_t=«p1»X_{t-1}«p2s»X_{t-2}+\varepsilon_t$ に従う（$\varepsilon_t$ は白色雑音）。
          このモデルの性質として正しいものはどれか。
        choices:
          - '定常で、特性方程式の根は複素数。自己相関は振動しながら減衰し、周期は約 «per» 時間。$\rho_1=«r1»$、$\rho_2=«r2»$'
          - '定常で、自己相関は振動せずに単調に減衰する。$\rho_1=«r1»$、$\rho_2=«r2»$'
          - '定常で、特性方程式の根は複素数。周期は約 «w_per» 時間。$\rho_1=«p1»$、$\rho_2=«p2»$'
          - '$\phi_1+\phi_2=0.5<1$ だが、$\phi_2<0$ なので定常ではない'
          - '定常で、特性方程式の根は複素数。周期は約 «per» 時間。$\rho_1=«p1»$、$\rho_2=«w_r2»$'
        answer: 0
        distractors:
          - 正解
          - φ1²+4φ2<0 なので、自己相関は振動する
          - 周期の計算を誤り、自己相関を係数と取り違えた
          - 定常条件（φ1+φ2<1、φ2−φ1<1、|φ2|<1）はすべて満たす
          - ρ1 は φ1 ではなく φ1/(1−φ2)
        explanation: |
          **方針** 定常条件は $\phi_1+\phi_2<1$、$\phi_2-\phi_1<1$、$|\phi_2|<1$。$\phi_1^2+4\phi_2<0$ なら特性方程式の根は複素数で、自己相関は $r^k\cos(k\theta)$ 型で振動しながら減衰する（$r=\sqrt{-\phi_2}$、$\cos\theta=\phi_1/(2\sqrt{-\phi_2})$）。

          **途中式**
          - 定常条件：$«p1»+(«p2»)=0.5<1$、$«p2»-«p1»=-1.5<1$、$|«p2»|<1$
          - $\phi_1^2+4\phi_2=1-2=-1<0$、$\cos\theta=1/(2\times0.7071)=0.7071$ より $\theta=\pi/4$、周期 $2\pi/\theta=«per»$
          - ユール・ウォーカー方程式：$\rho_1=\phi_1/(1-\phi_2)=1/1.5=«r1»$、$\rho_2=\phi_1\rho_1+\phi_2=«r1»-0.5=«r2»$

          **答え** 振動しながら減衰し、周期は約 «per» 時間

          **間違えやすい点** AR(1) の自己相関は単調（または符号が交互）に減衰するだけだが、AR(2) では複素数の根によって周期的な振動を表せる。体温や睡眠の段階のような周期的な変動のモデルに使われる。
      - id: s29p13b
        chapter: 29
        terms: [mnar, missing-data-mechanism, complete-case-analysis]
        topic: 飲酒量の多い人ほど回答しにくいMNARの欠測で回答者だけの平均飲酒量の偏りを回答確率と構成比から求める
        level: 応用
        definition: false
        type: numeric
        question: |
          アプリの利用者の «pl» は 1 日の飲酒量が 1 単位、«ph» は 5 単位（多量飲酒）である。飲酒量の質問に答える確率は、飲酒量 1 単位の人で «r1x»、5 単位の人で «r5» である（答えるかどうかは飲酒量そのものに依存する）。
          回答者だけで計算した平均飲酒量（単位）の期待値を求めよ。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 回答者の中での構成比は、もとの構成比に回答確率を掛けて正規化したもの。

          **途中式**
          - 回答者の割合：1 単位 $«pl»\times«r1x»=«m1»$、5 単位 $«ph»\times«r5»=«m5»$、合計 «msum»
          - 回答者の平均 $=\dfrac{«m1»\times1+«m5»\times5}{«msum»}=«ans4»$

          **答え** $«ans_s»$ 単位（本当の平均 «true» 単位より小さい）

          **間違えやすい点** 欠測するかどうかが欠測している値そのもの（飲酒量）に依存するのは MNAR（ランダムでない欠測）で、年齢などの観測された変数で重み付けしても偏りは取り除けない。欠測の仕組みについての仮定（選択モデルなど）を置いた分析や、感度分析が必要になる。
  - id: s29p14
    title: クリニックごとの改善量
    context: |
      生活習慣改善プログラムを行った複数のクリニックの結果を分析する。小問ごとに別のデータを扱う。
    items:
      - id: s29p14a
        chapter: 31
        terms: [hierarchical-bayes-model, empirical-bayes, prior-distribution]
        topic: クリニックの真の平均改善量が全体の分布から生じる階層モデルで受診者の少ないクリニックの事後平均が全体平均へ強く縮むことを分散の比から求める
        level: 標準
        definition: false
        type: choice
        question: |
          クリニック $j$ の真の平均改善量 $\theta_j$ は $N(«mu»,\ «tau2»)$ に従い（階層モデル）、クリニック $j$ の $n_j$ 人の平均改善量は $\theta_j$ のもとで $N(\theta_j,\ «s2»/n_j)$ に従う（数値は既知とする）。
          観測した平均改善量がともに «ybar» だった、$n_j=«nA»$ のクリニック A と $n_j=«nB»$ のクリニック B の $\theta_j$ の事後平均の組として正しいものはどれか。
        choices:
          - 'A は «pa»、B は «pb»。人数の少ない A ほど全体の平均 «mu» の方へ大きく縮む'
          - 'A も B も «ybar»。観測した平均がそのまま推定値になる'
          - 'A は «pb»、B は «pa»。人数の多い B ほど大きく縮む'
          - 'A も B も «w_mid»（観測値と全体の平均の単純な平均）'
          - 'A は «pa»、B は «pb»。縮み方は観測した平均の大きさだけで決まる'
        answer: 0
        distractors:
          - 正解
          - 階層モデルでは、全体の分布の情報も使う（部分的な併合）
          - 縮み方を取り違えた
          - 重みは分散の比で決まる（半々ではない）
          - 縮み方は人数（観測の精度）と τ² で決まる
        explanation: |
          **方針** 正規・正規モデルでは、事後平均は観測値と全体の平均の重み付き平均で、観測値の重みは $\dfrac{\tau^2}{\tau^2+\sigma^2/n_j}$。

          **途中式**
          - A：$\sigma^2/n=«s2»/«nA»=«vA»$、重み $«tau2»/(«tau2»+«vA»)=«wA»$、事後平均 $«wA»\times«ybar»+(1-«wA»)\times«mu»=«pa»$
          - B：$\sigma^2/n=«s2»/«nB»=«vB»$、重み $«tau2»/(«tau2»+«vB»)=«wB»$、事後平均 «pb»

          **答え** A は «pa»、B は «pb»

          **間違えやすい点** 受診者の少ないクリニックの平均はばらつきが大きいので、全体の傾向に近づけて推定する（借りる強さが大きい）。$\tau^2$ などの超母数をデータから推定する方法が経験ベイズ、超母数にも事前分布を置くのが階層ベイズである。
      - id: s29p14b
        chapter: 32
        terms: [jackknife, unbiased-estimator, bootstrap]
        topic: 4つのクリニックの改善量の標本分散（nで割る）を1つずつ除いて計算し直すジャックナイフ法で偏りを推定して補正した値を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          4 つのクリニックの改善量は «xs» だった。分散を $\hat\theta=\dfrac1n\sum(x_i-\bar x)^2$（$n$ で割る）で推定する。
          1 つずつ除いた 3 つの値で同じ式を計算した $\hat\theta_{(i)}$ の平均を $\hat\theta_{(\cdot)}$ として、ジャックナイフ法の偏りの推定値 $(n-1)(\hat\theta_{(\cdot)}-\hat\theta)$ を引いた補正値 $\hat\theta-(n-1)(\hat\theta_{(\cdot)}-\hat\theta)$ を求めよ。
        answer: «corr»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 1 つずつ除いた推定値の平均と元の推定値の差を $(n-1)$ 倍すると、偏りの推定になる。

          **途中式**
          - $\hat\theta=«th»$（平均 «xb»）
          - 1 つずつ除いた値：«loo»、平均 $\hat\theta_{(\cdot)}=«loom»$
          - 偏りの推定 $3\times(«loom»-«th»)=«bias»$、補正値 $«th»-(«bias»)=«corr_s»$

          **答え** $«corr_s»$

          **間違えやすい点** 補正値は、$n-1$ で割る不偏分散 $s^2$ と一致する。ジャックナイフ法は、偏りが $1/n$ に比例する推定量の偏りを取り除く。
          ブートストラップ法と同じく、データを作り直して推定量のふるまいを調べる再標本化の方法である。
