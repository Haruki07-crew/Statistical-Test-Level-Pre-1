        chapter: 18
        terms: [logistic-regression, probit-model, generalized-linear-model]
        topic: 障害の有無を温度で説明するロジットモデルとプロビットモデルの係数の違いを潜在変数の誤差の標準偏差の違いから説明し係数を換算する
        level: 標準
        definition: false
        type: choice
        question: |
          ロジスティック回帰（ロジットモデル）を当てはめたところ、温度の係数は «bl» だった。同じデータにプロビットモデルを当てはめたとき、温度の係数のおよその値と、その理由の組として正しいものはどれか。
          2 つのモデルは、潜在変数 $y^*=\beta_0+\beta_1x+\varepsilon$ が 0 を超えると障害が起きると考え、$\varepsilon$ をそれぞれ標準ロジスティック分布（標準偏差 $\pi/\sqrt3\approx«sdl»$）と標準正規分布（標準偏差 1）とみなしたものである。
        choices:
          - '約 «bl»。リンク関数が違っても、係数は同じ値になる'
          - '約 «w_mul»。プロビットモデルの方が係数は大きくなる'
          - '約 «w_var»。誤差の分散の比 $\pi^2/3\approx3.29$ で割る'
          - 'リンク関数の違うモデルの係数は比べられないので、換算はできない'
          - '約 «bp»。誤差の標準偏差がロジットモデルの方が約 «sdl» 倍大きいので、同じ確率を表すにはロジットモデルの係数がその倍率だけ大きくなり、プロビットモデルの係数はそのぶん小さい'
        answer: 4
        distractors:
          - 潜在変数の尺度が違うので、係数の大きさは変わる
          - 掛けると割るを取り違えた
          - 係数は標準偏差の比で変わる（分散の比ではない）
          - 尺度の違いを補えば、およその換算はできる
          - 正解
        explanation: |
          **方針** 潜在変数のモデルでは、係数は誤差の標準偏差を単位にした値しか決まらない。ロジットモデルの誤差の標準偏差は $\pi/\sqrt3\approx«sdl»$ なので、同じデータからは係数が約 «sdl» 倍（実際の当てはめでは 1.6〜1.8 倍）になる。

          **途中式** プロビットの係数 $\approx«bl»/«sdl»=«bp4»\approx«bp»$（中心付近の傾きを合わせる換算 1.6 を使えば $«bl»/1.6\approx«bp16»$）

          **答え** 約 «bp»。誤差の尺度の違いによる

          **間違えやすい点** 2 つのモデルが表す確率の曲線はほとんど同じで、違うのは係数の尺度である。モデルを比べるときは、係数そのものではなく、予測確率や限界効果を比べる。
          ロジットモデルの係数は対数オッズ比として解釈できる（$e^{«bl»}$ が温度 1℃ あたりのオッズ比）点が、プロビットモデルにない利点である。
