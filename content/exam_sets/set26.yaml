          $$f(\omega)=\frac{\sigma^2}{2\pi}\cdot\frac{1}{1-2\phi\cos\omega+\phi^2}\qquad(0\le\omega\le\pi)$$
          である。周波数 0 と $\pi$ でのスペクトル密度の比 $f(0)/f(\pi)$ と、その解釈の組として正しいものはどれか。
        choices:
          - '$f(0)/f(\pi)=«rt»$ で、ゆっくりした（低周波の）変動が卓越する'
          - '$f(0)/f(\pi)=«w_inv»$ で、細かく上下する（高周波の）変動が卓越する'
          - '$f(0)/f(\pi)=«ratio»$ で、ゆっくりした（低周波の）変動が卓越する'
          - '$f(0)/f(\pi)=«ratio»$ で、細かく上下する（高周波の）変動が卓越する'
          - '$f(0)/f(\pi)=«w_1mp»$ で、ゆっくりした（低周波の）変動が卓越する'
        answer: 2
        distractors:
          - 分母を (1−φ)² と (1+φ)² ではなく 1−φ と 1+φ にして 2 乗し忘れた
          - 比を逆にした（f(π)/f(0)）
          - 正解
          - 比の大小と周波数の対応を取り違えた（ω=0 が低周波）
          - f(π) の分母 (1+φ)² を 1 とした
        explanation: |
          **方針** $\cos0=1$、$\cos\pi=-1$ を代入すると、分母はそれぞれ $(1-\phi)^2$、$(1+\phi)^2$ になる。比をとると $\sigma^2/(2\pi)$ は消える。

          **途中式**
          $$f(0)=\frac{\sigma^2}{2\pi}\cdot\frac{1}{(1-«phi»)^2},\qquad f(\pi)=\frac{\sigma^2}{2\pi}\cdot\frac{1}{(1+«phi»)^2}$$
          $$\frac{f(0)}{f(\pi)}=\left(\frac{1+«phi»}{1-«phi»}\right)^2=\left(\frac{«opp»}{«omp»}\right)^2=«rt»^2=«ratio»$$
          $\omega=0$ 付近は周期の長い（ゆっくりした）変動、$\omega=\pi$ は 1 分ごとに符号が入れ替わるような細かい変動に対応する。

          **答え** $f(0)/f(\pi)=«ratio»$ で、ゆっくりした（低周波の）変動が卓越する

          **間違えやすい点** $\phi>0$ の AR(1) は正の自己相関をもち、前の値を引きずるので低周波の成分が強い（$\phi<0$ なら逆に高周波が強くなる）。
          分母の $(1\mp\phi)$ は 2 乗されているので、比は $«rt»$ ではなく $«ratio»$。

      - id: s26p13b
        chapter: 22
        terms: [principal-component-analysis, principal-component-score, eigenvalue-and-eigenvector, pca-on-correlation-matrix]
        topic: 2つの監視指標の相関行列の主成分得点を固有値で割った2乗和の異常度と第1主成分で説明できない残差の2乗を求める
        level: 応用
        definition: false
        type: choice
        question: |
          正常時のデータで標準化した吸気温度 $z_1$ と消費電力 $z_2$ の相関係数は «rho» で、相関行列の固有値は $\lambda_1=«l1»$、$\lambda_2=«l2»$、
          対応する固有ベクトルは $\boldsymbol v_1=\frac{1}{\sqrt2}(1,1)^\top$、$\boldsymbol v_2=\frac{1}{\sqrt2}(1,-1)^\top$ である。
          ある時刻の標準化した値は $(z_1,z_2)=(«z1»,\,«z2»)$ だった。主成分得点を $t_k=\boldsymbol v_k^\top\boldsymbol z$ とし、
          異常度 $T^2=t_1^2/\lambda_1+t_2^2/\lambda_2$ と、第 1 主成分だけで近似したときの残差の 2 乗 $Q=\|\boldsymbol z-t_1\boldsymbol v_1\|^2$ の組として正しいものはどれか。
        choices:
          - '$T^2=«w_nodiv»$、$Q=«Q»$'
          - '$T^2=«T2»$、$Q=«w_Q»$'
          - '$T^2=«w_mul»$、$Q=«Q»$'
          - '$T^2=«T2»$、$Q=«Q»$'
          - '$T^2=«w_first»$、$Q=«Q»$'
        answer: 3
        distractors:
          - 固有値で割らずに得点の 2 乗を足した
          - 残差を第 1 主成分の得点の 2 乗とした
          - 固有値で割るところを掛けた
          - 正解
          - 第 1 主成分の項だけで T² を計算した
        explanation: |
          **方針** 主成分得点は固有ベクトルとの内積。$T^2$ は各得点の 2 乗をその分散（固有値）で割って足したもので、マハラノビス距離の 2 乗に等しい。
          $\boldsymbol v_1,\boldsymbol v_2$ は正規直交なので、$\boldsymbol z=t_1\boldsymbol v_1+t_2\boldsymbol v_2$ と分解でき、残差は $t_2\boldsymbol v_2$、$Q=t_2^2$。

          **途中式**
          $$t_1=\frac{«z1»+(«z2»)}{\sqrt2}=\frac{«zs»}{\sqrt2},\quad t_1^2=«t1sq»;\qquad t_2=\frac{«z1»-(«z2»)}{\sqrt2}=\frac{«zd»}{\sqrt2},\quad t_2^2=«t2sq»$$
          $$T^2=\frac{«t1sq»}{«l1»}+\frac{«t2sq»}{«l2»}=«T2a»+«T2b»=«T2»,\qquad Q=t_2^2=«Q»$$

          **答え** $T^2=«T2»$、$Q=«Q»$

          **間違えやすい点** 2 つの指標は正の相関（«rho»）をもつので、正常なら $z_1$ と $z_2$ は同じ向きに動く。この時刻は温度が高いのに電力が低く、相関の構造から外れている。
          この「外れ」は分散の小さい第 2 主成分（$\lambda_2=«l2»$）に現れるので、固有値で割ると大きく効く。割らずに足すと $«w_nodiv»$ にしかならず異常を見逃す。

      - id: s26p13c
        chapter: 23
        terms: [quadratic-discriminant-analysis, bayes-discriminant-rule, normal-distribution]
        topic: 平均が同じで分散が異なる2群の2次判別で攻撃と判定する範囲が両側になる境界を求める
        level: 応用
        definition: false
        type: choice
        question: |
          通信量の異常スコア $s$ は、正常時には $N(0,1)$、攻撃を受けているときには $N(0,4)$（分散 4）に従うとする。
          正常と攻撃の事前確率は等しく、誤判別の損失も等しいとして、事後確率の大きいほうに判別する（ベイズ判別）。攻撃と判別される $s$ の範囲として正しいものはどれか。
          必要なら $\ln2=«ln2»$、$\ln4=«ln4»$ を使え。
        choices:
          - '$s>«c»$'
          - '$|s|>«c_ln4»$'
          - '$|s|<«c»$'
          - '$|s|>«c_sd4»$'
          - '$|s|>«c»$'
        answer: 4
        distractors:
          - 境界が両側にあることを見落とし、正の側だけにした
          - 正規化定数の比 ln(σ₁/σ₀)=ln2 の代わりに ln4（分散の比の対数）を使った
          - 分散の大きい群が外側をとることを取り違え、判別の向きを逆にした
          - 分散 4 を標準偏差 4 と取り違えた
          - 正解
        explanation: |
          **方針** 2 つの群の分散が異なるので、対数尤度比が $s$ の 2 次式になる（2 次判別）。事前確率が等しいので、$\ln f_{\text{攻撃}}(s)-\ln f_{\text{正常}}(s)>0$ なら攻撃と判別する。

          **途中式**
          $$\ln f_{\text{攻撃}}(s)=-\ln2-\frac{s^2}{8}+\text{定数},\qquad \ln f_{\text{正常}}(s)=-\frac{s^2}{2}+\text{定数}$$
          （定数は両方に共通の $-\frac12\ln2\pi$。攻撃の標準偏差は 2 なので $-\ln2$ が付く。）
          $$\left(\frac12-\frac18\right)s^2-\ln2>0\quad\Rightarrow\quad s^2>\frac{8\times«ln2»}{3}=«c2»\quad\Rightarrow\quad |s|>«c4»\cdots$$

          **答え** $|s|>«c»$（$s<-«c»$ または $s>«c»$）

          **間違えやすい点** 平均が同じでも分散が違えば判別できる。分散の大きい攻撃の群は 0 から離れた値をとりやすいので、境界は 0 の両側に 2 つでき、外側が攻撃になる。
          正規化定数は標準偏差の比の対数 $\ln2$ であり、分散の比の対数 $\ln4$ を使うと $«c_ln4»$ になる。分散 4 を標準偏差 4 と読むと $«c_sd4»$ になる。

  - id: s26p14
    title: 不正ログインの分析
    context: |
      ある企業のセキュリティ部門は、社外からのログインの記録を分析している。
    items:
      - id: s26p14a
        chapter: 24
        terms: [number-of-clusters, k-means-method, distance-measures]
        topic: ログイン元のクラスタリング結果である点のシルエット係数を自クラスターと最も近い他クラスターまでの平均距離から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ログイン元の IP アドレスを、アクセスの時間帯や頻度などの特徴量で 3 つのクラスター A、B、C に分けた。A に属するある IP アドレス $i$ から、ほかの IP アドレスまでの距離は次のとおりである。
          - A のほかのメンバー（3 個）：«dA1»、«dA2»、«dA3»
          - B のメンバー（4 個）：«dB1»、«dB2»、«dB3»、«dB4»
          - C のメンバー（2 個）：«dC1»、«dC2»

          $a(i)$ を自クラスターのほかのメンバーまでの平均距離、$b(i)$ を他のクラスターごとの平均距離のうち最小のものとして、
          シルエット係数 $s(i)=\dfrac{b(i)-a(i)}{\max\{a(i),\,b(i)\}}$ を求めよ。
        answer: «sil»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $a(i)$ は自クラスター内のまとまり、$b(i)$ は「次に近いクラスター」までの離れ具合。他のクラスターはクラスターごとに平均をとり、その最小値を $b(i)$ とする。

          **途中式**
          $$a(i)=\frac{«dA1»+«dA2»+«dA3»}{3}=«a»$$
          $$\text{B までの平均}=\frac{«dB1»+«dB2»+«dB3»+«dB4»}{4}=«bB»,\qquad \text{C までの平均}=\frac{«dC1»+«dC2»}{2}=«bC»$$
          $b(i)=\min(«bB»,«bC»)=«b»$。
          $$s(i)=\frac{«b»-«a»}{\max(«a»,«b»)}=\frac{«b»-«a»}{«b»}=«sil4»\cdots$$

          **答え** $«sil»$

          **間違えやすい点** $b(i)$ は最も**近い**他クラスターまでの平均距離。B までの平均 «bB» を使うと $«w_far»$ と、まとまりを過大に評価する。
          分母は $a(i)$ と $b(i)$ の大きいほうで、$a(i)$ で割ると $«w_div»$ になり $-1\le s(i)\le1$ の範囲を外れることもある。

      - id: s26p14b
        chapter: 33
        terms: [d-separation, backdoor-criterion, causal-effect]
        topic: パッチ適用と侵入と検知アラートの因果グラフで有向分離により条件付き独立が成り立つ組を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          インシデントの要因を、次の有向非巡回グラフで表した。
          - 監視体制の強さ $M$ → パッチ適用の遅れ $P$、$M$ → 検知アラート $A$
          - $P$ → 脆弱性の残存 $V$ → 侵入 $I$ → 検知アラート $A$

          このグラフの有向分離（d 分離）から、つねに成り立つといえる条件付き独立として正しいものはどれか。
        choices:
          - '$P$ と $A$ は、$V$ を与えたもとで独立である'
          - '$V$ と $A$ は、$I$ を与えたもとで独立である'
          - '$M$ と $I$ は、$A$ を与えたもとで独立である'
          - '$P$ と $I$ は、何も与えなくても独立である'
          - '$V$ と $A$ は、$I$ と $M$ を与えたもとで独立である'
        answer: 4
        distractors:
          - P←M→A の裏口の道が開いたまま残る
          - V←P←M→A の道が M で閉じていない
          - 合流点 A を条件づけると M→A←I の道が開く
          - P→V→I の道が開いている
          - 正解
        explanation: |
          **方針** 2 つの変数を結ぶすべての道（矢印の向きを無視した経路）について、条件づけた変数で閉じるかを調べる。
          連鎖 $X\to Z\to Y$ と分岐 $X\leftarrow Z\to Y$ は $Z$ を条件づけると閉じ、合流点 $X\to Z\leftarrow Y$ は $Z$（とその子孫）を条件づけない限り閉じている。すべての道が閉じていれば d 分離され、条件付き独立が成り立つ。

          **途中式** $V$ と $A$ を結ぶ道は 2 本ある。
          - $V\to I\to A$：連鎖で、$I$ を条件づけているので閉じる。
          - $V\leftarrow P\leftarrow M\to A$：$M$ は分岐で、$M$ を条件づけているので閉じる。

          どちらも閉じるので、$V$ と $A$ は $\{I,M\}$ のもとで d 分離される。
          ほかの選択肢では、$P$ と $A$ は $V$ のもとでも $P\leftarrow M\to A$ が開いている。$V$ と $A$ は $I$ だけでは $V\leftarrow P\leftarrow M\to A$ が開いている。
          $M$ と $I$ は合流点 $A$ を条件づけると $M\to A\leftarrow I$ が開く。$P$ と $I$ は $P\to V\to I$ で直接つながっている。

          **答え** 「$V$ と $A$ は、$I$ と $M$ を与えたもとで独立である」

          **間違えやすい点** 中間の変数 $I$ で条件づけても、別の裏口の道（ここでは監視体制 $M$ を通る道）が残っていれば独立にならない。
          また、合流点（ここでは検知アラート $A$）で条件づけると、それまで閉じていた $M\to A\leftarrow I$ の道が開き、原因どうし（監視体制と侵入）の間に新たな関連が生じる。
