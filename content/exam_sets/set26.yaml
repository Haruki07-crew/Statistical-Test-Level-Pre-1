      各層の台数 $N_h$、スコアの標準偏差の見込み $S_h$、1 台を監査する費用 $c_h$（千円）は次のとおりである。

      | 層 | オンプレミス | クラウド | エッジ拠点 |
      |---|---|---|---|
      | $N_h$ | «N1» | «N2» | «N3» |
      | $S_h$ | «S1» | «S2» | «S3» |
      | $c_h$ | «c1» | «c2» | «c3» |
    items:
      - id: s26p12a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation]
        topic: 監査費用が層で異なるとき予算を使い切る最適配分で各層の標本数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          監査費用の総額を «C» 千円とし、層別平均の推定量の分散を最小にする最適配分（$n_h\propto N_hS_h/\sqrt{c_h}$）で各層の台数を決める。
          クラウド層で監査する台数を求めよ。
        answer: «n2»
        tolerance: 0.5
        answer_format: 整数で答えよ。±0.5 未満の差まで正解とする。
        explanation: |
          **方針** 費用の制約 $\sum c_hn_h=C$ のもとで分散を最小にすると $n_h=k\,N_hS_h/\sqrt{c_h}$ になる。比例定数 $k$ は予算を使い切る条件 $\sum c_hn_h=k\sum N_hS_h\sqrt{c_h}=C$ から決まる。

          **途中式**
          | 層 | $N_hS_h/\sqrt{c_h}$ | $N_hS_h\sqrt{c_h}$ |
          |---|---|---|
          | オンプレミス | $«N1»\times«S1»/«rc1»=«a1»$ | $«N1»\times«S1»\times«rc1»=«b1»$ |
          | クラウド | $«N2»\times«S2»/«rc2»=«a2»$ | $«N2»\times«S2»\times«rc2»=«b2»$ |
          | エッジ拠点 | $«N3»\times«S3»/«rc3»=«a3»$ | $«N3»\times«S3»\times«rc3»=«b3»$ |

          $\sum N_hS_h\sqrt{c_h}=«sumb»$ なので
          $$n_{\text{クラウド}}=C\times\frac{N_2S_2/\sqrt{c_2}}{\sum N_hS_h\sqrt{c_h}}=«C»\times\frac{«a2»}{«sumb»}=«n2s»$$
          （ほかの層はオンプレミス «n1»、エッジ拠点 «n3» で、費用の合計はちょうど «C» 千円になる。）

          **答え** $«n2»$（台）

          **間違えやすい点** 費用を無視したネイマン配分 $n_h\propto N_hS_h$ の比で予算を使い切ると、クラウド層は «w_ney» 台にしかならない。台数に比例する比例配分なら «w_prop» 台。
          最適配分では、費用が安い層ほど $1/\sqrt{c_h}$ の分だけ多く調べる。分母が $\sum N_hS_h/\sqrt{c_h}$ ではなく $\sum N_hS_h\sqrt{c_h}$ になるのは、制約が台数ではなく費用だからである。

