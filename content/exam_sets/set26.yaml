          - '$\mathrm{RE}=«w_inv»$。乱塊法は完全無作為化法より効率が悪かった'
          - 'ブロックの $F$ 値が大きいので、ブロック間の差は冷却設定の効果として扱うべきだった'
        answer: 1
        distractors:
          - 平均平方の比は F 値で、相対効率ではない
          - 正解
          - 自由度の減少よりも、誤差の分散が小さくなる効果の方がはるかに大きい
