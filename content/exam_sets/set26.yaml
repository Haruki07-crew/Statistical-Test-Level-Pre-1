          $$\mathrm{RE}=\frac{(b-1)\,\mathrm{MS}_{\text{ブロック}}+b(t-1)\,\mathrm{MS}_{\text{誤差}}}{(bt-1)\,\mathrm{MS}_{\text{誤差}}}$$
