          **途中式**
          $$\mathrm{RE}=\frac{5\times«MSB»+6\times3\times«MSE»}{23\times«MSE»}=\frac{«n1»+«n2»}{«d»}=«RE4»$$

          **答え** $\mathrm{RE}=«RE»$。完全無作為化法なら約 «RE1» 倍の試験回数が必要

          **間違えやすい点** ラック列による温度の違い（ブロックの平均平方 «MSB»）が大きいので、ブロックを作って取り除いた効果が大きい。これはフィッシャーの 3 原則のうち「局所管理」の効果である。
          ブロック間の差が小さいときは、誤差の自由度が減るぶん、乱塊法の利点は小さくなる。
