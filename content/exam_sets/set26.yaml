  - id: s26p13
    title: データセンターの監視指標
    context: |
      データセンターでは、ラックの吸気温度やファンの回転率などの監視指標を記録し、異常を自動で検知している。小問ごとに別のデータを扱う。
    items:
      - id: s26p13a
        chapter: 27
        terms: [weak-stationarity, strict-stationarity, autocovariance-autocorrelation]
        topic: 周期成分を含む系列やランダムウォークなど4つの監視指標のモデルについて平均と自己共分散が時点によらないかを調べ弱定常性を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          $\varepsilon_t$ は平均 0、分散 $\sigma^2$ の独立な誤差、$A$ と $B$ は平均 0、分散 $\sigma^2$ で互いに無相関な確率変数（$t$ によらない）、$\omega$ は定数とする。次の 4 つのモデルのうち、弱定常なものの組として正しいものはどれか。

          - (i) $X_t=A\cos\omega t+B\sin\omega t$（1 日周期の温度の変動）
          - (ii) $X_t=X_{t-1}+\varepsilon_t$、$X_0=0$（ランダムウォーク）
          - (iii) $X_t=0.5t+\varepsilon_t$（直線的に上がる傾向）
          - (iv) $X_t=A$（すべての時点で同じ値をとる）
        choices:
          - '(i) だけ'
          - '(i) と (iv)'
          - '(i)、(ii)、(iv)'
          - '(iii) だけ'
          - '(i)、(iii)、(iv)'
        answer: 1
        distractors:
          - (iv) は平均 0、分散一定、自己共分散も時点の差によらない（ただしエルゴード的ではない）
          - 正解
          - ランダムウォークは分散 tσ² が時点とともに増える
          - (iii) は平均が時点とともに変わる
          - 誤差の分散が一定でも、平均が変われば定常ではない
        explanation: |
          **方針** 弱定常とは、平均が一定で、自己共分散 $\mathrm{Cov}(X_t,X_{t+h})$ が時点 $t$ によらず時点の差 $h$ だけで決まること。

          **途中式**
          - (i) 平均 0。$\mathrm{Cov}(X_t,X_{t+h})=\sigma^2\{\cos\omega t\cos\omega(t+h)+\sin\omega t\sin\omega(t+h)\}=\sigma^2\cos\omega h$ で $h$ だけで決まる → 弱定常
          - (ii) $V[X_t]=t\sigma^2$ が $t$ とともに増える → 非定常
          - (iii) $E[X_t]=0.5t$ が変わる → 非定常
          - (iv) 平均 0、自己共分散はつねに $\sigma^2$ → 弱定常

          **答え** (i) と (iv)

          **間違えやすい点** (iv) は弱定常だが、1 本の系列をどれだけ長く観測しても $A$ の 1 つの値しか見えないので、時間平均が $E[X_t]=0$ に近づかない（エルゴード性がない）。
          (ii) と (iii) は、差分 $X_t-X_{t-1}$ をとると定常になる。
      - id: s26p13b
        chapter: 22
        terms: [principal-component-analysis, pca-on-correlation-matrix, correlation-matrix]
        topic: 単位の違う吸気温度とファン回転率の主成分分析を分散共分散行列と相関行列で行い第1主成分の向きと寄与率が尺度で大きく変わることを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          吸気温度（℃）とファンの回転率（割合）の分散共分散行列は
          $$S=\begin{pmatrix}«v1»&«c»\\«c»&«v2»\end{pmatrix}$$
          だった。分散共分散行列による主成分分析と、相関行列による主成分分析の結果の組として正しいものはどれか。
        choices:
          - '分散共分散行列でも相関行列でも、第 1 主成分は $(1,1)/\sqrt2$ の向きで寄与率 «pr»'
          - '分散共分散行列：第 1 主成分は $(1,1)/\sqrt2$ の向きで寄与率約 «pc»。相関行列：寄与率 «pr»'
          - '分散共分散行列：寄与率は約 «pc»。相関行列（相関係数 «r»）：第 1 主成分の寄与率は «w_r»'
          - '相関係数が «r» と高いので、どちらの方法でも 2 つの変数に同じ重みがかかる'
          - '分散共分散行列：第 1 主成分はほぼ吸気温度だけの向きで寄与率は約 «pc»。相関行列（相関係数 «r»）：第 1 主成分は $(1,1)/\sqrt2$ の向きで寄与率 «pr»'
        answer: 4
        distractors:
          - 分散共分散行列では、分散の大きい変数が主成分をほぼ決める
          - 分散共分散行列の第 1 主成分は分散の大きい吸気温度の向きに寄る
          - 相関行列の固有値は 1±r で、寄与率は (1+r)/2
          - 尺度の違いがあると、相関が高くても分散の大きい変数に重みが偏る
          - 正解
        explanation: |
          **方針** 2 変数の固有値は、固有方程式 $\lambda^2-(\text{トレース})\lambda+(\text{行列式})=0$ から求める。相関行列では固有値が $1\pm r$、固有ベクトルが $(1,\pm1)/\sqrt2$ になる。

          **途中式**
          - 分散共分散行列：$\lambda^2-«tr»\lambda+«det»=0$ より $\lambda_1=«lam1»$、$\lambda_2=«lam2»$。寄与率 $«lam1»/«tr»=«pc»$。固有ベクトルは $(«e11»,\ «e12»)$ で、ほぼ吸気温度の向き
          - 相関行列：$r=«c»/\sqrt{«v1»\times«v2»}=«r»$、$\lambda=1\pm«r»$、寄与率 $(1+«r»)/2=«pr»$

          **答え** 分散共分散行列では吸気温度の向きで寄与率約 «pc»、相関行列では $(1,1)/\sqrt2$ で寄与率 «pr»

          **間違えやすい点** 分散共分散行列による主成分分析は、単位の取り方（℃ か ℉ か、割合か % か）で結果が変わる。単位の違う変数を扱うときは、標準化（相関行列による分析）を考える。
          寄与率 «pc» は「温度の分散が大きい」ことを示すだけで、2 つの指標の関係の強さを示しているわけではない。
      - id: s26p13c
        chapter: 23
        terms: [support-vector-machine, misclassification-rate, linear-discriminant-analysis]
        topic: 線形ソフトマージンのサポートベクターマシンで各点のy(w'x+b)からサポートベクターとヒンジ損失の合計を求めマージンの幅を出す
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの監視指標 $(x_1,x_2)$ で異常（$y=+1$）と正常（$y=-1$）を分ける線形のソフトマージン・サポートベクターマシンを学習し、$f(\boldsymbol x)=«w1»x_1«w2s»x_2«bs»$ が得られた（$f>0$ なら異常と判定）。学習データの一部は次のとおり。

          | 点 | P1 | P2 | P3 | P4 | P5 |
          |---|---|---|---|---|---|
          | $(x_1,x_2)$ | (1, 0) | (2, 1) | (0, 0) | (0.5, 0.5) | (1, 2) |
          | $y$ | +1 | +1 | −1 | −1 | +1 |

          この 5 点について、サポートベクター（$y_if(\boldsymbol x_i)\le1$ の点）と、ヒンジ損失 $\max\{0,\ 1-y_if(\boldsymbol x_i)\}$ の合計、マージンの幅 $2/\|\boldsymbol w\|$ の組として正しいものはどれか。$\sqrt5=2.236$ とする。
        choices:
          - 'サポートベクターは P1・P3・P4・P5、ヒンジ損失の合計 «hinge»、マージンの幅 «mw»'
          - 'サポートベクターは P1・P3 だけ、ヒンジ損失の合計 0、マージンの幅 «mw»'
          - 'サポートベクターは P1・P3・P4・P5、ヒンジ損失の合計 «hinge»、マージンの幅 «w_mw»'
          - 'サポートベクターは P4・P5 だけ、ヒンジ損失の合計 «hinge»、マージンの幅 «mw»'
          - 'サポートベクターは P1・P2・P3・P4・P5（すべての点）、ヒンジ損失の合計 «w_all»、マージンの幅 «mw»'
        answer: 0
        distractors:
          - 正解
          - マージンの内側の点や誤分類の点も、境界を決めるサポートベクターになる
          - マージンの幅は 2/‖w‖（1/‖w‖ は片側）
          - マージンちょうどの上の点（y f=1）もサポートベクター
          - y f>1 の点（P2）は損失 0（1−yf は負でも損失は 0）で、境界に影響しない
        explanation: |
          **方針** 各点で $y_if(\boldsymbol x_i)$ を計算する。1 より大きい点は損失 0 で境界に影響しない。1 ちょうどの点はマージン上、1 未満の点はマージンの内側か誤分類で、損失 $1-y_if$ を生む。

          **途中式**
          | 点 | $f$ | $yf$ | 損失 |
          |---|---|---|---|
          | P1 | «f1» | «m1» | «l1» |
          | P2 | «f2» | «m2» | «l2» |
          | P3 | «f3» | «m3» | «l3» |
          | P4 | «f4» | «m4» | «l4» |
          | P5 | «f5» | «m5» | «l5» |

          損失の合計 «hinge»。$\|\boldsymbol w\|=\sqrt{2^2+1^2}=\sqrt5$、マージンの幅 $2/\sqrt5=«mw»$。

          **答え** サポートベクターは P1・P3・P4・P5、損失の合計 «hinge»、幅 «mw»

          **間違えやすい点** P4 は正しく正常と判定されているが、マージンの内側にあるので損失 0.5 を生む。P5 は誤分類（$yf<0$）。
          ソフトマージンでは「マージンの幅を広げること」と「損失を小さくすること」の兼ね合いを、正則化の係数で調整する。
  - id: s26p14
    title: 不正ログインの分析
    context: |
      ある企業のセキュリティ部門は、社外からのログインの記録を分析している。小問ごとに別のデータを扱う。
    items:
      - id: s26p14a
        chapter: 24
        terms: [similarity-measures, distance-measures, standardization-before-clustering]
        topic: 国という質的変数と転送量と失敗回数という量的変数が混ざった2件のログインの類似度をガワーの類似度で範囲で割って求める
        level: 基本
        definition: false
        type: numeric
        question: |
          2 件のログイン A・B を、質的変数と量的変数が混ざった次の 3 つの変数で比べる。

          | 変数 | A | B | データ全体での範囲（最大 − 最小） |
          |---|---|---|---|
          | 接続元の国 | 日本 | 日本 | − |
          | 転送量（GB） | «ga» | «gb» | «rg» |
          | 失敗回数 | «fa» | «fb» | «rf» |

          質的変数は一致すれば 1、一致しなければ 0、量的変数は $1-|$差$|/$範囲 を変数ごとの類似度とし、3 つの平均をとるガワーの類似度を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 単位の違う量的変数は範囲で割って 0〜1 にそろえ、質的変数は一致・不一致で 1・0 とする。それらを平均する。

          **途中式**
          - 国：一致して 1
          - 転送量：$1-|«ga»-«gb»|/«rg»=«sg»$
          - 失敗回数：$1-|«fa»-«fb»|/«rf»=«sf»$
          - 平均：$(1+«sg»+«sf»)/3=«ans4»$

          **答え** $«ans_s»$

          **間違えやすい点** 範囲で割らずに差をそのまま使うと、単位の大きい変数が類似度を支配する。距離として使うときは $1-$（類似度）とする。
          ガワーの類似度は、質的変数と量的変数が混ざったデータのクラスター分析で使われる。
      - id: s26p14b
        chapter: 33
        terms: [causal-effect, backdoor-criterion, d-separation]
        topic: 危険なサーバほど優先して修正パッチを当てたとき潜在的な結果の表から平均処置効果と処置群の効果を求め単純な比較の差が選択の偏りを含むことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          6 台のサーバについて、修正パッチを当てた場合と当てなかった場合の 1 か月のインシデント件数（潜在的な結果）$Y(1)$、$Y(0)$ が、仮にすべてわかっているとする。実際には、攻撃を受けやすいサーバ 1〜3 にだけパッチを当てた（$T=1$）。

          | サーバ | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $Y(1)$ | «y1» |
          | $Y(0)$ | «y0» |
          | $T$ | 1 | 1 | 1 | 0 | 0 | 0 |

          平均処置効果（ATE）、処置群での平均処置効果（ATT）、実際に観測できる単純な比較 $E[Y\mid T=1]-E[Y\mid T=0]$ の組として正しいものはどれか。
        choices:
          - 'ATE $=«ate»$、ATT $=«att»$、単純な比較 $=«naive»$（パッチを当てたサーバの方が件数が多く見える）'
          - 'ATE $=«att»$、ATT $=«ate»$、単純な比較 $=«naive»$'
          - 'ATE $=«ate»$、ATT $=«att»$、単純な比較 $=«ate»$（無作為でなくても単純な比較は ATE に等しい）'
          - 'ATE $=«ate»$、ATT $=«att»$、単純な比較 $=«w_naive»$'
          - 'パッチを当てたサーバの方が件数が多いので、パッチはインシデントを増やす効果がある'
        answer: 0
        distractors:
          - 正解
          - ATE は 6 台全体、ATT はパッチを当てた 3 台での平均
          - 当てる台を選んだので、単純な比較には選択の偏りが入る
          - パッチを当てたサーバの Y(0) を使った（観測できない値）
          - 単純な比較は ATT に選択の偏り（もともとの件数の差）を加えたもの
        explanation: |
          **方針** ATE は全員の $Y(1)-Y(0)$ の平均、ATT は $T=1$ の台だけの平均。観測できるのは $T=1$ の台の $Y(1)$ と $T=0$ の台の $Y(0)$ だけ。

          **途中式**
          - $Y(1)-Y(0)$：«diff»。ATE $=«sdiff»/6=«ate»$、ATT $=\{(«d1»)+(«d2»)+(«d3»)\}/3=«att»$
          - 単純な比較：$(«a1»+«a2»+«a3»)/3-(«b4»+«b5»+«b6»)/3=«m1»-«m0»=«naive»$
          - 分解：単純な比較 $=$ ATT $+\{E[Y(0)\mid T=1]-E[Y(0)\mid T=0]\}=«att»+«sel»=«naive»$

          **答え** ATE $=«ate»$、ATT $=«att»$、単純な比較 $=«naive»$

          **間違えやすい点** パッチは件数を減らしている（ATE は負）のに、危険なサーバを選んで当てたため、単純な比較では逆向きに見える。この差 «sel» が選択の偏り（交絡）である。
          攻撃の受けやすさを測って調整する（バックドア調整）か、当てるサーバを無作為に選べば、偏りを取り除ける。
