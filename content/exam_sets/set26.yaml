set: 26
title: 模擬試験 第26回
minutes: 90
problems:
  - id: s26p01
    title: データセンター間の冗長経路
    context: |
      データセンター S から T へは、中継拠点 A と B を経由する 5 本の回線でつながっている。回線は S–A、S–B、A–T、B–T と、A と B を結ぶ連絡回線 A–B である。
      回線はどちら向きにも使え、ある時刻にそれぞれの回線が使える確率は次のとおりで、回線どうしは互いに独立に故障するとする。

      | 回線 | S–A | S–B | A–T | B–T | A–B |
      |---|---|---|---|---|---|
      | 使える確率 | «p1» | «p2» | «p3» | «p4» | «p5» |
    items:
      - id: s26p01a
        chapter: 1
        terms: [law-of-total-probability, independence-of-events, conditional-probability]
        topic: 連絡回線をもつブリッジ型ネットワークでSからTへ通信できる確率を連絡回線の状態で場合分けして全確率の公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          使える回線だけをたどって S から T へ到達できる確率を求めよ。
        answer: «rel»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 連絡回線 A–B があるため、単純な直列・並列の組み合わせにならない（ブリッジ型）。A–B が使えるか使えないかで場合分けし、全確率の公式
          $P(\text{到達})=P(\text{到達}\mid \text{A–B 可})P(\text{A–B 可})+P(\text{到達}\mid \text{A–B 不可})P(\text{A–B 不可})$ を使う。

          **途中式**
          A–B が使えるとき、A と B は 1 つの拠点とみなせる。S からその拠点へは S–A と S–B の並列、そこから T へは A–T と B–T の並列なので
          $$\{1-«q1»\times«q2»\}\times\{1-«q3»\times«q4»\}=«sa»\times«at»=«up»$$
          A–B が使えないとき、経路は S–A–T（確率 $«p1»\times«p3»=«path1»$）と S–B–T（確率 $«p2»\times«p4»=«path2»$）の並列なので
          $$1-«fail1»\times«fail2»=«down»$$
          よって
          $$P=«p5»\times«up»+«q5»\times«down»=«t_up»+«t_down»=«rel5»$$

          **答え** $«rel_s»$

          **間違えやすい点** 連絡回線を無視して 2 経路の並列とすると $«w_down»$、連絡回線が常に使えるとみなすと $«w_up»$ になる。
          また 4 本の経路（S–A–T、S–B–T、S–A–B–T、S–B–A–T）の確率を足し合わせると、経路が回線を共有しているため重複して数え、1 を超えることさえある。

  - id: s26p02
    title: Web API の応答時間
    context: |
      ある Web API の応答時間 $X$（ミリ秒）について、対数をとった値 $\ln X$ が正規分布に従うかを調べたい。
      «n» 件の応答時間の対数 $\ln X_1,\ldots,\ln X_{«n»}$ から求めた標本歪度は $S=«sk»$、標本尖度は $K=«ku»$ だった（尖度は正規分布で 3 になる定義）。
    items:
      - id: s26p02a
        chapter: 11
        terms: [normality-test, skewness-kurtosis, chi-squared-distribution]
        topic: 応答時間の対数の標本歪度と標本尖度からジャック・ベラ統計量を求め正規性を判定する
        level: 基本
        definition: false
        type: choice
        question: |
          ジャック・ベラ統計量
          $$JB=\frac{n}{6}\left\{S^2+\frac{(K-3)^2}{4}\right\}$$
          は、正規分布の帰無仮説のもとで近似的に自由度 2 のカイ二乗分布に従う。$JB$ の値と、有意水準 5% での結論の組として正しいものはどれか。
          自由度 2 のカイ二乗分布の上側 5% 点は «c2»、自由度 1 の上側 5% 点は «c1» である。
        choices:
          - '$JB=«jb_ex»$ で、正規性は棄却される'
          - '$JB=«jb_no4»$ で、正規性は棄却されない'
          - '$JB=«jb»$ で、正規性は棄却されない'
          - '$JB=«jb_no6»$ で、正規性は棄却される'
          - '$JB=«jb_24»$ で、正規性は棄却されない'
        answer: 2
        distractors:
          - 尖度 3.30 を超過尖度（正規分布で 0）とみなし K−3 の代わりに K を使った
          - (K−3)² を 4 で割り忘れた
          - 正解
          - n/6 の 6 で割り忘れた
          - 係数を n/6 ではなく n/24 にした
        explanation: |
          **方針** 歪度は正規分布で 0、尖度は 3 なので、$S$ と $K-3$ がともに 0 から離れるほど $JB$ が大きくなる。式に代入して自由度 2 のカイ二乗分布の上側 5% 点と比べる。

          **途中式**
          $$S^2=«sk»^2=«t1»,\qquad \frac{(K-3)^2}{4}=\frac{«kum3»^2}{4}=«t2»$$
          $$JB=\frac{«n»}{6}\times(«t1»+«t2»)=«n6»\times«tsum»=«jb»$$
          $«jb»<«c2»$ なので、有意水準 5% で正規性の帰無仮説は棄却されない。

          **答え** $JB=«jb»$ で、正規性は棄却されない（対数正規分布のモデルと矛盾しない）。

          **間違えやすい点** 尖度の定義に注意する。ここでは正規分布で 3 になる定義なので $K-3$ を使う。$K$ をそのまま使うと $«jb_ex»$ になり、誤って棄却してしまう。
          $(K-3)^2$ を 4 で割り忘れると $«jb_no4»$、$n/6$ の 6 で割り忘れると $«jb_no6»$ になる。比べる分布は歪度と尖度の 2 つの項の和なので自由度 2（«c2»）であり、自由度 1 の «c1» ではない。

      - id: s26p02b
        chapter: 6
        terms: [lognormal-distribution, normal-distribution, standard-normal-distribution]
        topic: 対数正規分布の平均と中央値の比から対数の分散を求め応答時間が閾値を超える割合を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $\ln X\sim N(\mu,\sigma^2)$ とし、応答時間の中央値は «med» ミリ秒、平均は «mean» ミリ秒であることがわかっている。
          応答時間が «thr» ミリ秒を超える確率 $P(X>«thr»)$ に最も近い値はどれか。必要なら $\ln«ratio»=«ln125»$、$\ln2.5=«ln25»$、$\ln2=«ln2»$ と、次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 0.68 | 1.04 | 1.37 | 1.94 | 2.05 |
          |---|---|---|---|---|---|
          | $\Phi(z)$ | «pA» | «pB» | «pC» | «pD» | «pE» |
        choices:
          - "$«w_var»$"
          - "$«w_half»$"
          - "$«pr3»$"
          - "$«w_mean»$"
          - "$«w_low»$"
        answer: 2
        distractors:
          - 標準偏差 σ の代わりに分散 σ² で割って標準化した
          - 平均と中央値の比の対数を σ² とし、2 倍し忘れた
          - 正解
          - 中心を中央値ではなく平均 100 にして ln(200/100) で標準化した
          - 上側確率ではなく P(X≦200) を答えた
        explanation: |
          **方針** 対数正規分布では、中央値 $=e^{\mu}$、平均 $=e^{\mu+\sigma^2/2}$。平均と中央値の比から $\sigma^2$ がわかる。$P(X>«thr»)=P(\ln X>\ln«thr»)$ を標準化する。

          **途中式**
          $$\frac{\text{平均}}{\text{中央値}}=e^{\sigma^2/2}=\frac{«mean»}{«med»}=«ratio»\quad\Rightarrow\quad \sigma^2=2\ln«ratio»=2\times«ln125»=«sig2»,\qquad \sigma=\sqrt{«sig2»}=«sig»$$
          $\mu=\ln«med»$ なので
          $$P(X>«thr»)=P\left(Z>\frac{\ln«thr»-\ln«med»}{\sigma}\right)=P\left(Z>\frac{\ln2.5}{«sig»}\right)=P\left(Z>\frac{«ln25»}{«sig»}\right)=P(Z>«z»)$$
          ここで $«ln25»/«sig»=«zraw»\cdots\approx«z»$。
          $$P(X>«thr»)=1-\Phi(«z»)=1-«phi_z»=«pr»$$

          **答え** $«pr3»$

          **間違えやすい点** 分散 $«sig2»$ で割ると $z=«z_var»$ で $«w_var»$、$\sigma^2=\ln«ratio»$ と 2 倍し忘れると $\sigma=«sig_half»$、$z=«z_half»$ で $«w_half»$ になる。
          対数正規分布は右に裾が長いので、平均（«mean»）は中央値（«med»）より大きい。$\ln X$ の平均 $\mu$ に対応するのは中央値 $e^\mu$ であり、平均 «mean» を中心にして $\ln(«thr»/«mean»)$ で標準化すると $z=«z_mean»$ で $«w_mean»$ になる。

  - id: s26p03
    title: パケットの往復時間
    context: |
      あるサーバまでのパケットの往復時間 $X$（ミリ秒）は、回線の物理的な距離で決まる最小遅延 $\theta$ と、混雑による待ち遅延 $Y$ の和 $X=\theta+Y$ で表せるとする。
      $Y$ は平均 $\beta$ の指数分布（密度 $\frac{1}{\beta}e^{-y/\beta}$、$y\ge0$）に従い、測定ごとに独立とする。
    items:
      - id: s26p03a
        chapter: 8
        terms: [maximum-likelihood-estimator, unbiased-estimator, mean-squared-error, order-statistics]
        topic: 最小遅延を位置母数とする指数分布で標本最小値の最尤推定量の偏りを補正し平均二乗誤差を比べる
        level: 標準
        definition: false
        type: choice
        question: |
          長期の観測から $\beta=«beta»$ が既知とする。«n» 回の測定の最小値は $x_{(1)}=«xmin»$ だった。
          $\theta$ の最尤推定量 $\hat\theta$ の偏りを補正した不偏推定量 $\tilde\theta$ の値と、平均二乗誤差の比 $\mathrm{MSE}(\hat\theta)/\mathrm{MSE}(\tilde\theta)$ の組として正しいものはどれか。
        choices:
          - '$\tilde\theta=«unb»$、比は 1'
          - '$\tilde\theta=«w_unb_beta»$、比は 2'
          - '$\tilde\theta=«unb»$、比は 2'
          - '$\tilde\theta=«w_unb_plus»$、比は 2'
          - '$\tilde\theta=«unb»$、比は 0.5'
        answer: 2
        distractors:
          - 偏りを無視し、分散が同じなので平均二乗誤差も等しいとした
          - 偏りを β/n ではなく β として引いた
          - 正解
          - 偏りの向きを逆にして β/n を足した
          - 平均二乗誤差の比を逆にした
        explanation: |
          **方針** 尤度は $\theta\le x_{(1)}$ の範囲で $\theta$ の増加関数になるので、最尤推定量は標本最小値 $\hat\theta=X_{(1)}$。指数分布の最小値の分布から偏りと分散を求める。

          **途中式**
          尤度は
          $$L(\theta)=\prod_{i=1}^{n}\frac{1}{\beta}e^{-(x_i-\theta)/\beta}=\beta^{-n}\exp\left(-\frac{\sum x_i-n\theta}{\beta}\right)\quad(\theta\le x_{(1)})$$
          で、$\theta$ が大きいほど大きいので $\hat\theta=x_{(1)}$。
          $Y_{(1)}=X_{(1)}-\theta$ は独立な指数分布 $n$ 個の最小値なので、平均 $\beta/n$ の指数分布に従う。よって
          $$E[\hat\theta]=\theta+\frac{\beta}{n}=\theta+«bias»,\qquad V[\hat\theta]=\left(\frac{\beta}{n}\right)^2=«var1»$$
          不偏推定量は $\tilde\theta=X_{(1)}-\beta/n=«xmin»-«bias»=«unb»$。
          $$\mathrm{MSE}(\hat\theta)=V+(\text{偏り})^2=«var1»+«bias2»=«mse_mle»,\qquad \mathrm{MSE}(\tilde\theta)=V[\tilde\theta]=«mse_unb»$$
          比は $«mse_mle»/«mse_unb»=2$。

          **答え** $\tilde\theta=«unb»$、比は 2

          **間違えやすい点** 最小値の平均は $\theta+\beta$ ではなく $\theta+\beta/n$（最小値の分布はレートが $n$ 倍の指数分布）。$\beta$ を引くと $«w_unb_beta»$ になる。
          $\hat\theta$ と $\tilde\theta$ は定数だけずれているので分散は同じだが、$\hat\theta$ には偏りがあるので平均二乗誤差は偏りの 2 乗の分だけ大きい。最小値は必ず $\theta$ 以上なので、偏りの補正は引く向きである。

      - id: s26p03b
        chapter: 10
        terms: [uniformly-most-powerful-test, power-function, monotone-likelihood-ratio, chi-squared-distribution]
        topic: 待ち遅延の指数分布の平均に対する一様最強力検定で検出力が0.9以上になる平均の範囲をカイ二乗分布の点から求める
        level: 応用
        definition: false
        type: choice
        question: |
          最小遅延 $\theta$ は既知となり、待ち遅延 $Y_i=X_i-\theta$ を直接得られるようになった。平常時は $\beta=«b0»$ である。
          混雑の検知のため、«m» 回の待ち遅延 $Y_1,\ldots,Y_{«m»}$ から $H_0:\beta=«b0»$ 対 $H_1:\beta>«b0»$ を有意水準 5% で検定する。
          $T=\sum Y_i$ について $2T/\beta$ は自由度 «df» のカイ二乗分布に従い、この検定の一様最強力検定は「$T\ge c$ なら棄却」の形になる。
          検出力が 0.90 以上になるのは $\beta$ がおよそいくつ以上のときか。最も近い値を選べ。
          自由度 «df» のカイ二乗分布の上側確率 $\alpha$ の点 $\chi^2_{«df»}(\alpha)$ は次のとおりである。

          | $\alpha$ | 0.95 | 0.90 | 0.10 | 0.05 | 0.025 |
          |---|---|---|---|---|---|
          | $\chi^2_{«df»}(\alpha)$ | «c95» | «c90» | «c10» | «c05» | «c025» |
        choices:
          - "$«winv»$"
          - "$«w10»$"
          - "$«beta1»$"
          - "$«w025»$"
          - "$«w95»$"
        answer: 2
        distractors:
          - 棄却限界と検出力の条件で使う点を逆にした（12.44/31.41 倍）
          - 棄却限界に上側 10% 点 28.41 を使った（有意水準と検出力の取り違え）
          - 正解
          - 片側検定なのに上側 2.5% 点 34.17 で棄却限界を作った
          - 検出力の条件に上側 95% 点 10.85 を使った（検出力 0.95 の条件）
        explanation: |
          **方針** 指数分布の尤度比 $L(\beta_1)/L(\beta_0)$（$\beta_1>\beta_0$）は $T$ の増加関数（単調尤度比）なので、$T$ が大きいとき棄却する検定が一様最強力になる。
          $H_0$ のもとの分布で棄却限界 $c$ を決め、そのあと $\beta$ の値ごとの棄却確率（検出力関数）を求める。

          **途中式**
          有意水準 5%：$P(T\ge c\mid \beta=«b0»)=P\left(\chi^2_{«df»}\ge \frac{2c}{«b0»}\right)=0.05$ より
          $$\frac{2c}{«b0»}=«c05»\quad\Rightarrow\quad c=«crit»$$
          検出力関数は
          $$\gamma(\beta)=P(T\ge c\mid\beta)=P\left(\chi^2_{«df»}\ge \frac{2c}{\beta}\right)$$
          で、$\beta$ の増加関数。$\gamma(\beta)\ge0.90$ となるのは $2c/\beta\le\chi^2_{«df»}(0.90)=«c90»$ のとき、つまり
          $$\beta\ge\frac{2c}{«c90»}=\frac{«b0»\times«c05»}{«c90»}=«beta1_4»\cdots$$

          **答え** $«beta1»$（平常時の約 2.5 倍の平均待ち遅延なら 90% 以上の確率で検知できる）

          **間違えやすい点** 検出力 0.90 の条件に使うのは「上側確率 0.90 の点」«c90» であり、上側 10% 点ではない。棄却限界は有意水準 5% の片側なので上側 5% 点 «c05» を使い、両側の 2.5% 点 «c025» を使うと $«w025»$ になる。
          $2T/\beta\sim\chi^2_{2n}$ の自由度は $2n=«df»$（$n$ ではない）。

  - id: s26p04
    title: サーバ間の時刻同期の誤差
    context: |
      データセンターのサーバは時刻同期プロトコルで基準時計に合わせているが、わずかな誤差（ミリ秒）が残る。
      2 種類の同期装置について、誤差の分布を次のようにモデル化した。
      - 装置 A：誤差 $X$ は区間 $(-1,\,2)$ の一様分布に従う。
      - 装置 B：1 回の同期ごとの誤差 $W$ は位置 0、尺度 $\gamma=«gam»$ のコーシー分布（密度 $f(w)=\dfrac{\gamma}{\pi(w^2+\gamma^2)}$、分布関数 $F(w)=\dfrac12+\dfrac1\pi\arctan\dfrac{w}{\gamma}$）に従い、同期ごとに独立とする。このコーシー分布の特性関数は $\varphi_W(t)=E[e^{itW}]=e^{-\gamma|t|}$ である。
    items:
      - id: s26p04a
        chapter: 4
        terms: [change-of-variables, uniform-distribution, probability-mass-and-density-function]
        topic: 一様分布に従う時刻ずれの2乗の密度関数を単調でない変換として2つの枝の寄与を足して求める
        level: 標準
        definition: false
        type: choice
        question: |
          装置 A の誤差の 2 乗 $V=X^2$（2 乗誤差）の密度関数 $g(v)$ として正しいものはどれか（示した範囲以外では 0）。
        choices:
          - '$g(v)=\dfrac{1}{6\sqrt v}\ (0<v<4)$'
          - '$g(v)=\dfrac{1}{3\sqrt v}\ (0<v<1),\quad g(v)=\dfrac{1}{6\sqrt v}\ (1\le v<4)$'
          - '$g(v)=\dfrac{1}{6\sqrt v}\ (0<v<1),\quad g(v)=\dfrac{1}{3\sqrt v}\ (1\le v<4)$'
          - '$g(v)=\dfrac{2}{3}\ (0<v<1),\quad g(v)=\dfrac{1}{3}\ (1\le v<4)$'
          - '$g(v)=\dfrac{1}{3\sqrt v}\ (0<v<4)$'
        answer: 1
        distractors:
          - 正の枝 x=√v だけを考え、負の枝の寄与を落とした
          - 正解
          - 2 つの枝が重なる範囲と正の枝だけの範囲を取り違えた
          - ヤコビアン |dx/dv| を掛け忘れた（全体で積分しても 1 にならない）
          - 0<v<4 の全体で 2 つの枝があるとみなした
        explanation: |
          **方針** $v=x^2$ は単調でないので、$v$ に対応する $x=\pm\sqrt v$ の 2 つの枝それぞれで「密度 × ヤコビアン」を求めて足す。$X$ の範囲が $(-1,2)$ と左右非対称なので、負の枝 $x=-\sqrt v$ は $\sqrt v<1$、つまり $v<1$ のときだけ存在する。

          **途中式** $X$ の密度は $f(x)=1/3$（$-1<x<2$）。各枝で $|dx/dv|=\dfrac{1}{2\sqrt v}$。
          - $0<v<1$：$x=\sqrt v$ と $x=-\sqrt v$ の両方が範囲内なので
          $$g(v)=\frac13\cdot\frac{1}{2\sqrt v}+\frac13\cdot\frac{1}{2\sqrt v}=\frac{1}{3\sqrt v}$$
          - $1\le v<4$：$x=\sqrt v\in[1,2)$ だけが範囲内なので
          $$g(v)=\frac13\cdot\frac{1}{2\sqrt v}=\frac{1}{6\sqrt v}$$
          確認：$\displaystyle\int_0^1\frac{dv}{3\sqrt v}+\int_1^4\frac{dv}{6\sqrt v}=\frac23+\frac13(2-1)=1$。

          **答え** $g(v)=\dfrac{1}{3\sqrt v}\ (0<v<1)$、$g(v)=\dfrac{1}{6\sqrt v}\ (1\le v<4)$

          **間違えやすい点** 正の枝だけで $1/(6\sqrt v)$ とすると全体の積分は $2/3$ にしかならない。逆に全範囲で 2 つの枝を足すと積分は $4/3$ になる。
          ヤコビアンを掛け忘れた $2/3,\ 1/3$ は積分すると $2/3+1=5/3$ で密度になっていない。密度の候補は、積分して 1 になるかで確かめられる。

      - id: s26p04b
        chapter: 2
        terms: [characteristic-function, cauchy-distribution, central-limit-theorem]
        topic: 特性関数から独立なコーシー分布の標本平均が元と同じ分布になることを示し平均した時刻誤差が閾値を超える確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          装置 B で «n» 回同期した誤差の平均 $\bar W=\frac{1}{«n»}\sum_{j=1}^{«n»}W_j$ を使って時刻を補正する。
          $|\bar W|>«thr»$ ミリ秒となる確率に最も近い値はどれか。必要なら $\pi=«pi»$ と次の値を使え。

          | $u$ | 0.5 | 2 | 8 | 32 |
          |---|---|---|---|---|
          | $\arctan u$ | «at05» | «at2» | «at8» | «at32» |
        choices:
          - "$«w_clt»$"
          - "$«w_n»$"
          - "$«w_one»$"
          - "$«ok»$"
          - "$«w_inv»$"
        answer: 3
        distractors:
          - 中心極限定理のように尺度が γ/√n=0.125 に縮むとした
          - 分散のように尺度が γ/n に縮むとした
          - 片側 P(W̄>1) だけを答えた
          - 正解
          - arctan(x/γ) を arctan(γ/x) と取り違えた
        explanation: |
          **方針** 独立な確率変数の和の特性関数は各特性関数の積、$aW$ の特性関数は $\varphi_W(at)$。これで $\bar W$ の特性関数を求め、特性関数が分布を一意に決めることから $\bar W$ の分布を特定する。

          **途中式**
          $$\varphi_{\bar W}(t)=E\left[e^{it\sum W_j/n}\right]=\prod_{j=1}^{n}\varphi_W\left(\frac tn\right)=\left(e^{-\gamma|t|/n}\right)^n=e^{-\gamma|t|}$$
          これは $W$ と同じ特性関数なので、$\bar W$ も尺度 $\gamma=«gam»$ のコーシー分布に従う（平均しても広がりは縮まない）。
          $$P(|\bar W|>«thr»)=2\{1-F(«thr»)\}=1-\frac2\pi\arctan\frac{«thr»}{«gam»}=1-\frac{2\times«at2»}{«pi»}=1-«two_over_pi»=«ok4»$$

          **答え** $«ok»$

          **間違えやすい点** コーシー分布には平均も分散もないので、大数の法則も中心極限定理も成り立たない。尺度が $\gamma/\sqrt n=«sc_clt»$ に縮むと考えると $«w_clt»$、$\gamma/n$ に縮むと考えると $«w_n»$ と、誤差を大きく過小評価する。
          「$|\bar W|>«thr»$」は両側なので、片側の確率 $«w_one»$ を 2 倍する。

  - id: s26p05
    title: DDoS 攻撃のトラフィック
    context: |
      ある事業者のネットワークには、DDoS 攻撃のバースト（短時間に集中する大量の通信）が 1 分あたり平均 «lam» 回のポアソン過程に従って到着する。
      各バーストのデータ量 $S$（GB）は互いに独立で、到着とも独立に、次の分布関数のパレート分布に従う。
      $$F(s)=1-\left(\frac{«xm»}{s}\right)^{«alpha»}\quad(s\ge«xm»)$$
    items:
      - id: s26p05a
        chapter: 32
        terms: [inverse-transform-sampling, uniform-random-number]
        topic: パレート分布に従うバーストのデータ量を逆関数法で一様乱数から発生させる
        level: 基本
        definition: false
        type: choice
        question: |
          攻撃のシミュレーションで、区間 $(0,1)$ の一様乱数 $u$ から逆関数法 $s=F^{-1}(u)$ でバーストのデータ量を作る。$u=«u»$ のときの $s$ はどれか。
        choices:
          - "$«x_u»$"
          - "$«x_root»$"
          - "$«x»$"
          - "$«x_noxm»$"
          - "$«x_pow»$"
        answer: 2
        distractors:
          - 1−u の代わりに u を代入した
          - 指数の符号を取り違えて (1−u)^{1/3} を掛けた
          - 正解
          - 下限 0.4 を掛け忘れた
          - 指数 −1/3 を −3 とした
        explanation: |
          **方針** $u=F(s)$ を $s$ について解いた $F^{-1}(u)$ に一様乱数を代入すると、分布関数 $F$ に従う乱数が得られる。

          **途中式**
          $$u=1-\left(\frac{«xm»}{s}\right)^{«alpha»}\ \Rightarrow\ \left(\frac{«xm»}{s}\right)^{«alpha»}=1-u\ \Rightarrow\ s=F^{-1}(u)=«xm»\,(1-u)^{-1/«alpha»}$$
          $u=«u»$ のとき $1-u=«omu»=(1/«cube»)^{3}$ なので $(1-u)^{-1/3}=«cube»$。
          $$s=«xm»\times«cube»=«x»$$

          **答え** $«x»$（GB）

          **間違えやすい点** $1-u$ と $u$ を取り違えると $«x_u»$ になる（$1-U$ も一様分布なので $«xm»\,u^{-1/3}$ も正しい乱数の作り方だが、ここで指定した $F^{-1}(u)$ の値ではない）。
          $s$ は下限 «xm» 以上の値をとるので、«x_root» のように下限を下回る値は誤りとすぐわかる。

      - id: s26p05b
        chapter: 15
        terms: [compound-poisson-process, poisson-process, moments]
        topic: ポアソン過程で到着するバーストのデータ量がパレート分布のとき一定時間の総データ量の標準偏差を複合ポアソン過程で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          «t» 分間に到着するバーストの総データ量 $Z=\sum_{k=1}^{N(«t»)}S_k$（$N(«t»)$ はその間のバースト数）の**標準偏差**（GB）を求めよ。
        answer: «sd»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $Z$ は複合ポアソン過程。件数 $N\sim\mathrm{Po}(\lambda t)$ で条件づけた全分散の公式から $V[Z]=\lambda t\,E[S^2]$（$V[S]$ ではなく 2 次モーメント）となる。$E[S^2]$ はパレート分布の密度を積分して求める。

          **途中式**
          密度は $f(s)=«alpha»\cdot«xm»^{«alpha»}s^{-«alpha»-1}$（$s\ge«xm»$）。
          $$E[S]=\int_{«xm»}^{\infty}s f(s)\,ds=\frac{«alpha»\times«xm»}{«alpha»-1}=«es»,\qquad E[S^2]=\int_{«xm»}^{\infty}s^2 f(s)\,ds=\frac{«alpha»\times«xm»^2}{«alpha»-2}=«alpha»\times«xm2»=«es2»$$
          $\lambda t=«lam»\times«t»=«lt»$ なので
          $$V[Z]=E[N]V[S]+V[N]\{E[S]\}^2=\lambda t\,(V[S]+\{E[S]\}^2)=\lambda t\,E[S^2]=«lt»\times«es2»=«var»$$
          $$\sqrt{«var»}=«sd4»\cdots$$

          **答え** $«sd»$（GB。平均は $\lambda t\,E[S]=«mean»$ GB）

          **間違えやすい点** $V[S]=«es2»-«es_sq»=«vs»$ だけを使って $\lambda t\,V[S]=«w_vsvar»$ とすると、件数のばらつきの寄与 $V[N]\{E[S]\}^2$ を落として $«w_vs»$ になる。ポアソン分布では $V[N]=E[N]$ なので、2 つの項がまとまって $E[S^2]$ になる。
          パレート分布の 2 次モーメントは $\alpha>2$ のときだけ有限で、$\alpha\le2$ なら総データ量の分散は存在しない。

      - id: s26p05c
        chapter: 7
        terms: [convergence-in-probability, convergence-in-mean-square, convergence-in-distribution]
        topic: 確率1/nで規模nの値をとる系列が0に確率収束するが平均二乗収束しないことを期待値の計算で見分ける
        level: 標準
        definition: false
        type: choice
        question: |
          観測期間を延ばしていくときの「まれだが巨大なバースト」を単純化して、確率変数の列 $Z_n$（$n=1,2,\ldots$）を
          $$P(Z_n=n)=\frac1n,\qquad P(Z_n=0)=1-\frac1n$$
          で定める。$n\to\infty$ のときの $Z_n$ のふるまいについて、正しいものはどれか。
        choices:
          - '$E[Z_n]\to0$ となるので、$Z_n$ は 0 に確率収束する'
          - '$Z_n$ は 0 に確率収束するが、0 に平均二乗収束しない'
          - '$Z_n$ は 0 に平均二乗収束し、したがって 0 に確率収束する'
          - '$E[Z_n]=1$ が $n$ によらず一定なので、$Z_n$ は 0 に確率収束しない'
          - '$Z_n$ は 0 に確率収束するが、0 に分布収束しない'
        answer: 1
        distractors:
          - E[Z_n]=n×(1/n)=1 であり 0 に近づかない
          - 正解
          - E[Z_n^2]=n→∞ なので平均二乗収束しない
          - 期待値が一定でも、0 と異なる値をとる確率 1/n→0 なので確率収束する
          - 確率収束すれば分布収束もする
        explanation: |
          **方針** 確率収束は「任意の $\varepsilon>0$ で $P(|Z_n-0|>\varepsilon)\to0$」、平均二乗収束は「$E[(Z_n-0)^2]\to0$」。それぞれを直接計算する。

          **途中式**
          任意の $\varepsilon>0$ について、$n>\varepsilon$ なら
          $$P(|Z_n|>\varepsilon)=P(Z_n=n)=\frac1n\to0$$
          なので 0 に確率収束する。一方
          $$E[Z_n]=n\cdot\frac1n=1,\qquad E[Z_n^2]=n^2\cdot\frac1n=n\to\infty$$
          なので平均二乗収束しない（期待値さえ 0 に近づかない）。確率収束は分布収束を導くので、$Z_n$ は 0 に分布収束もする。

          **答え** $Z_n$ は 0 に確率収束するが、0 に平均二乗収束しない。

          **間違えやすい点** 「平均二乗収束 ⇒ 確率収束 ⇒ 分布収束」は成り立つが、逆は成り立たない。
          この例のように、まれに起きる巨大な値は確率収束には影響しないが、期待値や 2 次モーメントを支配する。$E[Z_n]$ が 0 に近づかないからといって確率収束しないとはいえない。

  - id: s26p06
    title: バックアップデータの転送速度
    context: |
      夜間のバックアップで、3 つのデータを順に別の拠点へ転送した。それぞれのデータ量と、転送中の速度（一定とみなす）は次のとおりである。

      | データ | 1 | 2 | 3 |
      |---|---|---|---|
      | データ量（GB） | «a1» | «a2» | «a3» |
      | 速度（GB/分） | «v1» | «v2» | «v3» |
    items:
      - id: s26p06a
        chapter: 3
        terms: [weighted-geometric-harmonic-mean]
        topic: 量の異なるデータを速度の異なる回線で転送したときの全体の平均転送速度を加重調和平均で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          3 つのデータ全体の平均転送速度（総データ量 ÷ 総転送時間、GB/分）を求めよ。
        answer: «hm»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 速度はデータ量あたりの「時間の逆数」なので、データ量を重みとした**加重調和平均**が全体の平均速度になる。総データ量を総時間で割っても同じ。

          **途中式** 各データの転送時間は
          $$\frac{«a1»}{«v1»}=«t1»,\qquad \frac{«a2»}{«v2»}=«t2»,\qquad \frac{«a3»}{«v3»}=«t3»\quad(\text{分})$$
          $$\text{平均速度}=\frac{«a1»+«a2»+«a3»}{«t1»+«t2»+«t3»}=\frac{«tot»}{«ttot»}=«hm4»\cdots$$
          これは加重調和平均 $\dfrac{\sum w_i}{\sum w_i/v_i}$（$w_i$ はデータ量）そのものである。

          **答え** $«hm»$（GB/分）

          **間違えやすい点** 速度の単純な算術平均 $«am»$ や、データ量で重み付けた算術平均 $«wam»$ は、遅い区間ほど時間が長くかかることを無視している。
          重みを付けない調和平均 $«uhm»$ は、3 つのデータ量が等しいときの平均速度であり、ここでは使えない。

  - id: s26p07
    title: 暗号ライブラリの処理時間
    context: |
      TLS のハンドシェイクにかかる時間（ミリ秒）を、2 つの暗号ライブラリ L と M で 6 回ずつ測定した。測定値を小さい順に並べると次のとおりである。
      - L：$«L»$
      - M：$«M»$
    items:
      - id: s26p07a
        chapter: 13
        terms: [kolmogorov-smirnov-two-sample, nonparametric-methods-overview]
        topic: 2つの暗号ライブラリの処理時間の経験分布関数の差の最大値から2標本コルモゴロフ・スミルノフ統計量を求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの分布が等しいかを、2 標本コルモゴロフ・スミルノフ検定で調べる。統計量 $D=\max_x|\hat F_L(x)-\hat F_M(x)|$（$\hat F$ は経験分布関数）の値と、
          両側有意水準 5% での結論の組として正しいものはどれか。各群 6 個のとき、正確な分布から求めた棄却域は $D\ge«dcrit»$ である。
        choices:
          - '$D=«D_neg»$ で、棄却されない'
          - '$D=«D_M»$ で、棄却されない'
          - '$D=«med_diff»$ で、棄却されない'
          - '$D=«D»$ で、棄却されない'
          - '$D=«D_cnt»$ で、棄却される'
        answer: 3
        distractors:
          - 絶対値をとらずに F_M−F_L の最大値を求めた
          - M の観測値の位置だけで差を比べ、L の観測値の位置を見落とした
          - 2 群の中央値の差（ミリ秒）を統計量と取り違えた
          - 正解
          - 経験分布関数を割合でなく個数のまま比べた
        explanation: |
          **方針** 経験分布関数は各観測値の位置で $1/6$ ずつ上がる階段関数。2 群をまとめて小さい順に並べ、各観測値の位置で $\hat F_L$ と $\hat F_M$ の差を調べて、その絶対値の最大を求める。

          **途中式** 合わせた順に、(値, $\hat F_L$, $\hat F_M$, 差) を並べると
          | 値 | «tab_v» |
          |---|---|---|---|---|---|---|---|---|---|---|---|---|
          | $6\hat F_L$ | «tab_L» |
          | $6\hat F_M$ | «tab_M» |
          | $6\lvert\hat F_L-\hat F_M\rvert$ | «tab_d» |

          差の最大は $«D_cnt»/6$ なので $D=«D»$。$«D»<«dcrit»\approx«dcrit_d»$ なので棄却されない（正確な $p$ 値は約 «pval»）。

          **答え** $D=«D»$ で、棄却されない

          **間違えやすい点** 経験分布関数は L と M の**両方**の観測値の位置で変わるので、片方の群の観測値の位置だけを見ると最大値を見落とす（M の位置だけなら «D_M»）。
          $D$ は割合（0 から 1）の差であり、個数のまま 3 とすると棄却域と比べられない。各群 6 個と小さいので、近似ではなく正確な分布による棄却域を使う。

      - id: s26p07b
        chapter: 9
        terms: [ci-two-sample-mean-difference, pooled-variance, t-distribution]
        topic: 2つの暗号ライブラリの平均処理時間の差の95%信頼区間をプールした分散とt分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          2 つのライブラリの処理時間はそれぞれ正規分布に従い、母分散は等しいとする。
          L の標本平均は «mL»、不偏分散は «vL»、M の標本平均は «mM»、不偏分散は «vM» である。
          母平均の差 $\mu_M-\mu_L$ の 95% 信頼区間として正しいものはどれか。必要なら $t$ 分布の上側 2.5% 点 $t_{10}(0.025)=«t10»$、$t_{5}(0.025)=«t5»$、標準正規分布の上側 2.5% 点 «z» を使え。
        choices:
          - '$«ci_z»$'
          - '$«ci»$'
          - '$«ci_t5»$'
          - '$«ci_nof»$'
          - '$«ci_n»$'
        answer: 1
        distractors:
          - 分散を推定しているのに標準正規分布の点 1.96 を使った
          - 正解
          - 自由度を n1+n2−2=10 ではなく 1 群の n−1=5 とした
          - 標準誤差に √(1/n1+1/n2) を掛け忘れた
          - プールした分散を n1+n2−2 ではなく n1+n2 で割った
        explanation: |
          **方針** 等分散を仮定するので、2 群の偏差平方和を合わせたプールした分散 $s_p^2$ を使い、自由度 $n_1+n_2-2$ の $t$ 分布で区間を作る。

          **途中式** 偏差平方和は $5\times«vL»=«ssL»$、$5\times«vM»=«ssM»$。
          $$s_p^2=\frac{«ssL»+«ssM»}{6+6-2}=«sp2»,\qquad \mathrm{SE}=\sqrt{s_p^2\left(\frac16+\frac16\right)}=\sqrt{«sp2»\times«inv»}=\sqrt{«se2»}=«se»$$
          $$«mM»-«mL»\pm«t10»\times«se»=«diff»\pm«hw»$$

          **答え** $«ci»$（0 を含まないので、M のほうが平均的に遅いといえる）

          **間違えやすい点** 自由度は 2 群合わせて $6+6-2=10$ で、$t_5$ を使うと $«ci_t5»$ と広すぎる。1.96 を使うと $«ci_z»$ と狭すぎる。
          プールした分散の分母は $n_1+n_2-2$ で、$n_1+n_2$ にすると $«ci_n»$ になる。

