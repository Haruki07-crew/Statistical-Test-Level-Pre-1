    items:
      - id: s26p10a
        chapter: 29
        terms: [greenwood-formula, kaplan-meier-estimator, censored-data]
        topic: 打ち切りを含むストレージ装置の故障時間からカプラン・マイヤー推定値の標準誤差をグリーンウッドの公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          カプラン・マイヤー法による 20 か月時点の生存率の推定値 $\hat S(20)$ の標準誤差を、グリーンウッドの公式
          $$\widehat V[\hat S(t)]=\hat S(t)^2\sum_{t_j\le t}\frac{d_j}{n_j(n_j-d_j)}$$
          （$n_j$ は時刻 $t_j$ の直前に観測中の台数、$d_j$ はその時刻の故障数）で求めよ。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 故障が起きた時刻 5、12、20 ごとに、その直前に観測中の台数（リスク集合）と故障数を数える。打ち切られた装置は、打ち切り時刻より後のリスク集合から外れる。

          **途中式**
          | 時刻 $t_j$ | $n_j$ | $d_j$ | $(n_j-d_j)/n_j$ | $d_j/\{n_j(n_j-d_j)\}$ |
          |---|---|---|---|---|
          | 5 | 8 | 1 | 7/8 | $1/56=«g1»$ |
          | 12 | 6 | 2 | 4/6 | $2/24=«g2»$ |
          | 20 | 3 | 1 | 2/3 | $1/6=«g3»$ |

          （時刻 12 の直前は、5 で故障した 1 台と 8 で打ち切られた 1 台を除いた 6 台。時刻 20 の直前は、12 で故障した 2 台と 15 で打ち切られた 1 台を除いた 3 台。）
          $$\hat S(20)=\frac78\times\frac46\times\frac23=«S»,\qquad \sum\frac{d_j}{n_j(n_j-d_j)}=«g»$$
          $$\widehat V=«S»^2\times«g»=«S2»\times«g»=«var»,\qquad \mathrm{SE}=\sqrt{«var»}=«se4»\cdots$$

          **答え** $«se»$

          **間違えやすい点** 打ち切られた装置をリスク集合から外し忘れると $n_j$ を誤る。分散 $«w_var»$ をそのまま答えない。
          打ち切りを無視して 8 台の二項分布とみた $\sqrt{\hat S(1-\hat S)/8}=«w_binom»$ は、後の時点ほど観測台数が減って不確かさが増すことを反映しない。

