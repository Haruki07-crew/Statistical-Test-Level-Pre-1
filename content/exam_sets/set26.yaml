    title: 負荷試験による応答時間の分析
    context: |
      Web サービスの負荷試験で、応答時間 $y$（ミリ秒）を記録し、さまざまな回帰モデルを当てはめた。
    items:
      - id: s26p08a
        chapter: 16
        terms: [variance-inflation-factor, multicollinearity, coefficient-of-determination]
        topic: CPU使用率・メモリ使用率・同時接続数の補助回帰の決定係数からVIFを求め標準誤差の膨らみを評価する
        level: 基本
        definition: false
        type: choice
        question: |
          «n» 回の試験で、$y$ を CPU 使用率 $x_1$、メモリ使用率 $x_2$、同時接続数 $x_3$ に重回帰した。各説明変数を残り 2 つの説明変数に回帰したときの決定係数は
          $R_1^2=«r1»$、$R_2^2=«r2»$、$R_3^2=«r3»$ だった。
          $x_1$ の分散拡大要因 $\mathrm{VIF}_1$ と、$x_1$ が他の説明変数と無相関だった場合（誤差分散と $x_1$ の偏差平方和は同じとする）と比べて
          $x_1$ の係数の標準誤差が何倍になっているかの組として正しいものはどれか。
        choices:
          - '$\mathrm{VIF}_1=«w_inv»$、約 «w_invse» 倍'
          - '$\mathrm{VIF}_1=«vif1»$、約 «vif1» 倍'
          - '$\mathrm{VIF}_1=«w_1mr»$、約 «w_1mrse» 倍'
          - '$\mathrm{VIF}_1=«w_r»$、約 «w_rse» 倍'
          - '$\mathrm{VIF}_1=«vif1»$、約 «sevif» 倍'
        answer: 4
        distractors:
          - VIF を 1/R² とした
          - VIF は分散の倍率なのに、標準誤差の倍率もそのまま VIF とした
          - VIF を 1−R²（許容度）と取り違えた
          - 決定係数を相関係数とみなして 1/(1−0.92²) とした
          - 正解
        explanation: |
          **方針** 重回帰の係数の分散は $V[\hat\beta_j]=\dfrac{\sigma^2}{S_{jj}(1-R_j^2)}$（$S_{jj}$ は $x_j$ の偏差平方和）。無相関なら $R_j^2=0$ なので、分散は $\mathrm{VIF}_j=1/(1-R_j^2)$ 倍、標準誤差はその平方根倍になる。

          **途中式**
          $$\mathrm{VIF}_1=\frac{1}{1-«r1»}=\frac{1}{«omr»}=«vif1»,\qquad \sqrt{«vif1»}=«sevif»$$
          参考に $\mathrm{VIF}_2=«vif2»$、$\mathrm{VIF}_3=«vif3»$。$x_1$ は目安の 10 を超え、多重共線性が強い。

          **答え** $\mathrm{VIF}_1=«vif1»$、標準誤差は約 «sevif» 倍

          **間違えやすい点** VIF は**分散**の倍率なので、標準誤差の倍率はその平方根である。$1-R_j^2=«omr»$ は許容度（トレランス）で、VIF はその逆数。
          補助回帰の決定係数 $R_1^2$ はすでに 2 乗された量なので、もう一度 2 乗しない。

      - id: s26p08b
        chapter: 19
        terms: [spline-regression, nonlinear-regression]
        topic: 結び目をもつ区分線形スプライン回帰で負荷が結び目を超えた後の傾きから応答時間が目標値に達するCPU使用率を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          CPU 使用率 $x$（%）が高くなると応答時間が急に伸びるので、結び目を $x=«k»$ に置いた区分線形スプライン回帰
          $$\hat y=«b0»+«b1»\,x+«b2»\,(x-«k»)_+ ,\qquad (x-«k»)_+=\begin{cases}x-«k» & (x>«k»)\\ 0 & (x\le«k»)\end{cases}$$
          を当てはめた。予測される応答時間が «sla» ミリ秒になる CPU 使用率を求めよ。
        answer: «xs»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** $(x-«k»)_+$ の項は結び目を超えた部分だけ傾きを «b2» 増やす。まず結び目での予測値を求め、«sla» に届くのが結び目の右側かを確かめてから、右側の傾き $«b1»+«b2»$ で解く。

          **途中式** 結び目での予測値は $«b0»+«b1»\times«k»=«yk»$（< «sla»）なので、«sla» に達するのは $x>«k»$ の側。そこでの傾きは $«b1»+«b2»=«slope»$。
          $$«yk»+«slope»\,(x-«k»)=«sla»\quad\Rightarrow\quad x=«k»+\frac{«gap»}{«slope»}=«xs4»\cdots$$

          **答え** $«xs»$（%）

          **間違えやすい点** 結び目の右側の傾きは «b2» ではなく $«b1»+«b2»=«slope»$（«b2» は傾きの**増分**）。«b2» だけを使うと $«xs_b2»$ になる。
          スプラインの項を無視して $«b0»+«b1»x=«sla»$ を解くと $x=«xs_lin»$ と、ありえない値になる。

      - id: s26p08c
        chapter: 17
        terms: [residual, leverage, leave-one-out-cv]
        topic: 単回帰の残差とてこ比から各点を除いて予測したときの予測残差の平方和（PRESS）を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          6 回の試験で、応答時間 $y$ を同時接続数 $x$（百）に単回帰したところ、残差 $e_i$ とてこ比 $h_{ii}$ は次のとおりだった。

          | $x_i$ | «x0» | «x1» | «x2» | «x3» | «x4» | «x5» |
          |---|---|---|---|---|---|---|
          | $e_i$ | «e0» | «e1» | «e2» | «e3» | «e4» | «e5» |
          | $h_{ii}$ | «h0» | «h1» | «h2» | «h3» | «h4» | «h5» |

          各観測を 1 つずつ除いて当てはめ直し、除いた観測を予測したときの予測残差の平方和（PRESS）を、表の値を使って求めよ。
        answer: «press»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 最小二乗法では、$i$ 番目を除いて当てはめ直したときの予測残差は、当てはめ直さなくても $e_{(i)}=\dfrac{e_i}{1-h_{ii}}$ で求められる。これを 2 乗して足す。

          **途中式**
          | $i$ | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $1-h_{ii}$ | «omh0» | «omh1» | «omh2» | «omh3» | «omh4» | «omh5» |
          | $e_i/(1-h_{ii})$ | «pr0» | «pr1» | «pr2» | «pr3» | «pr4» | «pr5» |
          | 2 乗 | «pq0» | «pq1» | «pq2» | «pq3» | «pq4» | «pq5» |

          $$\mathrm{PRESS}=«pq0»+«pq1»+«pq2»+«pq3»+«pq4»+«pq5»=«press_s»$$

          **答え** $«press1»$

          **間違えやすい点** 残差の平方和 $\sum e_i^2=«sse»$ は PRESS ではない。てこ比の大きい両端の点（$h_{ii}=«h0»$）は、除くと予測が大きく外れるので、予測残差が残差の約 2 倍になる。
          $1-h_{ii}$ で割るところを掛けると $«w_h»$ になる。PRESS は残差平方和より必ず大きく、モデルの予測力（1 点除外交差検証）を表す。

  - id: s26p09
    title: サーバ機種ごとの障害件数
    context: |
      4 機種のサーバについて 1 年間の障害件数 $y_i$ を集計し、稼働台数の対数をオフセットとし、切片と導入からの年数の 2 つの母数をもつポアソン回帰（対数リンク）を当てはめた。
      観測値と当てはめ値 $\hat\mu_i$、および $\ln(y_i/\hat\mu_i)$ の値は次のとおりである。

      | 機種 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | $y_i$ | «y0» | «y1» | «y2» | «y3» |
      | $\hat\mu_i$ | «mu0» | «mu1» | «mu2» | «mu3» |
      | $\ln(y_i/\hat\mu_i)$ | «l0» | «l1» | «l2» | «l3» |
    items:
      - id: s26p09a
        chapter: 18
        terms: [deviance, poisson-regression, offset-term, generalized-linear-model]
        topic: 4機種のサーバの障害件数のポアソン回帰の当てはめ値から逸脱度を求め自由度を数えて適合度を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルの逸脱度（飽和モデルとの対数尤度の差の 2 倍）$D$ の値と、適合度の判定の組として正しいものはどれか。
          自由度 2 と 3 のカイ二乗分布の上側 5% 点は «c2» と «c3» である。
        choices:
          - '$D=«half»$、自由度 2 の上側 5% 点より小さく、当てはまりが悪いとはいえない'
          - '$D=«D»$、自由度 3 の上側 5% 点より小さく、当てはまりが悪いとはいえない'
          - '$D=«X2»$、自由度 2 の上側 5% 点より小さく、当てはまりが悪いとはいえない'
          - '$D=«D»$、自由度 2 の上側 5% 点より小さく、当てはまりが悪いとはいえない'
          - '$D=«negD»$、自由度 2 の上側 5% 点より小さく、当てはまりが悪いとはいえない'
        answer: 3
        distractors:
          - 対数尤度の差を 2 倍し忘れた
          - 自由度を「観測数 4 − 年数の係数 1」とし、切片を数え忘れた
          - 逸脱度ではなくピアソンのカイ二乗統計量 Σ(y−μ)²/μ を計算した
          - 正解
          - ln(μ/y) と分子分母を逆にして符号を誤った
        explanation: |
          **方針** ポアソン分布の逸脱度は
          $$D=2\sum_i\left\{y_i\ln\frac{y_i}{\hat\mu_i}-(y_i-\hat\mu_i)\right\}$$
          切片を含む対数リンクのポアソン回帰では $\sum y_i=\sum\hat\mu_i$ が成り立つので、第 2 項の和は 0 になる。自由度は「観測数 − 推定した母数の数」。

          **途中式** $\sum y_i=«sumy»$、$\sum\hat\mu_i=«summu»$ で一致する。
          $$\sum y_i\ln\frac{y_i}{\hat\mu_i}=«y0»\times«l0»+«y1»\times(«l1»)+«y2»\times«l2»+«y3»\times(«l3»)$$
          $$=«tm0»«tm1»+«tm2»«tm3»=«tsum»$$
          $$D=2\times«tsum»=«D4»$$
          自由度は $4-2=2$ で、$«D»<«c2»$。

          **答え** $D=«D»$、自由度 2 の上側 5% 点より小さく、当てはまりが悪いとはいえない

          **間違えやすい点** 逸脱度は対数尤度の差の **2 倍**（2 倍しないと «half»）。母数は切片と年数の係数の 2 つなので自由度は 2（オフセットは推定しないので数えない）。
          ピアソン統計量 $\sum(y_i-\hat\mu_i)^2/\hat\mu_i=«X2»$ は逸脱度と近い値になるが、別の統計量である。逸脱度は 0 以上の量なので、負になったら符号の誤り。

