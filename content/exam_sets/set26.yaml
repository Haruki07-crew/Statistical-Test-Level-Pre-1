      4 つのサーバ室（ブロック R）それぞれで、3 列のラック列に冷却方式を無作為に割り付け（冷却方式は列ごとにしか変えられない）、
      さらに各ラック列を 2 つに分けてファン設定を無作為に割り付けた（分割区法）。全部で 24 個の測定値について、平方和は次のとおりである。

      | 要因 | 平方和 | 自由度 |
      |---|---|---|
      | ブロック R | «ssR» | «dfR» |
      | 冷却方式 A | «ssA» | «dfA» |
      | 1 次誤差（R×A） | «ssE1» | «dfE1» |
      | ファン設定 B | «ssB» | «dfB» |
      | 交互作用 A×B | «ssAB» | «dfAB» |
      | 2 次誤差 | «ssE2» | «dfE2» |
      | 合計 | «ssT» | «dfT» |
    items:
      - id: s26p11a
        chapter: 20
        terms: [split-plot-design, randomized-block-design, fixed-and-random-effects]
        topic: 分割区法でラック列単位に割り付けた冷却方式の効果を1次誤差（ブロック×主区因子）で割ってF検定する
        level: 標準
        definition: false
        type: choice
        question: |
          冷却方式 A の効果を調べる $F$ 統計量の値と、比べる $F$ 分布の自由度の組として正しいものはどれか。
        choices:
          - '$F=«F2»$、自由度 $(«dfA»,\,«dfE2»)$'
          - '$F=«F»$、自由度 $(«dfA»,\,«dfE1»)$'
          - '$F=«Fp»$、自由度 $(«dfA»,\,«dfEp»)$'
          - '$F=«F»$、自由度 $(«dfA»,\,«dfE2»)$'
          - '$F=«Fraw»$、自由度 $(«dfA»,\,«dfE1»)$'
        answer: 1
        distractors:
          - 主区因子 A を 2 次誤差で割った
          - 正解
          - 1 次誤差と 2 次誤差を合わせて 1 つの誤差とした
          - 平均平方は正しいが自由度に 2 次誤差の自由度を使った
          - 平均平方ではなく平方和の比をとった
        explanation: |
          **方針** 分割区法では、冷却方式（主区因子）はラック列という大きな単位に割り付けられているので、その効果は「ラック列どうしのばらつき」＝ 1 次誤差（R×A）と比べる。ファン設定 B と交互作用 A×B は、列の中で割り付けたので 2 次誤差と比べる。

          **途中式**
          $$MS_A=\frac{«ssA»}{«dfA»}=«msA»,\qquad MS_{E1}=\frac{«ssE1»}{«dfE1»}=«msE1»$$
          $$F=\frac{«msA»}{«msE1»}=«F»\quad(\text{自由度 }(«dfA»,«dfE1»))$$
          $F_{0.05}(«dfA»,«dfE1»)=«f26»$ より大きいので、冷却方式の効果は有意である。

          **答え** $F=«F»$、自由度 $(«dfA»,«dfE1»)$

          **間違えやすい点** 2 次誤差で割ると $F=«F2»$ となり、主区因子の効果を過大に評価する。2 次誤差は同じラック列の中のばらつきで、ラック列どうしのばらつき（1 次誤差）より小さいのがふつうだからである。
          誤差をまとめて $MS=«msEp»$ とすると $F=«Fp»$ になる。分割区法では誤差が 2 種類あることがこの計画の特徴である。

