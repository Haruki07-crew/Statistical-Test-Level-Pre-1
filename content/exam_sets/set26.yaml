      - id: s26p13a
        chapter: 27
        terms: [spectrum, ar-model, weak-stationarity]
        topic: AR(1)モデルのスペクトル密度の周波数0とπでの比を求め低周波の変動が卓越することを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          吸気温度から日周変動を除いた偏差 $X_t$ は、定常な AR(1) モデル $X_t=«phi»X_{t-1}+\varepsilon_t$（$\varepsilon_t$ は分散 $\sigma^2$ の白色雑音）に従うとする。
