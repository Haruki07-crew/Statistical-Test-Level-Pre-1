set: 26
title: 模擬試験 第26回
minutes: 90
problems:
  - id: s26p01
    title: バッチジョブの振り分け
    context: |
      夜間のバッチ処理で、互いに独立な «nj» 本のジョブを «ns» 台のサーバに振り分ける。各ジョブは «ns» 台のどれかに等しい確率で、ほかのジョブとは独立に割り当てられる。
    items:
      - id: s26p01a
        chapter: 1
        terms: [inclusion-exclusion-principle, independence-of-events, conditional-probability]
        topic: 6本のジョブを3台のサーバに無作為に割り当てたときすべてのサーバに1本以上のジョブが割り当てられる確率を包除原理で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          «ns» 台のサーバすべてに、ジョブが 1 本以上割り当てられる確率を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 余事象「少なくとも 1 台にジョブが 1 本もない」を、サーバ $i$ が空である事象 $A_i$ の和集合として包除原理で数える。

          **途中式**
          - $P(A_i)=(2/3)^6$、$P(A_i\cap A_j)=(1/3)^6$、$P(A_1\cap A_2\cap A_3)=0$
          - $P(A_1\cup A_2\cup A_3)=3\times(2/3)^6-3\times(1/3)^6=3\times«p1»-3\times«p2»=«union»$
          - 求める確率 $=1-«union»=«ans4»$（$=540/729$）

          **答え** $«ans_s»$

          **間違えやすい点** $1-3\times(2/3)^6$ とすると、2 台が同時に空になる場合を 2 回引きすぎて «w_noinc» になる。
          ジョブが 6 本あっても、3 台とも使われる確率は 4 分の 3 にも届かない。
  - id: s26p02
    title: 設定変更と API の応答時間
    context: |
      ある Web サービスで、キャッシュの設定を変更し、API の応答時間（ミリ秒）がどう変わったかを調べる。小問ごとに別のデータを扱う。
    items:
      - id: s26p02a
        chapter: 11
        terms: [paired-t-test, two-sample-t-test, one-sided-two-sided-test]
        topic: 同じ8つのエンドポイントで設定変更の前後に測った応答時間の差を対応のあるt検定で調べ対応を無視した2標本t検定と結論が変わることを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          同じ «n» 個のエンドポイントで、変更前と変更後に平均応答時間を測った。変更前の値の標準偏差は «s1»、変更後は «s2»、「変更前 − 変更後」の差の平均は «d»、差の標準偏差は «sd» だった。
          変更で応答時間が変わったかを、有意水準 5% の両側検定で調べる。$t_{0.025}(7)=«t7»$、$t_{0.025}(14)=«t14»$ とする。正しい記述はどれか。
        choices:
          - '2 標本 $t$ 検定で $t=«ti»$。«t14» を下回るので、変わったとはいえない'
          - '対応のある $t$ 検定で $t=«w_n»$（差の標準偏差を $\sqrt{n}$ で割らない）。«t7» を下回るので、変わったとはいえない'
          - '対応のある $t$ 検定で $t=«tp»$。自由度 14 の点 «t14» と比べて、変わったといえる'
          - '対応のある $t$ 検定で $t=«tp»$。«t7» を上回るので、変わったといえる'
          - 'エンドポイントごとの応答時間の差が大きいので、どちらの検定も使えない'
        answer: 3
        distractors:
          - 同じエンドポイントの前後の値は対応があり、2 標本 t 検定ではエンドポイント間の差が誤差に入ってしまう
          - 差の平均の標準誤差は s_d/√n
          - 対応のある t 検定の自由度は n−1=7
          - 正解
          - エンドポイント間のばらつきは、差をとることで取り除ける
        explanation: |
          **方針** 同じエンドポイントを前後で測っているので、差 $d_i$ をとって 1 標本の $t$ 検定（対応のある $t$ 検定）を行う。

          **途中式**
          - 対応あり：$t=\dfrac{\bar d}{s_d/\sqrt n}=\dfrac{«d»}{«sd»/\sqrt{«n»}}=«tp»$（自由度 7）＞ «t7»
          - 対応を無視した 2 標本：$\sqrt{«s1»^2/«n»+«s2»^2/«n»}=«sei»$、$t=«d»/«sei»=«ti»$（自由度 14）＜ «t14»

          **答え** 対応のある $t$ 検定で $t=«tp»$、変わったといえる

          **間違えやすい点** エンドポイントによって応答時間の水準が大きく違う（標準偏差 «s1» 程度）ので、対応を無視するとその違いが誤差に入り、«d» ミリ秒の改善が埋もれてしまう。
          対応のある検定は、エンドポイントごとの水準の違いを差で打ち消すことで精度を上げている。
      - id: s26p02b
        chapter: 6
        terms: [noncentral-t-distribution, t-distribution, t-statistic]
        topic: 応答時間の平均が基準から標準偏差の0.5倍ずれているとき1標本t統計量が従う非心t分布の自由度と非心度を特定する
        level: 標準
        definition: false
        type: choice
        question: |
          別のサービスで、応答時間（正規分布に従うとする）を «m» 回測り、1 標本 $t$ 統計量 $T=\dfrac{\bar X-\mu_0}{S/\sqrt{«m»}}$ で目標値 $\mu_0$ と比べる（$S$ は不偏分散の平方根）。
          実際の平均 $\mu$ が目標値より標準偏差 $\sigma$ の «dl» 倍だけ大きい（$\mu-\mu_0=«dl»\sigma$）とき、$T$ の分布として正しいものはどれか。
        choices:
          - '自由度 «df» の $t$ 分布を «ncp» だけ平行移動した分布'
          - '自由度 «df»、非心度 $\sqrt{«m»}\times«dl»=«ncp»$ の非心 $t$ 分布'
          - '自由度 «df»、非心度 «dl» の非心 $t$ 分布'
          - '平均 «ncp»、分散 1 の正規分布（自由度に関係なく正確に）'
          - '自由度 1 と «df»、非心度 «ncp2» の非心 $F$ 分布'
        answer: 1
        distractors:
          - 分母の S もばらつくので、単なる平行移動にはならない（左右非対称になる）
          - 正解
          - 非心度は √n 倍される
          - n が大きいときの近似であり、正確な分布ではない
          - T の 2 乗が非心 F(1,15) に従う（T そのものではない）
        explanation: |
          **方針** $T=\dfrac{(\bar X-\mu)/(\sigma/\sqrt n)+\sqrt n(\mu-\mu_0)/\sigma}{S/\sigma}$ と分けると、分子は $N(\delta,1)$（$\delta=\sqrt n(\mu-\mu_0)/\sigma$）、分母は $\sqrt{\chi^2_{n-1}/(n-1)}$ で、分子と独立。

          **途中式** $\delta=\sqrt{«m»}\times«dl»=«ncp»$。分子が $N(\delta,1)$、分母が $\sqrt{\chi^2_{«df»}/«df»}$ で独立なので、$T$ は自由度 «df»、非心度 «ncp» の非心 $t$ 分布に従う。

          **答え** 自由度 «df»、非心度 «ncp» の非心 $t$ 分布

          **間違えやすい点** $\delta=0$（帰無仮説が正しい）なら通常の $t$ 分布。$\delta\ne0$ のときの $T$ の分布（非心 $t$ 分布）は、$t$ 検定の検出力の計算に使う。
          分母の $S$ がばらつくため、非心 $t$ 分布は $\delta$ の側に裾が長く、$t$ 分布を平行移動したものとは違う。
  - id: s26p03
    title: ファイルのサイズとインシデント件数
    context: |
      ある企業の情報システム部門が、保存されているファイルのサイズと、セキュリティインシデントの件数を分析する。小問ごとに別のデータを扱う。
    items:
      - id: s26p03a
        chapter: 8
        terms: [maximum-likelihood-estimator, sufficient-statistic, factorization-theorem]
        topic: 最小値が既知のパレート分布に従うファイルサイズで因数分解定理から十分統計量を見つけ形状母数の最尤推定値を対数の和から求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 MB 以上のファイルのサイズ $X$（MB）は、密度 $f(x)=\alpha x^{-(\alpha+1)}$（$x\ge1$、$\alpha>0$）のパレート分布に従うとする。
          無作為に選んだ «n» 個のファイルのサイズは «xs»（平均 «xb»）で、それぞれの自然対数は «logs»（合計 «slog»）だった。
          $\alpha$ の十分統計量と最尤推定値の組として正しいものはどれか。
        choices:
          - '十分統計量 $\sum\log x_i$、最尤推定値 $\hat\alpha=«alpha»$'
          - '十分統計量 $\sum x_i$、最尤推定値 $\hat\alpha=«alpha»$'
          - '十分統計量 $\sum\log x_i$、最尤推定値 $\hat\alpha=«w_inv»$'
          - '十分統計量 $\sum x_i$、最尤推定値 $\hat\alpha=«w_mm»$'
          - '十分統計量 $\max x_i$、最尤推定値 $\hat\alpha=«w_mm»$'
        answer: 0
        distractors:
          - 正解
          - 尤度は Π x_i（すなわち Σ log x_i）を通してだけ α に依存する
          - n/Σlog x ではなく Σlog x/n（逆数）とした
          - 平均 α/(α−1) を標本平均に合わせるモーメント法の値
          - 最大値は、上端が母数のときの十分統計量
        explanation: |
          **方針** 尤度を $\alpha$ とデータの部分に分ける（因数分解定理）。対数尤度を $\alpha$ で微分して 0 とおく。

          **途中式**
          $$L(\alpha)=\prod_i\alpha x_i^{-(\alpha+1)}=\alpha^n\exp\left\{-(\alpha+1)\sum\log x_i\right\}$$
          データは $\sum\log x_i$ を通してだけ現れるので、これが十分統計量。
          $$\frac{d\log L}{d\alpha}=\frac n\alpha-\sum\log x_i=0\ \Rightarrow\ \hat\alpha=\frac{n}{\sum\log x_i}=\frac{«n»}{«slog»}=«alpha4»$$

          **答え** 十分統計量 $\sum\log x_i$、$\hat\alpha=«alpha»$

          **間違えやすい点** $\log X$ は平均 $1/\alpha$ の指数分布に従うので、$\hat\alpha$ は「対数の平均の逆数」になる。
          モーメント法（$E[X]=\alpha/(\alpha-1)$ を $\bar x=«xb»$ に合わせる）では «w_mm» となり、裾の重い分布では最尤推定値と大きく違うことがある。
      - id: s26p03b
        chapter: 10
        terms: [score-test, wald-test, likelihood-ratio-test]
        topic: 週のインシデント件数のポアソン平均が基準値かをワルド検定とスコア検定と尤度比検定で調べ分散の推定の仕方で結論が分かれることを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          ある週のインシデント件数は $X=«x»$ 件だった。件数は平均 $\lambda$ のポアソン分布に従うとし、例年の値 $H_0:\lambda=«l0»$ と比べる（両側、有意水準 5%）。
          次の 3 つの検定統計量を考える。

          - ワルド統計量 $Z_W=(X-«l0»)/\sqrt{X}$（分散を推定値で評価）
          - スコア統計量 $Z_S=(X-«l0»)/\sqrt{«l0»}$（分散を帰無仮説の値で評価）
          - 尤度比統計量 $G=2\{X\log(X/«l0»)-(X-«l0»)\}$（自由度 1 のカイ二乗分布と比べる）

          必要なら $\sqrt{12}=3.464$、$\sqrt6=2.449$、$\log2=0.6931$ を使え。棄却される検定の組として正しいものはどれか。
        choices:
          - '3 つとも棄却する。3 つの検定は漸近的に同等なので、結論は必ず一致する'
          - 'スコア検定（$Z_S=«zs»$）と尤度比検定（$G=«G»$）は棄却し、ワルド検定（$Z_W=«zw»$）は棄却しない'
          - 'ワルド検定だけが棄却する。分散を観測値で評価するので最も精度が高い'
          - '3 つとも棄却しない。$X=12$ は 1 回の観測なので検定できない'
          - 'スコア検定と尤度比検定は棄却するが、$G=«G»$ は自由度 2 のカイ二乗分布と比べるべきである'
        answer: 1
        distractors:
          - 3 つは標本が大きいとき同等になるが、件数が少ないと結論が分かれることがある
          - 正解
          - ワルド統計量は 1.732 で 1.96 を下回る
          - ポアソン分布を仮定すれば 1 回の件数でも検定できる
          - 母数は λ の 1 個なので自由度は 1
        explanation: |
          **方針** ポアソン分布では分散が平均に等しい。ワルド検定は分散を推定値 $\hat\lambda=X$ で、スコア検定は帰無仮説の値 $«l0»$ で評価する。尤度比検定は 2 つの対数尤度の差を使う。

          **途中式**
          - $Z_W=(12-6)/\sqrt{12}=6/3.464=«zw»<1.96$ → 棄却しない
          - $Z_S=(12-6)/\sqrt6=6/2.449=«zs»>1.96$ → 棄却
          - $G=2\{12\log2-6\}=2\times(8.317-6)=«G»>3.84$ → 棄却

          **答え** スコア検定と尤度比検定は棄却し、ワルド検定は棄却しない

          **間違えやすい点** 観測値が帰無仮説の値より大きいとき、ワルド検定は分散も大きく見積もるので、統計量が小さくなり棄却しにくい。3 つの検定は帰無仮説のもとで漸近的に同等だが、件数が少ないときは差が出る。
          正確な検定（$P(X\ge12\mid\lambda=6)\approx0.020$、両側でも約 0.04）とは、スコア検定と尤度比検定の結論が合っている。
  - id: s26p04
    title: 監視アラートと応答時間のモデル
    context: |
      あるサービスの監視システムについて、アラートの判定と応答時間の分布をモデル化する。小問ごとに別のモデルを扱う。
    items:
      - id: s26p04a
        chapter: 4
        terms: [change-of-variables, p-value, normal-distribution]
        topic: 監視の検定統計量を片側p値に変換したとき異常がなければp値が一様分布に従い異常があるときのp値の中央値を単調変換の性質から求める
        level: 標準
        definition: false
        type: choice
        question: |
          監視システムは 1 分ごとに検定統計量 $Z$ を計算し、片側 $p$ 値 $P=1-\Phi(Z)$ が 0.05 以下ならアラートを出す（$\Phi$ は標準正規分布の分布関数）。
          異常がないとき $Z\sim N(0,1)$、ある種の攻撃を受けているとき $Z\sim N(«dl»,1)$ とする。
          異常がないときの $P$ の分布と、攻撃を受けているときの $P$ の中央値の組として正しいものはどれか。必要なら $\Phi(2)=«ph2»$ を使え。
        choices:
          - '異常がないとき $P$ は区間 $(0,1)$ の一様分布。攻撃を受けているときの $P$ の中央値は $«ph2»$'
          - '異常がないとき $P$ は区間 $(0,1)$ の一様分布。攻撃を受けているときの $P$ の中央値は $0.5$'
          - '異常がないとき $P$ は区間 $(0,1)$ の一様分布。攻撃を受けているときの $P$ の中央値は $«med»$'
          - '異常がないとき $P$ は 0.5 のまわりの正規分布。攻撃を受けているときの $P$ の中央値は $«med»$'
          - '異常がないとき $P$ は 0 に近い値が出やすく、$P\le0.05$ となる確率は 0.05 より大きい'
        answer: 2
        distractors:
          - 1−Φ(2) ではなく Φ(2) を答えた
          - 攻撃があると Z の分布が右にずれるので、P は 0 の側に寄る
          - 正解
          - 連続な統計量の p 値は、帰無仮説のもとで一様分布に従う
          - 一様分布なので P(P≤0.05)=0.05 ちょうど
        explanation: |
          **方針** $Z$ の分布関数を $\Phi$ とすると、$\Phi(Z)$ は一様分布に従う（確率積分変換）。$P=1-\Phi(Z)$ は $Z$ の減少関数なので、分位点はそのまま移る。

          **途中式**
          - 異常なし：$P(P\le u)=P(Z\ge\Phi^{-1}(1-u))=u$ なので一様分布
          - 攻撃あり：$Z$ の中央値は «dl»。$P$ は $Z$ の単調減少関数なので、$P$ の中央値は $1-\Phi(«dl»)=1-«ph2»=«med»$

          **答え** 一様分布。攻撃時の中央値は $«med»$

          **間違えやすい点** 単調な変換では中央値などの分位点は変換したものに移る（平均はそうならない）。攻撃時に $P\le0.05$ となる確率（検出力）は $\Phi(«dl»-1.645)\approx«pw»$ で、半分以上の分でアラートが出る。
          統計量が離散的なときは、$p$ 値は帰無仮説のもとでも一様分布にならない。
      - id: s26p04b
        chapter: 2
        terms: [marginal-probability-density-function, joint-probability-density-function, conditional-probability-density-function]
        topic: サーバの処理速度が指数分布に従い与えられた速度のもとで応答時間が指数分布に従うとき同時密度を積分して応答時間の周辺密度と上側確率を求め平均が存在しないことを確かめる
        level: 応用
        definition: false
        type: choice
        question: |
          あるサーバの処理速度 $\Lambda$ は時間帯によって変わり、平均 1 の指数分布（密度 $e^{-\lambda}$、$\lambda>0$）に従う。速度が $\Lambda=\lambda$ のとき、応答時間 $Y$ は平均 $1/\lambda$ の指数分布（密度 $\lambda e^{-\lambda y}$、$y>0$）に従う。
          $Y$ の周辺密度と、それに関する記述の組として正しいものはどれか。
        choices:
          - '$f_Y(y)=e^{-y}$ で、$P(Y>1)=e^{-1}\approx0.368$。$E[Y]=1$'
          - '$f_Y(y)=\dfrac{1}{(1+y)^2}$ で、$P(Y>1)=0.25$。$E[Y]=1$'
          - '$f_Y(y)=\dfrac{1}{(1+y)^2}$ で、$P(Y>1)=0.5$。$E[Y]$ は存在しない（無限大）'
          - '$f_Y(y)=\dfrac{2}{(1+y)^3}$ で、$P(Y>1)=0.25$。$E[Y]=1$'
          - '$E[Y\mid\Lambda=\lambda]=1/\lambda$ の期待値は $E[1/\Lambda]=1/E[\Lambda]=1$ なので、$E[Y]=1$'
        answer: 2
        distractors:
          - 速度を平均 1 に固定した（速度のばらつきを無視した）
          - 上側確率は ∫_1^∞ (1+y)^{-2} dy = 1/2
          - 正解
          - 積分を誤った（指数を 3 とした）
          - E[1/Λ] は 1/E[Λ] に等しくない（ここでは発散する）
        explanation: |
          **方針** 同時密度 $f(\lambda,y)=e^{-\lambda}\cdot\lambda e^{-\lambda y}$ を $\lambda$ について積分して $Y$ の周辺密度を求める。

          **途中式**
          $$f_Y(y)=\int_0^\infty\lambda e^{-\lambda(1+y)}\,d\lambda=\frac{1}{(1+y)^2}\qquad(y>0)$$
          - $P(Y>1)=\displaystyle\int_1^\infty\frac{dy}{(1+y)^2}=\frac12$
          - $E[Y]=\displaystyle\int_0^\infty\frac{y}{(1+y)^2}dy$ は $y$ が大きいところで $1/y$ のように減るだけなので発散する。$E[1/\Lambda]=\int_0^\infty\lambda^{-1}e^{-\lambda}d\lambda$ も発散する。

          **答え** $f_Y(y)=1/(1+y)^2$、$P(Y>1)=0.5$、平均は存在しない

          **間違えやすい点** 条件付きでは平均 $1/\lambda$ が有限でも、速度が 0 に近い時間帯があるため、全体では平均が無限大になる（裾の重い分布）。$E[1/\Lambda]\ne1/E[\Lambda]$ にも注意する。
          中央値は $P(Y>m)=1/(1+m)=1/2$ より 1 で、平均の代わりに中央値で応答時間を要約するのが適切である。
  - id: s26p05
    title: セキュリティ検査と問い合わせ窓口
    context: |
      ある企業のセキュリティ部門の業務について、シミュレーションと待ち行列のモデルで分析する。小問ごとに別の状況を扱う。
    items:
      - id: s26p05a
        chapter: 32
        terms: [permutation-simulation, permutation-test, monte-carlo-integration]
        topic: 2つの部署のフィッシング訓練の結果で観測した差以上の差が出た並べ替えの回数からモンテカルロ法による並べ替え検定のp値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          フィッシング訓練で、2 つの部署のメール開封率の差を統計量 $T$ とした。部署のラベルを無作為に並べ替えて $T$ を計算することを «B» 回繰り返したところ、観測した値以上の $T$ が «k» 回出た。
          観測値そのものも並べ替えの 1 つとして数える方法で、モンテカルロ法による（片側の）$p$ 値を求めると、正しいものはどれか。
        choices:
          - '$\dfrac{«k»+1}{«B»+1}=«p»$'
          - '$\dfrac{«k»}{«B»}=«w_raw»$'
          - '$1-\dfrac{«k»}{«B»}=«w_comp»$'
          - '$2\times\dfrac{«k»+1}{«B»+1}=«w_two»$'
          - '並べ替えをすべて数え上げていないので、$p$ 値は求められない'
        answer: 0
        distractors:
          - 正解
          - 観測値を数に入れない形（p が 0 になりうる）
          - 観測値以上ではなく以下の割合を求めた
          - 片側の p 値を 2 倍した
          - すべての並べ替えの代わりに無作為な並べ替えで p 値を推定するのがモンテカルロ法
        explanation: |
          **方針** 帰無仮説（部署によらない）のもとでは、観測値も並べ替えた値も同じ分布に従う。観測値を含めた «B»+1 個の中で、観測値以上のものの割合を $p$ 値とする。

          **途中式** $p=\dfrac{«k»+1}{«B»+1}=\dfrac{«k1»}{«B1»}=«p»$

          **答え** $«p»$

          **間違えやすい点** 観測値を含めると $p$ 値が 0 になることがなく、検定の大きさが名目の有意水準を超えないことが保証される。
          繰り返し回数を増やすと、$p$ 値の推定のばらつきが小さくなる（推定の標準誤差は約 $\sqrt{p(1-p)/B}$）。
      - id: s26p05b
        chapter: 15
        terms: [mmc-queue, queueing-theory, littles-law]
        topic: 問い合わせ窓口を担当者2人のM/M/2待ち行列とみて定常状態の確率から待ち行列の長さと平均待ち時間を求め速さ2倍の1人と比べる
        level: 応用
        definition: false
        type: numeric
        question: |
          セキュリティに関する社内の問い合わせは、1 分あたり平均 «lam» 件のポアソン過程に従って届き、担当者 2 人のどちらかが空いていればすぐに対応を始め、2 人とも対応中なら到着順に待つ。
          1 人の対応時間は平均 «mu_inv» 分の指数分布に従う（M/M/2 待ち行列）。定常状態での、問い合わせ 1 件あたりの平均待ち時間（対応が始まるまで、分）を求めよ。
        answer: «Wq»
        tolerance: 0.01
        answer_format: 分の単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 系内の件数を状態とする出生死滅過程で、到着率は «lam»、退去率は状態 1 で $\mu=1$、状態 2 以上で $2\mu=2$。定常分布から待っている件数の平均 $L_q$ を求め、リトルの公式 $W_q=L_q/\lambda$ を使う。

          **途中式** $a=\lambda/\mu=«lam»$、$\rho=a/2=«rho»$。
          - $p_1=a\,p_0=«lam»p_0$、$n\ge2$ で $p_n=\dfrac{a^2}{2}\rho^{n-2}p_0=«a22»\times«rho»^{n-2}p_0$
          - $\sum p_n=1$ より $p_0\left(1+«lam»+\dfrac{«a22»}{1-«rho»}\right)=1$、$p_0=1/(1+«lam»+«t3»)=1/«den»$
          - 待つ確率 $P(N\ge2)=\dfrac{«t3»}{«den»}=«pw»$
          - $L_q=\sum_{n\ge2}(n-2)p_n=P(N\ge2)\dfrac{\rho}{1-\rho}=«pw»\times«rr»=«Lq»$
          - $W_q=L_q/\lambda=«Lq»/«lam»=«Wq4»$

          **答え** $«Wq_s»$ 分

          **間違えやすい点** 速さ 2 倍の担当者 1 人（M/M/1、$\mu=2$）なら $W_q=\lambda/\{\mu(\mu-\lambda)\}=«w_fast»$ 分で、待ち時間はやや長いが、対応時間を含めた滞在時間では 1 人の方が短くなる。
          2 人がそれぞれ別の列（到着の半分ずつ）を受け持つと、各列が M/M/1（$\lambda=0.8$、$\mu=1$）になり $W_q=«w_sep»$ 分と大幅に長くなる。待ち行列は 1 列にまとめた方が効率がよい。
      - id: s26p05c
        chapter: 7
        terms: [slutsky-theorem, central-limit-theorem, convergence-in-distribution]
        topic: 分布の歪んだ多数の応答時間の平均について標本標準偏差で割った統計量が中心極限定理とスルツキーの定理で漸近的に標準正規分布に従うことから近似区間を作る
        level: 標準
        definition: false
        type: choice
        question: |
          ログイン処理の時間は右に長く裾を引く分布に従う（平均 $\mu$、分散 $\sigma^2$ は有限で未知）。«n» 回の観測で、平均 «xb» ミリ秒、標本標準偏差 «sx» ミリ秒だった。
          $\mu$ の近似 95% 信頼区間と、その根拠の組として正しいものはどれか。
        choices:
          - '$(«lo»,\ «hi»)$。元の分布が正規分布なので、$t$ 分布の点を使う区間が正確に成り立つ'
          - '$(«wlo»,\ «whi»)$。元の分布が歪んでいるので、$\pm1.96\times S$ の幅が必要である'
          - '$(«lo»,\ «hi»)$。中心極限定理で $\sqrt n(\bar X-\mu)/\sigma$ が標準正規分布に近づき、$S\to\sigma$（確率収束）なのでスルツキーの定理により $\sigma$ を $S$ に置き換えてよい'
          - '$(«lo»,\ «hi»)$。チェビシェフの不等式から、95% 以上の確率で $\mu$ を含むことが保証される'
          - '元の分布が正規分布でないので、平均の区間は作れない'
        answer: 2
        distractors:
          - 元の分布は正規分布ではない。区間は漸近的な近似
          - S は平均の標準誤差ではなく、1 回の観測のばらつき
          - 正解
          - チェビシェフなら 1.96 ではなく √20 ≈ 4.47 倍の幅が必要
          - 平均の分布は標本が大きいと正規分布で近似できる
        explanation: |
          **方針** 中心極限定理で $\sqrt n(\bar X-\mu)/\sigma\to N(0,1)$（分布収束）。大数の法則と連続写像定理で $S\to\sigma$（確率収束）。スルツキーの定理で $\sqrt n(\bar X-\mu)/S\to N(0,1)$。

          **途中式** 標準誤差 $«sx»/\sqrt{«n»}=«se»$、区間 $«xb»\pm1.96\times«se»=(«lo»,\ «hi»)$

          **答え** $(«lo»,\ «hi»)$。中心極限定理とスルツキーの定理による

          **間違えやすい点** 元の分布が正規分布でなくても、平均についての区間は標本が大きければ正規近似で作れる。ただし、1 回の処理時間の範囲（予測区間）を作るときは、元の分布の形が効く。
          分布が大きく歪んでいると、正規近似が良くなるまでに大きな標本が必要になる。
  - id: s26p06
    title: 2 台のディスクの入出力
    context: |
      ストレージ装置の 2 台のディスクの 1 秒あたりの入出力回数（千回）を $X$、$Y$ とする。$V[X]=«vx»$、$V[Y]=«vy»$、$\mathrm{Cov}(X,Y)=«cxy»$ である。
    items:
      - id: s26p06a
        chapter: 3
        terms: [covariance-and-correlation, expectation-variance-properties, variance-covariance-matrix]
        topic: 2台のディスクの入出力回数の和と差の共分散を共分散の双線形性から求め和と差の相関係数を計算する
        level: 基本
        definition: false
        type: numeric
        question: |
          合計の負荷 $X+Y$ と、2 台の負荷の偏り $X-Y$ の相関係数を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 共分散は各引数について線形（双線形）なので、展開して分散と共分散で表す。

          **途中式**
          - $\mathrm{Cov}(X+Y,X-Y)=V[X]-V[Y]=«vx»-«vy»=«c»$（$\mathrm{Cov}(X,Y)$ の項は打ち消し合う）
          - $V[X+Y]=«vx»+«vy»+2\times«cxy»=«vs»$、$V[X-Y]=«vx»+«vy»-2\times«cxy»=«vd»$
          - 相関係数 $=\dfrac{«c»}{\sqrt{«vs»\times«vd»}}=«ans4»$

          **答え** $«ans_s»$

          **間違えやすい点** 和と差の共分散は、2 つの分散の差だけで決まる。2 台の分散が等しければ、相関があっても和と差は無相関になる。
          $V[X-Y]$ では共分散の項の符号がマイナスになる。
  - id: s26p07
    title: 圧縮方式の比較と信頼区間
    context: |
      バックアップに使うデータ圧縮の方式を比べる。小問ごとに別の問題を扱う。
    items:
      - id: s26p07a
        chapter: 13
        terms: [friedman-test, rank-and-ties, nonparametric-methods-overview]
        topic: 5種類のファイルを3つの圧縮方式で圧縮した時間をファイルごとに順位づけしフリードマン検定統計量を求めて方式の違いを判定する
        level: 標準
        definition: false
        type: choice
        question: |
          5 種類のファイル（ブロック）を 3 つの圧縮方式 A・B・C で圧縮し、時間（秒）を測った。

          | ファイル | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | A | «A» |
          | B | «B» |
          | C | «C» |

          ファイルの違いを除いて方式の違いを調べるため、フリードマン検定を行う。検定統計量 $Q=\dfrac{12}{nk(k+1)}\sum_jR_j^2-3n(k+1)$（$n=5$ はファイルの数、$k=3$ は方式の数、$R_j$ は方式 $j$ の順位和）と判定の組として正しいものはどれか。自由度 2 のカイ二乗分布の上側 5% 点は 5.99 とする。
        choices:
          - '$Q=«Q»$ で 5.99 を下回り、方式による違いがあるとはいえない'
          - '$Q=«w_all»$（15 個をまとめて順位をつけた）で 5.99 を下回り、違いがあるとはいえない'
          - '$Q=«Q»$ で、自由度 4 の点 9.49 を下回るので、違いがあるとはいえない'
          - '$Q=«Q»$ で 5.99 を上回り、方式による違いがある'
          - 'ファイルごとに時間の水準が大きく違うので、順位を使う検定は使えない'
        answer: 3
        distractors:
          - 計算した Q と棄却点の大小を取り違えた
          - 順位はブロック（ファイル）ごとにつける
          - 自由度は方式の数 − 1 = 2
          - 正解
          - ブロックごとに順位をつけるので、水準の違いは問題にならない
        explanation: |
          **方針** 各ファイルの中で 3 つの方式に 1〜3 の順位をつけ、方式ごとに順位を足す。

          **途中式**
          - 各ファイル内の順位（A, B, C）：«ranks»
          - 順位和：$R_A=«RA»$、$R_B=«RB»$、$R_C=«RC»$（合計は $5\times6=30$）
          - $Q=\dfrac{12}{5\times3\times4}(«RA»^2+«RB»^2+«RC»^2)-3\times5\times4=0.2\times«sR2»-60=«Q»$

          **答え** $Q=«Q»$ で、方式による違いがある

          **間違えやすい点** 15 個をまとめて順位をつけると、ファイル間の大きな違いが混ざり、方式の違いが見えにくくなる（クラスカル・ウォリス検定に近い扱いになる）。
          フリードマン検定は、乱塊法（繰り返しのない二元配置）に対応するノンパラメトリック法である。
      - id: s26p07b
        chapter: 9
        terms: [confidence-coefficient, confidence-interval, independence-of-events]
        topic: 独立な3つの95%信頼区間がすべて真の値を含む確率と20個の区間のうち外れる区間の数の期待値から信頼係数の意味を読む
        level: 基本
        definition: false
        type: choice
        question: |
          3 つの圧縮方式の平均圧縮率について、それぞれ独立なデータから 95% 信頼区間を作った。信頼係数の意味に関する記述として正しいものはどれか。
        choices:
          - '計算された 1 つの区間が真の値を含む確率は 0.95 で、3 つの区間がすべて含む確率も 0.95 である'
          - '3 つの区間がすべて真の値を含む確率は $1-3\times0.05=0.85$ ちょうどである'
          - '同じ方法で 20 個の区間を作ると、真の値を含まない区間は必ず 1 個である'
          - '区間の幅が広いほど、信頼係数は小さくなる'
          - '3 つの区間がすべて真の値を含む確率は $0.95^3=«p3»$ で、0.95 より小さい'
        answer: 4
        distractors:
          - 計算された区間は真の値を含むか含まないかのどちらかで、0.95 は手続きの性質
          - 1−3×0.05 はボンフェローニの下限で、独立なら 0.857
          - 外れる区間の数は平均 1 個（二項分布）で、必ず 1 個ではない
          - 同じデータなら、幅が広いほど信頼係数は大きい
          - 正解
        explanation: |
          **方針** 95% 信頼区間は「同じ手続きをくり返すと、95% の割合で真の値を含む区間ができる」という手続きの性質。独立な区間なら、すべて含む確率は積になる。

          **途中式**
          - すべて含む確率 $0.95^3=«p3»$
          - 20 個の区間のうち外れる数は二項分布 $B(20,0.05)$ に従い、期待値 1、ちょうど 1 個の確率は $20\times0.05\times0.95^{19}\approx«p1of20»$

          **答え** すべて含む確率は $«p3»$

          **間違えやすい点** 複数の区間を同時に信頼係数 95% にしたいときは、ボンフェローニ法などで 1 つずつの信頼係数を上げる（3 つなら 1 つあたり約 98.3%）。
          計算し終えた 1 つの区間について「真の値を含む確率が 95%」というのは、頻度論の解釈では正しくない。
  - id: s26p08
    title: 負荷試験の回帰モデル
    context: |
      Web サービスの負荷試験で、応答時間 $y$（ミリ秒）を記録し、さまざまな回帰モデルを当てはめた。小問ごとに別のモデルを扱う。
    items:
      - id: s26p08a
        chapter: 16
        terms: [gauss-markov-theorem, least-squares-method, unbiased-estimator]
        topic: ガウス・マルコフの定理が最小二乗推定量の最良性を保証するための誤差の条件と最良の意味を選ぶ
        level: 基本
        definition: true
        type: choice
        question: |
          応答時間を CPU 使用率と同時接続数に線形回帰し、最小二乗法で係数を推定した。ガウス・マルコフの定理の内容として正しいものはどれか。
        choices:
          - '誤差が正規分布に従うときに限り、最小二乗推定量は不偏になる'
          - '誤差の分散が一定でなくても、最小二乗推定量は線形不偏推定量の中で分散が最小になる'
          - '最小二乗推定量は、偏りのある推定量も含めたすべての推定量の中で平均二乗誤差が最小になる'
          - '誤差の平均が 0 で、分散が一定で互いに無相関なら、最小二乗推定量は線形不偏推定量の中で分散が最小になる（誤差の正規性は必要ない）'
          - '説明変数どうしの相関が強いときに限り、最小二乗推定量は最良の推定量になる'
        answer: 3
        distractors:
          - 不偏性には誤差の平均が 0 であれば十分で、正規性は要らない
          - 不均一分散のときは、重み付き最小二乗法の方が分散が小さい
          - リッジ推定量のように、偏りを許せば平均二乗誤差が小さくなる推定量もある
          - 正解
          - 多重共線性は推定量の分散を大きくするが、定理の条件とは関係ない
        explanation: |
          **方針** ガウス・マルコフの定理は「線形」「不偏」な推定量の中での比較であり、誤差には平均 0・等分散・無相関だけを仮定する。

          **途中式** 条件：$E[\varepsilon]=0$、$V[\varepsilon]=\sigma^2I$。このとき、任意の線形不偏推定量 $\tilde\beta=Cy$ について $V[\tilde\beta]-V[\hat\beta_{\rm OLS}]$ は半正定値になる（最良線形不偏推定量、BLUE）。

          **答え** 等分散・無相関の誤差のもとで、最小二乗推定量は線形不偏推定量の中で分散が最小

          **間違えやすい点** 誤差が正規分布に従えば、最小二乗推定量は線形に限らず不偏推定量全体の中で分散が最小になる（クラメール・ラオの下限に達する）。
          不均一分散や系列相関があると、最小二乗推定量は不偏のままだが最良ではなくなり、一般化最小二乗法が最良になる。
      - id: s26p08b
        chapter: 19
        terms: [neural-network-model, nonlinear-regression, regularization]
        topic: 3つの入力と2つの隠れ層をもつ全結合ニューラルネットワークの重みとバイアスの総数を層ごとに数える
        level: 基本
        definition: false
        type: numeric
        question: |
          応答時間を、CPU 使用率・メモリ使用率・同時接続数の 3 つを入力とする全結合のニューラルネットワークで予測する。
          隠れ層は 2 層で、1 層目は «h1» 個、2 層目は «h2» 個のユニット（活性化関数は ReLU）、出力層は 1 個のユニットである。各ユニットには、前の層からの重みとバイアスが 1 つずつある。
          推定する母数（重みとバイアス）の総数を求めよ。
        answer: «P»
        tolerance: 0.5
        answer_format: 整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 層ごとに「(前の層のユニット数 + 1)×その層のユニット数」を数えて足す（+1 はバイアス）。

          **途中式**
          - 入力 → 1 層目：$(3+1)\times«h1»=«P1»$
          - 1 層目 → 2 層目：$(«h1»+1)\times«h2»=«P2»$
          - 2 層目 → 出力：$(«h2»+1)\times1=«P3»$
          - 合計 $«P1»+«P2»+«P3»=«P»$

          **答え** $«P»$ 個

          **間違えやすい点** バイアスを忘れると «w_nob» 個になる。データが少ないのに母数が多いと過学習しやすいので、正則化（重みの減衰）や検証データによる早期終了を使う。
