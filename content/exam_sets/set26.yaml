    items:
      - id: s26p12a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation, proportional-allocation]
        topic: 層の大きさに比例する配分とネイマン配分で層別平均の分散を比べ層内の標準偏差のばらつきから効率の比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          全体で $n=«n»$ 台を抽出する（層の台数は十分大きく、有限母集団修正は無視する）。比例配分による層別平均の分散を、ネイマン配分による層別平均の分散で割った比を求めよ。
        answer: «ratio»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 比例配分では $V_{\text{prop}}=\dfrac1n\sum W_hS_h^2$、ネイマン配分（$n_h\propto W_hS_h$）では $V_{\text{Ney}}=\dfrac1n\left(\sum W_hS_h\right)^2$。

          **途中式**
          - $\sum W_hS_h^2=«a1»+«a2»+«a3»=«sws2»$、$V_{\text{prop}}=«sws2»/«n»=«vp»$
          - $\sum W_hS_h=«b1»+«b2»+«b3»=«sws»$、$V_{\text{Ney}}=«sws»^2/«n»=«vn»$
          - 比 $=«vp»/«vn»=«ratio4»$

          **答え** $«ratio_s»$

          **間違えやすい点** 差は $V_{\text{prop}}-V_{\text{Ney}}=\dfrac1n\sum W_h(S_h-\bar S)^2$（$\bar S=\sum W_hS_h$）で、層内の標準偏差がばらつくほどネイマン配分の利点が大きい。標準偏差が等しければ 2 つの配分は一致する。
