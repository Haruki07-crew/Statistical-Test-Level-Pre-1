set: 10
title: 模擬試験 第10回
minutes: 90
problems:
  - id: s10p01
    title: 宅配便の配送遅延
    context: |
      ある宅配会社の地域センターでは、荷物を 3 つの経路のどれかで配送している。経路ごとの荷物の割合と、その経路で配達予定時刻に遅れる（遅延する）確率は次のとおりである。

      | 経路 | A（高速道路経由） | B（一般道経由） | C（臨海部経由） |
      |---|---|---|---|
      | 荷物の割合 | «sA» | «sB» | «sC» |
      | 遅延する確率 | «dA» | «dB» | «dC» |
    items:
      - id: s10p01a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: 3つの配送経路の荷物の割合と遅延率から遅延した荷物が一般道経由だった事後確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ荷物が遅延していた。この荷物が経路 B を通っていた確率に最も近い値はどれか。
        choices:
          - "$«w_lik»$"
          - "$«postB»$"
          - "$«w_prior»$"
          - "$«w_joint»$"
          - "$«w_norm»$"
        answer: 1
        distractors:
          - 「B を通ったとき遅延する確率」P(遅延|B) と、求める P(B|遅延) を取り違えた
          - 正解
          - 遅延したという情報を使わず、事前の割合 P(B) を答えた
          - 同時確率 P(B かつ 遅延) を答え、P(遅延) で割り忘れた
          - 経路ごとの荷物の割合を無視して、遅延率だけを足し合わせた 0.26 で割った
        explanation: |
          **方針** 求めるのは条件付き確率 $P(B\mid \text{遅延})$。分母の $P(\text{遅延})$ を全確率の公式で求め、ベイズの定理を使う。

          **途中式** 各経路と遅延の同時確率は
          $$P(A\cap\text{遅延})=«sA»\times«dA»=«jA»,\quad P(B\cap\text{遅延})=«sB»\times«dB»=«jB»,\quad P(C\cap\text{遅延})=«sC»\times«dC»=«jC»$$
          全確率の公式より $P(\text{遅延})=«jA»+«jB»+«jC»=«pd»$。よって
          $$P(B\mid\text{遅延})=\frac{P(B\cap\text{遅延})}{P(\text{遅延})}=\frac{«jB»}{«pd»}=«postB4»\cdots$$

          **答え** $«postB»$

          **間違えやすい点** $P(\text{遅延}\mid B)=«w_lik»$ と $P(B\mid\text{遅延})$ は別物。荷物の割合を無視して $«dB»/(«dA»+«dB»+«dC»)=«dB»/«sumd»=«w_norm»$ とするのは、3 経路の荷物が同じ数だと仮定したことになる。
          なお、経路 A・C についても同様に $P(A\mid\text{遅延})=«postA»$、$P(C\mid\text{遅延})=«postC»$ となり、3 つの和は 1 になる。

      - id: s10p01b
        chapter: 28
        terms: [loglinear-model, hierarchical-loglinear-model, three-way-table]
        topic: 時間帯を与えると雨天と遅延が条件付き独立という対数線形モデルで1つのセルの当てはめ度数を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          雨天と遅延の関係を調べるため、ある月の荷物 «N» 個を、天気（雨天・晴天曇天）、遅延の有無、配達の時間帯（午前・午後）の 3 重分割表に集計した。

          | 午前 | 遅延 | 定刻 |
          |---|---|---|
          | 雨天 | «a1» | «b1» |
          | 晴天・曇天 | «c1» | «d1» |

          | 午後 | 遅延 | 定刻 |
          |---|---|---|
          | 雨天 | «a2» | «b2» |
          | 晴天・曇天 | «c2» | «d2» |

          天気を $A$、遅延の有無を $B$、時間帯を $C$ とし、「時間帯を与えると天気と遅延は条件付き独立」という階層的対数線形モデル $[AC][BC]$ を最尤法で当てはめる。
          「午前・雨天・遅延」のセルの当てはめ度数（期待度数の最尤推定値）を求めよ。
        answer: «fit»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** モデル $[AC][BC]$ は「各時間帯 $k$ の中で $A$ と $B$ が独立」を表す。このモデルの当てはめ度数は、十分統計量である周辺表 $n_{i+k}$ と $n_{+jk}$ を再現する式 $\hat m_{ijk}=\dfrac{n_{i+k}\,n_{+jk}}{n_{++k}}$ で閉じた形で求まる。

          **途中式** 午前の層（$n_{++1}=«n1»$）で、雨天の合計 $n_{\text{雨},+,\text{午前}}=«a1»+«b1»=«rain1»$、遅延の合計 $n_{+,\text{遅延},\text{午前}}=«a1»+«c1»=«del1»$。
          $$\hat m=\frac{«rain1»\times«del1»}{«n1»}=«fit_s»$$
          （観測度数 «a1» は当てはめ度数 «fit_s» より大きく、午前は雨の日に遅延が多い。午後の同じセルは $«rain2»\times«del2»/«n2»=«fit2»$。）

          **答え** $«fit_s»$

          **間違えやすい点** 3 変数すべてが独立というモデル $[A][B][C]$ と混同すると $\dfrac{«rain»\times«dly»\times«n1»}{«N»^2}=«fit_ind»$ になる。
          条件付き独立のモデルでは、天気と遅延の積を**時間帯ごとの**合計で割る。全体の合計から作ると、時間帯ごとの雨の日の割合や遅延率の違いが消えてしまう。このモデルの自由度は層の数 × $(2-1)(2-1)=2$ である。

  - id: s10p02
    title: 交差点の進行方向
    context: |
      ある交差点に南から進入する車は、互いに独立に、直進・右折・左折をそれぞれ確率 «pS»・«pR»・«pL» で選ぶとする。
      ある信号の 1 サイクルの間に南から進入した «n» 台について、直進・右折・左折の台数を $(S,R,L)$ とする。
    items:
      - id: s10p02a
        chapter: 5
        terms: [multinomial-distribution, binomial-distribution]
        topic: 交差点に進入した8台の直進・右折・左折台数が指定の組になる確率を多項分布で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          $(S,R,L)=(«kS»,«kR»,«kL»)$ となる確率を求めよ。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $(S,R,L)$ は試行回数 «n»、確率 $(«pS»,«pR»,«pL»)$ の多項分布に従う。$P(S=s,R=r,L=l)=\dfrac{n!}{s!\,r!\,l!}p_S^{\,s}p_R^{\,r}p_L^{\,l}$。

          **途中式** 並べ方の数は
          $$\frac{«n»!}{«kS»!\,«kR»!\,«kL»!}=\frac{40320}{120\times2\times1}=«coef»$$
          確率の積は $«pS»^{«kS»}\times«pR»^{«kR»}\times«pL»=«pS5»\times«pR2»\times«pL»=«prod»$。
          $$P=«coef»\times«prod»=«pa6»$$

          **答え** $«pa_s»$

          **間違えやすい点** 並べ方の数 $\frac{8!}{5!2!1!}$ を掛け忘れると $«pa_noc»$ 程度の非常に小さい値になる。二項係数 $\binom{8}{5}=56$ だけを掛けるのも誤りで、残り 3 台の中で右折 2 台・左折 1 台の並べ方 $\binom{3}{2}=3$ も必要（$56\times3=«coef»$）。

      - id: s10p02b
        chapter: 2
        terms: [conditional-probability-function, joint-probability-function, marginal-probability-function, multinomial-distribution]
        topic: 多項分布で直進台数を与えたときの右折台数の条件付き分布（二項分布）から確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある 1 サイクルで直進した車が $S=«kS»$ 台だったことがわかった。このとき右折した車がちょうど 2 台である条件付き確率 $P(R=2\mid S=«kS»)$ に最も近い値はどれか。
        choices:
          - "$«w_uncond»$"
          - "$«w_raw»$"
          - "$«pb»$"
          - "$«w_nocomb»$"
          - "$«w_swap»$"
        answer: 2
        distractors:
          - 条件を無視して、8 台中の右折台数の周辺分布 B(8, 0.25) から P(R=2) を求めた
          - 残り 3 台について、条件付きでない右折確率 0.25 をそのまま使った
          - 正解
          - 二項係数 3C2 を掛け忘れた
          - 右折と左折の条件付き確率を取り違えた（右折 0.375、左折 0.625 とした）
        explanation: |
          **方針** 同時確率関数を周辺確率で割って条件付き確率関数を求める。多項分布では、$S=s$ を与えると残り $n-s$ 台は「直進しなかった車」なので、各車が右折である条件付き確率は $p_R/(p_R+p_L)$ で、$R\mid S=s$ は二項分布 $B(n-s,\ p_R/(p_R+p_L))$ に従う。

          **途中式** 残りは $«n»-«kS»=«m»$ 台。直進しなかった車が右折である確率は
          $$\frac{p_R}{p_R+p_L}=\frac{«pR»}{«pRL»}=«pc»$$
          $$P(R=2\mid S=«kS»)=\binom{3}{2}«pc»^2\times«qc»=3\times«pc2»\times«qc»=«pb6»$$
          （同時確率 ÷ 周辺確率で確かめると、$P(S=5,R=2)=«pa6»$、$P(S=5)=\binom{8}{5}0.6^5\,0.4^3=0.278692\cdots$ で、比は $0.4395$ になる。）

          **答え** $«pb»$

          **間違えやすい点** 条件付けをしないで $R\sim B(8,0.25)$ から $P(R=2)=«w_uncond»$ とするのは周辺確率。条件付きでは右折の確率が 0.25 から «pc» に変わる（0.25 のままだと $«w_raw»$）。

  - id: s10p03
    title: タクシーの乗車距離
    context: |
      ある市のタクシー会社で、無作為に選んだ «n» 回の乗車の距離（km）を調べたところ、標本平均は $\bar x=«xbar»$、
      $n$ で割った標本分散は $\frac{1}{n}\sum(x_i-\bar x)^2=«m2»$ だった。
      乗車距離 $X$ を、形状 $\alpha$・**尺度** $\theta$ のガンマ分布（密度 $f(x)=\dfrac{x^{\alpha-1}e^{-x/\theta}}{\Gamma(\alpha)\theta^\alpha}$、$x>0$）で表す。このとき $E[X]=\alpha\theta$、$V[X]=\alpha\theta^2$ である。
    items:
      - id: s10p03a
        chapter: 8
        terms: [method-of-moments, gamma-distribution, point-estimation]
        topic: タクシー乗車距離にガンマ分布を当てはめるモーメント法で形状と尺度を求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 次の積率 $E[X]$ を $\bar x$ に、2 次の中心積率 $V[X]$ を $n$ で割った標本分散に一致させるモーメント法で $(\alpha,\theta)$ を推定する。正しい組はどれか。
        choices:
          - '$\hat\alpha=«theta»,\ \hat\theta=«alpha»$'
          - '$\hat\alpha=«alpha»,\ \hat\theta=«theta»$'
          - '$\hat\alpha=«alpha»,\ \hat\theta=«rate»$'
          - '$\hat\alpha=«al_u»,\ \hat\theta=«th_u»$'
          - '$\hat\alpha=«al_sd»,\ \hat\theta=«th_sd»$'
        answer: 1
        distractors:
          - 形状と尺度を取り違えた
          - 正解
          - 尺度ではなくレート 1/θ を答えた
          - 指定と違い、n−1 で割った不偏分散を使った
          - 分散の代わりに標準偏差 2.598 を V[X] に当てた
        explanation: |
          **方針** 連立方程式 $\alpha\theta=\bar x$、$\alpha\theta^2=«m2»$ を解く。2 式の比をとると $\theta$ が求まる。

          **途中式**
          $$\hat\theta=\frac{\alpha\theta^2}{\alpha\theta}=\frac{«m2»}{«xbar»}=«theta»,\qquad \hat\alpha=\frac{\bar x}{\hat\theta}=\frac{«xbar»}{«theta»}=«alpha»$$
          （$\hat\alpha=\bar x^2/«m2»=20.25/6.75=3$ としても同じ。）

          **答え** $\hat\alpha=«alpha»$、$\hat\theta=«theta»$

          **間違えやすい点** ガンマ分布の第 2 母数は尺度とレートの 2 つの流儀がある。この問題は尺度（平均 $\alpha\theta$）なので、レート $1/\hat\theta=«rate»$ を答えるのは誤り。
          不偏分散 $«m2»\times\frac{60}{59}=«m2u»$ を使うと $(«al_u»,«th_u»)$ になるが、問題では $n$ で割った分散を使うと指定している。

  - id: s10p04
    title: フェリーターミナル
    context: |
      ある離島航路のフェリーターミナルについて考える。
    items:
      - id: s10p04a
        chapter: 15
        terms: [poisson-process, interarrival-time, binomial-distribution]
        topic: ポアソン過程で1時間の到着台数が与えられたとき最初の20分の到着台数が二項分布に従うことを使う
        level: 基本
        definition: false
        type: choice
        question: |
          乗船待ちの車は、一定の率のポアソン過程に従ってターミナルに到着するとする。ある日の 8 時から 9 時までの 1 時間に、ちょうど «k» 台が到着したことがわかっている。
          このとき、8 時から 8 時 20 分までの 20 分間に到着した車がちょうど «j» 台である条件付き確率に最も近い値はどれか。必要なら $e^{-2}=«e2»$ を使え。
        choices:
          - "$«w_pois»$"
          - "$«w_noc»$"
          - "$«w_swap»$"
          - "$«w_frac»$"
          - "$«pa»$"
        answer: 4
        distractors:
          - 条件を使わず、1 時間 6 台の率から 20 分の平均 2 台のポアソン分布で P(N=2) を求めた
          - 二項係数 6C2 を掛け忘れた
          - 前半 20 分に入る確率 1/3 と入らない確率 2/3 の指数を取り違えた
          - 1 台が前半 20 分に到着する確率 1/3 をそのまま答えた
          - 正解
        explanation: |
          **方針** ポアソン過程では、区間 $[0,T]$ の到着数が $n$ と与えられると、$n$ 個の到着時刻は $[0,T]$ 上の独立な一様分布の値を並べたものと同じ分布になる。よって部分区間に入る台数は二項分布 $B(n,\ \text{区間の長さ}/T)$ に従う。到着率は答えに関係しない。

          **途中式** 1 台が最初の 20 分に入る確率は $20/60=1/3$。
          $$P(\text{前半 20 分に }«j»\text{ 台}\mid\text{1 時間に }«k»\text{ 台})=\binom{6}{2}\left(\frac13\right)^2\left(\frac23\right)^4=«c62»\times\frac{1}{9}\times\frac{16}{81}=\frac{«num»}{«den»}=«pa5»$$

          **答え** $«pa»$

          **間違えやすい点** 条件を使わずに「20 分の平均は 2 台」としてポアソン分布 $P(N=2)=e^{-2}\dfrac{2^2}{2!}=2\times«e2»=«w_pois»$ を答えるのは、1 時間の台数がわかっていないときの確率。条件付きでは残り 40 分の台数が 6 − 2 = 4 台に決まるので、二項分布になる。

      - id: s10p04b
        chapter: 7
        terms: [central-limit-theorem, sum-of-random-variables, normal-distribution]
        topic: 中心極限定理でフェリーに積む車両の合計重量が積載上限を超える確率を5%以下にする最大台数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          このフェリーの車両甲板の積載上限は «cap» トンである。乗せる車 1 台の重量は互いに独立で、平均 «m» トン、標準偏差 «sd» トンとする。
          $n$ 台の合計重量を中心極限定理により正規分布で近似したとき、合計重量が «cap» トンを超える確率を 5% 以下にできる最大の台数 $n$ はどれか。
          標準正規分布の上側 5% 点は «z»、上側 2.5% 点は «z2» である。
        choices:
          - "«n_lin» 台"
          - "«n_196» 台"
          - "«n_ok» 台"
          - "«n_up» 台"
          - "«n_mean» 台"
        answer: 2
        distractors:
          - 合計の標準偏差を √n σ ではなく n σ とした
          - 片側の条件なのに両側の上側 2.5% 点 1.960 を使った
          - 正解
          - 2 次方程式の解 n=37.32 を切り上げた（38 台では超える確率が 5% を上回る）
          - 重量のばらつきを無視し、平均だけで 60÷1.5 とした
        explanation: |
          **方針** 合計重量 $T_n$ は平均 $«m»n$、標準偏差 $«sd»\sqrt n$ の正規分布で近似できる。$P(T_n>«cap»)\le0.05$ ⇔ $«m»n+«z»\times«sd»\sqrt n\le«cap»$。$x=\sqrt n$ とおいて 2 次不等式を解く。

          **途中式** $«m»x^2+«zsd»x-«cap»\le0$ の正の解は
          $$x=\frac{-«zsd»+\sqrt{«zsd»^2+4\times«m»\times«cap»}}{2\times«m»}=\frac{-«zsd»+\sqrt{«disc»}}{3}=\frac{-«zsd»+«sqd»}{3}=«x»$$
          よって $n\le x^2=«xx»$ で、整数では $n=«n_ok»$。念のため確かめると
          - $n=«n_ok»$：$«m37»+«z»\times«sd»\times«sq37»=«m37»+«s37»=«c37»\le«cap»$（条件を満たす）
          - $n=«n_up»$：$«m38»+«z»\times«sd»\times«sq38»=«m38»+«s38»=«c38»>«cap»$（満たさない）

          **答え** «n_ok» 台

          **間違えやすい点** 独立な和の標準偏差は $\sqrt n\,\sigma$ で、$n\sigma$ ではない（$n\sigma$ とすると «n_lin» 台）。「超える確率を 5% 以下」は片側なので上側 5% 点 «z» を使う（«z2» だと «n_196» 台）。37.32 を切り上げて «n_up» 台にすると上限を超える確率が 5% を上回る。

      - id: s10p04c
        chapter: 6
        terms: [exponential-distribution, survival-function, independence-of-events]
        topic: 2つの窓口の残り受付時間が独立な指数分布のとき最初に窓口が空くまでの時間（最小値）が一定時間を超える確率
        level: 標準
        definition: false
        type: numeric
        question: |
          乗船手続きの窓口は 2 つあり、1 人の受付時間は窓口 1 では平均 «m1» 分、窓口 2 では平均 «m2» 分の指数分布に従い、互いに独立とする。
          ある客が着いたとき、2 つの窓口はどちらも受付中で、ほかに待っている客はいなかった。この客がどちらかの窓口が空くまで «w» 分を超えて待つ確率を求めよ。
          必要なら $e^{-5/6}=«e56»$、$e^{-1/5}=«e15»$ を使え。
        answer: «pc»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 指数分布は無記憶性をもつので、受付がすでにどれだけ進んでいても、残りの受付時間はそれぞれ平均 «m1» 分・«m2» 分の指数分布に従う。待ち時間はその最小値 $W=\min(R_1,R_2)$ で、$P(W>w)=P(R_1>w)P(R_2>w)$。

          **途中式**
          $$P(W>«w»)=e^{-«w»/«m1»}\times e^{-«w»/«m2»}=e^{-«w»\left(\frac14+\frac16\right)}=e^{-«w»\times\frac{5}{12}}=e^{-5/6}=«e56»$$
          （$W$ はレート $\frac14+\frac16=\frac{5}{12}$（1 分あたり）の指数分布で、平均待ち時間は $12/5=«meanW»$ 分。）

          **答え** $«pc_s»$

          **間違えやすい点** 最小値のレートは 2 つのレートの和で、平均の和ではない。平均 $«m1»+«m2»=10$ 分の指数分布とすると $e^{-2/10}=«e15»$ になる。
          また「すでに受付中だから残り時間は短い」と考えるのは誤りで、指数分布では経過時間によらず残り時間の分布は同じ（無記憶性）。

  - id: s10p05
    title: 通勤経路の所要時間
    context: |
      ある会社員は、自宅から職場まで距離 10 km の道のりを車で通勤している。
    items:
      - id: s10p05a
        chapter: 4
        terms: [change-of-variables, uniform-distribution, probability-mass-and-density-function]
        topic: 一様分布に従う所要時間から平均速度（距離÷時間）の密度関数を変数変換で求める
        level: 応用
        definition: false
        type: choice
        question: |
          いつもの経路の所要時間 $T$（分）は区間 $[20,30]$ の一様分布に従うとする。この日の平均速度 $V=\dfrac{10}{T/60}=\dfrac{600}{T}$（km/h）の確率密度関数 $f_V(v)$ として正しいものはどれか（どれも $20\le v\le30$ で定義し、それ以外では 0 とする）。
        choices:
          - '$f_V(v)=\dfrac{1}{10}$'
          - '$f_V(v)=\dfrac{600}{v^2}$'
          - '$f_V(v)=\dfrac{v^2}{6000}$'
          - '$f_V(v)=\dfrac{60}{v^2}$'
          - '$f_V(v)=\dfrac{60}{v}$'
        answer: 3
        distractors:
          - ヤコビアン |dt/dv| を掛け忘れ、一様分布の密度をそのまま使った
          - T の密度 1/10 を掛け忘れた（積分すると 10 になる）
          - ヤコビアン |dt/dv| の代わりに |dv/dt|=v²/600 を掛けた
          - 正解
          - dt/dv を 600/v と誤って微分した
        explanation: |
          **方針** $v=600/t$ は $t\in[20,30]$ で単調減少なので、逆変換 $t=600/v$ を使い $f_V(v)=f_T(t(v))\left|\dfrac{dt}{dv}\right|$ とする。$t=20,30$ はそれぞれ $v=30,20$ に対応する。

          **途中式** $f_T(t)=\dfrac{1}{30-20}=\dfrac{1}{10}$、$\dfrac{dt}{dv}=-\dfrac{600}{v^2}$ より
          $$f_V(v)=\frac{1}{10}\times\frac{600}{v^2}=\frac{60}{v^2}\qquad(20\le v\le30)$$
          確認：$\displaystyle\int_{20}^{30}\frac{60}{v^2}dv=60\left(\frac{1}{20}-\frac{1}{30}\right)=60\times\frac{1}{60}=1$。

          **答え** $f_V(v)=\dfrac{60}{v^2}$（$20\le v\le30$）

          **間違えやすい点** 変数変換では密度に $|dt/dv|$ を掛ける。$T$ が一様でも $V=600/T$ は一様にならない（速度の遅い側に密度が偏る）。逆数の向き $|dv/dt|=v^2/600$ を掛けると $\int_{20}^{30} v^2/6000\,dv=19/18\neq1$ で、密度の条件を満たさないことからも誤りとわかる。

      - id: s10p05b
        chapter: 9
        terms: [required-sample-size, ci-paired-difference, confidence-interval]
        topic: 対応のある8日間の所要時間差から標準偏差を求め平均差を所定の幅で推定するのに必要な日数を決める
        level: 標準
        definition: false
        type: numeric
        question: |
          新しく開通したバイパス経由の経路 B と、いつもの経路 A を比べるため、試しに 8 日間、毎朝同じ時刻に出発する 2 台の車で両方の経路を同時に走り、所要時間（分）を測った。

          | 日 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | A | «a1» | «a2» | «a3» | «a4» | «a5» | «a6» | «a7» | «a8» |
          | B | «b1» | «b2» | «b3» | «b4» | «b5» | «b6» | «b7» | «b8» |

          本調査では、日ごとの差 $D=A-B$ の母平均 $\mu_D$ の 95% 信頼区間の幅を $\pm«E»$ 分以内にしたい。この 8 日間の差の標準偏差（不偏分散の平方根）を母標準偏差とみなし、
          正規近似（$z=«z»$）で $«z»\,\sigma_D/\sqrt n\le«E»$ を満たす最小の日数 $n$ を求めよ。
        answer: «nn»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 同じ日の A と B は道路の混み具合を共有するので、差 $D$ のばらつきで精度が決まる。$n\ge\left(\dfrac{z\,\sigma_D}{E}\right)^2$ を満たす最小の整数を求める。

          **途中式** 差は «d1», «d2», «d3», «d4», «d5», «d6», «d7», «d8»。合計 «dsum» より $\bar D=«dbar»$。
          偏差平方和 $\sum(D_i-\bar D)^2=«ss»$、不偏分散 $«ss»/7=«s2»$、標準偏差 $\sigma_D=\sqrt{«s2»}=«sd»$。
          $$n\ge\left(\frac{«z»\times«sd»}{«E»}\right)^2=\left(\frac{«zs»}{«E»}\right)^2=«root»^2=«need»$$
          よって最小の整数は $n=«nn»$。

          **答え** «nn» 日

          **間違えやすい点** «need» を四捨五入して 36 日にすると幅の条件を満たさないので、切り上げる。
          標準偏差を $n$ で割った分散から作る（$«sdn»$）と «w_sdn» 日、片側の 1.645 を使うと «w_z» 日、2 乗し忘れると «w_nosq» 日になる。
          A と B を別々の標本とみなして 2 つの分散を足すと、日ごとの混み具合のばらつきが入り、必要日数を大きく見積もりすぎる。

  - id: s10p06
    title: 路線バスの定時運行
    context: |
      ある市の交通局は、路線バスの定時運行を改善する施策を試している。
    items:
      - id: s10p06a
        chapter: 10
        terms: [randomized-test, significance-level, rejection-region, poisson-distribution]
        topic: 苦情件数のポアソン分布で有意水準をちょうど5%にする確率化検定の境界での棄却確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある路線への 1 週間あたりの苦情件数 $X$ は平均 $\lambda$ のポアソン分布に従う。施策のあと 1 週間の件数で、帰無仮説 $H_0:\lambda=«lam»$ を対立仮説 $H_1:\lambda<«lam»$ に対して検定する。
          件数が少ないほど棄却しやすい検定で、有意水準を**ちょうど** 5% にするため、$X=0$ なら棄却し、$X=1$ なら確率 $\gamma$ で棄却し（くじで決める）、$X\ge2$ なら棄却しない確率化検定を使う。
          $\gamma$ に最も近い値はどれか。$e^{-4}=«e4»$ を使い、確率は小数第4位まで計算せよ。
        choices:
          - "$«w_nop0»$"
          - "$«gam»$"
          - "$«w_cum»$"
          - "$«w_rest»$"
          - "$«w_comp»$"
        answer: 1
        distractors:
          - X=0 で棄却する分の確率 0.0183 を差し引き忘れ、0.05/P(X=1) とした
          - 正解
          - 残りの確率を P(X=1) ではなく P(X≦1) で割った
          - 足りない確率 0.05−P(X=0) をそのまま γ とした
          - 棄却する確率と棄却しない確率を取り違えた
        explanation: |
          **方針** $H_0$ のもとで棄却する確率は $P(X=0)+\gamma P(X=1)$。これが 0.05 になるように $\gamma$ を決める。

          **途中式** $H_0:\lambda=«lam»$ のもとで $P(X=0)=e^{-4}=«p0»$、$P(X=1)=4e^{-4}=«p1»$。$P(X\le1)=«cum1»>0.05$ なので、$X=1$ を必ず棄却すると 5% を超え、$X=0$ だけでは足りない。
          $$«p0»+\gamma\times«p1»=0.05\ \Rightarrow\ \gamma=\frac{0.05-«p0»}{«p1»}=\frac{«rest»}{«p1»}=«gam5»$$

          **答え** $«gam»$

          **間違えやすい点** 離散分布では棄却域を件数だけで決めると有意水準をちょうど 5% にできない（$X=0$ だけなら «p0»、$X\le1$ なら «cum1»）。境界の値でだけ確率 $\gamma$ で棄却するのが確率化検定で、$\gamma$ は「足りない分 ÷ 境界の確率」。

      - id: s10p06b
        chapter: 13
        terms: [wilcoxon-rank-sum-test, normal-approximation-rank-tests, mann-whitney-u-test]
        topic: 優先信号の有無で2群のバス遅延時間をウィルコクソン順位和の期待値と分散から正規近似のz値にする
        level: 標準
        definition: false
        type: numeric
        question: |
          バス優先信号の効果を見るため、優先信号のある区間を走った便 «m» 本と、ない区間を走った便 «n» 本の遅延時間（分）を調べた。

          | 優先信号あり | «w1» | «w2» | «w3» | «w4» | «w5» | «w6» | | |
          |---|---|---|---|---|---|---|---|---|
          | 優先信号なし | «o1» | «o2» | «o3» | «o4» | «o5» | «o6» | «o7» | «o8» |

          全 «N» 本をまとめて小さい順に順位をつけ、「優先信号あり」の順位和 $W$ を検定統計量とするウィルコクソンの順位和検定を、正規近似（連続修正なし）で行う。
          標準化した値 $z=(W-E[W])/\sqrt{V[W]}$ を求めよ（$E[W]$, $V[W]$ は 2 群の分布が同じという帰無仮説のもとでの値）。必要なら $\sqrt{60}=«sqV»$ を使え。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ（負の値なら符号もつける）。±0.01 の差まで正解とする。
        explanation: |
          **方針** 同順位がないとき、大きさ $m$ の群の順位和 $W$ は帰無仮説のもとで $E[W]=\dfrac{m(N+1)}{2}$、$V[W]=\dfrac{mn(N+1)}{12}$（$N=m+n$）。

          **途中式** 全体を並べると 0.8, 1.2, 1.7, 2.1, 2.4, 2.9, 3.1, 3.5, 3.8, 4.4, … で、「あり」の順位は «rw»。
          $$W=«W»,\qquad E[W]=\frac{«m»\times«N1»}{2}=«EW»,\qquad V[W]=\frac{«m»\times«n»\times«N1»}{12}=«VW»$$
          $$z=\frac{«W»-«EW»}{\sqrt{«VW»}}=\frac{«diff»}{«sqV»}=«z4»$$

          **答え** $«z_s»$（両側 5% の棄却限界 ±1.96 を超えるので、優先信号ありのほうが遅延が小さいといえる）

          **間違えやすい点** $E[W]$ の $m$ は順位和をとった群の大きさ（«m»）。「なし」の群で順位和をとると $W=«Wo»$、$E=«EWo»$ となり符号だけが逆の $z=+2.19$ になるので、どちらの群の和かを確かめる。
          分散の分母 12 を 6 とすると $z=«w_var»$ になる。連続修正をすると $«z_cc»$ だが、ここでは連続修正なしと指定している。

  - id: s10p07
    title: 観光地の来訪者数の回帰
    context: |
      ある県の観光課は、観光地の来訪者数を回帰分析で調べている。
    items:
      - id: s10p07a
        chapter: 16
        terms: [regression-coefficient-t-test, coefficient-of-determination, partial-f-test]
        topic: 観光客数の重回帰で1変数のt値から、その変数を除いたときの決定係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある温泉地の月別観光客数（千人）を «n» か月分のデータで、説明変数 «k» 個（平均気温、降水日数、祝日数、季節ダミー 3 個）と定数項の重回帰モデルに当てはめたところ、
          決定係数は $R^2=«R2»$、祝日数の係数の $t$ 値は $«t»$ だった。祝日数だけを除いて（ほかの説明変数はそのままで）当てはめ直したときの決定係数に最も近い値はどれか。
        choices:
          - "$«R2»0$"
          - "$«w_t»$"
          - "$«w_R»$"
          - "$«R2r»$"
          - "$«w_noR»$"
        answer: 3
        distractors:
          - 変数を 1 個除いても決定係数は変わらないと考えた
          - t 値を 2 乗せずに使った
          - 1−R² の代わりに R² を掛けた
          - 正解
          - 残差の割合 1−R² を掛け忘れた
        explanation: |
          **方針** 1 個の係数の $t$ 検定は、その変数を除いたモデルとの部分 $F$ 検定（分子の自由度 1）と同じで、$t^2=F=\dfrac{(R^2-R_r^2)/1}{(1-R^2)/(n-k-1)}$ が成り立つ。これを $R_r^2$ について解く。

          **途中式** 誤差の自由度は $n-k-1=«n»-«k»-1=«dfe»$。
          $$R^2-R_r^2=\frac{t^2(1-R^2)}{n-k-1}=\frac{«t2»\times«omR2»}{«dfe»}=«dR2»$$
          $$R_r^2=«R2»-«dR2»=«R2r5»$$

          **答え** $«R2r»$

          **間違えやすい点** 部分 $F$ 統計量は残差平方和の比で、決定係数で書くと分母は $(1-R^2)/(n-k-1)$。これを忘れて $t^2/(n-k-1)$ を引くと $«w_noR»$ になる。$t$ 値が 2.5 と大きくても、決定係数の低下は «dR2» と小さいことに注意（決定係数の変化の大きさと係数の有意性は別の話）。

      - id: s10p07b
        chapter: 17
        terms: [dfbetas, leverage, outlier-and-influential-point, residual]
        topic: てこ比の大きい1観測を除いたときの単回帰の傾きの変化を残差とてこ比から求める（DFBETA）
        level: 応用
        definition: false
        type: choice
        question: |
          別に、6 つの観光地について、駐車場の台数 $x$（百台）と年間来訪者数 $y$（万人）の単回帰を最小二乗法で当てはめたところ、$\hat y=«b0»+«b1»x$ となった。

          | 観光地 | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $x$ | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» |
          | $y$ | «y1» | «y2» | «y3» | «y4» | «y5» | «y6» |
          | 残差 $e_i$ | «e1» | «e2» | «e3» | «e4» | «e5» | «e6» |

          観光地 6 を除いて当てはめ直すと、傾きはいくら小さくなるか。最も近い値を選べ。
        choices:
          - "$«w_mul»$"
          - "$«dfb»$"
          - "$«w_noh»$"
          - "$«w_e»$"
          - "$«w_h1»$"
        answer: 1
        distractors:
          - 1−h で割る代わりに掛けた
          - 正解
          - 1−h で割り忘れた（てこ比を無視した）
          - 残差そのものを傾きの変化とした
          - てこ比の 1/n の項を忘れ、h=(x−x̄)²/Sxx とした
        explanation: |
          **方針** 観測 $i$ を除いたときの単回帰の傾きの変化は、当てはめ直さなくても
          $$\hat\beta_1-\hat\beta_{1(i)}=\frac{(x_i-\bar x)\,e_i}{S_{xx}(1-h_{ii})},\qquad h_{ii}=\frac1n+\frac{(x_i-\bar x)^2}{S_{xx}}$$
          で求まる（DFBETA。標準誤差で割ったものが DFBETAS）。

          **途中式** $\bar x=«xb»$、$S_{xx}=(-2)^2+(-1)^2+0^2+0^2+1^2+2^2=«sxx»$。観光地 6 は $x_6-\bar x=«di»$、$e_6=«e6»$。
          $$h_{66}=\frac16+\frac{«di»^2}{«sxx»}=«h»,\qquad 1-h_{66}=«omh»$$
          $$\hat\beta_1-\hat\beta_{1(6)}=\frac{«di»\times«e6»}{«sxx»\times«omh»}=\frac{«num6»}{«hden»}=«dfb4»$$
          傾きは «b1» から約 «new» に下がる。

          **答え** $«dfb»$

          **間違えやすい点** てこ比が大きい点（ここでは $h_{66}=«h»$）は、当てはめた直線を自分に引き寄せるので残差が小さく見える。$1-h$ で割ることでその分を戻す。割り忘れると «w_noh» と影響を過小評価する。

          **別解** 観光地 1〜5 の 5 点で直接当てはめ直すと、$\bar x=2.6$、$S_{xx}=5.2$、$S_{xy}=4.64$ で傾きは $4.64/5.2=0.892$。差は $2.0-0.892=1.108$ で一致する。

  - id: s10p08
    title: 運賃と乗客数
    context: |
      ある地方の鉄道・バス事業者 «n» 路線について、昨年からの運賃の変化と乗客数の変化を調べた。
    items:
      - id: s10p08a
        chapter: 11
        terms: [test-correlation-coefficient, t-distribution, t-statistic]
        topic: 運賃の変化と乗客数の変化の標本相関係数から無相関検定のt統計量を求める
        level: 基本
        definition: false
        type: choice
        question: |
          «n» 路線の運賃変化率と乗客数変化率の標本相関係数は $r=«r»$ だった。2 変数が 2 変量正規分布に従うとして、母相関係数が 0 という帰無仮説を検定する $t$ 統計量に最も近い値はどれか。
          なお $t_{0.025}(20)=«tc»$ である。
        choices:
          - "$«w_nosq»$"
          - "$«t»$"
          - "$«w_n3»$"
          - "$«w_n1»$"
          - "$«w_1r2»$"
        answer: 1
        distractors:
          - 分母の √(1−r²) で割り忘れた
          - 正解
          - 自由度を n−3 とした（フィッシャーの z 変換の分散 1/(n−3) と混同）
          - 自由度を n−1 とした
          - √(1−r²) ではなく 1−r² で割った
        explanation: |
          **方針** 母相関が 0 のとき $t=\dfrac{r\sqrt{n-2}}{\sqrt{1-r^2}}$ は自由度 $n-2$ の $t$ 分布に従う。

          **途中式** $r^2=«r2»$、$\sqrt{1-r^2}=\sqrt{«one_r2»}=«sq1r2»$、$\sqrt{«df»}=«sqdf»$。
          $$t=\frac{«r»\times«sqdf»}{«sq1r2»}=«t4»$$

          **答え** $«t»$（$|t|>«tc»$ なので両側 5% で無相関の仮説を棄却する）

          **間違えやすい点** 自由度は $n-2=«df»$（2 変数の平均を推定するぶん）。$\sqrt{1-r^2}$ ではなく $1-r^2$ で割ると $«w_1r2»$、割り忘れると $«w_nosq»$ になる。

      - id: s10p08b
        chapter: 19
        terms: [ridge-regression, bias-in-penalized-estimation, regularization, mean-squared-error]
        topic: リッジ推定量の縮小率に対するバイアスと分散のトレードオフから平均二乗誤差を最小にする縮小率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          運賃変化を平均 0・$\sum x_i^2=n$ に標準化した $x$ だけを説明変数とする回帰 $y_i=\beta x_i+\varepsilon_i$ を考える。最小二乗推定量 $\hat\beta$ は不偏で、分散は $V[\hat\beta]=«v»$ とする。
          リッジ回帰（罰則 $\lambda\beta^2$）の推定量は $\hat\beta_R=\dfrac{n}{n+\lambda}\hat\beta=c\,\hat\beta$（$0<c\le1$）と書ける。
          真の値が $\beta=«beta»$ だとすると、平均二乗誤差 $E[(\hat\beta_R-\beta)^2]$ を最小にする縮小率 $c$ と、そのときの平均二乗誤差の組として正しいものはどれか。
        choices:
          - "$c=1.00$、平均二乗誤差 $«w_ols»$"
          - "$c=«c»$、平均二乗誤差 $«w_bias1»$"
          - "$c=«cw»$、平均二乗誤差 $«w_cw»$"
          - "$c=«c»$、平均二乗誤差 $«mse»$"
          - "$c=«c»$、平均二乗誤差 $«w_novb»$"
        answer: 3
        distractors:
          - 不偏な最小二乗推定量が平均二乗誤差も最小だと考えた
          - バイアス (1−c)β を 2 乗せずに足した
          - 最適な c の式の分子を β² ではなく分散 0.16 にした
          - 正解
          - 平均二乗誤差に分散だけを入れ、バイアスの 2 乗を足し忘れた
        explanation: |
          **方針** 平均二乗誤差 = バイアスの 2 乗 + 分散。$E[c\hat\beta]=c\beta$ なのでバイアスは $(c-1)\beta$、分散は $c^2V[\hat\beta]$。$c$ の 2 次関数として最小化する。

          **途中式** $V=«v»$、$\beta^2=«b2»$ とおくと
          $$\mathrm{MSE}(c)=(1-c)^2\beta^2+c^2V$$
          $c$ で微分して 0 とおくと $-2(1-c)\beta^2+2cV=0$ より
          $$c^*=\frac{\beta^2}{\beta^2+V}=\frac{«b2»}{«b2»+«v»}=«c»$$
          $$\mathrm{MSE}(c^*)=(1-«c»)^2\times«b2»+«c»^2\times«v»=«bias2»+«var»=«mse»$$
          最小二乗（$c=1$）の «w_ols» より小さい。このとき $n/(n+\lambda)=«c»$ より $\lambda=«lam_ratio»\,n$。

          **答え** $c=«c»$、平均二乗誤差 $«mse»$

          **間違えやすい点** 不偏推定量が平均二乗誤差最小とは限らない。少し縮めてバイアスを入れると分散が大きく減り、全体の誤差が小さくなる（ただし最適な $c$ は未知の $\beta$ に依存するので、実際には交差検証などで $\lambda$ を選ぶ）。バイアスを 2 乗し忘れると «w_bias1»、分散だけだと «w_novb» になる。

  - id: s10p09
    title: 宿泊施設と観光キャンペーン
    context: |
      ある県の観光課は、県内の宿泊施設 «N» 軒を対象に、月あたりの宿泊者数と、県が行った誘客キャンペーンの効果を調べている。
    items:
      - id: s10p09a
        chapter: 21
        terms: [simple-random-sampling, finite-population-correction, required-sample-size]
        topic: 有限母集団修正を考えて観光客モニター名簿から満足度の割合を所定の精度で推定する標本の大きさを求める
        level: 基本
        definition: false
        type: numeric
        question: |
          県の観光客モニター名簿に登録された $N=«N»$ 人から $n$ 人を非復元の単純無作為抽出で選び、県の観光に「満足」と答える人の割合 $p$ を推定する。
          標本の割合 $\hat p$ の分散は $V[\hat p]=\dfrac{N-n}{N-1}\cdot\dfrac{p(1-p)}{n}$ である。$p$ が未知なので $p=0.5$ として、95% 信頼区間の幅が $\pm«E»$ 以内になる条件 $«z»\sqrt{V[\hat p]}\le«E»$ を満たす最小の $n$ を求めよ。
        answer: «nn»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 有限母集団修正がないときの必要数 $n_0=z^2p(1-p)/E^2$ を求め、条件を $n$ について解くと $n\ge\dfrac{Nn_0}{N-1+n_0}$ になる。

          **途中式**
          $$n_0=\frac{«z»^2\times0.25}{«E»^2}=\frac{«z2»\times0.25}{0.0025}=«n0»$$
          条件 $\dfrac{N-n}{N-1}\cdot\dfrac{0.25}{n}\le\dfrac{0.25}{n_0}$ を整理すると $n_0(N-n)\le n(N-1)$、つまり
          $$n\ge\frac{N\,n_0}{N-1+n_0}=\frac{«N»\times«n0»}{«N1»+«n0»}=\frac{«nnum»}{«nden»}=«nreq»$$
          よって最小の整数は «nn»。

          **答え** «nn» 人

          **間違えやすい点** 有限母集団修正を付けないと «w_nofpc» 人で、名簿の 2 割近くを調べるこの場合は必要以上に多くなる。«nreq» を切り捨てて «w_floor» 人にすると条件を満たさない。
          修正項を $(N-n)/N$ とした近似式 $n_0/(1+n_0/N)=«alt»$ でも、切り上げると同じ «nn» になる。

      - id: s10p09b
        chapter: 33
        terms: [backdoor-criterion, causal-effect, d-separation]
        topic: 中間変数と合流点を含む因果グラフでキャンペーン参加の総合効果を推定する調整変数の組をバックドア基準で選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          キャンペーン参加 $T$ が客室稼働率 $Y$ に与える効果について、次の因果グラフ（有向非巡回グラフ）を想定する。

          - 立地（駅からの近さ）$L$：$L\to T$、$L\to Y$
          - 施設の規模 $S$：$S\to T$
          - 口コミ投稿数 $M$：$T\to M$、$M\to Y$
          - 自治体からの表彰 $C$：$T\to C$、$Y\to C$
          - 直接の効果：$T\to Y$

          ほかに矢印はないものとする。$T$ が $Y$ に与える総合効果（$M$ を経由する分も含む）を推定するために調整する変数の組のうち、バックドア基準を満たすものはどれか。
        choices:
          - "何も調整しない"
          - "$\\{S\\}$"
          - "$\\{L, M\\}$"
          - "$\\{L\\}$"
          - "$\\{L, C\\}$"
        answer: 3
        distractors:
          - 裏口の経路 T←L→Y が開いたままになる
          - S は T の原因だが Y とつながる裏口の経路をふさがない（T←L→Y が開いたまま）
          - M は T の子孫（中間変数）で、調整すると M を経由する効果を取り除いてしまう
          - 正解
          - C は T と Y の両方から矢印が入る合流点で T の子孫。調整すると T と Y の間に見かけの関連が生じる
        explanation: |
          **方針** バックドア基準：調整する変数の組 $Z$ が (1) $T$ の子孫を含まず、(2) $T$ に入る矢印から始まる $T$ と $Y$ の間の経路（裏口の経路）をすべてふさぐこと。

          **途中式** $T$ に入る矢印は $L\to T$ と $S\to T$。
          - $T\leftarrow L\to Y$：$L$ を調整すればふさがる。
          - $T\leftarrow S$：$S$ からは $T$ 以外に矢印がないので、$Y$ に至る裏口の経路はない。

          よって裏口の経路は $T\leftarrow L\to Y$ だけで、$\{L\}$ がバックドア基準を満たす。$M$ と $C$ は $T$ の子孫なので条件 (1) により含めてはいけない。

          **答え** $\{L\}$

          **間違えやすい点** 「関係しそうな変数は全部調整する」のは誤り。中間変数 $M$ を調整すると $T\to M\to Y$ の効果が消え（総合効果ではなくなる）、合流点 $C$ を調整すると $T\to C\leftarrow Y$ の経路が開いて偏りが生じる。なお $\{L,S\}$ も基準を満たすが、選択肢にはない。

  - id: s10p10
    title: 通勤手段の選択
    context: |
      ある都市で、車通勤の人が公共交通に乗り換えるかどうかを調べた。公共交通を使う確率 $p$ を、ロジスティック回帰モデル
      $$\log\frac{p}{1-p}=\beta_0+\beta_1x_1+\beta_2x_2$$
      で表す。$x_1$ は職場の駐車料金（百円/日）、$x_2$ は自宅から最寄り駅までの距離（km）である。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
    items:
      - id: s10p10a
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, link-function]
        topic: ロジスティック回帰で公共交通の利用確率が1/2を超える駐車料金の境界を線形予測子が0になる点から求める
        level: 標準
        definition: false
        type: choice
        question: |
          推定値を真の値とみなす。駅まで «x2» km に住む人について、公共交通を使う確率が $1/2$ を超えるのは、駐車料金が 1 日あたり何円を超えるときか。最も近いものを選べ。
          必要なら $\log 2=0.693$ を使え。
        choices:
          - "«w_sign» 円"
          - "«w_nox2» 円"
          - "約 «w_ln» 円"
          - "«yen» 円"
          - "«w_half» 円"
        answer: 3
        distractors:
          - 駅までの距離の項の符号を逆にした
          - 駅までの距離の項を入れ忘れた
          - p=1/2 を「オッズ e^η=1/2」と取り違え、η=−0.693 とした
          - 正解
          - p=1/2 を「線形予測子 η=0.5」と取り違えた
        explanation: |
          **方針** $p>1/2$ ⇔ オッズ $p/(1-p)>1$ ⇔ 対数オッズ（線形予測子）$\eta>0$。$\eta=0$ となる $x_1$ を求める。

          **途中式** $x_2=«x2»$ を代入すると
          $$\eta=«b0»+«b1»x_1+(«b2»)\times«x2»=«b1»x_1«c0»$$
          $\eta>0$ ⇔ $x_1>\dfrac{2.25}{«b1»}=«x1»$（百円）、すなわち «yen» 円。

          **答え** «yen» 円

          **間違えやすい点** 確率 1/2 に対応するのはオッズ 1、対数オッズ 0。$\eta=0.5$ や $e^\eta=0.5$ と取り違えないこと。
          なお、駐車料金が 200 円上がるとオッズは $e^{2\times«b1»}=e^{«or2»}=«e05»$ 倍になる（確率の増え方は $p$ の位置によって違う）。

  - id: s10p11
    title: 信号制御方式の比較
    context: |
      渋滞対策として 3 つの信号制御方式 A（現行の固定周期）、B（感応式）、C（系統制御）を比べるため、条件の似た交差点 «N» か所を無作為に 3 方式へ «rr» か所ずつ割り付け、
      ピーク時の 1 台あたり平均待ち時間（秒）を測った。一元配置分散分析を行ったところ、方式ごとの平均は A «mA»、B «mB»、C «mC»、誤差の平均平方は $MS_E=«mse»$（自由度 «dfe»）だった。
    items:
      - id: s10p11a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 信号制御3方式の平均待ち時間をテューキーの方法で対ごとに比較し有意な対を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          テューキーの方法で 3 つの対を同時に比較する（全体の有意水準 5%）。スチューデント化された範囲の上側 5% 点は $q(3,«dfe»;0.05)=«q»$、$t$ 分布の上側点は $t_{0.025}(«dfe»)=«t»$ である。正しいものはどれか。
        choices:
          - "A と C の間だけに有意差がある"
          - "どの対にも有意差はない"
          - "A と B、A と C の間に有意差があり、B と C の間にはない"
          - "すべての対に有意差がある"
          - "A と C の間だけに有意差があるが、分散分析の F 検定が有意でなければテューキーの方法は使えない"
        answer: 0
        distractors:
          - 正解
          - 基準を q√(2MSE/r)=10.70 とし、√2 を余分に掛けた
          - 多重性を調整しない t 検定（LSD 法、基準 6.24）で判定した
          - 平均の差を q を掛けない √(MSE/r)=2.12 と比べた
          - テューキーの方法は F 検定の結果によらず使える（F 検定を前提としない同時比較）
        explanation: |
          **方針** 各群の大きさが $r$ で等しいとき、テューキーの方法では $|\bar y_i-\bar y_j|$ が $q(a,\phi_E;0.05)\sqrt{MS_E/r}$ を超える対を有意とする。

          **途中式** $\sqrt{MS_E/r}=\sqrt{«mse»/«rr»}=\sqrt{«mr»}=«se1»$、基準は $«q»\times«se1»=«hsd»$。
          - A − B $=«dAB»<«hsd»$（有意でない）
          - A − C $=«dAC»>«hsd»$（有意）
          - B − C $=«dBC»<«hsd»$（有意でない）

          **答え** A と C の間だけに有意差がある

          **間違えやすい点** スチューデント化された範囲の基準では $\sqrt{MS_E/r}$ に $q$ を掛ける。$t$ 検定のように $\sqrt{2MS_E/r}=«se2»$ を使うなら、$q$ を $\sqrt2$ で割る必要がある（そのまま掛けると «hsd_w»）。
          対ごとの $t$ 検定（基準 $«t»\times«se2»=«lsd»$）では A − B も有意になるが、3 つの比較を同時に行うので第 1 種の誤りが 5% を超える。

  - id: s10p12
    title: 観光スポットの多変量解析
    context: |
      ある観光協会は、県内の観光スポットと観光客アンケートのデータを、いくつかの多変量解析の手法で分析した。
    items:
      - id: s10p12a
        chapter: 24
        terms: [standardization-before-clustering, distance-measures, hierarchical-clustering]
        topic: 単位の違う2変数の尺度をそろえてから距離を測ると最初に併合される観光スポットの組が変わることを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          4 つの観光スポット P, Q, R, S を、年間来訪者数（万人）と平均滞在時間（時間）で階層的クラスター分析する。

          | スポット | P | Q | R | S |
          |---|---|---|---|---|
          | 来訪者数（万人） | «vP» | «vQ» | «vR» | «vS» |
          | 滞在時間（時間） | «hP» | «hQ» | «hR» | «hS» |

          単位の違いをなくすため、来訪者数を «sv»（万人）、滞在時間を «ss»（時間）で割ってから（県内の全スポットでの標準偏差）、ユークリッド距離で最初に併合する 2 つのスポットを決める。
          最初に併合される組と、その距離の組み合わせとして正しいものはどれか。
        choices:
          - "P と Q（距離 «rawPQ»）"
          - "P と S（距離 «dPS»）"
          - "Q と R（距離 «dQR2»）"
          - "Q と R（距離 «dQR»）"
          - "Q と R（距離 «manQR»）"
        answer: 3
        distractors:
          - 尺度をそろえずに元の単位で距離を測った（来訪者数の差だけで決まってしまう）
          - 2 番目に近い組を選んだ
          - 平方根をとらず、ユークリッド距離の 2 乗を答えた
          - 正解
          - 差の絶対値の和（マンハッタン距離）を使った
        explanation: |
          **方針** 各変数を標準偏差で割った座標で、すべての組のユークリッド距離を計算し、最小の組を選ぶ。最初の併合は最短距離法・最長距離法などの方法によらず、最も近い 2 点になる。

          **途中式** 割ったあとの座標は P(«zP», «yP»)、Q(«zQ», «yQ»)、R(«zR», «yR»)、S(«zS», «yS»)。距離の 2 乗と距離は
          - P–Q：$0.6^2+3.0^2=«dPQ2»$ → $«dPQ»$
          - P–R：$1.8^2+3.2^2=«dPR2»$ → $«dPR»$
          - P–S：$0.8^2+1.5^2=«dPS2»$ → $«dPS»$
          - Q–R：$1.2^2+0.2^2=«dQR2»$ → $«dQR»$
          - Q–S：$1.4^2+1.5^2=«dQS2»$ → $«dQS»$
          - R–S：$2.6^2+1.7^2=«dRS2»$ → $«dRS»$

          **答え** Q と R（距離 $«dQR»$）

          **間違えやすい点** 元の単位のままだと最も近いのは P と Q（距離 «rawPQ»）で、来訪者数の差（万人単位の大きな数）がほぼすべてを決めてしまう。尺度をそろえると、滞在時間がほぼ同じ Q と R が最も近くなる。距離の 2 乗 «dQR2» をそのまま距離と答えないこと。

      - id: s10p12b
        chapter: 25
        terms: [factor-rotation, factor-loading, communality, varimax-rotation]
        topic: 直交回転の式から回転後の第1因子の寄与（負荷量の二乗和）を求め回転で寄与が変わることを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          観光客アンケートの 3 項目（交通の便、宿の快適さ、景観）に直交 2 因子モデルを当てはめ、回転前の因子負荷量 $(\lambda_{i1},\lambda_{i2})$ を得た。

          | 項目 | 交通の便 | 宿の快適さ | 景観 |
          |---|---|---|---|
          | 第 1 因子 | «l11» | «l21» | «l31» |
          | 第 2 因子 | «l12» | «l22» | «l32» |

          これを直交回転し、回転後の負荷量を $\lambda_{i1}^*=«c»\lambda_{i1}+«sn»\lambda_{i2}$、$\lambda_{i2}^*=-«sn»\lambda_{i1}+«c»\lambda_{i2}$ とする。
          回転後の第 1 因子の寄与（3 項目の $\lambda_{i1}^{*2}$ の和）に最も近い値はどれか。
        choices:
          - "$«con1»$"
          - "$«u1»$"
          - "$«comm»$"
          - "$«con2»$"
          - "$«prop»$"
        answer: 0
        distractors:
          - 正解
          - 回転しても寄与は変わらないと考え、回転前の第 1 因子の寄与を答えた
          - 3 項目の共通性の合計（回転で変わらない量）を答えた
          - 回転後の第 2 因子の寄与を答えた
          - 寄与を項目数 3 で割った寄与率を答えた
        explanation: |
          **方針** 回転の式で各項目の $\lambda_{i1}^*$ を計算し、2 乗して足す。

          **途中式**
          - 交通の便：$«c»\times«l11»+«sn»\times«l12»=«r11»$
          - 宿の快適さ：$«c»\times«l21»+«sn»\times«l22»=«r21»$
          - 景観：$«c»\times(«l31»)+«sn»\times«l32»=«r31»$

          $$\text{寄与}=«r11»^2+«r21»^2+«r31»^2=«r11sq»+«r21sq»+«r31sq»=«con1_4»$$

          **答え** $«con1»$

          **間違えやすい点** 直交回転で変わらないのは各項目の共通性 $\lambda_{i1}^2+\lambda_{i2}^2$（例：交通の便は回転前 «h1»、回転後も $«r11»^2+«r12»^2=«h1»$）と、その合計 «comm» である。因子ごとの寄与は回転で変わり、回転前の第 1 因子の寄与は $«l11sq»+«l21sq»+«l31sq»=«u1_4»$、回転後の第 2 因子は «con2» になる（合計はどちらも «comm»）。

      - id: s10p12c
        chapter: 26
        terms: [structural-equation-modeling, goodness-of-fit-indices]
        topic: 観測変数の数と自由母数の数から構造方程式モデルの自由度を数えRMSEAを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          アンケートの観測変数 «p» 個に構造方程式モデルを当てはめた。推定した自由な母数は «qf» 個、標本の大きさは $n=«nobs»$、
          モデルの適合度のカイ二乗統計量は $\chi^2=«chi2»$ だった。モデルの自由度 $df$ を数え、
          $$\mathrm{RMSEA}=\sqrt{\frac{\max(\chi^2-df,\ 0)}{df\,(n-1)}}$$
          を求めよ（平均構造は扱わず、分散共分散行列だけを当てはめたものとする）。
        answer: «rmsea»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 分散共分散行列の異なる要素の数 $p(p+1)/2$ から、自由な母数の数を引いたものが自由度。

          **途中式** $p(p+1)/2=«p»\times11/2=«mom»$ より $df=«mom»-«qf»=«dfm»$。
          $$\mathrm{RMSEA}=\sqrt{\frac{«chi2»-«dfm»}{«dfm»\times(«nobs»-1)}}=\sqrt{\frac{«num»}{«dden»}}=\sqrt{«rat»}=«rmsea5»$$

          **答え** $«rmsea_s»$（0.05〜0.08 程度で、まずまずの当てはまり）

          **間違えやすい点** 分散共分散行列の要素は対角成分も含めて $p(p+1)/2$ 個。対角を除いた $p(p-1)/2=45$ から引くと $df=«w_df»$ になり RMSEA は $«w_rm»$。平方根をとり忘れると $«w_nosq»$。

  - id: s10p13
    title: 鉄道の月次乗客数
    context: |
      ある鉄道路線の月次乗客数から季節変動とトレンドを除いた系列 $X_t$ が、定常な AR(2) モデル
      $$X_t=«f1»X_{t-1}+«f2»X_{t-2}+\varepsilon_t$$
      に従うとする（$\varepsilon_t$ は平均 0 のホワイトノイズ）。
    items:
      - id: s10p13a
        chapter: 27
        terms: [ar-model, yule-walker-equations, autocovariance-autocorrelation, partial-autocorrelation]
        topic: AR(2)モデルの係数からユール・ウォーカー方程式で2次の自己相関を求める（偏自己相関との区別）
        level: 基本
        definition: false
        type: choice
        question: |
          ラグ 2 の自己相関係数 $\rho_2$ に最も近い値はどれか。
        choices:
          - "$«r1_3»$"
          - "$«w_pacf»$"
          - "$«w_ar1»$"
          - "$«w_phi»$"
          - "$«r2»$"
        answer: 4
        distractors:
          - ラグ 1 の自己相関 ρ1 を答えた
          - ラグ 2 の偏自己相関（= φ2）と自己相関を混同した
          - AR(1) のように ρ2 = ρ1² とした
          - ρ1 を φ1=0.5 と思い込んで ρ2 = φ1² + φ2 とした
          - 正解
        explanation: |
          **方針** 定常 AR(2) の自己相関はユール・ウォーカー方程式 $\rho_k=\phi_1\rho_{k-1}+\phi_2\rho_{k-2}$（$\rho_0=1$、$\rho_{-1}=\rho_1$）を満たす。まず $k=1$ から $\rho_1$、次に $k=2$ から $\rho_2$。

          **途中式** 定常条件：$\phi_1+\phi_2=«sumf»<1$、$\phi_2-\phi_1=«dif»<1$、$|\phi_2|<1$ を満たす。
          $k=1$：$\rho_1=\phi_1+\phi_2\rho_1$ より
          $$\rho_1=\frac{\phi_1}{1-\phi_2}=\frac{«f1»}{«omf2»}=«r1»$$
          $k=2$：
          $$\rho_2=\phi_1\rho_1+\phi_2=«f1»\times«r1»+«f2»=«f1r1»+«f2»=«r2_4»$$

          **答え** $«r2»$

          **間違えやすい点** AR(2) ではラグ 2 の**偏**自己相関が $\phi_2=«f2»$ になる（ラグ 3 以降の偏自己相関は 0）が、自己相関 $\rho_2$ は $\phi_2$ ではない。AR(1) の公式 $\rho_2=\rho_1^2=«w_ar1»$ も使えない。$\rho_1$ は $\phi_1$ ではなく $\phi_1/(1-\phi_2)$。

  - id: s10p14
    title: 交差点の事故率のベイズ推定
    context: |
      ある交差点の事故率 $\lambda$（件/年）の事後分布が、形状 «a»・レート «b» のガンマ分布（密度 $\pi(\lambda)\propto\lambda^{«a»-1}e^{-«b»\lambda}$）になった。
      この事後分布からの標本を、メトロポリス・ヘイスティングス法で発生させる練習をする。
    items:
      - id: s10p14a
        chapter: 32
        terms: [metropolis-hastings, mcmc]
        topic: 独立型メトロポリス・ヘイスティングス法で提案分布の比の補正を含めた採択確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          提案分布には、現在の値によらず平均 1 の指数分布 $q(\lambda')=e^{-\lambda'}$（$\lambda'>0$）を使う（独立型）。
          現在の値が $\lambda=«th»$ のとき、提案値 $\lambda'=«thp»$ が出た。この提案値を採択する確率に最も近い値はどれか。
          必要なら $e^{1.6}=«e16»$、$e^{2}=«e2»$ を使え。
        choices:
          - "$«w_noq»$"
          - "$«acc»$"
          - "$«w_rej»$"
          - "$«w_shape»$"
          - "$1.000$"
        answer: 1
        distractors:
          - 提案分布が対称でないのに、提案分布の比 q(λ)/q(λ') の補正を省いた（メトロポリス法の式を使った）
          - 正解
          - 採択確率ではなく棄却する確率 1−α を答えた
          - 密度の λ の指数を形状 a−1=4 ではなく a=5 とした
          - 補正の比を逆に q(λ')/q(λ) とし、比が 1 を超えたので 1 とした
        explanation: |
          **方針** メトロポリス・ヘイスティングス法の採択確率は
          $$\alpha(\lambda,\lambda')=\min\left\{1,\ \frac{\pi(\lambda')\,q(\lambda\mid\lambda')}{\pi(\lambda)\,q(\lambda'\mid\lambda)}\right\}$$
          独立型では $q(\lambda'\mid\lambda)=q(\lambda')$ なので、比は $\dfrac{\pi(\lambda')}{\pi(\lambda)}\cdot\dfrac{q(\lambda)}{q(\lambda')}$。正規化定数は約分されて不要。

          **途中式**
          $$\frac{\pi(«thp»)}{\pi(«th»)}=\left(\frac{«thp»}{«th»}\right)^{«a1»}e^{-«b»(«thp»-«th»)}=«pr»\,e^{«pexp»},\qquad \frac{q(«th»)}{q(«thp»)}=\frac{e^{-«th»}}{e^{-«thp»}}=e^{«qexp»}$$
          $$\text{比}=«pr»\times e^{«pexp»}\times e^{«qexp»}=«pr»\times e^{«tot»}=«pr»\times«e16»=«acc4»$$
          1 より小さいので、採択確率は $«acc»$。

          **答え** $«acc»$

          **間違えやすい点** 提案分布が対称なランダムウォーク型なら $q$ の比は 1 だが、独立型では補正が必要。補正を省くと $«pr»\times e^{2}=«w_noq»$ になる。
          ガンマ分布の密度の指数は形状 − 1。$\lambda^{5}$ とすると $«pr5»\times«e16»=«w_shape»$ になる。
