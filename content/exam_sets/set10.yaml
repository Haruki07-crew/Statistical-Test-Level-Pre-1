set: 10
title: 模擬試験 第10回
minutes: 90
problems:
  - id: s10p01
    title: 宅配便の配送遅延
    context: |
      ある宅配会社の 2 つの配送センター X, Y について、配送の遅延を調べている。
    items:
      - id: s10p01a
        chapter: 1
        terms: [independence-of-events, conditional-probability]
        topic: 2つの配送センターの遅延と「ちょうど一方だけ遅延」の3事象が対ごとには独立でも3つとしては独立でないことを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          ある日にセンター X で遅延が出る事象を $A$、センター Y で遅延が出る事象を $B$ とする。$A$ と $B$ は独立で、$P(A)=P(B)=\frac12$ とする。
          さらに $C$ を「X と Y のちょうど一方だけで遅延が出る」事象とする。正しいものはどれか。
        choices:
          - "$A$ と $C$、$B$ と $C$ はそれぞれ独立だが、$A,B,C$ の 3 つは互いに独立ではない"
          - "$C$ は $A$ と $B$ から決まるので、$A$ と $C$ は独立ではない"
          - "$A,B,C$ は互いに独立であり、$P(A\\cap B\\cap C)=\\frac18$ である"
          - "$C$ は事象 $A\\cap B$ とも独立である"
          - "$P(C)=\\frac14$ である"
        answer: 0
        distractors:
          - 正解
          - 「ほかの事象から決まる」ことと独立でないことを混同した。実際は P(A∩C)=P(A)P(C) が成り立つ
          - 対ごとに独立なら 3 つとしても独立だと考えた。実際は A∩B∩C は空事象で確率 0
          - A∩B（両方遅延）が起きると C は起きないので、P(C|A∩B)=0≠P(C)
          - ちょうど一方だけの場合は 2 通りあり、P(C)=1/2 である
        explanation: |
          **方針** 独立性は定義 $P(E\cap F)=P(E)P(F)$ で確かめる。3 つの事象が互いに独立であるには、2 つずつの条件に加えて $P(A\cap B\cap C)=P(A)P(B)P(C)$ も必要。

          **途中式** 4 通りの結果（X, Y の遅延の有無）はどれも確率 $\frac14$。
          - $P(C)=P(A\cap B^c)+P(A^c\cap B)=\frac14+\frac14=\frac12$
          - $A\cap C$ は「X だけ遅延」なので $P(A\cap C)=\frac14=P(A)P(C)$。同様に $P(B\cap C)=\frac14=P(B)P(C)$
          - $A\cap B\cap C$ は「両方遅延」かつ「ちょうど一方だけ遅延」で起こりえないので $P(A\cap B\cap C)=0\neq\frac18$

          **答え** $A$ と $C$、$B$ と $C$ はそれぞれ独立だが、$A,B,C$ の 3 つは互いに独立ではない

          **間違えやすい点** 2 つずつ独立（対ごとに独立）でも、3 つが互いに独立とは限らない。$A$ と $B$ の両方を知ると $C$ が完全に決まってしまうため、$C$ は $A\cap B$ と独立ではない（$P(C\mid A\cap B)=0$）。

      - id: s10p01b
        chapter: 28
        terms: [mantel-haenszel-estimator, odds-ratio-interval, three-way-table, simpsons-paradox]
        topic: 時間帯で層別した2つの2×2表から雨天と配送遅延のマンテル・ヘンツェル共通オッズ比を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          雨天が遅延に与える影響を調べるため、センター X のある月の荷物を配達の時間帯（午前・午後）で層に分けて集計した。

          | 午前 | 遅延 | 定刻 |
          |---|---|---|
          | 雨天 | «a1» | «b1» |
          | 晴天・曇天 | «c1» | «d1» |

          | 午後 | 遅延 | 定刻 |
          |---|---|---|
          | 雨天 | «a2» | «b2» |
          | 晴天・曇天 | «c2» | «d2» |

          各層の合計はどちらも «n1» 個である。2 つの層に共通な「雨天の遅延オッズ ÷ 晴天・曇天の遅延オッズ」（オッズ比）を、マンテル・ヘンツェル推定量で求めよ。
          層 $k$ の表を $\begin{pmatrix}a_k&b_k\\c_k&d_k\end{pmatrix}$、総数を $n_k$ とする。
        answer: «mh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** マンテル・ヘンツェル推定量は $\hat\psi_{MH}=\dfrac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$。各層の $a_kd_k/n_k$ と $b_kc_k/n_k$ を足し合わせてから比をとる。

          **途中式**
          午前：$a_1d_1/n_1=«a1»\times«d1»/«n1»=«ad1»$、$b_1c_1/n_1=«b1»\times«c1»/«n1»=«bc1»$
          午後：$a_2d_2/n_2=«a2»\times«d2»/«n2»=«ad2»$、$b_2c_2/n_2=«b2»\times«c2»/«n2»=«bc2»$
          $$\hat\psi_{MH}=\frac{«ad1»+«ad2»}{«bc1»+«bc2»}=\frac{«num»}{«den»}=«mh4»\cdots$$

          **答え** $«mh_s»$

          **間違えやすい点** 層を無視して 2 つの表を足し合わせると、雨天 «A»・«B»、晴天・曇天 «C»・«D» から $\dfrac{«A»\times«D»}{«B»\times«C»}=«crude»$ になる。時間帯によって雨の日の割合も遅延率も違うので、合算した表のオッズ比は交絡の影響を受ける（シンプソンのパラドックスと同じ仕組み）。
          層ごとのオッズ比（午前 «or1»、午後 «or2»）の単純平均 «or_avg» もマンテル・ヘンツェル推定量とは違う。分子・分母をそれぞれ層について足してから割る。

  - id: s10p02
    title: 交差点の進行方向
    context: |
      ある交差点に南から進入する車は、互いに独立に、直進・右折・左折をそれぞれ確率 «pS»・«pR»・«pL» で選ぶとする。
      ある信号の 1 サイクルの間に南から進入した «n» 台について、直進・右折・左折の台数を $(S,R,L)$ とする。
    items:
      - id: s10p02a
        chapter: 5
        terms: [multinomial-distribution, binomial-distribution]
        topic: 交差点に進入した8台の直進・右折・左折台数が指定の組になる確率を多項分布で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          $(S,R,L)=(«kS»,«kR»,«kL»)$ となる確率を求めよ。
        answer: «pa»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $(S,R,L)$ は試行回数 «n»、確率 $(«pS»,«pR»,«pL»)$ の多項分布に従う。$P(S=s,R=r,L=l)=\dfrac{n!}{s!\,r!\,l!}p_S^{\,s}p_R^{\,r}p_L^{\,l}$。

          **途中式** 並べ方の数は
          $$\frac{«n»!}{«kS»!\,«kR»!\,«kL»!}=\frac{40320}{120\times2\times1}=«coef»$$
          確率の積は $«pS»^{«kS»}\times«pR»^{«kR»}\times«pL»=«pS5»\times«pR2»\times«pL»=«prod»$。
          $$P=«coef»\times«prod»=«pa6»$$

          **答え** $«pa_s»$

          **間違えやすい点** 並べ方の数 $\frac{8!}{5!2!1!}$ を掛け忘れると $«pa_noc»$ 程度の非常に小さい値になる。二項係数 $\binom{8}{5}=56$ だけを掛けるのも誤りで、残り 3 台の中で右折 2 台・左折 1 台の並べ方 $\binom{3}{2}=3$ も必要（$56\times3=«coef»$）。

      - id: s10p02b
        chapter: 2
        terms: [conditional-probability-function, joint-probability-function, marginal-probability-function, multinomial-distribution]
        topic: 多項分布で直進台数を与えたときの右折台数の条件付き分布（二項分布）から確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある 1 サイクルで直進した車が $S=«kS»$ 台だったことがわかった。このとき右折した車がちょうど 2 台である条件付き確率 $P(R=2\mid S=«kS»)$ に最も近い値はどれか。
        choices:
          - "$«pb»$"
          - "$«w_uncond»$"
          - "$«w_raw»$"
          - "$«w_nocomb»$"
          - "$«w_swap»$"
        answer: 0
        distractors:
          - 正解
          - 条件を無視して、8 台中の右折台数の周辺分布 B(8, 0.25) から P(R=2) を求めた
          - 残り 3 台について、条件付きでない右折確率 0.25 をそのまま使った
          - 二項係数 3C2 を掛け忘れた
          - 右折と左折の条件付き確率を取り違えた（右折 0.375、左折 0.625 とした）
        explanation: |
          **方針** 同時確率関数を周辺確率で割って条件付き確率関数を求める。多項分布では、$S=s$ を与えると残り $n-s$ 台は「直進しなかった車」なので、各車が右折である条件付き確率は $p_R/(p_R+p_L)$ で、$R\mid S=s$ は二項分布 $B(n-s,\ p_R/(p_R+p_L))$ に従う。

          **途中式** 残りは $«n»-«kS»=«m»$ 台。直進しなかった車が右折である確率は
          $$\frac{p_R}{p_R+p_L}=\frac{«pR»}{«pRL»}=«pc»$$
          $$P(R=2\mid S=«kS»)=\binom{3}{2}«pc»^2\times«qc»=3\times«pc2»\times«qc»=«pb6»$$
          （同時確率 ÷ 周辺確率で確かめると、$P(S=5,R=2)=«pa6»$、$P(S=5)=\binom{8}{5}0.6^5\,0.4^3=0.278692\cdots$ で、比は $0.4395$ になる。）

          **答え** $«pb»$

          **間違えやすい点** 条件付けをしないで $R\sim B(8,0.25)$ から $P(R=2)=«w_uncond»$ とするのは周辺確率。条件付きでは右折の確率が 0.25 から «pc» に変わる（0.25 のままだと $«w_raw»$）。

  - id: s10p03
    title: タクシーの乗車距離
    context: |
      ある市のタクシー会社で、無作為に選んだ «n» 回の乗車の距離 $x_1,\ldots,x_n$（km）を調べたところ、標本平均は $\bar x=«xbar»$、
      $n$ で割った標本分散は $«m2»$ だった。乗車距離を、形状 $\alpha$・**尺度** $\theta$ のガンマ分布（密度 $f(x)=\dfrac{x^{\alpha-1}e^{-x/\theta}}{\Gamma(\alpha)\theta^\alpha}$、$x>0$）で表し、$\alpha,\theta$ はどちらも未知とする。
      ある担当者はモーメント法で $\hat\theta=«m2»/«xbar»=«theta»$、$\hat\alpha=«xbar»/«theta»=«alpha»$ と推定した。
    items:
      - id: s10p03a
        chapter: 8
        terms: [sufficient-statistic, factorization-theorem, method-of-moments, gamma-distribution]
        topic: 形状と尺度が未知のガンマ分布で因数分解定理から2次元の十分統計量を見つけモーメント推定量と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          $(\alpha,\theta)$ に対する十分統計量について、正しいものはどれか。
        choices:
          - '$\bar x$ だけで十分統計量になる'
          - '$(\bar x,\ \frac1n\sum(x_i-\bar x)^2)$ が十分統計量なので、モーメント推定量は十分統計量の関数になっている'
          - '$(\sum x_i,\ \sum\log x_i)$ が十分統計量で、モーメント推定量はこの関数としては書けない'
          - '$\max_i x_i$ が十分統計量になる'
          - '$\sum\log x_i$ だけで十分統計量になる'
        answer: 2
        distractors:
          - α が既知なら Σx_i（すなわち x̄）が十分統計量だが、α も未知なので足りない
          - 正規分布の十分統計量と混同した。ガンマ分布の尤度は Σx_i² を通してデータに依存しない
          - 正解
          - 台の端が母数に依存する一様分布の場合と混同した
          - θ が既知なら Σlog x_i が十分統計量だが、θ も未知なので足りない
        explanation: |
          **方針** 同時密度を「母数とデータの関数がある統計量を通してだけ結びつく部分」と「母数を含まない部分」に分ける（因数分解定理）。

          **途中式**
          $$\prod_{i=1}^n f(x_i)=\frac{1}{\Gamma(\alpha)^n\theta^{n\alpha}}\left(\prod x_i\right)^{\alpha-1}\exp\left(-\frac{1}{\theta}\sum x_i\right)
          =\underbrace{\frac{1}{\Gamma(\alpha)^n\theta^{n\alpha}}\exp\left\{(\alpha-1)\sum\log x_i-\frac1\theta\sum x_i\right\}}_{g(\sum x_i,\ \sum\log x_i;\ \alpha,\theta)}\times\underbrace{1}_{h(x)}$$
          よって $T=(\sum x_i,\ \sum\log x_i)$ が十分統計量（2 母数の指数型分布族の自然な十分統計量）。

          **答え** $(\sum x_i,\ \sum\log x_i)$ が十分統計量で、モーメント推定量はこの関数としては書けない

          **間違えやすい点** モーメント推定量は $\sum x_i^2$（標本分散）を使うが、$\sum x_i^2$ は $T$ からは決まらない。十分統計量の関数でない推定量はデータの情報を一部捨てていて、一般に最尤推定量（$T$ の関数）より効率が悪い。
          片方の母数が既知なら十分統計量は 1 次元になる（$\alpha$ 既知なら $\sum x_i$、$\theta$ 既知なら $\sum\log x_i$）。

  - id: s10p04
    title: フェリーターミナル
    context: |
      ある離島航路のフェリーターミナルについて考える。
    items:
      - id: s10p04a
        chapter: 15
        terms: [poisson-process, interarrival-time, binomial-distribution]
        topic: ポアソン過程で1時間の到着台数が与えられたとき最初の20分の到着台数が二項分布に従うことを使う
        level: 基本
        definition: false
        type: choice
        question: |
          乗船待ちの車は、一定の率のポアソン過程に従ってターミナルに到着するとする。ある日の 8 時から 9 時までの 1 時間に、ちょうど «k» 台が到着したことがわかっている。
          このとき、8 時から 8 時 20 分までの 20 分間に到着した車がちょうど «j» 台である条件付き確率に最も近い値はどれか。必要なら $e^{-2}=«e2»$ を使え。
        choices:
          - "$«w_pois»$"
          - "$«w_noc»$"
          - "$«w_swap»$"
          - "$«w_frac»$"
          - "$«pa»$"
        answer: 4
        distractors:
          - 条件を使わず、1 時間 6 台の率から 20 分の平均 2 台のポアソン分布で P(N=2) を求めた
          - 二項係数 6C2 を掛け忘れた
          - 前半 20 分に入る確率 1/3 と入らない確率 2/3 の指数を取り違えた
          - 1 台が前半 20 分に到着する確率 1/3 をそのまま答えた
          - 正解
        explanation: |
          **方針** ポアソン過程では、区間 $[0,T]$ の到着数が $n$ と与えられると、$n$ 個の到着時刻は $[0,T]$ 上の独立な一様分布の値を並べたものと同じ分布になる。よって部分区間に入る台数は二項分布 $B(n,\ \text{区間の長さ}/T)$ に従う。到着率は答えに関係しない。

          **途中式** 1 台が最初の 20 分に入る確率は $20/60=1/3$。
          $$P(\text{前半 20 分に }«j»\text{ 台}\mid\text{1 時間に }«k»\text{ 台})=\binom{6}{2}\left(\frac13\right)^2\left(\frac23\right)^4=«c62»\times\frac{1}{9}\times\frac{16}{81}=\frac{«num»}{«den»}=«pa5»$$

          **答え** $«pa»$

          **間違えやすい点** 条件を使わずに「20 分の平均は 2 台」としてポアソン分布 $P(N=2)=e^{-2}\dfrac{2^2}{2!}=2\times«e2»=«w_pois»$ を答えるのは、1 時間の台数がわかっていないときの確率。条件付きでは残り 40 分の台数が 6 − 2 = 4 台に決まるので、二項分布になる。

      - id: s10p04b
        chapter: 7
        terms: [central-limit-theorem, sum-of-random-variables, normal-distribution]
        topic: 中心極限定理でフェリーに積む車両の合計重量が積載上限を超える確率を5%以下にする最大台数を求める
        level: 応用
        definition: false
        type: choice
        question: |
          このフェリーの車両甲板の積載上限は «cap» トンである。乗せる車 1 台の重量は互いに独立で、平均 «m» トン、標準偏差 «sd» トンとする。
          $n$ 台の合計重量を中心極限定理により正規分布で近似したとき、合計重量が «cap» トンを超える確率を 5% 以下にできる最大の台数 $n$ はどれか。
          標準正規分布の上側 5% 点は «z»、上側 2.5% 点は «z2» である。
        choices:
          - "«n_lin» 台"
          - "«n_196» 台"
          - "«n_up» 台"
          - "«n_ok» 台"
          - "«n_mean» 台"
        answer: 3
        distractors:
          - 合計の標準偏差を √n σ ではなく n σ とした
          - 片側の条件なのに両側の上側 2.5% 点 1.960 を使った
          - 2 次方程式の解 n=37.32 を切り上げた（38 台では超える確率が 5% を上回る）
          - 正解
          - 重量のばらつきを無視し、平均だけで 60÷1.5 とした
        explanation: |
          **方針** 合計重量 $T_n$ は平均 $«m»n$、標準偏差 $«sd»\sqrt n$ の正規分布で近似できる。$P(T_n>«cap»)\le0.05$ ⇔ $«m»n+«z»\times«sd»\sqrt n\le«cap»$。$x=\sqrt n$ とおいて 2 次不等式を解く。

          **途中式** $«m»x^2+«zsd»x-«cap»\le0$ の正の解は
          $$x=\frac{-«zsd»+\sqrt{«zsd»^2+4\times«m»\times«cap»}}{2\times«m»}=\frac{-«zsd»+\sqrt{«disc»}}{3}=\frac{-«zsd»+«sqd»}{3}=«x»$$
          よって $n\le x^2=«xx»$ で、整数では $n=«n_ok»$。念のため確かめると
          - $n=«n_ok»$：$«m37»+«z»\times«sd»\times«sq37»=«m37»+«s37»=«c37»\le«cap»$（条件を満たす）
          - $n=«n_up»$：$«m38»+«z»\times«sd»\times«sq38»=«m38»+«s38»=«c38»>«cap»$（満たさない）

          **答え** «n_ok» 台

          **間違えやすい点** 独立な和の標準偏差は $\sqrt n\,\sigma$ で、$n\sigma$ ではない（$n\sigma$ とすると «n_lin» 台）。「超える確率を 5% 以下」は片側なので上側 5% 点 «z» を使う（«z2» だと «n_196» 台）。37.32 を切り上げて «n_up» 台にすると上限を超える確率が 5% を上回る。

      - id: s10p04c
        chapter: 6
        terms: [exponential-distribution, survival-function, independence-of-events]
        topic: 2つの窓口の残り受付時間が独立な指数分布のとき最初に窓口が空くまでの時間（最小値）が一定時間を超える確率
        level: 標準
        definition: false
        type: numeric
        question: |
          乗船手続きの窓口は 2 つあり、1 人の受付時間は窓口 1 では平均 «m1» 分、窓口 2 では平均 «m2» 分の指数分布に従い、互いに独立とする。
          ある客が着いたとき、2 つの窓口はどちらも受付中で、ほかに待っている客はいなかった。この客がどちらかの窓口が空くまで «w» 分を超えて待つ確率を求めよ。
          必要なら $e^{-5/6}=«e56»$、$e^{-1/5}=«e15»$ を使え。
        answer: «pc»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 指数分布は無記憶性をもつので、受付がすでにどれだけ進んでいても、残りの受付時間はそれぞれ平均 «m1» 分・«m2» 分の指数分布に従う。待ち時間はその最小値 $W=\min(R_1,R_2)$ で、$P(W>w)=P(R_1>w)P(R_2>w)$。

          **途中式**
          $$P(W>«w»)=e^{-«w»/«m1»}\times e^{-«w»/«m2»}=e^{-«w»\left(\frac14+\frac16\right)}=e^{-«w»\times\frac{5}{12}}=e^{-5/6}=«e56»$$
          （$W$ はレート $\frac14+\frac16=\frac{5}{12}$（1 分あたり）の指数分布で、平均待ち時間は $12/5=«meanW»$ 分。）

          **答え** $«pc_s»$

          **間違えやすい点** 最小値のレートは 2 つのレートの和で、平均の和ではない。平均 $«m1»+«m2»=10$ 分の指数分布とすると $e^{-2/10}=«e15»$ になる。
          また「すでに受付中だから残り時間は短い」と考えるのは誤りで、指数分布では経過時間によらず残り時間の分布は同じ（無記憶性）。

  - id: s10p05
    title: 通勤経路の所要時間
    context: |
      ある会社員は、自宅から職場まで距離 10 km の道のりを車で通勤している。
    items:
      - id: s10p05a
        chapter: 4
        terms: [change-of-variables, uniform-distribution, expectation-variance-properties]
        topic: 一様分布に従う所要時間から平均速度（距離÷時間）の期待値を求め平均所要時間から計算した速度と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          いつもの経路の所要時間 $T$（分）は区間 $[20,30]$ の一様分布に従うとする。この日の平均速度 $V=\dfrac{10}{T/60}=\dfrac{600}{T}$（km/h）の期待値 $E[V]$ に最も近い値はどれか。
          必要なら $\log 1.5=«ln15»$（自然対数）を使え。
        choices:
          - "$«w_inv»$"
          - "$«w_mid»$"
          - "$«w_jinv»$"
          - "$«w_no10»$"
          - "$«ev»$"
        answer: 4
        distractors:
          - 平均所要時間 25 分から 600/25 とした（E[1/T] と 1/E[T] を混同）
          - V の密度をヤコビアンなしの一様分布 1/10（20≦v≦30）とみなした（両端の速度の平均と同じ値）
          - V の密度に |dt/dv| の代わりに |dv/dt|=v²/600 を掛けた
          - T の密度 1/10 を掛け忘れた
          - 正解
        explanation: |
          **方針** $V=g(T)$ の期待値は、$V$ の密度を求めなくても $E[g(T)]=\int g(t)f_T(t)\,dt$ で計算できる。$f_T(t)=1/10$（$20\le t\le30$）。

          **途中式**
          $$E[V]=\int_{20}^{30}\frac{600}{t}\cdot\frac{1}{10}\,dt=60\left[\log t\right]_{20}^{30}=60\log\frac{30}{20}=60\times«ln15»=«ev»$$
          （変数変換で密度を求めると $f_V(v)=\frac{1}{10}\cdot\frac{600}{v^2}=\frac{60}{v^2}$（$20\le v\le30$）で、$\int_{20}^{30}v\cdot\frac{60}{v^2}dv=60\log1.5$ と同じ値になる。）

          **答え** $«ev»$

          **間違えやすい点** $E[600/T]\neq600/E[T]=«w_inv»$。$1/t$ は下に凸なので、イェンセンの不等式から $E[1/T]>1/E[T]$ となり、平均速度の期待値は平均所要時間から計算した速度より大きい。
          $V$ は一様分布ではない（$T$ が一様でも逆数をとると速度の遅い側に密度が偏る）ので、両端の平均 «w_mid» も誤り。

      - id: s10p05b
        chapter: 9
        terms: [ci-paired-difference, t-distribution, confidence-interval]
        topic: 同じ日に測った現行経路とバイパス経路の所要時間の差の95%信頼区間を対応のあるデータとして求める
        level: 標準
        definition: false
        type: numeric
        question: |
          新しく開通したバイパス経由の経路 B と、いつもの経路 A を比べるため、8 日間、毎朝同じ時刻に出発する 2 台の車で同時に両方の経路を走り、所要時間（分）を測った。

          | 日 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | A | «a1» | «a2» | «a3» | «a4» | «a5» | «a6» | «a7» | «a8» |
          | B | «b1» | «b2» | «b3» | «b4» | «b5» | «b6» | «b7» | «b8» |

          日ごとの差 $D=A-B$ が互いに独立に同じ正規分布に従うとして、差の母平均 $\mu_D$ の 95% 信頼区間（両側）の**下限**を求めよ。
          $t$ 分布の上側点は $t_{0.025}(7)=«t7»$、$t_{0.025}(14)=«t14»$、$t_{0.05}(7)=«t05»$ である。標準偏差と標準誤差は小数第4位まで求めて計算せよ。
        answer: «lo»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 同じ日の A と B は道路の混み具合を共有しているので対応のあるデータ。差 $D_i$ の 1 標本として $\bar D\pm t_{0.025}(n-1)\,s_D/\sqrt n$ を作る。

          **途中式** 差は «d1», «d2», «d3», «d4», «d5», «d6», «d7», «d8»。合計 «dsum» より $\bar D=«dbar»$。
          偏差平方和は $\sum(D_i-\bar D)^2=«ss»$、不偏分散 $s_D^2=«ss»/7=«s2»$、$s_D=«sd»$。
          $$\frac{s_D}{\sqrt8}=\frac{«sd»}{«sqn»}=«se»,\qquad t_{0.025}(7)\times«se»=«t7»\times«se»=«half»$$
          $$\text{下限}=«dbar»-«half»=«lo4»$$

          **答え** $«lo_s»$（上限は $«hi»$。区間が 0 を含まないので、B のほうが平均して速いといえる）

          **間違えやすい点** 2 つの独立な標本とみなしてプールした分散と自由度 14 を使うと、日ごとの混み具合のばらつきが誤差に入り、下限は $«lo_pool»$ になって 0 を含んでしまう。
          両側 95% なので $t_{0.05}(7)$ ではなく $t_{0.025}(7)$ を使う（$t_{0.05}$ だと $«lo_t05»$）。$s_D$ を $n$ で割った分散から作ると $«lo_n»$ になる。

  - id: s10p06
    title: 路線バスの定時運行
    context: |
      ある市の交通局は、路線バスの定時運行を改善する施策を試している。
    items:
      - id: s10p06a
        chapter: 10
        terms: [holm-method, bonferroni-correction, multiple-testing]
        topic: 5路線の定時率改善のp値にホルム法を適用して棄却される路線を選ぶ（並べ替えの必要性）
        level: 標準
        definition: false
        type: choice
        question: |
          5 つの路線 A〜E で、施策の前後の定時率に差がないという帰無仮説をそれぞれ検定し、次の $p$ 値を得た。

          | 路線 | A | B | C | D | E |
          |---|---|---|---|---|---|
          | $p$ 値 | «pA» | «pB» | «pC» | «pD» | «pE» |

          5 つの検定全体の第 1 種の誤りの確率（ファミリーワイズエラー率）を 5% 以下に抑えるため、ホルム法を用いる。帰無仮説が棄却される路線をすべて挙げたものはどれか。
        choices:
          - "棄却される路線はない"
          - "B と D"
          - "B のみ"
          - "B と D と E"
          - "A と B と D と E"
        answer: 1
        distractors:
          - p 値を小さい順に並べ替えず、表の順（A から）に 0.05/5, 0.05/4, … と比べ、最初の A で止めた
          - 正解
          - ボンフェローニ法（すべてを 0.05/5=0.01 と比べる）の結果
          - 3 番目で棄却できなかったあとも比較を続け、E（0.023 ≦ 0.05/2）を棄却した
          - 多重性を調整せず、すべてを 0.05 と比べた
        explanation: |
          **方針** ホルム法は $p$ 値を小さい順 $p_{(1)}\le\cdots\le p_{(m)}$ に並べ、$p_{(i)}\le\alpha/(m-i+1)$ を $i=1$ から順に調べ、初めて満たさなくなったところで止める。それより前の仮説だけを棄却する。

          **途中式** 小さい順に B «pB», D «pD», A «pA», E «pE», C «pC»。
          - $i=1$：B $«pB»\le0.05/5=0.01$ → 棄却
          - $i=2$：D $«pD»\le0.05/4=0.0125$ → 棄却
          - $i=3$：A $«pA»>0.05/3=0.0167$ → 棄却できず、ここで終了（E, C も棄却しない）

          **答え** B と D

          **間違えやすい点** 止まったあとに E（$«pE»\le0.05/2$）を棄却してはいけない。ボンフェローニ法（すべて 0.01 と比較）なら B だけで、ホルム法はそれより検出力が高いが同じくファミリーワイズエラー率を 5% 以下に保つ。並べ替えずに表の順で比べるのも誤り。

      - id: s10p06b
        chapter: 13
        terms: [wilcoxon-rank-sum-test, normal-approximation-rank-tests, mann-whitney-u-test]
        topic: 優先信号の有無で2群のバス遅延時間をウィルコクソン順位和の期待値と分散から正規近似のz値にする
        level: 標準
        definition: false
        type: numeric
        question: |
          バス優先信号の効果を見るため、優先信号のある区間を走った便 «m» 本と、ない区間を走った便 «n» 本の遅延時間（分）を調べた。

          | 優先信号あり | «w1» | «w2» | «w3» | «w4» | «w5» | «w6» | | |
          |---|---|---|---|---|---|---|---|---|
          | 優先信号なし | «o1» | «o2» | «o3» | «o4» | «o5» | «o6» | «o7» | «o8» |

          全 «N» 本をまとめて小さい順に順位をつけ、「優先信号あり」の順位和 $W$ を検定統計量とするウィルコクソンの順位和検定を、正規近似（連続修正なし）で行う。
          標準化した値 $z=(W-E[W])/\sqrt{V[W]}$ を求めよ（$E[W]$, $V[W]$ は 2 群の分布が同じという帰無仮説のもとでの値）。必要なら $\sqrt{60}=«sqV»$ を使え。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ（負の値なら符号もつける）。±0.01 の差まで正解とする。
        explanation: |
          **方針** 同順位がないとき、大きさ $m$ の群の順位和 $W$ は帰無仮説のもとで $E[W]=\dfrac{m(N+1)}{2}$、$V[W]=\dfrac{mn(N+1)}{12}$（$N=m+n$）。

          **途中式** 全体を並べると 0.8, 1.2, 1.7, 2.1, 2.4, 2.9, 3.1, 3.5, 3.8, 4.4, … で、「あり」の順位は «rw»。
          $$W=«W»,\qquad E[W]=\frac{«m»\times«N1»}{2}=«EW»,\qquad V[W]=\frac{«m»\times«n»\times«N1»}{12}=«VW»$$
          $$z=\frac{«W»-«EW»}{\sqrt{«VW»}}=\frac{«diff»}{«sqV»}=«z4»$$

          **答え** $«z_s»$（両側 5% の棄却限界 ±1.96 を超えるので、優先信号ありのほうが遅延が小さいといえる）

          **間違えやすい点** $E[W]$ の $m$ は順位和をとった群の大きさ（«m»）。「なし」の群で順位和をとると $W=«Wo»$、$E=«EWo»$ となり符号だけが逆の $z=+2.19$ になるので、どちらの群の和かを確かめる。
          分散の分母 12 を 6 とすると $z=«w_var»$ になる。連続修正をすると $«z_cc»$ だが、ここでは連続修正なしと指定している。

  - id: s10p07
    title: 温泉地の月別観光客数
    context: |
      ある温泉地の月別観光客数 $Y$（千人）を、«n» か月分のデータで、説明変数 «k» 個（平均気温、降水日数、祝日数、季節ダミー 3 個）と定数項の重回帰モデル（母数 «p2» 個）に当てはめた。
      残差平方和は $«rss2»$、決定係数は $R^2=«R2»$ だった。誤差は互いに独立に同じ正規分布に従うとする。
    items:
      - id: s10p07a
        chapter: 16
        terms: [regression-coefficient-t-test, coefficient-of-determination, partial-f-test]
        topic: 観光客数の重回帰で1変数のt値から、その変数を除いたときの決定係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          祝日数の係数の $t$ 値は $«t»$ だった。祝日数だけを除いて（ほかの説明変数はそのままで）当てはめ直したときの決定係数に最も近い値はどれか。
        choices:
          - "$«R2r»$"
          - "$«R2s»$"
          - "$«w_t»$"
          - "$«w_R»$"
          - "$«w_noR»$"
        answer: 0
        distractors:
          - 正解
          - 変数を 1 個除いても決定係数は変わらないと考えた
          - t 値を 2 乗せずに使った
          - 1−R² の代わりに R² を掛けた
          - 残差の割合 1−R² を掛け忘れた
        explanation: |
          **方針** 1 個の係数の $t$ 検定は、その変数を除いたモデルとの部分 $F$ 検定（分子の自由度 1）と同じで、$t^2=F=\dfrac{(R^2-R_r^2)/1}{(1-R^2)/(n-k-1)}$ が成り立つ。これを $R_r^2$ について解く。

          **途中式** 誤差の自由度は $n-k-1=«n»-«k»-1=«df2»$。
          $$R^2-R_r^2=\frac{t^2(1-R^2)}{n-k-1}=\frac{«t2»\times«omR2»}{«df2»}=«dR2»$$
          $$R_r^2=«R2»-«dR2»=«R2r5»$$

          **答え** $«R2r»$

          **間違えやすい点** 部分 $F$ 統計量を決定係数で書くと分母は $(1-R^2)/(n-k-1)$。これを忘れて $t^2/(n-k-1)$ を引くと $«w_noR»$ になる。$t$ 値が 2.5 と大きくても決定係数の低下は «dR2» と小さい（係数の有意性と説明力の増え方は別の話）。

      - id: s10p07b
        chapter: 17
        terms: [breusch-pagan-test, heteroscedasticity, residual]
        topic: 観光客数の回帰の残差の2乗を2変数に回帰した決定係数からブルーシュ・ペーガン統計量nR²を作り不均一分散を判定する
        level: 応用
        definition: false
        type: choice
        question: |
          観光客の多い月ほど残差のばらつきが大きいように見えたので、このモデルの残差の 2 乗 $e_i^2$ を平均気温と祝日数の 2 変数（と定数項）に回帰する補助回帰を行ったところ、
          決定係数は $R^2_{aux}=«R2aux»$ だった。ブルーシュ・ペーガン検定（スチューデント化した $nR^2$ 型）を有意水準 5% で行う。
          カイ二乗分布の上側 5% 点は自由度 2 で «c2»、自由度 6 で «c6» である。正しいものはどれか。
        choices:
          - "統計量は $«bp»$ で «c6» 以下なので、誤差の分散が一定という仮説を棄却しない"
          - "統計量は $«bp»$ で «c2» を超えるので、誤差の分散が一定という仮説を棄却する"
          - "統計量は $«R2aux»$ で «c2» 以下なので、誤差の分散が一定という仮説を棄却しない"
          - "統計量は $«Faux»$ で «c2» 以下なので、誤差の分散が一定という仮説を棄却しない"
          - "統計量は $«bp»$ で «c2» を超えるので、最小二乗推定量の係数には偏りがある"
        answer: 1
        distractors:
          - 自由度を補助回帰の説明変数の数 2 ではなく、もとのモデルの説明変数の数 6 とした
          - 正解
          - 補助回帰の決定係数をそのまま統計量とし、n を掛け忘れた
          - 補助回帰の F 統計量を、カイ二乗分布の点と比べた
          - 不均一分散があっても係数の最小二乗推定量は不偏のまま。影響を受けるのは標準誤差（と効率）
        explanation: |
          **方針** 誤差の分散が一定なら、残差の 2 乗は説明変数でほとんど説明できない。補助回帰の $nR^2_{aux}$ は帰無仮説のもとで、補助回帰の説明変数の数（定数項を除く）を自由度とするカイ二乗分布に近似的に従う。

          **途中式**
          $$LM=nR^2_{aux}=«n»\times«R2aux»=«bp»$$
          自由度は補助回帰の説明変数の数 2。$«bp»>«c2»$ なので棄却する。

          **答え** 統計量は $«bp»$ で «c2» を超えるので、誤差の分散が一定という仮説を棄却する

          **間違えやすい点** 自由度は補助回帰に入れた変数の数で決まる（もとのモデルの 6 ではない）。不均一分散があっても係数の推定値は不偏だが、通常の標準誤差が正しくなくなるので、頑健標準誤差や重み付き最小二乗法を検討する。
          補助回帰全体の $F$ 統計量 $\frac{R^2/2}{(1-R^2)/45}=«Faux»$ を使う版もあるが、その場合は $F(2,45)$ 分布と比べる。

  - id: s10p08
    title: 運賃と乗客数
    context: |
      ある地方の鉄道・バス事業者 «n» 路線について、昨年からの運賃の変化と乗客数の変化を調べた。
    items:
      - id: s10p08a
        chapter: 11
        terms: [partial-correlation-coefficient, test-correlation-coefficient, spurious-correlation, t-distribution]
        topic: 減便率を除いた運賃変化と乗客数変化の偏相関係数を求め自由度n−3のt検定で無相関を調べる
        level: 標準
        definition: false
        type: choice
        question: |
          «n» 路線の運賃変化率 $X$ と乗客数変化率 $Y$ の標本相関係数は $r_{XY}=«r»$ だった。ところが、運転士不足による減便率 $W$ との相関係数は $r_{XW}=«rxz»$、$r_{YW}=«ryz»$ で、
          減便の多い路線ほど運賃を上げ、減便の多い路線ほど乗客が減っていた。
          $W$ の影響を除いた $X$ と $Y$ の偏相関係数 $r_{XY\cdot W}$ を求め、3 変数が 3 変量正規分布に従うとして、母偏相関係数が 0 という帰無仮説を検定する $t$ 統計量に最も近い値はどれか。
          なお $t_{0.025}(19)=«tc19»$、$t_{0.025}(20)=«tc»$ である。
        choices:
          - "$«w_nosq»$"
          - "$«w_df»$"
          - "$«w_den»$"
          - "$«t»$"
          - "$«w_raw»$"
        answer: 3
        distractors:
          - 偏相関係数を求めたあと、√(1−r²) で割り忘れた
          - 自由度を偏相関の n−3 ではなく、ふつうの相関係数の n−2 とした
          - 偏相関係数の分母の平方根をとり忘れ、(1−r_XW²)(1−r_YW²) で割った
          - 正解
          - W の影響を除かず、もとの相関係数 r_XY=«r» で無相関検定をした
        explanation: |
          **方針** 偏相関係数は $r_{XY\cdot W}=\dfrac{r_{XY}-r_{XW}r_{YW}}{\sqrt{(1-r_{XW}^2)(1-r_{YW}^2)}}$。変数を 1 個除いて（条件付けて）いるので、母偏相関が 0 のとき $t=\dfrac{r_{XY\cdot W}\sqrt{n-3}}{\sqrt{1-r_{XY\cdot W}^2}}$ は自由度 $n-3$ の $t$ 分布に従う。

          **途中式**
          $$r_{XY\cdot W}=\frac{«r»-«rxz»\times(«ryz»)}{\sqrt{(1-«rxz2»)(1-«ryz2»)}}=\frac{«pnum»}{\sqrt{«pden»}}=\frac{«pnum»}{«sqpden»}=«pr4»$$
          $r_{XY\cdot W}^2=«pr2»$、$\sqrt{1-r_{XY\cdot W}^2}=\sqrt{«one_pr2»}=«sq1pr2»$、$\sqrt{«df3»}=«sqdf3»$。
          $$t=\frac{«pr4»\times«sqdf3»}{«sq1pr2»}=«t4»$$

          **答え** $«t»$（$|t|<«tc19»$ なので、両側 5% で偏相関が 0 という仮説を棄却しない）

          **間違えやすい点** もとの相関係数のまま検定すると $t=«w_raw»$ で $|t|>«tc»$ となり有意になるが、これは減便という共通の要因による見かけの相関（擬似相関）を多く含む。偏相関の検定の自由度は、除いた変数の数だけ減って $n-3=«df3»$。
          棄却しないことは「運賃が乗客数に影響しない」ことの証明ではない（標本が小さく検出力が低い）。

      - id: s10p08b
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 燃料費を操作変数にして運賃が乗客数に与える効果を操作変数推定量で求める
        level: 応用
        definition: false
        type: choice
        question: |
          事業者は乗客が増えそうな路線で運賃を上げる傾向があり、運賃 $X$ は誤差項と相関する（内生性がある）と考えられる。そこで、路線ごとの燃料費の変化 $Z$ を操作変数として、
          $Y=\beta_0+\beta_1X+\varepsilon$（$Y$ は乗客数の変化）の $\beta_1$ を推定する。$Z$ は運賃を通じてしか乗客数に影響せず、$\varepsilon$ と無相関とする。
          同じ割る数で求めた標本分散・共分散は次のとおり。

          | $V(X)$ | $\mathrm{Cov}(X,Y)$ | $\mathrm{Cov}(Z,X)$ | $\mathrm{Cov}(Z,Y)$ | $V(Z)$ |
          |---|---|---|---|---|
          | «vx» | «cxy» | «czx» | «czy» | «vz» |

          操作変数推定量 $\hat\beta_1$ に最も近い値はどれか。
        choices:
          - "$«iv»$"
          - "$«ols»$"
          - "$«w_vx»$"
          - "$«w_vz»$"
          - "$«w_inv»$"
        answer: 0
        distractors:
          - 正解
          - 内生性を無視した最小二乗推定量 Cov(X,Y)/V(X) を答えた
          - 分子に Cov(Z,Y)、分母に V(X) を使った
          - 誘導形（Y を Z に回帰した傾き）Cov(Z,Y)/V(Z) を答えた
          - 分子と分母を逆にした
        explanation: |
          **方針** 単回帰の操作変数推定量は $\hat\beta_1^{IV}=\dfrac{\mathrm{Cov}(Z,Y)}{\mathrm{Cov}(Z,X)}$。$Z$ が誤差と無相関という条件 $\mathrm{Cov}(Z,\varepsilon)=0$ を標本で成り立たせる式である。

          **途中式**
          $$\hat\beta_1^{IV}=\frac{«czy»}{«czx»}=«iv»$$
          2 段階最小二乗法で確かめると、第 1 段階で $X$ を $Z$ に回帰した傾きは $«czx»/«vz»=«fs»$、誘導形で $Y$ を $Z$ に回帰した傾きは $«czy»/«vz»=«rf»$ で、その比 $«rf»/«fs»=«iv»$ と一致する。

          **答え** $«iv»$

          **間違えやすい点** 最小二乗推定量 $«cxy»/«vx»=«ols»$ は、乗客が増える路線ほど運賃を上げるという逆向きの関係を含むため、運賃の負の効果を過小に（0 に近く）見積もる。誘導形の傾き «rf» は「燃料費が 1 増えたときの乗客数の変化」であって運賃の効果ではない。

  - id: s10p09
    title: 宿泊施設と観光キャンペーン
    context: |
      ある県の観光課は、県内の宿泊施設 «Nh» 軒を対象に、月あたりの宿泊者数と、県が行った誘客キャンペーンの効果を調べている。
    items:
      - id: s10p09a
        chapter: 21
        terms: [regression-estimation, ratio-estimation, simple-random-sampling]
        topic: 客室数を補助変数にした回帰推定で宿泊施設1軒あたりの月間宿泊者数を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          «Nh» 軒から «n» 軒を単純無作為抽出して調べたところ、1 軒あたりの月間宿泊者数の標本平均は $\bar y=«ybar»$ 人、客室数の標本平均は $\bar x=«xbar»$ 室、
          標本から求めた宿泊者数の客室数への回帰係数は $b=«b»$ だった。県の登録データから、全 «Nh» 軒の客室数の平均は $\bar X=«Xbar»$ 室とわかっている。
          回帰推定量による 1 軒あたりの月間宿泊者数の推定値を求めよ。
        answer: «yreg»
        tolerance: 0.4
        answer_format: 整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 回帰推定量は $\hat{\bar Y}_{reg}=\bar y+b(\bar X-\bar x)$。標本の客室数が母集団より少なめに偏ったぶんを、回帰係数を使って補正する。

          **途中式**
          $$\hat{\bar Y}_{reg}=«ybar»+«b»\times(«Xbar»-«xbar»)=«ybar»+«b»\times«dx»=«ybar»+«adj»=«yreg»$$

          **答え** «yreg» 人

          **間違えやすい点** 補正の向きを逆（$\bar x-\bar X$）にすると «w_sign» 人。比推定量 $\bar y\,\bar X/\bar x=«yrat»$ は原点を通る比例関係を仮定した別の推定量で、回帰推定量とは一般に一致しない。標本平均 «ybar» 人のままでは補助情報を使っていない。

      - id: s10p09b
        chapter: 33
        terms: [frontdoor-criterion, causal-effect, backdoor-criterion]
        topic: 観測されない交絡があるキャンペーンで割引クーポンの利用を経由するフロントドア調整により平均因果効果を求める
        level: 応用
        definition: false
        type: choice
        question: |
          キャンペーンに参加した施設には割引クーポンが配られる。参加 $T$（1/0）、クーポン利用の有無 $M$（1/0）、その月の満室日の有無 $Y$（1/0）について、
          $T\to M\to Y$ の経路のほかに、観測されない経営努力 $U$ が $T$ と $Y$ の両方に影響する（$T\leftarrow U\to Y$）と考える。$T$ は $M$ を通してだけ $Y$ に影響し、$U$ は $M$ に影響しない。
          観測データから次の確率がわかっている。

          | $P(T=1)$ | $P(M=1\mid T=1)$ | $P(M=1\mid T=0)$ |
          |---|---|---|
          | «pT» | «pM1» | «pM0» |

          | $P(Y=1\mid M,T)$ | $T=1$ | $T=0$ |
          |---|---|---|
          | $M=1$ | «y11» | «y10» |
          | $M=0$ | «y01» | «y00» |

          平均因果効果 $P(Y=1\mid do(T=1))-P(Y=1\mid do(T=0))$ に最も近い値はどれか。
        choices:
          - "$«naive»$"
          - "$«ace_eq»$"
          - "$«ace»$"
          - "$«ace_sw»$"
          - "$«ace_own»$"
        answer: 2
        distractors:
          - 交絡を無視して P(Y=1|T=1)−P(Y=1|T=0) を答えた
          - 内側の和で T の分布の代わりに 1/2 ずつの重みを使った
          - 正解
          - 内側の和で P(T=1) と P(T=0) の重みを取り違えた
          - 内側の和を T について平均せず、T=1 のときの P(Y|M,T=1) だけを使った
        explanation: |
          **方針** $U$ が観測されないのでバックドア調整はできないが、$M$ はフロントドア基準を満たす。フロントドア調整の式
          $$P(Y=1\mid do(T=t))=\sum_m P(m\mid t)\sum_{t'}P(Y=1\mid m,t')P(t')$$
          を使う。内側の和は「$M=m$ が $Y$ に与える効果」を、$T$ によるバックドア調整で求めたもの。

          **途中式** 内側の和は
          $$m=1:\ «y11»\times«pT»+«y10»\times«pT0»=«t1»+«t2»=«in1»,\qquad m=0:\ «y01»\times«pT»+«y00»\times«pT0»=«t3»+«t4»=«in0»$$
          $$P(Y=1\mid do(T=1))=«pM1»\times«in1»+(1-«pM1»)\times«in0»=«do1»$$
          $$P(Y=1\mid do(T=0))=«pM0»\times«in1»+(1-«pM0»)\times«in0»=«do0»$$
          差は $«do1»-«do0»=«ace»$。

          **答え** $«ace»$

          **間違えやすい点** 単純な比較 $P(Y=1\mid T=1)-P(Y=1\mid T=0)=«py1»-«py0»=«naive»$ は、経営努力 $U$ による交絡を含む。内側の和の重みは $T$ の周辺分布 $P(t')$（«pT» と «pT0»）で、条件付けた $T$ の値ではない。

  - id: s10p10
    title: 通勤手段の選択
    context: |
      ある都市で、車通勤の人が公共交通に乗り換えるかどうかを調べた。公共交通を使う確率 $p$ を、プロビットモデル
      $$p=\Phi(\beta_0+\beta_1x_1+\beta_2x_2)$$
      で表す。$x_1$ は職場の駐車料金（百円/日）、$x_2$ は自宅から最寄り駅までの距離（km）、$\Phi$ は標準正規分布の分布関数である。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ だった。
    items:
      - id: s10p10a
        chapter: 18
        terms: [probit-model, generalized-linear-model, link-function]
        topic: プロビットモデルで駐車料金の値上げによる公共交通の利用確率の変化を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          駅まで «x2» km に住む人について、駐車料金が «ya» 円から «yb» 円に上がると、公共交通を使う確率はいくら増えるか（推定値を真の値とみなす）。
          必要なら $\Phi(0.3)=«ph3»$、$\Phi(0.6)=«ph6»$、$\Phi(0.9)=«ph9»$ を使え。
        answer: «dp»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 線形予測子 $\eta=\beta_0+\beta_1x_1+\beta_2x_2$ を値上げの前後で計算し、それぞれ $\Phi(\eta)$ に通して差をとる。$x_1$ は百円単位なので «ya» 円は $x_1=«x1a»$、«yb» 円は $x_1=«x1b»$。$\Phi(-z)=1-\Phi(z)$ を使う。

          **途中式**
          前：$\eta=«b0»+«b1»\times«x1a»+(«b2»)\times«x2»=«b0»+«t1a»«t2»=«eta_a»$、$p=\Phi(«eta_a»)=1-«ph6»=«pa»$
          後：$\eta=«b0»+«b1»\times«x1b»+(«b2»)\times«x2»=«b0»+«t1b»«t2»=«eta_b»$、$p=\Phi(«eta_b»)=1-«ph3»=«pb»$
          $$\text{増加}=«pb»-«pa»=«dp4»$$

          **答え** $«dp_s»$

          **間違えやすい点** プロビットモデルの係数は確率の変化そのものではない。$\beta_1\times2=«w_x»$ を確率の増加とみなすのは誤り（線形確率モデルと混同）。確率の変化は $\eta$ の位置によって違う。
          また $\Phi(-0.6)$ を $\Phi(0.6)$ と取り違えると符号が逆の $-«dp_s»$ になる。

  - id: s10p11
    title: 交差点ごとの信号待ち時間のばらつき
    context: |
      ある市の交通局は、市内の信号交差点から «a» か所を無作為に選び、それぞれで «rr» 日ずつピーク時の 1 台あたり平均待ち時間（秒）を測った。
      交差点の効果を変量効果とみなす一元配置モデル $y_{ij}=\mu+a_i+\varepsilon_{ij}$（$a_i\sim N(0,\sigma_A^2)$、$\varepsilon_{ij}\sim N(0,\sigma^2)$、すべて独立）を当てはめ、
      分散分析表から交差点の平均平方 $MS_A=«msa»$（自由度 «dfa»）、誤差の平均平方 $MS_E=«mse»$（自由度 «dfe»）を得た。
    items:
      - id: s10p11a
        chapter: 20
        terms: [fixed-and-random-effects, expected-mean-square, one-way-anova]
        topic: 無作為に選んだ交差点の待ち時間を変量効果の一元配置とみて期待平均平方から交差点間の分散成分と級内相関を求める
        level: 標準
        definition: false
        type: choice
        question: |
          期待平均平方にもとづくモーメント法（分散分析法）で分散成分を推定するとき、級内相関係数 $\rho=\dfrac{\sigma_A^2}{\sigma_A^2+\sigma^2}$ の推定値に最も近い値はどれか。
        choices:
          - "$«w_a»$"
          - "$«icc»$"
          - "$«w_err»$"
          - "$«w_nosub»$"
          - "$«w_nor»$"
        answer: 1
        distractors:
          - (MS_A − MS_E) を 1 か所あたりの測定日数 r ではなく交差点の数 a で割った
          - 正解
          - 交差点間ではなく誤差の分散の割合 σ²/(σ_A²+σ²) を答えた
          - MS_E を引かずに MS_A/r を σ_A² とした
          - (MS_A − MS_E)/MS_A とし、r で割ることも分母の作り方も誤った
        explanation: |
          **方針** 変量効果の一元配置では $E[MS_E]=\sigma^2$、$E[MS_A]=\sigma^2+r\sigma_A^2$（$r$ は各交差点の測定数）。これを平均平方の観測値と等しいとおいて解く。

          **途中式**
          $$\hat\sigma^2=MS_E=«mse»,\qquad \hat\sigma_A^2=\frac{MS_A-MS_E}{r}=\frac{«msa»-«mse»}{«rr»}=\frac{«diff»}{«rr»}=«sa»$$
          $$\hat\rho=\frac{«sa»}{«sa»+«mse»}=\frac{«sa»}{«tot»}=«icc4»$$

          **答え** $«icc»$（同じ交差点の 2 日の待ち時間の相関がおよそ 0.5。待ち時間のばらつきの半分ほどは交差点の違いによる）

          **間違えやすい点** $MS_A$ には誤差の分散 $\sigma^2$ も含まれるので、$MS_E$ を引いてから $r$ で割る。引き忘れて $MS_A/r=«msar»$ を $\sigma_A^2$ とすると $«w_nosub»$ になる。割る数は交差点の数 «a» ではなく 1 か所あたりの測定数 «rr»。
          （参考：$F=MS_A/MS_E=«F»$ で、$\sigma_A^2=0$ の仮説の検定にはこの $F$ を固定効果の場合と同じく使える。）

  - id: s10p12
    title: 観光スポットの多変量解析
    context: |
      ある観光協会は、県内の観光スポットと観光客アンケートのデータを、いくつかの多変量解析の手法で分析した。
    items:
      - id: s10p12a
        chapter: 24
        terms: [average-linkage, hierarchical-clustering, dendrogram]
        topic: 5つの観光スポットの距離行列に群平均法を適用して最後の併合距離を求め重み付きの平均と区別する
        level: 標準
        definition: false
        type: choice
        question: |
          5 つの観光スポット A〜E の、来訪者の行動の違いを表す距離が次のように得られた。

          | | A | B | C | D | E |
          |---|---|---|---|---|---|
          | A | 0 | «dAB» | «dAC» | «dAD» | «dAE» |
          | B | «dAB» | 0 | «dBC» | «dBD» | «dBE» |
          | C | «dAC» | «dBC» | 0 | «dCD» | «dCE» |
          | D | «dAD» | «dBD» | «dCD» | 0 | «dDE» |
          | E | «dAE» | «dBE» | «dCE» | «dDE» | 0 |

          群平均法（2 つのクラスター間の距離を、異なるクラスターに属する個体の組すべての距離の平均とする）で階層的クラスタリングを行う。最後（4 回目）の併合の距離に最も近い値はどれか。
        choices:
          - "$«w_single»$"
          - "$«w_wpgma»$"
          - "$«w_abde»$"
          - "$«w_complete»$"
          - "$«final»$"
        answer: 4
        distractors:
          - 最短距離法（個体間の最小距離）で計算した
          - クラスター間距離を、それまでのクラスター間距離の単純平均で更新した（個体数で重みづけない WPGMA 型）
          - 最後に併合する相手のうち {D, E} との距離だけを使った
          - 最長距離法（個体間の最大距離）で計算した
          - 正解
        explanation: |
          **方針** 毎回、距離が最小のクラスターの組を併合し、新しいクラスターと他のクラスターの距離を「個体の組すべての距離の平均」で計算し直す。

          **途中式**
          1. 最小は A–B の «dAB» → {A,B}。{A,B} と C は $(«dAC»+«dBC»)/2=«ab_c»$、D は $(10+9)/2=9.5$、E は $(9+8)/2=8.5$
          2. 残りの最小は D–E の «dDE» → {D,E}。{D,E} と C は $(«dCD»+«dCE»)/2=«c_de»$、{A,B} と {D,E} は $(10+9+9+8)/4=«ab_de»$
          3. 最小は C と {D,E} の «c_de» → {C,D,E}
          4. 最後に {A,B} と {C,D,E} を併合。距離は 2×3=6 組の平均
          $$\frac{6+5+10+9+9+8}{6}=\frac{«sum6»}{6}=«final»$$

          **答え** $«final»$

          **間違えやすい点** 3 回目のあとの距離を、{A,B}–C の «ab_c» と {A,B}–{D,E} の «ab_de» の単純平均 «w_wpgma» にすると、C（1 個）と {D,E}（2 個）の個体数の違いを無視したことになる。群平均法では個体数で重みづけた平均 $(1\times«ab_c»+2\times«ab_de»)/3=«final»$ になる。最短距離法なら «w_single»、最長距離法なら «w_complete»。

      - id: s10p12b
        chapter: 25
        terms: [factor-rotation, factor-loading, communality, varimax-rotation]
        topic: 直交回転の式から回転後の第1因子の負荷量の二乗和を求め回転で変わる量と変わらない共通性を区別する
        level: 標準
        definition: false
        type: choice
        question: |
          観光客アンケートの 8 項目に直交 2 因子モデルを当てはめた。そのうち 3 項目（交通の便、宿の快適さ、景観）の回転前の因子負荷量 $(\lambda_{i1},\lambda_{i2})$ は次のとおりである。

          | 項目 | 交通の便 | 宿の快適さ | 景観 |
          |---|---|---|---|
          | 第 1 因子 | «l11» | «l21» | «l31» |
          | 第 2 因子 | «l12» | «l22» | «l32» |

          これを直交回転し、回転後の負荷量を $\lambda_{i1}^*=«c»\lambda_{i1}+«sn»\lambda_{i2}$、$\lambda_{i2}^*=-«sn»\lambda_{i1}+«c»\lambda_{i2}$ とする。
          回転後の第 1 因子について、この 3 項目の負荷量の 2 乗和 $\sum_{i=1}^{3}\lambda_{i1}^{*2}$ に最も近い値はどれか（8 項目すべてで足したものが第 1 因子の寄与になる）。
        choices:
          - "$«u1»$"
          - "$«con1»$"
          - "$«comm»$"
          - "$«con2»$"
          - "$«nosq»$"
        answer: 1
        distractors:
          - 回転しても 2 乗和は変わらないと考え、回転前の第 1 因子の 2 乗和を答えた
          - 正解
          - 3 項目の共通性の合計（回転で変わらない量）を答えた
          - 回転後の第 2 因子の 2 乗和を答えた
          - 回転後の負荷量を 2 乗せずに足した
        explanation: |
          **方針** 回転の式で各項目の $\lambda_{i1}^*$ を計算し、2 乗して足す。

          **途中式**
          - 交通の便：$«c»\times«l11»+«sn»\times«l12»=«r11»$
          - 宿の快適さ：$«c»\times«l21»+«sn»\times«l22»=«r21»$
          - 景観：$«c»\times(«l31»)+«sn»\times«l32»=«r31»$

          $$\sum_{i=1}^{3}\lambda_{i1}^{*2}=«r11»^2+«r21»^2+«r31»^2=«r11sq»+«r21sq»+«r31sq»=«con1_4»$$

          **答え** $«con1»$

          **間違えやすい点** 直交回転で変わらないのは各項目の共通性 $\lambda_{i1}^2+\lambda_{i2}^2$（例：交通の便は回転前 «h1»、回転後も $«r11»^2+«r12»^2=«h1»$）と、その合計 «comm» である。因子ごとの 2 乗和（寄与）は回転で変わり、回転前の第 1 因子の 2 乗和は $«l11sq»+«l21sq»+«l31sq»=«u1_4»$、回転後の第 2 因子は «con2» になる（合計はどちらも «comm»）。回転後の負荷量を 2 乗せずに足すと «nosq» になるが、これは意味のある量ではない。

      - id: s10p12c
        chapter: 26
        terms: [quantification-type-1, dummy-variable]
        topic: 数量化I類のカテゴリースコアから観光客の消費額を予測しレンジで影響の大きいアイテムを選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          観光客 1 人あたりの消費額（千円）を、宿泊の有無（日帰り 60%、宿泊 40%）と交通手段（車 50%、鉄道 30%、バス 20%）の 2 アイテムで説明する数量化 I 類を行い、次の結果を得た。
          カテゴリースコアは、各アイテムで回答者の割合で重みづけた平均が 0 になるように基準化してあり、定数項（全体の平均消費額）は «cst» である。

          | アイテム | カテゴリー | スコア |
          |---|---|---|
          | 宿泊 | 日帰り | «sd» |
          | 宿泊 | 宿泊 | «ss2» |
          | 交通手段 | 車 | «car» |
          | 交通手段 | 鉄道 | «rail» |
          | 交通手段 | バス | «bus» |

          鉄道で来た宿泊客の予測消費額と、消費額への影響が大きいアイテム（レンジで判断）の組として正しいものはどれか。
        choices:
          - "予測値 «w_pred_sd» 千円、宿泊の有無"
          - "予測値 «pred» 千円、交通手段"
          - "予測値 «w_pred_sum» 千円、宿泊の有無"
          - "予測値 «pred» 千円、宿泊の有無"
          - "予測値 «w_pred_car» 千円、宿泊の有無"
        answer: 3
        distractors:
          - 宿泊客に日帰りのスコアを使った
          - レンジではなくカテゴリーの数（交通手段は 3 つ）で影響の大きさを判断した
          - 定数項を足し忘れた
          - 正解
          - 鉄道の代わりに車のスコアを使った
        explanation: |
          **方針** 数量化 I 類はカテゴリーをダミー変数にした重回帰と同じで、予測値は「定数項 + 該当カテゴリーのスコアの和」。アイテムの影響の大きさは、カテゴリースコアの最大値と最小値の差（レンジ）で比べる。

          **途中式** 予測値は $«cst»+«ss2»+(«rail»)=«pred»$（千円）。
          レンジは、宿泊が $«ss2»-(«sd»)=«rng1»$、交通手段が $«car»-(«bus»)=«rng2»$ で、宿泊の有無のほうが大きい。
          （基準化の確認：$0.6\times(«sd»)+0.4\times«ss2»=0$、$0.5\times«car»+0.3\times(«rail»)+0.2\times(«bus»)=0$。）

          **答え** 予測値 «pred» 千円、宿泊の有無

          **間違えやすい点** スコアは基準化の仕方で全体がずれる（基準カテゴリーを 0 にする流儀もある）ので、スコアの絶対値ではなくレンジで比べる。定数項は基準化に対応した値なので、必ず足す。

  - id: s10p13
    title: 鉄道の月次乗客数のモデル診断
    context: |
      ある鉄道路線の季節調整済みの月次乗客数に ARIMA(0,1,1) モデル（1 階差分が MA(1)）を当てはめ、«n» か月分の残差を得た。
      残差の標本自己相関はラグ 1, 2, 3 でそれぞれ $«r1»$、$«r2»$、$«r3»$ だった。
    items:
      - id: s10p13a
        chapter: 27
        terms: [white-noise, autocovariance-autocorrelation, arima-model, correlogram]
        topic: ARIMA(0,1,1)を当てはめた乗客数の残差自己相関からリュング・ボックス統計量を求め推定した母数の数だけ自由度を減らして判定する
        level: 基本
        definition: false
        type: choice
        question: |
          ラグ 3 までのリュング・ボックス統計量 $Q=n(n+2)\sum_{k=1}^{3}\dfrac{r_k^2}{n-k}$ で、残差が白色雑音かを有意水準 5% で調べる。
          自由度は「ラグの数 − 推定した ARMA の係数の数」とする。カイ二乗分布の上側 5% 点は自由度 2 で «c2»、自由度 3 で «c3» である。正しいものはどれか。
        choices:
          - "$Q\\approx«Q»$ で自由度 3 の «c3» 以下なので、残差は白色雑音とみなせる"
          - "$Q\\approx«bp»$ で自由度 2 の «c2» を超えるので、残差に自己相関が残っている"
          - "$Q\\approx«Q»$ で自由度 2 の «c2» を超えるので、残差に自己相関が残っている"
          - "$Q\\approx«noN»$ で «c2» 以下なので、残差は白色雑音とみなせる"
          - "$Q\\approx«Q»$ で自由度 2 の «c2» を超えるので、MA(1) の係数が 0 であることが示された"
        answer: 2
        distractors:
          - 推定した MA の係数 1 個を自由度から引き忘れた
          - 指定したリュング・ボックス統計量ではなく、ボックス・ピアス統計量 nΣr_k² を計算した
          - 正解
          - n(n+2) を掛け忘れた
          - 検定が示すのは残差の自己相関が残っていることで、係数が 0 かどうかとは関係ない
        explanation: |
          **方針** 白色雑音なら $Q$ は近似的にカイ二乗分布に従う。残差は ARMA の係数を推定したあとのものなので、自由度は推定した係数の数（ここでは MA の 1 個）だけ減らす。

          **途中式**
          $$\frac{r_1^2}{59}=\frac{«r1s»}{59}=«q1»,\quad \frac{r_2^2}{58}=\frac{«r2s»}{58}=«q2»,\quad \frac{r_3^2}{57}=\frac{«r3s»}{57}=«q3»$$
          $$Q=«n»\times62\times(«q1»+«q2»+«q3»)=«nn2»\times«qs»=«Q»$$
          自由度は $3-1=2$。$«Q»>«c2»$ なので白色雑音の仮説を棄却する。

          **答え** $Q\approx«Q»$ で自由度 2 の «c2» を超えるので、残差に自己相関が残っている

          **間違えやすい点** 自由度をラグの数 3 のままにすると «c3» と比べて棄却しないことになり、結論が変わる。リュング・ボックス統計量はボックス・ピアス統計量（$n\sum r_k^2=«bp»$）を小標本向けに補正したもので、少し大きめの値になる。
          棄却されたら、AR 項を加えるなどモデルを見直す。

  - id: s10p14
    title: 交差点の事故率のベイズ推定
    context: |
      ある交差点の事故率 $\lambda$（件/年）の事後分布が、形状 «a»・レート «b» のガンマ分布（密度 $\pi(\lambda)\propto\lambda^{«a»-1}e^{-«b»\lambda}$）になった。
      この事後分布からの標本を、メトロポリス・ヘイスティングス法で発生させる練習をする。
    items:
      - id: s10p14a
        chapter: 32
        terms: [metropolis-hastings, mcmc]
        topic: 独立型メトロポリス・ヘイスティングス法で提案分布の比の補正を含めた採択確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          提案分布には、現在の値によらず平均 1 の指数分布 $q(\lambda')=e^{-\lambda'}$（$\lambda'>0$）を使う（独立型）。
          現在の値が $\lambda=«th»$ のとき、提案値 $\lambda'=«thp»$ が出た。この提案値を採択する確率に最も近い値はどれか。
          必要なら $e^{1.6}=«e16»$、$e^{2}=«e2»$ を使え。
        choices:
          - "$«w_noq»$"
          - "$«w_rej»$"
          - "$«acc»$"
          - "$«w_shape»$"
          - "$1.000$"
        answer: 2
        distractors:
          - 提案分布が対称でないのに、提案分布の比 q(λ)/q(λ') の補正を省いた（メトロポリス法の式を使った）
          - 採択確率ではなく棄却する確率 1−α を答えた
          - 正解
          - 密度の λ の指数を形状 a−1=4 ではなく a=5 とした
          - 補正の比を逆に q(λ')/q(λ) とし、比が 1 を超えたので 1 とした
        explanation: |
          **方針** メトロポリス・ヘイスティングス法の採択確率は
          $$\alpha(\lambda,\lambda')=\min\left\{1,\ \frac{\pi(\lambda')\,q(\lambda\mid\lambda')}{\pi(\lambda)\,q(\lambda'\mid\lambda)}\right\}$$
          独立型では $q(\lambda'\mid\lambda)=q(\lambda')$ なので、比は $\dfrac{\pi(\lambda')}{\pi(\lambda)}\cdot\dfrac{q(\lambda)}{q(\lambda')}$。正規化定数は約分されて不要。

          **途中式**
          $$\frac{\pi(«thp»)}{\pi(«th»)}=\left(\frac{«thp»}{«th»}\right)^{«a1»}e^{-«b»(«thp»-«th»)}=«pr»\,e^{«pexp»},\qquad \frac{q(«th»)}{q(«thp»)}=\frac{e^{-«th»}}{e^{-«thp»}}=e^{«qexp»}$$
          $$\text{比}=«pr»\times e^{«pexp»}\times e^{«qexp»}=«pr»\times e^{«tot»}=«pr»\times«e16»=«acc4»$$
          1 より小さいので、採択確率は $«acc»$。

          **答え** $«acc»$

          **間違えやすい点** 提案分布が対称なランダムウォーク型なら $q$ の比は 1 だが、独立型では補正が必要。補正を省くと $«pr»\times e^{2}=«w_noq»$ になる。
          ガンマ分布の密度の指数は形状 − 1。$\lambda^{5}$ とすると $«pr5»\times«e16»=«w_shape»$ になる。
