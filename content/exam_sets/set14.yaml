        topic: 3変数の相関行列の最大固有値だけが与えられたとき残りの固有値をトレースと行列式から求め累積寄与率を出す
        level: 応用
        definition: false
        type: choice
        question: |
          1 試合あたりのキル数・アシスト数・獲得ゴールドの相関行列は
          $$R=\begin{pmatrix} 1 & «r12» & «r13» \\ «r12» & 1 & «r23» \\ «r13» & «r23» & 1 \end{pmatrix}$$
          だった。この相関行列にもとづく主成分分析で、最大固有値は $\lambda_1=«l1»$（小数第3位まで）と計算されている。
          第 2 主成分までの累積寄与率に最も近いものはどれか。
        choices:
          - '$«c_2»$'
          - '$«c_1»$'
          - '$«c_eq»$'
          - '$«c_ok»$'
          - '$«c_all»$'
        answer: 3
        distractors:
          - 第 2 主成分だけの寄与率を答えた
          - 第 1 主成分だけの寄与率を答えた
