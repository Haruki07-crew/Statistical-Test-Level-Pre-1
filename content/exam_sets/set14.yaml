        question: |
          1 試合あたりのキル数・アシスト数・獲得ゴールドの相関行列は
          $$R=\begin{pmatrix} 1 & «r12» & «r13» \\ «r12» & 1 & «r23» \\ «r13» & «r23» & 1 \end{pmatrix}$$
          だった。この相関行列にもとづく主成分分析で、最大固有値は $\lambda_1=«l1»$（小数第3位まで）と計算されている。
          第 2 主成分までの累積寄与率に最も近いものはどれか。
        choices:
          - '$«c_2»$'
          - '$«c_1»$'
          - '$«c_eq»$'
          - '$«c_ok»$'
          - '$«c_all»$'
        answer: 3
        distractors:
          - 第 2 主成分だけの寄与率を答えた
          - 第 1 主成分だけの寄与率を答えた
          - 残りの固有値の和を 2 等分して λ2 とした（行列式の情報を使っていない）
          - 正解
          - 3-λ1 をそのまま λ2 とした（λ3 を忘れた）
        explanation: |
          **方針** 固有値の和はトレース、積は行列式に等しい：$\lambda_1+\lambda_2+\lambda_3=\mathrm{tr}\,R=3$、$\lambda_1\lambda_2\lambda_3=\det R$。$\lambda_1$ がわかれば $\lambda_2+\lambda_3$ と $\lambda_2\lambda_3$ が決まり、2 次方程式で $\lambda_2,\lambda_3$ が求まる。

          **途中式** 行列式は
          $$\det R=1+2\times«r12»\times«r13»\times«r23»-«r12»^2-«r13»^2-«r23»^2=1+«rr»-«q12»-«q13»-«q23»=«det»$$
          $$\lambda_2+\lambda_3=3-«l1»=«ssum»,\qquad \lambda_2\lambda_3=\frac{«det»}{«l1»}=«prod»$$
          $\lambda_2,\lambda_3$ は $t^2-«ssum»t+«prod»=0$ の解なので
          $$t=\frac{«ssum»\pm\sqrt{«ssum2»-«fourp»}}{2}=\frac{«ssum»\pm\sqrt{«disc»}}{2}=\frac{«ssum»\pm«sq»}{2}$$
          $\lambda_2=«l2»$、$\lambda_3=«l3»$。累積寄与率は
          $$\frac{\lambda_1+\lambda_2}{3}=\frac{«l1»+«l2»}{3}=«cum»\cdots$$

          **答え** $«c_ok»$

          **間違えやすい点** 相関行列の固有値の和は変数の数（3）。残り $«ssum»$ を 2 等分すると $«c_eq»$ になるが、行列式の条件を満たさない。第 1 主成分だけなら $«c_1»$。

      - id: s14p11b
        chapter: 23
        terms: [fisher-linear-discriminant-function, linear-discriminant-analysis, mahalanobis-distance]
        topic: 相関のある2特徴で不正利用者と一般プレイヤーを分ける線形判別関数の値を共分散行列の逆行列から求め新しいプレイヤーを判定する
        level: 標準
        definition: false
        type: choice
        question: |
          不正ツールの利用者（群 1）と一般プレイヤー（群 2）を、2 つの特徴 $x_1$（照準の速さの指標）と $x_2$（深夜の連続プレイの指標）で判別する。学習データから、群 1 の平均 $\boldsymbol\mu_1=(«m11»,\ «m12»)^\top$、群 2 の平均 $\boldsymbol\mu_2=(«m21»,\ «m22»)^\top$、両群に共通の分散共分散行列
          $$\Sigma=\begin{pmatrix} «s11» & «s12» \\ «s12» & «s22» \end{pmatrix}$$
          を得た。両群は 2 変量正規分布に従い、事前確率と誤判別の損失は両群で等しいとする。このとき線形判別関数
          $$L(\boldsymbol x)=(\boldsymbol\mu_1-\boldsymbol\mu_2)^\top\Sigma^{-1}\left(\boldsymbol x-\frac{\boldsymbol\mu_1+\boldsymbol\mu_2}{2}\right)$$
          が正なら群 1、負なら群 2 と判定する。$\boldsymbol x=(«x1»,\ «x2»)^\top$ のプレイヤーについて、$L(\boldsymbol x)$ の値と判定の組として正しいものはどれか。
        choices:
          - '$L=«w_diag»$ で、不正ツールの利用者と判定する。'
          - '$L=«w_sign»$ で、不正ツールの利用者と判定する。'
          - '$L=«c_val»$ で、一般プレイヤーと判定する。'
          - '$L=«w_mu2»$ で、不正ツールの利用者と判定する。'
          - '$L=«w_noinv»$ で、不正ツールの利用者と判定する。'
        answer: 2
        distractors:
          - 特徴どうしの共分散を無視して対角成分だけで割った
          - 平均の差の向きを逆（μ2-μ1）にした
          - 正解
          - 2 群の平均の中点ではなく群 2 の平均からの差を使った
          - Σ の逆行列ではなく Σ そのものを掛けた
        explanation: |
          **方針** 重みベクトル $\boldsymbol w=\Sigma^{-1}(\boldsymbol\mu_1-\boldsymbol\mu_2)$ を求め、$\boldsymbol x$ と 2 群の平均の中点との差との内積をとる。2 次の正方行列の逆行列は $\begin{pmatrix}a&b\\b&d\end{pmatrix}^{-1}=\frac{1}{ad-b^2}\begin{pmatrix}d&-b\\-b&a\end{pmatrix}$。

          **途中式** $\boldsymbol\mu_1-\boldsymbol\mu_2=(«d1»,\ «d2»)^\top$、$\det\Sigma=«detS»$ なので
          $$\boldsymbol w=\frac{1}{«detS»}\begin{pmatrix} «s22» & -«s12» \\ -«s12» & «s11» \end{pmatrix}\begin{pmatrix} «d1» \\ «d2» \end{pmatrix}=\frac{1}{«detS»}\begin{pmatrix} «wn1» \\ «wn2» \end{pmatrix}$$
          中点は $(«c1»,\ «c2»)^\top$ で、$\boldsymbol x-$中点 $=(«dx1»,\ «dx2»)^\top$。
          $$L(\boldsymbol x)=\frac{1}{«detS»}\left(«wn1»\times«dx1»+(«wn2»)\times«dx2»\right)=\frac{«lnum»}{«detS»}=«c_val4»$$
          負なので一般プレイヤー（群 2）と判定する。

          **答え** $L=«c_val»$ で一般プレイヤーと判定する、という記述

          **間違えやすい点** $x_1$ と $x_2$ は正の相関をもつので、$x_1$ がやや高いことから期待される分だけ $x_2$ も高くなりやすい。共分散を無視して $\boldsymbol w=(«d1»/«s11»,\ «d2»/«s22»)$ とすると $L=«w_diag»$ で逆の判定になる。共分散を考えると $x_2$ の重みは負になり、深夜プレイの多さだけでは不正の証拠にならない。

  - id: s14p12
    title: ゲームアプリの継続率
    context: |
      あるゲームアプリで、新しいチュートリアル A を受けた新規登録者 10 人について、登録からアプリをやめる（30 日以上ログインしない状態になる）までの日数を観察した。
      観察期間の終了や機種変更などで追跡できなくなった人は、その時点で打ち切りとする。やめた人か打ち切りが出た日ごとに、直前の在籍人数と人数を集計した。

      | 日 | 在籍人数 | やめた人数 | 打ち切り |
      |---|---|---|---|
      | «day1» | «n1» | «d1» | «c1» |
      | «day2» | «n2» | «d2» | «c2» |
      | «day3» | «n3» | «d3» | «c3» |
      | «day4» | «n4» | «d4» | «c4» |
      | «day5» | «n5» | «d5» | «c5» |
    items:
      - id: s14p12a
        chapter: 29
        terms: [greenwood-formula, kaplan-meier-estimator, censored-data]
        topic: 打ち切りを含む10人の継続日数からカプラン・マイヤー推定値とグリーンウッドの公式による標準誤差を求める
        level: 応用
        definition: false
        type: choice
        question: |
          «day5» 日目の直後までアプリを続けている確率（生存関数）$S(«day5»)$ のカプラン・マイヤー推定値の標準誤差を、グリーンウッドの公式で求める。最も近いものはどれか。
        choices:
          - '$«se»$'
          - '$«w_var»$'
          - '$«w_n2»$'
          - '$«w_noS»$'
          - '$«w_S»$'
        answer: 0
        distractors:
          - 正解
          - 分散を答え、平方根をとり忘れた
          - 和の各項を d/(n(n-d)) ではなく d/n^2 とした
          - 推定値の 2 乗 S^2 を掛け忘れた
          - 標準誤差ではなく生存率の推定値そのものを答えた
        explanation: |
          **方針** カプラン・マイヤー推定値は、やめた人が出た日ごとの「続ける割合」$(n_j-d_j)/n_j$ の積。グリーンウッドの公式は
          $$\widehat{V}[\hat S(t)]=\hat S(t)^2\sum_{t_j\le t}\frac{d_j}{n_j(n_j-d_j)}$$
          打ち切りだけの日（やめた人 0）は積にも和にも寄与しないが、その後の在籍人数を減らす。

          **途中式** やめた人が出たのは «day1»・«day3»・«day5» 日目。
          $$\hat S(«day5»)=\frac{«n1»-1}{«n1»}\times\frac{«n3»-1}{«n3»}\times\frac{«n5»-1}{«n5»}=«S»$$
          $$\sum\frac{d_j}{n_j(n_j-d_j)}=\frac{1}{«n1»\times9}+\frac{1}{«n3»\times7}+\frac{1}{«n5»\times5}=«g1»+«g3»+«g4»=«gw»$$
          $$\widehat{V}=«S»^2\times«gw»=«S2»\times«gw»=«var»,\qquad \mathrm{SE}=\sqrt{«var»}=«se5»\cdots$$

          **答え** $«se»$

          **間違えやすい点** $\hat S^2$ を掛け忘れると $«w_noS»$、分散のままだと $«w_var»$。各項の分母は $n_j(n_j-d_j)$ で、$n_j^2$ にすると $«w_n2»$ になる。打ち切りの人を「やめた人」に数えないこと。

      - id: s14p12b
        chapter: 32
        terms: [bootstrap, uniform-random-number]
        topic: 10人のデータから作るブートストラップ標本に含まれる異なる人数の期待値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          チュートリアル A の «bn» 人のデータから、復元抽出で大きさ «bn» のブートストラップ標本を 1 つ作る。
          このブートストラップ標本に少なくとも 1 回含まれる（異なる）人の数の期待値に最も近いものはどれか。必要なら $0.9^{10}=«q10»$ を用いよ。
        choices:
          - '$«bs_out»$'
          - '$«bs»$'
          - '$«bs_e»$'
          - '$«bs_one»$'
          - '$«bs_all»$'
        answer: 1
        distractors:
          - 1 回も含まれない人の数の期待値を答えた
          - 正解
          - n が大きいときの近似 n(1-e^{-1}) を n=10 にそのまま使った
          - 1 回の抽出で選ばれる確率 1/10 だけで考え、含まれる確率を 0.9 とした
          - 復元抽出でも全員が 1 回ずつ選ばれると思い込んだ
        explanation: |
          **方針** 人 $j$ が含まれるかどうかの指示変数 $I_j$ を使うと、異なる人数は $\sum_j I_j$。期待値の線形性から $E\left[\sum I_j\right]=\sum P(I_j=1)$。

          **途中式** 1 回の抽出で人 $j$ が選ばれない確率は $1-\frac{1}{«bn»}=0.9$。«bn» 回とも選ばれない確率は $0.9^{10}=«q10»$ なので、$P(I_j=1)=1-«q10»=«inc»$。
          $$E\left[\sum_{j=1}^{«bn»}I_j\right]=«bn»\times«inc»=«bs»$$

          **答え** $«bs»$ 人

          **間違えやすい点** $I_j$ どうしは独立ではないが、期待値の線形性は独立性を必要としない。$n\to\infty$ の極限 $1-e^{-1}\approx0.632$ を使うと $«bs_e»$ になるが、$n=«bn»$ では正確な値と小数第 1 位から違う。
          1 回も選ばれない人は平均 $«bs_out»$ 人いる（ブートストラップ標本の外にあるデータ、out-of-bag）。
