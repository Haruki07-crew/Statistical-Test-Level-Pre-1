set: 14
title: 模擬試験 第14回
minutes: 90
problems:
  - id: s14p01
    title: ボードゲームのコイン
    context: |
      あるボードゲームでは、手番ごとに表と裏が等確率で出る公平なコインを 2 枚（赤と青）同時に投げ、その結果でコマの動きを決める。2 枚の結果は互いに独立である。
    items:
      - id: s14p01a
        chapter: 1
        terms: [independence-of-events, conditional-probability, law-of-total-probability]
        topic: 交互にコイン2枚を投げ先に両方表を出したほうが勝つゲームで先手が勝つ確率を独立試行の等比級数で求める
        level: 基本
        definition: false
        type: choice
        question: |
          2 人のプレイヤー P（先手）と Q（後手）が P, Q, P, Q, … の順に交互に手番をとる。自分の手番では 2 枚のコインを投げ、2 枚とも表が出たらその人の勝ちでゲームが終わる（そうでなければ相手の手番に移る）。手番どうしの結果は独立である。
          先手 P が勝つ確率に最も近いものはどれか。
        choices:
          - '$«c_ok»$'
          - '$«c_first»$'
          - '$«c_two»$'
          - '$«c_q»$'
          - '$«c_half»$'
        answer: 0
        distractors:
          - 正解
          - 最初の手番で勝つ確率だけを答えた
          - P の 1 回目と 2 回目の手番までしか足さなかった（等比級数を途中で打ち切った）
          - 後手 Q が勝つ確率を答えた
          - 先手と後手は対等だと思い込んだ
        explanation: |
          **方針** 1 回の手番で勝つ確率は、2 枚が独立なので $p=«half»\times«half»=«p»$。P が自分の $k$ 回目の手番で勝つのは、それまでの $2(k-1)$ 回の手番がすべて外れ、その手番で当たるときなので、確率は $(1-p)^{2(k-1)}p$。これを $k=1,2,\ldots$ について足す（等比級数）。

          **途中式**
          $$P(\text{P が勝つ})=\sum_{k=1}^{\infty}(1-p)^{2(k-1)}p=\frac{p}{1-(1-p)^2}=\frac{«p»}{1-«q2»}=\frac{«p»}{«den»}=«pfr»=«ok4»$$
          別の見方：最初の 2 手番（P と Q）で決着しなければ最初と同じ状況に戻るので、$x=P(\text{P が勝つ})$ とおくと $x=p+(1-p)^2x$。これを解いても同じ $x=\frac{p}{1-(1-p)^2}$ になる。

          **答え** $«c_ok»$（分数では $«pfr»$）

          **間違えやすい点** 先手は先に当たりを引く機会があるので $0.5$ より大きい。最初の手番だけなら $«c_first»$、P の 2 回目の手番まで（$p+(1-p)^2p$）で打ち切ると $«c_two»$ で、どちらも足りない。後手 Q が勝つ確率は $1-«pfr»=«qfr»$（$«c_q»$）。
          ゲームはいつか必ず終わる（決着しない確率 $(1-p)^{2k}\to0$）ので、P と Q の勝つ確率の和は 1 になる。


  - id: s14p02
    title: スピードラン大会のスコアとタイム
    context: |
      あるアクションゲームのスピードラン大会のデータを分析する。
    items:
      - id: s14p02a
        chapter: 6
        terms: [lognormal-distribution, sum-of-random-variables, normal-distribution]
        topic: 2ステージのスコア倍率が独立な対数正規分布のとき積の倍率が2を超える確率を対数の和の正規分布で求める
        level: 標準
        definition: false
        type: choice
        question: |
          この大会では、2 つのステージでそれぞれスコア倍率 $M_1,\ M_2$ がつき、最終倍率は積 $M_1M_2$ である。$M_1,\ M_2$ は独立で、どちらも $\log M_i\sim N(«mu»,\ «sg»^2)$（$\log$ は自然対数）の対数正規分布に従う。
          最終倍率が 2 を超える確率 $P(M_1M_2>2)$ に最も近いものはどれか。必要なら $\log 2=«ln2»$ と次の標準正規分布の分布関数 $\Phi(z)$ の値を用いよ。

          | $z$ | «zt1» | «zt2» | «zt3» | «zt4» | «zt5» |
          |---|---|---|---|---|---|
          | $\Phi(z)$ | «pt1» | «pt2» | «pt3» | «pt4» | «pt5» |
        choices:
          - '$«w_single»$'
          - '$«w_one»$'
          - '$«w_mu»$'
          - '$«ok»$'
          - '$«w_add»$'
        answer: 3
        distractors:
          - 1 ステージの倍率 M1 が 2 を超える確率を答えた
          - 対数の和の分散を 2 倍し忘れ、標準偏差 0.3 のままにした
          - 対数の和の平均を 2 倍し忘れ、0.1 のままにした
          - 正解
          - 標準偏差を足して 0.3+0.3=0.6 とした（分散を足すべき）
        explanation: |
          **方針** 対数をとると積は和になる。$\log(M_1M_2)=\log M_1+\log M_2$ は独立な正規分布の和なので正規分布に従い、平均と分散はそれぞれの和になる（対数正規分布は積について再生性をもつ）。

          **途中式** $\log(M_1M_2)\sim N(2\times«mu»,\ 2\times«sg»^2)=N(«m2»,\ «v2»)$、標準偏差は $\sqrt{«v2»}=«sd2»$。
          $$P(M_1M_2>2)=P\left(\log(M_1M_2)>\log2\right)=P\left(Z>\frac{«ln2»-«m2»}{«sd2»}\right)=P\left(Z>\frac{«num»}{«sd2»}\right)$$
          $«num»/«sd2»=«zraw»\approx«z»$ なので
          $$P(M_1M_2>2)\approx1-\Phi(«z»)=1-«pt2»=«ok4»$$

          **答え** $«ok»$

          **間違えやすい点** 独立な和の分散は分散どうしを足す（標準偏差を足して «sg2» とすると $z=«zadd»$ で $«w_add»$）。分散を 2 倍し忘れると $z=«zone»$ で $«w_one»$、平均を 2 倍し忘れると $z=«zmu»$ で $«w_mu»$ になる。

      - id: s14p02b
        chapter: 4
        terms: [change-of-variables, exponential-distribution, sum-of-random-variables]
        topic: レートの異なる2つの指数分布のクリア時間の差の密度を求め一方が5分以上遅れる確率を出す
        level: 応用
        definition: false
        type: choice
        question: |
          別の部門では、走者 A と B が同時にスタートする。クリア時間（分）$X_A,\ X_B$ は独立で、それぞれ平均 «ma» 分、«mb» 分の指数分布に従う（「平均 $m$ 分の指数分布」は密度 $\frac1m e^{-x/m}$、$x>0$、すなわちレート $1/m$）。
          差 $D=X_A-X_B$ の確率密度関数を求め、A のクリアが B より «d» 分以上遅れる確率 $P(D>«d»)$ を計算せよ。最も近いものはどれか。
          必要なら $e^{-0.5}=«e05»$、$e^{-1/3}=«e13»$ を用いよ。
        choices:
          - '$«w_rate»$'
          - '$«w_swap»$'
          - '$«w_pb»$'
          - '$«okb»$'
          - '$«w_e»$'
        answer: 3
        distractors:
          - d>0 側の密度の指数部に B のレートを使った
          - 係数の λ_B/(λ_A+λ_B) と λ_A/(λ_A+λ_B) を取り違えた
          - B より遅れる確率 P(D>0) だけを答え、5 分の条件を落とした
          - 正解
          - A のクリア時間が 5 分を超える確率 e^{-0.5} を答えた（B の時間を無視）
        explanation: |
          **方針** $(X_A,X_B)$ から $(D,X_B)=(X_A-X_B,\ X_B)$ へ変数変換し（ヤコビアンは 1）、$X_B$ について積分して $D$ の周辺密度を出す。レートは $\lambda_A=«la»$、$\lambda_B=«lb»$。

          **途中式** $x_A=d+y$、$x_B=y$ と書けるので、$d>0$ のとき（$y>0$ の範囲で積分）
          $$f_D(d)=\int_0^\infty\lambda_Ae^{-\lambda_A(d+y)}\lambda_Be^{-\lambda_By}\,dy=\frac{\lambda_A\lambda_B}{\lambda_A+\lambda_B}e^{-\lambda_Ad}$$
          （$d<0$ では同様に $\frac{\lambda_A\lambda_B}{\lambda_A+\lambda_B}e^{\lambda_Bd}$。左右で減衰の速さが違うラプラス型の分布）。
          $\lambda_A+\lambda_B=«lab»$ より係数は $\frac{\lambda_A\lambda_B}{\lambda_A+\lambda_B}=«c0»$。
          $$P(D>«d»)=\int_{«d»}^\infty «c0»\,e^{-x/«ma»}\,dx=«c0»\times«ma»\times e^{-«lad»}=\frac{\lambda_B}{\lambda_A+\lambda_B}e^{-«d»\lambda_A}=«pbd»\times«e05»=«okb5»$$

          **答え** $«okb»$

          **間違えやすい点** 結果は $P(D>0)=\lambda_B/(\lambda_A+\lambda_B)=«w_pb»$（平均の長い A のほうが遅れやすい）に $e^{-«d»\lambda_A}$ を掛けた形。指数部は A のレートで、B のレートを使うと $«w_rate»$ になる。
          係数を $\lambda_A/(\lambda_A+\lambda_B)=«pa»$ と取り違えると $«w_swap»$ になる。

          **別解** 無記憶性を使う：B がクリアした時点で A がまだ走っている確率は $P(X_A>X_B)=«pbd»$、その時点から A がさらに «d» 分以上かかる確率は $e^{-«d»\lambda_A}=«e05»$ なので、積は $«okb»$。

  - id: s14p03
    title: バスケットボールのシュートとフリースロー
    context: |
      あるバスケットボールリーグのデータを分析する。
    items:
      - id: s14p03a
        chapter: 3
        terms: [covariance-and-correlation, expectation-variance-properties, multinomial-distribution]
        topic: 1人のシュートの結果を3通りに分けたとき2点成功数と3点成功数の相関係数を多項分布の共分散から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある選手は 1 試合に «ns» 本のシュートを打つ。各シュートの結果は独立に、「2 点シュートが決まる」（確率 «p2»）、「3 点シュートが決まる」（確率 «p3»）、「決まらない」（確率 «p0»）のいずれか 1 つになるとする。
          1 試合の 2 点シュートの成功数 $N_2$ と 3 点シュートの成功数 $N_3$ の相関係数を求めよ。
        answer: «corr»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。負の値は符号もつけて答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $(N_2,N_3,\text{失敗数})$ は多項分布 $\mathrm{Mult}(«ns»;\ «p2»,\ «p3»,\ «p0»)$ に従う。$i$ 本目のシュートが 2 点成功なら 1 の指示変数 $I_i$、3 点成功なら 1 の指示変数 $J_i$ を使うと $N_2=\sum I_i$、$N_3=\sum J_i$。1 本のシュートで両方が 1 になることはないので $I_iJ_i=0$。共分散の双線形性で計算する。

          **途中式** 同じシュートどうしでは
          $$\mathrm{Cov}(I_i,J_i)=E[I_iJ_i]-E[I_i]E[J_i]=0-«p2»\times«p3»=-«pp»$$
          異なるシュートどうしは独立で共分散 0 なので
          $$\mathrm{Cov}(N_2,N_3)=-n\,p_2p_3=-«ns»\times«pp»=«cov»$$
          $$V[N_2]=np_2(1-p_2)=«ns»\times«p2»\times«q2»=«v2»,\qquad V[N_3]=np_3(1-p_3)=«ns»\times«p3»\times«q3»=«v3»$$
          $$\rho=\frac{«cov»}{\sqrt{«v2»\times«v3»}}=\frac{«cov»}{\sqrt{«v23»}}=«corr5»$$

          **答え** $«corr»$

          **間違えやすい点** 各シュートは独立でも、1 本が 2 点成功なら 3 点成功ではありえないので、$N_2$ と $N_3$ は負の相関をもつ（0 ではない）。$n$ は分子と分母で約分され、相関は $-\sqrt{\frac{p_2p_3}{(1-p_2)(1-p_3)}}$ となって本数によらない。共分散だけを答える（$«cov»$）と誤り。


      - id: s14p03b
        chapter: 8
        terms: [method-of-moments, beta-distribution]
        topic: リーグ各選手のフリースロー成功率をベータ分布とみてモーメント法で母数を推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          リーグの選手ごとのフリースロー成功率 $\theta$ のばらつきを、ベータ分布 $\mathrm{Beta}(\alpha,\beta)$（密度 $\propto\theta^{\alpha-1}(1-\theta)^{\beta-1}$、平均 $\frac{\alpha}{\alpha+\beta}$、分散 $\frac{\alpha\beta}{(\alpha+\beta)^2(\alpha+\beta+1)}$）で表す。
          多数の選手の成功率から、平均 «m»、分散 «vv» が得られた。モーメント法で $\alpha$ を推定せよ。
        answer: «a»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 平均を $m=\frac{\alpha}{\alpha+\beta}$ とおくと、分散は $\frac{m(1-m)}{\alpha+\beta+1}$ と書ける。これを標本の平均・分散と等しいとおいて $\alpha+\beta$ を先に求め、次に $\alpha=m(\alpha+\beta)$ とする。

          **途中式** $\frac{\alpha\beta}{(\alpha+\beta)^2}=m(1-m)$ なので、分散の式は
          $$v=\frac{m(1-m)}{\alpha+\beta+1}\ \Longrightarrow\ \alpha+\beta=\frac{m(1-m)}{v}-1=\frac{«m»\times(1-«m»)}{«vv»}-1=\frac{«mq»}{«vv»}-1=«ratio»-1=«tot»$$
          $$\hat\alpha=m(\alpha+\beta)=«m»\times«tot»=«a3»,\qquad \hat\beta=(1-«m»)\times«tot»=«b»$$

          **答え** $«as»$

          **間違えやすい点** 分散の式の分母は $\alpha+\beta+1$。$-1$ を忘れて $\alpha+\beta=«ratio»$ とすると $\hat\alpha=«w_nom1»$ になる。分散と標準偏差を取り違えないこと。

      - id: s14p03c
        chapter: 9
        terms: [clopper-pearson-interval, ci-proportion, confidence-interval]
        topic: プレーオフのフリースローを全本成功した選手の成功率の正確な95%信頼区間（クロッパー＝ピアソン）の下限を求める
        level: 標準
        definition: false
        type: choice
        question: |
          このリーグのあるエースは、プレーオフで打った «nf» 本のフリースローをすべて成功させた。各フリースローは独立に一定の確率 $\theta$ で成功するとする。
          $\theta$ の 95% 信頼区間を、二項分布にもとづく正確な方法（クロッパー＝ピアソン法。両側で上下に 2.5% ずつ割り振る）で作るとき、その**下限**に最も近いものはどれか。
          必要なら $0.025^{1/«nf»}=«r025»$、$0.05^{1/«nf»}=«r05»$、$0.025^{1/«nf1»}=«r025b»$ を用いよ。
        choices:
          - '$«w_n1»$'
          - '$«w_three»$'
          - '$«w_one»$'
          - '$«w_wald»$'
          - '$«c_ok»$'
        answer: 4
        distractors:
          - 指数を n ではなく n-1 とした
          - 0 件のときの「3 の法則」（1-3/n）を流用した
          - 両側なのに 5% を片側に全部割り振った（片側 95% の下限）
          - ワルド型の区間を使った（標本比率 1 で標準誤差 0 になり、区間が 1 点につぶれる）
          - 正解
        explanation: |
          **方針** 成功数を $X\sim B(«nf»,\theta)$ とする。クロッパー＝ピアソン法の下限 $\theta_L$ は「観測値 $x$ 以上が出る確率がちょうど 2.5% になる $\theta$」、すなわち $P(X\ge x\mid\theta_L)=0.025$ の解。$x=n$（全本成功）なら $P(X\ge n\mid\theta)=\theta^n$ なので、式が簡単に解ける。上限は 1 になる。

          **途中式**
          $$\theta_L^{«nf»}=0.025\ \Longrightarrow\ \theta_L=0.025^{1/«nf»}=«r025»$$
          区間は $(«r025»,\ 1]$ となる。

          **答え** $«c_ok»$

          **間違えやすい点** 両側 95% なので下側には 2.5% を割り振る。5% を使うと片側 95% の下限 $«w_one»$ になる。ワルド型 $\hat\theta\pm1.96\sqrt{\hat\theta(1-\hat\theta)/n}$ は $\hat\theta=1$ で幅が 0 になり使えない（全部成功・全部失敗のときこそ正確な方法やウィルソン区間を使う）。$1-3/n=«w_three»$ は 0 件（ここでは失敗 0 本）のときの片側 95% の近似で、両側 95% の正確な下限ではない。

  - id: s14p04
    title: ソーシャルゲームの乱数と報酬
    context: |
      あるソーシャルゲームの運営チームが、ゲーム内の乱数と報酬の仕組みを点検した。
    items:
      - id: s14p04a
        chapter: 10
        terms: [power-function, rejection-region, uniform-distribution, type-i-and-ii-errors]
        topic: 一様分布の上端が仕様より大きいかを最大値で検定するときの検出力関数の値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ダメージ倍率の乱数は、仕様では区間 $(0,1)$ の一様分布だが、不具合で一様分布 $U(0,\theta)$（$\theta>1$）になっている疑いがある。
          独立な «n» 個の乱数 $X_1,\ldots,X_{«n»}$ の最大値 $M$ を使い、$H_0:\theta=1$、$H_1:\theta>1$ を有意水準 «a» で検定する。棄却域は $M\ge c$ とし、$c$ は $P(M\ge c\mid\theta=1)=«a»$ となるように定める。
          実際には $\theta=«th»$ であったとき、この検定の検出力に最も近いものはどれか。必要なら $«th»^{«n»}=«th5»$ を用いよ。
        choices:
          - '$«w_mul»$'
          - '$«w_nop»$'
          - '$«w_beta»$'
          - '$«pw»$'
          - '$«w_c1»$'
        answer: 3
        distractors:
          - 有意水準に θ^5 を掛けた（検出力を有意水準の定数倍と誤解した）
          - 最大値ではなく 1 個の乱数で考え、5 乗し忘れた
          - 第 2 種の誤りの確率（検出力の余事象）を答えた
          - 正解
          - 棄却の境界 c を 1 として計算した
        explanation: |
          **方針** $U(0,\theta)$ の $n$ 個の最大値の分布関数は $P(M\le x)=(x/\theta)^n$（$0\le x\le\theta$）。まず $H_0$ のもとで有意水準から $c^n$ を決め、次に $\theta=«th»$ のもとで $P(M\ge c)$ を計算する（検出力関数 $\beta(\theta)=1-c^n/\theta^n$）。

          **途中式** $H_0$（$\theta=1$）のもとで $P(M\ge c)=1-c^{«n»}=«a»$ より $c^{«n»}=«c5»$。
          $$\beta(«th»)=P(M\ge c\mid\theta=«th»)=1-\left(\frac{c}{«th»}\right)^{«n»}=1-\frac{«c5»}{«th5»}=1-«q»=«pw5»$$

          **答え** $«pw»$

          **間違えやすい点** $c$ そのものを求める必要はなく、$c^{«n»}=«c5»$ だけで計算できる。$c=1$ とすると $1-1/«th5»=«w_c1»$ で有意水準を無視したことになる。$1-«q»$ の $«q»$ は第 2 種の誤りの確率で、検出力ではない。

      - id: s14p04b
        chapter: 7
        terms: [convergence-in-probability, convergence-in-mean-square, markov-inequality]
        topic: まれに大きな報酬が出るイベント報酬の列が0に確率収束するが平均二乗収束しないことを見分ける
        level: 標準
        definition: false
        type: choice
        question: |
          第 $n$ 回の記念イベント（$n=1,2,\ldots$）の追加報酬 $X_n$ は、確率 $1/n$ で $n$ 個、確率 $1-1/n$ で 0 個とする。$n\to\infty$ のときの $X_n$ のふるまいについて、正しい記述はどれか。
        choices:
          - '$X_n$ は 0 に確率収束するが、$E[(X_n-0)^2]=n$ が発散するので、0 に平均二乗収束しない。'
          - '$E[X_n]=1$ がすべての $n$ で成り立つので、$X_n$ は 1 に確率収束する。'
          - '$X_n$ は 0 に平均二乗収束する。'
          - '$P(X_n\ne0)=1/n\to0$ だが、$X_n$ は 0 に確率収束しない。'
          - '$X_n$ は確率収束しないので、分布収束もしない。'
        answer: 0
        distractors:
          - 正解
          - 期待値が一定なら確率変数もその値に近づくと誤解した
          - 確率収束と平均二乗収束を同じものと考えた
          - 確率収束の定義 P(|X_n - 0| > ε) → 0 を確かめなかった
          - 確率収束は分布収束より強いことを逆に覚えた
        explanation: |
          **方針** 確率収束は「任意の $\varepsilon>0$ で $P(|X_n-0|>\varepsilon)\to0$」、平均二乗収束は「$E[(X_n-0)^2]\to0$」。定義どおりに計算する。

          **途中式** 任意の $\varepsilon>0$ について（$n>\varepsilon$ なら）
          $$P(|X_n|>\varepsilon)=P(X_n=n)=\frac1n\to0$$
          なので 0 に確率収束する（たとえば $n=«k»$ なら $P(X_n\ne0)=«pk»$）。一方
          $$E[X_n]=n\times\frac1n=1,\qquad E[X_n^2]=n^2\times\frac1n=n\to\infty$$
          なので平均二乗収束しない。

          **答え** 「0 に確率収束するが、平均二乗収束しない」という記述

          **間違えやすい点** 平均二乗収束ならマルコフ（チェビシェフ）の不等式 $P(|X_n|>\varepsilon)\le E[X_n^2]/\varepsilon^2$ から確率収束が従うが、逆は成り立たない。まれに起きる大きな値が期待値を支えている例である。確率収束すれば分布収束もする（極限は 0 の 1 点分布）。

  - id: s14p05
    title: カジノのミニゲーム
    context: |
      あるRPGの中のカジノでは、1 回 1 枚のチップを賭けるミニゲームがあり、各回は独立に確率 «p» で勝って 1 枚増え、確率 «q» で負けて 1 枚減る。
    items:
      - id: s14p05a
        chapter: 15
        terms: [gambler-ruin-problem, random-walk]
        topic: 不利なチップ賭けのミニゲームで目標枚数に先に達する確率を破産問題の公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          チップ «i» 枚から始め、チップが «N» 枚になるか 0 枚になったところでやめる。0 枚になる前に «N» 枚に達する確率を求めよ。
        answer: «pw»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 勝つ確率を $p$、負ける確率を $q$、$r=q/p$ とおくと、$i$ 枚から始めて 0 枚より先に $N$ 枚に達する確率は
          $$P_i=\frac{1-r^i}{1-r^N}\qquad(p\ne q)$$
          （1 回目の結果で場合分けした漸化式 $P_i=pP_{i+1}+qP_{i-1}$、$P_0=0$、$P_N=1$ の解）。

          **途中式** $r=«q»/«p»=«rfr»=«rr»\cdots$。$r^3=\left(«rfr»\right)^3=«r3»$（小数第4位まで）。$N=2i$ なので $1-r^6=(1-r^3)(1+r^3)$ と因数分解でき
          $$P_3=\frac{1-r^3}{1-r^6}=\frac{1}{1+r^3}=\frac{1}{«den»}=«pw5»\cdots$$

          **答え** $«pws»$（分数では $«pfr»$）

          **間違えやすい点** 公平なゲームなら $P_i=i/N=«w_half»$ だが、1 回ごとの不利さ（«p» 対 «q»）が積み重なって 0.5 を大きく下回る。$r$ を $p/q$ と逆にすると 0.5 を超える値になってしまう。
          $r^6=«r6»$ を使って $\frac{1-«r3»}{1-«r6»}$ と計算しても同じ値になる。


  - id: s14p06
    title: 体操競技の採点
    context: |
      ある体操競技会の採点データを分析する。
    items:
      - id: s14p06a
        chapter: 13
        terms: [spearman-rank-correlation, rank-and-ties]
        topic: 2人の審判が8人の選手につけた順位の一致度をスピアマンの順位相関係数で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          2 人の審判が 8 人の選手 A〜H の演技に順位（1 が最上位、同順位なし）をつけた。

          | 選手 | A | B | C | D | E | F | G | H |
          |---|---|---|---|---|---|---|---|---|
          | 審判 1 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          | 審判 2 | «j1» | «j2» | «j3» | «j4» | «j5» | «j6» | «j7» | «j8» |

          2 人の順位のスピアマンの順位相関係数を求めよ。
        answer: «rs»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 同順位がないとき、順位の差 $d_i$ を使って $r_s=1-\dfrac{6\sum d_i^2}{n(n^2-1)}$（順位どうしのピアソンの相関係数と同じ値）。

          **途中式** 差 $d_i$（審判 1 − 審判 2）は «d1»、«d2»、«d3»、«d4»、«d5»、«d6»、«d7»、«d8» で、$\sum d_i^2=«sd2»$。
          $$r_s=1-\frac{6\times«sd2»}{«nj»\times(«nj»^2-1)}=1-\frac{«six»}{«nj»\times«nn1»}=1-\frac{«six»}{«den»}=«rs5»\cdots$$

          **答え** $«rs_s»$

          **間違えやすい点** 分子の 6 を忘れると $«w_nosix»$、分母を $n(n^2+1)$ とすると $«w_n2»$ になる。差は符号つきで出しても 2 乗するので向きは関係ない。

      - id: s14p06b
        chapter: 20
        terms: [fixed-and-random-effects, expected-mean-square, two-way-anova-with-replication]
        topic: 固定の踏切板と変量の選手の混合二元配置で踏切板の主効果を交互作用の平均平方で検定する
        level: 標準
        definition: false
        type: choice
        question: |
          跳馬の踏切板 «ta» 種類（比べたい特定の製品なので固定効果）の違いを調べるため、多数の選手から無作為に «tb» 人を選び（変量効果）、各選手が各踏切板で «rep» 回ずつ跳んで得点を記録した。
          選手が変量効果なので、選手と踏切板の交互作用も変量効果（平均 0、分散 $\sigma_{AB}^2$）とする交互作用ありの二元配置混合モデルで分散分析を行い、平均平方は次のとおりだった。

          | 要因 | 自由度 | 平均平方 |
          |---|---|---|
          | 踏切板 $A$（固定） | «dfa» | «msa» |
          | 選手 $B$（変量） | «dfb» | «msb» |
          | 交互作用 $A\times B$ | «dfab» | «msab» |
          | 誤差 | «dfe» | «mse» |

          踏切板の主効果の検定（有意水準 5%）について正しい記述はどれか。必要なら $F$ 分布の上側 5% 点 $F_{0.05}(3,12)=«f312»$、$F_{0.05}(3,20)=«f320»$、$F_{0.05}(3,32)=«f332»$ と上側 10% 点 $F_{0.10}(3,12)=«f312t»$ を用いよ。
        choices:
          - '$F=«Fe»$ で、$F_{0.05}(3,20)=«f320»$ を超えるので有意である。'
          - '$F=«Fpool»$ で、$F_{0.05}(3,32)=«f332»$ を超えるので有意である。'
          - '$F=«F»$ で、$F_{0.05}(3,12)=«f312»$ を超えないので有意でない。'
          - '$F=«Fb»$ で、$F_{0.05}(3,12)=«f312»$ を超えないので有意でない。'
          - '$F=«F»$ で、$F_{0.10}(3,12)=«f312t»$ を超えるので有意水準 5% で有意である。'
        answer: 2
        distractors:
          - 固定効果の検定でも誤差の平均平方を分母にした（両方固定のときの方法）
          - 交互作用と誤差の平方和を合併した平均平方を分母にした
          - 正解
          - 分母に選手の平均平方を使った
          - 10% 点と比べて有意水準 5% の判定をした
        explanation: |
          **方針** 平均平方の期待値を考えると、混合モデル（$A$ 固定、$B$ 変量、各セル $r=«rep»$ 回）では
          $$E[MS_A]=\sigma^2+r\sigma_{AB}^2+(\text{踏切板の効果}),\quad E[MS_{AB}]=\sigma^2+r\sigma_{AB}^2,\quad E[MS_E]=\sigma^2$$
          踏切板の効果が 0 のとき $E[MS_A]$ と一致するのは $E[MS_{AB}]$ なので、分母は交互作用の平均平方。交互作用に和が 0 の制約をおく流儀（制約つきモデル）でもおかない流儀でも、$E[MS_A]$ と $E[MS_{AB}]$ は上の形で同じなので、踏切板の検定の分母は変わらない（流儀で変わるのは選手の主効果の検定の分母）。

          **途中式**
          $$F=\frac{MS_A}{MS_{AB}}=\frac{«msa»}{«msab»}=«F»$$
          自由度 $(«dfa»,\ «dfab»)$ の上側 5% 点 $«f312»$ を超えないので、有意でない。

          **答え** $F=«F»$ で有意でない、という記述

          **間違えやすい点** 誤差の平均平方で割ると $F=«Fe»$ となり有意に見える。選手と踏切板の相性（交互作用）のばらつきは、選んだ選手が変われば変わるので、踏切板の差を一般化するにはそのばらつきと比べる必要がある。
          交互作用と誤差を合併（平均平方 $«pool»$）すると $«Fpool»$ になるが、交互作用が無視できるとは限らないので使えない。

      - id: s14p06c
        chapter: 11
        terms: [f-test-equal-variances, f-distribution, one-sided-two-sided-test]
        topic: 2人の選手の得点の安定性の違いを母分散の比のF検定で両側検定する
        level: 標準
        definition: false
        type: choice
        question: |
          選手 P と選手 Q の同じ種目の得点の安定性を比べる。P の «n1» 回の得点の標本標準偏差（不偏分散の平方根）は «sP»、Q の «n2» 回では «sQ» だった。
          得点は正規分布に従うとして、「2 人の母分散は等しい」という帰無仮説を有意水準 5% の**両側**検定で調べる。
          必要なら $F$ 分布の上側の点 $F_{0.025}(10,15)=«f025»$、$F_{0.05}(10,15)=«f05»$ を用いよ。正しい記述はどれか。
        choices:
          - '$F=«Fv»$ で、$«f05»$ を超えるので帰無仮説を棄却する。'
          - '$F=«Fsd»$ で、$«f025»$ を超えないので帰無仮説を棄却しない。'
          - '$F=«Fmean»$ で、$«f025»$ を超えるので帰無仮説を棄却する。'
          - '標本の大きさが異なるので $F$ 検定は使えず、ウェルチの方法で判断する。'
          - '$F=«Fv»$ で、$«f025»$ を超えないので帰無仮説を棄却しない。'
        answer: 4
        distractors:
          - 両側検定なのに上側 5% 点と比べた
          - 分散ではなく標準偏差の比を統計量にした
          - 平均の標準誤差の 2 乗の比（s^2/n どうし）を統計量にした
          - F 検定は標本の大きさが違っても使える。ウェルチの方法は平均の比較の方法
          - 正解
        explanation: |
          **方針** 帰無仮説のもとで $F=s_P^2/s_Q^2$ は自由度 $(«n1»-1,\ «n2»-1)=(«df1»,\ «df2»)$ の $F$ 分布に従う。大きいほうの分散を分子にすれば、両側 5% の検定は上側 2.5% 点と比べればよい。

          **途中式**
          $$F=\frac{«sP»^2}{«sQ»^2}=\frac{«v1»}{«v2»}=«Fv»$$
          $«Fv»<F_{0.025}(«df1»,«df2»)=«f025»$ なので、帰無仮説を棄却しない。

          **答え** $F=«Fv»$ で棄却しない、という記述

          **間違えやすい点** 両側検定では片側に 2.5% ずつ割り振るので、上側 5% 点 $«f05»$ ではなく 2.5% 点 $«f025»$ を使う（5% 点と比べると逆の結論になる）。統計量は標準偏差の比 $«Fsd»$ ではなく分散の比。

  - id: s14p07
    title: サッカー選手の市場価値の回帰
    context: |
      プロサッカー選手の市場価値 $y$ を、1 シーズンのシュート数 $x_1$ とチャンス創出数 $x_2$ で説明する線形回帰を考える。3 つの変数はすべて平均 0、分散 1 に標準化してある。
      標本の相関係数は $r_{x_1x_2}=«rho»$、$r_{yx_1}=«r1»$、$r_{yx_2}=«r2»$ である。
    items:
      - id: s14p07a
        chapter: 16
        terms: [variance-inflation-factor, multicollinearity, standard-error]
        topic: 2つの説明変数の相関から分散拡大係数を求め係数の標準誤差が何倍になるかを読む
        level: 基本
        definition: false
        type: choice
        question: |
          $y$ を $x_1,\ x_2$ に回帰する重回帰で、$x_1$ の係数の分散拡大係数（VIF）と、$x_1$ と $x_2$ が無相関だった場合に比べて $x_1$ の係数の標準誤差が何倍になるか（誤差分散と標本の大きさは同じとする）の組として正しいものはどれか。
        choices:
          - '$«v_inv»$'
          - '$«v_plus»$'
          - '$«v_ok»$'
          - '$«v_nosq»$'
          - '$«v_1r»$'
        answer: 2
        distractors:
          - VIF の逆数（許容度）1-R^2 を VIF と取り違えた
          - 1/(1-R^2) ではなく 1+R^2 とした
          - 正解
          - 標準誤差の倍率に VIF をそのまま使い、平方根をとらなかった
          - R^2 ではなく相関係数 r で 1/(1-r) とした
        explanation: |
          **方針** $x_1$ の VIF は、$x_1$ を他の説明変数に回帰したときの決定係数 $R_1^2$ を使って $\mathrm{VIF}_1=\frac{1}{1-R_1^2}$。係数の分散は VIF 倍になるので、標準誤差は $\sqrt{\mathrm{VIF}}$ 倍になる。

          **途中式** 説明変数が 2 つなので $R_1^2=r_{x_1x_2}^2=«rho»^2=«rho2»$。
          $$\mathrm{VIF}_1=\frac{1}{1-«rho2»}=\frac{1}{«om»}=«vif»,\qquad \sqrt{«vif»}=«sevif»$$

          **答え** VIF $=«vifs»$、標準誤差は $«sevif»$ 倍

          **間違えやすい点** VIF は**分散**の倍率。標準誤差の倍率はその平方根。$1-R^2=«om»$ は許容度（tolerance）で、VIF の逆数である。

      - id: s14p07b
        chapter: 19
        terms: [principal-component-regression, principal-component, least-squares-method]
        topic: 相関する2つの標準化説明変数を第1主成分だけで回帰する主成分回帰の係数をもとの変数に戻す
        level: 応用
        definition: false
        type: choice
        question: |
          多重共線性を避けるため、$x_1,\ x_2$ の相関行列の第 1 主成分 $z=(x_1+x_2)/\sqrt2$ だけを説明変数にして $y$ を回帰し（主成分回帰）、得られた式をもとの変数 $x_1,\ x_2$ の係数に書き直す。
          その係数 $(\hat\beta_1,\ \hat\beta_2)$ として正しいものはどれか。
        choices:
          - '$«c_ols»$'
          - '$«c_g»$'
          - '$«c_ok»$'
          - '$«c_nov»$'
          - '$«c_no2»$'
        answer: 2
        distractors:
          - 主成分回帰ではなく 2 変数の最小二乗法の係数を答えた
          - z の係数 γ をそのまま x1, x2 の係数とし、1/√2 を掛け忘れた
          - 正解
          - z の分散 1+r で割り忘れた
          - z=(x1+x2)/√2 の √2 を 2 回掛け、係数を 2 倍にした
        explanation: |
          **方針** 標準化した 2 変数の相関行列の第 1 主成分は $z=(x_1+x_2)/\sqrt2$。単回帰の係数 $\hat\gamma=\mathrm{Cov}(y,z)/V[z]$ を求め、$\hat\gamma z=\frac{\hat\gamma}{\sqrt2}x_1+\frac{\hat\gamma}{\sqrt2}x_2$ と書き直す。

          **途中式**
          $$\mathrm{Cov}(y,z)=\frac{r_{yx_1}+r_{yx_2}}{\sqrt2}=\frac{«rs»}{\sqrt2},\qquad V[z]=\frac{1+1+2r_{x_1x_2}}{2}=1+«rho»=«vz»$$
          $$\hat\gamma=\frac{«rs»/\sqrt2}{«vz»}=«gam»\cdots,\qquad \hat\beta_1=\hat\beta_2=\frac{\hat\gamma}{\sqrt2}=\frac{«rs»}{2\times«vz»}=\frac{«rs»}{«den2»}=«beta»$$

          **答え** $«c_ok»$

          **間違えやすい点** 主成分回帰の係数は、通常の最小二乗推定値 $(«ob1»,\ «ob2»)$ と違い、2 変数の係数が等しく縮められる（第 2 主成分 $(x_1-x_2)/\sqrt2$ の方向の情報を捨てるため）。$z$ の係数 $\hat\gamma$ をそのまま使うと $«c_g»$ になる。

  - id: s14p08
    title: サッカーの得点
    context: |
      あるサッカーリーグの得点データを分析する。
    items:
      - id: s14p08a
        chapter: 2
        terms: [conditional-probability-function, poisson-distribution, conditional-expectation]
        topic: ホームの得点がポアソン分布のとき得点した試合に限った得点の条件付き期待値を0を除いた条件付き確率関数から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある対戦カードで、ホームチームの得点 $X$ は平均 «lh» のポアソン分布に従うとする。
          ホームチームが 1 点以上取った試合に限ったときの得点の期待値 $E[X\mid X\ge1]$ を求めよ。必要なら $e^{-«lh»}=«e0»$ を用いよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 条件付き確率関数は $P(X=x\mid X\ge1)=\dfrac{P(X=x)}{P(X\ge1)}$（$x=1,2,\ldots$）。これで期待値をとると、$x=0$ の項はもともと期待値に寄与しないので、分子は $E[X]$ そのものになる。

          **途中式** $P(X\ge1)=1-P(X=0)=1-e^{-«lh»}=1-«e0»=«p1»$。
          $$E[X\mid X\ge1]=\sum_{x\ge1}x\,\frac{P(X=x)}{P(X\ge1)}=\frac{E[X]}{P(X\ge1)}=\frac{«lh»}{«p1»}=«ans5»$$

          **答え** $«ans»$

          **間違えやすい点** 「1 点は取ったのだから、残りも平均 «lh» 点」と考えて $1+«lh»=«w_plus»$ とするのは誤り（ポアソン分布には指数分布のような無記憶性はない）。$P(X\ge1)$ で割らずに掛けると $«w_mul»$ になる。条件をつけると 0 の分の確率が 1 以上の値に配り直されるので、期待値は «lh» より少し大きくなる。

      - id: s14p08b
        chapter: 18
        terms: [overdispersion, poisson-regression, negative-binomial-distribution, link-function]
        topic: 過分散のある得点に負の二項回帰を当てはめ線形予測子と分散母数から無得点の確率を求めポアソン回帰の値と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          リーグの各チームの 1 試合の得点 $Y$ をポアソン回帰で分析したところ、ピアソンのカイ二乗統計量を残差の自由度で割った値が «phi» で、過分散が疑われた。
          そこで、平均 $\mu$、分散 $\mu+\mu^2/\theta$ の負の二項分布
          $$P(Y=y)=\frac{\Gamma(y+\theta)}{\Gamma(\theta)\,y!}\left(\frac{\theta}{\theta+\mu}\right)^{\theta}\left(\frac{\mu}{\theta+\mu}\right)^{y}\qquad(y=0,1,2,\ldots)$$
          を使う負の二項回帰（対数リンク）を当てはめ、
          $$\log\mu=«b0»+«bh»\times(\text{ホームなら }1)+«bx»\times(\text{戦力差}),\qquad \hat\theta=«th»$$
          を得た。ホームで戦力差が «x» のチームがこの試合で無得点になる確率の推定値に最も近いものはどれか。
          必要なら $e^{«e1x»}=«e1»$、$e^{«e2x»}=«e2»$、$e^{«e3x»}=«e3»$、$e^{-«e3»}=«ep»$ を用いよ。
        choices:
          - '$«w_pois»$'
          - '$«c_ok»$'
          - '$«w_nox»$'
          - '$«w_away»$'
          - '$«w_nopow»$'
        answer: 1
        distractors:
          - 過分散を無視してポアソン分布の P(Y=0)=e^{-μ} を使った
          - 正解
          - 戦力差の項を線形予測子に入れ忘れた
          - ホームのダミー変数を 0 として計算した
          - θ 乗をし忘れた
        explanation: |
          **方針** 対数リンクなので、まず線形予測子を計算して $\mu=e^{\text{線形予測子}}$ とする。次に負の二項分布の $y=0$ の確率 $\left(\frac{\theta}{\theta+\mu}\right)^{\theta}$ に代入する（$\Gamma(\theta)/(\Gamma(\theta)\,0!)=1$）。

          **途中式**
          $$\log\hat\mu=«b0»+«bh»\times1+«bx»\times«x»=«eta»,\qquad \hat\mu=e^{«eta»}=«mu»$$
          $$\hat P(Y=0)=\left(\frac{«th»}{«th»+«mu»}\right)^{«th»}=«base»^{«th»}=«ok5»$$

          **答え** $«c_ok»$

          **間違えやすい点** 同じ平均でもポアソン分布なら $e^{-«mu»}=«ep»$ で、過分散を表す負の二項分布のほうが 0 の確率が大きい（ばらつきが大きいぶん、0 と大きな値が増える）。$\theta$ 乗を忘れると $«w_nopow»$、ホームのダミーを 0 にすると $\mu=e^{«e1x»}$ で $«w_away»$、戦力差の項を落とすと $\mu=e^{«e2x»}$ で $«w_nox»$ になる。


  - id: s14p09
    title: eスポーツチームの練習と成績
    context: |
      あるeスポーツリーグの «n» チームについて、シーズンの勝ち点を目的変数とし、練習時間など «p» 個の説明変数（切片を除く）を使う線形回帰（切片あり、最小二乗法）を当てはめた。また、選手の練習と成績の因果関係についても検討した。
    items:
      - id: s14p09a
        chapter: 17
        terms: [studentized-residual, outlier-and-influential-point, leverage, dffits]
        topic: 内部スチューデント化残差から外部スチューデント化残差を求め全観測で最大の残差をボンフェローニ補正したt分布の点と比べて外れ値かを判定する
        level: 応用
        definition: false
        type: choice
        question: |
          このモデルで、内部スチューデント化残差（標準化残差）の絶対値が «n» チームの中で最大だったのは第 $i$ 観測で、$r_i=«r»$、てこ比は $h_{ii}=«h»$ だった。
          第 $i$ 観測を除いて推定した誤差の標準偏差を使う外部スチューデント化残差 $t_i$ は
          $$t_i=r_i\sqrt{\frac{n-p-2}{n-p-1-r_i^2}}\qquad(p\ \text{は切片を除く説明変数の個数})$$
          で求められ、外れ値がないとき自由度 $n-p-2$ の $t$ 分布に従う。どの観測が最大になるかを見てから調べているので、«n» 個の観測すべてを検定したとみなしてボンフェローニ補正をした両側検定（全体の有意水準 5%）で、第 $i$ 観測が外れ値かを判定する。
          $t_{\alpha}(k)$ を自由度 $k$ の $t$ 分布の上側 $100\alpha\%$ 点とし、$t_{0.025}(«a1»)=«t025»$、$t_{0.05/«nn2»}(«a1»)=«tb»$、$t_{0.05/«nn2»}(«a2»)=«tb30»$ である。正しい記述はどれか。
        choices:
          - '$t_i=«t2»$ で、$t_{0.025}(«a1»)=«t025»$ を超えるので、外れ値と判定する。'
          - '$t_i=«w_inv»$ で、$t_{0.05/«nn2»}(«a1»)=«tb»$ を超えないので、外れ値とは判定しない。'
          - '$t_i=«t2»$ で外れ値とは判定されないので、この観測を除いて当てはめ直しても、その当てはめ値はほとんど変わらない。'
          - '$|r_i|=«r»$ が目安の 2 を超えるので、ボンフェローニ補正の検定でも外れ値と判定する。'
          - '$t_i=«t2»$ で、$t_{0.05/«nn2»}(«a1»)=«tb»$ を超えないので、外れ値とは判定しない。'
        answer: 4
        distractors:
          - 最大の残差を選んでから調べたのに、多重性を補正しない点と比べた
          - 公式の分子と分母を逆にして t_i を計算した
          - 外れ値でないことと影響が小さいことを混同した（てこ比が大きく DFFITS は大きい）
          - 標準化残差の目安と検定の結論を混同した
          - 正解
        explanation: |
          **方針** まず公式で $t_i$ を求める。最大の残差を選んでから検定するので、«n» 個すべてを両側で検定したとみなし、各検定の有意水準を $0.05/«n»$（片側 $0.05/«nn2»$）にする（ボンフェローニ補正）。

          **途中式** $n=«n»$、$p=«p»$ より $n-p-2=«a1»$、$n-p-1=«a2»$、$r_i^2=«r2»$。
          $$t_i=«r»\times\sqrt{\frac{«a1»}{«a2»-«r2»}}=«r»\times\sqrt{\frac{«a1»}{«a2r»}}=«r»\times\sqrt{«ratio»}=«r»\times«sq»=«t»$$
          自由度 «a1» の上側 $0.05/«nn2»$ 点は «tb» で、$|t_i|=«t»<«tb»$ なので、全体の有意水準 5% では外れ値とは判定しない。

          **答え** 「$t_i=«t2»$ で、$t_{0.05/«nn2»}(«a1»)=«tb»$ を超えないので、外れ値とは判定しない」という記述

          **間違えやすい点** 補正しない点 «t025» と比べると「外れ値」になってしまう。«n» 個の中で最大の残差は、外れ値がなくても大きくなりやすいので、多重性の補正が要る。
          外れ値と判定されなくても影響が小さいとは限らない。この観測はてこ比 «h» が目安 $2(p+1)/n=«h2»$ を超え、$\mathrm{DFFITS}_i=t_i\sqrt{h_{ii}/(1-h_{ii})}=«dffits»$ は目安 $2\sqrt{(p+1)/n}=«th»$ を大きく超えるので、除くと当てはめ値が大きく変わる影響点である。公式の分子と分母を逆にすると $t_i=«w_inv»$ になる。


      - id: s14p09b
        chapter: 33
        terms: [d-separation, causal-effect, backdoor-criterion]
        topic: 練習時間と成績とスポンサー契約の因果グラフからd分離で成り立つ条件付き独立を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          リーグの分析担当は、選手について次の因果グラフ（有向非巡回グラフ）を想定した。矢印はこれ以外にないものとする。

          - 入団時の評価 $Z$ → 練習時間 $X$、$Z$ → 大会成績 $Y$
          - $X\to Y$
          - $X$ → スポンサー契約 $S$、$Y\to S$

          このグラフの d 分離から導かれる条件付き独立として、正しいものはどれか。
        choices:
          - '$Z$ と $S$ は、$X$ と $Y$ を与えると条件付き独立である。'
          - '$Z$ と $Y$ は、$X$ を与えると条件付き独立である。'
          - '$Z$ と $S$ は、$X$ を与えると条件付き独立である。'
          - '$Z$ と $S$ は、何も条件づけなくても独立である。'
          - '$X$ と $S$ は、$Y$ を与えると条件付き独立である。'
        answer: 0
        distractors:
          - 正解
          - Z→Y の直接の矢印を見落とした（隣接する変数はどう条件づけても d 分離されない）
          - Z→Y→S の経路が X を与えても開いたままであることを見落とした
          - Z→X→S などの経路が開いているのに独立とした
          - X→S の直接の矢印を見落とした
        explanation: |
          **方針** 2 つの変数の間のすべての経路が、条件づけた集合によって遮断されているかを調べる。経路は「合流点でない点を条件づける」か「合流点（およびその子孫）を条件づけない」ときに遮断される。直接の矢印でつながる 2 変数は d 分離されない。

          **途中式** $Z$ と $S$ の間の経路は
          - $Z\to X\to S$：$X$ は合流点でないので、$X$ を条件づければ遮断。
          - $Z\to Y\to S$：$Y$ は合流点でないので、$Y$ を条件づければ遮断。
          - $Z\to X\to Y\to S$：$X$（または $Y$）を条件づければ遮断。
          - $Z\to Y\leftarrow X\to S$：$Y$ は合流点なので $Y$ を条件づけると開くが、途中の $X$（合流点でない）を条件づけているので遮断。

          $\{X,Y\}$ を条件づけるとすべて遮断されるので、$Z$ と $S$ は $\{X,Y\}$ のもとで d 分離される。

          **答え** 「$Z$ と $S$ は、$X$ と $Y$ を与えると条件付き独立」という記述

          **間違えやすい点** $X$ だけを条件づけても $Z\to Y\to S$ が開いている。$Z$ と $Y$、$X$ と $S$ は矢印で直接つながっているので、どんな集合で条件づけても d 分離されない。
          なお、$X$ から $Y$ への因果効果を推定するには $\{Z\}$ で調整すればよく（バックドア基準）、$X$ と $Y$ の子孫である $S$ で調整してはいけない。

  - id: s14p10
    title: 動画配信サービスの分析
    context: |
      ある動画配信サービスの分析チームが、番組の視聴数と視聴者アンケートを分析した。
    items:
      - id: s14p10a
        chapter: 21
        terms: [stratified-sampling, proportional-allocation, standard-error]
        topic: 無料会員と有料会員の2層から比例配分で抽出した視聴時間アンケートの層別平均の標準誤差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          会員 «N» 人（無料会員 «N1» 人、有料会員 «N2» 人）から «n» 人を選び、1 か月の視聴時間（時間）を尋ねる。会員の種類を層とし、層の大きさに比例して標本を割り当てる比例配分（無料 «n1» 人、有料 «n2» 人）で、層ごとに単純無作為抽出する。
          過去の調査から、層内の標準偏差は無料会員で «S1» 時間、有料会員で «S2» 時間とみなせる。全会員の平均視聴時間を層別平均 $\bar y_{st}=\sum_h W_h\bar y_h$（$W_h$ は層の構成比）で推定するとき、その標準誤差に最も近いものはどれか。有限母集団修正は無視してよい。
        choices:
          - '$«w_sd»$'
          - '$«w_var»$'
          - '$«w_w»$'
          - '$«w_eq»$'
          - '$«c_ok»$'
        answer: 4
        distractors:
          - 分散 S_h^2 ではなく標準偏差 S_h を代入した
          - 分散を答え、平方根をとり忘れた
          - 重み W_h を 2 乗し忘れた
          - 2 つの層の重みを等しく 1/2 とした
          - 正解
        explanation: |
          **方針** 層ごとの抽出は独立なので、$V[\bar y_{st}]=\sum_h W_h^2\,V[\bar y_h]=\sum_h W_h^2\frac{S_h^2}{n_h}$（有限母集団修正なし）。その平方根が標準誤差。

          **途中式** $W_1=«N1»/«N»=«W1»$、$W_2=«W2»$。
          $$V[\bar y_{st}]=«W1»^2\times\frac{«S1»^2}{«n1»}+«W2»^2\times\frac{«S2»^2}{«n2»}=«t1»+«t2»=«var»$$
          $$\mathrm{SE}=\sqrt{«var»}=«se4»$$

          **答え** $«c_ok»$

          **間違えやすい点** 推定量は $W_h\bar y_h$ の和なので、分散には $W_h^2$ がかかる（$W_h$ のままだと $«w_w»$）。分散 $«w_var»$ のままにしない。比例配分では $W_h^2/n_h=W_h/n$ なので、$V=\frac{1}{n}\sum W_hS_h^2=\frac{1}{«n»}(«W1»\times«S1»^2+«W2»\times«S2»^2)$ と計算してもよい。

      - id: s14p10b
        chapter: 26
        terms: [canonical-correlation-analysis, canonical-variate, coefficient-of-determination]
        topic: 継続意向1変数と満足度2項目の組の第1正準相関を相関行列から重相関係数として求める
        level: 標準
        definition: false
        type: choice
        question: |
          視聴者アンケートで、継続意向 $y$ と、作品満足度 $x_1$・価格満足度 $x_2$ の 2 項目を測った。相関係数は $r_{yx_1}=«ry1»$、$r_{yx_2}=«ry2»$、$r_{x_1x_2}=«r12»$ だった。
          変数の組 $\{y\}$ と $\{x_1,x_2\}$ の正準相関分析を行うとき、第 1 正準相関係数に最も近いものはどれか。
        choices:
          - '$«w_R2»$'
          - '$«R»$'
          - '$«w_max»$'
          - '$«w_nod»$'
          - '$«w_sumr»$'
        answer: 1
        distractors:
          - 重相関係数の 2 乗（決定係数）を答えた
          - 正解
          - 単相関のうち大きいほうを答えた（2 項目を組み合わせると相関は上がりうる）
          - 公式の分母 1-r12^2 で割り忘れた
          - x1 と x2 の相関を無視して r^2 を足しただけにした
        explanation: |
          **方針** 一方の組が 1 変数のとき、第 1 正準相関は「$y$ と $x_1,x_2$ の線形結合の相関の最大値」で、$y$ を $x_1,x_2$ に回帰したときの重相関係数 $R$ に等しい。2 変数の場合
          $$R^2=\frac{r_{yx_1}^2+r_{yx_2}^2-2r_{yx_1}r_{yx_2}r_{x_1x_2}}{1-r_{x_1x_2}^2}$$

          **途中式**
          $$R^2=\frac{«q1»+«q2»-«q3»}{1-«r12»^2}=\frac{«cnum»}{«cden»}=«R2»\cdots,\qquad R=\sqrt{«R2»}=«R4»\cdots$$

          **答え** $«R»$

          **間違えやすい点** 正準相関は相関係数なので、決定係数 $R^2=«w_R2»$ ではなく平方根をとる。$x_1$ と $x_2$ が相関しているので、$\sqrt{r_{yx_1}^2+r_{yx_2}^2}=«w_sumr»$ は過大になる。

      - id: s14p10c
        chapter: 27
        terms: [unit-root, ar-model, random-walk]
        topic: 対数視聴者数の系列にディッキー・フラー検定を行い通常のt分布の点と比べてはいけないことを読む
        level: 標準
        definition: false
        type: choice
        question: |
          ある番組の週間視聴者数の対数 $y_t$ が単位根をもつ（ランダムウォーク型）かを調べるため、
          $$\Delta y_t=\alpha+\gamma\,y_{t-1}+\varepsilon_t\qquad(\Delta y_t=y_t-y_{t-1})$$
          を最小二乗法で当てはめたところ、$\hat\gamma=«g»$、その標準誤差は «gse» だった。$H_0:\gamma=0$（単位根あり）、$H_1:\gamma<0$（定常）を有意水準 5% で検定する。
          定数項ありのディッキー・フラー検定の 5% 臨界値は $«df5»$、標準正規分布の下側 5% 点は $«z5»$ である。正しい記述はどれか。
        choices:
          - '統計量は $«tau»$ で、$«z5»$ を下回るので単位根の帰無仮説を棄却し、系列は定常といえる。'
          - '統計量は $«tau»$ で、ディッキー・フラー検定の臨界値 $«df5»$ を下回らないので、単位根の帰無仮説を棄却できない。'
          - '$\hat\gamma=«g»$ から AR 係数は $1+\hat\gamma=«rho»<1$ なので、検定するまでもなく定常である。'
          - '単位根の検定では $\hat\gamma$ の $t$ 値を両側検定で $\pm1.96$ と比べる。'
          - '$\Delta y_t$ は差分なので、$y_t$ が定常かどうかにかかわらず $\gamma=0$ である。'
        answer: 1
        distractors:
          - 単位根のもとでの t 値は t 分布（正規分布）に従わないのに、通常の点と比べた
          - 正解
          - 推定値が 1 より小さいことだけで定常と判断した（標本誤差を無視）
          - 対立仮説が γ<0 の片側であることと、DF 分布を使うことを無視した
          - 差分をとった式の γ の意味を誤解した
        explanation: |
          **方針** $\gamma=\phi-1$（$\phi$ は AR(1) 係数）なので、$\gamma=0$ は単位根を表す。帰無仮説のもとでは $\hat\gamma$ の $t$ 値は $t$ 分布ではなく、左に偏ったディッキー・フラー分布に従うので、その臨界値と比べる。

          **途中式**
          $$\tau=\frac{\hat\gamma}{\mathrm{SE}(\hat\gamma)}=\frac{«g»}{«gse»}=«tau»$$
          $«tau»>«df5»$（臨界値より左にない）ので、有意水準 5% で単位根の帰無仮説を棄却できない。

          **答え** 統計量 $«tau»$ で、臨界値 $«df5»$ を下回らないので棄却できない、という記述

          **間違えやすい点** 通常の片側の点 $«z5»$ と比べると「定常」と誤って結論してしまう。単位根のもとでは推定量が下に偏りやすく、通常の点を使うと帰無仮説を棄却しすぎる。
          推定値 $1+\hat\gamma=«rho»$ が 1 より小さくても、それだけでは単位根を否定できない。

