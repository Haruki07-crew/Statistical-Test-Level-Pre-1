          **途中式** 誤るのは境界付近の地点だけである。
          - $k=1$：«list1» の «n1» 地点を誤る → $«n1»/8=«e1»$
          - $k=3$：«list3» の «n3» 地点を誤る → $«n3»/8=«e3»$

          **答え** $k=1$ は «e1»、$k=3$ は «e3»

          **間違えやすい点** 自分自身を除かずに判定すると、1 近傍法では必ず自分が選ばれて誤りが 0 になり、性能を過大評価する。一個抜き交差検証はこれを防ぐ。
          $k$ を大きくすると判定がなめらかになり、ばらつきは減るが、境界がぼやけて偏りが増える。$k$ はこのような交差検証で選ぶ。

      - id: s23p13b
        chapter: 5
        terms: [geometric-distribution, expectation-variance-properties, multinomial-distribution]
        topic: 4つの区画から毎回1つを無作為に選んで点検するときすべての区画を少なくとも1回点検するまでの回数の期待値を幾何分布の和で求める
        level: 基本
        definition: false
        type: choice
        question: |
          あるトンネルの覆工を 4 つの区画に分け、毎回の簡易点検ではそのうち 1 区画を、これまでの点検とは独立に等しい確率で選んで点検する（同じ区画を選ぶこともある）。
          4 区画すべてを少なくとも 1 回点検し終えるまでの点検回数の期待値に最も近いものはどれか。
        choices:
          - '$«ok»$'
          - '$4.00$'
          - '$«w_ln»$'
          - '$«w_n2»$'
          - '$«w_drop»$'
        answer: 0
        distractors:
          - 正解
          - 毎回まだ点検していない区画が選ばれると考えた
          - 近似 n log n をそのまま使った
          - 期待値を n² とした
          - 最後の 1 区画を待つ回数（期待値 4 回）を落とした
        explanation: |
          **方針** すでに $j$ 区画を点検したあと、新しい区画が選ばれる確率は $(4-j)/4$ なので、次の新しい区画までの回数は成功確率 $(4-j)/4$ の幾何分布（期待値 $4/(4-j)$）に従う。これを $j=0,1,2,3$ について足す（クーポン収集問題）。

          **途中式**
          $$\frac44+\frac43+\frac42+\frac41=1+1.333+2+4=«ok4»$$

          **答え** 約 $«ok»$ 回

          **間違えやすい点** 最後の 1 区画は 4 回に 1 回しか選ばれないので、平均 4 回かかる。終わりに近いほど新しい区画が出にくくなり、全体として区画数のおよそ $\log n$ 倍の回数が必要になる（$n\log n=«w_ln»$ は大きな $n$ での近似）。

  - id: s23p14
    title: 地震時の被害の因果構造と地盤調査地点の分類
    context: |
      ある市が、地震時の橋の被害のしくみを有向非巡回グラフで整理し、地盤調査地点をクラスター分析で分類している。
    items:
      - id: s23p14a
        chapter: 25
        terms: [directed-acyclic-graph, graphical-model, conditional-independence]
        topic: 2値の4変数の有向非巡回グラフで因数分解に必要な条件付き確率の母数の数を数え制約のない同時分布と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          地震の強い揺れ $E$、地盤の液状化 $L$、橋脚の損傷 $D$、通行止め $C$ はどれも「あり・なし」の 2 値とする。因果の構造を有向非巡回グラフ
          $$E\to L,\qquad E\to D,\qquad L\to D,\qquad D\to C$$
          で表し、同時分布をこのグラフにもとづいて因数分解する。必要な（自由に決められる）確率の母数の数と、制約のない同時分布の母数の数の組として正しいものはどれか。
        choices:
          - グラフにもとづくと «ok»、制約なしでは 15
          - グラフにもとづくと «ok»、制約なしでは 16
          - グラフにもとづくと «w_edges»、制約なしでは 15
          - グラフにもとづくと «w_noroot»、制約なしでは 15
          - グラフにもとづくと «w_full»、制約なしでは 15
        answer: 0
        distractors:
          - 正解
          - 同時分布の確率の和が 1 になる制約を引かなかった
          - 矢印の数を数えた
          - 親のない E の確率 P(E) を数え忘れた
          - 条件付き分布ごとに「あり」と「なし」の両方の確率を数えた（和が 1 の制約を使わなかった）
        explanation: |
          **方針** グラフにもとづく因数分解は $P(E)P(L\mid E)P(D\mid E,L)P(C\mid D)$。2 値の変数では、親の値の組み合わせごとに「あり」の確率が 1 つ必要なので、各変数の母数は $2^{(\text{親の数})}$ 個。

          **途中式**
          - $P(E)$：1、$P(L\mid E)$：2、$P(D\mid E,L)$：4、$P(C\mid D)$：2
          - 合計 $1+2+4+2=«ok»$

          制約のない 4 変数の同時分布は $2^4=16$ 通りの確率で、和が 1 なので 15 個。

          **答え** グラフにもとづくと «ok»、制約なしでは 15

          **間違えやすい点** グラフで表される条件付き独立（たとえば $D$ を与えると $C$ は $E$、$L$ と独立）の分だけ母数が減る。母数が少ないほど少ないデータで推定しやすいが、グラフが誤っていれば偏りが生じる。

      - id: s23p14b
        chapter: 24
        terms: [centroid-method, dendrogram, hierarchical-clustering]
        topic: 3地点を重心法で併合すると2回目の併合の高さが1回目より低くなる逆転が起きることを平方距離から確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの地盤調査地点の標準化した特徴量（2 次元）は A$=(0,\ 0)$、B$=(2,\ 0)$、C$=(1,\ «cy»)$ である。距離をユークリッド距離の 2 乗とし、重心法（クラスターの重心どうしの平方距離）で階層的に併合する。
          1 回目と 2 回目の併合の高さ（併合したときの平方距離）と、デンドログラムについての記述の組として正しいものはどれか。
        choices:
          - 1 回目は A と B を高さ 4.00 で、2 回目は高さ «ok2» で併合する。2 回目の方が低い「逆転」が起き、デンドログラムが単調にならない
          - 1 回目は A と B を高さ 4.00 で、2 回目は高さ «w_single» で併合する。併合の高さは単調に増える
          - 1 回目は A と B を高さ 4.00 で、2 回目は高さ «w_ward» で併合する。併合の高さは単調に増える
          - 1 回目は A と B を高さ 4.00 で、2 回目は高さ «ok2» で併合する。重心法では併合の高さが必ず単調に増えるので、計算の誤りである
          - 1 回目は A と C を高さ «w_single» で併合する
        answer: 0
        distractors:
          - 正解
          - 最短距離法（または群平均法）の更新を使った
          - ウォード法の更新式を使った
          - 重心法では併合の高さが単調にならないことがある（逆転）
          - 平方距離の最小は A–B の 4.00 で、A–C・B–C の «w_single» より小さい
        explanation: |
          **方針** 最初は平方距離が最小の組を併合し、併合したクラスターの重心から残りの点までの平方距離を求める。

          **途中式** 平方距離は A–B が 4.00、A–C と B–C が $1+«cy»^2=«w_single»$。最小の A–B を 4.00 で併合し、重心は $(1,0)$。
          C までの平方距離は $«cy»^2=«ok2»$ で、1 回目の高さ 4.00 より小さい。

          **答え** 2 回目は高さ «ok2» で、逆転が起きる

          **間違えやすい点** 重心法やメディアン法では、併合した重心が残りの点に近づくため、後の併合の方が低くなる「逆転」が起きうる。最短距離法・最長距離法・群平均法・ウォード法では併合の高さは単調に増える（ここでは最短距離法で «w_single»、ウォード法で «w_ward»）。
          逆転があるとデンドログラムを高さで切ってクラスター数を決めにくくなるので、重心法を使うときは注意する。
