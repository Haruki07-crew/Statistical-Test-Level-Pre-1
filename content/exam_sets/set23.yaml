set: 23
title: 模擬試験 第23回
minutes: 90
problems:
  - id: s23p01
    title: 地震後の道路網の通行確保
    context: |
      大きな地震のあと、防災拠点 $S$ から災害拠点病院 $T$ への緊急輸送路を確保したい。途中に交差点 $A$、$B$ があり、道路網は次の 5 区間からなる。

      | 区間 | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | 結ぶ地点 | $S$–$A$ | $S$–$B$ | $A$–$B$ | $A$–$T$ | $B$–$T$ |
      | 通行できる確率 | «p1» | «p2» | «p3» | «p4» | «p5» |

      各区間が通行できるかどうかは互いに独立で、通行できる区間はどちらの向きにも通れるとする。
    items:
      - id: s23p01a
        chapter: 1
        terms: [law-of-total-probability, independence-of-events, conditional-probability]
        topic: 地震後の5区間からなるブリッジ型道路網で2地点が通行可能につながる確率を中央区間の状態で条件づけて全確率の公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $S$ から $T$ まで、通行できる区間だけを通ってたどり着ける確率を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 区間 3（$A$–$B$）があるため、単純な直列・並列の組み合わせにはならない（ブリッジ型）。区間 3 が通れるかどうかで場合を分け、それぞれの条件のもとでは直列・並列の計算ができるようにして、全確率の公式でまとめる。

          **途中式**
          - 区間 3 が通れるとき：$A$ と $B$ は 1 つの地点とみなせる。「$S$ からその地点へ（区間 1 か 2）」と「その地点から $T$ へ（区間 4 か 5）」がともに通ればよいので
          $$\{1-(1-«p1»)(1-«p2»)\}\{1-(1-«p4»)(1-«p5»)\}=«u1»\times«u2»=«up»$$
          - 区間 3 が通れないとき：経路は「1→4」と「2→5」の 2 本の並列。
          $$1-(1-«p1»\times«p4»)(1-«p2»\times«p5»)=1-«b14»\times«b25»=«down»$$
          - 全確率の公式で
          $$P=«p3»\times«up»+«q3»\times«down»=«t_up»+«t_down»=«ans5»$$

          **答え** $«ans»$

          **間違えやすい点** 区間 3 を無視して 2 本の並列経路だけで計算すると $«w_down»$、区間 3 が必ず通れるとみなすと $«w_up»$ になる。
          また、経路「1→4」「2→5」「1→3→5」「2→3→4」の確率を単純に足すと、同じ状態を重複して数えるので 1 を超えてしまう。経路どうしは区間を共有しているため独立でもない。条件づけで共有をなくすのが要点である。

  - id: s23p02
    title: 杭の載荷試験と設計支持力
    context: |
      ある現場で、同じ仕様の杭 «n» 本に載荷試験を行い、極限支持力 $y_1,\ldots,y_{«n»}$（単位：kN）を得た。分布のモデルとして次の 2 つを考える。

      - モデル A：$y_i$ が正規分布 $N(\mu,\sigma^2)$ に従う。
      - モデル B：$\ln y_i$ が正規分布 $N(m,s^2)$ に従う（$y_i$ は対数正規分布に従う）。

      どちらも母数は 2 個で、最尤法で当てはめた。モデル A の $y$ についての最大対数尤度は $\ell_A=«lA»$ だった。
      モデル B を、変換したデータ $\ln y_1,\ldots,\ln y_{«n»}$ に正規分布を当てはめたものとして計算すると、$\ln y$ についての最大対数尤度は $\ell_B^{*}=«lB»$ だった。
      また $\sum_{i=1}^{«n»}\ln y_i=«S»$ である。対数は自然対数とする。
    items:
      - id: s23p02a
        chapter: 30
        terms: [aic, information-criteria-comparison, log-transformation]
        topic: 対数変換したデータに当てはめたモデルと元のデータのモデルのAICを変換のヤコビアンで補正して比べる
        level: 応用
        definition: false
        type: choice
        question: |
          AIC $=-2\times(\text{最大対数尤度})+2\times(\text{母数の個数})$ を、どちらも**元のデータ $y$ の分布**として計算して比べる。モデル A の AIC は $«aicA»$ である。
          モデル B の AIC と、AIC で選ばれるモデルの組として正しいものはどれか。
        choices:
          - 'モデル B の AIC は $«aicBlog»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB_sign»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB_one»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB»$ で、モデル B を選ぶ'
          - 'データの尺度が違うので 2 つのモデルの AIC は比べられず、どちらとも決められない'
        answer: 3
        distractors:
          - ln y の密度のまま AIC を計算し、y の密度に直すヤコビアン 1/y を掛け忘れた
          - ヤコビアンの補正の符号を逆にした（対数尤度に Σln y を足した）
          - 対数尤度の補正 Σln y を -2 倍せずに 1 倍で AIC に足した
          - 正解
          - 変数変換で密度を元の尺度に直せば比べられることを知らなかった
        explanation: |
          **方針** AIC は同じデータ（ここでは $y$）の尤度どうしでなければ比べられない。モデル B の $\ln y$ についての密度を、変数変換で $y$ の密度に直してから対数尤度を求める。

          **途中式** $u=\ln y$ の密度を $g(u)$ とすると、$y$ の密度は $f(y)=g(\ln y)\left|\dfrac{du}{dy}\right|=g(\ln y)\cdot\dfrac{1}{y}$。したがって
          $$\ell_B=\sum_i\ln f(y_i)=\ell_B^{*}-\sum_i\ln y_i=«lB»-«S»$$
          AIC に直すと
          $$\text{AIC}_B=-2\ell_B^{*}+2\sum_i\ln y_i+2\times2=«m2lB»+«twoS»+4=«aicB»$$
          モデル A は $-2\times(«lA»)+4=«aicA»$。差は $«aicA»-«aicB»=«dAIC»$ で、AIC が小さいモデル B を選ぶ。

          **答え** モデル B の AIC は $«aicB»$ で、モデル B を選ぶ。

          **間違えやすい点** $\ell_B^{*}$ のまま計算すると AIC は $«aicBlog»$ となり、A と 150 以上も差がつくように見えるが、これは $\ln y$ と $y$ という別のデータの尤度を比べた見かけの差である。
          この問題ではどちらでも B が選ばれるが、たまたまであり、補正しないと逆の結論になる場合もある。補正は $-2\ell$ に $+2\sum\ln y_i$（符号に注意）で、$-2$ 倍を忘れて $\sum\ln y_i$ だけ足すのも誤り。

      - id: s23p02b
        chapter: 6
        terms: [lognormal-distribution, coefficient-of-variation, standard-normal-distribution]
        topic: 平均と変動係数から対数正規分布の母数を求め杭の支持力が設計荷重を下回る確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          (a) の結果を踏まえ、設計では杭 1 本の支持力 $Y$ を、**平均 «m» kN・変動係数 «cv»** の対数正規分布に従うとする。$Y$ が設計荷重 «load» kN を下回る確率 $P(Y<«load»)$ に最も近いものはどれか。
          必要なら $\ln1.04=«ln104»$、$\ln0.7=«ln07»$、$\sqrt{«ln104»}=«sig»$ と、次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 1.50 | 1.70 | 1.80 | 1.90 |
          |---|---|---|---|---|
          | $\Phi(z)$ | «ph150» | «ph170» | «ph180» | «ph190» |
        choices:
          - '$«c_noshift»$'
          - '$«ans»$'
          - '$«c_comp»$'
          - '$«c_plus»$'
          - '$«c_norm»$'
        answer: 1
        distractors:
          - ln Y の平均を ln(平均) のまま使い、s²/2 を引き忘れた
          - 正解
          - 下回る確率ではなく上回る確率 Φ(1.70) を答えた
          - ln Y の平均で s²/2 を引くところを足した
          - 対数正規ではなく正規分布 N(2000, 400²) で計算した
        explanation: |
          **方針** $\ln Y\sim N(m,s^2)$ のとき、$E[Y]=e^{m+s^2/2}$、変動係数 $=\sqrt{e^{s^2}-1}$。この 2 式を平均と変動係数から逆に解いて $m$、$s$ を求め、$\ln Y$ を標準化する。

          **途中式** 変動係数から $e^{s^2}=1+«cv»^2=1.04$ なので $s^2=\ln1.04=«ln104»$、$s=«sig»$。
          平均から $m=\ln«m»-s^2/2$。よって
          $$P(Y<«load»)=P\left(Z<\frac{\ln«load»-\ln«m»+s^2/2}{s}\right)=\Phi\left(\frac{\ln0.7+«half»}{«sig»}\right)=\Phi\left(\frac{«num»}{«sig»}\right)=\Phi(«zraw»\cdots)$$
          $z\approx«z»$ として $\Phi(«z»)=1-\Phi(«za»)=1-«phiz»=«ans4»$。

          **答え** $«ans»$

          **間違えやすい点** 対数正規分布の平均は $e^{m}$ ではなく $e^{m+s^2/2}$。$s^2/2$ を引き忘れると $z=«z_noshift»$ で $«c_noshift»$、逆に足すと $z=«z_plus»$ で $«c_plus»$ になる。
          変動係数 «cv» を $\ln Y$ の標準偏差としてそのまま使うのも近似にすぎない（ここでは $s=«sig»$ でほぼ同じだが、変動係数が大きいと差が開く）。正規分布で近似すると $z=(«load»-«m»)/«sdnorm»=«z_norm»$ で $«c_norm»$ となり、下側の裾を大きく見積もる。

  - id: s23p03
    title: 防波堤の設計波の推定
    context: |
      ある港の防波堤の設計のため、沖合で個々の波の波高 $H$（単位：m）を観測した。波高はレイリー分布
      $$f(h)=\frac{h}{\theta}\exp\left(-\frac{h^2}{2\theta}\right)\quad(h>0,\ \theta>0)$$
      に互いに独立に従うとする（$\theta=\sigma^2$ は尺度の 2 乗にあたる母数で、$E[H^2]=2\theta$）。«n» 個の波高を観測したところ、$\sum_{i=1}^{«n»}h_i^2=«sh2»$ だった。
    items:
      - id: s23p03a
        chapter: 8
        terms: [maximum-likelihood-estimator, fisher-information, standard-error]
        topic: レイリー分布に従う波高データから母数θの最尤推定値とフィッシャー情報量による標準誤差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $\theta$ の最尤推定量 $\hat\theta$ を求め、フィッシャー情報量にもとづく $\hat\theta$ の標準誤差（漸近分散の $\theta$ に $\hat\theta$ を代入したものの平方根）を求めよ。
        answer: «se»
        tolerance: 0.01
        answer_format: 標準誤差を小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 対数尤度を $\theta$ で微分して 0 とおき最尤推定量を求める。2 階微分の期待値の符号を変えたものがフィッシャー情報量 $I(\theta)$ で、漸近分散は $1/I(\theta)$。

          **途中式** 対数尤度は
          $$\ell(\theta)=\sum_i\ln h_i-n\ln\theta-\frac{1}{2\theta}\sum_i h_i^2$$
          $$\ell'(\theta)=-\frac{n}{\theta}+\frac{\sum h_i^2}{2\theta^2}=0\ \Rightarrow\ \hat\theta=\frac{\sum h_i^2}{2n}=\frac{«sh2»}{«twon»}=«th»$$
          $$\ell''(\theta)=\frac{n}{\theta^2}-\frac{\sum h_i^2}{\theta^3},\qquad E[\ell''(\theta)]=\frac{n}{\theta^2}-\frac{n\cdot2\theta}{\theta^3}=-\frac{n}{\theta^2}$$
          よって $I(\theta)=n/\theta^2$、漸近分散は $\theta^2/n$。標準誤差は
          $$\frac{\hat\theta}{\sqrt n}=\frac{«th»}{«rootn»}=«se4»$$

          **答え** $«se»$

          **間違えやすい点** 分散 $\theta^2/n$ の平方根をとらずに $\hat\theta/n=«w_n»$ などとしないこと。標本の大きさを $2n$ と数えて $\hat\theta/\sqrt{2n}=«w_sqrt2»$ とするのも誤り。
          また、母数を $\sigma$（$=\sqrt\theta=«sig»$）と取り違えて $\sqrt{\hat\theta}/\sqrt n=«w_sig»$ としない。問われているのは $\theta$ の推定量の標準誤差である。

  - id: s23p04
    title: 斜張橋ケーブルの劣化と強度
    context: |
      ある斜張橋のケーブルの点検で、素線の腐食を調べている。1 本のケーブルについて、腐食している素線の割合 $X$ と、腐食した素線の平均の断面欠損率 $Y$ は互いに独立で、どちらも区間 $(0,1)$ の一様分布に従うとみなす。
      ケーブル全体の断面欠損率は $D=XY$ で表される。
    items:
      - id: s23p04a
        chapter: 4
        terms: [change-of-variables, uniform-distribution]
        topic: 独立な一様分布に従う腐食素線の割合と断面欠損率の積の分布関数を求め基準値を超える確率を出す
        level: 標準
        definition: false
        type: choice
        question: |
          ケーブル全体の断面欠損率が «d» を超える確率 $P(D>«d»)$ に最も近いものはどれか。必要なら $\ln«d»=«lnd»$ を使え。
        choices:
          - '$«c_unif»$'
          - '$«c_indep»$'
          - '$«ans»$'
          - '$«c_cdf»$'
          - '$«c_part»$'
        answer: 2
        distractors:
          - 積 D も一様分布に従うと思い込んだ
          - X>0.2 かつ Y>0.2 の確率を答えた（積が 0.2 を超える事象と取り違えた）
          - 正解
          - 分布関数 P(D≦0.2) を答えた
          - 分布関数の d·(-ln d) の項だけを使い、d の項を落とした
        explanation: |
          **方針** $D\le d$ となる $(x,y)$ の領域 $\{xy\le d\}$ の面積を求める（$X,Y$ の同時密度は単位正方形上で 1）。$x\le d$ なら $y$ によらず $xy\le d$、$x>d$ なら $y\le d/x$。

          **途中式**
          $$P(D\le d)=\int_0^{d}1\,dx+\int_d^1\frac{d}{x}\,dx=d+d(\ln1-\ln d)=d-d\ln d$$
          $d=«d»$ では $P(D\le«d»)=«d»+«dlnd»=«cdf»$。したがって
          $$P(D>«d»)=1-«cdf»=«ans5»$$
          （密度は $f_D(t)=-\ln t$（$0<t<1$）で、小さい値に偏った分布になる。）

          **答え** $«ans»$

          **間違えやすい点** 一様分布どうしの積は一様分布ではない。$1-«d»=«c_unif»$ とすると超える確率を大きく見積もる。
          「$X>«d»$ かつ $Y>«d»$」の確率 $(1-«d»)^2=«c_indep»$ は $D>«d»$ とは別の事象（例えば $X=0.9$、$Y=0.15$ なら $D=0.135$ だが、$X=0.3$、$Y=0.7$ なら $D=0.21$）。
          積分で $x\le d$ の部分（面積 $d$）を落とすと $1-«dlnd»=«c_part»$ になる。

      - id: s23p04b
        chapter: 7
        terms: [extreme-value-distribution, convergence-in-distribution]
        topic: 長いケーブルを多数の区間の最弱リンクとみてワイブル型の極値近似で強度の中央値が長さとともに下がる割合（寸法効果）を求める
        level: 応用
        definition: false
        type: choice
        question: |
          ケーブルの引張強度は、短い区間に分けたとき最も弱い区間の強度で決まる（最弱リンク）。ケーブルを長さの等しい $n$ 区間に分け、各区間の強度 $S_1,\ldots,S_n$ は独立に同じ分布に従い、その分布関数は強度が小さい側で
          $$F(s)\approx\left(\frac{s}{s_0}\right)^{m}\quad(s\ \text{が小さいとき}),\qquad m=«m»$$
          とふるまうとする。$n$ が大きいとき、ケーブル強度 $\min_i S_i$ の分布は極値近似 $P(\min_i S_i\le s)\approx1-\exp\{-n(s/s_0)^m\}$ で表せる。
          同じ材料でケーブルの長さを «k» 倍（区間の数を «k» 倍）にすると、ケーブル強度の中央値は何倍になるか。最も近いものを選べ。
          必要なら $10^{-0.1}=«t1»$、$10^{-0.05}=«t05»$、$10^{-0.5}=«t2»$ を使え。
        choices:
          - '$«w_one»$'
          - '$«w_inv»$'
          - '$«w2»$'
          - '$«w05»$'
          - '$«ratio»$'
        answer: 4
        distractors:
          - 最弱リンクを考えず、強度の中央値は長さによらないとした
          - 区間の数に反比例すると考え 1/10 とした
          - 平均の標準誤差のように 1/√10 で縮むと考えた
          - 指数を 1/m ではなく 1/(2m) とした
          - 正解
        explanation: |
          **方針** 中央値 $s_{1/2}$ は $P(\min S_i\le s_{1/2})=1/2$ を満たす。極値近似の式を $s$ について解き、$n$ への依存のしかたを調べる。

          **途中式**
          $$1-\exp\{-n(s_{1/2}/s_0)^m\}=\frac12\ \Rightarrow\ n\left(\frac{s_{1/2}}{s_0}\right)^m=\ln2\ \Rightarrow\ s_{1/2}=s_0\left(\frac{\ln2}{n}\right)^{1/m}$$
          $n$ を «k» 倍にすると
          $$\frac{s_{1/2}(«k»n)}{s_{1/2}(n)}=«k»^{-1/m}=10^{-1/«m»}=10^{-0.1}=«t1»$$

          **答え** $«ratio»$（約 2 割低下する）

          **間違えやすい点** 最小値の分布は区間の数とともに下側へずれる（寸法効果）。ずれ方は $n^{-1/m}$ で、形状母数 $m$ が大きい（ばらつきの小さい）材料ほど低下は小さい。
          $1/n$ や $1/\sqrt n$ で縮むのは平均や標準誤差の話で、最小値には当てはまらない。この近似はワイブル型の極値分布（最小値の極値分布）であり、正規分布の中心極限定理とは別の極限である。

  - id: s23p05
    title: 橋梁の加速度モニタリング
    context: |
      ある橋で、床版の振動を加速度計で常時観測している。車両が通らない時間帯の計測値の雑音 $\varepsilon_t$ は、互いに独立に同じ分布に従い、平均 0 である。
      ただし、ときどき近くの工事の影響で大きく揺れるため、各時刻の $\varepsilon_t$ は確率 «w» で $N(0,«v1»)$、確率 «w2» で $N(0,«v2»)$ に従う（正規分布の混合）。
    items:
      - id: s23p05a
        chapter: 3
        terms: [skewness-kurtosis, moments, normal-mixture-distribution]
        topic: ときどき大きな揺れが混じる加速度計の雑音（正規分布の尺度混合）の尖度を2次と4次のモーメントから求める
        level: 標準
        definition: false
        type: choice
        question: |
          雑音 $\varepsilon_t$ の尖度 $\beta_2=E[\varepsilon_t^4]/(E[\varepsilon_t^2])^2$（正規分布では 3 になる定義）に最も近いものはどれか。
        choices:
          - '$«ex»$'
          - '$3.00$'
          - '$«w_no3»$'
          - '$«kurt»$'
          - '$«w_var»$'
        answer: 3
        distractors:
          - 正規分布の値 3 を引いた超過尖度を答えた（問題の定義は引かない尖度）
          - 正規分布を混ぜても正規分布のままだと考えた
          - 正規分布の 4 次モーメントが 3σ⁴ であることを忘れ σ⁴ とした
          - 正解
          - 4 次モーメントを分散の 2 乗ではなく分散で割った
        explanation: |
          **方針** 混合分布のモーメントは、各成分のモーメントを混合比で重み付けた平均になる。$N(0,\sigma^2)$ の 2 次モーメントは $\sigma^2$、4 次モーメントは $3\sigma^4$。

          **途中式**
          $$E[\varepsilon^2]=«w»\times«v1»+«w2»\times«v2»=«m2»$$
          $$E[\varepsilon^4]=3\left(«w»\times«q1»+«w2»\times«q2»\right)=3\times«inner»=«m4»$$
          $$\beta_2=\frac{«m4»}{«m2»^2}=\frac{«m4»}{«m2sq»}=«kurt»$$

          **答え** $«kurt»$

          **間違えやすい点** 平均 0 の正規分布を分散を変えて混ぜると、裾が重い（尖度が 3 より大きい）分布になる。正規分布にはならない。
          超過尖度 $\beta_2-3=«ex»$ と取り違えないこと（問題文の定義を確認する）。4 次モーメントの係数 3 を落とすと $«w_no3»$ になる。

      - id: s23p05b
        chapter: 27
        terms: [ma-model, autocovariance-autocorrelation, correlogram]
        topic: 白色雑音に重み付き移動平均をかけた系列をMA(2)とみて1次から3次の自己相関を求めコレログラムの切断を読む
        level: 標準
        definition: false
        type: choice
        question: |
          表示用に、雑音を重み $(1,2,1)/4$ の移動平均でならした系列
          $$Y_t=\frac{\varepsilon_t+2\varepsilon_{t-1}+\varepsilon_{t-2}}{4}$$
          を作った。$Y_t$ の 1 次・2 次・3 次の自己相関係数 $(\rho_1,\rho_2,\rho_3)$ として正しいものはどれか。
        choices:
          - '$(«r1»,\ «ar2»,\ «ar3»)$'
          - '$(«r1»,\ «r2»,\ 0)$'
          - '$(«b1»,\ «b2»,\ 0)$'
          - '$(«h1»,\ «r2»,\ 0)$'
          - '$(«r1»,\ «r2»,\ «r2»)$'
        answer: 1
        distractors:
          - AR(1) のように ρ_k=ρ_1^k と幾何級数的に減ると考えた
          - 正解
          - 自己共分散を重みの 2 乗和ではなく重みの和の 2 乗（16）で割った
          - 1 次の自己共分散で、ずれた重みの積を 1 組（1×2）しか足さなかった
          - MA(2) でも 3 次の自己相関が残ると考えた
        explanation: |
          **方針** $Y_t$ は白色雑音の有限個の重み付き和なので MA(2) 過程。重み $a_0,a_1,a_2$ について、自己共分散は $\gamma_k=\sigma^2\sum_j a_ja_{j+k}$（$k>2$ では 0）。定数 $1/4$ や $\sigma^2=V[\varepsilon_t]$ は自己相関では約分される。

          **途中式** 重み $(1,2,1)$ で
          $$\gamma_0\propto1^2+2^2+1^2=«g0»,\quad\gamma_1\propto1\times2+2\times1=«g1»,\quad\gamma_2\propto1\times1=«g2»,\quad\gamma_3=0$$
          $$\rho_1=\frac{«g1»}{«g0»}=«r1»,\qquad\rho_2=\frac{«g2»}{«g0»}=«r2»,\qquad\rho_3=0$$

          **答え** $(«r1»,\ «r2»,\ 0)$

          **間違えやすい点** MA($q$) の自己相関は $q$ 次より先で 0 に切れる。AR のように徐々に減る形（$«ar2»$、$«ar3»$）にはならない。
          また、雑音が正規分布でなく裾の重い混合分布でも、自己相関は 2 次までのモーメントだけで決まるので結果は変わらない。分母は重みの 2 乗和 «g0» で、重みの和の 2 乗 16 ではない。

  - id: s23p06
    title: コンクリート供試体の圧縮強度
    context: |
      ある工事で、同じ配合のコンクリートから作った供試体 «n» 本の材齢 28 日の圧縮強度（単位：N/mm²）は次のとおりだった。

      | 供試体 | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|
      | 強度 | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» |

      標本平均は $\bar x=«mean»$、不偏分散の平方根は $s=«sd»$ である（どちらも小数第4位を四捨五入した値）。強度は正規分布に従うとみなす。
    items:
      - id: s23p06a
        chapter: 9
        terms: [confidence-interval, ci-mean-unknown-variance, t-distribution]
        topic: 同じ配合で次に作る1本の供試体の強度の95%予測区間の下限を標本平均と不偏分散からt分布で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          同じ配合で次に作る 1 本の供試体の強度について、両側 95% の予測区間の下限を求めよ。必要なら $t_{0.025}(5)=«t»$、$t_{0.05}(5)=«t1»$ を使え（$t_{\alpha}(\nu)$ は自由度 $\nu$ の $t$ 分布の上側 $100\alpha$% 点）。
        answer: «lo»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 新しい 1 本 $X_{\rm new}$ と標本平均 $\bar X$ は独立で、$X_{\rm new}-\bar X\sim N\left(0,\sigma^2(1+1/n)\right)$。$\sigma$ を $s$ で置き換えると自由度 $n-1$ の $t$ 分布に従う。

          **途中式**
          $$\frac{X_{\rm new}-\bar X}{s\sqrt{1+1/n}}\sim t(«n1»)$$
          より、予測区間は $\bar x\pm t_{0.025}(«n1»)\,s\sqrt{1+1/«n»}$。$\sqrt{1+1/«n»}=«fac»$ なので
          $$«t»\times«sd»\times«fac»=«half»,\qquad\text{下限}=«mean»-«half»=«lo4»$$

          **答え** $«lo»$

          **間違えやすい点** 母平均の信頼区間 $\bar x\pm t\,s/\sqrt n$ を使うと下限は $«lo_ci»$ となり、1 本の値がとりうる範囲としては狭すぎる。予測区間には個々の値のばらつき $\sigma^2$ と平均の推定誤差 $\sigma^2/n$ の両方が入る。
          両側 95% なので上側 2.5% 点を使う（片側の $t_{0.05}$ を使うと $«lo_t1»$）。正規分布の 1.96 を使うと $«lo_z»$ で、$s$ で推定した不確かさを無視することになる。

      - id: s23p06b
        chapter: 13
        terms: [wilcoxon-signed-rank-test, rank-and-ties, sign-test]
        topic: 設計基準強度を上回るかをウィルコクソンの符号付き順位検定の正確な片側p値を順位の部分集合の数え上げで求めて調べる
        level: 基本
        definition: false
        type: choice
        question: |
          正規性を仮定せずに、強度の分布の中央値が設計基準強度 30 N/mm² を上回るかを調べる。差 $d_i=x_i-30$ についてウィルコクソンの符号付き順位検定を行う（帰無仮説：差の分布は 0 について対称、対立仮説：中央値が 30 より大きい）。
          正の差の順位和 $W^+$ にもとづく**正確な**片側 $p$ 値に最も近いものはどれか。
        choices:
          - '$«p_eq»$'
          - '$«p»$'
          - '$«p_ge19»$'
          - '$«p_two»$'
          - '$«p_sign»$'
        answer: 1
        distractors:
          - P(W⁺≧20) ではなく P(W⁺=20) だけを数えた
          - 正解
          - 観測値より 1 小さい値以上 P(W⁺≧19) を数えた
          - 片側検定なのに 2 倍して両側 p 値にした
          - 順位を使わず符号検定（6 個中 5 個が正）の p 値を答えた
        explanation: |
          **方針** 帰無仮説のもとでは、各順位 $1,\ldots,«n»$ に正負の符号が独立に確率 1/2 でつく。$W^+$ は「正の符号がついた順位の和」なので、$\{1,\ldots,«n»\}$ の部分集合 $2^{«n»}=«tot»$ 通りが等確率。観測値以上の和をもつ部分集合を数える。

          **途中式** 差は $«d1»,\ «d2»,\ «d3»,\ «d4»,\ «d5»,\ «d6»$。絶対値の小さい順に順位をつけると、$|{-0.8}|$ が 1 位、以下 $1.4$ が 2 位、$2.8$ が 3 位、$3.1$ が 4 位、$4.6$ が 5 位、$5.3$ が 6 位。
          負の差は順位 1 だけなので $W^+=«nrank»-1=«wplus»$。
          順位の和が «wplus» 以上になる部分集合は、すべて $\{1,\ldots,6\}$（和 21）と $\{2,\ldots,6\}$（和 20）の «cnt» 通り。
          $$p=P(W^+\ge«wplus»)=\frac{«cnt»}{«tot»}=«p5»$$

          **答え** $«p»$

          **間違えやすい点** $p$ 値は「観測値**以上**」の確率なので $P(W^+=«wplus»)=1/64=«p_eq»$ だけでは足りない。片側の対立仮説なので 2 倍しない（両側なら $«p_two»$）。
          符号だけを使う符号検定では、正が «pos» 個以上の確率 $«sign_cnt»/64=«p_sign»$ となり、差の大きさの情報を使わないぶん $p$ 値が大きくなる。

  - id: s23p07
    title: アスファルト舗装の試験施工
    context: |
      新しい舗装材の試験施工で、3 つの因子 A：締固め温度（低・高）、B：転圧回数（少・多）、C：添加剤（無・有）の $2^3$ 要因実験を行う。
      8 通りの処理を、高水準の文字だけを書く記法 $(1),a,b,c,ab,ac,bc,abc$ で表す（例：$ac$ は A と C が高水準、B が低水準）。
      ただし 1 日に施工できる区画は 4 つまでで、施工日によって気温などの条件が変わるため、8 区画を 2 日に分けて施工する。
    items:
      - id: s23p07a
        chapter: 20
        terms: [confounding, factorial-design, main-effect-and-interaction]
        topic: 2の3乗要因実験を1日4区画ずつ2日に分けるとき3因子交互作用ABCを施工日と交絡させるブロックの組を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          主効果と 2 因子交互作用はすべて施工日の影響を受けずに推定できるようにし、施工日の効果と区別できなくなるのは 3 因子交互作用 ABC だけにしたい。
          $(1)$ と同じ日に施工する 4 区画の組として正しいものはどれか。
        choices:
          - '$(1),\ a,\ b,\ ab$'
          - '$(1),\ ab,\ c,\ abc$'
          - '$(1),\ a,\ bc,\ abc$'
          - '$(1),\ ab,\ ac,\ bc$'
          - '$(1),\ a,\ b,\ c$'
        answer: 3
        distractors:
          - C の低水準の 4 区画を同じ日にした。主効果 C が施工日と交絡する
          - 交互作用 AB の対比の符号が + の区画を集めた。AB が施工日と交絡する
          - 交互作用 BC の対比の符号が + の区画を集めた。BC が施工日と交絡する
          - 正解
          - 高水準が 1 つ以下の区画を集めた。どの効果の対比とも一致せず、主効果がすべて施工日の影響を受ける
        explanation: |
          **方針** 交互作用 ABC の対比は、処理記号の中に A, B, C の文字が**偶数個**（0 個か 2 個）ある処理を一方、奇数個ある処理を他方とする符号で決まる（$(a-1)(b-1)(c-1)$ を展開したときの符号）。この符号で 2 つに分けると、日の効果は ABC の対比にだけ入る。

          **途中式** 各処理の A, B, C の文字の個数は
          - 偶数個：$(1)$（0 個）、$ab$、$ac$、$bc$（2 個）
          - 奇数個：$a$、$b$、$c$（1 個）、$abc$（3 個）

          ABC の対比 $(abc+a+b+c)-((1)+ab+ac+bc)$ は、ちょうど「日 2 − 日 1」と同じ形になり、日の効果と区別できない。
          一方、例えば主効果 A の対比 $(a+ab+ac+abc)-((1)+b+c+bc)$ は、+ の側にも − の側にも各日の区画が 2 つずつ入るので、日の効果が打ち消される。ほかの主効果・2 因子交互作用も同じ。

          **答え** $(1),\ ab,\ ac,\ bc$

          **間違えやすい点** $(1),a,b,ab$ のように C の水準で分けると、最も知りたい主効果 C が施工日と交絡してしまう。$(1),ab,c,abc$ は AB の符号 $(a-1)(b-1)$ が + の処理で、AB が交絡する。
          交絡させる効果は、ふつう解釈上重要でないと考えられる高次の交互作用を選ぶ。

      - id: s23p07b
        chapter: 12
        terms: [binomial-test, p-value, binomial-distribution]
        topic: 試験施工の手直し区画数が許容率5%を超えるかを二項検定の正確な片側p値で調べる
        level: 基本
        definition: false
        type: numeric
        question: |
          発注者の基準では、平坦性の不足で手直しが必要になる区画の割合（手直し率）は 5% 以下とされている。この舗装材で施工した «n» 区画（各区画は独立とみなす）のうち、«x» 区画で手直しが必要だった。
          帰無仮説 $H_0:p=«p0»$、対立仮説 $H_1:p>«p0»$ の二項検定の**正確な**片側 $p$ 値を求めよ。必要なら $0.95^{20}=«q20»$、$0.95^{19}=«q19»$、$0.95^{18}=«q18»$ を使え。
        answer: «pv»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 手直し区画数 $X$ は $H_0$ のもとで二項分布 $B(«n»,«p0»)$ に従う。$p$ 値は観測値以上になる確率 $P(X\ge«x»)=1-P(X\le2)$。

          **途中式**
          $$P(X=0)=0.95^{20}=«P0»$$
          $$P(X=1)=«n»\times«p0»\times0.95^{19}=«np0»\times«q19»=«P1»$$
          $$P(X=2)=\binom{«n»}{2}«p0»^2\times0.95^{18}=«c2»\times«p02»\times«q18»=«P2»$$
          $$p=1-(«P0»+«P1»+«P2»)=1-«sumP»=«pv5»$$

          **答え** $«pv»$（有意水準 5% では $H_0$ を棄却できない）

          **間違えやすい点** $P(X\le2)=«w_le2»$ を $p$ 値と取り違えない。$p$ 値は「観測値**以上**」で、$P(X>3)$ のように観測値 «x» を含めないのも誤り。
          観測された手直し率 $«x»/«n»=0.15$ は 5% の 3 倍だが、区画数が少ないので偶然でも起こりうる範囲にある。

  - id: s23p08
    title: 落石の発生間隔
    context: |
      ある山間部の道路では、落石の発生間隔（単位：日）が平均 $\theta$ の指数分布（密度 $\frac1\theta e^{-x/\theta}$、$x>0$）に互いに独立に従うとみなしている。過去の記録では $\theta=«th0»$ だった。
      斜面の工事のあと、落石が増えたかを調べるため、連続する «n» 回の発生間隔 $X_1,\ldots,X_{«n»}$ を記録し、合計 $T=\sum X_i$ を用いて検定する。
    items:
      - id: s23p08a
        chapter: 10
        terms: [uniformly-most-powerful-test, monotone-likelihood-ratio, power-function, chi-squared-distribution]
        topic: 落石の発生間隔（指数分布）の平均が短くなったかを合計にもとづく一様最強力検定で調べ対立仮説のもとでの検出力をカイ二乗分布から求める
        level: 応用
        definition: false
        type: choice
        question: |
          $H_0:\theta=«th0»$ 対 $H_1:\theta<«th0»$ の有意水準 5% の一様最強力検定を考える。真の平均間隔が $\theta=«th1»$ のときの検出力に最も近いものはどれか。
          必要なら、$2T/\theta$ が自由度 $2n$ のカイ二乗分布に従うことと、次の値を使え（$\chi^2_\nu$ は自由度 $\nu$ のカイ二乗分布に従う確率変数）。

          | 値 | 内容 |
          |---|---|
          | $«q05»$ | $\chi^2_{10}$ の下側 5% 点 |
          | $«q05_5»$ | $\chi^2_{5}$ の下側 5% 点 |
          | $«F788»$ | $P(\chi^2_{10}\le«x»)$ |
          | $«F197»$ | $P(\chi^2_{10}\le«x197»)$ |
          | $«F5»$ | $P(\chi^2_{5}\le«x229»)$ |
        choices:
          - '$«alpha»$'
          - '$«w_inv»$'
          - '$«ans»$'
          - '$«w_comp»$'
          - '$«w_df»$'
        answer: 2
        distractors:
          - 検出力と有意水準を取り違えた
          - 対立仮説のもとでの換算で θ0 と θ1 の比を逆にした（2c/θ0 × θ1/θ0）
          - 正解
          - 受容する確率（第2種の誤りの確率）を答えた
          - カイ二乗分布の自由度を 2n ではなく n とした
        explanation: |
          **方針** 尤度 $L(\theta)=\theta^{-n}e^{-T/\theta}$ について、$\theta_1<\theta_0$ のとき尤度比 $L(\theta_1)/L(\theta_0)$ は $T$ の減少関数（単調尤度比）。ネイマン・ピアソンの補題から「$T\le c$ で棄却」が最強力で、$c$ は $\theta_1$ によらないので一様最強力になる。

          **途中式** $H_0$ のもとで $2T/«th0»\sim\chi^2_{«df»}$。$P(T\le c)=0.05$ より
          $$\frac{2c}{«th0»}=«q05»\ \Rightarrow\ c=\frac{«th0»\times«q05»}{2}=«c»$$
          $\theta=«th1»$ のときは $2T/«th1»\sim\chi^2_{«df»}$ なので
          $$\text{検出力}=P(T\le«c»\mid\theta=«th1»)=P\left(\chi^2_{«df»}\le\frac{2\times«c»}{«th1»}\right)=P(\chi^2_{«df»}\le«x»)=«F788»$$

          **答え** $«ans»$

          **間違えやすい点** 発生間隔が**短く**なる（$\theta$ が小さい）ほど $T$ は小さくなるので、棄却域は下側にとる。自由度は $2n=«df»$（指数分布 1 個の $2X/\theta$ が $\chi^2_2$）。自由度を $n$ にすると $c=«c5»$、検出力 $«w_df»$ と誤る。
          検出力は棄却する確率で、$1-«F788»=«w_comp»$ は見逃す確率（第 2 種の誤りの確率）。«n» 回の観測では、平均が半分になっても検出できる確率は 4 割に満たない。

  - id: s23p09
    title: 舗装の健全度の推移
    context: |
      ある道路管理者は、舗装の区間を毎年の点検で 3 つの健全度（1：良好、2：注意、3：要補修）に分類している。
      要補修になった区間は補修工事の予定に入り、工事が済むと翌年は良好に戻るが、予算の都合で翌年も要補修のまま残ることもある。年ごとの推移は次の推移確率行列のマルコフ連鎖に従うとする（行が今年、列が翌年の状態）。
