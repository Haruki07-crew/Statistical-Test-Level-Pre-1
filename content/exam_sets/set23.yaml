  - id: s23p07
    title: アスファルト舗装の試験施工
    context: |
      4 種類のアスファルト混合物 1〜4 を、3 つの施工日（ブロック）それぞれで 1 区画ずつ施工する乱塊法で、わだち掘れの抵抗性の指標（大きいほどよい）を測った。混合物 2 の 3 日目の区画は施工不良で欠測した。

      | | 1 日目 | 2 日目 | 3 日目 |
      |---|---|---|---|
      | 混合物 1 | «y11» | «y12» | «y13» |
      | 混合物 2 | «y21» | «y22» | 欠測 |
      | 混合物 3 | «y31» | «y32» | «y33» |
      | 混合物 4 | «y41» | «y42» | «y43» |
    items:
      - id: s23p07a
        chapter: 20
        terms: [randomized-block-design, two-way-anova-without-replication, sum-of-squares-decomposition]
        topic: 乱塊法で1区画が欠測したときに誤差平方和を最小にする値（イェーツの欠測値の推定式）で欠測値を推定する
        level: 応用
        definition: false
        type: numeric
        question: |
          欠測した区画の値を、その値を入れたときの誤差平方和（処理とブロックの効果を除いた残差の平方和）が最小になるように推定する。推定値を求めよ。
          処理の数を $a=4$、ブロックの数を $b=3$ とし、欠測値を除いた混合物 2 の合計を $T$、3 日目の合計を $B$、全体の合計を $G$ とすると、推定値は $\hat x=\dfrac{aT+bB-G}{(a-1)(b-1)}$ で与えられる。
        answer: «xh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 誤差平方和を欠測値 $x$ の 2 次式とみて微分し 0 とおくと、与えられた式（イェーツの式）が得られる。処理（混合物）の数 $a$ とブロック（施工日）の数 $b$ の役割を取り違えないようにする。

          **途中式** 欠測値を除いた合計は、混合物 2 が $T=«T»$、3 日目が $B=«B»$、全体が $G=«G»$。
          $$\hat x=\frac{4\times«T»+3\times«B»-«G»}{3\times2}=\frac{«num»}{6}=«xh4»$$

          **答え** $«xh_s»$

          **間違えやすい点** $a$ と $b$ を入れ替えて $\dfrac{3T+4B-G}{6}$ とすると «w_swap» になる。混合物 2 の残り 2 区画の平均 «w_row» だけで埋めると、3 日目が全体に低め（ブロック効果）であることを無視してしまう。
          推定値を入れて分散分析を行うときは、誤差の自由度を 1 減らす（$(a-1)(b-1)-1=5$）。推定値はデータではないので、自由度を減らさないと誤差分散を過小に見積もる。

      - id: s23p07b
        chapter: 12
        terms: [goodness-of-fit-test, degrees-of-freedom-gof, pearson-chi-square-statistic]
        topic: 舗装厚の100か所の度数分布に平均と分散を推定した正規分布を当てはめた適合度検定で推定した母数の分だけ自由度を減らして判定する
        level: 標準
        definition: false
        type: choice
        question: |
          試験施工区間の 100 か所で舗装の厚さを測り、5 つの階級に分けた。データから平均と分散を推定した正規分布を当てはめて求めた期待度数は次のとおり。

          | 階級 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | 観測度数 | «o1» | «o2» | «o3» | «o4» | «o5» |
          | 期待度数 | «e1» | «e2» | «e3» | «e4» | «e5» |

          ピアソンのカイ二乗統計量による適合度検定（有意水準 5%）の結論として正しいものはどれか。カイ二乗分布の上側 5% 点は自由度 2 で 5.991、3 で 7.815、4 で 9.488 とする。
        choices:
          - '統計量は «X»、自由度 2 の 5.991 を上回るので、正規分布に従うという帰無仮説を棄却する'
          - '統計量は «X»、自由度 4 の 9.488 を下回るので、正規分布に従うという帰無仮説は棄却されない'
          - '統計量は «X»、自由度 3 の 7.815 を下回るので、正規分布に従うという帰無仮説は棄却されない'
          - '統計量は «w_abs» で、自由度 2 の 5.991 を上回るので棄却する'
          - '統計量は «X»、自由度 2 の 5.991 を上回るので、厚さは正規分布に従わないことが証明された（どの分布に従うかもわかる）'
        answer: 0
        distractors:
          - 正解
          - 推定した母数（平均と分散）の分を自由度から引かなかった
          - 推定した母数を 1 つしか引かなかった
          - (O−E)²/E ではなく |O−E| の和を使った
          - 棄却は「正規分布でない」ことを示すだけで、どの分布に従うかはわからない
        explanation: |
          **方針** $X^2=\sum(O-E)^2/E$。自由度は（階級の数）$-1-$（データから推定した母数の数）。

          **途中式**
          $$X^2=«terms»=«X4»$$
          自由度は $5-1-2=2$ で、5.991 を上回るので棄却する。

          **答え** 統計量 «X»、自由度 2 で、帰無仮説を棄却する

          **間違えやすい点** 平均と分散をデータから推定すると、期待度数が観測度数に近づくように合わせたことになるので、その分だけ自由度を減らす。減らさない（自由度 4）か 1 つしか減らさない（自由度 3）と、結論が逆になる。
          ここでは階級 1 の観測度数が期待度数よりかなり少ないこと（左の裾が短い）が、統計量の大部分を占めている。

  - id: s23p08
    title: 落石の発生間隔と検定の性質
    context: |
      ある山間部の道路で、落石の発生間隔などのデータにもとづいて警戒の基準を見直すことにした。検定の方法を選ぶため、いくつかの分布族の性質を確認する。
    items:
      - id: s23p08a
        chapter: 10
        terms: [monotone-likelihood-ratio, uniformly-most-powerful-test, exponential-family]
        topic: いくつかの分布族について単調尤度比をもつかを判定し片側の一様最強力検定が存在しないものを選ぶ
        level: 基本
        definition: true
        type: choice
        question: |
          独立な標本 $X_1,\ldots,X_n$ にもとづく片側検定 $H_0:\theta\le\theta_0$ 対 $H_1:\theta>\theta_0$ を考える。次の分布族のうち、統計量 $T$ について単調尤度比をもたず、
          この形の片側検定の一様最強力検定が（一般の $n$ で）存在するとはいえないものはどれか。
        choices:
          - 平均 $\theta$ の指数分布（$T=\sum X_i$）
          - 成功確率 $\theta$ の二項分布 $B(1,\theta)$（$T=\sum X_i$）
          - 区間 $(0,\theta)$ の一様分布（$T=\max X_i$）
          - 位置母数 $\theta$ のコーシー分布 $f(x)=\dfrac{1}{\pi\{1+(x-\theta)^2\}}$
          - 分散が既知の正規分布 $N(\theta,\sigma^2)$（$T=\sum X_i$）
        answer: 3
        distractors:
          - 指数型分布族で、尤度比は ΣX_i の単調増加関数
          - 指数型分布族で、尤度比は ΣX_i の単調増加関数
          - θ1>θ0 なら尤度比は max X_i の非減少関数（max X_i>θ0 では無限大）
          - 正解
          - 指数型分布族で、尤度比は ΣX_i の単調増加関数
        explanation: |
          **方針** $\theta_1>\theta_0$ のとき尤度比 $L(\theta_1)/L(\theta_0)$ がある統計量 $T$ の単調関数になれば（単調尤度比）、カーリン・ルビンの定理により「$T$ が大きいとき棄却」が一様最強力検定になる。1 母数の指数型分布族 $f(x;\theta)=h(x)\exp\{c(\theta)T(x)-d(\theta)\}$ は、$c(\theta)$ が単調なら単調尤度比をもつ。

          **途中式**
          - 指数分布・二項分布・分散既知の正規分布は指数型分布族で、$c(\theta)$ が単調なので $\sum X_i$ について単調尤度比をもつ。
          - 一様分布 $(0,\theta)$ は指数型ではないが、尤度比 $(\theta_0/\theta_1)^n\cdot\dfrac{I(\max X_i<\theta_1)}{I(\max X_i<\theta_0)}$ は $\max X_i$ の非減少関数。
          - コーシー分布では、$n=1$ でも尤度比 $\dfrac{1+(x-\theta_0)^2}{1+(x-\theta_1)^2}$ は $x\to\pm\infty$ で 1 に戻り、$x$ の単調関数ではない。

          **答え** コーシー分布

          **間違えやすい点** 「指数型分布族でない＝単調尤度比をもたない」ではない（一様分布）。単調尤度比は片側検定についての性質で、両側検定 $H_1:\theta\ne\theta_0$ では、正規分布でも一様最強力検定は存在しない。

