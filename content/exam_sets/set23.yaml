      良好から要補修への直接の推移は、地震や豪雨による急な損傷を表す。
    items:
      - id: s23p09a
        chapter: 14
        terms: [first-passage-time, n-step-transition-probability, transition-probability-matrix]
        topic: 舗装の健全度3区分のマルコフ連鎖で今年良好な区間が3年後に初めて要補修になる確率（初到達確率）をn段階推移確率と区別して求める
        level: 標準
        definition: false
        type: choice
        question: |
          今年良好と判定された区間が、**3 年後に初めて**要補修になる（1 年後・2 年後は要補修ではない）確率に最も近いものはどれか。
        choices:
          - '$«P3»$'
          - '$«only123»$'
          - '$«f3»$'
          - '$«cum»$'
          - '$«f2»$'
        answer: 2
        distractors:
          - 3 段階推移確率 P³ の (1,3) 成分を答えた（途中で要補修になった経路を含む）
          - 状態 1 にとどまってから急な損傷で要補修になる経路 1→1→1→3 を数え忘れた
          - 正解
          - 3 年後までに少なくとも 1 回要補修になる確率を答えた
          - 2 年後に初めて要補修になる確率を答えた
        explanation: |
          **方針** 初到達確率は、途中で状態 3 を通らない経路だけを足し合わせる。状態 3 を通らないので、途中の状態は 1 か 2 に限られる。

          **途中式** 1 年後・2 年後の状態を $(i,j)$（$i,j\in\{1,2\}$）として、経路 $1\to i\to j\to3$ の確率を並べる。
          - $1\to1\to1\to3$：$«p11»\times«p11»\times«p13»=«a113»$
          - $1\to1\to2\to3$：$«p11»\times«p12»\times«p23»=«a123»$
          - $1\to2\to2\to3$：$«p12»\times«p22»\times«p23»=«a223»$
          - $1\to2\to1\to3$：状態 2 から 1 へは移らないので 0

          合計は $«a113»+«a123»+«a223»=«f3»$。

          **答え** $«f3»$

          **間違えやすい点** $P^3$ の $(1,3)$ 成分 $«P3»$ は「3 年後に要補修である」確率で、1 年後や 2 年後にいったん要補修になった経路（例：$1\to3\to3\to3$）も含む（差は $«extra»$）。
          「初めて」を問われたら、途中で目標の状態を通る経路を除く。1 年後に初めて（$«f1»$）、2 年後に初めて（$«f2»$）、3 年後に初めて（$«f3»$）を足した $«cum»$ が「3 年後までに要補修になる」確率である。

  - id: s23p10
    title: 橋梁の劣化度の予測
    context: |
      ある自治体が管理する鋼橋 «n» 橋について、点検で得た劣化度スコア $y$ を供用年数 $x$（年）に単回帰した。最小二乗法による当てはめの結果は次のとおり。

      - $\bar x=«xbar»$、$S_{xx}=\sum(x_i-\bar x)^2=«sxx»$
      - 残差の不偏分散 $s^2=«s2»$（残差の自由度 «df»）

      誤差は独立に正規分布 $N(0,\sigma^2)$ に従うとする。
    items:
      - id: s23p10a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, least-squares-method]
        topic: 供用年数が40年の橋全体の平均劣化度の95%信頼区間の半幅を求め1橋の予測区間と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          供用年数がちょうど «x0» 年の橋**全体の平均**劣化度 $E[y\mid x=«x0»]$ の 95% 信頼区間の半幅（$\hat y$ から区間の端までの長さ）に最も近いものはどれか。
          必要なら $t_{0.025}(10)=«t10»$、$t_{0.025}(11)=«t11»$、$t_{0.05}(10)=«t05»$ を使え。
        choices:
          - '$«w_non»$'
          - '$«hw»$'
          - '$«pw»$'
          - '$«w_t11»$'
          - '$«w_t05»$'
        answer: 1
        distractors:
          - 平均値の推定誤差の項 1/n を落とした
          - 正解
          - 1 橋の値の予測区間の半幅を答えた（平均の信頼区間ではない）
          - 自由度を n-2 ではなく n-1 とした
          - 両側 95% なのに上側 5% 点を使った
        explanation: |
          **方針** $x_0$ での当てはめ値 $\hat y_0=\hat\beta_0+\hat\beta_1x_0$ の分散は $\sigma^2\left\{\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}\right\}$。$\sigma^2$ を $s^2$ で置き換え、自由度 $n-2$ の $t$ 分布を使う。

          **途中式**
          $$\frac1n+\frac{(x_0-\bar x)^2}{S_{xx}}=\frac1{«n»}+\frac{«dx2»}{«sxx»}=«inv_n»+«lev»=«a»$$
          $$\text{半幅}=t_{0.025}(«df»)\times s\times\sqrt{«a»}=«t10»\times«sd»\times«ra»=«hw4»$$

          **答え** $«hw»$

          **間違えやすい点** 1 橋の劣化度を予測する予測区間は、誤差 $\sigma^2$ のぶんが加わり $\sqrt{1+«a»}$ を使うので半幅 $«pw»$ と広くなる。「全体の平均」か「1 橋の値」かで使い分ける。
          単回帰では推定する母数が 2 つなので、残差の自由度は $n-2=«df»$（$t_{0.025}(11)$ を使うと $«w_t11»$）。

      - id: s23p10b
        chapter: 17
        terms: [cooks-distance, leverage, outlier-and-influential-point]
        topic: 残差とてこ比の組み合わせが異なる3つの観測のクックの距離を比べ回帰への影響が最も大きい橋を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          この回帰で、次の 3 つの橋の残差 $e_i$ とてこ比 $h_{ii}$ が目立った。

          | 橋 | A | B | C |
          |---|---|---|---|
          | 残差 $e_i$ | «eA» | «eB» | «eC» |
          | てこ比 $h_{ii}$ | «hA» | «hB» | «hC» |

          クックの距離 $D_i=\dfrac{r_i^2}{p}\cdot\dfrac{h_{ii}}{1-h_{ii}}$（$r_i=\dfrac{e_i}{s\sqrt{1-h_{ii}}}$ は標準化残差、$p$ は回帰係数の個数で切片を含めて $p=«pp»$）が最も大きい橋と、その値の組として正しいものはどれか。
        choices:
          - '橋 A、$D=«DA»$'
          - '橋 A、$D=«nohA»$'
          - '橋 C、$D=«DC»$'
          - '橋 B、$D=«DwB»$'
          - '橋 B、$D=«DB»$'
        answer: 4
        distractors:
          - 残差の大きい橋 A が最も影響が大きいと考えた（A の値自体は正しい）
          - てこ比の因子 h/(1-h) を落とし、残差の大きさだけで比べた
          - C の値は正しいが最大ではない
          - 分母の (1-h) を 2 乗し忘れた
          - 正解
        explanation: |
          **方針** 代入して整理すると $D_i=\dfrac{e_i^2\,h_{ii}}{p\,s^2(1-h_{ii})^2}$。残差が大きいだけでなく、てこ比が大きい（$x$ が端にある）観測ほど影響が大きくなる。

          **途中式** $p\,s^2=«pp»\times«s2»=«ps2»$。
          - 橋 A：$\dfrac{«eA»^2\times«hA»}{«ps2»\times«omA»^2}=\dfrac{«numA»}{«denA»}=«DA»$
          - 橋 B：$\dfrac{«eB»^2\times«hB»}{«ps2»\times«omB»^2}=\dfrac{«numB»}{«denB»}=«DB»$
          - 橋 C：$\dfrac{«eC»^2\times«hC»}{«ps2»\times«omC»^2}=\dfrac{«numC»}{«denC»}=«DC»$

          **答え** 橋 B、$D=«DB»$

          **間違えやすい点** 残差が最も大きいのは A だが、てこ比が小さい（$x$ が平均に近い）ので、取り除いても回帰直線はあまり動かない。
          B は残差が小さく見えるが、てこ比が大きい点は直線を自分の方へ引き寄せるため、残差が小さく出やすい。標準化残差の 2 乗は $r_B^2=«r2B»$ で、さらに $h/(1-h)$ が大きい。
          $(1-h)$ を 2 乗し忘れると B は $«DwB»$ になる。

      - id: s23p10c
        chapter: 19
        terms: [neural-network-model, overfitting]
        topic: 入力5個・中間層8ユニット・出力1個の全結合ニューラルネットワークで推定する重みとバイアスの総数を数える
        level: 基本
        definition: false
        type: choice
        question: |
          比較のため、供用年数・交通量・塩分飛来量・塗装経過年数・床版厚の «kin» 個の入力から劣化度を予測する、中間層 1 層（ユニット «kh» 個）・出力 1 個の全結合ニューラルネットワークを考える。
          中間層と出力層の各ユニットはバイアス（定数項）をもつ。推定するパラメータ（重みとバイアス）の総数はいくつか。
        choices:
          - '$«nn_nob»$'
          - '$«nn_ob»$'
          - '$«nn»$'
          - '$«nn_nob2»$'
          - '$«nn_first»$'
        answer: 2
        distractors:
          - バイアスをすべて数え忘れた
          - 中間層のバイアスを数え忘れた
          - 正解
          - 出力層のバイアスを数え忘れた
          - 入力層から中間層への重みだけを数えた
        explanation: |
          **方針** 全結合なので、層の間の重みは（前の層のユニット数）×（次の層のユニット数）。これに各ユニットのバイアスを 1 つずつ足す。

          **途中式**
          - 入力 → 中間層：重み $«kin»\times«kh»=«w1»$、バイアス «b1»
          - 中間層 → 出力：重み $«kh»\times1=«w2»$、バイアス «b2»

          合計 $«w1»+«b1»+«w2»+«b2»=«nn»$。

          **答え** $«nn»$

          **間違えやすい点** バイアスは入力層ではなく、値を計算する中間層と出力層のユニットに付く。
          パラメータ数 «nn» は橋の数 «n» を大きく上回るので、このまま学習させると過学習しやすい。正則化や交差検証で汎化誤差を確かめる必要がある。

  - id: s23p11
    title: 鋼橋の塗装の耐久性と補修費用
    context: |
      ある道路管理者は、鋼橋の塗装仕様 A（従来の仕様）と B（新しい重防食仕様）の耐久性を比べるため、各 4 橋について、塗装してから塗り替えが必要と判定されるまでの年数を追跡した。
      $+$ は、その年数の時点で塗り替えが必要になる前に観察が打ち切られた（橋の架け替えなど）ことを表す。

      | 仕様 | 年数 |
      |---|---|
      | A | 5、7、9+、11 |
      | B | 8、10+、12、14+ |
    items:
      - id: s23p11a
        chapter: 29
        terms: [log-rank-test, censored-data, kaplan-meier-estimator]
        topic: 打ち切りを含む2つの塗装仕様の塗り替えまでの年数をログランク検定で比べ各時点の期待件数と分散から統計量を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          2 つの仕様で塗り替えまでの年数の分布が等しいという帰無仮説のログランク検定を行う。仕様 A の観測件数を $O_A$、各時点の期待件数の和を $E_A$、超幾何分布の分散の和を $V$ として、統計量 $\chi^2=(O_A-E_A)^2/V$ の値を求めよ。
        answer: «chi»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 塗り替え（イベント）が起きた各時点で、その直前にまだ観察中の橋（リスク集合）を A、B で数え、2×2 表の周辺を固定したときの A のイベント数の期待値 $e=n_A d/n$ と分散 $v=\dfrac{n_An_Bd(n-d)}{n^2(n-1)}$ を求めて足し合わせる。打ち切られた橋は、その時点より後のリスク集合から外す。

          **途中式**

          | 時点 | $n_A$ | $n_B$ | A のイベント | B のイベント | $e$ | $v$ |
          |---|---|---|---|---|---|---|
          | «t0» | «na0» | «nb0» | «da0» | «db0» | «e0» | «v0» |
          | «t1» | «na1» | «nb1» | «da1» | «db1» | «e1» | «v1» |
          | «t2» | «na2» | «nb2» | «da2» | «db2» | «e2» | «v2» |
          | «t3» | «na3» | «nb3» | «da3» | «db3» | «e3» | «v3» |
          | «t4» | «na4» | «nb4» | «da4» | «db4» | «e4» | «v4» |

          年数 11 の時点では、A の 9+ と B の 10+ はすでに打ち切られているので、リスク集合は A が 1 橋、B が 2 橋。
          $$O_A=«O»,\quad E_A=«E»,\quad O_A-E_A=«OE»,\quad V=«V»$$
          $$\chi^2=\frac{«OE»^2}{«V»}=\frac{«OE2»}{«V»}=«chi4»$$

          **答え** $«chi»$（自由度 1 のカイ二乗分布の上側 5% 点 3.841 より小さく、有意水準 5% では差があるとはいえない）

          **間違えやすい点** 打ち切られた橋を、打ち切り時点より後もリスク集合に数えたり、イベントとして数えたりしない。
          分散の代わりに期待件数で割る $(O_A-E_A)^2/E_A=«chi_E»$ や、両群の $(O-E)^2/E$ を足す近似 $«chi_pear»$ は、ここでの統計量と異なる。

      - id: s23p11b
        chapter: 18
        terms: [generalized-linear-model, exponential-dispersion-family, link-function]
        topic: 補修費用のガンマ回帰（対数リンク）で係数から平均費用を求め分散関数と分散母数から標準偏差を求める
        level: 標準
        definition: false
        type: choice
        question: |
          塗り替え 1 回あたりの費用 $Y$（百万円）を、ガンマ分布・対数リンクの一般化線形モデル
          $$\ln E[Y]=\beta_0+\beta_1x_1+\beta_2x_2$$
          で分析した（$x_1$：海岸から 1 km 以内なら 1、それ以外は 0、$x_2$：橋長を 10 m 単位で表した値）。推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$、分散母数（散らばりの母数）は $\hat\phi=«phi»$ だった。
          海岸から 1 km 以内にある橋長 40 m（$x_2=«x2»$）の橋の費用の平均と標準偏差の組に最も近いものはどれか。必要なら $e^{«eta»}=«e_eta»$、$e^{«eta_no»}=«e_no»$ を使え。
        choices:
          - '平均 $«mu»$、標準偏差 $«w_phi»$'
          - '平均 $«mu»$、標準偏差 $«sdY»$'
          - '平均 $«mu»$、標準偏差 $«w_pois»$'
          - '平均 $«mu_no»$、標準偏差 $«sd_no»$'
          - '平均 $«mu»$、標準偏差 $«w_sqrt»$'
        answer: 1
        distractors:
          - 分散 φμ² の平方根ではなく φμ を標準偏差とした
          - 正解
          - 分散関数をポアソン分布の V(μ)=μ として分散を φμ とした
          - 海岸ダミーの係数 β1 を足し忘れた
          - 分散母数を無視し、ポアソン分布のように標準偏差を √μ とした
        explanation: |
          **方針** 対数リンクなので平均は $\mu=\exp(\text{線形予測子})$。ガンマ分布の GLM では分散関数が $V(\mu)=\mu^2$ で、$V[Y]=\phi\mu^2$（変動係数が $\sqrt\phi$ で一定）。

          **途中式**
          $$\hat\eta=«b0»+«b1»\times1+«b2»\times«x2»=«eta»,\qquad\hat\mu=e^{«eta»}=«e_eta»$$
          $$V[Y]=\hat\phi\hat\mu^2=«phi»\times«mu2»=«varY»,\qquad\text{標準偏差}=\sqrt{«phi»}\times«e_eta»=«rphi»\times«e_eta»=«sdY»$$

          **答え** 平均 $«mu»$、標準偏差 $«sdY»$

          **間違えやすい点** 分散母数 $\phi$ を分散そのものと取り違えない。ガンマ分布では分散が平均の 2 乗に比例するので、費用の大きい橋ほど費用のばらつきも大きい。
          対数リンクでは係数が倍率として効く：海岸部は $e^{«b1»}\approx«eb1»$ 倍。$\beta_1$ を足し忘れると平均 $«mu_no»$ になる。

  - id: s23p12
    title: 橋梁点検の標本調査
    context: |
      ある県が管理する小規模な橋 1000 橋を、所在地で 3 つの層に分け、詳細点検する橋を層ごとに単純無作為抽出で選ぶ。層ごとの橋の数 $N_h$、損傷度スコアの標準偏差の見込み $S_h$、1 橋あたりの点検費用 $c_h$（万円）は次のとおり。

      | 層 | 都市部 | 郊外 | 山間部 |
      |---|---|---|---|
      | $N_h$ | «N1» | «N2» | «N3» |
      | $S_h$ | «S1» | «S2» | «S3» |
      | $c_h$ | «c1» | «c2» | «c3» |
    items:
      - id: s23p12a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation]
        topic: 層ごとに点検費用が違うとき費用を考慮した最適配分で山間部の点検数を決める
        level: 標準
        definition: false
        type: numeric
        question: |
          全体で «n» 橋を点検する。層別抽出の推定量の分散を、費用 $\sum_h c_hn_h$ を一定としたもとで最小にする配分（費用を考慮した最適配分）で全体の標本数を «n» としたとき、山間部に割り当てる橋の数を求めよ。
        answer: «nh»
        tolerance: 0.4
        answer_format: 四捨五入して整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 費用を考慮した最適配分では $n_h\propto\dfrac{N_hS_h}{\sqrt{c_h}}$。費用が高い層は少なめに、ばらつきが大きい層は多めに割り当てる。

          **途中式**
          $$\frac{N_hS_h}{\sqrt{c_h}}:\ \frac{«N1»\times«S1»}{«rc1»}=«w1»,\quad\frac{«N2»\times«S2»}{«rc2»}=«w2»,\quad\frac{«N3»\times«S3»}{«rc3»}=«w3»\quad(\text{合計 }«wsum»)$$
          $$n_{\text{山間部}}=«n»\times\frac{«w3»}{«wsum»}=«nh_raw»\ \to\ «nh»$$

          **答え** $«nh»$

          **間違えやすい点** 費用を無視したネイマン配分（$n_h\propto N_hS_h$）では $«n»\times«ney3»/«neysum»=«ney_raw»$ で «ney»、比例配分なら «prop» になる。
          費用は平方根で効く。$\sqrt{c_h}$ ではなく $c_h$ で割ると $«wc_raw»$ で «wc» となり、費用の影響を大きく見積もる。

      - id: s23p12b
        chapter: 31
        terms: [jeffreys-prior, noninformative-prior, posterior-mean-map, fisher-information]
        topic: 二項モデルのジェフリーズ事前分布をフィッシャー情報量から求め山間部の重大損傷率の事後平均を計算する
        level: 基本
        definition: false
        type: choice
        question: |
          (a) の配分で山間部の «m» 橋を点検したところ、«y» 橋に重大な損傷があった。山間部の重大損傷率 $p$ について、各橋の損傷の有無を独立なベルヌーイ試行とみなし、事前分布にジェフリーズの事前分布（フィッシャー情報量 $I(p)$ の平方根に比例する密度）を用いる。
          $p$ の事後平均に最も近いものはどれか。
        choices:
          - '$«mle»$'
          - '$«mode»$'
          - '$«unif»$'
          - '$«w15»$'
          - '$«post»$'
        answer: 4
        distractors:
          - 事前分布を使わず最尤推定値 y/n を答えた
          - 事後分布の平均ではなく最頻値（モード）を答えた
          - 一様事前分布 Beta(1,1) を使った
          - 事前密度を √I(p) ではなく 1/√I(p) ∝ √(p(1-p)) とした（Beta(1.5,1.5)）
          - 正解
        explanation: |
          **方針** 1 回のベルヌーイ試行のフィッシャー情報量は $I(p)=\dfrac{1}{p(1-p)}$。ジェフリーズ事前分布は $\pi(p)\propto\sqrt{I(p)}=p^{-1/2}(1-p)^{-1/2}$、すなわちベータ分布 $\text{Beta}(1/2,1/2)$。二項尤度と共役なので事後分布もベータ分布になる。

          **途中式** 事後密度は
          $$\pi(p\mid y)\propto p^{«y»}(1-p)^{«my»}\cdot p^{-1/2}(1-p)^{-1/2}=p^{«a»-1}(1-p)^{«b»-1}$$
          なので事後分布は $\text{Beta}(«a»,«b»)$。事後平均は
          $$\frac{«a»}{«a»+«b»}=\frac{«a»}{«ab»}=«post4»$$

          **答え** $«post»$

          **間違えやすい点** 一様事前分布 $\text{Beta}(1,1)$ なら $(y+1)/(n+2)=«unif»$。ジェフリーズ事前分布は「$y$ と $n-y$ に 0.5 ずつ足す」形になる。
          事後分布の最頻値 $(«a»-1)/(«ab»-2)=«mode»$ や最尤推定値 $«y»/«m»=«mle»$ とは区別する。

  - id: s23p13
    title: トンネル覆工の打音検査
    context: |
      トンネルの覆工コンクリートの点検で、ハンマーでたたいた音を録音し、音の主な周波数 $X$（kHz）から、その箇所が健全か「浮き」（コンクリートがはがれかけた状態）かを判別したい。
      過去の点検データから、健全な箇所では $X\sim N(«mu1»,«s1»^2)$、浮きのある箇所では $X\sim N(«mu2»,«s2»^2)$ とみなせる。
    items:
      - id: s23p13a
        chapter: 23
        terms: [quadratic-discriminant-analysis, bayes-discriminant-rule, linear-discriminant-analysis]
        topic: 分散の異なる2群の1次元正規モデルで2次判別の境界を求め健全と判定される周波数の区間を求める
        level: 応用
        definition: false
        type: choice
        question: |
          2 つの群の事前確率は等しく、誤判別の損失も等しいとする。密度の大きい群に判別する規則（2 次判別）で「健全」と判定される $X$ の範囲として最も近いものはどれか。必要なら $\ln2=«ln2»$ を使え。
        choices:
          - '$X>«mid»$'
          - '$«lo0»<X<«hi0»$'
          - '$«lo»<X<«hi»$'
          - '$«lo2»<X<«hi2»$'
          - '$X>«lo»$'
        answer: 2
        distractors:
          - 分散の違いを無視し、2 つの平均の中点を境界とする線形判別にした
          - 密度の比に含まれる標準偏差の比 ln(σ2/σ1) の項を落とした
          - 正解
          - 指数部の分母を 2σ² ではなく 2σ とした
          - 2 次方程式の小さい方の解だけを境界とし、上側の境界を見落とした
        explanation: |
          **方針** 健全と判定するのは $f_1(x)>f_2(x)$ のとき。対数をとると
          $$-\ln\sigma_1-\frac{(x-\mu_1)^2}{2\sigma_1^2}>-\ln\sigma_2-\frac{(x-\mu_2)^2}{2\sigma_2^2}$$
          分散が異なるので $x^2$ の項が消えず、境界は 2 次方程式の 2 つの解になる。

          **途中式** $\sigma_1^2=«v1»$、$\sigma_2^2=«v2»$ を代入して整理すると
          $$\frac{(x-«mu1»)^2}{2\times«v1»}-\frac{(x-«mu2»)^2}{2\times«v2»}<\ln\frac{\sigma_2}{\sigma_1}=\ln2$$
          $$2(x-3)^2-0.5(x-2)^2=«A»x^2-«B»x+«C0»<«ln2»\ \Rightarrow\ «A»x^2-«B»x+«C»<0$$
          判別式 $«B»^2-4\times«A»\times«C»=«disc»$、$\sqrt{«disc»}=«rd»$ より
          $$x=\frac{«B»\pm«rd»}{«twoA»}=«lo4»,\ «hi4»$$
          $x^2$ の係数が正なので、2 つの解の間で不等式が成り立つ。

          **答え** $«lo»<X<«hi»$

          **間違えやすい点** 分散の小さい健全群の密度は平均の近くで高いが、裾では分散の大きい浮きの群の密度の方が高くなる。そのため周波数が高すぎる（$X>«hi»$）箇所も「浮き」と判定される。
          等分散を仮定した線形判別なら境界は中点 $«mid»$ の 1 つだけ。$\ln(\sigma_2/\sigma_1)$ の項を落とすと $«lo0»<X<«hi0»$ になる。

      - id: s23p13b
        chapter: 5
        terms: [poisson-distribution, conditional-expectation]
        topic: 浮きが1つ以上見つかった覆工ブロックだけを記録するときの浮きの個数の平均をゼロ切断ポアソン分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          覆工ブロック 1 つあたりの浮きの個数 $N$ は平均 «lam» のポアソン分布に従うとする。点検記録には浮きが 1 つ以上見つかったブロックだけが載る。
          記録に載ったブロックの浮きの個数の平均 $E[N\mid N\ge1]$ に最も近いものはどれか。必要なら $e^{-0.8}=«em»$ を使え。
        choices:
          - '$«w_lam»$'
          - '$«w_mul»$'
          - '$«zt»$'
          - '$«w_lam1»$'
          - '$«w_div»$'
        answer: 2
        distractors:
          - 条件付けを無視して元のポアソン分布の平均を答えた
          - P(N≧1) で割るところを掛けた
          - 正解
          - 1 つは必ずあるので平均に 1 を足せばよいと考えた
          - P(N≧1) ではなく P(N=0) で割った
        explanation: |
          **方針** $N\ge1$ という条件のもとでの期待値は $E[N\mid N\ge1]=\dfrac{E[N\,;\,N\ge1]}{P(N\ge1)}$。$N=0$ の項は期待値に寄与しないので、分子は $E[N]=\lambda$ のまま。

          **途中式**
          $$P(N\ge1)=1-e^{-«lam»}=1-«em»=«one_em»$$
          $$E[N\mid N\ge1]=\frac{\lambda}{1-e^{-\lambda}}=\frac{«lam»}{«one_em»}=«zt4»$$

          **答え** $«zt»$

          **間違えやすい点** 0 の個数が記録から除かれる（ゼロ切断）ので、記録の平均は元の平均 «lam» より大きくなる。
          「1 つは必ずある」として $\lambda+1=«w_lam1»$ とするのは誤り：$N\ge1$ のもとでの $N-1$ は、平均 «lam» のポアソン分布には従わない。

  - id: s23p14
    title: 地盤調査地点の分類
    context: |
      ある造成地の地盤調査で、多数の地点について 3 つの指標（$X_1$：標準貫入試験の $N$ 値、$X_2$：せん断波速度、$X_3$：一軸圧縮強さ）を測り、それぞれ標準化した。標準化した指標の相関係数は
      $$r_{12}=«r12»,\qquad r_{13}=«r13»,\qquad r_{23}=«r23»$$
      だった。
    items:
      - id: s23p14a
        chapter: 25
        terms: [factor-analysis-model, factor-loading, communality]
        topic: 3つの地盤指標の相関係数から1因子モデルの因子負荷量と独自分散を求める（3変数で識別できる場合）
        level: 標準
        definition: false
        type: choice
        question: |
          「地盤の硬さ」を表す共通因子 $F$ が 1 つの因子分析モデル $X_j=\lambda_jF+\varepsilon_j$（$V[F]=1$、$\varepsilon_j$ は互いに、また $F$ と無相関、$\lambda_j>0$）が、この相関をちょうど再現するとする。
          一軸圧縮強さ $X_3$ の因子負荷量 $\lambda_3$ と独自分散 $\psi_3=V[\varepsilon_3]$ の組として正しいものはどれか。
        choices:
          - '$\lambda_3=«w_l»$、$\psi_3=«psi3»$'
          - '$\lambda_3=«l3»$、$\psi_3=«w_psi_l»$'
          - '$\lambda_3=«w_avg»$、$\psi_3=«w_avgpsi»$'
          - '$\lambda_3=«w_wrong»$、$\psi_3=«w_wrongpsi»$'
          - '$\lambda_3=«l3»$、$\psi_3=«psi3»$'
        answer: 4
        distractors:
          - 負荷量の 2 乗（共通性）を負荷量と取り違えた
          - 独自分散を 1-λ（負荷量の 2 乗ではない）とした
          - X3 と他の指標の相関の平均を負荷量とした
          - r12·r23/r13 を使い X2 の負荷量を求めた
          - 正解
        explanation: |
          **方針** 1 因子モデルでは $j\ne k$ の相関が $r_{jk}=\lambda_j\lambda_k$ になる。3 つの式から $\lambda_3^2=\dfrac{r_{13}r_{23}}{r_{12}}$ と解ける。標準化しているので $V[X_3]=1=\lambda_3^2+\psi_3$。

          **途中式**
          $$\lambda_3^2=\frac{r_{13}r_{23}}{r_{12}}=\frac{«r13»\times«r23»}{«r12»}=\frac{«num»}{«r12»}=«l3sq»,\qquad\lambda_3=«l3»$$
          $$\psi_3=1-\lambda_3^2=1-«l3sq»=«psi3»$$
          同様に $\lambda_1^2=«l1sq»$（$\lambda_1=«l1»$）、$\lambda_2^2=«l2sq»$（$\lambda_2=«l2»$）で、$\lambda_1\lambda_2=«r12»$ などが確かめられる。

          **答え** $\lambda_3=«l3»$、$\psi_3=«psi3»$

          **間違えやすい点** 共通性は $\lambda_3^2=«l3sq»$ で、負荷量 $\lambda_3$ とは別のもの。独自分散は $1-\lambda_3^2$ であって $1-\lambda_3$ ではない。
          変数が 3 つで 1 因子のときは、相関 3 つと負荷量 3 つの数が等しく、ちょうど解ける（自由度 0）。

      - id: s23p14b
        chapter: 24
        terms: [number-of-clusters, non-hierarchical-clustering, distance-measures]
        topic: 3つのクラスターに分けた調査地点の1点について自クラスター内と最も近い他クラスターへの平均距離からシルエット係数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          因子得点などをもとに、調査地点を 3 つのクラスター $\mathcal A$、$\mathcal B$、$\mathcal C$ に分けた。地点 $P$ は $\mathcal A$ に属する。$P$ からほかの地点までの距離は次のとおり。

          | クラスター | 地点までの距離 |
          |---|---|
          | $\mathcal A$（$P$ 以外） | «o1»、«o2» |
          | $\mathcal B$ | «b1»、«b2»、«b3» |
          | $\mathcal C$ | «c1»、«c2» |

          $a(P)$ を同じクラスターのほかの地点までの平均距離、$b(P)$ をほかのクラスターごとの平均距離のうち最小のものとして、シルエット係数
          $$s(P)=\frac{b(P)-a(P)}{\max\{a(P),\,b(P)\}}$$
          の値を求めよ。
        answer: «sil»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $a(P)$ は自分のクラスターのまとまりの度合い、$b(P)$ は最も近いほかのクラスターとの離れ具合。ほかのクラスターについては**クラスターごとの平均距離**を比べ、最小のものを選ぶ。

          **途中式**
          $$a(P)=\frac{«o1»+«o2»}{2}=«a»$$
          $$\mathcal B\text{ までの平均}=\frac{«b1»+«b2»+«b3»}{3}=«mb»,\qquad\mathcal C\text{ までの平均}=\frac{«c1»+«c2»}{2}=«mc»$$
          $b(P)=\min(«mb»,«mc»)=«bb»$（$\mathcal C$ が最も近い）。
          $$s(P)=\frac{«bb»-«a»}{«bb»}=«sil4»$$

          **答え** $«sil»$

          **間違えやすい点** 最も近い 1 地点（距離 «c1»）だけで $b(P)$ を決めると $«w_min»$ になる。また、$\mathcal B$ の平均 «mb» を使うと $«w_mb»$。どちらのクラスターが近いかは、1 点ではなく平均距離で決める。
          $s(P)$ は $-1$ から $1$ の値をとり、1 に近いほど適切なクラスターに入っている。全地点の平均シルエット係数は、クラスター数を決める目安に使われる。
