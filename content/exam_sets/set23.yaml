      推移は時間的に一様なマルコフ連鎖に従うとする。
    items:
      - id: s23p09a
        chapter: 14
        terms: [transition-probability-matrix, markov-chain, likelihood-function]
        topic: 区間の健全度の推移回数から推移確率を最尤推定し今年の構成割合から来年に要補修となる区間の割合を予測する
