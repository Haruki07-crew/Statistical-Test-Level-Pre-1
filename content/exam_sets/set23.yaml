        question: |
          推移確率を推移回数から最尤推定する。今年の全区間の構成割合が「良好」«q1»、「注意」«q2»、「要補修」«q3» のとき、来年「要補修」と判定される区間の割合の予測値に最も近いものはどれか。
        choices:
          - '$«ok»$'
          - '$«w_pool»$'
          - '$«w_noabs»$'
          - '$«w_2step»$'
          - '$«q3c»$'
        answer: 0
        distractors:
          - 正解
          - 行ごとではなく、全体の推移回数に占める「要補修へ」の割合を使った
          - すでに要補修の区間がそのまま要補修にとどまる分を足し忘れた
          - 2 年後の予測（推移行列の 2 乗）を答えた
          - 推移を考えず今年の割合を答えた
        explanation: |
          **方針** マルコフ連鎖の推移確率の最尤推定値は、各行（昨年の状態）ごとに推移回数を行の合計で割ったもの $\hat p_{ij}=n_{ij}/n_{i\cdot}$。来年の構成割合は（今年の割合のベクトル）×（推移行列）。

          **途中式** 「要補修へ」の推移確率は、良好から $«c13»/«r1»=«p13»$、注意から $«c23»/«r2»=«p23»$、要補修から $«c33»/«r3»=1$。
          $$«q1»\times«p13»+«q2»\times«p23»+«q3»\times1=«ok4»$$

          **答え** $«ok»$

          **間違えやすい点** 推移確率は状態ごとの条件付き確率なので、行の合計で割る。全推移回数で割った割合 «w_pool» は、昨年の状態の構成に左右されてしまう。
          補修をしないので「要補修」は吸収状態で、要補修の割合は年とともに増えていく。

  - id: s23p10
    title: 橋の載荷試験と劣化データの回帰分析
    context: |
      ある道路管理者は、橋の載荷試験や劣化の記録を回帰分析で整理している。以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s23p10a
        chapter: 16
        terms: [least-squares-method, regression-coefficient-t-test, standard-error]
        topic: 荷重0でたわみ0となる原点を通る回帰で傾きの最小二乗推定値と残差の自由度n−1を使った標準誤差を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある橋で荷重 $x$（10 kN 単位）を «n» 段階に変えてたわみ $y$（mm）を測った。荷重 0 ではたわみも 0 なので、原点を通る回帰 $y_i=\beta x_i+\varepsilon_i$（誤差は独立に $N(0,\sigma^2)$）を当てはめる。
          $\sum x_i^2=«sxx»$、$\sum x_iy_i=«sxy»$、$\sum y_i^2=«syy»$ だった。$\hat\beta$ の標準誤差を求めよ。
        answer: «se»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 原点を通る回帰の最小二乗推定値は $\hat\beta=\sum x_iy_i/\sum x_i^2$、分散は $\sigma^2/\sum x_i^2$。推定する係数は 1 個なので、誤差分散は残差平方和を $n-1$ で割って推定する。

          **途中式**
          $$\hat\beta=\frac{«sxy»}{«sxx»}=«b5»,\qquad S_e=\sum y_i^2-\hat\beta\sum x_iy_i=«syy»-«b5»\times«sxy»=«rss»$$
          $$s^2=\frac{«rss»}{«n»-1}=«s2»,\qquad \mathrm{SE}(\hat\beta)=\sqrt{\frac{«s2»}{«sxx»}}=«se5»$$

          **答え** $«se_s»$

          **間違えやすい点** 切片のある回帰と同じく $n-2$ で割ると «w_n2» になる。また、切片がないので偏差平方和 $\sum(x_i-\bar x)^2$ ではなく $\sum x_i^2$ を使う。
          原点を通る回帰では残差の和が 0 になるとは限らないので、決定係数の定義にも注意がいる。

      - id: s23p10b
        chapter: 17
        terms: [durbin-watson-statistic, serial-correlation, residual]
        topic: 8か月分の回帰残差の列からダービン・ワトソン比とラグ1の自己相関を計算し正の系列相関を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          ある橋の劣化度を経過月数に回帰したところ、8 か月分の残差は月の順に次のとおりだった。
          $$«elist»$$
          ダービン・ワトソン比 $d=\dfrac{\sum_{t=2}^{8}(e_t-e_{t-1})^2}{\sum_{t=1}^{8}e_t^2}$ と、その解釈として正しいものはどれか。
        choices:
          - '$d=«dw»$。2 より大きく下回り、隣り合う月の残差に正の系列相関がうかがえる'
          - '$d=«dw»$。0 に近いので、残差に系列相関はない'
          - '$d=«w_inv»$。4 に近いので、隣り合う月の残差に負の系列相関がうかがえる'
          - '$d=«w_noSq»$。2 より大きく下回り、正の系列相関がうかがえる'
          - '$d=«dw»$。2 より大きく下回り、隣り合う月の残差に負の系列相関がうかがえる'
        answer: 0
        distractors:
          - 正解
          - d は 2 のとき系列相関なし、0 に近いと正の系列相関を表す
          - 分子と分母を逆にした
          - 差を 2 乗せずに絶対値で足した
          - 正の系列相関では隣り合う残差が近く、差が小さいので d は小さくなる（負の系列相関では 4 に近づく）
        explanation: |
          **方針** 隣り合う残差の差の 2 乗和を残差の 2 乗和で割る。$d\approx2(1-r_1)$（$r_1$ はラグ 1 の自己相関）なので、$d$ が 2 より小さいと正の系列相関、4 に近いと負の系列相関を表す。

          **途中式** 差は $«dlist»$ で、その 2 乗和は $«num»$。残差の 2 乗和は $«den»$。
          $$d=\frac{«num»}{«den»}=«dw4»$$
          ラグ 1 の自己相関は $r_1=\sum e_te_{t-1}/\sum e_t^2=«r1»$ で、$2(1-r_1)=«apx»$。

          **答え** $d=«dw»$ で、正の系列相関がうかがえる

          **間違えやすい点** 残差の符号が前半は正、後半は負とかたまっていて、隣り合う残差が似ている。このとき差が小さくなり $d$ は小さい。
          $n=8$ のように短い系列では、両端の項の影響で $d$ と $2(1-r_1)$ の差が大きくなる。正式な判定には、標本の大きさと説明変数の数に応じた数表の $d_L$、$d_U$ を使う。

      - id: s23p10c
        chapter: 19
        terms: [nonlinear-regression, least-squares-method, polynomial-regression]
        topic: 材齢と強度の非線形モデルで速度母数の2つの候補について線形な母数を最小二乗で求め残差平方和を比べる
        level: 応用
        definition: false
        type: choice
        question: |
          補修に使うモルタルの圧縮強度 $y$（N/mm²）と材齢 $t$（日）の関係を、非線形モデル $y=\theta_1(1-e^{-\theta_2t})+\varepsilon$ で表す。データは
          $(t,y)=(«t1»,\ «y1»),\ («t2»,\ «y2»),\ («t3»,\ «y3»)$ である。$\theta_2$ を固定すると $\theta_1$ についてはふつうの（原点を通る）最小二乗になることを使い、
          $\theta_2=«a»$ と $«b»$ の 2 つの候補を比べる。残差平方和の小さい方の $\theta_2$ と、そのときの $\theta_1$ の推定値の組として正しいものはどれか。
          必要なら次の値を使え：$e^{-0.7}=0.4966$、$e^{-1.4}=0.2466$、$e^{-2.8}=0.0608$、$e^{-1.05}=0.3499$、$e^{-2.1}=0.1225$、$e^{-4.2}=0.0150$。
        choices:
          - '$\theta_2=«a»$、$\hat\theta_1=«ok»$'
          - '$\theta_2=«b»$、$\hat\theta_1=«wb»$'
          - '$\theta_2=«a»$、$\hat\theta_1=«w_ratio»$'
          - '$\theta_2=«a»$、$\hat\theta_1=«w_last»$'
          - '$\theta_2=«b»$、$\hat\theta_1=«ok»$'
        answer: 0
        distractors:
          - 正解
          - 残差平方和ではなく、推定値 θ1 の小さい方を選んだ
          - 最小二乗ではなく、各点の y/g の平均で θ1 を求めた
          - 材齢の最も大きい点だけから θ1=y/g を求めた
          - θ2 の候補と θ1 の組を取り違えた
        explanation: |
          **方針** $g_i=1-e^{-\theta_2t_i}$ とおくと、$\theta_2$ を固定したモデルは原点を通る回帰 $y_i=\theta_1g_i+\varepsilon_i$ なので $\hat\theta_1=\sum y_ig_i/\sum g_i^2$。残差平方和 $\sum(y_i-\hat\theta_1g_i)^2$ を 2 つの候補で比べる（$\theta_2$ についてのプロファイル）。

          **途中式**
          - $\theta_2=«a»$：$g=(«ga1»,\ «ga2»,\ «ga3»)$、$\hat\theta_1=«ta»$、残差平方和 $«ra»$
          - $\theta_2=«b»$：$g=(«gb1»,\ «gb2»,\ «gb3»)$、$\hat\theta_1=«tb»$、残差平方和 $«rb»$

          残差平方和の小さい $\theta_2=«a»$ を選ぶ。

          **答え** $\theta_2=«a»$、$\hat\theta_1=«ok»$

          **間違えやすい点** 非線形最小二乗では、母数の一部を固定すると線形になることがよくあり、残りの母数について残差平方和を最小にする値を探す（実際には $\theta_2$ をさらに細かく探すか、ガウス・ニュートン法で反復する）。
          $\theta_1$ は強度の上限（$t\to\infty$ での値）で、観測の最大値 «y3» より大きくなりうる。

  - id: s23p11
    title: 鋼橋の塗装の耐久性と補修費用
    context: |
      ある道路管理者は、鋼橋の塗装仕様 A（従来の仕様）と B（新しい重防食仕様）の耐久性を比べるため、各 4 橋について、塗装してから塗り替えが必要と判定されるまでの年数を追跡した。
      $+$ は、その年数の時点で塗り替えが必要になる前に観察が打ち切られた（橋の架け替えなど）ことを表す。

      | 仕様 | 年数 |
      |---|---|
      | A | 5、7、9+、11 |
      | B | 8、10+、12、14+ |
    items:
      - id: s23p11a
        chapter: 29
        terms: [log-rank-test, censored-data, kaplan-meier-estimator]
        topic: 打ち切りを含む2つの塗装仕様の塗り替えまでの年数をログランク検定で比べ各時点の期待件数と分散から統計量を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          2 つの仕様で塗り替えまでの年数の分布が等しいという帰無仮説のログランク検定を行う。仕様 A の観測件数を $O_A$、各時点の期待件数の和を $E_A$、超幾何分布の分散の和を $V$ として、統計量 $\chi^2=(O_A-E_A)^2/V$ の値を求めよ。
        answer: «chi»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 塗り替え（イベント）が起きた各時点で、その直前にまだ観察中の橋（リスク集合）を A、B で数え、2×2 表の周辺を固定したときの A のイベント数の期待値 $e=n_A d/n$ と分散 $v=\dfrac{n_An_Bd(n-d)}{n^2(n-1)}$ を求めて足し合わせる。打ち切られた橋は、その時点より後のリスク集合から外す。

          **途中式**

          | 時点 | $n_A$ | $n_B$ | A のイベント | B のイベント | $e$ | $v$ |
          |---|---|---|---|---|---|---|
          | «t0» | «na0» | «nb0» | «da0» | «db0» | «e0» | «v0» |
          | «t1» | «na1» | «nb1» | «da1» | «db1» | «e1» | «v1» |
          | «t2» | «na2» | «nb2» | «da2» | «db2» | «e2» | «v2» |
          | «t3» | «na3» | «nb3» | «da3» | «db3» | «e3» | «v3» |
          | «t4» | «na4» | «nb4» | «da4» | «db4» | «e4» | «v4» |

          年数 11 の時点では、A の 9+ と B の 10+ はすでに打ち切られているので、リスク集合は A が 1 橋、B が 2 橋。
          $$O_A=«O»,\quad E_A=«E»,\quad O_A-E_A=«OE»,\quad V=«V»$$
          $$\chi^2=\frac{«OE»^2}{«V»}=\frac{«OE2»}{«V»}=«chi4»$$

          **答え** $«chi»$（自由度 1 のカイ二乗分布の上側 5% 点 3.841 より小さく、有意水準 5% では差があるとはいえない）

          **間違えやすい点** 打ち切られた橋を、打ち切り時点より後もリスク集合に数えたり、イベントとして数えたりしない。
          分散の代わりに期待件数で割る $(O_A-E_A)^2/E_A=«chi_E»$ や、両群の $(O-E)^2/E$ を足す近似 $«chi_pear»$ は、ここでの統計量と異なる。

      - id: s23p11b
        chapter: 18
        terms: [logistic-regression, logistic-likelihood-estimation, maximum-likelihood-estimator]
        topic: ひび割れ幅で補修の要否が完全に分かれるデータにロジスティック回帰を当てはめると傾きの最尤推定値が存在しないことを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          別の調査で、鋼橋 8 橋の塗膜のひび割れ幅 $x$（mm）と、補修が必要と判定されたか（$Y=1$）を記録した。

          | ひび割れ幅 $x$ | «nl_xs» |
          |---|«nl_sep»
          | 補修の要否 $Y$ | «nl_ys» |

          ロジスティック回帰 $\mathrm{logit}\,P(Y=1)=\beta_0+\beta_1x$ を最尤法で当てはめようとした。正しい記述はどれか。
        choices:
          - 幅 0.3 mm 以下はすべて $Y=0$、0.4 mm 以上はすべて $Y=1$ と完全に分かれているので、$\beta_1$ を大きくするほど尤度が 1 に近づき、有限の最尤推定値が存在しない
          - $Y=1$ と $Y=0$ が 4 橋ずつなので、$\hat\beta_0=0$、$\hat\beta_1=0$ が最尤推定値になる
          - 最尤推定値は存在するが、標本が少ないので標準誤差がやや大きくなるだけである
          - 完全に分かれているので、$\hat\beta_1$ は 2 群の平均の差 $«nl_d»$ の逆数として有限の値に定まる
          - 完全に分かれていることは、ひび割れ幅が補修の要否に影響しないことを示す
        answer: 0
        distractors:
          - 正解
          - 説明変数を無視した切片だけのモデルの推定値と取り違えた
          - 完全分離では推定値が発散し、ソフトウェアは非常に大きな係数と標準誤差を出す（警告が出る）
          - 最尤推定値は解析的には求まらず、分離していると有限にならない
          - 逆で、影響がはっきりしすぎているために推定できなくなる
        explanation: |
          **方針** 対数尤度 $\sum\{y_i\log p_i+(1-y_i)\log(1-p_i)\}$ は、すべての観測で当てはめた確率が観測値（0 か 1）に一致するとき最大の 0 になる。ある境界で 0 と 1 が完全に分かれていると、境界を 0.3 と 0.4 の間に置き、$\beta_1$ を大きくするほど対数尤度が 0 に近づく。

          **途中式** たとえば $\beta_0=-0.35\beta_1$ とすると、$x\le0.3$ では $\beta_0+\beta_1x\le-0.05\beta_1\to-\infty$、$x\ge0.4$ では $\ge0.05\beta_1\to+\infty$ なので、$\beta_1\to\infty$ で各 $p_i$ が $y_i$ に近づき、対数尤度は 0 に近づくが、どの有限の $\beta_1$ でも 0 にはならない。

          **答え** 有限の最尤推定値が存在しない（完全分離）

          **間違えやすい点** ソフトウェアでは反復が止まらず、非常に大きな係数と標準誤差が出る（警告が出ることが多い）。対処には、データを増やす、罰則付き（ファースの方法など）の推定を使う、ベイズ法で事前分布を置く、などがある。

