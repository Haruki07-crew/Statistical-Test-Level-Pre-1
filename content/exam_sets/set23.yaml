    items:
      - id: s23p12a
        chapter: 21
        terms: [simple-random-sampling, sampling-and-nonsampling-error, standard-error]
        topic: 単純無作為抽出した橋の補修費から市全体の補修費総額を推定し有限母集団修正つきの標準誤差を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          市が管理する «N» 橋から «n» 橋を非復元の単純無作為抽出で選び、今後 10 年の補修費（百万円）を見積もったところ、標本平均 «yb»、標本標準偏差（不偏分散の平方根）«s» だった。
          市全体の補修費の総額の推定量 $N\bar y$ の標準誤差を、有限母集団修正を含めて求めよ。
        answer: «se»
        tolerance: 0.5
        answer_format: 百万円の単位で、小数第1位を四捨五入した整数で答えよ（±0.5 まで正解とする）。
        explanation: |
          **方針** 非復元の単純無作為抽出では $V[\bar y]=(1-f)S^2/n$（$f=n/N$ は抽出率）。総額の推定量は $N\bar y$ なので標準誤差は $N\sqrt{(1-f)s^2/n}$。

          **途中式** 総額の推定値は $«N»\times«yb»=«tot»$。$f=«n»/«N»=«f»$。
          $$\mathrm{SE}=«N»\times\sqrt{\frac{(1-«f»)\times«s»^2}{«n»}}=«N»\times«inner»=«se1»$$

          **答え** 約 $«se_s»$ 百万円

          **間違えやすい点** 有限母集団修正 $1-f$ を落とすと «w_nofpc» になる（抽出率が 1/16 と小さいので差は小さい）。総額は平均の $N$ 倍なので、標準誤差も $N$ 倍する（$\sqrt N$ 倍ではない）。

      - id: s23p12b
        chapter: 31
        terms: [normal-normal-model, posterior-distribution, prior-distribution]
        topic: 正規事前分布と正規観測から橋の損傷進行速度の事後分布を求め基準を超える事後確率を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          ある形式の橋の床版のひび割れ密度の年あたりの増加量 $\mu$ について、過去の知見から事前分布を $N(«m0»,\ «t0»^2)$ とする。
          今年、この形式の «nn» 橋を調べたところ、増加量の平均は $\bar x=«xb»$ だった。各橋の増加量は独立に $N(\mu,\ «sig»^2)$（分散は既知）に従うとする。
          事後確率 $P(\mu>«c»\mid\text{データ})$ に最も近いものはどれか。標準正規分布の分布関数は $\Phi(0.5)=0.6915$、$\Phi(0.6)=0.7257$、$\Phi(0.67)=0.7486$、$\Phi(1.0)=0.8413$ とする（標準化した値は小数第 2 位に丸めて使え）。
        choices:
          - '$«ok»$'
          - '$«w_prior»$'
          - '$«w_data»$'
          - '$«w_sd»$'
          - '$«w_comp»$'
        answer: 0
        distractors:
          - 正解
          - データを使わず事前分布だけで計算した
          - 事前分布を使わず、データだけ（x̄ の標本分布）で計算した
          - 事後平均は正しいが、事後の標準偏差にデータだけの標準誤差を使った
          - μ が基準以下である事後確率（余事象）を答えた
        explanation: |
          **方針** 正規・正規モデルでは、事後分布も正規分布で、精度（分散の逆数）は事前の精度とデータの精度の和、事後平均は精度で重み付けた平均になる。

          **途中式** 事前の精度 $1/«t0»^2=«pp»$、データの精度 $«nn»/«sig»^2=«pd»$、事後の精度 $«ppost»$、事後分散 $«vpost»$、事後の標準偏差 $«sdpost»$。
          $$\text{事後平均}=\frac{«pp»\times«m0»+«pd»\times«xb»}{«ppost»}=«mpost»$$
          $$P(\mu>«c»)=1-\Phi\left(\frac{«c»-«mpost»}{«sdpost»}\right)=1-\Phi(«z»)=\Phi(0.67)=«ok4»$$

          **答え** $«ok»$

          **間違えやすい点** データの平均 «xb» は事前平均 «m0» の方へ縮み、事後平均は «mpost» になる。事後の標準偏差はデータだけの標準誤差 «se_d» より小さい（事前の情報が加わる）。
          頻度論の $p$ 値とは違い、事後確率は「$\mu$ が基準を超える確率」を直接表す。

