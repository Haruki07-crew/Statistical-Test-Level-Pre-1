    items:
      - id: s23p06a
        chapter: 9
        terms: [confidence-interval, ci-mean-unknown-variance, bonferroni-correction]
        topic: 3種類の配合の平均強度を同時信頼係数95%以上で区間推定するボンフェローニ法の区間の半幅をt分布の点から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          3 種類の配合それぞれについて、供試体 «n» 本の標本標準偏差（不偏分散の平方根）はどれも «s» だった。3 つの配合の母平均の信頼区間を、3 つとも同時に母平均を含む確率が 95% 以上になるようにボンフェローニ法で作る（各配合の区間はその配合のデータだけで作る）。
          1 つの区間の半幅を求めよ。必要なら自由度 «df» の $t$ 分布の上側確率の点 $t_{0.025}=«t1»$、$t_{0.0167}=«t2»$、$t_{0.0083}=«t3»$ と $\sqrt{«n»}=«rn»$ を使え。
        answer: «hw»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ボンフェローニの不等式 $P(\text{どれかが外れる})\le\sum P(\text{各区間が外れる})$ より、各区間の信頼係数を $1-0.05/3$ にすれば、同時に含む確率は 95% 以上になる。両側なので、各区間で使う $t$ の点は上側 $0.05/(2\times3)=0.0083$ の点。

          **途中式**
          $$t_{0.0083}(«df»)\times\frac{«s»}{\sqrt{«n»}}=«t3»\times\frac{«s»}{«rn»}=«hw4»$$

          **答え** $«hw_s»$

          **間違えやすい点** 1 つずつの 95% 区間（$t_{0.025}$）だと半幅は «w1» で、3 つ同時に含む確率は 95% より小さくなる。片側の確率を $0.05/3$ として $t_{0.0167}$ を使うと «w2» で、両側に分ける 2 を忘れている。
          ボンフェローニ法は区間どうしが独立でなくても使えるが、区間の数が多いと保守的（幅が広すぎる）になる。

