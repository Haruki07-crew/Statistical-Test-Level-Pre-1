set: 23
title: 模擬試験 第23回
minutes: 90
problems:

  - id: s23p01
    title: 橋の点検車の到着
    context: |
      ある橋の定期点検では、2 台の点検車 A・B が別々の事務所から来る。各車は 9:00 から 10:00 までの間の、互いに独立で一様にランダムな時刻に橋に到着し、到着してから «m» 分間作業して立ち去る。
    items:
      - id: s23p01a
        chapter: 1
        terms: [independence-of-events, inclusion-exclusion-principle, conditional-probability]
        topic: 独立な一様分布に従う2台の点検車の到着時刻を正方形上の点とみて作業時間が重なる確率を面積の比から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          2 台が橋の上で同時に作業している時間がある（作業時間が重なる）確率を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** A・B の到着時刻（9:00 からの分）を $(X,Y)$ とすると、$(X,Y)$ は 1 辺 60 の正方形の上に一様に分布する。作業時間が重なるのは $|X-Y|<«m»$ のときなので、その部分の面積の割合を求める。

          **途中式** 重ならないのは $X-Y\ge«m»$ または $Y-X\ge«m»$ の 2 つの直角三角形で、それぞれ直角をはさむ 2 辺が $60-«m»=«k»$。
          $$P(|X-Y|<«m»)=1-\frac{2\times\frac12\times«k»^2}{60^2}=1-\left(\frac{«k»}{60}\right)^2=1-«k2»=«ans_s»$$

          **答え** $«ans_s»$

          **間違えやすい点** 「A の到着後 «m» 分以内に B が来る」だけを数えると、B が先に来る場合を落とす。また $2\times«m»/60=«w_lin»$ とすると、9:00 直後や 10:00 直前に到着した場合に重なる範囲が狭くなることを無視してしまう。
          面積で考えるのは、$(X,Y)$ が独立な一様分布なので、正方形の上の一様分布になるからである（幾何的確率）。

  - id: s23p02
    title: 杭の載荷試験と設計支持力
    context: |
      ある現場で、同じ仕様の杭 «n» 本に載荷試験を行い、極限支持力 $y_1,\ldots,y_{«n»}$（単位：kN）を得た。分布のモデルとして次の 2 つを考える。

      - モデル A：$y_i$ が正規分布 $N(\mu,\sigma^2)$ に従う。
      - モデル B：$\ln y_i$ が正規分布 $N(m,s^2)$ に従う（$y_i$ は対数正規分布に従う）。

      どちらも母数は 2 個で、最尤法で当てはめた。モデル A の $y$ についての最大対数尤度は $\ell_A=«lA»$ だった。
      モデル B を、変換したデータ $\ln y_1,\ldots,\ln y_{«n»}$ に正規分布を当てはめたものとして計算すると、$\ln y$ についての最大対数尤度は $\ell_B^{*}=«lB»$ だった。
      また $\sum_{i=1}^{«n»}\ln y_i=«S»$ である。対数は自然対数とする。
    items:
      - id: s23p02a
        chapter: 30
        terms: [aic, information-criteria-comparison, log-transformation]
        topic: 対数変換したデータに当てはめたモデルと元のデータのモデルのAICを変換のヤコビアンで補正して比べる
        level: 応用
        definition: false
        type: choice
        question: |
          AIC $=-2\times(\text{最大対数尤度})+2\times(\text{母数の個数})$ を、どちらも**元のデータ $y$ の分布**として計算して比べる。モデル A の AIC は $«aicA»$ である。
          モデル B の AIC と、AIC で選ばれるモデルの組として正しいものはどれか。
        choices:
          - 'モデル B の AIC は $«aicBlog»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB_sign»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB_one»$ で、モデル B を選ぶ'
          - 'モデル B の AIC は $«aicB»$ で、モデル B を選ぶ'
          - 'データの尺度が違うので 2 つのモデルの AIC は比べられず、どちらとも決められない'
        answer: 3
        distractors:
          - ln y の密度のまま AIC を計算し、y の密度に直すヤコビアン 1/y を掛け忘れた
          - ヤコビアンの補正の符号を逆にした（対数尤度に Σln y を足した）
          - 対数尤度の補正 Σln y を -2 倍せずに 1 倍で AIC に足した
          - 正解
          - 変数変換で密度を元の尺度に直せば比べられることを知らなかった
        explanation: |
          **方針** AIC は同じデータ（ここでは $y$）の尤度どうしでなければ比べられない。モデル B の $\ln y$ についての密度を、変数変換で $y$ の密度に直してから対数尤度を求める。

          **途中式** $u=\ln y$ の密度を $g(u)$ とすると、$y$ の密度は $f(y)=g(\ln y)\left|\dfrac{du}{dy}\right|=g(\ln y)\cdot\dfrac{1}{y}$。したがって
          $$\ell_B=\sum_i\ln f(y_i)=\ell_B^{*}-\sum_i\ln y_i=«lB»-«S»$$
          AIC に直すと
          $$\text{AIC}_B=-2\ell_B^{*}+2\sum_i\ln y_i+2\times2=«m2lB»+«twoS»+4=«aicB»$$
          モデル A は $-2\times(«lA»)+4=«aicA»$。差は $«aicA»-«aicB»=«dAIC»$ で、AIC が小さいモデル B を選ぶ。

          **答え** モデル B の AIC は $«aicB»$ で、モデル B を選ぶ。

          **間違えやすい点** $\ell_B^{*}$ のまま計算すると AIC は $«aicBlog»$ となり、A と 150 以上も差がつくように見えるが、これは $\ln y$ と $y$ という別のデータの尤度を比べた見かけの差である。
          この問題ではどちらでも B が選ばれるが、たまたまであり、補正しないと逆の結論になる場合もある。補正は $-2\ell$ に $+2\sum\ln y_i$（符号に注意）で、$-2$ 倍を忘れて $\sum\ln y_i$ だけ足すのも誤り。

      - id: s23p02b
        chapter: 6
        terms: [bivariate-normal-distribution, covariance-and-correlation, normal-distribution]
        topic: 相関のある2本の杭の沈下量の偏差が2変量正規分布に従うとき両方とも平均を上回る確率を角度の比から求める
        level: 応用
        definition: false
        type: choice
        question: |
          同じ地盤に打った隣り合う 2 本の杭の沈下量の、それぞれの平均からの偏差 $(U,V)$ は、平均 $(0,0)$、相関係数 $\rho=«nb_rho»$ の 2 変量正規分布に従うとする（標準偏差は等しい）。
          2 本とも沈下量が平均を上回る確率 $P(U>0,\ V>0)$ に最も近いものはどれか。
        choices:
          - '$«nb_ok»$'
          - '$«nb_ind»$'
          - '$«nb_lin»$'
          - '$«nb_no2»$'
          - '$«nb_half»$'
        answer: 0
        distractors:
          - 正解
          - 相関を無視して 2 つの確率 1/2 を掛けた
          - 1/4 に ρ/4 を足した（角度ではなく相関係数そのものに比例すると考えた）
          - arcsin ρ を 2π ではなく π で割った
          - 相関が正なので一方が平均を上回ればもう一方も必ず上回ると考えた
        explanation: |
          **方針** 標準化した $(U,V)$ を、$U=Z_1$、$V=\rho Z_1+\sqrt{1-\rho^2}\,Z_2$（$Z_1,Z_2$ は独立な標準正規）と書く。$(Z_1,Z_2)$ の分布は回転について対称なので、確率は条件を満たす角度の範囲の割合（全体 $2\pi$ に対する比）になる。

          **途中式** $U>0$ は半平面、$V>0$ は直線 $\rho z_1+\sqrt{1-\rho^2}z_2=0$ の片側の半平面。2 つの境界の間の角は $\pi/2+\arcsin\rho$ なので
          $$P(U>0,V>0)=\frac{\pi/2+\arcsin\rho}{2\pi}=\frac14+\frac{\arcsin\rho}{2\pi}=\frac14+\frac{\pi/6}{2\pi}=\frac14+\frac1{12}=\frac13$$
          （$\arcsin «nb_rho»=\pi/6$。）

          **答え** $«nb_ok»$（$=1/3$）

          **間違えやすい点** 独立なら $1/4$ だが、正の相関があると同じ向きにずれやすく大きくなる。$\rho\to1$ で $1/2$、$\rho\to-1$ で 0 に近づく。
          増え方は $\rho$ そのものではなく $\arcsin\rho$ に比例する。

  - id: s23p03
    title: ボルトの締め付けトルクの誤差
    context: |
      橋の高力ボルトの締め付けトルクを点検し、規定値からのずれ $X$（単位は 10 N·m）を 20 本について測った。$X$ は区間 $(a,b)$ の一様分布に従う（$a<b$ は未知）とする。
      測定値の標本平均は «xb»、標本分散（$n$ で割ったもの）は «v»、最小値は «mn»、最大値は «mx» だった。
    items:
      - id: s23p03a
        chapter: 8
        terms: [method-of-moments, uniform-distribution, point-estimation]
        topic: 区間が未知の一様分布の両端をモーメント法で推定し標本平均と標本分散から求める
        level: 基本
        definition: false
        type: choice
        question: |
          1 次と 2 次のモーメント（平均と分散）を使うモーメント法で $(a,b)$ を推定した値の組として正しいものはどれか。
        choices:
          - '$(\hat a,\hat b)=(«ok_a»,\ «ok_b»)$'
          - '$(\hat a,\hat b)=(«w1_a»,\ «w1_b»)$'
          - '$(\hat a,\hat b)=(«w2_a»,\ «w2_b»)$'
          - '$(\hat a,\hat b)=(«mn»,\ «mx»)$'
          - '$(\hat a,\hat b)=(«w3_a»,\ «w3_b»)$'
        answer: 0
        distractors:
          - 正解
          - 分散 (b−a)²/12 から半幅を √3·σ ではなく σ とした
          - 半幅を √12·σ とした（幅と半幅を取り違えた）
          - 最小値と最大値を答えた（これは最尤推定値で、モーメント法ではない）
          - 半幅を σ/√3 とした
        explanation: |
          **方針** 一様分布 $(a,b)$ の平均は $(a+b)/2$、分散は $(b-a)^2/12$。これらを標本平均と標本分散に等しいとおいて $a,b$ を解く。

          **途中式** $\dfrac{a+b}{2}=«xb»$、$\dfrac{(b-a)^2}{12}=«v»$ より $b-a=\sqrt{12\times«v»}=«wd»$、半幅は $«hw»$。
          $$\hat a=«xb»-«hw»=«ok_a»,\qquad \hat b=«xb»+«hw»=«ok_b»$$

          **答え** $(«ok_a»,\ «ok_b»)$

          **間違えやすい点** 半幅は $\sqrt3\,\sigma$（$\sigma$ は標準偏差）で、$\sigma$ そのものではない。
          最尤推定値は $(\min,\max)=(«mn»,\ «mx»)$ で、モーメント法とは違う。モーメント法では区間が観測値を含まないこともありうる（ここでは含んでいる）。

  - id: s23p04
    title: 斜張橋ケーブルの劣化と荷重
    context: |
      ある斜張橋のケーブルの維持管理で、素線の腐食の進み具合とケーブルにかかる荷重を調べている。
    items:
      - id: s23p04a
        chapter: 4
        terms: [logit-logistic-transformation, change-of-variables, uniform-distribution]
        topic: 一様分布に従う腐食の進行度をロジット変換した劣化指標の分布関数を求め基準を超える確率を出す
        level: 基本
        definition: false
        type: numeric
        question: |
          ケーブル 1 本の素線の腐食の進行度 $U$ は区間 $(0,1)$ の一様分布に従うとする。劣化指標をロジット $L=\log\dfrac{U}{1-U}$（自然対数）で表すとき、$P(L>«l»)$ を求めよ。必要なら $e^{«l»}=«el»$ を使え。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $u\mapsto\log\{u/(1-u)\}$ は単調増加なので、$L$ の分布関数は $U$ の分布関数で表せる。

          **途中式** $L\le l\iff U\le\dfrac{e^l}{1+e^l}$ なので
          $$F_L(l)=\frac{e^l}{1+e^l}\quad(-\infty<l<\infty),\qquad P(L>«l»)=1-\frac{«el»}{1+«el»}=\frac{1}{1+«el»}=«ans4»$$
          （$L$ は標準ロジスティック分布に従う。密度は $f_L(l)=e^l/(1+e^l)^2$。）

          **答え** $«ans_s»$

          **間違えやすい点** $P(U>«l»)$ のように変換前の値と比べないこと。$1/e^{«l»}=«w_inv»$ は $L$ が指数分布だと思った場合の値で、ロジスティック分布の右の裾 $1/(1+e^{l})$ とは少し違う。

      - id: s23p04b
        chapter: 7
        terms: [convergence-in-distribution, order-statistics, maximum-likelihood-estimator]
        topic: 指数分布に従う日最大荷重の90%点を標本分位点で推定したときの漸近標準誤差を求め最尤推定量による推定と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          ケーブルにかかる 1 日の最大活荷重 $X$（MN）は、日ごとに独立に平均 $\theta=«th»$ の指数分布に従うとする。設計に使う 90% 点 $q=\theta\log10$ を、«n» 日分のデータから 2 通りの方法で推定する。
          (i) 標本の 90% 点（順序統計量）、(ii) 最尤推定量 $\bar X$ を代入した $\bar X\log10$。
          標本分位点の漸近分散は $\dfrac{p(1-p)}{n\,f(q)^2}$（$f$ は密度、$p=0.9$）である。(i) と (ii) の漸近的な標準誤差の組に最も近いものはどれか。必要なら $\log10=2.3026$ を使え。
        choices:
          - '(i) $«se1»$、(ii) $«se2»$'
          - '(i) $«w1»$、(ii) $«se2»$'
          - '(i) $«se1»$、(ii) $«w2»$'
          - '(i) $«w3»$、(ii) $«se2»$'
          - '(i) $«se2»$、(ii) $«se1»$'
        answer: 0
        distractors:
          - 正解
          - 密度 f(q) を q ではなく 0 での値 1/θ とした
          - (ii) で log10 を掛け忘れ、θ の標準誤差を答えた
          - p(1−p) ではなく p を使った
          - (i) と (ii) を取り違えた（分布の形を使う最尤推定の方が精度がよい）
        explanation: |
          **方針** (i) は与えられた式に $f(q)$ を代入する。(ii) は $\mathrm{SE}(\bar X)=\theta/\sqrt n$ に定数 $\log10$ を掛ける。

          **途中式** $q=«th»\times2.3026=«q»$、$f(q)=\dfrac1\theta e^{-q/\theta}=\dfrac{1}{«th»}\times\dfrac{1}{10}=«fq»$。
          $$\mathrm{SE}_{(i)}=\sqrt{\frac{0.9\times0.1}{«n»\times«fq»^2}}=«se1_4»,\qquad \mathrm{SE}_{(ii)}=\log10\times\frac{\theta}{\sqrt{«n»}}=2.3026\times\frac{«th»}{«rn»}=«se2_4»$$

          **答え** (i) $«se1»$、(ii) $«se2»$

          **間違えやすい点** 分布の形（指数分布）が正しければ、すべてのデータを使う最尤推定量の方が標準誤差が小さい（漸近相対効率 $«are»$）。ただし分布の形が違っていると (ii) は偏るので、分布を仮定しない (i) にも意味がある。
          標本分位点の漸近正規性は、順序統計量の分布から導かれ、分位点での密度が大きいほど精度がよい。

  - id: s23p05
    title: 橋梁の加速度モニタリング
    context: |
      ある橋で、床版の振動を加速度計で常時観測している。車両が通らない時間帯の計測値の雑音 $\varepsilon_t$ は、互いに独立に同じ分布に従い、平均 0 である。
      ただし、ときどき近くの工事の影響で大きく揺れるため、各時刻の $\varepsilon_t$ は確率 «w» で $N(0,«v1»)$、確率 «w2» で $N(0,«v2»)$ に従う（正規分布の混合）。
    items:
      - id: s23p05a
        chapter: 3
        terms: [skewness-kurtosis, moments, normal-mixture-distribution]
        topic: ときどき大きな揺れが混じる加速度計の雑音（正規分布の尺度混合）の尖度を2次と4次のモーメントから求める
        level: 標準
        definition: false
        type: choice
        question: |
          雑音 $\varepsilon_t$ の尖度 $\beta_2=E[\varepsilon_t^4]/(E[\varepsilon_t^2])^2$（正規分布では 3 になる定義）に最も近いものはどれか。
        choices:
          - '$«ex»$'
          - '$3.00$'
          - '$«w_no3»$'
          - '$«kurt»$'
          - '$«w_var»$'
        answer: 3
        distractors:
          - 正規分布の値 3 を引いた超過尖度を答えた（問題の定義は引かない尖度）
          - 正規分布を混ぜても正規分布のままだと考えた
          - 正規分布の 4 次モーメントが 3σ⁴ であることを忘れ σ⁴ とした
          - 正解
          - 4 次モーメントを分散の 2 乗ではなく分散で割った
        explanation: |
          **方針** 混合分布のモーメントは、各成分のモーメントを混合比で重み付けた平均になる。$N(0,\sigma^2)$ の 2 次モーメントは $\sigma^2$、4 次モーメントは $3\sigma^4$。

          **途中式**
          $$E[\varepsilon^2]=«w»\times«v1»+«w2»\times«v2»=«m2»$$
          $$E[\varepsilon^4]=3\left(«w»\times«q1»+«w2»\times«q2»\right)=3\times«inner»=«m4»$$
          $$\beta_2=\frac{«m4»}{«m2»^2}=\frac{«m4»}{«m2sq»}=«kurt»$$

          **答え** $«kurt»$

          **間違えやすい点** 平均 0 の正規分布を分散を変えて混ぜると、裾が重い（尖度が 3 より大きい）分布になる。正規分布にはならない。
          超過尖度 $\beta_2-3=«ex»$ と取り違えないこと（問題文の定義を確認する）。4 次モーメントの係数 3 を落とすと $«w_no3»$ になる。

      - id: s23p05b
        chapter: 27
        terms: [ma-model, autocovariance-autocorrelation, correlogram]
        topic: 白色雑音に重み付き移動平均をかけた系列をMA(2)とみて1次から3次の自己相関を求めコレログラムの切断を読む
        level: 標準
        definition: false
        type: choice
        question: |
          表示用に、雑音を重み $(1,2,1)/4$ の移動平均でならした系列
          $$Y_t=\frac{\varepsilon_t+2\varepsilon_{t-1}+\varepsilon_{t-2}}{4}$$
          を作った。$Y_t$ の 1 次・2 次・3 次の自己相関係数 $(\rho_1,\rho_2,\rho_3)$ として正しいものはどれか。
        choices:
          - '$(«r1»,\ «ar2»,\ «ar3»)$'
          - '$(«r1»,\ «r2»,\ 0)$'
          - '$(«b1»,\ «b2»,\ 0)$'
          - '$(«h1»,\ «r2»,\ 0)$'
          - '$(«r1»,\ «r2»,\ «r2»)$'
        answer: 1
        distractors:
          - AR(1) のように ρ_k=ρ_1^k と幾何級数的に減ると考えた
          - 正解
          - 自己共分散を重みの 2 乗和ではなく重みの和の 2 乗（16）で割った
          - 1 次の自己共分散で、ずれた重みの積を 1 組（1×2）しか足さなかった
          - MA(2) でも 3 次の自己相関が残ると考えた
        explanation: |
          **方針** $Y_t$ は白色雑音の有限個の重み付き和なので MA(2) 過程。重み $a_0,a_1,a_2$ について、自己共分散は $\gamma_k=\sigma^2\sum_j a_ja_{j+k}$（$k>2$ では 0）。定数 $1/4$ や $\sigma^2=V[\varepsilon_t]$ は自己相関では約分される。

          **途中式** 重み $(1,2,1)$ で
          $$\gamma_0\propto1^2+2^2+1^2=«g0»,\quad\gamma_1\propto1\times2+2\times1=«g1»,\quad\gamma_2\propto1\times1=«g2»,\quad\gamma_3=0$$
          $$\rho_1=\frac{«g1»}{«g0»}=«r1»,\qquad\rho_2=\frac{«g2»}{«g0»}=«r2»,\qquad\rho_3=0$$

          **答え** $(«r1»,\ «r2»,\ 0)$

          **間違えやすい点** MA($q$) の自己相関は $q$ 次より先で 0 に切れる。AR のように徐々に減る形（$«ar2»$、$«ar3»$）にはならない。
          また、雑音が正規分布でなく裾の重い混合分布でも、自己相関は 2 次までのモーメントだけで決まるので結果は変わらない。分母は重みの 2 乗和 «g0» で、重みの和の 2 乗 16 ではない。

