set: 27
title: 模擬試験 第27回
minutes: 90
problems:
  - id: s27p01
    title: 地域公共交通の再編案への住民の意向
    context: |
      ある市では、路線バスを予約制の乗合タクシーに置き換える再編案について、住民の意向を調べている。小問ごとに別の調査を扱う。
    items:
      - id: s27p01a
        chapter: 12
        terms: [chi-square-approximation-condition, fisher-exact-test, expected-frequency]
        topic: 小さな2つの地区の賛否の2×2表で期待度数を計算しカイ二乗近似の条件を満たさないときに正確検定を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          山間部の 2 つの地区で、再編案への賛否を聞いた。

          | 地区 | 賛成 | 反対 | 計 |
          |---|---|---|---|
          | A | «a1» | «a2» | «ra» |
          | B | «b1» | «b2» | «rb» |
          | 計 | «c1» | «c2» | «n» |

          地区によって賛成の割合が違うかを調べるとき、検定の方法の選び方として最も適切なものはどれか。
        choices:
          - '最小の期待度数は «emin»（地区 B の反対）で、期待度数が 5 未満のセルが 4 つのうち 2 つあるので、カイ二乗近似は不正確になりやすい。フィッシャーの正確検定を使う'
          - '観測度数 «b1»（地区 B の賛成）が 5 未満なので、カイ二乗検定は使えない。フィッシャーの正確検定を使う'
          - '総数が «n» で 20 以上あるので、カイ二乗近似は十分に正確である'
          - '期待度数がすべて 5 以上なので、イェーツの補正なしのカイ二乗検定でよい'
          - '期待度数が小さいので、地区 A と地区 B を合わせて 1 つの地区として検定する'
        answer: 0
        distractors:
          - 正解
          - 判断に使うのは観測度数ではなく期待度数
          - 総数ではなく、各セルの期待度数で判断する
          - 期待度数 3.6 と 4.4 は 5 未満
          - 比べたい 2 つの地区を合わせると、検定の目的が失われる
        explanation: |
          **方針** カイ二乗近似の目安は、すべてのセルの期待度数（行の合計 × 列の合計 ÷ 総数）が 5 以上であること。満たさないときは、周辺度数を固定した超幾何分布にもとづくフィッシャーの正確検定を使う。

          **途中式**
          - 地区 B の賛成：$«rb»\times«c1»/«n»=«eb1»$、地区 B の反対：$«rb»\times«c2»/«n»=«emin»$
          - 地区 A の賛成：$«ra»\times«c1»/«n»=«ea1»$、地区 A の反対：$«ra»\times«c2»/«n»=«ea2»$

          **答え** 期待度数 5 未満のセルがあるので、フィッシャーの正確検定を使う

          **間違えやすい点** 判断は観測度数ではなく期待度数で行う。観測度数が 2 でも、期待度数が十分大きければカイ二乗近似は使える。
          目安として「期待度数 5 未満のセルが全体の 20% 以下で、1 未満のセルがない」というコクランの規準もある。
      - id: s27p01b
        chapter: 31
        terms: [credible-interval, beta-distribution, posterior-distribution]
        topic: 一様事前分布と二項データから賛成率のベータ事後分布を求め事後分布の分位点で95%信用区間を作り信頼区間との解釈の違いを選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          ある集落で無作為に選んだ «nb» 人のうち «yb» 人が賛成だった。賛成率 $\theta$ に一様事前分布 $\mathrm{Beta}(1,1)$ をおく（各人は $\theta$ のもとで独立）。
          $\theta$ の事後分布と 95% 信用区間（事後分布の下側 2.5% 点と上側 2.5% 点）の組として正しいものはどれか。
          $\mathrm{Beta}(«pa»,«pb»)$ の 2.5% 点は «q025»、97.5% 点は «q975»、$\mathrm{Beta}(«ya»,«yb2»)$ の 2.5% 点は «w025»、97.5% 点は «w975» とする。
        choices:
          - '事後分布 $\mathrm{Beta}(«pa»,«pb»)$、信用区間 $(«q025»,\ «q975»)$。データと事前分布のもとで、$\theta$ がこの区間にある確率が 0.95'
          - '事後分布 $\mathrm{Beta}(«ya»,«yb2»)$、信用区間 $(«w025»,\ «w975»)$。データと事前分布のもとで、$\theta$ がこの区間にある確率が 0.95'
          - '事後分布 $\mathrm{Beta}(«pa»,«pb»)$、信用区間 $(«q025»,\ «q975»)$。同じ調査をくり返すと、95% の区間が $\theta$ を含む'
          - '事後分布 $\mathrm{Beta}(«pa»,«pb»)$、信用区間は事後平均 ±1.96 × 事後標準偏差でなければならない'
          - '一様事前分布は情報がないので、信用区間は求められない'
        answer: 0
        distractors:
          - 正解
          - 事前分布の 1 を足し忘れた（Beta(y, n−y)）
          - これは頻度論の信頼区間の解釈
          - 事後分布の分位点で作る区間でよい（正規近似は必須ではない）
          - 一様事前分布でも事後分布は求まる
        explanation: |
          **方針** ベータ事前分布 $\mathrm{Beta}(a,b)$ と二項データ（$n$ 人中 $y$ 人）から、事後分布は $\mathrm{Beta}(a+y,\ b+n-y)$。

          **途中式** $\mathrm{Beta}(1+«yb»,\ 1+«nyb»)=\mathrm{Beta}(«pa»,«pb»)$。事後平均は $«pa»/«pab»=«pmean»$。
          95% 信用区間は事後分布の 2.5% 点と 97.5% 点で $(«q025»,\ «q975»)$。

          **答え** 事後分布 $\mathrm{Beta}(«pa»,«pb»)$、信用区間 $(«q025»,\ «q975»)$

          **間違えやすい点** 信用区間は「データを見たあとで $\theta$ がこの区間にある確率」として直接解釈できる。頻度論の信頼区間は「手続きをくり返したときに区間が真の値を含む割合」で、意味が違う。
          事前分布が一様で標本が大きいと、2 つの区間の数値は近くなる。
  - id: s27p02
    title: 観光客の消費と案内アプリ
    context: |
      ある市の観光課が、観光客の移動や消費、案内アプリの評価を調べている。小問ごとに別のデータを扱う。
    items:
      - id: s27p02a
        chapter: 6
        terms: [normal-distribution, sum-of-random-variables, standard-normal-distribution]
        topic: 独立な正規分布に従う2区間の周遊バスの所要時間の合計が正規分布に従う再生性から全行程が60分を超える確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          周遊バスの所要時間は、前半の区間が $N(«m1»,\ «s1»^2)$、後半の区間が $N(«m2»,\ «s2»^2)$（分）に従い、2 つは独立とする。
          全行程が «c» 分を超える確率に最も近いものはどれか。必要なら $\Phi(1)=«ph1»$、$\Phi(1.43)=«ph143»$、$\Phi(2)=«ph2»$ を使え。
        choices:
          - '$«ok»$'
          - '$«w_sdsum»$'
          - '$«w_one»$'
          - '$«w_phi»$'
          - '$«w_half»$'
        answer: 0
        distractors:
          - 正解
          - 標準偏差を足して 7 とした（分散を足すべき）
          - 前半の区間だけで超える確率を考えた
          - 上側確率ではなく Φ の値そのものを答えた
          - 60 分を超えるか 40 分を下回る確率（両側）を求めた
        explanation: |
          **方針** 独立な正規分布の和は正規分布に従い（再生性）、平均と分散はそれぞれの和になる。

          **途中式** 合計 $T\sim N(«m1»+«m2»,\ «s1»^2+«s2»^2)=N(«mt»,\ «vt»)$、標準偏差 $\sqrt{«vt»}=«st»$。
          $$P(T>«c»)=1-\Phi\left(\frac{«c»-«mt»}{«st»}\right)=1-\Phi(2)=«ok»$$

          **答え** $«ok»$

          **間違えやすい点** 独立な確率変数の和の標準偏差は、標準偏差の和 $«s1»+«s2»=7$ ではなく、分散の和の平方根 $\sqrt{16+9}=5$ になる。
          2 つの区間の所要時間に正の相関がある（渋滞が続くなど）と、分散は $2\mathrm{Cov}$ だけ大きくなる。
      - id: s27p02b
        chapter: 9
        terms: [confidence-interval-test-duality, one-sided-two-sided-test, confidence-interval]
        topic: 2つの観光案内アプリの満足度の差が実質的に同等かを2つの片側検定（TOST）で調べ90%信頼区間との対応から同等と判断できる最小の許容幅を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          2 つの観光案内アプリ P・Q の満足度（10 点満点）の平均の差 $\mu_P-\mu_Q$ は «d»、その標準誤差は «se» だった（正規近似を使う）。
          「差の絶対値が $\delta$ 未満なら実質的に同等」とみなし、2 つの片側検定 $H_0:\mu_P-\mu_Q\le-\delta$ と $H_0:\mu_P-\mu_Q\ge\delta$ を、それぞれ有意水準 5% で行い、両方とも棄却されたら同等と判断する（TOST）。
          同等と判断できる最小の $\delta$ を求めよ。標準正規分布の上側 5% 点は 1.645 とする。
        answer: «delta»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 有意水準 5% の 2 つの片側検定がともに棄却されることは、差の 90% 信頼区間 $(\hat d-1.645\,\mathrm{SE},\ \hat d+1.645\,\mathrm{SE})$ が区間 $(-\delta,\ \delta)$ の中に入ることと同値（検定と信頼区間の対応）。

          **途中式**
          - 90% 信頼区間：$«d»\pm1.645\times«se»=(«lo»,\ «hi»)$
          - これが $(-\delta,\delta)$ に入る条件：$\delta>\max(|«lo»|,\ |«hi»|)=«hi»$

          **答え** $«delta»$

          **間違えやすい点** 95% 信頼区間（$\pm1.96\,\mathrm{SE}$）ではなく 90% 信頼区間を使う。2 つの片側検定をそれぞれ 5% で行うので、両側の 10% に対応する。
          「差が有意でない」ことは同等の証拠にならない。同等を示すには、あらかじめ許容幅 $\delta$ を決めて TOST を行う。
      - id: s27p02c
        chapter: 7
        terms: [convergence-in-distribution, order-statistics, extreme-value-distribution]
        topic: 一様分布に従う多数の観光客の到着時刻の最大値について上端からのずれをn倍したものが指数分布に分布収束することから最後の到着が閉館直前になる確率を近似する
        level: 標準
        definition: false
        type: numeric
        question: |
          ある日の観光施設の入場者 «nn» 人の入場時刻は、開館から閉館までの «L» 分の間に、互いに独立に一様分布に従うとする。最後の入場者の入場時刻を $M$ とする。
          $n$ が大きいとき、$n(1-M/«L»)$ は平均 1 の指数分布に分布収束する。この近似を使って、最後の入場が閉館の «g» 分前より早い確率 $P(M\le«Lg»)$ を求めよ。
        answer: «ans»
        tolerance: 0.002
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.002 の差まで正解とする。
        explanation: |
          **方針** $P(M\le m)=(m/L)^n$（独立な一様分布の最大値）。$m=L(1-x/n)$ とおくと $(1-x/n)^n\to e^{-x}$ なので、$n(1-M/L)$ は指数分布に近づく。

          **途中式** $x=n\times\dfrac{«g»}{«L»}=«nn»\times«gL»=«x»$ より
          $$P(M\le«Lg»)=P\left(n\left(1-\frac{M}{«L»}\right)\ge«x»\right)\approx e^{-«x»}=«ans4»$$

          **答え** $«ans_s»$

          **間違えやすい点** 正確な値は $(«Lg»/«L»)^{«nn»}=«exact»$ で、近似とよく一致する。入場者が多くても、最後の入場が閉館の «g» 分前より早い確率は約 37% もある。
          最大値は平均のように正規分布には近づかず、上端からのずれが $1/n$ の速さで縮む。
  - id: s27p03
    title: 観光客の行動と案内所
    context: |
      観光客の予算の使い方と、観光案内所への依頼の入り方を調べる。小問ごとに別の状況を扱う。
    items:
      - id: s27p03a
        chapter: 2
        terms: [marginal-distribution, joint-probability-density-function, conditional-probability-density-function]
        topic: 昼までと夕方までに使った予算の割合の同時密度を積分して周辺密度を求め夕方までの割合を与えたときの昼までの割合の条件付き期待値を出す
        level: 応用
        definition: false
        type: choice
        question: |
          日帰りの観光客が 1 日の予算のうち、昼までに使った割合を $X$、夕方までに使った割合を $Y$（$0<X<Y<1$）とする。$(X,Y)$ の同時密度は
          $$f(x,y)=6x\qquad(0<x<y<1)$$
          である。$Y$ の周辺密度と、$Y=y$ を与えたときの $X$ の条件付き期待値の組として正しいものはどれか。
        choices:
          - '$f_Y(y)=3y^2$、$E[X\mid Y=y]=\dfrac{2y}{3}$'
          - '$f_Y(y)=6y(1-y)$、$E[X\mid Y=y]=\dfrac{2y}{3}$'
          - '$f_Y(y)=3y^2$、$E[X\mid Y=y]=\dfrac{y}{2}$'
          - '$f_Y(y)=6y$、$E[X\mid Y=y]=\dfrac{2y}{3}$'
          - '$f_Y(y)=3y^2$、$E[X\mid Y=y]=E[X]=\dfrac12$'
        answer: 0
        distractors:
          - 正解
          - これは X の周辺密度（x について積分する範囲を取り違えた）
          - 条件付き分布を一様分布とみなした
          - 積分範囲 0<x<y を無視した
          - X と Y は独立でないので、条件付き期待値は y によって変わる
        explanation: |
          **方針** $Y$ の周辺密度は $x$ について $0<x<y$ の範囲で積分する。条件付き密度は $f(x,y)/f_Y(y)$。

          **途中式**
          - $f_Y(y)=\displaystyle\int_0^y6x\,dx=3y^2$（$0<y<1$）
          - $f_{X\mid Y}(x\mid y)=\dfrac{6x}{3y^2}=\dfrac{2x}{y^2}$（$0<x<y$）
          - $E[X\mid Y=y]=\displaystyle\int_0^yx\cdot\frac{2x}{y^2}dx=\frac{2y}{3}$

          **答え** $f_Y(y)=3y^2$、$E[X\mid Y=y]=2y/3$

          **間違えやすい点** $X$ の周辺密度は $y$ について $x<y<1$ で積分して $6x(1-x)$ になる。周辺密度を求めるときは、積分範囲がもう一方の変数に依存することに注意する。
          条件付き分布は $0<x<y$ で $x$ に比例する密度なので、一様分布ではなく、上の方に寄る（期待値 $y/2$ ではなく $2y/3$）。
      - id: s27p03b
        chapter: 5
        terms: [geometric-distribution, independence-of-events]
        topic: 2つの案内所で独立に起こる事象のどちらかが初めて起こるまでの日数が幾何分布になることから期待日数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          市内には駅前と港の 2 か所の案内所があり、外国語の通訳ボランティアの派遣依頼が、各日それぞれ確率 «p1»（駅前）と «p2»（港）で、
          日ごと・案内所ごとに独立に入る。ボランティア登録を始めた日から数えて、**どちらかの案内所に初めて依頼が入る日**までの日数 $T$
          （その日を含めて数える。$T=1,2,\ldots$）の期待値に最も近いものはどれか。
        choices:
          - '$«c_sum»$'
          - '$«c_fail»$'
          - '$«et»$'
          - '$«c_max»$'
          - '$«c_add»$'
        answer: 2
        distractors:
          - 1 日に依頼が入る確率を p1+p2 と足し算した（両方に入る日を二重に数えた）
          - 依頼が入るまでの「失敗」の日数（0 から数える流儀）の期待値を答えた
          - 正解
          - 確率の大きい港の案内所だけの期待日数 1/p2 を答えた
          - 2 つの期待日数 1/p1 と 1/p2 を足した
        explanation: |
          **方針** 各日「どちらかに依頼が入る」事象の確率を求めれば、$T$ はその確率を成功確率とする幾何分布（台 $1,2,\ldots$）に従う。

          **途中式** ある日にどちらにも依頼が入らない確率は独立性から $(1-«p1»)(1-«p2»)=«p1m»\times«p2m»=«qq»$。
          よって 1 日に少なくとも一方に依頼が入る確率は $1-«qq»=«pm»$ で、$T$ は成功確率 «pm» の幾何分布に従う。
          $$E[T]=\frac{1}{«pm»}=«et»$$

          **答え** $«et»$ 日

          **間違えやすい点** $«p1»+«p2»=0.5$ は両方に依頼が入る日（確率 $«p1»\times«p2»$）を二重に数えている（$1/0.5=«c_sum»$）。
          最小値の期待値を、それぞれの期待日数の和 $«c_add»$ や小さいほう $«c_max»$ とするのも誤り。依頼が入る日を含めない流儀なら $«qq»/«pm»=«c_fail»$ になるが、問題は含めて数えている。
  - id: s27p04
    title: 観光地めぐりと観光消費
    context: |
      ある市の観光課が、観光客の移動と消費のモデルを検討している。小問ごとに別のモデルを扱う。
    items:
      - id: s27p04a
        chapter: 3
        terms: [expectation-variance-properties, covariance-and-correlation, mean-vector]
        topic: 日ごとの観光客数と1人あたり消費額に負の共分散があるとき売上総額の期待値を積の期待値と共分散の関係から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          ある観光地の 1 日の観光客数 $N$（人）と 1 人あたりの消費額 $S$（千円）は、平均ベクトルが $(E[N],E[S])=(«EN»,\ «ES»)$ で、共分散は $\mathrm{Cov}(N,S)=«cov»$ である（混雑する日ほど 1 人あたりの消費が少ない）。
          1 日の消費総額 $NS$（千円）の期待値を求めよ。
        answer: «ans»
        tolerance: 0.5
        answer_format: 千円の単位で、整数で答えよ（±0.5 未満の差まで正解とする）。
        explanation: |
          **方針** 共分散の定義 $\mathrm{Cov}(N,S)=E[NS]-E[N]E[S]$ を移項すると、$E[NS]=E[N]E[S]+\mathrm{Cov}(N,S)$。

          **途中式** $E[NS]=«EN»\times«ES»+(«cov»)=«prod»-«acov»=«ans»$

          **答え** $«ans»$ 千円

          **間違えやすい点** $N$ と $S$ が独立（無相関）でなければ、積の期待値は期待値の積にならない。平均だけを掛けた «prod» 千円は、負の共分散の分だけ過大になる。
          観光客を増やす施策の効果を見積もるときは、1 人あたりの消費額が混雑で下がる影響も考える必要がある。
      - id: s27p04b
        chapter: 8
        terms: [maximum-likelihood-estimator, sufficient-statistic, method-of-moments]
        topic: 案内所から目的地までの直線距離がレイリー分布に従うとき2乗和が十分統計量になり尺度母数の最尤推定値を求めモーメント法と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          案内所から観光客が向かう目的地までの直線距離 $R$（km）は、東西と南北のずれが独立に $N(0,\sigma^2)$ に従うとき、密度 $f(r)=\dfrac{r}{\sigma^2}\exp\left(-\dfrac{r^2}{2\sigma^2}\right)$（$r>0$）のレイリー分布に従う。$E[R]=\sigma\sqrt{\pi/2}$ である。
          «n» 人の距離は «rs» だった（2 乗の和は «sr2»、平均は «rb»）。$\sigma^2$ の十分統計量と最尤推定値の組として正しいものはどれか。$\sqrt{\pi/2}=1.2533$ とする。
        choices:
          - '十分統計量 $\sum r_i^2$、$\hat\sigma^2=«mle»$'
          - '十分統計量 $\sum r_i^2$、$\hat\sigma^2=«w_n»$'
          - '十分統計量 $\sum r_i$、$\hat\sigma^2=«w_mm»$'
          - '十分統計量 $\sum r_i$、$\hat\sigma^2=«mle»$'
          - '十分統計量 $\sum r_i^2$、$\hat\sigma^2=«w_var»$（距離の不偏分散）'
        answer: 0
        distractors:
          - 正解
          - 2n ではなく n で割った（2 次元の 2 を落とした）
          - 平均 σ√(π/2) を標本平均に合わせたモーメント法の値
          - 尤度は Σr² を通してだけ σ² に依存する（Σr ではない）
          - 距離の分散は σ² ではなく (2−π/2)σ²
        explanation: |
          **方針** 尤度 $\prod r_i/\sigma^2\cdot\exp(-\sum r_i^2/(2\sigma^2))$ で、$\sigma^2$ はデータと $\sum r_i^2$ を通してだけ結びつく（因数分解定理）。対数尤度を $\sigma^2$ で微分する。

          **途中式**
          $$\log L=\sum\log r_i-n\log\sigma^2-\frac{\sum r_i^2}{2\sigma^2},\qquad\frac{\partial\log L}{\partial\sigma^2}=-\frac{n}{\sigma^2}+\frac{\sum r_i^2}{2\sigma^4}=0$$
          $$\hat\sigma^2=\frac{\sum r_i^2}{2n}=\frac{«sr2»}{«n2»}=«mle»$$

          **答え** 十分統計量 $\sum r_i^2$、$\hat\sigma^2=«mle»$

          **間違えやすい点** $R^2=X^2+Y^2$ で $E[R^2]=2\sigma^2$ なので、2 乗の平均を 2 で割る。モーメント法（$\bar r=\hat\sigma\times1.2533$）では $\hat\sigma^2=(«rb»/1.2533)^2=«w_mm»$ で、最尤推定値とは少し違う。
      - id: s27p04c
        chapter: 14
        terms: [stationary-distribution, detailed-balance, irreducibility]
        topic: 観光客が隣り合う観光地へ等確率で移るグラフ上のランダムウォークで定常分布が各地点の道の本数に比例することを詳細つり合いから求める
        level: 応用
        definition: false
        type: choice
        question: |
          駅・城・温泉街・美術館の 4 か所を結ぶ散策路は、駅–城、駅–温泉街、駅–美術館、城–温泉街、温泉街–美術館 の 5 本である。
          観光客は 1 時間ごとに、いまいる地点から出ている散策路の中から等しい確率で 1 本を選んで隣の地点へ移る。長い時間がたったあと、観光客が温泉街にいる確率と、その理由の組として正しいものはどれか。
        choices:
          - '«po»。定常分布は各地点から出る散策路の本数（次数）に比例し、$\pi_i P_{ij}=\pi_jP_{ji}$（詳細つり合い）が成り立つ'
          - '0.25。4 か所を等しい確率で訪れる'
          - '«w_deg»。定常分布は次数の 2 乗に比例する'
          - '«po»。ただし、地点の並びに周期があるので、分布はこの値に収束しない'
          - '初めにいた地点によって、長い時間がたったあとの確率が変わる'
        answer: 0
        distractors:
          - 正解
          - 次数が違うので一様にはならない
          - 次数に比例する（2 乗ではない）
          - 駅–城–温泉街の三角形（長さ 3 の閉路）があるので周期は 1 で、分布は収束する
          - 既約で非周期的なので、初めの地点によらず同じ分布に収束する
        explanation: |
          **方針** グラフ上のランダムウォークでは $P_{ij}=1/d_i$（$d_i$ は地点 $i$ の次数）。$\pi_i\propto d_i$ とおくと、隣り合う $i,j$ で $\pi_iP_{ij}=c\,d_i\cdot\frac1{d_i}=c=\pi_jP_{ji}$ となり詳細つり合いが成り立つので、これが定常分布。

          **途中式** 次数は駅 3、城 2、温泉街 3、美術館 2（合計 $2\times5=10$）。
          $$\pi=\left(\frac3{10},\ \frac2{10},\ \frac3{10},\ \frac2{10}\right),\qquad \pi_{\text{温泉街}}=«po»$$
          連鎖は既約で、長さ 3 の閉路（駅–城–温泉街）と長さ 2 の往復があるので周期は 1（非周期的）。よって分布はこの定常分布に収束する。

          **答え** «po»

          **間違えやすい点** 詳細つり合いを満たす分布は定常分布になる（逆は成り立たないこともある）。散策路の多い地点ほど、長い目で見て多く訪れられる。
          長さ 2 の往復だけのグラフ（二部グラフ）なら周期 2 になり、分布は収束しない。
  - id: s27p05
    title: 住民意識調査の設計
    context: |
      ある市は、市街地と山間部の住民を対象に意識調査を計画している。市街地では郵送と Web 回答、山間部では訪問による聞き取りを行うので、1 人あたりの調査費用が大きく異なる。
    items:
      - id: s27p05a
        chapter: 21
        terms: [stratified-sampling, two-stage-sampling, simple-random-sampling]
        topic: 第1相の大きな標本で住民を市街地と山間部に分けて層の割合を推定し第2相の小さな標本の層ごとの賛成率と組み合わせる二相抽出による層別推定
        level: 標準
        definition: false
        type: numeric
        question: |
          住民名簿には住所の区分がないため、まず第 1 相として «n1» 人を無作為に選んで簡単な葉書で居住区分だけを尋ねたところ、市街地 «u1» 人、山間部 «m1» 人だった。
          次に第 2 相として、市街地から «u2» 人、山間部から «m2» 人を選んで詳しく調べたところ、再編案への賛成率は市街地 «pu»、山間部 «pm» だった。
          第 1 相で推定した層の割合を重みとする二相抽出の層別推定量で、市全体の賛成率を求めよ。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 層の大きさ（割合）が分からないので、第 1 相の大きな標本から $w_h=n'_h/n'$ を推定し、第 2 相の層ごとの平均に掛けて足す。

          **途中式** $w_{\text{市街地}}=«u1»/«n1»=«wu»$、$w_{\text{山間部}}=«m1»/«n1»=«wm»$。
          $$\hat p=«wu»\times«pu»+«wm»\times«pm»=«t1»+«t2»=«ans_s»$$

          **答え** $«ans_s»$

          **間違えやすい点** 第 2 相の «u2»+«m2» 人をそのまま平均すると «w_raw» になり、多めに調べた山間部の意見が重くなりすぎる。
          層の割合の推定にも誤差があるので、推定量の分散には第 1 相の誤差（層の割合のばらつき）も加わる。
      - id: s27p05b
        chapter: 1
        terms: [independence-of-events, conditional-probability]
        topic: 住民名簿からの無作為抽出で割合2%の属性の人を少なくとも1人含む確率を95%以上にする最小の標本数を余事象で求める
        level: 基本
        definition: false
        type: choice
        question: |
          予備調査では、市内に住む外国籍の住民（割合 «p»）の意見も聞きたい。名簿から $n$ 人を復元抽出とみなせる形で独立に選ぶとき、
          外国籍の住民を**少なくとも 1 人**含む確率を 0.95 以上にする最小の $n$ はどれか。
          必要なら $\ln 0.05=«ln05»$、$\ln 0.98=«ln98»$ を使え。
        choices:
          - '$«c_ln95»$'
          - '$«c_wrong»$'
          - '$«c_low»$'
          - '$«nmin»$'
          - '$«c_rule3»$'
        answer: 3
        distractors:
          - 余事象の確率を 0.05 ではなく 0.95 として ln0.95/ln0.98 から求めた
          - 期待人数 np が 0.95 以上になる n を求めた
          - n ≥ 148.3 を切り捨てて条件を満たさない値にした
          - 正解
          - 「3/p の法則」による概算値をそのまま答えた
        explanation: |
          **方針** 「少なくとも 1 人」は余事象「1 人も含まない」の確率 $0.98^n$ を使うと簡単。

          **途中式**
          $$1-0.98^n\ge0.95\iff0.98^n\le0.05\iff n\ln0.98\le\ln0.05\iff n\ge\frac{\ln0.05}{\ln0.98}=\frac{«ln05»}{«ln98»}=«ratio»$$
          （$\ln0.98<0$ で割るので不等号の向きが変わる。）

          **答え** 最小の整数は $n=«nmin»$

          **間違えやすい点** «ratio» を切り捨てた «c_low» では $0.98^{«c_low»}\approx0.0503>0.05$ で、わずかに足りない。
          よく使う概算「$3/p$」は $«c_rule3»$ で近いが、最小の値ではない。期待人数 $np\ge0.95$ から $n=«c_wrong»$ とするのは「少なくとも 1 人含む確率」とは別の条件。
  - id: s27p06
    title: 観光客数の回帰分析
    context: |
      観光客数を説明する回帰モデルを検討する。小問ごとに別のデータを扱う。
    items:
      - id: s27p06a
        chapter: 16
        terms: [adjusted-r-squared, partial-f-test, coefficient-of-determination]
        topic: 近隣30市町村の観光客数の重回帰で説明変数を2個から4個に増やしたときの自由度調整済み決定係数と部分F検定で追加の要否を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          近隣 «n» 市町村の年間観光客数（対数）を説明する重回帰で、モデル A（説明変数 2 個）の決定係数は «ra»、宿泊施設数と駐車場数を加えたモデル B（説明変数 4 個）の決定係数は «rb» だった（どちらも切片あり）。
          自由度調整済み決定係数と、追加した 2 変数の部分 $F$ 検定（有意水準 5%、$F_{0.05}(2,25)=3.39$）による判断の組として正しいものはどれか。
        choices:
          - '調整済み決定係数は A が «aa»、B が «ab» で A の方が大きい。部分 $F=«F»$ は 3.39 を下回り、追加は有意でない'
          - '決定係数は B の方が大きいので B を選ぶ。部分 $F=«F»$ は 3.39 を下回るが、決定係数の比較が優先する'
          - '調整済み決定係数は A が «aa»、B が «ab» で A の方が大きい。部分 $F=«w_F»$ は 3.39 を上回り、追加は有意である'
          - '調整済み決定係数は A が «w_aa»、B が «w_ab» で B の方が大きい'
          - '説明変数を加えると決定係数は必ず増えるので、部分 $F$ 検定は必ず有意になる'
        answer: 0
        distractors:
          - 正解
          - 決定係数は説明変数を加えると必ず増えるので、比較には使えない
          - 部分 F の分子を自由度 2 で割り忘れた
          - 自由度で調整しない値（調整の向きを取り違えた）
          - 決定係数がわずかに増えても、自由度を考えると有意とは限らない
        explanation: |
          **方針** 自由度調整済み決定係数は $1-(1-R^2)\dfrac{n-1}{n-p-1}$（$p$ は説明変数の数）。部分 $F$ は $\dfrac{(R_B^2-R_A^2)/2}{(1-R_B^2)/(n-5)}$。

          **途中式**
          - A：$1-(1-«ra»)\times\dfrac{29}{27}=«aa»$、B：$1-(1-«rb»)\times\dfrac{29}{25}=«ab»$
          - $F=\dfrac{(«rb»-«ra»)/2}{(1-«rb»)/25}=\dfrac{0.01}{0.0144}=«F»$

          **答え** A の方が調整済み決定係数が大きく、追加は有意でない

          **間違えやすい点** 決定係数は説明変数を増やすと必ず増える（減らない）ので、変数の数が違うモデルの比較には自由度で調整した指標や検定を使う。
          2 つの判断は一致することが多いが、調整済み決定係数は「部分 $F>1$ なら増える」という緩い基準に対応する。
      - id: s27p06b
        chapter: 17
        terms: [residual, least-squares-method, normal-equations]
        topic: 最小二乗残差の和が0で説明変数との積和も0になる性質から読めなくなった2か月分の残差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある町で、8 か月分の「月の週末イベント開催日数 $x$」と「月間観光客数 $y$（千人）」に、切片のある単回帰モデルを最小二乗法で当てはめた。
          報告書には 8 か月分の残差 $e_i=y_i-\hat y_i$ が載っていたが、2 か月分（$x=9$ と $x=11$ の月）が汚れて読めなくなった。

          | $x$ | «x0» | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» | «x7» |
          |---|---|---|---|---|---|---|---|---|
          | 残差 $e$ | «e0» | «e1» | «e2» | «e3» | «e4» | ? | ? | «e7» |

          $x=9$ の月の残差に最も近い値はどれか。
        choices:
          - '$«c_sum»$'
          - '$«c_half»$'
          - '$«c_e9»$'
          - '$«c_flip»$'
          - '$«c_e11»$'
        answer: 2
        distractors:
          - 読めた残差の和をそのまま答えた（符号も逆）
          - 残差の和が 0 の条件だけを使い、2 か月に等分した
          - 正解
          - 連立方程式の符号を取り違えた
          - x=11 の月の残差と取り違えた
        explanation: |
          **方針** 切片を含む最小二乗法では、正規方程式から $\sum e_i=0$ と $\sum x_ie_i=0$ が成り立つ。読めない 2 つの残差 $u=e_{(x=9)}$、$v=e_{(x=11)}$ について連立方程式を作る。

          **途中式** 読めた 6 つの残差の和は $«sek»$、$x$ との積和は
          $«x0»\times«e0»+«x1»\times(«e1»)+«x2»\times«e2»+«x3»\times(«e3»)+«x4»\times«e4»+«x7»\times(«e7»)=«sxek»$。
          $$u+v=«msek»,\qquad 9u+11v=«msxek»$$
          1 つ目の式を 11 倍して 2 つ目を引くと $2u=11\times«msek»-«msxek»=-3.0$ なので $u=«e9»$、$v=«msek»-u=«e11»$。

          **答え** $«c_e9»$

          **間違えやすい点** $\sum e_i=0$ だけでは 2 つの未知数は決まらない（等分すると $«c_half»$）。もう 1 つの条件 $\sum x_ie_i=0$ は、残差が説明変数と直交すること（正規方程式の 2 本目）から来る。
          当てはめた式と $y$ の値がわかれば残差は直接計算できるが、ここでは $y$ がわからなくても最小二乗法の性質だけで求まる。
  - id: s27p07
    title: 若者の移住意向の 2 値回帰
    context: |
      市外に住む若者 «n» 人に移住意向を聞き、市の出身者かどうかで分けて集計した。

      | | 移住意向あり | なし | 計 |
      |---|---|---|---|
      | 市の出身者 | «a» | «b» | «r1» |
      | 出身者でない | «c» | «d» | «r2» |
    items:
      - id: s27p07a
        chapter: 18
        terms: [logistic-regression, generalized-linear-model, relative-risk]
        topic: 出身者かどうかの2値の説明変数だけの2値回帰でロジットリンクの係数が対数オッズ比に対数リンクの係数が対数リスク比になることから2つの係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          移住意向の有無を目的変数、出身者なら 1・そうでなければ 0 の変数 $x$ を説明変数として、二項分布の一般化線形モデルを当てはめる。
          (i) ロジットリンク $\log\dfrac{p}{1-p}=\beta_0+\beta_1x$ と、(ii) 対数リンク $\log p=\gamma_0+\gamma_1x$ の傾きの最尤推定値の組として正しいものはどれか。
          必要なら $\log2=0.693$、$\log2.43=0.887$ を使え。
        choices:
          - '$\hat\beta_1=«b1»$（$e^{\hat\beta_1}$ はオッズ比 «OR»）、$\hat\gamma_1=«g1»$（$e^{\hat\gamma_1}$ はリスク比 «RR»）'
          - '$\hat\beta_1=«g1»$（オッズ比 «RR»）、$\hat\gamma_1=«b1»$（リスク比 «OR»）'
          - '$\hat\beta_1=\hat\gamma_1=«b1»$（リンク関数によらず傾きは同じ）'
          - '$\hat\beta_1=«b1»$、$\hat\gamma_1=«w_diff»$（意向ありの割合の差）'
          - '$\hat\beta_1=«OR»$、$\hat\gamma_1=«RR»$'
        answer: 0
        distractors:
          - 正解
          - ロジットリンクと対数リンクを取り違えた
          - リンク関数が違うと、同じデータでも傾きの値と意味が変わる
          - 割合の差は恒等リンクの傾き
          - 傾きは比そのものではなく比の対数
        explanation: |
          **方針** 説明変数が 2 値だけのモデルは飽和しているので、当てはめた確率は各群の観測割合に一致する。傾きはリンク関数で変換した値の差になる。

          **途中式** 意向ありの割合は出身者 $«a»/«r1»=«p1»$、出身者でない $«c»/«r2»=«p0»$。
          - ロジット：$\hat\beta_1=\log\dfrac{«p1»/(1-«p1»)}{«p0»/(1-«p0»)}=\log«OR»=«b1»$
          - 対数リンク：$\hat\gamma_1=\log\dfrac{«p1»}{«p0»}=\log«RR»=«g1»$

          **答え** $\hat\beta_1=«b1»$（オッズ比 «OR»）、$\hat\gamma_1=«g1»$（リスク比 «RR»）

          **間違えやすい点** 割合が小さくないとき、オッズ比はリスク比より 1 から離れる。「〜倍移住しやすい」と言いたいときは、対数リンクのリスク比の方が直感に合う。
          対数リンクの二項モデルは、当てはめた確率が 1 を超えないよう制約が必要で、推定が不安定になることがある。
