          | 分位点 $\tau$ | 0.1 | 0.5 | 0.9 |
          |---|---|---|---|
          | 切片 | «a1» | «a5» | «a9» |
          | 傾き | «b1» | «b5» | «b9» |

          正しい記述はどれか。
        choices:
          - '宿泊数が増えるほど消費額のばらつきが大きくなる。$x=«x0»$ で消費額の 10% 点から 90% 点までの幅は «w4»（千円）で、$x=1$ の «w1»（千円）より広い'
          - '3 本の傾きが違うのは推定の誤差なので、最小二乗法の 1 本の直線で十分である'
          - '$x=«x0»$ の中央値は «m4» 千円で、平均も必ず «m4» 千円である'
          - '宿泊数が増えるほど消費額のばらつきが大きくなる。$x=«x0»$ での 10% 点から 90% 点までの幅は «w_wrong»（千円）'
          - '傾きは分位点が大きいほど大きいので、宿泊数の効果は消費額の少ない人ほど大きい'
        answer: 0
        distractors:
          - 正解
          - 傾きの違いは条件付き分布の形（広がり）の違いを表す
          - 分布が右に歪んでいると平均は中央値より大きい
          - 傾きの差だけを使い、切片の差を足していない
          - 傾きが大きいのは消費額の多い側（90% 点）
        explanation: |
          **方針** 分位点回帰は、$x$ を与えたときの $y$ の条件付き分布の各分位点を直線で表す。傾きが分位点ごとに違えば、$x$ によって分布の広がりや形が変わる。

          **途中式**
          - $x=«x0»$：10% 点 $«a1»+«b1»\times«x0»=«q1»$、50% 点 «m4»、90% 点 $«a9»+«b9»\times«x0»=«q9»$。幅 $«q9»-«q1»=«w4»$
          - $x=1$：10% 点 «q1x1»、90% 点 «q9x1»。幅 «w1»

          **答え** 宿泊数が増えるほど広がり、$x=«x0»$ での幅は «w4» 千円

          **間違えやすい点** 誤差の分散が $x$ によって変わる（不均一分散）とき、最小二乗法の直線は平均の変化しか表さない。分位点回帰は、ばらつきの変化や裾の動きも捉えられる。
          分位点回帰は外れ値の影響を受けにくい（50% 点の回帰は絶対誤差の和を最小にする）。
      - id: s27p08b
        chapter: 30
        terms: [training-test-split, generalization-error, model-selection]
        topic: 10個のモデルをテストデータの誤差で比べて最小のものを選ぶとその誤差は期待される予測誤差を楽観的に評価することを最大値の期待値から見積もる
        level: 標準
        definition: false
        type: choice
        question: |
          観光客数の予測モデルを 10 個作り、同じテストデータでの平均二乗誤差を比べて最小のモデルを選んだ。そのテスト誤差は «emin» だった。
          実は 10 個のモデルの本当の予測誤差はどれも 1.00 で、テスト誤差は本当の値のまわりに標準偏差 «sd» で独立にばらつくとする（正規分布で近似）。
          標準正規分布に従う 10 個の独立な値の最大値の期待値は «emax» である。正しい記述はどれか。
        choices:
          - '最小のテスト誤差の期待値は約 $1.00-«emax»\times«sd»=«ebest»$ で、選んだモデルのテスト誤差 «emin» は本当の予測誤差を小さく見積もっている。性能は選択に使っていない別のデータで評価する'
          - 'テストデータは学習に使っていないので、選んだモデルのテスト誤差 «emin» は本当の予測誤差の不偏な推定である'
          - '最小のテスト誤差の期待値は $1.00-«sd»=«w_1sd»$ で、«emin» はほぼ妥当である'
          - '選んだモデルの本当の予測誤差は «emin» より小さい'
          - 'モデルの数を 10 から 100 に増やせば、選んだモデルのテスト誤差は本当の予測誤差に近づく'
        answer: 0
        distractors:
          - 正解
          - テストデータでモデルを選ぶと、そのデータは「学習」に使ったことになる
          - 最小値のずれは 1 標準偏差ではなく、10 個の最大値の期待値（1.54）倍
          - 本当の誤差はどれも 1.00 で、選んだモデルも 1.00
          - 候補が多いほど、最小値の楽観的な偏りは大きくなる
        explanation: |
          **方針** テスト誤差を $1.00+0.10Z_k$（$Z_k$ は独立な標準正規）とすると、最小値は $1.00-0.10\max_k(-Z_k)$ で、その期待値は $1.00-0.10\times«emax»$。

          **途中式** $E[\min]=1.00-«emax»\times«sd»=«ebest»$。どのモデルも本当の誤差は 1.00 なのに、選んだモデルの誤差は平均で約 «gap» だけ小さく見える。

          **答え** 最小のテスト誤差は楽観的で、別のデータで評価し直す必要がある

          **間違えやすい点** 学習用・検証用（モデル選択用）・テスト用（最終評価用）の 3 つに分けるのは、このような選択による偏りを避けるためである。
          候補のモデルが多いほど、偶然よく見えるモデルが選ばれやすくなる。
  - id: s27p09
    title: 観光施設の混雑と施策の効果
    context: |
      観光施設の利用状況と、観光 PR 施策の効果を調べる。小問ごとに別のデータを扱う。
    items:
      - id: s27p09a
        chapter: 13
        terms: [runs-test, nonparametric-methods-overview, autocovariance-autocorrelation]
        topic: 10日間の来館者数が中央値より多い日と少ない日の並びの連の数から正確な分布で連の検定の片側p値を求め日ごとの独立性を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          ある観光施設の 10 日間の来館者数を、中央値より多い日（H）と少ない日（L）で表したところ、次の並びになった。

          H H H L L L L L H H

          H は 5 日、L は 5 日で、連（同じ記号の続き）の数は «R» である。日ごとの来館者数が無作為に並んでいる（独立）という帰無仮説のもとで、連の数が «R» 以下になる正確な確率（片側 $p$ 値）として正しいものはどれか。
        choices:
          - '$«p»$。5% 水準で棄却し、多い日と少ない日がかたまって現れる（正の自己相関がある）と判断する'
          - '$«w_eq»$（連の数がちょうど «R» の確率）'
          - '$«w_2»$（連の数が 2 の確率だけ）'
          - '$«p»$。連が少ないので、多い日と少ない日が交互に現れやすい（負の自己相関）と判断する'
          - '$«w_half»$（連の数が 5 以下になる確率）'
        answer: 0
        distractors:
          - 正解
          - 「以下」の確率を求める（R=2 の場合も含める）
          - R=3 の場合を足していない
          - 連が少ないのは同じ記号が続きやすいことで、交互は連が多い場合
          - 観測した連の数 3 ではなく、平均 6 より小さい 5 以下の確率を求めた
        explanation: |
          **方針** H 5 個と L 5 個の並べ方は $\binom{10}{5}=252$ 通りで、帰無仮説のもとでどれも等しい確率。連の数ごとに並べ方を数える。

          **途中式**
          - 連の数 2：HHHHHLLLLL と LLLLLHHHHH の 2 通り
          - 連の数 3：一方の記号が 2 つの連、他方が 1 つの連。H が 2 つに分かれる並べ方は $\binom41=4$ 通り（L が 2 つに分かれるのも 4 通り）で計 8 通り
          - $P(R\le3)=(2+8)/252=«p4»\approx«p»$

          **答え** $«p»$（5% 水準で棄却）

          **間違えやすい点** 連が少なすぎると「同じ状態が続きやすい」（正の自己相関や傾向）、多すぎると「交互になりやすい」ことを示す。標本が大きいときは、連の数の平均 $1+2n_1n_2/(n_1+n_2)=6$ と分散を使う正規近似を使う。
      - id: s27p09b
        chapter: 10
        terms: [holm-method, false-discovery-rate, multiple-testing]
        topic: 6つの観光指標の改善のp値にホルム法とベンジャミニ・ホッホベルグ法を当てはめ棄却される指標の数を比べる
        level: 標準
        definition: false
        type: choice
        question: |
          観光 PR 施策の効果を 6 つの指標で調べ、それぞれの $p$ 値を小さい順に並べると «ps» だった。
          ホルム法（全体の第 1 種の誤りの確率 5%）と、ベンジャミニ・ホッホベルグ法（偽発見率 5%）で棄却される指標の数の組として正しいものはどれか。
        choices:
          - 'ホルム法 «nh» 個、ベンジャミニ・ホッホベルグ法 «nb» 個'
          - 'ホルム法 «nb» 個、ベンジャミニ・ホッホベルグ法 «nh» 個'
          - 'ホルム法 «w_h» 個、ベンジャミニ・ホッホベルグ法 «nb» 個'
          - 'ホルム法 «nh» 個、ベンジャミニ・ホッホベルグ法 «w_b» 個'
          - 'どちらも 5% 未満の «w_raw» 個'
        answer: 0
        distractors:
          - 正解
          - 2 つの方法を取り違えた
          - ホルム法の基準を逆の順（最小の p 値に 0.05、2 番目に 0.05/2、…）に使った
          - ベンジャミニ・ホッホベルグ法で、基準を下回る最大の順位までをすべて棄却することを忘れた
          - 多重性を調整していない
        explanation: |
          **方針** 小さい順に $p_{(1)}\le\cdots\le p_{(6)}$ とする。ホルム法は $p_{(i)}\le0.05/(7-i)$ を $i=1$ から順に確かめ、満たさなくなったところで止める。ベンジャミニ・ホッホベルグ法は $p_{(i)}\le0.05\times i/6$ を満たす最大の $i$ までをすべて棄却する。

          **途中式**
          - ホルム法：$p_{(1)}=«p1»\le0.05/6=0.0083$ で棄却、$p_{(2)}=«p2»>0.05/5=0.010$ で止める → «nh» 個
          - BH 法の基準：«bh»。$p_{(4)}=«p4»\le0.0333$ が条件を満たす最大の順位 → «nb» 個（$p_{(3)}=«p3»$ は基準 0.025 を上回るが、$p_{(4)}$ が満たすので棄却される）

          **答え** ホルム法 «nh» 個、BH 法 «nb» 個

          **間違えやすい点** 偽発見率（棄却したもののうち誤りの割合の期待値）を抑える BH 法は、全体の第 1 種の誤りを抑えるホルム法より多く棄却できる。探索的に候補を絞るときに向いている。
          BH 法では、途中の順位で基準を超えても、それより大きい順位で基準を満たせば、そこまですべて棄却する。
  - id: s27p10
    title: 観光 PR 施策の要因実験
    context: |
      観光 PR の 4 つの要素 A・B・C・D（それぞれ 3 水準）の効果を、$L_9(3^4)$ 直交表を使った 9 回の実験で調べる。直交表の列は 4 列で、A を第 1 列、B を第 2 列に割り付ける。
    items:
      - id: s27p10a
        chapter: 20
        terms: [orthogonal-array, main-effect-and-interaction, confounding]
        topic: 3水準のL9直交表で第1列と第2列に割り付けた因子の交互作用が第3列と第4列の2列に現れることから残りの因子の割り付けと交絡を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          $L_9(3^4)$ 直交表では、第 1 列と第 2 列の因子の交互作用は自由度 4 をもち、第 3 列と第 4 列の 2 列にまたがって現れる。
          A×B の交互作用を推定したい場合と、交互作用は無視できると考える場合について、正しい記述はどれか。
        choices:
          - 'A×B を推定したいなら第 3 列と第 4 列は空けておく必要があり、C・D は割り付けられない。交互作用が無視できるなら、C を第 3 列、D を第 4 列に割り付けて 4 つの主効果を推定できる'
          - 'A×B の交互作用は第 3 列だけに現れるので、C を第 4 列に割り付ければ A×B と C の主効果を両方推定できる'
          - '3 水準の因子の交互作用は自由度 2 なので、1 列で表せる'
          - '交互作用が無視できなくても、C を第 3 列に割り付けた C の主効果は A×B と交絡しない'
          - '$L_9$ は 9 回の実験なので、4 つの因子の主効果（自由度の合計 8）と A×B（自由度 4）を同時に推定できる'
        answer: 0
        distractors:
          - 正解
          - 3 水準の A×B は自由度 (3−1)(3−1)=4 で、2 列（各自由度 2）を使う
          - 交互作用の自由度は 2×2=4
          - C を第 3 列に置くと、C の効果と A×B の一部が区別できない（交絡）
          - 自由度の合計は 8 で、主効果 8 と交互作用 4 は同時には入らない
        explanation: |
          **方針** 3 水準の因子は主効果の自由度が 2 で 1 列を使う。2 因子の交互作用は自由度 $(3-1)(3-1)=4$ で 2 列を使う。$L_9$ は 9 回なので、全体の自由度は 8（4 列 × 2）しかない。

          **途中式**
          - A（第 1 列）・B（第 2 列）の交互作用は第 3 列と第 4 列に現れる
          - A×B を推定するなら 4 列すべて（A、B、A×B の 2 列）を使い切る
          - 交互作用が無視できるなら、第 3・4 列に C・D を割り付けて 4 つの主効果（自由度 8）を推定する（誤差の自由度は 0 になる）

          **答え** A×B を推定するなら C・D は入れられない。無視できるなら C・D を第 3・4 列へ

          **間違えやすい点** 2 水準の $L_8$ では交互作用は 1 列に現れるが、3 水準では 2 列にまたがる。
          誤差の自由度が 0 になるときは、効果の小さい要因の平方和を誤差にプールしたり、繰り返しを入れたりして検定する。
  - id: s27p11
    title: 市町村の地域指標の多変量解析
    context: |
      ある県の市町村の地域指標を多変量解析で分析する。小問ごとに別のデータを扱う。
    items:
      - id: s27p11a
        chapter: 22
        terms: [scree-plot, kaiser-criterion, cumulative-contribution-ratio]
        topic: 6指標の相関行列の固有値からカイザー基準と累積寄与率80%の基準とスクリープロットの折れ目で採用する主成分の数を比べる
        level: 標準
        definition: false
        type: choice
        question: |
          6 つの地域指標（標準化済み）の相関行列の固有値は、大きい順に «ev» だった。
          採用する主成分の数について、正しい記述はどれか。
        choices:
          - 'カイザー基準（固有値 1 以上）では «k1» 個、累積寄与率 80% 以上の基準では «k2» 個で、基準によって数が違う'
          - 'カイザー基準では «k2» 個、累積寄与率 80% 以上の基準では «k1» 個'
          - 'どの基準でも «k1» 個になる'
          - 'カイザー基準では «k1» 個。累積寄与率は第 2 主成分までで «c2» なので、80% 以上の基準でも «k1» 個'
          - '固有値の合計が 6 なので、すべての主成分を採用する'
        answer: 0
        distractors:
          - 正解
          - 2 つの基準を取り違えた
          - 基準によって採用する数は変わりうる
          - 第 2 主成分までの累積寄与率は 65% で 80% に届かない
          - 次元を減らすことが主成分分析の目的
        explanation: |
          **方針** 相関行列では固有値の合計は変数の数 6 に等しく、寄与率は固有値 ÷ 6。カイザー基準は「元の 1 変数分（固有値 1）以上の情報をもつ主成分」を採用する。

          **途中式**
          - カイザー基準：1 以上の固有値は «big» の «k1» 個
          - 累積寄与率：«cum»。80% を初めて超えるのは第 «k2» 主成分まで
          - スクリープロット：固有値を順に結んだ折れ線は、«elbow»

          **答え** カイザー基準で «k1» 個、累積寄与率 80% で «k2» 個

          **間違えやすい点** 主成分の数の決め方には、カイザー基準、累積寄与率、スクリープロットの折れ目など複数の目安があり、結論が分かれることがある。解釈しやすさや分析の目的も合わせて決める。
          分散共分散行列による主成分分析では、カイザー基準の「1」は意味をもたない（平均の固有値と比べる）。
      - id: s27p11b
        chapter: 25
        terms: [factor-score, factor-analysis-model, common-factor-unique-factor]
        topic: 1因子モデルの負荷量と独自分散から1つの市町村の因子得点を回帰法とバートレット法で求め回帰法の得点が0の方へ縮むことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの観光指標（標準化済み）に 1 因子モデル $x_j=\lambda_jf+e_j$（$V[f]=1$、独自分散 $\psi_j=1-\lambda_j^2$）を当てはめ、負荷量 $(\lambda_1,\lambda_2,\lambda_3)=(«l1»,\ «l2»,\ «l3»)$ を得た。
          ある市町村の観測値は $\boldsymbol x=(«x1»,\ «x2»,\ «x3»)$ である。$a_j=\lambda_j/\psi_j$、$S=\sum\lambda_j^2/\psi_j$ とすると、回帰法の因子得点は $\sum a_jx_j/(1+S)$、バートレット法の因子得点は $\sum a_jx_j/S$ と表せる。2 つの因子得点の組として正しいものはどれか。
        choices:
          - '回帰法 «freg»、バートレット法 «fbar»'
          - '回帰法 «fbar»、バートレット法 «freg»'
          - '回帰法 «freg»、バートレット法 «w_mean»（観測値の単純平均）'
          - '回帰法 «w_sum»、バートレット法 «fbar»（重み付き和で割り算をしない）'
          - '2 つの方法は同じ値になる'
        answer: 0
        distractors:
          - 正解
          - 2 つの方法を取り違えた
          - 負荷量と独自分散を使わずに平均した
          - 分母で割っていない
          - 回帰法は 1+S、バートレット法は S で割るので値が違う
        explanation: |
          **方針** どちらの方法も、独自分散の小さい（信頼できる）指標に大きな重み $a_j=\lambda_j/\psi_j$ をかけた和を使う。回帰法は $f$ の条件付き期待値 $E[f\mid\boldsymbol x]$、バートレット法は $f$ の不偏な推定。

          **途中式**
          - $\psi=(«p1»,\ «p2»,\ «p3»)$、$a=(«a1»,\ «a2»,\ «a3»)$、$\sum a_jx_j=«sax»$
          - $S=«S»$
          - 回帰法 $«sax»/(1+«S»)=«freg»$、バートレット法 $«sax»/«S»=«fbar»$

          **答え** 回帰法 «freg»、バートレット法 «fbar»

          **間違えやすい点** 回帰法の得点は $S/(1+S)$ 倍に縮み、平均の 0 の方へ寄る（分散が 1 より小さい）。バートレット法の得点は偏りがないが、ばらつきが大きい。
          指標が多く負荷量が大きいほど $S$ が大きくなり、2 つの得点は近づく。
  - id: s27p12
    title: 年代と満足度の関連
    context: |
      観光ボランティアガイドを利用した «n» 人の満足度を、年代別に集計した。

      | 年代＼満足度 | 低（1） | 中（2） | 高（3） | 計 |
      |---|---|---|---|---|
      | 若年（1） | «t11» | «t12» | «t13» | «r1» |
      | 中年（2） | «t21» | «t22» | «t23» | «r2» |
      | 高年（3） | «t31» | «t32» | «t33» | «r3» |
      | 計 | «c1» | «c2» | «c3» | «n» |
    items:
      - id: s27p12a
        chapter: 28
        terms: [ordinal-contingency-table, contingency-table, covariance-and-correlation]
        topic: 年代と満足度の順序のある3×3分割表に1・2・3の得点を与えて相関係数を求め線形の連関の検定統計量M²=(n−1)r²を計算する
        level: 応用
        definition: false
        type: numeric
        question: |
          年代と満足度の両方に 1・2・3 の得点を与え、«n» 人の (年代の得点, 満足度の得点) の相関係数 $r$ を求める。
          年代が高いほど満足度が高い傾向（線形の連関）を調べる統計量 $M^2=(n-1)r^2$（帰無仮説のもとで近似的に自由度 1 のカイ二乗分布）の値を求めよ。
        answer: «M2»
        tolerance: 0.02
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.02 の差まで正解とする。
        explanation: |
          **方針** 度数を重みにして、得点の平均・偏差平方和・偏差積和を計算し、相関係数を求める。

          **途中式**
          - 年代の得点の平均 $\bar u=(1\times«r1»+2\times«r2»+3\times«r3»)/«n»=«ub»$、満足度の得点の平均 $\bar v=«vb»$
          - $\sum n_{ij}u_iv_j=«suv»$ より $S_{uv}=«suv»-«n»\times«ub»\times«vb»=«Suv»$
          - $S_{uu}=«Suu»$、$S_{vv}=«Svv»$、$r=«Suv»/\sqrt{«Suu»\times«Svv»}=«r»$
          - $M^2=(«n»-1)\times«r»^2=«M2_s»$

          **答え** $«M2_s»$（自由度 1 の上側 5% 点 3.84 を大きく上回り、線形の連関がある）

          **間違えやすい点** 順序を無視したピアソンのカイ二乗検定（自由度 4）よりも、自由度 1 の $M^2$ 検定の方が、単調な傾向を検出する力が強い。
          得点の付け方（1, 2, 3 か、間隔を変えるか）で結果が変わるので、得点は事前に決めておく。
  - id: s27p13
    title: 移住者の満足度調査の欠測
    context: |
      移住支援を受けた世帯の満足度調査で、一部の項目に無回答があった。無回答は観測された変数だけに依存する（MAR）とみなし、多重代入法で «m» 個の補完データを作って、それぞれで満足度の平均を推定した。
    items:
      - id: s27p13a
        chapter: 29
        terms: [multiple-imputation, rubins-rules, mar]
        topic: 多重代入の5個の補完データの推定値と推定分散からルービンのルールで全体の分散を求め欠測による情報の損失の割合を計算する
        level: 応用
        definition: false
        type: numeric
        question: |
          «m» 個の補完データでの満足度の平均の推定値は «qs»、それぞれの推定の分散（補完データ内の分散）はどれも «U» だった。
          ルービンのルールで全体の分散 $T=\bar U+(1+1/m)B$（$B$ は推定値の不偏分散）を求め、欠測による情報の損失の割合の近似 $\gamma=(1+1/m)B/T$ を計算せよ。
        answer: «gamma»
        tolerance: 0.002
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.002 の差まで正解とする。
        explanation: |
          **方針** 補完データ間のばらつき $B$ が、欠測値を補ったことによる不確かさを表す。全体の分散のうちその部分が占める割合が、欠測によって失われた情報の割合の目安になる。

          **途中式**
          - 推定値の平均 $\bar Q=«qb»$、$B=\dfrac{1}{«m»-1}\sum(Q_k-\bar Q)^2=\dfrac{«ssq»}{4}=«B»$
          - $T=«U»+(1+1/«m»)\times«B»=«U»+«bb»=«T»$
          - $\gamma=«bb»/«T»=«gamma4»$

          **答え** $«gamma_s»$

          **間違えやすい点** 1 つの補完データだけで分析すると、分散を $\bar U=«U»$ と過小評価する（補完の不確かさを無視する）。
          情報の損失の割合が大きいときは、補完データの数 $m$ を増やすと推定が安定する。
  - id: s27p14
    title: 住民の地域愛着の経路
    context: |
      住民 «n» 人の調査で、地域行事への参加 $X$、地域への愛着 $M$、定住意向 $Y$（いずれも標準化）の相関係数は $r_{XM}=«rxm»$、$r_{XY}=«rxy»$、$r_{MY}=«rmy»$ だった。
      $X\to M\to Y$ と $X\to Y$ の経路をもつパスモデル（$M$ は $X$ に、$Y$ は $X$ と $M$ に回帰）を考える。
    items:
      - id: s27p14a
        chapter: 26
        terms: [path-analysis, structural-equation-modeling, partial-correlation-coefficient]
        topic: 3変数の相関係数から標準化したパス係数を求め行事参加が愛着を通して定住意向に与える間接効果を計算し総合効果を分解する
        level: 標準
        definition: false
        type: numeric
        question: |
          標準化したパス係数を相関係数から求め、地域行事への参加が愛着を通して定住意向に与える間接効果（$X\to M$ の係数 × $M\to Y$ の係数）を求めよ。
        answer: «ind»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 標準化した変数では、$X\to M$ の係数は $r_{XM}$。$Y$ を $X$ と $M$ に回帰した標準偏回帰係数は、正規方程式 $r_{XY}=c'+b\,r_{XM}$、$r_{MY}=c'r_{XM}+b$ を解いて求める。

          **途中式**
          - $a=r_{XM}=«rxm»$
          - $b=\dfrac{r_{MY}-r_{XY}r_{XM}}{1-r_{XM}^2}=\dfrac{«rmy»-«rxy»\times«rxm»}{1-«rxm»^2}=«b»$、$c'=\dfrac{r_{XY}-r_{MY}r_{XM}}{1-r_{XM}^2}=«c»$
          - 間接効果 $ab=«rxm»\times«b»=«ind_s»$

          **答え** $«ind_s»$

          **間違えやすい点** 総合効果は相関係数 $r_{XY}=«rxy»$ で、直接効果 $c'=«c»$ と間接効果 «ind_s» の和に等しい（$«c»+«ind_s»=«rxy»$）。
          パス係数は因果の向きを仮定したうえでの値で、データだけから向きが決まるわけではない。
