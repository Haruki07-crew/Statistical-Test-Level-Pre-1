set: 27
title: 模擬試験 第27回
minutes: 90
problems:
  - id: s27p01
    title: 地域公共交通の再編案への住民の意向
    context: |
      ある市では、路線バスを予約制の乗合タクシーに置き換える再編案について、住民の意向を調べている。
      回答者は互いに独立に、一定の確率 $p$ で「賛成」と答えるとみなす。
    items:
      - id: s27p01a
        chapter: 12
        terms: [proportion-test, one-sided-two-sided-test, p-value]
        topic: 住民調査の賛成率が過半数を超えるかを1標本の比率のz検定（片側）で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          住民基本台帳から無作為に選んだ «n» 人のうち «x» 人が賛成と答えた。「賛成率は過半数である」ことを示したいので、
          帰無仮説 $H_0:p=0.5$、対立仮説 $H_1:p>0.5$ として、有意水準 5% の検定を行う。検定統計量は、帰無仮説のもとでの標準誤差を使う
          $z=(\hat p-0.5)/\sqrt{0.5\times0.5/n}$（連続修正なし）とする。
          標準正規分布の分布関数の値 $\Phi(«z»)=«phi»$、上側 5% 点 «zc1»、上側 2.5% 点 «zc2» を使ってよい。正しいものはどれか。
        choices:
          - '$z=«z»$ であり、両側検定の棄却限界 $«zc2»$ を超えないので、過半数が賛成とはいえない'
          - '$z=«z»$ であり、p 値は $\Phi(«z»)=«phi»$ で 0.05 より大きいので、過半数が賛成とはいえない'
          - '$z=«z_non»$ であり、棄却限界 $«zc1»$ を超えないので、過半数が賛成とはいえない'
          - '$z=«z»$ であり、棄却限界 $«zc1»$ を超える（p 値 $«pval»$）ので、過半数が賛成といえる'
          - '$z=«z_var»$ であり、棄却限界 $«zc1»$ を大きく超えるので、過半数が賛成といえる'
        answer: 3
        distractors:
          - 対立仮説が片側なのに両側検定の棄却限界 1.96 と比べた
          - p 値を下側の確率 Φ(z) と取り違えた
          - 標準誤差の分母の √n を入れ忘れた（0.5 で割った）
          - 正解
          - 標準誤差を p0(1-p0)/√n とし、p0(1-p0) の平方根をとり忘れた
        explanation: |
          **方針** 標本比率 $\hat p$ を、帰無仮説 $p=0.5$ のもとでの標準誤差で標準化する。対立仮説が「$p>0.5$」なので片側検定で、上側 5% 点と比べる。

          **途中式** $\hat p=«x»/«n»=«ph»$。帰無仮説のもとでの標準誤差は
          $$\sqrt{\frac{0.5\times0.5}{«n»}}=«se0»$$
          $$z=\frac{«ph»-0.5}{«se0»}=\frac{«diff»}{«se0»}=«z»$$
          $«z»>«zc1»$ なので棄却域に入る。p 値は $1-\Phi(«z»)=1-«phi»=«pval»<0.05$ でも同じ結論になる。

          **答え** $z=«z»$ で帰無仮説を棄却し、過半数が賛成といえる（選択肢 3）。

          **間違えやすい点** 「過半数である」ことを示したいので対立仮説は片側。両側の 1.96 と比べると棄却できないと誤って判断する（両側検定の p 値なら $«pval2»$）。
          p 値は「観測値以上に極端な側」の確率 $1-\Phi(z)$ で、$\Phi(z)=«phi»$ ではない。標準誤差は $\sqrt{p_0(1-p_0)/n}$ で、$\sqrt n$ を忘れると $z=«z_non»$、平方根を忘れて $p_0(1-p_0)/\sqrt n$ で割ると $z=«z_var»$ になる。

      - id: s27p01b
        chapter: 31
        terms: [jeffreys-prior, posterior-mean-map, beta-binomial-model]
        topic: ジェフリーズ事前分布のもとで小さな集落の賛成率の事後分布の最頻値（MAP推定値）を求め事後平均と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          バス路線の影響が大きい山あいの集落では、住民 «m» 人に聞いたところ «y» 人が賛成だった。この集落の賛成率 $p$ に
          ジェフリーズの事前分布 $\mathrm{Beta}(1/2,\,1/2)$（密度 $\propto p^{-1/2}(1-p)^{-1/2}$）を置く。
          事後分布の最頻値（MAP 推定値）に最も近い値はどれか。
        choices:
          - '$«mean»$'
          - '$«mle»$'
          - '$«map»$'
          - '$«u_mean»$'
          - '$«w_half»$'
        answer: 2
        distractors:
          - 最頻値ではなく事後平均 α/(α+β) を答えた
          - 事前分布を無視して最尤推定値 y/m を答えた（一様事前分布の MAP とも一致する）
          - 正解
          - 一様事前分布 Beta(1,1) の事後平均 (y+1)/(m+2) を答えた
          - 分子にだけ 1/2 を足し、分母を m のままにした
        explanation: |
          **方針** ベータ分布は二項分布の共役事前分布。事前 $\mathrm{Beta}(a_0,b_0)$ と $m$ 人中 $y$ 人の賛成から、事後分布は $\mathrm{Beta}(a_0+y,\ b_0+m-y)$。
          $\mathrm{Beta}(a,b)$（$a,b>1$）の最頻値は $(a-1)/(a+b-2)$、平均は $a/(a+b)$。

          **途中式** 事後密度は
          $$\pi(p\mid y)\propto p^{-1/2}(1-p)^{-1/2}\cdot p^{«y»}(1-p)^{«my»}=p^{«a»-1}(1-p)^{«b»-1}$$
          なので事後分布は $\mathrm{Beta}(«a»,\,«b»)$。最頻値は
          $$\frac{«a»-1}{«a»+«b»-2}=\frac{«am1»}{«abm2»}=«map4»\cdots$$

          **答え** $«map»$

          **間違えやすい点** 事後平均 $«a»/«ab»=«mean»$ と最頻値は別の量。一様事前分布 $\mathrm{Beta}(1,1)$ なら事後分布の最頻値は最尤推定値 $«y»/«m»=«mle»$ に一致し、事後平均は $«u_mean»$ になる。
          ジェフリーズの事前分布は 0 と 1 の近くに重みがあるので、最頻値は最尤推定値より端（ここでは 1 の側）に寄る。

  - id: s27p02
    title: 観光客の消費額の調査
    context: |
      ある県の観光課は、観光客 1 人 1 日あたりの消費額（単位：千円）を調べている。
      過去の大規模調査から、消費額 $X$ の対数 $\log X$ は平均 $«mu»$、標準偏差 $«sg»$ の正規分布に従う（$X$ は対数正規分布に従う）とみなせる。
      必要なら次の値を使え。

      | $x$ | 1.80 | 2.045 | 2.15 | 2.29 | 2.50 |
      |---|---|---|---|---|---|
      | $e^x$ | «e180» | «e2045» | «e215» | «e229» | «e250» |
    items:
      - id: s27p02a
        chapter: 6
        terms: [lognormal-distribution, normal-distribution, moment-generating-function]
        topic: 対数正規分布に従う観光客1人あたり消費額の平均を対数の平均と分散から求め中央値と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          観光客 1 人 1 日あたりの消費額の母平均 $E[X]$ に最も近い値はどれか（単位：千円）。
        choices:
          - '$«c_med»$'
          - '$«c_mean»$'
          - '$«c_sd2»$'
          - '$«c_nohalf»$'
          - '$«c_plus»$'
        answer: 1
        distractors:
          - 平均ではなく中央値 e^μ を答えた
          - 正解
          - 分散ではなく標準偏差を 2 で割って μ+σ/2 とした
          - μ+σ²/2 の 1/2 を忘れて μ+σ² とした
          - 平均に 1 標準偏差を足した値 e^{μ+σ} を答えた
        explanation: |
          **方針** $Y=\log X\sim N(\mu,\sigma^2)$ なら $E[X]=E[e^{Y}]$ は正規分布の積率母関数 $M_Y(t)=e^{\mu t+\sigma^2t^2/2}$ の $t=1$ での値。

          **途中式**
          $$E[X]=M_Y(1)=\exp\left(\mu+\frac{\sigma^2}{2}\right)=\exp\left(«mu»+\frac{«sg2»}{2}\right)=e^{2.045}=«e2045»$$

          **答え** $«c_mean»$（千円）

          **間違えやすい点** 対数をとった平均を戻した $e^{\mu}=«c_med»$ は**中央値**（$P(X\le e^\mu)=1/2$）で、右に裾の長い対数正規分布では平均より小さい。
          補正は分散 $\sigma^2$ の半分で、$\sigma^2$ をそのまま足すと $«c_nohalf»$、標準偏差の半分を足すと $«c_sd2»$ になる。

      - id: s27p02b
        chapter: 9
        terms: [ci-two-sample-mean-difference, welch-test, t-distribution]
        topic: 2地区の観光客の消費額の平均の差の95%信頼区間をウェルチの方法で作り下限を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          温泉地区と城下町地区で無作為に観光客を選び、1 人 1 日あたりの消費額を聞き取った（標準偏差は不偏分散の平方根）。

          | 地区 | 人数 | 平均 | 標準偏差 |
          |---|---|---|---|
          | 温泉 | «n1» | «m1» | «s1» |
          | 城下町 | «n2» | «m2» | «s2» |

          2 地区の母分散が等しいとは限らないので、**ウェルチの方法**で母平均の差（温泉 − 城下町）の 95% 信頼区間を作る。
          自由度はウェルチ・サタースウェイトの式で求め、小数点以下を切り捨てた整数を使う。この信頼区間の**下限**を求めよ。
          $t$ 分布の上側 2.5% 点は $t_{0.025}(9)=«t9»$、$t_{0.025}(12)=«t12»$、$t_{0.025}(13)=«t13»$、$t_{0.025}(24)=«t24»$ である。
        answer: «lo»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 差の標準誤差は $\sqrt{s_1^2/n_1+s_2^2/n_2}$。自由度はウェルチ・サタースウェイトの近似
          $\nu=\dfrac{(s_1^2/n_1+s_2^2/n_2)^2}{\dfrac{(s_1^2/n_1)^2}{n_1-1}+\dfrac{(s_2^2/n_2)^2}{n_2-1}}$ で求める。

          **途中式** $s_1^2/n_1=«s1»^2/«n1»=«v1»$、$s_2^2/n_2=«s2»^2/«n2»=«v2»$、和は $«vsum»$ で、標準誤差は $\sqrt{«vsum»}=«se»$。
          $$\nu=\frac{«vsum»^2}{«v1»^2/«n1m»+«v2»^2/«n2m»}=\frac{«num»}{«den1»+«den2»}=«df»$$
          切り捨てて自由度 «dfi»。
          $$\text{下限}=(«m1»-«m2»)-t_{0.025}(«dfi»)\times«se»=«diff»-«t12»\times«se»=«diff»-«tse»=«lo4»$$

          **答え** $«lo_s»$（千円）

          **間違えやすい点** 等分散を仮定してプールした分散 $s_p^2=«sp2»$（自由度 «dfp»）を使うと、標準誤差 $«se_p»$ で下限 $«lo_p»$ になる。
          ここでは標準偏差が 2 倍近く違い、人数の少ない温泉地区のほうが散らばりが大きいので、プールすると区間が狭くなりすぎる。
          自由度を小さいほうの $n-1=9$ とする保守的な方法では $«lo_9»$、正規分布の 1.96 を使うと $«lo_z»$ になる。

      - id: s27p02c
        chapter: 7
        terms: [delta-method, standard-error, central-limit-theorem]
        topic: 独立な2つの推定値の積で表す観光消費総額の標準誤差をデルタ法で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          県全体の年間観光消費総額を「年間観光客数 × 1 人あたり消費額」で推定する。
          入込客統計から年間観光客数の推定値は $\hat N=«N»$（万人）、その標準誤差は «seN»（万人）。
          アンケートから 1 人あたり消費額の推定値は $\bar X=«X»$（千円）、その標準誤差は «seX»（千円）。2 つの推定値は独立とする。
          総額の推定値 $\hat N\bar X$ の標準誤差を、**デルタ法**（1 次のテイラー近似）で求めよ。単位は**億円**で答えよ（1 万人 × 1 千円 = 0.1 億円）。
        answer: «ans»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $g(N,X)=NX$ を推定値のまわりで 1 次近似する。偏微分は $\partial g/\partial N=X$、$\partial g/\partial X=N$ で、2 つの推定値は独立なので共分散の項はない。

          **途中式**
          $$V[\hat N\bar X]\approx X^2V[\hat N]+N^2V[\bar X]=«X2»\times«seN2»+«N2»\times«seX2»=«t1»+«t2»=«var_tot»$$
          標準誤差は $\sqrt{«var_tot»}=«se_tot»$（単位：万人×千円 $=$ 千万円）。億円に直すと $«se_tot»\div10=«ans4»\cdots$ 億円。
          なお総額の推定値は $«N»\times«X»=«tot»$ 千万円 $=«tot_oku»$ 億円。

          **答え** $«ans_s»$ 億円

          **間違えやすい点** 相対誤差をそのまま足す $(9/«N»+«seX»/«X»)\times$ 総額 では $«se_lin»$ 億円と過大になる（独立なら相対誤差は 2 乗して足す）。
          片方の誤差だけを考えると $«se_onlyN»$ 億円（観光客数のみ）や $«se_onlyX»$ 億円（消費額のみ）になる。
          独立な積の正確な分散には $V[\hat N]V[\bar X]$ の項も加わるが、その値で計算しても $«se_exact»$ 億円で、デルタ法との差はわずかである。

  - id: s27p03
    title: 観光案内所の来訪者
    context: |
      駅前の観光案内所には、観光客が 1 人または数人の**組**で訪れる。1 時間に訪れる組の数は平均 «lam» のポアソン分布に従い、
      各組の人数 $G$ は互いに独立に $P(G=1)=«q1»$、$P(G=2)=«q2»$、$P(G=3)=«q3»$ をとる。このとき 1 時間の来訪者の総数 $X$ の積率母関数は
      $$M_X(t)=\exp\left\{«lam»\left(«q1»e^{t}+«q2»e^{2t}+«q3»e^{3t}-1\right)\right\}$$
      である。
    items:
      - id: s27p03a
        chapter: 2
        terms: [moment-generating-function, poisson-distribution]
        topic: 組単位でポアソン到着する来訪者の総数の積率母関数の対数（キュムラント母関数）を2回微分して分散を求める
        level: 応用
        definition: false
        type: choice
        question: |
          1 時間の来訪者の総数 $X$ の分散 $V[X]$ に最も近い値はどれか。
        choices:
          - '$«c_comp»$'
          - '$«c_mean»$'
          - '$«c_sq»$'
          - '$«var»$'
          - '$«c_m2»$'
        answer: 3
        distractors:
          - 組数の平均 × 1 組の人数の分散 λV[G] とし、組数の変動を無視した
          - 分散ではなく平均 K'(0) を答えた
          - 分散を λ(E[G])² とし、組の人数のばらつきを無視した
          - 正解
          - M''(0)=E[X²] を分散と取り違えた
        explanation: |
          **方針** 積率母関数の対数 $K(t)=\log M_X(t)$（キュムラント母関数）では $K'(0)=E[X]$、$K''(0)=V[X]$ となる。指数の中身がそのまま $K(t)$ なので微分が簡単。

          **途中式** $K(t)=«lam»\left(«q1»e^{t}+«q2»e^{2t}+«q3»e^{3t}-1\right)$。
          $$K'(t)=«lam»\left(«q1»e^{t}+2\times«q2»e^{2t}+3\times«q3»e^{3t}\right),\qquad K''(t)=«lam»\left(«q1»e^{t}+4\times«q2»e^{2t}+9\times«q3»e^{3t}\right)$$
          $$E[X]=K'(0)=«lam»\times«eg»=«mean»,\qquad V[X]=K''(0)=«lam»\times«eg2»=«var»$$
          （$«eg»=E[G]$、$«eg2»=E[G^2]$。）

          **答え** $«var»$

          **間違えやすい点** 積率母関数そのものを 2 回微分した $M''(0)=E[X^2]=«var»+«mean»^2=«c_m2»$ は 2 次モーメントで、分散ではない（$K''(0)$ なら $\{K'(0)\}^2$ を引く手間がない）。
          複合ポアソン分布の分散は $\lambda E[G^2]$ で、$\lambda V[G]=«lam»\times«vg»=«c_comp»$（組数の変動を無視）や $\lambda(E[G])^2=«c_sq»$（人数のばらつきを無視）ではない。

      - id: s27p03b
        chapter: 5
        terms: [geometric-distribution, independence-of-events]
        topic: 2つの案内所で独立に起こる事象のどちらかが初めて起こるまでの日数が幾何分布になることから期待日数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          市内には駅前と港の 2 か所の案内所があり、外国語の通訳ボランティアの派遣依頼が、各日それぞれ確率 «p1»（駅前）と «p2»（港）で、
          日ごと・案内所ごとに独立に入る。ボランティア登録を始めた日から数えて、**どちらかの案内所に初めて依頼が入る日**までの日数 $T$
          （その日を含めて数える。$T=1,2,\ldots$）の期待値に最も近いものはどれか。
        choices:
          - '$«c_sum»$'
          - '$«c_fail»$'
          - '$«et»$'
          - '$«c_max»$'
          - '$«c_add»$'
        answer: 2
        distractors:
          - 1 日に依頼が入る確率を p1+p2 と足し算した（両方に入る日を二重に数えた）
          - 依頼が入るまでの「失敗」の日数（0 から数える流儀）の期待値を答えた
          - 正解
          - 確率の大きい港の案内所だけの期待日数 1/p2 を答えた
          - 2 つの期待日数 1/p1 と 1/p2 を足した
        explanation: |
          **方針** 各日「どちらかに依頼が入る」事象の確率を求めれば、$T$ はその確率を成功確率とする幾何分布（台 $1,2,\ldots$）に従う。

          **途中式** ある日にどちらにも依頼が入らない確率は独立性から $(1-«p1»)(1-«p2»)=«p1m»\times«p2m»=«qq»$。
          よって 1 日に少なくとも一方に依頼が入る確率は $1-«qq»=«pm»$ で、$T$ は成功確率 «pm» の幾何分布に従う。
          $$E[T]=\frac{1}{«pm»}=«et»$$

          **答え** $«et»$ 日

          **間違えやすい点** $«p1»+«p2»=0.5$ は両方に依頼が入る日（確率 $«p1»\times«p2»$）を二重に数えている（$1/0.5=«c_sum»$）。
          最小値の期待値を、それぞれの期待日数の和 $«c_add»$ や小さいほう $«c_max»$ とするのも誤り。依頼が入る日を含めない流儀なら $«qq»/«pm»=«c_fail»$ になるが、問題は含めて数えている。

  - id: s27p04
    title: 周遊バスと観光地めぐり
    context: |
      ある市は、駅・城・温泉街を結ぶ周遊バスを運行している。
    items:
      - id: s27p04a
        chapter: 3
        terms: [weighted-geometric-harmonic-mean, moments]
        topic: 区間ごとの距離と速さから周遊バスの全行程の平均速度を加重調和平均で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          周遊バスの 1 周は次の 3 区間からなり、各区間を一定の速さで走る。

          | 区間 | 駅→城 | 城→温泉街 | 温泉街→駅 |
          |---|---|---|---|
          | 距離（km） | «d1» | «d2» | «d3» |
          | 速さ（km/時） | «v1» | «v2» | «v3» |

          1 周の平均の速さ（総距離 ÷ 総所要時間、km/時）を求めよ。
        answer: «hm»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 平均の速さは総距離を総時間で割ったもの。速さを距離で重み付けした**加重調和平均** $\dfrac{\sum d_i}{\sum d_i/v_i}$ になる。

          **途中式** 各区間の所要時間は $«d1»/«v1»=«h1»$、$«d2»/«v2»=«h2»$、$«d3»/«v3»=«h3»$（時間）、合計 $«H»$ 時間。
          $$\frac{«d1»+«d2»+«d3»}{«H»}=\frac{«D»}{«H»}=«hm3»$$

          **答え** $«hm_s»$ km/時

          **間違えやすい点** 速さを単純に平均した $«am»$ や、距離で重み付けした算術平均 $«wam»$ は誤り。遅い区間ほど長く時間を使うので、時間で重み付けすると算術平均より小さくなる。

      - id: s27p04b
        chapter: 8
        terms: [unbiased-estimator, method-of-moments, order-statistics, efficient-estimator]
        topic: 一様分布の上端のモーメント推定量2X̄と不偏化した最大値の推定量の分散の比（相対効率）を求める
        level: 標準
        definition: false
        type: choice
        question: |
          周遊バスの各停留所での遅れ（分）は区間 $[0,\theta]$ の一様分布に従うとする。独立な «n» 回の遅れ $X_1,\ldots,X_{«n»}$ から上限 $\theta$ を推定する。
          モーメント推定量 $\hat\theta_1=2\bar X$ と、最大値を不偏にした推定量 $\hat\theta_2=\frac{«np1»}{«n»}X_{(«n»)}$（$X_{(«n»)}$ は最大値）はどちらも不偏である。
          分散の比 $V[\hat\theta_1]/V[\hat\theta_2]$ に最も近い値はどれか。
        choices:
          - '$«w_n3»$'
          - '$«w_n13»$'
          - '$«eff»$'
          - '$«w_raw»$'
          - '$«w_mse»$'
        answer: 2
        distractors:
          - V[θ̂2] を θ²/n² のように誤り、比を n/3 とした
          - 比の分子を (n+1) とした（V[θ̂2] の分母を n(n+1) と誤った）
          - 正解
          - 不偏化する前の最大値 X(n) の分散 nθ²/((n+1)²(n+2)) と比べた
          - 最大値 X(n) の平均二乗誤差 2θ²/((n+1)(n+2)) と比べた
        explanation: |
          **方針** $V[\bar X]=\theta^2/(12n)$。最大値 $Y=X_{(n)}$ の密度は $n y^{n-1}/\theta^n$（$0<y<\theta$）なので、$E[Y]$ と $E[Y^2]$ を積分で求める。

          **途中式** $V[\hat\theta_1]=4\cdot\dfrac{\theta^2}{12n}=\dfrac{\theta^2}{3n}=«v2x»$。
          $E[Y]=\dfrac{n}{n+1}\theta$、$E[Y^2]=\dfrac{n}{n+2}\theta^2$ より $V[Y]=\dfrac{n\theta^2}{(n+1)^2(n+2)}$。
          $$V[\hat\theta_2]=\left(\frac{n+1}{n}\right)^2V[Y]=\frac{\theta^2}{n(n+2)}=«vT»$$
          $$\frac{V[\hat\theta_1]}{V[\hat\theta_2]}=\frac{n(n+2)}{3n}=\frac{n+2}{3}=\frac{«np2»}{3}=«eff»$$

          **答え** $«eff»$（$\hat\theta_2$ のほうが分散が約 «eff» 分の 1 で、効率がよい）

          **間違えやすい点** 補正前の最大値 $X_{(n)}$ の分散と比べると $«w_raw»$、平均二乗誤差と比べると $«w_mse»$ になるが、問われているのは不偏化した $\hat\theta_2$ との比。
          $\hat\theta_2$ の分散は $\theta^2/n^2$ ではなく $\theta^2/\{n(n+2)\}$ で、$n$ が大きいと $1/n^2$ の速さで小さくなる（$2\bar X$ は $1/n$ の速さ）。

      - id: s27p04c
        chapter: 14
        terms: [absorbing-state, absorption-probability, markov-chain]
        topic: 城と温泉街を行き来する観光客が土産を買って帰る確率を吸収マルコフ連鎖の吸収確率として連立方程式で求める
        level: 応用
        definition: false
        type: choice
        question: |
          観光客の 1 時間ごとの行動を、状態「城」「温泉街」「土産を買って帰る」「買わずに帰る」のマルコフ連鎖で表す。後の 2 つは吸収状態である。

          | 現在＼1 時間後 | 城 | 温泉街 | 買って帰る | 買わずに帰る |
          |---|---|---|---|---|
          | 城 | «aa» | «ab» | «abuy» | «aout» |
          | 温泉街 | «ba» | «bb» | «bbuy» | «bout» |

          駅から周遊バスでまず城に着いた観光客が、最終的に土産を買って帰る確率に最も近い値はどれか。
        choices:
          - '$«one»$'
          - '$«two»$'
          - '$«naive»$'
          - '$«hA»$'
          - '$«hB»$'
        answer: 3
        distractors:
          - 城から 1 時間後に直接買って帰る確率だけを答えた
          - 2 時間後までに買って帰る確率で打ち切った
          - 城での「買う」と「買わない」の比 0.2/(0.2+0.3) だけで決め、温泉街への移動を無視した
          - 正解
          - 温泉街から出発した場合の吸収確率を答えた
        explanation: |
          **方針** $h_A$、$h_B$ を城・温泉街から出発して最終的に「買って帰る」に吸収される確率とし、1 ステップ目で場合分けする（1 段階解析）。

          **途中式**
          $$h_A=«aa»h_A+«ab»h_B+«abuy»,\qquad h_B=«ba»h_A+«bb»h_B+«bbuy»$$
          整理すると $«caa»h_A-«ab»h_B=«abuy»$、$-«ba»h_A+«cbb»h_B=«bbuy»$。係数の行列式は $«caa»\times«cbb»-«ab»\times«ba»=«det»$ なので
          $$h_A=\frac{«abuy»\times«cbb»+«ab»\times«bbuy»}{«det»}=\frac{«numA»}{«det»}=«hA4»\cdots,\qquad h_B=«hB4»\cdots$$

          **答え** $«hA»$

          **間違えやすい点** 1 時間後に直接買う確率 «one» や、2 時間後までの確率 $«abuy»+«aa»\times«abuy»+«ab»\times«bbuy»=«two»$ は、その後に吸収される経路を数え落としている。
          城の行の比 $«abuy»/(«abuy»+«aout»)=«naive»$ は、温泉街に移ると買って帰りやすくなる効果を無視している。出発点は城なので $h_B=«hB»$ ではない。

  - id: s27p05
    title: 住民意識調査の設計
    context: |
      ある市は、市街地と山間部の住民を対象に意識調査を計画している。市街地では郵送とWeb回答、山間部では訪問による聞き取りを行うので、1 人あたりの調査費用が大きく異なる。
    items:
      - id: s27p05a
        chapter: 21
        terms: [stratified-sampling, neyman-allocation, proportional-allocation]
        topic: 調査費用が層で異なるとき総費用を固定した最適配分で山間部の標本数を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          満足度得点の平均を層別無作為抽出で推定する。層の大きさ $N_h$、得点の標準偏差の見込み $S_h$、1 人あたりの調査費用 $c_h$ は次の通り。

          | 層 | $N_h$（人） | $S_h$ | $c_h$（円） |
          |---|---|---|---|
          | 市街地 | «N1» | «S1» | «c1» |
          | 山間部 | «N2» | «S2» | «c2» |

          調査費用の総額を $\sum_h c_hn_h=«C»$ 円に固定し、層別平均の推定量の分散を最小にする配分 $n_h\propto N_hS_h/\sqrt{c_h}$ を使う（有限母集団修正は無視する）。
          山間部の標本数 $n_2$ を求めよ。
        answer: «n2»
        tolerance: 0.5
        answer_format: 小数第1位を四捨五入した整数で答えよ（±0.5 未満の差まで正解）。
        explanation: |
          **方針** $n_h=k\,N_hS_h/\sqrt{c_h}$ とおき、費用の制約 $\sum c_hn_h=C$ から $k$ を決める：$k=C\big/\sum_hN_hS_h\sqrt{c_h}$。

          **途中式** $\sqrt{c_1}=«sc1»$、$\sqrt{c_2}=«sc2»$。
          $$\sum_h N_hS_h\sqrt{c_h}=«N1»\times«S1»\times«sc1»+«N2»\times«S2»\times«sc2»=«f1»+«f2»=«fsum»$$
          $$n_2=C\cdot\frac{N_2S_2/\sqrt{c_2}}{\sum_h N_hS_h\sqrt{c_h}}=«C»\times\frac{«w2»}{«fsum»}=«n2raw»$$
          同様に $n_1=«n1»$ で、費用は $«c1»\times«n1»+«c2»\times«n2raw»\approx«cost_chk»$ 円になる。

          **答え** $n_2=«n2»$ 人

          **間違えやすい点** 費用を考えないネイマン配分（$n_h\propto N_hS_h$）で同じ総数 «ntot» 人を分けると $n_2=«ney2»$、比例配分だと $«prop2»$ になり、費用の高い山間部に配りすぎる。
          費用の補正は $c_h$ ではなく $\sqrt{c_h}$ で割る。

      - id: s27p05b
        chapter: 1
        terms: [independence-of-events, conditional-probability]
        topic: 住民名簿からの無作為抽出で割合2%の属性の人を少なくとも1人含む確率を95%以上にする最小の標本数を余事象で求める
        level: 基本
        definition: false
        type: choice
        question: |
          予備調査では、市内に住む外国籍の住民（割合 «p»）の意見も聞きたい。名簿から $n$ 人を復元抽出とみなせる形で独立に選ぶとき、
          外国籍の住民を**少なくとも 1 人**含む確率を 0.95 以上にする最小の $n$ はどれか。
          必要なら $\ln 0.05=«ln05»$、$\ln 0.98=«ln98»$ を使え。
        choices:
          - '$«c_ln95»$'
          - '$«c_wrong»$'
          - '$«c_low»$'
          - '$«nmin»$'
          - '$«c_rule3»$'
        answer: 3
        distractors:
          - 余事象の確率を 0.05 ではなく 0.95 として ln0.95/ln0.98 から求めた
          - 期待人数 np が 0.95 以上になる n を求めた
          - n ≥ 148.3 を切り捨てて条件を満たさない値にした
          - 正解
          - 「3/p の法則」による概算値をそのまま答えた
        explanation: |
          **方針** 「少なくとも 1 人」は余事象「1 人も含まない」の確率 $0.98^n$ を使うと簡単。

          **途中式**
          $$1-0.98^n\ge0.95\iff0.98^n\le0.05\iff n\ln0.98\le\ln0.05\iff n\ge\frac{\ln0.05}{\ln0.98}=\frac{«ln05»}{«ln98»}=«ratio»$$
          （$\ln0.98<0$ で割るので不等号の向きが変わる。）

          **答え** 最小の整数は $n=«nmin»$

          **間違えやすい点** «ratio» を切り捨てた «c_low» では $0.98^{«c_low»}\approx0.0504>0.05$ で、わずかに足りない。
          よく使う概算「$3/p$」は $«c_rule3»$ で近いが、最小の値ではない。期待人数 $np\ge0.95$ から $n=«c_wrong»$ とするのは「少なくとも 1 人含む確率」とは別の条件。

  - id: s27p06
    title: イベント開催日数と月間観光客数
    context: |
      ある町で、8 か月分の「月の週末イベント開催日数 $x$」と「月間観光客数 $y$（千人）」に単回帰モデル $y=\alpha+\beta x+\varepsilon$ を最小二乗法で当てはめた。
      誤差は互いに独立に $N(0,\sigma^2)$ に従うとする。データの要約は次の通り（$S_{xx}$ などは偏差平方和・偏差積和）。

      $n=«n»$、$\bar x=«xb»$、$\bar y=«yb»$、$S_{xx}=«Sxx»$、$S_{xy}=«Sxy»$、$S_{yy}=«Syy»$
    items:
      - id: s27p06a
        chapter: 16
        terms: [least-squares-method, regression-coefficient-t-test, coefficient-of-determination]
        topic: 要約統計量から単回帰の傾きの推定値と残差平方和を求め傾きのt値を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          傾き $\beta$ について $H_0:\beta=0$ を検定する $t$ 統計量の値に最も近いものはどれか。誤差分散は残差平方和を残差の自由度で割って推定する。
        choices:
          - '$«t_syy»$'
          - '$«t»$'
          - '$«t_n1»$'
          - '$«t_n»$'
          - '$«t_nosqrt»$'
        answer: 1
        distractors:
          - 残差平方和の代わりに S_yy をそのまま使った
          - 正解
          - 誤差分散を n−1 で割った
          - 誤差分散を n で割った
          - 標準誤差の平方根をとり忘れ、s²/S_xx で割った
        explanation: |
          **方針** $\hat\beta=S_{xy}/S_{xx}$、残差平方和 $\mathrm{RSS}=S_{yy}-\hat\beta S_{xy}$、$s^2=\mathrm{RSS}/(n-2)$、標準誤差 $\sqrt{s^2/S_{xx}}$ の順に求める。

          **途中式**
          $$\hat\beta=\frac{«Sxy»}{«Sxx»}=«b»,\qquad \mathrm{RSS}=«Syy»-«b»\times«Sxy»=«Syy»-«bSxy»=«rss»$$
          $$s^2=\frac{«rss»}{«n»-2}=«s2»,\qquad \mathrm{SE}(\hat\beta)=\sqrt{\frac{«s2»}{«Sxx»}}=\sqrt{«s2Sxx»}=«se»$$
          $$t=\frac{«b»}{«se»}=«t»\quad(\text{自由度 }«df»)$$

          **答え** $«t»$

          **間違えやすい点** 単回帰では切片と傾きの 2 つを推定するので、誤差分散の分母は $n-2=«df»$。$n$ で割ると $«t_n»$、$n-1$ で割ると $«t_n1»$ になる。
          $S_{yy}$ は回帰で説明される分も含むので、残差平方和の代わりに使うと $«t_syy»$ と小さくなりすぎる。

      - id: s27p06b
        chapter: 17
        terms: [residual, least-squares-method, normal-equations]
        topic: 最小二乗残差の和が0で説明変数との積和も0になる性質から読めなくなった2か月分の残差を求める
        level: 基本
        definition: false
        type: choice
        question: |
          報告書には 8 か月分の残差 $e_i=y_i-\hat y_i$ が載っていたが、2 か月分（$x=9$ と $x=11$ の月）が汚れて読めなくなった。

          | $x$ | «x0» | «x1» | «x2» | «x3» | «x4» | «x5» | «x6» | «x7» |
          |---|---|---|---|---|---|---|---|---|
          | 残差 $e$ | «e0» | «e1» | «e2» | «e3» | «e4» | ? | ? | «e7» |

          $x=9$ の月の残差に最も近い値はどれか。
        choices:
          - '$«c_sum»$'
          - '$«c_half»$'
          - '$«c_e9»$'
          - '$«c_flip»$'
          - '$«c_e11»$'
        answer: 2
        distractors:
          - 読めた残差の和をそのまま答えた（符号も逆）
          - 残差の和が 0 の条件だけを使い、2 か月に等分した
          - 正解
          - 連立方程式の符号を取り違えた
          - x=11 の月の残差と取り違えた
        explanation: |
          **方針** 切片を含む最小二乗法では、正規方程式から $\sum e_i=0$ と $\sum x_ie_i=0$ が成り立つ。読めない 2 つの残差 $u=e_{(x=9)}$、$v=e_{(x=11)}$ について連立方程式を作る。

          **途中式** 読めた 6 つの残差の和は $«sek»$、$x$ との積和は
          $«x0»\times«e0»+«x1»\times(«e1»)+«x2»\times«e2»+«x3»\times(«e3»)+«x4»\times«e4»+«x7»\times(«e7»)=«sxek»$。
          $$u+v=«msek»,\qquad 9u+11v=«msxek»$$
          1 つ目の式を 11 倍して 2 つ目を引くと $2u=11\times«msek»-«msxek»=-3.0$ なので $u=«e9»$、$v=«msek»-u=«e11»$。

          **答え** $«c_e9»$

          **間違えやすい点** $\sum e_i=0$ だけでは 2 つの未知数は決まらない（等分すると $«c_half»$）。もう 1 つの条件 $\sum x_ie_i=0$ は、残差が説明変数と直交すること（正規方程式の 2 本目）から来る。
          なお前問の当てはめ $\hat y=«a»+«b»x$ から $y$ を知っていれば直接計算できるが、ここでは $y$ が分からなくても性質だけで求まる。

  - id: s27p07
    title: 若者の移住意向のロジスティック回帰
    context: |
      県が都市部の 20〜30 代 «n» 人に「地方への移住に関心があるか」を尋ね、関心の有無を目的変数とするロジスティック回帰を当てはめた。
      切片だけのモデルの最大対数尤度は $«l0»$、年齢・テレワークの可否・出身地・子どもの有無の «k» 個の説明変数（と切片）を入れたモデルの最大対数尤度は $«l1»$ だった。
    items:
      - id: s27p07a
        chapter: 18
        terms: [logistic-regression, deviance, logistic-likelihood-estimation]
        topic: 移住意向のロジスティック回帰の対数尤度から切片のみのモデルと比べたマクファデンの擬似決定係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          マクファデンの擬似決定係数 $R^2_{\mathrm{McF}}=1-\dfrac{\ell_1}{\ell_0}$（$\ell_0$：切片のみのモデル、$\ell_1$：説明変数を入れたモデルの最大対数尤度。自由度の調整はしない）に最も近い値はどれか。
        choices:
          - '$«c_ratio»$'
          - '$«c_half»$'
          - '$«mcf»$'
          - '$«c_inv»$'
          - '$«c_adj»$'
        answer: 2
        distractors:
          - 1 から引くのを忘れ、比 ℓ1/ℓ0 を答えた
          - 逸脱度の差を 2ℓ0 で割るつもりで 2 を余分に掛けて割った（半分にした）
          - 正解
          - 分母と分子を逆にして ℓ0/ℓ1 − 1 とした
          - 説明変数の個数で調整した値 1−(ℓ1−k)/ℓ0 を答えた
        explanation: |
          **方針** 対数尤度は負なので、モデルがよく当てはまるほど $\ell_1$ は 0 に近づき、比 $\ell_1/\ell_0$ は 1 より小さくなる。

          **途中式**
          $$R^2_{\mathrm{McF}}=1-\frac{«l1»}{«l0»}=1-«ratio»=«mcf»$$
          同じことを逸脱度で書くと、$-2\ell$ の減少量 $2(\ell_1-\ell_0)=«lr»$ を $-2\ell_0$ で割った値になる。

          **答え** $«mcf»$

          **間違えやすい点** 比 $«c_ratio»$ そのものではなく 1 から引く。逆比で $\ell_0/\ell_1-1=«c_inv»$ とするのも誤り。
          自由度で調整した値 $1-(\ell_1-k)/\ell_0=«c_adj»$ は別の指標である。マクファデンの値は 0.2〜0.4 でもかなりよい当てはめとされ、線形回帰の $R^2$ と同じ目安では読まない。

  - id: s27p08
    title: 観光需要の予測モデル
    context: |
      県は、翌月の宿泊者数を予測するモデルを検討している。
    items:
      - id: s27p08a
        chapter: 19
        terms: [elastic-net, lasso, ridge-regression, regularization]
        topic: 直交化した説明変数のエラスティックネット推定値を最小二乗推定値の軟閾値処理と縮小で求める
        level: 標準
        definition: false
        type: choice
        question: |
          標準化して互いに直交させた 3 つの説明変数（$X^\top X=I$）を使う。最小二乗推定値は $\hat\beta^{\mathrm{OLS}}=(«b1»,\ «b2»,\ «b3»)$ だった。
          目的関数
          $$\frac12\|y-X\beta\|^2+\lambda_1\sum_{j}|\beta_j|+\frac{\lambda_2}{2}\sum_j\beta_j^2,\qquad \lambda_1=«l1»,\ \lambda_2=«l2»$$
          を最小にするエラスティックネット推定値として正しいものはどれか。
        choices:
          - '$«lasso»$'
          - '$«ridge»$'
          - '$«rev»$'
          - '$«two»$'
          - '$«en»$'
        answer: 4
        distractors:
          - L2 の罰則による縮小 1/(1+λ2) を忘れ、ラッソの推定値にした
          - L1 の罰則を忘れ、リッジ回帰の推定値にした
          - 先に 1/(1+λ2) で縮小してから軟閾値処理をした
          - 縮小の係数を 1/(1+2λ2) とした（λ2/2 の 1/2 を見落とした）
          - 正解
        explanation: |
          **方針** $X^\top X=I$ なら目的関数は係数ごとに分かれ、各 $j$ について $\frac12(\beta_j-\hat\beta_j)^2+\lambda_1|\beta_j|+\frac{\lambda_2}{2}\beta_j^2$ を最小にすればよい（$\hat\beta_j$ は最小二乗推定値）。

          **途中式** $\beta_j>0$ の範囲で微分して 0 とおくと $\beta_j-\hat\beta_j+\lambda_1+\lambda_2\beta_j=0$、つまり $\beta_j=(\hat\beta_j-\lambda_1)/(1+\lambda_2)$。負の側も同様で、まとめると
          $$\tilde\beta_j=\frac{\mathrm{sign}(\hat\beta_j)\,(|\hat\beta_j|-\lambda_1)_+}{1+\lambda_2}$$
          軟閾値処理で $(«st1»,\ «st2»,\ 0)$（$|«b3»|<«l1»$ なので第 3 係数は 0）、これを $«l2p»$ で割る。

          **答え** $«en»$

          **間違えやすい点** 軟閾値処理（ラッソの部分）と $1/(1+\lambda_2)$ の縮小（リッジの部分）の順は、上の式の通り「閾値処理してから割る」。逆にすると $«rev»$ になる。
          L2 の罰則が $\frac{\lambda_2}{2}\sum\beta_j^2$ と 1/2 付きで書かれているので、縮小は $1/(1+\lambda_2)$ で、$1/(1+2\lambda_2)$ ではない。

      - id: s27p08b
        chapter: 30
        terms: [bias-variance-tradeoff, generalization-error, overfitting]
        topic: 観光客数予測の3モデルの期待予測二乗誤差をバイアスの2乗・分散・誤差分散に分解して比べる
        level: 標準
        definition: false
        type: choice
        question: |
          ある月の条件のもとで、3 つの候補モデルの予測値 $\hat f$ について、シミュレーションで次の値が得られた（単位は宿泊者数の千人）。
          新しい観測値 $y=f+\varepsilon$ の誤差 $\varepsilon$ は予測値と独立で、平均 0、分散 $\sigma^2=«sig2»$ とする。

          | モデル | バイアス $E[\hat f]-f$ | 分散 $V[\hat f]$ |
          |---|---|---|
          | 1（説明変数 2 個） | «bi1» | «va1» |
          | 2（説明変数 5 個） | «bi2» | «va2» |
          | 3（説明変数 12 個） | «bi3» | «va3» |

          期待予測二乗誤差 $E[(y-\hat f)^2]$ が最も小さいモデルとその値の組として正しいものはどれか。
        choices:
          - 'モデル 1、$«w_nosq1»$'
          - 'モデル 1、$«w_var1»$'
          - 'モデル 2、$«w_noise2»$'
          - 'モデル 2、$«epe2»$'
          - 'モデル 3、$«epe3»$'
        answer: 3
        distractors:
          - バイアスを 2 乗せずに足した
          - バイアスを無視して誤差分散と分散だけで比べた
          - 誤差分散 σ² を足し忘れた
          - 正解
          - バイアスが最も小さいモデルを選んだ
        explanation: |
          **方針** $\varepsilon$ と $\hat f$ が独立なので $E[(y-\hat f)^2]=\sigma^2+(E[\hat f]-f)^2+V[\hat f]$（誤差分散 + バイアスの 2 乗 + 分散）。

          **途中式**
          - モデル 1：$«sig2»+«bs1»+«va1»=«epe1»$
          - モデル 2：$«sig2»+«bs2»+«va2»=«epe2»$
          - モデル 3：$«sig2»+«bs3»+«va3»=«epe3»$

          **答え** モデル 2、$«epe2»$

          **間違えやすい点** 説明変数を増やすとバイアスは減るが分散が増える（モデル 3 は過学習気味）。バイアスが最小という理由だけでモデル 3 を選ぶのは誤り。
          バイアスは 2 乗して足す（2 乗しないとモデル 1 の $«w_nosq1»$ が最小に見える）。$\sigma^2$ はどのモデルでも同じなので順位は変わらないが、値を答えるときは足す必要がある。

  - id: s27p09
    title: 観光施設のリニューアル効果
    context: |
      市営の歴史資料館を改装した。改装の効果を、来館者の満足度と滞在時間で調べる。
    items:
      - id: s27p09a
        chapter: 13
        terms: [sign-test, binomial-distribution, p-value]
        topic: 改装前後に同じ常連客がつけた満足度の上下を符号検定で調べ同点を除いた正確な片側p値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          改装前と改装後の両方に来館した常連客 «m» 人が、それぞれの回に満足度を 10 段階でつけた。改装後のほうが高かった人は «up» 人、
          低かった人は «down» 人、同じだった人は «tie» 人だった。「改装で満足度が上がった」を対立仮説とする**符号検定**を行う。
          同じだった人は除いて検定するとき、正確な片側 p 値に最も近いものはどれか。
        choices:
          - '$«c_strict»$'
          - '$«c_eq»$'
          - '$«p»$'
          - '$«c_two»$'
          - '$«c_tie»$'
        answer: 2
        distractors:
          - 観測値そのもの（9 人）を含めず P(X≥10) とした
          - 観測値ちょうどの確率 P(X=9) だけを答えた
          - 正解
          - 両側の p 値（2 倍）を答えた
          - 同点の 1 人を除かず n=12 として計算した
        explanation: |
          **方針** 同点を除いた $n=«nn_»$ 人について、帰無仮説（上がる・下がるが半々）のもとで「上がった人数」$X$ は $B(«nn_»,\,1/2)$ に従う。p 値は観測値以上に極端な $P(X\ge«up»)$。

          **途中式**
          $$P(X\ge«up»)=\frac{\binom{11}{9}+\binom{11}{10}+\binom{11}{11}}{2^{11}}=\frac{«c9»+«c10»+«c11»}{«two_n»}=\frac{«cnum»}{«two_n»}=«p4»\cdots$$

          **答え** $«p»$（有意水準 5% なら、満足度が上がったといえる）

          **間違えやすい点** p 値は観測値「以上」なので $X=«up»$ を含める（含めないと $«c_strict»$）。片側の対立仮説なので 2 倍しない（$«c_two»$）。
          同点を残して $n=12$ とすると $«c_tie»$ になる。符号検定では差が 0 の組は情報をもたないので除くのが標準的な扱い。

      - id: s27p09b
        chapter: 10
        terms: [power-function, one-sided-two-sided-test, type-i-and-ii-errors]
        topic: 既知の標準偏差での平均滞在時間の片側z検定の検出力を想定した増加量から求める
        level: 標準
        definition: false
        type: choice
        question: |
          改装前の平均滞在時間は «mu0» 分で、標準偏差は $\sigma=«sig»$ 分（既知）とみなせる。改装後の来館者 «nsur» 人の平均滞在時間 $\bar X$ を使い、
          $H_0:\mu=«mu0»$、$H_1:\mu>«mu0»$ の片側 $z$ 検定を有意水準 5% で行う（上側 5% 点 «zc»）。
          真の平均が «mu1» 分のとき、この検定の検出力に最も近い値はどれか。必要なら
          $\Phi(«z1»)=«phi1»$、$\Phi(«z2»)=«phi2»$、$\Phi(«z3»)=«phi3»$（$\Phi$ は標準正規分布の分布関数）を使え。
        choices:
          - '$«c_sig»$'
          - '$«c_beta»$'
          - '$«c_two_s»$'
          - '$«pw»$'
          - '$«c_one»$'
        answer: 3
        distractors:
          - 標準誤差 σ/√n ではなく σ そのもので標準化した
          - 検出力ではなく第2種の誤りの確率 β=1−検出力を答えた
          - 片側検定なのに両側の棄却限界 1.96 を使った
          - 正解
          - 標準誤差を σ/n とし、検出力がほぼ 1 になった
        explanation: |
          **方針** 棄却域は $\bar X>«mu0»+«zc»\,\sigma/\sqrt n$。真の平均 «mu1» のもとでこの事象が起こる確率を求める。

          **途中式** 標準誤差は $\sigma/\sqrt n=«sig»/\sqrt{«nsur»}=«se»$。
          $$P\left(\bar X>«mu0»+«zc»\times«se»\ \middle|\ \mu=«mu1»\right)=P\left(Z>«zc»-\frac{«mu1»-«mu0»}{«se»}\right)=P(Z>«zc»-«d»)=\Phi(«z1»)=«phi1»$$

          **答え** $«pw»$

          **間違えやすい点** 検出力 $1-\beta$ と第 2 種の誤りの確率 $\beta=«c_beta»$ を取り違えない。片側検定なので棄却限界は «zc»（1.96 を使うと $\Phi(«z2»)=«c_two_s»$）。
          標準化には $\bar X$ の標準偏差 $\sigma/\sqrt n$ を使う（$\sigma$ で割ると $1-\Phi(«z3»)=«c_sig»$ になってしまう）。

  - id: s27p10
    title: 観光PR施策の要因実験
    context: |
      観光協会は、3 つの PR 施策の効果を 2 水準の要因実験で調べる。
      因子 $A$：SNS 広告（なし・あり）、因子 $B$：パンフレットの多言語化（なし・あり）、因子 $C$：週末イベント（なし・あり）。
      処理の組合せを、「あり」の因子の小文字を並べて $(1)$（すべてなし）、$a$、$b$、$ab$、$c$、$ac$、$bc$、$abc$ と書く。
      8 通りの組合せを 2 つの地区（ブロック）に 4 通りずつ割り付けて 1 か月間試す。地区の違いは観光客数に大きく影響すると考えられる。
    items:
      - id: s27p10a
        chapter: 20
        terms: [confounding, factorial-design, randomized-block-design]
        topic: 3因子の2水準要因実験を2地区のブロックに分けるとき3因子交互作用ABCをブロックと交絡させる割り付けを選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          主効果と 2 因子交互作用はすべて推定したいので、3 因子交互作用 $ABC$ をブロック（地区）と交絡させる。正しいものはどれか。
        choices:
          - '一方の地区に $(1),\ a,\ b,\ c$、もう一方に $ab,\ ac,\ bc,\ abc$ を割り付ける。このとき $ABC$ がブロックと交絡する'
          - '一方の地区に $(1),\ a,\ bc,\ abc$、もう一方に $b,\ c,\ ab,\ ac$ を割り付ける。このとき $ABC$ がブロックと交絡する'
          - '一方の地区に $(1),\ ab,\ ac,\ bc$、もう一方に $a,\ b,\ c,\ abc$ を割り付ける。このとき $ABC$ がブロックと交絡し、ほかの 6 つの効果はブロックの影響を受けずに推定できる'
          - '一方の地区に $(1),\ ab,\ ac,\ bc$、もう一方に $a,\ b,\ c,\ abc$ を割り付ける。このとき主効果 $A$ もブロックと交絡するので、$A$ は推定できない'
          - 'どの割り付けでも、地区の差はすべての効果の推定値に同じ大きさで加わる。交絡させる効果を選ぶことはできない'
        answer: 2
        distractors:
          - 「あり」の数が 0・1 個と 2・3 個で分けた。この分け方の符号は (A+B+C−ABC)/2 なので、ブロックの差が主効果 A・B・C と ABC のすべてに入る
          - BC の符号で分けた割り付けで、交絡するのは ABC ではなく BC
          - 正解
          - 割り付けは正しいが、主効果 A の対比は各ブロックに + と − を 2 つずつ含むのでブロックと交絡しない
          - ブロックの差は交絡させた効果の対比にだけ入り、ほかの効果の対比では打ち消し合う
        explanation: |
          **方針** $ABC$ の対比の符号は、$a,b,c$ のうち「あり」の数が奇数なら $+$、偶数なら $-$。この符号でブロックを分けると、ブロックの差は $ABC$ の対比だけに入る。

          **途中式** 「あり」の数が偶数（0 または 2）の組合せ：$(1),\ ab,\ ac,\ bc$（$ABC$ の符号 $-$）。奇数（1 または 3）：$a,\ b,\ c,\ abc$（符号 $+$）。
          たとえば主効果 $A$ の対比は $a,ab,ac,abc$ が $+$、$(1),b,c,bc$ が $-$ で、各ブロックに $+$ と $-$ が 2 つずつ入るので、ブロックの差は打ち消される。$AB$ など 2 因子交互作用も同様。

          **答え** 選択肢 2（$(1),ab,ac,bc$ と $a,b,c,abc$ に分け、$ABC$ だけがブロックと交絡する）

          **間違えやすい点** $(1),a,bc,abc$ と $b,c,ab,ac$ に分けると、$BC$ の符号（$b$ と $c$ がともにある・ともにない で $+$）でそろうので、交絡するのは $BC$ になる。
          $(1),a,b,c$ と $ab,ac,bc,abc$ の分け方は「あり」が 2 個以上かどうかで分けており、その符号は $(A+B+C-ABC)/2$ と書けるので、ブロックの差が主効果 $A$・$B$・$C$ と $ABC$ のすべてに入ってしまう。

  - id: s27p11
    title: 市町村の地域指標の多変量解析
    context: |
      県内の市町村について、4 つの地域指標 $T$：人口あたり観光客数、$H$：人口あたり宿泊施設数、$F$：人口あたり飲食店数、$A$：高齢化率 を集めた。
    items:
      - id: s27p11a
        chapter: 22
        terms: [pca-on-correlation-matrix, principal-component-loading, biplot, low-rank-approximation]
        topic: 相関行列の主成分分析の上位2主成分の負荷量の内積で2指標の相関を近似する（ランク2近似とバイプロット）
        level: 標準
        definition: false
        type: choice
        question: |
          4 指標の相関行列で主成分分析を行った。上位 2 つの主成分の固有値は $\lambda_1=«lam1»$、$\lambda_2=«lam2»$（累積寄与率 «cum»%）で、
          主成分負荷量（各指標と主成分得点の相関係数）は次の通りだった。

          | 指標 | $T$ | $H$ | $F$ | $A$ |
          |---|---|---|---|---|
          | 第 1 主成分 | «T1» | «H1» | «F1» | «A1» |
          | 第 2 主成分 | «T2» | «H2» | «F2» | «A2» |

          上位 2 つの主成分だけで相関行列を近似する（ランク 2 近似）とき、$F$ と $A$ の相関係数の近似値に最も近いものはどれか。
        choices:
          - '$«c_sign»$'
          - '$«c_pc1»$'
          - '$«c_pc2»$'
          - '$«r2»$'
          - '$«c_cos»$'
        answer: 3
        distractors:
          - 第 2 主成分の項の符号を取り違えて引いた
          - 第 1 主成分の負荷量の積だけを使った
          - 第 2 主成分の負荷量の積だけを使った
          - 正解
          - 2 次元の負荷量ベクトルの間の角度の余弦（長さで割った値）を答えた
        explanation: |
          **方針** 相関行列は $R=\sum_k\lambda_k v_kv_k^\top=\sum_k \ell_k\ell_k^\top$（$\ell_k=\sqrt{\lambda_k}v_k$ は第 $k$ 主成分の負荷量のベクトル）と分解できる。上位 2 項だけ残すと、$(F,A)$ 成分は 2 つの負荷量の積の和になる。

          **途中式**
          $$r_{FA}\approx \ell_{F1}\ell_{A1}+\ell_{F2}\ell_{A2}=«F1»\times«A1»+(«F2»)\times(«A2»)=«p1»+«p2»=«r2_4»$$

          **答え** $«r2»$

          **間違えやすい点** 第 1 主成分だけでは $«c_pc1»$ で、高齢化率と飲食店数の関係はおもに第 2 主成分が担っている。負の負荷量どうしの積は正になる（符号を誤ると $«c_sign»$）。
          バイプロットの矢印の角度の余弦 $«c_cos»$ は、両者の長さ（$\sqrt{«comF»}$ と $\sqrt{«comA»}$）で割った値で、上位 2 主成分による近似値そのものではない。指標が 2 次元でよく表される（長さが 1 に近い）ときに限り、両者は近くなる。

      - id: s27p11b
        chapter: 25
        terms: [undirected-graphical-model, precision-matrix, graphical-model]
        topic: 地域経済指標の無向グラフィカルモデルで頂点の分離から条件付き独立を読み取り精度行列の0成分と対応させる
        level: 標準
        definition: false
        type: choice
        question: |
          別の分析で、5 つの指標 $T$（観光客数）、$H$（宿泊施設数）、$E$（雇用者数）、$P$（人口）、$R$（税収）が多変量正規分布に従うとみなし、
          ガウス型の無向グラフィカルモデルを当てはめたところ、辺は $T-H$、$H-E$、$E-R$、$E-P$、$P-R$ の 5 本だった（ほかの組には辺がない）。正しいものはどれか。
        choices:
          - '$T$ と $R$ は、$P$ を与えたもとで条件付き独立である'
          - '$E$ と $R$ は、$P$ を与えたもとで条件付き独立である'
          - '$H$ と $P$ は、ほかの変数を与えなくても（周辺で）独立である'
          - '精度行列（分散共分散行列の逆行列）の $(T,H)$ 成分は 0 である'
          - '$T$ と $E$ は、$H$ を与えたもとで条件付き独立である'
        answer: 4
        distractors:
          - T から R へは H と E を通る経路があり、P だけでは分離されない
          - E と R の間には直接の辺がある
          - H−E−P という経路があり、周辺では一般に相関する
          - 辺のある組の精度行列の成分は 0 ではない（辺がない組が 0）
          - 正解
        explanation: |
          **方針** 無向グラフィカルモデルでは、頂点の集合 $S$ が $X$ と $Y$ を結ぶすべての経路を通るなら（$S$ が分離するなら）、$S$ を与えたもとで $X$ と $Y$ は条件付き独立。ガウス型では、辺がない組の精度行列の成分が 0（残り全部を与えた偏相関が 0）に対応する。

          **途中式** $T$ につながる辺は $T-H$ だけなので、$T$ からほかの頂点へ行く経路は必ず $H$ を通る。よって $H$ は $T$ と $E$ を分離し、$T\perp E\mid H$。
          一方、$T$ から $R$ へは $T-H-E-R$ の経路が $P$ を通らないので、$P$ だけでは分離されない。$E$ と $R$ には直接の辺があるので、何を与えても分離されない。

          **答え** 選択肢 4（$T$ と $E$ は $H$ を与えたもとで条件付き独立）

          **間違えやすい点** 辺がないことは「周辺で独立」ではなく「ほかのすべてを与えたもとで条件付き独立」を意味する。$H$ と $P$ は辺がなくても $H-E-P$ の経路を通じて相関しうる。
          精度行列の 0 成分は辺の**ない**組に対応し、$(T,H)$ のように辺のある組の成分は 0 ではない。

  - id: s27p12
    title: ボランティアガイドの利用と満足度
    context: |
      市は、観光ボランティアガイドを利用した観光客の満足度が高いかを調べた。観光客の層が異なる 2 つの地区で、次の結果を得た。

      | 地区 | ガイド | 満足 | 不満 | 計 |
      |---|---|---|---|---|
      | 中心市街地 | 利用 | «a1» | «b1» | «r11» |
      | | 利用せず | «c1» | «d1» | «r21» |
      | 郊外 | 利用 | «a2» | «b2» | «r12» |
      | | 利用せず | «c2» | «d2» | «r22» |
    items:
      - id: s27p12a
        chapter: 28
        terms: [mantel-haenszel-test, three-way-table, two-by-two-table]
        topic: 2つの地区で層別した2×2表からコクラン・マンテル・ヘンツェル検定統計量を求めガイド利用と満足の関連を検定する
        level: 応用
        definition: false
        type: numeric
        question: |
          地区で層別したうえで「ガイド利用と満足は条件付き独立（共通オッズ比が 1）」を帰無仮説とする**コクラン・マンテル・ヘンツェル検定**を行う。
          各層の「利用・満足」の度数 $a_k$ について、周辺度数を固定した超幾何分布のもとでの期待値 $E_k$ と分散 $V_k=\dfrac{n_{1k}n_{2k}m_{1k}m_{2k}}{N_k^2(N_k-1)}$
          （$n_{1k},n_{2k}$：利用・利用せずの人数、$m_{1k},m_{2k}$：満足・不満の人数、$N_k$：層の総数）を使い、
          連続修正をしない統計量 $\dfrac{\left(\sum_k a_k-\sum_k E_k\right)^2}{\sum_k V_k}$ の値を求めよ。
        answer: «cmh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 各層で $E_k=n_{1k}m_{1k}/N_k$ と $V_k$ を求め、層をまたいで観測値・期待値・分散をそれぞれ足してから統計量を作る。帰無仮説のもとで自由度 1 のカイ二乗分布に近似的に従う。

          **途中式** 中心市街地：$N_1=«n1»$、$n_{11}=«r11»$、$n_{21}=«r21»$、$m_{11}=«k11»$、$m_{21}=«k21»$。
          $$E_1=\frac{«r11»\times«k11»}{«n1»}=«e1»,\qquad V_1=\frac{«r11»\times«r21»\times«k11»\times«k21»}{«n1»^2\times«n1m1»}=\frac{«vnum1»}{«vden1»}=«v1»$$
          郊外：$N_2=«n2»$、$n_{12}=«r12»$、$n_{22}=«r22»$、$m_{12}=«k12»$、$m_{22}=«k22»$。
          $$E_2=\frac{«r12»\times«k12»}{«n2»}=«e2»,\qquad V_2=\frac{«r12»\times«r22»\times«k12»\times«k22»}{«n2»^2\times«n2m1»}=\frac{«vnum2»}{«vden2»}=«v2»$$
          $$\sum a_k=«a1»+«a2»=«sa»,\quad \sum E_k=«se»,\quad \sum V_k=«sv»$$
          $$\frac{(«sa»-«se»)^2}{«sv»}=\frac{«dev2»}{«sv»}=«cmh4»\cdots$$

          **答え** $«cmh_s»$（自由度 1 のカイ二乗分布の上側 5% 点 «chi05» を超えるので、地区を調整してもガイド利用と満足には関連があるといえる）

          **間違えやすい点** 層ごとの統計量を足すのではなく、$a_k-E_k$ を足してから 2 乗する。分散の分母を $N_k^3$ とする（非条件付きの分散）と $«cmh_n»$、連続修正 $0.5$ を入れると $«cmh_cc»$ になる。
          2 地区を合算した 1 つの 2×2 表でカイ二乗統計量を計算すると $«chi_pool»$ で、地区（交絡の可能性がある因子）を調整していない。

  - id: s27p13
    title: 移住支援と移住者の定着
    context: |
      ある町は、移住者に地域の相談員がつく「伴走支援」を試行した。支援ありの世帯（A 群）6 世帯と、支援なしの世帯（B 群）6 世帯について、
      移住から転出までの月数を追跡した。$+$ は調査終了または連絡が取れなくなったことによる打ち切り（その時点まで町に住んでいたことだけが分かる）を表す。

      - A 群（支援あり）：6, 9+, 11, 15+, 18+, 24+
      - B 群（支援なし）：1, 3, 4, 8+, 10, 13

      転出が起きた各時点のリスク集合（その時点の直前に町に住んでいる世帯数）$n_A$、$n_B$ と転出数 $d_A$、$d_B$ は次の通り。

      | 月 | «t1» | «t2» | «t3» | «t4» | «t5» | «t6» | «t7» |
      |---|---|---|---|---|---|---|---|
      | $n_A$ | «nA1» | «nA2» | «nA3» | «nA4» | «nA5» | «nA6» | «nA7» |
      | $n_B$ | «nB1» | «nB2» | «nB3» | «nB4» | «nB5» | «nB6» | «nB7» |
      | $d_A$ | «dA1» | «dA2» | «dA3» | «dA4» | «dA5» | «dA6» | «dA7» |
      | $d_B$ | «dB1» | «dB2» | «dB3» | «dB4» | «dB5» | «dB6» | «dB7» |
    items:
      - id: s27p13a
        chapter: 29
        terms: [log-rank-test, censored-data, kaplan-meier-estimator]
        topic: 打ち切りを含む2群の移住世帯の転出までの月数をログランク検定の統計量で比べる
        level: 応用
        definition: false
        type: numeric
        question: |
          「2 群の転出のハザードは等しい」を帰無仮説とする**ログランク検定**を行う。各時点で、A 群の転出数の期待値
          $e_A=d\,n_A/n$ と分散 $v_A=\dfrac{d\,n_An_B(n-d)}{n^2(n-1)}$（$n=n_A+n_B$、$d=d_A+d_B$）を求めて足し合わせ、
          統計量 $\chi^2=\dfrac{(O_A-E_A)^2}{V_A}$（$O_A=\sum d_A$、$E_A=\sum e_A$、$V_A=\sum v_A$）の値を求めよ。
        answer: «chi»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 転出が起きた時点ごとに、2 群を合わせたリスク集合から「A 群から何世帯転出するはずか」を超幾何分布で考え、期待値と分散を足し合わせる。

          **途中式** どの時点も $d=1$ なので $e_A=n_A/n$、$v_A=n_An_B/n^2$。

          | 月 | «t1» | «t2» | «t3» | «t4» | «t5» | «t6» | «t7» |
          |---|---|---|---|---|---|---|---|
          | $e_A$ | «eA1» | «eA2» | «eA3» | «eA4» | «eA5» | «eA6» | «eA7» |
          | $v_A$ | «vA1» | «vA2» | «vA3» | «vA4» | «vA5» | «vA6» | «vA7» |

          $O_A=«OA»$、$E_A=«EA»$、$V_A=«VA»$。
          $$\chi^2=\frac{(«OA»-«EA»)^2}{«VA»}=\frac{«dev2»}{«VA»}=«chi4»\cdots$$

          **答え** $«chi_s»$（自由度 1 のカイ二乗分布の上側 5% 点 «chi05» を超えるので、有意水準 5% で 2 群の転出のしやすさに差があるといえる。支援ありの群のほうが転出が少ない）

          **間違えやすい点** 打ち切られた世帯は、打ち切りの時点まではリスク集合に入れる（たとえば 9+ の世帯は 10 か月目の時点では数えない）。
          分散の代わりに期待値で割る近似 $\dfrac{(O_A-E_A)^2}{E_A}+\dfrac{(O_B-E_B)^2}{E_B}$（$O_B=«OB»$、$E_B=«EB»$）を使うと $«chi_oe»$ になり、問われている統計量とは異なる。

  - id: s27p14
    title: 住民の地域愛着の構造方程式モデル
    context: |
      ある市の住民意識調査で、「地域への愛着」「近所づきあい」「行政への信頼」の 3 つの潜在変数と、それぞれを測る 3 項目ずつ計 9 項目からなる構造方程式モデルを当てはめた。
      当てはめたモデルの適合度カイ二乗統計量は $\chi^2_M=«cm»$（自由度 $df_M=«dm»$）、9 項目が互いに無相関であるとする独立モデル（ベースラインモデル）では $\chi^2_B=«cb»$（自由度 $df_B=«db»$）だった。
    items:
      - id: s27p14a
        chapter: 26
        terms: [structural-equation-modeling, goodness-of-fit-indices]
        topic: 住民の地域愛着の構造方程式モデルと独立モデルのカイ二乗と自由度からCFIを求めNFI・TLIと区別する
        level: 標準
        definition: false
        type: numeric
        question: |
          比較適合度指標
          $$\mathrm{CFI}=1-\frac{\max(\chi^2_M-df_M,\,0)}{\max(\chi^2_B-df_B,\ \chi^2_M-df_M,\ 0)}$$
          の値を求めよ。
        answer: «cfi»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** CFI は「カイ二乗から自由度を引いた値」（非心度の推定値）で、当てはめたモデルの悪さを独立モデルの悪さと比べる。

          **途中式** $\chi^2_M-df_M=«cm»-«dm»=«nm»$、$\chi^2_B-df_B=«cb»-«db»=«nb»$。分母は大きいほうの «nb»。
          $$\mathrm{CFI}=1-\frac{«nm»}{«nb»}=«cfi4»\cdots$$

          **答え** $«cfi_s»$（0.95 以上なので、よい当てはめの目安を満たす）

          **間違えやすい点** 自由度を引かずにカイ二乗どうしを比べた $1-\chi^2_M/\chi^2_B=«nfi»$ は NFI（規準適合度指標）。
          カイ二乗を自由度で割った比 $\chi^2/df$ どうしで比べる TLI は $\dfrac{«rb»-«rm»}{«rb»-1}=«tli»$ で、CFI とは別の指標。
