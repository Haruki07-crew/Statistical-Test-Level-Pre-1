set: 24
title: 模擬試験 第24回
minutes: 90
problems:
  - id: s24p01
    title: 月刊誌の定期購読と解約
    context: |
      ある出版社は月刊誌の定期購読（1 か月ごとに自動更新）を、紙版と電子版の 2 つのプランで提供している。
      購読者が解約するまでの期間を分析する。
    items:
      - id: s24p01a
        chapter: 2
        terms: [hazard-function, survival-function, probability-mass-and-density-function]
        topic: 月刊誌の定期購読で月ごとの離散時間ハザードから4か月目にちょうど解約する確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          紙版の新規購読者が解約する月を $T$（$T=1,2,\ldots$、$T=t$ は $t$ か月目の終わりに解約することを表す）とする。
          過去のデータから、離散時間のハザード $h(t)=P(T=t\mid T\ge t)$ が次のように推定されている。

          | $t$（か月目） | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | $h(t)$ | «h1» | «h2» | «h3» | «h4» |

          新規購読者が**ちょうど 4 か月目**に解約する確率 $P(T=4)$ に最も近い値はどれか。
        choices:
          - '$«h4»$'
          - '$«w_sum»$'
          - '$«pa»$'
          - '$«surv4»$'
          - '$«atrisk4»$'
        answer: 2
        distractors:
          - 条件付き確率であるハザード h(4) をそのまま同時の確率 P(T=4) とした
          - 3 か月目までの生存確率を 1-(h(1)+h(2)+h(3)) とハザードの和で作った
          - 正解
          - 4 か月目も解約しない確率 P(T>4)（生存関数 S(4)）を答えた
          - 4 か月目に入る確率 P(T≥4) を答え、h(4) を掛け忘れた
        explanation: |
          **方針** 離散時間では「$t-1$ か月目までは解約せず、$t$ か月目に解約する」確率は、各月を生き残る条件付き確率 $1-h(k)$ を順に掛け、最後に $h(t)$ を掛けて求める：
          $P(T=t)=h(t)\prod_{k=1}^{t-1}\{1-h(k)\}$。

          **途中式** 4 か月目に入る（3 か月目まで解約しない）確率は
          $$P(T\ge4)=(1-«h1»)(1-«h2»)(1-«h3»)=«q1»\times«q2»\times«q3»=«S3»$$
          よって
          $$P(T=4)=P(T\ge4)\,h(4)=«S3»\times«h4»=«pa5»$$

          **答え** $«pa»$

          **間違えやすい点** $h(4)=«h4»$ は「4 か月目に入った人のうち」解約する割合（条件付き確率）であり、新規購読者全体から見た確率ではない。
          生存確率をハザードの和で $1-«hsum3»$ と作ると $«w_sum»$ になるが、生存は足し算ではなく $1-h(k)$ の掛け算で減っていく。
          $«atrisk4»$ は $P(T\ge4)$、$«surv4»$ は $P(T>4)=P(T\ge4)\{1-h(4)\}$ である。

      - id: s24p01b
        chapter: 29
        terms: [hazard-ratio, censored-data, exponential-distribution]
        topic: 打ち切りを含む電子版と紙版の購読期間に指数モデルを当てはめハザード比の95%信頼区間の上限を解約数から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある期間に購読を始めた人を追跡した。調査終了時にまだ購読中の人は打ち切りとして扱う。各プランの解約数と、全員の観察期間（購読月数）の合計は次のとおりだった。

          | プラン | 解約数 $d$ | 観察期間の合計 $T$（人月） |
          |---|---|---|
          | 電子版 | «d1» | «T1» |
          | 紙版 | «d2» | «T2» |

          各プランの購読期間は解約率（ハザード）$\lambda$ が一定の指数分布に従い、打ち切りは解約と独立とする。$\lambda$ の最尤推定量は $\hat\lambda=d/T$ で、$\log\hat\lambda$ の漸近分散は $1/d$ で近似できる。
          電子版の紙版に対するハザード比 $\lambda_{\text{電子}}/\lambda_{\text{紙}}$ の 95% 信頼区間を、対数ハザード比の正規近似で作るとき、その**上限**を求めよ。
          $\log 2=«ln2»$、標準正規分布の上側 2.5% 点は 1.96 とし、指数部分は小数第 2 位に四捨五入してから次の表を使え。

          | $x$ | 0.16 | 0.54 | 0.75 | 1.06 | 1.23 |
          |---|---|---|---|---|---|
          | $e^{x}$ | «e016» | «e054» | «e075» | «e106» | «e123» |
        answer: «up»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 各プランの解約率を $d/T$ で推定し、比をとる。2 つのプランは独立なので $\log(\text{ハザード比})=\log\hat\lambda_1-\log\hat\lambda_2$ の分散は $1/d_1+1/d_2$。対数尺度で区間を作り、指数をとって戻す。

          **途中式** $\hat\lambda_{\text{電子}}=«d1»/«T1»=«lam1»$、$\hat\lambda_{\text{紙}}=«d2»/«T2»=«lam2»$ より、ハザード比の推定値は $«lam1»/«lam2»=«hr»$、$\log«hr»=«ln2»$。
          $$\mathrm{SE}=\sqrt{\frac{1}{«d1»}+\frac{1}{«d2»}}=\sqrt{«inv1»+«inv2»}=\sqrt{«se2»}=«se»$$
          上限の指数部分は
          $$«ln2»+1.96\times«se»=«ln2»+«mult»=«up_exp»\approx«up_x»$$
          $$\text{上限}=e^{«up_x»}=«e_up»$$
          （下限は $«ln2»-«mult»\approx«lo_x»$ で $e^{«lo_x»}=«e_lo»$。区間は $(«lo_s»,\ «up_s»)$。）

          **答え** $«up_s»$

          **間違えやすい点** ハザード比の尺度で直接 $«hr»\pm1.96\times\mathrm{SE}$ とすると上限は $«up_lin»$ になるが、SE は対数尺度の値なので使えない。
          分散は解約数 $d$ だけで決まり（観察期間 $T$ には依存しない）、2 群の分散を**足してから**平方根をとる。$\sqrt{1/«d1»}+\sqrt{1/«d2»}$ と標準誤差を足すと指数部分が $«up_sum_x»$ になり区間が広すぎる。
          打ち切られた人も観察期間 $T$ には含める（除くと解約率を過大に推定する）。

  - id: s24p02
    title: 広告予算の配分と読者調査の設計
    context: |
      ある出版社のマーケティング部門は、新刊のプロモーションの効率と、読者の広告認知を調べている。
    items:
      - id: s24p02a
        chapter: 3
        terms: [conditional-variance, conditional-expectation, expectation-variance-properties]
        topic: 販促日と通常日で平均と標準偏差が異なる1日の注文数の全体の平均と標準偏差を全分散の公式で求める
        level: 基本
        definition: false
        type: choice
        question: |
          新刊の 1 日の注文数は、販促を行う日（全体の «pp»）には平均 «m1»、標準偏差 «s1»、販促のない日（全体の «qq»）には平均 «m0»、標準偏差 «s0» である。
          販促の有無を区別しないとき、1 日の注文数の標準偏差に最も近いものはどれか。
        choices:
          - '$«sd»$'
          - '$«w_ev»$'
          - '$«w_avg»$'
          - '$«w_ve»$'
          - '$«w_ind»$'
        answer: 0
        distractors:
          - 正解
          - 条件付き分散の期待値だけで、平均の違いによる分散を落とした
          - 標準偏差を割合で加重平均した
          - 平均の違いによる分散だけで、それぞれの日の中のばらつきを落とした
          - 独立な確率変数の和 0.3X+0.7Y の分散と取り違えた
        explanation: |
          **方針** 販促の有無を $D$ とすると、全分散の公式 $V[X]=E[V[X\mid D]]+V[E[X\mid D]]$。

          **途中式**
          - 全体の平均：$«pp»\times«m1»+«qq»\times«m0»=«E»$
          - $E[V[X\mid D]]=«pp»\times«s1»^2+«qq»\times«s0»^2=«ev»$
          - $V[E[X\mid D]]=«pp»\times«m1»^2+«qq»\times«m0»^2-«E»^2=«e2»-841=«ve»$
          - $V[X]=«ev»+«ve»=«V»$、標準偏差 $\sqrt{«V»}=«sd»$

          **答え** $«sd»$

          **間違えやすい点** 販促日と通常日で平均が大きく違うので、平均の違いによる分散 «ve» の方が大きい。日の中のばらつき（«ev»）だけを見ると、全体のばらつきを大きく見誤る。
          確率 0.3 と 0.7 で分布を選ぶ「混合」は、2 つの量を 0.3 倍と 0.7 倍して足す「線形結合」とは別物である。
      - id: s24p02b
        chapter: 21
        terms: [sampling-weight, design-effect, stratified-sampling]
        topic: 若年層を多めに抽出した読者調査の抽出ウェイトからキッシュの近似式で設計効果と有効標本サイズを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          広告の認知率を調べる読者調査で、若年層の回答を十分に集めるため、年代ごとに抽出率を変えて無作為抽出した。

          | 年代 | 読者数 $N_h$ | 標本数 $n_h$ | 広告を覚えていた割合 |
          |---|---|---|---|
          | 10〜20代 | $«N1s»$ | «nn1» | «pp1» |
          | 30代以上 | $«N2s»$ | «nn2» | «pp2» |

          各回答者に抽出ウェイト $w_i=N_h/n_h$（抽出率の逆数）を付けて全体の認知率を推定する。
          ウェイトがばらつくことによる精度の低下を、キッシュの近似式による設計効果 $\mathrm{deff}=n\sum_i w_i^2\big/\left(\sum_i w_i\right)^2$（$n$ は全標本数、和は回答者全員についてとる）で評価する。
          この調査の**有効標本サイズ** $n/\mathrm{deff}$ を求めよ。
        answer: «neff»
        tolerance: 0.5
        answer_format: 小数第1位を四捨五入して整数で答えよ。±0.5 の差まで正解とする。
        explanation: |
          **方針** ウェイトは 10〜20 代で $«N1s»/«nn1»=«ww1»$、30 代以上で $«N2s»/«nn2»=«ww2»$。回答者全員についてウェイトの和と 2 乗和を求め、設計効果に代入する。

          **途中式**
          $$\sum_i w_i=«nn1»\times«ww1»+«nn2»\times«ww2»=«sw»,\qquad \sum_i w_i^2=«nn1»\times«w1sq»+«nn2»\times«w2sq»=«sw2»$$
          $$\mathrm{deff}=\frac{«nn»\times«sw2»}{«sw»^2}=\frac{1.36\times10^{10}}{«sw_sq»}=«deff»,\qquad \frac{n}{\mathrm{deff}}=\frac{«nn»}{«deff»}=«neff_s»$$
          （ウェイト付きの認知率の推定値は $(«N1s»\times«pp1»+«N2s»\times«pp2»)/100{,}000=«est_w»$。ウェイトを使わない単純平均 «est_u» は、若年層の多い標本に引きずられて過大になる。）

          **答え** $«neff»$ 人

          **間違えやすい点** 設計効果は 1 以上で、標本数を**割る**（$«nn»\times«deff»=«n_deff_wrong»$ と掛けるのは誤り）。
          ウェイトが等しければ $\mathrm{deff}=1$ で、ばらつくほど大きくなる。過大抽出は若年層の推定には有利だが、全体の推定では «nn» 人分の情報が約 «neff» 人分に減る。

  - id: s24p03
    title: 動画の再生回数の分布
    context: |
      ある動画配信プラットフォームで、投稿された動画の再生回数（単位：千回）の分布をモデル化する。再生回数は右に長く裾を引くので、対数をとってから正規分布を当てはめる。
    items:
      - id: s24p03a
        chapter: 4
        terms: [log-transformation, lognormal-distribution, sum-of-random-variables]
        topic: 独立な対数正規分布に従う2本の動画の再生回数の比の対数が正規分布に従うことから一方が他方の2倍以上になる確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          同じ時期に投稿した 2 本の動画の再生回数 $Y_1$、$Y_2$ は独立で、$\log Y_1$、$\log Y_2$ はともに平均 $\mu$、標準偏差 $\sigma=«sg»$ の正規分布に従う（対数は自然対数）。
          $Y_1$ が $Y_2$ の 2 倍以上になる確率 $P(Y_1\ge2Y_2)$ に最も近いものはどれか。
          必要なら $\log2=«ln2»$、$\sqrt2=«sq2»$、$\Phi(0.35)=«ph35»$、$\Phi(0.49)=«ph49»$、$\Phi(0.69)=«ph69»$ を使え。
        choices:
          - '$«ok»$'
          - '$«w1»$'
          - '$«w2»$'
          - '$«w_ph»$'
          - '$0.500$'
        answer: 0
        distractors:
          - 正解
          - Y2 を定数とみて、log Y1 だけのばらつき σ で割った
          - 差の分散を 2σ² ではなく (2σ)² とした
          - 上側の確率ではなく Φ の値そのものを答えた
          - 2 本の分布が同じでも、2 倍以上になる確率は 1/2 ではない（1/2 なのは Y1>Y2 の確率）
        explanation: |
          **方針** 比の対数は差 $\log Y_1-\log Y_2$ で、独立な正規分布の差なので平均 0、分散 $2\sigma^2$ の正規分布に従う。

          **途中式**
          $$P(Y_1\ge2Y_2)=P(\log Y_1-\log Y_2\ge\log2)=1-\Phi\left(\frac{\log2}{\sqrt2\,\sigma}\right)=1-\Phi\left(\frac{«ln2»}{«sq2»}\right)$$
          $«ln2»/«sq2»=«z4»\approx«z»$ より $1-«ph49»=«ok»$

          **答え** $«ok»$

          **間違えやすい点** 対数をとると、比は差に、積は和に変わる。対数正規分布に従う量の比や積は、また対数正規分布に従う。
          差の分散は分散の和 $\sigma^2+\sigma^2$ で、標準偏差は $\sqrt2\sigma$ になる（$2\sigma$ ではない）。
      - id: s24p03b
        chapter: 6
        terms: [multivariate-normal-distribution, chi-squared-distribution, bivariate-normal-distribution]
        topic: 再生回数と高評価数の対数が2変量正規分布に従うときマハラノビス距離の2乗が自由度2のカイ二乗分布に従うことから95%の動画を含む楕円の境界を決める
        level: 標準
        definition: false
        type: choice
        question: |
          再生回数の対数と高評価数の対数の組 $\boldsymbol x$ は、平均ベクトル $\boldsymbol\mu$、分散共分散行列 $\Sigma$ の 2 変量正規分布に従うとする。
          マハラノビス距離の 2 乗 $D^2=(\boldsymbol x-\boldsymbol\mu)^\top\Sigma^{-1}(\boldsymbol x-\boldsymbol\mu)$ が $c$ 以下になる楕円の内側に、動画の 95% が入るようにしたい。
          $c$ の値と、よく誤って使われる $c=«c1»$（$=1.96^2$）の楕円に入る動画の割合の組として正しいものはどれか。
          自由度 1 のカイ二乗分布の上側 5% 点は «c1»、自由度 2 では «c2» で、$e^{-1.92}=«e192»$ とする。
        choices:
          - '$c=«c2»$。$c=«c1»$ の楕円に入るのは約 «in384»'
          - '$c=«c1»$。1 変数のときと同じく、$1.96^2$ で 95% になる'
          - '$c=«c2»$。$c=«c1»$ の楕円に入るのは約 0.95 の 2 乗で 0.903'
          - '$c=2\times«c1»=7.68$。変数が 2 つなので 1 変数の点を 2 倍する'
          - '$c=«c2»$。$c=«c1»$ の楕円に入るのは約 0.975'
        answer: 0
        distractors:
          - 正解
          - 2 変量では D² は自由度 2 のカイ二乗分布に従う
          - 2 つの成分は相関があってもよく、確率は 0.95 の 2 乗にならない
          - カイ二乗分布の点は自由度に比例しない
          - 自由度 2 のカイ二乗分布で 3.84 以下になる確率を計算していない
        explanation: |
          **方針** $p$ 変量正規分布では、$D^2$ は自由度 $p$ のカイ二乗分布に従う。自由度 2 のカイ二乗分布は平均 2 の指数分布で、$P(D^2\le c)=1-e^{-c/2}$。

          **途中式**
          - 95% の楕円：$c=\chi^2_{0.05}(2)=«c2»$
          - $c=«c1»$ の楕円：$P(D^2\le«c1»)=1-e^{-«c1»/2}=1-e^{-1.92}=1-«e192»=«in384»$

          **答え** $c=«c2»$。$c=«c1»$ の楕円に入るのは約 «in384»

          **間違えやすい点** 1 変数の「平均 ± 1.96 標準偏差」の感覚で $D^2\le1.96^2$ とすると、2 変量では 85% ほどしか含まない。変数の数が増えるほど、同じ割合を含む $c$ は大きくなる。
          楕円の形は $\Sigma$（相関）で決まるが、含まれる割合は $\Sigma$ によらず $c$ と次元だけで決まる。
  - id: s24p04
    title: SNS 広告の効果測定
    context: |
      ある出版社は、新刊の告知を SNS 広告で配信し、表示回数とシェア数を記録している。小問ごとに別のデータを扱う。
    items:
      - id: s24p04a
        chapter: 7
        terms: [strong-law-of-large-numbers, continuous-mapping-theorem, convergence-in-probability]
        topic: 日ごとの表示回数とシェア率が連動するとき全期間のシェア数の合計を表示回数の合計で割った比が大数の強法則と連続写像で近づく値を求め日ごとの比の平均と比べる
        level: 応用
        definition: false
        type: numeric
        question: |
          ある広告の 1 日の表示回数 $I$ は、確率 1/2 で «I1» 回（小規模配信の日）、確率 1/2 で «I2» 回（大規模配信の日）で、日ごとに独立に決まる。
          1 回の表示がシェアされる確率は、小規模の日は «q1»、大規模の日は «q2» で、その日のシェア数 $S$ の期待値は $E[S\mid I]=(\text{その日の確率})\times I$ である。
          配信を長く続けたとき（日数 $n\to\infty$）、全期間のシェア率 $\dfrac{S_1+\cdots+S_n}{I_1+\cdots+I_n}$ がほとんど確実に近づく値を求めよ。
        answer: «lim»
        tolerance: 0.0005
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.0005 の差まで正解とする。
        explanation: |
          **方針** 分子と分母をそれぞれ $n$ で割ると、大数の強法則により $\frac1n\sum S_i\to E[S]$、$\frac1n\sum I_i\to E[I]$（概収束）。割り算は（分母が 0 でないところで）連続なので、比は $E[S]/E[I]$ に概収束する（連続写像定理）。

          **途中式**
          - $E[S]=\dfrac12\times«I1»\times«q1»+\dfrac12\times«I2»\times«q2»=\dfrac{«S1»+«S2»}{2}=«ES»$
          - $E[I]=\dfrac{«I1»+«I2»}{2}=«EI»$
          - 極限：$«ES»/«EI»=«lim_s»$

          **答え** $«lim_s»$

          **間違えやすい点** 日ごとのシェア率 $S_i/I_i$ を平均すると $(«q1»+«q2»)/2=«avg»$ に近づき、比の和とは違う値になる（$E[S/I]\ne E[S]/E[I]$）。
          全期間のシェア率では、表示回数の多い大規模配信の日の率が重く効く。どちらの率を報告しているかを区別する必要がある。
      - id: s24p04b
        chapter: 12
        terms: [goodness-of-fit-test, pearson-chi-square-statistic, degrees-of-freedom-gof]
        topic: 曜日ごとのシェア数が曜日によらず一様かを母数を推定しない適合度のカイ二乗検定で調べ自由度を数える
        level: 基本
        definition: false
        type: choice
        question: |
          ある 1 週間に広告がシェアされた «tot» 件を、曜日ごとに数えた。

          | 曜日 | 月 | 火 | 水 | 木 | 金 | 土 | 日 |
          |---|---|---|---|---|---|---|---|
          | シェア数 | «obs» |

          シェアが曜日によらず一様に起こるか（各曜日の確率 1/7）を、ピアソンのカイ二乗統計量で有意水準 5% で検定する。自由度 6 の上側 5% 点は «c6»、自由度 7 では «c7» である。正しい記述はどれか。
        choices:
          - '統計量は «X2»、自由度 6 で «c6» を下回るので、一様でないとはいえない'
          - '統計量は «X2»、自由度 7 で «c7» を下回るので、一様でないとはいえない'
          - '統計量は «X2o»、自由度 6 で «c6» を下回るので、一様でないとはいえない'
          - '統計量は «X2»、自由度 6 で棄却されないので、シェアは曜日によらず一様であることが示された'
          - '統計量は «sdev2»、自由度 6 で «c6» を上回るので、曜日によって違う'
        answer: 0
        distractors:
          - 正解
          - 自由度は「階級の数 − 1 − 推定した母数の数」で、ここでは 7−1=6
          - 分母に期待度数ではなく観測度数を使った
          - 棄却されないことは一様であることの証明ではない
          - 偏差の 2 乗和を期待度数で割っていない
        explanation: |
          **方針** 期待度数は各曜日 $«tot»/7=«e»$。母数を推定していないので、自由度は $7-1=6$。

          **途中式**
          $$X^2=\sum\frac{(O-E)^2}{E}=\frac{«dev2»}{«e»}=\frac{«sdev2»}{«e»}=«X2»$$
          «X2» $<$ «c6» なので、有意水準 5% で棄却しない。

          **答え** 統計量 «X2»、自由度 6 で棄却しない

          **間違えやすい点** 合計 «tot» が決まっているので、自由度は階級の数より 1 小さい。分布の母数をデータから推定した場合は、その数だけさらに減らす。
          1 週間 «tot» 件では検出力が低く、「差がない」と言い切ることはできない。
  - id: s24p05
    title: 記事レイアウトの読了時間
    context: |
      あるニュースサイトは、記事ページの 2 つのレイアウト A・B の読者の滞在時間（秒）を比べている。小問ごとに別のデータを扱う。
    items:
      - id: s24p05a
        chapter: 9
        terms: [ci-mean-known-variance, ci-two-sample-mean-difference, required-sample-size]
        topic: 母標準偏差が既知で異なる2つのレイアウトの平均滞在時間の差の95%信頼区間で総数を決めたとき半幅が最小になる配分とその半幅を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          長期の記録から、滞在時間の母標準偏差はレイアウト A で $\sigma_A=«sa»$ 秒、B で $\sigma_B=«sb»$ 秒とわかっている（滞在時間は正規分布に従うとする）。
          合計 «N» 人の読者を A と B に $n_A+n_B=«N»$ となるように無作為に割り付け、平均の差の 95% 信頼区間 $\bar x_A-\bar x_B\pm1.96\sqrt{\sigma_A^2/n_A+\sigma_B^2/n_B}$ を作る。
          区間の半幅が最も小さくなるように $n_A$、$n_B$ を決めたときの半幅（秒）を求めよ。
        answer: «hw»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $n_A+n_B=N$ のもとで $\sigma_A^2/n_A+\sigma_B^2/n_B$ を最小にする。ラグランジュの未定乗数法（またはコーシー・シュワルツの不等式）から $n_A:n_B=\sigma_A:\sigma_B$。

          **途中式**
          - $n_A=«N»\times\dfrac{«sa»}{«sa»+«sb»}=«na»$、$n_B=«nb»$
          - $\dfrac{«sa»^2}{«na»}+\dfrac{«sb»^2}{«nb»}=30+15=«vsum»$（$=(\sigma_A+\sigma_B)^2/N=8100/180$ と同じ）
          - 半幅 $=1.96\times\sqrt{«vsum»}=«hw4»$

          **答え** $«hw_s»$ 秒

          **間違えやすい点** 半分ずつ（90 人ずつ）割り付けると半幅は «hw_eq» 秒で、少し広くなる。ばらつきの大きい群に多く割り当てるのがよい（分散の比ではなく標準偏差の比）。
          層別抽出のネイマン配分と同じ考え方である。
      - id: s24p05b
        chapter: 11
        terms: [preliminary-test-problem, welch-test, pooled-variance]
        topic: 標本の小さい群の分散が大きいときプールした分散のt検定とウェルチの検定で結論が分かれることを確かめ事前の等分散検定で使い分ける問題点を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          別の調査で、レイアウト A の読者 «n1» 人（標準偏差 «sd1» 秒）と B の読者 «n2» 人（標準偏差 «sd2» 秒）の平均滞在時間の差は «d» 秒だった。
          プールした分散による 2 標本 $t$ 統計量と、ウェルチの $t$ 統計量（自由度はサタスウェイトの近似で約 «dfw0»）を計算した。$t_{0.025}(38)=«t38»$、$t_{0.025}(10)=«t10»$ とする。正しい記述はどれか。
        choices:
          - 'プールした $t=«tp»$ は 5% で有意、ウェルチの $t=«tw»$ は有意でない。標本の小さい A の分散が大きいので、プールした検定は第 1 種の誤りが名目より大きくなりやすく、ここではウェルチの結果を採る'
          - 'プールした $t=«tp»$ は 5% で有意なので、自由度の大きいプールした検定の結果を採る'
          - 'ウェルチの $t=«tw»$ は自由度 38 の点 «t38» を上回るので、どちらの方法でも有意である'
          - '先に等分散の $F$ 検定を行い、棄却されなかったときだけプールした検定を使えば、全体の有意水準は 5% に保たれる'
          - '2 つの $t$ 統計量は分母が同じなので、値は等しくなる'
        answer: 0
        distractors:
          - 正解
          - 分散が大きく違い、標本の大きさも違うときは、プールした分散は小さい群のばらつきを過小評価する
          - ウェルチの t は自由度約 10 の t 分布と比べる
          - 事前検定の結果で検定を選ぶと、全体の誤りの確率は名目どおりにならない（事前検定の問題）
          - プールした分散と、群ごとの分散の和では、差の標準誤差が違う
        explanation: |
          **方針** プールした分散は 2 群の分散が等しいことを前提にする。ウェルチの方法は群ごとの分散 $s_1^2/n_1+s_2^2/n_2$ で標準誤差を作る。

          **途中式**
          - プール：$s_p^2=\dfrac{9\times«sd1»^2+29\times«sd2»^2}{38}=«sp2»$、標準誤差 $«sp»\sqrt{1/«n1»+1/«n2»}=«sep»$、$t=«d»/«sep»=«tp»>«t38»$
          - ウェルチ：$\sqrt{«v1»+«v2»}=«sew»$、$t=«d»/«sew»=«tw»<«t10»$（自由度 «dfw»）

          **答え** プールした検定は有意、ウェルチの検定は有意でない。ここではウェルチを採る

          **間違えやすい点** 標本の小さい群の分散が大きいとき、プールした $t$ 検定は標準誤差を小さく見積もり、有意になりすぎる。
          「等分散の検定 → 結果で $t$ 検定を選ぶ」という 2 段階の手順は、全体の有意水準が名目どおりにならない。初めからウェルチの検定を使うことがすすめられている。
  - id: s24p06
    title: 記事のシェア数の推定
    context: |
      あるニュースサイトで、記事ごとの SNS でのシェア数を調べている。小問ごとに別のデータを扱う。
    items:
      - id: s24p06a
        chapter: 8
        terms: [complete-statistic, rao-blackwell-theorem, unbiased-estimator]
        topic: ポアソン分布に従う記事ごとのシェア数から2次の階乗モーメントλ²の一様最小分散不偏推定量を完全十分統計量の関数として求め標本平均の2乗と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          ある分野の記事 «n» 本のシェア数は «xs» で（合計 $T=«T»$）、記事ごとのシェア数は独立に平均 $\lambda$ のポアソン分布に従うとする。
          拡散の指標として $\lambda^2=E[X(X-1)]$（2 次の階乗モーメント）を推定したい。正しい記述はどれか。
        choices:
          - '$T(T-1)/n^2=«umvue»$ が一様最小分散不偏推定量である。$T$ は完全十分統計量で、この推定量は $T$ の関数で不偏だから'
          - '$\bar x^2=«naive»$ が不偏推定量で、最尤推定量でもあるので最も良い'
          - '$\dfrac1n\sum x_i(x_i-1)=«avgf»$ は不偏なので、一様最小分散不偏推定量である'
          - '$T(T-1)/n^2=«umvue»$ は不偏だが、ポアソン分布は離散分布なので一様最小分散不偏推定量は存在しない'
          - '$\lambda^2$ の不偏推定量は存在しないので、最尤推定値 «naive» を使うしかない'
        answer: 0
        distractors:
          - 正解
          - E[X̄²]=λ²+λ/n で、X̄² は上に偏る（最尤推定量ではある）
          - 不偏だが T だけの関数ではなく、T で条件づけると分散が下がる（ラオ・ブラックウェル）
          - 離散分布でも、完全十分統計量の関数である不偏推定量は一様最小分散不偏推定量になる
          - T(T−1)/n² が不偏推定量になっている
        explanation: |
          **方針** $T=\sum X_i$ は平均 $n\lambda$ のポアソン分布に従い、$\lambda$ の完全十分統計量。$T$ の関数で不偏なものは、レーマン・シェフェの定理により一様最小分散不偏推定量になる。

          **途中式**
          - ポアソン分布の階乗モーメント $E[T(T-1)]=(n\lambda)^2$ より、$E[T(T-1)/n^2]=\lambda^2$
          - $T(T-1)/n^2=«TT1»/«n2»=«umvue»$（$=\bar x^2-\bar x/n=9.00-0.30$）
          - $E[\bar x^2]=V[\bar x]+\lambda^2=\lambda^2+\lambda/n$ なので $\bar x^2$ は偏る

          **答え** $T(T-1)/n^2=«umvue»$ が一様最小分散不偏推定量

          **間違えやすい点** $\frac1n\sum x_i(x_i-1)$ も不偏だが、$T$ で条件づけた期待値をとる（ラオ・ブラックウェル化する）と $T(T-1)/n^2$ になり、分散が小さくなる。
          最尤推定量 $\bar x^2$ は不変性からすぐ得られるが、不偏ではない。$n$ が大きいと偏り $\lambda/n$ は小さくなる。
      - id: s24p06b
        chapter: 32
        terms: [bootstrap-confidence-interval, bootstrap, order-statistics]
        topic: 記事のシェア数の標本中央値のブートストラップ分布の分位点からパーセンタイル法の95%信頼区間を作り正規近似や基本法の区間と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          別の分野の記事 40 本のシェア数の中央値は «med» だった。40 本から復元抽出で 40 本を選び直して中央値を計算することを 2000 回繰り返したところ、中央値の分布は次のとおりだった。

          | 2.5% 点 | 5% 点 | 95% 点 | 97.5% 点 | 平均 | 標準偏差 |
          |---|---|---|---|---|---|
          | «q025» | «q05» | «q95» | «q975» | «bm» | «bsd» |

          パーセンタイル法による母集団の中央値の 95% 信頼区間として正しいものはどれか。
        choices:
          - '$(«q025»,\ «q975»)$'
          - '$(«q05»,\ «q95»)$'
          - '$(«nlo»,\ «nhi»)$'
          - '$(«blo»,\ «bhi»)$'
          - '繰り返しの回数 2000 を増やすほど幅が 0 に近づくので、区間は 1 点 «med» に定まる'
        answer: 0
        distractors:
          - 正解
          - 5% 点と 95% 点では 90% の区間になる
          - ブートストラップの標準偏差を使う正規近似の区間（パーセンタイル法ではない）
          - 2×中央値 − 分位点で作る基本法（ピボット法）の区間
          - 繰り返しを増やすと分位点が安定するだけで、幅は標本の大きさで決まる
        explanation: |
          **方針** パーセンタイル法では、ブートストラップで作った推定値の分布の下側 2.5% 点と上側 2.5% 点（97.5% 点）をそのまま区間の端にする。

          **途中式** 2000 個の中央値を小さい順に並べた 2.5% 点 «q025» と 97.5% 点 «q975» より、区間は $(«q025»,\ «q975»)$。

          **答え** $(«q025»,\ «q975»)$

          **間違えやすい点** 正規近似 $«med»\pm1.96\times«bsd»=(«nlo»,\ «nhi»)$ は分布の非対称性を反映しない。中央値の分布は飛び飛びで非対称になりやすく、パーセンタイル法が使われることが多い。
          ブートストラップの繰り返し回数 $B$ を増やしても、区間の幅は元の標本の大きさ（40 本）で決まり、0 には近づかない。
  - id: s24p07
    title: 週刊コミック誌の付録カード
    context: |
      ある週刊コミック誌には、«k» 種類のキャラクターカードのうち 1 枚が付録として封入されている。どの号を買っても、各種類のカードが等しい確率 $1/«k»$ で独立に入っている。
    items:
      - id: s24p07a
        chapter: 5
        terms: [bernoulli-distribution, expectation-variance-properties, multinomial-distribution]
        topic: 10冊買ったときに集まるカードの種類数の期待値を種類ごとの指示変数の和として求める
        level: 標準
        definition: false
        type: numeric
        question: |
          この雑誌を «m» 冊買ったとき、手元にそろうカードの**種類の数**の期待値を求めよ。必要なら $(5/6)^{10}=«q»$ を使え。
        answer: «Ed»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 種類 $j$ が 1 枚以上ある事象の指示変数 $I_j$ を使うと、種類の数は $I_1+\cdots+I_6$。期待値の線形性から、$I_j$ どうしが独立でなくても期待値は足し合わせられる。

          **途中式**
          - $P(\text{種類 }j\text{ が 1 枚もない})=(5/6)^{«m»}=«q»$
          - $E[I_j]=1-«q»=0.8385$
          - $E[\text{種類の数}]=6\times0.8385=«Ed4»$

          **答え** $«Ed_s»$ 種類

          **間違えやすい点** $I_j$ どうしは独立ではない（ある種類が多く出れば、ほかは出にくい）が、期待値の和には影響しない。分散を求めるときは共分散が必要になる。
          10 冊買っても、6 種類すべてがそろうとは限らない（期待値は 6 より約 1 種類少ない）。
      - id: s24p07b
        chapter: 15
        terms: [compound-poisson-process, poisson-process]
        topic: 購入者のポアソン到着と1人あたりの購入冊数から1日の販売冊数を複合ポアソン過程とみて標準偏差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある書店では、この雑誌の購入者が 1 時間あたり平均 «lam» 人のポアソン過程に従って来店する。カードを集めるため複数冊買う人もおり、1 人の購入冊数 $K$ は来店とは独立に

          | $K$ | 1 | 2 | 3 |
          |---|---|---|---|
          | 確率 | «p1» | «p2» | «p3» |

          に従う（購入者どうしも独立）。営業時間 «t» 時間の販売冊数の**標準偏差**を求めよ。
        answer: «sd»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 販売冊数 $S=\sum_{i=1}^{N}K_i$ は、購入者数 $N\sim\mathrm{Po}(\lambda t)$ の複合ポアソン過程。$V[S]=E[N]V[K]+V[N]E[K]^2$ で、ポアソン分布では $E[N]=V[N]=\lambda t$ なので $V[S]=\lambda t\,E[K^2]$。

          **途中式** $\lambda t=«lam»\times«t»=«lt»$。
          $E[K]=1\times«p1»+2\times«p2»+3\times«p3»=«EK»$、$E[K^2]=1\times«p1»+4\times«p2»+9\times«p3»=«EK2»$。
          $$E[S]=«lt»\times«EK»=«mm»,\qquad V[S]=«lt»\times«EK2»=«v»,\qquad \sqrt{«v»}=«sd4»\cdots$$

          **答え** $«sd_s»$ 冊

          **間違えやすい点** $E[K^2]$ の代わりに $V[K]=«VK»$ を使うと $«sd_vk»$、$E[K]^2$ を使うと $«sd_ek2»$ で、どちらも小さすぎる。
          冊数そのものをポアソン分布（平均 «mm»）とみなすと $\sqrt{«mm»}=«sd_pois»$ になるが、まとめ買いがあるので冊数はポアソン分布より散らばる。

  - id: s24p08
    title: 広告費と新刊の売上部数
    context: |
      ある出版社の新刊 «n» 点について、発売前の広告費 $x$（百万円）と発売後 1 か月の売上部数 $y$（千部）に単回帰モデル $y=\beta_0+\beta_1x+\varepsilon$（誤差は独立に $N(0,\sigma^2)$）を当てはめた。
      $\bar x=«xbar»$、$x$ の偏差平方和 $S_{xx}=«Sxx»$、当てはめ式は $\hat y=«b0»+«b1»x$、残差平方和は «rss»（残差の自由度 «df»）で、$\sigma^2$ の不偏推定値は $s^2=«s2»$ である。
    items:
      - id: s24p08a
        chapter: 16
        terms: [regression-coefficient-t-test, least-squares-method]
        topic: 要約統計量から広告費の回帰係数（傾き）の標準誤差を作り95%信頼区間を求める
        level: 基本
        definition: false
        type: choice
        question: |
          広告費を 1 百万円増やしたときの平均売上部数の増加量 $\beta_1$ の 95% 信頼区間として、最も近いものはどれか。
          $t$ 分布の上側 2.5% 点は、自由度 10 で «t10»、自由度 11 で «t11» とする。
        choices:
          - '$«ci_11»$'
          - '$«ci_s2»$'
          - '$«ci»$'
          - '$«ci_sxx»$'
          - '$«ci_z»$'
        answer: 2
        distractors:
          - 自由度を n-1=11 とした
          - 標準誤差を s²/√Sxx とし、分散と標準偏差を取り違えた
          - 正解
          - 標準誤差を s/Sxx とし、Sxx の平方根をとり忘れた
          - t 分布の点の代わりに標準正規の 1.96 を使った
        explanation: |
          **方針** 単回帰の傾きの推定量の分散は $\sigma^2/S_{xx}$。$\sigma^2$ を $s^2$ で置き換えた標準誤差を使い、自由度 $n-2$ の $t$ 分布で区間を作る。

          **途中式**
          $$\mathrm{SE}(\hat\beta_1)=\sqrt{\frac{s^2}{S_{xx}}}=\sqrt{\frac{«s2»}{«Sxx»}}=\sqrt{«se2»}=«se»$$
          $$«b1»\pm«t10»\times«se»=«b1»\pm«hw»$$

          **答え** $«ci»$（千部）

          **間違えやすい点** 自由度は推定した係数 2 個分を引いた $n-2=«df»$（$n-1$ とすると $«ci_11»$）。
          標準誤差は $s/\sqrt{S_{xx}}$。$\sqrt{\ }$ の付け忘れや $s^2$ との取り違えで区間の幅が大きく変わる。区間は 0 を含まないので、両側 5% の $t$ 検定でも $\beta_1=0$ は棄却される。

      - id: s24p08b
        chapter: 17
        terms: [breusch-pagan-test, heteroscedasticity, residual]
        topic: 広告費の単回帰の残差の2乗を広告費に回帰した決定係数からブルーシュ・ペーガン統計量を作り自由度1で不均一分散を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          この回帰の残差 $e_i$ の 2 乗を、広告費 $x_i$ に単回帰（補助回帰）したところ、決定係数は «R2a» だった。
          誤差の分散が広告費によって変わるか（不均一分散）を、ブルーシュ・ペーガン検定（$nR^2$ 型）で有意水準 5% で調べる。自由度 1 のカイ二乗分布の上側 5% 点は «c1»、自由度 2 では «c2» とする。正しい記述はどれか。
        choices:
          - '統計量は $«n»\times«R2a»=«bp»$ で、自由度 1 の «c1» を上回るので、誤差の分散は一定でないと判断する'
          - '統計量は $«n»\times«R2a»=«bp»$ で、自由度 2 の «c2» を下回るので、誤差の分散は一定とみてよい'
          - '統計量は $10\times«R2a»=«bp_n2»$ で、自由度 1 の «c1» を上回るので、誤差の分散は一定でないと判断する'
          - '統計量は $«n»\times«R2a»=«bp»$ で、«c1» を上回るので、誤差は正規分布に従わないと判断する'
          - '補助回帰の決定係数 «R2a» が 0.5 より小さいので、不均一分散はないと判断する'
        answer: 0
        distractors:
          - 正解
          - 自由度は補助回帰の説明変数の数（ここでは 1）
          - nR² の n は観測数 12（残差の自由度ではない）
          - ブルーシュ・ペーガン検定は分散の一定性を調べる検定で、正規性の検定ではない
          - 決定係数の大きさだけでは判断できず、nR² をカイ二乗分布と比べる
        explanation: |
          **方針** 誤差の分散が一定なら、残差の 2 乗は説明変数と関係しないはず。補助回帰の決定係数 $R^2$ から $nR^2$ を作り、補助回帰の説明変数の数を自由度とするカイ二乗分布と比べる。

          **途中式** $nR^2=«n»\times«R2a»=«bp»>«c1»$（自由度 1）なので、有意水準 5% で「分散は一定」という帰無仮説を棄却する。

          **答え** $nR^2=«bp»$ で、誤差の分散は一定でない

          **間違えやすい点** 不均一分散があっても、最小二乗推定量は不偏のままだが、通常の標準誤差は正しくなくなる。不均一分散に頑健な標準誤差を使うか、重み付き最小二乗法を検討する。
          この検定は、観測数が 12 と少ないと近似が粗い点にも注意する。
  - id: s24p09
    title: 広告チャネルの変数選択
    context: |
      ある広告代理店は、6 つの広告チャネルの出稿量 $x_1,\ldots,x_6$ から売上 $y$ を説明する線形モデルを作る。説明変数は中心化と直交化を行い、$X^\top X=I$（単位行列）となるように変換してある。$y$ も中心化してあり、切片は考えない。誤差の分散は $\sigma^2=1$ で既知とする。
    items:
      - id: s24p09a
        chapter: 19
        terms: [variable-selection, aic, lasso]
        topic: 直交計画で説明変数を1つ加えると残差平方和が係数の2乗だけ減ることからCp（AIC）で選ばれる変数を係数の大きさのしきい値で判定しt検定による選択と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          すべての変数を入れた最小二乗推定値は
          $$(b_1,\ldots,b_6)=(«b1»,\ «b2»,\ «b3»,\ «b4»,\ «b5»,\ «b6»)$$
          だった。マローズの $C_p=\mathrm{RSS}_p/\sigma^2-n+2p$（$p$ はモデルに入れた変数の数）が最小になる変数の組み合わせと、各係数を有意水準 5% の $t$ 検定（$|b_j|/\sigma>1.96$）で選んだ組み合わせの組として正しいものはどれか。
        choices:
          - '$C_p$：$x_1,x_3,x_5$、$t$ 検定：$x_1$'
          - '$C_p$：$x_1,x_5$、$t$ 検定：$x_1$'
          - '$C_p$：$x_1,x_3,x_5$、$t$ 検定：$x_1,x_3,x_5$'
          - '$C_p$：すべての変数（残差平方和が最小になるので）、$t$ 検定：$x_1$'
          - '$C_p$：$x_1,x_2,x_3,x_5$、$t$ 検定：$x_1,x_5$'
        answer: 0
        distractors:
          - 正解
          - C_p のしきい値を √2 ではなく 1.96 とした
          - t 検定のしきい値を √2 とした
          - 変数を増やすと RSS は減るが、C_p は 2p で罰則がかかる
          - しきい値を 1 とし、t 検定は |b|>1.5 とした
        explanation: |
          **方針** $X^\top X=I$ のとき、変数 $j$ をモデルに加えると残差平方和はちょうど $b_j^2$ だけ減り（ほかの係数は変わらない）、$C_p$ の罰則 $2p$ は 2 増える。

          **途中式**
          - $C_p$ が下がる条件：$b_j^2/\sigma^2>2$、すなわち $|b_j|>\sqrt2\approx«sq2»$。$b_j^2$ は «b2s» なので $x_1,x_3,x_5$
          - $t$ 検定：$|b_j|>1.96$ なのは $x_1$（2.1）だけ

          **答え** $C_p$ では $x_1,x_3,x_5$、$t$ 検定では $x_1$

          **間違えやすい点** 直交計画では、$C_p$（AIC）による選択は係数を「しきい値 $\sqrt2\sigma$ で残すか 0 にするか」のハード閾値処理になる。ラッソは、しきい値を超えた係数も縮める軟閾値処理になる点が違う。
          $C_p$ は予測の良さを、$t$ 検定は係数が 0 かどうかを基準にするので、選ばれる変数の数が違ってよい。
  - id: s24p10
    title: 動画付き投稿の拡散
    context: |
      ある出版社の公式 SNS アカウントの投稿 «n» 件を、動画を付けたかどうかと、拡散した（シェア数が基準を超えた）かどうかで分類した。

      | | 拡散した | 拡散しなかった | 計 |
      |---|---|---|---|
      | 動画付き | «a» | «b» | «r1» |
      | 画像のみ | «c» | «d» | «r2» |
      | 計 | «c1» | «c2» | «n» |
    items:
      - id: s24p10a
        chapter: 28
        terms: [sampling-schemes, odds-ratio-interval, cohort-and-case-control-study]
        topic: 動画付き投稿と拡散の2×2表からリスク比とオッズ比を求め拡散した投稿としなかった投稿を別々に抽出した場合に推定できる量を判断する
        level: 基本
        definition: false
        type: choice
        question: |
          この表は、投稿全体から 300 件を無作為に選んで分類したものである（総数だけを固定）。
          拡散する割合の比（リスク比）とオッズ比の値、および「拡散した投稿 50 件と拡散しなかった投稿 250 件を別々に選んで、動画の有無を調べた（列の合計を固定した）」場合に推定できる量の組として正しいものはどれか。
        choices:
          - 'リスク比 «RR»、オッズ比 «OR»。列の合計を固定した抽出では、オッズ比は同じ意味で推定できるが、リスク比は推定できない'
          - 'リスク比 «RR»、オッズ比 «OR»。列の合計を固定した抽出でも、リスク比とオッズ比の両方を推定できる'
          - 'リスク比 «OR»、オッズ比 «RR»。列の合計を固定した抽出では、リスク比だけを推定できる'
          - 'リスク比 «RR»、オッズ比 «OR»。列の合計を固定した抽出では、オッズ比もリスク比も推定できない'
          - 'リスク比とオッズ比はどちらも «RR» で、抽出の方法によらない'
        answer: 0
        distractors:
          - 正解
          - 列の合計を研究者が決めると、拡散する割合そのものが決まらない
          - リスク比とオッズ比を取り違えた
          - オッズ比は行と列を入れ替えても同じ値になるので、列の合計を固定しても推定できる
          - 拡散する割合が小さくないので、オッズ比はリスク比と一致しない
        explanation: |
          **方針** リスク比は「動画付きで拡散する割合」と「画像のみで拡散する割合」の比。オッズ比は $ad/(bc)$ で、行と列を入れ替えても値が変わらない。

          **途中式**
          - リスク比：$\dfrac{«a»/«r1»}{«c»/«r2»}=\dfrac{«pa»}{«pc»}=«RR»$
          - オッズ比：$\dfrac{«a»\times«d»}{«b»\times«c»}=\dfrac{«ad»}{«bc»}=«OR»$
          - 列の合計を固定すると、拡散した投稿の割合（50/300）は研究者が決めた値になり、「動画付きで拡散する割合」は推定できない。一方、オッズ比は「拡散した投稿の中での動画のオッズ」と「拡散しなかった投稿の中での動画のオッズ」の比 $\dfrac{«a»/«c»}{«b»/«d»}=«OR»$ としても計算でき、同じ値になる。

          **答え** リスク比 «RR»、オッズ比 «OR»。列を固定した抽出ではオッズ比だけが推定できる

          **間違えやすい点** これは症例対照研究でオッズ比は推定できるが、発症の割合やリスク比は推定できないのと同じ理由である。
          拡散する割合が小さいときは、オッズ比はリスク比に近くなる（まれな事象の近似）。
      - id: s24p10b
        chapter: 18
        terms: [logistic-regression, deviance, logistic-likelihood-estimation]
        topic: 切片だけのモデルの最大対数尤度を拡散率から計算しロジスティック回帰のマクファデンの擬似決定係数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          同じ «n» 件について、拡散したかどうかを目的変数とし、動画の有無・投稿時間帯・文字数の 3 つの説明変数を入れたロジスティック回帰を当てはめたところ、最大対数尤度は $\log L_1=«ll1»$ だった。
          切片だけのモデルの最大対数尤度を $\log L_0$ とし、マクファデンの擬似決定係数を $R^2_{\mathrm{McF}}=1-\log L_1/\log L_0$ と定める。$R^2_{\mathrm{McF}}$ に最も近い値はどれか。
          必要なら $\log(1/6)=«lnp»$、$\log(5/6)=«lnq»$ を使え。
        choices:
          - '$«ratio»$'
          - '$«adj»$'
          - '$«R2_half»$'
          - '$«R2»$'
          - '$«lr»$'
        answer: 3
        distractors:
          - 対数尤度の比 log L1/log L0 をそのまま答えた
          - 説明変数の個数 3 を引く調整済みの式 1-(log L1-3)/log L0 を使った（問題の定義と違う）
          - 切片だけのモデルの拡散確率を 0.5 として log L0 を計算した
          - 正解
          - 尤度比検定の統計量 2(log L1-log L0) を答えた
        explanation: |
          **方針** 切片だけのモデルでは全投稿の拡散確率が共通で、その最尤推定値は全体の拡散率 $\hat p=«c1»/«n»=«p_buzz»$。これを代入して $\log L_0$ を求める。

          **途中式**
          $$\log L_0=«c1»\log\frac16+«c2»\log\frac56=«c1»\times(«lnp»)+«c2»\times(«lnq»)=«t0a»+(«t0b»)=«ll0»$$
          $$R^2_{\mathrm{McF}}=1-\frac{«ll1»}{«ll0»}=1-«ratio»=«R2»$$

          **答え** $«R2»$

          **間違えやすい点** $\log L_0$ は確率 0.5 ではなく、データの拡散率で計算する（0.5 とすると $\log L_0=«ll_half»$ で $«R2_half»$ と過大になる）。
          $«lr»$ は尤度比検定の統計量 $2(\log L_1-\log L_0)$（自由度 3 のカイ二乗分布と比べる）で、決定係数ではない。擬似決定係数は通常の $R^2$ より小さめの値になりやすい。

  - id: s24p11
    title: ボットアカウントの見分け方
    context: |
      ある SNS 分析チームは、自動投稿を行うボットアカウントと一般利用者を見分ける方法を検討している。
    items:
      - id: s24p11a
        chapter: 13
        terms: [kendall-rank-correlation, concordant-discordant-pairs, spearman-rank-correlation]
        topic: 2つのボット検出方式がつけた7アカウントの疑わしさの順位の一致度を一致対と不一致対を数えてケンドールの順位相関係数で求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 つのボット検出方式 P・Q が、7 つのアカウントに「ボットらしさ」の順位（1 が最もボットらしい）をつけた。

          | アカウント | ア | イ | ウ | エ | オ | カ | キ |
          |---|---|---|---|---|---|---|---|
          | 方式 P | «ra» |
          | 方式 Q | «rb» |

          2 つの方式の順位の一致度を、ケンドールの順位相関係数 $\tau=\dfrac{(\text{一致対の数})-(\text{不一致対の数})}{\binom72}$ で求める。正しいものはどれか。
        choices:
          - '一致対 «C»、不一致対 «D» で、$\tau=«tau»$'
          - '一致対 «C»、不一致対 «D» で、$\tau=«w_c»$'
          - '順位差の 2 乗和 «d2» から $\tau=«rs»$'
          - '一致対 «D»、不一致対 «C» で、$\tau=-«tau»$'
          - '順位が完全には一致しないので $\tau=0$'
        answer: 0
        distractors:
          - 正解
          - 一致対の割合だけを求め、不一致対を引いていない
          - スピアマンの順位相関係数を求めた
          - 一致と不一致を取り違えた
          - τ=0 は一致と不一致が同数のときで、順位が完全に一致しないことではない
        explanation: |
          **方針** 21 組のアカウントの組それぞれについて、2 つの方式の順位の大小が同じ向きなら一致対、逆なら不一致対と数える。

          **途中式** 方式 P の順位はア〜キの順に 1〜7 なので、方式 Q の順位の列で「前の方が大きい組」が不一致対になる。
          （ア,イ）（ウ,エ）（オ,キ）（カ,キ）の «D» 組が不一致対で、一致対は $21-«D»=«C»$。
          $$\tau=\frac{«C»-«D»}{21}=«tau»$$

          **答え** $\tau=«tau»$

          **間違えやすい点** 同じデータのスピアマンの順位相関係数は «rs» で、ケンドールの $\tau$ より絶対値が大きくなることが多い。2 つは尺度が違うので、値を直接比べない。
          ケンドールの $\tau$ は「ランダムに選んだ 2 アカウントの順序が 2 つの方式で一致する確率 − 不一致の確率」と解釈できる。
      - id: s24p11b
        chapter: 23
        terms: [roc-curve-and-auc, sensitivity-and-specificity, bayes-decision-theory]
        topic: ROC曲線上の4つの動作点からボットの割合と見逃しと誤検知のコストを考えて期待コスト最小の閾値を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          ボット判定のスコアに 4 通りの閾値 $T_1$〜$T_4$ を設定したときの、ROC 曲線上の動作点（感度＝ボットをボットと判定する割合、偽陽性率＝一般利用者をボットと判定する割合）は次のとおりである。

          | 閾値 | $T_1$ | $T_2$ | $T_3$ | $T_4$ |
          |---|---|---|---|---|
          | 感度 | «tp1» | «tp2» | «tp3» | «tp4» |
          | 偽陽性率 | «fp1» | «fp2» | «fp3» | «fp4» |

          運用するアカウントのうちボットの割合は «pi» である。ボットを見逃すコストを «cfn»、一般利用者を誤ってボットと判定するコストを «cfp» とし、正しく判定したときのコストは 0 とする。
          1 アカウントあたりの期待コストを最小にする閾値と、その理由として正しいものはどれか。
        choices:
          - '$T_1$：見逃しのコストが大きいので、感度が最も高い閾値を選ぶ（期待コスト約 «nopi1»）'
          - '$T_2$：ユーデン指数（感度 − 偽陽性率）が最大の «J2» なので、期待コストも最小になる'
          - '$T_3$：期待コストが約 «cost3» で最小になる'
          - '$T_4$：誤判定の割合が約 «err4» で最小なので、期待コストも最小になる'
          - '$T_2$：期待コストが約 «cost2» で最小になる'
        answer: 2
        distractors:
          - ボットの割合を考えず、コスト 5(1-感度)+偽陽性率 を比べた
          - ユーデン指数の最大がコストとボットの割合を考えた最適点と一致すると考えた
          - 正解
          - コストを考えず誤判定の割合だけを最小にした
          - T2 の期待コストは正しいが、T3 のほうが小さいことを見落とした
        explanation: |
          **方針** 期待コストは「ボットである確率 × 見逃す確率 × 見逃しのコスト」と「一般利用者である確率 × 誤検知の確率 × 誤検知のコスト」の和：
          $$C(T)=«pi»\times(1-\text{感度})\times«cfn»+«qi»\times\text{偽陽性率}\times«cfp»$$

          **途中式**
          $C(T_1)=«a1»+«b1»=«cost1»$、
          $C(T_2)=«a2»+«b2»=«cost2»$、
          $C(T_3)=«a3»+«b3»=«cost3»$、
          $C(T_4)=«a4»+«b4»=«cost4»$。最小は $T_3$。

          **答え** $T_3$（期待コスト約 «cost3»）

          **間違えやすい点** ボットは «pi» と少ないので、見逃しのコストが 5 倍でも、一般利用者の誤検知の件数が効いてくる。ボットの割合を無視すると感度の高い $T_1$ を選んでしまう。
          コストを無視して誤判定の割合（$T_4$ で «err4»）だけを見ると、ボットの見逃しを軽く見すぎる。ユーデン指数の最大（$T_2$）は、事前割合とコストが釣り合う特別な場合にしか期待コスト最小と一致しない。

