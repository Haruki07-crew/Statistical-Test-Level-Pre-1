          - '$B$ の固有値はすべて 0 以上なので、3 つの雑誌は 2 次元の平面上に正確に配置できる'
          - '負の固有値は計算の誤差なので、0 とみなせば 3 つの雑誌は 1 本の直線上に正確に並ぶ'
          - '点が 3 つしかないので、どのような非類似度でも 2 次元の平面上に正確に配置できる'
          - '古典的多次元尺度法では非類似度をそのまま内積とみなすので、$B=-D^{(2)}$ である'
        answer: 0
        distractors:
          - 正解
          - B の対角成分 b_QQ=−1 が負なので、B は半正定値ではない
          - −1.5 は誤差ではなく、正確な値
          - 3 点でも、三角不等式を満たさない非類似度は平面上の距離にならない
          - B は 2 乗の行列を二重中心化して −1/2 を掛けたもの
        explanation: |
          **方針** 非類似度がユークリッド距離なら、$B$ は点の座標の内積行列になり、固有値はすべて 0 以上になる。負の固有値があれば、どの次元でも正確には表せない。

          **途中式** $D^{(2)}$ の行の平均は $«rm1»,\ «rm2»,\ «rm1»$、全体の平均は $«gm»$。
          $$b_{ij}=-\frac12\left(d_{ij}^2-\bar d_{i\cdot}^2-\bar d_{\cdot j}^2+\bar d_{\cdot\cdot}^2\right)$$
          より $b_{PP}=«b11»$、$b_{QQ}=«b22»$、$b_{PR}=«b13»$ など。対角成分 $b_{QQ}=«b22»$ が負なので、$B$ は内積行列（半正定値）になりえない。固有値は «ev1»、«ev2»、«ev3»（和は対角成分の和 11 に等しい）。

