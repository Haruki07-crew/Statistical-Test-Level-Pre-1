set: 24
title: 模擬試験 第24回
minutes: 90
problems:
  - id: s24p01
    title: 月刊誌の定期購読と解約
    context: |
      ある出版社は月刊誌の定期購読（1 か月ごとに自動更新）を、紙版と電子版の 2 つのプランで提供している。
      購読者が解約するまでの期間を分析する。
    items:
      - id: s24p01a
        chapter: 2
        terms: [hazard-function, survival-function, probability-mass-and-density-function]
        topic: 月刊誌の定期購読で月ごとの離散時間ハザードから4か月目にちょうど解約する確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          紙版の新規購読者が解約する月を $T$（$T=1,2,\ldots$、$T=t$ は $t$ か月目の終わりに解約することを表す）とする。
          過去のデータから、離散時間のハザード $h(t)=P(T=t\mid T\ge t)$ が次のように推定されている。

          | $t$（か月目） | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | $h(t)$ | «h1» | «h2» | «h3» | «h4» |

          新規購読者が**ちょうど 4 か月目**に解約する確率 $P(T=4)$ に最も近い値はどれか。
        choices:
          - '$«h4»$'
          - '$«w_sum»$'
          - '$«pa»$'
          - '$«surv4»$'
          - '$«atrisk4»$'
        answer: 2
        distractors:
          - 条件付き確率であるハザード h(4) をそのまま同時の確率 P(T=4) とした
          - 3 か月目までの生存確率を 1-(h(1)+h(2)+h(3)) とハザードの和で作った
          - 正解
          - 4 か月目も解約しない確率 P(T>4)（生存関数 S(4)）を答えた
          - 4 か月目に入る確率 P(T≥4) を答え、h(4) を掛け忘れた
        explanation: |
          **方針** 離散時間では「$t-1$ か月目までは解約せず、$t$ か月目に解約する」確率は、各月を生き残る条件付き確率 $1-h(k)$ を順に掛け、最後に $h(t)$ を掛けて求める：
          $P(T=t)=h(t)\prod_{k=1}^{t-1}\{1-h(k)\}$。

          **途中式** 4 か月目に入る（3 か月目まで解約しない）確率は
          $$P(T\ge4)=(1-«h1»)(1-«h2»)(1-«h3»)=«q1»\times«q2»\times«q3»=«S3»$$
          よって
          $$P(T=4)=P(T\ge4)\,h(4)=«S3»\times«h4»=«pa5»$$

          **答え** $«pa»$

          **間違えやすい点** $h(4)=«h4»$ は「4 か月目に入った人のうち」解約する割合（条件付き確率）であり、新規購読者全体から見た確率ではない。
          生存確率をハザードの和で $1-«hsum3»$ と作ると $«w_sum»$ になるが、生存は足し算ではなく $1-h(k)$ の掛け算で減っていく。
          $«atrisk4»$ は $P(T\ge4)$、$«surv4»$ は $P(T>4)=P(T\ge4)\{1-h(4)\}$ である。

      - id: s24p01b
        chapter: 29
        terms: [hazard-ratio, censored-data, exponential-distribution]
        topic: 打ち切りを含む電子版と紙版の購読期間に指数モデルを当てはめハザード比の95%信頼区間の上限を解約数から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある期間に購読を始めた人を追跡した。調査終了時にまだ購読中の人は打ち切りとして扱う。各プランの解約数と、全員の観察期間（購読月数）の合計は次のとおりだった。

          | プラン | 解約数 $d$ | 観察期間の合計 $T$（人月） |
          |---|---|---|
          | 電子版 | «d1» | «T1» |
          | 紙版 | «d2» | «T2» |

          各プランの購読期間は解約率（ハザード）$\lambda$ が一定の指数分布に従い、打ち切りは解約と独立とする。$\lambda$ の最尤推定量は $\hat\lambda=d/T$ で、$\log\hat\lambda$ の漸近分散は $1/d$ で近似できる。
          電子版の紙版に対するハザード比 $\lambda_{\text{電子}}/\lambda_{\text{紙}}$ の 95% 信頼区間を、対数ハザード比の正規近似で作るとき、その**上限**を求めよ。
          $\log 2=«ln2»$、標準正規分布の上側 2.5% 点は 1.96 とし、指数部分は小数第 2 位に四捨五入してから次の表を使え。

          | $x$ | 0.16 | 0.54 | 0.75 | 1.06 | 1.23 |
          |---|---|---|---|---|---|
          | $e^{x}$ | «e016» | «e054» | «e075» | «e106» | «e123» |
        answer: «up»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 各プランの解約率を $d/T$ で推定し、比をとる。2 つのプランは独立なので $\log(\text{ハザード比})=\log\hat\lambda_1-\log\hat\lambda_2$ の分散は $1/d_1+1/d_2$。対数尺度で区間を作り、指数をとって戻す。

          **途中式** $\hat\lambda_{\text{電子}}=«d1»/«T1»=«lam1»$、$\hat\lambda_{\text{紙}}=«d2»/«T2»=«lam2»$ より、ハザード比の推定値は $«lam1»/«lam2»=«hr»$、$\log«hr»=«ln2»$。
          $$\mathrm{SE}=\sqrt{\frac{1}{«d1»}+\frac{1}{«d2»}}=\sqrt{«inv1»+«inv2»}=\sqrt{«se2»}=«se»$$
          上限の指数部分は
          $$«ln2»+1.96\times«se»=«ln2»+«mult»=«up_exp»\approx«up_x»$$
          $$\text{上限}=e^{«up_x»}=«e_up»$$
          （下限は $«ln2»-«mult»\approx«lo_x»$ で $e^{«lo_x»}=«e_lo»$。区間は $(«lo_s»,\ «up_s»)$。）

          **答え** $«up_s»$

          **間違えやすい点** ハザード比の尺度で直接 $«hr»\pm1.96\times\mathrm{SE}$ とすると上限は $«up_lin»$ になるが、SE は対数尺度の値なので使えない。
          分散は解約数 $d$ だけで決まり（観察期間 $T$ には依存しない）、2 群の分散を**足してから**平方根をとる。$\sqrt{1/«d1»}+\sqrt{1/«d2»}$ と標準誤差を足すと指数部分が $«up_sum_x»$ になり区間が広すぎる。
          打ち切られた人も観察期間 $T$ には含める（除くと解約率を過大に推定する）。

  - id: s24p02
    title: 広告予算の配分と読者調査の設計
    context: |
      ある出版社のマーケティング部門は、新刊のプロモーションの効率と、読者の広告認知を調べている。
    items:
      - id: s24p02a
        chapter: 3
        terms: [weighted-geometric-harmonic-mean, moments]
        topic: 予算配分の異なる3媒体のクリック単価から全体のクリック単価を加重調和平均で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある月の広告予算を、検索広告に «w1»%、SNS 広告に «w2»%、動画広告に «w3»% の割合で配分した。各媒体のクリック単価（1 クリックあたりの費用）はそれぞれ «c1» 円、«c2» 円、«c3» 円で、月内では一定だった。
          この月の広告全体のクリック単価（総費用 ÷ 総クリック数）に最も近い値はどれか。
        choices:
          - '$«am»$ 円'
          - '$«am_w»$ 円'
          - '$«gm_w»$ 円'
          - '$«hm_simple»$ 円'
          - '$«hm»$ 円'
        answer: 4
        distractors:
          - 3 つの単価を単純に算術平均した
          - 予算の割合で単価を重み付けした算術平均にした（重みはクリック数の割合であるべき）
          - 予算の割合で重み付けした幾何平均にした
          - 予算の割合を無視して単純な調和平均にした
          - 正解
        explanation: |
          **方針** 総予算を $B$ とすると、媒体 $i$ の費用は $w_iB$、クリック数は $w_iB/c_i$。全体の単価は総費用 $B$ を総クリック数で割るので、予算の割合 $w_i$ を重みとする**加重調和平均**になる。

          **途中式**
          $$\text{全体の単価}=\frac{B}{\sum_i w_iB/c_i}=\frac{1}{\sum_i w_i/c_i}=\frac{1}{«f1»+«f2»+«f3»}=\frac{1}{«fsum»}=«hm»$$

          **答え** $«hm»$ 円

          **間違えやすい点** 予算の割合で単価を平均（$0.5\times«c1»+0.3\times«c2»+0.2\times«c3»=«am_w»$）すると、安い媒体ほど多くのクリックを生むことが反映されない。
          算術平均の重みとして正しいのは**クリック数**の割合で、予算の割合で重み付けるなら調和平均になる。重みを無視した調和平均 $«hm_simple»$ とも区別する。

      - id: s24p02b
        chapter: 21
        terms: [sampling-weight, design-effect, stratified-sampling]
        topic: 若年層を多めに抽出した読者調査の抽出ウェイトからキッシュの近似式で設計効果と有効標本サイズを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          広告の認知率を調べる読者調査で、若年層の回答を十分に集めるため、年代ごとに抽出率を変えて無作為抽出した。

          | 年代 | 読者数 $N_h$ | 標本数 $n_h$ | 広告を覚えていた割合 |
          |---|---|---|---|
          | 10〜20代 | $«N1s»$ | «nn1» | «pp1» |
          | 30代以上 | $«N2s»$ | «nn2» | «pp2» |

          各回答者に抽出ウェイト $w_i=N_h/n_h$（抽出率の逆数）を付けて全体の認知率を推定する。
          ウェイトがばらつくことによる精度の低下を、キッシュの近似式による設計効果 $\mathrm{deff}=n\sum_i w_i^2\big/\left(\sum_i w_i\right)^2$（$n$ は全標本数、和は回答者全員についてとる）で評価する。
          この調査の**有効標本サイズ** $n/\mathrm{deff}$ を求めよ。
        answer: «neff»
        tolerance: 0.5
        answer_format: 小数第1位を四捨五入して整数で答えよ。±0.5 の差まで正解とする。
        explanation: |
          **方針** ウェイトは 10〜20 代で $«N1s»/«nn1»=«ww1»$、30 代以上で $«N2s»/«nn2»=«ww2»$。回答者全員についてウェイトの和と 2 乗和を求め、設計効果に代入する。

          **途中式**
          $$\sum_i w_i=«nn1»\times«ww1»+«nn2»\times«ww2»=«sw»,\qquad \sum_i w_i^2=«nn1»\times«w1sq»+«nn2»\times«w2sq»=«sw2»$$
          $$\mathrm{deff}=\frac{«nn»\times«sw2»}{«sw»^2}=\frac{1.36\times10^{10}}{«sw_sq»}=«deff»,\qquad \frac{n}{\mathrm{deff}}=\frac{«nn»}{«deff»}=«neff_s»$$
          （ウェイト付きの認知率の推定値は $(«N1s»\times«pp1»+«N2s»\times«pp2»)/100{,}000=«est_w»$。ウェイトを使わない単純平均 «est_u» は、若年層の多い標本に引きずられて過大になる。）

          **答え** $«neff»$ 人

          **間違えやすい点** 設計効果は 1 以上で、標本数を**割る**（$«nn»\times«deff»=«n_deff_wrong»$ と掛けるのは誤り）。
          ウェイトが等しければ $\mathrm{deff}=1$ で、ばらつくほど大きくなる。過大抽出は若年層の推定には有利だが、全体の推定では «nn» 人分の情報が約 «neff» 人分に減る。

  - id: s24p03
    title: 動画の再生回数の分布
    context: |
      ある動画配信プラットフォームで、投稿された動画の再生回数（単位：千回）$Y$ の分布をモデル化する。再生回数は右に長く裾を引くので、変換してから正規分布を当てはめる。
    items:
      - id: s24p03a
        chapter: 4
        terms: [box-cox-transformation, power-transformation]
        topic: Box-Cox変換（λ=0.5）後に正規分布を当てはめた動画の再生回数が一定値を超える確率を逆変換の境界から求める
        level: 標準
        definition: false
        type: choice
        question: |
          料理カテゴリーの動画では、ボックス・コックス変換
          $$W=\frac{Y^{\lambda}-1}{\lambda},\qquad \lambda=«lam»$$
          をした $W$ が平均 «mu»、標準偏差 «sig» の正規分布に従うとみなせた。料理カテゴリーの動画の再生回数が «y0» 千回を超える確率に最も近いものはどれか。
          必要なら標準正規分布の分布関数の値 $\Phi(0.8)=«phi08»$、$\Phi(1.2)=«phi12»$、$\Phi(1.6)=«phi16»$、$\Phi(2.4)=«phi24»$ を使え。
        choices:
          - '$«a_sqrt»$'
          - '$«ans_a»$'
          - '$«a_nom1»$'
          - '$«a_nolam»$'
          - '$«a_comp»$'
        answer: 1
        distractors:
          - 変換を √Y だけとし、-1 と 1/λ を忘れた
          - 正解
          - -1 を忘れて √Y/λ とした
          - 1/λ を掛け忘れて √Y-1 とした
          - P(Y≦64) の側（余事象）を答えた
        explanation: |
          **方針** $\lambda>0$ のボックス・コックス変換は $Y$ の増加関数なので、$Y>«y0»$ は $W>w_0$（$w_0$ は «y0» を変換した値）と同値。境界を変換してから標準化する。

          **途中式**
          $$w_0=\frac{«y0»^{0.5}-1}{«lam»}=\frac{«sy0»-1}{«lam»}=«w0»$$
          $$P(Y>«y0»)=P(W>«w0»)=P\left(Z>\frac{«w0»-«mu»}{«sig»}\right)=P(Z>«z»)=1-«phi16»=«ans_a»$$

          **答え** $«ans_a»$

          **間違えやすい点** 変換の式の $-1$ と $1/\lambda$ を省くと境界がずれる：$\sqrt{«y0»}=«sy0»$ のままだと $z=«z_sqrt»$ で $«a_sqrt»$、$-1$ を忘れると $w_0=«w_nom1»$ で $«a_nom1»$、$1/\lambda$ を忘れると $w_0=«w_nolam»$ で $«a_nolam»$ になる。
          平均 «mu» は変換後の尺度の値なので、境界も必ず変換後の尺度にそろえる。

      - id: s24p03b
        chapter: 6
        terms: [lognormal-distribution, normal-distribution]
        topic: 対数正規分布に従う再生回数で平均を上回る動画の割合がσだけで決まることを使って求める
        level: 標準
        definition: false
        type: choice
        question: |
          ゲーム実況カテゴリーでは $\lambda\to0$ の場合にあたる対数変換がよく当てはまり、$\log Y$ が平均 $\mu$、標準偏差 $\sigma=«sg»$ の正規分布に従う（$Y$ は対数正規分布に従う）とみなせた。
          このカテゴリーの動画のうち、再生回数が**平均** $E[Y]$ を上回る動画の割合に最も近いものはどれか。$\mu$ の値は与えられていない。
          必要なら $\Phi(0.6)=«phi06»$、$\Phi(0.72)=«phi072»$、$\Phi(1.2)=«phi12»$ を使え。
        choices:
          - '$«b_half»$'
          - '$«b_var»$'
          - '$«ans_b»$'
          - '$«b_sig»$'
          - '$«b_comp»$'
        answer: 2
        distractors:
          - 対数正規分布の平均と中央値が等しいと考えた
          - 境界を μ+σ²/2 としたが σ ではなく 1 で割って標準化した（z=σ²/2）
          - 正解
          - 平均を μ+σ と取り違えた
          - 平均を下回る割合（余事象）を答えた
        explanation: |
          **方針** 対数正規分布の平均は $E[Y]=e^{\mu+\sigma^2/2}$。$Y>E[Y]$ は $\log Y>\mu+\sigma^2/2$ と同値なので、$\log Y$ の正規分布で標準化すれば $\mu$ が消える。

          **途中式**
          $$P(Y>E[Y])=P\left(\log Y>\mu+\frac{\sigma^2}{2}\right)=P\left(Z>\frac{\sigma^2/2}{\sigma}\right)=P\left(Z>\frac{\sigma}{2}\right)=1-\Phi(«sgh»)=1-«phi06»=«ans_b»$$

          **答え** $«ans_b»$（$\mu$ によらない）

          **間違えやすい点** 対数正規分布は右に裾が長く、平均 $e^{\mu+\sigma^2/2}$ は中央値 $e^{\mu}$ より大きい。そのため平均を上回る動画は半分より少ない（$0.5$ ではない）。
          標準化では $\sigma^2/2$ を標準偏差 $\sigma=«sg»$ で割る：$z=«sg2h»$ のまま使うと $«b_var»$ になる。$\sigma$ が大きいほど少数の大ヒット動画が平均を押し上げ、平均を上回る割合は小さくなる。

  - id: s24p04
    title: SNS 広告の効果測定
    context: |
      ある出版社は、新刊の告知を SNS 広告で配信している。広告の表示回数とクリック数、シェア数を記録して効果を評価する。
    items:
      - id: s24p04a
        chapter: 7
        terms: [delta-method, central-limit-theorem, covariance-and-correlation]
        topic: 日次の表示回数とクリック数の比として求めたクリック率の標準誤差を共分散を含む2変数のデルタ法で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          ある広告を «n» 日間配信し、日ごとの表示回数 $X_i$（千回）とクリック数 $Y_i$（千回）を記録した。
          $(X_i,Y_i)$ は日ごとに独立で同じ分布に従うとし、標本から次の値を得た（標準偏差は不偏分散の平方根）。

          | | 平均 | 標準偏差 |
          |---|---|---|
          | 表示回数 $X$ | «mx» | «sx» |
          | クリック数 $Y$ | «my» | «sy» |

          $X$ と $Y$ の標本相関係数は «rho» だった。期間全体のクリック率を $\hat R=\bar Y/\bar X$ で推定する（$\hat R=«R»$、すなわち «Rpct»%）。
          2 変数のデルタ法（標本の値を母数に代入する）で、$\hat R$ を**パーセント表示**したときの標準誤差（%ポイント）を求めよ。
        answer: «se_pct»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $g(\bar x,\bar y)=\bar y/\bar x$ を母平均 $(\mu_X,\mu_Y)$ のまわりで 1 次近似する。偏微分は $\partial g/\partial\bar x=-\mu_Y/\mu_X^2$、$\partial g/\partial\bar y=1/\mu_X$ なので、$R=\mu_Y/\mu_X$ とおくと
          $$V[\hat R]\approx\frac{1}{n\mu_X^2}\left(\sigma_Y^2-2R\,\sigma_{XY}+R^2\sigma_X^2\right)$$
          $\bar X$ と $\bar Y$ は同じ日のデータから作るので、共分散の項が入る。

          **途中式** 共分散 $\sigma_{XY}=«rho»\times«sx»\times«sy»=«sxy»$。
          $$\sigma_Y^2-2R\sigma_{XY}+R^2\sigma_X^2=«t1»-2\times«R»\times«sxy»+«R»^2\times«sx»^2=«t1»-«t2»+«t3»=«inner»$$
          $$V[\hat R]\approx\frac{«inner»}{«n»\times«mx»^2}=\frac{«inner»}{«den»},\qquad V[100\hat R]=10^4\times\frac{«inner»}{«den»}=«var_pct»$$
          $$\mathrm{SE}(100\hat R)=\sqrt{«var_pct»}=«se_pct5»\cdots$$

          **答え** $«se_pct_s»$ %ポイント

          **間違えやすい点** 共分散の項 $-2R\sigma_{XY}$ を落とすと $«se_nocov»$ と 2 倍以上になる。表示回数が多い日はクリックも多い（正の相関）ので、比はばらつきにくい。
          分母 $\bar X$ を定数とみなして $\mathrm{SE}(\bar Y)/\bar X$ とすると $«se_y»$ になる。パーセント表示では標準誤差も 100 倍になることに注意。

      - id: s24p04b
        chapter: 12
        terms: [proportion-test, score-test, p-value]
        topic: 新フォーマットのシェア率が従来の2%を上回るかを帰無仮説の比率で標準化する1標本比率のz検定で調べワルド型と区別する
        level: 基本
        definition: false
        type: choice
        question: |
          新しい広告フォーマットを無作為に選んだ «m» 人に表示したところ、«x» 人が広告をシェアした。従来のフォーマットのシェア率は «p0»（2%）である。
          「新フォーマットのシェア率 $p$ は従来より高い」かを、$H_0:p=«p0»$、$H_1:p>«p0»$ の片側検定で調べる。
          検定統計量は、**帰無仮説のもとでの**標準誤差で標準化した $Z=(\hat p-p_0)\big/\sqrt{p_0(1-p_0)/n}$ とし、正規近似（連続修正なし）で p 値を求める。
          統計量の値・p 値・有意水準 5% での結論の組として正しいものはどれか。必要なら $\Phi(0.11)=«phi011»$、$\Phi(1.63)=«phi163»$、$\Phi(2.14)=«phi214»$ を使え。
        choices:
          - '$Z\approx«zw»$、p 値 $\approx«pvw»$ で、帰無仮説を棄却しない'
          - '$Z\approx«zn»$、p 値 $\approx«pvn»$ で、帰無仮説を棄却しない'
          - '$Z\approx«z»$、p 値 $\approx«pv»$ で、帰無仮説を棄却する'
          - '$Z\approx«z»$、p 値 $\approx«pv2»$ で、帰無仮説を棄却する'
          - '$Z\approx«z»$、p 値 $\approx«pvl»$ で、帰無仮説を棄却しない'
        answer: 2
        distractors:
          - 標本比率 p̂ で標準誤差を作るワルド型の統計量を使った（問題の定義と違う）
          - 標準誤差の分母の n で割り忘れた
          - 正解
          - 片側検定なのに両側の p 値（2 倍）を答えた
          - p 値を下側の確率 Φ(z) とした
        explanation: |
          **方針** 帰無仮説 $p=p_0$ のもとでは $\hat p$ の分散は $p_0(1-p_0)/n$ と決まっている（スコア型の統計量）。これで標準化して上側確率を求める。

          **途中式** $\hat p=«x»/«m»=«ph»$、$\hat p-p_0=«dp»$。
          $$\sqrt{\frac{p_0(1-p_0)}{n}}=\sqrt{\frac{«v0»}{«m»}}=«se0»,\qquad Z=\frac{«dp»}{«se0»}=«z4»\approx«z»$$
          $$p\text{ 値}=1-\Phi(«z»)=1-«phi214»=«pv»<0.05$$

          **答え** $Z\approx«z»$、p 値 $\approx«pv»$ で、有意水準 5% で棄却する（シェア率は 2% より高いといえる）。

          **間違えやすい点** $\hat p$ を使う標準誤差 $\sqrt{\hat p(1-\hat p)/n}=«sew»$ で割ると $Z=«zw»$ となり、p 値 «pvw» で結論が逆になる。帰無仮説の比率が決まっている 1 標本の検定では $p_0$ で標準化する（ワルド型は区間推定でよく使う）。
          片側検定なので p 値は 2 倍しない。期待度数 $np_0=«np0»$ は大きくないので、境界に近い場合は正確な二項検定で確かめるとよい。

