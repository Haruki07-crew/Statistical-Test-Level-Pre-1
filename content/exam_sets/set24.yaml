          **間違えやすい点** 正の固有値の分だけを使えば、近似的な配置（ここでは 1 次元）は作れる。負の固有値の大きさは、ユークリッド距離からのずれの目安になる。
          3 点の非類似度が三角不等式を満たしていれば、必ず平面上に正確に配置できる。
