          **答え** $«jac_s»$

          **間違えやすい点** 単純一致係数 $(a+d)/«m»=«sm»$ は、両方とも読まない雑誌も「似ている」と数える。多くの人が読まない雑誌が多いと、だれとだれも似ているように見えてしまうので、「読む」ことに意味がある 2 値データではジャカード係数がよく使われる。
