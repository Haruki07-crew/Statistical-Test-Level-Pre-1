          古典的多次元尺度法では、非類似度の 2 乗の行列 $D^{(2)}$ を二重中心化した $B=-\dfrac12JD^{(2)}J$（$J=I-\dfrac13\mathbf1\mathbf1^\top$）の固有値と固有ベクトルから座標を作る。正しい記述はどれか。
        choices:
