  - id: s24p14
    title: 広告接触の因果効果
    context: |
      ある通販雑誌の Web 広告について、利用者ごとの広告接触時間 $X$ と購入額 $Y$ の関係を分析する。商品への関心度 $Z$ は、広告をよく見ることにも購入にも影響する。
      変数は次の線形構造方程式に従うとする（$Z,\ \varepsilon_X,\ \varepsilon_Y$ は互いに独立で平均 0、$V[Z]=1$、$V[\varepsilon_X]=1$）。
      $$X=«a»Z+\varepsilon_X,\qquad Y=«b»X+«c»Z+\varepsilon_Y$$
    items:
      - id: s24p14a
        chapter: 33
        terms: [causal-effect, backdoor-criterion]
        topic: 関心度が広告接触と購入額の両方に効く線形構造方程式で単回帰の傾きを共分散から求め介入効果との差（交絡バイアス）を示す
        level: 応用
        definition: false
        type: choice
        question: |
          十分大きな標本で $Y$ を $X$ だけに回帰したときの傾き（母集団での値）と、$X$ を介入によって 1 単位増やしたときの $Y$ の期待値の変化（因果効果）について、正しいものはどれか。
        choices:
          - '単回帰の傾きは約 «w_v1» で、因果効果 «b» の 2 倍になる'
          - '単回帰の傾きは約 «naive» で、これがそのまま因果効果である'
          - '単回帰の傾きは約 «naive» で、$Z$ も説明変数に加えた重回帰の $X$ の係数 «b» が因果効果である'
          - '単回帰の傾きは約 «cxy» で、$Z$ も説明変数に加えた重回帰の $X$ の係数 «b» が因果効果である'
          - '単回帰の傾きは «b» で、交絡による偏りは生じない'
        answer: 2
        distractors:
          - V[X] を 1 とみなして Cov(X,Y) を割らなかった（V[X]=0.36+1 を見落とした）
          - 交絡を考えず、単回帰の傾きを因果効果とみなした
          - 正解
          - 共分散 Cov(X,Y) をそのまま傾きとし、V[X] で割らなかった
          - Z が X と Y の両方に影響する交絡因子であることを見落とした
        explanation: |
          **方針** 単回帰の傾きは $\mathrm{Cov}(X,Y)/V[X]$。構造方程式から共分散を計算する。一方、介入 $do(X=x)$ では $X$ を外から決めるので $Z\to X$ の矢印が切れ、$Y$ の期待値は $X$ の係数 «b» だけ変わる。

          **途中式** $V[X]=«a»^2V[Z]+V[\varepsilon_X]=«a2»+1=«vx»$、$\mathrm{Cov}(X,Z)=«a»V[Z]=«cxz»$。
          $$\mathrm{Cov}(X,Y)=«b»V[X]+«c»\,\mathrm{Cov}(X,Z)=«bvx»+«ccxz»=«cxy»$$
          $$\text{単回帰の傾き}=\frac{«cxy»}{«vx»}=«naive4»$$
          $Z$ は $X\leftarrow Z\to Y$ のバックドア経路を作る交絡因子で、$Z$ を条件づけるとこの経路がふさがる。$Z$ も説明変数に入れた重回帰では、$X$ の係数は構造方程式の係数 «b»（因果効果）に一致する。

          **答え** 単回帰の傾きは約 «naive» で、$Z$ を加えた重回帰の係数 «b» が因果効果。

          **間違えやすい点** 単回帰の傾きは因果効果より $«bias»$ だけ大きい（関心の高い人ほど広告をよく見て、しかも多く買うため）。
          $V[X]$ は $«a»^2+1=«vx»$ で 1 ではない。$V[X]=1$ とみなすと傾きを $«b»+«c»\times«a»=«w_v1»$ と誤る。
