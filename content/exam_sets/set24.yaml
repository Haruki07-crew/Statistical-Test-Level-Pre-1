      あるニュースサイトは、記事ページの 2 つのレイアウトの読者の滞在時間（秒）を比べている。
    items:
      - id: s24p05a
        chapter: 9
        terms: [required-sample-size, ci-two-sample-mean-difference]
        topic: 2つの記事レイアウトの平均読了時間の差の95%信頼区間の半幅を目標以下にする各群の記事数を予備調査の標準偏差から求める
        level: 標準
