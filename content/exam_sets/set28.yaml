        question: |
          外れ値の影響を抑えるため、フーバーの M 推定を反復重み付き最小二乗法で求める。各反復で、残差 $r_i$ を尺度の推定値 $s$ で割った $u_i=r_i/s$ に対して
          $$w_i=\min\left(1,\ \frac{c}{|u_i|}\right),\qquad c=«kk»$$
          を重みとして重み付き最小二乗を行う。ある反復で $s=«sig»$ のとき、残差 $r_i=«r»$ の点の重み $w_i$ に最も近いものはどれか。
        choices:
          - "$«w»$"
          - "$«w_sq»$"
          - "$«w_raw»$"
          - "$«w_bi»$"
          - "$«w_one»$"
        answer: 0
        distractors:
          - 正解
          - 重みを2乗した
          - 残差を尺度で割らずに c/|r| とした
          - フーバーではなくテューキーの双加重（c=4.685）の重みを使った
          - 残差の大きさを見ずに重み1（通常の最小二乗）とした
        explanation: |
          **方針** フーバーの方法では、尺度で割った残差の絶対値が $c$ 以下の点は重み 1、$c$ を超える点は重み $c/|u|$ に下げる。まず残差を尺度で割る。

          **途中式** $|u_i|=|«r»|/«sig»=«u»>«kk»$ なので
          $$w_i=\frac{«kk»}{«u»}=«w4»\cdots$$

          **答え** $«w»$

          **間違えやすい点** 尺度で割らないと $«kk»/6.4=«w_raw»$ となり、データの単位で重みが変わってしまう。重み関数は $\psi(u)/u$ で、2 乗はしない（$«w_sq»$ は誤り）。
          テューキーの双加重 $w=\{1-(u/4.685)^2\}^2$ なら $«w_bi»$ だが、これは別の推定法である。

  - id: s28p08
    title: 新しい洗浄工程の効果
    context: |
      ウェーハ洗浄工程に新しい薬液（新方式）を導入し、パーティクル起因の不良が減ったかを 3 つの方法で調べた。
    items:
      - id: s28p08a
        chapter: 28
        terms: [mantel-haenszel-test, three-way-table]
        topic: 2つの製造ラインで層別した2×2表から洗浄方式と不良の関連をコクラン・マンテル・ヘンツェル検定統計量で調べる
        level: 応用
        definition: false
        type: numeric
        question: |
          2 つのラインで、新方式と旧方式のウェーハを調べた結果は次の通りだった。

          | ライン | 方式 | 不良 | 良 | 計 |
          |---|---|---|---|---|
          | 1 | 新 | «a1» | «b1» | «n11» |
          | 1 | 旧 | «c1» | «d1» | «n21» |
          | 2 | 新 | «a2» | «b2» | «n12» |
          | 2 | 旧 | «c2» | «d2» | «n22» |

          ラインで層別したうえで、方式と不良の関連を連続修正をしないコクラン・マンテル・ヘンツェル検定で調べる。ライン $k$ の「新・不良」の度数を $a_k$ とし、
          各層の周辺度数を固定したときの $a_k$ の期待値と分散を $E_k,\ V_k$ として、統計量 $\left\{\sum_k(a_k-E_k)\right\}^2\big/\sum_kV_k$ の値を求めよ。
        answer: «cmh»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 各層の 2×2 表で周辺度数を固定すると $a_k$ は超幾何分布に従い、$E_k=\dfrac{n_{1k}m_{1k}}{N_k}$、$V_k=\dfrac{n_{1k}n_{2k}m_{1k}m_{2k}}{N_k^2(N_k-1)}$（$n$ は行の計、$m$ は列の計）。層ごとの「観測 − 期待」を足してから 2 乗する。

          **途中式**
          ライン 1：$n_1=«n11»,\ n_2=«n21»,\ m_1=«m11»,\ m_2=«m21»,\ N=«N1»$。
          $$E_1=\frac{«n11»\times«m11»}{«N1»}=«E1»,\qquad V_1=\frac{«n11»\times«n21»\times«m11»\times«m21»}{«N1sq»\times«N1m1»}=«V1»$$
          ライン 2：$n_1=«n12»,\ n_2=«n22»,\ m_1=«m12»,\ m_2=«m22»,\ N=«N2»$。
          $$E_2=\frac{«n12»\times«m12»}{«N2»}=«E2»,\qquad V_2=\frac{«n12»\times«n22»\times«m12»\times«m22»}{«N2sq»\times«N2m1»}=«V2»$$
          $$\sum(a_k-E_k)=(«a1»+«a2»)-(«E1»+«E2»)=«num»,\qquad \sum V_k=«vsum»$$
          $$\chi^2_{\text{CMH}}=\frac{(«num»)^2}{«vsum»}=\frac{«num2»}{«vsum»}=«cmh_s»$$

          **答え** $«cmh_s»$（自由度 1 のカイ二乗分布の上側 5% 点 «chi1» を超えるので、ラインの違いを調整しても新方式と不良には関連がある）

          **間違えやすい点** 層ごとにカイ二乗統計量を出して足すのではなく、「観測 − 期待」を層をまたいで足してから 2 乗する。そのため、どの層でも同じ向きの差があると検出しやすい。
          層を無視して 2 つのラインを合計した 1 つの 2×2 表で検定すると、ラインの違い（不良率と新方式の割合がともにラインで違うこと）が混ざってしまう。

      - id: s28p08b
        chapter: 33
        terms: [causal-effect]
        topic: 新方式を導入したラインと導入しなかったラインの導入前後の不良率から差の差で導入の効果を求める
        level: 基本
        definition: false
        type: choice
        question: |
          ライン A だけに新方式を導入し、ライン B は旧方式のままにした。導入前後 1 か月の不良率（%）は次の通りだった。

          | | 導入前 | 導入後 |
          |---|---|---|
          | ライン A（導入） | «pa0» | «pa1» |
          | ライン B（未導入） | «pb0» | «pb1» |

          「新方式がなくても 2 つのラインの不良率は同じだけ変化した」（平行トレンド）と仮定するとき、ライン A での新方式導入の効果（不良率の変化、ポイント）の推定値はどれか。
        choices:
          - "$«dA»$"
          - "$«post»$"
          - "$«did»$"
          - "$«did_rev»$"
          - "$+«pre»$"
        answer: 2
        distractors:
          - ライン A の導入前後の差だけを見て、同じ期間の全体的な変化を差し引かなかった
          - 導入後の2ラインの差だけを見て、導入前からあったライン間の差を考えなかった
          - 正解
          - ライン B の変化を引かずに足した
          - 導入前の2ラインの差（もともとの違い）を答えた
        explanation: |
          **方針** 差の差（difference-in-differences）法。平行トレンドの仮定のもとで、ライン A が新方式を入れなかった場合の変化はライン B の変化に等しいとみなし、A の変化から B の変化を引く。

          **途中式**
          $$\text{A の変化}=«pa1»-«pa0»=«dA»,\qquad \text{B の変化}=«pb1»-«pb0»=«dB»$$
          $$\text{効果}=(«dA»)-(«dB»)=«did»$$

          **答え** $«did»$ ポイント

          **間違えやすい点** A の前後差 $«dA»$ には、季節や原料ロットなど両ラインに共通する変化も含まれる。導入後の A と B の差 $«post»$ には、導入前からあったライン間の差 $«pre»$ が混ざる。
          平行トレンドの仮定が崩れていれば（もともと A の不良率が下がる傾向にあったなど）、差の差でも偏りが残る。

      - id: s28p08c
        chapter: 18
        terms: [poisson-regression, overdispersion, generalized-linear-model]
        topic: 0個のウェーハが多いパーティクル数をゼロ過剰ポアソンモデルで表したときの0の確率と分散を求めポアソン分布と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          新方式のウェーハ 1 枚あたりのパーティクル数 $Y$ には 0 個のウェーハが多く、ポアソン分布では説明しにくかった。そこで、確率 $\pi$ で「汚染のない状態」（必ず $Y=0$）、確率 $1-\pi$ で平均 $\mu$ のポアソン分布に従う
          ゼロ過剰ポアソン（ZIP）モデルを当てはめ、$\hat\pi=«n8_pi»$、$\hat\mu=«n8_mu»$ を得た。このモデルでの $P(Y=0)$ と $V[Y]$ の組として正しいものはどれか。必要なら $e^{-2}=«n8_e2»$、$e^{-1.6}=«n8_e16»$ を使え。
        choices:
          - '$P(Y=0)=«n8_p0»$、$V[Y]=«n8_m»$'
          - '$P(Y=0)=«n8_w0»$、$V[Y]=«n8_v»$'
          - '$P(Y=0)=«n8_pois»$、$V[Y]=«n8_m»$'
          - '$P(Y=0)=«n8_p0»$、$V[Y]=«n8_v»$'
          - '$P(Y=0)=«n8_p0»$、$V[Y]=«n8_mu»$'
        answer: 3
        distractors:
          - 分散を平均と等しいとした（ZIP では分散が平均より大きい）
          - 汚染のない状態からの 0（確率 π）を足し忘れた
          - 同じ平均のポアソン分布の値を答えた
          - 正解
          - 分散をポアソン部分の平均 μ とした（混合による分散の増加を落とした）
        explanation: |
          **方針** ZIP は「必ず 0」と「ポアソン分布」の混合。0 の確率は両方から来る。平均と分散は、どちらの状態かを $Z$ として、条件付き期待値と全分散の公式で求める。

          **途中式**
          $$P(Y=0)=\pi+(1-\pi)e^{-\mu}=«n8_pi»+«n8_q»\times«n8_e2»=«n8_p04»$$
          $$E[Y]=(1-\pi)\mu=«n8_m»,\qquad V[Y]=E[V[Y\mid Z]]+V[E[Y\mid Z]]=(1-\pi)\mu+\pi(1-\pi)\mu^2=(1-\pi)\mu(1+\pi\mu)=«n8_v»$$

          **答え** $P(Y=0)=«n8_p0»$、$V[Y]=«n8_v»$

          **間違えやすい点** 同じ平均 «n8_m» のポアソン分布なら $P(Y=0)=e^{-1.6}=«n8_e16»$、分散 «n8_m» で、0 の割合も分散も小さい。ZIP は 0 の多さと過分散を同時に表せる。
          過分散だけなら負の二項分布でも表せるので、どちらがよいかは AIC などで比べる。

  - id: s28p09
    title: エッチングの2因子実験
    context: |
      エッチング量（nm）に対する RF 電力 A（低・高）と圧力 B（低・高）の効果を調べるため、4 通りの条件にそれぞれ «n9_r» 枚のウェーハを無作為に割り付けた（計 «n9_N» 枚）。条件ごとの平均は次のとおりで、
      繰り返しのある二元配置分散分析の誤差の平均平方は «n9_mse»（自由度 «n9_dfe»）だった。

      | | B 低 | B 高 |
      |---|---|---|
      | A 低 | «n9_m11» | «n9_m12» |
      | A 高 | «n9_m21» | «n9_m22» |
    items:
      - id: s28p09a
        chapter: 20
        terms: [main-effect-and-interaction, two-way-anova-with-replication, factorial-design]
        topic: 2×2要因実験の条件ごとの平均から交互作用の対比と平方和を求め誤差の平均平方でF検定する
        level: 標準
        definition: false
        type: choice
        question: |
          交互作用 A×B の平方和と $F$ 値の組として正しいものはどれか。必要なら $F_{0.05}(1,«n9_dfe»)=«n9_fc»$ を使え。
        choices:
          - '平方和 «n9_w1»、$F=«n9_w1F»$（交互作用は有意でない）'
          - '平方和 «n9_ss»、$F=«n9_F»$（«n9_fc» を下回り、交互作用は有意でない）'
          - '平方和 «n9_w2»、$F=«n9_w2F»$（«n9_fc» を上回り、交互作用は有意）'
          - '平方和 «n9_w3»、$F=«n9_w3F»$（交互作用は有意でない）'
          - '平方和 «n9_wA»、$F=«n9_wAF»$（«n9_fc» を上回り、交互作用は有意）'
        answer: 1
        distractors:
          - 平方和に各条件の繰り返し数 r を掛け忘れた
          - 正解
          - 対比の 2 乗に r を掛けたが、係数の 2 乗和 4 で割り忘れた
          - 係数の 2 乗和 4 ではなく 2 で割った
          - A の主効果の平方和を交互作用と取り違えた
        explanation: |
          **方針** 2×2 の要因実験では、交互作用の対比は $L_{AB}=\bar y_{22}-\bar y_{21}-\bar y_{12}+\bar y_{11}$（係数 $\pm1$ の 4 つ）。各条件 $r$ 枚なので、平方和は $\mathrm{SS}_{AB}=rL_{AB}^2/\sum c^2=rL_{AB}^2/4$（自由度 1）。

          **途中式**
          $$L_{AB}=(«n9_m22»-«n9_m21»)-(«n9_m12»-«n9_m11»)=«n9_dA2»-«n9_dA1»=«n9_L»$$
          $$\mathrm{SS}_{AB}=\frac{«n9_r»\times«n9_L»^2}{4}=«n9_ss»,\qquad F=\frac{«n9_ss»}{«n9_mse»}=«n9_F»<«n9_fc»$$

          **答え** 平方和 «n9_ss»、$F=«n9_F»$。交互作用は 5% で有意でない

          **間違えやすい点** 圧力を上げたときの増え方は、電力が低いと «n9_dA1»、高いと «n9_dA2» で違って見えるが、この差は誤差の範囲である。
          A の主効果の対比は $(«n9_m21»+«n9_m22»)-(«n9_m11»+«n9_m12»)=«n9_LA»$ で、平方和は «n9_wA»。交互作用と取り違えないこと。

