        chapter: 24
        terms: [centroid-method, lance-williams-formula, hierarchical-clustering]
        topic: 重心法で大きさの違うクラスターを併合したあとの別のクラスターとの平方距離をランス・ウィリアムズの更新式で求める
        level: 標準
        definition: false
        type: choice
        question: |
          ロットを 2 つの特徴量で階層的にクラスタリングする。距離は平方ユークリッド距離、併合のしかたは重心法（クラスターの重心どうしの平方距離）とする。
          途中の段階でクラスター $G_i$（ロット 2 個）、$G_j$（ロット 1 個）、$G_k$（ロット 1 個）の重心どうしの平方距離が
          $d^2(G_k,G_i)=«dki»$、$d^2(G_k,G_j)=«dkj»$、$d^2(G_i,G_j)=«dij»$ であった。
          $G_i$ と $G_j$ を併合したあとの、新しいクラスターと $G_k$ の平方距離はどれか。
        choices:
          - "$«dnew»$"
          - "$«d_half»$"
          - "$«d_min»$"
          - "$«d_nob»$"
          - "$«d_max»$"
        answer: 0
        distractors:
          - 正解
          - クラスターの大きさを無視して重みを1/2ずつにした（メディアン法）
          - 最短距離法の更新（小さい方）を使った
          - ランス・ウィリアムズの式の d²(Gi,Gj) の項を落とした
          - 最長距離法の更新（大きい方）を使った
        explanation: |
          **方針** 重心法のランス・ウィリアムズの更新式（平方ユークリッド距離）
          $$d^2(G_k,G_i\cup G_j)=\frac{n_i}{n_i+n_j}d^2_{ki}+\frac{n_j}{n_i+n_j}d^2_{kj}-\frac{n_in_j}{(n_i+n_j)^2}d^2_{ij}$$
          を使う。新しい重心は大きさで重み付けした平均なので、重みは $n_i/(n_i+n_j)$ になる。

          **途中式** $n_i=«ni»,\ n_j=«nj»$ より重みは $2/3,\ 1/3$、最後の係数は $2/9$。
          $$\frac{2}{3}\times«dki»+\frac{1}{3}\times«dkj»-\frac{2}{9}\times«dij»=«t_i»+«t_j»+(«t_b»)=«dnew»$$

          **答え** $«dnew»$

          **間違えやすい点** 重みを 1/2 ずつにする（メディアン法）と $«d_half»$ になる。最後の項を落とすと $«d_nob»$ になり、新しい重心が $G_i$ と $G_j$ の間に来て $G_k$ に近づく分を反映できない。
          重心は平均なので、平方距離（ユークリッド距離の 2 乗）で使う式である点にも注意。

