        terms: [stratified-sampling, proportional-allocation, standard-error]
        topic: 比例配分の層別抽出で層ごとの標本標準偏差から全体の平均の推定量の標準誤差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          層別抽出による全体の平均の推定量 $\bar y_{st}=\sum_h W_h\bar y_h$（$W_h=N_h/N$）の標準誤差の推定値を求めよ。ただし有限母集団修正は無視する。
