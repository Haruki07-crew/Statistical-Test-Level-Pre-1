        chapter: 18
        terms: [poisson-regression, generalized-linear-model]
        topic: ウェーハのパーティクル数のポアソン回帰で新方式ダミーの係数と標準誤差から率比の95%信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ウェーハ 1 枚あたりのパーティクル数 $Y$ に、対数リンクのポアソン回帰 $\log E[Y]=\beta_0+\beta_1x$（$x$ は新方式なら 1、旧方式なら 0）を当てはめたところ、
          $\hat\beta_1=«beta»$、標準誤差 $«se»$ だった。パーティクル数の率比 $e^{\beta_1}$ の、ワルド型 95% 信頼区間（$\beta_1$ の尺度で作って変換する）に最も近いものはどれか。
          必要なら $e^{-0.35}=«e_b»$、$e^{-0.5852}=«e_lo»$、$e^{-0.1148}=«e_hi»$、$e^{0.1148}=«e_plo»$、$e^{0.5852}=«e_phi»$ を使え。
        choices:
          - "$«ci_raw»$"
          - "$«ci_lin»$"
          - "$«ci_ok»$"
          - "$«ci_inv»$"
          - "$«ci_delta»$"
        answer: 2
        distractors:
          - 係数の信頼区間を指数変換せずに答えた
          - 率比 e^β の点推定値に係数の標準誤差をそのまま足し引きした
          - 正解
          - 符号を逆にして旧方式に対する新方式の率比ではなく逆数の区間を作った
          - デルタ法で率比の標準誤差を e^β×SE とし、率比の尺度で対称な区間を作った
        explanation: |
          **方針** 係数 $\beta_1$ の 95% 信頼区間 $\hat\beta_1\pm1.96\,\mathrm{SE}$ を作り、両端を指数変換する。指数関数は単調なので信頼係数は保たれる。

          **途中式**
          $$«beta»\pm«z»\times«se»=«beta»\pm«zse»\ \Longrightarrow\ («lo»,\ «hi»)$$
          $$\left(e^{«lo»},\ e^{«hi»}\right)=(«e_lo»,\ «e_hi»)$$

          **答え** $«ci_ok»$（1 を含まないので、新方式でパーティクル数の平均が約 «red_lo»〜«red_hi»% 減ったといえる）

          **間違えやすい点** 係数の区間 $«ci_raw»$ のままでは率比の区間ではない。率比の点推定値 $e^{«beta»}=«e_b»$ に $\pm1.96\times«se»$ をつける $«ci_lin»$ は尺度が違う。
          デルタ法で率比の尺度に対称な区間 $«ci_delta»$ を作る方法もあるが、問題の指定（係数の尺度で作って変換）とは違い、変換した区間は点推定値に対して非対称になる。

