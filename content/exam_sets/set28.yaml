        type: choice
        question: |
          3 台のすべての対を、全体の有意水準 5% でテューキーの方法により比べる。2 つの平均の差の絶対値がこの値を超えたら有意と判定する値
          （テューキーの最小有意差 HSD）に最も近いものはどれか。必要なら、スチューデント化された範囲の上側 5% 点 $q_{0.05}(3,\ «dfe»)=«q»$、
          $t$ 分布の上側 2.5% 点 $t_{0.025}(«dfe»)=«tq»$ を使え。
        choices:
          - "$«lsd»$"
          - "$«hsd»$"
          - "$«hsd_nosqrt»$"
          - "$«hsd_2»$"
          - "$«hsd_non»$"
        answer: 1
        distractors:
          - 多重性を考えない t による最小有意差（LSD）を使った
          - 正解
          - √(MSE/n) の平方根をとり忘れて q×MSE/n とした
          - 2群の差の標準誤差 √(2MSE/n) に q を掛けた（q はすでに範囲の分布なので √2 は不要）
          - MSE を n で割り忘れた
        explanation: |
          **方針** 各群 $n$ 個の釣り合った一元配置では、テューキーの HSD は $q_{0.05}(k,\ N-k)\sqrt{\mathrm{MSE}/n}$。

          **途中式** 誤差自由度 $«N»-«k»=«dfe»$、$\mathrm{MSE}=«sse»/«dfe»=«mse»$。
          $$\mathrm{HSD}=«q»\times\sqrt{\frac{«mse»}{«n»}}=«q»\times\sqrt{«msen»}=«q»\times«rt»=«hsd»$$
          平均の差は $|1-2|=«d12»$、$|1-3|=«d13»$、$|2-3|=«d23»$ なので、有意になるのは装置 1 と装置 3 の対だけ。

          **答え** $«hsd»$

          **間違えやすい点** 多重性を考えず $t$ の最小有意差 $«tq»\times\sqrt{2\times«mse»/«n»}=«lsd»$ を使うと、1 と 2 の対まで有意と判定してしまう（全体の第 1 種の誤りが 5% を超える）。
          $q$ は平均の範囲をそのまま標準化した分布なので、差の標準誤差 $\sqrt{2\mathrm{MSE}/n}$ に掛けると $«hsd_2»$ と大きくなりすぎる（$\sqrt2$ の分が二重）。

