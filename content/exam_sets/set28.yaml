          - 分母の 1 を落としてバートレット法の因子得点を求めた
          - 負荷量で重み付けした和 λ'z をそのまま因子得点とした
        explanation: |
          **方針** 与えられた式から $\hat f=\lambda^\top\Sigma^{-1}z=\dfrac{\lambda^\top\Psi^{-1}z}{1+\lambda^\top\Psi^{-1}\lambda}=\dfrac{\sum_i\lambda_iz_i/\psi_i}{1+\sum_i\lambda_i^2/\psi_i}$。独自分散の小さい（信頼できる）センサーほど重みが大きい。

          **途中式** $\psi=(«p1»,\ «p2»,\ «p3»)$。
          $$\sum\frac{\lambda_i^2}{\psi_i}=«q1»+«q2»+«q3»=«qs»,\qquad \sum\frac{\lambda_iz_i}{\psi_i}=«g1»+«g2»+(«g3»)=«gs»$$
          $$\hat f=\frac{«gs»}{1+«qs»}=\frac{«gs»}{«qs1»}=«f_reg4»\cdots$$

          **答え** $«f_reg»$

          **間違えやすい点** 分母の 1 を落とすとバートレット法の得点 $«f_bart»$ になる。回帰法は $E[f\mid z]$ にあたり、0 の方向に縮んだ値になる。
          独自分散を無視した $«f_ls»$ や、単純平均 $«f_mean»$ は、センサーごとの精度の違いを反映しない。

  - id: s28p12
    title: 計測装置の待ち行列
    context: |
      膜厚の計測装置 1 台に、ウェーハが 1 時間あたり平均 «lam» 枚のポアソン過程で到着する。計測時間は平均 «ms» 分の指数分布に従い、
      先着順に 1 枚ずつ計測する（待ち場所の大きさに制限はない M/M/1 待ち行列）。
    items:
      - id: s28p12a
        chapter: 15
        terms: [mm1-queue, littles-law, traffic-intensity]
        topic: M/M/1の計測装置で平均滞在時間から計測を待っているウェーハの平均枚数をリトルの公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          定常状態で、計測中のものを除き、計測を待っているウェーハの平均枚数 $L_q$ を求めよ。
        answer: «Lq»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 到着率 $\lambda$、処理率 $\mu$ の M/M/1 では、利用率 $\rho=\lambda/\mu<1$ のとき平均滞在時間は $W=1/(\mu-\lambda)$。
          待ち時間は $W_q=W-1/\mu$、待ち行列の長さはリトルの公式 $L_q=\lambda W_q$ で求める。

          **途中式** 単位を「時間」にそろえる。$\mu=60/«ms»=«mu»$ 枚/時、$\rho=«lam»/«mu»=«rho»$。
          $$W=\frac{1}{\mu-\lambda}=«Wh}\ \text{時間}=«W»\ \text{分},\qquad W_q=«W»-«ms»=«Wq»\ \text{分}=«Wqh»\ \text{時間}$$
          $$L_q=\lambda W_q=«lam»\times«Wqh»=«Lq_s»$$
          （公式 $L_q=\rho^2/(1-\rho)=«Lq_f»$ とも一致する。）

          **答え** $«Lq_s»$ 枚

          **間違えやすい点** 系内の平均枚数 $L=\rho/(1-\rho)=«L»$ は計測中の 1 枚分（平均 $\rho$）を含む。
          リトルの公式で $\lambda$（枚/時）と $W_q$（分）の単位をそろえないと $«Lq_min»$ のような値になる。
