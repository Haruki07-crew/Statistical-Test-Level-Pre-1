  - id: s28p11
    title: 検査装置のセンサーによる不良判別
    context: |
      ウェーハの最終検査で、センサーの計測値を使って不良品の判別やロットの分類を行っている。
    items:
      - id: s28p11a
        chapter: 23
        terms: [quadratic-discriminant-analysis, bayes-discriminant-rule]
        topic: 分散が異なる1次元の2群正規分布で2次判別を行い不良と判別される範囲が両側に分かれることを境界の2次方程式から求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある 1 つのセンサー値 $x$ は、良品では $N(«m0»,\ «s0»^2)$、不良品では $N(«m1»,\ «s1»^2)$ に従う。事前確率は等しく、誤判別のコストも等しいとして、
          密度の大きい方の群に判別する（2 次判別）。不良品と判別される $x$ の範囲として最も適切なものはどれか。必要なら $\ln2=«ln2»$ を使え。
        choices:
          - "$x>«mid»$"
          - "$x>«xh»$"
          - "$x<«yl»$ または $x>«yh»$"
          - "$x<«xl»$ または $x>«xh»$"
          - "$«xl»<x<«xh»$"
        answer: 3
        distractors:
          - 分散が等しいとみなして2つの平均の中点を境界にした（線形判別）
          - 2次方程式の大きい方の解だけをとり、左側の不良の領域を見落とした
          - 正規密度の係数 1/σ の差（ln 2 の項）を落とした
          - 正解
          - 不等号の向きを逆にして良品の領域を答えた
        explanation: |
          **方針** 各群の対数密度 $-\ln\sigma-\dfrac{(x-\mu)^2}{2\sigma^2}$ を比べる。分散が違うと境界は $x$ の 2 次方程式になり、分散の大きい不良品の群は両側に広がる。

          **途中式** 不良と判別する条件は
          $$-\ln«s1»-\frac{(x-«m1»)^2}{2\times«v1»}>-\ln«s0»-\frac{(x-«m0»)^2}{2\times«v0»}\iff\frac{(x-«m0»)^2}{8}-\frac{(x-«m1»)^2}{32}>\ln2$$
          両辺を 32 倍して整理すると $4(x-«m0»)^2-(x-«m1»)^2>32\ln2=«c32»$、すなわち
          $$3x^2-292x+«c0»-«c32»=3x^2-292x+«c»>0$$
          判別式 $292^2-12\times«c»=«disc»$、$\sqrt{«disc»}=«rdisc»$ より解は $x=(292\pm«rdisc»)/6=«xl»,\ «xh»$。2 次の係数が正なので、2 つの解の外側が不良の領域。

          **答え** $x<«xl»$ または $x>«xh»$

          **間違えやすい点** 分散を等しいとみなす線形判別の境界 $«mid»$ とは違い、大きい側だけでなく小さい側にも不良の領域ができる。
          $\ln\sigma$ の項を落とすと、判別式 $«disc0»$ から $x<«yl»$ または $x>«yh»$ となる。

