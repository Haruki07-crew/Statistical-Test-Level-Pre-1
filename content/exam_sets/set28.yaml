          回帰法（トムソン法）の因子得点 $\hat f=\lambda^\top\Sigma^{-1}z$（$\Sigma=\lambda\lambda^\top+\Psi$）に最も近いものはどれか。
          必要なら $\Sigma^{-1}\lambda=\dfrac{\Psi^{-1}\lambda}{1+\lambda^\top\Psi^{-1}\lambda}$ を使ってよい。
