      ある部品の出荷前検査で、製造日の異なる 3 つのロット（層）から比例配分で合計 «n» 個を単純無作為に抜き取り、端子のめっき厚（単位 0.01 µm）を測った。

      | ロット | 1 | 2 | 3 |
      |---|---|---|---|
      | 個数 $N_h$ | «N0» | «N1» | «N2» |
      | 抜取数 $n_h$ | «n0» | «n1» | «n2» |
      | 標本標準偏差 $s_h$ | «s0» | «s1» | «s2» |

      標本標準偏差は不偏分散の平方根である。
    items:
      - id: s28p10a
        chapter: 21
        terms: [neyman-allocation, stratified-sampling, proportional-allocation]
        topic: 3ロットの層別抜取で合計100個をネイマン配分にしたときの平均の推定量の標準誤差を求め比例配分と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          同じ合計 100 個を、ネイマン配分（$n_h\propto N_hs_h$）で抜き取っていたとする。各ロットの標準偏差が表の値のとき、層別抽出による全体の平均の推定量 $\bar y_{st}=\sum_hW_h\bar y_h$（$W_h=N_h/N$）の標準誤差を求めよ。
          有限母集団修正は無視し、配分は端数を丸めずに計算してよい。
        answer: «n10_se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 層別抽出の分散は $\sum_hW_h^2s_h^2/n_h$。ネイマン配分 $n_h=n\dfrac{W_hs_h}{\sum_kW_ks_k}$ を代入すると $\dfrac{\left(\sum_hW_hs_h\right)^2}{n}$ にまとまる。

          **途中式** $W_h=0.2,\ 0.3,\ 0.5$ なので $\sum_hW_hs_h=0.2\times4.0+0.3\times6.0+0.5\times5.0=«n10_sw»$。
          配分は $n_h=100\times(«n10_a1»,\ «n10_a2»,\ «n10_a3»)/«n10_sw»=«n10_n1»,\ «n10_n2»,\ «n10_n3»$。
          $$V[\bar y_{st}]=\frac{«n10_sw»^2}{100}=«n10_v»,\qquad \mathrm{SE}=\frac{«n10_sw»}{10}=«n10_se4»$$

          **答え** $«n10_se_s»$

          **間違えやすい点** 比例配分の分散は $\sum_hW_hs_h^2/n=«n10_vp»$（標準誤差 «n10_sep»）。ネイマン配分は標準偏差の大きい層に多く配るので、分散は比例配分より小さいか等しいが、ここでは各層の標準偏差の違いが小さいので、差はわずかである。
          ネイマン配分で $\sum W_h^2s_h^2/n_h$ に比例配分の $n_h$ を入れてしまわないこと。

  - id: s28p11
    title: 検査装置のセンサーによる不良判別
    context: |
      ウェーハの最終検査で、センサーの計測値を使って不良品の判別やロットの分類を行っている。
    items:
      - id: s28p11a
        chapter: 23
        terms: [sensitivity-and-specificity, roc-curve-and-auc, misclassification-rate]
        topic: 等分散の2群の正規分布で判定の閾値を上げたときの感度と特異度の変化をROC曲線上の動きとして読む
        level: 標準
        definition: false
        type: choice
        question: |
          あるセンサー値 $x$ は、良品では $N(«na_m0»,\ «na_sd»^2)$、不良品では $N(«na_m1»,\ «na_sd»^2)$ に従う。$x>c$ なら不良と判定する。
          閾値を $c=«na_c1»$ から $c=«na_c2»$ に上げると、（感度, 特異度）はどう変わるか。感度は不良品を不良と判定する確率、特異度は良品を良品と判定する確率である。
          必要なら $\Phi(0.5)=0.6915$、$\Phi(1.0)=0.8413$、$\Phi(1.5)=0.9332$ を使え。
        choices:
          - '$(«na_s1»,\ «na_s1»)$ から $(«na_p2»,\ «na_s2»)$ に変わる'
          - '$(«na_q1»,\ «na_q1»)$ から $(«na_q2»,\ «na_r2»)$ に変わる'
          - '$(«na_s1»,\ «na_s1»)$ から $(«na_s2»,\ «na_r2»)$ に変わる'
          - '$(«na_s1»,\ «na_s1»)$ から $(«na_s2»,\ «na_p2»)$ に変わる'
          - 閾値を変えても感度と特異度の和は一定なので、どちらも変わらない
        answer: 3
        distractors:
          - 感度と特異度を取り違えた
          - 見逃し率と誤報率（1−感度、1−特異度）を答えた
          - 特異度の代わりに誤報率 1−特異度 を答えた
          - 正解
          - 閾値を動かすと一方が上がり他方が下がるが、和は一定ではない（ROC 曲線上を動く）
        explanation: |
          **方針** 感度 $=P(x>c\mid\text{不良})=1-\Phi\!\left(\dfrac{c-«na_m1»}{«na_sd»}\right)$、特異度 $=P(x\le c\mid\text{良品})=\Phi\!\left(\dfrac{c-«na_m0»}{«na_sd»}\right)$。

          **途中式**
          - $c=«na_c1»$：感度 $1-\Phi(-1.0)=0.8413$、特異度 $\Phi(1.0)=0.8413$
          - $c=«na_c2»$：感度 $1-\Phi(-0.5)=\Phi(0.5)=0.6915$、特異度 $\Phi(1.5)=0.9332$

          **答え** $(«na_s1»,\ «na_s1»)$ から $(«na_s2»,\ «na_p2»)$ に変わる

          **間違えやすい点** 閾値を上げると不良と判定しにくくなるので、感度は下がり特異度は上がる。閾値を動かしたときの（1−特異度, 感度）の軌跡が ROC 曲線で、この 2 群では曲線の下の面積は $\Phi(\delta/\sqrt2)$（$\delta=(«na_m1»-«na_m0»)/«na_sd»$）で、閾値によらない判別のしやすさを表す。
          どの閾値がよいかは、見逃しと誤報のコストや不良の割合で決める。

      - id: s28p11b
        chapter: 24
        terms: [mixture-model-clustering, non-hierarchical-clustering, k-means-method]
        topic: 2成分の混合正規モデルのEMアルゴリズムでEステップの負担率からMステップの混合比と平均を更新する
        level: 標準
        definition: false
        type: choice
        question: |
          5 つのロットの特徴量 $x=«nb_x»$ に、2 成分の 1 次元混合正規モデルを EM アルゴリズムで当てはめている。ある反復の E ステップで、各ロットが成分 1 に属する負担率（事後確率）が
          $«nb_r»$ と求まった。続く M ステップで更新される成分 1 の混合比 $\pi_1$ と平均 $\mu_1$ の組として正しいものはどれか。
        choices:
          - '$\pi_1=«nb_pi»$、$\mu_1=«nb_w1»$'
          - '$\pi_1=«nb_w2p»$、$\mu_1=«nb_w2m»$'
          - '$\pi_1=«nb_pi»$、$\mu_1=«nb_mu»$'
          - '$\pi_1=«nb_w3»$、$\mu_1=«nb_mu»$'
          - '$\pi_1=«nb_pi»$、$\mu_1=«nb_w4»$'
        answer: 2
        distractors:
          - 負担率で重み付けした和を、負担率の和ではなくロット数で割った
          - 負担率 0.5 を境に各ロットを一方の成分に割り当てた（k 平均法のような硬い割り当て）
          - 正解
          - 混合比を負担率の和のままにし、ロット数で割らなかった
          - 負担率を使わず全ロットの平均を答えた
        explanation: |
          **方針** M ステップでは、負担率 $r_i$ を「ロット $i$ のうち成分 1 に属する分」とみなして、重み付きの最尤推定を行う。$\pi_1=\sum r_i/n$、$\mu_1=\sum r_ix_i/\sum r_i$。

          **途中式** $\sum r_i=«nb_sr»$、$\sum r_ix_i=«nb_srx»$。
          $$\pi_1=\frac{«nb_sr»}{5}=«nb_pi»,\qquad \mu_1=\frac{«nb_srx»}{«nb_sr»}=«nb_mu4»$$

          **答え** $\pi_1=«nb_pi»$、$\mu_1=«nb_mu»$

          **間違えやすい点** k 平均法は各点を 1 つのクラスターに割り当てる（硬い割り当て）が、混合モデルの EM は負担率に応じて各点を両方の成分に分けて数える。そのため、成分 2 寄りのロット（7.0、8.0）もわずかに $\mu_1$ を引き上げる。
          E ステップと M ステップを繰り返すと対数尤度は単調に増えるが、初期値によっては局所的な最大値にとどまる。

      - id: s28p11c
        chapter: 25
        terms: [varimax-rotation, factor-rotation, factor-loading]
        topic: 2因子の負荷量行列とそれを直交回転した行列のバリマックス基準の値を計算して単純構造に近い方を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          3 つのセンサーに 2 因子モデルを当てはめて得た負荷量行列 $A$ と、それを直交回転した負荷量行列 $B$ は次のとおり（小数第 2 位に丸めてある）。

          | センサー | $A$：第 1 因子 | $A$：第 2 因子 | $B$：第 1 因子 | $B$：第 2 因子 |
          |---|---|---|---|---|
          | 1 | «nc_a11» | «nc_a12» | «nc_b11» | «nc_b12» |
          | 2 | «nc_a21» | «nc_a22» | «nc_b21» | «nc_b22» |
          | 3 | «nc_a31» | «nc_a32» | «nc_b31» | «nc_b32» |

          （素の）バリマックス基準 $V=\sum_{k=1}^{2}\left\{\dfrac1p\sum_{i=1}^{p}l_{ik}^4-\left(\dfrac1p\sum_{i=1}^{p}l_{ik}^2\right)^2\right\}$（$p=3$）で比べるとき、正しい記述はどれか。
        choices:
          - '$A$ の $V=«nc_va»$ は $B$ の $V=«nc_vb»$ より小さいので、$A$ の方が単純構造に近い'
          - '$B$ の $V=«nc_w2b»$ は $A$ の $V=«nc_w2a»$ より大きく、$B$ の方が単純構造に近い'
          - '直交回転では各センサーの共通性が変わらないので、$V$ も回転によらず等しい'
          - '$B$ の $V=«nc_vb»$ は $A$ より大きいので、$B$ の方がデータへの当てはまり（再現される相関）がよい'
          - '$B$ の $V=«nc_vb»$ は $A$ の $V=«nc_va»$ より大きく、$B$ の方が単純構造に近い'
        answer: 4
        distractors:
          - バリマックスは V を最大にする回転なので、小さい方を選ぶのは逆
          - 第 2 項（2 乗の平均の 2 乗）を落とした
          - 共通性（行ごとの 2 乗和）は変わらないが、列ごとの 2 乗の散らばりである V は回転で変わる
          - 直交回転では再現される相関行列は変わらないので、当てはまりは同じ
          - 正解
        explanation: |
          **方針** バリマックス基準は、因子ごとに負荷量の 2 乗の分散を求めて足したもの。各因子で負荷量が「大きいか 0 に近いか」にはっきり分かれる（単純構造）ほど大きくなる。

          **途中式** $A$ の負荷量の 2 乗は第 1 因子 $(«nc_sa11», «nc_sa21», «nc_sa31»)$、第 2 因子 $(«nc_sa12», «nc_sa22», «nc_sa32»)$。
          $$V_A=\left(«nc_fa1»-«nc_ma1»^2\right)+\left(«nc_fa2»-«nc_ma2»^2\right)=«nc_va4»$$
          $B$ も同様に、2 乗は $(«nc_sb11», «nc_sb21», «nc_sb31»)$、$(«nc_sb12», «nc_sb22», «nc_sb32»)$ で
          $$V_B=\left(«nc_fb1»-«nc_mb1»^2\right)+\left(«nc_fb2»-«nc_mb2»^2\right)=«nc_vb4»$$

          **答え** $V_B=«nc_vb»>V_A=«nc_va»$ で、$B$ の方が単純構造に近い

          **間違えやすい点** 直交回転では、各センサーの共通性（行の 2 乗和）も再現される相関行列も変わらない。変わるのは因子への負荷のかかり方だけで、バリマックス回転は解釈しやすい形（各センサーが主に 1 つの因子に乗る）を選ぶための基準である。
          $B$ ではセンサー 1・2 が第 1 因子、センサー 3 が第 2 因子に主に乗っている。

  - id: s28p12
    title: 計測装置の待ち行列
    context: |
      膜厚の計測装置 1 台に、ウェーハが 1 時間あたり平均 «lam» 枚のポアソン過程で到着する。計測時間は平均 «ms» 分の指数分布に従い、
      先着順に 1 枚ずつ計測する（待ち場所の大きさに制限はない M/M/1 待ち行列）。
    items:
      - id: s28p12a
        chapter: 15
        terms: [mm1-queue, littles-law, traffic-intensity]
        topic: M/M/1の計測装置で平均滞在時間から計測を待っているウェーハの平均枚数をリトルの公式で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          定常状態で、計測中のものを除き、計測を待っているウェーハの平均枚数 $L_q$ を求めよ。
        answer: «Lq»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 到着率 $\lambda$、処理率 $\mu$ の M/M/1 では、利用率 $\rho=\lambda/\mu<1$ のとき平均滞在時間は $W=1/(\mu-\lambda)$。
          待ち時間は $W_q=W-1/\mu$、待ち行列の長さはリトルの公式 $L_q=\lambda W_q$ で求める。

          **途中式** 単位を「時間」にそろえる。$\mu=60/«ms»=«mu»$ 枚/時、$\rho=«lam»/«mu»=«rho»$。
          $$W=\frac{1}{\mu-\lambda}=«Wh»\ \text{時間}=«W»\ \text{分},\qquad W_q=«W»-«ms»=«Wq»\ \text{分}=«Wqh»\ \text{時間}$$
          $$L_q=\lambda W_q=«lam»\times«Wqh»=«Lq_s»$$
          （公式 $L_q=\rho^2/(1-\rho)=«Lq_f»$ とも一致する。）

          **答え** $«Lq_s»$ 枚

          **間違えやすい点** 系内の平均枚数 $L=\rho/(1-\rho)=«L»$ は計測中の 1 枚分（平均 $\rho$）を含む。
          リトルの公式で $\lambda$（枚/時）と $W_q$（分）の単位をそろえないと $«Lq_min»$ のような値になる。
