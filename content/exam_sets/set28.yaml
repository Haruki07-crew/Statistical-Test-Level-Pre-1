        explanation: |
          **方針** 層ごとに独立に単純無作為抽出しているので $V[\bar y_{st}]=\sum_hW_h^2\,s_h^2/n_h$。その平方根が標準誤差。

          **途中式** $W_h=«W0»,\ «W1»,\ «W2»$。
          $$\frac{«W0»^2\times«s20»}{«n0»}=«t0»,\quad \frac{«W1»^2\times«s21»}{«n1»}=«t1»,\quad \frac{«W2»^2\times«s22»}{«n2»}=«t2»$$
          $$\widehat V[\bar y_{st}]=«t0»+«t1»+«t2»=«V»,\qquad \mathrm{SE}=\sqrt{«V»}=«se4»\cdots$$
          （比例配分なので $\sum_hW_hs_h^2/n$ とも書け、$(«W0»\times«s20»+«W1»\times«s21»+«W2»\times«s22»)/«n»=«V»$ と同じになる。）

