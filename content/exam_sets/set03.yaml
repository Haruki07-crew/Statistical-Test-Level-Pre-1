          - "«prec»"
        answer: 1
        distractors:
          - 適合率と再現率の算術平均をとった
          - 正解
          - 正解率（全体のうち当たった日の割合）を答えた
          - 適合率と再現率の積を答えた（2 倍して和で割っていない）
          - 適合率だけを答えた
        explanation: |
