    items:
      - id: s03p10a
        chapter: 21
        terms: [ratio-estimation, simple-random-sampling, sampling-and-nonsampling-error]
        topic: 作付面積を補助情報にした比推定で農家1戸あたりの収穫量を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          作付面積を補助変数とする比推定量を使って、町の農家 1 戸あたりの平均収穫量（t）を推定せよ。
        answer: «yr»
