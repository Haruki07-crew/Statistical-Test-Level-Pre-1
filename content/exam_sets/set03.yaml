set: 3
title: 模擬試験 第3回
minutes: 90
problems:
  - id: s03p01
    title: 土壌の違う区域の隣り合う圃場
    context: |
      ある地域の小麦畑は区域ごとに土壌が決まっており、無作為に選んだ区域が沖積土の区域 A である確率は «wA»、火山灰土の区域 B である確率は «wB» である。
      選んだ区域の中で隣り合う 2 枚の圃場の収穫量を $Y_1, Y_2$（kg/a）とする。土壌の種類が与えられたもとで $Y_1, Y_2$ は互いに独立で、
      A の区域ではどちらも正規分布 $N(«mA»,\ «sA»^2)$、B の区域ではどちらも $N(«mB»,\ «sB»^2)$ に従う。
      必要なら標準正規分布の累積分布関数の値 $\Phi(«zA»)=«PhiA»$、$\Phi(«zB»)=«PhiB»$、$\Phi(«zN»)=«PhiN»$ を使え。
    items:
      - id: s03p01a
        chapter: 6
        terms: [normal-mixture-distribution, normal-distribution, law-of-total-probability]
        topic: 正規混合分布の上側確率を成分ごとの標準化で求める
        level: 基本
        definition: false
        type: choice
        question: |
          1 枚目の圃場の収穫量について、$P(Y_1\ge «c»)$ に最も近い値を選べ。
        choices:
          - "«d_norm»"
          - "«d_avg»"
          - "«tot»"
          - "«d_signA»"
          - "«d_signB»"
        answer: 2
        distractors:
          - 混合分布を平均 49.5・分散 99.55 の1つの正規分布で近似した
          - 区域の確率（重み）0.3, 0.7 を無視して2つの確率を単純平均した
          - 正解
          - A 側で上側確率と下側確率を取り違え、1−Φ(1.00) を使った
          - B 側で上側確率ではなく下側確率 Φ(1.25) を使った
        explanation: |
          **方針** 混合分布の確率は、土壌ごとの条件付き確率を区域の確率で重みづけして足す（全確率の公式）。$Y_1$ の分布は正規分布の混合で、それ自体は正規分布ではない。

          **途中式**
          - A の区域：$P(Y_1\ge«c»\mid A)=P\left(Z\ge\frac{«c»-«mA»}{«sA»}\right)=P(Z\ge -«zA»)=\Phi(«zA»)=«pA»$
          - B の区域：$P(Y_1\ge«c»\mid B)=P\left(Z\ge\frac{«c»-«mB»}{«sB»}\right)=P(Z\ge «zB»)=1-«PhiB»=«pB»$
          - 合わせる：$P(Y_1\ge«c»)=«wA»\times«pA»+«wB»\times«pB»=«jA»+«jB»=«tot5»$

          **答え** 約 «tot»

          **間違えやすい点** 全体の平均 «mean»・標準偏差 «sd» の 1 つの正規分布で近似すると $1-\Phi(«zN»)\approx«d_norm»$ となり誤り（混合分布は正規分布ではない）。区域の確率を無視した単純平均 «d_avg» も誤り。
      - id: s03p01b
        chapter: 1
        terms: [conditional-independence, conditional-probability, law-of-total-probability]
        topic: 土壌が同じだと条件付き独立な隣接圃場で一方が高収量のとき他方も高収量の確率
        level: 標準
        definition: false
        type: choice
        question: |
          1 枚目の圃場の収穫量が «c» kg/a 以上だった。同じ区域の 2 枚目の圃場の収穫量も «c» kg/a 以上である条件付き確率 $P(Y_2\ge«c»\mid Y_1\ge«c»)$ に最も近い値を選べ。
        choices:
          - "«cond»"
          - "«d_ind»"
          - "«d_both»"
          - "«post»"
          - "«d_sq»"
        answer: 0
        distractors:
          - 正解
          - Y1 と Y2 を無条件でも独立とみなし、P(Y2≥55) をそのまま答えた
          - 同時確率 P(Y1≥55 かつ Y2≥55) を答え、P(Y1≥55) で割らなかった
          - 区域が A である事後確率 P(A | Y1≥55) を答えた
          - 無条件で独立とみなして P(Y1≥55)² を計算した
        explanation: |
          **方針** $Y_1, Y_2$ は「土壌が与えられたもとで」独立（条件付き独立）だが、土壌を通じて関連するので無条件では独立ではない。同時確率を土壌ごとに分けて全確率の公式で計算し、$P(Y_1\ge«c»)$ で割る。

          **途中式**
          - A の区域で 2 枚とも «c» 以上：$«wA»\times«pA»^2=«wA»\times«pA2»=«bA»$
          - B の区域で 2 枚とも «c» 以上：$«wB»\times«pB»^2=«wB»\times«pB2»=«bB»$
          - 同時確率：$P(Y_1\ge«c»,\ Y_2\ge«c»)=«bA»+«bB»=«both5»$
          - 前問より $P(Y_1\ge«c»)=«tot5»$
          - $P(Y_2\ge«c»\mid Y_1\ge«c»)=\dfrac{«both5»}{«tot5»}=«cond4»$

          **答え** 約 «cond»

          **間違えやすい点** 条件付き独立は無条件の独立を意味しない。1 枚目が高収量だと区域が A である確率が «wA» から約 «post» に上がり（ベイズの定理）、そのため 2 枚目も高収量になりやすい。独立とみなした «d_ind» は誤り。
      - id: s03p01c
        chapter: 3
        terms: [covariance-and-correlation, conditional-expectation, conditional-variance]
        topic: 同じ区域を共有する2圃場の収穫量の相関係数を条件付き期待値の分散から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          $Y_1$ と $Y_2$ の相関係数を求めよ。
        answer: «corr»
        tolerance: 0.001
        answer_format: 小数第3位まで（四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 土壌の種類を $Z$ とする。全分散の公式で $V[Y_1]$ を、全共分散の公式 $\mathrm{Cov}(Y_1,Y_2)=E[\mathrm{Cov}(Y_1,Y_2\mid Z)]+\mathrm{Cov}(E[Y_1\mid Z],E[Y_2\mid Z])$ で共分散を求める。土壌が与えられたもとで独立なので第 1 項は 0 である。

          **途中式**
          - $E[Y_1\mid Z]$ は確率 «wA» で «mA»、確率 «wB» で «mB» をとるので、$V[E[Y_1\mid Z]]=«wA»\times«wB»\times«diff»^2=«ve»$
          - $E[V[Y_1\mid Z]]=«wA»\times«sA2»+«wB»\times«sB2»=«ev»$
          - $V[Y_1]=«ev»+«ve»=«var_s»$（$Y_2$ も同じ）
          - $\mathrm{Cov}(Y_1,Y_2)=0+V[E[Y_1\mid Z]]=«ve»$（$E[Y_1\mid Z]=E[Y_2\mid Z]$ なので、その共分散は分散に等しい）
          - 相関係数 $=\dfrac{«ve»}{«var_s»}=«corr4»$

          **答え** 約 «corr»

          **間違えやすい点** 「土壌が与えられたもとで独立」だから相関 0、とするのは誤り（区域を通じて関連する）。分母を $E[V[Y\mid Z]]=«ev»$ だけにすると «d_corr_ev» になってしまう。相関は「区域の間のばらつき」が全体のばらつきに占める割合（級内相関）と解釈できる。
  - id: s03p02
    title: 灌漑ポンプの寿命
    context: |
      ある農業用水路で使われている揚水ポンプの故障までの時間 $T$（年）について、ハザード関数（瞬間故障率）が
      $$h(t)=«a»\,t\qquad (t\ge 0)$$
      で表されるとする。使い込むほど故障しやすくなる（摩耗型の）モデルである。
      必要なら次の値を使え：$e^{-0.16}=«e016»$、$e^{-0.64}=«e064»$、$e^{-1}=«e1»$、$e^{-1.28}=«e128»$。
    items:
      - id: s03p02a
        chapter: 2
        terms: [hazard-function, survival-function, conditional-probability]
        topic: 摩耗型（線形増加）のハザードから稼働3年のポンプが5年までもつ条件付き確率
        level: 標準
        definition: false
        type: choice
        question: |
          «t1» 年たっても故障していないポンプが、«t2» 年の時点でもまだ故障していない確率 $P(T>«t2»\mid T>«t1»)$ に最も近い値を選べ。
        choices:
          - "«d_mem»"
          - "«d_unc»"
          - "«cond»"
          - "«d_noint»"
          - "«d_fail»"
        answer: 2
        distractors:
          - 無記憶性（指数分布の性質）を誤って当てはめ、残り2年だけで S(2) を計算した
          - 条件を無視して S(5) を答えた
          - 正解
          - 累積ハザードを積分するときに 1/2 を付け忘れた（H(t)=0.08t² とした）
          - 生存確率ではなく、その間に故障する確率を答えた
        explanation: |
          **方針** 生存関数は累積ハザード $H(t)=\int_0^t h(u)\,du$ を使って $S(t)=e^{-H(t)}$ と書ける。条件付き生存確率は $S(«t2»)/S(«t1»)$ である。

          **途中式**
          - $H(t)=\int_0^t «a»u\,du=«a2»\,t^2$
          - $H(«t1»)=«a2»\times «t1»^2=«Ht1»$、$H(«t2»)=«a2»\times «t2»^2=«Ht2»$
          - $P(T>«t2»\mid T>«t1»)=\dfrac{S(«t2»)}{S(«t1»)}=e^{-(H(«t2»)-H(«t1»))}=e^{-«dH»}=«e064»$

          **答え** 約 «cond»

          **間違えやすい点** ハザードが一定（指数分布）なら「すでに «t1» 年もった」ことは関係なく $S(2)$ になるが、ここではハザードが時間とともに増えるので無記憶性は成り立たない（$S(2)=e^{-0.16}\approx«d_mem»$ は誤り）。$h(t)$ の積分で $1/2$ を忘れると $e^{-1.28}\approx«d_noint»$ になる。
      - id: s03p02b
        chapter: 29
        terms: [kaplan-meier-estimator, censored-data, survival-function]
        topic: 撤去による打ち切りを含むポンプ10台の生存率をカプラン＝マイヤー法で推定する
        level: 標準
        definition: false
        type: choice
        question: |
          実際に 10 台のポンプを追跡したところ、故障または観測終了までの年数は次のとおりだった（$+$ は故障前に撤去・観測終了した打ち切りデータ）。

          1.5, 2.0+, 2.8, 3.1, 3.5+, 4.2, 4.6+, 5.0, 5.5+, 6.0+

          カプラン＝マイヤー推定量による $S(4.5)$ の推定値として最も適切なものを選べ。
        choices:
          - "«d_naive»"
          - "«d_nocens»"
          - "«d_off»"
          - "«km»"
          - "«d_drop»"
        answer: 3
        distractors:
          - 4.5 年を超えて観測された台数の割合（4/10）を使い、打ち切りを故障と同じに扱った
          - 打ち切りが起きてもリスク集合（その時点で観測中の台数）を減らさなかった
          - 4.2 年の時点のリスク集合を 1 台多く（6 台と）数えた
          - 正解
          - 打ち切りデータを捨て、故障した 5 台だけで割合を計算した
        explanation: |
          **方針** 故障が起きた時刻ごとに「その直前まで観測中の台数（リスク集合）$n_j$」と故障数 $d_j$ を数え、$\hat S(t)=\prod_{t_j\le t}\left(1-\frac{d_j}{n_j}\right)$ を計算する。打ち切りは、その時刻以後のリスク集合から外すだけで、生存率は下げない。

          **途中式**
          - 1.5 年：$n=10,\ d=1$ → $9/10$
          - 2.0+ で 1 台打ち切り → 観測中は 8 台
          - 2.8 年：$n=8,\ d=1$ → $7/8$
          - 3.1 年：$n=7,\ d=1$ → $6/7$
          - 3.5+ で 1 台打ち切り → 観測中は 5 台
          - 4.2 年：$n=5,\ d=1$ → $4/5$
          - $\hat S(4.5)=«km_steps»=«km»$

          **答え** «km»

          **間違えやすい点** 打ち切られたポンプは「その時点までは故障しなかった」という情報を持つので、捨てたり（«d_drop»）、故障とみなしたり（«d_naive»）してはいけない。逆に、打ち切りのあともリスク集合に残し続けると «d_nocens» になる。
  - id: s03p03
    title: 交差点のニアミス件数
    context: |
      ある交差点に設置したカメラで、1 日あたりの車と自転車のニアミス（急ブレーキを伴う接近）の件数を «n» 日間記録した。

      | 件数 | 0 | 1 | 2 | 3 | 4 | 計 |
      |---|---|---|---|---|---|---|
      | 日数 | «o0» | «o1» | «o2» | «o3» | «o4» | «n» |

      5 件以上の日はなかった。各日の件数は互いに独立に、平均 $\lambda$ のポアソン分布 $P(X=k)=e^{-\lambda}\lambda^k/k!$ に従うとする。
      必要なら $e^{-1.2}=«e12»$ を使え。
    items:
      - id: s03p03a
        chapter: 5
        terms: [poisson-distribution, expected-frequency, maximum-likelihood-estimator]
        topic: ニアミス件数のポアソン当てはめで件数2の日の期待日数
        level: 基本
        definition: false
        type: numeric
        question: |
          $\lambda$ の最尤推定値（標本平均）を用いて、«n» 日のうち件数がちょうど 2 件の日数の期待値（期待度数）を求めよ。
        answer: «E2ans»
        tolerance: 0.1
        answer_format: 小数第1位まで（四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** ポアソン分布の $\lambda$ の最尤推定量は標本平均である。その値を確率関数に代入し、日数 «n» を掛ける。

          **途中式**
          - 総件数：$1\times«o1»+2\times«o2»+3\times«o3»+4\times«o4»=«tot»$
          - $\hat\lambda=«tot»/«n»=«lam»$
          - $P(X=2)=e^{-1.2}\dfrac{1.2^2}{2!}=«e12»\times0.72=«p2»$
          - 期待度数：$«n»\times«e12»\times0.72=«E2_3»$

          **答え** 約 «E2ans» 日

          **間違えやすい点** $2!$ で割り忘れると 2 倍の値になる。$\hat\lambda$ は「件数×日数」の合計を日数で割った値で、度数の平均ではない。
      - id: s03p03b
        chapter: 12
        terms: [poisson-two-sample-test, poisson-distribution, binomial-test]
        topic: 観測日数の違う2つの交差点のニアミス率をポアソン2標本の条件付き検定で比べる
        level: 応用
        definition: false
        type: choice
        question: |
          自転車レーンを整備した近くの交差点 B では、«tB» 日間でニアミスが合計 «xB» 件だった（1 日あたり «rB» 件）。上の交差点（A とする、«n» 日間で «tot» 件）と B の 1 日あたりの発生率が等しいかを、有意水準 5% の両側検定で調べる。
          両交差点の件数はそれぞれポアソン分布に従い独立とする。合計件数 $N=«N2»$ を与えたときの A の件数の条件付き分布を使い、連続修正をしない正規近似を行う（標準正規分布の上側 2.5% 点は 1.96）。
          標準化した統計量 $z$ と結論の組として正しいものを選べ。
        choices:
          - $z=«d_half»$、棄却する
          - $z=«zc»$、棄却しない
          - $z=«d_noN»$、棄却しない
          - $z=«d_np»$、棄却しない
          - $z=«d_swap»$、棄却する
        answer: 1
        distractors:
          - 観測日数の違いを無視し、条件付きの成功確率を 1/2 とした
          - 正解
          - 2 つの率の差を、分散を日数で割らずに標準化した
          - 二項分布の分散 Np(1−p) ではなく、ポアソンのように平均 Np を分散とした
          - 成功確率を B の日数の割合 90/210 と取り違えた
        explanation: |
          **方針** 独立なポアソン変数 $X_A\sim Po(\lambda_At_A)$、$X_B\sim Po(\lambda_Bt_B)$ について、合計 $N=X_A+X_B$ を与えると $X_A\sim Bin\left(N,\ \frac{\lambda_At_A}{\lambda_At_A+\lambda_Bt_B}\right)$。帰無仮説 $\lambda_A=\lambda_B$ の下では成功確率は日数の割合 $t_A/(t_A+t_B)$ になる。

          **途中式**
          - $p_0=\dfrac{«n»}{«n»+«tB»}=«p0f»\approx«p0d»$
          - $E[X_A\mid N]=«N2»\times«p0f»=«EA»$
          - $V[X_A\mid N]=«N2»\times\frac47\times\frac37=«VA»$、標準偏差 $«sdA»$
          - $z=\dfrac{«tot»-«EA»}{«sdA»}=«zc»$
          - $|z|<1.96$ なので棄却しない（発生率に差があるとはいえない）

          **答え** $z=«zc»$、棄却しない

          **間違えやすい点** 件数そのもの（«tot» 件と «xB» 件）を比べると差が大きく見えるが、観測日数が違う。日数を無視して $p_0=1/2$ とすると $z=«d_half»$ となり、誤って棄却してしまう。
      - id: s03p03c
        chapter: 18
        terms: [poisson-regression, offset-term, link-function]
        topic: 交通量をオフセットにしたポアソン回帰で自転車レーンのある交差点のニアミス期待件数
        level: 標準
        definition: false
        type: choice
        question: |
          市内の多くの交差点のデータを使い、1 日のニアミス件数 $Y$ を、1 日の交通量 $T$（千台）をオフセット、自転車レーンの有無 $x$（あり 1、なし 0）を説明変数とするポアソン回帰
          $$\log E[Y]=\log T+\beta_0+\beta_1x$$
          で分析したところ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$ だった。
          交通量が 1 日 «T» 千台で自転車レーンのある交差点の、1 日のニアミス件数の期待値の推定値に最も近いものを選べ。
          必要なら $e^{-2.35}=«e235»$、$e^{-1.90}=«e190»$、$e^{-1.45}=«e145»$、$\log «T»=«ln8»$（自然対数）を使え。
        choices:
          - "«d_nooff»"
          - "«d_nolane»"
          - "«d_sign»"
          - "«d_log»"
          - "«mu»"
        answer: 4
        distractors:
          - オフセットを忘れ、交通量 1 千台あたりの期待件数 e^{-2.35} を答えた
          - 自転車レーンの効果 β1 を入れ忘れた
          - β1 の符号を取り違えた
          - 交通量 T ではなく log T を掛けた（オフセットは対数のスケールで足す＝T を掛ける）
          - 正解
        explanation: |
          **方針** オフセット $\log T$ は係数を 1 に固定した項なので、$E[Y]=T\exp(\beta_0+\beta_1x)$ と書ける。つまり $\exp(\beta_0+\beta_1x)$ は「交通量 1 千台あたりのニアミス率」で、それに交通量を掛ける。

          **途中式**
          - 線形予測子（オフセット以外）：$«b0»+(«b1»)\times1=«eta»$
          - 1 千台あたりの率：$e^{«eta»}=«e235»$
          - 期待件数：$«T»\times«e235»=«mu»$

          **答え** 約 «mu» 件

          **間違えやすい点** オフセットの係数は推定せず 1 に固定されているので、$\log T$ を足す（$T$ を掛ける）だけである。$e^{\beta_1}=e^{-0.45}\approx«rr»$ は「交通量が同じなら、自転車レーンのある交差点のニアミス率は約 0.64 倍」という率比（レート比）を表す。
  - id: s03p04
    title: 郊外道路の車頭時間
    context: |
      交通量の少ない郊外道路のある地点で、車が通過する時間間隔（車頭時間）$X_1,\dots,X_{«n»}$（秒）を «n» 個記録したところ、合計は $\sum x_i=«S»$ 秒（平均 «xbar» 秒）だった。
      $X_i$ は互いに独立に、密度 $f(x)=\lambda e^{-\lambda x}\ (x>0)$ の指数分布に従うとする（$\lambda$ は 1 秒あたりの到着率、平均は $\theta=1/\lambda$ 秒）。
    items:
      - id: s03p04a
        chapter: 8
        terms: [invariance-of-mle, maximum-likelihood-estimator, exponential-distribution]
        topic: 指数分布の車頭時間が10秒を超える確率の最尤推定（不変性）
        level: 基本
        definition: false
        type: choice
        question: |
          車頭時間が «t» 秒を超える確率 $P(X>«t»)=e^{-«t»\lambda}$ の最尤推定値に最も近い値を選べ。必要なら $e^{-4/3}=«e43»$、$e^{-0.75}=«e075»$、$e^{-1.3}=«e13»$ を使え。
        choices:
          - "«d_cdf»"
          - "«d_rate»"
          - "«pmle»"
          - "«d_lam»"
          - "«d_unb»"
        answer: 2
        distractors:
          - 「超える確率」ではなく累積分布関数 P(X≤10) を答えた
          - レートと平均を取り違え、e^{-θ/10} = e^{-0.75} とした
          - 正解
          - 確率ではなく到着率 λ の推定値そのものを答えた
          - 平均の推定に n−1=39 で割った値 300/39 を使った（最尤推定量ではない）
        explanation: |
          **方針** $\lambda$ の最尤推定量は $\hat\lambda=1/\bar X$。最尤推定量の不変性より、$g(\lambda)$ の最尤推定量は $g(\hat\lambda)$ である。

          **途中式**
          - 対数尤度 $\ell(\lambda)=«n»\log\lambda-\lambda\sum x_i$、$\ell'(\lambda)=«n»/\lambda-«S»=0$ より $\hat\lambda=«n»/«S»=1/«xbar»$
          - $\widehat{P(X>«t»)}=e^{-«t»/«xbar»}=e^{-4/3}=«e43»$

          **答え** 約 «pmle»

          **間違えやすい点** 指数分布はレート $\lambda$ と平均 $\theta=1/\lambda$ のどちらで書くかで式が変わる。$e^{-x/\theta}$ と $e^{-\theta/x}$ を取り違えないこと。最尤推定量は $\sum x_i$ を $n$ で割った平均から作り、$n-1$ では割らない。
      - id: s03p04b
        chapter: 7
        terms: [delta-method, asymptotic-normality-of-mle, standard-error]
        topic: 平均車頭時間から到着率（台/分）の標準誤差をデルタ法で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          到着率を **1 分あたりの台数** で表した $\mu=60\lambda=60/\theta$ を、$\hat\mu=60/\bar X$ で推定する。
          $\bar X$ の分散が $\theta^2/n$ であることとデルタ法を使い、$\hat\mu$ の標準誤差（漸近標準偏差に推定値を代入したもの）を求めよ。
        answer: «se»
        tolerance: 0.01
        answer_format: 小数第2位まで（四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** デルタ法：$g(\bar X)$ の分散は $g'(\theta)^2\,V[\bar X]$ で近似できる。$g(\theta)=60/\theta$ とおく。

          **途中式**
          - $g'(\theta)=-60/\theta^2$
          - $V[\hat\mu]\approx\left(\dfrac{60}{\theta^2}\right)^2\dfrac{\theta^2}{n}=\dfrac{3600}{n\,\theta^2}=\dfrac{\mu^2}{n}$
          - 標準誤差 $\approx\dfrac{\hat\mu}{\sqrt n}$、$\hat\mu=60/«xbar»=«lam_m»$ 台/分
          - $\dfrac{«lam_m»}{\sqrt{«n»}}=\dfrac{«lam_m»}{«sqn»}=«se4»$

          **答え** 約 «se» 台/分

          **間違えやすい点** $\bar X$ の標準誤差 $\hat\theta/\sqrt n=«se_theta»$（秒）をそのまま答えるのは誤り。単位を「秒あたり」のまま計算すると «se_s» になり、60 倍し忘れる。デルタ法では微分 $g'(\theta)$ を **2 乗** して分散に掛ける。
      - id: s03p04c
        chapter: 9
        terms: [pivotal-quantity, chi-squared-distribution, confidence-interval]
        topic: 指数分布の平均の正確な信頼区間をカイ二乗ピボットで作る
        level: 応用
        definition: false
        type: choice
        question: |
          $2\lambda\sum X_i=2\sum X_i/\theta$ が自由度 $2n$ のカイ二乗分布に従うことを使って、平均車頭時間 $\theta$ の 95% 信頼区間（秒）を作る。
          カイ二乗分布の上側確率 0.975 の点と 0.025 の点は、自由度 40 で «q40l» と «q40u»、自由度 80 で «q80l» と «q80u» である。
          正しい信頼区間を選べ。
        choices:
          - "$«ci40»$"
          - "$«ciS»$"
          - "$«ciN»$"
          - "$«ci»$"
          - "$«ciR»$"
        answer: 3
        distractors:
          - 自由度を 2n=80 ではなく n=40 とした
          - ピボットの 2 を忘れ、ΣX_i/θ がカイ二乗分布に従うとした
          - 正規近似（平均 ± 1.96 × 平均/√n）で作った区間で、正確な区間ではない
          - 正解
          - 平均 θ ではなく到着率 λ（1/秒）の区間を答えた
        explanation: |
          **方針** 指数分布の和 $\sum X_i$ はガンマ分布に従い、$2\sum X_i/\theta\sim\chi^2(2n)$ がピボット（未知の $\theta$ を含むが分布が $\theta$ によらない量）になる。不等式を $\theta$ について解く。

          **途中式**
          - $P\left(«q80l»\le \dfrac{2\sum X_i}{\theta}\le «q80u»\right)=0.95$
          - $\theta$ について解くと $\dfrac{2\sum x_i}{«q80u»}\le\theta\le\dfrac{2\sum x_i}{«q80l»}$
          - $2\sum x_i=«twoS»$ より、$\dfrac{«twoS»}{«q80u»}=«ci_lo»$、$\dfrac{«twoS»}{«q80l»}=«ci_hi»$

          **答え** $«ci»$

          **間違えやすい点** 自由度は $n$ ではなく $2n$。また、逆数をとるので **上側の点が下限、下側の点が上限** に対応する。正規近似 $«xbar»\pm«ci_half»$ の区間 $«ciN»$ は左右対称だが、正確な区間は右に長い非対称な区間になる。
  - id: s03p05
    title: 漢字学習アプリの効果
    context: |
      ある市の中学校で、新しい漢字学習アプリを 4 週間使った生徒の小テストの得点の伸び $D$（使用後 − 使用前）を調べる。
      帰無仮説は「効果なし」、対立仮説は「伸びは正の側にずれている」（片側）とし、有意水準は 5% とする。
    items:
      - id: s03p05a
        chapter: 13
        terms: [wilcoxon-signed-rank-test, normal-approximation-rank-tests, rank-and-ties]
        topic: 生徒10人の得点の伸びに対する符号付き順位検定の正規近似
        level: 標準
        definition: false
        type: choice
        question: |
          予備調査として 10 人にアプリを使わせたところ、得点の伸びは次のとおりだった（同じ絶対値や 0 はない）。

          «data»

          ウィルコクソンの符号付き順位検定（片側、有意水準 5%）を行う。正の伸びの順位和を $W^+$ とし、連続修正をしない正規近似を使う（標準正規分布の上側 5% 点は 1.645、上側 2.5% 点は 1.96）。
          $W^+$ の値・標準化した値 $z$・結論の組として正しいものを選べ。
        choices:
          - $W^+=«Wp»$、$z=«z»$、棄却する
          - $W^+=«Wp»$、$z=«z12»$、棄却しない
          - $W^+=«Wm»$、$z=«zm»$、棄却しない
          - $W^+=«Wp»$、$z=«z»$、1.96 を超えないので棄却しない
          - $W^+=«Wp»$、$z=«zv»$、棄却しない
        answer: 0
        distractors:
          - 正解
          - 帰無仮説の下での分散を n(n+1)(2n+1)/24 ではなく /12 で計算した
          - 負の伸びの順位和を W+ と取り違えた
          - 片側検定なのに両側の棄却限界 1.96 と比べた
          - 標準偏差ではなく分散で割った
        explanation: |
          **方針** 伸びの絶対値に小さい順に順位をつけ、正の伸びの順位を足して $W^+$ を求める。帰無仮説の下で $E[W^+]=n(n+1)/4$、$V[W^+]=n(n+1)(2n+1)/24$ を使って標準化する。

          **途中式**
          - 絶対値を小さい順に並べると «absorder» で、順位は 1〜10
          - 負の伸び（絶対値 «neg»）の順位は «negranks»、その和 $W^-=«Wm»$
          - 順位の総和は $10\times11/2=«tot_rank»$ なので $W^+=«tot_rank»-«Wm»=«Wp»$
          - $E[W^+]=10\times11/4=«EW»$、$V[W^+]=10\times11\times21/24=«VW»$、標準偏差 $«sdW»$
          - $z=(«Wp»-«EW»)/«sdW»=«z»$
          - 片側 5% の棄却限界 «za» より大きいので棄却する。

          **答え** $W^+=«Wp»$、$z=«z»$、有意水準 5% で棄却する（伸びは正の側にずれていると判断する）

          **間違えやすい点** 分散の分母は 24（12 ではない）。対立仮説が「正の側」なので、片側の棄却限界 «za» と比べる。順位は**絶対値**につけ、符号で分けて足す。
      - id: s03p05b
        chapter: 10
        terms: [neyman-pearson-lemma, rejection-region, power-function]
        topic: 得点が伸びた生徒数の二項分布でネイマン・ピアソンの補題による最強力検定の棄却域と検出力
        level: 応用
        definition: false
        type: choice
        question: |
          別の «nb» 人に試したところ、得点が伸びた生徒の数を $X$ とする。$X$ は二項分布 $Bin(«nb»,\ p)$ に従うとし、単純仮説 $H_0:p=0.5$ と $H_1:p=0.7$ を比べる。
          ネイマン・ピアソンの補題にもとづき、尤度比 $L(0.7)/L(0.5)$ がある値以上のとき $H_0$ を棄却する検定（ランダム化はしない）を考える。このうち有意水準が 5% を超えないもので、棄却域が最も広いものを選ぶ。その棄却域と検出力の組として正しいものを選べ。必要なら次の上側確率 $P(X\ge k)$ を使え。

          | $k$ | 10 | 11 | 12 | 13 |
          |---|---|---|---|---|
          | $p=0.5$ | «s0_10» | «s0_11» | «s0_12» | «s0_13» |
          | $p=0.7$ | «s1_10» | «s1_11» | «s1_12» | «s1_13» |
        choices:
          - 棄却域 $X\ge«c»$、検出力 «pow»
          - 棄却域 $X\ge«c1»$、検出力 «d_pow1»
          - 棄却域 $X\ge«c»$、検出力 «d_beta»
          - 棄却域 $X\ge«c2»$、検出力 «d_pow2»
          - 棄却域 $X\ge«c»$、検出力 «d_size»
        answer: 0
        distractors:
          - 正解
          - 有意水準が 5% を超える（0.0592）棄却域を選んだ
          - 検出力ではなく第2種の誤りの確率 1−0.2969 を答えた
          - 5% 以下の棄却域のうち最も大きいものではなく、さらに狭い棄却域を選んだ（検出力が下がる）
          - 有意水準（第1種の誤りの確率）を検出力と取り違えた
        explanation: |
          **方針** ネイマン・ピアソンの補題により、尤度比 $\dfrac{L(0.7)}{L(0.5)}$ が大きいときに棄却する検定は、同じ大きさ（第1種の誤りの確率）の検定の中で最強力である。尤度比が $x$ の増加関数なら、棄却域は $X\ge c$ の形になる。$P(X\ge c\mid p=0.5)\le0.05$ を満たす最小の $c$ を選ぶ。

          **途中式**
          - 尤度比：$\dfrac{0.7^x0.3^{«nb»-x}}{0.5^{«nb»}}=\left(\dfrac{0.3}{0.5}\right)^{«nb»}\left(\dfrac{0.7}{0.3}\right)^{x}$ は $x$ の増加関数
          - $P(X\ge«c1»\mid0.5)=«size_c1»>0.05$、$P(X\ge«c»\mid0.5)=«size»\le0.05$ → 棄却域は $X\ge«c»$
          - 検出力：$P(X\ge«c»\mid0.7)=«pow4»$

          **答え** 棄却域 $X\ge«c»$、検出力 約 «pow»

          **間違えやすい点** 離散分布では有意水準をちょうど 5% にできないので、5% を超えない範囲で棄却域をできるだけ広くとる（実際の有意水準は «size»）。この検定は大きさ «size» の検定の中で最強力であり、大きさをちょうど 5% にするには $X=«c1»$ でランダム化が必要になる。検出力は「$H_1$ が正しいときに棄却する確率」で、$1-$検出力 が第 2 種の誤りの確率である。
  - id: s03p06
    title: 天気の移り変わり
    context: |
      ある山間部の観測所では、毎日の天気を「晴れ・曇り・雨」の 3 状態に分け、翌日の天気は当日の天気だけで決まるマルコフ連鎖とみなしている。過去の記録から推移確率行列を次のように推定した（行が当日、列が翌日、順に晴れ・曇り・雨）。
      $$P=\begin{pmatrix}0.6&0.3&0.1\\0.3&0.4&0.3\\0.2&0.4&0.4\end{pmatrix}$$
    items:
      - id: s03p06a
        chapter: 14
        terms: [n-step-transition-probability, chapman-kolmogorov-equation, transition-probability-matrix]
        topic: 晴れの日の2日後が雨だったとき間の日が曇りだった条件付き確率（2ステップの経路の分解）
        level: 標準
        definition: false
        type: choice
        question: |
          今日は晴れだった。2 日後（明後日）が雨だったことがわかったとき、明日が曇りだった条件付き確率に最も近い値を選べ。
        choices:
          - "«d_two»"
          - "«cC»"
          - "«d_joint»"
          - "«d_trans»"
          - "«d_pathS»"
        answer: 1
        distractors:
          - 2 ステップ推移確率 P²(晴れ, 雨) そのものを答えた
          - 正解
          - 経路「晴れ→曇り→雨」の確率を答え、P²(晴れ, 雨) で割らなかった
          - 明後日の情報を使わず、晴れ→曇りの推移確率をそのまま答えた
          - 明日が晴れだった条件付き確率を答えた
        explanation: |
          **方針** チャップマン・コルモゴロフの式 $P^{(2)}_{SR}=\sum_k P_{Sk}P_{kR}$ で、明日の天気ごとの経路に分ける。条件付き確率は、該当する経路の確率を $P^{(2)}_{SR}$ で割る。

          **途中式**
          - 晴れ→晴れ→雨：$0.6\times0.1=«pSS»$
          - 晴れ→曇り→雨：$0.3\times0.3=«pSC»$
          - 晴れ→雨→雨：$0.1\times0.4=«pSR»$
          - $P^{(2)}_{SR}=«pSS»+«pSC»+«pSR»=«two2»$
          - $P(\text{明日 曇り}\mid\text{明後日 雨})=\dfrac{«pSC»}{«two2»}=«cC4»$

          **答え** 約 «cC»

          **間違えやすい点** マルコフ性は「未来は現在だけで決まる」という性質で、未来の情報（明後日が雨）を与えると明日の天気の確率は変わる。明日が曇りの事前の確率 «d_trans» から、雨になりやすい曇りの経路の重みが増えて約 «cC» になる。
  - id: s03p07
    title: 小麦の収量の重回帰
    context: |
      ある試験場の «n» 区画で、小麦の収量 $y$（kg/a）を、窒素施肥量 $x_1$（kg/10a）と 6 月の降水量 $x_2$（mm）に回帰した（切片あり、説明変数 $p=«p»$ 個）。
      最小二乗法の結果は $\hat y=20.0+«b1»\,x_1+«b2»\,x_2$、決定係数は $R^2=«R2»$ だった。
    items:
      - id: s03p07a
        chapter: 16
        terms: [adjusted-r-squared, coefficient-of-determination]
        topic: 小麦試験区30区画・説明変数2個のモデルで決定係数から自由度調整済み決定係数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          このモデルの自由度調整済み決定係数に最も近い値を選べ。
        choices:
          - "«d_np»"
          - "«d_n»"
          - "«d_r2»"
          - "«adj»"
          - "«d_inv»"
        answer: 3
        distractors:
          - 残差の自由度を n−p−1 ではなく n−p とした
          - 全体の自由度を n−1 ではなく n とした
          - 調整前の決定係数をそのまま答えた
          - 正解
          - 自由度の比を逆さまに掛けた（調整後のほうが大きくなる）
        explanation: |
          **方針** 自由度調整済み決定係数は、残差平方和と全平方和をそれぞれの自由度で割ってから比をとる：$\bar R^2=1-\dfrac{S_e/(n-p-1)}{S_{yy}/(n-1)}=1-(1-R^2)\dfrac{n-1}{n-p-1}$。

          **途中式**
          - $n-1=«dfT»$、$n-p-1=«dfE»$
          - $\bar R^2=1-«one_r2»\times\dfrac{«dfT»}{«dfE»}=1-«one_r2»\times«ratio»=«adj»$

          **答え** 約 «adj»

          **間違えやすい点** 切片の分も自由度から引くので残差の自由度は $n-p-1$。調整済み決定係数は、説明変数を増やすことへの罰を入れたものなので、$R^2$ 以下になる（«d_inv» のように大きくなったら式の向きを間違えている）。
      - id: s03p07b
        chapter: 17
        terms: [leverage, outlier-and-influential-point, hat-matrix]
        topic: 施肥量だけの単回帰で施肥量が極端な区画のてこ比を偏差平方和から求め目安と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          施肥量 $x_1$ だけを説明変数とする単回帰 $y=\beta_0+\beta_1x_1+\varepsilon$ を考える。«n» 区画の施肥量の平均は $\bar x=«xm»$、偏差平方和は $S_{xx}=\sum(x_i-\bar x)^2=«Sxx»$ で、区画 17 の施肥量は $x_{17}=«xi»$ だった。
          区画 17 のてこ比（ハット行列の対角成分）$h_{17}$ を求めよ。
        answer: «lev»
        tolerance: 0.001
        answer_format: 小数第3位まで（四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 単回帰のハット行列の対角成分は $h_{ii}=\dfrac1n+\dfrac{(x_i-\bar x)^2}{S_{xx}}$。説明変数の値が平均から離れているほど大きくなり、$y$ の値にはよらない。

          **途中式**
          - $1/n=1/«n»=«inv_n»$
          - $(x_{17}-\bar x)^2=(«xi»-«xm»)^2=«dev2»$、$«dev2»/«Sxx»=«frac»$
          - $h_{17}=«inv_n»+«frac»=«lev4»$

          **答え** 約 «lev»

          **間違えやすい点** $1/n$ を足し忘れると «d_noinv» になる。単回帰の推定パラメータは切片と傾きの 2 個なので、てこ比の平均は $2/n=2/«n»\approx«avg»$ で、目安 $2\times2/n\approx«thr»$ を大きく超えるので、区画 17 は回帰直線を強く引っ張りうる点として、残差やクックの距離もあわせて調べる。
      - id: s03p07c
        chapter: 19
        terms: [omitted-variable-bias, multiple-regression-model, endogeneity]
        topic: 降水量を除いた単回帰で施肥量の傾きがどう変わるか（除外変数バイアスの向き）
        level: 応用
        definition: false
        type: choice
        question: |
          同じ «n» 区画で、降水量 $x_2$ を施肥量 $x_1$ に回帰すると $\hat x_2=150.0«g»\,x_1$ だった（施肥量の多い区画ほど降水量が少なかった）。
          降水量を説明変数から除き、収量 $y$ を施肥量 $x_1$ だけに単回帰したときの傾きと、その解釈として正しいものを選べ（すべて同じデータに最小二乗法を当てはめる）。
        choices:
          - 傾きは «d_same»。最小二乗推定量は不偏なので、説明変数を除いても $x_1$ の係数は変わらない
          - 傾きは «d_sign»。降水量の効果が符号を変えて加わるため大きくなる
          - 傾きは «d_add»。重回帰の 2 つの係数の和になる
          - 傾きは «simple»。除いた降水量が施肥量と無相関であるため、係数の変化は誤差にすぎない
          - 傾きは «simple»。施肥量の多い区画ほど降水量が少なく、降水量の正の効果の一部が施肥量の傾きに混ざって小さくなる
        answer: 4
        distractors:
          - 除外変数バイアスを無視した（説明変数どうしに相関があると係数は変わる）
          - x2 を x1 に回帰した傾き −4.0 の符号を取り違えた
          - x2 の係数 0.05 を、x1 との関係を掛けずにそのまま足した
          - 値は正しいが、x2 と x1 は相関している（傾き −4.0）ので理由が誤り
          - 正解
        explanation: |
          **方針** 最小二乗法では、同じデータについて「単回帰の傾き＝重回帰の $x_1$ の係数＋重回帰の $x_2$ の係数×（$x_2$ を $x_1$ に回帰した傾き）」が正確に成り立つ（除外変数バイアスの公式）。

          **途中式**
          - $y$ の重回帰：$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$
          - $x_2$ を $x_1$ に回帰した傾き：$\hat\delta=«g»$
          - 単回帰の傾き：$\tilde\beta_1=\hat\beta_1+\hat\beta_2\hat\delta=«b1»+«b2»\times(«g»)=«b1»«b2g»=«simple»$

          **答え** 傾きは «simple»。降水量の効果（正）が、施肥量と降水量の負の相関を通じて施肥量の傾きに混ざり、小さくなる。

          **間違えやすい点** 除いた変数が残った変数と相関していると、残った変数の係数は「自分の効果＋除いた変数の効果の一部」を表すようになる（不偏性は、正しいモデルを当てはめたときの性質）。バイアスの向きは $\hat\beta_2$ と $\hat\delta$ の符号の積で決まる：ここでは正×負で負の向き。
  - id: s03p08
    title: 資格試験の合否のモデル選択
    context: |
      ある高校で、資格試験を受けた生徒 «n» 人について、合格なら 1、不合格なら 0 とする 2 値データに、説明変数の異なるロジスティック回帰モデルを当てはめた。
    items:
      - id: s03p08a
        chapter: 30
        terms: [aic, bic, information-criteria-comparison]
        topic: 合否のロジスティック回帰3モデルでAICとBICの選ぶモデルが分かれる例
        level: 標準
        definition: false
        type: choice
        question: |
          同じ «n» 人のデータに次の 3 つのロジスティック回帰モデルを当てはめた。$k$ は切片を含む推定パラメータの数、$-2\ell$ は最大対数尤度の $-2$ 倍である。

          | モデル | 説明変数 | $k$ | $-2\ell$ |
          |---|---|---|---|
          | M1 | 模試回数 | «k_M1» | «m2ll_M1» |
          | M2 | 模試回数・学習時間 | «k_M2» | «m2ll_M2» |
          | M3 | 模試回数・学習時間・両者の交互作用 | «k_M3» | «m2ll_M3» |

          $\mathrm{AIC}=-2\ell+2k$、$\mathrm{BIC}=-2\ell+k\log n$（自然対数、$\log «n»=«ln200»$）とし、どちらも小さいモデルを選ぶ。正しいものを選べ。
        choices:
          - AIC は M3、BIC も M3 を選ぶ
          - AIC は M3、BIC は M2 を選ぶ
          - AIC は M1、BIC も M1 を選ぶ
          - AIC は M3、BIC は M1 を選ぶ
          - AIC は M1、BIC は M3 を選ぶ
        answer: 3
        distractors:
          - BIC の罰則を AIC と同じ 2k にした
          - log n を常用対数 log₁₀ 200 = 2.301 で計算した
          - 対数尤度の符号を取り違え、当てはまりの悪いモデルほど良いとした
          - 正解
          - AIC と BIC の結論を逆に覚えた（BIC のほうが罰則が重く小さいモデルを選びやすい）
        explanation: |
          **方針** 各モデルについて AIC と BIC を計算して比べる。$n=«n»$ では $\log n=«ln200»>2$ なので、BIC のほうがパラメータ 1 つあたりの罰則が重い。

          **途中式**
          - AIC：M1 $=«m2ll_M1»+4=«aic_M1»$、M2 $=«m2ll_M2»+6=«aic_M2»$、M3 $=«m2ll_M3»+8=«aic_M3»$ → 最小は M3
          - BIC：M1 $=«m2ll_M1»+«pen_M1»=«bic_M1»$、M2 $=«m2ll_M2»+«pen_M2»=«bic_M2»$、M3 $=«m2ll_M3»+«pen_M3»=«bic_M3»$ → 最小は M1

          **答え** AIC は M3、BIC は M1 を選ぶ

          **間違えやすい点** BIC の罰則 $k\log n$ は $n\ge 8$ で AIC の $2k$ より重いので、BIC はより小さいモデルを選びやすい。常用対数で計算すると罰則が軽くなり、BIC が M2（«bic10_M2»）を選ぶという誤りになる。$k$ には切片を数える（ロジスティック回帰には分散のパラメータはない）。
  - id: s03p09
    title: 農業試験場のトマト栽培
    context: |
      ある農業試験場で、トマトの新しい栽培法と肥料の比較試験を行う。
    items:
      - id: s03p09a
        chapter: 31
        terms: [normal-normal-model, credible-interval, posterior-distribution]
        topic: 過去の試験を事前分布にした新栽培法の平均収量の95%信用区間（正規・正規モデル）
        level: 標準
        definition: false
        type: choice
        question: |
          新しい栽培法での 1 株あたりの平均収量 $\mu$（kg）について、過去の類似の試験から事前分布を $N(«m0»,\ «t0»^2)$ とする。
          今年 «ns» 株を新しい栽培法で育てたところ、1 株あたりの収量の平均は $\bar y=«yb»$ kg だった。各株の収量は $\mu$ が与えられたもとで独立に $N(\mu,\ «sig»^2)$ に従う（分散は既知）。
          $\mu$ の事後分布にもとづく 95% 信用区間（事後平均 $\pm1.96\times$ 事後標準偏差）として正しいものを選べ。
        choices:
          - "$«d_data»$"
          - "$«d_w»$"
          - "$«cri»$"
          - "$«d_add»$"
          - "$«d_sig»$"
        answer: 2
        distractors:
          - 事前分布を使わず、データだけの信頼区間 ȳ ± 1.96σ/√n を作った
          - 事後平均を求めるときの重み（精度）を事前とデータで逆にした
          - 正解
          - 事後分散を、精度の和の逆数ではなく分散の和 τ²+σ²/n とした
          - データの精度を n/σ² ではなく 1/σ²（1 株分）とした
        explanation: |
          **方針** 正規分布どうしの共役関係を使う。精度（分散の逆数）は足し算になり、事後平均は事前平均と標本平均を精度で重みづけした平均になる。

          **途中式**
          - 事前の精度：$1/«t0»^2=1/«t02»=«prec0»$
          - データの精度：$n/\sigma^2=«ns»/«sig»^2=«precd»$（$\bar y$ の分散は $«sig»^2/«ns»=«sn2»$）
          - 事後の精度：$«prec0»+«precd»=«precp»$、事後分散 $1/«precp»=«vp»$、事後標準偏差 $«spp»$
          - 事後平均：$\dfrac{«prec0»\times«m0»+«precd»\times«yb»}{«precp»}=«mp»$
          - 信用区間：$«mp»\pm1.96\times«spp»=«mp»\pm«half»$ → $«cri»$

          **答え** $«cri»$

          **間違えやすい点** 事後平均は標本平均 «yb» を事前平均 «m0» の方へ引き寄せた値になる（データの重みは «wd»）。事後分散は「分散の和」ではなく「精度の和の逆数」で、事前分布の情報が加わるぶんデータだけの区間 $«d_data»$ より狭くなる。
      - id: s03p09b
        chapter: 20
        terms: [randomized-block-design, two-way-anova-without-replication, sum-of-squares-decomposition]
        topic: 乱塊法のトマト収量で肥料の平方和を平均から求めF値を出す
        level: 応用
        definition: false
        type: numeric
        question: |
          4 種類の肥料（$A_1,\dots,A_4$）を比べるため、土の条件が違う 5 つのブロック（圃場）それぞれを 4 区画に分け、各ブロックの中で肥料を無作為に割り付けた（乱塊法、各セルの観測は 1 つ）。
          トマトの収量（kg/区画）について、肥料ごとの平均（5 ブロックの平均）は $A_1$：«m1»、$A_2$：«m2»、$A_3$：«m3»、$A_4$：«m4» で、全体平均は «gm» だった。
          また、総平方和は $S_T=«ST»$、ブロック間の平方和は $S_B=«SB»$ だった。
          ブロックを因子に含めた繰り返しのない二元配置の分散分析で、肥料の効果を検定する F 統計量の値を求めよ。
        answer: «F»
        tolerance: 0.01
        answer_format: 小数第2位まで（四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 肥料の平方和 $S_A$ を肥料ごとの平均から求め、$S_E=S_T-S_A-S_B$ で誤差の平方和を出す。自由度は肥料 $a-1$、ブロック $b-1$、誤差 $(a-1)(b-1)$。

          **途中式**
          - $S_A=b\sum_i(\bar y_{i\cdot}-\bar y)^2=5\times\{«dev»\}=5\times«ssdev»=«SA»$
          - $S_E=«ST»-«SA»-«SB»=«SE»$
          - 自由度：肥料 $«dfA»$、ブロック $«dfB»$、誤差 $3\times4=«dfE»$
          - $V_A=«SA»/«dfA»=«MSA»$、$V_E=«SE»/«dfE»=«MSE»$
          - $F=«MSA»/«MSE»=«F4»$

          **答え** 約 «F»（$F_{0.05}(3,12)\approx«f05»$ より大きく、肥料による差は有意）

          **間違えやすい点** ブロックを無視して一元配置として計算すると、誤差平方和が $«SE1»$（自由度 «dfE1»）になり $F\approx«F1»$ と小さくなる。ブロック間の違いを誤差から取り除けるのが乱塊法の利点である。$S_A$ で $b=5$ を掛け忘れる誤りにも注意する。
