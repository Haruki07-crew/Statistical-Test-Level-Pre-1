        chapter: 25
        terms: [factor-loading, communality, common-factor-unique-factor]
        topic: 4教科の1因子モデルで負荷量から教科間の相関と共通性を読み取る
        level: 基本
        definition: false
        type: choice
        question: |
          このモデルについて正しい記述を 1 つ選べ。
        choices:
          - 国語の共通性は «l1»0 である
          - 国語と数学の、モデルから導かれる相関係数は «r13» である
          - 共通因子が 4 教科の分散の合計を説明する割合（寄与率）は «d_contrib» である
          - 英語の独自因子の分散（独自性）は «d_u2» である
          - 共通因子 $f$ の値を固定したとき、国語と英語の得点の相関（偏相関）は «r12» である
        answer: 1
        distractors:
          - 共通性は因子負荷量の 2 乗（0.64）なのに、負荷量そのものと取り違えた
          - 正解
          - 寄与率は負荷量の 2 乗和を 4 で割る（0.435）のに、負荷量の平均をとった
          - 独自性は 1−負荷量²（0.51）なのに、1−負荷量 とした
          - f を固定すると残るのは無相関な独自因子だけなので偏相関は 0。0.56 は f を固定しないときの相関
        explanation: |
          **方針** 標準化した変数では $V[x_j]=\lambda_j^2+V[\varepsilon_j]=1$。共通性は $\lambda_j^2$、独自性は $1-\lambda_j^2$、異なる変数の相関は $\mathrm{Cov}(\lambda_jf+\varepsilon_j,\ \lambda_kf+\varepsilon_k)=\lambda_j\lambda_k$ になる。

          **途中式**
          - 国語と数学の相関：$«l1»\times«l3»=«r13»$ … 正しい
          - 国語の共通性：$«l1»^2=«h1»$（«l1»0 ではない）
          - 寄与率：$(«l1»^2+«l2»^2+«l3»^2+«l4»^2)/4=«sumsq»/4=«contrib»$（«d_contrib» ではない）
          - 英語の独自性：$1-«l2»^2=«u2»$（«d_u2» ではない）
          - $f$ を固定すると $x_1, x_2$ の変動は $\varepsilon_1,\varepsilon_2$ だけで、無相関なので偏相関は 0（«r12» ではない）

          **答え** 国語と数学のモデル上の相関係数は «r13» である。

          **間違えやすい点** 因子負荷量（因子との相関）と共通性（説明される分散の割合＝負荷量の 2 乗）を混同しやすい。1 因子モデルでは、教科間の相関はすべて共通因子を通じて生じる（「局所独立」）。
  - id: s03p14
    title: 自転車安全講習の前後の合否
    context: |
      ある高校で、自転車の交通ルールの確認テスト（合格・不合格）を、安全講習の前と後に同じ «n» 人の生徒に行った。

      | | 講習後 合格 | 講習後 不合格 | 計 |
      |---|---|---|---|
      | 講習前 合格 | «a» | «b» | «pre» |
      | 講習前 不合格 | «c» | «d» | «r2» |
      | 計 | «post» | «c2» | «n» |
    items:
      - id: s03p14a
        chapter: 28
        terms: [mcnemar-test, two-by-two-table, chi-squared-distribution]
        topic: 自転車講習の前後で同じ生徒の合格率が変わったかのマクネマー検定（連続修正なし）
        level: 標準
        definition: false
        type: choice
        question: |
          講習の前後で合格率が変わったかを、連続修正をしないマクネマー検定（有意水準 5%、自由度 1 のカイ二乗分布の上側 5% 点は 3.84）で調べる。検定統計量と結論の組として正しいものを選べ。
        choices:
          - 統計量 «chi_cc»、棄却する（連続修正を付けた値）
          - 統計量 «chi_ind»、棄却する（前後の独立性の検定）
          - 統計量 «chi_n»、棄却しない
          - 統計量 «z»、3.84 より小さいので棄却しない
          - 統計量 «chi»、棄却する
        answer: 4
        distractors:
          - 連続修正をしない指示なのに (|c−b|−1)² を使った
          - 対応を無視し、表を独立性の検定（ピアソンのカイ二乗）にかけた。前後の合否の関連を調べており、合格率の変化の検定ではない
          - 分母を b+c ではなく総数 n にした
          - 標準正規の統計量 |c−b|/√(b+c) をカイ二乗分布の棄却限界 3.84 と比べた
          - 正解
        explanation: |
          **方針** 同じ生徒の前後の比較なので、対応のある 2 値データの検定（マクネマー検定）を使う。結果が変わった生徒（不一致ペア）だけが合格率の差に関係する。$b$＝合格→不合格、$c$＝不合格→合格として $\chi^2=(c-b)^2/(b+c)$。

          **途中式**
          - 不一致ペア：$b=«b»$、$c=«c»$、$b+c=«bc»$
          - $\chi^2=\dfrac{(«c»-«b»)^2}{«bc»}=\dfrac{«diff2»}{«bc»}=«chi»$
          - $«chi»>3.84$ なので棄却する。講習前の合格率 $«pre»/«n»$ と講習後の $«post»/«n»$ には有意な差がある。

          **答え** 統計量 «chi»、有意水準 5% で棄却する

          **間違えやすい点** 一致したペア（«a» 人と «d» 人）は合格率の差に影響しないので統計量に入らない。$z=|c-b|/\sqrt{b+c}=«z»$ を使うなら、比べるのは標準正規分布の両側 5% 点 1.96（$1.96^2=3.84$）である。独立性の検定は「前後の合否に関連があるか」を調べるもので、目的が違う。
