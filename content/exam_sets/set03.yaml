        definition: false
        type: choice
        question: |
          最長距離法（完全連結法）で階層的クラスタリングを行う。すべての地点が 1 つのクラスターにまとまる最後の結合が起きる距離（デンドログラムの最も高い枝の高さ）を選べ。
        choices:
          - "«d_single»"
          - "«last»"
          - "«d_third»"
          - "«d_avg»"
          - "«d_noD»"
        answer: 1
        distractors:
          - 最短距離法（単連結法）で計算した
          - 正解
          - 3 回目の結合（D と {C, E}）の距離を答えた
          - 群平均法で計算した
          - 最後の結合で D を含む距離を見落とし、{A,B} と {C,E} の間の最大距離だけを使った
        explanation: |
