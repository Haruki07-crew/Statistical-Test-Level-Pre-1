      - id: s03p10a
        chapter: 21
        terms: [ratio-estimation, simple-random-sampling, sampling-and-nonsampling-error]
        topic: 作付面積を補助情報にした比推定で農家1戸あたりの収穫量を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          作付面積を補助変数とする比推定量を使って、町の農家 1 戸あたりの平均収穫量（t）を推定せよ。
        answer: «yr»
        tolerance: 0.1
        answer_format: 小数第1位まで（四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 比推定量は $\hat{\bar Y}_R=\dfrac{\bar y}{\bar x}\,\bar X$。収穫量が作付面積にほぼ比例するとき、母集団の平均面積 $\bar X$ を使って標本の偏りを補正できる。

          **途中式**
          - 母集団の平均作付面積：$\bar X=«X»/«N»=«Xb»$ ha
          - 比の推定値：$\hat R=\bar y/\bar x=«yb»/«xb»=«R»$ t/ha
          - $\hat{\bar Y}_R=«R»\times«Xb»=«yr_s»$

          **答え** 約 «yr_s» t（町全体の総収穫量なら $«yr_s»\times«N»=«tot»$ t）

          **間違えやすい点** 標本平均 $\bar y=«d_simple»$ をそのまま使うと、標本にたまたま小さい農家が多く入った（$\bar x=«xb»<\bar X=«Xb»$）ことを補正できない。比推定量はわずかに偏りがあるが、$y$ と $x$ の相関が強いと分散が小さくなる。
