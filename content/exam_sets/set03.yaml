          **途中式**
          - 1 回目：最小は $d(A,B)=«h1»$ → {A,B}
          - 2 回目：残りで最小は $d(C,E)=«h2»$ → {C,E}
          - 3 回目：$d(D,\{C,E\})=\max(«dCD»,«dDE»)=«h3»$、$d(\{A,B\},\{C,E\})=\max(«dAC»,«dAE»,«dBC»,«dBE»)=«d_noD»$、$d(\{A,B\},D)=\max(«dAD»,«dBD»)=«dAD»$ → 最小の «h3» で {C,D,E}
          - 4 回目：$d(\{A,B\},\{C,D,E\})=\max(«dAC»,«dAD»,«dAE»,«dBC»,«dBD»,«dBE»)=«last»$

          **答え** «last»

          **間違えやすい点** 最短距離法では最後の結合は «d_single»（$d(B,C)$）になり、方法によって木の高さが大きく変わる。最長距離法の最後の結合距離は、異なるグループに分かれた点どうしの距離の最大値なので、D と A の距離 «dAD» まで含めて考える。
