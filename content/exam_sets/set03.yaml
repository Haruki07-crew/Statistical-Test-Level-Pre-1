        type: choice
        question: |
          このモデルについて正しい記述を 1 つ選べ。
        choices:
          - 国語と数学の、モデルから導かれる相関係数は «r13» である
          - 国語の共通性は «l1»0 である
          - 共通因子が 4 教科の分散の合計を説明する割合（寄与率）は «d_contrib» である
          - 英語の独自因子の分散（独自性）は «d_u2» である
          - 共通因子 $f$ の値を固定したとき、国語と英語の得点の相関（偏相関）は «r12» である
        answer: 0
        distractors:
          - 正解
          - 共通性は因子負荷量の 2 乗（0.64）なのに、負荷量そのものと取り違えた
          - 寄与率は負荷量の 2 乗和を 4 で割る（0.435）のに、負荷量の平均をとった
          - 独自性は 1−負荷量²（0.51）なのに、1−負荷量 とした
          - f を固定すると残るのは無相関な独自因子だけなので偏相関は 0。0.56 は f を固定しないときの相関
        explanation: |
          **方針** 標準化した変数では $V[x_j]=\lambda_j^2+V[\varepsilon_j]=1$。共通性は $\lambda_j^2$、独自性は $1-\lambda_j^2$、異なる変数の相関は $\mathrm{Cov}(\lambda_jf+\varepsilon_j,\ \lambda_kf+\varepsilon_k)=\lambda_j\lambda_k$ になる。

          **途中式**
          - 国語と数学の相関：$«l1»\times«l3»=«r13»$ … 正しい
          - 国語の共通性：$«l1»^2=«h1»$（«l1»0 ではない）
          - 寄与率：$(«l1»^2+«l2»^2+«l3»^2+«l4»^2)/4=«sumsq»/4=«contrib»$（«d_contrib» ではない）
          - 英語の独自性：$1-«l2»^2=«u2»$（«d_u2» ではない）
          - $f$ を固定すると $x_1, x_2$ の変動は $\varepsilon_1,\varepsilon_2$ だけで、無相関なので偏相関は 0（«r12» ではない）

          **答え** 国語と数学のモデル上の相関係数は «r13» である。

          **間違えやすい点** 因子負荷量（因子との相関）と共通性（説明される分散の割合＝負荷量の 2 乗）を混同しやすい。1 因子モデルでは、教科間の相関はすべて共通因子を通じて生じる（「局所独立」）。
  - id: s03p14
    title: 自転車安全講習と確認テストの合格率
    context: |
      2 つの高校で、自転車の安全講習を受けた生徒と受けなかった生徒の、交通ルールの確認テストの合格者数を調べた。

      | 学校 | 受講者の合格／人数 | 未受講者の合格／人数 |
      |---|---|---|
      | 都市部の X 校 | «ta1»／«na1» | «tb1»／«nb1» |
      | 郊外の Y 校 | «ta2»／«na2» | «tb2»／«nb2» |
      | 合計 | «TA»／«NA» | «TB»／«NB» |
    items:
      - id: s03p14a
        chapter: 28
        terms: [simpsons-paradox, three-way-table, cohort-and-case-control-study]
        topic: 2校を合わせると講習受講者の合格率が逆転するシンプソンのパラドックスの読み取り
        level: 標準
        definition: false
        type: choice
        question: |
          この集計について正しい記述を 1 つ選べ。
        choices:
          - 合計では受講者の合格率 «RA» が未受講者の «RB» より低いので、講習には合格率を下げる効果がある
          - 受講者の合格率は X 校 «ra1»、Y 校 «ra2» なので、合計の合格率はその単純平均になるはずで、合計の表に計算の誤りがある
          - このような逆転は標本が小さいときにだけ偶然に起こる現象で、各校の人数を増やせば必ず消える
          - Y 校の受講者の合格率 «ra2» は未受講者全体の合格率 «RB» より低いので、Y 校では講習は逆効果である
          - 各校とも受講者の合格率のほうが高いのに合計では逆転するのは、受講者の多くが合格率の低い Y 校の生徒だからであり、学校で層別した比較のほうが講習の効果の評価に適している
        answer: 4
        distractors:
          - 学校（交絡因子）を無視した合計の比較で因果を判断した
          - 合計の合格率は人数で重みづけた平均で、受講者の重みは X 校 0.20・Y 校 0.80 と偏っている
          - 逆転は人数の配分（交絡）で起こるもので、標本の大きさとは関係がない
          - 層（学校）をまたいで比べており、同じ学校の中の比較になっていない
          - 正解
        explanation: |
          **方針** 層ごとの比較と合計の比較の向きが逆になる現象（シンプソンのパラドックス）を、層の構成の違いから説明する。合計の合格率は、各層の合格率を「その群の人数の割合」で重みづけた平均である。

          **途中式**
          - X 校：受講 $«ta1»/«na1»=«ra1»$、未受講 $«tb1»/«nb1»=«rb1»$ → 受講者が高い
          - Y 校：受講 $«ta2»/«na2»=«ra2»$、未受講 $«tb2»/«nb2»=«rb2»$ → 受講者が高い
          - 合計：受講 $«TA»/«NA»=«RA»$、未受講 $«TB»/«NB»=«RB»$ → 逆転
          - 受講者の構成は X 校 «sa1»・Y 校 «sa2»、未受講者の構成は X 校 «sb1»・Y 校 «sb2»：受講者は合格率の低い Y 校に偏っている
          - 受講者の合計の合格率 $=«sa1»\times«ra1»+«sa2»\times«ra2»=«RA»$

          **答え** 学校で層別した比較のほうが適切

          **間違えやすい点** 学校が「講習を受けるかどうか」と「合格しやすさ」の両方に関係する交絡因子になっている。合計の表だけで判断すると、効果の向きまで逆に見誤る。
