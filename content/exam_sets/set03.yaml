          - 比の推定値：$\hat R=\bar y/\bar x=«yb»/«xb»=«R»$ t/ha
          - $\hat{\bar Y}_R=«R»\times«Xb»=«yr_s»$

          **答え** 約 «yr_s» t（町全体の総収穫量なら $«yr_s»\times«N»=«tot»$ t）

          **間違えやすい点** 標本平均 $\bar y=«d_simple»$ をそのまま使うと、標本にたまたま小さい農家が多く入った（$\bar x=«xb»<\bar X=«Xb»$）ことを補正できない。比推定量はわずかに偏りがあるが、$y$ と $x$ の相関が強いと分散が小さくなる。
  - id: s03p11
    title: 大雨の予測（判別分析）
    context: |
      ある地方気象台で、翌日に大雨となった日（群 1）とならなかった日（群 2）を、当日の湿度 $x_1$（%）と 12 時間の気圧の低下量 $x_2$（hPa）で判別する。
      群ごとの平均ベクトルは群 1 が $(«x1a»,\ «x2a»)$、群 2 が $(«x1b»,\ «x2b»)$ で、両群に共通の分散共分散行列は
      $$\Sigma=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
      とする。両群とも 2 変量正規分布に従うと仮定する。

      標準正規分布の上側確率 $P(Z>z)$ の抜粋：

      | $z$ | «zrow» |
      |---|---|---|---|---|---|
      | 上側確率 | «prow» |
    items:
      - id: s03p11a
        chapter: 23
        terms: [mahalanobis-distance, linear-discriminant-analysis, misclassification-rate]
        topic: 湿度と気圧低下の相関を考慮したマハラノビス距離から大雨判別の誤判別確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          事前確率と誤判別の損失が両群で等しいとき、線形判別関数による判別を行う。群の平均の間のマハラノビス距離の 2 乗 $\Delta^2$ と、1 つの群から見た誤判別確率の組として正しいものを選べ（$\Delta/2$ は小数第 2 位に丸めて表を引け）。
        choices:
          - $\Delta^2=«D2_diag»$、誤判別確率 «err_diag»
          - $\Delta^2=«D2_sign»$、誤判別確率 «err_sign»
          - $\Delta^2=«D2»$、誤判別確率 «err»
          - $\Delta^2=«D2»$、誤判別確率 «err_full»
          - $\Delta^2=«D2»$、誤判別確率 «err_half»
        answer: 2
        distractors:
          - 共分散 12 を無視し、各変数の分散で割って足した（相関を無視）
          - 逆行列の非対角成分の符号を取り違えた
          - 正解
          - Δ/2 ではなく Δ で正規分布表を引いた
          - Δ ではなく Δ² を 2 で割って表を引いた
        explanation: |
          **方針** 平均の差 $d=\mu_1-\mu_2$ について $\Delta^2=d^\top\Sigma^{-1}d$。等分散の 2 群の正規分布で、事前確率と損失が等しいとき、線形判別の誤判別確率は $\Phi(-\Delta/2)=P(Z>\Delta/2)$ になる。

          **途中式**
          - $d=(«d1»,\ «d2»)$、$|\Sigma|=«s11»\times«s22»-«s12»^2=«det»$
          - $\Sigma^{-1}=\dfrac{1}{«det»}\begin{pmatrix}«s22»&-«s12»\\-«s12»&«s11»\end{pmatrix}$
          - $\Delta^2=\dfrac{«s22»\times«d1»^2-2\times«s12»\times«d1»\times«d2»+«s11»\times«d2»^2}{«det»}=\dfrac{«q1»-«q2»+«q3»}{«det»}=\dfrac{«num»}{«det»}=«D2_4»$
          - $\Delta=«D»$、$\Delta/2\approx«zc»$
          - 誤判別確率 $=P(Z>«zc»)=«err4»$

          **答え** $\Delta^2\approx«D2»$、誤判別確率 約 «err»

          **間違えやすい点** 湿度と気圧低下は正の相関があるので、2 つの差（どちらも群 1 が大きい）は一部が「同じ情報」になる。相関を無視すると距離を過大に見積もり（$\Delta^2=«D2_diag»$）、誤判別確率を小さく見積もる。表を引くのは $\Delta$ でも $\Delta^2/2$ でもなく $\Delta/2$。
