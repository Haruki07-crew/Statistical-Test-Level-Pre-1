set: 25
title: 模擬試験 第25回
minutes: 90
problems:
  - id: s25p01
    title: 限界希釈法による細胞のクローン化
    context: |
      ある研究所では、抗体を作る細胞株を 1 個の細胞から増やす（クローン化する）ため、細胞懸濁液を薄めて 96 ウェルプレートの各ウェルにまく（限界希釈法）。
      各ウェルにまかれる細胞の数 $X$ は、ウェルごとに独立に平均 $\lambda$ のポアソン分布に従うとする。
    items:
      - id: s25p01a
        chapter: 5
        terms: [poisson-distribution, conditional-probability]
        topic: 限界希釈で増殖のなかったウェルの割合からポアソン平均を推定し増殖したウェルが単一細胞由来である条件付き確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          細胞が 1 個以上入ったウェルでは必ず増殖が見られ、0 個のウェルでは増殖しないものとする。
          1 枚のプレート（«W» ウェル）を培養したところ、増殖が見られなかったウェルは «W0» 個だった。
          増殖が見られなかったウェルの割合を $e^{-\lambda}$ に等しいとおいて $\lambda$ を推定し（$\ln(«W0»/«W»)=«lnr»$ を使え）、
          その推定値のもとで、増殖が見られたウェルが 1 個の細胞に由来する確率 $P(X=1\mid X\ge 1)$ を求めよ。
        answer: «p1c»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $P(X=0)=e^{-\lambda}$ を増殖のなかったウェルの割合に合わせて $\lambda$ を推定する。求める確率は「1 個以上」という条件のもとでの条件付き確率なので、$P(X=1)$ を $P(X\ge1)=1-e^{-\lambda}$ で割る。

          **途中式** $e^{-\hat\lambda}=«W0»/«W»$ より $\hat\lambda=-\ln(«W0»/«W»)=«lam»$。また $1-e^{-\hat\lambda}=«W1»/«W»$。
          $$P(X=1\mid X\ge1)=\frac{\hat\lambda e^{-\hat\lambda}}{1-e^{-\hat\lambda}}=\frac{«lam»\times«W0»/«W»}{«W1»/«W»}=\frac{«lam»\times«W0»}{«W1»}=«p1c4»\cdots$$

          **答え** $«p1c_s»$

          **間違えやすい点** 条件をつけ忘れて $P(X=1)=\hat\lambda e^{-\hat\lambda}=«lam»\times«W0»/«W»=«lamfrac»$ とすると、増殖しなかったウェルまで分母に入れたことになる。
          $e^{-\hat\lambda}$ は $«W0»/«W»$ そのものなので、指数関数の値を別に求める必要はない。増殖したウェルのうち約 $1-«p1c_s»$ は 2 個以上の細胞に由来し、クローンとは言えない。

      - id: s25p01b
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, score-function]
        topic: 0が観測されないゼロ切断ポアソン分布で平均の最尤推定値を尤度方程式から表を使って求める
        level: 応用
        definition: false
        type: choice
        question: |
          別の条件で、画像解析装置を使い、細胞を 1 個以上含むウェルだけについて、まかれた細胞の数を数えた（細胞が 0 個のウェルは記録されない）。«n» ウェルの記録は次のとおりだった。

          | 細胞数 | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | ウェル数 | «n1» | «n2» | «n3» | «n4» |

          記録された細胞数は、平均 $\lambda$ のポアソン分布を「1 個以上」で条件づけた分布（ゼロ切断ポアソン分布）
          $$P(X=x)=\frac{e^{-\lambda}\lambda^{x}}{x!\,(1-e^{-\lambda})}\qquad(x=1,2,\ldots)$$
          に独立に従うとする。$\lambda$ の最尤推定値に最も近いものはどれか。必要なら次の表を使え。

          | $\lambda$ | 0.8 | 0.9 | 1.0 | 1.1 | 1.2 |
          |---|---|---|---|---|---|
          | $\lambda/(1-e^{-\lambda})$ | «g08» | «g09» | «g10» | «g11» | «g12» |
        choices:
          - '$«c_shift»$'
          - '$«c_ok»$'
          - '$«c_iter»$'
          - '$«c_naive»$'
          - '$«c_inv»$'
        answer: 1
        distractors:
          - 1 から始まるずらしたポアソン分布とみて、標本平均から 1 を引いた
          - 正解
          - 尤度方程式 λ = x̄(1 − e^{−λ}) の反復を λ = x̄ から 1 回だけ行って止めた
          - 0 が除かれていることを無視し、標本平均をそのまま λ の推定値にした
          - 尤度方程式を λ(1 − e^{−λ}) = x̄ と分母と分子を取り違えて解いた
        explanation: |
          **方針** 対数尤度を $\lambda$ で微分して 0 とおく（尤度方程式）。解は式で書けないので、与えられた表から読む。

          **途中式** 観測値の合計を $\sum x_i$、個数を $n$ とすると、$\lambda$ に関係する部分の対数尤度は
          $$\ell(\lambda)=\Big(\sum x_i\Big)\ln\lambda-n\lambda-n\ln(1-e^{-\lambda})$$
          $$\ell'(\lambda)=\frac{\sum x_i}{\lambda}-n-\frac{n e^{-\lambda}}{1-e^{-\lambda}}=\frac{\sum x_i}{\lambda}-\frac{n}{1-e^{-\lambda}}=0
          \quad\Longleftrightarrow\quad \frac{\lambda}{1-e^{-\lambda}}=\bar x$$
          ここで $\sum x_i=1\times«n1»+2\times«n2»+3\times«n3»+4\times«n4»=«tot»$、$\bar x=«tot»/«n»=«xbar»$。
          左辺は $\lambda$ について増加関数で、表では $\lambda=1.0$ のとき $«g10»$ と $«xbar»$ にほぼ一致する（$\lambda=0.9$ では $«g09»$ で小さすぎる）。よって最尤推定値はほぼ $«c_ok»$。

          **答え** $«c_ok»$

          **間違えやすい点** 0 が記録されないぶん観測値は大きめに偏るので、標本平均 $«c_naive»$ をそのまま使うと $\lambda$ を過大に推定する。
          切断ポアソン分布は「1 から始まるポアソン分布」（$X-1$ がポアソン分布）とは別物で、$\bar x-1=«c_shift»$ も誤り。
          方程式を $\lambda(1-e^{-\lambda})=\bar x$ と取り違えると $«c_inv»$ になる。

  - id: s25p02
    title: 電子天秤の測定誤差
    context: |
      ある品質試験室で、医薬品原料の秤量に使う電子天秤の測定誤差を調べた。
    items:
      - id: s25p02a
        chapter: 7
        terms: [central-limit-theorem, lindeberg-levy-clt]
        topic: 一様分布に従う丸め誤差を多数足した合計誤差が許容幅を超える確率を中心極限定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          この天秤は秤量値を «h» mg 単位に丸めて表示する。丸めによる誤差（表示値 − 真の値）は、1 回ごとに独立に区間 $(-«hh»,\,«hh»)$（mg）上の一様分布に従うとする。
          ある標準溶液の調製で «mm» 回の秤量値を合計したとき、合計に含まれる丸め誤差の絶対値が «thr» mg を超える確率を、中心極限定理による正規近似で求めよ。
          必要なら標準正規分布の分布関数 $\Phi(z)$ の次の値を使え。

          | $z$ | 0.50 | 1.00 | 2.50 |
          |---|---|---|---|
          | $\Phi(z)$ | «phi050» | «phi100» | «phi250» |
        answer: «ans_a»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 1 回の丸め誤差の平均と分散を一様分布の公式で求め、«mm» 個の和の平均と分散を出す。和は中心極限定理により近似的に正規分布に従う。

          **途中式** 区間の幅は $«h»$ なので、1 回の誤差 $U_i$ は $E[U_i]=0$、$V[U_i]=\dfrac{«h»^2}{12}=\dfrac{0.01}{12}\approx«var1»$。
          合計 $S=\sum_{i=1}^{«mm»}U_i$ は $E[S]=0$、$V[S]=«mm»\times\dfrac{0.01}{12}=«varS»$、標準偏差 $\sqrt{«varS»}=«sdS»$。
          $$P(|S|>«thr»)\approx P\left(|Z|>\frac{«thr»}{«sdS»}\right)=P(|Z|>«z»)=2\{1-\Phi(«z»)\}=2\times«tail»=«ans_a_s»$$

          **答え** $«ans_a_s»$

          **間違えやすい点** 一様分布 $(-a,a)$ の分散は $(2a)^2/12=a^2/3$ で、幅の半分 $«hh»$ を幅とみて $«hh»^2/12$ とすると標準偏差が半分になり、$z=«z_half»$ で $«w_half»$ になる。
          「絶対値が超える」は両側なので、片側だけの $«one_side»$ では足りない。

      - id: s25p02b
        chapter: 3
        terms: [conditional-variance, conditional-expectation, expectation-variance-properties]
        topic: 偏りと精度の異なる2台の天秤を確率的に使い分けたときの測定誤差の標準偏差を全分散の公式で装置内と装置間に分けて求める
        level: 応用
        definition: false
        type: choice
        question: |
          試験室には天秤が 2 台あり、秤量のたびに確率 «w1» で天秤 1、確率 «w2» で天秤 2 が使われる。
          測定誤差 $\varepsilon$（µg）は、天秤 1 では平均 «b1»・標準偏差 «sd1»、天秤 2 では平均 «b2»・標準偏差 «sd2» の分布に従う。
          どちらの天秤を使ったかを区別しないとき、$\varepsilon$ の標準偏差に最も近いものはどれか。
        choices:
          - '$«w_ve»$'
          - '$«w_avg»$'
          - '$«w_ev»$'
          - '$«sdT»$'
          - '$«w_ex2»$'
        answer: 3
        distractors:
          - 天秤間の偏りの違いによる分散 V[E[ε|天秤]] だけを使った
          - 2 台の標準偏差を確率で重み付き平均した（分散ではなく標準偏差を平均した）
          - 天秤内の分散の平均 E[V[ε|天秤]] だけを使い、偏りの違いを無視した
          - 正解
          - 2 乗の期待値 E[ε²] の平方根を答え、平均の 2 乗を引き忘れた
        explanation: |
          **方針** 使った天秤 $K$ で条件づけて、全分散の公式 $V[\varepsilon]=E\big[V[\varepsilon\mid K]\big]+V\big[E[\varepsilon\mid K]\big]$ を使う。第 1 項は天秤内のばらつき、第 2 項は天秤ごとの偏りの違いによるばらつき。

          **途中式**
          $$E\big[V[\varepsilon\mid K]\big]=«w1»\times«sd1»^2+«w2»\times«sd2»^2=«w1»\times«v1»+«w2»\times«v2»=«ev»$$
          $E[\varepsilon]=«w1»\times«b1»+«w2»\times(«b2»)=«mean»$ なので
          $$V\big[E[\varepsilon\mid K]\big]=«w1»\times(«b1»-«mean»)^2+«w2»\times(«b2»-«mean»)^2=«ve»$$
          （2 点分布なので $«w1»\times«w2»\times(«b1»-(«b2»))^2=«w1»\times«w2»\times«bd2»=«ve»$ とも計算できる。）
          $$V[\varepsilon]=«ev»+«ve»=«tot»,\qquad \sqrt{«tot»}=«sdT4»\cdots$$

          **答え** $«sdT»$

          **間違えやすい点** 天秤内の分散の平均だけだと $\sqrt{«ev»}=«w_ev»$ で、偏りの違いによる分散 «ve» を見落とす。
          標準偏差を確率で平均した $«w_avg»$ も誤り（足し合わせられるのは分散）。$E[\varepsilon^2]=«ex2»$ の平方根 $«w_ex2»$ は、平均 «mean» の 2 乗を引いていない。

      - id: s25p02c
        chapter: 11
        terms: [normality-test, skewness-kurtosis]
        topic: 標本歪度と標本尖度からジャック・ベラ統計量を求め正規性を自由度2のカイ二乗で判定する
        level: 基本
        definition: false
        type: choice
        question: |
          振動のある実験台に置いた天秤 1 台で同じ分銅を繰り返し量り、«n» 個の測定誤差から、標本歪度 $b_1=«sk»$、標本尖度 $b_2=«ku»$（正規分布で 3 となる定義）を得た。
          ジャック・ベラ検定（統計量を $JB$ とし、帰無分布をカイ二乗分布で近似する）を有意水準 5% で行う。
          自由度 1 と 2 のカイ二乗分布の上側 5% 点はそれぞれ «chi1»、«chi2» である。正しい記述はどれか。
        choices:
          - '$JB=«jb_n6»$ で、«chi2» 以下なので正規性は棄却されない'
          - '$JB=«jb»$ で、«chi2» を超えるので正規性を棄却する。尖度が 3 より大きいので、正規分布より裾の軽い分布が示唆される'
          - '$JB=«jb»$ で、«chi2» を超えるので正規性を棄却する。尖度が 3 より大きいので、正規分布より裾の重い分布が示唆される'
          - '$JB=«jb_no4»$ で、«chi2» を超えるので正規性を棄却する'
          - '$JB=«jb_no3»$ で、«chi2» を超えるので正規性を棄却する'
        answer: 2
        distractors:
          - n/6 を掛け忘れた
          - 統計量は正しいが、尖度が大きいことを裾が軽いと逆に読んだ
          - 正解
          - 尖度の項 (b2−3)² を 4 で割り忘れた
          - 尖度から 3 を引き忘れた
        explanation: |
          **方針** ジャック・ベラ統計量 $JB=\dfrac{n}{6}\left\{b_1^2+\dfrac{(b_2-3)^2}{4}\right\}$ は、正規性のもとで近似的に自由度 2（歪度と尖度の 2 つ）のカイ二乗分布に従う。

          **途中式**
          $$JB=\frac{«n»}{6}\left\{«sk»^2+\frac{(«ku»-3)^2}{4}\right\}=«n6»\times(«sk2»+«ku3»)=«n6»\times«inner»=«jb»$$
          $«jb»>«chi2»$ なので有意水準 5% で正規性を棄却する。$b_2=«ku»>3$ は正規分布より裾が重い（とがっていて裾が長い）ことを表す。振動で時々大きな誤差が出ると、このような裾の重い分布になる。

          **答え** $JB=«jb»$ で正規性を棄却し、裾の重い分布が示唆される。

          **間違えやすい点** 尖度は正規分布の 3 を基準にし、3 より大きいと裾が重い。$(b_2-3)^2$ を 4 で割り忘れると $«jb_no4»$、3 を引き忘れると $«jb_no3»$ になる。
          自由度は歪度と尖度の 2 つで 2（«chi1» ではなく «chi2» と比べる）。

  - id: s25p03
    title: 製剤の安定性モニタリング
    context: |
      ある製薬会社では、出荷した錠剤のロットについて、有効成分の含量が規格を下回っていないかを保管期間中に調べている。
    items:
      - id: s25p03a
        chapter: 2
        terms: [joint-probability-density-function, marginal-probability-density-function, cumulative-distribution-function]
        topic: 指数分布に従う規格外になる時刻と一様分布に従う抜き取り時期の同時密度を積分して抜き取り時点ですでに規格外である確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          あるロットの含量が規格を下回るまでの時間 $X$（月）は、レート «lam»（平均 «mean» か月）の指数分布に従う。
          各ロットは、出荷後 0〜«c» か月の間の一様分布に従う時期 $Y$ に 1 回だけ抜き取られて検査される。$X$ と $Y$ は独立とする。
          抜き取り検査の時点ですでに規格を下回っている確率 $P(X\le Y)$ に最も近いものはどれか。必要なら $e^{-1.2}=«e12»$、$e^{-2.4}=«e24»$ を使え。
        choices:
          - '$«w_comp»$'
          - '$«w_exp»$'
          - '$«ans»$'
          - '$«w_mean»$'
          - '$«w_end»$'
        answer: 2
        distractors:
          - 余事象 P(X > Y) を答えた
          - 一様分布の Y を平均 12 の指数分布と取り違え、競合する指数分布の公式 λ/(λ+μ) を使った
          - 正解
          - Y を平均の 12 か月に固定して 1 − e^{−1.2} とした
          - Y を最後の 24 か月に固定して 1 − e^{−2.4} とした
        explanation: |
          **方針** 同時密度 $f(x,y)=0.1e^{-0.1x}\cdot\dfrac{1}{«c»}$（$x>0$、$0<y<«c»$）を領域 $x\le y$ で積分する。先に $x$ で積分すると、$Y=y$ のもとでの条件付き確率 $P(X\le y)=1-e^{-0.1y}$ を $y$ の周辺密度で平均する形になる。

          **途中式**
          $$P(X\le Y)=\int_0^{«c»}\frac{1}{«c»}\left(1-e^{-0.1y}\right)dy=1-\frac{1}{«c»}\cdot\frac{1-e^{-«lc»}}{0.1}=1-\frac{1-e^{-«lc»}}{«lc»}$$
          $$=1-\frac{«one_e»}{«lc»}=1-«frac»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** $Y$ を平均の 12 か月に置き換えて $1-e^{-1.2}=«w_mean»$ とするのは誤り。$1-e^{-0.1y}$ は $y$ について直線ではない（上に凸）ので、平均を代入した値は平均した値より大きくなる。
          $Y$ が一様分布である点を無視して競合する指数分布の公式を使うと $«w_exp»$ になる。

      - id: s25p03b
        chapter: 4
        terms: [log-transformation, change-of-variables, coefficient-of-variation]
        topic: 対数が正規分布に従うロットごとの有効期間の変動係数を対数スケールの分散から求める
        level: 基本
        definition: false
        type: choice
        question: |
          別の製剤では、ロットごとの有効期間 $T$（月）の対数 $\ln T$ が、分散 «s2» の正規分布に従う（平均は製剤の処方によって異なる）。
          $T$ の変動係数 $\sqrt{V[T]}/E[T]$ に最も近いものはどれか。必要なら $e^{«s2»}=«e016»$ を使え。
        choices:
          - '$«c_s2»$'
          - '$«cv2»$'
          - '$«c_sd»$'
          - '$«cv»$'
          - '$«w_sqrt»$'
        answer: 3
        distractors:
          - 対数スケールの分散 σ² をそのまま答えた
          - e^{σ²} − 1 の平方根をとり忘れた
          - 対数スケールの標準偏差 σ をそのまま変動係数とみなした
          - 正解
          - √(e^{σ²}) を答え、1 を引き忘れた
        explanation: |
          **方針** $\ln T\sim N(\mu,\sigma^2)$ のとき、$T$ は対数正規分布に従い、$E[T]=e^{\mu+\sigma^2/2}$、$V[T]=e^{2\mu+\sigma^2}(e^{\sigma^2}-1)$。

          **途中式**
          $$\frac{\sqrt{V[T]}}{E[T]}=\frac{e^{\mu+\sigma^2/2}\sqrt{e^{\sigma^2}-1}}{e^{\mu+\sigma^2/2}}=\sqrt{e^{\sigma^2}-1}=\sqrt{«e016»-1}=\sqrt{«cv2»}=«cv4»\cdots$$
          $\mu$ が消えるので、処方による平均の違いによらず変動係数は約 «cvpct»% になる。

          **答え** $«cv»$

          **間違えやすい点** 対数スケールの標準偏差 $\sigma=«sd»$ は、$\sigma$ が小さいときの変動係数の近似にすぎず、ここでは過小になる。平方根のとり忘れ（$«cv2»$）にも注意。

  - id: s25p04
    title: はがれたバイアルのラベル
    context: |
      ある微生物試験室で、«k» 種類の標準菌株の凍結保存バイアルのラベルが輸送中にすべてはがれてしまった。
      担当者は中身を確かめずに、«k» 枚のラベルを «k» 本のバイアルに 1 枚ずつ無作為に貼り直した（«k»! = «kf» 通りの貼り方が等確率）。
    items:
      - id: s25p04a
        chapter: 1
        terms: [inclusion-exclusion-principle, conditional-probability]
        topic: はがれた4本のバイアルのラベルを無作為に貼り直したとき1本も正しく貼られない確率を包除原理（完全順列）で求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 本も正しいラベルが貼られていない確率に最も近いものはどれか。
        choices:
          - '$«w_ind»$'
          - '$«w_one»$'
          - '$«w_e»$'
          - '$«ans»$'
          - '$«w_atl»$'
        answer: 3
        distractors:
          - 各バイアルが正しく貼られる事象を独立とみなし (3/4)^4 とした
          - ちょうど 1 本だけ正しく貼られる確率を答えた
          - 本数が多いときの極限 e^{−1} で近似した
          - 正解
          - 少なくとも 1 本が正しく貼られる確率（余事象）を答えた
        explanation: |
          **方針** $A_i$ を「$i$ 本目に正しいラベルが貼られる」事象とし、包除原理で $P(A_1\cup\cdots\cup A_4)$ を求めて 1 から引く。

          **途中式** 決められた $j$ 本が正しく貼られる貼り方は残りの $(4-j)!$ 通りなので、$P(A_{i_1}\cap\cdots\cap A_{i_j})=\dfrac{(4-j)!}{4!}$。$j$ 本の選び方は $\binom{4}{j}$ 通りだから
          $$P\Big(\bigcup_i A_i\Big)=\binom41\frac{3!}{4!}-\binom42\frac{2!}{4!}+\binom43\frac{1!}{4!}-\binom44\frac{0!}{4!}=1-\frac12+\frac16-\frac1{24}=\frac{15}{24}$$
          $$P(\text{1 本も正しくない})=1-\frac{15}{24}=\frac{9}{24}=«ans»$$
          （実際、4 本の完全順列は 9 通りある。）

          **答え** $«ans»$（$= «ans_frac»$）

          **間違えやすい点** 各バイアルが正しく貼られる事象は独立ではない（1 本目が正しければ残りの貼り方が変わる）ので、$(3/4)^4=«w_ind»$ は誤り。
          $e^{-1}\approx«w_e»$ は本数が多いときの極限で、4 本では正確でない。ちょうど 1 本正しい確率は $4\times2/24=«w_one»$。

  - id: s25p05
    title: 2種類の培地による汚染の検出
    context: |
      ある無菌製剤工場で、新しい培地 A と従来の培地 B の汚染の検出率を比べるため、同じ作業区域から無作為に採った試料をそれぞれの培地で培養した。

      | 培地 | 培養した枚数 | 汚染を検出した枚数 |
      |---|---|---|
      | A | «nA» | «xA» |
      | B | «nB» | «xB» |
    items:
      - id: s25p05a
        chapter: 12
        terms: [two-sample-proportion-test, proportion-test]
        topic: 2つの培地の汚染検出率の差をプールした比率を使う2標本比率のz検定で調べる
        level: 基本
        definition: false
        type: numeric
        question: |
          検出率が等しいという帰無仮説のもとで、2 群をプールした比率を使う 2 標本比率の $z$ 検定を行う（連続修正は行わない）。
          検定統計量 $z=(\hat p_A-\hat p_B)/\mathrm{SE}$ の値を求めよ。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 帰無仮説 $p_A=p_B$ のもとでは共通の比率をプールして推定し、それを使って差の標準誤差を作る。

          **途中式** $\hat p_A=«xA»/«nA»=«pA»$、$\hat p_B=«xB»/«nB»=«pB»$、プールした比率 $\hat p=«xs»/«ns»=«pp»$。
          $$\mathrm{SE}=\sqrt{\hat p(1-\hat p)\left(\frac{1}{«nA»}+\frac{1}{«nB»}\right)}=\sqrt{«pp»\times«qq»\times«inv»}=«se»$$
          $$z=\frac{«pA»-«pB»}{«se»}=\frac{«diff»}{«se»}\approx«z_s»$$

          **答え** $«z_s»$

          **間違えやすい点** 帰無仮説のもとでの検定では、各群の比率を別々に使う標準誤差（$\sqrt{\hat p_A(1-\hat p_A)/n_A+\hat p_B(1-\hat p_B)/n_B}=«se_u»$、$z=«z_u»$）ではなく、プールした比率を使う。
          別々の標準誤差は、差の信頼区間（ワルド型）を作るときに使う。

      - id: s25p05b
        chapter: 28
        terms: [odds-ratio-interval, two-by-two-table]
        topic: 2つの培地の汚染の2×2表からオッズ比の95%信頼区間をウルフの対数法で求める
        level: 標準
        definition: false
        type: choice
        question: |
          培地 A の B に対する汚染検出のオッズ比の 95% 信頼区間を、対数オッズ比に正規近似を使うウルフの方法で求める。最も近いものはどれか。
          オッズ比の対数は $«lor»$ としてよい。また、次の $e^x$ の値を使え（$x$ は小数第 3 位に丸めて使う）。

          | $x$ | 0.068 | 0.091 | 0.196 | 1.533 | 1.637 | 1.661 |
          |---|---|---|---|---|---|---|
          | $e^x$ | «e068» | «e091» | «e196» | «e1533» | «e1637» | «e1661» |
        choices:
          - '$(«nx_lo»,\ «nx_hi»)$'
          - '$(«ci_lo»,\ «ci_hi»)$'
          - '$(«cac_lo»,\ «cac_hi»)$'
          - '$(«c90_lo»,\ «c90_hi»)$'
          - '$(«raw_lo»,\ «raw_hi»)$'
        answer: 1
        distractors:
          - 対数オッズ比の区間を指数変換し忘れた
          - 正解
          - 標準誤差を √(1/a + 1/c) とし、汚染なしのセルの項を落とした
          - 95% ではなく 90% の点 1.645 を使った
          - 対数尺度の標準誤差をオッズ比そのものに使い、OR ± 1.96 SE とした
        explanation: |
          **方針** 2×2 表のセルを $a=«a»$（A・汚染）、$b=«b»$（A・汚染なし）、$c=«c»$（B・汚染）、$d=«d»$（B・汚染なし）とする。
          $\ln\widehat{OR}$ の標準誤差は $\sqrt{1/a+1/b+1/c+1/d}$。対数尺度で区間を作り、指数変換して戻す。

          **途中式** $\widehat{OR}=\dfrac{ad}{bc}=\dfrac{«a»\times«d»}{«b»\times«c»}=«or»$、$\ln\widehat{OR}=«lor»$。
          $$\mathrm{SE}=\sqrt{\frac1{«a»}+\frac1{«b»}+\frac1{«c»}+\frac1{«d»}}=\sqrt{«ia»+«ib»+«ic»+«id»}=\sqrt{«v5»}=«se_l»$$
          $$«lor»\pm1.96\times«se_l»=«lor»\pm«half»=(«lo»,\ «hi»)$$
          指数変換して $(e^{0.068},\ e^{1.661})=(«e068»,\ «e1661»)$。

          **答え** $(«ci_lo»,\ «ci_hi»)$。区間が 1 を含まないので、A のほうが汚染を検出しやすいといえる。

          **間違えやすい点** 指数変換し忘れると $(«nx_lo»,\ «nx_hi»)$ になる。分散には 4 つのセルすべての逆数が入る（$1/a+1/c$ だけでは $(«cac_lo»,\ «cac_hi»)$）。
          オッズ比は対数尺度で正規分布に近づくので、もとの尺度で $«or»\pm1.96\times«se_l»$ とする $(«raw_lo»,\ «raw_hi»)$ は誤り。正しい区間は点推定値 $«or»$ に対して非対称になる。

      - id: s25p05c
        chapter: 31
        terms: [gamma-poisson-model, predictive-distribution, conjugate-prior]
        topic: 落下菌のコロニー数のガンマ・ポアソンモデルで翌日のプレートにコロニーが出ない事後予測確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          培地 A を使った清浄区域の環境モニタリングでは、毎日 1 枚の落下菌プレートを置く。1 枚あたりのコロニー数は、$\lambda$ が与えられたとき独立に平均 $\lambda$ のポアソン分布に従うとする。
          $\lambda$ の事前分布を形状 «al»、**レート** «be» のガンマ分布（密度 $\propto\lambda^{«al»-1}e^{-«be»\lambda}$、平均 «pmean0»）とする。
          «days» 日間のコロニー数の合計は «ysum» 個だった。翌日のプレートでコロニーが 0 個である事後予測確率に最も近いものはどれか。
          必要なら $e^{-0.556}=«e0556»$、$e^{-0.6}=«e06»$ を使え。
        choices:
          - '$«w_noup»$'
          - '$«w_mle»$'
          - '$«w_plug»$'
          - '$«pred»$'
          - '$«w_prior»$'
        answer: 3
        distractors:
          - 事後分布の形状だけ更新し、レートに観測日数を足し忘れた
          - 事前分布を無視し、最尤推定値 3/5 を e^{−λ} に代入した
          - 事後平均 5/9 を e^{−λ} に代入し、λ の不確かさを無視した
          - 正解
          - データで更新せず事前予測確率を答えた
        explanation: |
          **方針** ガンマ分布はポアソン分布の共役事前分布で、事後分布は形状 $\alpha+\sum y_i$、レート $\beta+n$ のガンマ分布。事後予測確率は $P(Y=0\mid\lambda)=e^{-\lambda}$ を事後分布で平均して求める。

          **途中式** 事後分布は形状 $«al»+«ysum»=«ap»$、レート $«be»+«days»=«bp»$ のガンマ分布。
          $$P(Y=0\mid\text{データ})=\int_0^\infty e^{-\lambda}\,\frac{«bp»^{«ap»}}{\Gamma(«ap»)}\lambda^{«ap»-1}e^{-«bp»\lambda}\,d\lambda=\frac{«bp»^{«ap»}}{(«bp»+1)^{«ap»}}=\left(\frac{«bp»}{«bp1»}\right)^{«ap»}=«pratio»^{«ap»}=«pred5»$$
          （事後予測分布は負の二項分布になり、その 0 の確率である。）

          **答え** $«pred»$

          **間違えやすい点** 事後平均 $«ap»/«bp»\approx0.556$ を代入した $e^{-0.556}=«w_plug»$ は、$\lambda$ の不確かさを無視している。$e^{-\lambda}$ は下に凸なので、平均を代入した値は平均した値より小さい（イェンセンの不等式）。
          レートに日数を足し忘れると $(«be»/5)^{«ap»}=«w_noup»$、更新しないと $(«be»/5)^{«al»}=«w_prior»$ になる。

