    items:
      - id: s25p06a
        chapter: 9
        terms: [ci-two-sample-mean-difference, pooled-variance, confidence-interval]
        topic: 2つの製造ロットの含量の母平均の差の95%信頼区間の下限を等分散を仮定したプールt区間で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          2 ロットの含量はそれぞれ正規分布に従い、母分散は等しいとする。母平均の差 $\mu_A-\mu_B$ の 95% 信頼区間の**下限**を求めよ。
          必要なら、$t$ 分布の上側 2.5% 点 $t_{16}(0.025)=«t16»$、$t_{18}(0.025)=«t18»$ と、標準正規分布の上側 2.5% 点 «z» を使え。
        answer: «lo»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 2 群の平方和を合わせたプールした分散 $s_p^2$ を使い、区間 $(\bar x_A-\bar x_B)\pm t_{n_A+n_B-2}(0.025)\sqrt{s_p^2(1/n_A+1/n_B)}$ を作る。

          **途中式**
          $$s_p^2=\frac{(«n1»-1)\times«s1»^2+(«n2»-1)\times«s2»^2}{«n1»+«n2»-2}=\frac{«ss1»+«ss2»}{«df»}=«sp2»$$
          $$\mathrm{SE}=\sqrt{«sp2»\times\left(\frac1{«n1»}+\frac1{«n2»}\right)}=\sqrt{«sp2»\times«inv»}=«se»$$
          自由度は $«n1»+«n2»-2=«df»$ なので、
          $$\text{下限}=«diff»-«t16»\times«se»=«diff»-«half»=«lo4»$$

          **答え** $«lo»$（上限は約 $«hi»$）。区間は 0 を含まないので、ロット A の平均含量のほうが高いといえる。

          **間違えやすい点** 自由度を $n_A+n_B=«df2»$ として $t_{18}$ を使うと $«w18»$、正規分布の 1.960 を使うと $«wz»$ になる。プールした分散の分母は $n_A+n_B-2$。

  - id: s25p07
    title: 自動分注機の作動遅延
    context: |
      ある研究所の自動分注機では、分注の指令から吐出が始まるまでの遅延時間（秒）が区間 $(0,\theta)$ 上の一様分布に従う。仕様では $\theta=«th0»$ である。
      遅延が仕様より長くなっていないかを調べるため、独立に «n» 回の遅延 $X_1,\ldots,X_{«n»}$ を測り、
      帰無仮説 $H_0:\theta=«th0»$、対立仮説 $H_1:\theta>«th0»$ を、最大値 $M=\max_i X_i$ が $c$ を超えたら $H_0$ を棄却する検定で調べる。$c$ は有意水準がちょうど 5% になるように決める。
    items:
      - id: s25p07a
        chapter: 10
        terms: [power-function, rejection-region, order-statistics]
        topic: 一様分布の上端の片側検定で標本最大値による棄却域の境界と真の上端での検出力を最大値の分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          真の $\theta$ が «th1» のとき、この検定の検出力に最も近いものはどれか。必要なら $0.95^{1/5}=«root»$ を使え。
        choices:
          - '$«w_one»$'
          - '$«w_beta»$'
          - '$«w_noa»$'
          - '$«pw»$'
          - '$«w_noroot»$'
        answer: 3
        distractors:
          - 最大値ではなく 1 回の観測が c を超える確率 1 − c/θ を計算した
          - 検出力ではなく第 2 種の過誤の確率を答えた
          - 棄却点を c = θ0 = 2.0 として 1 − (2.0/2.5)^5 とした
          - 正解
          - 棄却点を 5 乗根をとらずに c = 2.0 × 0.95 = 1.90 とした
        explanation: |
          **方針** 独立な一様分布の最大値の分布関数は $P(M\le m)=(m/\theta)^{«n»}$（$0\le m\le\theta$）。これで棄却点 $c$ を決め、$\theta=«th1»$ のもとで $P(M>c)$ を計算する。

          **途中式** $H_0$ のもとで $P(M>c)=1-(c/«th0»)^{«n»}=0.05$ より
          $$c=«th0»\times0.95^{1/5}=«th0»\times«root»=«cc»$$
          $\theta=«th1»$ のもとでの検出力は
          $$1-\left(\frac{c}{«th1»}\right)^{«n»}=1-0.95\times\left(\frac{«th0»}{«th1»}\right)^{«n»}=1-0.95\times«ratio»^{«n»}=1-0.95\times«rpow»=1-«beta»=«pw4»$$

          **答え** $«pw»$

          **間違えやすい点** $(c/θ)^5$ の計算では $c^5=«th0»^5\times0.95$ となるので、$0.95^{1/5}$ を 5 乗に戻せば 0.95 になる。
          棄却点を $«th0»\times0.95=«c_noroot»$ とすると有意水準が 5% にならず、検出力も $«w_noroot»$ と過大になる。$«w_beta»$ は第 2 種の過誤の確率。

  - id: s25p08
    title: 研究室のインキュベーターの運用
    context: |
      ある研究室には CO₂ インキュベーターが 3 台ある。毎朝の使用中の台数 $N_t\in\{0,1,2,3\}$ は、次の推移確率をもつマルコフ連鎖とする（1 日に増減するのは 1 台まで）。

      | 今日の台数 $k$ | 0 | 1 | 2 | 3 |
      |---|---|---|---|---|
      | 翌日 $k+1$ 台になる確率 | «u0» | «u1» | «u2» | — |
      | 翌日 $k-1$ 台になる確率 | — | «d1» | «d2» | «d3» |
      | 翌日も $k$ 台の確率 | «s0» | «s1» | «s2» | «s3» |
    items:
      - id: s25p08a
        chapter: 14
        terms: [detailed-balance, stationary-distribution, markov-chain]
        topic: インキュベーターの使用台数の出生死滅型マルコフ連鎖で詳細つり合いの式から定常分布を求め全台使用中の日の割合を出す
        level: 応用
        definition: false
        type: choice
        question: |
          長い期間で見たとき、3 台すべてが使用中である日の割合（定常分布の $\pi_3$）に最も近いものはどれか。
        choices:
          - '$«ans»$'
          - '$«w_unif»$'
          - '$«w_rev»$'
          - '$«w_two»$'
          - '$«w_rate»$'
        answer: 0
        distractors:
          - 正解
          - 4 つの状態が等確率になると考えた
          - 詳細つり合いの比を逆（下がる確率 ÷ 上がる確率）にした
          - 最も確率の大きい状態 2 の確率 π2 と取り違えた
          - 平均使用台数を 3 で割った稼働率を答えた
        explanation: |
          **方針** 隣の状態にしか移らない（出生死滅型の）既約な連鎖では、定常分布が詳細つり合い $\pi_k\,P(k\to k+1)=\pi_{k+1}\,P(k+1\to k)$ を満たす。これで $\pi_1,\pi_2,\pi_3$ を $\pi_0$ で表し、合計を 1 にする。

          **途中式**
          $$\pi_1=\pi_0\times\frac{«u0»}{«d1»}=«w1»\,\pi_0,\quad \pi_2=\pi_1\times\frac{«u1»}{«d2»}=«w2»\,\pi_0,\quad \pi_3=\pi_2\times\frac{«u2»}{«d3»}=«w3»\,\pi_0$$
          6 倍して整数比にすると $\pi_0:\pi_1:\pi_2:\pi_3=«i0»:«i1»:«i2»:«i3»$、合計 «isum»。よって
          $$\pi_3=\frac{«i3»}{«isum»}=«ans4»\cdots$$

          **答え** $«ans»$

          **間違えやすい点** 比を逆にして $\pi_{k+1}=\pi_k\times P(k+1\to k)/P(k\to k+1)$ とすると $«w_rev»$ になる。とどまる確率は詳細つり合いの式には入らない。
          平均使用台数 $(1\times«i1»+2\times«i2»+3\times«i3»)/«isum»=«mean_use»$ を 3 で割った $«w_rate»$ は 1 台あたりの稼働率で、全台使用中の割合ではない。

