set: 25
title: 模擬試験 第25回
minutes: 90
problems:
  - id: s25p01
    title: 限界希釈法による細胞のクローン化
    context: |
      ある研究所では、抗体を作る細胞株を 1 個の細胞から増やす（クローン化する）ため、細胞懸濁液を薄めて 96 ウェルプレートの各ウェルにまく（限界希釈法）。
      各ウェルにまかれる細胞の数 $X$ は、ウェルごとに独立に平均 $\lambda$ のポアソン分布に従うとする。
    items:
      - id: s25p01a
        chapter: 5
        terms: [poisson-distribution, conditional-probability]
        topic: 限界希釈で増殖のなかったウェルの割合からポアソン平均を推定し増殖したウェルが単一細胞由来である条件付き確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          細胞が 1 個以上入ったウェルでは必ず増殖が見られ、0 個のウェルでは増殖しないものとする。
          1 枚のプレート（«W» ウェル）を培養したところ、増殖が見られなかったウェルは «W0» 個だった。
          増殖が見られなかったウェルの割合を $e^{-\lambda}$ に等しいとおいて $\lambda$ を推定し（$\ln(«W0»/«W»)=«lnr»$ を使え）、
          その推定値のもとで、増殖が見られたウェルが 1 個の細胞に由来する確率 $P(X=1\mid X\ge 1)$ を求めよ。
        answer: «p1c»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $P(X=0)=e^{-\lambda}$ を増殖のなかったウェルの割合に合わせて $\lambda$ を推定する。求める確率は「1 個以上」という条件のもとでの条件付き確率なので、$P(X=1)$ を $P(X\ge1)=1-e^{-\lambda}$ で割る。

          **途中式** $e^{-\hat\lambda}=«W0»/«W»$ より $\hat\lambda=-\ln(«W0»/«W»)=«lam»$。また $1-e^{-\hat\lambda}=«W1»/«W»$。
          $$P(X=1\mid X\ge1)=\frac{\hat\lambda e^{-\hat\lambda}}{1-e^{-\hat\lambda}}=\frac{«lam»\times«W0»/«W»}{«W1»/«W»}=\frac{«lam»\times«W0»}{«W1»}=«p1c4»\cdots$$

          **答え** $«p1c_s»$

          **間違えやすい点** 条件をつけ忘れて $P(X=1)=\hat\lambda e^{-\hat\lambda}=«lam»\times«W0»/«W»=«lamfrac»$ とすると、増殖しなかったウェルまで分母に入れたことになる。
          $e^{-\hat\lambda}$ は $«W0»/«W»$ そのものなので、指数関数の値を別に求める必要はない。増殖したウェルのうち約 $1-«p1c_s»$ は 2 個以上の細胞に由来し、クローンとは言えない。

      - id: s25p01b
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, score-function]
        topic: 0が観測されないゼロ切断ポアソン分布で平均の最尤推定値を尤度方程式から表を使って求める
        level: 応用
        definition: false
        type: choice
        question: |
          別の条件で、画像解析装置を使い、細胞を 1 個以上含むウェルだけについて、まかれた細胞の数を数えた（細胞が 0 個のウェルは記録されない）。«n» ウェルの記録は次のとおりだった。

          | 細胞数 | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | ウェル数 | «n1» | «n2» | «n3» | «n4» |

          記録された細胞数は、平均 $\lambda$ のポアソン分布を「1 個以上」で条件づけた分布（ゼロ切断ポアソン分布）
          $$P(X=x)=\frac{e^{-\lambda}\lambda^{x}}{x!\,(1-e^{-\lambda})}\qquad(x=1,2,\ldots)$$
          に独立に従うとする。$\lambda$ の最尤推定値に最も近いものはどれか。必要なら次の表を使え。

          | $\lambda$ | 0.8 | 0.9 | 1.0 | 1.1 | 1.2 |
          |---|---|---|---|---|---|
          | $\lambda/(1-e^{-\lambda})$ | «g08» | «g09» | «g10» | «g11» | «g12» |
        choices:
          - '$«c_shift»$'
          - '$«c_ok»$'
          - '$«c_iter»$'
          - '$«c_naive»$'
          - '$«c_inv»$'
        answer: 1
        distractors:
          - 1 から始まるずらしたポアソン分布とみて、標本平均から 1 を引いた
          - 正解
          - 尤度方程式 λ = x̄(1 − e^{−λ}) の反復を λ = x̄ から 1 回だけ行って止めた
          - 0 が除かれていることを無視し、標本平均をそのまま λ の推定値にした
          - 尤度方程式を λ(1 − e^{−λ}) = x̄ と分母と分子を取り違えて解いた
        explanation: |
          **方針** 対数尤度を $\lambda$ で微分して 0 とおく（尤度方程式）。解は式で書けないので、与えられた表から読む。

          **途中式** 観測値の合計を $\sum x_i$、個数を $n$ とすると、$\lambda$ に関係する部分の対数尤度は
          $$\ell(\lambda)=\Big(\sum x_i\Big)\ln\lambda-n\lambda-n\ln(1-e^{-\lambda})$$
          $$\ell'(\lambda)=\frac{\sum x_i}{\lambda}-n-\frac{n e^{-\lambda}}{1-e^{-\lambda}}=\frac{\sum x_i}{\lambda}-\frac{n}{1-e^{-\lambda}}=0
          \quad\Longleftrightarrow\quad \frac{\lambda}{1-e^{-\lambda}}=\bar x$$
          ここで $\sum x_i=1\times«n1»+2\times«n2»+3\times«n3»+4\times«n4»=«tot»$、$\bar x=«tot»/«n»=«xbar»$。
          左辺は $\lambda$ について増加関数で、表では $\lambda=1.0$ のとき $«g10»$ と $«xbar»$ にほぼ一致する（$\lambda=0.9$ では $«g09»$ で小さすぎる）。よって最尤推定値はほぼ $«c_ok»$。

          **答え** $«c_ok»$

          **間違えやすい点** 0 が記録されないぶん観測値は大きめに偏るので、標本平均 $«c_naive»$ をそのまま使うと $\lambda$ を過大に推定する。
          切断ポアソン分布は「1 から始まるポアソン分布」（$X-1$ がポアソン分布）とは別物で、$\bar x-1=«c_shift»$ も誤り。
          方程式を $\lambda(1-e^{-\lambda})=\bar x$ と取り違えると $«c_inv»$ になる。

  - id: s25p02
    title: 電子天秤の測定誤差
    context: |
      ある品質試験室で、医薬品原料の秤量に使う電子天秤の測定誤差を調べた。
    items:
      - id: s25p02a
        chapter: 7
        terms: [central-limit-theorem, lindeberg-levy-clt]
        topic: 一様分布に従う丸め誤差を多数足した合計誤差が許容幅を超える確率を中心極限定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          この天秤は秤量値を «h» mg 単位に丸めて表示する。丸めによる誤差（表示値 − 真の値）は、1 回ごとに独立に区間 $(-«hh»,\,«hh»)$（mg）上の一様分布に従うとする。
          ある標準溶液の調製で «mm» 回の秤量値を合計したとき、合計に含まれる丸め誤差の絶対値が «thr» mg を超える確率を、中心極限定理による正規近似で求めよ。
          必要なら標準正規分布の分布関数 $\Phi(z)$ の次の値を使え。

          | $z$ | 0.50 | 1.00 | 2.50 |
          |---|---|---|---|
          | $\Phi(z)$ | «phi050» | «phi100» | «phi250» |
        answer: «ans_a»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 1 回の丸め誤差の平均と分散を一様分布の公式で求め、«mm» 個の和の平均と分散を出す。和は中心極限定理により近似的に正規分布に従う。

          **途中式** 区間の幅は $«h»$ なので、1 回の誤差 $U_i$ は $E[U_i]=0$、$V[U_i]=\dfrac{«h»^2}{12}=\dfrac{0.01}{12}\approx«var1»$。
          合計 $S=\sum_{i=1}^{«mm»}U_i$ は $E[S]=0$、$V[S]=«mm»\times\dfrac{0.01}{12}=«varS»$、標準偏差 $\sqrt{«varS»}=«sdS»$。
          $$P(|S|>«thr»)\approx P\left(|Z|>\frac{«thr»}{«sdS»}\right)=P(|Z|>«z»)=2\{1-\Phi(«z»)\}=2\times«tail»=«ans_a_s»$$

          **答え** $«ans_a_s»$

          **間違えやすい点** 一様分布 $(-a,a)$ の分散は $(2a)^2/12=a^2/3$ で、幅の半分 $«hh»$ を幅とみて $«hh»^2/12$ とすると標準偏差が半分になり、$z=«z_half»$ で $«w_half»$ になる。
          「絶対値が超える」は両側なので、片側だけの $«one_side»$ では足りない。

      - id: s25p02b
        chapter: 3
        terms: [weighted-geometric-harmonic-mean, expectation-variance-properties, moments]
        topic: 処理速度の違う2台の天秤で同じ件数ずつ秤量したときの全体の平均処理速度を調和平均で求め算術平均と比べる
        level: 基本
        definition: false
        type: choice
        question: |
          試験室には 2 台の天秤があり、1 時間あたりの秤量件数は 1 台目が «nb_v1» 件、2 台目が «nb_v2» 件のペースである。ある日の秤量を、2 台で**同じ件数ずつ**分担して順に処理した。
          この日の秤量全体を通した 1 台あたりの平均処理速度（総件数 ÷ 2 台の作業時間の合計、件/時）に最も近いものはどれか。
        choices:
          - '$«nb_hm»$'
          - '$«nb_am»$'
          - '$«nb_gm»$'
          - '$«nb_w_inv»$'
          - '$«nb_w_sum»$'
        answer: 0
        distractors:
          - 正解
          - 2 つの速度を単純に平均した（同じ時間ずつ働いた場合の値）
          - 幾何平均を使った
          - 1 件あたりの時間（分）の平均と取り違えた
          - 2 台の速度を足した（2 台を同時に使ったときの全体の速度）
        explanation: |
          **方針** 同じ件数 $m$ ずつ処理すると、作業時間は $m/«nb_v1»$ と $m/«nb_v2»$ 時間。平均処理速度は「総件数 ÷ 総時間」なので、速度の調和平均になる。

          **途中式**
          $$\frac{2m}{m/«nb_v1»+m/«nb_v2»}=\frac{2}{1/«nb_v1»+1/«nb_v2»}=\frac{2}{«nb_inv1»+«nb_inv2»}=«nb_hm4»$$

          **答え** $«nb_hm»$ 件/時

          **間違えやすい点** 算術平均 «nb_am» になるのは、2 台が**同じ時間ずつ**働いた場合である。同じ件数ずつなら、遅い天秤に長い時間がかかるので、平均は遅い方に引っ張られる。
          一般に、正の値では 調和平均 ≤ 幾何平均 ≤ 算術平均（«nb_hm» ≤ «nb_gm» ≤ «nb_am»）が成り立つ。

      - id: s25p02c
        chapter: 11
        terms: [fisher-z-transformation, test-correlation-coefficient, one-sided-two-sided-test]
        topic: 2台の天秤の読みの相関係数が基準値0.90より小さいかをフィッシャーのz変換による1標本の検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          2 台の天秤で同じ «nc_n» 個の試料を量ったところ、読みの標本相関係数は $r=«nc_r»$ だった（読みは 2 変量正規分布に従うとする）。
          社内の基準では母相関係数 $\rho$ が «nc_r0» 以上であることが望ましい。帰無仮説 $H_0:\rho=«nc_r0»$ を対立仮説 $H_1:\rho<«nc_r0»$ に対して、フィッシャーの $z$ 変換を使って有意水準 5% で検定する。
          必要なら $\tanh^{-1}«nc_r»=«nc_z1»$、$\tanh^{-1}«nc_r0»=«nc_z0»$ と、標準正規分布の上側 5% 点 1.645、上側 2.5% 点 1.96 を使え。正しい記述はどれか。
        choices:
          - '統計量は $«nc_zstat»$ で、$-1.645$ を下回るので帰無仮説を棄却し、相関は基準より小さいと判断する'
          - '統計量は $«nc_zstat»$ だが、$-1.96$ を下回らないので帰無仮説は棄却されない'
          - '統計量は $«nc_w_n»$（$\sqrt{n}$ を掛けた）で、$-1.645$ を下回るので棄却する'
          - '統計量は $«nc_w_wald»$（$r$ の差を $(1-\rho_0^2)/\sqrt n$ で割った）で、$-1.645$ を下回るので棄却する'
          - '相関係数の検定は帰無仮説 $\rho=0$ についてしかできないので、この検定は行えない'
        answer: 0
        distractors:
          - 正解
          - 片側の対立仮説なのに両側の点 1.96 と比べた
          - z の分散を 1/(n−3) ではなく 1/n とした
          - z 変換をせず r の尺度で近似した（ρ0 が 1 に近いと r の分布は大きく歪む）
          - z 変換を使えば ρ0≠0 の検定もできる（t 統計量 r√(n−2)/√(1−r²) が使えるのは ρ0=0 のとき）
        explanation: |
          **方針** $z=\tanh^{-1}r$ は近似的に平均 $\tanh^{-1}\rho$、分散 $1/(n-3)$ の正規分布に従う。帰無仮説の値 $\rho_0$ で標準化して、下側の片側検定を行う。

          **途中式**
          $$Z=(\tanh^{-1}r-\tanh^{-1}\rho_0)\sqrt{n-3}=(«nc_z1»-«nc_z0»)\times\sqrt{«nc_nm3»}=«nc_d»\times«nc_rt»=«nc_zstat4»$$
          $-1.645$ より小さいので、有意水準 5% で棄却する。

          **答え** 統計量 $«nc_zstat»$ で棄却し、相関は基準より小さいと判断する

          **間違えやすい点** $\rho=0$ の検定に使う $t$ 統計量は、$\rho_0\ne0$ の検定には使えない。$z$ 変換はどの $\rho_0$ にも使える。
          対立仮説が片側（$\rho<\rho_0$）なので、棄却点は $-1.645$。両側の 1.96 と比べると結論が逆になる。
          $z$ 変換は近似で、$\rho_0$ が 1 に近く $n$ が小さいと少し保守的になる（$n=28$、$\rho=0.90$ では、帰無仮説のもとで $-1.645$ を下回る確率は約 4%）。

  - id: s25p03
    title: 製剤の安定性モニタリング
    context: |
      ある製薬会社では、出荷した錠剤のロットについて、有効成分の含量が規格を下回っていないかを保管期間中に調べている。
    items:
      - id: s25p03a
        chapter: 2
        terms: [joint-probability-density-function, marginal-probability-density-function, cumulative-distribution-function]
        topic: 指数分布に従う規格外になる時刻と一様分布に従う抜き取り時期の同時密度を積分して抜き取り時点ですでに規格外である確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          あるロットの含量が規格を下回るまでの時間 $X$（月）は、レート «lam»（平均 «mean» か月）の指数分布に従う。
          各ロットは、出荷後 0〜«c» か月の間の一様分布に従う時期 $Y$ に 1 回だけ抜き取られて検査される。$X$ と $Y$ は独立とする。
          抜き取り検査の時点ですでに規格を下回っている確率 $P(X\le Y)$ に最も近いものはどれか。必要なら $e^{-1.2}=«e12»$、$e^{-2.4}=«e24»$ を使え。
        choices:
          - '$«w_comp»$'
          - '$«w_exp»$'
          - '$«ans»$'
          - '$«w_mean»$'
          - '$«w_end»$'
        answer: 2
        distractors:
          - 余事象 P(X > Y) を答えた
          - 一様分布の Y を平均 12 の指数分布と取り違え、競合する指数分布の公式 λ/(λ+μ) を使った
          - 正解
          - Y を平均の 12 か月に固定して 1 − e^{−1.2} とした
          - Y を最後の 24 か月に固定して 1 − e^{−2.4} とした
        explanation: |
          **方針** 同時密度 $f(x,y)=0.1e^{-0.1x}\cdot\dfrac{1}{«c»}$（$x>0$、$0<y<«c»$）を領域 $x\le y$ で積分する。先に $x$ で積分すると、$Y=y$ のもとでの条件付き確率 $P(X\le y)=1-e^{-0.1y}$ を $y$ の周辺密度で平均する形になる。

          **途中式**
          $$P(X\le Y)=\int_0^{«c»}\frac{1}{«c»}\left(1-e^{-0.1y}\right)dy=1-\frac{1}{«c»}\cdot\frac{1-e^{-«lc»}}{0.1}=1-\frac{1-e^{-«lc»}}{«lc»}$$
          $$=1-\frac{«one_e»}{«lc»}=1-«frac»=«ans4»$$

          **答え** $«ans»$

          **間違えやすい点** $Y$ を平均の 12 か月に置き換えて $1-e^{-1.2}=«w_mean»$ とするのは誤り。$1-e^{-0.1y}$ は $y$ について直線ではない（上に凸）ので、平均を代入した値は平均した値より大きくなる。
          $Y$ が一様分布である点を無視して競合する指数分布の公式を使うと $«w_exp»$ になる。

      - id: s25p03b
        chapter: 4
        terms: [change-of-variables, log-transformation, expectation-variance-properties]
        topic: 対数が一様分布に従う増加倍率の密度を変数変換で求め期待値を計算し対数の期待値から戻した値と比べる
        level: 基本
        definition: false
        type: choice
        question: |
          保管中に生じる分解生成物の量は、ロットによって初期値の $Y=10^{U}$ 倍になり、$U$ はロットごとに区間 $(0,1)$ の一様分布に従うとする。
          $Y$ の期待値 $E[Y]$ と、$10^{E[U]}$ の組として正しいものはどれか。必要なら $\ln10=2.3026$、$\sqrt{10}=3.1623$ を使え。
        choices:
          - '$E[Y]=«nd_ey»$、$10^{E[U]}=«nd_g»$'
          - '$E[Y]=«nd_g»$、$10^{E[U]}=«nd_g»$'
          - '$E[Y]=«nd_w_mid»$、$10^{E[U]}=«nd_g»$'
          - '$E[Y]=«nd_w_ln»$、$10^{E[U]}=«nd_g»$'
          - '$E[Y]=«nd_ey»$、$10^{E[U]}=«nd_ey»$'
        answer: 0
        distractors:
          - 正解
          - 期待値と変換の順序を入れ替えてよいと考えた（E[10^U]=10^{E[U]} としたのは誤り）
          - Y も区間 (1,10) の一様分布だと考えて中点をとった
          - 密度の係数 1/(y ln10) の ln10 を落とした
          - 10^{E[U]} も E[Y] と等しいと考えた
        explanation: |
          **方針** $y=10^u$ は単調増加なので、$U$ の密度 1 を変数変換して $Y$ の密度を求める。$u=\log_{10}y=\ln y/\ln10$、$du/dy=1/(y\ln10)$。

          **途中式** $Y$ の密度は $f_Y(y)=\dfrac{1}{y\ln10}$（$1<y<10$）。
          $$E[Y]=\int_1^{10}y\cdot\frac{1}{y\ln10}\,dy=\frac{10-1}{\ln10}=\frac{9}{2.3026}=«nd_ey4»$$
          一方 $E[U]=0.5$ なので $10^{E[U]}=\sqrt{10}=«nd_g»$。

          **答え** $E[Y]=«nd_ey»$、$10^{E[U]}=«nd_g»$

          **間違えやすい点** $10^u$ は下に凸なので、イェンセンの不等式から $E[10^U]\ge10^{E[U]}$。$10^{E[U]}$ は $Y$ の中央値（幾何平均）にあたり、平均より小さい。
          $Y$ は $(1,10)$ の一様分布ではなく、小さい値の方に密度が大きい。

  - id: s25p04
    title: はがれたバイアルのラベル
    context: |
      ある微生物試験室で、«k» 種類の標準菌株の凍結保存バイアルのラベルが輸送中にすべてはがれてしまった。
      担当者は中身を確かめずに、«k» 枚のラベルを «k» 本のバイアルに 1 枚ずつ無作為に貼り直した（«k»! = «kf» 通りの貼り方が等確率）。
    items:
      - id: s25p04a
        chapter: 1
        terms: [inclusion-exclusion-principle, conditional-probability]
        topic: はがれた4本のバイアルのラベルを無作為に貼り直したとき1本も正しく貼られない確率を包除原理（完全順列）で求める
        level: 標準
        definition: false
        type: choice
        question: |
          1 本も正しいラベルが貼られていない確率に最も近いものはどれか。
        choices:
          - '$«w_ind»$'
          - '$«w_one»$'
          - '$«w_e»$'
          - '$«ans»$'
          - '$«w_atl»$'
        answer: 3
        distractors:
          - 各バイアルが正しく貼られる事象を独立とみなし (3/4)^4 とした
          - ちょうど 1 本だけ正しく貼られる確率を答えた
          - 本数が多いときの極限 e^{−1} で近似した
          - 正解
          - 少なくとも 1 本が正しく貼られる確率（余事象）を答えた
        explanation: |
          **方針** $A_i$ を「$i$ 本目に正しいラベルが貼られる」事象とし、包除原理で $P(A_1\cup\cdots\cup A_4)$ を求めて 1 から引く。

          **途中式** 決められた $j$ 本が正しく貼られる貼り方は残りの $(4-j)!$ 通りなので、$P(A_{i_1}\cap\cdots\cap A_{i_j})=\dfrac{(4-j)!}{4!}$。$j$ 本の選び方は $\binom{4}{j}$ 通りだから
          $$P\Big(\bigcup_i A_i\Big)=\binom41\frac{3!}{4!}-\binom42\frac{2!}{4!}+\binom43\frac{1!}{4!}-\binom44\frac{0!}{4!}=1-\frac12+\frac16-\frac1{24}=\frac{15}{24}$$
          $$P(\text{1 本も正しくない})=1-\frac{15}{24}=\frac{9}{24}=«ans»$$
          （実際、4 本の完全順列は 9 通りある。）

          **答え** $«ans»$（$= «ans_frac»$）

          **間違えやすい点** 各バイアルが正しく貼られる事象は独立ではない（1 本目が正しければ残りの貼り方が変わる）ので、$(3/4)^4=«w_ind»$ は誤り。
          $e^{-1}\approx«w_e»$ は本数が多いときの極限で、4 本では正確でない。ちょうど 1 本正しい確率は $4\times2/24=«w_one»$。

  - id: s25p05
    title: 2種類の培地による汚染の検出
    context: |
      ある無菌製剤工場で、新しい培地 A と従来の培地 B の汚染の検出率を比べるため、同じ作業区域から無作為に採った試料をそれぞれの培地で培養した。

      | 培地 | 汚染を検出 | 検出せず | 計 |
      |---|---|---|---|
      | A | «a» | «b» | «r1» |
      | B | «c» | «d» | «r2» |
      | 計 | «c1» | «c2» | «n» |
    items:
      - id: s25p05a
        chapter: 12
        terms: [g-statistic, independence-test, expected-frequency]
        topic: 培地と汚染の検出の2×2表で尤度比のG統計量を期待度数から求め自由度1のカイ二乗分布で独立性を判定する
        level: 標準
        definition: false
        type: choice
        question: |
          培地と汚染の検出が独立かを、尤度比検定の統計量 $G=2\sum O\ln(O/E)$（$O$ は観測度数、$E$ は独立のもとでの期待度数）で、有意水準 5% で調べる。
          必要なら $\ln(«a»/«e11»)=«l11»$、$\ln(«b»/«e12»)=«l12»$、$\ln(«c»/«e21»)=«l21»$、$\ln(«d»/«e22»)=«l22»$ と、自由度 1 のカイ二乗分布の上側 5% 点 3.841、自由度 2 の上側 5% 点 5.991 を使え。正しい記述はどれか。
        choices:
          - '$G=«G»$ で、自由度 1 の 3.841 を上回るので、独立という帰無仮説を棄却する'
          - '$G=«w_half»$ で、3.841 を下回るので棄却されない'
          - '$G=«G»$ だが、自由度 2 の 5.991 を下回るので棄却されない'
          - '$G=«w_abs»$ で、3.841 を上回るので棄却する'
          - '$G=«G»$ で棄却されるので、培地 A を使うと汚染が増えることが示された'
        answer: 0
        distractors:
          - 正解
          - 2 倍するのを忘れた
          - 2×2 表の自由度を (2−1)(2−1)=1 ではなく 2 とした
          - 対数の項の符号を無視して絶対値で足した
          - 検出率の違いは検出の感度の違いで、汚染そのものを増やすことを示すわけではない（同じ区域の試料）
        explanation: |
          **方針** 期待度数は $E=(\text{行の計})\times(\text{列の計})/n$。$G$ は帰無仮説（独立）のもとで近似的に自由度 $(2-1)(2-1)=1$ のカイ二乗分布に従う。

          **途中式** 期待度数は «e11»、«e12»、«e21»、«e22»。
          $$G=2\{«a»\times(«l11»)+«b»\times(«l12»)+«c»\times(«l21»)+«d»\times(«l22»)\}=«G4»$$

          **答え** $G=«G»$ で棄却する（培地 A の検出率が高い）

          **間違えやすい点** 同じ表でピアソンの $X^2=\sum(O-E)^2/E$ は «X» で、大きな標本ではどちらもほぼ同じ値になる。
          検出率の違いは、同じ区域の試料での「見つけやすさ」の違いを表し、汚染の量の違いではない。
      - id: s25p05b
        chapter: 28
        terms: [phi-coefficient-and-association, two-by-two-table, pearson-chi-square-statistic]
        topic: 培地と汚染の検出の2×2表からファイ係数を求め総数との積の2乗がピアソンのカイ二乗統計量に等しいことを確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          この 2×2 表の連関の強さを、ファイ係数 $\phi=\dfrac{ad-bc}{\sqrt{(a+b)(c+d)(a+c)(b+d)}}$（$a,b,c,d$ は表の 4 つの度数）で表す。$\phi$ と $n\phi^2$ の組として正しいものはどれか。
        choices:
          - '$\phi=«phi»$、$n\phi^2=«nphi2»$（ピアソンの $X^2$ に等しい）'
          - '$\phi=«w_phi2»$、$n\phi^2=«nphi2»$'
          - '$\phi=«phi»$、$n\phi^2=«w_G»$（$G$ 統計量に等しい）'
          - '$\phi=«w_or»$、$n\phi^2=«nphi2»$'
          - '$\phi=«w_neg»$、$n\phi^2=«nphi2»$'
        answer: 0
        distractors:
          - 正解
          - φ を 2 乗した値を答えた
          - nφ² はピアソンの X² に等しく、G 統計量とは（近いが）一致しない
          - オッズ比 ad/(bc) と取り違えた
          - ad−bc の符号を逆にした（行または列の順序を入れ替えた）
        explanation: |
          **方針** 2×2 表では、ファイ係数は 2 つの 2 値変数（0/1）の相関係数に等しく、$X^2=n\phi^2$ が成り立つ。

          **途中式**
          $$\phi=\frac{«a»\times«d»-«b»\times«c»}{\sqrt{«r1»\times«r2»\times«c1»\times«c2»}}=\frac{«num»}{«den»}=«phi4»$$
          $$n\phi^2=«n»\times«phi4»^2=«nphi24»$$

          **答え** $\phi=«phi»$、$n\phi^2=«nphi2»$

          **間違えやすい点** $\phi$ は $-1$ から $1$ の値をとり、符号は表の並べ方で変わる。$|\phi|$ が 0.2 程度でも、$n$ が大きければ $X^2=n\phi^2$ は有意になりうる（連関の強さと有意性は別）。
      - id: s25p05c
        chapter: 31
        terms: [posterior-mean-map, beta-binomial-model, conjugate-prior]
        topic: 汚染率のベータ事前分布と培養結果から事後分布を求め事後平均と事後最頻値（MAP）を最尤推定値と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          別の作業区域で、培地 A の汚染の検出率 $p$ に事前分布 $\mathrm{Beta}(«al»,\ «be»)$ を置いた。この区域から «nn» 枚を培養したところ、«k» 枚で汚染を検出した。
          $p$ の事後平均と事後最頻値（MAP 推定値）の組として正しいものはどれか。
        choices:
          - '事後平均 $«pm»$、MAP $«map»$'
          - '事後平均 $«map»$、MAP $«pm»$'
          - '事後平均 $«pm»$、MAP $«mle»$'
          - '事後平均 $«prior»$、MAP $«map»$'
          - '事後平均 $«w_add»$、MAP $«map»$'
        answer: 0
        distractors:
          - 正解
          - 事後平均と事後最頻値を取り違えた
          - MAP を最尤推定値 k/n とした（一様事前分布のときだけ一致する）
          - 事後平均ではなく事前平均を答えた
          - 事前分布の母数に k と n をそのまま足した（失敗数ではなく試行数を β に足した）
        explanation: |
          **方針** ベータ分布は二項分布の共役事前分布で、事後分布は $\mathrm{Beta}(\alpha+k,\ \beta+n-k)$。$\mathrm{Beta}(a,b)$ の平均は $a/(a+b)$、最頻値は $(a-1)/(a+b-2)$（$a,b>1$）。

          **途中式** 事後分布は $\mathrm{Beta}(«al»+«k»,\ «be»+«nn»-«k»)=\mathrm{Beta}(«A»,\ «B»)$。
          $$\text{事後平均}=\frac{«A»}{«A»+«B»}=«pm4»,\qquad \text{MAP}=\frac{«A»-1}{«A»+«B»-2}=«map4»$$

          **答え** 事後平均 $«pm»$、MAP $«map»$

          **間違えやすい点** 最尤推定値は $k/n=«mle»$、事前平均は «prior» で、事後平均はその間にある（データが増えるほど最尤推定値に近づく）。
          MAP は事後密度の山の位置で、2 乗誤差の損失のもとでの最適な推定値は事後平均、0-1 損失に近いのが MAP である。

  - id: s25p06
    title: 原料の生菌数
    context: |
      ある原料の 9 ロットについて、1 g あたりの生菌数（CFU/g）を測った。生菌数は対数正規分布に従うとみなし、自然対数をとった値 $\ln X$ の標本平均は «lm»（$=\ln100$）、標本標準偏差（不偏分散の平方根）は «ls» だった。
    items:
      - id: s25p06a
        chapter: 9
        terms: [confidence-interval, log-transformation, ci-mean-unknown-variance]
        topic: 対数正規分布に従う生菌数の対数の平均のt区間を指数変換して中央値（幾何平均）の95%信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $\ln X$ の母平均 $\mu$ の 95% 信頼区間を $t$ 分布で作り、指数変換して生菌数の中央値 $e^{\mu}$ の 95% 信頼区間とする。最も近いものはどれか。
          必要なら $t_{0.025}(8)=«t8»$、$t_{0.025}(9)=«t9»$、$e^{-«hw3»}=«em»$、$e^{«hw3»}=«ep»$、$e^{-«hwz»}=«emz»$、$e^{«hwz»}=«epz»$ を使え。
        choices:
          - '$(«lo»,\ «hi»)$ で、生菌数の中央値の区間'
          - '$(«w_s_lo»,\ «w_s_hi»)$ で、生菌数の中央値の区間'
          - '$(«w_z_lo»,\ «w_z_hi»)$ で、生菌数の中央値の区間'
          - '$(«lo»,\ «hi»)$ で、生菌数の算術平均（期待値）の区間'
          - '$(«w_s_lo»,\ «w_s_hi»)$ で、生菌数の算術平均（期待値）の区間'
        answer: 0
        distractors:
          - 正解
          - 半幅を対数の尺度のまま 100 に掛けて左右対称にした
          - σ を推定しているのに標準正規分布の点 1.96 を使った
          - 指数変換した区間は中央値（幾何平均）の区間で、算術平均 e^{μ+σ²/2} の区間ではない
          - 対称にしたうえで算術平均の区間と解釈した
        explanation: |
          **方針** 対数の尺度では正規分布なので $t$ 区間が使える。指数関数は単調なので、$\mu$ の区間の両端を変換すると $e^\mu$ の区間になり、信頼係数は変わらない。対数正規分布で $e^\mu$ は中央値（幾何平均）にあたる。

          **途中式** 半幅は $t_{0.025}(8)\times\dfrac{«ls»}{\sqrt9}=«t8»\times\dfrac{«ls»}{3}=«hw»$。
          $$\mu:\ «lm»\pm«hw3»\quad\Longrightarrow\quad e^\mu:\ \left(100e^{-«hw3»},\ 100e^{«hw3»}\right)=(«lo»,\ «hi»)$$

          **答え** $(«lo»,\ «hi»)$（生菌数の中央値の区間。100 について左右非対称）

          **間違えやすい点** 算術平均 $E[X]=e^{\mu+\sigma^2/2}$ は中央値より大きく、その区間には $\sigma^2$ の不確かさも入るので、この方法そのままでは作れない。
          自由度は $9-1=8$。微生物の数は右に裾が長いので、対数をとってから区間を作るのが普通である。

  - id: s25p07
    title: 落下菌の監視と検定の設計
    context: |
      無菌室の落下菌を、毎回 «n» 枚の培地プレートを一定時間置いて調べる。プレート 1 枚あたりのコロニー数は互いに独立に平均 $\lambda$ のポアソン分布に従うとする。
      通常の状態では $\lambda=«l0»$ で、汚染が起きると $\lambda=«l1»$ に増えると想定する。
    items:
      - id: s25p07a
        chapter: 10
        terms: [neyman-pearson-lemma, type-i-and-ii-errors, poisson-distribution]
        topic: ポアソン分布のコロニー数で単純仮説どうしの最強力検定の棄却域を有意水準5%以下で決め対立仮説のもとでの検出力を求める
        level: 応用
        definition: false
        type: choice
        question: |
          帰無仮説 $H_0:\lambda=«l0»$ と対立仮説 $H_1:\lambda=«l1»$ を、«n» 枚の合計 $T$ にもとづく最強力検定で調べる（ランダム化はしない）。有意水準を 5% 以下にする最も広い棄却域 $T\ge c$ の $c$ と、そのときの検出力の組として正しいものはどれか。
          ポアソン分布の上側確率 $P(T\ge t)$ は次のとおりとする。

          | $t$ | 9 | 10 | 11 | 12 |
          |---|---|---|---|---|
          | 平均 6 | «p0_9» | «p0_10» | «p0_11» | «p0_12» |
          | 平均 12 | «p1_9» | «p1_10» | «p1_11» | «p1_12» |
        choices:
          - '$c=11$、検出力 «pow»'
          - '$c=10$、検出力 «w10»'
          - '$c=12$、検出力 «w12»'
          - '$c=11$、検出力 «size»'
          - '$c=11$、検出力 «beta»'
        answer: 0
        distractors:
          - 正解
          - 有意水準 5% を超える棄却域（0.084）を選んだ
          - 5% 以下で最も広い棄却域より 1 つ狭い棄却域を選んだ
          - 帰無仮説のもとでの棄却の確率（有意水準）を検出力と取り違えた
          - 第 2 種の誤りの確率 β を検出力と取り違えた
        explanation: |
          **方針** ネイマン・ピアソンの補題により、尤度比 $\dfrac{L(\lambda_1)}{L(\lambda_0)}=e^{-n(\lambda_1-\lambda_0)}(\lambda_1/\lambda_0)^{T}$ が大きいとき、すなわち $T$ が大きいとき棄却する検定が最強力。$T$ は $H_0$ のもとで平均 $«n»\times«l0»=6$、$H_1$ のもとで平均 12 のポアソン分布に従う。

          **途中式** 平均 6 の行で $P(T\ge c)\le0.05$ となる最小の $c$ を探すと、$c=10$ では «p0_10» で 5% を超え、$c=11$ では «p0_11» で 5% 以下。
          検出力は平均 12 の行の $P(T\ge11)=«pow»$。

          **答え** $c=11$、検出力 «pow»（実際の有意水準は «p0_11»）

          **間違えやすい点** ポアソン分布は離散なので、有意水準をちょうど 5% にはできない（ちょうど 5% にするにはランダム化検定が必要）。
          検出力は対立仮説のもとで棄却する確率で、見逃す確率 $\beta=1-«pow»=«beta»$ とは逆。

  - id: s25p08
    title: インキュベーターの稼働と温度の変動
    context: |
      ある研究室の CO₂ インキュベーターの運用と、庫内温度の記録を調べている。
    items:
      - id: s25p08a
        chapter: 14
        terms: [stationary-distribution, positive-recurrence, markov-chain]
        topic: 空きと使用中の2状態マルコフ連鎖で定常分布から空きの平均再帰時間を求め使用中が続く日数の平均を幾何分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある 1 台のインキュベーターの毎朝の状態（空き・使用中）は、空きの翌日に使用中になる確率 «a»、使用中の翌日に空きになる確率 «b» のマルコフ連鎖に従う。
          (i) 空きの日から、次に空きになる日までの平均日数（空きの平均再帰時間）と、(ii) 使用中になってから使用中が続く日数の平均の組として正しいものはどれか。
        choices:
          - '(i) «rec» 日、(ii) «soj» 日'
          - '(i) «w_rec1» 日、(ii) «soj» 日'
          - '(i) «rec» 日、(ii) «w_soj» 日'
          - '(i) «w_cyc» 日、(ii) «soj» 日'
          - '(i) «rec» 日、(ii) «w_soj2» 日'
        answer: 0
        distractors:
          - 正解
          - 使用中の定常確率の逆数を答えた（空きではなく使用中の平均再帰時間）
          - 使用中が続く日数の平均を 1/a とした（空きが続く日数の平均と取り違えた）
          - 平均の空き日数と平均の使用日数を足した（再帰時間は日数の数え方が違う）
          - 使用中が続く日数の平均を 1/(1−b) とした
        explanation: |
          **方針** 2 状態の連鎖の定常分布は $\pi_{\text{空き}}=\dfrac{b}{a+b}$、$\pi_{\text{使用}}=\dfrac{a}{a+b}$。既約で正再帰的な連鎖では、状態 $i$ の平均再帰時間は $1/\pi_i$。
          使用中にとどまる日数は、毎日確率 $b$ で抜ける幾何分布に従う。

          **途中式**
          $$\pi_{\text{空き}}=\frac{«b»}{«a»+«b»}=«p0»,\qquad \text{(i)}\ \frac{1}{\pi_{\text{空き}}}=«rec»\ \text{日},\qquad \text{(ii)}\ \frac{1}{b}=\frac{1}{«b»}=«soj»\ \text{日}$$
          （確かめ：空きの翌日に空きなら 1 日、使用中になれば平均 «soj» 日使用したあとの日に空きに戻るので、$«q»\times1+«a»\times(1+«soj»)=«rec»$。）

          **答え** (i) «rec» 日、(ii) «soj» 日

          **間違えやすい点** 長期的に空きの日の割合は «p0» なので、空きの日は平均して «rec» 日に 1 回めぐってくる。$1/\pi_{\text{使用}}=«w_rec1»$ は使用中の平均再帰時間。
      - id: s25p08b
        chapter: 27
        terms: [ar-model, autocovariance-autocorrelation, weak-stationarity]
        topic: AR(1)に従う庫内温度のずれの定常分散を誤差分散と係数から求め自己相関が0.5を下回る最小のラグを求める
        level: 標準
        definition: false
        type: choice
        question: |
          庫内温度の設定値からのずれ $X_t$（℃、1 時間ごと）は、定常な AR(1) モデル $X_t=«phi»X_{t-1}+\varepsilon_t$（$\varepsilon_t$ は平均 0、標準偏差 «se» のホワイトノイズ）に従うとする。
          $X_t$ の標準偏差と、自己相関 $\rho_k$ が初めて 0.5 を下回るラグ $k$ の組として正しいものはどれか。
        choices:
          - '標準偏差 «sd»、$k=4$'
          - '標準偏差 «se»、$k=4$'
          - '標準偏差 «var»、$k=4$'
          - '標準偏差 «sd»、$k=3$'
          - '標準偏差 «w_sd»、$k=4$'
        answer: 0
        distractors:
          - 正解
          - ホワイトノイズの標準偏差を答えた（X_t には過去の誤差が積み重なる）
          - 分散を標準偏差と取り違えた
          - 0.8³=0.512 は 0.5 をわずかに上回るので、初めて下回るのはラグ 4
          - 分母を 1−φ² ではなく 1−φ とした
        explanation: |
          **方針** 定常な AR(1) では $V[X_t]=\phi^2V[X_{t-1}]+\sigma_\varepsilon^2$ で $V[X_t]=V[X_{t-1}]$ なので $V[X]=\dfrac{\sigma_\varepsilon^2}{1-\phi^2}$。自己相関は $\rho_k=\phi^k$。

          **途中式**
          $$V[X]=\frac{«se»^2}{1-«phi»^2}=\frac{«se2»}{«om»}=«var»,\qquad \text{標準偏差}=«sd»$$
          $\rho_1=«r1»$、$\rho_2=«r2»$、$\rho_3=«r3»$、$\rho_4=«r4»$ なので、初めて 0.5 を下回るのは $k=4$。

          **答え** 標準偏差 «sd»、$k=4$

          **間違えやすい点** ずれは過去の誤差の重み付き和 $\sum_j\phi^j\varepsilon_{t-j}$ なので、1 回分の誤差より大きくばらつく。$\phi$ が 1 に近いほど定常分散は大きくなり、$|\phi|\ge1$ では定常にならない。

  - id: s25p09
    title: HPLCの検量線
    context: |
      HPLC（高速液体クロマトグラフィー）で有効成分を定量する検量線を作るため、濃度 $x=2,4,6,8,10,12$（µg/mL）の標準液をそれぞれ 2 回ずつ測定し（$n=«n»$）、ピーク面積 $y$ を記録した。
    items:
      - id: s25p09a
        chapter: 17
        terms: [cooks-distance, leverage, standardized-residual]
        topic: 検量線の3つの測定点の標準化残差とてこ比からクックの距離を求め回帰への影響が最も大きい点を選ぶ
        level: 基本
        definition: false
        type: choice
        question: |
          ピーク面積 $y$ を濃度 $x$ に 1 次式で回帰した（係数は切片を含めて $p=2$ 個）。気になる 3 つの測定点の内部スチューデント化残差 $r_i$ とてこ比 $h_{ii}$ は次のとおりだった。

          | 測定点 | $r_i$ | $h_{ii}$ |
          |---|---|---|
          | P（濃度 6、2 回目） | «ne_rA» | «ne_hA» |
          | Q（濃度 12、1 回目） | «ne_rB» | «ne_hB» |
          | R（濃度 2、1 回目） | «ne_rC» | «ne_hC» |

          クックの距離 $D_i=\dfrac{r_i^2}{p}\cdot\dfrac{h_{ii}}{1-h_{ii}}$ が最も大きい点とその値の組として正しいものはどれか。
        choices:
          - 'Q で、$D=«ne_dB»$'
          - 'P で、$D=«ne_dA»$'
          - 'R で、$D=«ne_dC»$'
          - 'P で、$D=«ne_w_A»$'
          - 'Q で、$D=«ne_w_B»$'
        answer: 0
        distractors:
          - 正解
          - 残差の大きさだけで選んだ
          - てこ比の大きさだけで選んだ
          - p で割り忘れた
          - p で割り忘れた
        explanation: |
          **方針** クックの距離は、残差の大きさ（$r_i^2$）とてこ比の効き方（$h/(1-h)$）の積で、その点を除いたときに当てはめ値全体がどれだけ動くかを表す。

          **途中式**
          - P：$\dfrac{«ne_rA»^2}{2}\times\dfrac{«ne_hA»}{1-«ne_hA»}=«ne_dA4»$
          - Q：$\dfrac{«ne_rB»^2}{2}\times\dfrac{«ne_hB»}{1-«ne_hB»}=«ne_dB4»$
          - R：$\dfrac{«ne_rC»^2}{2}\times\dfrac{«ne_hC»}{1-«ne_hC»}=«ne_dC4»$

          **答え** Q で、$D=«ne_dB»$

          **間違えやすい点** 残差が最も大きい P は、てこ比が小さい（濃度が中央付近）ので回帰直線を大きくは動かさない。Q と同じくてこ比の大きい R（濃度の端）は、残差が小さく直線に乗っている。影響は両方の組み合わせで決まる。
          目安として $D_i$ が 0.5〜1 を超える点や、ほかより飛び抜けて大きい点を詳しく調べる。

      - id: s25p09b
        chapter: 30
        terms: [aic, model-selection, information-criteria-comparison]
        topic: 対数変換した検量線の1次から3次の多項式回帰の残差平方和から正規モデルのAICを計算して次数を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          ピーク面積のばらつきが濃度とともに大きくなっていたので、ピーク面積の対数 $\ln y$ を目的変数にして分散をそろえたうえで、$x$ の 1 次・2 次・3 次の多項式回帰を当てはめ、次の残差平方和 RSS を得た。

          | モデル | 1 次 | 2 次 | 3 次 |
          |---|---|---|---|
          | RSS | «rss1» | «rss2» | «rss3» |
          | $\ln(\mathrm{RSS}/«n»)$ | «l1» | «l2» | «l3» |

          誤差は独立に $N(0,\sigma^2)$ に従うとし、AIC $=-2\times$（最大対数尤度）$+2k$ とする。$k$ は回帰係数（切片を含む）と誤差分散 $\sigma^2$ を合わせた、推定する母数の数である。
          3 モデルに共通な定数 $n(\ln2\pi+1)$ を除いた $\mathrm{AIC}^*=n\ln(\mathrm{RSS}/n)+2k$ で比べるとき、$\mathrm{AIC}^*$ が最小になるモデルとその値の組として正しいものはどれか。
        choices:
          - '1 次モデル（$\mathrm{AIC}^*=«a1»$）'
          - '2 次モデル（$\mathrm{AIC}^*=«a2»$）'
          - '2 次モデル（$\mathrm{AIC}^*=«a2nov»$）'
          - '3 次モデル（$\mathrm{AIC}^*=«a3»$）'
          - '3 次モデル（$\mathrm{AIC}^*=«a3k»$）'
        answer: 1
        distractors:
          - AIC が大きいほどよいと誤解し、最大のモデルを選んだ
          - 正解
          - 誤差分散 σ² を母数に数え忘れた（モデルの順位は変わらないが値が違う）
          - 残差平方和が最小のモデルを選んだ（値は正しい AIC* だが最小ではない）
          - 罰則項を 2k ではなく k とした
        explanation: |
          **方針** 正規線形モデルでは $\hat\sigma^2=\mathrm{RSS}/n$（最尤推定量）を代入した最大対数尤度が $-\dfrac n2\{\ln(2\pi)+\ln(\mathrm{RSS}/n)+1\}$ となる。よって $-2\times$（最大対数尤度）$=n\ln(\mathrm{RSS}/n)+n(\ln2\pi+1)$。

          **途中式** $p$ 次の多項式の回帰係数は $p+1$ 個なので $k=p+2$（1 次 «k1»、2 次 «k2»、3 次 «k3»）。
          $$\text{1 次}:\ «n»\times(«l1»)+«pen1»=«nl1»+«pen1»=«a1»$$
          $$\text{2 次}:\ «n»\times(«l2»)+«pen2»=«nl2»+«pen2»=«a2»$$
          $$\text{3 次}:\ «n»\times(«l3»)+«pen3»=«nl3»+«pen3»=«a3»$$
          最小は 2 次モデル。

          **答え** 2 次モデル（$\mathrm{AIC}^*=«a2»$）

          **間違えやすい点** RSS は次数を上げるほど必ず小さくなるので、RSS 最小の 3 次モデルを選ぶのは過剰適合のもと。
          罰則を $k$ にすると 3 次が $«a3k»$ で最小になってしまう。$\sigma^2$ を数え忘れても順位は変わらないが、2 次の値は $«a2nov»$ と 2 だけずれる。

      - id: s25p09c
        chapter: 16
        terms: [variance-inflation-factor, multicollinearity, multiple-regression-model]
        topic: 検量線の2次多項式回帰でxとx²の相関から分散拡大係数を求め中心化で多重共線性が解消することを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          2 次モデル $\beta_0+\beta_1x+\beta_2x^2$ では、12 個の $x$ の値で計算した $x$ と $x^2$ の標本相関係数が «rr» である。
          $x$ の係数の分散拡大係数（VIF）と、$x$ を平均 «mx» で中心化して $(x-«mx»)$ と $(x-«mx»)^2$ を説明変数にしたときの $(x-«mx»)$ の VIF の組に最も近いものはどれか。
        choices:
          - '中心化前 $«w_1r»$、中心化後 $1.0$'
          - '中心化前 $«vif»$、中心化後 $«vif»$'
          - '中心化前 $«vif»$、中心化後 $1.0$'
          - '中心化前 $«w_odds»$、中心化後 $0.0$'
          - '中心化前 $1.0$、中心化後 $«vif»$'
        answer: 2
        distractors:
          - VIF を 1/(1 − r²) ではなく 1/(1 − r) とした
          - 中心化しても x と x² の関係は同じなので VIF は変わらないと考えた
          - 正解
          - VIF を r²/(1 − r²) とし、中心化後を 0 とした
          - 中心化の前後を取り違えた
        explanation: |
          **方針** VIF$_j=1/(1-R_j^2)$。$R_j^2$ は $j$ 番目の説明変数をほかの説明変数で回帰したときの決定係数で、説明変数が 2 つなら 2 つの相関係数の 2 乗に等しい。

          **途中式** 中心化前：
          $$\mathrm{VIF}=\frac{1}{1-«rr»^2}=\frac{1}{1-«rr2»}=\frac{1}{«one_r2»}=«vif2»\cdots$$
          中心化後：$u=x-«mx»$ は $\pm1,\pm3,\pm5$ を 2 回ずつとり、平均 0 で左右対称。$u$ と $u^2$ の共分散は $\frac1n\sum u^3-\bar u\,\overline{u^2}=0-0=0$ なので相関は 0、VIF $=1/(1-0)=1.0$。

          **答え** 中心化前 $«vif»$、中心化後 $1.0$

          **間違えやすい点** VIF が約 24 ということは、$x$ の係数の標準誤差が相関のない場合の約 $\sqrt{24}\approx4.9$ 倍に膨らむということ。
          中心化しても当てはめ値・残差・決定係数は変わらず、係数の意味（$x=«mx»$ での傾き）と標準誤差が変わる。

