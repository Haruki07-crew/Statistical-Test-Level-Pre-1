        level: 基本
        definition: true
        type: choice
        question: |
          まず直線 $y=\beta_0+\beta_1x+\varepsilon$ を最小二乗法で当てはめ、残差を当てはめ値に対してプロットしたところ、
          (i) 当てはめ値が大きいほど残差の散らばりが大きくなる（漏斗型）、(ii) 残差が両端で正、中央で負になる弓なりの形、の 2 つが見られた。
