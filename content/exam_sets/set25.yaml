          - '決定係数が 0.999 であれば、残差プロットにどのような形が見えても直線の検量線は妥当と判断してよい'
          - '(i) は残差の正規性の崩れだけを表すので、正規 Q-Q プロットが直線的であれば対処は必要ない'
          - '(i) と (ii) はどちらも説明変数 $x$ の測定誤差によるものなので、$x$ と $y$ を入れ替えて回帰し直せばよい'
        answer: 1
        distractors:
          - 漏斗型（分散の変化）を系列相関と、系統的な曲がりを外れ値と取り違えた
          - 正解
          - 決定係数が高ければモデルの仮定が満たされていると考えた
          - 不均一分散を正規性の問題と取り違えた（Q-Q プロットでは分散の変化はわからない）
