        explanation: |
          **方針** 残差対当てはめ値のプロットでは、散らばりの大きさが変わるか（等分散性）と、平均的な位置が系統的に曲がるか（関数形）を別々に見る。

          **途中式** (i) 漏斗型：当てはめ値（濃度）が大きいほど残差の散らばりが大きいので、$V[\varepsilon_i]$ が一定という仮定が崩れている（不均一分散）。
          分散が $x^2$ に比例するなら重み $1/x^2$ の重み付き最小二乗法、または $\ln y$ などへの変換が考えられる。
          (ii) 弓なり：残差の平均が $x$ とともに系統的に変わるので、平均の構造（直線）が誤っている。2 次の項を加える、測定範囲を狭めるなどを検討する。

          **答え** (i) は不均一分散で重み付き最小二乗法や変換、(ii) は関数形の誤りで 2 次の項などを検討する（選択肢 2 番目）。

          **間違えやすい点** 決定係数が 0.999 でも、残差に系統的な形があれば直線は不適切で、低濃度側の定量に大きな誤差が出ることがある。
          系列相関は観測の順序に沿った残差の並びで調べるもので、当てはめ値に対する散らばりの変化とは別の問題。

      - id: s25p09b
        chapter: 30
        terms: [aic, model-selection, information-criteria-comparison]
        topic: 対数変換した検量線の1次から3次の多項式回帰の残差平方和から正規モデルのAICを計算して次数を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          (a) を受けて、ピーク面積の対数 $\ln y$ を目的変数にして分散をそろえたうえで、$x$ の 1 次・2 次・3 次の多項式回帰を当てはめ、次の残差平方和 RSS を得た。

          | モデル | 1 次 | 2 次 | 3 次 |
          |---|---|---|---|
          | RSS | «rss1» | «rss2» | «rss3» |
          | $\ln(\mathrm{RSS}/«n»)$ | «l1» | «l2» | «l3» |

          誤差は独立に $N(0,\sigma^2)$ に従うとし、AIC $=-2\times$（最大対数尤度）$+2k$ とする。$k$ は回帰係数（切片を含む）と誤差分散 $\sigma^2$ を合わせた、推定する母数の数である。
          3 モデルに共通な定数 $n(\ln2\pi+1)$ を除いた $\mathrm{AIC}^*=n\ln(\mathrm{RSS}/n)+2k$ で比べるとき、$\mathrm{AIC}^*$ が最小になるモデルとその値の組として正しいものはどれか。
        choices:
          - '1 次モデル（$\mathrm{AIC}^*=«a1»$）'
          - '2 次モデル（$\mathrm{AIC}^*=«a2»$）'
          - '2 次モデル（$\mathrm{AIC}^*=«a2nov»$）'
          - '3 次モデル（$\mathrm{AIC}^*=«a3»$）'
          - '3 次モデル（$\mathrm{AIC}^*=«a3k»$）'
        answer: 1
        distractors:
          - AIC が大きいほどよいと誤解し、最大のモデルを選んだ
          - 正解
          - 誤差分散 σ² を母数に数え忘れた（モデルの順位は変わらないが値が違う）
          - 残差平方和が最小のモデルを選んだ（値は正しい AIC* だが最小ではない）
          - 罰則項を 2k ではなく k とした
        explanation: |
          **方針** 正規線形モデルでは $\hat\sigma^2=\mathrm{RSS}/n$（最尤推定量）を代入した最大対数尤度が $-\dfrac n2\{\ln(2\pi)+\ln(\mathrm{RSS}/n)+1\}$ となる。よって $-2\times$（最大対数尤度）$=n\ln(\mathrm{RSS}/n)+n(\ln2\pi+1)$。

          **途中式** $p$ 次の多項式の回帰係数は $p+1$ 個なので $k=p+2$（1 次 «k1»、2 次 «k2»、3 次 «k3»）。
          $$\text{1 次}:\ «n»\times(«l1»)+«pen1»=«nl1»+«pen1»=«a1»$$
          $$\text{2 次}:\ «n»\times(«l2»)+«pen2»=«nl2»+«pen2»=«a2»$$
          $$\text{3 次}:\ «n»\times(«l3»)+«pen3»=«nl3»+«pen3»=«a3»$$
          最小は 2 次モデル。

          **答え** 2 次モデル（$\mathrm{AIC}^*=«a2»$）

          **間違えやすい点** RSS は次数を上げるほど必ず小さくなるので、RSS 最小の 3 次モデルを選ぶのは過剰適合のもと。
          罰則を $k$ にすると 3 次が $«a3k»$ で最小になってしまう。$\sigma^2$ を数え忘れても順位は変わらないが、2 次の値は $«a2nov»$ と 2 だけずれる。

      - id: s25p09c
        chapter: 16
        terms: [variance-inflation-factor, multicollinearity, multiple-regression-model]
        topic: 検量線の2次多項式回帰でxとx²の相関から分散拡大係数を求め中心化で多重共線性が解消することを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          2 次モデル $\beta_0+\beta_1x+\beta_2x^2$ では、12 個の $x$ の値で計算した $x$ と $x^2$ の標本相関係数が «rr» である。
          $x$ の係数の分散拡大係数（VIF）と、$x$ を平均 «mx» で中心化して $(x-«mx»)$ と $(x-«mx»)^2$ を説明変数にしたときの $(x-«mx»)$ の VIF の組に最も近いものはどれか。
        choices:
          - '中心化前 $«w_1r»$、中心化後 $1.0$'
          - '中心化前 $«vif»$、中心化後 $«vif»$'
          - '中心化前 $«vif»$、中心化後 $1.0$'
          - '中心化前 $«w_odds»$、中心化後 $0.0$'
          - '中心化前 $1.0$、中心化後 $«vif»$'
        answer: 2
        distractors:
          - VIF を 1/(1 − r²) ではなく 1/(1 − r) とした
          - 中心化しても x と x² の関係は同じなので VIF は変わらないと考えた
          - 正解
          - VIF を r²/(1 − r²) とし、中心化後を 0 とした
          - 中心化の前後を取り違えた
        explanation: |
          **方針** VIF$_j=1/(1-R_j^2)$。$R_j^2$ は $j$ 番目の説明変数をほかの説明変数で回帰したときの決定係数で、説明変数が 2 つなら 2 つの相関係数の 2 乗に等しい。

          **途中式** 中心化前：
          $$\mathrm{VIF}=\frac{1}{1-«rr»^2}=\frac{1}{1-«rr2»}=\frac{1}{«one_r2»}=«vif2»\cdots$$
          中心化後：$u=x-«mx»$ は $\pm1,\pm3,\pm5$ を 2 回ずつとり、平均 0 で左右対称。$u$ と $u^2$ の共分散は $\frac1n\sum u^3-\bar u\,\overline{u^2}=0-0=0$ なので相関は 0、VIF $=1/(1-0)=1.0$。

          **答え** 中心化前 $«vif»$、中心化後 $1.0$

          **間違えやすい点** VIF が約 24 ということは、$x$ の係数の標準誤差が相関のない場合の約 $\sqrt{24}\approx4.9$ 倍に膨らむということ。
          中心化しても当てはめ値・残差・決定係数は変わらず、係数の意味（$x=«mx»$ での傾き）と標準誤差が変わる。

  - id: s25p10
    title: 酵素活性と反応温度
    context: |
      ある酵素の活性 $y$（U/mL）を、反応温度 $t$（℃）を変えて測った。37℃ を境に温度との関係が変わると考え、折れ点を 37 に固定した区分線形モデル（1 次スプライン）
      $$y=\beta_0+\beta_1t+\beta_2(t-37)_+ +\varepsilon,\qquad (u)_+=\max(u,0)$$
      を最小二乗法で当てはめ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$ を得た。
    items:
      - id: s25p10a
        chapter: 19
        terms: [spline-regression, nonlinear-regression]
        topic: 折れ点を固定した1次スプライン回帰の係数から折れ点より後の傾きと高温での予測値を求める
        level: 基本
        definition: false
        type: choice
        question: |
          $t=«t»$ ℃ での活性の予測値と、37℃ より高い範囲での直線の傾きの組として正しいものはどれか。
        choices:
          - '予測値 $«w_nohinge»$、傾き $«b1»$'
          - '予測値 $«w_nohinge»$、傾き $«slope»$'
          - '予測値 $«pred»$、傾き $«b2»$'
          - '予測値 $«pred»$、傾き $«slope»$'
          - '予測値 $«w_full»$、傾き $«slope»$'
        answer: 3
        distractors:
          - 折れ点の項を無視し、37℃ より高い範囲も同じ直線とした
          - 傾きは正しいが、予測値で折れ点の項を加え忘れた
          - 予測値は正しいが、折れ点の後の傾きを β2 だけとした
          - 正解
          - (t − 37)+ を t とみなして β2 × 41 を加えた
        explanation: |
          **方針** $t\le37$ では $(t-37)_+=0$ なので傾きは $\beta_1$。$t>37$ では $(t-37)_+=t-37$ なので、傾きは $\beta_1+\beta_2$ になる。折れ点で 2 本の直線はつながっている。

          **途中式** $t=«t»$ では $(«t»-37)_+=«dt»$ なので
          $$\hat y=«b0»+«b1»\times«t»+(«b2»)\times«dt»=«b0»+«lin»+(«hinge»)=«pred»$$
          37℃ より高い範囲の傾きは $\hat\beta_1+\hat\beta_2=«b1»+(«b2»)=«slope»$。

          **答え** 予測値 $«pred»$、傾き $«slope»$

          **間違えやすい点** $\beta_2$ は折れ点での傾きの**変化量**で、折れ点より後の傾きそのものではない。
          $(t-37)_+$ には $t$ ではなく $t-37$ を入れる（$t$ を入れると $«w_full»$ という不自然な値になる）。

  - id: s25p11
    title: 培養温度と培地の分割区実験
    context: |
      ある研究所で、細胞の培養温度（3 水準）と培地（2 種類）がコロニー数に与える影響を調べた。
      実験は «days» 日に分けて行い（日をブロックとする）、各日に 3 台のインキュベーターに 3 つの温度を無作為に割り付け、各インキュベーターの中で 2 種類の培地のプレートの置き場所を無作為に決めた。
      温度が主区因子、培地が副区因子の分割区法で、プレートは全部で «N» 枚である。
    items:
      - id: s25p11a
        chapter: 20
        terms: [split-plot-design, randomized-block-design, two-way-anova-with-replication]
        topic: 分割区法で主区因子（培養温度）と副区因子（培地）の検定に使う誤差項と自由度を数える
        level: 標準
        definition: false
        type: choice
        question: |
          この実験の分散分析で、温度の主効果の $F$ 検定と培地の主効果の $F$ 検定に使う誤差（分母）とその自由度の組として正しいものはどれか。
        choices:
          - '温度・培地とも、日×温度と残りをまとめた 1 つの誤差（自由度 «dfpool»）'
          - '温度は 1 次誤差（日×温度、自由度 «dfe1»）、培地は 2 次誤差（自由度 «dfe2»）'
          - '温度は 2 次誤差（自由度 «dfe2»）、培地は 1 次誤差（日×温度、自由度 «dfe1»）'
          - '温度・培地とも、日を無視した繰り返しのある二元配置の誤差（自由度 «dfrep»）'
          - '温度は 1 次誤差（日×温度、自由度 «dfe1»）、培地は 2 次誤差（自由度 «ainc»）'
        answer: 1
        distractors:
          - 分割区の構造を無視し、乱塊法の二元配置として誤差を 1 つにまとめた
          - 正解
          - 主区と副区の誤差を逆にした
          - ブロック（日）と分割の構造の両方を無視した
          - 2 次誤差の自由度で、培地と温度×培地の自由度を引き忘れた
        explanation: |
          **方針** 温度はインキュベーター（主区）単位で割り付けたので、温度の効果は「同じ日のインキュベーターどうしのばらつき」（1 次誤差＝日×温度）と比べる。
          培地は同じインキュベーターの中で比べたので、培地と温度×培地の効果は「インキュベーター内のばらつき」（2 次誤差）と比べる。

          **途中式** 全体の自由度 $«N»-1=«total»$ を分ける。
          - 日（ブロック）：$«days»-1=«dfb»$、温度：$3-1=«dfa»$、1 次誤差（日×温度）：$«dfb»\times«dfa»=«dfe1»$
          - 培地：$2-1=«dfB»$、温度×培地：$«dfa»\times«dfB»=«dfab»$
          - 2 次誤差：$«total»-«dfb»-«dfa»-«dfe1»-«dfB»-«dfab»=«dfe2»$

          **答え** 温度は 1 次誤差（自由度 «dfe1»）、培地は 2 次誤差（自由度 «dfe2»）。

          **間違えやすい点** 誤差を 1 つにまとめる（自由度 «dfpool»）と、温度の効果を本来より小さいばらつきと比べることになり、温度の効果を過大に有意と判定しやすい。
          2 次誤差の自由度は、主区 «ainc» 個の中の自由度 $«ainc»\times(2-1)=«ainc»$ から培地と温度×培地の分を引いた «dfe2»。

      - id: s25p11b
        chapter: 18
        terms: [deviance, poisson-regression, generalized-linear-model]
        topic: コロニー数のポアソン回帰で観測値と当てはめ値から1枚のプレートの逸脱度残差を求めピアソン残差と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          コロニー数を、温度・培地・日を説明変数とする対数リンクのポアソン回帰で当てはめた。あるプレートの観測値は $y=«y»$、当てはめ値は $\hat\mu=«mu»$ だった。
          ポアソン回帰の逸脱度は $D=2\sum_i\{y_i\ln(y_i/\hat\mu_i)-(y_i-\hat\mu_i)\}$ である。このプレートの**逸脱度残差**を求めよ。必要なら $\ln«ratio»=«ln16»$ を使え。
        answer: «dres»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 逸脱度残差は、逸脱度のうちその観測の寄与 $d_i$ の平方根に、$y_i-\hat\mu_i$ の符号をつけたもの：$r_i^{D}=\mathrm{sign}(y_i-\hat\mu_i)\sqrt{d_i}$。

          **途中式** $y/\hat\mu=«y»/«mu»=«ratio»$ なので
          $$d_i=2\{«y»\times«ln16»-(«y»-«mu»)\}=2\times(«ylog»-«ymu»)=«devi»$$
          $y>\hat\mu$ なので符号は正で、$r^{D}=\sqrt{«devi»}=«dres4»\cdots$。

          **答え** $«dres»$

          **間違えやすい点** $-(y_i-\hat\mu_i)$ の項は、切片を含むポアソン回帰では合計すると 0 になるので全体の逸脱度の式では省かれることがあるが、1 つの観測の寄与では省けない（省くと $«w_noterm»$）。
          係数 2 を落とすと $«w_no2»$。ピアソン残差 $(y-\hat\mu)/\sqrt{\hat\mu}=«pear»$ とは別のものである。

  - id: s25p12
    title: 研究所の安全意識調査
    context: |
      ある研究所の全職員 «N» 人に、安全意識を測るアンケート（100 点満点）を行った。«nR» 人が回答し、回答者の平均は «yR» 点だった。
      回答しなかった «nNR» 人から «nF» 人を無作為に選んで面談で追跡調査したところ、«nF» 人全員から回答が得られ、その平均は «yF» 点だった。
    items:
      - id: s25p12a
        chapter: 21
        terms: [nonresponse-bias, sampling-weight, two-stage-sampling]
        topic: 非回答者の一部を追跡調査した結果で全体平均を推定し回答者だけの平均がもつ非回答バイアスを求める
        level: 基本
        definition: false
        type: numeric
        question: |
          追跡調査の結果を非回答者全体の代表とみなして全職員の平均得点を推定し、回答者だけの平均 «yR» 点がもつ非回答バイアス（回答者の平均 − 全職員の平均の推定値）を求めよ。
        answer: «bias»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 母集団を回答層（«nR» 人）と非回答層（«nNR» 人）に分け、非回答層の平均は追跡調査の平均で推定する。層の大きさで重み付けした平均が全体の推定値になる。
          追跡した «nF» 人は非回答者 «nNR» 人を代表するので、1 人あたりの重みは $«nNR»/«nF»=«wgt»$。

          **途中式**
          $$\hat{\bar Y}=\frac{«nR»\times«yR»+«nF»\times«wgt»\times«yF»}{«N»}=\frac{«sumR»+«sumF»}{«N»}=«est»$$
          $$\text{バイアス}=«yR»-«est»=«bias_s»$$
          これは $(\text{非回答率})\times(\text{回答者平均}-\text{非回答者平均})=«nr»\times«gap»=«bias_s»$ とも書ける。

          **答え** $«bias_s»$ 点（回答者だけの平均は約 «bias_s» 点高すぎる）

          **間違えやすい点** 2 つの平均を単純に平均して $(«yR»+«yF»)/2$ を全体平均とすると、層の大きさの違いを無視したことになり、バイアスは $«w_half»$ になる。
          回答者と非回答者の平均の差 $«gap»$ そのものはバイアスではなく、非回答率 «nr» を掛ける。

  - id: s25p13
    title: 分離株のクラスター数の決定
    context: |
      ある研究所で分離した «n» 株の細菌を、生化学的性状の標準化したデータにもとづいて k-means 法で分類した。全体の平方和（各株の総平均からの距離の 2 乗の和）は «T» で、クラスター数 $k$ ごとの群内平方和 $W_k$ は次のとおりだった。

      | $k$ | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|
      | $W_k$ | «W2» | «W3» | «W4» | «W5» |
    items:
      - id: s25p13a
        chapter: 24
        terms: [number-of-clusters, k-means-method, non-hierarchical-clustering]
        topic: 分離株のk-means法の群内平方和からカリンスキー・ハラバシュ指標を計算してクラスター数を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          カリンスキー・ハラバシュ指標 $CH_k=\dfrac{B_k/(k-1)}{W_k/(n-k)}$（$B_k$ は群間平方和、$n=«n»$）が最大になる $k$ でクラスター数を決める。
          選ばれる $k$ とそのときの指標の値の組として正しいものはどれか。
        choices:
          - '$k=3$、指標の値 $«w_n»$'
          - '$k=3$、指標の値 $«chr3»$'
          - '$k=3$、指標の値 $«w_k»$'
          - '$k=5$、指標の値 $«w_bw»$'
          - '$k=5$、指標の値 $«W5»$'
        answer: 1
        distractors:
          - 群内平方和を n − k ではなく n で割った
          - 正解
          - 群間平方和を k − 1 ではなく k で割った
          - 自由度で割らずに B/W をそのまま比べた
          - 群内平方和が最小の k を選んだ
        explanation: |
          **方針** 全平方和は群間平方和と群内平方和に分かれる（$T=B_k+W_k$）。それぞれを自由度 $k-1$、$n-k$ で割って比をとり、最大になる $k$ を選ぶ。

          **途中式** $B_k=«T»-W_k$ より
          $$CH_2=\frac{«B2»/1}{«W2»/«nk2»}=\frac{«bm2»}{«wm2»}=«ch2»,\qquad CH_3=\frac{«B3»/2}{«W3»/«nk3»}=\frac{«bm3»}{«wm3»}=«ch3»$$
          $$CH_4=\frac{«B4»/3}{«W4»/«nk4»}=\frac{«bm4»}{«wm4»}=«ch4»,\qquad CH_5=\frac{«B5»/4}{«W5»/«nk5»}=\frac{«bm5»}{«wm5»}=«ch5»$$
          最大は $k=3$。

          **答え** $k=3$（$CH_3=«chr3»$）

          **間違えやすい点** 群内平方和はクラスターを増やすほど必ず小さくなるので、$W_k$ 最小の $k=5$ を選ぶのは誤り。
          自由度で割らない $B_k/W_k$ も $k$ とともに増え続け（$k=5$ で «bw5»）、クラスター数を増やすほど有利になってしまう。自由度で割ることで、$k$ を増やしたことへの罰則がかかる。

  - id: s25p14
    title: 錠剤の品質特性の多変量解析
    context: |
      ある錠剤について、多数のロットで測った品質特性を標準化して多変量解析を行う。
    items:
      - id: s25p14a
        chapter: 25
        terms: [communality, factor-analysis-model, correlation-matrix]
        topic: 3つの品質特性の相関行列から重相関係数の2乗を求め主因子法の共通性の初期値にする
        level: 標準
        definition: false
        type: choice
        question: |
          硬度 $X_1$、崩壊時間 $X_2$、溶出率 $X_3$ の相関行列は
          $$R=\begin{pmatrix}1&«r12»&«r13»\\«r12»&1&«r23»\\«r13»&«r23»&1\end{pmatrix}$$
          だった。主因子法で因子分析を行うとき、$X_1$ の共通性の初期値として、$X_1$ を $X_2$、$X_3$ で重回帰したときの決定係数（重相関係数の 2 乗、SMC）を使う。その値に最も近いものはどれか。
        choices:
          - '$«w_max»$'
          - '$«w_num»$'
          - '$«smc»$'
          - '$«w_uniq»$'
          - '$«w_sum»$'
        answer: 2
        distractors:
          - 最も相関の強い X2 との相関の 2 乗だけを使った
          - 分子だけ計算し、1 − r23² で割り忘れた
          - 正解
          - 1 − SMC（独自性の初期値）を答えた
          - X2 と X3 の相関を無視して r12² + r13² とした
        explanation: |
          **方針** 標準化した 3 変数で、$X_1$ を $X_2,X_3$ で回帰したときの決定係数は
          $R^2=\dfrac{r_{12}^2+r_{13}^2-2r_{12}r_{13}r_{23}}{1-r_{23}^2}$。同じ値は $1-1/(R^{-1})_{11}$ でも求まる。

          **途中式**
          $$R^2=\frac{«r12»^2+«r13»^2-2\times«r12»\times«r13»\times«r23»}{1-«r23»^2}=\frac{«sq»-«cross»}{«den»}=\frac{«num»}{«den»}=«smc4»\cdots$$

          **答え** $«smc»$

          **間違えやすい点** $X_2$ と $X_3$ が相関しているので、それぞれの相関の 2 乗を足すだけ（$«w_sum»$）では重複して数えてしまう。
          SMC は共通性の下限の目安として初期値に使う。1 − SMC $=«w_uniq»$ は独自性の初期値。

      - id: s25p14b
        chapter: 26
        terms: [canonical-correlation-analysis, canonical-variate]
        topic: 原料特性と錠剤特性の正準相関係数からバートレットのカイ二乗近似による逐次検定で有意な正準相関の個数を判定する
        level: 応用
        definition: false
        type: choice
        question: |
          別の調査で、«N» ロットについて原料の特性 «p» 変数と錠剤の特性 «q» 変数の正準相関分析を行い、正準相関係数 $r_1=«c1»$、$r_2=«c2»$ を得た。
          「$i$ 番目以降の正準相関がすべて 0」という帰無仮説を、バートレットのカイ二乗近似
          $$\chi^2=-\left\{n-1-\frac{p+q+1}{2}\right\}\sum_{j\ge i}\ln(1-r_j^2)$$
          （自由度 $(p-i+1)(q-i+1)$）で $i=1,2$ の順に有意水準 5% で調べる（$n=«N»$、$p=«p»$、$q=«q»$）。
          必要なら $\ln0.4=«l04»$、$\ln0.64=«l064»$、$\ln0.8=«l08»$、$\ln0.96=«l096»$、自由度 1、4 のカイ二乗分布の上側 5% 点 3.841、9.488 を使え。正しい記述はどれか。
        choices:
          - '$i=1$ の統計量は «st1»（自由度 «df1»）で有意、$i=2$ の統計量は «st2»（自由度 «df2»）で有意でない。有意な正準相関は 1 つ'
          - '$i=1$ の統計量は «st1r»（自由度 «df1»）で有意、$i=2$ の統計量は «st2r»（自由度 «df2»）で有意。有意な正準相関は 2 つ'
          - '$i=1$ の統計量は «st1»（自由度 «df1»）で有意なので、2 つの正準相関はどちらも 0 でないといえる'
          - '$i=1$ の統計量は «st1n»（自由度 «df1»）で有意、$i=2$ の統計量は «st2»（自由度 «df2»）で有意でない。有意な正準相関は 1 つ'
          - '$i=1$ の統計量は «st1»（自由度 2）で有意、$i=2$ の統計量は «st2»（自由度 1）で有意でない。有意な正準相関は 1 つ'
        answer: 0
        distractors:
          - 正解
          - ln(1 − r²) ではなく ln(1 − r) を使った
          - 最初の検定の棄却を「すべての正準相関が 0 でない」と読み違えた
          - バートレットの補正をせず n をそのまま掛けた
          - 最初の検定の自由度を p × q ではなく p とした
        explanation: |
          **方針** 最初の検定（$i=1$）は「すべての正準相関が 0」を調べる。棄却されたら、最大の正準相関を除いた残り（$i=2$）が 0 かを調べる、という順に進め、初めて棄却されなかったところで止める。

          **途中式** 係数は $n-1-(p+q+1)/2=«N»-1-2.5=«fac»$。$1-r_1^2=«c1s»$、$1-r_2^2=«c2s»$。
          $$i=1:\ \chi^2=-«fac»\times\{\ln«c1s»+\ln«c2s»\}=-«fac»\times(«lsum»)=«st1»\quad(\text{自由度 }«p»\times«q»=«df1»)$$
          $«st1»>9.488$ なので棄却（少なくとも 1 つの正準相関は 0 でない）。
          $$i=2:\ \chi^2=-«fac»\times\ln«c2s»=-«fac»\times(«l096»)=«st2»\quad(\text{自由度 }1\times1=«df2»)$$
          $«st2»<3.841$ なので棄却できない。

          **答え** 有意な正準相関は第 1 正準相関の 1 つ（$«st1»$ で有意、$«st2»$ で有意でない）。

          **間違えやすい点** 最初の検定が棄却されても、わかるのは「少なくとも 1 つが 0 でない」ことだけで、2 つとも 0 でないとはいえない。
          対数の中は $1-r^2$（相関係数の 2 乗）で、$1-r$ を使うと統計量が大きくなりすぎる。自由度は $i=1$ で $pq=«df1»$、$i=2$ で $(p-1)(q-1)=«df2»$。
