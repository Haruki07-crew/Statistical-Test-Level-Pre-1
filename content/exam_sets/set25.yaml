          - '$\tau=«tau»$ は «dfc» より大きいので、単位根の帰無仮説は棄却できない'
          - '$\tau=«tau»$ は $t$ 分布の 5% 点 «tc» より小さいので、単位根を棄却し、$x_t$ は定常と判断する'
          - '$\tau=«tau»$ は «dfc» より大きいので、単位根を棄却し、$x_t$ は定常と判断する'
          - '$\hat\rho=1+\hat\gamma=«rho»$ を標準誤差で割った «wrong_t» は大きいので $\rho=0$ が棄却され、単位根があると判断する'
          - '$\tau=«tau»$ は «dfc» より大きいので、$x_t$ が単位根をもつ（ランダムウォーク型である）ことが証明された'
        answer: 0
        distractors:
          - 正解
          - 単位根のもとでは t 統計量が t 分布に従わないことを無視し、通常の t 分布の点と比べた
          - 棄却域の向きを逆に読んだ（DF 点より大きいと棄却と考えた）
          - ρ = 0 の検定と ρ = 1 の検定を取り違えた
          - 帰無仮説を棄却できないことを、帰無仮説が正しいと証明されたと読み違えた
        explanation: |
          **方針** $x_t=\rho x_{t-1}+\cdots$ のとき $\Delta x_t=\gamma x_{t-1}+\cdots$（$\gamma=\rho-1$）なので、単位根 $\rho=1$ は $\gamma=0$ にあたる。統計量 $\tau=\hat\gamma/\mathrm{SE}$ は、帰無仮説のもとで $t$ 分布ではなくディッキー・フラー分布に従うので、その表の点と比べる。

          **途中式**
          $$\tau=\frac{«g»}{«se»}=«tau»$$
          左側検定なので $\tau<«dfc»$ なら棄却する。$«tau»>«dfc»$ なので棄却できない。

          **答え** 単位根の帰無仮説は有意水準 5% で棄却できない（定常とは判断できない）。

          **間違えやすい点** 通常の $t$ 分布の点 «tc» と比べると棄却してしまうが、単位根のもとでの分布は左に偏っていて棄却点がずっと小さい。
          棄却できないことは単位根の存在を証明するものではなく、「定常だとはいえない」というだけである。

  - id: s25p09
