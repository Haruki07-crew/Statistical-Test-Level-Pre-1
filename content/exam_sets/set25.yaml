    title: 酵素活性と反応温度
    context: |
      ある酵素の活性 $y$（U/mL）と反応温度 $t$（℃）の関係を、温度の範囲で傾きが変わる区分線形モデルで表したい。折れ点（ノット）は 30℃ と 45℃ の 2 か所に固定する。
    items:
      - id: s25p10a
        chapter: 19
        terms: [spline-regression, polynomial-regression, least-squares-method]
        topic: 2つの折れ点をもつ連続な1次スプラインの係数の数を切断べき基底で数えつながりを仮定しない3本の直線と比べる
        level: 基本
        definition: false
        type: choice
        question: |
          (i) 2 つの折れ点で直線がつながる（連続な）1 次スプライン $y=\beta_0+\beta_1t+\beta_2(t-30)_++\beta_3(t-45)_+$ の係数の数と、
          (ii) 3 つの温度区間それぞれに別々の直線を当てはめる（つながりを仮定しない）場合の係数の数の組として正しいものはどれか。$(u)_+=\max(u,0)$ である。
        choices:
          - (i) 4、(ii) 6
          - (i) 3、(ii) 6
          - (i) 4、(ii) 4
          - (i) 6、(ii) 6
          - (i) 5、(ii) 6
        answer: 0
        distractors:
          - 正解
          - 切片を数え忘れた
          - つながりを仮定しない場合も、各区間に傾きだけを足せばよいと考えた
          - 連続性の制約（折れ点で 2 つの直線の値が一致する）で係数が減ることを考えなかった
          - 折れ点ごとに切片の項も加えた（不連続な跳びを許すことになる）
        explanation: |
          **方針** 1 本の直線は係数 2 個。区間ごとに別の直線なら 3 本で 6 個。つながりを課すと、折れ点ごとに「2 本の直線の値が一致する」という制約が 1 つずつ加わるので、$6-2=4$ 個になる。

          **途中式** 切断べき基底では、$\beta_0+\beta_1t$ が 30℃ 未満の直線、$\beta_2$ が 30℃ での傾きの変化、$\beta_3$ が 45℃ での傾きの変化を表す。
          45℃ を超えたところの傾きは $\beta_1+\beta_2+\beta_3$。係数は 4 個。

          **答え** (i) 4、(ii) 6

          **間違えやすい点** $(t-30)_+$ は 30℃ までは 0 で、そこから直線的に増えるので、値は連続のまま傾きだけを変える。跳びを許すなら、$I(t\ge30)$ のような段差の項を加える必要がある。
          ノットの数や位置を増やすほど柔軟になるが、係数が増えて過剰適合しやすくなる。

  - id: s25p11
    title: 培地の比較実験
    context: |
      ある研究所で、3 種類の培地 1〜3 での細胞の増殖量と、2 種類の培地でのコロニー数を比べた。以下の小問は、それぞれ問題文に示したデータを使う。
    items:
      - id: s25p11a
        chapter: 20
        terms: [one-way-anova, sum-of-squares-decomposition, fixed-and-random-effects]
        topic: 繰り返し数の異なる3群の一元配置で群の平均と大きさから群間平方和を求めF値を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          培地 1〜3 でそれぞれ «n1»、«n2»、«n3» 枚のプレートを培養し、増殖量の平均は «m1»、«m2»、«m3» だった。一元配置分散分析の誤差の平均平方は «mse»（自由度 «dfe»）である。
          群間平方和から求めた $F$ 値として正しいものはどれか。必要なら $F_{0.05}(2,«dfe»)=«fc»$ を使え。
        choices:
          - '$F=«F»$ で、«fc» を下回り、培地による違いは有意でない'
          - '$F=«w_unw»$ で、«fc» を下回り、有意でない'
          - '$F=«w_df»$ で、«fc» を下回り、有意でない'
          - '$F=«w_nodf»$ で、«fc» を上回り、有意である'
          - '$F=«w_eq»$ で、«fc» を下回り、有意でない'
        answer: 0
        distractors:
          - 正解
          - 総平均を、大きさで重み付けずに 3 つの平均の単純平均とした
          - 群間の自由度を 2 ではなく 3 とした
          - 群間平方和を自由度で割らずに F を作った
          - 繰り返し数を 3 群とも 5 として計算した
        explanation: |
          **方針** 繰り返し数が違うときは、総平均を大きさで重み付けた平均 $\bar y=\sum n_i\bar y_i/\sum n_i$ とし、群間平方和 $\sum n_i(\bar y_i-\bar y)^2$ を自由度 $k-1=2$ で割る。

          **途中式** $\bar y=\dfrac{«n1»\times«m1»+«n2»\times«m2»+«n3»\times«m3»}{«N»}=«gm»$。
          $$\mathrm{SS}_B=«n1»(«m1»-«gm»)^2+«n2»(«m2»-«gm»)^2+«n3»(«m3»-«gm»)^2=«ssb»$$
          $$F=\frac{«ssb»/2}{«mse»}=«F4»$$

          **答え** $F=«F»$ で、有意でない

          **間違えやすい点** 群の大きさが違うと、単純平均の総平均では平方和の分解（全体 = 群間 + 群内）が成り立たない。
          釣り合いのない計画では、群の大きさによって平均の精度が違うので、比較の検出力も群の組ごとに変わる。
      - id: s25p11b
        chapter: 18
        terms: [poisson-regression, link-function, maximum-likelihood-estimator]
        topic: 2値の説明変数だけのポアソン回帰で傾きの最尤推定値が2群の平均コロニー数の比の対数になることを使って求める
        level: 標準
        definition: false
        type: numeric
        question: |
          培地 A（$x=0$）と培地 B（$x=1$）のプレートを «m» 枚ずつ培養し、コロニー数の平均は A が «ya»、B が «yb» だった。コロニー数に対数リンクのポアソン回帰 $\log E[Y]=\beta_0+\beta_1x$ を最尤法で当てはめるとき、$\hat\beta_1$ を求めよ。
          必要なら $\ln «ya»=«lna»$、$\ln «yb»=«lnb»$ を使え。
        answer: «b1»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。負の値なら符号もつけよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ポアソン回帰の尤度方程式は $\sum(y_i-\hat\mu_i)=0$、$\sum x_i(y_i-\hat\mu_i)=0$。説明変数が 2 値だけなら、各群で当てはめ値 $\hat\mu$ が群の平均に一致する（飽和モデル）。

          **途中式** $e^{\hat\beta_0}=«ya»$、$e^{\hat\beta_0+\hat\beta_1}=«yb»$ なので
          $$\hat\beta_1=\ln«yb»-\ln«ya»=«lnb»-«lna»=«b14»$$

          **答え** $«b1_s»$（率比 $e^{\hat\beta_1}=«yb»/«ya»=«rr»$）

          **間違えやすい点** 平均の差 «diff» ではなく、平均の比の対数になる（対数リンクなので係数は比を表す）。A と B の向きを逆にすると符号が変わる。

  - id: s25p12
    title: 製造ロットの抜取調査
    context: |
      ある工場の 4 つの製造ロット（大きさは «x1»、«x2»、«x3»、«x4» 個、計 «X» 個）から、ロットの大きさに比例する包含確率 $\pi_i=2x_i/«X»$ で 2 ロットを非復元で選び（ロットの大きさに比例する確率での抽出）、選んだロットの全数を検査する。
    items:
      - id: s25p12a
        chapter: 21
        terms: [horvitz-thompson-estimator, probability-proportional-to-size-sampling, inclusion-probability]
        topic: 大きさに比例する包含確率で選んだ2ロットの不良数からホーヴィッツ・トンプソン推定量で全ロットの不良数の合計を推定する
        level: 基本
        definition: false
        type: numeric
        question: |
          選ばれたのは 2 番目と 4 番目のロットで、不良品はそれぞれ «y2» 個と «y4» 個だった。4 ロット全体の不良品の総数を、ホーヴィッツ・トンプソン推定量 $\sum_{i\in s}y_i/\pi_i$ で推定せよ。
        answer: «ht»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 各ロットの値を、そのロットが選ばれる確率（包含確率）で割って足す。選ばれにくいロットほど、1 つで多くのロットを代表する。

          **途中式** $\pi_2=2\times«x2»/«X»=«pi2»$、$\pi_4=2\times«x4»/«X»=«pi4»$。
          $$\hat Y_{HT}=\frac{«y2»}{«pi2»}+\frac{«y4»}{«pi4»}=«t2»+«t4»=«ht_s»$$

          **答え** $«ht_s»$ 個

          **間違えやすい点** 1 回の抽出でロットが選ばれる確率 $x_i/X$ で割ると «w_once» と 2 倍になる（2 ロット選ぶので包含確率は 2 倍）。
          単純無作為抽出とみなして $4\times(«y2»+«y4»)/2=«w_srs»$ とすると、大きいロットが選ばれやすいことを無視してしまう。不良数がロットの大きさにほぼ比例するなら、この抽出は推定の精度を大きく上げる。

  - id: s25p13
    title: 分離株のクラスタリング
    context: |
      ある研究所で分離した 6 株の細菌を、2 つの生化学的性状（標準化した値）$(u,v)$ にもとづいて k-means 法で 2 つのクラスターに分ける。
      各株の値は S1 $(1,1)$、S2 $(2,1)$、S3 $(1,2)$、S4 $(5,4)$、S5 $(6,5)$、S6 $(4,5)$ である。
    items:
      - id: s25p13a
        chapter: 24
        terms: [k-means-method, non-hierarchical-clustering, distance-measures]
        topic: 初期中心から1回の割り当てと中心の更新を行い2回目の割り当てで所属が変わる株と群内平方和の減少を求める
        level: 応用
        definition: false
        type: choice
        question: |
          初期の中心を $c_1=(1,1)$、$c_2=(2,1)$ とし、ユークリッド距離で最も近い中心に割り当てる → 各クラスターの平均を新しい中心にする、を 1 回行った。
          新しい $c_2$ と、そのあと 2 回目の割り当てで所属が変わる株の組として正しいものはどれか。
        choices:
          - '新しい $c_2=(«c2u»,\ «c2v»)$。2 回目の割り当てで S2 がクラスター 1 に移る'
          - '新しい $c_2=(«c2u»,\ «c2v»)$。所属の変わる株はなく、ここで収束する'
          - '新しい $c_2=(«w_u»,\ «w_v»)$。2 回目の割り当てで S2 がクラスター 1 に移る'
          - '新しい $c_2=(«c2u»,\ «c2v»)$。2 回目の割り当てで S4 がクラスター 1 に移る'
          - '新しい $c_2=(2,\ 1)$。中心は初期値から動かない'
        answer: 0
        distractors:
          - 正解
          - S2 の新しい中心までの距離を計算し直さなかった
          - S2 を除いた 3 株の平均を c2 とした（最初の割り当てで S2 が c2 に入ることを見落とした）
          - S4 は新しい c2 の方が近い
          - 中心は割り当てられた株の平均に更新される
        explanation: |
          **方針** k-means 法は「割り当て」と「中心の更新」を交互に繰り返す。どちらの段階でも群内平方和は増えない。

          **途中式** 最初の割り当て：S1・S3 は $c_1=(1,1)$ が近く、S2・S4・S5・S6 は $c_2=(2,1)$ が近い（S2 は $c_2$ そのもの）。
          新しい中心は $c_1=(1,\ 1.5)$、$c_2=\left(\dfrac{2+5+6+4}{4},\ \dfrac{1+4+5+5}{4}\right)=(«c2u»,\ «c2v»)$。
          2 回目の割り当てで S2 $(2,1)$ は、$c_1$ までの距離の 2 乗 $1+0.25=1.25$、$c_2$ までの距離の 2 乗 $«d2»$ なので $c_1$ に移る。
          群内平方和は、最初の割り当てと初期中心で «w0»、中心の更新後に «w1»、S2 が移ったあと（中心を更新）に «w2» と減っていく。

          **答え** 新しい $c_2=(«c2u»,\ «c2v»)$。S2 がクラスター 1 に移る

          **間違えやすい点** 初期中心を近くに 2 つ置くと、最初の割り当てが不自然になり、何回か繰り返して修正される。初期値によっては局所的な解にとどまるので、初期値を変えて何度か実行するのが普通である。

  - id: s25p14
    title: 錠剤の品質特性の多変量解析
    context: |
      ある錠剤について、多数のロットで測った品質特性を標準化して多変量解析を行う。
    items:
      - id: s25p14a
        chapter: 25
        terms: [communality, factor-analysis-model, correlation-matrix]
        topic: 3つの品質特性の相関行列から重相関係数の2乗を求め主因子法の共通性の初期値にする
        level: 標準
        definition: false
        type: choice
        question: |
          硬度 $X_1$、崩壊時間 $X_2$、溶出率 $X_3$ の相関行列は
          $$R=\begin{pmatrix}1&«r12»&«r13»\\«r12»&1&«r23»\\«r13»&«r23»&1\end{pmatrix}$$
          だった。主因子法で因子分析を行うとき、$X_1$ の共通性の初期値として、$X_1$ を $X_2$、$X_3$ で重回帰したときの決定係数（重相関係数の 2 乗、SMC）を使う。その値に最も近いものはどれか。
        choices:
          - '$«w_max»$'
          - '$«w_num»$'
          - '$«smc»$'
          - '$«w_uniq»$'
          - '$«w_sum»$'
        answer: 2
        distractors:
          - 最も相関の強い X2 との相関の 2 乗だけを使った
          - 分子だけ計算し、1 − r23² で割り忘れた
          - 正解
          - 1 − SMC（独自性の初期値）を答えた
          - X2 と X3 の相関を無視して r12² + r13² とした
        explanation: |
          **方針** 標準化した 3 変数で、$X_1$ を $X_2,X_3$ で回帰したときの決定係数は
          $R^2=\dfrac{r_{12}^2+r_{13}^2-2r_{12}r_{13}r_{23}}{1-r_{23}^2}$。同じ値は $1-1/(R^{-1})_{11}$ でも求まる。

          **途中式**
          $$R^2=\frac{«r12»^2+«r13»^2-2\times«r12»\times«r13»\times«r23»}{1-«r23»^2}=\frac{«sq»-«cross»}{«den»}=\frac{«num»}{«den»}=«smc4»\cdots$$

          **答え** $«smc»$

          **間違えやすい点** $X_2$ と $X_3$ が相関しているので、それぞれの相関の 2 乗を足すだけ（$«w_sum»$）では重複して数えてしまう。
          SMC は共通性の下限の目安として初期値に使う。1 − SMC $=«w_uniq»$ は独自性の初期値。

      - id: s25p14b
        chapter: 26
        terms: [canonical-correlation-analysis, canonical-variate]
        topic: 原料特性と錠剤特性の正準相関係数からバートレットのカイ二乗近似による逐次検定で有意な正準相関の個数を判定する
        level: 応用
        definition: false
        type: choice
        question: |
          別の調査で、«N» ロットについて原料の特性 «p» 変数と錠剤の特性 «q» 変数の正準相関分析を行い、正準相関係数 $r_1=«c1»$、$r_2=«c2»$ を得た。
          「$i$ 番目以降の正準相関がすべて 0」という帰無仮説を、バートレットのカイ二乗近似
          $$\chi^2=-\left\{n-1-\frac{p+q+1}{2}\right\}\sum_{j\ge i}\ln(1-r_j^2)$$
          （自由度 $(p-i+1)(q-i+1)$）で $i=1,2$ の順に有意水準 5% で調べる（$n=«N»$、$p=«p»$、$q=«q»$）。
          必要なら $\ln0.4=«l04»$、$\ln0.64=«l064»$、$\ln0.8=«l08»$、$\ln0.96=«l096»$、自由度 1、4 のカイ二乗分布の上側 5% 点 3.841、9.488 を使え。正しい記述はどれか。
        choices:
          - '$i=1$ の統計量は «st1»（自由度 «df1»）で有意、$i=2$ の統計量は «st2»（自由度 «df2»）で有意でない。有意な正準相関は 1 つ'
          - '$i=1$ の統計量は «st1r»（自由度 «df1»）で有意、$i=2$ の統計量は «st2r»（自由度 «df2»）で有意。有意な正準相関は 2 つ'
          - '$i=1$ の統計量は «st1»（自由度 «df1»）で有意なので、2 つの正準相関はどちらも 0 でないといえる'
          - '$i=1$ の統計量は «st1n»（自由度 «df1»）で有意、$i=2$ の統計量は «st2»（自由度 «df2»）で有意でない。有意な正準相関は 1 つ'
          - '$i=1$ の統計量は «st1»（自由度 2）で有意、$i=2$ の統計量は «st2»（自由度 1）で有意でない。有意な正準相関は 1 つ'
        answer: 0
        distractors:
          - 正解
          - ln(1 − r²) ではなく ln(1 − r) を使った
          - 最初の検定の棄却を「すべての正準相関が 0 でない」と読み違えた
          - バートレットの補正をせず n をそのまま掛けた
          - 最初の検定の自由度を p × q ではなく p とした
        explanation: |
          **方針** 最初の検定（$i=1$）は「すべての正準相関が 0」を調べる。棄却されたら、最大の正準相関を除いた残り（$i=2$）が 0 かを調べる、という順に進め、初めて棄却されなかったところで止める。

          **途中式** 係数は $n-1-(p+q+1)/2=«N»-1-2.5=«fac»$。$1-r_1^2=«c1s»$、$1-r_2^2=«c2s»$。
          $$i=1:\ \chi^2=-«fac»\times\{\ln«c1s»+\ln«c2s»\}=-«fac»\times(«lsum»)=«st1»\quad(\text{自由度 }«p»\times«q»=«df1»)$$
          $«st1»>9.488$ なので棄却（少なくとも 1 つの正準相関は 0 でない）。
          $$i=2:\ \chi^2=-«fac»\times\ln«c2s»=-«fac»\times(«l096»)=«st2»\quad(\text{自由度 }1\times1=«df2»)$$
          $«st2»<3.841$ なので棄却できない。

          **答え** 有意な正準相関は第 1 正準相関の 1 つ（$«st1»$ で有意、$«st2»$ で有意でない）。

          **間違えやすい点** 最初の検定が棄却されても、わかるのは「少なくとも 1 つが 0 でない」ことだけで、2 つとも 0 でないとはいえない。
          対数の中は $1-r^2$（相関係数の 2 乗）で、$1-r$ を使うと統計量が大きくなりすぎる。自由度は $i=1$ で $pq=«df1»$、$i=2$ で $(p-1)(q-1)=«df2»$。
