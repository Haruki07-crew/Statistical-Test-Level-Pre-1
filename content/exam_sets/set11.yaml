        type: choice
        question: |
          モデル 2 の勤続年数の係数は «rb_b» で、通常の標準誤差は «rb_se»、不均一分散に頑健なホワイトの標準誤差（HC0 型）は «rb_hc» だった。
          自由度 «rb_df» の $t$ 分布の上側 2.5% 点は «rb_tc» とする。正しい記述はどれか。
        choices:
          - 通常の標準誤差では $t=«rb_t1»$ で 5% 水準で有意だが、頑健標準誤差では $t=«rb_t2»$ で有意でない。不均一分散のおそれがあるなら、勤続年数の効果は 5% 水準で有意とはいえない
          - 頑健標準誤差を使うと係数の推定値も «rb_b» から変わるので、係数を推定し直す必要がある
          - 不均一分散があると最小二乗推定量は偏るので、頑健標準誤差によって偏りを補正した推定値を使う
          - 頑健標準誤差はつねに通常の標準誤差より大きいので、使えば必ず保守的な判断になる
          - 頑健標準誤差でも $t=«rb_b»/«rb_hc»^2=«rb_w»$ となり、5% 水準で有意である
        answer: 0
        distractors:
          - 正解
          - 頑健標準誤差は係数の推定値を変えず、標準誤差だけを変える
          - 不均一分散があっても最小二乗推定量は不偏。問題になるのは標準誤差と効率
          - 誤差の分散がてこ比の小さい観測で大きいときなどは、頑健標準誤差のほうが小さくなることもある
          - 標準誤差ではなく、その 2 乗（分散）で割った
        explanation: |
          **方針** 頑健標準誤差は、係数の分散を $(X^\top X)^{-1}X^\top\mathrm{diag}(e_i^2)X(X^\top X)^{-1}$（サンドイッチ型）で推定したものの平方根。係数の推定値は最小二乗推定値のままで、$t$ 値の分母だけが変わる。

          **途中式**
          $$t_{\text{通常}}=\frac{«rb_b»}{«rb_se»}=«rb_t14»>«rb_tc»,\qquad t_{\text{頑健}}=\frac{«rb_b»}{«rb_hc»}=«rb_t24»<«rb_tc»$$

          **答え** 通常の標準誤差では有意だが、頑健標準誤差では有意でない

          **間違えやすい点** 不均一分散のもとでも最小二乗推定量は不偏だが、通常の標準誤差の式は誤差の等分散を前提にしているので正しくなくなる。2 つの標準誤差が大きく違うことは、不均一分散を疑う手がかりにもなる。
          頑健標準誤差は大標本での近似で、標本が小さいと過小になりやすい（自由度で補正した HC1 型などもある）。

      - id: s11p08c
        chapter: 19
        terms: [omitted-variable-bias, endogeneity, instrumental-variable-method]
        topic: 能力を除いた賃金の回帰で教育年数の係数にかかる除外変数バイアスの大きさを共分散から求めて補正する
        level: 応用
        definition: false
        type: choice
        question: |
          教育が賃金に与える効果を調べるため、モデル $y=\beta_0+\beta_1 S+u$（$S$ は教育年数）を最小二乗法で当てはめると $\hat\beta_1=«ov_b»$ だった。
          ところが、真のモデルは $y=\beta_0+\beta_1S+\gamma A+\varepsilon$（$A$ は標準化した能力の得点、$\varepsilon$ は $S$・$A$ と無相関）だと考えられる。
          別の調査から $\gamma=«ov_g»$、$S$ の分散は «ov_vs»、$S$ と $A$ の共分散は «ov_c» とわかっている。標本は十分大きいとして、能力を除いたことによる偏りを補正した $\beta_1$ の値に最も近いものはどれか。
        choices:
          - "$«ov_ok»$"
          - "$«ov_w1»$"
          - "$«ov_b»$"
          - "$«ov_w3»$"
          - "$«ov_w4»$"
        answer: 0
        distractors:
          - 正解
          - 偏りを引くべきところを足した（偏りの向きを逆にした）
          - 能力は誤差に含まれるだけなので偏りはないと考えた
          - 偏りを足し引きせず、推定値に (1−δ) を掛けた
          - δ を掛けずに γ をそのまま引いた
        explanation: |
          **方針** 説明変数 $A$ を除くと、誤差 $u=\gamma A+\varepsilon$ が $S$ と相関する（内生性）。$S$ だけの回帰の傾きは
          $$\hat\beta_1\ \to\ \beta_1+\gamma\delta,\qquad \delta=\frac{\mathrm{Cov}(S,A)}{V[S]}$$
          に確率収束する（$\delta$ は $A$ を $S$ に回帰したときの傾き）。

          **途中式** $\delta=«ov_c»/«ov_vs»=«ov_d»$、偏りは $\gamma\delta=«ov_g»\times«ov_d»=«ov_bias»$。
          $$\beta_1=«ov_b»-«ov_bias»=«ov_ok»$$

          **答え** $«ov_ok»$

          **間違えやすい点** 偏りの向きは $\gamma$ と $\delta$ の符号の積で決まる。能力が高いほど賃金が高く（$\gamma>0$）、教育年数も長い（$\delta>0$）ので、能力を除いた推定値は上向きに偏っている。
          実際には能力を測れないことが多く、その場合は $S$ と相関し誤差と無相関な操作変数（たとえば通学圏の大学の有無）を使う操作変数法で $\beta_1$ を推定する。

  - id: s11p09
    title: 離職と人事ローテーション
    context: |
      ある企業の人事部が、社員の離職と配属について分析した。
    items:
      - id: s11p09a
        chapter: 18
        terms: [exponential-dispersion-family, link-function, generalized-linear-model]
        topic: ベルヌーイ・ポアソン・ガンマ分布を指数型分散族の形に書いたときの分散関数と正準リンクの組を見分ける
        level: 基本
        definition: true
        type: choice
        question: |
          一般化線形モデルでは、目的変数の分布を指数型分散族 $f(y;\theta,\phi)=\exp\{(y\theta-b(\theta))/a(\phi)+c(y,\phi)\}$ で表す。平均は $\mu=b'(\theta)$、分散は $a(\phi)b''(\theta)$ で、
          $b''(\theta)$ を $\mu$ で表した関数を分散関数 $V(\mu)$、$\theta$ を $\mu$ で表した関数を正準リンクという。
          離職の有無（ベルヌーイ分布）、月の欠勤日数（ポアソン分布）、1 人あたりの採用コスト（ガンマ分布）について、分散関数と正準リンクの組み合わせとして正しいものはどれか（正準リンクは定数倍と符号の違いを除く）。
        choices:
          - 'ベルヌーイ：$V(\mu)=\mu(1-\mu)$、$\log\frac{\mu}{1-\mu}$。ポアソン：$V(\mu)=\mu$、$\log\mu$。ガンマ：$V(\mu)=\mu^2$、$1/\mu$'
          - 'ベルヌーイ：$V(\mu)=\mu(1-\mu)$、$\log\frac{\mu}{1-\mu}$。ポアソン：$V(\mu)=\mu^2$、$\log\mu$。ガンマ：$V(\mu)=\mu^2$、$1/\mu$'
          - 'ベルヌーイ：$V(\mu)=\mu(1-\mu)$、$\log\frac{\mu}{1-\mu}$。ポアソン：$V(\mu)=\mu$、$\log\mu$。ガンマ：$V(\mu)=\mu^2$、$\log\mu$'
          - 'ベルヌーイ：$V(\mu)=\mu(1-\mu)$、$\Phi^{-1}(\mu)$。ポアソン：$V(\mu)=\mu$、$\log\mu$。ガンマ：$V(\mu)=\mu^2$、$1/\mu$'
          - 'ベルヌーイ：$V(\mu)=\mu(1-\mu)$、$\log\frac{\mu}{1-\mu}$。ポアソン：$V(\mu)=\mu$、$\log\mu$。ガンマ：$V(\mu)=\mu$、$1/\mu$'
        answer: 0
        distractors:
          - 正解
          - ポアソン分布の分散関数を μ² とした（ポアソン分布は平均と分散が等しい）
          - ガンマ回帰でよく使う対数リンクを正準リンクと取り違えた
          - プロビットリンクはよく使われるが、ベルヌーイ分布の正準リンクはロジット
          - ガンマ分布の分散関数を μ とした（ガンマ分布は標準偏差が平均に比例する）
        explanation: |
          **方針** 各分布の対数密度を $y\theta-b(\theta)$ の形に整理して $\theta$ と $b(\theta)$ を読み取り、$b''(\theta)$ を $\mu=b'(\theta)$ で表す。

          **途中式**
          - ベルヌーイ：$\log f=y\log\frac{\mu}{1-\mu}+\log(1-\mu)$ より $\theta=\log\frac{\mu}{1-\mu}$、$b(\theta)=\log(1+e^\theta)$、$b''(\theta)=\mu(1-\mu)$。
          - ポアソン：$\log f=y\log\mu-\mu-\log y!$ より $\theta=\log\mu$、$b(\theta)=e^\theta$、$b''(\theta)=\mu$。
          - ガンマ（形状 $\nu$、平均 $\mu$）：$\log f=\nu\{y(-1/\mu)-\log\mu\}+(\mu\text{ によらない項})$ より $\theta=-1/\mu$、$b(\theta)=-\log(-\theta)$、$b''(\theta)=1/\theta^2=\mu^2$、$a(\phi)=1/\nu$。

          **答え** 選択肢 0

          **間違えやすい点** 正準リンクは計算上の性質がよい（十分統計量が $\sum x_iy_i$ になる）だけで、実際にはガンマ回帰の対数リンクやベルヌーイのプロビットリンクのように、正準でないリンクもよく使われる。
          分散関数から、ポアソンでは分散が平均に比例し、ガンマでは標準偏差が平均に比例する（変動係数が一定）ことがわかる。

      - id: s11p09b
        chapter: 14
        terms: [periodicity, stationary-distribution, limiting-distribution]
        topic: 営業と企画・開発を1年ごとに行き来する人事ローテーションの連鎖で周期2のため分布が収束しないことと定常分布を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          この企業の総合職は 1 年ごとに部署を異動する。営業にいる社員は翌年、確率 «q» で企画へ、確率 «q2» で開発へ移り、企画と開発にいる社員は翌年必ず営業に戻る。
          所属部署の推移を、状態「営業・企画・開発」のマルコフ連鎖とみる。正しい記述はどれか。
        choices:
          - "周期が 2 なので定常分布は存在しない"
          - "既約で非周期なので、どの部署から始めても $n$ 年後に営業にいる確率は $n\\to\\infty$ で «piS» に収束する"
          - "既約で周期は 2。定常分布 $(\\pi_{\\text{営業}},\\pi_{\\text{企画}},\\pi_{\\text{開発}})=(«piS»,«piP»,«piD»)$ はただ 1 つ存在するが、営業から始めた社員の $n$ 年後の所属の分布は収束しない。長い期間で営業にいる年の割合は «piS» に近づく"
          - "定常分布は $(\\pi_{\\text{営業}},\\pi_{\\text{企画}},\\pi_{\\text{開発}})=(«w_eq»,«w_eq»,«w_eq»)$ で、$n$ 年後の分布はこれに収束する"
          - "定常分布は $(«piS»,«piP»,«piD»)$ で、周期が 2 なので、企画にいる社員は 2 年後に必ず企画に戻る"
        answer: 2
        distractors:
          - 周期をもつ連鎖には定常分布がないと誤解した
          - 周期を見落とし、既約なら必ず極限分布に収束すると考えた
          - 正解
          - 推移の偏りを無視して3部署を等しいとした
          - 周期 2 を「2 年後に必ず同じ部署に戻る」ことと誤解した（2 年後に企画にいる確率は «q»）
        explanation: |
          **方針** 推移の構造から既約性と周期を調べ、定常分布は $\pi=\pi P$ を解いて求める。周期をもつ既約な有限連鎖では、定常分布はただ 1 つ存在するが、$P^n$ は収束しない。

          **途中式** 推移確率行列（行が今年、列が来年。順に営業・企画・開発）は
          $$P=\begin{pmatrix}0&«q»&«q2»\\1&0&0\\1&0&0\end{pmatrix}$$
          どの部署からどの部署へも行けるので既約。営業に戻れるのは 2, 4, 6, … 年後だけなので周期は 2。
          $\pi=\pi P$ を書くと $\pi_{\text{営業}}=\pi_{\text{企画}}+\pi_{\text{開発}}$、$\pi_{\text{企画}}=«q»\pi_{\text{営業}}$、$\pi_{\text{開発}}=«q2»\pi_{\text{営業}}$。
          和が 1 なので $2\pi_{\text{営業}}=1$、$\pi=(«piS»,«piP»,«piD»)$。
          一方、営業から始めると $n$ が偶数の年は必ず営業、奇数の年は必ず営業以外にいるので、$n$ 年後に営業にいる確率は 1 と 0 を繰り返し収束しない。ただし長い期間のうち営業にいる年の割合は $\pi_{\text{営業}}=«piS»$ に近づく（エルゴード定理）。

          **答え** 選択肢 3（既約で周期 2、定常分布 $(«piS»,«piP»,«piD»)$ は存在するが分布は収束しない）

          **間違えやすい点** 「定常分布が存在する」ことと「$n$ 年後の分布が定常分布に収束する」ことは別。収束には非周期性も要る。
          周期があっても既約な有限連鎖には定常分布がただ 1 つあり、時間平均の意味で長期の割合を表す。

  - id: s11p10
    title: 小論文の採点手順の改善実験
    context: |
      入学試験の小論文の採点の手順を改善するため、4 つの要因 A（採点基準表の詳しさ）、B（採点前の研修の有無）、C（答案を読む順序）、D（1 枚あたりの時間の上限）を
      それぞれ 2 水準として、L8 直交表（第 1〜7 列）で 8 通りの条件を試す。L8 直交表の各列の成分表示は、第 1 列から順に $a$、$b$、$ab$、$c$、$ac$、$bc$、$abc$ である。
    items:
      - id: s11p10a
        chapter: 20
        terms: [orthogonal-array, main-effect-and-interaction, confounding]
        topic: L8直交表でA・B・Cを第1・2・4列に割り付け交互作用A×B・A×C・B×Cを推定したいとき因子Dを割り付けられる列を成分表示から求める
        level: 応用
        definition: false
        type: choice
        question: |
          A を第 1 列、B を第 2 列、C を第 4 列に割り付けた。主効果に加えて交互作用 A×B、A×C、B×C も推定したい（3 因子以上の交互作用と、D を含む交互作用は無視できるとする）。
          D を割り付ける列として正しいものはどれか。
        choices:
          - 第 3 列（D は A×B と交絡するが、主効果の推定を優先する）
          - 第 5 列
          - 第 6 列
          - 第 7 列（D は A×B×C と交絡するが、3 因子交互作用は無視できるので D の主効果を推定できる）
          - 主効果 4 つと交互作用 3 つは 8 通りでは推定できないので、L16 直交表が必要になる
        answer: 3
        distractors:
          - A×B を推定したいのに、その列に D を置くと D と A×B を区別できない
          - 第 5 列は ac で A×C が現れる列
          - 第 6 列は bc で B×C が現れる列
          - 正解
          - 主効果 4 つと交互作用 3 つで自由度は 7 で、L8 の 7 列にちょうど収まる
        explanation: |
          **方針** 2 つの列の交互作用は、成分表示の積（同じ文字の 2 乗は 1 とする）が表す列に現れる。推定したい交互作用が現れる列を空けておき、残った列に D を置く。

          **途中式**
          - A×B：$a\times b=ab$ → 第 3 列
          - A×C：$a\times c=ac$ → 第 5 列
          - B×C：$b\times c=bc$ → 第 6 列

          残りは第 7 列（$abc$）だけなので、D は第 7 列に割り付ける。第 7 列には A×B×C も現れるので D と A×B×C は交絡するが、3 因子交互作用は無視できるので、D の主効果として推定できる。

          **答え** 第 7 列

          **間違えやすい点** D を第 7 列に置くと、たとえば A×D は $a\times abc=bc$ で第 6 列に現れ、B×C と交絡する。D を含む交互作用を無視できるという仮定が必要なのはこのためである。
          交互作用の列を決めずに空いている列へ順に因子を置くと、調べたい交互作用と主効果が交絡してしまう。

  - id: s11p11
    title: 学校を単位にした生活調査
    context: |
      ある地域の中学校 «Nsch» 校を対象に、生徒の生活調査を行う。
    items:
      - id: s11p11a
        chapter: 21
        terms: [horvitz-thompson-estimator, inclusion-probability, sampling-weight]
        topic: 大規模校を必ず含め残りの学校を単純無作為抽出する設計で各校の包含確率を求めホーヴィッツ＝トンプソン推定量で地域の総数を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          生徒数 600 人以上の大規模校 «Nl» 校はすべて調べ（必ず標本に入る）、残りの小規模校 «Ns» 校からは «nsamp» 校を単純無作為に非復元抽出した。
          調べた «nall» 校の 30 日以上欠席した生徒数は次のとおりだった。

          | 区分 | 大規模校 1 | 大規模校 2 | 大規模校 3 | 小規模校 a | 小規模校 b | 小規模校 c | 小規模校 d |
          |---|---|---|---|---|---|---|---|
          | 欠席した生徒数 $y_i$ | «yl1» | «yl2» | «yl3» | «ys1» | «ys2» | «ys3» | «ys4» |

          各校が標本に入る確率（包含確率）$\pi_i$ を使ったホーヴィッツ＝トンプソン推定量 $\hat Y=\sum_{i\in s}y_i/\pi_i$ で、地域全体の 30 日以上欠席した生徒数の総数を推定する。推定値に最も近いものはどれか。
        choices:
          - "$«w_small»$"
          - "$«ht»$"
          - "$«w_pi20»$"
          - "$«w_srs»$"
          - "$«w_all»$"
        answer: 1
        distractors:
          - 大規模校の分を足し忘れ、小規模校の推定だけを答えた
          - 正解
          - 小規模校の包含確率を全学校数で割った 4/20 とした
          - 包含確率の違いを無視し、7 校を 20 校からの単純無作為抽出とみて 20/7 を掛けた
          - 全数調査の大規模校にも小規模校の重み 17/4 を掛けた
        explanation: |
          **方針** ホーヴィッツ＝トンプソン推定量は、各校の値をその学校の包含確率で割って足す。包含確率は学校によって違うので、区分ごとに求める。

          **途中式** 大規模校は必ず標本に入るので $\pi_i=1$。小規模校は «Ns» 校から «nsamp» 校を選ぶ単純無作為抽出なので、どの小規模校も $\pi_i=«pis»$（重み $1/\pi_i=«wexp»$）。
          $$\hat Y=(«yl1»+«yl2»+«yl3»)+\frac{«Ns»}{«nsamp»}\times(«ys1»+«ys2»+«ys3»+«ys4»)=«sl»+«wexp»\times«ss»=«sl»+«tsmall»=«ht»$$

          **答え** $«ht»$

          **間違えやすい点** 小規模校の包含確率の分母は小規模校の数 «Ns» で、全学校数 «Nsch» ではない（«Nsch» とすると $«w_pi20»$）。全数調査の部分は重み 1 のまま足す（大規模校にも重み «wexp» を掛けると $«w_all»$）。
          大規模校を必ず含めているので、«nall» 校を «Nsch» 校からの単純無作為抽出とみて $(«Nsch»/«nall»)\times(«sl»+«ss»)=«w_srs»$ とするのは、欠席者の多い大規模校を過大に代表させて偏る。

      - id: s11p11b
        chapter: 29
        terms: [multiple-imputation, rubins-rules, missing-data-mechanism]
        topic: 家庭学習時間の無回答を5回の多重代入で補ったときにルービンのルールで平均の標準誤差を合成する
        level: 標準
        definition: false
        type: numeric
        question: |
          調査票の「1 週間の家庭学習時間」には無回答があったので、MAR を仮定した多重代入で «m» 通りの完全なデータを作った。
          それぞれのデータで求めた平均家庭学習時間（時間）の推定値と、その標準誤差の 2 乗（代入内分散）は次のとおりだった。

          | 代入 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | 推定値 | «q1» | «q2» | «q3» | «q4» | «q5» |
          | 標準誤差の 2 乗 | «u1» | «u2» | «u3» | «u4» | «u5» |

          ルービンのルールで合成した推定値の標準誤差を求めよ。代入間分散は $m-1$ で割る。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ルービンのルールでは全分散を $T=\bar W+\left(1+\frac1m\right)B$ とする（$\bar W$ は代入内分散の平均、$B$ は推定値の代入間分散）。標準誤差は $\sqrt T$。

          **途中式** 推定値の平均 $\bar q=«qbar»$。偏差は $«dv1»,«dv2»,«dv3»,«dv4»,«dv5»$、偏差の 2 乗和は $«sumdev»$。
          $$B=\frac{«sumdev»}{«m»-1}=«B»,\qquad \bar W=\frac{«u1»+«u2»+«u3»+«u4»+«u5»}{«m»}=«W»$$
          $$T=«W»+\left(1+\frac{1}{«m»}\right)\times«B»=«W»+«fB»=«T»,\qquad \sqrt{«T»}=«se4»$$

          **答え** $«se_s»$

          **間違えやすい点** 代入内分散の平均 $\bar W$ だけを使う（$\sqrt{\bar W}=«w_w»$）と、欠測による不確かさを無視して標準誤差を過小評価する。
          $B$ に掛ける $1+1/m$ を忘れると $«w_wb»$ になる。合成した推定値は $\bar q=«qbar»$ である。

  - id: s11p12
    title: 適性検査の多変量解析
    context: |
      ある会社の適性検査は「言語」と「数理」の 2 分野からなる。
    items:
      - id: s11p12a
        chapter: 22
        terms: [principal-component-analysis, eigenvalue-and-eigenvector, contribution-ratio]
        topic: 2分野の得点の分散共分散行列（標準化しない）の固有値を2次方程式から求め第1主成分の寄与率を出す
        level: 標準
        definition: false
        type: choice
        question: |
          受験者全体の言語と数理の得点の分散共分散行列（相関行列ではない）は
          $$\Sigma=\begin{pmatrix}«s11»&«s12»\\«s12»&«s22»\end{pmatrix}$$
          だった。得点を標準化せず、この分散共分散行列にもとづいて主成分分析を行うとき、第 1 主成分の寄与率に最も近い値はどれか。
        choices:
          - "$«w_l2»$"
          - "$«w_all»$"
          - "$«w_var»$"
          - "$«w_cor»$"
          - "$«cr»$"
        answer: 4
        distractors:
          - 第2主成分の寄与率を答えた
          - 分母に共分散も含めた行列の全成分の和を使った
          - 分散の大きい言語の分散の割合を答えた（共分散を無視した）
          - 相関行列の主成分分析の寄与率 (1+r)/2 を答えた
          - 正解
        explanation: |
          **方針** 主成分の分散は $\Sigma$ の固有値。寄与率は（第 1 固有値）÷（固有値の和＝トレース）。2×2 行列の固有値は特性方程式 $\det(\Sigma-\lambda I)=0$ の解。

          **途中式**
          $$(«s11»-\lambda)(«s22»-\lambda)-«s12»^2=0\iff\lambda=\frac{«s11»+«s22»}{2}\pm\sqrt{\left(\frac{«s11»-«s22»}{2}\right)^2+«s12»^2}=«half»\pm\sqrt{«dh»^2+«s12»^2}=«half»\pm«rad»$$
          よって $\lambda_1=«l1»$、$\lambda_2=«l2»$（和は $«tr»$ でトレースと一致）。
          $$\text{寄与率}=\frac{«l1»}{«tr»}=«cr»$$

          **答え** $«cr»$

          **間違えやすい点** 分母は対角成分の和（総分散）$«s11»+«s22»=«tr»$ で、共分散は含めない。
          相関行列（相関係数 $r=«s12»/\sqrt{«s11»\times«s22»}=«rcor»$）で分析すると寄与率は $(1+r)/2=«w_cor»$ になり、分散共分散行列による値とは一般に違う。

      - id: s11p12b
        chapter: 24
        terms: [k-means-method, non-hierarchical-clustering, distance-measures]
        topic: 6人の2分野の得点にk-means法を初期中心から収束するまで適用したときの群内平方和を求める
        level: 基本
        definition: false
        type: choice
        question: |
          受験者 6 人の（言語, 数理）の得点（各 10 点満点）は次の表のとおりだった。

          | 受験者 | A | B | C | D | E | F |
          |---|---|---|---|---|---|---|
          | 言語 | «Ax» | «Bx» | «Cx» | «Dx» | «Ex» | «Fx» |
          | 数理 | «Ay» | «By» | «Cy» | «Dy» | «Ey» | «Fy» |

          ユークリッド距離による k-means 法（$k=2$）を、A と C を初期の中心として始め、「各点を最も近い中心に割り当てる」「各群の平均を新しい中心にする」を割り当てが変わらなくなるまで繰り返す。
          終了したときの群内平方和（各点と所属する群の中心との距離の 2 乗の、全点についての和）に最も近い値はどれか。
        choices:
          - "$«w_avg»$"
          - "$«w_one»$"
          - "$«W2»$"
          - "$«w_pair»$"
          - "$«W1»$"
        answer: 2
        distractors:
          - 各群の平方和を群の点の数で割った
          - 片方の群の平方和だけを答えた
          - 正解
          - 群内のすべての2点間の距離の2乗の和を使った
          - 1回目の更新で止め、C の割り当て直しをしなかった
        explanation: |
          **方針** 割り当てと中心の更新を交互に行い、割り当てが変わらなくなったときの群内平方和を求める。

          **途中式** 1 回目の割り当て（中心 A$=(«Ax»,«Ay»)$、C$=(«Cx»,«Cy»)$、距離の 2 乗で比べる）：
          B は $«B1»$ 対 $«B2»$ で A 側、D は $«D1»$ 対 $«D2»$、E は $«E1»$ 対 $«E2»$、F は $«F1»$ 対 $«F2»$ でいずれも C 側。
          群 $\{A,B\}$ の中心は $(«m1x»,«m1y»)$、群 $\{C,D,E,F\}$ の中心は $(«m2x»,«m2y»)$（この時点の群内平方和は $«W1»$）。
          2 回目の割り当て：C から 2 つの中心までの距離の 2 乗は $«dC1»$ と $«dC2»$ なので、C は 1 つ目の群に移る（他の点は変わらない）。
          新しい中心は $\{A,B,C\}$ が $(«n1x»,«n1y»)$、$\{D,E,F\}$ が $(«n2x»,«n2y»)$。3 回目の割り当ては変わらないので終了する。
          $$\text{群内平方和}=\underbrace{«wt1»}_{\{A,B,C\}}+\underbrace{«wt2»}_{\{D,E,F\}}=«W2a»+«W2b»=«W2»$$

          **答え** $«W2»$

          **間違えやすい点** 中心を更新したら必ず割り当てをやり直す。1 回目の更新で止めると C が離れた群に残ったままで $«W1»$ になる。
          k-means 法の結果は初期中心によって変わりうる（局所解）。2 点間の距離の 2 乗の和（$«w_pair»$）は群内平方和の群の大きさ倍で、別の量である。

  - id: s11p13
    title: 有効求人倍率の時系列モデル
    context: |
      ある地域の月次の有効求人倍率から季節変動と長期的な傾向を除いた系列 $X_t$ に、定常な AR(2) モデル
      $$X_t=\phi_1X_{t-1}+\phi_2X_{t-2}+\varepsilon_t\quad(\varepsilon_t\text{ はホワイトノイズ})$$
      を当てはめる。標本自己相関は 1 次が $r_1=«r1»$、2 次が $r_2=«r2»$ だった。
    items:
      - id: s11p13a
        chapter: 27
        terms: [yule-walker-equations, ar-model, stationarity-condition]
        topic: 標本自己相関からユール＝ウォーカー方程式でAR(2)の係数を推定し定常条件を確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          ユール＝ウォーカー方程式による $\phi_1,\phi_2$ の推定値と、推定したモデルの定常性について正しい記述はどれか。
        choices:
          - "$\\hat\\phi_1=«r1d»,\\ \\hat\\phi_2=«r2d»$ で、定常条件を満たす"
          - "$\\hat\\phi_1=«r1d»,\\ \\hat\\phi_2=«w_f2»$ で、定常条件を満たす"
          - "$\\hat\\phi_1=«f1»,\\ \\hat\\phi_2=«f2»$ で、$\\hat\\phi_1>1$ なので定常条件を満たさない"
          - "$\\hat\\phi_1=«f1»,\\ \\hat\\phi_2=«f2abs»$ で、定常条件を満たさない"
          - "$\\hat\\phi_1=«f1»,\\ \\hat\\phi_2=«f2»$ で、定常条件を満たす"
        answer: 4
        distractors:
          - 自己相関をそのまま係数とした
          - φ1=r1 とし、φ2 だけを r2-r1^2 とした（分母 1-r1^2 で割らず、φ1 も求め直さなかった）
          - 推定値は正しいが、AR(1) の条件 |φ|<1 を AR(2) の係数に当てはめた
          - φ2 の符号を誤った
          - 正解
        explanation: |
          **方針** AR(2) の自己相関は $\rho_1=\phi_1+\phi_2\rho_1$、$\rho_2=\phi_1\rho_1+\phi_2$ を満たす（ユール＝ウォーカー方程式）。$\rho$ に標本自己相関を入れて連立方程式を解く。
          AR(2) の定常条件は $\phi_1+\phi_2<1$、$\phi_2-\phi_1<1$、$|\phi_2|<1$（特性方程式の根が単位円の外）。

          **途中式** 連立方程式を解くと
          $$\hat\phi_1=\frac{r_1(1-r_2)}{1-r_1^2}=\frac{«r1»\times(1-«r2»)}{1-«r1sq»}=\frac{«n1»}{«den»}=«f1»,\qquad \hat\phi_2=\frac{r_2-r_1^2}{1-r_1^2}=\frac{«r2»-«r1sq»}{«den»}=\frac{«n2»}{«den»}=«f2»$$
          定常条件：$\hat\phi_1+\hat\phi_2=«sum»<1$、$\hat\phi_2-\hat\phi_1=«dif»<1$、$|\hat\phi_2|=«f2abs»<1$ をすべて満たす。

          **答え** $\hat\phi_1=«f1»$、$\hat\phi_2=«f2»$ で定常

          **間違えやすい点** AR(2) では $\phi_1$ が 1 を超えても、$\phi_2$ が負なら定常になりうる。AR(1) の条件 $|\phi|<1$ を係数ごとに当てはめないこと。
          $\hat\phi_2$ は 2 次の偏自己相関係数と同じ値になる。

  - id: s11p14
    title: 研修後の得点を予測するモデルの選択
    context: |
      社員 «n» 人の研修後の得点を、研修時間など 5 つの説明変数の候補を使った重回帰モデル（最小二乗法）で予測する。すべての説明変数を入れたモデル F（切片を含めて係数 «pF» 個）と、変数を減らした 3 つのモデルの残差平方和は次のとおりだった（$p$ は切片を含む係数の数）。

      | モデル | A | B | C | F |
      |---|---|---|---|---|
      | $p$ | «pA» | «pB» | «pC» | «pF» |
      | 残差平方和 | «rA» | «rB» | «rC» | «rF» |
    items:
      - id: s11p14a
        chapter: 30
        terms: [mallows-cp, model-selection, overfitting]
        topic: 4つの候補モデルの残差平方和と全変数モデルから推定した誤差分散でマローズのCpを計算し予測に使うモデルを選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          誤差分散を、すべての変数を入れたモデル F の残差平方和から不偏推定し（$\hat\sigma^2=\mathrm{RSS}_F/(n-p_F)$）、マローズの $C_p=\mathrm{RSS}_p/\hat\sigma^2-n+2p$ が最小のモデルを選ぶ。選ばれるモデルとその $C_p$ の組として正しいものはどれか。
        choices:
          - モデル B（$C_p=«cB»$）
          - モデル F（$C_p=«w_cF»$）
          - モデル F（残差平方和が最も小さいので、$C_p$ を計算するまでもない）
          - モデル B（$C_p=«w_cB»$）
          - モデル C（$C_p$ が $p$ に最も近い）
        answer: 0
        distractors:
          - 正解
          - 誤差分散を n−p_F ではなく n で割って推定した（すべての C_p が大きくなり、F が選ばれる）
          - 残差平方和は変数を増やすほど小さくなるので、それだけでは選べない
          - 係数の数 p に切片を含めず数えた
          - C_p≒p は偏りの小さいモデルの目安で、C_p の最小で選ぶ基準とは別
        explanation: |
          **方針** $C_p$ は、予測の二乗誤差の推定量を $\hat\sigma^2$ で割ったもので、残差平方和（当てはまり）に罰則 $2p$（変数の数）を加えて比べる。$\hat\sigma^2$ は偏りのないモデル F から推定する。

          **途中式** $\hat\sigma^2=«rF»/(«n»-«pF»)=«s2»$。
          $$C_p:\ A=«rA»/«s2»-«n»+«tA»=«cA»,\quad B=«cB»,\quad C=«cC»,\quad F=«cF»$$
          最小はモデル B。

          **答え** モデル B（$C_p=«cB»$）

          **間違えやすい点** モデル F は残差平方和が最小でも、使わない変数の分だけ予測のばらつきが増える。$C_p$ はそのつり合いを測る（AIC と同じ考え方）。
          モデル F では定義から $C_p=p_F$ になる。偏りのないモデルでは $C_p$ がおよそ $p$ になるので、$C_p$ が $p$ より大きく離れたモデル（A）は重要な変数を落としていると疑う。
