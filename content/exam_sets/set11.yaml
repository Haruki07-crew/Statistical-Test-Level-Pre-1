set: 11
title: 模擬試験 第11回
minutes: 90
problems:
  - id: s11p01
    title: 学力テストの信頼性
    context: |
      ある学力テストの観測得点 $X$ を、真の得点 $T$ と測定誤差 $E$ の和 $X=T+E$ で表す（古典的テスト理論）。
      受験者全体で $T$ の平均は «mu»、分散は «vT»、$E$ の平均は 0、分散は «vE» で、$T$ と $E$ は無相関とする。
      テストの**信頼性係数**を「観測得点の分散のうち真の得点の分散が占める割合」$V[T]/V[X]$ と定める。
    items:
      - id: s11p01a
        chapter: 3
        terms: [expectation-variance-properties, covariance-and-correlation]
        topic: 誤差が独立な2つの平行テストの合計点の信頼性係数を分散と共分散の性質から求める
        level: 基本
        definition: false
        type: choice
        question: |
          同じ内容を測る平行テストをもう 1 本作り、その得点を $X_2=T+E_2$ とする（もとのテストは $X_1=T+E_1$）。
          $E_1,E_2$ はどちらも平均 0・分散 «vE» で、互いに、また $T$ とも無相関とする。
          合計点 $S=X_1+X_2$ の真の得点は $2T$ である。$S$ の信頼性係数 $V[2T]/V[S]$ に最も近い値はどれか。
        choices:
          - "$«r_sq»$"
          - "$«r_single»$"
          - "$«relS»$"
          - "$«r_noerr»$"
          - "$«r_half»$"
        answer: 2
        distractors:
          - 1本のテストの信頼性係数を2乗した
          - 1本のテストの信頼性係数のまま（合計しても変わらないと考えた）
          - 正解
          - 誤差の分散を2本分にせず V[S]=4V[T]+V[E] とした
          - 合計点と平均点を混同し、誤差の分散を半分にした
        explanation: |
          **方針** $V[aX+bY]=a^2V[X]+b^2V[Y]+2ab\,\mathrm{Cov}(X,Y)$ を使って、分子 $V[2T]$ と分母 $V[S]$ を別々に求める。

          **途中式** 分子は $V[2T]=4V[T]=4\times«vT»=«v4T»$。
          分母は $S=2T+E_1+E_2$ で、3 つの項は互いに無相関なので
          $$V[S]=4V[T]+V[E_1]+V[E_2]=«v4T»+«vE»+«vE»=«vS»$$
          $$\frac{V[2T]}{V[S]}=\frac{«v4T»}{«vS»}=«relS4»\cdots$$
          1 本のテストの信頼性係数は $\rho=«vT»/«vX»=«rho»$ で、合計点では $2\rho/(1+\rho)=«sb»$ と同じ値になる（スピアマン＝ブラウンの公式）。

          **答え** $«relS»$

          **間違えやすい点** $X_1$ と $X_2$ は同じ $T$ を含むので $\mathrm{Cov}(X_1,X_2)=V[T]=«cov12»$ で、$V[S]\ne 2V[X]$。
          誤差は 2 本分（$2\times«vE»=«v2E»$）入るが、真の得点の分散は 4 倍になるので、合計点の信頼性は 1 本のとき（$«r_single»$）より上がる。誤差を 1 本分しか入れないと $«r_noerr»$ になる。

      - id: s11p01b
        chapter: 6
        terms: [bivariate-normal-distribution, conditional-expectation, normal-distribution]
        topic: 観測得点が合格基準を少し超えた受験者の真の得点が基準未満である確率を2変量正規の条件付き分布で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          （もとの 1 本のテストについて）さらに $T\sim N(«mu»,«vT»)$、$E\sim N(0,«vE»)$（$N(\text{平均},\text{分散})$ と書く）で互いに独立とする。合格基準は «cut» 点である。
          観測得点が $X=«x»$ だった受験者について、真の得点が基準に届いていない確率 $P(T<«cut»\mid X=«x»)$ を求めよ。
          必要なら標準正規分布の分布関数の値 $\Phi(0.10)=«phi10»$ を使え。
        answer: «ans»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $(T,X)$ は 2 変量正規分布に従う。$X=x$ を与えたときの $T$ の条件付き分布は正規分布で、
          平均 $E[T]+\dfrac{\mathrm{Cov}(T,X)}{V[X]}(x-E[X])$、分散 $V[T]-\dfrac{\mathrm{Cov}(T,X)^2}{V[X]}$ である。

          **途中式** $\mathrm{Cov}(T,X)=\mathrm{Cov}(T,T+E)=V[T]=«vT»$、$V[X]=«vT»+«vE»=«vX»$ なので、$\mathrm{Cov}(T,X)/V[X]=«rho»$（信頼性係数）。
          $$E[T\mid X=«x»]=«mu»+«rho»\times(«x»-«mu»)=«mu»+«shr»=«m»$$
          $$V[T\mid X=«x»]=«vT»-\frac{«vT»^2}{«vX»}=«vT»\times(1-«rho»)=«cv»,\qquad \text{標準偏差 } «sd»$$
          $$P(T<«cut»\mid X=«x»)=\Phi\left(\frac{«cut»-«m»}{«sd»}\right)=\Phi(«z»)=«phi10»$$

          **答え** $«ans_s»$

          **間違えやすい点** 観測得点が «x» でも、真の得点の条件付き平均は平均 «mu» の側へ «rho» 倍に縮む（平均への回帰）ので «m» になり、基準 «cut» を下回る。
          縮小を忘れて「真の得点の平均は «x»」とすると確率を小さく見積もってしまう。また、上側 $P(T\ge«cut»\mid X=«x»)=«w_up»$ と取り違えないこと。
          条件付き分散は $V[T]$ でも $V[E]$ でもなく $V[T](1-\rho)=«cv»$ である。

  - id: s11p02
    title: 採用選考と試用期間
    context: |
      ある会社の採用選考について考える。
    items:
      - id: s11p02a
        chapter: 1
        terms: [bayes-theorem, conditional-independence, law-of-total-probability]
        topic: 3人の面接官の多数決で合格した応募者が職務適性をもつ確率を条件付き独立とベイズの定理で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          応募者のうち職務適性のある人の割合は «prior» である。面接官 3 人がそれぞれ合否を判定し、2 人以上が「合格」とした応募者を合格とする。
          適性のある応募者を各面接官が「合格」とする確率は «sens»、適性のない応募者を「合格」とする確率は «fp» で、
          適性の有無を与えたとき 3 人の判定は互いに独立（条件付き独立）とする。合格した応募者が適性をもつ確率を求めよ。
        answer: «post»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 適性の有無それぞれのもとで「2 人以上が合格」とする確率を二項分布で求め、ベイズの定理で逆向きの確率にする。

          **途中式** 適性あり（各人 «sens»）のとき
          $$P(\text{合格}\mid\text{適性あり})=3\times«sens»^2\times«ms»+«sens»^3=«pg2»+«pg3»=«pg»$$
          適性なし（各人 «fp»）のとき
          $$P(\text{合格}\mid\text{適性なし})=3\times«fp»^2\times«mf»+«fp»^3=«pb2»+«pb3»=«pb»$$
          全確率の公式で $P(\text{合格})=«prior»\times«pg»+«q1»\times«pb»=«num»+«bterm»=«den»$。
          $$P(\text{適性あり}\mid\text{合格})=\frac{«num»}{«den»}=«post4»\cdots$$

          **答え** $«post_s»$

          **間違えやすい点** 面接官 1 人だけで判定したときの値 $«w_one»$ と比べ、多数決にすると精度が上がる。3 人全員の合格を条件にすると $«w_all»$ で、多数決（2 人以上）とは違う。
          3 人の判定は「適性を与えたとき」に独立なのであって、無条件では独立でない（同じ応募者を見ているので判定どうしは正の相関をもつ）。

      - id: s11p02b
        chapter: 23
        terms: [roc-curve-and-auc, mann-whitney-u-test]
        topic: 適性検査の得点で定着者と早期離職者を見分けるAUCを全ペアの比較（同点は1/2）で求める
        level: 基本
        definition: false
        type: choice
        question: |
          過去に採用した社員のうち、3 年以上定着した 5 人と 1 年以内に離職した 5 人の適性検査の得点は次のとおりだった。

          | 定着した人 | «st1» | «st2» | «st3» | «st4» | «st5» |
          |---|---|---|---|---|---|
          | 離職した人 | «lv1» | «lv2» | «lv3» | «lv4» | «lv5» |

          「得点が高いほど定着しやすい」とみて得点で 2 群を見分けるとき、ROC 曲線の下の面積（AUC）に最も近い値はどれか。
        choices:
          - "$«auc_inv»$"
          - "$«auc_45»$"
          - "$«auc_notie»$"
          - "$«auc»$"
          - "$«auc_tie1»$"
        answer: 3
        distractors:
          - 離職した人の得点が高い組の割合（1-AUC）を答えた
          - 10人から2人を選ぶ組の数 45 で割った
          - 同点の組を 0 として数えた
          - 正解
          - 同点の組を 1 として数えた
        explanation: |
          **方針** AUC は、定着した人と離職した人を 1 人ずつ選んだとき定着した人の得点のほうが高い確率に等しい（同点は 1/2 と数える）。$5\times5=25$ 組をすべて比べる。

          **途中式** 定着した人それぞれについて、離職した 5 人より高い人数（同点は 0.5）を数えると
          «st1» → «w1»、«st2» → «w2»（«lv3» と同点が 1 組）、«st3» → «w3»、«st4» → «w4»、«st5» → «w5»。
          合計 $«wins»$ 組なので
          $$\text{AUC}=\frac{«wins»}{25}=«auc»$$

          **答え** $«auc»$

          **間違えやすい点** 同点の組（«st2» と «lv3»）は 0 でも 1 でもなく 1/2 と数える（それぞれ $«auc_notie»$、$«auc_tie1»$ になる）。分母は 2 群の組の数 25 で、10 人から 2 人を選ぶ 45 ではない。
          この数え方はマン＝ホイットニーの $U$ 統計量を $n_1n_2$ で割ったものと同じである。

      - id: s11p02c
        chapter: 31
        terms: [beta-binomial-model, predictive-distribution, conjugate-prior]
        topic: 試用期間後の本採用率にベータ事前分布を置き次の2人がともに本採用になる事後予測確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          新入社員が試用期間のあと本採用になる確率を $p$ とし、過去の経験から事前分布をベータ分布 $\mathrm{Beta}(«a0»,«b0»)$（密度 $\propto p^{«a0»-1}(1-p)^{«b0»-1}$）とする。
          今年は «nn» 人のうち «k» 人が本採用になった。$p$ を与えたとき各人の結果は独立とする。
          来年の新入社員のうち 2 人を選んだとき、**2 人とも**本採用になる事後予測確率に最も近い値はどれか。
        choices:
          - "$«mle2»$"
          - "$«pm2»$"
          - "$«pred2»$"
          - "$«prior2»$"
          - "$«pm»$"
        answer: 2
        distractors:
          - 最尤推定値 k/n を2乗した
          - 事後平均を2乗し、2人の結果が p を通して相関することを無視した
          - 正解
          - データで更新せず事前分布のまま予測した
          - 1人が本採用になる予測確率（事後平均）を答えた
        explanation: |
          **方針** ベータ分布は二項尤度の共役事前分布。事後分布を求め、2 人とも本採用になる確率 $p^2$ を事後分布で平均する（$E[p^2]$）。

          **途中式** 事後分布は $\mathrm{Beta}(«a0»+«k»,\ «b0»+«fail»)=\mathrm{Beta}(«a1»,«b1»)$。$\mathrm{Beta}(a,b)$ では $E[p^2]=\dfrac{a(a+1)}{(a+b)(a+b+1)}$ なので
          $$P(\text{2人とも本採用}\mid\text{データ})=E[p^2\mid\text{データ}]=\frac{«a1»\times«a1p»}{«ab1»\times«ab1p»}=\frac{«numc»}{«denc»}=«pred2_4»\cdots$$

          **答え** $«pred2»$

          **間違えやすい点** 事後平均 $«a1»/«ab1»=«pm4»$ を 2 乗した $«pm2»$ は誤り。$E[p^2]=(E[p])^2+V[p]$ で、$p$ が不確かな分だけ（2 人の結果が $p$ を通して正の相関をもつ分だけ）大きくなる。
          事前分布を使わない $(«k»/«nn»)^2=«mle2»$ や、更新前の $«prior2»$ とも区別すること。

  - id: s11p03
    title: 相談窓口の対応時間
    context: |
      ある職業相談窓口では、1 人の相談者への対応が「受付」と「相談」の 2 段階からなる。
      受付の時間 $X_1$ は平均 «m1» 分（レート $\lambda_1=«l1»$）、相談の時間 $X_2$ は平均 «m2» 分（レート $\lambda_2=«l2»$）の指数分布に従い、$X_1$ と $X_2$ は独立とする。
      1 人あたりの対応時間を $Y=X_1+X_2$ とする。
    items:
      - id: s11p03a
        chapter: 4
        terms: [sum-of-random-variables, exponential-distribution, survival-function]
        topic: レートの異なる2つの指数分布の和の密度を畳み込みで求め対応時間が一定時間を超える確率を出す
        level: 標準
        definition: false
        type: choice
        question: |
          $Y$ の密度関数を畳み込みで求め、対応時間が «t» 分を超える確率 $P(Y>«t»)$ を計算せよ。最も近い値はどれか。
          必要なら $e^{-2}=«e2»$、$e^{-5}=«e5»$ を使え。
        choices:
          - "$«w_dens»$"
          - "$«w_nodiv»$"
          - "$«w_one»$"
          - "$«w_max»$"
          - "$«surv»$"
        answer: 4
        distractors:
          - 生存関数ではなく y=10 での密度関数の値を答えた
          - 最後に λ1-λ2 で割るのを忘れた
          - 相談の時間 X2 が 10 分を超える確率だけを答えた
          - 和ではなく、長いほうの時間（最大値）が 10 分を超える確率を求めた
          - 正解
        explanation: |
          **方針** 独立な和の密度は $f_Y(y)=\int_0^y f_{X_1}(u)f_{X_2}(y-u)\,du$。これを $y>t$ で積分して生存関数を求める。

          **途中式**
          $$f_Y(y)=\int_0^y\lambda_1e^{-\lambda_1u}\lambda_2e^{-\lambda_2(y-u)}du=\lambda_1\lambda_2e^{-\lambda_2y}\int_0^ye^{-(\lambda_1-\lambda_2)u}du=\frac{\lambda_1\lambda_2}{\lambda_1-\lambda_2}\left(e^{-\lambda_2y}-e^{-\lambda_1y}\right)$$
          $$P(Y>t)=\int_t^\infty f_Y(y)\,dy=\frac{\lambda_1e^{-\lambda_2t}-\lambda_2e^{-\lambda_1t}}{\lambda_1-\lambda_2}$$
          $\lambda_1=«l1»$、$\lambda_2=«l2»$、$t=«t»$ では $\lambda_2t=2$、$\lambda_1t=5$ なので
          $$P(Y>«t»)=\frac{«l1»\times«e2»-«l2»\times«e5»}{«dl»}=\frac{«a1»-«a2»}{«dl»}=\frac{«num»}{«dl»}=«surv4»$$

          **答え** $«surv»$

          **間違えやすい点** $e^{-\lambda_2 t}$ と $e^{-\lambda_1 t}$ の組み合わせ（係数は相手のレート）を取り違えないこと。$t=0$ を代入して $P(Y>0)=1$ になるかで確かめられる。
          $«w_dens»$ は $y=«t»$ での密度の値で確率ではない。「長いほうの段階が «t» 分を超える」確率 $1-(1-e^{-5})(1-e^{-2})=«w_max»$ は和の分布とは別物である。

      - id: s11p03b
        chapter: 7
        terms: [chebyshev-inequality, weak-law-of-large-numbers, central-limit-theorem]
        topic: 分布を仮定せずチェビシェフの不等式で平均対応時間の誤差を保証する相談者数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          相談者 $n$ 人の対応時間 $Y_1,\ldots,Y_n$ を独立に $Y$ と同じ分布に従うとし、その平均を $\bar Y$ とする。
          分布の形を使わず、$E[Y]$ と $V[Y]$ だけからチェビシェフの不等式で $P(|\bar Y-E[Y]|\ge «eps»)\le «alpha»$ を保証したい。必要な最小の $n$ はどれか。
        choices:
          - "$«n_sd»$"
          - "$«n_clt»$"
          - "$«n_mean»$"
          - "$«n_cheb»$"
          - "$«n_sdsum»$"
        answer: 3
        distractors:
          - 分散の代わりに標準偏差 √29 を使った
          - 中心極限定理による正規近似（1.96^2 V[Y]）で求めた（チェビシェフでは保証にならない）
          - 指数分布の分散を平均と同じとみて V[Y]=7 とした
          - 正解
          - 標準偏差を足して (2+5)^2=49 を分散とした
        explanation: |
          **方針** チェビシェフの不等式 $P(|\bar Y-\mu|\ge\varepsilon)\le V[\bar Y]/\varepsilon^2=V[Y]/(n\varepsilon^2)$ の右辺が «alpha» 以下になる $n$ を求める。

          **途中式** 指数分布の分散は平均の 2 乗なので、独立性から
          $$V[Y]=V[X_1]+V[X_2]=«m1»^2+«m2»^2=«v1»+«v2»=«var»$$
          $$\frac{«var»}{n\times«eps»^2}\le«alpha»\iff n\ge\frac{«var»}{«alpha»}=«n_cheb»$$

          **答え** $«n_cheb»$

          **間違えやすい点** 分散は標準偏差の和の 2 乗ではなく分散の和（$(«m1»+«m2»)^2$ とすると $«n_sdsum»$）。
          中心極限定理を使うと $n\ge1.96^2\times«var»=«n_clt_raw»$ より $«n_clt»$ 人で済むが、これは近似で、分布によらない保証ではない。チェビシェフの不等式はどんな分布でも成り立つ代わりに、必要な $n$ が大きくなる。

  - id: s11p04
    title: 従業員満足度調査
    context: |
      ある会社の従業員満足度調査では、各従業員が 5 段階で回答する。全社の回答の割合は次のとおりで、従業員 «n» 人が独立にこの割合で回答するとする。

      | 非常に満足 | 満足 | どちらでもない | 不満 | 非常に不満 |
      |---|---|---|---|---|
      | «p1» | «p2» | «p3» | «p4» | «p5» |
    items:
      - id: s11p04a
        chapter: 5
        terms: [multinomial-distribution, covariance-and-correlation, binomial-distribution]
        topic: 5段階評価の回答数の多項分布で満足側と不満側の人数の差の分散を負の共分散を含めて求める
        level: 標準
        definition: false
        type: choice
        question: |
          満足側（非常に満足＋満足）の人数を $A$、不満側（不満＋非常に不満）の人数を $B$ とする。人数の差 $D=A-B$ の分散 $V[D]$ に最も近い値はどれか。
        choices:
          - "$«w_sd»$"
          - "$«w_sign»$"
          - "$«w_ind»$"
          - "$«varD»$"
          - "$«w_ez2»$"
        answer: 3
        distractors:
          - 分散ではなく標準偏差を答えた
          - 共分散の符号を正と思い、2Cov を引いた（実質的に共分散を足した）
          - A と B を独立とみて共分散を無視した
          - 正解
          - 1人分の E[Z^2] だけで E[Z]^2 を引き忘れた
        explanation: |
          **方針** 多項分布では、同じ人が両方の区分に入ることはないので、区分をまとめた人数どうしは負の共分散 $\mathrm{Cov}(A,B)=-np_Ap_B$ をもつ。$V[A-B]=V[A]+V[B]-2\mathrm{Cov}(A,B)$ を使う。

          **途中式** $p_A=«p1»+«p2»=«pa»$、$p_B=«p4»+«p5»=«pb»$。
          $$V[A]=«n»\times«pa»\times«qa»=«va»,\quad V[B]=«n»\times«pb»\times«qb»=«vb»,\quad \mathrm{Cov}(A,B)=-«n»\times«pa»\times«pb»=«cov»$$
          $$V[D]=«va»+«vb»-2\times(«cov»)=«va»+«vb»+«covx2»=«varD»$$

          **答え** $«varD»$

          **間違えやすい点** $A$ と $B$ を独立とみると $«w_ind»$ になる。$A$ が増えれば $B$ は減りやすいので共分散は負で、差の分散はかえって大きくなる。

          **別解** 1 人の回答を $Z=+1$（満足側）・$0$・$-1$（不満側）とおくと $D=\sum Z_i$。$E[Z]=«pa»-«pb»=«ez»$、$E[Z^2]=«ez2»$、$V[Z]=«ez2»-«ez»^2=«vz»$ なので $V[D]=«n»\times«vz»=«varD»$。

      - id: s11p04b
        chapter: 12
        terms: [homogeneity-test, pearson-chi-square-statistic, expected-frequency]
        topic: 2部署の満足・中立・不満の構成比が等しいかを2×3分割表の一様性のカイ二乗検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          満足度を「満足・中立・不満」の 3 区分にまとめ、2 つの部署で比べたところ次の表になった。

          | | 満足 | 中立 | 不満 | 計 |
          |---|---|---|---|---|
          | 営業部 | «o11» | «o12» | «o13» | «r1» |
          | 開発部 | «o21» | «o22» | «o23» | «r2» |
          | 計 | «c1» | «c2» | «c3» | «N» |

          2 部署で 3 区分の構成比が等しいという帰無仮説を、ピアソンのカイ二乗統計量を使って有意水準 5% で検定する。正しい記述はどれか。
          カイ二乗分布の上側 5% 点は、自由度 1 で 3.841、自由度 2 で 5.991、自由度 5 で 11.070 である。
        choices:
          - "統計量は $«chi»$ で、自由度 1 の 5% 点 3.841 を上回るので帰無仮説を棄却する"
          - "統計量は $«chi»$ で、自由度 2 の 5% 点 5.991 を下回るので帰無仮説を棄却しない"
          - "統計量は $«chiO»$ で、自由度 2 の 5% 点 5.991 を下回るので帰無仮説を棄却しない"
          - "統計量は $«chi»$ で、自由度 5 の 5% 点 11.070 を下回るので帰無仮説を棄却しない"
          - "統計量は $«chi_row2»$ で、自由度 2 の 5% 点 5.991 を下回るので帰無仮説を棄却しない"
        answer: 1
        distractors:
          - 自由度を (2-1)×(3-1)=2 でなく 1 とした
          - 正解
          - 分母に期待度数ではなく観測度数を使った
          - 自由度をセルの数 6 から 1 を引いた 5 とした
          - 開発部の行だけで統計量を計算した
        explanation: |
          **方針** 帰無仮説のもとの期待度数は（行の計）×（列の計）÷（総数）。$\sum(O-E)^2/E$ を、自由度 $(2-1)(3-1)=2$ のカイ二乗分布と比べる。

          **途中式** 期待度数は営業部 $«e11»,«e12»,«e13»$、開発部 $«e21»,«e22»,«e23»$。
          $$\chi^2=\frac{0^2}{«e11»}+\frac{5^2}{«e12»}+\frac{5^2}{«e13»}+\frac{0^2}{«e21»}+\frac{5^2}{«e22»}+\frac{5^2}{«e23»}=0+«t1»+«t1»+0+«t2»+«t2»=«chi4»$$
          $«chi»<5.991$ なので、5% 水準で帰無仮説を棄却しない。

          **答え** 統計量 $«chi»$、自由度 2、棄却しない

          **間違えやすい点** 自由度は（行数−1）×（列数−1）$=2$。自由度 1 の 3.841 と比べると結論が逆になる。
          分母は期待度数で、観測度数で割ると $«chiO»$ になる。両方の部署の 6 セルすべてを足すこと。

  - id: s11p05
    title: ラッシュモデルによる能力値の推定
    context: |
      ある適性検査では、受験者の能力値を $\theta$、項目 $j$ の困難度を $b_j$ として、項目 $j$ に正答する確率を
      $$P(X_j=1\mid\theta)=\frac{\exp(\theta-b_j)}{1+\exp(\theta-b_j)}$$
      とするラッシュモデル（1 パラメータ・ロジスティックモデル）を使う。項目への正誤は $\theta$ を与えたとき独立とする。
    items:
      - id: s11p05a
        chapter: 8
        terms: [maximum-likelihood-estimator, fisher-information, asymptotic-normality-of-mle, logit-logistic-transformation]
        topic: 困難度が等しい項目のラッシュモデルで能力値の最尤推定値とフィッシャー情報量からワルド型信頼区間の上限を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          困難度がすべて $b=«b»$ の «n» 項目を受けた受験者が «k» 項目に正答した。$\theta$ の最尤推定値 $\hat\theta$ と、
          フィッシャー情報量 $I(\theta)$ に $\hat\theta$ を代入した標準誤差 $1/\sqrt{I(\hat\theta)}$ を求め、$\theta$ の 95% 信頼区間 $\hat\theta\pm1.96\times$（標準誤差）の**上限**を求めよ。
          必要なら $\log 4=«ln4»$（自然対数）を使え。
        answer: «up»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 正答確率を $p(\theta)$ とおくと、対数尤度は二項分布と同じ形になる。スコア関数を 0 とおいて $\hat\theta$ を求め、$I(\theta)=-E[\ell''(\theta)]$ から標準誤差を出す。

          **途中式** $p(\theta)=\dfrac{e^{\theta-b}}{1+e^{\theta-b}}$ とおくと
          $$\ell(\theta)=«k»(\theta-b)-«n»\log\left(1+e^{\theta-b}\right),\qquad \ell'(\theta)=«k»-«n»\,p(\theta),\qquad \ell''(\theta)=-«n»\,p(\theta)\{1-p(\theta)\}$$
          $\ell'(\hat\theta)=0$ より $p(\hat\theta)=«k»/«n»=«phat»$。オッズ $«phat»/(1-«phat»)=«odds»$ なので
          $$\hat\theta=b+\log«odds»=«b»+«ln4»=«th»$$
          $\ell''$ は観測値によらないので $I(\theta)=«n»\,p(1-p)$。$\hat\theta$ では $I(\hat\theta)=«n»\times«pq»=«info»$、標準誤差は $1/\sqrt{«info»}=«se»$。
          $$\text{上限}=«th»+1.96\times«se»=«th»+«hw»=«up4»$$

          **答え** $«up_s»$

          **間違えやすい点** 困難度 $b$ を足し忘れて $\log4$ だけを $\hat\theta$ とすると上限は $«w_theta0»$ になる。
          標準誤差は情報量の逆数の**平方根**（$1/I$ を使うと $«w_nosqrt»$）。情報量は項目数 «n» に比例し、1 項目分 $p(1-p)$ だけを使うと $«w_noN»$ と大きくずれる。

  - id: s11p06
    title: 研修前後の学力
    context: |
      ある企業で、新人研修の運営と効果を調べた。
    items:
      - id: s11p06a
        chapter: 9
        terms: [pivotal-quantity, confidence-interval, one-sided-confidence-limit]
        topic: 一様分布の上端を標本最大値のピボットで区間推定しオンライン研修の参加の遅れの上限の95%信頼区間の上端を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          オンライン研修の各回で、受講者が開始時刻から参加するまでの遅れ（分）は、区間 $[0,\theta]$ の一様分布に従うとする（$\theta$ は未知）。
          独立な «un_n» 回の研修で、無作為に選んだ受講者 1 人ずつの遅れを記録したところ、最大値は $M=«un_M»$ 分だった。
          $M/\theta$ の分布が $\theta$ によらないこと（ピボット）を使って、$P(c\le M/\theta\le1)=0.95$ となる $c$ から $\theta$ の 95% 信頼区間 $[M,\ M/c]$ を作る。この区間の上端 $M/c$ を求めよ。
          必要なら $0.05^{1/8}=«un_c»$、$0.025^{1/8}=«un_c2»$、$0.05^{1/7}=«un_c7»$ を使え。
        answer: «un_U»
        tolerance: 0.01
        answer_format: 分の単位で、小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 独立な $n$ 個の一様分布 $[0,\theta]$ の最大値は $P(M\le m)=(m/\theta)^n$（$0\le m\le\theta$）なので、$M/\theta$ の分布関数は $u^n$（$0\le u\le1$）で $\theta$ によらない。$M/\theta\le1$ は必ず成り立つので、下側の確率が 0.05 になる点 $c$ を求めればよい。

          **途中式** $P(M/\theta<c)=c^{«un_n»}=0.05$ より $c=0.05^{1/«un_n»}=«un_c»$。
          $$c\le\frac M\theta\le1\iff M\le\theta\le\frac Mc,\qquad \frac Mc=\frac{«un_M»}{«un_c»}=«un_U4»$$

          **答え** $«un_U_s»$ 分（区間は $[«un_M»,\ «un_U_s»]$）

          **間違えやすい点** 上側は $M/\theta\le1$ で確率 0 しか残らないので、0.05 をすべて下側に置く。両側に 0.025 ずつと考えて $0.025^{1/8}$ を使うと $«un_w2»$ 分になる。
          指数は標本の大きさ $n=«un_n»$（$n-1$ ではない。$0.05^{1/7}$ を使うと $«un_w7»$ 分）。$c^n=0.95$ と取り違えると $«un_w95»$ 分と、ほとんど幅のない区間になる。

      - id: s11p06b
        chapter: 10
        terms: [likelihood-ratio-test, wilks-theorem, significance-level]
        topic: 研修後のテスト得点の分散が設計値と等しいかを平均既知の正規モデルの尤度比統計量−2logΛとウィルクスの定理で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          全社で使っている研修後テストの得点は、平均 «lr_mu» 点・分散 «lr_s0» の正規分布に従うように作られている。新しい研修の受講者 «lr_n» 人の得点は、平均は «lr_mu» 点のままとみなせるが、ばらつきが変わった可能性がある。
          受講者の得点 $x_i$ について $\sum(x_i-«lr_mu»)^2=«lr_ss»$ だった。平均を «lr_mu» と既知として、帰無仮説 $\sigma^2=«lr_s0»$ を対立仮説 $\sigma^2\ne«lr_s0»$ に対して、
          尤度比検定（ウィルクスの定理によるカイ二乗近似、有意水準 5%）で調べる。必要なら $\log0.6=-0.5108$、$\log(5/3)=0.5108$ と、カイ二乗分布の上側 5% 点（自由度 1 で 3.841、自由度 «lr_n» で 43.77）を使え。正しい記述はどれか。
        choices:
          - '$-2\log\Lambda=«lr_T»$ で、自由度 1 の 3.841 を下回るので、帰無仮説を棄却しない'
          - '$-2\log\Lambda=«lr_w1»$ で、3.841 を上回るので、帰無仮説を棄却する'
          - '$-2\log\Lambda=«lr_w2»$ で、3.841 を上回るので、帰無仮説を棄却する'
          - '$-2\log\Lambda=«lr_T»$ で、自由度 «lr_n» の 43.77 を下回るので、帰無仮説を棄却しない'
          - '$-2\log\Lambda=«lr_T»$ は正なので、対立仮説のもとでの尤度のほうが大きく、帰無仮説を棄却する'
        answer: 0
        distractors:
          - 正解
          - −2logΛ の式の中の −1 の項を落とした
          - 分散の比を σ0²/σ̂² と逆にした
          - 自由度を標本の大きさにした（自由度は帰無仮説で固定した母数の数 1）
          - −2logΛ は最尤推定値の定義から常に 0 以上であり、その大きさを棄却点と比べる必要がある
        explanation: |
          **方針** 平均が既知なので、$\sigma^2$ の最尤推定値は $\hat\sigma^2=\sum(x_i-«lr_mu»)^2/n$。対数尤度は定数を除いて $\ell(\sigma^2)=-\dfrac n2\log\sigma^2-\dfrac{\sum(x_i-«lr_mu»)^2}{2\sigma^2}$ なので
          $$-2\log\Lambda=2\{\ell(\hat\sigma^2)-\ell(\sigma_0^2)\}=n\left\{\frac{\hat\sigma^2}{\sigma_0^2}-1-\log\frac{\hat\sigma^2}{\sigma_0^2}\right\}$$
          帰無仮説で固定した母数は 1 つなので、ウィルクスの定理により近似的に自由度 1 のカイ二乗分布に従う。

          **途中式** $\hat\sigma^2=«lr_ss»/«lr_n»=«lr_sh»$、比は $«lr_sh»/«lr_s0»=«lr_ratio»$。
          $$-2\log\Lambda=«lr_n»\times\{«lr_ratio»-1-(-0.5108)\}=«lr_n»\times«lr_in»=«lr_T4»$$
          自由度 1 の上側 5% 点 3.841 を下回るので棄却しない。

          **答え** $-2\log\Lambda=«lr_T»$ で、帰無仮説を棄却しない

          **間違えやすい点** 自由度は標本の大きさではなく、帰無仮説で値を固定した母数の数。$-2\log\Lambda$ は $\hat\sigma^2/\sigma_0^2$ が 1 から離れるほど大きくなり、比が 1 のとき 0 になる。
          正確な検定では $n\hat\sigma^2/\sigma_0^2=«lr_exact»$ が自由度 «lr_n» のカイ二乗分布に従うことを使い、下側 2.5% 点 16.79 を下回らないので、同じく棄却しない。

