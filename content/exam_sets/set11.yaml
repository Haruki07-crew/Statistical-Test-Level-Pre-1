      残差平方和はモデル 1 が «rss1»、モデル 2 が «rss2» だった。誤差は独立に同じ正規分布に従うとする。
    items:
      - id: s11p08a
        chapter: 16
        terms: [partial-f-test, dummy-variable, multiple-regression-model]
        topic: 職種ダミー3個をまとめて加えたときの賃金の回帰の改善を残差平方和の部分F検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          「職種ダミー 3 個の係数がすべて 0」という帰無仮説を検定する F 統計量の値に最も近いものはどれか。
        choices:
          - "$«F_rss1»$"
          - "$«F»$"
          - "$«F_df55»$"
          - "$«F_df57»$"
          - "$«F_q1»$"
        answer: 1
        distractors:
          - 分母に制約のあるモデル1の残差平方和を使った
          - 正解
          - 分母の自由度で定数項を数え忘れ n-5=55 とした
          - 分母の自由度をモデル1の 60-3=57 とした
          - 分子を制約の数 3 で割り忘れた
        explanation: |
          **方針** 入れ子のモデルの比較では $F=\dfrac{(RSS_1-RSS_2)/q}{RSS_2/(n-k-1)}$。$q$ は 0 とおく係数の数、$k$ は大きいモデルの説明変数の数で、自由度 $(q,\,n-k-1)$ の F 分布に従う。

          **途中式** $q=«q»$、$n-k-1=«n»-«k2»-1=«df2»$。
          $$\frac{RSS_1-RSS_2}{q}=\frac{«drss»}{«q»}=«msn»,\qquad \frac{RSS_2}{n-k-1}=\frac{«rss2»}{«df2»}=«msd»$$
          $$F=\frac{«msn»}{«msd»}=«F4»$$
          F(3, 54) の上側 5% 点は約 2.78 なので、職種は 5% 水準で有意に賃金を説明している。

          **答え** $«F»$

          **間違えやすい点** 分母は大きいモデル（モデル 2）の残差平方和を、その自由度 $n-k-1=«df2»$ で割る。定数項の分の 1 を引き忘れると $«F_df55»$、分子を $q$ で割り忘れると $«F_q1»$ になる。
          ダミー変数は 4 職種なら 3 個で、1 つの職種を基準にする（4 個入れると定数項と完全な多重共線性になる）。

