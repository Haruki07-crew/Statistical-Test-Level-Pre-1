        terms: [one-way-anova, sum-of-squares-decomposition, f-distribution]
        topic: 3台の充填機の一元配置分散分析表を平方和から完成させてF検定する
        level: 基本
        definition: false
        type: choice
        question: |
          各機械の充填量は等分散の正規分布に従うと仮定する。
          「3 台の母平均はすべて等しい」という帰無仮説の $F$ 検定について、正しいものはどれか。
          必要なら $F$ 分布の上側 5% 点 $F_{0.05}(2,15)=«Fc»$、$F_{0.05}(2,17)=«Fc17»$、$F_{0.05}(15,2)=«Fcrev»$ を使え。
        choices:
          - "$F=«F17»$ であり、$«Fc17»$ を超えるので帰無仮説を棄却する"
          - "$F=«Ftot»$ であり、$«Fc»$ を超えないので帰無仮説を棄却しない"
          - "$F=«Fraw»$ であり、$«Fc»$ を超えないので帰無仮説を棄却しない"
          - "$F=«F»$ であり、$«Fcrev»$ を超えないので帰無仮説を棄却しない"
          - "$F=«F»$ であり、$«Fc»$ を超えるので帰無仮説を棄却する"
        answer: 4
        distractors:
          - 誤差の自由度を総自由度 17 にした
          - 総平方和を誤差平方和として使った
          - 平方和どうしをそのまま割り、自由度で割らなかった
          - F 分布の自由度の順番を逆にした
          - 正解
        explanation: |
          **方針** 総平方和 = 機械間平方和 + 誤差平方和 と分解し、それぞれを自由度で割った平均平方の比が $F$ 統計量になる。

          **途中式** 誤差平方和 $=«sst»-«ssa»=«sse»$。自由度は機械間 $3-1=«dfa»$、誤差 $«N»-3=«dfe»$（総自由度 «dft»）。

          | 要因 | 平方和 | 自由度 | 平均平方 |
          |---|---|---|---|
          | 機械 | «ssa» | «dfa» | «msa» |
          | 誤差 | «sse» | «dfe» | «mse» |
          | 計 | «sst» | «dft» | |

          $F=«msa»/«mse»=«F»$ で、自由度 $(«dfa»,«dfe»)$ の $F$ 分布の上側 5% 点 $«Fc»$ を超えるので帰無仮説を棄却する。

          **答え** $F=«F»$、5% で棄却する（3 台の平均充填量には差があるといえる）。

          **間違えやすい点** 誤差の自由度は $N-k=«dfe»$（総自由度 «dft» ではない）。$F$ 分布の自由度は（分子, 分母）=（要因, 誤差）の順で、逆にすると «Fcrev» と比べてしまう。

      - id: s01p05b
        chapter: 9
        terms: [ci-variance-ratio, f-distribution, confidence-interval]
        topic: 2台の充填機の母分散の比の95%信頼区間の下限をF分布で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          分散分析の前提である等分散性を確かめるため、別の日に充填機 A から «na» 本、B から «nb» 本を無作為に取り出したところ、
          不偏分散はそれぞれ $s_A^2=«va»$、$s_B^2=«vb»$（mL²）だった。母分散の比 $\sigma_A^2/\sigma_B^2$ の 95% 信頼区間（両側）の**下限**を求めよ。
          $F$ 分布の上側パーセント点は $F_{0.025}(«dfa1»,«dfb1»)=«fa»$、$F_{0.025}(«dfb1»,«dfa1»)=«fb»$、$F_{0.05}(«dfa1»,«dfb1»)=«f05»$ である（$F(m,n)$ は分子の自由度 $m$、分母の自由度 $n$）。
        answer: «lo»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $\dfrac{s_A^2/\sigma_A^2}{s_B^2/\sigma_B^2}$ は自由度 $(n_A-1,\ n_B-1)=(«dfa1»,«dfb1»)$ の $F$ 分布に従う（ピボット量）。これを $\sigma_A^2/\sigma_B^2$ について解く。

          **途中式** $P\left(\dfrac{s_A^2/s_B^2}{\sigma_A^2/\sigma_B^2}\le F_{0.025}(«dfa1»,«dfb1»)\right)=0.975$ より、下限は
          $$\frac{s_A^2/s_B^2}{F_{0.025}(«dfa1»,«dfb1»)}=\frac{«va»/«vb»}{«fa»}=\frac{«ratio»}{«fa»}=«lo4»\cdots$$
          （上限は $«ratio»\times F_{0.025}(«dfb1»,«dfa1»)=«ratio»\times«fb»=«hi»$。）

          **答え** $«lo»$（区間は 1 を含むので、5% 水準では等分散を否定できない）

          **間違えやすい点** 下限で割るのは自由度が（分子 «dfa1», 分母 «dfb1»）の点 «fa»。自由度を逆にした «fb» で割ると $«lo_w»$ になる。
          両側 95% なので上側 2.5% 点を使う（5% 点 «f05» だと $«lo_05»$ で、90% 区間の下限になる）。

  - id: s01p06
    title: 電子基板の欠陥数の分析
    context: |
      ある工場で出荷前の電子基板 «n» 枚を検査し、1 枚あたりのはんだ欠陥の数を数えた。

      | 欠陥数 | 0 | 1 | 2 | 3 以上 |
      |---|---|---|---|---|
      | 基板の枚数 | «o0» | «o1» | «o2» | «o3» |

      個々の基板の欠陥数から求めた 1 枚あたりの平均欠陥数は «lam» だった。
    items:
      - id: s01p06a
        chapter: 12
        terms: [goodness-of-fit-test, degrees-of-freedom-gof, pearson-chi-square-statistic, expected-frequency]
        topic: 平均を推定したポアソン分布への適合度検定で自由度を正しく数えて判定する
        level: 標準
        definition: false
        type: choice
        question: |
          欠陥数がポアソン分布に従うかを、平均を «lam» と推定したうえで、表の 4 つの区分によるピアソンのカイ二乗適合度検定（有意水準 5%）で調べる。
          $e^{-«lam»}=«e»$ を用い、期待度数は小数第2位まで計算せよ。正しいものはどれか。
          カイ二乗分布の上側 5% 点は、自由度 1, 2, 3, 4 でそれぞれ 3.841, 5.991, 7.815, 9.488 である。
        choices:
          - "統計量は約 $«chi1»$、自由度は 3 で、$7.815$ を超えないので帰無仮説を棄却しない"
          - "統計量は約 $«chi1»$、自由度は 4 で、$9.488$ を超えないので帰無仮説を棄却しない"
          - "統計量は約 $«chi1»$、自由度は 1 で、$3.841$ を超えるので帰無仮説を棄却する"
          - "統計量は約 $«chi1»$、自由度は 2 で、$5.991$ を超えるので帰無仮説を棄却する"
          - "統計量は約 $«chi1»$、自由度は 2 で、$5.991$ を超えるので欠陥数がポアソン分布に従わないことが証明された"
        answer: 3
        distractors:
          - 推定した母数の数を自由度から引き忘れた
          - 区分の数をそのまま自由度にした
          - 推定した母数を 2 つと数えて引きすぎた
          - 正解
          - 棄却は「ポアソン分布ではない」という証拠を得たことであり、「証明された」とは言えない
        explanation: |
          **方針** ポアソン分布の確率から各区分の期待度数を作り、$\sum(O-E)^2/E$ を計算する。自由度は「区分の数 − 1 − 推定した母数の数」。

          **途中式** $p_0=«e»$、$p_1=«lam»\,p_0=«p1»$、$p_2=\dfrac{«lam»}{2}p_1=«p2»$、$p_{3+}=1-p_0-p_1-p_2=«p3»$。
          期待度数は «n» 倍して $«e0»,\ «e1»,\ «e2»,\ «e3»$。各区分の寄与は
          $$\frac{(«o0»-«e0»)^2}{«e0»}=«c0»,\quad\frac{(«o1»-«e1»)^2}{«e1»}=«c1»,\quad\frac{(«o2»-«e2»)^2}{«e2»}=«c2»,\quad\frac{(«o3»-«e3»)^2}{«e3»}=«c3»$$
          合計 $\chi^2=«chi»\approx«chi1»$。自由度は $4-1-1=2$（平均 1 つを推定）。$«chi»>5.991$ なので 5% で棄却する。

          **答え** 統計量 約 $«chi1»$、自由度 2、帰無仮説（ポアソン分布に従う）を棄却する。

          **間違えやすい点** 平均をデータから推定したので自由度が 1 減る。引き忘れて自由度 3 とすると $7.815$ と比べて「棄却しない」と結論が逆になる。
          また、検定で棄却しても「従わないことが証明された」わけではなく、「ポアソン分布と考えるには当てはまりが悪い」という証拠が得られたということである。

      - id: s01p06b
        chapter: 24
        terms: [ward-method, hierarchical-clustering]
        topic: 2つのクラスターをウォード法で併合したときの群内平方和の増加量
        level: 標準
        definition: false
        type: choice
        question: |
          欠陥のあった基板を、2 つの特性（はんだ量のずれ、部品位置のずれ）を標準化した値でクラスター分析している。
          途中の段階で、クラスター P は «na» 枚で重心 $(«ax»,«ay»)$、クラスター Q は «nb» 枚で重心 $(«bx»,«by»)$ である。
          ウォード法で P と Q を併合するとき、群内平方和（各点と所属クラスターの重心とのユークリッド距離の 2 乗の総和）の増加量はいくらか。
        choices:
          - "$«ward»$"
          - "$«ward_nw»$"
          - "$«ward_prod»$"
          - "$«ward_d»$"
          - "$«ward_half»$"
        answer: 0
        distractors:
          - 正解
          - 重み n_P n_Q/(n_P+n_Q) を掛け忘れ、重心間の距離の2乗だけにした
          - 重みを n_P n_Q と分母なしにした
          - 重心間の距離を2乗せずに使った
          - 重みを (n_P+n_Q)/2 とした
        explanation: |
          **方針** 2 つのクラスターを併合したときの群内平方和の増加量は $\Delta=\dfrac{n_Pn_Q}{n_P+n_Q}\,\lVert \bar{\boldsymbol x}_P-\bar{\boldsymbol x}_Q\rVert^2$。ウォード法は、この増加量が最小になる組を順に併合する。

          **途中式** 重心間の距離の 2 乗は $(«bx»-«ax»)^2+(«by»-«ay»)^2=«dx»^2+«dy»^2=«d2»$。重みは $\dfrac{«na»\times«nb»}{«na»+«nb»}=«w»$。
          $$\Delta=«w»\times«d2»=«ward»$$

          **答え** $«ward»$

          **間違えやすい点** 重みを忘れると $«ward_nw»$。重心間の距離（«dx»,«dy» の直角三角形の斜辺で «dist»）を 2 乗し忘れると $«ward_d»$ になる。
          重みは「大きいクラスターどうしほど併合の費用が大きい」ことを表す調和平均型の量で、どちらかが 1 点なら $n/(n+1)$ 倍になる。

  - id: s01p07
    title: 生産設備の状態遷移と保全費用
    context: |
      ある生産設備の状態を毎朝「正常」「劣化」「故障」の 3 つに分類する。翌朝の状態は今朝の状態だけで決まり、遷移確率は次の通りとする（行が今朝、列が翌朝）。
      故障した日は 1 日で修理が終わり、翌朝は必ず正常に戻る。

      | | 正常 | 劣化 | 故障 |
      |---|---|---|---|
      | 正常 | «gg» | «gd» | «gf» |
      | 劣化 | 0 | «dd» | «df» |
      | 故障 | 1 | 0 | 0 |
    items:
      - id: s01p07a
        chapter: 14
        terms: [stationary-distribution, markov-chain, transition-probability-matrix]
        topic: 正常劣化故障の3状態マルコフ連鎖の定常分布から1日あたりの長期平均費用を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          1 日あたりの損失は、劣化の日が «cd» 万円（生産量の低下）、故障の日が «cf» 万円（修理費と停止）、正常の日は 0 円とする。
          長期的に見た 1 日あたりの平均損失（万円）を、定常分布を用いて求めよ。
        answer: «cost»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** この連鎖は既約・非周期（正常→正常の確率が正）なので、長期の平均は定常分布 $\pi=(\pi_G,\pi_D,\pi_F)$ による期待値になる。$\pi=\pi P$ を $\pi_G$ を基準に解く。

          **途中式** 劣化の列：$\pi_D=«gd»\pi_G+«dd»\pi_D$ より $\pi_D=\dfrac{«gd»}{1-«dd»}\pi_G=«rd»\pi_G$。
          故障の列：$\pi_F=«gf»\pi_G+«df»\pi_D=(«gf»+«df»\times«rd»)\pi_G=«rf»\pi_G$。
          合計が 1 なので $\pi_G=\dfrac{1}{1+«rd»+«rf»}=\dfrac{1}{«den»}=«pg»$、$\pi_D=«pd»$、$\pi_F=«pf»$。
          $$\text{平均損失}=«cd»\pi_D+«cf»\pi_F=\frac{«cd»\times«rd»+«cf»\times«rf»}{«den»}=\frac{«num»}{«den»}=«cost4»$$

          **答え** $«cost»$ 万円

          **間違えやすい点** 定常分布は「行」ではなく「列」ごとの釣り合い $\pi_j=\sum_i\pi_iP_{ij}$ で作る。遷移行列の行（たとえば正常の行）をそのまま長期の割合と思わないこと。
          劣化は平均 $1/(1-«dd»)=«dur»$ 日続くので、劣化の日の割合は思ったより大きくなる。

  - id: s01p08
    title: 入院医療費の重回帰分析
    context: |
      ある病院で、患者 «n» 人の入院医療費（万円）を目的変数、年齢・入院日数・手術の有無（ダミー変数）の «p» 個を説明変数として、
      定数項を含む重回帰モデルを最小二乗法で当てはめた。総平方和は «sst»、残差平方和は «sse» だった。誤差は独立に同じ分散の正規分布に従うとする。
    items:
      - id: s01p08a
        chapter: 16
        terms: [overall-f-test-regression, coefficient-of-determination]
        topic: 決定係数から重回帰全体の有意性を調べるF統計量を求める
        level: 基本
        definition: false
        type: choice
        question: |
          「3 つの説明変数の係数がすべて 0」という帰無仮説を検定する $F$ 統計量に最も近い値はどれか。
        choices:
          - "$«F»$"
          - "$«F_np»$"
          - "$«F_nodiv»$"
          - "$«F_swap»$"
          - "$«F_pp»$"
        answer: 0
        distractors:
          - 正解
          - 残差の自由度を n-p とし、定数項の分を引き忘れた
          - 回帰平方和を自由度 p で割り忘れた
          - 回帰と残差を逆にした
          - 回帰の自由度を定数項も含めた p+1 とした
        explanation: |
          **方針** 回帰平方和と残差平方和をそれぞれの自由度（$p$ と $n-p-1$）で割り、その比をとる。決定係数 $R^2$ を使って $F=\dfrac{R^2/p}{(1-R^2)/(n-p-1)}$ とも書ける。

          **途中式** 決定係数 $R^2=1-«sse»/«sst»=«r2»$、回帰平方和 $«sst»-«sse»=«ssr»$。
          $$F=\frac{«ssr»/«p»}{«sse»/«dfe»}=\frac{«msr»}{«mse»}=«F»$$

          **答え** $«F»$（自由度 $(«p»,«dfe»)$ の $F$ 分布の上側 5% 点 «Fc» を大きく超えるので、モデル全体は有意）

          **間違えやすい点** 分子の自由度は説明変数の数 $p=«p»$（定数項は数えない）、分母の自由度は $n-p-1=«dfe»$（定数項の分も引く）。

      - id: s01p08b
        chapter: 17
        terms: [cooks-distance, leverage, standardized-residual]
        topic: てこ比と標準化残差から医療費データの1人のクックの距離を求める
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルで、ある患者のてこ比（ハット行列の対角成分）は $h_{ii}=«h»$、標準化残差 $r_i=\dfrac{e_i}{s\sqrt{1-h_{ii}}}$（$s^2$ は残差平方和を自由度 «dfe» で割った値）は $«rr»$ だった。
          この患者のクックの距離に最も近い値はどれか。
        choices:
          - "$«cook_r»$"
          - "$«cook_p»$"
          - "$«cook_sq»$"
          - "$«cook»$"
          - "$«cook_np»$"
        answer: 3
        distractors:
          - 標準化残差を2乗し忘れた
          - パラメータ数を定数項を除いた p=3 とした
          - h/(1-h) ではなく h/(1-h)^2 を掛けた（e_i で書いた式と混同）
          - 正解
          - パラメータ数 p+1 で割り忘れた
        explanation: |
          **方針** クックの距離は、パラメータ数を $p+1$（定数項を含む）として $D_i=\dfrac{r_i^2}{p+1}\cdot\dfrac{h_{ii}}{1-h_{ii}}$ と、標準化残差とてこ比で表せる。

          **途中式** パラメータ数は $«p»+1=«pp»$。
          $$D_i=\frac{«rr»^2}{«pp»}\times\frac{«h»}{1-«h»}=\frac{«rr2»}{«pp»}\times«hr»=«cook»$$

          **答え** $«cook»$

          **間違えやすい点** 生の残差 $e_i$ で書くと $D_i=\dfrac{e_i^2}{(p+1)s^2}\cdot\dfrac{h_{ii}}{(1-h_{ii})^2}$ で、分母が $(1-h)^2$ になる。標準化残差 $r_i$ を使うときは $(1-h)$ が 1 つ消えるので、式を混同すると $«cook_sq»$ になる。
          なお、てこ比の平均は $(p+1)/n=«hbar»$ で、目安の 2 倍 $«h2»$ を超えるので、この患者は影響の大きい点の候補である。

  - id: s01p09
    title: 生活習慣病の健診データ
    context: |
      ある自治体の健診データを使って、生活習慣病のリスク要因と、2 種類の簡易検査の性能を調べる。
    items:
      - id: s01p09a
        chapter: 18
        terms: [logistic-regression, odds-and-odds-ratio, wald-confidence-interval]
        topic: ロジスティック回帰の喫煙の係数と標準誤差から調整オッズ比の95%信頼区間を求める
        level: 標準
        definition: false
        type: choice
        question: |
          糖尿病の有無を目的変数とし、喫煙（あり = 1）、年齢、BMI を説明変数とするロジスティック回帰を当てはめたところ、喫煙の係数の推定値は «b»、その標準誤差は «se» だった。
          他の変数を固定したときの喫煙のオッズ比の 95% 信頼区間（ワルド型）として最も近いものはどれか。
          標準正規分布の上側 2.5% 点は 1.96、上側 5% 点は 1.645 とし、必要なら次の値を使え。

          | $x$ | 0.262 | 0.357 | 0.550 | 0.850 | 1.150 | 1.344 | 1.438 |
          |---|---|---|---|---|---|---|---|
          | $e^x$ | «eA» | «eB» | «eC» | «eD» | «eE» | «eF» | «eG» |
        choices:
          - "$«ci_ok»$"
          - "$«ci_noexp»$"
          - "$«ci_1se»$"
          - "$«ci_90»$"
          - "$«ci_lin»$"
        answer: 0
        distractors:
          - 正解
          - 係数（対数オッズ比）の区間のまま指数変換しなかった
          - ±1.96SE ではなく ±1SE にした
          - 上側5%点 1.645 を使った（90% 信頼区間）
          - オッズ比 e^0.85 に ±1.96SE を直接足し引きした
        explanation: |
          **方針** 係数 $\hat\beta$ は対数オッズ比。まず $\hat\beta$ の区間を作り、両端を指数変換する（$\exp$ は単調なので区間がそのまま移る）。

          **途中式** $\hat\beta\pm1.96\times\mathrm{SE}=«b»\pm1.96\times«se»=«b»\pm«hw»$ より、対数オッズ比の区間は $(«lo»,\ «hi»)$。
          指数変換して
          $$\left(e^{«lo»},\ e^{«hi»}\right)=\left(«eA»,\ «eG»\right)$$

          **答え** $«ci_ok»$（点推定値は $e^{«b»}=«or»$）

          **間違えやすい点** オッズ比の区間は点推定値 $«or»$ について左右非対称になる。$«or»\pm«hw»$ のように元の尺度で足し引きするのは誤り。
          区間が 1 を含まないので、5% 水準で喫煙の効果は有意といえる。

      - id: s01p09b
        chapter: 28
        terms: [mcnemar-test, two-by-two-table]
        topic: 同じ受診者に行った2つの簡易検査の陽性率をマクネマー検定で比べる
        level: 標準
        definition: false
        type: choice
        question: |
          同じ受診者 «n» 人に簡易検査 A と B の両方を行い、結果を次のようにまとめた。

          | | B 陽性 | B 陰性 |
          |---|---|---|
          | A 陽性 | «a» | «bb» |
          | A 陰性 | «c» | «d» |

          「A と B の陽性率は等しい」という帰無仮説を、**連続修正を行わない**マクネマー検定で調べる。自由度 1 のカイ二乗分布の上側 5% 点は 3.841、上側 1% 点は 6.635 である。正しいものはどれか。
        choices:
          - "統計量は $«mc_cc»$ で、有意水準 5% で有意だが 1% では有意でない"
          - "統計量は $«pear»$ で、有意水準 1% で有意である"
          - "統計量は $«mc»$ で、有意水準 5% で有意だが 1% では有意でない"
          - "統計量は $«mc»$ で、有意水準 1% でも有意である"
          - "統計量は $«z»$ で、有意水準 5% で有意でない"
        answer: 2
        distractors:
          - 指示に反して連続修正 (|b-c|-1)^2/(b+c) を行った
          - 対応のあるデータに通常の独立性のカイ二乗検定を使った
          - 正解
          - 6.43 と 1% 点 6.635 の大小を取り違えた
          - 標準正規の z 値 (b-c)/√(b+c) をカイ二乗の点と比べた
        explanation: |
          **方針** 対応のある 2 値データでは、結果が一致した組（A, B ともに陽性・ともに陰性）は陽性率の差に関係しない。不一致の組 $b$（A のみ陽性）と $c$（B のみ陽性）だけを使い、$\chi^2=(b-c)^2/(b+c)$ を自由度 1 のカイ二乗分布と比べる。

          **途中式** $b=«bb»$、$c=«c»$ より
          $$\chi^2=\frac{(«bb»-«c»)^2}{«bb»+«c»}=\frac{«bmc2»}{«bc»}=«mc»$$
          $3.841<«mc»<6.635$ なので、5% で有意、1% では有意でない。
          （陽性率は A が $«pA»$、B が $«pB»$。）

          **答え** 統計量 $«mc»$、5% で有意だが 1% では有意でない。

          **間違えやすい点** 同じ人の 2 つの検査なので、通常の独立性の検定（$«pear»$）は「A と B の結果が関連しているか」を調べるもので、陽性率の比較にはならない。
          $z=(b-c)/\sqrt{b+c}=«z»$ は標準正規分布と比べる量で、2 乗するとマクネマー統計量になる。

  - id: s01p10
    title: 直交計画の品質データとラッソ
    context: |
      ある部品の強度を 3 つの製造条件（温度・圧力・時間）で説明する線形モデル $y=X\beta+\varepsilon$ を考える。
      実験は直交計画で行い、各列を基準化してあるので計画行列は $X^\top X=I$（単位行列）を満たす。目的変数は中心化してあり、定数項はない。
      最小二乗推定値は $\hat\beta^{\mathrm{OLS}}=(«b1»,\ «b2»,\ «b3»)$ だった。
    items:
      - id: s01p10a
        chapter: 19
        terms: [lasso, ridge-regression, regularization]
        topic: 直交計画のもとでラッソ推定値を最小二乗推定値の軟閾値処理として求める
        level: 応用
        definition: false
        type: choice
        question: |
          罰則つき最小二乗
          $$\hat\beta^{\mathrm{lasso}}=\arg\min_{\beta}\left\{\lVert y-X\beta\rVert^2+\lambda\sum_{j=1}^{3}|\beta_j|\right\},\qquad\lambda=«lam»$$
          の解として正しいものはどれか。
        choices:
          - "$«lam_full»$"
          - "$«ok»$"
          - "$«ridge»$"
          - "$«hard»$"
          - "$«shift»$"
        answer: 1
        distractors:
          - 閾値を λ/2 ではなく λ とした
          - 正解
          - リッジ回帰の解 b/(1+λ) を計算した
          - 閾値以下を0にしただけで、残りを縮小しなかった（硬閾値）
          - 符号を考えず、すべての係数から λ/2 を引いた
        explanation: |
          **方針** $X^\top X=I$ なら $\lVert y-X\beta\rVert^2=\lVert y-X\hat\beta^{\mathrm{OLS}}\rVert^2+\sum_j(\beta_j-b_j)^2$ と分解でき（$b_j$ は最小二乗推定値）、問題が係数ごとに分かれる。
          各 $j$ で $(\beta_j-b_j)^2+\lambda|\beta_j|$ を最小にすればよい。

          **途中式** $\beta_j>0$ の範囲で微分すると $2(\beta_j-b_j)+\lambda=0$ より $\beta_j=b_j-\lambda/2$（これが正のときに限る）。$\beta_j<0$ も同様で、まとめると軟閾値処理
          $$\hat\beta_j=\operatorname{sign}(b_j)\,\max\left(|b_j|-\frac{\lambda}{2},\ 0\right),\qquad \frac{\lambda}{2}=«th»$$
          $b_1=«b1»$ → $«b1»-«th»=«l1»$。$b_2=«b2»$ → $|b_2|=0.6<«th»$ なので 0。$b_3=«b3»$ → $«b3»-«th»=«l3»$。

          **答え** $«ok»$

          **間違えやすい点** 罰則が $\lambda\sum|\beta_j|$（残差平方和に 1/2 が付かない）なので閾値は $\lambda/2$。目的関数を $\frac12\lVert y-X\beta\rVert^2+\lambda\sum|\beta_j|$ と書く流儀では閾値が $\lambda$ になる。
          ラッソは小さい係数をちょうど 0 にし、残りも $\lambda/2$ だけ 0 に近づける。リッジ（罰則 $\lambda\sum\beta_j^2$）は $b_j/(1+\lambda)$ と比例的に縮めるだけで 0 にはならない。

  - id: s01p11
    title: 血液検査値の多変量解析
    context: |
      ある健診では 3 種類の肝機能の検査値を測っている。また、別の研究では 2 種類の検査値を使って、健常者と患者を判別する方法を検討している。
    items:
      - id: s01p11a
        chapter: 22
        terms: [pca-on-correlation-matrix, contribution-ratio, eigenvalue-and-eigenvector]
        topic: 3変数の相関がすべて等しい相関行列の主成分分析で第1主成分の寄与率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          3 種類の検査値の相関係数は、どの 2 つの組でも $«rho»$ だった。相関行列にもとづく主成分分析で、第 1 主成分の寄与率に最も近いものはどれか。
        choices:
          - "$«c_rho»$"
          - "$«c_two»$"
          - "$«c_eq»$"
          - "$«c_ok»$"
          - "$«c_bad»$"
        answer: 3
        distractors:
          - 相関係数の値をそのまま寄与率とした
          - 2 変数のときの式 (1+ρ)/2 を使った
          - 固有値がすべて等しいとして 1/3 とした
          - 正解
          - 最大固有値を 1+pρ（p=3）とした
        explanation: |
          **方針** 相関行列の固有値の和は変数の数（対角成分の和）に等しい。第 1 主成分の寄与率は「最大固有値 ÷ 固有値の和」。

          **途中式** 相関行列は $R=(1-\rho)I+\rho\,\mathbf{1}\mathbf{1}^\top$。$\mathbf{1}=(1,1,1)^\top$ に対して $R\mathbf{1}=(1+2\rho)\mathbf{1}$ なので固有値 $1+2\rho=«lam1»$。
          $\mathbf{1}$ に直交するベクトル $v$ では $Rv=(1-\rho)v$ なので、残り 2 つの固有値は $1-\rho=«lam2»$。
          和は $«lam1»+«lam2»+«lam2»=«tr»$ で、寄与率は
          $$\frac{«lam1»}{«tr»}=«c_ok»$$

          **答え** $«c_ok»$（第 1 主成分は 3 つの検査値の単純な平均に比例する「総合的な肝機能」の軸）

          **間違えやすい点** 2 変数のときの最大固有値 $1+\rho$ をそのまま使うと $«c_two»$ になる。$p$ 変数の等相関行列の最大固有値は $1+(p-1)\rho$。

      - id: s01p11b
        chapter: 23
        terms: [linear-discriminant-analysis, mahalanobis-distance, misclassification-rate]
        topic: 共通の共分散行列をもつ2群の線形判別で群間マハラノビス距離から誤判別確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          2 種類の検査値 $\boldsymbol x$ は、健常群で平均 $(«m11»,«m12»)^\top$、患者群で平均 $(«m21»,«m22»)^\top$、両群共通の共分散行列
          $$\Sigma=\begin{pmatrix}«s11» & «s12»\\ «s12» & «s22»\end{pmatrix}$$
          の 2 変量正規分布に従うとする。事前確率と誤判別の損失が両群で等しいとき、線形判別関数による（最適な）判別で健常者を患者と誤判別する確率に最も近いものはどれか。
          必要なら次の $\Phi(z)$（標準正規分布の分布関数）の値を使え。

          | $z$ | 1.15 | 1.33 | 1.41 | 2.31 | 2.67 |
          |---|---|---|---|---|---|
          | $\Phi(z)$ | «f1» | «f2» | «f3» | «f4» | «f5» |
        choices:
          - "$«e_full»$"
          - "$«e_diag»$"
          - "$«e_ok»$"
          - "$«e_q»$"
          - "$«e_sq»$"
        answer: 2
        distractors:
          - Φ(-Δ/2) ではなく Φ(-Δ) とした
          - 共分散 3 を無視して対角成分だけで距離を計算した
          - 正解
          - 平方根を取らず Δ²/4 を z とした
          - 平方根を取らず Δ²/2 を z とした
        explanation: |
          **方針** 2 群の平均の間のマハラノビス距離を $\Delta$ とすると、等事前確率の線形判別の誤判別確率は $\Phi(-\Delta/2)$。
          判別関数の値は、各群で標準偏差 $\Delta$ の正規分布に従い、平均どうしが $\Delta^2$ 離れており、境界がちょうど中点にあるため。

          **途中式** 平均の差 $\boldsymbol d=(«d1»,«d2»)^\top$。$\det\Sigma=«s11»\times«s22»-«s12»^2=«det»$、
          $\Sigma^{-1}=\dfrac{1}{«det»}\begin{pmatrix}«s22» & -«s12»\\ -«s12» & «s11»\end{pmatrix}$。
          $$\Delta^2=\boldsymbol d^\top\Sigma^{-1}\boldsymbol d=\frac{«s22»\times«d1»^2-2\times«s12»\times«d1»\times«d2»+«s11»\times«d2»^2}{«det»}=\frac{«q1»-«q2»+«q3»}{«det»}=«D2»$$
          $\Delta=\sqrt{«D2»}=«D»$、$\Delta/2=«Dh»\approx«zok»$。誤判別確率は $\Phi(-«zok»)=1-«f1»=«e_ok»$。

          **答え** $«e_ok»$

          **間違えやすい点** 正の相関（共分散 «s12»）があると、2 つの検査値が同じ方向にずれることはよく起こるので、距離は対角成分だけの計算（$\Delta^2=«D2diag»$、誤判別 $«e_diag»$）より小さくなる。
          また、境界は 2 つの平均の中点なので $\Delta$ ではなく $\Delta/2$ を使う。

  - id: s01p12
    title: 日最高気温の偏差の予測
    context: |
      ある地点の日最高気温から季節変動を除いた値（℃）を $X_t$ とし、$X_t$ は定常な AR(1) モデル
      $$X_t=«c»+«phi»X_{t-1}+\varepsilon_t,\qquad \varepsilon_t\sim N(0,«s2»)\ \text{（互いに独立）}$$
      に従うとする。今日（時点 $T$）の値は $X_T=«xT»$ だった。
    items:
      - id: s01p12a
        chapter: 27
        terms: [ar-model, forecasting, stationarity-condition]
        topic: AR1モデルの2期先予測値と予測誤差分散から95%予測区間の上限を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          2 日後の値 $X_{T+2}$ の 95% 予測区間の**上限**を求めよ。モデルの母数は既知とし、標準正規分布の上側 2.5% 点は 1.96 とせよ。
        answer: «up»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $X_{T+2}$ を $X_T$ と未来の誤差 $\varepsilon_{T+1},\varepsilon_{T+2}$ で表す。予測値はその条件付き期待値、予測誤差は未来の誤差の部分。

          **途中式** 平均は $\mu=\dfrac{«c»}{1-«phi»}=«mu»$。$X_t-\mu=«phi»(X_{t-1}-\mu)+\varepsilon_t$ を 2 回使うと
          $$X_{T+2}-\mu=«phi»^2(X_T-\mu)+«phi»\,\varepsilon_{T+1}+\varepsilon_{T+2}$$
          予測値：$\hat X_{T+2}=«mu»+«phi2»\times(«xT»-«mu»)=«mu»+«phi2»\times«dev»=«f2»$。
          予測誤差の分散：$\sigma^2(1+\phi^2)=«s2»\times(1+«phi2»)=«v2»$、標準偏差 $\sqrt{«v2»}=«sd2»$。
          $$\text{上限}=«f2»+1.96\times«sd2»=«f2»+«hw»=«up4»$$

          **答え** $«up_s»$ ℃

          **間違えやすい点** 2 期先の予測誤差には $\varepsilon_{T+1}$ の影響も $\phi$ 倍で残るので、分散は $\sigma^2$ ではなく $\sigma^2(1+\phi^2)$（$\sigma^2$ だけだと上限 $«up_1»$）。
          定常分散 $\sigma^2/(1-\phi^2)$ を使うと $«up_stat»$ になるが、これは遠い将来（予測の情報がない）ときの幅。$\phi$ を 2 乗せず $1+\phi$ とする誤り（$«up_phi»$）にも注意。

  - id: s01p13
    title: 保険契約者の調査と請求件数モデル
    context: |
      ある保険会社が、契約者の年間支払保険料についての調査と、請求件数の統計モデルの見直しを行う。
    items:
      - id: s01p13a
        chapter: 21
        terms: [neyman-allocation, stratified-sampling, proportional-allocation]
        topic: 保険契約者を3層に分けた層別抽出でネイマン配分による層ごとの標本数
        level: 基本
        definition: false
        type: choice
        question: |
          契約者を 3 つの層に分け、全体で «nn» 人を層別無作為抽出して年間支払保険料の平均を推定する。各層の契約者数 $N_h$ と、過去の調査から分かっている層内の標準偏差 $S_h$（万円）は次の通り。

          | 層 | 1（個人・小型車） | 2（個人・大型車） | 3（法人） |
          |---|---|---|---|
          | $N_h$ | «N1» | «N2» | «N3» |
          | $S_h$ | «S1» | «S2» | «S3» |

          調査費用が 1 人あたり同じで、平均の推定量の分散を最小にする配分（ネイマン配分）を用いるとき、層 3 に割り当てる人数に最も近いものはどれか。
        choices:
          - "«a_prop» 人"
          - "«a_ok» 人"
          - "«a_s» 人"
          - "«a_s2» 人"
          - "«a_eq» 人"
        answer: 1
        distractors:
          - 層の大きさだけに比例させた（比例配分）
          - 正解
          - 標準偏差だけに比例させ、層の大きさを掛け忘れた
          - N_h S_h ではなく N_h S_h^2（分散）に比例させた
          - 3 つの層に等しく配分した
        explanation: |
          **方針** ネイマン配分では $n_h=n\dfrac{N_hS_h}{\sum_k N_kS_k}$。層が大きいほど、またばらつきが大きいほど多く割り当てる。

          **途中式** $N_hS_h$ は $«N1»\times«S1»=«NS1»$、$«N2»\times«S2»=«NS2»$、$«N3»\times«S3»=«NS3»$ で、合計 «NSsum»。
          $$n_3=«nn»\times\frac{«NS3»}{«NSsum»}=«ney»$$

          **答え** 約 «a_ok» 人

          **間違えやすい点** 比例配分（$N_h$ だけ）だと «a_prop» 人。層 3 は人数が少なくてもばらつきが大きいので、比例配分より多く割り当てるのがネイマン配分の特徴。比例させるのは標準偏差 $S_h$ で、分散 $S_h^2$ ではない。

      - id: s01p13b
        chapter: 30
        terms: [aic, model-selection, overdispersion]
        topic: ポアソン回帰と負の二項回帰とゼロ過剰モデルを分散母数も数えたAICで比較する
        level: 基本
        definition: false
        type: choice
        question: |
          «nobs» 件の契約の年間請求件数に、同じ 3 つの係数（定数項を含む）の線形予測子をもつ次の 3 つのモデルを最尤法で当てはめた。

          | モデル | 内容 | 最大対数尤度 |
          |---|---|---|
          | A | ポアソン回帰（係数 3 個） | «lA» |
          | B | 負の二項回帰（係数 3 個と分散の母数 1 個） | «lB» |
          | C | ゼロ過剰ポアソン回帰（件数部分の係数 3 個とゼロ部分の係数 3 個） | «lC» |

          $\mathrm{AIC}=-2\times(\text{最大対数尤度})+2\times(\text{推定する母数の数})$ で選ぶとき、選ばれるモデルとその AIC の組として正しいものはどれか。
        choices:
          - "B（AIC $=«aB3»$）"
          - "A（AIC $=«aA»$）"
          - "C（最大対数尤度が最も大きい）"
          - "C（AIC $=«aCk»$）"
          - "A（AIC $=«bicA»$）"
        answer: 1
        distractors:
          - 負の二項回帰の分散の母数を数え忘れ、B の母数を 3 個とした
          - 正解
          - 当てはまり（最大対数尤度）だけで選び、母数の数の罰則を考えなかった
          - 罰則を 2k ではなく k とした
          - AIC ではなく BIC（罰則 k log n）を計算した
        explanation: |
          **方針** 各モデルで推定する母数の数 $k$ を正しく数え、$\mathrm{AIC}=-2\ell+2k$ が最小のモデルを選ぶ。

          **途中式**
          A：$k=«kA»$、$\mathrm{AIC}=«m2A»+2\times«kA»=«aA»$。
          B：$k=«kB»$（分散の母数を含む）、$\mathrm{AIC}=«m2B»+2\times«kB»=«aB»$。
          C：$k=«kC»$、$\mathrm{AIC}=«m2C»+2\times«kC»=«aC»$。
          最小は A。

          **答え** A（AIC $=«aA»$）

          **間違えやすい点** 負の二項回帰の分散（過分散）の母数も推定する母数に数える。数え忘れると B の AIC は $«aB3»$ となり、誤って B を選んでしまう。
          最大対数尤度は母数が多いモデルほど大きくなりやすいので、それだけで選んではいけない。

