set: 1
title: 模擬試験 第1回
minutes: 90
problems:
  - id: s01p01
    title: 部品の欠陥と出荷検査
    context: |
      ある工場で作る部品には、外観の欠陥 $A$、寸法の欠陥 $B$、強度の欠陥 $C$ の 3 種類があり、どれか 1 つでもあれば不良品となる。
      過去の大量の検査記録から、1 個の部品について次の確率がわかっている。

      | 事象 | $A$ | $B$ | $C$ | $A\cap B$ | $A\cap C$ | $B\cap C$ | $A\cap B\cap C$ |
      |---|---|---|---|---|---|---|---|
      | 確率 | «pa» | «pb» | «pc» | «pab» | «pac» | «pbc» | «pabc» |
    items:
      - id: s01p01a
        chapter: 1
        terms: [inclusion-exclusion-principle, independence-of-events]
        topic: 3種類の欠陥の同時確率から包除原理で部品の不良率を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          無作為に選んだ 1 個の部品が不良品である確率を求めよ。
        answer: «union»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「不良品」は $A\cup B\cup C$。3 つの事象の和集合の確率は包除原理で求める。

          **途中式**
          $$P(A\cup B\cup C)=\{P(A)+P(B)+P(C)\}-\{P(A\cap B)+P(A\cap C)+P(B\cap C)\}+P(A\cap B\cap C)$$
          $$=«s1»-«s2»+«pabc»=«union_s»$$

          **答え** $«union_s»$

          **間違えやすい点** 3 つの確率を足しただけ（$«u_sum»$）では、2 つ以上の欠陥をもつ部品を重複して数えている。2 つずつの共通部分を引いたところで止める（$«u_no3»$）と、3 つすべてをもつ部品を引きすぎたままになる。
          また、欠陥どうしを独立とみなして $1-(1-«pa»)(1-«pb»)(1-«pc»)=«u_ind»$ とするのも誤り。実際 $P(A\cap B)=«pab»$ は $P(A)P(B)$ より大きく、欠陥は同時に起こりやすい。

      - id: s01p01b
        chapter: 5
        terms: [hypergeometric-distribution, finite-population-correction, binomial-distribution]
        topic: 不良品を含むロットからの非復元抽出で不良個数の分散を有限母集団修正つきで求める
        level: 標準
        definition: false
        type: choice
        question: |
          出荷前の検査で、«N» 個の部品からなるロット（このうちちょうど «D» 個が不良品）から «n» 個を**非復元**で無作為に抜き取る。
          抜き取った中の不良品の個数を $X$ とするとき、$V[X]$ に最も近い値はどれか。
        choices:
          - "$«varB»$"
          - "$«varW»$"
          - "$«varH»$"
          - "$«meanH»$"
          - "$«sdH»$"
        answer: 2
        distractors:
          - 復元抽出（二項分布）の分散 np(1-p) を使い、有限母集団修正を付け忘れた
          - 有限母集団修正を (N-n)/N と誤って書いた
          - 正解
          - 分散ではなく期待値 np を答えた
          - 分散の平方根（標準偏差）を答えた
        explanation: |
          **方針** 非復元抽出なので $X$ は超幾何分布に従う。超幾何分布の分散は、二項分布の分散に有限母集団修正 $\frac{N-n}{N-1}$ を掛けた形になる。

          **途中式** 不良率 $p=D/N=«D»/«N»=«p»$ とおくと
          $$V[X]=np(1-p)\cdot\frac{N-n}{N-1}=«n»\times«p»\times«q»\times\frac{«fpcN»}{«fpcD»}=«npq»\times«fpc»=«varH4»\cdots$$

          **答え** $«varH»$

          **間違えやすい点** 修正を付け忘れると二項分布の $«varB»$ になる。修正項の分母は $N$ ではなく $N-1$ で、$(N-n)/N$ とすると $«varW»$ になる。期待値 $np=«meanH»$ や標準偏差 $«sdH»$ と取り違えないこと。

      - id: s01p01c
        chapter: 7
        terms: [normal-approximation-binomial-poisson, continuity-correction, central-limit-theorem]
        topic: 1日の不良個数が一定数以上になる確率を連続修正つき正規近似で求める
        level: 標準
        definition: false
        type: choice
        question: |
          この工場のあるラインでは 1 日に «m» 個を作る。各部品が独立に確率 «pr» で不良になるとき、1 日の不良個数 $Y$ が «k» 個以上になる確率 $P(Y\ge «k»)$ を、
          **連続修正を行った**正規近似で求める。最も近い値はどれか。必要なら次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 0.45 | 1.25 | 1.43 | 1.61 |
          |---|---|---|---|---|
          | $\Phi(z)$ | «phiA» | «phiB» | «phiC» | «phiD» |
        choices:
          - "$«c_no»$"
          - "$«c_up»$"
          - "$«c_var»$"
          - "$«c_low»$"
          - "$«c_ok»$"
        answer: 4
        distractors:
          - 連続修正をせず (12-8)/2.8 で標準化した
          - 連続修正の向きを逆にして 12.5 を使った
          - 標準偏差の代わりに分散 7.84 で割った
          - P(Y≦11) の側（余事象）を答えた
          - 正解
        explanation: |
          **方針** $Y\sim B(«m»,«pr»)$ を平均 $np$・分散 $np(1-p)$ の正規分布で近似する。整数値の $Y$ について $Y\ge «k»$ は $Y>«km»$ と同じなので、境界を «km» にして標準化する（連続修正）。

          **途中式** $E[Y]=«m»\times«pr»=«mu»$、$V[Y]=«m»\times«pr»\times(1-«pr»)=«var»$、標準偏差は $\sqrt{«var»}=«sd»$。
          $$P(Y\ge «k»)\approx P\left(Z\ge\frac{«km»-«mu»}{«sd»}\right)=P(Z\ge «zcc»)=1-\Phi(«zcc»)=1-«phiB»=«c_ok4»$$

          **答え** $«c_ok»$

          **間違えやすい点** 連続修正をしないと $z=«zno_raw»\approx«zno»$ で $«c_no»$、修正の向きを逆（«kp»）にすると $«c_up»$ になる。
          「以上」は «k» を含むので、境界は «k» より 0.5 小さい側にとる。分散 «var» で割ると $«c_var»$ になってしまう。

  - id: s01p02
    title: 自動車保険の請求件数と請求額
    context: |
      ある自動車保険で、1 契約あたりの 1 年間の事故請求件数 $N$ の確率母関数が
      $$G(s)=E\left[s^N\right]=\left(\frac{«p»}{1-«q»s}\right)^{«r»}$$
      で与えられているとする（これは「成功確率 «p» の試行で «r» 回成功するまでの失敗回数」を数える負の二項分布である）。
    items:
      - id: s01p02a
        chapter: 2
        terms: [probability-generating-function, negative-binomial-distribution]
        topic: 負の二項分布の確率母関数を2回微分して請求件数の分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          確率母関数 $G(s)$ を用いて $V[N]$ を求めよ。最も近い値はどれか。
        choices:
          - "$«v_mean»$"
          - "$«varN»$"
          - "$«v_g2m»$"
          - "$«v_E2»$"
          - "$«v_plus»$"
        answer: 1
        distractors:
          - 期待値 G'(1) を分散と取り違えた
          - 正解
          - V[N]=G''(1)-G'(1)^2 として G'(1) を足し忘れた
          - E[N^2]=G''(1)+G'(1) を分散と取り違えた
          - G'(1)^2 を引かずに足した
        explanation: |
          **方針** 確率母関数では $G'(1)=E[N]$、$G''(1)=E[N(N-1)]$ である。よって $V[N]=G''(1)+G'(1)-\{G'(1)\}^2$。

          **途中式** $G(s)=«p»^{«r»}(1-«q»s)^{-«r»}$ を微分すると
          $$G'(s)=«r»\cdot«q»\cdot«p»^{«r»}(1-«q»s)^{-«r»-1},\qquad G''(s)=«r»(«r»+1)\cdot«q»^2\cdot«p»^{«r»}(1-«q»s)^{-«r»-2}$$
          $s=1$ を代入すると $1-«q»=«p»$ なので
          $$G'(1)=\frac{«r»\times«q»}{«p»}=«g1»,\qquad G''(1)=\frac{«r»\times(«r»+1)\times«q»^2}{«p»^2}=«g2»$$
          $$V[N]=G''(1)+G'(1)-\{G'(1)\}^2=«g2»+«g1»-«g1sq»=«varN»$$

          **答え** $«varN»$

          **間違えやすい点** $G''(1)$ は $E[N^2]$ ではなく階乗モーメント $E[N(N-1)]$。$G''(1)-\{G'(1)\}^2$ とすると $«v_g2m»$ になる。
          公式 $V[N]=r(1-p)/p^2=«r»\times«q»/«p»^2=«varN»$ と一致することも確かめられる。

      - id: s01p02b
        chapter: 3
        terms: [conditional-variance, conditional-expectation, expectation-variance-properties]
        topic: 件数がランダムな請求総額の分散を全分散の公式で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          1 件あたりの請求額 $X_1,X_2,\ldots$（単位：万円）は互いに独立で同じ分布に従い、平均 «muX»、標準偏差 «sdX» とする。
          また $X_i$ は件数 $N$ とも独立とする。1 契約の年間請求総額 $S=\sum_{i=1}^{N}X_i$（$N=0$ のとき $S=0$）の**標準偏差**を求めよ。
        answer: «sdS»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $N$ で条件づけて全分散の公式 $V[S]=E[V[S\mid N]]+V[E[S\mid N]]$ を使う。$E[N]$ と $V[N]$ は前問の値を使う。

          **途中式** $N=n$ が与えられると $S$ は $n$ 個の独立な和なので
          $E[S\mid N]=N\mu$、$V[S\mid N]=N\sigma^2$（$\mu=«muX»$、$\sigma^2=«varX»$）。
          $$V[S]=E[N]\sigma^2+V[N]\mu^2=«g1»\times«varX»+«varN»\times«muX2»=«t1»+«t2»=«varS»$$
          標準偏差は $\sqrt{«varS»}=«sdS4»\cdots$。

          **答え** $«sdS»$

          **間違えやすい点** 第2項の $V[N]\mu^2$ を忘れて $E[N]\sigma^2$ だけにすると $\sqrt{«t1»}=«sdS_wrong2»$ になる。
          また $V[N]$ の代わりに $E[N]$ を使う（ポアソン分布と思い込む）と $\sqrt{«g1»\times«varX»+«g1»\times«muX2»}=«sdS_wrong»$ になる。分散と標準偏差の取り違えにも注意。

          **別解** 複合分布の積率母関数 $M_S(t)=G(M_X(t))$ を 2 回微分しても同じ式が得られる。

      - id: s01p02c
        chapter: 31
        terms: [gamma-poisson-model, conjugate-prior, posterior-mean-map]
        topic: 契約者ごとの事故率に対するガンマ事前分布と複数年の請求件数から事後平均を求める
        level: 標準
        definition: false
        type: choice
        question: |
          実は上の負の二項分布は、次の階層モデルから生じる。契約者ごとの事故率 $\lambda$ が形状 $\alpha=«alpha»$、**尺度** $\theta=«theta»$ のガンマ分布
          （密度 $\propto\lambda^{\alpha-1}e^{-\lambda/\theta}$、平均 $\alpha\theta=«pmean»$）に従い、$\lambda$ が与えられたとき各年の件数は独立に平均 $\lambda$ のポアソン分布に従う。
          ある契約者は «t» 年間で合計 «y» 件の請求をした。この契約者の $\lambda$ の事後平均に最も近い値はどれか。
        choices:
          - "$«prior»$"
          - "$«wrong_noalpha»$"
          - "$«post»$"
          - "$«mle»$"
          - "$«wrong_rate»$"
        answer: 2
        distractors:
          - データを使わず事前平均 αθ を答えた
          - 事後分布の形状母数に α を足し忘れた
          - 正解
          - 事前分布を無視して最尤推定値 y/t を答えた
          - 尺度 θ をレートと取り違えて θ+t で割った
        explanation: |
          **方針** ガンマ分布はポアソン分布の共役事前分布。尤度 $\propto\lambda^{y}e^{-t\lambda}$ と事前密度を掛けて、事後分布の形状と尺度を読み取る。

          **途中式** レート $1/\theta=«rate»$ を使うと事後密度は
          $$\pi(\lambda\mid y)\propto\lambda^{\alpha-1}e^{-«rate»\lambda}\cdot\lambda^{«y»}e^{-«t»\lambda}=\lambda^{«ay»-1}e^{-«bt»\lambda}$$
          したがって事後分布は形状 $\alpha+y=«ay»$、レート $1/\theta+t=«bt»$（尺度 $«postscale»$）のガンマ分布で、事後平均は
          $$\frac{\alpha+y}{1/\theta+t}=\frac{«ay»}{«bt»}=«post»$$

          **答え** $«post»$

          **間違えやすい点** 尺度 $\theta$ とレート $1/\theta$ の取り違え：$(\alpha+y)/(\theta+t)$ とすると $«wrong_rate»$ になる。事後平均は事前平均 $«prior»$ と最尤推定値 $y/t=«mle»$ の間に入ることを確かめるとよい。
          なお、$\lambda$ を積分消去した $N$ の周辺分布が、問題文の負の二項分布（$r=\alpha=«alpha»$、$p=1/(1+\theta)=«p»$）になっている。

  - id: s01p03
    title: センサー部品の寿命の変換
    context: |
      ある電子部品の寿命 $T$（単位：千時間）はレート $\lambda>0$ の指数分布（密度 $f_T(t)=\lambda e^{-\lambda t}$、$t>0$、平均 $1/\lambda$）に従う。
      この部品を使うセンサーは、劣化の指標として $Y=\sqrt{T}$ を記録している。
    items:
      - id: s01p03a
        chapter: 4
        terms: [change-of-variables, exponential-distribution]
        topic: 指数分布に従う寿命の平方根の密度関数を変数変換で求める
        level: 基本
        definition: false
        type: choice
        question: |
          $Y=\sqrt{T}$ の確率密度関数 $f_Y(y)$（$y>0$）として正しいものはどれか。
        choices:
          - "$\\lambda e^{-\\lambda y^2}$"
          - "$\\dfrac{\\lambda}{2\\sqrt{y}}e^{-\\lambda\\sqrt{y}}$"
          - "$2\\lambda y e^{-\\lambda y}$"
          - "$1-e^{-\\lambda y^2}$"
          - "$2\\lambda y e^{-\\lambda y^2}$"
        answer: 4
        distractors:
          - ヤコビアン dt/dy=2y を掛け忘れた
          - 逆変換の向きを誤り、T=√Y として変換した
          - ヤコビアンは掛けたが、指数部の t に y^2 を代入し忘れた
          - 密度ではなく分布関数を答えた
          - 正解
        explanation: |
          **方針** $y=\sqrt{t}$ は $t>0$ で単調増加なので、逆変換 $t=y^2$ を代入し、ヤコビアン $|dt/dy|$ を掛ける。

          **途中式** $t=y^2$、$\dfrac{dt}{dy}=2y$ より
          $$f_Y(y)=f_T(y^2)\left|\frac{dt}{dy}\right|=\lambda e^{-\lambda y^2}\cdot 2y=2\lambda y e^{-\lambda y^2}\quad(y>0)$$
          確認として、分布関数 $F_Y(y)=P(T\le y^2)=1-e^{-\lambda y^2}$ を $y$ で微分しても同じ式になる。

          **答え** $2\lambda y e^{-\lambda y^2}$（レイリー分布の一種）

          **間違えやすい点** ヤコビアンを掛け忘れると $\lambda e^{-\lambda y^2}$ になり、積分しても 1 にならない。変換の向き（$t$ を $y$ で表す）を逆にしないこと。

      - id: s01p03b
        chapter: 8
        terms: [unbiased-estimator, maximum-likelihood-estimator, gamma-distribution]
        topic: 平方根変換した寿命データでレートの最尤推定量のバイアスを補正し不偏推定量を作る
        level: 応用
        definition: false
        type: numeric
        question: |
          «n» 個のセンサーから独立に $Y_1,\ldots,Y_{«n»}$ を観測したところ、$\sum_{i=1}^{«n»}y_i^2=«sy2»$ だった。
          前問の密度にもとづく $\lambda$ の最尤推定量は $c\big/\sum_{i=1}^{«n»}Y_i^2$ の形をしているが、不偏ではない。
          同じ形 $c\big/\sum Y_i^2$（$c$ は定数）で $\lambda$ の**不偏推定量**となるものを求め、その推定値を答えよ。
          なお、形状 $k\,(>1)$、レート $\lambda$ のガンマ分布（密度 $\propto w^{k-1}e^{-\lambda w}$）に従う $W$ について $E[1/W]=\lambda/(k-1)$ である。
        answer: «unb»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** まず最尤推定量を求める。次に $Y_i^2=T_i$ が指数分布に従うことから $\sum Y_i^2$ の分布（ガンマ分布）を特定し、最尤推定量の期待値を計算してずれを直す。

          **途中式** 対数尤度は
          $$\ell(\lambda)=\sum_{i=1}^{n}\left(\log 2+\log\lambda+\log y_i-\lambda y_i^2\right)=n\log\lambda-\lambda\sum y_i^2+(\text{定数})$$
          $\ell'(\lambda)=\dfrac{n}{\lambda}-\sum y_i^2=0$ より最尤推定量 $\hat\lambda=\dfrac{n}{\sum Y_i^2}$（推定値 $«n»/«sy2»=«mle»$）。
          $Y_i^2=T_i$ はレート $\lambda$ の指数分布（形状 1 のガンマ分布）なので、$W=\sum Y_i^2$ は形状 $n=«n»$、レート $\lambda$ のガンマ分布に従う。よって
          $$E[\hat\lambda]=n\,E\left[\frac1W\right]=\frac{n}{n-1}\lambda\ne\lambda$$
          不偏にするには $c=n-1=«n1»$ とすればよい：
          $$\tilde\lambda=\frac{n-1}{\sum Y_i^2}=\frac{«n1»}{«sy2»}=«unb4»\cdots$$

          **答え** $«unb»$

          **間違えやすい点** 最尤推定量 $«mle»$ は平均的に $\frac{«n»}{«n1»}$ 倍だけ過大になる。$E[1/W]$ を $1/E[W]=\lambda/n$ と置き換えると「最尤推定量は不偏」と誤ってしまう（$E[1/W]\ne1/E[W]$）。
          補正を逆向きに $(n+1)/\sum Y_i^2=«w_p1»$ としないこと。

  - id: s01p04
    title: 降圧薬の臨床試験
    context: |
      新しい降圧薬の効果を調べるため、患者を無作為に新薬群とプラセボ群に分け、8 週間後の収縮期血圧の低下量（mmHg）を測った。
      標準偏差は不偏分散の平方根である。

      | 群 | 人数 | 平均 | 標準偏差 |
      |---|---|---|---|
      | 新薬 | «n1» | «m1» | «s1» |
      | プラセボ | «n2» | «m2» | «s2» |
    items:
      - id: s01p04a
        chapter: 11
        terms: [two-sample-t-test, pooled-variance, welch-test]
        topic: 降圧薬とプラセボの血圧低下量を等分散を仮定した2標本t検定で比べる統計量
        level: 標準
        definition: false
        type: choice
        question: |
          2 群の母分散が等しいと仮定して、母平均の差の 2 標本 $t$ 検定を行う。検定統計量 $t$ の値に最も近いものはどれか。
        choices:
          - "$«t»$"
          - "$«t_sum»$"
          - "$«t_w»$"
          - "$«t_n»$"
          - "$«t_ns»$"
        answer: 0
        distractors:
          - 正解
          - 標準誤差を s1/√n1 + s2/√n2 と標準偏差の和で作った
          - 等分散を仮定しないウェルチの統計量を計算した
          - プールした分散の分母を n1+n2-2 ではなく n1+n2 にした
          - (1/n1+1/n2) に平方根をかけ忘れた
        explanation: |
          **方針** 2 群の平方和を合わせたプールした分散 $s_p^2$ を作り、$t=\dfrac{\bar x_1-\bar x_2}{\sqrt{s_p^2(1/n_1+1/n_2)}}$ を計算する（自由度 $n_1+n_2-2$）。

          **途中式**
          $$s_p^2=\frac{(«n1»-1)\times«s1»^2+(«n2»-1)\times«s2»^2}{«n1»+«n2»-2}=\frac{«ss1»+«ss2»}{«df»}=«sp2»$$
          $$\sqrt{s_p^2\left(\frac{1}{«n1»}+\frac{1}{«n2»}\right)}=\sqrt{«sp2»\times«inv»}=\sqrt{«seq»}=«se»$$
          $$t=\frac{«m1»-«m2»}{«se»}=\frac{«diff»}{«se»}=«t»$$

          **答え** $«t»$（自由度 «df»）

          **間違えやすい点** 等分散を仮定するのでウェルチの式（$\sqrt{s_1^2/n_1+s_2^2/n_2}$ を使うと $«t_w»$）ではない。
          プールした分散の分母は $n_1+n_2-2$（$n_1+n_2$ とすると $«t_n»$）。標準偏差を足し合わせて標準誤差を作るのも誤り（$«t_sum»$）。

      - id: s01p04b
        chapter: 10
        terms: [sample-size-determination-test, power-function, one-sided-two-sided-test]
        topic: 次の臨床試験で片側検定の検出力を確保する1群あたりの例数設計
        level: 標準
        definition: false
        type: numeric
        question: |
          次の試験を計画する。低下量の母標準偏差は両群とも $\sigma=«sig»$ で既知とみなし、各群 $n$ 人ずつとする。
          「新薬群の平均低下量がプラセボ群より大きい」を対立仮説とする**片側**の $z$ 検定を有意水準 5% で行うとき、
          真の差が $\delta=«delta»$ mmHg なら検出力が 0.90 以上になる最小の $n$ を求めよ。
          標準正規分布の上側 5% 点は «za»、上側 10% 点は «zb» とせよ。
        answer: «nreq»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 差の推定量 $\bar X_1-\bar X_2$ の標準偏差は $\sigma\sqrt{2/n}$。棄却域の境界から真の差 $\delta$ までの距離が、上側 10% 点の分だけあればよい。

          **途中式** 有意水準 5% の棄却域は $\bar X_1-\bar X_2>«za»\,\sigma\sqrt{2/n}$。真の差が $\delta$ のとき検出力が 0.90 になる条件は
          $$\delta-«za»\,\sigma\sqrt{2/n}\ge «zb»\,\sigma\sqrt{2/n}\iff n\ge\frac{2\sigma^2(«za»+«zb»)^2}{\delta^2}$$
          $$n\ge\frac{2\times«sig»^2\times«zab»^2}{«delta»^2}=\frac{2\times«sig»^2\times«zab2»}{«delta»^2}=«nraw»$$

          **答え** 切り上げて $n=«nreq»$ 人（各群）。

          **間違えやすい点** 2 群の比較なので分散は $2\sigma^2/n$。1 群の式 $\sigma^2(z_\alpha+z_\beta)^2/\delta^2$ を使うと «n_one» 人になる。
          片側検定なので 5% 点 «za» を使う（両側の 1.960 を使うと «n_two» 人）。また «nraw» を切り捨てて «nlow» にすると検出力が 0.90 を下回る。

