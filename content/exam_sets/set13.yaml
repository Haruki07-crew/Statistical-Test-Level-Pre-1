          - '推定値 $«b3»$、標準誤差 $«w_b3»$'
          - '推定値 $«slope»$、標準誤差 $«se»$'
          - '推定値 $«slope»$、標準誤差 $«w_plus»$'
        answer: 3
        distractors:
          - 都市部以外（u=0）の傾き β1 を答えた
          - 共分散の項を無視して √(V1+V3) とした
          - 交互作用の係数 β3 だけを都市部の傾きと考えた
          - 正解
          - 共分散の符号を誤り、分散から 2Cov を引いた（負の共分散を足すべきところを逆にした）
        explanation: |
          **方針** $u=1$ を代入すると $y=(\beta_0+\beta_2)+(\beta_1+\beta_3)x+\varepsilon$ なので、都市部の傾きは $\beta_1+\beta_3$。その推定量の分散は $V[\hat\beta_1]+V[\hat\beta_3]+2\mathrm{Cov}[\hat\beta_1,\hat\beta_3]$。

          **途中式**
          $$\hat\beta_1+\hat\beta_3=«b1»+(«b3»)=«slope»$$
          $$\widehat V=«v1»+«v3»+2\times(«c13»)=«v1»+«v3»+(«c13x2»)=«var»,\qquad \mathrm{SE}=\sqrt{«var»}=«se6»$$

          **答え** 推定値 $«slope»$、標準誤差 $«se»$（$t$ 値は約 «tval»）

          **間違えやすい点** 交互作用の係数 $\beta_3$ は「都市部とそれ以外の傾きの**差**」で、都市部の傾きそのものではない。
          $\hat\beta_1$ と $\hat\beta_3$ は同じデータから推定されるので相関があり、ここでは共分散が負なので、無視すると標準誤差を $«w_nocov»$ と過大に見積もる。

      - id: s13p08b
        chapter: 17
        terms: [leverage, hat-matrix, outlier-and-influential-point]
        topic: ハット行列のトレースが係数の数に等しいことから残る1市町村のてこ比を求め平均の2倍の目安と比べる
        level: 標準
        definition: false
        type: numeric
        question: |
          切片を含めて係数 5 個の重回帰モデルを «n» 市町村に当てはめた。ハット行列 $H=X(X^\top X)^{-1}X^\top$ の対角成分（てこ比）のうち、
          ある 1 市町村を除く 39 市町村の分の合計は «hsum» だった。残る 1 市町村のてこ比を求めよ。
        answer: «hk»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ハット行列は射影行列で、そのトレース（てこ比の合計）は係数の個数 $p$ に等しい：$\mathrm{tr}(H)=\mathrm{tr}\{(X^\top X)^{-1}X^\top X\}=\mathrm{tr}(I_p)=p$。

          **途中式** $p=5$ なので
          $$h_{kk}=5-«hsum»=«hk_s»$$
          てこ比の平均は $p/n=5/«n»=«hbar»$ で、よく使う目安 $2p/n=«hcut»$ を超える。

          **答え** $«hk_s»$（てこ比の大きい観測で、当てはめへの影響を確認すべき）

          **間違えやすい点** てこ比の合計は観測数 $n$ ではなく係数の数 $p$（切片を含む）。切片を数え忘れて 4 とすると負の値になり、てこ比が 0 以上 1 以下であることに反する。
          てこ比は説明変数の値だけで決まり、目的変数の値（残差）には関係しない。影響の大きさはクックの距離などで残差と合わせて判断する。

      - id: s13p08c
        chapter: 30
        terms: [generalization-error, overfitting, training-test-split, mallows-cp]
        topic: 出生率の重回帰の訓練誤差に楽観度2pσ²/nを加えて同じ説明変数の値での新しい観測に対する予測誤差を推定する
        level: 応用
        definition: false
        type: numeric
        question: |
          切片を含めて $p=«pk»$ 個の係数をもつ重回帰モデルを «n» 市町村に当てはめたところ、残差平方和は «rss» だった。
          同じ説明変数の値で新しく観測される出生率を予測するときの平均二乗予測誤差は、訓練誤差 $RSS/n$ に「楽観度」$2p\sigma^2/n$ を加えたものに期待値として等しい。
          $\sigma^2$ をこのモデルの不偏分散 $RSS/(n-p)$ で推定して、平均二乗予測誤差を推定せよ。
        answer: «pe»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 訓練誤差はモデルを当てはめた同じデータで測るので、新しい観測に対する誤差より平均して $2p\sigma^2/n$ だけ小さい（$E[RSS]=(n-p)\sigma^2$ と、新しい観測の誤差の期待値 $(n+p)\sigma^2$ の差を $n$ で割ったもの）。

          **途中式**
          $$\frac{RSS}{n}=\frac{«rss»}{«n»}=«tr»,\qquad \hat\sigma^2=\frac{«rss»}{«dfe»}=«s2»$$
          $$\frac{2p\hat\sigma^2}{n}=\frac{2\times«pk»\times«s2»}{«n»}=«opt»,\qquad «tr»+«opt»=«pe6»$$

          **答え** $«pe»$

          **間違えやすい点** 訓練誤差 «tr» のままでは予測誤差を過小評価する（過学習ほど差が大きい）。係数の数 $p$ には切片も数える（4 にすると $«w_p4»$）。
          この推定量は $C_p$ 統計量と同じ考え方で、$\frac{RSS}{n}\cdot\frac{n+p}{n-p}$ とも書ける。

  - id: s13p09
    title: 有権者調査による投票参加のモデル
    context: |
      ある市で有権者 800 人に調査を行い、前回の市議会議員選挙で投票したか（投票 $=1$、棄権 $=0$）を調べた。
      目的変数を投票の有無とするロジスティック回帰として、次の 2 つを当てはめた。

      - モデル 1：説明変数は年齢のみ（切片を含めて係数 2 個）。残差逸脱度 «d1»
      - モデル 2：モデル 1 に、居住年数（「5 年未満」「5〜20 年」「20 年以上」の 3 区分、ダミー変数で表す）と自治会加入の有無（ダミー変数 1 個）を加えたもの。残差逸脱度 «d2»
    items:
      - id: s13p09a
        chapter: 18
        terms: [deviance, logistic-regression, likelihood-ratio-test, dummy-variable]
        topic: 投票参加のロジスティック回帰で居住年数（3区分）と自治会加入を加えたときの逸脱度の差による尤度比検定
        level: 標準
        definition: false
        type: choice
        question: |
          「居住年数と自治会加入はどちらも投票に関係しない」を帰無仮説とし、2 つのモデルの残差逸脱度の差を用いた尤度比検定を行う。正しい記述はどれか。
          カイ二乗分布の上側点は、自由度 2 で 5% 点 «c2_05»・1% 点 «c2_01»、自由度 3 で 5% 点 «c3_05»・1% 点 «c3_01» とする。
        choices:
          - '統計量は «lr»、自由度は 2 で、有意水準 1% でも帰無仮説を棄却する'
          - '統計量は «lr_half»、自由度は 3 で、有意水準 5% で帰無仮説を棄却しない'
          - '統計量は «lr»、自由度は 3 で、有意水準 5% では棄却するが 1% では棄却しない'
          - '統計量は «lr_dbl»、自由度は 3 で、有意水準 1% でも帰無仮説を棄却する'
          - '残差逸脱度は説明変数を増やすほど必ず小さくなるので、検定をしなくてもモデル 2 の方がよいと判断できる'
        answer: 2
        distractors:
          - 3 区分の居住年数を 1 個の変数と数え、増えたパラメータを 2 個とした
          - 逸脱度はすでに対数尤度の差の 2 倍なのに、さらに 2 で割った
          - 正解
          - 逸脱度の差をさらに 2 倍した
          - 逸脱度が必ず減ることと、その減り方が偶然の範囲を超えるかどうかを区別していない
        explanation: |
          **方針** 入れ子のモデルでは、残差逸脱度の差 $D_1-D_2=2(\ell_2-\ell_1)$ が尤度比検定統計量で、帰無仮説のもとで自由度＝増えたパラメータ数のカイ二乗分布に近似的に従う。

          **途中式** 統計量は $«d1»-«d2»=«lr»$。増えたパラメータは、3 区分の居住年数のダミー変数 2 個と自治会加入 1 個で計 3 個。
          $«c3_05»<«lr»<«c3_01»$ なので、5% 水準で棄却、1% 水準では棄却しない。

          **答え** 統計量 «lr»、自由度 3、5% 水準で棄却・1% 水準で棄却しない。

          **間違えやすい点** $K$ 区分のカテゴリー変数は $K-1$ 個のダミー変数（パラメータ）として数える。自由度を 2 にすると 1% 点 «c2_01» も超えて結論が変わってしまう。
          逸脱度は $-2\times$対数尤度にもとづく量なので、差がそのまま $2(\ell_2-\ell_1)$ になる。さらに 2 倍したり 2 で割ったりしない。

      - id: s13p09b
        chapter: 23
        terms: [naive-bayes-classifier, bayes-discriminant-rule, conditional-independence]
        topic: 自治会加入・前回投票・年代の3特徴を条件付き独立とみなすナイーブベイズで有権者の投票確率を求める
        level: 基本
        definition: false
        type: choice
        question: |
          同じ調査から、投票した人の割合は «pr» で、各特徴をもつ人の割合は次のとおりだった。

          | | 自治会に加入 | 前回の選挙で投票 | 60 歳以上 |
          |---|---|---|---|
          | 投票した人 | «v1» | «v2» | «v3» |
          | 棄権した人 | «a1» | «a2» | «a3» |

          3 つの特徴は、投票したかどうかを与えたとき条件付き独立とみなす（ナイーブベイズ）。自治会に**加入しておらず**、前回は投票し、60 歳以上の有権者が今回投票する確率の推定値に最も近いものはどれか。
        choices:
          - '$«w_yes»$'
          - '$«w_noprior»$'
          - '$«post»$'
          - '$«w_score»$'
          - '$«w_odds»$'
        answer: 2
        distractors:
          - 「加入していない」のに加入している確率 0.60・0.20 をそのまま使った
          - 事前確率（投票した人の割合 0.6）を掛け忘れた
          - 正解
          - 分子だけ計算し、2 つのクラスの和で割って正規化しなかった
          - 確率ではなく事後オッズ（投票 : 棄権）を答えた
        explanation: |
          **方針** ベイズの定理と条件付き独立から、各クラスで「事前確率 × 各特徴の条件付き確率の積」を計算し、2 つのクラスの和で割る。加入していないので $1-P(\text{加入}\mid\cdot)$ を使う。

          **途中式**
          $$\text{投票}:\ «pr»\times«nv1»\times«v2»\times«v3»=«sv»,\qquad \text{棄権}:\ «pr0»\times«na1»\times«a2»\times«a3»=«sa»$$
          $$P(\text{投票}\mid\text{特徴})=\frac{«sv»}{«sv»+«sa»}=\frac{«sv»}{«ssum»}=«post5»$$

          **答え** $«post»$

          **間違えやすい点** 「加入していない」には $1-0.60=«nv1»$、$1-0.20=«na1»$ を使う（加入の確率のままだと $«w_yes»$）。
          事前確率を掛け忘れると $«w_noprior»$。«sv» は正規化前の値で、確率にするには和 «ssum» で割る。

  - id: s13p10
    title: 職業訓練プログラムの効果の評価
    context: |
      ある県の雇用政策として、求職者向けの職業訓練の効果を調べる。成果の指標は、訓練開始から 1 年後の月収の増加額（万円）とする。
    items:
      - id: s13p10a
        chapter: 20
        terms: [one-way-anova, one-sample-t-test, fisher-three-principles]
        topic: 既存2コースと新コースの平均月収増を事前に計画した対比で比べ一元配置の誤差分散を使うt検定を行う
        level: 標準
        definition: false
        type: choice
        question: |
          既存のコース A、B と新設のコース C に各 «n» 人を無作為に割り付けた。平均の増加額は A «mA»、B «mB»、C «mC» で、一元配置分散分析の誤差の平均平方は «mse»（自由度 «dfe»）だった。
          事前に計画していた比較「C の平均と、A と B の平均の平均との差」$L=\mu_C-\frac12(\mu_A+\mu_B)$ について、$H_0:L=0$ を両側有意水準 5% で検定する。
          $t$ 分布の上側 2.5% 点は $t_{0.025}(«dfe»)=«t27»$、$t_{0.025}(9)=«t9»$ とする。正しい記述はどれか。
        choices:
          - '$t=«w3»$ で、«t27» を超えないので有意でない'
          - '$t=«t»$ で、«t27» を超えるので有意である'
          - '$t=«w1»$ で、«t27» を超えるので有意である'
          - '$t=«wabs»$ で、«t27» を超えないので有意でない'
          - '$t=«t»$ で、自由度 9 の点 «t9» を超えるので有意である'
        answer: 1
        distractors:
          - 対比の係数 (1, −1/2, −1/2) の2乗和を 1.5 ではなく 3 とした
          - 正解
          - 標準誤差を 1 群の平均の標準誤差 √(MSE/n) とし、係数を考えなかった
          - 係数の2乗和ではなく絶対値の和 2 を使った
          - 統計量は正しいが、自由度を 1 群の n−1=9 とした（誤差の自由度 27 を使う）
        explanation: |
          **方針** 対比 $\hat L=\sum c_i\bar y_i$（$\sum c_i=0$）の分散は $\sigma^2\sum c_i^2/n$。$\sigma^2$ を誤差の平均平方で推定し、自由度は誤差の自由度 «dfe» の $t$ 分布で判定する。

          **途中式** 係数は $(c_A,c_B,c_C)=(-\frac12,-\frac12,1)$ で $\sum c_i^2=\frac14+\frac14+1=«c2»$。
          $$\hat L=«mC»-\frac{«mA»+«mB»}{2}=«mC»-«mAB»=«L»$$
          $$\mathrm{SE}=\sqrt{\frac{«mse»\times«c2»}{«n»}}=\sqrt{«inner»}=«se»,\qquad t=\frac{«L»}{«se»}=«t4»$$
          $«t»>«t27»$ なので有意。

          **答え** $t=«t»$ で有意（新コースの方が既存コースの平均より効果が大きい）

          **間違えやすい点** 係数 $-\frac12$ の 2 乗は $\frac14$。2 乗和を 3 とすると $t=«w3»$ で結論が変わる。
          誤差の平均平方は 3 群すべてから求めているので、自由度は «dfe»。事前に 1 つだけ計画した対比なので、多重比較の調整は不要。

      - id: s13p10b
        chapter: 19
        terms: [weighted-least-squares, heteroscedasticity, least-squares-method]
        topic: 訓練実施機関ごとの平均月収増を受講者数で重み付けした加重最小二乗法で訓練時間の傾きを求める
        level: 応用
        definition: false
        type: numeric
        question: |
          個人データが公開されていないため、4 つの訓練実施機関ごとの集計値を使う。$x_i$ は訓練時間（10 時間単位）、$\bar y_i$ は受講者の月収の増加額の平均、$n_i$ は受講者数である。

          | 機関 | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | $x_i$ | «x1» | «x2» | «x3» | «x4» |
          | $\bar y_i$ | «y1» | «y2» | «y3» | «y4» |
          | $n_i$ | «n1» | «n2» | «n3» | «n4» |

          個人の月収の増加額が $y=\beta_0+\beta_1x+\varepsilon$（$\varepsilon$ は独立に分散 $\sigma^2$）に従うとき、$\bar y_i$ の分散は $\sigma^2/n_i$ となる。
          これを考慮した加重最小二乗法による $\beta_1$ の推定値を求めよ。
        answer: «bw»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 誤差分散が $\sigma^2/n_i$ なので、重みは分散の逆数に比例する $w_i=n_i$。加重平均 $\bar x_w,\bar y_w$ のまわりで、重み付きの偏差積和を重み付きの偏差平方和で割る。

          **途中式** $\sum n_i=«W»$、$\bar x_w=«nx»/«W»=«xw»$、$\bar y_w=«ny»/«W»=«yw»$。

          | 機関 | $x_i-\bar x_w$ | $\bar y_i-\bar y_w$ | $n_i(x_i-\bar x_w)(\bar y_i-\bar y_w)$ | $n_i(x_i-\bar x_w)^2$ |
          |---|---|---|---|---|
          | 1 | «dx1» | «dy1» | «pxy1» | «pxx1» |
          | 2 | «dx2» | «dy2» | «pxy2» | «pxx2» |
          | 3 | «dx3» | «dy3» | «pxy3» | «pxx3» |
          | 4 | «dx4» | «dy4» | «pxy4» | «pxx4» |

          $$\hat\beta_1=\frac{«sxy»}{«sxx»}=«bw5»$$

          **答え** $«bw»$

          **間違えやすい点** 機関の平均を同じ重みで扱う通常の最小二乗法では $«bo»$ になり、受講者の少ない機関 1 の値に引っ張られる。
          重みを付けても、中心を加重でない平均 $\bar x=5$ のままにすると $«bwrong»$ とずれる（加重平均を使う）。

  - id: s13p11
    title: 住民意識調査の無回答への対応
    context: |
      ある市が住民 «n» 人を無作為に抽出して郵送で意識調査を行ったところ、«nr» 人から回答があり、«nm» 人は回答しなかった。
      回答者のうち「次の市長選挙に必ず投票する」と答えた割合は «yr» だった。
      無回答の «nm» 人から «f» 人を無作為に選んで調査員が訪問したところ、«f» 人全員から回答が得られ、その割合は «ym» だった。
    items:
      - id: s13p11a
        chapter: 21
        terms: [nonresponse-bias, sampling-and-nonsampling-error, sampling-weight]
        topic: 無回答者の一部を訪問で追跡調査する二相の方法で投票意向率を推定し回答者だけの推定の偏りを見積もる
        level: 標準
        definition: false
        type: choice
        question: |
          回答者と無回答者の 2 つの層に分け、無回答者の層は訪問した «f» 人の結果で代表させて、抽出した «n» 人全体の割合（ひいては市全体の割合）を推定する。推定値に最も近いものはどれか。
        choices:
          - '$«w_resp»$'
          - '$«w_pool»$'
          - '$«est»$'
          - '$«w_avg»$'
          - '$«w_fu»$'
        answer: 2
        distractors:
          - 無回答を無視して回答者だけの割合を使った
          - 回答者 600 人と訪問した 100 人をそのまま合わせて割合を計算した（訪問した人は無回答者 400 人を代表するので重みが足りない）
          - 正解
          - 2 つの層の大きさを考えずに割合を単純平均した
          - 訪問調査の結果だけを使った
        explanation: |
          **方針** 抽出した «n» 人は「回答者 «nr» 人」と「無回答者 «nm» 人」の 2 層に分かれる。無回答者の層の割合は、そこから無作為に選んだ «f» 人の結果で推定できる。層の大きさの比で重み付けして足す（ハンセン・ハーヴィッツの方法）。

          **途中式**
          $$\hat p=\frac{«nr»}{«n»}\times«yr»+\frac{«nm»}{«n»}\times«ym»=«wr»\times«yr»+«wm»\times«ym»=«t1»+«t2»=«est»$$

          **答え** $«est»$

          **間違えやすい点** 回答者だけの割合 «yr» は、回答した人ほど投票意向が強いため、約 «bias» だけ過大になっている（無回答による偏り）。この偏りは回答者を増やしても消えない非標本誤差。
          訪問した «f» 人は無回答者 «nm» 人を代表するので、1 人あたり «k» 倍の重みをもつ。回答者と訪問者を同じ重みで合わせると $(«c1»+«c2»)/700=«w_pool»$ になってしまう。

  - id: s13p12
    title: 地域指標による市区町村の類型化
    context: |
      地域政策の基礎資料として、市区町村の特徴を表す指標を多変量解析で整理する。
    items:
      - id: s13p12a
        chapter: 24
        terms: [single-linkage, dendrogram, hierarchical-clustering, complete-linkage]
        topic: 5地域の距離行列に最短距離法を適用し最後の併合の高さとデンドログラムを切ったときのクラスターを求める
        level: 基本
        definition: false
        type: choice
        question: |
          5 つの地域 A〜E の指標から求めた距離は次のとおりである。

          | | A | B | C | D | E |
          |---|---|---|---|---|---|
          | A | 0 | «dAB» | «dAC» | «dAD» | «dAE» |
          | B | | 0 | «dBC» | «dBD» | «dBE» |
          | C | | | 0 | «dCD» | «dCE» |
          | D | | | | 0 | «dDE» |

          **最短距離法**（クラスター間の距離を、属する地域どうしの距離の最小値とする）で階層的クラスタリングを行う。正しい記述はどれか。
        choices:
          - '最後の併合の高さは «h_comp» である'
          - '最後の併合の高さは «h_single» で、高さ 4.5 でデンドログラムを切ると $\{A,B\}$、$\{C,D,E\}$ の 2 つのクラスターになる'
          - '最後の併合の高さは «h_single» で、高さ 4.5 でデンドログラムを切ると $\{A,B\}$、$\{C\}$、$\{D,E\}$ の 3 つのクラスターになる'
          - '最後の併合の高さは «h_avg» である'
          - '最後の併合の高さは 4.0 である'
        answer: 1
        distractors:
          - 最長距離法（距離の最大値）で計算した
          - 正解
          - C と {D,E} の併合（高さ 4.0）を見落とした
          - 群平均法（全組の距離の平均）で計算した
          - 3 回目の併合（C と {D,E}）を最後の併合と取り違えた
        explanation: |
          **方針** 最も近いクラスターの組を順に併合し、併合のたびにクラスター間の距離を「最小値」で更新する。

          **途中式**
          1. 最小の距離は A–B の «dAB» → $\{A,B\}$ を高さ «dAB» で併合。
          2. 残りで最小は D–E の «dDE» → $\{D,E\}$ を高さ «dDE» で併合。
          3. 距離を更新：$d(\{A,B\},C)=\min(«dAC»,«dBC»)=«dBC»$、$d(C,\{D,E\})=\min(«dCD»,«dCE»)=«dCD»$、$d(\{A,B\},\{D,E\})=\min(«dAD»,«dAE»,«dBD»,«dBE»)=«dBE»$。最小は «dCD» → $\{C,D,E\}$ を高さ «dCD» で併合。
          4. $d(\{A,B\},\{C,D,E\})=\min(«dBC»,«dBE»)=«dBC»$ → 高さ «dBC» で全体を併合。

          高さ 4.5 で切ると、4.5 以下で併合された $\{A,B\}$ と $\{C,D,E\}$ の 2 つになる。

          **答え** 最後の併合の高さ «h_single»、4.5 で切ると 2 つのクラスター。

          **間違えやすい点** 最長距離法なら最後は «h_comp»、群平均法なら «h_avg» と、方法によって高さが変わる。
          最短距離法は鎖のように 1 つずつつながる「連鎖効果」が起こりやすい。

      - id: s13p12b
        chapter: 25
        terms: [promax-rotation, communality, factor-loading, factor-rotation]
        topic: 斜交回転（プロマックス）後の因子パターンと因子間相関から項目の共通性を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          住民意識調査の項目に 2 因子の因子分析を行い、プロマックス回転（斜交回転）をした。項目「地域行事への参加意欲」の因子パターン（標準化した項目の係数）は
          第 1 因子 «l1»、第 2 因子 «l2» で、2 つの因子の相関は «phi» だった。この項目の共通性を求めよ（因子の分散は 1 とする）。
        answer: «h2n»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 項目 $=l_1F_1+l_2F_2+$（独自因子）で、$V[F_1]=V[F_2]=1$、$\mathrm{Cov}(F_1,F_2)=\phi$。共通性は共通因子部分の分散 $V[l_1F_1+l_2F_2]$。

          **途中式**
          $$h^2=l_1^2+l_2^2+2l_1l_2\phi=«l1s»+«l2s»+2\times«l1»\times«l2»\times«phi»=«orth»+«cross»=«h2»$$

          **答え** $«h2»$（独自性は $1-«h2»=«u2»$）

          **間違えやすい点** 直交回転なら共通性は負荷量の 2 乗和（$«orth»$）だが、斜交回転では因子どうしの相関の分だけ共分散の項が加わる。
          斜交解では因子パターン（係数）と因子構造（項目と因子の相関）が一致しない点にも注意する。

  - id: s13p13
    title: 失業率の変動の周波数分析
    context: |
      ある国の完全失業率の前月差 $X_t$ は、定常な AR(1) モデル $X_t=\phi X_{t-1}+\varepsilon_t$（$\phi=«phi»$、$\varepsilon_t$ は分散 $\sigma^2$ のホワイトノイズ）に従うとする。
      このモデルのスペクトル密度は
      $$f(\omega)=\frac{\sigma^2}{2\pi\,(1-2\phi\cos\omega+\phi^2)}\qquad(0\le\omega\le\pi)$$
      である（$\omega$ は角周波数で、$\omega$ が小さいほど周期の長い変動に対応する）。
    items:
      - id: s13p13a
        chapter: 27
        terms: [spectrum, ar-model, weak-stationarity]
        topic: 失業率の前月差のAR(1)モデルのスペクトル密度の周波数0と最高周波数での比から変動の周期の特徴を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          周波数 0 と最高周波数 $\pi$ でのスペクトル密度の比 $f(0)/f(\pi)$ と、その解釈として正しいものはどれか。
        choices:
          - '$f(0)/f(\pi)=«w_nosq»$ で、周期の長い変動の方が強い'
          - '$f(0)/f(\pi)=«inv»$ で、周期の短い変動の方が強い'
          - '$f(0)/f(\pi)=«ratio»$ で、周期の短い変動の方が強い'
          - '$f(0)/f(\pi)=«ratio»$ で、周期の長い（ゆっくりした）変動の方が強い'
          - '$f(0)/f(\pi)=1$ で、どの周波数の変動も同じ強さである'
        answer: 3
        distractors:
          - 分母が (1−φ)² と (1+φ)² であることを忘れ、2 乗をとらなかった
          - 比の向きを逆にした（cos 0=1、cos π=−1 の取り違え）
          - 比は正しいが、ω が小さいほど周期が長いことを逆に解釈した
          - 正解
          - AR(1) のスペクトルをホワイトノイズと同じ平坦なものと考えた
        explanation: |
          **方針** $\cos0=1$、$\cos\pi=-1$ を代入すると、分母はそれぞれ $(1-\phi)^2$、$(1+\phi)^2$ になる。

          **途中式**
          $$1-2\phi\cos0+\phi^2=(1-«phi»)^2=«d0»,\qquad 1-2\phi\cos\pi+\phi^2=(1+«phi»)^2=«dpi»$$
          $$\frac{f(0)}{f(\pi)}=\frac{«dpi»}{«d0»}=«ratio»$$

          **答え** $«ratio»$ で、周期の長い変動の方が強い。

          **間違えやすい点** $\phi>0$ の AR(1) は正の自己相関をもち、値がゆっくり変化するので、低い周波数（長い周期）にスペクトルが集中する。$\phi<0$ なら逆に高い周波数が強くなる。
          ホワイトノイズのスペクトルは平坦（$\sigma^2/2\pi$）で、自己相関があると平坦でなくなる。

  - id: s13p14
    title: 町村の選挙と世論調査
    context: |
      ある県の町村での選挙について、世論調査の結果を分析する。
    items:
      - id: s13p14a
        chapter: 9
        terms: [ci-proportion, finite-population-correction, confidence-interval]
        topic: 有権者5000人の町で800人を非復元抽出した支持率の95%信頼区間の半幅を有限母集団修正つきで求める
        level: 基本
        definition: false
        type: choice
        question: |
          有権者 $N=«N»$ 人の町で、«n» 人を**非復元**で無作為に抽出したところ、«x» 人が現職を支持した。
          支持率 $p$ の推定量 $\hat p$ の分散 $\frac{N-n}{N-1}\cdot\frac{p(1-p)}{n}$ の $p$ に $\hat p$ を代入した標準誤差を使い、正規近似による 95% 信頼区間を作る。
          その半幅（$1.96\times$標準誤差）に最も近い値はどれか。
        choices:
          - '$«w_nofpc»$'
          - '$«half»$'
          - '$«w_fpc2»$'
          - '$«w_z»$'
          - '$«w_se»$'
        answer: 1
        distractors:
          - 有限母集団修正を付け忘れた
          - 正解
          - 修正項を分散ではなく標準誤差に掛けた（平方根をとり忘れた）
          - 95% なのに 1.645 を使った
          - 半幅ではなく標準誤差を答えた
        explanation: |
          **方針** 有限母集団から非復元で抽出するので、二項分布の分散に有限母集団修正 $\frac{N-n}{N-1}$ を掛ける。標本が母集団の 16% を占めるので、修正の効果が無視できない。

          **途中式** $\hat p=«x»/«n»=«ph»$、$\hat p(1-\hat p)=«pq»$。
          $$\frac{N-n}{N-1}=\frac{«fpcN»}{«fpcD»}=«fpc»,\qquad \widehat V=«fpc»\times\frac{«pq»}{«n»}=«v»$$
          $$\mathrm{SE}=\sqrt{«v»}=«se»,\qquad 1.96\times«se»=«half6»$$

          **答え** $«half»$

          **間違えやすい点** 修正を付けないと $«w_nofpc»$ で、区間が広すぎる。修正項は分散に掛ける（標準誤差には $\sqrt{«fpc»}$ を掛ける）。

      - id: s13p14b
        chapter: 31
        terms: [empirical-bayes, normal-normal-model, posterior-mean-map]
        topic: 町ごとの投票意向率を町間分散をモーメント法で推定した経験ベイズで全体平均へ縮小する
        level: 標準
        definition: false
        type: numeric
        question: |
          5 つの小さな町で同じ大きさの調査を行い、投票意向率の推定値 $y_i$ を得た。各 $y_i$ の標本誤差の分散は $\sigma^2=«s2»$（標準誤差 «sd»）で既知とする。

          | 町 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $y_i$ | «y1» | «y2» | «y3» | «y4» | «y5» |

          モデル $y_i\mid\theta_i\sim N(\theta_i,\sigma^2)$、$\theta_i\sim N(\mu,\tau^2)$ を考え、$\mu$ を $y_i$ の平均で、$\tau^2$ を「$y_i$ の不偏分散 $-\ \sigma^2$」で推定する（経験ベイズ）。
          推定した値を使った町 4 の真の投票意向率 $\theta_4$ の事後平均を求めよ。
        answer: «est»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 正規・正規モデルの事後平均は $\mu+(1-B)(y_i-\mu)$、縮小係数は $B=\frac{\sigma^2}{\sigma^2+\tau^2}$。$y_i$ の周辺分散は $\sigma^2+\tau^2$ なので、$y_i$ の不偏分散から $\sigma^2$ を引いて $\tau^2$ を推定する。

          **途中式** $\hat\mu=\bar y=«yb»$。偏差平方和は $«ss»$、不偏分散は $«ss»/4=«v4»$。
          $$\hat\tau^2=«v4»-«s2»=«tau2»,\qquad B=\frac{«s2»}{«s2»+«tau2»}=\frac{«s2»}{«v4»}=«B»$$
          $$\hat\theta_4=«yb»+(1-«B»)\times(«y4»-«yb»)=«yb»+«omB»\times«dev4»=«est5»$$

          **答え** $«est»$

          **間違えやすい点** $B$ は「全体平均に寄せる割合」で、$y_4$ に掛けるのは $1-B$（逆にすると $«w_swap»$）。
          分散を 5 で割ると $\hat\tau^2$ が小さくなり、縮小が強すぎて $«w_v5»$ になる。標本誤差が大きい小さな町ほど、全体平均に強く引き寄せられる。
