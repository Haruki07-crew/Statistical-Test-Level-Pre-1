        explanation: |
          **方針** 各市（層 $k$）の 2×2 表を $(a_k,b_k;c_k,d_k)$（送付の投票・棄権；送付なしの投票・棄権）、人数を $n_k$ とすると、
          $$\hat\psi_{MH}=\frac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$$

          **途中式**
          市 X：$a d/n=«Xa»\times«Xd»/«Xn»=«adX»$、$b c/n=«Xb»\times«Xc»/«Xn»=«bcX»$。
