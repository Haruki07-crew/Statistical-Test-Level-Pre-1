        distractors:
          - 標準誤差ではなく標準偏差 s_d でそのまま割った
          - 標準誤差の分母を √n ではなく √(n−1) にした
          - 正解
          - 標準誤差を s_d/√n ではなく s_d/n とした
          - 標準偏差の代わりに分散 s_d² を使った
        explanation: |
          **方針** 差 $d_i$ を 1 つの標本とみなし、平均 0 の 1 標本 $t$ 検定を行う。統計量は $t=\bar d/(s_d/\sqrt n)$、自由度 $n-1$。

          **途中式**
          $$\frac{s_d}{\sqrt n}=\frac{«sd»}{«rtn»}=«se»,\qquad t=\frac{«dbar»}{«se»}=«t4»$$
