set: 13
title: 模擬試験 第13回
minutes: 90
problems:
  - id: s13p01
    title: ランダム化回答法による住民意識調査
    context: |
      ある市が住民意識調査で「過去 1 年間に粗大ごみを指定日以外に出したことがあるか」という答えにくい質問をする。
      正直な回答を得るため、次の**ランダム化回答法**を使う。回答者は調査員に見えないようにサイコロを 1 回振り、

      - 1〜4 の目が出たら、質問に**正直に**「はい」「いいえ」で答える
      - 5 の目が出たら、質問に関係なく「はい」と答える
      - 6 の目が出たら、質問に関係なく「いいえ」と答える

      サイコロの目は調査員にも分からない。住民のうち実際に該当する人（「はい」が本当の答えの人）の割合を $\pi$ とする。
    items:
      - id: s13p01a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: ランダム化回答法で「はい」と答えた人が実際に該当者である条件付き確率をベイズの定理で求める
        level: 基本
        definition: false
        type: choice
        question: |
          前回の調査から $\pi=«pi0»$ と見込まれている。無作為に選んだ住民がこの方法で「はい」と答えたとき、その人が実際に該当者である確率に最も近い値はどれか。
        choices:
          - '$«c_ty»$'
          - '$«c_honest»$'
          - '$«post»$'
          - '$«c_prior»$'
          - '$«c_py»$'
        answer: 2
        distractors:
          - 条件付き確率の向きを逆にし、P(はい | 該当) を答えた
          - 該当者の「はい」を正直に答えた分（4/6）だけで数え、5 の目で強制的に「はい」になった分を落とした
          - 正解
          - 回答を使わず事前の割合 π をそのまま答えた
          - 条件付き確率ではなく「はい」と答える確率 P(はい) を答えた
        explanation: |
          **方針** 該当者を $T$、「はい」と答えることを $Y$ とする。$P(Y\mid T)$ と $P(Y\mid \bar T)$ をサイコロの規則から求め、全確率の公式で $P(Y)$、ベイズの定理で $P(T\mid Y)$ を計算する。

          **途中式** 該当者は 1〜4 の目（確率 $4/6$）で正直に「はい」、5 の目（確率 $1/6$）でも「はい」と答えるので $P(Y\mid T)=5/6$。
          非該当者が「はい」と答えるのは 5 の目のときだけなので $P(Y\mid\bar T)=1/6$。
          $$P(Y)=«pi0»\times\frac56+«den_n6»\times\frac16=«num»+«den_n»=«py»$$
          $$P(T\mid Y)=\frac{P(T)P(Y\mid T)}{P(Y)}=\frac{«pi0»\times 5/6}{«pi0»\times 5/6+«den_n6»\times 1/6}=\frac{«num6»}{«py6»}=«post5»$$
          （2 行目は分子・分母に 6 を掛けて $\frac{«pi0»\times5}{«pi0»\times5+«den_n6»}$ とした。）

          **答え** $«post»$

          **間違えやすい点** $P(Y\mid T)=5/6\approx«c_ty»$ は「該当者が『はい』と答える確率」で、求める $P(T\mid Y)$ とは向きが逆。
          該当者の「はい」を正直な回答分 $4/6$ だけで数えると $«c_honest»$ になるが、該当者も 5 の目では「はい」と答える。
          「はい」と答えた人でも該当者は半分以下で、これが回答者のプライバシーを守る仕組みになっている。

      - id: s13p01b
        chapter: 8
        terms: [unbiased-estimator, standard-error, binomial-distribution]
        topic: ランダム化回答法の該当率の不偏推定量とその標準誤差（直接質問より大きくなる）
        level: 標準
        definition: false
        type: numeric
        question: |
          本調査で «n» 人に無作為に回答してもらったところ、«y» 人が「はい」と答えた。回答者どうしは独立とする。
          「はい」の割合 $\hat p$ から作る $\pi$ の不偏推定量 $\hat\pi$ の**標準誤差の推定値**（$\hat p$ を真の値の代わりに使ったもの）を求めよ。
        answer: «se»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 1 人が「はい」と答える確率は $p=\frac46\pi+\frac16$ である。これを $\pi$ について解いた式に $\hat p$ を入れたものが不偏推定量になる。分散は $\hat p$ の分散（二項分布）の定数倍。

          **途中式** $p=\frac23\pi+\frac16$ より $\pi=\frac{p-1/6}{2/3}=1.5p-0.25$。そこで
          $$\hat\pi=1.5\hat p-0.25,\qquad \hat p=\frac{«y»}{«n»}=«ph»,\qquad \hat\pi=1.5\times«ph»-0.25=«pih»$$
          $E[\hat p]=p$ なので $E[\hat\pi]=1.5p-0.25=\pi$（不偏）。分散は
          $$V[\hat\pi]=1.5^2\,V[\hat p]=2.25\times\frac{p(1-p)}{n}$$
          $p$ に $\hat p$ を代入して
          $$\frac{\hat p(1-\hat p)}{n}=\frac{«ph»\times(1-«ph»)}{«n»}=\frac{«pq»}{«n»}=«v1»,\qquad \sqrt{«v1»}=«se_p»$$
          $$\mathrm{SE}(\hat\pi)=1.5\times«se_p»=«se5»$$

          **答え** $«se»$

          **間違えやすい点** 係数 1.5 を掛け忘れると $«se_no15»$、分散に 1.5（2 乗の 2.25 ではなく）を掛けると $«se_15var»$ になる。
          全員に直接質問して同じ $\hat\pi=«pih»$ を得た場合の標準誤差 $\sqrt{«pih»\times(1-«pih»)/«n»}=«se_direct»$ と比べると約 «ratio» 倍で、正直な回答を引き出す代わりに精度が下がる。

  - id: s13p02
    title: 期日前投票所の開場直後の来場
    context: |
      ある期日前投票所では、開場後の来場者がレート $\lambda=«lam»$（人/分、平均間隔 «mean» 分）のポアソン過程に従って到着するとみなす。
      開場から 1 人目が来るまでの時間を $X$（分）、2 人目が来るまでの時間を $Y$（分）とすると、$(X,Y)$ の同時密度関数は
      $$f(x,y)=\lambda^2e^{-\lambda y}\quad(0<x<y)$$
      である（$X$ と 2 人目までの間隔 $Y-X$ は独立に平均 $1/\lambda$ の指数分布に従う）。
    items:
      - id: s13p02a
        chapter: 2
        terms: [conditional-probability-density-function, joint-probability-density-function, marginal-probability-density-function]
        topic: 期日前投票所の2人目の到着時刻を与えたときの1人目の到着時刻の条件付き密度が一様分布になることを使う
        level: 基本
        definition: false
        type: choice
        question: |
          開場から «y0» 分後にちょうど 2 人目が来たことが分かっているとき、1 人目が開場から «x0» 分以内に来ていた条件付き確率 $P(X\le «x0»\mid Y=«y0»)$ はどれか。
          必要なら $e^{-0.6}=«em06»$、$e^{-2}=«em2»$ を使え。
        choices:
          - '$«a_unc»$'
          - '$«a_tr»$'
          - '$«a_ok»$'
          - '$«a_sq»$'
          - '$«a_c»$'
        answer: 2
        distractors:
          - 条件を無視して X の周辺分布から P(X≦3)=1−e^{−0.6} を計算した
          - 「Y=10」を「X≦10」という条件と取り違え、指数分布を 10 分以内に切断した確率を計算した
          - 正解
          - 周辺密度 f_Y(y)=λ²ye^{−λy} の y を x と取り違え、条件付き密度を x に比例すると考えた
          - 余事象 P(X>3 | Y=10) を答えた
        explanation: |
          **方針** 条件付き密度 $f(x\mid y)=f(x,y)/f_Y(y)$ を求める。そのために同時密度を $x$ について積分して $Y$ の周辺密度を出す。

          **途中式** $y>0$ について
          $$f_Y(y)=\int_0^{y}\lambda^2e^{-\lambda y}\,dx=\lambda^2ye^{-\lambda y}$$
          よって
          $$f(x\mid y)=\frac{\lambda^2e^{-\lambda y}}{\lambda^2ye^{-\lambda y}}=\frac1y\quad(0<x<y)$$
          で、$Y=y$ を与えると $X$ は区間 $(0,y)$ の一様分布に従う。したがって
          $$P(X\le«x0»\mid Y=«y0»)=\frac{«x0»}{«y0»}=«a_ok»$$

          **答え** $«a_ok»$

          **間違えやすい点** 条件を付けない $P(X\le«x0»)=1-e^{-0.6}=«a_unc»$ とは違う。2 人目が «y0» 分後と遅かったことは、1 人目も遅めだった可能性を高める。
          「$Y=«y0»$」は「$X\le«y0»$」とは別の条件で、$\frac{1-e^{-0.6}}{1-e^{-2}}=«a_tr»$ にはならない。$\lambda$ の値によらず答えが一様分布から決まるのがポイント。

      - id: s13p02b
        chapter: 3
        terms: [skewness-kurtosis, moments, sum-of-random-variables]
        topic: 期日前投票所の2人目の到着時刻（独立な指数分布2つの和）の歪度を3次中心モーメントの加法性から求める
        level: 応用
        definition: false
        type: choice
        question: |
          2 人目の到着時刻 $Y$ の歪度 $E[(Y-\mu)^3]/\sigma^3$（$\mu=E[Y]$、$\sigma^2=V[Y]$）に最も近い値はどれか。
          必要なら、レート $\lambda$ の指数分布の分散が $1/\lambda^2$、3 次の中心モーメントが $2/\lambda^3$ であること、$\sqrt{«vy»}=«rt50»$ を使え。
        choices:
          - '$«w_exp»$'
          - '$«skew»$'
          - '$«w_add»$'
          - '$«w_var2»$'
          - '$«w_one»$'
        answer: 1
        distractors:
          - 和をとっても形が変わらないと考え、指数分布の歪度 2 をそのまま答えた
          - 正解
          - 2 つの指数分布の歪度 2 をそのまま足した
          - 3 次中心モーメントを標準偏差の 3 乗ではなく分散の 2 乗で割った
          - 3 次中心モーメントを 1 つ分（X の分）しか数えなかった
        explanation: |
          **方針** $Y=X+(Y-X)$ は独立な 2 つの指数分布（レート $\lambda$）の和。独立な確率変数の和では、分散だけでなく 3 次の中心モーメントも足し合わせられる（3 次のキュムラントの加法性）。

          **途中式** $\lambda=«lam»$ のとき、各成分の分散は $1/\lambda^2=«v1»$、3 次中心モーメントは $2/\lambda^3=«k3»$。
          $X$ と $W=Y-X$ が独立で平均を引いたもの $\tilde X,\tilde W$ について $E[(\tilde X+\tilde W)^3]=E[\tilde X^3]+3E[\tilde X^2]E[\tilde W]+3E[\tilde X]E[\tilde W^2]+E[\tilde W^3]=E[\tilde X^3]+E[\tilde W^3]$（$E[\tilde X]=E[\tilde W]=0$）なので
          $$E[(Y-\mu)^3]=«k3»+«k3»=«k3y»,\qquad V[Y]=«v1»+«v1»=«vy»,\qquad \sigma^3=«vy»\sqrt{«vy»}=«vy»\times«rt50»=«sd3»$$
          $$\text{歪度}=\frac{«k3y»}{«sd3»}=«skew5»$$
          （一般に $\frac{4/\lambda^3}{(2/\lambda^2)^{3/2}}=\sqrt2$ で、$\lambda$ によらない。）

          **答え** $«skew»$

          **間違えやすい点** 歪度そのものは足せない（$2+2=«w_add»$ は誤り）。足せるのは 3 次の中心モーメント（キュムラント）で、それを和の標準偏差の 3 乗で割り直す。
          独立な和を増やすほど歪度は小さくなり（$n$ 個の和では $2/\sqrt n$）、中心極限定理のとおり正規分布に近づく。

  - id: s13p03
    title: 市域の人口分布と所得分布
    context: |
      ある県の人口統計の分析で、住民の居住地と世帯所得の分布をモデルで表す。
    items:
      - id: s13p03a
        chapter: 4
        terms: [change-of-variables, joint-probability-density-function, quantile-function]
        topic: 円形の市域に一様に住む住民の中心からの距離の分布を極座標の変数変換で求め中央値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある市の市域を半径 $R=«R»$ km の円とみなし、住民は円の内部に一様に分布している（住民の位置 $(U,V)$ の同時密度は円内で $1/(\pi R^2)$）とする。
          市の中心（市役所）から無作為に選んだ住民までの距離 $D=\sqrt{U^2+V^2}$ の中央値に最も近い値はどれか（単位 km）。
        choices:
          - '$«w_half»$'
          - '$«w_mean»$'
          - '$«w_rev»$'
          - '$«med»$'
          - '$«w_cube»$'
        answer: 3
        distractors:
          - 距離 D が 0〜R の一様分布に従うと思い込んだ
          - 中央値ではなく平均 2R/3 を答えた
          - 中心ほど人が多いと考え、距離の密度を 2(R−r)/R² と向きを逆にした
          - 正解
          - 球の内部の一様分布と混同し、密度を 3r²/R³ とした
        explanation: |
          **方針** 極座標 $u=r\cos\theta$、$v=r\sin\theta$ に変数変換する。ヤコビアンは $r$ なので、$(D,\Theta)$ の同時密度は $\frac{r}{\pi R^2}$。$\theta$ について積分して $D$ の周辺密度を求め、分布関数を $1/2$ とおく。

          **途中式**
          $$f_D(r)=\int_0^{2\pi}\frac{r}{\pi R^2}\,d\theta=\frac{2r}{R^2}\quad(0<r<R),\qquad F_D(r)=\frac{r^2}{R^2}$$
          （面積で考えても、半径 $r$ 以内に住む割合は $\pi r^2/(\pi R^2)$。）
          $F_D(m)=1/2$ より $m^2=R^2/2=«R22»$、
          $$m=\frac{R}{\sqrt2}=\frac{«R»}{\sqrt2}=«med4»$$

          **答え** $«med»$ km

          **間違えやすい点** 平面上で一様でも、距離 $D$ は一様ではない。半径 $r$ の円周の長さが $r$ に比例するため、外側ほど住民が多く、密度は $2r/R^2$ になる（ヤコビアン $r$ の意味）。
          $D$ を一様とすると $R/2=«w_half»$、平均 $\int_0^R r\cdot\frac{2r}{R^2}dr=\frac{2R}{3}=«w_mean»$ と取り違えないこと。

      - id: s13p03b
        chapter: 7
        terms: [extreme-value-distribution, convergence-in-distribution, order-statistics]
        topic: パレート分布に従う多数の世帯所得の最大値をフレシェ型の極値近似で扱い最高所得が一定額以下である確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          世帯所得 $X$（万円）は $P(X>x)=(x_m/x)^{\alpha}$（$x\ge x_m$、$x_m=«xm»$、$\alpha=«a»$）のパレート分布に従い、世帯どうしは独立とする。
          無作為に選んだ «n» 世帯の所得の最大値を $M$ とする。$n$ が大きいとき $P(M\le x)\approx\exp\{-n(x_m/x)^{\alpha}\}$（フレシェ型の極値分布）と近似できることを用いて、
          $P(M\le «x»)$ に最も近い値を選べ。必要なら $e^{-0.5}=«em05»$、$e^{-0.025}=«em0025»$ を使え。
        choices:
          - '$«b_union»$'
          - '$«b_comp»$'
          - '$«b_ok»$'
          - '$«b_dens»$'
          - '$«b_one»$'
        answer: 2
        distractors:
          - P(M>x) ≦ nP(X>x) の上界（ボンフェローニ型）を等号とみなし 1−nP(X>x) とした
          - 求める確率の余事象 P(M>x) を答えた
          - 正解
          - 生存関数の指数を密度の指数 α+1 と取り違えた
          - n 世帯の最大値ではなく 1 世帯の分布関数 P(X≦x) を答えた
        explanation: |
          **方針** 独立なので $P(M\le x)=P(X\le x)^n=\{1-(x_m/x)^{\alpha}\}^n$。$(x_m/x)^{\alpha}$ が小さく $n$ が大きいときは $(1-p)^n\approx e^{-np}$ と近似できる。

          **途中式**
          $$\left(\frac{x_m}{x}\right)^{\alpha}=\left(\frac{«xm»}{«x»}\right)^{«a»}=«ratio»^{«a»}=«tail»,\qquad n\times«tail»=«n»\times«tail»=«lam»$$
          $$P(M\le«x»)\approx e^{-«lam»}=«em05»$$

          **答え** $«b_ok»$

          **間違えやすい点** $1-np=«b_union»$ は $e^{-np}$ の 1 次近似にすぎず、$np$ が 0.5 程度では精度が悪い。
          指数を $\alpha+1=4$ にすると $n\times«ratio»^4=«lam4»$ で $«b_dens»$ となり、裾の重さを過小評価する。
          パレート分布のように裾が多項式で減る分布の最大値は、$n^{1/\alpha}$ で割るとフレシェ分布に収束する（指数分布のような裾ではガンベル分布）。

  - id: s13p04
    title: 知事選挙の世論調査と出口調査
    context: |
      知事選挙の前に、有権者名簿から «n» 人を無作為に抽出して電話調査を行った。有権者は十分多いので、復元抽出とみなしてよい。
      候補者は A、B の 2 人で、回答は「A」「B」「未定・その他」のいずれか 1 つである。
    items:
      - id: s13p04a
        chapter: 12
        terms: [proportion-test, multinomial-distribution, binomial-test]
        topic: 世論調査の2候補の支持率が等しいかを多項分布の負の共分散を考えた標準誤差によるz検定で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          回答者 «n» 人の内訳は「A」«nA» 人、「B」«nB» 人、「未定・その他」«nU» 人だった。A の支持率 $p_A$ と B の支持率 $p_B$ が等しいか（$H_0:p_A=p_B$）を、両側有意水準 5% で検定する。
          回答の人数は多項分布に従い、支持率の推定量 $\hat p_A,\hat p_B$ について $V[\hat p_A]=p_A(1-p_A)/n$、$V[\hat p_B]=p_B(1-p_B)/n$、$\mathrm{Cov}[\hat p_A,\hat p_B]=-p_Ap_B/n$ である。
          $H_0$ のもとでの $V[\hat p_A-\hat p_B]$ を $p_A+p_B$ で表し、$p_A+p_B$ を $\hat p_A+\hat p_B$ で置き換えた標準誤差 SE を使って $z=(\hat p_A-\hat p_B)/\mathrm{SE}$ を作る。正しい記述はどれか。
          標準正規分布の上側 2.5% 点は 1.96、上側 5% 点は 1.645 とする。
        choices:
          - '$z=«z_ind»$ で、1.96 を超えるので帰無仮説を棄却する'
          - '$z=«z_sign»$ で、1.96 を超えるので帰無仮説を棄却する'
          - '$z=«z»$ で、1.96 を超えないので帰無仮説を棄却しない'
          - '$z=«z»$ で、1.645 を超えるので帰無仮説を棄却する'
          - '$z=«z»$ で、1.96 を超えないので、A と B の支持率が等しいことが示された'
        answer: 2
        distractors:
          - 同じ回答者から求めた 2 つの比率を独立とみなし、共分散を無視した
          - 共分散の符号を誤り、分散から 2pApB/n を引いた
          - 正解
          - 両側検定なのに片側の点 1.645 と比べた
          - 統計量は正しいが、「棄却しない」を「帰無仮説が正しいと示された」と誤って解釈した
        explanation: |
          **方針** $\hat p_A$ と $\hat p_B$ は同じ回答者から求めるので独立ではない。差の分散は $V[\hat p_A]+V[\hat p_B]-2\mathrm{Cov}[\hat p_A,\hat p_B]$ で、共分散が負なのでその分だけ大きくなる。

          **途中式**
          $$V[\hat p_A-\hat p_B]=\frac{p_A(1-p_A)+p_B(1-p_B)+2p_Ap_B}{n}=\frac{p_A+p_B-(p_A-p_B)^2}{n}$$
          $H_0:p_A=p_B$ のもとでは $(p_A-p_B)^2=0$ なので $V=(p_A+p_B)/n$。
          $\hat p_A=«nA»/«n»=«pA»$、$\hat p_B=«nB»/«n»=«pB»$、$\hat p_A+\hat p_B=«pS»$。
          $$\mathrm{SE}=\sqrt{\frac{«pS»}{«n»}}=\sqrt{«vS»}=«se»,\qquad z=\frac{«pA»-«pB»}{«se»}=\frac{«dp»}{«se»}=«z4»$$
          $|z|=«z»<1.96$ なので、両側有意水準 5% で帰無仮説を棄却しない。

          **答え** $z=«z»$ で棄却しない。

          **間違えやすい点** 2 つの比率を独立とみなして $\sqrt{\{\hat p_A(1-\hat p_A)+\hat p_B(1-\hat p_B)\}/n}=«se_ind»$ を使うと $z=«z_ind»$ となり、結論が逆になる。負の共分散を忘れると標準誤差を過小評価する。
          「両側」の検定なので比べるのは 1.96。「棄却しない」は「差があるとは言えない」という意味で、等しいことの証明ではない。

          **別解** A か B と答えた «nAB» 人に条件を付けると、A と答えた人数は $H_0$ のもとで二項分布 $\mathrm{Bin}(«nAB»,1/2)$ に従う。$z=(«nA»-«nAB»\times0.5)/\sqrt{«nAB»\times0.25}=«nAmh»/«sdc»=«z4»$ と同じ値になる。

      - id: s13p04b
        chapter: 5
        terms: [negative-binomial-distribution, geometric-distribution, expectation-variance-properties]
        topic: 回答率15%の電話調査で目標の回答数を得るまでに必要な発信回数の標準偏差を負の二項分布から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          この調査では、1 回の発信で回答が得られる確率は $p=«p»$ で、発信どうしは独立とする。
          回答が «n» 人得られるまで発信を続けるとき、必要な発信回数の合計 $T$ の**標準偏差**を求めよ。
        answer: «sd»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 1 人の回答を得るまでの発信回数（成功を含む）は成功確率 $p$ の幾何分布に従い、平均 $1/p$、分散 $(1-p)/p^2$。$T$ はそれが独立に «n» 個足されたもの（負の二項分布）なので、平均も分散も «n» 倍になる。

          **途中式**
          $$\frac{1-p}{p^2}=\frac{«q»}{«p2»}=«var1»,\qquad V[T]=«n»\times\frac{«q»}{«p2»}=«var»$$
          $$\sqrt{«var»}=«sd4»$$
          （平均は $E[T]=«n»/«p»=«ev»$ 回。）

          **答え** $«sd»$ 回

          **間違えやすい点** 失敗回数で数えても成功回数との差は定数 «n» なので、分散は同じ。$1-p$ を掛け忘れると $«w_noq»$、分母の $p^2$ を $p$ にすると $«w_nop»$ になる。
          発信回数を固定した二項分布の分散 $E[T]p(1-p)$ を使う（$«w_bin»$）のは、数えているものが逆（回答数）なので誤り。

      - id: s13p04c
        chapter: 10
        terms: [type-i-and-ii-errors, rejection-region, normal-approximation-binomial-poisson]
        topic: 出口調査で当選確実を出す判定ルールの第1種と第2種の過誤の確率を正規近似で求める
        level: 応用
        definition: false
        type: choice
        question: |
          投票日の出口調査では、A、B いずれかに投票した人から «m» 人を無作為に選び、A に投票した割合 $\hat p$ が «cc» 以上なら「A 当選確実」と報じる。
          A の真の得票率（2 人の得票に占める割合）を $\theta$ とし、「A が当選しない」ぎりぎりの $\theta=«th0»$ のもとで当確を出してしまう確率を第 1 種の過誤の確率 $\alpha$、
          $\theta=«th1»$ のもとで当確を出せない確率を第 2 種の過誤の確率 $\beta$ とする。正規近似（連続修正なし、標準偏差には各 $\theta$ の値を使う）で求めた組として最も近いものはどれか。
          標準正規分布の分布関数は $\Phi(1.20)=«ph120»$、$\Phi(1.22)=«ph122»$、$\Phi(2.00)=«ph200»$ とする。
        choices:
          - '$\alpha=«a2»$、$\beta=«beta»$'
          - '$\alpha=«alpha»$、$\beta=«power»$'
          - '$\alpha=«alpha»$、$\beta=«bw»$'
          - '$\alpha=«alpha»$、$\beta=«beta»$'
          - '$\alpha=«a_rev»$、$\beta=«beta»$'
        answer: 3
        distractors:
          - 片側の判定ルールなのに両側の確率 2(1−Φ(2.00)) を α とした
          - 第 2 種の過誤の確率ではなく検出力 1−β を答えた
          - β の計算で θ=0.58 の標準偏差ではなく θ=0.50 の標準偏差 0.025 を使った
          - 正解
          - α を P(p̂≧0.55) ではなく Φ(2.00) とし、上側と下側を取り違えた
        explanation: |
          **方針** $\hat p$ は近似的に平均 $\theta$、標準偏差 $\sqrt{\theta(1-\theta)/«m»}$ の正規分布に従う。棄却域（当確を出す範囲）は $\hat p\ge«cc»$ で、$\alpha=P_{\theta=«th0»}(\hat p\ge«cc»)$、$\beta=P_{\theta=«th1»}(\hat p<«cc»)$。

          **途中式** $\theta=«th0»$ のとき標準偏差は $\sqrt{«th0»\times«th0»/«m»}=«se0»$。
          $$\alpha=P\left(Z\ge\frac{«cc»-«th0»}{«se0»}\right)=P(Z\ge«z0»)=1-«ph200»=«alpha»$$
          $\theta=«th1»$ のとき標準偏差は $\sqrt{«th1»\times«t1q»/«m»}=\sqrt{«v1»}=«se1»$。
          $$\beta=P\left(Z<\frac{«cc»-«th1»}{«se1»}\right)=P(Z<«z1raw»)\approx P(Z<-«z1»)=1-«ph122»=«beta»$$

          **答え** $\alpha=«alpha»$、$\beta=«beta»$

          **間違えやすい点** 判定ルールは「«cc» 以上」の片側だけなので、$\alpha$ を 2 倍しない。
          $\beta$ は対立仮説の値 $\theta=«th1»$ のもとでの確率で、標準偏差もその $\theta$ で計算し直す（«se0» のままだと $«bw»$）。«ph122» は当確を出せる確率（検出力）で、$\beta$ はその残り。
          基準を «cc» より上げると $\alpha$ は減るが $\beta$ は増える。両方を同時に小さくするには標本の大きさを増やす。

  - id: s13p05
    title: 窓口の処理日数の2局比較
    context: |
      ある県の 2 つの地域振興局で、補助金の申請から支給決定までの平均処理日数を比べる。無作為に選んだ申請について次の結果を得た（標準偏差は不偏分散の平方根）。

      | 局 | 件数 | 平均 | 標準偏差 |
      |---|---|---|---|
      | 1 | «n1» | «m1» | «s1» |
      | 2 | «n2» | «m2» | «s2» |

      担当者は、まず 2 局の母分散が等しいかを $F$ 検定（有意水準 5%）で調べ、棄却されなければプールした分散を使う 2 標本 $t$ 検定、棄却されればウェルチの検定を使うことにした。
      $F$ 検定の $p$ 値は «pF» で、等分散は棄却されなかった。
    items:
      - id: s13p05a
        chapter: 11
        terms: [preliminary-test-problem, welch-test, two-sample-t-test, f-test-equal-variances]
        topic: 等分散の予備検定の結果でプールしたt検定とウェルチ検定を選ぶ二段階の手順の問題点を読み取る
        level: 標準
        definition: true
        type: choice
        question: |
          この二段階の手順について、正しい記述はどれか。
        choices:
          - '等分散が棄却されなかったので母分散が等しいことが確かめられ、続くプールした $t$ 検定の第一種の過誤の確率はちょうど 5% になる'
          - '予備検定の結果で検定を選ぶと、手順全体の第一種の過誤の確率は名目の 5% から一般にずれる。母分散が等しいか分からないときは、はじめからウェルチの検定を使う方がよい'
          - 'ウェルチの検定は母分散が等しいときには使えないので、予備検定は必ず行わなければならない'
          - '予備検定の有意水準を 1% に下げれば、二段階の手順全体の第一種の過誤の確率はちょうど 5% になる'
          - '2 局の件数が異なっていても、母分散が異なるときのプールした $t$ 検定の第一種の過誤の確率は 5% から変わらない'
        answer: 1
        distractors:
          - 「棄却しない」を「等しいことが確かめられた」と誤解した。予備検定を通った後の t 検定は条件付きで、名目の水準を保たない
          - 正解
          - ウェルチの検定は等分散のときも近似的に正しい水準をもち、検出力の損失もわずか
          - 予備検定の水準を変えても、二段階の手順の誤り率は一般にちょうど 5% にはならない
          - 件数が異なり分散も異なると、プールした t 検定の第一種の過誤の確率は大きくずれる（小さい群の分散が大きいと過大になる）
        explanation: |
          **方針** 予備検定（前段の検定）の結果によって本検定を選ぶ「予備検定の問題」を考える。予備検定で棄却されないことは等分散の証明ではなく、検出力が低ければ分散の違いを見逃す。

          **途中式** この例では件数の少ない局 1（«n1» 件）の標準偏差 «s1» が局 2 の «s2» より大きい。このように小さい群の分散が大きいとき、プールした分散は大きい群の小さい分散に引っ張られ、平均の差の標準誤差を過小評価する。
          そのため、分散が実際に異なるのに予備検定で見逃された場合、プールした $t$ 検定は第一種の過誤を 5% より多く起こす。手順全体の誤り率は、予備検定の検出力にも左右されて名目の水準からずれる。
          ウェルチの検定は分散が等しくても異なっても近似的に正しい水準をもつ。

          **答え** 予備検定で選ぶ手順は水準がずれるので、はじめからウェルチの検定を使う方がよい（選択肢 1）。

          **間違えやすい点** 「棄却されない」は「等しい」ではない。件数が異なるときほど、分散の違いがプールした $t$ 検定に与える影響は大きい。

  - id: s13p06
    title: 投票を促すはがきの事後調査
    context: |
      選挙管理委員会が、投票を促すはがきの効果を選挙後に調べた。選挙人名簿の投票記録から、投票した人 «n1» 人と棄権した人 «n0» 人を別々に無作為抽出し、はがきを受け取っていたかを照会した。

      | | はがき受領 | 受領なし | 計 |
      |---|---|---|---|
      | 投票した | «a» | «b» | «n1» |
      | 棄権した | «c» | «d» | «n0» |

      この市の投票率は約 55% だった。
    items:
      - id: s13p06a
        chapter: 28
        terms: [cohort-and-case-control-study, sampling-schemes, odds-and-odds-ratio, relative-risk]
        topic: 投票者と棄権者を別々に抽出したケース・コントロール型の調査からはがきのオッズ比は推定できても投票率の比は推定できないことを読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          この調査から言えることとして正しいものはどれか。
        choices:
          - 'はがきを受け取った人の投票率は $«a»/«ac»=«nr1»$ と推定できる'
          - 'はがき受領の有無と投票のオッズ比は $«OR»$ と推定でき、この値は投票者と棄権者をそれぞれ何人ずつ抽出したかによらない'
          - 'はがきを受け取った人と受け取らなかった人の投票率の比（相対リスク）は $«nrr»$ と推定できる'
          - 'オッズ比 $«OR»$ は、投票がまれな事象なので相対リスクのよい近似になる'
          - 'オッズ比は $\frac{«a»/«b»}{«c»/«d»}$ と $\frac{«a»/«c»}{«b»/«d»}$ で値が異なるので、計算の向きで結論が変わる'
        answer: 1
        distractors:
          - 結果（投票・棄権）で抽出しているのに、行の比率から投票率を計算した
          - 正解
          - ケース・コントロール型の抽出では推定できない相対リスクを、表の比率から計算した
          - 投票率は約 55% でまれではないので、オッズ比は相対リスクの近似にならない
          - オッズ比は行と列のどちらで比をとっても同じ値になる
        explanation: |
          **方針** 投票した人・棄権した人という**結果**ごとに人数を決めて抽出しているので、表の「投票した」と「棄権した」の比率は調査者が決めたもので、母集団の投票率を反映しない。ただしオッズ比は、行で比をとっても列で比をとっても同じ値になるので推定できる。

          **途中式** 投票した人のはがき受領のオッズは $«a»/«b»=«o1»$、棄権した人では $«c»/«d»=«o0»$。
          $$\text{オッズ比}=\frac{«a»\times«d»}{«b»\times«c»}=«OR»$$
          列の向き（受領した人の投票オッズ $«a»/«c»=«o1b»$ と受領なしの投票オッズ $«b»/«d»=«o0b»$ の比）でも同じ $«OR»$ になる。
          一方、$«a»/«ac»=«nr1»$ や $«b»/«bd»=«nr0»$ は、投票者と棄権者を同数ずつ抽出したことで決まった値で、実際の投票率ではない。

          **答え** オッズ比 $«OR»$ は推定でき、抽出人数によらない。

          **間違えやすい点** ケース・コントロール型の調査では、結果の比率（ここでは投票率）とその比（相対リスク）は推定できない。
          オッズ比が相対リスクに近いのは結果がまれな場合だけ。投票率が約 55% のこの調査では、オッズ比 «OR» は投票率の比より大きく離れる。

  - id: s13p07
    title: 高齢期の住まいの推移
    context: |
      ある市の高齢者の住まいを「持ち家（1）」「賃貸住宅（2）」「高齢者施設（3）」「死亡（4）」の 4 状態に分け、1 年ごとの推移を次の推移確率行列をもつマルコフ連鎖で表す（行が今年、列が翌年）。

      | 今年＼翌年 | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | 1 | «p11» | «p12» | «p13» | «p14» |
      | 2 | «p21» | «p22» | «p23» | «p24» |
      | 3 | «p31» | «p32» | «p33» | «p34» |
      | 4 | «p41» | «p42» | «p43» | «p44» |
    items:
      - id: s13p07a
        chapter: 14
        terms: [communicating-class, recurrence-and-transience, absorbing-state, irreducibility, stationary-distribution]
        topic: 持ち家・賃貸・施設・死亡の4状態の推移行列から連結クラスと再帰的・一時的な状態を分類し定常分布の一意性を判断する
        level: 標準
        definition: false
        type: choice
        question: |
          この連鎖の状態の分類について、正しい記述はどれか。
        choices:
          - '状態 1 と 2 は互いに行き来できるので同じクラスに属し、どちらも再帰的である'
          - '状態 3 は自分にとどまる確率 «p33» が大きいので再帰的である'
          - 'どの状態から出発しても、いずれ確率 1 で状態 4 に到達する。再帰的なのは状態 4 だけで、状態 1、2、3 は一時的である'
          - 'この連鎖は既約である'
          - '定常分布はただ 1 つで、すべての状態に正の確率を与える'
        answer: 2
        distractors:
          - 互いに到達可能（連結）であることと再帰性を混同した。{1,2} からは確率をもって外へ出て戻れない
          - 戻る確率が 1 未満なら、とどまる確率が大きくても一時的である
          - 正解
          - 状態 4 から他の状態へは行けないので既約ではない
          - 定常分布は (0, 0, 0, 1) だけで、一時的な状態には確率 0 を与える
        explanation: |
          **方針** 互いに到達可能な状態を同じクラスにまとめ、各クラスが「閉じている（外に出ない）」かどうかを調べる。有限の連鎖では、閉じたクラスの状態は再帰的、閉じていないクラスの状態は一時的。

          **途中式**
          - 1 と 2 は互いに行き来できるので $\{1,2\}$ は 1 つのクラス。しかし毎年、状態 1 からは $«p13»+«p14»=«out12»$、状態 2 からは $«p23»+«p24»=«out22»$ の確率で 3 か 4 へ出て、戻れない。閉じていないので一時的。
          - 3 からは 4 へ移るだけで 1、2 には戻れない。$\{3\}$ も閉じていないので一時的（3 にとどまり続ける確率は $«p33»^n\to0$）。
          - 4 は $p_{44}=1$ の吸収状態で、閉じたクラス $\{4\}$ は再帰的。

          一時的な状態には有限回しか滞在しないので、確率 1 でいずれ状態 4 に到達する。

          **答え** 再帰的なのは状態 4 だけで、1、2、3 は一時的（選択肢 2）。

          **間違えやすい点** 「互いに行き来できる」ことは再帰性を意味しない。クラス全体が閉じているかどうかで決まる。
          既約でない連鎖では、定常分布が一時的な状態に正の確率を与えることはない（ここでは $(0,0,0,1)$ だけ）。

