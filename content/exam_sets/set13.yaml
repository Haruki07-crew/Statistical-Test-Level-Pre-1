        explanation: |
          **方針** 状態 E、U から吸収状態 R に到達するまでの期待年数を $t_E$、$t_U$ とおく。1 年目の推移で場合分けすると（1 年たった後は、移った先からの期待年数を足す）、連立方程式
          $$t_E=1+«pEE»t_E+«pEU»t_U,\qquad t_U=1+«pUE»t_E+«pUU»t_U$$
