        chapter: 30
        terms: [mallows-cp, model-selection, variable-selection]
        topic: 出生率の縮小モデルのマローズのCpをフルモデルの誤差分散推定値から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          縮小モデルのマローズの $C_p$ を求めよ。ここで
          $$C_p=\frac{RSS_p}{\hat\sigma^2}-n+2p$$
          とし、$p$ は**切片を含めた**係数の個数、$\hat\sigma^2$ はフルモデルの残差平方和をその残差自由度で割った値とする。
        answer: «cp»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $\hat\sigma^2$ をフルモデルから求め、縮小モデルの $RSS_p$ と係数の個数 $p$（切片を含めて 3）を代入する。

          **途中式** $\hat\sigma^2=«rss_f»/«dfe»=«s2»$。縮小モデルは説明変数 2 個と切片なので $p=«p»$。
          $$C_p=\frac{«rss_r»}{«rss_f»/«dfe»}-«n»+2\times«p»=\frac{«rss_r»\times«dfe»}{«rss_f»}-«np2»=«rs2»-«np2»=«cp4»$$

          **答え** $«cp»$

          **間違えやすい点** $p$ に切片を数え忘れると $«cp_noint»$ になる。$\hat\sigma^2$ を縮小モデル自身の残差から求めると $C_p=p=«cp_alt»$ になり、比較の意味がなくなる。
          よいモデルでは $C_p\approx p$ となる。フルモデルの $C_p$ は定義から $«cp_full»$（$=p$）で、縮小モデルの $«cp»$ は $p=«p»$ を大きく上回るので、除いた 2 変数による偏りが大きいと判断できる（前問の $F$ 検定の結論と整合する）。

      - id: s13p08c
        chapter: 17
        terms: [breusch-pagan-test, heteroscedasticity, robust-standard-error]
        topic: 市町村の人口規模で誤差分散が変わるかを補助回帰の決定係数を使うブルーシュ・ペイガン検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          人口の少ない市町村ほど出生率のばらつきが大きいのではないかと考え、フルモデルの最小二乗残差の 2 乗を、人口の対数と面積の対数の 2 変数（と切片）に回帰したところ、
          この補助回帰の決定係数は «r2aux» だった。
          統計量 $nR^2$ は「誤差分散は一定」という帰無仮説のもとで近似的にカイ二乗分布に従う（ブルーシュ・ペイガン検定の $nR^2$ 版）。正しい記述はどれか。
          カイ二乗分布の上側 5% 点は自由度 1 で «c1_05»、自由度 2 で «c2_05»、自由度 4 で «c4_05»、上側 1% 点は自由度 2 で «c2_01» とする。
        choices:
          - '統計量は «lm» で、自由度 4 の 5% 点 «c4_05» を超えないので、等分散の帰無仮説を棄却しない'
          - '統計量は «r2aux» で、どの自由度の 5% 点も超えないので、等分散の帰無仮説を棄却しない'
          - '統計量は «lm» で、自由度 2 の 5% 点 «c2_05» を超えるので、帰無仮説「誤差分散は一定でない」を棄却する'
          - '統計量は «lm» で、自由度 2 の 5% 点 «c2_05» を超えるので等分散の帰無仮説を棄却する。このとき回帰係数の最小二乗推定量は偏りをもつので使えない'
          - '統計量は «lm» で、自由度 2 の 5% 点 «c2_05» を超えるので等分散の帰無仮説を棄却する。不均一分散に頑健な標準誤差を使うなどの対処を検討する'
        answer: 4
        distractors:
          - 自由度を補助回帰の説明変数の数 2 ではなく、もとのモデルの説明変数の数 4 にした
          - nR² を作らず決定係数をそのまま統計量にした
          - 帰無仮説と対立仮説を取り違えた
          - 不均一分散でも最小二乗推定量は不偏であり、問題になるのは標準誤差（と効率）であることを誤解した
          - 正解
        explanation: |
          **方針** ブルーシュ・ペイガン検定（$nR^2$ 版）では、残差の 2 乗を分散の変動要因に回帰し、$nR^2$ を自由度＝補助回帰の説明変数の数（切片を除く）のカイ二乗分布と比べる。

          **途中式** $nR^2=«n»\times«r2aux»=«lm»$。自由度は補助回帰の説明変数の数 $«kaux»$。
          $«c2_05»<«lm»<«c2_01»$ なので、5% 水準では等分散を棄却する（1% 水準では棄却しない）。

          **答え** $nR^2=«lm»$、自由度 2 の 5% 点を超えるので等分散を棄却する。

          **間違えやすい点** 自由度はもとの回帰の説明変数の数ではなく、補助回帰で分散を説明する変数の数。
          不均一分散があっても最小二乗推定量は不偏のままだが、通常の標準誤差の公式が正しくなくなるため、$t$ 検定や前問の $F$ 検定の結論がずれるおそれがある。頑健な標準誤差や重み付き最小二乗法で対処する。

  - id: s13p09
    title: 有権者調査による投票参加のモデル
    context: |
      ある市で有権者 800 人に調査を行い、前回の市議会議員選挙で投票したか（投票 $=1$、棄権 $=0$）を目的変数とするロジスティック回帰を当てはめた。

      - モデル 1：説明変数は年齢のみ（切片を含めて係数 2 個）。残差逸脱度 «d1»
      - モデル 2：モデル 1 に、居住年数（「5 年未満」「5〜20 年」「20 年以上」の 3 区分、ダミー変数で表す）と自治会加入の有無（ダミー変数 1 個）を加えたもの。残差逸脱度 «d2»
    items:
      - id: s13p09a
        chapter: 18
        terms: [deviance, logistic-regression, likelihood-ratio-test, dummy-variable]
        topic: 投票参加のロジスティック回帰で居住年数（3区分）と自治会加入を加えたときの逸脱度の差による尤度比検定
        level: 標準
        definition: false
        type: choice
        question: |
          「居住年数と自治会加入はどちらも投票に関係しない」を帰無仮説とし、2 つのモデルの残差逸脱度の差を用いた尤度比検定を行う。正しい記述はどれか。
          カイ二乗分布の上側点は、自由度 2 で 5% 点 «c2_05»・1% 点 «c2_01»、自由度 3 で 5% 点 «c3_05»・1% 点 «c3_01» とする。
        choices:
          - '統計量は «lr»、自由度は 2 で、有意水準 1% でも帰無仮説を棄却する'
          - '統計量は «lr_half»、自由度は 3 で、有意水準 5% で帰無仮説を棄却しない'
          - '統計量は «lr»、自由度は 3 で、有意水準 5% では棄却するが 1% では棄却しない'
          - '統計量は «lr_dbl»、自由度は 3 で、有意水準 1% でも帰無仮説を棄却する'
          - '残差逸脱度は説明変数を増やすほど必ず小さくなるので、検定をしなくてもモデル 2 の方がよいと判断できる'
        answer: 2
        distractors:
          - 3 区分の居住年数を 1 個の変数と数え、増えたパラメータを 2 個とした
          - 逸脱度はすでに対数尤度の差の 2 倍なのに、さらに 2 で割った
          - 正解
          - 逸脱度の差をさらに 2 倍した
          - 逸脱度が必ず減ることと、その減り方が偶然の範囲を超えるかどうかを区別していない
        explanation: |
          **方針** 入れ子のモデルでは、残差逸脱度の差 $D_1-D_2=2(\ell_2-\ell_1)$ が尤度比検定統計量で、帰無仮説のもとで自由度＝増えたパラメータ数のカイ二乗分布に近似的に従う。

          **途中式** 統計量は $«d1»-«d2»=«lr»$。増えたパラメータは、3 区分の居住年数のダミー変数 2 個と自治会加入 1 個で計 3 個。
          $«c3_05»<«lr»<«c3_01»$ なので、5% 水準で棄却、1% 水準では棄却しない。

          **答え** 統計量 «lr»、自由度 3、5% 水準で棄却・1% 水準で棄却しない。

          **間違えやすい点** $K$ 区分のカテゴリー変数は $K-1$ 個のダミー変数（パラメータ）として数える。自由度を 2 にすると 1% 点 «c2_01» も超えて結論が変わってしまう。
          逸脱度は $-2\times$対数尤度にもとづく量なので、差がそのまま $2(\ell_2-\ell_1)$ になる。さらに 2 倍したり 2 で割ったりしない。

      - id: s13p09b
        chapter: 23
        terms: [roc-curve-and-auc, sensitivity-and-specificity, confusion-matrix]
        topic: 投票予測モデルの予測確率から同点を含む検証データのAUCを順位の組の比較で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          モデル 2 を、当てはめに使っていない 9 人に適用したところ、予測確率は次のようになった。

          | 実際に投票した人（4 人） | «v1» | «v2» | «v3» | «v4» | |
          |---|---|---|---|---|---|
          | 実際に棄権した人（5 人） | «u1» | «u2» | «u3» | «u4» | «u5» |

          「予測確率がしきい値以上なら投票すると判定する」としてしきい値を動かし、点（偽陽性率，真陽性率）を順に線分で結んだ ROC 曲線を描く。この ROC 曲線の下の面積（AUC）を求めよ。
        answer: «auc»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** AUC は「投票した人と棄権した人を 1 人ずつ無作為に選んだとき、投票した人の予測確率の方が大きい確率」に等しい。予測確率が同じ組では、しきい値を動かすと偽陽性率と真陽性率が同時に増えて ROC 曲線が斜めの線分になるので、その組は $1/2$ と数える。

          **途中式** 投票した人それぞれについて、棄権した 5 人より予測確率が大きい人数（同点は 0.5）を数える。

          - «v1»：5 人すべてより大きい → «w1»
          - «v2»：5 人すべてより大きい（«u1» より大きい） → «w2»
          - «v3»：«u1» より小さく、残り 4 人より大きい → «w3»
          - «v4»：«u4»、«u5» より大きく、«u3» と同点、«u1»、«u2» より小さい → $2+0.5=«w4»$

          合計 $«wins»$、組の数は $4\times5=20$ なので
          $$\mathrm{AUC}=\frac{«wins»}{20}=«auc_s»$$

          **答え** $«auc_s»$

          **間違えやすい点** 同点の組を 0 と数えると $«auc_0»$、1 と数えると $«auc_1»$ になる。しきい値 «v4» では投票者 1 人と棄権者 1 人が同時に「投票」に変わるので、ROC 曲線は台形の斜辺になり、その面積の半分が同点の寄与になる。

  - id: s13p10
    title: 職業訓練プログラムの効果の評価
    context: |
      ある県の雇用政策として、求職者向けの職業訓練プログラムの効果を調べる。成果の指標は、訓練開始から 1 年後の月収の増加額（万円）とする。
    items:
      - id: s13p10a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 3つの職業訓練コースの平均月収増を一元配置の誤差分散とスチューデント化範囲を使うテューキー法で対比較する
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの訓練コース A、B、C に各 «n» 人を無作為に割り付けた。平均の増加額は A «mA»、B «mB»、C «mC» で、一元配置分散分析の誤差の平均平方は «mse»（自由度 «dfe»）だった。
          テューキー法（有意水準 5%）で 3 組の平均の差を比べる。スチューデント化された範囲の上側 5% 点 $q_{0.05}(3,27)=«q»$、$t$ 分布の上側 2.5% 点 $t_{0.025}(27)=«t»$ とする。
          正しい記述はどれか（「臨界値」は平均の差と比べる値）。
        choices:
          - '臨界値は «hsd_w» で、有意な差のある組はない'
          - '臨界値は «hsd» で、C と A の組だけが有意'
          - '臨界値は «lsd» で、B と A、C と A の 2 組が有意'
          - '臨界値は «hsd_n» で、有意な差のある組はない'
          - '臨界値は «hsd» で、B と A、C と A の 2 組が有意'
        answer: 1
        distractors:
          - スチューデント化範囲の q に √(2MSE/n) を掛けた（q 用の標準誤差は √(MSE/n)）
          - 正解
          - 多重性を考えず、t 分布の点で各組を検定した（最小有意差法）
          - 平均平方を n で割り忘れ q√MSE とした
          - 臨界値は正しいが、B と A の差 2.0 を臨界値以上と読み違えた
        explanation: |
          **方針** 各群の人数が等しいテューキー法では、2 群の平均の差の絶対値が
          $$q_{0.05}(a,\phi_E)\sqrt{\frac{MS_E}{n}}$$
          以上なら有意とする（$a$ は群の数、$\phi_E$ は誤差の自由度）。

          **途中式**
          $$\sqrt{\frac{«mse»}{«n»}}=\sqrt{«mse_n»}=«sm»,\qquad «q»\times«sm»=«hsd4»$$
          平均の差は $|B-A|=«dBA»$、$|C-A|=«dCA»$、$|C-B|=«dCB»$。臨界値 «hsd» 以上は $C-A$ だけ。

          **答え** C と A の組だけが有意。

          **間違えやすい点** スチューデント化範囲 $q$ は「1 群の平均の標準誤差」$\sqrt{MS_E/n}$ に掛ける。$t$ 検定のように $\sqrt{2MS_E/n}=«s2m»$ に掛けると «hsd_w» になり、厳しくなりすぎる（$t$ に対応させるなら $q/\sqrt2$ を使う）。
          $t$ 分布の点を使う最小有意差法（臨界値 $«t»\times«s2m»\approx«lsd»$）は 3 組を繰り返し検定するので、全体の第一種の過誤の確率が 5% を超える。

      - id: s13p10b
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 抽選で受講資格を与えた職業訓練で実際の受講の効果を操作変数（ワルド推定量）で求める
        level: 応用
        definition: false
        type: numeric
        question: |
          別の大規模なプログラムでは、応募者 1000 人を抽選で 500 人ずつに分け、当選者だけに優先的な受講資格を与えた。ただし当選しても受講しない人や、落選しても別の枠で受講する人がいる。

          | | 実際に受講した割合 | 月収の増加額の平均 |
          |---|---|---|
          | 当選（500 人） | «p1» | «y1» |
          | 落選（500 人） | «p0» | «y0» |

          なお、実際に受講した人と受講しなかった人の平均を単純に比べると、差は約 «naive» 万円だった。
          抽選の当否を操作変数として、受講が月収の増加額に与える効果を推定せよ（抽選の当否は受講を通してのみ月収に影響し、当選によって受講をやめる人はいないとする）。
        answer: «late»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 操作変数 $Z$（当選 $=1$）が 2 値のとき、操作変数推定量はワルド推定量
          $$\hat\beta_{IV}=\frac{\bar Y_{Z=1}-\bar Y_{Z=0}}{\bar D_{Z=1}-\bar D_{Z=0}}$$
          になる（$D$ は受講 $=1$）。分子は抽選の当否による月収の差、分母は受講率の差。

          **途中式**
          $$\hat\beta_{IV}=\frac{«y1»-«y0»}{«p1»-«p0»}=\frac{«dy»}{«dp»}=«late4»$$

          **答え** $«late»$ 万円（抽選によって受講するかどうかが変わる人々での平均効果）

          **間違えやすい点** 分子の $«dy»$ は「当選したこと」の効果（ITT 効果）で、受講しない当選者も含むため受講の効果を薄めている。
          受講者と非受講者の単純比較（約 «naive» 万円）は、意欲の高い人ほど受講しやすいという自己選択（内生性）の偏りを含む。分母の受講率の差で割ることで、抽選によって生じた受講の違いだけを取り出す。

  - id: s13p11
    title: 待機児童数の標本調査
    context: |
      ある県には «N» の市町村があり、県全体の人口は $X=«X»$ 人である。県は全市町村の待機児童数の合計 $Y$ を推定するため、
      人口に比例する確率で «nn» 市町村を非復元で抽出した。抽出方法は、市町村 $i$ の人口を $x_i$ として、各市町村が標本に含まれる確率（包含確率）が
      $\pi_i=«nn»x_i/X$ となるように設計されている（どの市町村も $\pi_i<1$）。
    items:
      - id: s13p11a
        chapter: 21
        terms: [horvitz-thompson-estimator, inclusion-probability, probability-proportional-to-size-sampling]
        topic: 人口に比例する確率で抽出した市町村の待機児童数から県全体の総数をホルヴィッツ・トンプソン推定量で推定する
        level: 標準
        definition: false
        type: choice
        question: |
          抽出された 3 市町村の人口と待機児童数は次のとおりだった。

          | 市町村 | 人口 $x_i$ | 待機児童数 $y_i$ |
          |---|---|---|
          | 1 | «x1» | «y1» |
          | 2 | «x2» | «y2» |
          | 3 | «x3» | «y3» |

          県全体の待機児童数 $Y$ のホルヴィッツ・トンプソン推定値に最も近いものはどれか。
        choices:
          - '$«w_srs»$'
          - '$«ht»$'
          - '$«w_ratio»$'
          - '$«w_nopi»$'
          - '$«w_div»$'
        answer: 1
        distractors:
          - 包含確率を無視し、単純無作為抽出の推定量 (N/n)Σy を使った
          - 正解
          - 人口を補助情報とする比推定 (Σy/Σx)X を計算した（抽出確率による重みとは別の推定量）
          - 包含確率を n を掛けない 1 回の抽出確率 x_i/X とした
          - ホルヴィッツ・トンプソン推定量をさらに標本数 n で割った
        explanation: |
          **方針** ホルヴィッツ・トンプソン推定量は $\hat Y_{HT}=\sum_{i\in s}y_i/\pi_i$。各標本値を包含確率の逆数（抽出ウェイト）で重み付けして足す。

          **途中式** 包含確率は
          $$\pi_1=\frac{3\times«x1»}{«X»}=«pi1»,\quad \pi_2=\frac{3\times«x2»}{«X»}=«pi2»,\quad \pi_3=\frac{3\times«x3»}{«X»}=«pi3»$$
          $$\hat Y_{HT}=\frac{«y1»}{«pi1»}+\frac{«y2»}{«pi2»}+\frac{«y3»}{«pi3»}=«h1»+«h2»+«h3»=«ht1»$$

          **答え** 約 $«ht»$ 人

          **間違えやすい点** 人口の大きい市町村ほど抽出されやすいので、単純無作為抽出の式 $\frac{«N»}{3}\times«sy»=«w_srs»$ では大きい市町村の値を過大に代表させてしまう。
          包含確率は「3 回の抽出のどこかで選ばれる確率」なので $n=3$ を掛ける（掛け忘れると $«w_nopi»$）。比推定 $\frac{«sy»}{«sx»}\times X=«w_ratio»$ も合理的な推定量だが、問われているホルヴィッツ・トンプソン推定量とは別のもの。

  - id: s13p12
    title: 地域指標による市区町村の類型化
    context: |
      地域政策の基礎資料として、市区町村の特徴を表す指標を多変量解析で整理する。
    items:
      - id: s13p12a
        chapter: 24
        terms: [k-means-method, non-hierarchical-clustering, standardization-before-clustering]
        topic: 6地域の標準化した2指標にk平均法を適用し初期中心から2回目の割り当てで所属の変わる地域を調べる
        level: 基本
        definition: false
        type: choice
        question: |
          6 つの地域 A〜F の 2 つの指標（高齢化率と人口増減率をそれぞれ標準化したもの）は次のとおりである。

          | 地域 | A | B | C | D | E | F |
          |---|---|---|---|---|---|---|
          | 高齢化率 | «Ax» | «Bx» | «Cx» | «Dx» | «Ex» | «Fx» |
          | 人口増減率 | «Ay» | «By» | «Cy» | «Dy» | «Ey» | «Fy» |

          $k=2$ の $k$-平均法（ユークリッド距離）を、初期中心を B と C の位置として始める。
          1 回目は各地域を近い方の初期中心に割り当て、各クラスターの平均を新しい中心とする。2 回目はその中心を使って割り当て直す。正しい記述はどれか。
        choices:
          - 2 回目の割り当てで所属が変わる地域はなく、ここで収束する
          - 2 回目の割り当てで所属が変わるのは F だけである
          - 2 回目の割り当てで C と F の所属が入れ替わる
          - 2 回目の割り当てで C と F の所属が入れ替わり、そのあと中心を更新するとクラスター内平方和の合計は 1 回目の更新後より大きくなる
          - 2 回目の割り当てで C と F の所属が入れ替わり、2 つのクラスターの大きさは 4 と 2 になる
        answer: 2
        distractors:
          - 中心を更新せず、初期中心（B、C の位置）のまま割り当て直した
          - C は初期中心に選ばれた地域なので、ずっと同じクラスターに残ると思い込んだ
          - 正解
          - k-平均法の各ステップでクラスター内平方和は増えないことを理解していない
          - 入れ替わりで大きさが変わると誤解した（3 と 3 のまま）
        explanation: |
          **方針** 各地域から 2 つの中心までの距離の 2 乗を計算し、近い方に割り当てる。割り当てた後は各クラスターの平均を中心とする。

          **途中式** 1 回目：初期中心 B$(«Bx»,«By»)$、C$(«Cx»,«Cy»)$ までの距離の 2 乗は

          | 地域 | A | B | C | D | E | F |
          |---|---|---|---|---|---|---|
          | B まで | «Ab» | «Bb» | «Cb» | «Db» | «Eb» | «Fb» |
          | C まで | «Ac» | «Bc» | «Cc» | «Dc» | «Ec» | «Fc» |

          なので、クラスター 1 は $\{A,B,F\}$、クラスター 2 は $\{C,D,E\}$。新しい中心は
          $$m_1=\left(\frac{«Ax»+(«Bx»)+«Fx»}{3},\frac{«Ay»+«By»+«Fy»}{3}\right)=(«m1x»,\ «m1y»),\qquad m_2=\left(\frac{«Cx»+«Dx»+«Ex»}{3},\frac{«Cy»+(«Dy»)+(«Ey»)}{3}\right)\approx(«m2x»,\ «m2y»)$$
          2 回目：新しい中心までの距離の 2 乗は

          | 地域 | A | B | C | D | E | F |
          |---|---|---|---|---|---|---|
          | $m_1$ まで | «A1» | «B1» | «C1» | «D1» | «E1» | «F1» |
          | $m_2$ まで | «A2» | «B2» | «C2» | «D2» | «E2» | «F2» |

          C は $m_1$ の方が近くなり（«C1» < «C2»）、F は $m_2$ の方が近くなる（«F2» < «F1»）。新しいクラスターは $\{A,B,C\}$ と $\{D,E,F\}$。

          **答え** C と F の所属が入れ替わる。

          **間違えやすい点** 初期中心に選んだ地域も、中心が動けば別のクラスターに移りうる（C がその例）。
          $k$-平均法では割り当てと中心の更新のどちらでもクラスター内平方和は増えない。実際、1 回目の更新後は «wss1»、2 回目の更新後は «wss2» と減っている。
          入れ替わりなので、クラスターの大きさは 3 と 3 のまま。

      - id: s13p12b
        chapter: 25
        terms: [graphical-model, precision-matrix, undirected-graphical-model, conditional-independence]
        topic: 4つの地域指標の精度行列のゼロ成分から無向グラフの辺と条件付き独立を読み取る
        level: 基本
        definition: false
        type: choice
        question: |
          4 つの指標 $X_1$（高齢化率）、$X_2$（単身世帯率）、$X_3$（投票率）、$X_4$（自治会加入率）が 4 変量正規分布に従うとし、
          その分散共分散行列 $\Sigma$ と精度行列（$\Sigma$ の逆行列）$\Omega$ が次のように推定された（$\Sigma$ は小数第 3 位に丸めた値）。
          $$\Omega=\begin{pmatrix}«w11»&«w12»&«w13»&«w14»\\«w12»&«w22»&«w23»&«w24»\\«w13»&«w23»&«w33»&«w34»\\«w14»&«w24»&«w34»&«w44»\end{pmatrix},\qquad
          \Sigma\approx\begin{pmatrix}«S11»&«S12»&«S13»&«S14»\\«S12»&«S22»&«S23»&«S24»\\«S13»&«S23»&«S33»&«S34»\\«S14»&«S24»&«S34»&«S44»\end{pmatrix}$$
          この分布のグラフィカルモデル（無向グラフ）について、正しい記述はどれか。
        choices:
          - '$\Omega$ の $(1,3)$ 成分が 0 なので、$X_1$ と $X_3$ は無相関である'
          - '$\Omega$ の $(1,4)$ 成分 $«w14»$ は正なので、$X_2,X_3$ を与えたときの $X_1$ と $X_4$ の偏相関係数は正である'
          - '$X_1$ と $X_3$ は、$X_2$ と $X_4$ を与えたとき条件付き独立である'
          - '$\Sigma$ の非対角成分はすべて 0 でないので、無向グラフでは 6 本の辺がすべて引かれる'
          - '$\Omega$ の $(2,4)$ 成分は 0 だが、$X_2$ と $X_4$ は $X_1$ と $X_3$ を与えても条件付き独立ではないので、2 つの間に辺を引く'
        answer: 2
        distractors:
          - 精度行列のゼロ（条件付き独立）を、分散共分散行列のゼロ（周辺的な無相関）と取り違えた
          - 偏相関係数は −ω_ij/√(ω_ii ω_jj) で、精度行列の成分と符号が逆になることを忘れた
          - 正解
          - 辺の有無を分散共分散行列（周辺の相関）で判断した
          - 精度行列の成分 0 が、残りすべてを与えたときの条件付き独立を表すことを理解していない
        explanation: |
          **方針** 多変量正規分布では、精度行列の $(i,j)$ 成分が 0 であることと、「残りの変数をすべて与えたとき $X_i$ と $X_j$ が条件付き独立」であることが同値。無向グラフでは、精度行列の非対角成分が 0 でない組にだけ辺を引く。

          **途中式** $\Omega$ の非対角成分で 0 なのは $(1,3)$ と $(2,4)$。よって辺は $X_1-X_2$、$X_2-X_3$、$X_3-X_4$、$X_1-X_4$ の 4 本（四角形）で、
          $X_1\perp X_3\mid (X_2,X_4)$、$X_2\perp X_4\mid(X_1,X_3)$ が成り立つ。
          一方 $\Sigma$ の $(1,3)$ 成分は $«S13»\ne0$ なので、$X_1$ と $X_3$ は周辺的には相関している（$X_2$ や $X_4$ を通じた経路があるため）。
          $X_1$ と $X_4$ の偏相関係数は
          $$-\frac{\omega_{14}}{\sqrt{\omega_{11}\omega_{44}}}=-\frac{«w14»}{\sqrt{«w11»\times«w44»}}=-\frac{«w14»}{«den14»}\approx«pc14»$$
          で負。

          **答え** $X_1$ と $X_3$ は、$X_2$ と $X_4$ を与えたとき条件付き独立である。

          **間違えやすい点** 条件付き独立（精度行列のゼロ）と無相関（分散共分散行列のゼロ）は別物で、グラフの辺は前者で決まる。
          偏相関係数は精度行列の成分に負号を付けて正規化したもの。

  - id: s13p13
    title: 失業率の月次変化の時系列モデル
    context: |
      ある国の完全失業率の前月差（ポイント）を $X_t$ とする。長期のデータから、$X_t$ は弱定常で、標本自己相関係数は
      ラグ 1 で $r_1=«r1»$、ラグ 2 で $r_2=«r2»$ だった。
    items:
      - id: s13p13a
        chapter: 27
        terms: [yule-walker-equations, ar-model, partial-autocorrelation]
        topic: 失業率の前月差にAR(2)モデルを当てはめラグ1とラグ2の標本自己相関からユール・ウォーカー方程式で係数を推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          $X_t$ に AR(2) モデル $X_t=c+\phi_1X_{t-1}+\phi_2X_{t-2}+\varepsilon_t$（$\varepsilon_t$ はホワイトノイズ）を当てはめる。
          ユール・ウォーカー方程式による $\phi_1$ の推定値を求めよ。
        answer: «phi1»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** AR(2) の自己相関は $\rho_k=\phi_1\rho_{k-1}+\phi_2\rho_{k-2}$（$k\ge1$、$\rho_0=1$、$\rho_{-1}=\rho_1$）を満たす。$k=1,2$ の式に標本自己相関を入れて $\phi_1,\phi_2$ の連立方程式を解く。

          **途中式**
          $$r_1=\phi_1+\phi_2r_1,\qquad r_2=\phi_1r_1+\phi_2$$
          2 つ目から $\phi_2=r_2-\phi_1r_1$。1 つ目に代入して $r_1=\phi_1+(r_2-\phi_1r_1)r_1$、すなわち $\phi_1(1-r_1^2)=r_1(1-r_2)$。
          $$\hat\phi_1=\frac{r_1(1-r_2)}{1-r_1^2}=\frac{«r1»\times«omr2»}{1-«r1sq»}=\frac{«num1»}{«den»}=«phi1_5»$$
          $$\hat\phi_2=\frac{r_2-r_1^2}{1-r_1^2}=\frac{«num2»}{«den»}=«phi2»$$
          （確認：$\hat\phi_1+\hat\phi_2r_1=«chk»=r_1$、$\hat\phi_1r_1+\hat\phi_2=«chk2»=r_2$。）

          **答え** $«phi1»$

          **間違えやすい点** AR(1) とみなして $\hat\phi_1=r_1=«w_ar1»$ とするのは誤り。AR(2) では $X_{t-2}$ の影響を除いた分だけ $\phi_1$ が変わる。
          $\hat\phi_2=«phi2»$ はラグ 2 の標本偏自己相関係数に一致する（$\phi_2$ の式と取り違えないこと）。

  - id: s13p14
    title: 町長選挙の支持率のベイズ推定
    context: |
      ある町の町長選挙で、現職候補の支持率 $\theta$ を推定する。過去の選挙結果を参考に、$\theta$ の事前分布をベータ分布 $\mathrm{Be}(«a»,«b»)$
      （密度 $\propto\theta^{«a»-1}(1-\theta)^{«b»-1}$、平均 «pmean0»）とした。
      町の有権者から無作為に «nn» 人を選んで聞いたところ、«k» 人が現職を支持すると答えた。有権者は十分多く、回答は $\theta$ を与えたとき独立とする。
    items:
      - id: s13p14a
        chapter: 31
        terms: [beta-binomial-model, predictive-distribution, posterior-distribution]
        topic: ベータ・二項モデルの事後分布から次に聞く有権者2人がともに支持する事後予測確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          このデータを得た後、さらに有権者を 2 人無作為に選んで聞くとき、2 人とも現職を支持すると答える事後予測確率を求めよ。
        answer: «pred»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ベータ分布は二項分布の共役事前分布なので、事後分布は $\mathrm{Be}(a+k,\ b+n-k)$。予測確率は $P(2\text{人とも支持}\mid\text{データ})=E[\theta^2\mid\text{データ}]$ で、ベータ分布の 2 次モーメントから求める。

          **途中式** 事後分布は $\mathrm{Be}(«a»+«k»,\ «b»+«nk»)=\mathrm{Be}(«A»,«B»)$。$\mathrm{Be}(A,B)$ では
          $$E[\theta^2]=\frac{A(A+1)}{(A+B)(A+B+1)}$$
          なので
          $$\frac{«A»\times«A1»}{«AB»\times«AB1»}=\frac{«num»}{«den»}=«pred5»$$
          （1 人目が支持する予測確率 $«A»/«AB»$ と、1 人目の支持を加えて更新した後の $«A1»/«AB1»$ の積と考えてもよい。）

          **答え** $«pred_s»$

          **間違えやすい点** 事後平均 $«pm»$ を 2 乗すると $«w_sq»$ になり、$\theta$ の不確かさ（事後分散）の分だけ小さすぎる。$E[\theta^2]=(E[\theta])^2+V[\theta]$ である。
          事前分布を無視して $(«k»/«nn»)^2=«w_mle»$ としたり、データを使わず事前分布のまま計算する（$«w_prior2»$）のも誤り。
