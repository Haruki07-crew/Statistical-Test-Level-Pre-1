      - id: s13p05b
        chapter: 10
        terms: [holm-method, bonferroni-correction, multiple-testing]
        topic: 施策の副次的な5指標のp値にホルム法を適用し棄却される指標を決める
        level: 標準
        definition: false
        type: choice
        question: |
          この主要な指標とは別に、副次的な 5 つの指標 A〜E についても同じ 12 市町村で前後比較の検定を行い、次の $p$ 値を得た。

          | 指標 | A | B | C | D | E |
          |---|---|---|---|---|---|
          | $p$ 値 | «pA» | «pB» | «pC» | «pD» | «pE» |

          5 つの検定全体の第一種の過誤の確率（ファミリーワイズエラー率）を 0.05 以下に抑えるため、**ホルム法**を用いる。帰無仮説が棄却される指標の組として正しいものはどれか。
        choices:
          - 'A のみ'
          - 'A と B'
          - 'A、B、D'
          - 'A、B、C、D'
          - '棄却される指標はない'
        answer: 1
        distractors:
          - ボンフェローニ法（すべて 0.05/5 と比較）を使った
          - 正解
          - 3 番目で棄却できなかったのに手続きを止めず、4 番目の D を 0.05/2 と比べて棄却した
          - 多重性を調整せず、すべて 0.05 と比べた
          - p 値を 5 倍したうえで、さらに 0.05/5 と比べ、補正を二重にかけた
        explanation: |
          **方針** ホルム法は $p$ 値を小さい順に並べ、$k$ 番目を $\alpha/(m-k+1)$ と比べる。棄却できなくなったところで止め、それ以降はすべて棄却しない。

          **途中式** 小さい順に A «pA»、B «pB»、C «pC»、D «pD»、E «pE»（$m=5$）。

          | 順位 $k$ | 指標 | $p$ 値 | 基準 $0.05/(5-k+1)$ | 判定 |
          |---|---|---|---|---|
          | 1 | A | «pA» | «h1» | 棄却 |
          | 2 | B | «pB» | «h2» | 棄却 |
          | 3 | C | «pC» | «h3» | 棄却できない → ここで停止 |
          | 4 | D | «pD» | — | 棄却しない |
          | 5 | E | «pE» | — | 棄却しない |

          **答え** A と B

          **間違えやすい点** C で止めずに D を $0.05/2=«h4»$ と比べると D も棄却してしまうが、ホルム法は途中で止める手続き（ステップダウン法）なので誤り。
          ボンフェローニ法（すべて $0.05/5=«h1»$ と比べる）では A しか棄却できず、ホルム法はそれより検出力が高い（ファミリーワイズエラー率は同じく 0.05 以下）。調整しないと A〜D の 4 つを棄却してしまい、全体の誤りの確率を抑えられない。

