          $$\hat\psi_{MH}=\frac{«adX»+«adY»}{«bcX»+«bcY»}=\frac{«sad»}{«sbc»}=«mh4»$$
          市ごとのオッズ比は X が $«orX»$、Y が $«orY»$ で、統合値はその間に入る。

          **答え** $«mh»$

          **間違えやすい点** 2 市を合算すると送付 «Pa»/«Pb»、送付なし «Pc»/«Pd» でオッズ比 $«crude»$ となり、どちらの市のオッズ比よりも大きい。
