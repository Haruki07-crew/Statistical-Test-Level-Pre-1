set: 13
title: 模擬試験 第13回
minutes: 90
problems:
  - id: s13p01
    title: ランダム化回答法による住民意識調査
    context: |
      ある市が住民意識調査で「過去 1 年間に粗大ごみを指定日以外に出したことがあるか」という答えにくい質問をする。
      正直な回答を得るため、次の**ランダム化回答法**を使う。回答者は調査員に見えないようにサイコロを 1 回振り、

      - 1〜4 の目が出たら、質問に**正直に**「はい」「いいえ」で答える
      - 5 の目が出たら、質問に関係なく「はい」と答える
      - 6 の目が出たら、質問に関係なく「いいえ」と答える

      サイコロの目は調査員にも分からない。住民のうち実際に該当する人（「はい」が本当の答えの人）の割合を $\pi$ とする。
    items:
      - id: s13p01a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: ランダム化回答法で「はい」と答えた人が実際に該当者である条件付き確率をベイズの定理で求める
        level: 基本
        definition: false
        type: choice
        question: |
          前回の調査から $\pi=«pi0»$ と見込まれている。無作為に選んだ住民がこの方法で「はい」と答えたとき、その人が実際に該当者である確率に最も近い値はどれか。
        choices:
          - '$«c_ty»$'
          - '$«c_honest»$'
          - '$«post»$'
          - '$«c_prior»$'
          - '$«c_py»$'
        answer: 2
        distractors:
          - 条件付き確率の向きを逆にし、P(はい | 該当) を答えた
          - 該当者の「はい」を正直に答えた分（4/6）だけで数え、5 の目で強制的に「はい」になった分を落とした
          - 正解
          - 回答を使わず事前の割合 π をそのまま答えた
          - 条件付き確率ではなく「はい」と答える確率 P(はい) を答えた
        explanation: |
          **方針** 該当者を $T$、「はい」と答えることを $Y$ とする。$P(Y\mid T)$ と $P(Y\mid \bar T)$ をサイコロの規則から求め、全確率の公式で $P(Y)$、ベイズの定理で $P(T\mid Y)$ を計算する。

          **途中式** 該当者は 1〜4 の目（確率 $4/6$）で正直に「はい」、5 の目（確率 $1/6$）でも「はい」と答えるので $P(Y\mid T)=5/6$。
          非該当者が「はい」と答えるのは 5 の目のときだけなので $P(Y\mid\bar T)=1/6$。
          $$P(Y)=«pi0»\times\frac56+«den_n6»\times\frac16=«num»+«den_n»=«py»$$
          $$P(T\mid Y)=\frac{P(T)P(Y\mid T)}{P(Y)}=\frac{«pi0»\times 5/6}{«pi0»\times 5/6+«den_n6»\times 1/6}=\frac{«num6»}{«py6»}=«post5»$$
          （2 行目は分子・分母に 6 を掛けて $\frac{«pi0»\times5}{«pi0»\times5+«den_n6»}$ とした。）

          **答え** $«post»$

          **間違えやすい点** $P(Y\mid T)=5/6\approx«c_ty»$ は「該当者が『はい』と答える確率」で、求める $P(T\mid Y)$ とは向きが逆。
          該当者の「はい」を正直な回答分 $4/6$ だけで数えると $«c_honest»$ になるが、該当者も 5 の目では「はい」と答える。
          「はい」と答えた人でも該当者は半分以下で、これが回答者のプライバシーを守る仕組みになっている。

      - id: s13p01b
        chapter: 8
        terms: [unbiased-estimator, standard-error, binomial-distribution]
        topic: ランダム化回答法の該当率の不偏推定量とその標準誤差（直接質問より大きくなる）
        level: 標準
        definition: false
        type: numeric
        question: |
          本調査で «n» 人に無作為に回答してもらったところ、«y» 人が「はい」と答えた。回答者どうしは独立とする。
          「はい」の割合 $\hat p$ から作る $\pi$ の不偏推定量 $\hat\pi$ の**標準誤差の推定値**（$\hat p$ を真の値の代わりに使ったもの）を求めよ。
        answer: «se»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 1 人が「はい」と答える確率は $p=\frac46\pi+\frac16$ である。これを $\pi$ について解いた式に $\hat p$ を入れたものが不偏推定量になる。分散は $\hat p$ の分散（二項分布）の定数倍。

          **途中式** $p=\frac23\pi+\frac16$ より $\pi=\frac{p-1/6}{2/3}=1.5p-0.25$。そこで
          $$\hat\pi=1.5\hat p-0.25,\qquad \hat p=\frac{«y»}{«n»}=«ph»,\qquad \hat\pi=1.5\times«ph»-0.25=«pih»$$
          $E[\hat p]=p$ なので $E[\hat\pi]=1.5p-0.25=\pi$（不偏）。分散は
          $$V[\hat\pi]=1.5^2\,V[\hat p]=2.25\times\frac{p(1-p)}{n}$$
          $p$ に $\hat p$ を代入して
          $$\frac{\hat p(1-\hat p)}{n}=\frac{«ph»\times(1-«ph»)}{«n»}=\frac{«pq»}{«n»}=«v1»,\qquad \sqrt{«v1»}=«se_p»$$
          $$\mathrm{SE}(\hat\pi)=1.5\times«se_p»=«se5»$$

          **答え** $«se»$

          **間違えやすい点** 係数 1.5 を掛け忘れると $«se_no15»$、分散に 1.5（2 乗の 2.25 ではなく）を掛けると $«se_15var»$ になる。
          全員に直接質問して同じ $\hat\pi=«pih»$ を得た場合の標準誤差 $\sqrt{«pih»\times(1-«pih»)/«n»}=«se_direct»$ と比べると約 «ratio» 倍で、正直な回答を引き出す代わりに精度が下がる。

  - id: s13p02
    title: 世帯の子ども数と高齢者の同居
    context: |
      ある地域の世帯を無作為に 1 つ選び、18 歳未満の子どもの人数を $X$、同居する 65 歳以上の人の有無を $Y$（同居あり $=1$、なし $=0$）とする。
      国勢調査の集計から、$(X,Y)$ の同時確率は次の表のとおりとする（この地域では子どもは 2 人以下、65 歳以上の同居は 1 人以下とみなす）。

      | | $Y=0$ | $Y=1$ |
      |---|---|---|
      | $X=0$ | «p00» | «p01» |
      | $X=1$ | «p10» | «p11» |
      | $X=2$ | «p20» | «p21» |
    items:
      - id: s13p02a
        chapter: 2
        terms: [joint-probability-function, conditional-probability-function, marginal-probability-function, conditional-expectation]
        topic: 子ども数と高齢者同居の同時確率表から高齢者と同居する世帯の平均子ども数（条件付き期待値）
        level: 基本
        definition: false
        type: choice
        question: |
          65 歳以上の人と同居している世帯について、子どもの人数の期待値 $E[X\mid Y=1]$ はどれか。
        choices:
          - '$«w_ex»$'
          - '$«w_joint»$'
          - '$«w_y0»$'
          - '$«condE»$'
          - '$«w_rev»$'
        answer: 3
        distractors:
          - 条件を付けずに周辺分布から E[X] を計算した
          - 同時確率のまま x P(X=x, Y=1) を足し、P(Y=1) で割らなかった
          - 条件を取り違えて E[X | Y=0] を計算した
          - 正解
          - 条件付きの向きを逆にして P(Y=1 | X=1) を計算した
        explanation: |
          **方針** まず $Y=1$ の周辺確率 $P(Y=1)$ を求め、$Y=1$ の列の同時確率をそれで割って条件付き確率関数 $P(X=x\mid Y=1)$ を作る。その分布で期待値をとる。

          **途中式** $P(Y=1)=«p01»+«p11»+«p21»=«py1»$。条件付き確率関数は
          $$P(X=0\mid Y=1)=\frac{«p01»}{«py1»}=«c0»,\quad P(X=1\mid Y=1)=\frac{«p11»}{«py1»}=«c1»,\quad P(X=2\mid Y=1)=\frac{«p21»}{«py1»}=«c2»$$
          $$E[X\mid Y=1]=0\times«c0»+1\times«c1»+2\times«c2»=«condE»$$
          （まとめて書くと $\frac{1\times«p11»+2\times«p21»}{«py1»}=\frac{«exy1»}{«py1»}$。）

          **答え** $«condE»$

          **間違えやすい点** $\sum_x xP(X=x,Y=1)=«w_joint»$ は同時確率の和で、$P(Y=1)$ で割って初めて条件付き期待値になる。
          全世帯の平均 $E[X]=«w_ex»$ や、同居なしの世帯の平均 $E[X\mid Y=0]=«w_y0»$ と取り違えないこと。高齢者と同居する世帯は子どもが少ない傾向にある。

      - id: s13p02b
        chapter: 3
        terms: [covariance-and-correlation, expectation-variance-properties, bernoulli-distribution]
        topic: 子ども数と高齢者同居の有無（0/1）の同時確率表から相関係数を求める
        level: 標準
        definition: false
        type: choice
        question: |
          $X$ と $Y$ の相関係数に最も近い値はどれか。
        choices:
          - '$«w_cov»$'
          - '$«rho»$'
          - '$«w_var»$'
          - '$«w_exy»$'
          - '$«w_sdx1»$'
        answer: 1
        distractors:
          - 共分散を相関係数と取り違え、標準偏差で割らなかった
          - 正解
          - 標準偏差の積ではなく分散の積で割った
          - 共分散の代わりに E[XY] を標準偏差の積で割った（E[X]E[Y] を引き忘れた）
          - X の標準偏差の代わりに √E[X²] を使った（平均を引き忘れた）
        explanation: |
          **方針** 周辺分布から $E[X],V[X],E[Y],V[Y]$、同時分布から $E[XY]$ を求め、$\mathrm{Cov}(X,Y)=E[XY]-E[X]E[Y]$ を標準偏差の積で割る。

          **途中式** $X$ の周辺確率は $P(X=0)=«px0»$、$P(X=1)=«px1»$、$P(X=2)=«px2»$。
          $$E[X]=«px1»+2\times«px2»=«ex»,\quad E[X^2]=«px1»+4\times«px2»=«ex2»,\quad V[X]=«ex2»-«ex»^2=«vx»$$
          $Y$ はベルヌーイ分布なので $E[Y]=«py1»$、$V[Y]=«py1»\times«py0»=«vy»$。
          $XY$ が 0 でないのは $Y=1$ のときだけなので $E[XY]=1\times«p11»+2\times«p21»=«exy»$。
          $$\mathrm{Cov}(X,Y)=«exy»-«ex»\times«py1»=«exy»-«exey»=«cov»$$
          $$\rho=\frac{«cov»}{\sqrt{«vx»}\sqrt{«vy»}}=\frac{«cov»}{«sdx»\times«sdy»}=\frac{«cov»}{«den»}=«rho5»$$

          **答え** $«rho»$

          **間違えやすい点** 共分散 $«cov»$ のままでは相関係数ではない。分散の積 $«vx»\times«vy»$ で割ると $«w_var»$ になる。
          $E[X]E[Y]$ を引き忘れて $E[XY]$ を使うと符号まで変わって $«w_exy»$ になる。

  - id: s13p03
    title: 所得分布の上側の裾
    context: |
      ある国の世帯所得の上位層の分析では、世帯所得 $X$（万円）が次のパレート分布に従うとみなすことが多い。
      $$P(X>x)=\left(\frac{x_m}{x}\right)^{\alpha}\quad(x\ge x_m),\qquad f_X(x)=\frac{\alpha x_m^{\alpha}}{x^{\alpha+1}}\quad(x\ge x_m)$$
      ここでは $x_m=«xm»$、$\alpha=«a»$ とする。
    items:
      - id: s13p03a
        chapter: 4
        terms: [change-of-variables, log-transformation, weighted-geometric-harmonic-mean, exponential-distribution]
        topic: パレート分布の所得の対数を変数変換で指数分布と見抜き所得の幾何平均を求める
        level: 応用
        definition: false
        type: choice
        question: |
          $Y=\log(X/x_m)$（自然対数）とおき、$Y$ の分布を求めることで、所得の幾何平均 $\exp(E[\log X])$ を計算する。最も近い値はどれか。
          必要なら $e^{1/3}=«e13»$、$e^{1/4}=«e14»$、$e^{1/2}=«e12»$、$2^{1/3}=«c2»$ を使え。
        choices:
          - '$«g_mean»$'
          - '$«g_jac»$'
          - '$«g_med»$'
          - '$«gm»$'
          - '$«g_am1»$'
        answer: 3
        distractors:
          - 幾何平均ではなく算術平均 αx_m/(α−1) を答えた
          - 変数変換でヤコビアン dx/dy=x_m e^y を掛け忘れ、Y の密度を e^{−(α+1)y} に比例すると誤って E[Y]=1/(α+1) とした
          - 幾何平均ではなく中央値 x_m 2^{1/α} を答えた
          - 正解
          - パレート分布の平均の式 α/(α−1) と混同して E[Y]=1/(α−1) とした
        explanation: |
          **方針** $Y=\log(X/x_m)$ の分布関数を求めると指数分布になる。$\log X=\log x_m+Y$ なので $E[\log X]=\log x_m+E[Y]$、幾何平均は $x_m e^{E[Y]}$。

          **途中式** $y\ge0$ について
          $$P(Y>y)=P\left(X>x_m e^{y}\right)=\left(\frac{x_m}{x_m e^{y}}\right)^{\alpha}=e^{-\alpha y}$$
          よって $Y$ はレート $\alpha=«a»$ の指数分布（密度 $\alpha e^{-\alpha y}$）で、$E[Y]=1/\alpha=1/«a»$。
          （密度から求めるなら $x=x_m e^{y}$、$dx/dy=x_m e^{y}$ より $f_Y(y)=\frac{\alpha x_m^{\alpha}}{(x_m e^{y})^{\alpha+1}}\cdot x_m e^{y}=\alpha e^{-\alpha y}$。）
          $$\exp(E[\log X])=\exp\left(\log x_m+\frac1\alpha\right)=x_m e^{1/«a»}=«xm»\times«e13»=«gm»$$

          **答え** $«gm»$（万円）

          **間違えやすい点** ヤコビアン $x_m e^{y}$ を掛け忘れると密度が $e^{-(\alpha+1)y}$ に比例する形になり、$E[Y]=1/«a1»$ として $«g_jac»$ を得てしまう。
          算術平均 $\alpha x_m/(\alpha-1)=«g_mean»$、中央値 $x_m2^{1/\alpha}=«g_med»$ とは別の量。右に裾が長い分布では 算術平均 > 幾何平均 > 中央値 となっている。

      - id: s13p03b
        chapter: 7
        terms: [chebyshev-inequality, markov-inequality]
        topic: パレート分布の所得が平均の3倍以上となる割合のチェビシェフの不等式による上界
        level: 基本
        definition: false
        type: choice
        question: |
          この分布の平均は $E[X]=«mean»$、分散は $V[X]=«var»$ である。所得が «x0» 万円以上の世帯の割合 $P(X\ge «x0»)$ について、
          平均と分散だけを使って**チェビシェフの不等式**から得られる上界に最も近い値はどれか。
        choices:
          - '$«markov»$'
          - '$«cheb»$'
          - '$«half»$'
          - '$«sdk»$'
          - '$«ratio3»$'
        answer: 1
        distractors:
          - チェビシェフではなくマルコフの不等式 E[X]/900 を使った
          - 正解
          - 分布が左右対称であると思い込み、両側の上界を半分にした
          - 分散ではなく標準偏差を距離で割った（σ/k）
          - 900 が平均の 3 倍であることから、k を「標準偏差の 3 倍」と取り違えて 1/3² とした
        explanation: |
          **方針** チェビシェフの不等式 $P(|X-\mu|\ge k)\le\sigma^2/k^2$ を使う。$X\ge«x0»$ は $|X-«mean»|\ge«k»$ に含まれる。

          **途中式** $\mu=«mean»$ なので $X\ge «x0»\Rightarrow X-\mu\ge «k»\Rightarrow |X-\mu|\ge «k»$。よって
          $$P(X\ge«x0»)\le P(|X-«mean»|\ge«k»)\le\frac{\sigma^2}{k^2}=\frac{«var»}{«k»^2}=\frac{«var»}{«k2»}=«cheb4»$$

          **答え** $«cheb»$

          **間違えやすい点** 距離 $k=«k»$ は標準偏差 $\sqrt{«var»}\approx«sd»$ の約 «ksd» 倍で、「平均の 3 倍」とは別。$1/3^2$ とすると $«ratio3»$ になる。
          分布は右に歪んでいるので、両側の上界を半分にする（$«half»$）根拠はない。マルコフの不等式 $E[X]/«x0»=«markov»$ も正しい上界だが、分散の情報を使うチェビシェフの方が鋭い。
          なお実際の値は $(«xm»/«x0»)^{«a»}\approx«exact»$ で、どちらの上界もかなり余裕がある。

  - id: s13p04
    title: 知事選挙の事前世論調査
    context: |
      知事選挙の前に、有権者名簿から «n» 人を無作為に抽出して電話調査を行った。有権者は十分多いので、復元抽出とみなしてよい。
      候補者は A、B の 2 人で、回答は「A」「B」「未定・その他」のいずれか 1 つである。
    items:
      - id: s13p04a
        chapter: 12
        terms: [goodness-of-fit-test, pearson-chi-square-statistic, degrees-of-freedom-gof]
        topic: 調査回答者の年代構成が国勢調査の構成比と一致するかを既知の比率への適合度検定で調べる
        level: 基本
        definition: false
        type: choice
        question: |
          まず、回答者 «n» 人の年代構成が有権者全体（国勢調査）の構成と合っているかを調べる。

          | 年代 | 18〜39 歳 | 40〜59 歳 | 60 歳以上 |
          |---|---|---|---|
          | 回答者数 | «o1» | «o2» | «o3» |
          | 有権者全体の構成比 | «q1» | «q2» | «q3» |

          「回答者の年代構成比は有権者全体と同じ」を帰無仮説とするピアソンのカイ二乗適合度検定（有意水準 5%）について、正しい記述はどれか。
          カイ二乗分布の上側 5% 点は、自由度 1 で 3.841、自由度 2 で 5.991、自由度 3 で 7.815 とする。
        choices:
          - '統計量は $«chi»$ で、自由度 1 の 5% 点 3.841 を超えるので帰無仮説を棄却する'
          - '統計量は $«chi_o»$ で、自由度 2 の 5% 点 5.991 を超えないので帰無仮説を棄却しない'
          - '統計量は $«chi»$ で、自由度 2 の 5% 点 5.991 を超えないので帰無仮説を棄却しない'
          - '統計量は $«chi»$ で、自由度 2 の 5% 点 5.991 を超えないので、回答者の年代構成が有権者全体と同じであることが示された'
          - '統計量は $«chi_p»$ で、自由度 2 の 5% 点 5.991 を超えないので帰無仮説を棄却しない'
        answer: 2
        distractors:
          - 自由度をカテゴリー数 − 2 などと誤って 1 にした
          - (O−E)²/E ではなく (O−E)²/O で計算した
          - 正解
          - 統計量と自由度は正しいが、「棄却しない」を「帰無仮説が正しいと示された」と誤って解釈した
          - 度数ではなく割合で (観測割合 − 構成比)²/構成比 を計算した（n を掛け忘れた）
        explanation: |
          **方針** 帰無仮説のもとの期待度数は $n\times$構成比。統計量 $\sum(O-E)^2/E$ は、比率がすべて既知（推定したパラメータなし）なので自由度 $3-1=2$ のカイ二乗分布で判定する。

          **途中式** 期待度数は $«n»\times«q1»=«e1»$、$«n»\times«q2»=«e2»$、$«n»\times«q3»=«e3»$。
          $$\chi^2=\frac{(«d1»)^2}{«e1»}+\frac{(«d2»)^2}{«e2»}+\frac{«d3»^2}{«e3»}=«t1»+«t2»+«t3»=«chi4»$$
          自由度は $3-1=2$。$«chi»<5.991$ なので有意水準 5% で帰無仮説を棄却しない。

          **答え** 統計量 $«chi»$、自由度 2 で棄却しない。

          **間違えやすい点** 推定したパラメータはないので、自由度から引くのは「合計が $n$」という制約の 1 だけ。
          分母は観測度数ではなく期待度数。割合のまま計算すると $«chi_p»$ と $n$ 倍だけ小さくなる。
          「棄却しない」は「ずれがあるとは言えない」という意味で、構成が同じであることの証明ではない（実際 60 歳以上はやや多めに答えている）。

      - id: s13p04b
        chapter: 5
        terms: [multinomial-distribution, covariance-and-correlation, expectation-variance-properties]
        topic: 世論調査の候補者2人の得票数の差の標準偏差を多項分布の負の共分散から求める
        level: 標準
        definition: false
        type: numeric
        question: |
          有権者全体での支持率が A «pa»、B «pb»、未定・その他 $1-«pa»-«pb»$ であるとする。
          «n» 人の回答のうち A、B と答えた人数をそれぞれ $N_A$、$N_B$ とするとき、差 $D=N_A-N_B$ の**標準偏差**を求めよ。
        answer: «sdD»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $(N_A,N_B,N_{\text{他}})$ は多項分布に従う。$V[N_A]=np_A(1-p_A)$、$V[N_B]=np_B(1-p_B)$、$\mathrm{Cov}(N_A,N_B)=-np_Ap_B$ を使い、$V[N_A-N_B]=V[N_A]+V[N_B]-2\mathrm{Cov}(N_A,N_B)$ を計算する。

          **途中式**
          $$V[D]=n\{p_A(1-p_A)+p_B(1-p_B)+2p_Ap_B\}=«n»\times(«va»+«vb»+«cab2»)=«n»\times«inD»=«varD»$$
          （同じ値は $n\{p_A+p_B-(p_A-p_B)^2\}=«n»\times(«sumab»-«dab2»)$ としても得られる。）
          $$\sqrt{«varD»}=«sdD4»$$

          **答え** $«sdD»$

          **間違えやすい点** 同じ回答者は A と B に同時には答えられないので $N_A$ と $N_B$ は負の相関をもつ。共分散を無視して独立とみなすと $«sd_ind»$、
          $-2\mathrm{Cov}$ の符号を誤って分散を引くと $«sd_sign»$ になる。共分散が負なので、差の分散は独立の場合より**大きく**なる。

      - id: s13p04c
        chapter: 9
        terms: [ci-proportion, wald-confidence-interval, multinomial-distribution]
        topic: 同じ調査の回答から得た2候補の支持率の差の95%信頼区間（多項分布の共分散を考慮）
        level: 応用
        definition: false
        type: choice
        question: |
          実際の調査では、«n» 人のうち A が «xa» 人、B が «xb» 人だった。
          支持率の差 $p_A-p_B$ の両側 95% 信頼区間を、標本比率を代入した標準誤差を用いる正規近似（ワルド型）で作る。その**下限**に最も近い値はどれか。
          標準正規分布の上側 5% 点は 1.645、上側 2.5% 点は 1.960、上側 0.5% 点は 2.576 とする。
        choices:
          - '$«l_ind»$'
          - '$«l_645»$'
          - '$«low»$'
          - '$«l_sign»$'
          - '$«l_99»$'
        answer: 2
        distractors:
          - A と B の比率を独立な2標本の比率とみなし、共分散の項 2p̂_A p̂_B を落とした
          - 両側 95% なのに上側 5% 点 1.645 を使った
          - 正解
          - 共分散の符号を誤り、分散から 2p̂_A p̂_B を引いた
          - 95% ではなく 99% の点 2.576 を使った
        explanation: |
          **方針** 前問と同じく $\hat p_A-\hat p_B=(N_A-N_B)/n$ の分散は $\{p_A(1-p_A)+p_B(1-p_B)+2p_Ap_B\}/n=\{p_A+p_B-(p_A-p_B)^2\}/n$。$p$ に標本比率を代入して標準誤差を作る。

          **途中式** $\hat p_A=«xa»/«n»=«ha»$、$\hat p_B=«xb»/«n»=«hb»$、差は $«diff»$。
          $$\widehat{V}=\frac{«habsum»-«diff»^2}{«n»}=\frac{«habsum»-«diff2»}{«n»}=\frac{«inner»}{«n»}=«v»,\qquad \mathrm{SE}=\sqrt{«v»}=«se»$$
          $$1.960\times«se»=«half»,\qquad \text{下限}=«diff»-«half»=«low6»$$
          区間は $(«low»,\ «upp»)$。

          **答え** $«low»$（0 を含まないので、A の支持率の方が高いと言える）

          **間違えやすい点** 2 つの比率は**同じ回答者**から計算されているので独立ではない。独立な 2 標本の公式 $\sqrt{(\hat p_A\hat q_A+\hat p_B\hat q_B)/n}$ を使うと $«l_ind»$ になり、区間が狭すぎる。
          共分散 $-p_Ap_B/n$ は負なので、差の分散では $+2p_Ap_B/n$ として効く（引くと $«l_sign»$）。

  - id: s13p05
    title: 子育て支援窓口の一本化の効果
    context: |
      ある県で、子育て支援の申請窓口を一本化する施策を 12 市町村で実施した。
      各市町村について、実施前 1 年間と実施後 1 年間の「申請から支給決定までの平均日数」を調べ、その差（実施前 − 実施後）を $d_i$ とした。
      $d_1,\ldots,d_{12}$ の平均は $\bar d=«dbar»$ 日、標準偏差（不偏分散の平方根）は $s_d=«sd»$ 日だった。差は正規分布に従うとする。
