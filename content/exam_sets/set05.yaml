set: 5
title: 模擬試験 第5回
minutes: 90
problems:
  - id: s05p01
    title: 感染症のスクリーニング検査
    context: |
      ある地域で、無症状の住民を対象に感染症のスクリーニングを行う。住民の感染割合（有病率）は «prev» とする。
      使える検査は次の 2 種類である。

      | 検査 | 感度（感染者が陽性になる確率） | 特異度（非感染者が陰性になる確率） |
      |---|---|---|
      | 簡易検査 A | «seA» | «spA» |
      | 確認検査 B | «seB» | «spB» |
    items:
      - id: s05p01a
        chapter: 1
        terms: [conditional-independence, bayes-theorem, conditional-probability]
        topic: 2つの検査を直列に使い両方陽性のときだけ陽性とする判定の陽性的中率（感染の有無を与えて条件付き独立）
        level: 標準
        definition: false
        type: choice
        question: |
          まず全員に検査 A を行い、A が陽性の人にだけ検査 B を行う。**A と B の両方が陽性**のときに「陽性」と判定する。
          感染しているかどうかを与えたとき、2 つの検査の結果は条件付き独立とする。
          「陽性」と判定された人が実際に感染している確率（陽性的中率）に最も近い値はどれか。
        choices:
          - "$«ppvA»$"
          - "$«ppv_par»$"
          - "$«ppv»$"
          - "$«ppv_fpw»$"
          - "$«ppv_noprev»$"
        answer: 2
        distractors:
          - 検査 A だけの陽性的中率を答えた
          - どちらか一方が陽性なら陽性とする並列の判定で計算した
          - 正解
          - 非感染者が両方陽性になる確率を 1-(特異度の積) とした
          - 有病率を無視して 感度/(感度+偽陽性率) とした
        explanation: |
          **方針** 判定全体の感度と偽陽性率（1−特異度）を、条件付き独立を使って掛け算で求め、ベイズの定理で $P(\text{感染}\mid\text{陽性})$ を出す。

          **途中式** 感染者が両方陽性になる確率は $«seA»\times«seB»=«sens»$。
          非感染者が両方陽性になる確率は $(1-«spA»)(1-«spB»)=«fpA»\times«fpB»=«fp»$。
          $$P(\text{感染}\mid\text{陽性})=\frac{«prev»\times«sens»}{«prev»\times«sens»+(1-«prev»)\times«fp»}=\frac{«num»}{«num»+«fpm»}=\frac{«num»}{«den»}=«ppv4»\cdots$$

          **答え** $«ppv»$

          **間違えやすい点** 検査 A だけなら陽性的中率は $«ppvA»$ にすぎない。有病率が低いと偽陽性が多くなるため、直列にして偽陽性率を $«fp»$ まで下げる意味がある。
          非感染者が両方陽性になる確率は「両方とも誤る」確率なので $(1-\text{特異度}_A)(1-\text{特異度}_B)$ であり、$1-«spA»\times«spB»=«fp_par»$（どちらか一方でも誤る確率）ではない（これを使うと $«ppv_fpw»$）。
          有病率を掛けずに $«sens»/(«sens»+«fp»)$ とすると $«ppv_noprev»$ となり、事前確率を無視する誤りになる。

      - id: s05p01b
        chapter: 5
        terms: [bernoulli-distribution, binomial-distribution, independence-of-events]
        topic: 検体を10人分まとめて検査し陽性のプールだけ個別に再検査するプール検査の期待検査回数
        level: 標準
        definition: false
        type: numeric
        question: |
          検査の回数を減らすため、«N» 人の検体を «k» 人ずつ «pools» 組に分けて混ぜ（プール）、まずプールごとに 1 回検査する。
          プールが陽性なら、その «k» 人を 1 人ずつ検査し直す（1 組あたり追加 «k» 回）。陰性ならその «k» 人は全員陰性とする。
          各人は互いに独立に確率 «prev» で感染しており、検査に誤りはない（感染者が 1 人でも含まれるプールは必ず陽性）とする。
          «N» 人全体で必要な検査回数の期待値を求めよ。必要なら $0.98^{10}=«q10»$ を使え。
        answer: «tests»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 1 組の検査回数は「プール検査 1 回」＋「プールが陽性なら «k» 回」。プールが陽性になるのは «k» 人のうち少なくとも 1 人が感染しているとき。期待値の線形性で «pools» 組分を足す。

          **途中式** 1 組が陽性になる確率は、全員が非感染である確率の余事象なので
          $$P(\text{プール陽性})=1-(1-«prev»)^{«k»}=1-«q10»=«ppos»$$
          1 組あたりの検査回数の期待値は $1+«k»\times«ppos»=1+«kppos»$。«pools» 組では
          $$«pools»\times(1+«kppos»)=«tests_s»$$
          （1 人あたり $«per»$ 回で、全員を個別に検査する «N» 回の 3 割ほどで済む。）

          **答え** $«tests_s»$ 回

          **間違えやすい点** プールが陽性になる確率を感染割合 «prev» そのものとすると $«pools»\times(1+«k»\times«prev»)=«tests_wrong»$ 回となり、少なく見積もってしまう。
          プール陽性は「«k» 人のうち 1 人以上が感染」なので、余事象 $1-(1-p)^{k}$ で計算する。最初のプール検査 «pools» 回を足し忘れないこと。

  - id: s05p02
    title: 健診での血圧の再測定
    context: |
      健康診断の受診者について、1 回目の収縮期血圧 $X_1$ と、1 か月後に（治療なしで）測り直した $X_2$（単位：mmHg）は、
      ともに平均 «mu»、標準偏差 «sig» で、相関係数 «rho» の 2 変量正規分布に従うとする。
    items:
      - id: s05p02a
        chapter: 3
        terms: [covariance-and-correlation, expectation-variance-properties, spurious-correlation]
        topic: 治療なしでも初回値と変化量に負の相関が出る平均への回帰を相関係数で示す
        level: 標準
        definition: false
        type: choice
        question: |
          変化量 $D=X_2-X_1$ と初回値 $X_1$ の相関係数 $\mathrm{Corr}(X_1,D)$ に最も近い値はどれか。
        choices:
          - "$«corr»$"
          - "$«corr_w0»$"
          - "$«corr_w1»$"
          - "$«corr_w2»$"
          - "$«corr_w3»$"
        answer: 0
        distractors:
          - 正解
          - 治療をしていないので変化量は初回値と無関係だと考えた
          - 平方根をとらずに -(1-ρ)/2 とした
          - V[D]=2(1-ρ)σ² の 2 を落とした
          - 共分散の符号を取り違えた
        explanation: |
          **方針** 共分散の双線形性で $\mathrm{Cov}(X_1,D)$ と $V[D]$ を求め、相関係数の定義に当てはめる。

          **途中式** $\sigma^2=«var»$、$\mathrm{Cov}(X_1,X_2)=\rho\sigma^2=«cov»$ なので
          $$\mathrm{Cov}(X_1,D)=\mathrm{Cov}(X_1,X_2)-V[X_1]=(\rho-1)\sigma^2=«cxd»$$
          $$V[D]=V[X_1]+V[X_2]-2\mathrm{Cov}(X_1,X_2)=2(1-\rho)\sigma^2=«vd»$$
          $$\mathrm{Corr}(X_1,D)=\frac{(\rho-1)\sigma^2}{\sigma\sqrt{2(1-\rho)}\,\sigma}=-\sqrt{\frac{1-\rho}{2}}=-\sqrt{«half»}=«corr»$$

          **答え** $«corr»$

          **間違えやすい点** 治療をしていなくても、初回値が高い人ほど次は下がる傾向が出る（平均への回帰）。「初回が高い人ほど大きく下がった」ことだけで効果があるとは言えない。
          $\sqrt{\phantom{x}}$ を忘れると $«corr_w1»$、分母の 2 を落とすと $«corr_w2»$ になる。$\rho<1$ なら符号は必ず負である。

      - id: s05p02b
        chapter: 6
        terms: [chi-squared-distribution, normal-distribution, expectation-variance-properties]
        topic: 治療なしの血圧の変化量の標本分散がとりうる上側5%点を相関を考えた分散とカイ二乗分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          無作為に選んだ «n» 人の受診者の変化量 $D_1,\ldots,D_{«n»}$（$D_i=X_{2i}-X_{1i}$、互いに独立）から不偏分散 $S^2$ を計算する。
          治療をしていないのに $S^2$ が大きすぎないかを調べるため、$P(S^2>c)=0.05$ となる $c$ を求めたい。最も近い値はどれか。
          必要なら、カイ二乗分布の上側 5% 点 $\chi^2_{0.05}(9)=«c9»$、$\chi^2_{0.05}(10)=«c10»$ を使え。
        choices:
          - "$«cut_n»$"
          - "$«cut»$"
          - "$«cut_df»$"
          - "$«cut_sig»$"
          - "$«cut_ind»$"
        answer: 1
        distractors:
          - (n-1)S²/σ² ではなく nS²/σ² としてn で割った
          - 正解
          - 自由度を n-1=9 ではなく n=10 とした
          - 変化量ではなく血圧そのものの分散 σ²=400 を使った
          - 2回の測定の相関を無視して V[D]=2σ²=800 とした
        explanation: |
          **方針** $D_i$ は正規分布に従うので、不偏分散について $\dfrac{(n-1)S^2}{V[D]}\sim\chi^2(n-1)$。まず $V[D]$ を相関を考えて求める。

          **途中式** $V[D]=V[X_1]+V[X_2]-2\mathrm{Cov}(X_1,X_2)=2(1-\rho)\sigma^2=2\times(1-«rho»)\times«var»=«vd»$。
          $$P(S^2>c)=P\left(\chi^2(«df»)>\frac{«df»\,c}{«vd»}\right)=0.05\quad\Rightarrow\quad\frac{«df»\,c}{«vd»}=«c9»$$
          $$c=\frac{«vd»\times«c9»}{«df»}=«cut»$$

          **答え** $«cut»$

          **間違えやすい点** $X_1$ と $X_2$ には正の相関があるので、差の分散は $2\sigma^2=«vd2»$ よりずっと小さい（相関を無視すると $«cut_ind»$）。
          自由度は標本の大きさ «n» ではなく $n-1=«df»$（平均を推定して 1 つ失う）。

  - id: s05p03
    title: 感染症の流行の監視
    context: |
      ある保健所は、感染症の週ごとの新規患者数を監視し、流行の兆しや治療の効果を評価している。
    items:
      - id: s05p03a
        chapter: 7
        terms: [normal-approximation-binomial-poisson, continuity-correction, poisson-distribution]
        topic: 平常時の週あたり新規患者数のポアソン分布から警報の基準を超える確率を連続修正つき正規近似で求める
        level: 基本
        definition: false
        type: choice
        question: |
          平常時の 1 週間の新規患者数 $N$ は平均 «lam» のポアソン分布に従うとする。保健所は $N\ge «k»$ のとき注意報を出す。
          平常時に注意報が出てしまう確率 $P(N\ge«k»)$ を、**連続修正を行った**正規近似で求めると、最も近い値はどれか。
          必要なら次の標準正規分布の分布関数 $\Phi(z)$ の値を使え。

          | $z$ | 0.21 | 1.50 | 1.57 | 1.64 |
          |---|---|---|---|---|
          | $\Phi(z)$ | «fA» | «fB» | «fC» | «fD» |
        choices:
          - "$«c_low»$"
          - "$«c_var»$"
          - "$«c_no»$"
          - "$«c_ok»$"
          - "$«c_up»$"
        answer: 3
        distractors:
          - 求める確率の余事象 P(N≦59) を答えた
          - 標準偏差の代わりに分散 49 で割った
          - 連続修正をしなかった
          - 正解
          - 連続修正の向きを逆にして 60.5 を使った
        explanation: |
          **方針** ポアソン分布は平均と分散がともに $\lambda$ なので、$N$ を $N(\lambda,\lambda)$ で近似する。$N$ は整数なので $N\ge«k»$ は $N>«km»$ と同じであり、境界を «km» にして標準化する。

          **途中式** 平均 «lam»、標準偏差 $\sqrt{«lam»}=«sd»$。
          $$P(N\ge«k»)\approx P\left(Z\ge\frac{«km»-«lam»}{«sd»}\right)=P(Z\ge«zok»)=1-«fB»=«c_ok4»$$

          **答え** $«c_ok»$（正確なポアソン確率は約 0.070）

          **間違えやすい点** 連続修正をしないと $z=«zno_raw»\approx«zno»$ で $«c_no»$、修正の向きを逆（«kp»）にすると $«c_up»$ となり、どちらも小さめになる。
          ポアソン分布の分散は平均と同じ «lam» で、標準偏差は $«sd»$ である（分散で割らない）。

      - id: s05p03b
        chapter: 29
        terms: [cox-proportional-hazards-model, partial-likelihood, hazard-ratio]
        topic: 新薬群のハザード比を0.5と仮定したときのコックス比例ハザードモデルの部分尤度をリスク集合から計算する
        level: 応用
        definition: false
        type: choice
        question: |
          入院した 5 人の患者 A〜E について、回復するまでの日数と治療（新薬なら $x=1$、標準治療なら $x=0$）を記録した。C は 4 日目に転院し、それ以降はわからない（右側打ち切り）。

          | 患者 | A | B | C | D | E |
          |---|---|---|---|---|---|
          | 日数 | 2 | 3 | $4^{+}$ | 5 | 7 |
          | $x$ | 0 | 1 | 0 | 0 | 1 |

          回復のハザードに比例ハザードモデル $h(t\mid x)=h_0(t)e^{\beta x}$ を仮定する。ハザード比 $e^{\beta}=«hr»$ のときのコックスの部分尤度の値はどれか（同時刻の回復はない）。
        choices:
          - "$«L_b0»$"
          - "$«L_ok»$"
          - "$«L_inv»$"
          - "$«L_cev»$"
          - "$«L_keepc»$"
        answer: 1
        distractors:
          - ハザード比を掛けず β=0 として計算した
          - 正解
          - 重みを逆にして新薬群に e^β の逆数 2 を掛けた
          - 打ち切りの C も回復として部分尤度に含めた
          - 打ち切られた C を打ち切り後もリスク集合に残した
        explanation: |
          **方針** 部分尤度は、回復が起きた各時点で「その時点のリスク集合（まだ回復も打ち切りもしていない人）の中で、実際に回復した人が回復する条件付き確率」
          $$\frac{e^{\beta x_{(j)}}}{\sum_{l\in R_j}e^{\beta x_l}}$$
          を掛け合わせたもの。基準ハザード $h_0(t)$ は約分されて消える。重みは $x=0$ の人が 1、$x=1$ の人が $e^\beta=«hr»$。

          **途中式**
          - 2 日目（A が回復、$x=0$）：リスク集合 $\{A,B,C,D,E\}$、重みの和 $1+0.5+1+1+0.5=4$ → $1/4$
          - 3 日目（B が回復、$x=1$）：$\{B,C,D,E\}$、和 $0.5+1+1+0.5=3$ → $0.5/3=1/6$
          - 5 日目（D が回復、$x=0$）：C は 4 日目に打ち切られたので $\{D,E\}$、和 $1+0.5=1.5$ → $1/1.5=2/3$
          - 7 日目（E が回復）：$\{E\}$ だけ → $1$

          $$L=\frac14\times\frac16\times\frac23\times1=«L_ok»\ (\approx«L_ok_dec»)$$

          **答え** $«L_ok»$

          **間違えやすい点** 打ち切られた人は、打ち切りの時点までリスク集合に入る（2・3 日目の分母に C を含める）が、それ以降は除く。また C の打ち切りは回復ではないので、C の項は掛けない（掛けると $«L_cev»$）。
          $\beta=0$（ハザード比 1）なら $«L_b0»$ になる。部分尤度を $\beta$ について最大化したものが $\beta$ の推定値である。

  - id: s05p04
    title: 新薬の安全性の評価
    context: |
      市販後の病棟の記録を使って、新薬の安全性を評価する。
    items:
      - id: s05p04a
        chapter: 9
        terms: [pivotal-quantity, confidence-interval, poisson-distribution]
        topic: 延べ患者日あたりの重い副作用の件数から発生率の正確な95%信頼区間の上限をカイ二乗分布で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          市販後のある病棟で、延べ «T» 患者日の観察中に重い副作用が «y» 件起きた。件数は平均 $\lambda T$（$\lambda$ は 1 患者日あたりの発生率）のポアソン分布に従うとする。
          ポアソン分布とカイ二乗分布の関係を使う正確な方法で、$\lambda$ の両側 95% 信頼区間の上限を求め、**1000 患者日あたり**の値で答えよ。
          必要なら、カイ二乗分布の上側 $\alpha$ 点を $\chi^2_\alpha(\nu)$ として、
          $\chi^2_{0.025}(8)=«c_hi8»$、$\chi^2_{0.025}(10)=«c_hi»$、$\chi^2_{0.975}(8)=«c_lo»$、$\chi^2_{0.975}(10)=«c_lo10»$ を使え。
        answer: «up»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 平均 $\mu$ のポアソン分布で $P(Y\le y)=P\big(\chi^2(2(y+1))>2\mu\big)$ が成り立つ（ポアソン過程の $y+1$ 番目の到着時刻がガンマ分布に従うことによる）。
          上限 $\mu_U$ は $P(Y\le y\mid\mu_U)=0.025$ を満たす $\mu$ なので、$2\mu_U=\chi^2_{0.025}(2(y+1))$。

          **途中式** $y=«y»$ より自由度は $2(«y»+1)=«df_hi»$。
          $$\mu_U=\frac{\chi^2_{0.025}(«df_hi»)}{2}=\frac{«c_hi»}{2}=«half_hi»$$
          これは $\lambda T$ の上限なので、1000 患者日あたりでは
          $$\frac{«half_hi»}{«T»}\times1000=«up4»\cdots$$

          **答え** $«up»$（下限は $\chi^2_{0.975}(«df_lo»)/2/«T»\times1000=«lo»$。点推定値は «rate»）

          **間違えやすい点** 上限の自由度は $2y$ ではなく $2(y+1)$（$2y=«df_lo»$ を使うと $«up_df8»$）。下限の自由度は $2y$ である。
          件数が少ないので、正規近似 $y\pm1.96\sqrt y$ から作った上限 $«up_norm»$ は過小になる。

      - id: s05p04b
        chapter: 8
        terms: [efficient-estimator, cramer-rao-inequality, delta-method, poisson-distribution]
        topic: 0件の日の割合だけから推定したポアソン平均の、標本平均に対する漸近相対効率
        level: 応用
        definition: false
        type: choice
        question: |
          市販後、ある病棟で 1 日に報告される軽い副作用の件数は、日ごとに独立に平均 $\lambda$ のポアソン分布に従うとする。
          ある病院では件数を記録しておらず、「0 件だった日かどうか」だけが $n$ 日分残っている。0 件だった日の割合を $\hat p_0$ として、
          $\tilde\lambda=-\log\hat p_0$ で $\lambda$ を推定する。

          件数の記録があれば使える最尤推定量 $\bar X$（標本平均）に対する $\tilde\lambda$ の漸近相対効率
          $$\frac{\bar X\text{ の漸近分散}}{\tilde\lambda\text{ の漸近分散}}$$
          は、$\lambda=«lam»$ のときいくらか。最も近い値を選べ。必要なら $e^{«lam»}=«ep»$、$e^{-«lam»}=«em»$ を使え。
        choices:
          - "$«eff_p0»$"
          - "$«eff»$"
          - "$«eff_inv»$"
          - "$«eff_le»$"
          - "$«eff_nog»$"
        answer: 1
        distractors:
          - 0件の日の確率 e^{-λ} を効率と取り違えた
          - 正解
          - 分散の比を逆にした（効率の逆数）
          - λe^{-λ}（1件の日の確率）を答えた
          - デルタ法で g'(p)^2 を掛け忘れた
        explanation: |
          **方針** $\hat p_0$ は成功確率 $p_0=e^{-\lambda}$ の二項割合なので $V[\hat p_0]=p_0(1-p_0)/n$。$g(p)=-\log p$ にデルタ法を使って $\tilde\lambda$ の漸近分散を出し、$\bar X$ の分散 $\lambda/n$（クラメール・ラオの下限に一致）と比べる。

          **途中式** $g'(p)=-1/p$ より
          $$V[\tilde\lambda]\approx\{g'(p_0)\}^2\frac{p_0(1-p_0)}{n}=\frac{1-p_0}{n\,p_0}=\frac{e^{\lambda}-1}{n}$$
          一方 $V[\bar X]=\lambda/n$。よって漸近相対効率は
          $$\frac{\lambda/n}{(e^\lambda-1)/n}=\frac{\lambda}{e^\lambda-1}=\frac{«lam»}{«ep»-1}=\frac{«lam»}{«ep1»}=«eff4»\cdots$$

          **答え** $«eff»$（件数を捨てたことで、同じ精度を得るのに約 $1/«eff»$ 倍の日数が要る）

          **間違えやすい点** デルタ法では分散に $\{g'(p_0)\}^2=1/p_0^2$ を掛ける。掛け忘れると $«lam»/\{«em»\times(1-«em»)\}=«eff_nog»$ となり、1 を超えてクラメール・ラオの不等式に反する。
          比の向きを逆にすると $«eff_inv»$。効率は 1 以下で、$\lambda\to0$ で 1 に近づく（まれな事象なら 0 か 1 件以上かでほぼ情報が尽きる）。

  - id: s05p05
    title: BMI と血圧の関係の男女差
    context: |
      ある健診で、男性 «n1» 人と女性 «n2» 人について BMI と収縮期血圧の標本相関係数を求めたところ、男性 $r_1=«r1»$、女性 $r_2=«r2»$ だった。
      男女それぞれで（BMI, 血圧）は 2 変量正規分布に従い、男女の標本は独立とする。
    items:
      - id: s05p05a
        chapter: 11
        terms: [fisher-z-transformation, test-correlation-coefficient, covariance-and-correlation]
        topic: 男女2群で求めたBMIと血圧の相関係数の差をフィッシャーのz変換による2標本の検定統計量で調べる
        level: 標準
        definition: false
        type: numeric
        question: |
          「男女の母相関係数は等しい」という帰無仮説を、フィッシャーの $z$ 変換 $z=\dfrac12\log\dfrac{1+r}{1-r}$ を使って検定する。
          検定統計量（帰無仮説のもとで近似的に標準正規分布に従うもの）の値を求めよ。
          必要なら $\dfrac12\log\dfrac{1+0.5}{1-0.5}=«z1»$、$\dfrac12\log\dfrac{1+0.3}{1-0.3}=«z2»$ を使え。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 標本の大きさ $n$ の相関係数を $z$ 変換した値は、近似的に平均 $\frac12\log\frac{1+\rho}{1-\rho}$、分散 $\dfrac{1}{n-3}$ の正規分布に従い、分散が $\rho$ によらない。
          独立な 2 群の差の分散は、それぞれの分散の和になる。

          **途中式**
          $$z_1-z_2=«z1»-«z2»=«dz»$$
          $$\sqrt{\frac{1}{«n1»-3}+\frac{1}{«n2»-3}}=\sqrt{\frac{1}{«d1»}+\frac{1}{«d2»}}=\sqrt{«v»}=«se»$$
          $$Z=\frac{«dz»}{«se»}=«z4»\cdots$$

          **答え** $«z»$（両側 5% の棄却限界 1.96 より小さいので、男女で相関が異なるとはいえない）

          **間違えやすい点** 分散は $1/(n-3)$ で、$1/n$ や $1/(n-1)$ ではない（$1/n$ とすると $«z_n»$）。
          相関係数の差 $r_1-r_2$ をそのまま使うと、相関係数の分布は $\rho$ によって形と分散が変わるため、正しい標準誤差が作れない（$«z_raw»$ のような値になる）。

  - id: s05p06
    title: 新薬の用量反応試験
    context: |
      新薬の用量と効果の関係を、いくつかの試験で調べる。
    items:
      - id: s05p06a
        chapter: 12
        terms: [g-statistic, homogeneity-test, pearson-chi-square-statistic]
        topic: 3用量群の有効率が等しいかを分割表の尤度比（G）統計量で検定する
        level: 標準
        definition: false
        type: choice
        question: |
          患者を 3 つの用量群に «ng» 人ずつ無作為に割り付け、有効かどうかを判定した。

          | | 低用量 | 中用量 | 高用量 |
          |---|---|---|---|
          | 有効 | «r0» | «r1» | «r2» |
          | 無効 | «n0» | «n1» | «n2» |

          「3 群の有効率は等しい」という帰無仮説を、尤度比検定の統計量 $G=2\sum O\log(O/E)$（$O$ は観測度数、$E$ は帰無仮説のもとでの期待度数、和は 6 つのセル）で検定する。
          $G$ の値に最も近いものはどれか。必要なら $\log 0.625=«lnA»$、$\log 1.375=«lnB»$、$\log 1.25=«lnC»$、$\log 0.75=«lnD»$ を使え（自然対数）。
        choices:
          - "$«Ghalf»$"
          - "$«X2»$"
          - "$«G»$"
          - "$«Gneg»$"
          - "$«Grow»$"
        answer: 2
        distractors:
          - 2 倍するのを忘れた
          - ピアソンのカイ二乗統計量を計算した
          - 正解
          - log(E/O) を使い符号が逆になった
          - 有効の行だけで和をとり無効の行を忘れた
        explanation: |
          **方針** 帰無仮説のもとで共通の有効率を全体の有効割合で推定し、期待度数を作る。各セルの $O\log(O/E)$ を足して 2 倍する。

          **途中式** $\hat p=«tot»/{120}=«pbar»$ なので、期待度数は各群で有効 $«ng»\times«pbar»=«er»$、無効 «en»。
          $O/E$ は有効の行で $«r0»/«er»=0.625$、$1$、$«r2»/«er»=1.375$、無効の行で $«n0»/«en»=1.25$、$1$、$«n2»/«en»=0.75$。$O/E=1$ のセルは $\log 1=0$。
          $$\sum O\log\frac OE=«r0»\times(«lnA»)+«r2»\times«lnB»+«n0»\times«lnC»+«n2»\times(«lnD»)$$
          $$=(«g0»)+«g2»+«g3»+(«g5»)=«half»$$
          $$G=2\times«half»=«G4»$$

          **答え** $«G»$（自由度 $(2-1)(3-1)=2$、上側 5% 点 «crit» を超えるので有効率は等しいとはいえない）

          **間違えやすい点** $G$ は対数尤度比の 2 倍で、2 を掛け忘れると $«Ghalf»$ になる。
          ピアソンの $X^2=\sum(O-E)^2/E=«X2»$ とは別の統計量だが、どちらも帰無仮説のもとで近似的に自由度 2 のカイ二乗分布に従い、値も近くなる。
          符号を逆にした $«Gneg»$ はありえない（$G\ge0$）。

      - id: s05p06b
        chapter: 4
        terms: [probit-transformation, log-transformation, lognormal-distribution]
        topic: 2用量での反応率をプロビット変換し対数用量との直線から50%有効量（ED50）を求める
        level: 標準
        definition: false
        type: choice
        question: |
          別の試験で、患者ごとに「効果が出る最小の用量（耐性）」$T$ があり、$\log T$ が正規分布 $N(\mu,\sigma^2)$ に従うと考える。
          このとき用量 $d$ で効果が出る割合は $P(T\le d)=\Phi\big((\log d-\mu)/\sigma\big)$ である。
          用量 «dd1» mg で «pp1»%、«dd2» mg で «pp2»% の患者に効果が出た。$\Phi(«zz1»)=«pr1»$、$\Phi(«zz2»)=«pr2»$ を使って、
          半数の患者に効果が出る用量（ED50）を求めると、最も近い値はどれか（単位：mg）。
        choices:
          - "$«ed_geo»$"
          - "$«ed50»$"
          - "$«ed_lin»$"
          - "$«ed_ari»$"
          - "$«ed_loglin»$"
        answer: 1
        distractors:
          - 2つの用量の幾何平均（対数用量の中点）を答えた
          - 正解
          - 用量と反応率をそのまま直線で補間した
          - 2つの用量の算術平均を答えた
          - 反応率を変換せず対数用量に対して直線で補間した
        explanation: |
          **方針** 反応率をプロビット変換（$\Phi^{-1}$）すると、$\Phi^{-1}(P)=(\log d-\mu)/\sigma$ は $\log d$ の一次式になる。2 点から直線を決め、$\Phi^{-1}(P)=0$ となる用量を求める。

          **途中式** プロビット値は $«dd1»$ mg で $«zz1»$、$«dd2»$ mg で $«zz2»$。底を 2 とする対数 $\log_2 d$ で考えると $\log_2«dd1»=2$、$\log_2«dd2»=4$ で、
          $\log_2 d$ が 2 増えるとプロビット値が 2 増えるので、傾きは 1。プロビット値 0 は $\log_2 d=2+0.5=«l50»$ のとき。
          $$\mathrm{ED50}=2^{«l50»}=4\sqrt2=4\times«rt2»=«ed50»$$
          （これは $T$ の中央値 $e^{\mu}$ にあたる。）

          **答え** $«ed50»$ mg

          **間違えやすい点** 2 つの用量での反応率は 50% をはさんで対称ではない（プロビット値 $-0.5$ と $1.5$）ので、対数用量の中点（幾何平均 $«ed_geo»$）ではない。
          反応率と用量の関係は S 字形なので、変換せずに直線補間すると $«ed_lin»$ や $«ed_loglin»$ のようにずれる。

      - id: s05p06c
        chapter: 19
        terms: [nonlinear-regression, least-squares-method]
        topic: 最大効果（Emax）モデルを逆数変換で直線化した回帰係数から半数効果濃度EC50を求める
        level: 基本
        definition: false
        type: choice
        question: |
          血中濃度 $C$ と降圧効果 $E$ の関係は、最大効果モデル
          $$E=\frac{E_{\max}\,C}{EC_{50}+C}$$
          に従うとする（$E_{\max}$ は最大効果、$EC_{50}$ は最大効果の半分が得られる濃度）。
          両辺の逆数をとった $1/E$ を $1/C$ に回帰したところ、切片 «ia»、傾き «ib» の直線が得られた。$EC_{50}$ の推定値はどれか。
        choices:
          - "$«ec_w1»$"
          - "$«ec_w3»$"
          - "$«ec_w2»$"
          - "$«emax»$"
          - "$«ec50»$"
        answer: 4
        distractors:
          - 傾きをそのまま EC50 とした
          - 傾きの逆数を EC50 とした
          - 最大効果の半分（効果の値）と EC50（濃度）を取り違えた
          - 最大効果 Emax を答えた
          - 正解
        explanation: |
          **方針** 逆数をとると一次式になるので、切片と傾きを $E_{\max}$、$EC_{50}$ に対応させる。

          **途中式**
          $$\frac1E=\frac{EC_{50}+C}{E_{\max}C}=\frac{1}{E_{\max}}+\frac{EC_{50}}{E_{\max}}\cdot\frac1C$$
          切片 $1/E_{\max}=«ia»$ より $E_{\max}=«emax»$。傾き $EC_{50}/E_{\max}=«ib»$ より
          $$EC_{50}=\frac{\text{傾き}}{\text{切片}}=\frac{«ib»}{«ia»}=«ec50»$$

          **答え** $«ec50»$

          **間違えやすい点** $EC_{50}$ は濃度であり、効果の値 $E_{\max}/2=«ec_w2»$ ではない。傾きは $EC_{50}/E_{\max}$ なので、$E_{\max}$ を掛け戻す必要がある。
          なお逆数変換は濃度の低い点の誤差を大きく拡大するので、実際には元の式のまま非線形最小二乗法で当てはめる方がよい。

  - id: s05p07
    title: 慢性疾患の寛解と再燃
    context: |
      ある慢性疾患の患者は「寛解」と「再燃（活動期）」の 2 つの状態を行き来する。状態の変化を連続時間マルコフ連鎖で表し、
      寛解から再燃へ移る推移率を $a=«a»$（1 年あたり）、再燃から寛解へ移る推移率を $b=«b»$（1 年あたり）とする。
    items:
      - id: s05p07a
        chapter: 14
        terms: [continuous-time-markov-chain, stationary-distribution, markov-property]
        topic: 寛解と再燃の2状態連続時間マルコフ連鎖でいま再燃中の患者が2年後も再燃中である確率
        level: 標準
        definition: false
        type: numeric
        question: |
          いま再燃中の患者が、«t» 年後に再燃中である確率を求めよ（途中で寛解して再び再燃した場合も含む）。
          必要なら $e^{-1.6}=«e16»$、$e^{-1.2}=«e12»$ を使え。
        answer: «pt»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 時刻 $t$ に再燃中である確率を $p(t)$ とおき、前進方程式（微小時間での出入り）を立てて解く。

          **途中式** 微小時間 $h$ の間に、再燃中の人は確率 $bh$ で寛解し、寛解中の人は確率 $ah$ で再燃するので
          $$p'(t)=-b\,p(t)+a\{1-p(t)\}=a-(a+b)p(t)$$
          定常状態は $p'=0$ より $\pi=\dfrac{a}{a+b}=\dfrac{«a»}{«ab»}=«pi»$。解は
          $$p(t)=\pi+\{p(0)-\pi\}e^{-(a+b)t}$$
          $p(0)=1$、$(a+b)t=«ab»\times«t»=«abt»$ を代入して
          $$p(«t»)=«pi»+«pi1»\times e^{-«abt»}=«pi»+«pi1»\times«e16»=«pt4»\cdots$$

          **答え** $«pt»$

          **間違えやすい点** $e^{-b t}=e^{-1.2}=«w_stay»$ は「«t» 年間一度も寛解しない」確率で、いったん寛解してから再燃した場合を数えていない。
          定常確率 $«w_pi»$ は $t\to\infty$ の極限で、«t» 年ではまだ初期状態の影響が残っている。収束の速さは $a+b$ で決まる。

  - id: s05p08
    title: 入院患者データの回帰分析
    context: |
      ある病院の入院患者のデータを使って、入院日数や退院時の状態を説明するモデルを当てはめる。
    items:
      - id: s05p08a
        chapter: 16
        terms: [dummy-variable, multiple-regression-model, multicollinearity]
        topic: 喫煙状況の3区分をダミー変数にした重回帰の係数の解釈と基準カテゴリーの扱い
        level: 基本
        definition: false
        type: choice
        question: |
          入院日数 $y$ を、喫煙状況（非喫煙・過去喫煙・現在喫煙の 3 区分）と年齢 $w$（歳）で説明する重回帰
          $$y=\beta_0+\beta_1D_1+\beta_2D_2+\beta_3w+\varepsilon$$
          を当てはめた。$D_1$ は過去喫煙なら 1、$D_2$ は現在喫煙なら 1 のダミー変数（非喫煙が基準）で、
          推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、$\hat\beta_2=«b2»$、$\hat\beta_3=«b3»$ だった。正しい記述はどれか。
        choices:
          - 喫煙状況を「非喫煙 0・過去喫煙 1・現在喫煙 2」の 1 つの数値変数にして入れても、同じ当てはめ値が得られる。
          - 3 つの区分すべてにダミー変数を作り、切片と一緒にモデルに入れると、推定の精度が上がる。
          - $\hat\beta_2=«b2»$ は、年齢をそろえずに比べた現在喫煙者と非喫煙者の平均入院日数の差である。
          - 同じ年齢の現在喫煙者と過去喫煙者とでは、入院日数の予測値の差は «b21» 日である。
          - 基準の区分を現在喫煙に変えて当てはめ直すと、年齢の係数 $\hat\beta_3$ の値も変わる。
        answer: 3
        distractors:
          - 数値化すると区分の間隔が等しいという制約が入り、一般に当てはめが変わる
          - 3つのダミーの和が切片の列と一致し完全な多重共線性になって推定できない
          - β2 は年齢を固定したときの差（調整済みの差）である
          - 正解
          - 基準の取り替えはダミーの組み替えにすぎず、当てはめ値と年齢の係数は変わらない
        explanation: |
          **方針** ダミー変数の係数は、他の説明変数（年齢）を固定したときの「基準の区分との差」を表す。2 つの区分の差は係数の差になる。

          **途中式** 年齢 $w$ が同じなら、予測値は現在喫煙者で $\hat\beta_0+\hat\beta_2+\hat\beta_3w$、過去喫煙者で $\hat\beta_0+\hat\beta_1+\hat\beta_3w$。差は
          $$\hat\beta_2-\hat\beta_1=«b2»-«b1»=«b21»$$

          **答え** 「同じ年齢の現在喫煙者と過去喫煙者の予測値の差は «b21» 日」

          **間違えやすい点** 3 区分すべてのダミーを切片と一緒に入れると $D_0+D_1+D_2=1$ が切片の列と一致し、$X^\top X$ が逆行列をもたなくなる（ダミー変数の罠）。
          0・1・2 と数値化すると「非喫煙→過去」と「過去→現在」の差が等しいと仮定することになる（ここでは $«b1»$ と $«b21»$ で等しくない）。
          基準を変えてもモデルの当てはめ値は同じで、年齢の係数も変わらない（ダミーの係数の解釈だけが変わる）。

      - id: s05p08b
        chapter: 18
        terms: [tobit-model, censored-data, normal-distribution]
        topic: 検出限界未満の値を限界値として記録した検査値の期待値をトービットモデル（左側打ち切りの正規分布）で求める
        level: 応用
        definition: false
        type: choice
        question: |
          ある炎症マーカーの値（対数変換後）を、潜在的な値 $y^*=\beta_0+\beta_1x+\varepsilon$（$\varepsilon\sim N(0,\sigma^2)$）のトービットモデルで表す。
          検査には検出限界 $L=«L»$ があり、$y^*<L$ のときは $L$ と記録される（記録値 $y=\max(y^*,L)$）。
          ある患者群では $\beta_0+\beta_1x=«mu»$、$\sigma=«sig»$ である。この群の記録値の期待値 $E[y]$ に最も近い値はどれか。
          必要なら $\Phi(1)=«Phi1»$、標準正規分布の密度 $\phi(1)=«phi1»$ を使え。
        choices:
          - "$«Ey_mu»$"
          - "$«Ey_nophi»$"
          - "$«Ey_sign»$"
          - "$«Ey_trunc»$"
          - "$«Ey»$"
        answer: 4
        distractors:
          - 打ち切りを無視して潜在値の平均を答えた
          - 検出限界を超える部分の期待値で σφ の項を落とした
          - σφ の項の符号を逆にした
          - 検出限界を超えた人だけの条件付き期待値（切断分布の平均）を答えた
          - 正解
        explanation: |
          **方針** $\mu=«mu»$、$\alpha=(L-\mu)/\sigma=«alpha»$ とおく。$y^*<L$ の部分は値 $L$、$y^*\ge L$ の部分は $y^*$ そのものなので
          $$E[y]=L\,\Phi(\alpha)+E[y^*;\,y^*\ge L]=L\,\Phi(\alpha)+\mu\{1-\Phi(\alpha)\}+\sigma\phi(\alpha)$$
          （正規分布の部分期待値 $E[y^*;y^*\ge L]=\mu\{1-\Phi(\alpha)\}+\sigma\phi(\alpha)$ を使う）。

          **途中式** $\Phi(-1)=1-«Phi1»=«Pc»$、$\phi(-1)=\phi(1)=«phi1»$ より
          $$E[y]=«L»\times«Pc»+«mu»\times«Phi1»+«sig»\times«phi1»=«t1»+«t2»+«t3»=«Ey4»$$

          **答え** $«Ey»$

          **間違えやすい点** 検出限界未満を $L$ に置き換えると値が持ち上がるので、$E[y]$ は潜在値の平均 «mu» より大きい。
          検出限界を超えた人だけの平均 $\mu+\sigma\phi(\alpha)/\{1-\Phi(\alpha)\}=«Ey_trunc»$ は切断分布の平均で、限界未満の人（記録値 $L$）を含めた期待値ではない。
          限界値に置き換えたデータをそのまま最小二乗法で回帰すると係数が偏るので、トービットモデルでは打ち切りを考えた尤度で推定する。

  - id: s05p09
    title: 喫煙と肺がんの因果構造
    context: |
      喫煙と肺がんの関係を、変数の間の因果の向きを表すグラフで整理する。
    items:
      - id: s05p09a
        chapter: 25
        terms: [directed-acyclic-graph, graphical-model, conditional-independence]
        topic: 遺伝要因と喫煙とタール沈着と肺がんの有向非巡回グラフから成り立つ条件付き独立を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          遺伝的素因 $G$、喫煙 $S$、肺へのタール沈着 $T$、肺がん $C$ の関係が、次の有向非巡回グラフ（DAG）で表され、
          同時分布はこのグラフに従って $p(g)\,p(s\mid g)\,p(t\mid s)\,p(c\mid g,t)$ と分解されるとする。

          $$G\to S,\qquad S\to T,\qquad T\to C,\qquad G\to C$$

          グラフの構造から（分布の細かな値によらず）必ず成り立つ条件付き独立として、正しいものはどれか。
        choices:
          - $G$ と $T$ は、$S$ を与えると条件付き独立である。
          - $S$ と $C$ は、$G$ を与えると条件付き独立である。
          - $G$ と $T$ は（何も条件づけなくても）独立である。
          - $G$ と $T$ は、$S$ と $C$ の両方を与えると条件付き独立である。
          - $S$ と $C$ は、$G$ と $T$ の両方を与えても条件付き独立にならない。
        answer: 0
        distractors:
          - 正解
          - S→T→C の道が G では遮断されない
          - G→S→T の道が開いている
          - 合流点 C を条件づけると G→C←T の道が開く
          - G と T を与えると S と C の間の道はすべて遮断される
        explanation: |
          **方針** 2 つの変数の間の道（矢印の向きを無視した経路）がすべて遮断されるかを調べる（d 分離）。
          道の途中の頂点が「連鎖 $\to\cdot\to$」か「分岐 $\leftarrow\cdot\to$」なら、その頂点を条件づけると遮断される。「合流点 $\to\cdot\leftarrow$」なら、条件づけ**ない**と遮断され、条件づけると開く。

          **途中式** $G$ と $T$ の間の道は 2 本ある。
          - $G\to S\to T$：$S$ は連鎖。$S$ を条件づけると遮断。
          - $G\to C\leftarrow T$：$C$ は合流点。$C$ を条件づけなければ遮断。

          したがって $S$ だけを与えると両方の道が遮断され、$G$ と $T$ は条件付き独立になる。
          （確認：分解 $p(g)p(s\mid g)p(t\mid s)p(c\mid g,t)$ を $c$ について和をとると $p(g,s,t)=p(g)p(s\mid g)p(t\mid s)$ となり、$p(t\mid g,s)=p(t\mid s)$ が成り立つ。）

          **答え** 「$G$ と $T$ は、$S$ を与えると条件付き独立である」

          **間違えやすい点** $G$ を与えても $S\to T\to C$ の道が開いているので、$S$ と $C$ は独立にならない。
          合流点 $C$（またはその子孫）を条件づけると、本来遮断されていた $G\to C\leftarrow T$ の道が開く。$G$ と $T$ の両方を与えると、$S$ と $C$ の間の道 $S\to T\to C$（$T$ で遮断）と $S\leftarrow G\to C$（$G$ で遮断）がすべて遮断されるので、最後の記述も誤り。

  - id: s05p10
    title: 鎮痛薬の比較試験の計画
    context: |
      慢性痛の患者に 7 種類の鎮痛薬を比べたいが、1 人の患者が試せるのは期間の都合で 3 種類までである。
      そこで、患者 1 人をブロックとし、«b» 人の患者がそれぞれ 3 種類ずつ試す釣り合い型不完備ブロック計画（BIBD）を組む。
    items:
      - id: s05p10a
        chapter: 20
        terms: [incomplete-block-design, randomized-block-design, fisher-three-principles]
        topic: 7種類の鎮痛薬を1人3種類ずつ試す釣り合い型不完備ブロック計画で各薬の反復数と2つの薬が同じ患者に現れる回数を求める
        level: 基本
        definition: false
        type: choice
        question: |
          この計画では、どの薬も同じ回数 $r$ だけ使われ、どの 2 つの薬の組も同じ回数 $\lambda$ だけ同じ患者の中に現れる。$r$ と $\lambda$ の組はどれか。
        choices:
          - "$«c_nok»$"
          - "$«c_swap»$"
          - "$«c_k»$"
          - "$«c_bk»$"
          - "$«c_ok»$"
        answer: 4
        distractors:
          - λ=r/(t-1) として (k-1) を掛け忘れた
          - r と λ を取り違えた
          - λ の分母を t-1 ではなく k にした
          - r を総試行数 bk のままにして t で割らなかった
          - 正解
        explanation: |
          **方針** 薬の数を $t=«t»$、ブロック数を $b=«b»$、ブロックの大きさを $k=«k»$ とする。延べの試行数と、「ある薬と他の薬が同じブロックに入る組」の数をそれぞれ 2 通りに数える。

          **途中式** 延べの試行数：$bk=rt$ より $r=\dfrac{«b»\times«k»}{«t»}=\dfrac{«bk»}{«t»}=«r»$。
          ある薬 A を含む $r$ 個のブロックには A 以外の薬が $k-1$ 個ずつ入るので、A と他の薬の組は延べ $r(k-1)=«rk1»$ 個。これが他の $t-1=6$ 種類に $\lambda$ 回ずつ均等に分かれるので
          $$\lambda=\frac{r(k-1)}{t-1}=\frac{«rk1»}{6}=«lam»$$

          **答え** $«c_ok»$

          **間違えやすい点** $\lambda$ を求めるときは、A を含むブロックの中の「A 以外の $k-1$ 個」を数える。$t-1$ で割るのは、組の相手が A 以外の $t-1$ 種類だからである。
          全部の薬を全員に試す乱塊法と違い、ブロック内で比べられない組があるため、処理効果の推定はブロック効果を調整して（ブロック内の情報から）行う。

  - id: s05p11
    title: 県民の健康調査
    context: |
      ある県で、病院での患者の状況と、県民の健康意識を調べる標本調査を行った。
    items:
      - id: s05p11a
        chapter: 21
        terms: [two-stage-sampling, cluster-sampling, simple-random-sampling]
        topic: 40病院から4病院を選び各病院で20人を調べる二段抽出で県内の褥瘡のある入院患者の総数を推定する
        level: 標準
        definition: false
        type: numeric
        question: |
          県内の «Nh» 病院から単純無作為に «nh» 病院を選び（第 1 段）、選んだ病院の入院患者からそれぞれ «m» 人を単純無作為に選んで（第 2 段）、褥瘡（床ずれ）があるかを調べた。

          | 病院 | 1 | 2 | 3 | 4 |
          |---|---|---|---|---|
          | 入院患者数 $M_i$ | «M0» | «M1» | «M2» | «M3» |
          | 調べた «m» 人中の褥瘡のある人数 | «c0» | «c1» | «c2» | «c3» |

          二段抽出の不偏推定量で、県内の全病院の褥瘡のある入院患者の総数を推定せよ。
        answer: «tot»
        tolerance: 0.5
        answer_format: 整数で答えよ（小数第1位を四捨五入）。±0.5 未満の差まで正解とする。
        explanation: |
          **方針** まず各病院の総数を「病院内の割合 × 入院患者数」で推定し（第 2 段）、次に病院の総数の平均に病院数を掛けて県全体に広げる（第 1 段）：
          $$\hat Y=\frac{N}{n}\sum_{i=1}^{n}M_i\,\bar y_i$$

          **途中式** 病院ごとの推定値は
          $$«M0»\times«q0»=«t0»,\quad«M1»\times«q1»=«t1»,\quad«M2»\times«q2»=«t2»,\quad«M3»\times«q3»=«t3»$$
          合計 «sum_i»。病院の抽出率の逆数 $«Nh»/«nh»=«ratio»$ を掛けて
          $$\hat Y=«ratio»\times«sum_i»=«tot_s»$$

          **答え** $«tot_s»$ 人

          **間違えやすい点** 病院ごとに入院患者数が違うので、調べた人数の合計（«c0»+«c1»+«c2»+«c3»）を単純に拡大するのは誤り（$«ratio»\times10=«w_noM»$）。第 2 段の拡大（$M_i/m$ 倍）と第 1 段の拡大（$N/n$ 倍）の両方が必要である。
          分散は「病院間のばらつき」と「病院内のばらつき」の 2 つの成分からなり、一般に同じ人数の単純無作為抽出より大きくなる。

      - id: s05p11b
        chapter: 24
        terms: [standardization-before-clustering, distance-measures, hierarchical-clustering]
        topic: 年齢とBMIで回答者を分類する前に標準化すると最も近い回答者が入れ替わることをユークリッド距離で確かめる
        level: 基本
        definition: false
        type: choice
        question: |
          健康意識の調査の回答者を、年齢（歳）と BMI でクラスター分析する。回答者 A、B、C の値と、回答者全体での各変数の標準偏差は次のとおりである。

          | | 年齢 | BMI |
          |---|---|---|
          | A | «Aa» | «Ab» |
          | B | «Ba» | «Bb» |
          | C | «Ca» | «Cb» |
          | 全体の標準偏差 | «sa» | «sb» |

          各変数を（平均を引いて）標準偏差で割って標準化してから、ユークリッド距離を計算する。B と C のうち A に近いのはどちらか。その距離とともに正しいものを選べ。
        choices:
          - "B（距離 $«zAB»$）"
          - "C（距離 $«rAC»$）"
          - "B（距離 $«zAB2»$）"
          - "C（距離 $«zAC»$）"
          - "B（距離 $«rAB»$）"
        answer: 0
        distractors:
          - 正解
          - 標準化せずに元の単位のまま距離を計算した
          - 距離の 2 乗のまま平方根をとらなかった
          - 標準化後の距離を B と C で取り違えた
          - 標準化前の距離を答えた
        explanation: |
          **方針** 平均を引くことは差には影響しないので、差を標準偏差で割ってからユークリッド距離を計算する。

          **途中式** A と B：年齢の差 $6/«sa»=«uAB»$、BMI の差 $0.5/«sb»=«vAB»$ より
          $$d(A,B)=\sqrt{«uAB»^2+«vAB»^2}=\sqrt{«zAB2»}=«zAB»$$
          A と C：年齢の差 $1/«sa»=«uAC»$、BMI の差 $3.5/«sb»=«vAC»$ より
          $$d(A,C)=\sqrt{«uAC»^2+«vAC»^2}=\sqrt{«zAC2»}=«zAC»$$
          よって A に近いのは B。

          **答え** B（距離 $«zAB»$）

          **間違えやすい点** 標準化しないと $d(A,B)=«rAB»$、$d(A,C)=«rAC»$ で C の方が近くなる。元の単位のままでは、ばらつきの大きい年齢の差が距離を支配する（ここでは年齢 6 歳の差が、BMI 3.5 の差より大きく効く）。
          単位の異なる変数を使うときは、標準化してから距離を測るのが基本である。

      - id: s05p11c
        chapter: 26
        terms: [nonmetric-mds, multidimensional-scaling]
        topic: 健康上の悩み4項目の非計量多次元尺度法で単調回帰による当てはめ値を作りクラスカルのストレスを求める
        level: 標準
        definition: false
        type: choice
        question: |
          県民が答えた 4 つの健康上の悩み（睡眠・食事・運動・ストレス）の間の非類似度の順位にもとづいて、非計量多次元尺度法で 2 次元の配置を求めた。
          6 つの組を非類似度の小さい順に並べ、配置上の距離 $d$ を示す。

          | 非類似度の順位 | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | 配置上の距離 $d$ | «d0» | «d1» | «d2» | «d3» | «d4» | «d5» |

          非類似度の順位に対して $d$ を単調回帰（順位が上がっても値が減らないように、順序が逆転している隣り合う組を平均でまとめる）した値を $\hat d$ とし、
          クラスカルのストレス $S=\sqrt{\sum(d-\hat d)^2/\sum d^2}$ を求める。最も近い値はどれか。
        choices:
          - "$«st_nosq»$"
          - "$«st_one»$"
          - "$«st»$"
          - "$«st_min»$"
          - "$«st2»$"
        answer: 2
        distractors:
          - 平方根をとらなかった
          - 順序が逆転している2か所のうち1か所しかまとめなかった
          - 正解
          - 逆転した組を平均ではなく小さい方の値にそろえた
          - 分母を Σ(d-d̄)² としたストレス2を計算した
        explanation: |
          **方針** 非計量 MDS では、距離の大きさではなく順序だけを再現すればよい。順序が逆転しているところを単調回帰で直した $\hat d$ との差を、距離全体の大きさで割って評価する。

          **途中式** 順位 2・3 で $«d1»>«d2»$、順位 5・6 で $«d4»>«d5»$ と逆転しているので、それぞれ平均でまとめる。
          $$\hat d=(«h0»,\ «h1»,\ «h2»,\ «h3»,\ «h4»,\ «h5»)$$
          $\sum(d-\hat d)^2=«sq1»+«sq2»+«sq4»+«sq5»=«num»$、$\sum d^2=«dd0»+«dd1»+«dd2»+«dd3»+«dd4»+«dd5»=«den»$。
          $$S=\sqrt{\frac{«num»}{«den»}}=\sqrt{«ratio_st»}=«st4»\cdots$$

          **答え** $«st»$（クラスカルの目安「0.05 で良い、0.1 でまずまず」に照らすと、配置は順位をおおむね再現している）

          **間違えやすい点** 単調回帰では逆転した組を平均でまとめる（小さい方にそろえると $«st_min»$）。逆転は 2 か所あるので両方を直す。
          ストレスは平方根をとった値で評価する（とらないと $«st_nosq»$）。

  - id: s05p12
    title: インフルエンザ定点報告の時系列分析
    context: |
      ある保健所は、週ごとのインフルエンザ定点報告数 $y_t$ を、ゆっくり変わる真の流行水準 $\mu_t$ と観測のばらつきに分けて捉えるため、局所水準モデル（状態空間モデル）
      $$y_t=\mu_t+\varepsilon_t,\quad\varepsilon_t\sim N(0,\ «h»),\qquad\mu_t=\mu_{t-1}+\eta_t,\quad\eta_t\sim N(0,\ «q»)$$
      を使っている（$\varepsilon_t,\eta_t$ はすべて独立）。
    items:
      - id: s05p12a
        chapter: 27
        terms: [state-space-model, forecasting, time-series]
        topic: 局所水準モデルのカルマンフィルタで新しい週の報告数から流行水準の推定値を1回更新する
        level: 基本
        definition: false
        type: numeric
        question: |
          前週までのデータによる $\mu_{t-1}$ の推定値（フィルタ推定値）は «m0»、その誤差分散は «P0» だった。今週の報告数は $y_t=«y»$ である。
          カルマンフィルタで今週の水準 $\mu_t$ のフィルタ推定値を求めよ。
        answer: «mt»
        tolerance: 0.1
        answer_format: 小数第1位まで答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 予測（1 期先の水準を予測し、誤差分散に $\eta_t$ の分散を足す）→ 更新（予測誤差にカルマンゲインを掛けて修正）の 2 段階で計算する。

          **途中式** 予測：$\mu_t$ の予測値は «m0»、誤差分散は $«P0»+«q»=«Pp»$。
          カルマンゲイン（予測の誤差分散と観測誤差の分散の比で決まる重み）は
          $$K=\frac{«Pp»}{«Pp»+«h»}=«K»$$
          更新：
          $$\hat\mu_t=«m0»+«K»\times(«y»-«m0»)=«m0»+«K»\times«res»=«mt_s»$$
          （更新後の誤差分散は $(1-K)\times«Pp»=«Pt»$。）

          **答え** $«mt_s»$

          **間違えやすい点** 予測の段階で水準の変動 $\eta_t$ の分散 «q» を足し忘れると、ゲインが $«K_noq»$ となり $«m_noq»$ になる。
          ゲインの分子と分母を取り違えて観測誤差の分散 «h» を分子にすると $«m_inv»$ になる。観測のばらつきが大きいほど、新しい観測を割り引いて使う。

      - id: s05p12b
        chapter: 17
        terms: [durbin-watson-statistic, serial-correlation, residual]
        topic: 週ごとの報告数を気温で回帰した8週分の残差からダービン・ワトソン比を計算し1次の自己相関を見積もる
        level: 基本
        definition: false
        type: numeric
        question: |
          別の分析として、8 週分の報告数を平均気温に回帰（切片あり、最小二乗法）したところ、残差 $e_t$ は次のとおりだった。

          | 週 $t$ | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
          |---|---|---|---|---|---|---|---|---|
          | $e_t$ | «e0» | «e1» | «e2» | «e3» | «e4» | «e5» | «e6» | «e7» |

          ダービン・ワトソン比 $d=\dfrac{\sum_{t=2}^{8}(e_t-e_{t-1})^2}{\sum_{t=1}^{8}e_t^2}$ を求めよ。
        answer: «dw»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 隣り合う残差の差の 2 乗和（7 項）を、残差の 2 乗和（8 項）で割る。

          **途中式** 差 $e_t-e_{t-1}$（$t=2,\ldots,8$）は $«g1»,\ «g2»,\ «g3»,\ «g4»,\ «g5»,\ «g6»,\ «g7»$ なので、2 乗和は $«dnum»$。
          残差の 2 乗和は $«dden»$。
          $$d=\frac{«dnum»}{«dden»}=«dw4»\cdots$$

          **答え** $«dw»$（$d\approx2(1-\hat\rho)$ より 1 次の自己相関はおよそ $1-d/2=«rho»$ で、正の系列相関がうかがえる）

          **間違えやすい点** 分子は差の 2 乗和で、和の範囲は $t=2$ から（項は 1 つ少ない）。分子と分母をそれぞれの項数で割って平均どうしの比にすると $«dw_n1»$ となり、定義と違う。
          $d$ は 0〜4 の値をとり、2 に近いと系列相関なし、2 より小さいと正の系列相関を示す。正の系列相関があると、通常の標準誤差は小さく出すぎる。

  - id: s05p13
    title: 臨床研究の統計解析
    context: |
      新薬の開発の各段階で得たデータを、ベイズ流の評価・モデル選択・多重検定の調整を使って解析する。
    items:
      - id: s05p13a
        chapter: 31
        terms: [bayes-factor, marginal-likelihood, beta-binomial-model]
        topic: 第II相試験の有効例数から既存薬と同じ有効率という仮説と一様事前分布の仮説をベイズ因子で比べる
        level: 応用
        definition: false
        type: choice
        question: |
          第 II 相試験で «n» 人中 «x» 人が有効だった。各人の有効は独立で、有効率を $p$ とする。次の 2 つの仮説を比べる。
          - $H_0$：$p=«p0»$（既存薬と同じ有効率）
          - $H_1$：$p$ は区間 $(0,1)$ の一様分布に従う

          $H_1$ の $H_0$ に対するベイズ因子 $B_{10}=\dfrac{P(\text{データ}\mid H_1)}{P(\text{データ}\mid H_0)}$ に最も近い値はどれか。
          必要なら $\displaystyle\int_0^1p^{5}(1-p)^{5}\,dp=\frac{1}{«bint»}$ を使え。
        choices:
          - "$«bf_inv»$"
          - "$«bf_lr»$"
          - "$«bf_one»$"
          - "$«bf»$"
          - "$«bf_nocomb»$"
        answer: 3
        distractors:
          - B01（H0 の H1 に対するベイズ因子）を答えた
          - H1 の周辺尤度の代わりに最尤推定値 p=0.5 での尤度を使った（最大尤度比）
          - H1 の周辺尤度を 1 とした
          - 正解
          - H1 の周辺尤度にだけ二項係数を掛け忘れた
        explanation: |
          **方針** ベイズ因子は 2 つの仮説の周辺尤度の比。$H_0$ は点仮説なので尤度そのもの、$H_1$ は尤度を事前分布で平均（積分）したものになる。

          **途中式** $H_0$：$P(\text{データ}\mid H_0)=\binom{«n»}{«x»}«p0»^{«x»}(1-«p0»)^{«n»-«x»}=«comb»\times«pp»=«m0»$。
          $H_1$：一様事前分布で積分して
          $$P(\text{データ}\mid H_1)=\int_0^1\binom{«n»}{«x»}p^{«x»}(1-p)^{«n»-«x»}dp=\frac{«comb»}{«bint»}=\frac{1}{11}=«m1»$$
          $$B_{10}=\frac{«m1»}{«m0»}=«bf4»\cdots$$

          **答え** $«bf»$（データは $H_1$ を約 3.4 倍支持する）

          **間違えやすい点** $H_1$ の周辺尤度は、$p$ の値ごとの尤度を事前分布で平均したもの。最尤推定値 $p=0.5$ での尤度を使うと $«bf_lr»$ となり、$H_1$ を過大に有利にする（平均すると尤度の低い $p$ も含まれる）。
          二項係数は両方の仮説に共通なので、付けるなら両方に付ける（片方だけだと $«bf_nocomb»$）。

      - id: s05p13b
        chapter: 30
        terms: [kullback-leibler-divergence, expected-log-likelihood, normal-distribution]
        topic: 真の血圧分布と当てはめた正規モデルのずれを2つの正規分布のカルバック・ライブラー情報量で測る
        level: 応用
        definition: false
        type: choice
        question: |
          ある集団の収縮期血圧の真の分布を $p=N(«mp»,\ «spp»^2)$ とし、別の集団のデータから作ったモデル $q=N(«mq»,\ «sq»^2)$ でこれを予測する。
          カルバック・ライブラー情報量 $D(p\,\|\,q)=E_p\!\left[\log\dfrac{p(X)}{q(X)}\right]$（$X\sim p$ で期待値をとる）に最も近い値はどれか。
          必要なら $\log 0.8=«lg»$ を使え。
        choices:
          - "$«kl_rev»$"
          - "$«kl»$"
          - "$«kl_nolog»$"
          - "$«kl_sign»$"
          - "$«kl_nohalf»$"
        answer: 1
        distractors:
          - p と q を入れ替えて D(q||p) を計算した
          - 正解
          - 標準偏差の比の対数の項を落とした
          - 対数の項の符号を逆にした
          - 最後の -1/2 を忘れた
        explanation: |
          **方針** 正規密度の対数の差 $\log p(x)-\log q(x)$ を書き、$X\sim p$ で期待値をとる。$E_p[(X-\mu_q)^2]=\sigma_p^2+(\mu_p-\mu_q)^2$ を使う。

          **途中式**
          $$\log\frac{p(x)}{q(x)}=\log\frac{\sigma_q}{\sigma_p}-\frac{(x-\mu_p)^2}{2\sigma_p^2}+\frac{(x-\mu_q)^2}{2\sigma_q^2}$$
          期待値をとると
          $$D(p\,\|\,q)=\log\frac{\sigma_q}{\sigma_p}+\frac{\sigma_p^2+(\mu_p-\mu_q)^2}{2\sigma_q^2}-\frac12$$
          $$=\log\frac{«sq»}{«spp»}+\frac{«sp2»+«dm2»}{«sq2x2»}-0.5=«lg»+«frac»-0.5=«kl4»$$

          **答え** $«kl»$

          **間違えやすい点** カルバック・ライブラー情報量は対称ではなく、$D(q\,\|\,p)=«kl_rev»$ とは一致しない。AIC は、この $D(p\,\|\,q)$ のうちモデルに依存する部分（期待対数尤度）を推定して比べる量である。
          第 1 項 $\log(\sigma_q/\sigma_p)$ は $\log 0.8<0$ で負になる。$-\frac12$ を忘れると $p=q$ のときに 0 にならない。

      - id: s05p13c
        chapter: 10
        terms: [false-discovery-rate, multiple-testing, bonferroni-correction]
        topic: 副次評価項目7個のp値にベンジャミニ・ホッホベルグ法を当てはめ偽発見率5%で有意とする数
        level: 標準
        definition: false
        type: choice
        question: |
          副次評価項目 «m» 個について、次の $p$ 値が得られた。

          | 項目 | «nm0» | «nm1» | «nm2» | «nm3» | «nm4» | «nm5» | «nm6» |
          |---|---|---|---|---|---|---|---|
          | $p$ 値 | «pv0» | «pv1» | «pv2» | «pv3» | «pv4» | «pv5» | «pv6» |

          ベンジャミニ・ホッホベルグ法で偽発見率（FDR）を «q» 以下に抑えるとき、有意と判断される項目の数はどれか。
        choices:
          - "«kbon» 個"
          - "«kstep» 個"
          - "«kind» 個"
          - "«kbh» 個"
          - "«kraw» 個"
        answer: 3
        distractors:
          - ボンフェローニ法（またはホルム法）で判断した
          - 小さい順に比べて初めて基準を超えたところで止めた（ステップダウンと取り違えた）
          - 各 p 値を自分の順位の基準とだけ比べ、基準以下の項目だけを数えた
          - 正解
          - 多重性を調整せず 0.05 未満をすべて有意とした
        explanation: |
          **方針** $p$ 値を小さい順に $p_{(1)}\le\cdots\le p_{(m)}$ と並べ、$p_{(k)}\le\dfrac{k}{m}q$ を満たす**最大の** $k$ を探し、$p_{(1)},\ldots,p_{(k)}$ をすべて有意とする（ステップアップ法）。

          **途中式** $m=«m»$、$q=«q»$ のとき基準は $k\times«q»/«m»$。

          | $k$ | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
          |---|---|---|---|---|---|---|---|
          | $p_{(k)}$ | «sp1» | «sp2» | «sp3» | «sp4» | «sp5» | «sp6» | «sp7» |
          | $kq/m$ | «th1» | «th2» | «th3» | «th4» | «th5» | «th6» | «th7» |
          | 判定 | ○ | ○ | ○ | × | ○ | × | × |

          ○ となる最大の $k$ は 5。よって $k=4$ の項目（$p=«sp4»$）も含めて、小さい方から 5 個を有意とする。

          **答え** «kbh» 個

          **間違えやすい点** $k=4$ で基準を超えたところで止めると «kstep» 個、○ の項目だけを数えると «kind» 個になる。BH 法は「基準を満たす最大の順位まで全部」を有意とする。
          ボンフェローニ法（基準 $«q»/«m»$）は家族単位の誤り率を抑える方法で «kbon» 個しか有意にならない。調整しなければ «kraw» 個だが、偽陽性が混じる割合を管理できない。
          なお BH 法が FDR を $q$ 以下に保つのは、$p$ 値が独立（または正の依存）の場合である。
