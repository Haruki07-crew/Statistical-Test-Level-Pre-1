set: 4
title: 模擬試験 第4回
minutes: 90
problems:
  - id: s04p01
    title: シリコン基板の受入検査とチップの欠陥
    context: |
      ある半導体工場では、2 社から仕入れたシリコン基板でチップを作り、受入検査と完成品の外観検査を行っている。
      チップごとの微小な欠陥の個数 $X$ も記録しており、欠陥はウェハー上で固まって発生しやすいため、$X$ はポアソン分布より散らばりが大きい。
    items:
      - id: s04p01a
        chapter: 1
        terms: [bayes-theorem, law-of-total-probability, conditional-probability]
        topic: 抜取検査で不良2枚が見つかった基板ロットがどちらの仕入先のものかを二項尤度とベイズの定理で求める
        level: 基本
        definition: false
        type: numeric
        question: |
          基板ロットの «wA»（7 割）は A 社、«wB» は B 社から納入される。基板 1 枚が不良である確率は A 社製で «qA»、B 社製で «qB» で、各基板の良否は独立とする。
          ラベルの読めなくなったロットから «nS» 枚を抜き取って検査したところ、不良がちょうど «xS» 枚あった。このロットが B 社製である条件付き確率を求めよ。
          必要なら $0.98^{18}=«pw98»$、$0.94^{18}=«pw94»$ を使え。
        answer: «post1»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 「不良 «xS» 枚」という結果の確率（尤度）を仕入先ごとに二項分布で求め、事前確率 «wA»・«wB» を掛けてベイズの定理で正規化する。二項係数 $\binom{«nS»}{«xS»}$ は両社に共通なので約分できる。

          **途中式** 二項係数を除いた尤度は
          $$L_A=«qA»^2\times0.98^{18}=«qA2»\times«pw98»=«LA»,\qquad L_B=«qB»^2\times0.94^{18}=«qB2»\times«pw94»=«LB»$$
          事前確率を掛けると（$10^{-6}$ 単位で）$«wA»\times L_A=«jAe»$、$«wB»\times L_B=«jBe»$。
          $$P(B\mid\text{不良 «xS» 枚})=\frac{«jBe»}{«jAe»+«jBe»}=\frac{«jBe»}{«jABe»}=«post14»\cdots$$

          **答え** $«post1»$

          **間違えやすい点** 良品 «nx» 枚の確率 $(1-q)^{18}$ を落として不良の部分 $q^2$ だけで比べると $«post_nopow»$ になり、B 社の可能性を過大評価する（B 社は良品が出にくいことも証拠になる）。
          事前確率（納入比率）を使わないと $«post_noprior»$ になる。事前確率は «wB» でも、データによって B 社の確率が半分を超える。

      - id: s04p01b
        chapter: 5
        terms: [negative-binomial-distribution, poisson-distribution, method-of-moments]
        topic: 欠陥数の平均と分散から負の二項分布の母数をモーメント法で決めチップ歩留まりを求める
        level: 標準
        definition: false
        type: choice
        question: |
          多数のチップの検査記録から、1 チップあたりの欠陥数の平均は «m»、分散は «v» だった。$X$ が
          $$P(X=k)=\binom{k+r-1}{k}p^{r}(1-p)^{k}\quad(k=0,1,2,\ldots),\qquad E[X]=\frac{r(1-p)}{p},\quad V[X]=\frac{r(1-p)}{p^2}$$
          の負の二項分布に従うとし、$r$ と $p$ を平均と分散が一致するように（モーメント法で）決める。
          欠陥が 1 つもないチップを良品とするとき、良品率（歩留まり）$P(X=0)$ に最も近い値はどれか。
          なお、同じ平均 «m» のポアソン分布なら $P(X=0)=e^{-«m»}=«epois»$ である。
        choices:
          - "$«y_pois»$"
          - "$«y_p»$"
          - "$«y0»$"
          - "$«y_p2»$"
          - "$«y_p4»$"
        answer: 2
        distractors:
          - 過分散を無視してポアソン分布の e^{-0.6} を使った
          - P(X=0)=p^r の r 乗を忘れて p を答えた
          - 正解
          - 形状母数 r を 1 つ小さく（r=2）取った
          - 形状母数 r を 1 つ大きく（r=4）取った
        explanation: |
          **方針** 負の二項分布では $V[X]=E[X]/p$ なので、まず $p=E[X]/V[X]$ が決まり、次に $E[X]=r(1-p)/p$ から $r$ が決まる。良品率は $P(X=0)=p^r$。

          **途中式**
          $$p=\frac{E[X]}{V[X]}=\frac{«m»}{«v»}=«pfrac»\approx«p»,\qquad r=\frac{p\,E[X]}{1-p}=\frac{«p»\times«m»}{«q»}=«rr»$$
          （同じことを $V[X]=E[X]+E[X]^2/r$ から $r=\dfrac{E[X]^2}{V[X]-E[X]}=\dfrac{«m2»}{«vm»}=«rr»$ と求めてもよい。）
          $$P(X=0)=\binom{«rr»-1}{0}p^{«rr»}=\left(«pfrac»\right)^{«rr»}=«y04»\cdots$$

          **答え** $«y0»$

          **間違えやすい点** ポアソン分布を当てはめると $«y_pois»$ となり、歩留まりを低く見積もる。欠陥が固まって出る（過分散）と、同じ平均でも欠陥 0 のチップが増える。
          $P(X=0)=p^r$ の $r$ 乗を忘れると $«y_p»$、$r$ を取り違えると $«y_p2»$ や $«y_p4»$ になる。

      - id: s04p01c
        chapter: 28
        terms: [residual-analysis-contingency, contingency-table, expected-frequency]
        topic: 勤務帯と良否の3×2分割表で夜勤の不良セルの調整済み標準化残差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          朝・昼・夜の 3 つの勤務帯で、それぞれ «n_sh» 個ずつ検査したチップの良否を集計した。

          | 勤務帯 | 不良 | 良品 | 計 |
          |---|---|---|---|
          | 朝 | «d1» | «g1» | «n_sh» |
          | 昼 | «d2» | «g2» | «n_sh» |
          | 夜 | «d3» | «g3» | «n_sh» |
          | 計 | «D» | «G» | «N» |

          勤務帯と良否が独立という仮説のもとで、「夜・不良」のセルの**調整済み標準化残差**
          $$d=\frac{O-E}{\sqrt{E\left(1-\dfrac{\text{行和}}{N}\right)\left(1-\dfrac{\text{列和}}{N}\right)}}$$
          を求めよ（$O$ は観測度数、$E$ は独立のもとでの期待度数）。
        answer: «adj»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 期待度数 $E=\text{行和}\times\text{列和}/N$ を求め、ピアソン残差 $(O-E)/\sqrt{E}$ の分母に「行の割合・列の割合の補正」を掛けた式で標準化する。独立のもとで $d$ はおよそ標準正規分布に従う。

          **途中式** 夜の行和 «n_sh»、不良の列和 «D»、総数 «N» より
          $$E=\frac{«n_sh»\times«D»}{«N»}=«E»,\qquad O-E=«d3»-«E»=«oe»$$
          $$E\left(1-\frac{«n_sh»}{«N»}\right)\left(1-\frac{«D»}{«N»}\right)=«E»\times«rowf»\times«colf»=«den2»,\qquad \sqrt{«den2»}=«den»$$
          $$d=\frac{«oe»}{«den»}=«adj4»\cdots$$

          **答え** $«adj»$（$|d|>1.96$ なので、夜勤では不良が独立の場合より有意に多いといえる）

          **間違えやすい点** 分母を $\sqrt{E}$ だけにしたピアソン残差は $«pear»$ で、標準正規分布より分散が小さいので 1.96 と直接比べられない。
          補正項は「その行・列が全体に占める割合」を 1 から引いたもので、$1-«n_sh»/«N»$ と $1-«D»/«N»$ を使う（期待度数の割合を使わない）。

  - id: s04p02
    title: 風速の分布と風力発電の出力
    context: |
      ある風力発電所のハブ高さの風速 $V$（m/s）は、密度関数
      $$f_V(v)=\frac{v}{«half_c2»}\exp\left(-\frac{v^2}{«c2»}\right)\quad(v>0)$$
      をもつ分布（形状 2・尺度 «c» のワイブル分布）に従うとする。分布関数は $F_V(v)=1-\exp(-v^2/«c2»)$ である。
    items:
      - id: s04p02a
        chapter: 4
        terms: [change-of-variables, power-transformation]
        topic: 風速の3乗に比例する発電出力の密度関数をヤコビアンを用いて求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある運転領域では、発電出力 $W$ は定数 $a>0$ を用いて $W=aV^3$ で表される。$W$ の確率密度関数 $f_W(w)$（$w>0$）として正しいものはどれか。
        choices:
          - "$\\dfrac{(w/a)^{1/3}}{«half_c2»}\\exp\\left\\{-\\dfrac{(w/a)^{2/3}}{«c2»}\\right\\}$"
          - "$\\dfrac{3w}{«half_c2»}\\exp\\left\\{-\\dfrac{(w/a)^{2/3}}{«c2»}\\right\\}$"
          - "$\\dfrac{3}{«half_c2»\\,a^{2/3}}\\,w^{-1/3}\\exp\\left\\{-\\dfrac{(w/a)^{2/3}}{«c2»}\\right\\}$"
          - "$\\dfrac{1}{«k3»\\,a^{2/3}}\\,w^{-1/3}\\exp\\left\\{-\\dfrac{(w/a)^{2/3}}{«c2»}\\right\\}$"
          - "$1-\\exp\\left\\{-\\dfrac{(w/a)^{2/3}}{«c2»}\\right\\}$"
        answer: 3
        distractors:
          - ヤコビアン |dv/dw| を掛け忘れ、f_V に v=(w/a)^{1/3} を代入しただけ
          - dv/dw ではなく dw/dv=3av^2 を掛けた
          - dv/dw の係数 1/3 を 3 と誤った
          - 正解
          - 密度ではなく分布関数を答えた
        explanation: |
          **方針** $w=av^3$ は $v>0$ で単調増加なので、逆変換 $v=(w/a)^{1/3}$ を $f_V$ に代入し、ヤコビアン $|dv/dw|$ を掛ける。

          **途中式** $v=(w/a)^{1/3}$ より
          $$\frac{dv}{dw}=\frac{1}{3}a^{-1/3}w^{-2/3}$$
          $$f_W(w)=f_V\big((w/a)^{1/3}\big)\left|\frac{dv}{dw}\right|=\frac{(w/a)^{1/3}}{«half_c2»}\exp\left\{-\frac{(w/a)^{2/3}}{«c2»}\right\}\cdot\frac{1}{3}a^{-1/3}w^{-2/3}$$
          $(w/a)^{1/3}\cdot a^{-1/3}w^{-2/3}=a^{-2/3}w^{-1/3}$ なので
          $$f_W(w)=\frac{1}{«k3»\,a^{2/3}}\,w^{-1/3}\exp\left\{-\frac{(w/a)^{2/3}}{«c2»}\right\}$$
          確認として、分布関数 $F_W(w)=P(V\le (w/a)^{1/3})=1-\exp\{-(w/a)^{2/3}/«c2»\}$ を $w$ で微分しても同じ式になる。

          **答え** $\dfrac{1}{«k3»\,a^{2/3}}\,w^{-1/3}\exp\left\{-\dfrac{(w/a)^{2/3}}{«c2»}\right\}$（形状 $2/3$ のワイブル分布）

          **間違えやすい点** ヤコビアンは「新しい変数で古い変数を微分したもの」$|dv/dw|$。$|dw/dv|=3av^2$ を掛けると次元も合わず、積分しても 1 にならない。
          $\frac{d}{dw}w^{1/3}=\frac{1}{3}w^{-2/3}$ の係数 $\frac13$ を落とさないこと。

      - id: s04p02b
        chapter: 32
        terms: [monte-carlo-integration, standard-error]
        topic: 風速が定格を超える確率をモンテカルロ法で推定するとき標準誤差を目標以下にする試行回数
        level: 基本
        definition: false
        type: choice
        question: |
          風速が «v0» m/s を超えて発電機が定格出力に達する確率 $q=P(V>«v0»)$ を、$V$ の乱数を $N$ 個発生させて超えた割合 $\hat q$ で推定する（モンテカルロ法）。
          真の $q$ を上の分布から計算した値として、$\hat q$ の標準誤差を «se» 以下にするのに必要な最小の $N$ はどれか。
          必要なら $e^{-«ex»}=«e225»$ を使え。
        choices:
          - "$«n_half»$"
          - "$«n_ok»$"
          - "$«n_nosq»$"
          - "$«n_196»$"
          - "$«n_p»$"
        answer: 1
        distractors:
          - q を使わず最悪の場合の q(1−q)=0.25 で計算した
          - 正解
          - 標準誤差の式で分散と標準偏差を取り違え √(q(1−q))/N ≤ 0.005 とした
          - 標準誤差ではなく 95% 信頼区間の半幅を 0.005 以下にした
          - 分散を q(1−q) ではなく q とした
        explanation: |
          **方針** $\hat q$ は $N$ 回のベルヌーイ試行の成功割合なので $V[\hat q]=q(1-q)/N$。まず分布関数から $q$ を求め、$\sqrt{q(1-q)/N}\le«se»$ を $N$ について解く。

          **途中式** $q=1-F_V(«v0»)=\exp(-«v02»/«c2»)=e^{-«ex»}=«e225»$。
          $$\sqrt{\frac{q(1-q)}{N}}\le«se»\iff N\ge\frac{q(1-q)}{«se»^2}=\frac{«e225»\times(1-«e225»)}{«se2»}=\frac{«pq»}{«se2»}=«nraw»$$

          **答え** 切り上げて $N=«n_ok»$

          **間違えやすい点** 最悪の場合 $q(1-q)\le0.25$ を使うと «n_half» 回で、安全だが必要以上に多い。
          「標準誤差 0.005」と「95% 信頼区間の半幅 0.005」は別の条件で、後者なら $1.96^2$ 倍の «n_196» 回が必要になる。

  - id: s04p03
    title: 受電設備の保守データ
    context: |
      ある工場の受電設備では、遮断器のトリップ（自動遮断）の回数と、絶縁部品の試験結果を記録している。
    items:
      - id: s04p03a
        chapter: 2
        terms: [probability-generating-function, sum-of-random-variables, poisson-distribution]
        topic: 二項分布とポアソン分布に従う独立な2種類のトリップ回数の和の確率母関数の係数から合計がちょうど2回の確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          1 か月のトリップ回数は、次の 2 つの独立な原因の回数の和 $N=N_1+N_2$ である。
          - 構内の 2 台の遮断器が、それぞれ独立に確率 «q» で 1 回だけ誤動作する：$N_1\sim B(2,\ «q»)$
          - 落雷によるトリップ：$N_2$ は平均 «lam» のポアソン分布に従う

          $N$ の確率母関数 $G_N(s)=E[s^N]$ を用いて、1 か月のトリップがちょうど 2 回である確率 $P(N=2)$ を求めよ。必要なら $e^{-«lam»}=«e04»$ を使え。
        answer: «P2»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 独立な確率変数の和の確率母関数は積 $G_N(s)=G_{N_1}(s)G_{N_2}(s)$。$P(N=2)$ は $G_N(s)$ を $s$ のべき級数に展開したときの $s^2$ の係数。

          **途中式** $G_{N_1}(s)=(«q1»+«q»s)^2=«b0»+«b1»s+«b2»s^2$、$G_{N_2}(s)=e^{«lam»(s-1)}=e^{-«lam»}\left(1+«lam»s+\dfrac{«lam»^2}{2}s^2+\cdots\right)$。
          積の $s^2$ の係数は「$N_1=k$ かつ $N_2=2-k$」を $k=0,1,2$ について足したもの：
          $$P(N=2)=e^{-«lam»}\left(«b0»\times«po2»+«b1»\times«lam»+«b2»\times1\right)=«e04»\times(«t1»+«t2»+«t3»)=«e04»\times«inner»=«P26»$$

          **答え** $«P2»$

          **間違えやすい点** $s^2$ の係数を「$N_2=2$ の確率」だけ（$e^{-«lam»}\times«po2»=«P2_only»$）や「$N_1=2$ の確率」だけ（$«P2_b»$）にしない。
          和が 2 になる組合せ $(N_1,N_2)=(0,2),(1,1),(2,0)$ をすべて数える（たたみ込み）。ポアソン分布の $s^2$ の係数は $\lambda^2/2!$ で、$2!$ で割るのを忘れないこと。

      - id: s04p03b
        chapter: 9
        terms: [wilson-interval, wald-confidence-interval, ci-proportion]
        topic: 故障が少数の絶縁部品の試験結果からウィルソンのスコア区間で故障確率の95%信頼区間の上限を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          新しい絶縁部品 «n» 個を加速試験にかけたところ、«x» 個が故障した。故障確率 $p$ の 95% 信頼区間を、ワルド型ではなく**ウィルソンのスコア区間**
          $$\frac{\hat p+\dfrac{z^2}{2n}\pm z\sqrt{\dfrac{\hat p(1-\hat p)}{n}+\dfrac{z^2}{4n^2}}}{1+\dfrac{z^2}{n}}\qquad(\hat p=x/n,\ z=«z»)$$
          で作るとき、その**上限**を求めよ。
        answer: «up»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** ウィルソンの区間は $|\hat p-p|\le z\sqrt{p(1-p)/n}$ を $p$ について解いたもので、分母の $p(1-p)$ に推定値ではなく未知の $p$ を残す。式に値を順に代入する。

          **途中式** $\hat p=«x»/«n»=«ph»$、$z^2=«z2»$。
          $$\frac{z^2}{2n}=«a1»,\qquad \frac{\hat p(1-\hat p)}{n}+\frac{z^2}{4n^2}=«v1»+«v2»=«vs»$$
          $$z\sqrt{«vs»}=«z»\times«rt»=«zrt»,\qquad 1+\frac{z^2}{n}=«den»$$
          $$\text{上限}=\frac{«ph»+«a1»+«zrt»}{«den»}=\frac{«num»}{«den»}=«up5»\cdots$$

          **答え** $«up»$

          **間違えやすい点** ワルド型の上限 $\hat p+1.96\sqrt{\hat p(1-\hat p)/n}=«wald»$ は、$\hat p$ が 0 に近いと被覆確率が名目の 95% を大きく下回る（下限は負にもなる）。
          ウィルソンの区間は $\hat p$ について非対称で、中心が $1/2$ の側にずれる。分母 $1+z^2/n$ で割り忘れると «up_noden» になる。

  - id: s04p04
    title: 部品の公差と膜厚の比較
    context: |
      電子部品の製造では、部品の公差（ばらつきの許容範囲）の管理と、工場間の品質の比較を行っている。
    items:
      - id: s04p04a
        chapter: 6
        terms: [uniform-distribution, sum-of-random-variables, central-limit-theorem]
        topic: 一様分布に従う2本の抵抗の誤差の和が三角分布になることを使い直列回路の誤差が許容値を超える確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          公称値が同じ抵抗 2 本を直列につなぐ。各抵抗の公称値からのずれ $U_1,U_2$（Ω）は互いに独立に区間 $(-«hw»,\ «hw»)$ の一様分布に従う。
          合成抵抗のずれ $S=U_1+U_2$ の絶対値が «c» Ω を超える確率 $P(|S|>«c»)$ の**正確な値**に最も近いものはどれか。
          なお標準正規分布の分布関数について $\Phi(1.84)=«phi184»$ である。
        choices:
          - "$«c_nrm»$"
          - "$«c_ok»$"
          - "$«c_one»$"
          - "$«c_unif»$"
          - "$«c_half»$"
        answer: 1
        distractors:
          - 正確な値ではなく正規近似（中心極限定理）で計算した
          - 正解
          - 片側 P(S>1.5) だけを答えた
          - S を (−2, 2) の一様分布とみなした
          - 三角形の面積で 1/2 を掛け忘れた
        explanation: |
          **方針** 独立な一様分布の和の密度はたたみ込みで求まり、$(-2,\ 2)$ 上の三角分布 $f_S(s)=\dfrac{2-|s|}{4}$ になる。裾の部分は小さな三角形の面積。

          **途中式** $s>0$ では $f_S(s)=\displaystyle\int f_U(u)f_U(s-u)\,du=\frac14\times(\text{重なりの長さ }2-s)=\frac{2-s}{4}$。
          $$P(S>«c»)=\int_{«c»}^{2}\frac{2-s}{4}\,ds=\frac{(2-«c»)^2}{8}=\frac{«rest»^2}{8}=«tail»$$
          対称性から
          $$P(|S|>«c»)=2\times«tail»=«ex2»$$

          **答え** $«c_ok»$

          **間違えやすい点** 正規近似では $V[S]=2\times\frac{2^2}{12}=«varS»$、標準偏差 «sdS» から $2\{1-\Phi(1.84)\}=«c_nrm»$ となり、正確な値と少しずれる（裾の確率は近似の誤差が相対的に大きい）。
          一様分布の和は一様分布ではない（$(-2,2)$ の一様分布とみなすと «c_unif»）。三角形の面積の $\frac12$ を忘れると «c_half» になる。

      - id: s04p04b
        chapter: 11
        terms: [welch-test, two-sample-t-test, pooled-variance]
        topic: 分散が大きく異なる2工場の膜厚の平均差でウェルチの検定統計量とサタスウェイトの近似自由度を求める
        level: 標準
        definition: false
        type: choice
        question: |
          同じ装置を使う工場 A と工場 B で膜厚の平均を比べる。工場 A から «nA» 枚、工場 B から «nB» 枚を無作為に選んで測ったところ、
          標本平均は «mA» と «mB»、不偏分散から求めた標準偏差は $s_A=«sA»$、$s_B=«sB»$ だった。
          母分散が等しいとは限らないので**ウェルチの検定**を行う。検定統計量 $t$ と、サタスウェイトの式による近似自由度 $\nu$ の組として最も近いものはどれか。
        choices:
          - "«ch_pool»"
          - "«ch_wdf»"
          - "«ch_ok»"
          - "«ch_min»"
          - "«ch_n»"
        answer: 2
        distractors:
          - 等分散を仮定したプールした t 検定を行った
          - 統計量はウェルチだが自由度を nA+nB−2 とした
          - 正解
          - 保守的な自由度 min(nA,nB)−1 を使った
          - 自由度の式の分母で n−1 ではなく n で割った
        explanation: |
          **方針** ウェルチの統計量は $t=\dfrac{\bar x_A-\bar x_B}{\sqrt{s_A^2/n_A+s_B^2/n_B}}$。自由度は
          $\nu=\dfrac{(s_A^2/n_A+s_B^2/n_B)^2}{\dfrac{(s_A^2/n_A)^2}{n_A-1}+\dfrac{(s_B^2/n_B)^2}{n_B-1}}$ で近似する。

          **途中式** $s_A^2/n_A=«vA»/«nA»=«a»$、$s_B^2/n_B=«vB»/«nB»=«b»$、和は «ab»。
          $$t=\frac{«mA»-«mB»}{\sqrt{«ab»}}=\frac{«diff»}{«se»}=«t»$$
          $$\nu=\frac{«ab»^2}{\dfrac{«a»^2}{«dA»}+\dfrac{«b»^2}{«dB»}}=\frac{«ab2»}{«a2»+«b2»}=«nu»$$

          **答え** $t=«t»$、$\nu\approx«nu»$

          **間違えやすい点** プールした分散 $s_p^2=«sp2»$ を使うと $t=«tp»$（自由度 «dfp»）で、これは等分散を仮定した検定。
          ウェルチの自由度はサンプルの合計から決まるのではなく、分散の大きい群（ここでは B）の寄与が大きく、«dfp» より小さくなる。分母の $n-1$ を $n$ にすると 17.8 になる。

  - id: s04p05
    title: テストチップの欠陥数
    context: |
      ウェハー上に並べた評価用のテストチップについて、1 チップあたりの欠陥数 $X$ を調べる。
    items:
      - id: s04p05a
        chapter: 7
        terms: [markov-inequality, poisson-distribution]
        topic: 欠陥数の平均だけから一定数以上の欠陥をもつチップの割合の上限をマルコフの不等式で求める
        level: 基本
        definition: false
        type: choice
        question: |
          欠陥数 $X$（0 以上の整数）の分布の形はわからないが、平均が $E[X]=«mu»$ であることだけはわかっている。
          欠陥が «a» 個以上あるチップの割合 $P(X\ge «a»)$ について、マルコフの不等式 $P(X\ge a)\le E[X]/a$（$a>0$）から直接得られる上限はどれか。
          なお必要なら $e^{-«mu»}=«e075»$ を使え。
        choices:
          - "$«b_sq»$"
          - "$«bound»$"
          - "$«b_am1»$"
          - "$«b_pois»$"
          - "$«b_1m»$"
        answer: 1
        distractors:
          - チェビシェフの不等式と混同し a² で割った
          - 正解
          - 「3 個以上」を「2 個を超える」と読み a=2 を代入した
          - ポアソン分布を仮定した確率を計算した（分布の形がわからないので上限ではない）
          - 1−E[X]/a を答えた（下限と取り違えた）
        explanation: |
          **方針** マルコフの不等式は非負の確率変数なら分布の形によらず成り立つ。$a=«a»$ を代入する。

          **途中式**
          $$P(X\ge «a»)\le\frac{E[X]}{«a»}=\frac{«mu»}{«a»}=«bound»$$
          参考までに、もし $X$ が平均 «mu» のポアソン分布に従うなら
          $$P(X\ge «a»)=1-e^{-«mu»}\left(1+«mu»+\frac{«mu»^2}{2}\right)=1-«e075»\times«pois_in»=«pois4»$$
          で、上限 «bound» よりかなり小さい。

          **答え** $«bound»$

          **間違えやすい点** マルコフの不等式は平均しか使わないので評価は粗いが、どんな分布でも成り立つ保証である。ポアソンを仮定した $«b_pois»$ は特定の分布での値で、分布がわからない状況での上限にはならない。
          $a^2$ で割るのは、分散を使うチェビシェフの不等式 $P(|X-\mu|\ge a)\le\sigma^2/a^2$ の形。

      - id: s04p05b
        chapter: 8
        terms: [rao-blackwell-theorem, sufficient-statistic, unbiased-estimator, invariance-of-mle]
        topic: ポアソン分布の欠陥0の確率e^{-λ}の不偏推定量を十分統計量で条件づけるラオ・ブラックウェル化で作る
        level: 応用
        definition: false
        type: choice
        question: |
          ここでは $X$ が平均 $\lambda$ のポアソン分布に従うとし、«n» 個のテストチップの欠陥数 $X_1,\ldots,X_{«n»}$（独立）を観測したところ、合計は $T=\sum X_i=«T»$ だった。
          欠陥のないチップの割合 $\theta=P(X=0)=e^{-\lambda}$ を推定したい。不偏推定量 $I(X_1=0)$（1 個目のチップの欠陥が 0 なら 1、そうでなければ 0）を十分統計量 $T$ で条件づけた
          $E[I(X_1=0)\mid T]$ の値として最も近いものはどれか。必要なら $e^{-0.75}=«e075»$ を使え。
        choices:
          - "$«w_mle»$"
          - "$«w_t1»$"
          - "$«rb»$"
          - "$«w_lin»$"
          - "$«w_n»$"
        answer: 2
        distractors:
          - 最尤推定量 e^{-T/n}（不変性）を答えた。不偏ではない
          - 指数を T ではなく T−1 とした
          - 正解
          - e^{-λ}≈1−λ と 1 次近似して 1−T/n とした
          - 指数を T ではなく n とした
        explanation: |
          **方針** $T=\sum X_i$ は $\lambda$ の十分統計量。$T=t$ が与えられたとき、$t$ 個の欠陥は «n» 個のチップに等確率で独立に振り分けられるので、$X_1\mid T=t\sim B(t,\ 1/«n»)$ となる。条件付き期待値は $P(X_1=0\mid T=t)$。

          **途中式**
          $$E[I(X_1=0)\mid T=t]=P(X_1=0\mid T=t)=\left(1-\frac{1}{«n»}\right)^{t}$$
          $t=«T»$ を代入して
          $$\left(\frac{«n1»}{«n»}\right)^{«T»}=«frac»^{«T»}=«rb5»\cdots$$
          ラオ・ブラックウェルの定理により、これは不偏で、もとの $I(X_1=0)$ より分散が小さい（$T$ は完備でもあるので一様最小分散不偏推定量になる）。

          **答え** $«rb»$

          **間違えやすい点** 最尤推定量 $e^{-\hat\lambda}=e^{-T/«n»}=e^{-«lamh»}=«w_mle»$ は不変性から得られるが、$E[e^{-T/n}]\ne e^{-\lambda}$ なので不偏ではない。
          $(1-1/n)^T$ の期待値は $T\sim\mathrm{Po}(n\lambda)$ の確率母関数を $s=1-1/n$ で評価した $e^{n\lambda(s-1)}=e^{-\lambda}$ となり、不偏性が確かめられる。

  - id: s04p06
    title: 装置と部品の故障データ
    context: |
      半導体工場では、露光装置の故障件数を稼働時間とあわせて記録し、絶縁部品については加速試験で故障の起こりやすさを調べている。
    items:
      - id: s04p06a
        chapter: 12
        terms: [g-statistic, goodness-of-fit-test, expected-frequency, degrees-of-freedom-gof]
        topic: 稼働時間が異なる3台の装置の故障件数が稼働時間に比例しているかをG統計量による適合度検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          3 台の装置 A, B, C のある期間の稼働時間と故障件数は次のとおりだった。

          | 装置 | A | B | C | 計 |
          |---|---|---|---|---|
          | 稼働時間 | «h1» | «h2» | «h3» | «H» |
          | 故障件数 | «o1» | «o2» | «o3» | «n» |

          「3 台の故障率は等しい（故障件数は稼働時間に比例する）」という帰無仮説を、尤度比にもとづく $G$ 統計量 $G=2\sum O\ln(O/E)$ で検定する（$O$ は観測度数、$E$ は帰無仮説のもとでの期待度数）。
          正しいものはどれか。必要なら $\ln1.8=«ln18»$、$\ln0.8=«ln08»$、カイ二乗分布の上側点 $\chi^2_{0.05}(2)=«c2»$、$\chi^2_{0.05}(3)=«c3»$、$\chi^2_{0.01}(2)=«c201»$ を使え。
        choices:
          - "$G=«X2»$ で、$«c2»$ を超えるので有意水準 5% で帰無仮説を棄却する"
          - "$G=«Ghalf»$ で、$«c2»$ を超えないので有意水準 5% で帰無仮説を棄却しない"
          - "$G=«G»$ で、$«c3»$ を超えないので有意水準 5% で帰無仮説を棄却しない"
          - "$G=«G»$ で、$«c2»$ を超えるので有意水準 5% で帰無仮説を棄却する"
          - "$G=«G»$ で、$«c201»$ を超えないので有意水準 5% で帰無仮説を棄却しない"
        answer: 3
        distractors:
          - G ではなくピアソンのカイ二乗統計量の値を G とした
          - 2 倍するのを忘れた
          - 自由度をカテゴリー数 3 とした
          - 正解
          - 5% ではなく 1% の上側点と比べた
        explanation: |
          **方針** 帰無仮説のもとでの期待度数は、総件数を稼働時間の比で配分した $E_i=«n»\times h_i/«H»$。推定する母数（共通の故障率）は総件数で決まるので、自由度は $3-1=2$。

          **途中式** $E=(«e1»,\ «e2»,\ «e3»)$、$O/E=(1.8,\ 0.8,\ 0.8)$。
          $$\sum O\ln\frac{O}{E}=«o1»\times«ln18»+«o2»\times(«ln08»)+«o3»\times(«ln08»)=«t1»«t2»«t3»=«tsum»$$
          $$G=2\times«tsum»=«G»$$
          自由度 2 の上側 5% 点 «c2» を超えるので、帰無仮説を棄却する。

          **答え** $G=«G»$、有意水準 5% で棄却（装置 A の故障率が他より高い）

          **間違えやすい点** ピアソンのカイ二乗統計量 $\sum(O-E)^2/E=«X2»$ は $G$ と漸近的に同じ分布に従うが、値は異なる。
          $G$ は対数尤度比の 2 倍なので、2 倍を忘れると «Ghalf» になる。期待度数は「3 台で等しく «n»/3」ではなく、稼働時間に比例させる。

      - id: s04p06b
        chapter: 18
        terms: [probit-model, generalized-linear-model, link-function]
        topic: 印加電圧に対する絶縁部品の故障のプロビットモデルで故障確率が10%になる電圧を逆推定する
        level: 標準
        definition: false
        type: choice
        question: |
          絶縁部品に電圧 $x$（V）をかける加速試験の結果に、プロビットモデル
          $$P(\text{故障}\mid x)=\Phi(\beta_0+\beta_1x)$$
          を当てはめたところ、$\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$ だった（$\Phi$ は標準正規分布の分布関数）。
          故障確率が 10% になる電圧の推定値に最も近いものはどれか。標準正規分布の上側 10% 点は «z10»、上側 5% 点は «z05»、また $\ln 9=«ln9»$ である。
        choices:
          - "$«x_pos»$"
          - "$«x50»$"
          - "$«x10»$"
          - "$«x_logit»$"
          - "$«x_05»$"
        answer: 2
        distractors:
          - Φ^{-1}(0.10) の符号を誤り +1.2816 とした
          - 故障確率 50% の電圧を答えた
          - 正解
          - ロジットの逆関数 ln(0.1/0.9) を使った
          - 上側 5% 点 1.645 を使った
        explanation: |
          **方針** $\Phi(\beta_0+\beta_1x)=0.10$ を $x$ について解く。$\Phi^{-1}(0.10)$ は下側 10% 点で、上側 10% 点の符号を変えた $-«z10»$。

          **途中式**
          $$\beta_0+\beta_1x=\Phi^{-1}(0.10)=-«z10»\iff x=\frac{-«z10»-(«b0»)}{«b1»}=\frac{«num10»}{«b1»}=«x10_4»$$

          **答え** 約 $«x10»$ V

          **間違えやすい点** 10% は 50% より低い電圧で起こるので、$\Phi^{-1}(0.10)$ は負。符号を誤ると «x_pos» V（故障確率 90% の電圧）になる。
          故障確率 50% の電圧は $-\beta_0/\beta_1=«x50»$ V。プロビットとロジットはリンク関数が違い、ロジットの式 $\ln(0.1/0.9)=-«ln9»$ を使うと «x_logit» V になる。

  - id: s04p07
    title: 露光装置2台と修理担当1人
    context: |
      ある工程には露光装置が 2 台あり、修理担当は 1 人だけである。稼働中の各装置は 1 時間あたり率 $\lambda=«lam»$ で独立に故障し、
      故障した装置は修理担当が 1 台ずつ修理する（修理時間は平均 $1/\mu$、$\mu=«mu»$ の指数分布）。修理担当が別の装置を修理中のときは、故障した装置は待つ。
      故障している台数を状態 $0,1,2$ とする出生死滅過程として考える。
    items:
      - id: s04p07a
        chapter: 15
        terms: [birth-death-process, stochastic-process]
        topic: 装置2台と修理担当1人の故障台数を出生死滅過程とみなし2台とも停止している長時間割合を定常分布から求める
        level: 基本
        definition: false
        type: numeric
        question: |
          長時間運転したとき、2 台とも故障していて工程が止まっている時間の割合（定常確率 $\pi_2$）を求めよ。
        answer: «p2»
        tolerance: 0.0001
        answer_format: 小数第4位まで（小数第5位を四捨五入）で答えよ。±0.0001 の差まで正解とする。
        explanation: |
          **方針** 出生死滅過程の定常分布は、隣り合う状態の間の「流れのつり合い」$\pi_k\times(\text{上がる率})=\pi_{k+1}\times(\text{下がる率})$ から求まる。
          状態 0 では 2 台が稼働しているので故障の率は $2\lambda$、状態 1 では $\lambda$。修理担当は 1 人なので、状態 1 でも 2 でも修理の率は $\mu$。

          **途中式**
          $$\pi_1=\frac{2\lambda}{\mu}\pi_0=\frac{«lam2»}{«mu»}\pi_0=«a1»\,\pi_0,\qquad \pi_2=\frac{\lambda}{\mu}\pi_1=«rat»\times«a1»\,\pi_0=«a2»\,\pi_0$$
          $\pi_0+\pi_1+\pi_2=1$ より $\pi_0=1/(1+«a1»+«a2»)=1/«den»=«p0»$。
          $$\pi_2=«a2»\times\pi_0=\frac{«a2»}{«den»}=«p26»\cdots$$

          **答え** $«p2»$

          **間違えやすい点** 状態 0 から 1 への率は 2 台分の $2\lambda$（$\lambda$ にしない）。修理担当が 1 人なので状態 2 からの修理の率は $2\mu$ ではなく $\mu$。
          2 台が独立に修理される（修理担当 2 人）なら $\pi_2=\{\lambda/(\lambda+\mu)\}^2=«ind»$ で、担当が 1 人だと停止の割合が約 2 倍になる。

  - id: s04p08
    title: 新しい封止材の寿命試験
    context: |
      パワー半導体の封止材を新材料 A に変えると寿命が延びるかを調べるため、高温高湿の加速試験を行った。
      寿命（時間）は次のとおりで、同じ値はない。

      | 材料 | 寿命 |
      |---|---|
      | 新材料 A（3 個） | «a1», «a2», «a3» |
      | 従来材料 B（5 個） | «b1», «b2», «b3», «b4», «b5» |
    items:
      - id: s04p08a
        chapter: 13
        terms: [wilcoxon-rank-sum-test, rank-and-ties, permutation-test]
        topic: 少数の寿命データで順位和検定の正確な片側p値を順位の組合せの数え上げで求める
        level: 基本
        definition: false
        type: choice
        question: |
          8 個をまとめて小さい順に順位をつけ、A の順位和 $W$ を統計量とする**ウィルコクソンの順位和検定**を行う。
          対立仮説「A の寿命は B より長い傾向がある」に対する**正確な**片側 $p$ 値 $P(W\ge w_{\text{obs}})$ に最も近い値はどれか。
          なお標準正規分布について $\Phi(1.64)=«phi164»$ である。
        choices:
          - "$«p_gt»$"
          - "$«p_norm»$"
          - "$«p_ok»$"
          - "$«p_two»$"
          - "$«p_low»$"
        answer: 2
        distractors:
          - 観測値と等しい場合を含めず P(W>19) とした
          - 正確な p 値ではなく連続修正なしの正規近似を使った
          - 正解
          - 両側 p 値（2 倍）を答えた
          - 反対側の確率 P(W<19) を答えた
        explanation: |
          **方針** 帰無仮説のもとでは、8 個の順位のうちどの 3 個が A に割り当てられるかは $\binom{8}{3}=«tot»$ 通りすべて等確率。順位和が観測値以上になる組を数える。

          **途中式** 順位は B: «b1»(1), «b2»(2), «b3»(3), «b4»(5), «b5»(6)、A: «a1»(«rk1»), «a2»(«rk2»), «a3»(«rk3»)。よって $W=«rk1»+«rk2»+«rk3»=«W»$。
          3 つの順位の和が «W» 以上になる組は
          $$\{6,7,8\}=21,\quad \{5,7,8\}=20,\quad \{4,7,8\}=19,\quad \{5,6,8\}=19$$
          の «ge» 通り。
          $$p=\frac{«ge»}{«tot»}=«p_ok»$$

          **答え** $«p_ok»$（片側 5% では有意とはいえない）

          **間違えやすい点** 「以上」なので観測値 19 と等しい組も数える（含めないと «gt»/«tot»=«p_gt»）。
          標本が小さいので正規近似 $E[W]=«EW»$、$V[W]=«VW»$、$z=(«W»-«EW»)/«sdW»=«z»$ による $«p_norm»$ は正確な値からずれる。

  - id: s04p09
    title: 夏の電力需要と最高気温
    context: |
      ある電力会社が、夏の «n» 日間の 1 日の最大電力需要 $y$（万 kW）を最高気温 $x$（℃）に単回帰した。
      $\bar x=«xbar»$、$S_{xx}=\sum(x_i-\bar x)^2=«Sxx»$ で、最小二乗推定値は $\hat\beta_0=«b0»$、$\hat\beta_1=«b1»$、
      残差の標準偏差（残差平方和を自由度 $n-2$ で割った平方根）は $s=«sres»$ だった。誤差は独立に同じ分散の正規分布に従うとする。
    items:
      - id: s04p09a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, least-squares-method]
        topic: 最高気温の予報値に対する翌日の最大電力需要の95%予測区間の上限を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          翌日の最高気温が «x0» ℃と予報された。翌日の最大電力需要（1 日分の値）の 95% 予測区間の**上限**を求めよ。
          $t$ 分布の上側点は $t_{0.025}(18)=«t18»$、$t_{0.025}(19)=«t19»$、$t_{0.05}(18)=«t18_05»$ である。
        answer: «up»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** 新しい 1 回の観測値の予測誤差の分散は $\sigma^2\left\{1+\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}\right\}$。$\sigma$ を $s$ で置き換えるので自由度 $n-2$ の $t$ 分布を使う。

          **途中式** 予測値 $\hat y_0=«b0»+«b1»\times«x0»=«y0»$。
          $$1+\frac{1}{«n»}+\frac{(«x0»-«xbar»)^2}{«Sxx»}=1+«n_inv»+«q»=«k»,\qquad s\sqrt{«k»}=«sres»\times«sqk»=«sepred»$$
          $$\text{上限}=«y0»+«t18»\times«sepred»=«y0»+«hw»=«up4»$$

          **答え** $«up»$ 万 kW

          **間違えやすい点** 「1」を落とすと平均需要の信頼区間になり、上限は «up_mean» と狭くなりすぎる。
          自由度は $n-2=18$（$t_{0.025}(19)$ を使うと «up_t19»）。両側 95% なので $t_{0.05}(18)$ ではない（使うと «up_1s»）。

      - id: s04p09b
        chapter: 27
        terms: [autocovariance-autocorrelation, ar-model, weak-stationarity]
        topic: AR1の系列相関がある誤差の標本平均の分散を独立の場合と比べ有効標本サイズを求める
        level: 標準
        definition: false
        type: choice
        question: |
          同じモデルを別の年の $n=«nd»$ 日分のデータに当てはめて残差を調べたところ、誤差 $e_t$ は AR(1) 過程 $e_t=\phi e_{t-1}+u_t$（$\phi=«phi»$、$u_t$ はホワイトノイズ、定常）に従うとみなせた。
          このとき $n$ 日分の誤差の平均 $\bar e$ の分散は、独立な観測が何日分あるときの分散に相当するか（有効標本サイズ）。$n$ が大きいときの近似式 $V[\bar e]\approx\dfrac{\gamma_0}{n}\left(1+2\sum_{k=1}^{\infty}\rho_k\right)$（$\gamma_0$ は $e_t$ の分散、$\rho_k$ は自己相関）を使って求めた値はどれか。
        choices:
          - "$«n_1p»$"
          - "$«n_1m»$"
          - "$«neff»$"
          - "$«n_r2»$"
          - "$«n_rev»$"
        answer: 2
        distractors:
          - 分散の膨張を 1+φ 倍とした
          - 分散の膨張を 1/(1−φ) 倍とした
          - 正解
          - AR(1) の誤差分散と系列の分散の比 1−φ² を掛けた
          - 膨張率で割らずに掛けた
        explanation: |
          **方針** 定常系列の和の分散は自己共分散をすべて足したもの。$n$ が大きいとき
          $$V[\bar e]\approx\frac{\gamma_0}{n}\left(1+2\sum_{k=1}^{\infty}\rho_k\right)$$
          で、AR(1) では $\rho_k=\phi^k$。

          **途中式**
          $$\sum_{k=1}^{\infty}\phi^k=\frac{\phi}{1-\phi}=\frac{«phi»}{1-«phi»}=«sumr»,\qquad 1+2\times«sumr»=«fac»\ \left(=\frac{1+\phi}{1-\phi}\right)$$
          したがって $V[\bar e]\approx «fac»\times\gamma_0/n$ で、独立な観測 $n_{\text{eff}}$ 個の平均の分散 $\gamma_0/n_{\text{eff}}$ と等しくなるのは
          $$n_{\text{eff}}=\frac{n}{«fac»}=\frac{«nd»}{«fac»}=«neff»$$

          **答え** $«neff»$ 日分（有限の $n=«nd»$ での正確な分散から求めると約 «neff_ex» 日分で、近似とほぼ一致する）

          **間違えやすい点** 正の系列相関があると、見かけの $n$ ほど情報がない。独立とみなして平均の標準誤差を $\sqrt{\gamma_0/n}$ とすると、標準誤差を半分（$1/\sqrt{«fac»}$）に過小評価してしまう。
          膨張率は $1+2\sum\rho_k$ で、$\rho_1$ だけ（$1+\phi$）を考えると «n_1p» 日になる。

  - id: s04p10
    title: 地域の工場の電力使用量
    context: |
      ある地域には «Nn» の工場がある。各工場の月間電力使用量（MWh）を調査し、生産量との関係も調べる。
    items:
      - id: s04p10a
        chapter: 21
        terms: [simple-random-sampling, finite-population-correction, required-sample-size]
        topic: 有限母集団修正を考慮して少数の工場の平均電力使用量を所定の精度で推定するのに必要な標本数
        level: 基本
        definition: false
        type: choice
        question: |
          «Nn» 工場から非復元の単純無作為抽出で $n$ 工場を選び、平均使用量を推定する。過去の調査から工場間の標準偏差は $S=«S»$ MWh と見込まれる。
          95% 信頼区間の半幅を «d» MWh 以下にしたい。有限母集団修正を考慮して
          $$n=\frac{n_0}{1+n_0/N},\qquad n_0=\left(\frac{«z»\,S}{d}\right)^2$$
          で求めるとき、必要な最小の $n$ はどれか。
        choices:
          - "$«n_nofpc»$"
          - "$«nreq»$"
          - "$«n_164»$"
          - "$«n_nosq»$"
          - "$«n_mult»$"
        answer: 1
        distractors:
          - 有限母集団修正をしなかった
          - 正解
          - 両側 95% ではなく 1.645 を使った
          - n0 の 2 乗を忘れた
          - 割る代わりに n0(1−n0/N) とした
        explanation: |
          **方針** 母集団が小さいときは、非復元抽出の平均の分散に有限母集団修正 $(N-n)/N$ がかかり、必要な標本数が減る。無限母集団での $n_0$ を求めてから修正する。

          **途中式**
          $$n_0=\left(\frac{«z»\times«S»}{«d»}\right)^2=«zSd»^2=«n0»$$
          $$n=\frac{«n0»}{1+«n0»/«Nn»}=\frac{«n0»}{1+«n0N»}=«nraw»$$

          **答え** 切り上げて $n=«nreq»$ 工場

          **間違えやすい点** 修正をしないと «n_nofpc» 工場で、全体の半分以上を調べることになる。母集団の大きさが標本の大きさと比べて小さいときは、修正の効果が大きい。
          分母を $1+(n_0-1)/N$ とする流儀もあるが、この場合も切り上げると «nreq» で同じになる。

      - id: s04p10b
        chapter: 19
        terms: [weighted-least-squares, heteroscedasticity, ratio-estimation]
        topic: 誤差分散が生産量に比例する原点を通る回帰で重み付き最小二乗推定量が比推定量になることを使う
        level: 標準
        definition: false
        type: choice
        question: |
          生産量 $x$（千個）と電力使用量 $y$（MWh）の関係を 5 工場のデータで調べる。

          | 工場 | A | B | C | D | E |
          |---|---|---|---|---|---|
          | $x$ | «x1» | «x2» | «x3» | «x4» | «x5» |
          | $y$ | «yy1» | «yy2» | «yy3» | «yy4» | «yy5» |

          モデル $y_i=\beta x_i+\varepsilon_i$、$V[\varepsilon_i]=\sigma^2x_i$（誤差は独立、分散は生産量に比例）を仮定する。
          $\beta$ の重み付き最小二乗推定値（小数第 3 位まで）として正しいものはどれか。
        choices:
          - "$«ols0»$"
          - "$«wls»$"
          - "$«mr»$"
          - "$«ols1»$"
          - "$«wx»$"
        answer: 1
        distractors:
          - 重みを付けない原点回帰 Σxy/Σx² を使った
          - 正解
          - 比 y/x の単純平均（分散が x² に比例する場合の WLS）を使った
          - 切片ありの通常の最小二乗法の傾きを使った
          - 重みを 1/x ではなく x にした
        explanation: |
          **方針** 分散が $x_i$ に比例するので、重み $w_i=1/x_i$ で残差平方和 $\sum w_i(y_i-\beta x_i)^2$ を最小にする。

          **途中式** $\beta$ で微分して 0 とおくと
          $$\sum\frac{1}{x_i}\,x_i(y_i-\beta x_i)=0\iff\sum y_i=\beta\sum x_i\iff\hat\beta=\frac{\sum y_i}{\sum x_i}$$
          $$\hat\beta=\frac{«yy1»+«yy2»+«yy3»+«yy4»+«yy5»}{«x1»+«x2»+«x3»+«x4»+«x5»}=\frac{«Sy»}{«Sx»}=«wls»$$

          **答え** $«wls»$（比推定量 $\bar y/\bar x$ と一致する）

          **間違えやすい点** 重みなしの原点回帰は $\sum x_iy_i/\sum x_i^2=«Sxy»/«Sxx»=«ols0»$ で、分散の大きい大規模工場を重く扱いすぎる。
          分散が $x_i^2$ に比例するなら重みは $1/x_i^2$ で、推定量は比の平均 $\frac15\sum y_i/x_i=«mr»$ になる。重みは分散の逆数であることに注意。

      - id: s04p10c
        chapter: 17
        terms: [robust-standard-error, heteroscedasticity, residual]
        topic: 単回帰の残差から不均一分散に頑健なHC0型標準誤差で傾きの標準誤差を求め通常の標準誤差と比べる
        level: 応用
        definition: false
        type: choice
        question: |
          別の 5 工場で、電力使用量 $y$ を生産量 $x$ に切片つきで単回帰（最小二乗法）したところ、各工場の $x$ と残差 $e_i$ は次のとおりだった。

          | 工場 | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $x_i$ | «h1» | «h2» | «h3» | «h4» | «h5» |
          | $e_i$ | «e1» | «e2» | «e3» | «e4» | «e5» |

          傾きの、不均一分散に頑健な HC0 型の標準誤差
          $$\mathrm{SE}_{\mathrm{HC0}}(\hat\beta_1)=\frac{\sqrt{\sum_i(x_i-\bar x)^2e_i^2}}{\sum_i(x_i-\bar x)^2}$$
          に最も近い値はどれか。
        choices:
          - "$«ols_se»$"
          - "$«vhc»$"
          - "$«hc1»$"
          - "$«hc0»$"
          - "$«hc_bad»$"
        answer: 3
        distractors:
          - 等分散を仮定した通常の標準誤差 √(s²/Sxx) を答えた
          - 平方根をとらず分散を答えた
          - 自由度補正 n/(n−2) を掛けた HC1 型を答えた
          - 正解
          - 分母を Sxx² ではなく Sxx として平方根の中に入れた
        explanation: |
          **方針** 傾きの推定量は $\hat\beta_1=\sum(x_i-\bar x)y_i/S_{xx}$ なので、誤差の分散が $\sigma_i^2$ と工場ごとに違うとき $V[\hat\beta_1]=\sum(x_i-\bar x)^2\sigma_i^2/S_{xx}^2$。$\sigma_i^2$ を $e_i^2$ で置き換えたのが HC0 型（サンドイッチ型）。

          **途中式** $\bar x=«hxm»$、$(x_i-\bar x)^2=«dd1»,\ «dd2»,\ 0,\ «dd4»,\ «dd5»$ より $S_{xx}=«Sxxh»$。
          $$\sum(x_i-\bar x)^2e_i^2=«m1»+«m2»+0+«m4»+«m5»=«meat»$$
          $$\mathrm{SE}_{\mathrm{HC0}}=\frac{\sqrt{«meat»}}{«Sxxh»}=\sqrt{\frac{«meat»}{«Sxxh2»}}=\sqrt{«vhc»}=«hc0_4»\cdots$$

          **答え** $«hc0»$

          **間違えやすい点** 通常の標準誤差は $s^2=\sum e_i^2/(n-2)=«ss»/3=«s2»$ を使った $\sqrt{«s2»/«Sxxh»}=«ols_se»$。ここでは残差の大きい工場が $x$ の中心寄りにあるため、HC0 のほうが小さくなる（頑健な標準誤差は常に大きくなるわけではない）。
          小標本では HC0 は過小になりやすく、$\sqrt{n/(n-2)}$ を掛けた HC1 型（$«hc1»$）などの補正が使われる。

  - id: s04p11
    title: 成膜条件の一部実施要因実験
    context: |
      成膜工程の 3 つの因子 A（温度）、B（圧力）、C（ガス流量）をそれぞれ 2 水準（低・高）で調べたいが、試作は 4 回しかできない。
      そこで定義関係 $I=ABC$ の $2^{3-1}$ 一部実施要因計画を用い、高水準にする因子の組が $a$、$b$、$c$、$abc$ の 4 通りで試作した（例えば $a$ は A だけ高水準）。
      膜の均一性の評価値は次のとおりだった。

      | 試作 | $a$ | $b$ | $c$ | $abc$ |
      |---|---|---|---|---|
      | 評価値 | «ya» | «yb» | «yc» | «yabc» |
    items:
      - id: s04p11a
        chapter: 20
        terms: [fractional-factorial-design, confounding, factorial-design]
        topic: 定義関係I=ABCの2の3-1乗一部実施計画で主効果Aを推定しその別名となる交互作用を読み取る
        level: 標準
        definition: false
        type: choice
        question: |
          主効果 A を「A が高水準の試作の平均 − A が低水準の試作の平均」で推定する。推定値と、この推定値に含まれてしまう（A と別名の関係にある）効果の組として正しいものはどれか。
        choices:
          - "推定値 «eff4»、別名は交互作用 BC"
          - "推定値 «eff»、別名は交互作用 BC"
          - "推定値 «eff»、別名は交互作用 AB"
          - "推定値 «effc»、別名は交互作用 BC"
          - "推定値 «eff»、どの効果とも別名にならない"
        answer: 1
        distractors:
          - 対比を 2 ではなく 4 で割った
          - 正解
          - 定義関係から別名を求めるとき A·ABC を誤って AB とした
          - 対比を割らずにそのまま効果とした
          - 一部実施では主効果が交互作用と交絡することを見落とした
        explanation: |
          **方針** 主効果は高水準の平均と低水準の平均の差。別名は、効果に定義関係の語 $ABC$ を掛け、2 乗になった文字を消して求める（$A\cdot ABC=A^2BC=BC$）。

          **途中式** A が高水準の試作は $a$ と $abc$、低水準は $b$ と $c$。
          $$\hat A=\frac{«ya»+«yabc»}{2}-\frac{«yb»+«yc»}{2}=«hiA»-«loA»=«eff»$$
          別名：$A\times ABC=A^2BC=BC$。実際、水準を $\pm1$ で表すと、B と C の積が $+1$ になる試作は $a$（$(-1)\times(-1)$）と $abc$、$-1$ になるのは $b$ と $c$ で、BC の対比は A の対比と完全に一致し、区別できない。

          **答え** 推定値 «eff»、別名は交互作用 BC（推定しているのは A + BC）

          **間違えやすい点** 4 回の実験の対比 $(«ya»+«yabc»)-(«yb»+«yc»)=«contrast»$ を 4 で割ると «eff4» で、平均の差（2 で割る）になっていない。
          $2^{3-1}$ 計画では主効果どうしは交絡しないが、各主効果は 2 因子交互作用と別名になる（分解能 III）。BC が無視できると仮定できるときだけ «eff» を A の効果と解釈できる。

  - id: s04p12
    title: 製造データの多変量解析
    context: |
      ある工場では、装置のセンサー値や製造ラインごとの欠陥の種類などの記録を多変量解析で調べている。
    items:
      - id: s04p12a
        chapter: 22
        terms: [principal-component-score, pca-on-correlation-matrix, eigenvalue-and-eigenvector]
        topic: 4センサーの相関行列の第1固有ベクトルと標準化した観測値から1回の運転の第1主成分得点を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          4 つのセンサー（温度・流量・圧力・電力）の相関行列で主成分分析をしたところ、固有値は «l1», «l2», «l3», «l4» で、
          第 1 主成分の（長さ 1 の）固有ベクトルは $(«e11»,\ «e12»,\ «e13»,\ «e14»)$ だった。各センサーの平均・標準偏差と、ある 1 回の運転の値は次のとおり。

          | センサー | 温度 | 流量 | 圧力 | 電力 |
          |---|---|---|---|---|
          | 平均 | «m1» | «m2» | «m3» | «m4» |
          | 標準偏差 | «d1» | «d2» | «d3» | «d4» |
          | この運転の値 | «o1» | «o2» | «o3» | «o4» |

          この運転の第 1 主成分得点（標準化した値と固有ベクトルの内積）に最も近い値はどれか。必要なら $\sqrt{2.6}=«sq26»$ を使え。
        choices:
          - "$«sc_raw»$"
          - "$«sc_load»$"
          - "$«sc»$"
          - "$«sc_div»$"
          - "$«sc_abs»$"
        answer: 2
        distractors:
          - 標準化せず平均からの偏差のまま内積をとった
          - 固有ベクトルではなく負荷量 √λ·e を係数にした
          - 正解
          - 得点を √λ で割った（分散 1 に基準化した）
          - 圧力の標準化値の負の符号を落とした
        explanation: |
          **方針** 相関行列による主成分分析では、各変数を標準化 $z_j=(x_j-\bar x_j)/s_j$ してから固有ベクトルとの内積をとる。

          **途中式** 標準化した値は
          $$z=\left(\frac{«o1»-«m1»}{«d1»},\ \frac{«o2»-«m2»}{«d2»},\ \frac{«o3»-«m3»}{«d3»},\ \frac{«o4»-«m4»}{«d4»}\right)=(«z1»,\ «z2»,\ «z3»,\ «z4»)$$
          $$\text{得点}=«e11»\times«z1»+«e12»\times«z2»+«e13»\times(«z3»)+«e14»\times«z4»=«p1»+«p2»«p3»+«p4»=«sc»$$

          **答え** $«sc»$

          **間違えやすい点** 標準化を忘れると、単位の大きい温度の偏差が支配して $«sc_raw»$ になる。主成分得点の係数は固有ベクトルで、負荷量（$\sqrt{\lambda_1}\times$固有ベクトル、変数と主成分の相関）とは別物（負荷量を使うと $«sc_load»$）。
          なお第 1・第 2 主成分の累積寄与率は $(«l1»+«l2»)/4=«cum2»\%$ で、固有値 1 以上（カイザー基準）なら第 1 主成分だけを残すことになる。

      - id: s04p12b
        chapter: 26
        terms: [correspondence-analysis, contingency-table]
        topic: 製造ライン別の欠陥の種類の分割表で2ラインの行プロファイル間のカイ二乗距離を求める
        level: 応用
        definition: false
        type: choice
        question: |
          3 つの製造ラインで見つかった欠陥を種類別に数えた。

          | ライン | 傷 | 異物 | 変色 | 計 |
          |---|---|---|---|---|
          | L1 | «t11» | «t12» | «t13» | «r1» |
          | L2 | «t21» | «t22» | «t23» | «r2» |
          | L3 | «t31» | «t32» | «t33» | «r3» |
          | 計 | «k1» | «k2» | «k3» | «Nt» |

          対応分析では、各ラインの行プロファイル（行和で割った割合）の間の距離を、列の周辺割合 $c_j$ で重み付けた**カイ二乗距離**
          $$d(i,i')=\sqrt{\sum_j\frac{(p_{ij}-p_{i'j})^2}{c_j}}$$
          で測る。L1 と L2 のカイ二乗距離に最も近い値はどれか。
        choices:
          - "$«w_eu»$"
          - "$«w_d2»$"
          - "$«chi_d»$"
          - "$«w_mul»$"
          - "$«w_avg»$"
        answer: 2
        distractors:
          - 重みをつけないユークリッド距離を求めた
          - 平方根をとらず距離の 2 乗を答えた
          - 正解
          - 列の周辺割合で割らずに掛けた
          - 2 つのラインの平均プロファイルで割った（全体の列割合を使わなかった）
        explanation: |
          **方針** 行プロファイル $p_{ij}=n_{ij}/n_{i\cdot}$ と列の周辺割合 $c_j=n_{\cdot j}/N$ を求め、差の 2 乗を $c_j$ で割って足す。出現の少ない種類の差ほど重く数える。

          **途中式** $c=(«k1»,\ «k2»,\ «k3»)/«Nt»=(«c1»,\ «c2»,\ «c3»)$。L1 のプロファイルは $(«p11»,\ «p12»,\ «p13»)$、L2 は $(«p21»,\ «p22»,\ «p23»)$。
          $$d^2=\frac{(«p11»-«p21»)^2}{«c1»}+\frac{(«p12»-«p22»)^2}{«c2»}+\frac{(«p13»-«p23»)^2}{«c3»}=«q1»+«q2»+«q3»=«chi_d2»$$
          $$d=\sqrt{«chi_d2»}=«chi_d»$$

          **答え** $«chi_d»$

          **間違えやすい点** 重みなしのユークリッド距離（$«w_eu»$）では、全体として多い種類と少ない種類の差を同じ重さで扱ってしまう。
          カイ二乗距離の重みは $1/c_j$（全体の列割合の逆数）で、比べる 2 行だけの平均を使わない。各行プロファイルと平均プロファイル（列の周辺割合）とのカイ二乗距離の 2 乗を行の周辺割合で重み付けた和が、総イナーシャ（$\chi^2/N$）になる。

      - id: s04p12c
        chapter: 23
        terms: [bayes-discriminant-rule, misclassification-rate, linear-discriminant-analysis]
        topic: 不良品の事前確率と見逃しコストを考慮した1次元正規2群のベイズ判別の境界値
        level: 応用
        definition: false
        type: choice
        question: |
          センサーから作るスコア $Z$ は、良品では $N(«mG»,«sd»^2)$、不良品では $N(«mD»,«sd»^2)$ に従う。不良品の割合は «piD» である。
          不良品を良品と判定する（見逃す）損失は «cm»、良品を不良品と判定する（過検出）損失は «cf» とする。
          期待損失を最小にするベイズ判別では「$Z>c$ なら不良品と判定」となる。境界値 $c$ に最も近い値はどれか。
          必要なら $\ln 1.9=«ln19r»$、$\ln 19=«ln19»$、$\ln 10=«ln10»$ を使え。
        choices:
          - "$«thr_mid»$"
          - "$«thr_prior»$"
          - "$«thr_cost»$"
          - "$«thr»$"
          - "$«thr_rev»$"
        answer: 3
        distractors:
          - 事前確率も損失も考えず 2 群の平均の中点にした
          - 事前確率だけを考え、損失を無視した
          - 損失だけを考え、事前確率を無視した
          - 正解
          - 尤度比と比べる値を逆数にした
        explanation: |
          **方針** 期待損失最小の規則は「$\pi_Dc_{\text{見逃し}}f_D(z)>\pi_Gc_{\text{過検出}}f_G(z)$ なら不良品」。両辺の対数をとって $z$ について解く。

          **途中式** 不良品と判定する条件は
          $$\frac{f_D(z)}{f_G(z)}>\frac{\pi_G\,c_{\text{過検出}}}{\pi_D\,c_{\text{見逃し}}}=\frac{«piG»\times«cf»}{«piD»\times«cm»}=«lr»$$
          等分散の正規分布なので
          $$\ln\frac{f_D(z)}{f_G(z)}=\frac{(z-«mG»)^2-(z-«mD»)^2}{2\times«sd2»}=\frac{«dm»z-«sum_m2»}{«twos2»}=\frac{z}{2}-27$$
          $$\frac{z}{2}-27>\ln 1.9=«ln19r»\iff z>2\times(27+«ln19r»)=«thr4»$$

          **答え** $c\approx«thr»$

          **間違えやすい点** 事前確率と損失を無視すると中点 «thr_mid» になる。不良品はまれ（事前確率で境界は不良側へ «thr_prior» まで動く）だが、見逃しの損失が大きい（損失で良品側へ «thr_cost» まで動く）。
          両方を合わせると尤度比と比べる値は $0.95/(0.05\times«cm»)=«lr»>1$ なので、境界は中点より不良側の «thr» になる。比べる値を逆数 $1/«lr»$ にすると «thr_rev» と反対側にずれる。

  - id: s04p13
    title: 新しい保全方式の効果
    context: |
      ある電力会社が、変電設備に新しい予防保全方式 $X$（1: 採用, 0: 従来）を導入した。1 年間の停止事故 $Y$（1: あり, 0: なし）への効果を知りたい。
      新方式は老朽化の進んでいない設備に優先して採用されたため、設備の老朽度 $Z$（1: 老朽, 0: 比較的新しい）が交絡因子になっている。
      $Z$ 以外に交絡はなく、$Z$ はバックドア基準を満たすとする。«N» 設備の記録は次のとおり。

      | 老朽度 $Z$ | 方式 $X$ | 設備数 | 事故あり |
      |---|---|---|---|
      | 1（老朽） | 1（新方式） | «n11» | «y11» |
      | 1（老朽） | 0（従来） | «n10» | «y10» |
      | 0（新しい） | 1（新方式） | «n01» | «y01» |
      | 0（新しい） | 0（従来） | «n00» | «y00» |
    items:
      - id: s04p13a
        chapter: 33
        terms: [causal-effect, backdoor-criterion]
        topic: 老朽度ごとに求めた傾向スコアの逆数で重み付けする逆確率重み付け法で新しい保全方式の平均因果効果を求める
        level: 応用
        definition: false
        type: choice
        question: |
          傾向スコア $e(z)=P(X=1\mid Z=z)$ を老朽度ごとの採用割合で推定し、逆確率重み付け（IPW）推定量
          $$\hat E[Y^{(1)}]=\frac{1}{N}\sum_{X_i=1}\frac{Y_i}{e(Z_i)},\qquad \hat E[Y^{(0)}]=\frac{1}{N}\sum_{X_i=0}\frac{Y_i}{1-e(Z_i)}$$
          で平均因果効果 $E[Y^{(1)}]-E[Y^{(0)}]$ を推定する。最も近い値はどれか。
        choices:
          - "$«naive»$"
          - "$«ace»$"
          - "$«swap»$"
          - "$«att»$"
          - "$«unw»$"
        answer: 1
        distractors:
          - 重み付けせず新方式と従来方式の事故率を単純に比べた
          - 正解
          - 重みを逆にして処置群を 1/(1−e)、対照群を 1/e で重み付けした
          - 処置群の老朽度の分布で標準化した（処置群での平均効果 ATT）
          - 層ごとの差を設備数で重み付けせず単純平均した
        explanation: |
          **方針** 傾向スコアの逆数で重み付けすると、各層の処置群・対照群がそれぞれ全体の老朽度の分布を代表するように膨らませられ、交絡が除かれる。

          **途中式** 傾向スコアは $e(1)=«n11»/«N1»=«e1»$、$e(0)=«n01»/«N0»=«e0»$。
          $$\hat E[Y^{(1)}]=\frac{1}{«N»}\left(\frac{«y11»}{«e1»}+\frac{«y01»}{«e0»}\right)=\frac{«w11»+«w01»}{«N»}=\frac{«s1»}{«N»}=«E1»$$
          $$\hat E[Y^{(0)}]=\frac{1}{«N»}\left(\frac{«y10»}{«q1»}+\frac{«y00»}{«q0»}\right)=\frac{«w10»+«w00»}{«N»}=\frac{«s0»}{«N»}=«E0»$$
          $$\text{平均因果効果}=«E1»-«E0»=«ace»$$

          **答え** $«ace»$

          **間違えやすい点** 単純比較は $«nv1»-«nv0»=«naive»$ で、新方式が新しい設備に偏って採用された分だけ効果を過大に見せる。
          IPW は、層ごとの事故率（老朽：$«r11»$ と $«r10»$、新しい：$«r01»$ と $«r00»$）を全体の老朽度の分布 $P(Z=1)=«pz1»$、$P(Z=0)=«pz0»$ で平均する標準化（バックドア調整）と同じ値になる：$(«r11»-«r10»)\times«pz1»+(«r01»-«r00»)\times«pz0»=«ace»$。
          処置群の分布で重み付けると処置群での効果（ATT）$«att»$ になり、問われている全体の平均因果効果とは異なる。
