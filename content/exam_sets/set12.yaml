        type: choice
        question: |
          残差の正規性を調べるため、«n» 個の標準化残差を小さい順に並べ、$i$ 番目の値を横軸の理論分位点 $\Phi^{-1}\!\left(\dfrac{i-0.5}{n}\right)$ に対して描く正規 QQ プロットを作り、基準の直線 $y=x$ と比べる。
          標準化残差の最小値は $«rmin»$、最大値は $«rmax»$ だった。最大の点の理論分位点と、両端の点から読み取れることの組として正しいものはどれか。
          必要なら $\Phi^{-1}(0.909)=«q909»$、$\Phi^{-1}(0.95)=«q95»$ を使え。
        choices:
          - «q95»、右の裾が正規分布より重い（右に歪んでいる）
          - 0.950、右の裾が正規分布より重い（右に歪んでいる）
          - «q909»、右の裾が正規分布より重い（右に歪んでいる）
          - «q95»、左の裾が正規分布より重い（左に歪んでいる）
          - «q95»、両方の裾が正規分布より重い
        answer: 0
        distractors:
          - 正解
          - 累積確率 (i-0.5)/n そのものを分位点と取り違えた
          - 描点位置を i/(n+1) とした
          - 最大の点が直線より上にあることを、右の裾が軽いと読み違えた
          - 最小の点も直線から外側に外れていると思い込んだ
        explanation: |
          **方針** 両端の点の描点位置（累積確率）を計算して理論分位点に直し、点 (理論分位点, 標準化残差) が直線 $y=x$ の外側（裾の側）にあるか内側にあるかを見る。

          **途中式** 最大の点は $i=«n»$ で $\dfrac{«n»-0.5}{«n»}=0.95$、理論分位点は $\Phi^{-1}(0.95)=«q95»$。最小の点は $i=1$ で $0.05$、対称性から $-«q95»$。
          - 最大の点 $(«q95»,\ «rmax»)$：$«rmax»>«q95»$ で直線より上（外側）→ 右の裾は正規分布より長い（重い）。
          - 最小の点 $(-«q95»,\ «rmin»)$：$«rmin»>-«q95»$ で直線より上（内側）→ 左の裾は正規分布より短い（軽い）。

          右の裾だけが重いので、誤差の分布は右に歪んでいると読める。

          **答え** «q95»、右の裾が正規分布より重い（右に歪んでいる）

          **間違えやすい点** 描点位置には $(i-0.5)/n$、$i/(n+1)$ などいくつかの流儀があるので、問題文の指定に従う（$i/(n+1)=0.909$ なら $«q909»$）。$i/n$ を使うと最大の点が $\Phi^{-1}(1)=\infty$ になって描けない。
          直線より上か下かだけでなく、裾の側（外側）に外れているかで読む。右端では上に外れると裾が重く、左端では下に外れると裾が重い。両端とも外側に外れていれば両裾が重い（尖った）分布、片側だけなら歪んだ分布を示す。

  - id: s12p10
    title: ライン別の異物件数のポアソン回帰
    context: |
      ある食品工場の 4 本のラインで 1 か月の異物混入件数 $y_i$ を数え、ライン速度を説明変数とするポアソン回帰（対数リンク、切片と傾きの 2 パラメータ）を当てはめた。観測件数と当てはめ値 $\hat\mu_i$（小数第 2 位まで）は次のとおりだった。

      | ライン | 1 | 2 | 3 | 4 |
      |---|---|---|---|---|
      | ライン速度 $x_i$ | 1 | 2 | 3 | 4 |
      | 観測 $y_i$ | «y1» | «y2» | «y3» | «y4» |
      | 当てはめ値 $\hat\mu_i$ | «mu1» | «mu2» | «mu3» | «mu4» |
    items:
      - id: s12p10a
        chapter: 18
        terms: [deviance, poisson-regression, generalized-linear-model]
        topic: ポアソン回帰の観測件数と当てはめ値から飽和モデルとの対数尤度の差として逸脱度を計算する
        level: 標準
        definition: false
        type: choice
        question: |
          このモデルの逸脱度（飽和モデルとの対数尤度の差の 2 倍）$D$ に最も近いものはどれか。必要なら次の値を使え。

          | | $\ln(3/3.81)$ | $\ln(7/5.00)$ | $\ln(5/6.57)$ | $\ln(9/8.62)$ |
          |---|---|---|---|---|
          | 値 | «l1» | «l2» | «l3» | «l4» |
        choices:
          - '$«neg»$'
          - '$«half»$'
          - '$«pear»$'
          - '$«noy»$'
          - '$«D»$'
        answer: 4
        distractors:
          - 対数の中の y と μ の比を逆にした（符号が逆になる）
          - 2 倍し忘れた
          - 逸脱度ではなくピアソンのカイ二乗統計量 Σ(y-μ)^2/μ を求めた
          - 各項に観測件数 y を掛け忘れ、2Σln(y/μ) とした
          - 正解
        explanation: |
          **方針** ポアソン分布の対数尤度は $\sum\{y_i\ln\mu_i-\mu_i-\ln y_i!\}$。飽和モデル（$\mu_i=y_i$）との差の 2 倍は
          $D=2\sum\left\{y_i\ln\dfrac{y_i}{\hat\mu_i}-(y_i-\hat\mu_i)\right\}$。切片を含む対数リンクのポアソン回帰では $\sum(y_i-\hat\mu_i)=0$ なので第 2 項は消える（実際 $3+7+5+9=24$、$\sum\hat\mu_i=«musum»$）。

          **途中式**
          $$\sum y_i\ln\frac{y_i}{\hat\mu_i}=3\times(«l1»)+7\times«l2»+5\times(«l3»)+9\times«l4»$$
          $$=(«tt1»)+«tt2»+(«tt3»)+«tt4»=«sumt»$$
          $$D=2\times«sumt»=«D4»\cdots$$

          **答え** $«D»$（残差自由度 $4-2=2$ のカイ二乗分布の上側 5% 点 «chi2» よりずっと小さく、当てはまりは悪くない）

          **間違えやすい点** 逸脱度は対数尤度の差の **2 倍**。ピアソンのカイ二乗統計量 $\sum(y_i-\hat\mu_i)^2/\hat\mu_i=«pear»$ は近い値になるが別の量である。
          逸脱度はつねに 0 以上で、比を逆にしたり、各項に観測件数 $y_i$ を掛け忘れたり（$2\sum\ln(y_i/\hat\mu_i)=«noy»$）して負の値になったら計算の誤り。

  - id: s12p11
    title: 発酵温度と酵母の分割区実験
    context: |
      ある酒造会社が、発酵温度（因子 A：3 水準）と酵母（因子 B：2 種）の効果を調べた。温度はタンク単位でしか設定できないので、4 日（ブロック）それぞれで 3 基のタンクに温度を無作為に割り付け（主区）、
      各タンクを 2 区画に分けて酵母を無作為に割り付けた（細区）。この分割区法の分散分析で、次の平均平方を得た。

      | 要因 | ブロック | A | 主区の誤差（ブロック×A） | B | A×B | 細区の誤差 |
      |---|---|---|---|---|---|---|
      | 自由度 | 3 | 2 | 6 | 1 | 2 | 9 |
      | 平均平方 | «msblk» | «msA» | «msE1» | «msB» | «msAB» | «msE2» |
    items:
      - id: s12p11a
        chapter: 20
        terms: [split-plot-design, randomized-block-design, expected-mean-square]
        topic: 分割区法で主区因子の発酵温度を主区の誤差で割ってF値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          発酵温度（因子 A）の効果を検定する $F$ 値として正しいものはどれか。
        choices:
          - '$«F_pool»$'
          - '$«F_ab»$'
          - '$«F_B»$'
          - '$«F»$'
          - '$«F_e2»$'
        answer: 3
        distractors:
          - 2 つの誤差の平均平方を足して分母にした
          - 交互作用 A×B の平均平方を分母にした
          - 細区因子 B の F 値（細区の誤差で割る）と取り違えた
          - 正解
          - 主区因子なのに細区の誤差で割った
        explanation: |
          **方針** 分割区法には 2 種類の誤差がある。主区因子 A はタンクごとに割り付けたので、そのばらつきはタンク間の誤差（主区の誤差）と比べる。細区因子 B と A×B は、タンク内の誤差（細区の誤差）と比べる。

          **途中式**
          $$F_A=\frac{MS_A}{MS_{\text{主区誤差}}}=\frac{«msA»}{«msE1»}=«F»$$
          自由度は $(2,6)$ で、上側 5% 点 «Fcrit» を超えるので温度の効果は有意。

          **答え** $«F»$

          **間違えやすい点** 主区因子を細区の誤差（小さい）で割ると $«F_e2»$ と大きく出すぎ、効果を過大に評価する。主区の誤差の期待平均平方には、タンク間の変動が含まれるため。
          分割区法は設定が難しい因子をまとめて扱える代わりに、主区因子の検出力が低くなる。

  - id: s12p12
    title: 缶詰製品の抜取調査と保存試験
    context: |
      ある缶詰工場で、製造順に並んだ製品の品質調査と、賞味期限を決めるための保存試験を行った。
    items:
      - id: s12p12a
        chapter: 21
        terms: [systematic-sampling, simple-random-sampling]
        topic: 製造順に傾向がある12缶から3缶おきの系統抽出をしたときの標本平均の分散を3通りの開始点から求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある日の 12 缶について、製造順に内容量の表示値からのずれ（g）を並べると次のとおりだった（後の缶ほどずれが大きい傾向がある）。

          $$«ys»$$

          最初の 3 缶から 1 つを無作為に選び、そこから 3 缶おきに 4 缶を選ぶ系統抽出を行う。3 通りの開始点が等確率で選ばれるとき、標本平均の分散（3 通りの標本平均の、母平均まわりの平均 2 乗）はどれか。
        choices:
          - '$«v_k1»$'
          - '$«vsys»$'
          - '$«sumsq3»$'
          - '$«vsrs»$'
          - '$«v_nofpc»$'
        answer: 1
        distractors:
          - 3 通りの平均 2 乗で、3 ではなく 2（k-1）で割った
          - 正解
          - 偏差の 2 乗の和を 3 で割り忘れた
          - 単純無作為抽出（4 缶）の標本平均の分散を答えた
          - 単純無作為抽出の分散で有限母集団修正を付け忘れた
        explanation: |
          **方針** 系統抽出の標本は開始点で決まり、3 通りしかない。それぞれの標本平均を求め、母平均からの偏差の 2 乗を確率 1/3 で平均する。

          **途中式** 開始点 1：3, 5, 7, 9、開始点 2：4, 6, 8, 10、開始点 3：4, 6, 8, 10 で、標本平均は «m1»、«m2»、«m3»。母平均は $80/12=20/3\approx«mu»$。
          偏差は分数のまま $-2/3,\ 1/3,\ 1/3$ として
          $$V=\frac13\left\{\left(-\frac23\right)^2+\left(\frac13\right)^2+\left(\frac13\right)^2\right\}=\frac13\times\frac69=«vsys»$$

          **答え** $«vsys»$

          **間違えやすい点** 単純無作為抽出で 4 缶選ぶ場合の分散は $(1-4/12)S^2/4=«vsrs»$（$S^2=«S2»$）。製造順に単調な傾向があると、系統抽出の標本は前半と後半をまんべんなく含むので、単純無作為抽出よりずっと精度がよい。
          逆に、ずれが 3 缶周期で変動する（例えば 3 ノズルの充填機）ときは、同じノズルの缶ばかり選ばれて精度が大きく落ちる。

      - id: s12p12b
        chapter: 29
        terms: [nelson-aalen-estimator, censored-data, kaplan-meier-estimator]
        topic: 打ち切りを含む保存試験で異常が出るまでの日数から20日時点のネルソン・エーレン累積ハザードを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          8 缶を高温で保存し、膨張などの異常が出るまでの日数を記録した（「+」は異常が出ないまま試験から外した打ち切り）。

          $$10,\ 12^+,\ 15,\ 15,\ 18^+,\ 20,\ 25^+,\ 30$$

          20 日時点の累積ハザードのネルソン・エーレン推定値 $\hat H(20)=\sum_{t_j\le20}d_j/n_j$ を求めよ（$d_j$ は時刻 $t_j$ の異常数、$n_j$ はその直前のリスク集合の大きさ）。
        answer: «H»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 異常が起きた時刻ごとに、その直前にまだ異常がなく試験中だった缶の数 $n_j$ と異常数 $d_j$ を数え、$d_j/n_j$ を足す。打ち切られた缶は、打ち切り時刻より後のリスク集合から除く。

          **途中式**
          - $t=10$：$n=8$、$d=1$ → $1/8$
          - $t=15$：10 日の異常と 12 日の打ち切りで 2 缶減り $n=6$、$d=2$ → $2/6$
          - $t=20$：15 日の 2 缶と 18 日の打ち切りで 3 缶減り $n=3$、$d=1$ → $1/3$

          $$\hat H(20)=\frac18+\frac26+\frac13=\frac{3+8+8}{24}=\frac{19}{24}=«H4»\cdots$$

          **答え** $«H_s»$

          **間違えやすい点** 打ち切りの缶も、打ち切られるまではリスク集合に入る（12 日に打ち切った缶は 10 日のリスク集合には入るが、15 日のリスク集合には入らない）。
          打ち切りを異常と同じに扱ったり、リスク集合から最初から除いたりすると、累積ハザードを誤る。$\exp\{-\hat H(t)\}$ は生存関数の推定値になり、カプラン・マイヤー推定値に近い値になる。

  - id: s12p13
    title: コーヒーの官能評価の多変量解析
    context: |
      あるロースターが、焙煎したコーヒー豆の官能特性を専門パネルで評価し、多変量解析を行った。
    items:
      - id: s12p13a
        chapter: 22
        terms: [kaiser-criterion, pca-on-correlation-matrix, cumulative-contribution-ratio]
        topic: 相関行列の固有値の和が変数の数に等しいことから残りの固有値を求めカイザー基準で主成分数と累積寄与率を決める
        level: 標準
        definition: false
        type: choice
        question: |
          苦味・酸味・甘味・コク・香りの «p» 項目の評点の相関行列で主成分分析を行った。固有値のうち大きいほうから 4 つは «e1»、«e2»、«e3»、«e4» だった（5 つ目は示されていない）。
          カイザー基準（固有値が 1 を超える主成分を採用）で採用する主成分の数と、その累積寄与率の組として正しいものはどれか。
        choices:
          - '2 個、«cum_w» %'
          - '1 個、«cum1» %'
          - '3 個、«cum3» %'
          - '4 個、«cum4» %'
          - '2 個、«cum2» %'
        answer: 4
        distractors:
          - 累積寄与率の分母に示された 4 つの固有値の和 4.8 を使った
          - 固有値が 2 を超えるものだけを採用した
          - 固有値が 0.7 以上のものまで採用した
          - 示された固有値をすべて採用した
          - 正解
        explanation: |
          **方針** 相関行列の対角成分はすべて 1 なので、固有値の和（トレース）は変数の数 «p» に等しい。これで 5 つ目の固有値と寄与率の分母が決まる。

          **途中式** 5 つ目の固有値は $«p»-«sum4»=«e5»$。固有値が 1 を超えるのは «e1» と «e2» の 2 つ。
          $$\text{累積寄与率}=\frac{«e1»+«e2»}{«p»}=\frac{«top2»}{«p»}=«cum2»\%$$

          **答え** 2 個、«cum2» %

          **間違えやすい点** 寄与率の分母は固有値の総和（相関行列なら変数の数）。示された 4 つの和で割ると $«cum_w»\%$ と大きく出る。
          カイザー基準は「1 変数分（固有値 1）以上の情報をもつ主成分を残す」という目安で、分散共分散行列の主成分分析にはそのまま使えない。

      - id: s12p13b
        chapter: 25
        terms: [factor-analysis-model, communality, common-factor-unique-factor]
        topic: 3変数の1因子モデルで3つの相関係数から因子負荷量を決め独自分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          甘味 $x_1$・コク $x_2$・香り $x_3$ の標準化した評点に、1 因子モデル $x_j=\lambda_jf+e_j$（$V[f]=1$、$e_j$ は互いに独立で $f$ とも独立、$\lambda_j>0$）を当てはめる。
          相関係数が $r_{12}=«r12»$、$r_{13}=«r13»$、$r_{23}=«r23»$ のとき、モデルが相関をちょうど再現するように負荷量を決める。甘味 $x_1$ の独自分散 $\psi_1$ はどれか。
        choices:
          - '$«psi»$'
          - '$«w_l»$'
          - '$«w_r»$'
          - '$«l1sq»$'
          - '$«w_nodiv»$'
        answer: 0
        distractors:
          - 正解
          - 1 から負荷量の 2 乗ではなく負荷量そのものを引いた
          - 1 から相関係数 r12 を引いた
          - 独自分散ではなく共通性を答えた
          - λ1^2 を r12×r13 とし、r23 で割り忘れた
        explanation: |
          **方針** 1 因子モデルでは $r_{jk}=\lambda_j\lambda_k$（$j\ne k$）。3 つの式から $\lambda_1^2=\dfrac{r_{12}r_{13}}{r_{23}}$ が得られる。標準化しているので $\psi_1=1-\lambda_1^2$。

          **途中式**
          $$\lambda_1^2=\frac{\lambda_1\lambda_2\cdot\lambda_1\lambda_3}{\lambda_2\lambda_3}=\frac{«r12»\times«r13»}{«r23»}=\frac{«prod»}{«r23»}=«l1sq»\qquad(\lambda_1=«l1»)$$
          $$\psi_1=1-«l1sq»=«psi»$$

          **答え** $«psi»$

          **間違えやすい点** 共通性 $\lambda_1^2=«l1sq»$ と独自分散 $1-\lambda_1^2$ を取り違えない。
          3 変数の 1 因子モデルは相関 3 つに対してパラメータ（負荷量）も 3 つなので、ちょうど決まる（自由度 0）。$r_{12}r_{13}/r_{23}>1$ になると独自分散が負になる不適解（ヘイウッドケース）が起こる。

      - id: s12p13c
        chapter: 26
        terms: [independent-component-analysis, principal-component-analysis]
        topic: 複数の香りセンサーの混合信号を分離する独立成分分析で成分の順序と尺度が決まらないことなど性質を見分ける
        level: 基本
        definition: true
        type: choice
        question: |
          焙煎中の香りを 3 つのガスセンサーで測り、それぞれの出力が 3 種類の香気成分の発生量（互いに独立な信号）の線形な混合であるとみなして、独立成分分析で元の信号を取り出したい。
          独立成分分析についての記述として正しいものはどれか。
        choices:
          - 取り出した独立成分の並ぶ順序と尺度（符号を含む）は、データからは一意に決まらない。
          - 観測信号を互いに無相関な成分に分解する方法なので、主成分分析と同じ解を与える。
          - 元の信号がすべて正規分布に従うときに、最もよく分離できる。
          - 取り出した成分は分散の大きい順に並ぶので、寄与率を見て使う成分の数を決める。
          - センサーの数より多くの元の信号を、常に一意に取り出すことができる。
        answer: 0
        distractors:
          - 正解
          - 無相関（2次の情報）だけでは回転の不定性が残り、ICAは独立性（高次の情報）を使うので主成分分析とは異なる
          - 正規分布は回転しても独立なままなので、正規な成分が2つ以上あると分離できない
          - ICAの成分には分散による自然な順序がない（尺度が決まらない）
          - 観測より多い信号は、一般には線形の逆変換で取り出せない
        explanation: |
          **方針** 独立成分分析（ICA）は、観測 $\boldsymbol x=A\boldsymbol s$ から、互いに独立な信号 $\boldsymbol s$ と混合行列 $A$ を推定する。どんな情報を使い、何が決まらないかを確かめる。

          **途中式** $A\boldsymbol s=(AD^{-1}P^{-1})(PD\boldsymbol s)$ のように、置換行列 $P$ と対角行列 $D$ をはさんでも観測は変わらない。したがって
          - 成分の順序と尺度（符号を含む）はデータから決まらない（これは正しい記述）。
          - 無相関にするだけ（主成分分析・白色化）では、まだ任意の回転が残る。ICA はこの回転を「非正規性（独立性）」を最大にするように決めるので、主成分分析とは別の解になる。
          - 正規分布に従う独立な信号は回転しても独立なままなので、正規な成分が 2 つ以上あると分離できない（正規でないことが分離の手がかり）。
          - 尺度が決まらないので、分散の大きさで順序づけることもできない。
          - 観測より多くの信号は、一般には線形の逆変換で一意に取り出せない。

          **答え** 独立成分の並ぶ順序と尺度（符号を含む）は、データからは一意に決まらない

          **間違えやすい点** 主成分分析は分散（2 次の情報）を使い、成分を分散の大きい順に並べる。ICA は独立性（尖度などの高次の情報）を使い、順序や大きさには意味がない。

  - id: s12p14
    title: 食中毒の調査と殺菌工程の評価
    context: |
      ある食品会社の品質保証部門が、食中毒の原因調査と、新しい殺菌工程の効果の評価を行った。
    items:
      - id: s12p14a
        chapter: 28
        terms: [cohort-and-case-control-study, odds-ratio-interval, two-by-two-table]
        topic: 食中毒の症例対照研究の2×2表から原因と疑われる料理のばく露オッズ比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある宴会のあと食中毒が発生した。発症した «ncase» 人（症例）と、同じ宴会の出席者で発症しなかった人から無作為に選んだ «nctrl» 人（対照）に、生がきを食べたかを尋ねた。

          | | 食べた | 食べなかった |
          |---|---|---|
          | 症例 | «a» | «b» |
          | 対照 | «c» | «d» |

          生がきを食べたことのオッズ比（症例の食べたオッズ ÷ 対照の食べたオッズ）を求めよ。
        answer: «OR»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 症例対照研究では、症例と対照の人数を研究者が決めるので、発症率（リスク）は推定できない。推定できるのは、症例と対照のそれぞれでの「ばく露のオッズ」の比である。

          **途中式**
          $$\text{OR}=\frac{«a»/«b»}{«c»/«d»}=\frac{«a»\times«d»}{«b»\times«c»}=\frac{«ad»}{«bc»}=«OR4»\cdots$$

          **答え** $«OR_s»$

          **間違えやすい点** 表の列ごとに「食べた人の中の症例の割合 ÷ 食べなかった人の中の症例の割合」を作ると $«RRw»$ になるが、対照の人数を変えるとこの値も変わるので意味がない。
          ばく露オッズ比は、疾病オッズ比（コホート研究のオッズ比）と等しい（オッズ比の対称性）。発症がまれなら相対危険の近似にもなる。

      - id: s12p14b
        chapter: 33
        terms: [frontdoor-criterion, causal-effect, backdoor-criterion]
        topic: 未観測の原料汚染が交絡するロットの集計表から条件付き確率を作り残存菌の検出を中間変数にしたフロントドア調整で新殺菌工程だけにしたときの腐敗確率を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          複数の工場で製造された «Ntot» ロットの記録から、殺菌工程 $X$（新 1、旧 0）と製品の腐敗 $Y$（あり 1、なし 0）の関係を調べる。工程の選択と腐敗の両方に影響する原料の汚染度 $U$ は記録されていない。
          そこで、出荷前検査での残存菌の検出 $M$（検出 1、なし 0）を通る経路 $X\to M\to Y$ に注目する。次を仮定する：$X$ は $M$ を通してのみ $Y$ に影響する、$U$ は $X$ と $Y$ に影響するが $M$ には直接影響しない、$X$ と $M$ の間・$M$ と $Y$ の間にほかの交絡はない。
          記録を集計すると次のとおりだった。

          | 殺菌工程 $X$ | 残存菌 $M$ | ロット数 | うち腐敗あり |
          |---|---|---|---|
          | 新（1） | 検出（1） | «n11» | «k11» |
          | 新（1） | なし（0） | «n01» | «k01» |
          | 旧（0） | 検出（1） | «n10» | «k10» |
          | 旧（0） | なし（0） | «n00» | «k00» |

          すべてのロットを新工程で殺菌したときの腐敗の確率 $P(Y=1\mid do(X=1))$ を、フロントドア基準による調整で求めよ。
        answer: «do1v»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** フロントドア調整の式
          $$P(Y=1\mid do(X=x))=\sum_m P(M=m\mid X=x)\sum_{x'}P(Y=1\mid M=m,X=x')P(X=x')$$
          を使う。外側は「$X$ が $M$ に与える効果」（交絡なし）、内側は「$M$ が $Y$ に与える効果」を $X$ でバックドア調整したもの。

          **途中式** 表から $P(X=1)=«nx1»/«Ntot»=«px1»$、$P(M=1\mid X=1)=«n11»/«nx1»=«pm1»$、$P(M=1\mid X=0)=«n10»/«nx0»=«pm0»$、
          $P(Y=1\mid M=1,X=1)=«k11»/«n11»=«y11»$、$P(Y=1\mid M=1,X=0)=«k10»/«n10»=«y10»$、$P(Y=1\mid M=0,X=1)=«k01»/«n01»=«y01»$、$P(Y=1\mid M=0,X=0)=«k00»/«n00»=«y00»$。

          内側の和：
          $$m=1:\ «y11»\times«px1»+«y10»\times«px0»=«t11»+«t10»=«in1»,\qquad m=0:\ «y01»\times«px1»+«y00»\times«px0»=«t01»+«t00»=«in0»$$
          外側の和：
          $$P(Y=1\mid do(X=1))=«pm1»\times«in1»+«pm1c»\times«in0»=«do1»$$

          **答え** $«do1s»$

          **間違えやすい点** 観測された $P(Y=1\mid X=1)=«pm1»\times«y11»+«pm1c»\times«y01»=«obs1»$ は、汚染度の高い原料ほど新工程で殺菌されていたという交絡を含むので、すべてのロットを新工程にしたときの腐敗率より高く出る。
          同じ式で $P(Y=1\mid do(X=0))=«pm0»\times«in1»+«pm0c»\times«in0»=«do0»$ も求められ、平均因果効果は $«do1»-«do0»=«ace4»$ となる（観測の差 $«naive»$ より効果が大きい）。
          内側の和で $P(Y=1\mid M=m,X=x)$ を $x$ を固定したまま使うのは誤り。$M\to Y$ の関係には $M\leftarrow X\leftarrow U\to Y$ というバックドア経路があるので、$X$ の周辺分布 $P(X=x')$ で平均して調整する。
