        topic: 2工場で層別した腐敗の2×2表からマンテル・ヘンツェルの共通オッズ比を求める
        level: 標準
        definition: false
        type: choice
        question: |
          2 つの工場で、出荷した製品から無作為に選んだものの腐敗の有無を調べた。

          | 工場 | 工程 | 腐敗あり | 腐敗なし |
          |---|---|---|---|
          | A | 新 | «Aa» | «Ab» |
          | A | 旧 | «Ac» | «Ad» |
          | B | 新 | «Ba» | «Bb» |
          | B | 旧 | «Bc» | «Bd» |

          工場で層別した、新工程の旧工程に対する腐敗のオッズ比（新／旧）のマンテル・ヘンツェル推定値に最も近いものはどれか。
        choices:
          - '$«crude»$'
          - '$«mh»$'
          - '$«noN»$'
          - '$«mean»$'
          - '$«inv»$'
        answer: 1
        distractors:
          - 工場を無視して2つの表を合算したオッズ比を求めた
          - 正解
          - 各層の積を層の大きさ n_k で割らずに足した
          - 層ごとのオッズ比を単純平均した
          - オッズ比の向きを逆（旧／新）にした
        explanation: |
          **方針** 各層 $k$ の表を $\begin{pmatrix}a_k&b_k\\c_k&d_k\end{pmatrix}$（行：新・旧、列：腐敗あり・なし）、層の大きさを $n_k$ とすると、
          $\hat\psi_{MH}=\dfrac{\sum_k a_kd_k/n_k}{\sum_k b_kc_k/n_k}$。

          **途中式** $n_A=«An»$、$n_B=«Bn»$。
          $$\frac{a_Ad_A}{n_A}=\frac{«Aad»}{«An»}=«Aadn»,\quad \frac{b_Ac_A}{n_A}=\frac{«Abc»}{«An»}=«Abcn»,\quad \frac{a_Bd_B}{n_B}=\frac{«Bad»}{«Bn»}=«Badn»,\quad \frac{b_Bc_B}{n_B}=\frac{«Bbc»}{«Bn»}=«Bbcn»$$
          $$\hat\psi_{MH}=\frac{«Aadn»+«Badn»}{«Abcn»+«Bbcn»}=\frac{«numer»}{«denom»}=«mh»$$

          **答え** $«mh»$

          **間違えやすい点** 工場を無視して合算すると $\frac{«ta»\times«td»}{«tb»\times«tc»}=«crude»$ と、効果を大きく見積もってしまう。
          腐敗しにくい工場 A で新工程が多く使われているため、工場が交絡因子になっている。層ごとのオッズ比は A が $«orA»$、B が $«orB»$ で、MH 推定値はその重みつきの平均にあたる。単純平均（$«mean»$）とは違う。

      - id: s12p13b
        chapter: 33
        terms: [frontdoor-criterion, causal-effect, backdoor-criterion]
        topic: 未観測の交絡があるとき残存菌の検出を中間変数にしたフロントドア調整で工程の因果効果を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          多数の工場のデータでは、工程の選択と腐敗の両方に影響する原料の汚染度 $U$ が観測されていない。そこで、工程 $X$（新 1、旧 0）→ 出荷前検査での残存菌の検出 $M$（検出 1、なし 0）→ 腐敗 $Y$（あり 1、なし 0）という経路に注目する。
          次を仮定する：$X$ は $M$ を通してのみ $Y$ に影響する、$U$ は $X$ と $Y$ に影響するが $M$ には直接影響しない、$X\to M$ と $M\to Y$ の間にほかの交絡はない。
          観測データから次の確率が得られた。

          - $P(X=1)=«px1»$
          - $P(M=1\mid X=1)=«pm1»$、$P(M=1\mid X=0)=«pm0»$
          - $P(Y=1\mid M=1,X=1)=«y11»$、$P(Y=1\mid M=1,X=0)=«y10»$、$P(Y=1\mid M=0,X=1)=«y01»$、$P(Y=1\mid M=0,X=0)=«y00»$

          フロントドア基準による調整で、平均因果効果 $P(Y=1\mid do(X=1))-P(Y=1\mid do(X=0))$ を求めよ。
        answer: «ace»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。負の値は符号をつける。±0.001 の差まで正解とする。
        explanation: |
          **方針** フロントドア調整の式
          $$P(Y=1\mid do(X=x))=\sum_m P(M=m\mid X=x)\sum_{x'}P(Y=1\mid M=m,X=x')P(X=x')$$
          を使う。内側の和は「$M$ を固定したときの $M\to Y$ の効果」を、$X$ について（バックドア）調整したものである。

          **途中式** 内側の和：
          $$m=1:\ «y11»\times«px1»+«y10»\times«px0»=«t11»+«t10»=«in1»,\qquad m=0:\ «y01»\times«px1»+«y00»\times«px0»=«t01»+«t00»=«in0»$$
          外側の和：
          $$P(Y=1\mid do(X=1))=«pm1»\times«in1»+«pm1c»\times«in0»=«do1»$$
          $$P(Y=1\mid do(X=0))=«pm0»\times«in1»+«pm0c»\times«in0»=«do0»$$
          差は $«do1»-«do0»=«ace4»$。

          **答え** $«ace_s»$

          **間違えやすい点** 観測された条件付き確率の差 $P(Y=1\mid X=1)-P(Y=1\mid X=0)=«obs1»-«obs0»=«naive»$ は、汚染度の高い工場ほど新工程を導入していたという交絡で、効果を小さく見せている。
          内側の和で $P(Y=1\mid M=m,X=x)$ の $x$ を固定したまま使うのは誤りで、$X$ の周辺分布 $P(X=x')$ で平均する必要がある（$M\to Y$ の関係には $X\leftarrow U\to Y$ を通るバックドア経路があるため）。
