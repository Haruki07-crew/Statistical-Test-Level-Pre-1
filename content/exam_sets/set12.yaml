      - id: s12p09a
        chapter: 19
        terms: [spline-regression, polynomial-regression]
        topic: 折れ点のある1次スプライン回帰の係数から折れ点より先の温度での予測値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          焼成温度 «x» ℃ での曲げ強度の予測値はどれか。
        choices:
          - '$«p_all»$'
          - '$«p_b2only»$'
          - '$«pred»$'
          - '$«p_noplus»$'
          - '$«p_sign»$'
        answer: 2
        distractors:
          - (t-10)_+ ではなく t そのものに β2 を掛けた
          - 折れ点より先の傾きを β1+β2 ではなく β2 だけとした
          - 正解
          - 折れ点の項 (t-10)_+ を落とした
          - β2 の符号を逆に読んだ
        explanation: |
          **方針** 温度を $t$ に変換し、$(t-«knot»)_+$ を計算して代入する。折れ点より先では傾きが $\beta_1+\beta_2$ になる。

          **途中式** «x» ℃ は $t=(«x»-1100)/10=«t»$、$(t-«knot»)_+=«tk»$。
          $$\hat y=«b0»+«b1»\times«t»+(«b2»)\times«tk»=«b0»+«b1t»+(«b2t»)=«pred»$$

          **答え** $«pred»$ MPa

          **間違えやすい点** 1 次スプラインは折れ点で連続につながる折れ線で、«xk» ℃ より先の傾きは $«b1»+(«b2»)=«slope2»$（10 ℃ あたり）。「強度は «xk» ℃ まで上がり、その先はわずかに下がる」と読める。
          $(t-«knot»)_+$ は $t\le«knot»$ では 0 なので、折れ点より手前の予測には $\beta_2$ は効かない。

      - id: s12p09b
        chapter: 16
        terms: [hat-matrix, leverage, least-squares-method]
        topic: ハット行列の対角和がパラメータ数に等しいことから残る1点のてこ比を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          このモデル（切片を含めてパラメータ 3 個）のハット行列 $H=X(X^\top X)^{-1}X^\top$ の対角成分（てこ比）$h_{ii}$ のうち、1300 ℃ の試験片以外の 9 個の和は «hsum9» だった。
          1300 ℃ の試験片のてこ比を求めよ。
        answer: «h10»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** $H$ はべき等な射影行列なので、対角和（トレース）は階数に等しく、パラメータ数 $p=3$ になる：
          $\mathrm{tr}\,H=\mathrm{tr}\{(X^\top X)^{-1}X^\top X\}=\mathrm{tr}\,I_3=3$。

          **途中式**
          $$h=3-«hsum9»=«h10_s»$$

          **答え** $«h10_s»$

          **間違えやすい点** てこ比の和はデータ数ではなくパラメータ数（切片を含む）。平均は $p/n=0.3$ で、目安 $2p/n=«thr»$ を超えるこの点は、端にあって当てはめに強く影響する点である。
          折れ点より先のデータが少ないと、その区間の点のてこ比が大きくなりやすい。

