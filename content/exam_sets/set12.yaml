      - id: s12p09b
        chapter: 16
        terms: [hat-matrix, leverage, least-squares-method]
        topic: ハット行列のトレースがパラメータ数に等しいことから端の1点のてこ比を求め残差の分散σ²(1−h)の推定値の平方根を出す
        level: 基本
        definition: false
        type: numeric
        question: |
          このモデル（切片を含めてパラメータ 3 個）のハット行列 $H=X(X^\top X)^{-1}X^\top$ の対角成分（てこ比）$h_{ii}$ のうち、1300 ℃ の試験片以外の 9 個の和は «hsum9» だった。また、残差平方和は «rss» だった。
          誤差分散 $\sigma^2$ をその不偏推定量 $s^2$ で推定するとき、1300 ℃ の試験片の残差 $e_i=y_i-\hat y_i$ の標準偏差の推定値 $s\sqrt{1-h_{ii}}$ を求めよ。
        answer: «sde»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 残差ベクトルは $\boldsymbol e=(I-H)\boldsymbol y$ で、$V[\boldsymbol e]=\sigma^2(I-H)$ なので $V[e_i]=\sigma^2(1-h_{ii})$。
          $H$ はべき等な射影行列なので、対角和（トレース）は階数に等しく、パラメータ数 $p=3$ になる：
          $\mathrm{tr}\,H=\mathrm{tr}\{(X^\top X)^{-1}X^\top X\}=\mathrm{tr}\,I_3=3$。

          **途中式**
          $$h_{ii}=3-«hsum9»=«h10_s»,\qquad s^2=\frac{«rss»}{n-p}=\frac{«rss»}{«n»-«p»}=«s2»$$
          $$s\sqrt{1-h_{ii}}=\sqrt{«s2»\times«omh»}=\sqrt{«v_e»}=«sde4»$$

          **答え** $«sde»$

          **間違えやすい点** てこ比の和はデータ数ではなくパラメータ数（切片を含む）。$s^2$ の分母は残差の自由度 $n-p=«dfr»$（$n-1$ で割ると $«sde_n1»$）。
          $1-h_{ii}$ ではなく $h_{ii}$ を掛けると $«sde_h»$（これは当てはめ値 $\hat y_i$ の標準偏差の推定値）。
          てこ比の大きい点ほど回帰直線が引き寄せられ、残差のばらつきが小さくなる。この点のてこ比 «h10_s» は目安 $2p/n=«thr»$ を超えており、残差を比べるときは $s\sqrt{1-h_{ii}}$ で割って標準化する必要がある。

