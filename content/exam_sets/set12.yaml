      | | $\chi^2_{11}(0.025)$ | $\chi^2_{11}(0.975)$ | $\chi^2_{12}(0.025)$ | $\chi^2_{12}(0.975)$ | $\chi^2_{2}(0.05)$ |
      |---|---|---|---|---|---|
      | 値 | «c11u» | «c11l» | «c12u» | «c12l» | «chi2» |
