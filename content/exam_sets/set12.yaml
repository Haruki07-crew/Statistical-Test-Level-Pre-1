      - id: s12p06a
        chapter: 9
        terms: [ci-mean-unknown-variance, pivotal-quantity, t-distribution]
        topic: 充填量の標本平均と不偏分散から次に充填する1本の充填量の95%予測区間の半幅をt分布で求める
        level: 基本
        definition: false
        type: choice
        question: |
          ライン A の 12 本の標本標準偏差は $s=\sqrt{«s2a»}=«s»$ だった。同じラインで次に充填する 1 本の充填量 $X_{\text{new}}$ の 95% 予測区間 $\bar x\pm h$ の半幅 $h$ はどれか。
          必要なら $t_{11}(0.025)=«t11»$（自由度 11 の $t$ 分布の上側 2.5% 点）、$\sqrt{13/12}=«sq1312»$、$\sqrt{12}=«sq12»$ を使え。
        choices:
          - '$«piv»$'
          - '$«ci»$'
          - '$«piz»$'
          - '$«pi»$'
          - '$«pinos»$'
        answer: 3
        distractors:
          - 標準偏差の代わりに分散 0.0484 を使った
          - 予測区間ではなく母平均の信頼区間の半幅を求めた
          - t 分布の点の代わりに正規分布の 1.96 を使った
          - 正解
          - √(1+1/n) を掛け忘れた（平均の推定誤差を無視した）
        explanation: |
          **方針** $X_{\text{new}}-\bar X$ は平均 0、分散 $\sigma^2(1+1/n)$ の正規分布に従い、$\bar X$ と $s$ は独立なので
          $\dfrac{X_{\text{new}}-\bar X}{s\sqrt{1+1/n}}$ は自由度 $n-1$ の $t$ 分布に従う（ピボット）。

          **途中式**
          $$h=t_{11}(0.025)\times s\sqrt{1+\frac1{12}}=«t11»\times«s»\times«sq1312»=«pi4»$$

          **答え** $«pi»$

          **間違えやすい点** 母平均の信頼区間の半幅は $t\,s/\sqrt n=«ts»/«sq12»\approx«ci»$ で、$n$ を増やせば 0 に近づく。予測区間は新しい 1 本そのもののばらつき $\sigma^2$ を含むので、$n$ を増やしても $t\,s$ 程度より狭くならない。
          $\sigma$ が未知で $s$ を使うので、正規分布の 1.96 ではなく $t$ 分布の点を使う。

      - id: s12p06b
        chapter: 11
        terms: [bartlett-test, chi-square-test-variance, pooled-variance]
        topic: 3本の充填ラインの不偏分散からバートレット検定の統計量を対数の値を使って求める
        level: 応用
        definition: false
        type: numeric
        question: |
          3 本のラインの母分散が等しいかをバートレット検定で調べる。各ラインの自由度を $\nu_i=n_i-1$、$\nu=\sum\nu_i$、プールした分散を $s_p^2=\sum\nu_is_i^2/\nu$ として、検定統計量
          $$B=\frac{\nu\ln s_p^2-\sum_i\nu_i\ln s_i^2}{C},\qquad C=1+\frac{1}{3(k-1)}\left(\sum_i\frac{1}{\nu_i}-\frac1\nu\right)$$
          は帰無仮説のもとで近似的に自由度 $k-1$ のカイ二乗分布に従う（$k$ はライン数）。$B$ の値を求めよ。
          必要なら次の値を使え：$\ln «sp2»=«lnp»$、$\ln«s2a»=«lna»$、$\ln«s2b»=«lnb»$、$\ln«s2c»=«lnc»$。
        answer: «B»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 各ラインの自由度はどれも 11 で等しいので、$s_p^2$ は 3 つの不偏分散の単純平均になる。分子と補正項 $C$ を別々に計算する。

          **途中式** $s_p^2=(«s2a»+«s2b»+«s2c»)/3=«sp2»$、$\nu=«Nk»$。
          $$\nu\ln s_p^2=«Nk»\times(«lnp»)=«t1»$$
          $$\sum\nu_i\ln s_i^2=11\times\{(«lna»)+(«lnb»)+(«lnc»)\}=11\times(«sumln»)=«t2»$$
          $$\text{分子}=«t1»-(«t2»)=«M»$$
          $$C=1+\frac{1}{6}\left(\frac{3}{11}-\frac{1}{33}\right)=1+\frac16\cdot\frac{8}{33}=«C»$$
          $$B=\frac{«M»}{«C»}=«B4»\cdots$$

          **答え** $«B_s»$（自由度 2 の上側 5% 点 «chi2» より小さいので、有意水準 5% では等分散を棄却しない）

          **間違えやすい点** 分子は「プールした分散の対数」から「各分散の対数の重み付き平均」を引いて $\nu$ 倍したもの。対数は凹関数なので分子は必ず 0 以上になり、分散がそろうほど 0 に近い。
          補正項 $C$ で割り忘れると $«B_noc»$。バートレット検定は正規性からのずれに敏感なので、正規性が疑わしいときはルビーン検定などを使う。

  - id: s12p07
    title: 2 工場の比較
    context: |
      同じ調味料を作る 2 つの工場 A, B を比べる。
    items:
      - id: s12p07a
        chapter: 12
        terms: [variance-stabilizing-transform, two-sample-proportion-test]
        topic: 2工場の不良率の差を逆正弦変換（分散安定化変換）による正規近似で検定する統計量
        level: 標準
        definition: false
        type: numeric
        question: |
          工場 A では «na» 本中 «xa» 本、工場 B では «nb» 本中 «xb» 本が不良だった。不良率 $\hat p$ に逆正弦変換 $g(\hat p)=\arcsin\sqrt{\hat p}$（ラジアン）を施すと、
          $V[g(\hat p)]\approx\dfrac{1}{4n}$ となり分散が母比率によらなくなる。これを使った検定統計量
          $$z=\frac{g(\hat p_A)-g(\hat p_B)}{\sqrt{\dfrac{1}{4n_A}+\dfrac{1}{4n_B}}}$$
          の値を求めよ。必要なら $\arcsin\sqrt{«pa»}=«asa»$、$\arcsin\sqrt{«pb»}=«asb»$ を使え。
        answer: «z»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** デルタ法で $V[g(\hat p)]\approx g'(p)^2\,\dfrac{p(1-p)}{n}$。$g(p)=\arcsin\sqrt p$ では $g'(p)=\dfrac{1}{2\sqrt{p(1-p)}}$ なので、$V[g(\hat p)]\approx\dfrac{1}{4n}$ と $p$ が消える。

          **途中式** $\hat p_A=«xa»/«na»=«pa»$、$\hat p_B=«xb»/«nb»=«pb»$。
          $$g(\hat p_A)-g(\hat p_B)=«asa»-«asb»=«diff»$$
          $$\sqrt{\frac{1}{4\times«na»}+\frac{1}{4\times«nb»}}=\sqrt{«va»+«vb»}=\sqrt{«v»}=«se»$$
          $$z=\frac{«diff»}{«se»}=«z4»\cdots$$

          **答え** $«z_s»$（両側 5% の棄却点 1.96 を超えるので、不良率に差があるといえる）

          **間違えやすい点** 変換後の分散 $\frac1{4n}$ には $p$ が入らないので、2 標本の比率の検定のように「プールした比率」を推定する必要がない。
          角度は度ではなくラジアンで計算する（度で計算すると分散 $\frac1{4n}$ の式が成り立たない）。

      - id: s12p07b
        chapter: 13
        terms: [median-test, nonparametric-methods-overview, contingency-table]
        topic: 2工場の充填量のずれを全体の中央値より上か下かの2×2表にしたメディアン検定の統計量
        level: 標準
        definition: false
        type: choice
        question: |
          各工場から 8 本ずつ抜き取り、内容量の表示値からのずれを測った。16 本をまとめた中央値より大きいのは工場 A で «a» 本、工場 B で «c» 本だった（中央値と等しい値はなかった）。
          中央値より上か下かの 2×2 表を作り、連続修正をしないカイ二乗統計量でメディアン検定を行う。統計量の値はどれか。
        choices:
          - '$«chi_half»$'
          - '$«yates»$'
          - '$«chi_n1»$'
          - '$«chi_nodiv»$'
          - '$«chi»$'
        answer: 4
        distractors:
          - 4 つのセルのうち 1 行（工場 A）の 2 つのセルだけを足した
          - 連続修正（イェーツの修正）をした
          - n ではなく n-1 を掛けた（超幾何分布の分散にもとづく形）
          - (O-E)^2 を期待度数で割り忘れた
          - 正解
        explanation: |
          **方針** 全体の中央値で 2 群に分けると、各工場の「上」「下」の個数の 2×2 表ができる。2 工場の分布の位置が同じなら、どちらの工場でも上と下は半々になるはず。
          表は（A：上 «a»・下 «b»）、（B：上 «c»・下 «d»）で、期待度数はすべて 4。

          **途中式**
          $$\chi^2=\sum\frac{(O-E)^2}{E}=\frac{(6-4)^2}{4}\times4=«chi»$$
          公式 $\chi^2=\dfrac{n(ad-bc)^2}{(a+b)(c+d)(a+c)(b+d)}=\dfrac{16\times«adbc»^2}{8\times8\times8\times8}=«chi»$ でも同じ。

          **答え** $«chi»$（自由度 1 の上側 5% 点 3.84 を超える）

          **間違えやすい点** 連続修正をすると $«yates»$ となり、結論が変わる（3.84 未満）。問題文の指定に従う。
          メディアン検定は値の大小（中央値より上か下か）しか使わないので、外れ値の影響を受けにくい代わりに、順位和検定より検出力が低い。

