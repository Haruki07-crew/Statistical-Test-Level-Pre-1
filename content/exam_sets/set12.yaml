set: 12
title: 模擬試験 第12回
minutes: 90
problems:
  - id: s12p01
    title: 吸光度の比による濃度の補正
    context: |
      ある分析室では、試料と標準液の吸光度の比で濃度を補正している。装置のゼロ点付近で両方の吸光度が小さいとき、比 $R=X/Y$ の誤差が非常に大きくなることがある。
      これを調べるため、試料側の誤差 $X$ と標準液側の誤差 $Y$ が互いに独立に同じ正規分布 $N(0,\sigma^2)$ に従うという単純なモデルを考える。
    items:
      - id: s12p01a
        chapter: 4
        terms: [change-of-variables, cauchy-distribution, normal-distribution]
        topic: 独立な2つの正規誤差を極座標に変換し偏角が一様分布になることから比の絶対値が大きくなる確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          $(X,Y)$ を極座標 $X=D\cos\Theta$、$Y=D\sin\Theta$（$D>0$、$0\le\Theta<2\pi$）に変換して考える。比の絶対値が 3 を超える確率 $P(|R|>3)$ はどれか。
          必要なら $\pi=«pi»$、$\arctan(1/3)=«at3»$ を使え。
        choices:
          - '$«c_norm3»$'
          - '$«c_half»$'
          - '$«ans_a»$'
          - '$«c_cheb»$'
          - '$«c_comp»$'
        answer: 2
        distractors:
          - R が標準正規分布に従うと思い込み P(|Z|>3) を答えた
          - Θ が 0 の近くの範囲だけを数え、π の近くの範囲を落とした
          - 正解
          - 分散を 1 とみてチェビシェフの不等式の上界 1/9 を答えた（コーシー分布には分散がない）
          - 3 を超える確率ではなく、絶対値が 3 以下になる確率を答えた
        explanation: |
          **方針** 極座標への変換で $(D,\Theta)$ の同時密度を求め、$\Theta$ の分布を調べる。$R=X/Y=\cos\Theta/\sin\Theta$ は $\Theta$ だけで決まる。

          **途中式** ヤコビアンは
          $$\left|\det\begin{pmatrix}\cos\theta & -d\sin\theta\\ \sin\theta & d\cos\theta\end{pmatrix}\right|=d$$
          なので
          $$f_{D,\Theta}(d,\theta)=\frac{1}{2\pi\sigma^2}e^{-d^2/(2\sigma^2)}\cdot d=\left\{\frac{d}{\sigma^2}e^{-d^2/(2\sigma^2)}\right\}\times\frac{1}{2\pi}$$
          と積の形に分かれる。よって $D$ と $\Theta$ は独立で、$\Theta$ は $[0,2\pi)$ の一様分布に従う（$\sigma$ によらない）。
          $|R|>3\iff|\cos\Theta|>3|\sin\Theta|\iff|\tan\Theta|<1/3$ で、これは $\Theta$ が 0 の近く（$\Theta<a$ または $\Theta>2\pi-a$）と $\pi$ の近く（$|\Theta-\pi|<a$）の幅 $2a$ ずつの範囲（$a=\arctan(1/3)$）。
          $$P(|R|>3)=\frac{4a}{2\pi}=\frac{2\times«at3»}{«pi»}=«ans_a4»$$

          **答え** $«ans_a»$

          **間違えやすい点** 範囲は $\Theta=0$ の近くと $\Theta=\pi$ の近くの 2 か所ある。片方だけだと $«c_half»$ になる。
          同じ考え方で $P(R\le r)=\frac12+\frac1\pi\arctan r$ となり、$R$ は標準コーシー分布（密度 $\frac{1}{\pi(1+r^2)}$）に従う。正規分布なら $P(|Z|>3)$ は $«c_norm3»$ にすぎないが、比 $R$ では約 2 割と桁違いに大きい。
          コーシー分布には平均も分散もないので、チェビシェフの不等式は使えない。

      - id: s12p01b
        chapter: 2
        terms: [characteristic-function, cauchy-distribution, sum-of-random-variables]
        topic: コーシー分布の特性関数から独立な10個の標本平均もまた同じコーシー分布に従うことを使い確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          (a) の考え方から $R$ は標準コーシー分布（密度 $\frac{1}{\pi(1+r^2)}$）に従い、その特性関数は $\varphi(t)=E\!\left[e^{itR}\right]=e^{-|t|}$ である。独立に測った «n» 個の比 $R_1,\ldots,R_{«n»}$ の標本平均 $\bar R$ について、$P(|\bar R|\le1)$ はどれか。
          必要なら次の値を使え：$\pi=«pi»$、$\arctan\sqrt{10}=«at_s»$、$\arctan10=«at_n»$、$\Phi(1)=«phi1»$、$\Phi(3.16)=«phi316»$（$\Phi$ は標準正規分布の分布関数）。
        choices:
          - '$«c_norm»$'
          - '$«c_sqrt»$'
          - '$«c_n»$'
          - '$«ans»$'
          - '$«c_clt»$'
        answer: 3
        distractors:
          - コーシー分布を標準正規分布と取り違えた
          - 平均すると尺度が 1/√n になると考えた
          - 平均すると尺度が 1/n になると考えた
          - 正解
          - 中心極限定理が使えると考え、分散 1/n の正規分布で近似した
        explanation: |
          **方針** 独立な確率変数の和の特性関数は、それぞれの特性関数の積になる。$\bar R$ の特性関数を求めて分布を見分ける。

          **途中式**
          $$\varphi_{\bar R}(t)=E\!\left[e^{it\sum R_j/n}\right]=\left\{\varphi\!\left(\frac tn\right)\right\}^n=\left(e^{-|t|/n}\right)^n=e^{-|t|}$$
          これは 1 個の $R$ と同じ特性関数なので、$\bar R$ も標準コーシー分布に従う。分布関数は $F(x)=\frac12+\frac1\pi\arctan x$ なので
          $$P(|\bar R|\le1)=\frac{2}{\pi}\arctan1=\frac2\pi\cdot\frac\pi4=«ans»$$

          **答え** $«ans»$

          **間違えやすい点** コーシー分布には平均も分散もないので、大数の法則も中心極限定理も成り立たない。平均の尺度が $1/\sqrt n$ になると考えると $\frac2\pi\arctan\sqrt{10}=«c_sqrt4»$、$1/n$ になると考えると $«c_n4»$ になるが、実際は何個平均しても 1 個のときと同じばらつきのまま。
          ゼロ点付近で比をとる補正では、繰り返し測って平均しても精度が上がらない。中央値を使うなどの対策が要る。

  - id: s12p02
    title: 瓶詰め製品の抜取検査
    context: |
      ある食品工場では、瓶詰め製品のロットから «n» 本を無作為に抜き取り、不良品が «c» 本以下ならロットを合格とする抜取検査を行っている。
      ロットは十分大きく、抜き取った各本は独立に不良率 $p$ で不良品であるとみなす。
    items:
      - id: s12p02a
        chapter: 5
        terms: [binomial-distribution, bernoulli-distribution]
        topic: 計数抜取検査の合格判定個数と二項分布から不良率が合格品質水準のロットの生産者危険を求める
        level: 基本
        definition: false
        type: choice
        question: |
          不良率が $p=«p»$ のロットが**不合格**になる確率（生産者危険）はどれか。必要なら $0.95^{19}=«q19»$、$0.95^{20}=«q20»$ を使え。
        choices:
          - '$«o_p0»$'
          - '$«risk»$'
          - '$«o_p1»$'
          - '$«o_only0»$'
          - '$«o_acc»$'
        answer: 1
        distractors:
          - 不良 0 本の確率だけを答えた
          - 正解
          - 不良がちょうど 1 本の確率だけを答えた
          - 合格を不良 0 本のときだけと考えた（合格判定個数を 0 とした）
          - 不合格ではなく合格の確率を答えた
        explanation: |
          **方針** 抜き取った中の不良本数 $X$ は二項分布 $B(«n»,«p»)$ に従う。合格は $X\le«c»$ なので、不合格の確率は $1-P(X\le1)$。

          **途中式**
          $$P(X=0)=0.95^{20}=«p0»,\qquad P(X=1)=\binom{20}{1}\times0.05\times0.95^{19}=20\times0.05\times«q19»=«p1»$$
          $$P(\text{合格})=«p0»+«p1»=«acc»,\qquad P(\text{不合格})=1-«acc»=«risk4»$$

          **答え** $«risk»$

          **間違えやすい点** 合格は「不良が 1 本**以下**」なので $X=0$ と $X=1$ の両方を足す。$X=0$ だけを合格とすると不合格の確率は $«o_only0»$ と大きくなる。
          不良率 5% の良いロットでも 4 回に 1 回以上は不合格になり、この検査方式は生産者にとって厳しい。

      - id: s12p02b
        chapter: 7
        terms: [markov-inequality, convergence-in-mean-square, consistent-estimator]
        topic: 不良率の加算推定量の平均二乗誤差を偏りと分散から求め2乗へのマルコフの不等式で推定誤差が一定以上になる確率の上界を出す
        level: 標準
        definition: false
        type: choice
        question: |
          不良品の少ない工程では、$m$ 本中の不良本数 $S$ から不良率を $\tilde p=\dfrac{S+1}{m+2}$（0 や 1 になりにくい加算推定量）で推定することがある。
          $S\sim B(m,p)$、$m=«m»$、$p=«p»$ とする。$(\tilde p-p)^2$ にマルコフの不等式を当てはめた
          $$P(|\tilde p-p|\ge\varepsilon)\le\frac{E\left[(\tilde p-p)^2\right]}{\varepsilon^2}$$
          で、$\varepsilon=«eps»$ のときの右辺（上界）の値はどれか。
        choices:
          - '$«bd_v»$'
          - '$«bd_b»$'
          - '$«bd»$'
          - '$«bd_u»$'
          - '$«bd_e»$'
        answer: 2
        distractors:
          - 分子に分散だけを使い、偏りの 2 乗を足し忘れた（E[p̃] のまわりのチェビシェフの不等式と混同した）
          - 分子に偏りの 2 乗だけを使った
          - 正解
          - 普通の推定量 S/m の平均二乗誤差（分散）を使った
          - ε を 2 乗せずに割った
        explanation: |
          **方針** 分子の平均二乗誤差を「分散 ＋ 偏りの 2 乗」に分解して求め、$\varepsilon^2$ で割る。$E[S]=mp$、$V[S]=mp(1-p)$ を使う。

          **途中式**
          $$E[\tilde p]=\frac{mp+1}{m+2}=\frac{«mp1»}{«m2»}=«mean_est»,\qquad \text{偏り}=«mean_est»-«p»=«bias»$$
          $$V[\tilde p]=\frac{mp(1-p)}{(m+2)^2}=\frac{«mpq»}{«m22»}=«vr»\times10^{-4}$$
          $$E[(\tilde p-p)^2]=«vr»\times10^{-4}+(«bias»)^2=(«vr»+«b2»)\times10^{-4}=«mse»\times10^{-4}$$
          $$\frac{«mse»\times10^{-4}}{«eps»^2}=\frac{«mse»\times10^{-4}}{«eps2»}=«bd4»$$

          **答え** $«bd»$

          **間違えやすい点** $\tilde p$ には偏りがあるので、$p$ のまわりのずれを抑えるには分散ではなく平均二乗誤差を使う。分散だけで割ると $«bd_v»$ となり、$E[\tilde p]$ のまわりのずれの上界になってしまう。
          偏り $\frac{1-2p}{m+2}$ と分散はどちらも $m\to\infty$ で 0 に近づくので、平均二乗誤差は 0 に収束する（平均二乗収束）。上の不等式から、どんな $\varepsilon>0$ でも $P(|\tilde p-p|\ge\varepsilon)\to0$（確率収束）となり、$\tilde p$ は一致推定量である。
          ただし $p=«p»$ では、普通の推定量 $S/m$ の平均二乗誤差 $«pq»/«m»=«mse_u»\times10^{-4}$ のほうが小さい。加算推定量が有利なのは $p$ が $1/2$ に近いときである。

  - id: s12p03
    title: 合金粉末の粒径と組成
    context: |
      ある合金粉末メーカーが、製品の粒径分布と組成のずれを評価している。
    items:
      - id: s12p03a
        chapter: 3
        terms: [skewness-kurtosis, moments]
        topic: 粒径の原点まわりの1次から3次のモーメントから中心モーメントに直して歪度を求める
        level: 基本
        definition: false
        type: numeric
        question: |
          粒径 $X$（µm）の原点まわりのモーメントが $E[X]=«m1»$、$E[X^2]=«m2»$、$E[X^3]=«m3»$ と推定された。
          歪度 $\gamma=E\left[(X-\mu)^3\right]/\sigma^3$ を求めよ。必要なら $\sqrt{0.5}=«sq»$ を使え。
        answer: «skew»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 分散と 3 次の中心モーメントを、原点まわりのモーメントで表す。
          $\sigma^2=E[X^2]-\mu^2$、$E[(X-\mu)^3]=E[X^3]-3\mu E[X^2]+2\mu^3$。

          **途中式**
          $$\sigma^2=«m2»-«m1»^2=«var»$$
          $$E[(X-\mu)^3]=«m3»-3\times«m1»\times«m2»+2\times«m1»^3=«m3»-«t2»+«t3»=«mu3»$$
          $$\sigma^3=\sigma^2\cdot\sigma=«var»\times«sq»=«sig3»,\qquad \gamma=\frac{«mu3»}{«sig3»}=«skew4»\cdots$$

          **答え** $«skew_s»$

          **間違えやすい点** $(X-\mu)^3=X^3-3\mu X^2+3\mu^2X-\mu^3$ の期待値は $E[X^3]-3\mu E[X^2]+3\mu^3-\mu^3$ で、最後の 2 項がまとまって $+2\mu^3$ になる。これを落とすと $«sk_no2»$ と負になってしまう。
          原点まわりの $E[X^3]$ をそのまま $\sigma^3$ で割ると $«sk_raw»$、$\sigma^3$ ではなく $\sigma^2$ で割ると $«sk_var»$。
          歪度が正なので右に裾が長い分布（粗い粒がまれに混じる）である。実際、このモーメントは形状 2・尺度 0.5 のガンマ分布（歪度 $2/\sqrt2$）と一致する。

      - id: s12p03b
        chapter: 6
        terms: [noncentral-chi-squared-distribution, chi-squared-distribution, normal-distribution]
        topic: 3成分の組成のずれの標準化値の2乗和が従う非心カイ二乗分布の分散を非心度から求める
        level: 標準
        definition: false
        type: choice
        question: |
          3 つの合金元素の含有率を規格値からのずれとして標準化した値 $Z_1,Z_2,Z_3$ は互いに独立で、$Z_i\sim N(\delta_i,1)$、
          $(\delta_1,\delta_2,\delta_3)=(«d1»,\,«d2»,\,«d3»)$ とする（ある炉で組成が系統的にずれている）。
          総合的なずれの指標 $W=Z_1^2+Z_2^2+Z_3^2$ の分散 $V[W]$ はどれか。
        choices:
          - '$«E»$'
          - '$«V_c»$'
          - '$«V»$'
          - '$«V_2»$'
          - '$«E2»$'
        answer: 2
        distractors:
          - 分散ではなく期待値 k+λ を答えた
          - ずれ δ を無視して中心カイ二乗分布の分散 2k を使った
          - 正解
          - V[Z^2] を 2+2δ^2 とした（4δ^2 の項を半分にした）
          - 期待値の 2 乗を分散と取り違えた
        explanation: |
          **方針** $W$ は自由度 $k=3$、非心度 $\lambda=\sum\delta_i^2$ の非心カイ二乗分布に従う。1 つの $Z\sim N(\delta,1)$ について $V[Z^2]$ を計算し、独立なので足し合わせる。

          **途中式** $Z=\delta+U$（$U\sim N(0,1)$）とおくと $Z^2=\delta^2+2\delta U+U^2$。
          $2\delta U$ と $U^2$ は無相関（$E[U^3]=0$）なので
          $$V[Z^2]=4\delta^2V[U]+V[U^2]=4\delta^2+2$$
          $$\lambda=«d1»^2+«d2»^2+(«d3»)^2=«lam»,\qquad V[W]=\sum_i(2+4\delta_i^2)=2k+4\lambda=6+«fourlam»=«V»$$

          **答え** $«V»$

          **間違えやすい点** 非心カイ二乗分布の平均は $k+\lambda=«E»$、分散は $2(k+2\lambda)=«V»$。ずれがあると平均だけでなく分散も大きくなる。
          中心の場合の $2k=«V_c»$ をそのまま使えるのは、規格どおり（$\delta=0$）のときだけ。

  - id: s12p04
    title: 結晶粒の最大径による上限の推定
    context: |
      ある焼結体の断面で観察される結晶粒の径（µm）は、区間 $(0,\theta)$ の一様分布に従うとする。上限 $\theta$ を、独立に測った $n$ 個の粒の径の最大値 $\hat\theta=X_{(n)}=\max_iX_i$ で推定する（$\hat\theta$ は $\theta$ の最尤推定量である）。
    items:
      - id: s12p04a
        chapter: 8
        terms: [consistent-estimator, order-statistics, maximum-likelihood-estimator]
        topic: 一様分布の上端の最尤推定量（標本最大値）が真の値の90%以上になる確率を95%以上にする標本の大きさを求める
        level: 応用
        definition: false
        type: choice
        question: |
          $P(\hat\theta\ge0.9\,\theta)\ge0.95$ となる（推定値が真の値の 90% 以上になる確率が 95% 以上になる）最小の $n$ はどれか。
          必要なら次の値を使え：$\ln0.05=«ln05»$、$\ln0.025=«ln025»$、$\ln0.1=«ln01»$、$\ln0.9=«ln09»$。
        choices:
          - '$«n_01»$'
          - '$«n_ok»$'
          - '$«n_tr»$'
          - '$«n_r3»$'
          - '$«n_025»$'
        answer: 1
        distractors:
          - 確率 0.95 の代わりに 0.90 を使った（ln0.1 を使った）
          - 正解
          - 28.43 を切り捨てた（これでは 95% にわずかに届かない）
          - 3 の法則に似た近似 n≈3/0.1 を使った
          - 両側の 2.5% と考えて ln0.025 を使った
        explanation: |
          **方針** 最大値の分布関数は、すべての $X_i$ が $x$ 以下になる確率なので $P(\hat\theta\le x)=(x/\theta)^n$（$0<x<\theta$）。これを使って $P(\hat\theta<0.9\theta)\le0.05$ を $n$ について解く。

          **途中式** $\hat\theta\le\theta$ は常に成り立つので
          $$P(\hat\theta\ge0.9\theta)=1-P(\hat\theta<0.9\theta)=1-0.9^n\ge0.95\iff 0.9^n\le0.05$$
          対数をとると（$\ln0.9<0$ で割るので不等号の向きが変わる）
          $$n\ge\frac{\ln0.05}{\ln0.9}=\frac{«ln05»}{«ln09»}=«raw»$$
          よって最小の $n$ は $«n_ok»$。

          **答え** $«n_ok»$

          **間違えやすい点** $«raw»$ を切り捨てて $«n_tr»$ にすると $0.9^{28}>0.05$ で条件を満たさない。
          $P(\hat\theta<0.9\theta)=0.9^n\to0$ なので、$\hat\theta$ は $\theta$ の一致推定量である（ただし常に $\theta$ 以下なので偏りがあり、不偏にするには $(n+1)/n$ 倍する）。
          最尤推定量は尤度 $\theta^{-n}$（$\theta\ge X_{(n)}$）を最大にする値で、尤度を微分して 0 とおく方法では求まらない点にも注意する。

  - id: s12p05
    title: 残存率のモンテカルロ評価
    context: |
      ある洗浄工程では、被膜の厚さ $X$（標準化した単位）が率 1 の指数分布（平均 1）に従い、洗浄後に汚れが残る割合が $Y=e^{-X}$ で表されるとする。
      平均残存率 $\theta=E[Y]$ をモンテカルロ法で推定する。$X$ の平均が 1 と既知であることを利用して、制御変量法の推定量
      $$\hat\theta_c=\frac1n\sum_{j=1}^n\left\{Y_j+c\,(X_j-1)\right\}$$
      を使う（$X_j$ は独立に生成し $Y_j=e^{-X_j}$、$c$ は定数）。
    items:
      - id: s12p05a
        chapter: 32
        terms: [variance-reduction, monte-carlo-integration]
        topic: 平均が既知の変数を制御変量にしたモンテカルロ推定で最適な係数のときの分散の縮小率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          分散 $V[\hat\theta_c]$ を最小にする $c$ を使ったとき、$V[\hat\theta_c]$ は制御変量を使わない推定量 $\frac1n\sum Y_j$ の分散の何倍になるか。
        choices:
          - '$«one_m_rho»$'
          - '$«rho2»$'
          - '$«ratio»$'
          - '$«wsign»$'
          - '$«c1»$'
        answer: 2
        distractors:
          - 1-ρ^2 ではなく 1-|ρ| とした
          - 縮小率 1-ρ^2 ではなく ρ^2（減った割合）を答えた
          - 正解
          - 最適な c の符号を逆にした（c=-0.25）
          - 係数を c=1 のまま使った（Y と X の和にした）
        explanation: |
          **方針** $V[Y+c(X-1)]=V[Y]+2c\,\mathrm{Cov}(X,Y)+c^2V[X]$ を $c$ について最小にすると $c^*=-\mathrm{Cov}(X,Y)/V[X]$、最小値は $V[Y](1-\rho^2)$（$\rho$ は $X$ と $Y$ の相関係数）。必要なモーメントを指数分布から計算する。

          **途中式** $E[e^{-aX}]=\int_0^\infty e^{-ax}e^{-x}dx=\frac{1}{1+a}$、$E[Xe^{-X}]=\int_0^\infty xe^{-2x}dx=\frac14$ を使うと
          $$E[Y]=\frac12,\quad V[Y]=E[e^{-2X}]-\frac14=\frac13-\frac14=\frac1{12},\quad \mathrm{Cov}(X,Y)=\frac14-1\times\frac12=-\frac14,\quad V[X]=1$$
          $$c^*=\frac14,\qquad \rho^2=\frac{(1/4)^2}{1\times(1/12)}=\frac{12}{16}=«rho2»$$
          $$\frac{V[\hat\theta_{c^*}]}{V[\bar Y]}=1-\rho^2=«ratio»$$

          **答え** $«ratio»$（分散が 4 分の 1 になる）

          **間違えやすい点** $X$ と $Y$ は負の相関なので、$c^*$ は正（$X$ が平均より大きいと $Y$ は小さくなりやすいので、その分を足し戻す）。符号を逆に $c=-1/4$ とすると分散はかえって $«wsign»$ 倍に増える。
          縮小率は $1-\rho^2$ で、相関係数 $\rho=«rho»$ から $1-|\rho|$ を作るのは誤り。

