      - モデル R（切片と $x_1,x_2$ のみ）：残差平方和 «rss_r»
    items:
      - id: s12p08a
        chapter: 16
        terms: [partial-f-test, multiple-regression-model, f-distribution]
        topic: 4変数の重回帰から酸度とアミノ酸度の2変数をまとめて除けるかを部分F検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          $H_0:\beta_3=\beta_4=0$ を検定する $F$ 統計量の値として正しいものはどれか。なお、$F(«q»,«df_f»)$ の上側 5% 点は «Fcrit» である。
        choices:
          - '$«F_red»$'
          - '$«F»$'
          - '$«F_df»$'
          - '$«F_noq»$'
          - '$«F_ratio»$'
        answer: 1
        distractors:
          - 分母に小さいモデル R の残差平方和と自由度を使った
          - 正解
          - 分母の自由度を n-4 とした（切片を数え忘れた）
          - 分子を制約の数 2 で割り忘れた
          - 残差平方和の増加率を F 統計量と取り違えた
        explanation: |
          **方針** 入れ子のモデルの比較には部分 $F$ 検定を使う。
          $F=\dfrac{(S_R-S_F)/q}{S_F/(n-p_F-1)}$（$q$ は 0 とおく係数の数、$p_F$ はモデル F の切片を除く説明変数の数）は、$H_0$ のもとで自由度 $(q,\,n-p_F-1)$ の $F$ 分布に従う。

          **途中式** $q=«q»$、モデル F の残差の自由度は $«n»-«kf»-1=«df_f»$。
          $$\frac{S_R-S_F}{q}=\frac{«rss_r»-«rss_f»}{«q»}=«num»,\qquad \frac{S_F}{«df_f»}=\frac{«rss_f»}{«df_f»}=«mse»$$
          $$F=\frac{«num»}{«mse»}=«F»$$

          **答え** $«F»$（«Fcrit» 未満なので、有意水準 5% では $x_3,x_4$ をまとめて除いてよい）

          **間違えやすい点** 分母は**大きいモデル F**の誤差分散の推定値で、自由度は切片も数えて $n-5=«df_f»$。分子を $q=2$ で割り忘れると $«F_noq»$ となり、結論が逆になる。
          個々の $t$ 検定を 2 回くり返すのではなく、2 つの係数を同時に 0 とおく仮説は 1 回の $F$ 検定で調べる。

      - id: s12p08b
        chapter: 17
        terms: [studentized-residual, standardized-residual, leverage, outlier-and-influential-point]
        topic: 1点を除いた誤差分散で割る外部スチューデント化残差を残差とてこ比から求める
        level: 応用
        definition: false
        type: choice
        question: |
          モデル F で、ある 1 点の残差は $e_i=«e»$、てこ比は $h_{ii}=«h»$ だった。この点を除いて推定した誤差分散 $s_{(i)}^2$ を使う**外部スチューデント化残差**
          $t_i=\dfrac{e_i}{s_{(i)}\sqrt{1-h_{ii}}}$ の値に最も近いものはどれか。
          ただし、$i$ 番目の点を除いてモデル F を当てはめ直したときの残差平方和は $S_F-\dfrac{e_i^2}{1-h_{ii}}$ になる（$S_F$ はモデル F の残差平方和）。必要なら $\sqrt{0.75}=«sq1h»$ を使え。
        choices:
          - '$«r_raw»$'
          - '$«r_int»$'
          - '$«t_bad»$'
          - '$«t_ext»$'
          - '$«r_noroot»$'
        answer: 3
        distractors:
          - てこ比を考えずに残差を全体の s で割っただけ
          - 全データの s を使った内部スチューデント化残差（標準化残差）を答えた
          - 1 点を除いた残差平方和で e_i^2/(1-h) ではなく e_i^2 を引いた
          - 正解
          - √(1-h) ではなく (1-h) で割った
        explanation: |
          **方針** 与えられた式で $i$ 番目を除いた残差平方和を求め、その自由度 $(n-p_F-1)-1$ で割って $s_{(i)}^2$ を出す。$s_{(i)}$ は外れ値の影響を受けないので、外れ値の検出に向く。

          **途中式**
          $$\frac{e_i^2}{1-h_{ii}}=\frac{«e2»}{«omh»}=«e2h»,\qquad s_{(i)}^2=\frac{«rss_f»-«e2h»}{«df_f»-1}=\frac{«rss_i»}{«df_i»}=«s2i»,\qquad s_{(i)}=«si»$$
          $$t_i=\frac{«e»}{«si»\times«sq1h»}=\frac{«e»}{«den»}=«t_ext4»\cdots$$

          **答え** $«t_ext»$

          **間違えやすい点** 全データの $s=\sqrt{«mse»}=«s_full»$ を使う内部スチューデント化残差は $«e»/(«s_full»\times«sq1h»)\approx«r_int»$。
          外れ値があると $s$ 自体が大きくなるので、内部スチューデント化残差は外れ値を小さめに見せる。外部スチューデント化残差は自由度 «df_i» の $t$ 分布に従うので、そのまま $t$ 分布の点と比べられる。
          1 点を除いた残差平方和で引くのは $e_i^2$ ではなく $e_i^2/(1-h_{ii})$（除いた点の予測残差の 2 乗に $(1-h_{ii})$ を掛けたもの）。

      - id: s12p08c
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 測定誤差のある酸度の効果を仕込み水の硬度を操作変数として推定する
        level: 標準
        definition: false
        type: choice
        question: |
          別の分析として、官能評価点 $y$ を酸度 $x$ だけで説明する単回帰 $y=\alpha+\beta x+\varepsilon$ を考える。酸度の測定には誤差があり、また酸度と相関する未観測の要因もあるため、$x$ は $\varepsilon$ と相関している疑いがある。
          そこで仕込み水の硬度 $z$ を操作変数として使う（$z$ は $x$ と相関し、$\varepsilon$ とは無相関と仮定する）。標本の分散・共分散は次のとおりだった。

          | $V[x]$ | $V[z]$ | $\mathrm{Cov}(x,y)$ | $\mathrm{Cov}(z,x)$ | $\mathrm{Cov}(z,y)$ |
          |---|---|---|---|---|
          | «vx» | «vz» | «cxy» | «czx» | «czy» |

          $\beta$ の操作変数推定値はどれか。
        choices:
          - '$«ols»$'
          - '$«rf»$'
          - '$«fs»$'
          - '$«ivinv»$'
          - '$«iv»$'
        answer: 4
        distractors:
          - 最小二乗推定値 Cov(x,y)/V[x] を答えた（内生性を無視）
          - y を z に回帰した傾き（誘導形）を答えた
          - x を z に回帰した傾き（第1段階）を答えた
          - 操作変数推定値の分子と分母を逆にした
          - 正解
        explanation: |
          **方針** $z$ と $\varepsilon$ が無相関なら $\mathrm{Cov}(z,y)=\beta\,\mathrm{Cov}(z,x)$ が成り立つ。これを $\beta$ について解いた $\hat\beta_{IV}=\mathrm{Cov}(z,y)/\mathrm{Cov}(z,x)$ が操作変数推定値。

          **途中式**
          $$\hat\beta_{IV}=\frac{\mathrm{Cov}(z,y)}{\mathrm{Cov}(z,x)}=\frac{«czy»}{«czx»}=«iv»$$

          **答え** $«iv»$

          **間違えやすい点** 最小二乗推定値 $«cxy»/«vx»=«ols»$ は、$x$ と $\varepsilon$ が相関していると一致性がない。
          2 段階最小二乗法で考えても同じ：第 1 段階 $\hat x=\hat\pi z$（$\hat\pi=«czx»/«vz»=«fs»$）、第 2 段階で $y$ を $\hat x$ に回帰すると、傾きは $\dfrac{\hat\pi\,\mathrm{Cov}(z,y)}{\hat\pi^2V[z]}=\dfrac{«czy»}{«fs»\times«vz»}=«iv»$。
          誘導形の傾き $«czy»/«vz»=«rf»$ は「$z$ が 1 増えると $y$ がどれだけ変わるか」で、$\beta$ ではない。

  - id: s12p09
    title: 熟成期間と官能評価の 3 段階
    context: |
      ある蒸留所では、ウイスキーの原酒を官能評価で「1：不可」「2：可」「3：良」の 3 段階に格付けしている。熟成期間 $x$（年）と格付け $Y$ の関係を、次の順序ロジットモデル（比例オッズモデル）で表した。
      $$P(Y\le j\mid x)=\frac{1}{1+\exp\{-(\theta_j-\beta x)\}}\qquad(j=1,2)$$
      推定値は $\hat\theta_1=«th1»$、$\hat\theta_2=«th2»$、$\hat\beta=«beta»$ だった（$\beta>0$ なら熟成が長いほど高い格付けになりやすい）。
    items:
      - id: s12p09a
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, link-function]
        topic: 順序ロジットモデルの累積確率の差から中間カテゴリになる確率を求める
        level: 応用
        definition: false
        type: choice
        question: |
          熟成期間 $x=«x»$ 年の原酒が「2：可」と格付けされる確率 $P(Y=2\mid x=«x»)$ の推定値に最も近いものはどれか。
          必要なら次の値を使え：$e^{3}=«e3»$、$e^{0.5}=«e05»$、$e^{-1}=«em1»$、$e^{-3.5}=«em35»$。
        choices:
          - '$«p1»$'
          - '$«wrong»$'
          - '$«p2»$'
          - '$«cum2»$'
          - '$«p3»$'
        answer: 2
        distractors:
          - P(Y=1) を答えた
          - θ_j − βx の符号を誤り θ_j + βx として計算した
          - 正解
          - 累積確率 P(Y≤2) をそのまま答えた
          - P(Y=3) を答えた
        explanation: |
          **方針** 順序ロジットモデルが与えるのは累積確率 $P(Y\le j)$。中間のカテゴリの確率は差 $P(Y=2)=P(Y\le2)-P(Y\le1)$ で求める。

          **途中式** $\hat\beta x=«beta»\times«x»=«bx»$ なので $\theta_1-\beta x=«a1»$、$\theta_2-\beta x=«a2»$。
          $$P(Y\le1)=\frac{1}{1+e^{3}}=\frac{1}{«d1»}=«c1»,\qquad P(Y\le2)=\frac{1}{1+e^{0.5}}=\frac{1}{«d2»}=«c2»$$
          $$P(Y=2)=«c2»-«c1»=«p2_4»$$

          **答え** $«p2»$

          **間違えやすい点** $\exp\{-(\theta_j-\beta x)\}$ の指数は $-(«a1»)=3$、$-(«a2»)=0.5$ で、符号に注意する。$\theta_j+\beta x$ としてしまうと $«wrong»$ になる。
          累積確率 $P(Y\le2)=«cum2»$ のままでは「不可または可」の確率で、「良」の確率は $1-«c2»\approx«p3»$。
          このモデルでは熟成期間が 1 年延びると、どの $j$ でも「$j$ より上の格付け」のオッズが $e^{\beta}$ 倍になる（比例オッズ）。

  - id: s12p10
    title: 原薬ロット間の純度のばらつき
    context: |
      ある原薬の純度（%）について、製造ロット間のばらつきを調べたい。多数のロットから «a» ロットを無作為に選び、各ロットから «rr» 回ずつ測定した。
      モデルは $y_{ij}=\mu+a_i+\varepsilon_{ij}$（$a_i\sim N(0,\sigma_A^2)$、$\varepsilon_{ij}\sim N(0,\sigma^2)$、すべて独立）の変量効果モデルとする。
      一元配置の分散分析で、ロット間平方和 «ssa»、ロット内（誤差）平方和 «sse» を得た。
    items:
      - id: s12p10a
        chapter: 20
        terms: [fixed-and-random-effects, expected-mean-square, one-way-anova]
        topic: 変量効果の一元配置で期待平均平方からロット間分散成分を推定し級内相関を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          期待平均平方の関係を使ってロット間分散 $\sigma_A^2$ と誤差分散 $\sigma^2$ を推定し、級内相関係数 $\rho=\dfrac{\sigma_A^2}{\sigma_A^2+\sigma^2}$ の推定値を求めよ。
        answer: «icc»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 各ロット $r$ 回の測定なら $E[MS_A]=\sigma^2+r\sigma_A^2$、$E[MS_E]=\sigma^2$。平均平方を期待値に等しいとおいて解く（分散分析による推定）。

          **途中式** 自由度はロット間 $«a»-1=«dfa»$、誤差 $«a»\times(«rr»-1)=«dfe»$。
          $$MS_A=\frac{«ssa»}{«dfa»}=«msa»,\qquad MS_E=\frac{«sse»}{«dfe»}=«mse»$$
          $$\hat\sigma^2=«mse»,\qquad \hat\sigma_A^2=\frac{MS_A-MS_E}{r}=\frac{«msa»-«mse»}{«rr»}=«sa2»$$
          $$\hat\rho=\frac{«sa2»}{«sa2»+«mse»}=\frac{«sa2»}{«tot»}=«icc4»\cdots$$

          **答え** $«icc_s»$

          **間違えやすい点** $MS_A$ の期待値には、ロットあたりの測定回数 $r=«rr»$ が掛かる。ロット数 «a» で割ると $«icc_a»$ になる。
          $MS_E$ を引かずに $MS_A/r$ をロット間分散とすると、誤差分散の一部を二重に数えて $«icc_nosub»$ になる。
          純度のばらつきの半分以上がロット間の違いによるので、測定回数を増やすより、ロットを多く調べるほうが平均の推定精度が上がる。

  - id: s12p11
    title: 原料タンクの汚染量の調査
    context: |
      ある食品工場の倉庫には容量の異なる «N» 基の原料タンクがある。汚染された原料の総量（kL）を推定するため、容量に比例した包含確率で 3 基を非復元抽出し（容量比例確率抽出）、各タンクの汚染量を測った。
    items:
      - id: s12p11a
        chapter: 21
        terms: [horvitz-thompson-estimator, inclusion-probability, probability-proportional-to-size-sampling]
        topic: 容量比例の包含確率で選んだ3基のタンクからホービッツ・トンプソン推定量で総量を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          選ばれた 3 基の汚染量 $y_i$ と包含確率 $\pi_i$ は次のとおりだった。

          | タンク | 1 | 2 | 3 |
          |---|---|---|---|
          | 汚染量 $y_i$（kL） | «y1» | «y2» | «y3» |
          | 包含確率 $\pi_i$ | «pi1» | «pi2» | «pi3» |

          倉庫全体の汚染量の合計のホービッツ・トンプソン推定値はどれか。
        choices:
          - '«mul»'
          - '«avg»'
          - '«sumratio»'
          - '«ht»'
          - '«nmean»'
        answer: 3
        distractors:
          - 包含確率で割る代わりに掛けた
          - y/π の和ではなく平均をとった（合計ではなく1基あたりと混同）
          - y の和を包含確率の平均で割った
          - 正解
          - 包含確率を無視し、単純無作為抽出として N×(標本平均) とした
        explanation: |
          **方針** ホービッツ・トンプソン推定量は $\hat\tau=\sum_{i\in s}y_i/\pi_i$。各標本を「自分が代表する $1/\pi_i$ 基分」として重みづける。

          **途中式**
          $$\hat\tau=\frac{«y1»}{«pi1»}+\frac{«y2»}{«pi2»}+\frac{«y3»}{«pi3»}=«w1»+«w2»+«w3»=«ht»$$

          **答え** «ht» kL

          **間違えやすい点** 容量の大きいタンクほど選ばれやすいので、単純平均に «N» を掛ける $«nmean»$ は大きいタンクを過大に代表させてしまう。
          包含確率は「選ばれやすさ」なので、選ばれやすいものほど小さい重み $1/\pi_i$ をつける。
          汚染量が容量にほぼ比例していれば $y_i/\pi_i$ はほぼ一定になり、この推定量の分散は小さくなる。

      - id: s12p11b
        chapter: 29
        terms: [multiple-imputation, rubins-rules, missing-data-mechanism]
        topic: 多重代入法の5組の推定値と分散からルービンのルールで総量推定の標準誤差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          翌年はタンクを増やした大規模な調査を行ったが、一部のタンクで汚染量の測定値が欠測した。欠測値を多重代入法で $m=«m»$ 回補完し、補完済みデータごとに総量の推定値 $\hat Q_k$ とその分散の推定値 $U_k$ を求めた。

          | $k$ | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $\hat Q_k$ | 812 | 806 | 818 | 809 | 815 |
          | $U_k$ | 140 | 150 | 145 | 138 | 152 |

          ルービンのルールで統合した推定値の標準誤差を求めよ。代入間分散は $m-1$ で割るものとする。
        answer: «se»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ルービンのルールでは、全分散 $T=\bar U+\left(1+\frac1m\right)B$。$\bar U$ は代入内分散の平均、$B$ は推定値の代入間分散。

          **途中式** $\bar Q=«qb»$、$\bar U=«ub»$。
          偏差は $0,-6,6,-3,3$ なので
          $$B=\frac{0+36+36+9+9}{«m»-1}=\frac{«ssq»}{4}=«B»$$
          $$T=«ub»+«fac»\times«B»=«ub»+«fB»=«T»,\qquad \sqrt{«T»}=«se4»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** $(1+1/m)$ を付け忘れると $\sqrt{«ub»+«B»}=«se_nofac»$。代入内分散 $\bar U$ だけを使う（1 回だけ補完したデータを完全データとして扱う）と $«se_u»$ となり、欠測による不確かさを無視して精度を過大評価する。
          $(1+1/m)$ は、代入回数が有限であることによる $\bar Q$ のばらつきを加えるための係数である。

  - id: s12p12
    title: コーヒー豆の官能特性の多変量解析
    context: |
      あるロースターが、焙煎したコーヒー豆の官能特性をパネルで評価し、多変量解析を行った。
    items:
      - id: s12p12a
        chapter: 22
        terms: [principal-component-analysis, eigenvalue-and-eigenvector, principal-component-score]
        topic: 2変量の分散共分散行列の固有方程式を解き1つの豆の第1主成分得点を求める
        level: 標準
        definition: false
        type: choice
        question: |
          苦味 $x_1$ と酸味 $x_2$ の評点の分散共分散行列は
          $$S=\begin{pmatrix}«s11» & «s12»\\ «s12» & «s22»\end{pmatrix}$$
          だった。分散共分散行列にもとづく主成分分析を行い、第 1 主成分の係数ベクトルは長さ 1 で第 1 成分が正の向きにとる。
          平均からの偏差が $(x_1-\bar x_1,\,x_2-\bar x_2)=(«d1»,\,«d2»)$ の豆の第 1 主成分得点はどれか。必要なら $\sqrt5=«sq5»$ を使え。
        choices:
          - '$«eqw»$'
          - '$«contrib»$'
          - '$«score»$'
          - '$«score2»$'
          - '$«unnorm»$'
        answer: 2
        distractors:
          - 固有ベクトルを求めずに (1,1)/√2 の等しい重みを使った
          - 第1主成分の寄与率を得点と取り違えた
          - 正解
          - 小さいほうの固有値の固有ベクトル (1,-2)/√5 を使った
          - 固有ベクトルを長さ 1 に正規化しなかった
        explanation: |
          **方針** 固有方程式 $\det(S-\lambda I)=0$ を解いて最大固有値を求め、その固有ベクトルを長さ 1 にして偏差との内積をとる。

          **途中式** $\det(S-\lambda I)=\lambda^2-«tr»\lambda+«det»=0$ より
          $$\lambda=\frac{«tr»\pm\sqrt{«tr»^2-4\times«det»}}{2}=\frac{«tr»\pm«sqd»}{2}=«l1»,\ «l2»$$
          $\lambda_1=«l1»$ について $(S-«l1»I)\boldsymbol v=\boldsymbol 0$ は $-v_1+2v_2=0$ なので $\boldsymbol v\propto(2,1)$、長さ 1 にすると $(2,1)/\sqrt5$。
          $$z_1=\frac{2\times«d1»+1\times(«d2»)}{\sqrt5}=\frac{«numer»}{«sq5»}=«score»$$

          **答え** $«score»$

          **間違えやすい点** 係数ベクトルは長さ 1 にする（しないと $«unnorm»$）。小さい固有値 «l2» の固有ベクトル $(1,-2)/\sqrt5$ を使うと第 2 主成分得点 $«score2»$ になる。
          第 1 主成分の寄与率は $«l1»/«tr»\approx«contrib»$ で、得点とは別のもの。分散共分散行列を使っているので、分散の大きい苦味の重みが大きくなっている。

      - id: s12p12b
        chapter: 25
        terms: [maximum-likelihood-factor-analysis, number-of-factors, factor-analysis-model]
        topic: 最尤法の因子分析で因子数の適合度検定のカイ二乗の自由度を回転の不定性を考えて数える
        level: 基本
        definition: false
        type: choice
        question: |
          苦味・酸味・甘味・コク・香りなど «p» 項目の評点に、最尤法で «k» 因子の因子分析モデルを当てはめ、「«k» 因子で十分」という仮説の尤度比（カイ二乗）検定を行う。
          この検定統計量が漸近的に従うカイ二乗分布の自由度はどれか。
        choices:
          - '«df_norot»'
          - '«df»'
          - '«df_nouniq»'
          - '«df_nouniq_rot»'
          - '«df_ind»'
        answer: 1
        distractors:
          - 因子負荷量の回転の不定性 k(k-1)/2 を引かなかった
          - 正解
          - 独自分散 p 個をパラメータとして数え忘れた
          - 独自分散と回転の不定性の両方を考えなかった
          - 変数どうしの相関の数 p(p-1)/2（無相関の検定の自由度）を答えた
        explanation: |
          **方針** 自由度は「分散共分散行列の自由な要素の数」から「モデルの実質的なパラメータ数」を引いたもの。因子負荷量 $pk$ 個と独自分散 $p$ 個があるが、負荷行列は直交回転しても同じ共分散行列を与えるので、その分 $k(k-1)/2$ を引く。

          **途中式**
          $$\frac{p(p+1)}{2}-\left\{pk+p-\frac{k(k-1)}{2}\right\}=«pp1»-(«pk»+«p»-«rot»)=«df»$$
          公式 $\dfrac{(p-k)^2-(p+k)}{2}=\dfrac{36-10}{2}=«df»$ とも一致する。

          **答え** «df»

          **間違えやすい点** 回転の不定性を引き忘れると «df_norot»、独自分散を数え忘れると «df_nouniq»。
          自由度が正であることは、モデルが共分散構造に実質的な制約を課していて検定できるための条件でもある。

      - id: s12p12c
        chapter: 26
        terms: [path-analysis, structural-equation-modeling, spurious-correlation]
        topic: 焙煎度を共通の原因にもつパス図から苦味と総合評価のモデル上の相関を分解して求める
        level: 基本
        definition: false
        type: choice
        question: |
          焙煎度 $R$、苦味 $B$、総合評価 $S$ を標準化し、次のパス図（逐次モデル）を当てはめた。誤差は互いに独立で、$R$ とも無相関とする。

          - $R\to B$：パス係数 «pa»
          - $B\to S$：パス係数 «pb»
          - $R\to S$：パス係数 «pc»

          このモデルが示す苦味 $B$ と総合評価 $S$ の相関係数はどれか。
        choices:
          - '$«ab»$'
          - '$«total»$'
          - '$«rbs»$'
          - '$«pb»$'
          - '$«rbs_m»$'
        answer: 2
        distractors:
          - R から S への間接効果 a×b を答えた
          - R から S への総合効果を答えた
          - 正解
          - 直接効果だけを相関とみなし、共通の原因 R を通る経路を無視した
          - 共通の原因を通る経路の積 (-0.2)×0.6 の符号を逆にした
        explanation: |
          **方針** 標準化した逐次モデルでは、2 変数の相関は 2 変数を結ぶすべての経路（直接効果・間接効果・共通の原因を通る経路）のパス係数の積の和になる。

          **途中式** $S=«pb»B+(«pc»)R+e_S$ と $B$ との共分散をとると、$V[B]=1$、$\mathrm{Cov}(R,B)=«pa»$ なので
          $$r_{BS}=«pb»\times1+(«pc»)\times«pa»=«pb»+(«ca»)=«rbs»$$

          **答え** $«rbs»$

          **間違えやすい点** $B\to S$ の直接効果 «pb» だけでは、共通の原因 $R$ を通る見かけの相関（$B\leftarrow R\to S$ の経路）を見落とす。この経路の積は負なので、相関は直接効果より小さくなる。
          $R$ から $S$ への総合効果 $«pc»+«pa»\times«pb»=«total»$ は別の量である。

