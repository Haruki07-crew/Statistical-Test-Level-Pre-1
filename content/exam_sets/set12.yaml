    title: 貯蔵タンクの pH のゆらぎ
    context: |
      ある醸造所の貯蔵タンクで、pH の目標値からのずれ $B_t$（$t$ は時間）を、ドリフトのないブラウン運動とみなす。$B_0=0$ で、$B_t\sim N(0,\sigma^2t)$、$\sigma^2=«sig2»$（1 時間あたり）とする。
    items:
      - id: s12p08a
        chapter: 15
        terms: [brownian-motion, reflection-principle]
        topic: ブラウン運動の最大値が一定時間内に上限に達する確率を反射原理で求める
        level: 標準
        definition: false
        type: choice
        question: |
          «T» 時間の間に、ずれが一度でも $+«a»$ 以上になる（$\max_{0\le t\le«T»}B_t\ge«a»$ となる）確率はどれか。
          必要なら $\Phi(0.63)=«phiB»$、$\Phi(1.25)=«phiA»$、$\Phi(2.50)=«phiC»$ を使え。
        choices:
          - '$«ans»$'
          - '$«wnoT»$'
          - '$«half»$'
          - '$«wT»$'
          - '$«comp»$'
        answer: 0
        distractors:
          - 正解
          - 時間 T を考えず σ だけで標準化した
          - 最後の時刻で a 以上である確率だけを求めた（反射原理の 2 倍を忘れた）
          - 標準偏差を σ√T ではなく σT とした
          - 一度も達しない確率を答えた
        explanation: |
          **方針** 反射原理：一度 $a$ に達した道筋は、その後を $a$ で折り返しても同じ確率をもつ。これから
          $P\left(\max_{0\le t\le T}B_t\ge a\right)=2P(B_T\ge a)$。

          **途中式** $B_T\sim N(0,\sigma^2T)$ で、標準偏差は $\sqrt{«sig2»\times«T»}=«sd»$。
          $$P(B_T\ge«a»)=1-\Phi\left(\frac{«a»}{«sd»}\right)=1-\Phi(«z»)=«tail4»$$
          $$P\left(\max_{0\le t\le«T»}B_t\ge«a»\right)=2\times«tail4»=«ans»$$

          **答え** $«ans»$

          **間違えやすい点** 「最後の時刻で $a$ 以上」は「途中で一度でも $a$ 以上」より狭い事象で、ちょうど半分の確率 $«half»$ になる。途中で $a$ に達しても、その後に戻ってくることがあるため。
          ブラウン運動の標準偏差は時間の平方根に比例する（$\sigma\sqrt T$）。

