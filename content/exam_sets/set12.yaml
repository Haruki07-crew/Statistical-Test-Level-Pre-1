          **答え** $«q85»$

          **間違えやすい点** 描点位置には $(i-0.5)/n$、$i/(n+1)$ などいくつかの流儀があるので、問題文の指定に従う（$i/(n+1)=0.818$ なら $«q818»$）。$i/n$ を使うと最大の点が $\Phi^{-1}(1)=\infty$ になって描けない。
          点がほぼ直線上に並べば正規性に矛盾しない。右上の点が直線より上に反り上がるときは、右の裾が正規分布より重いことを示す。

  - id: s12p10
    title: 残留農薬の検出限界
    context: |
      ある農産物の残留農薬濃度を、検出限界未満は 0 として記録している。潜在的な濃度 $y^*=\boldsymbol x^\top\boldsymbol\beta+\varepsilon$（$\varepsilon\sim N(0,\sigma^2)$）に対し、観測値は $y=\max(y^*,0)$ とするトービットモデルを当てはめた。
    items:
      - id: s12p10a
        chapter: 18
        terms: [tobit-model, censored-data]
        topic: 0で打ち切られたトービットモデルで観測値の期待値を正規分布の密度と分布関数から求める
        level: 標準
        definition: false
        type: choice
        question: |
          ある産地の条件では $\boldsymbol x^\top\hat{\boldsymbol\beta}=«m»$、$\hat\sigma=«sig»$ だった。この条件での観測値の期待値 $E[y]$ に最も近いものはどれか。
          必要なら $\Phi(0.5)=«Phi»$、$\phi(0.5)=«phi»$（標準正規分布の分布関数と密度）を使え。
        choices:
          - '$«nophi»$'
          - '$0.500$'
          - '$«ey»$'
          - '$«noPhi»$'
          - '$«cond»$'
        answer: 2
        distractors:
          - σφ(μ/σ) の項を落とした
          - 打ち切りを無視して潜在変数の平均 x'β を答えた
          - 正解
          - 第1項に Φ(μ/σ) を掛け忘れた
          - 検出された（y>0）ものに限った条件付き期待値を答えた
        explanation: |
          **方針** $\mu=\boldsymbol x^\top\boldsymbol\beta$ とおくと、$E[y]=P(y^*>0)\,E[y^*\mid y^*>0]=\Phi(\mu/\sigma)\mu+\sigma\phi(\mu/\sigma)$。
          これは $E[\max(y^*,0)]=\int_0^\infty y\,\frac1\sigma\phi\!\left(\frac{y-\mu}{\sigma}\right)dy$ を計算すると得られる。

          **途中式** $\mu/\sigma=«m»$ なので
          $$E[y]=«Phi»\times«m»+«sig»\times«phi»=«t1»+«phi»=«ey4»$$

          **答え** $«ey»$

          **間違えやすい点** 打ち切りのため $E[y]$ は潜在変数の平均 «m» より大きい（負の値が 0 に引き上げられる）。
          検出された試料だけの平均 $E[y\mid y>0]=\mu+\sigma\phi/\Phi=«cond»$ とは別の量。0 の値を除いて普通の回帰をすると、この条件付き期待値を当てはめることになり、係数が偏る。

  - id: s12p11
    title: 発酵温度と酵母の分割区実験
    context: |
      ある酒造会社が、発酵温度（因子 A：3 水準）と酵母（因子 B：2 種）の効果を調べた。温度はタンク単位でしか設定できないので、4 日（ブロック）それぞれで 3 基のタンクに温度を無作為に割り付け（主区）、
      各タンクを 2 区画に分けて酵母を無作為に割り付けた（細区）。この分割区法の分散分析で、次の平均平方を得た。

      | 要因 | ブロック | A | 主区の誤差（ブロック×A） | B | A×B | 細区の誤差 |
      |---|---|---|---|---|---|---|
      | 自由度 | 3 | 2 | 6 | 1 | 2 | 9 |
      | 平均平方 | «msblk» | «msA» | «msE1» | «msB» | «msAB» | «msE2» |
    items:
      - id: s12p11a
        chapter: 20
        terms: [split-plot-design, randomized-block-design, expected-mean-square]
        topic: 分割区法で主区因子の発酵温度を主区の誤差で割ってF値を求める
        level: 標準
        definition: false
        type: choice
        question: |
          発酵温度（因子 A）の効果を検定する $F$ 値として正しいものはどれか。
        choices:
          - '$«F_pool»$'
          - '$«F»$'
          - '$«F_ab»$'
          - '$«F_B»$'
          - '$«F_e2»$'
        answer: 1
        distractors:
          - 2 つの誤差の平均平方を足して分母にした
          - 正解
          - 交互作用 A×B の平均平方を分母にした
          - 細区因子 B の F 値（細区の誤差で割る）と取り違えた
          - 主区因子なのに細区の誤差で割った
        explanation: |
          **方針** 分割区法には 2 種類の誤差がある。主区因子 A はタンクごとに割り付けたので、そのばらつきはタンク間の誤差（主区の誤差）と比べる。細区因子 B と A×B は、タンク内の誤差（細区の誤差）と比べる。

          **途中式**
          $$F_A=\frac{MS_A}{MS_{\text{主区誤差}}}=\frac{«msA»}{«msE1»}=«F»$$
          自由度は $(2,6)$ で、上側 5% 点 «Fcrit» を超えるので温度の効果は有意。

          **答え** $«F»$

          **間違えやすい点** 主区因子を細区の誤差（小さい）で割ると $«F_e2»$ と大きく出すぎ、効果を過大に評価する。主区の誤差の期待平均平方には、タンク間の変動が含まれるため。
          分割区法は設定が難しい因子をまとめて扱える代わりに、主区因子の検出力が低くなる。

  - id: s12p12
    title: 缶詰製品の抜取調査と保存試験
    context: |
      ある缶詰工場で、製造順に並んだ製品の品質調査と、賞味期限を決めるための保存試験を行った。
    items:
      - id: s12p12a
        chapter: 21
        terms: [systematic-sampling, simple-random-sampling]
        topic: 製造順に傾向がある12缶から3缶おきの系統抽出をしたときの標本平均の分散を3通りの開始点から求める
        level: 基本
        definition: false
        type: choice
        question: |
          ある日の 12 缶について、製造順に内容量の表示値からのずれ（g）を並べると次のとおりだった（後の缶ほどずれが大きい傾向がある）。

          $$«ys»$$

          最初の 3 缶から 1 つを無作為に選び、そこから 3 缶おきに 4 缶を選ぶ系統抽出を行う。3 通りの開始点が等確率で選ばれるとき、標本平均の分散（3 通りの標本平均の、母平均まわりの平均 2 乗）はどれか。
        choices:
          - '$«vsys»$'
          - '$«v_k1»$'
          - '$«sumsq3»$'
          - '$«vsrs»$'
          - '$«v_nofpc»$'
        answer: 0
        distractors:
          - 正解
          - 3 通りの平均 2 乗で、3 ではなく 2（k-1）で割った
          - 偏差の 2 乗の和を 3 で割り忘れた
          - 単純無作為抽出（4 缶）の標本平均の分散を答えた
          - 単純無作為抽出の分散で有限母集団修正を付け忘れた
        explanation: |
          **方針** 系統抽出の標本は開始点で決まり、3 通りしかない。それぞれの標本平均を求め、母平均からの偏差の 2 乗を確率 1/3 で平均する。

          **途中式** 開始点 1：3, 5, 7, 9、開始点 2：4, 6, 8, 10、開始点 3：4, 6, 8, 10 で、標本平均は «m1»、«m2»、«m3»。母平均は $80/12=20/3\approx«mu»$。
          偏差は分数のまま $-2/3,\ 1/3,\ 1/3$ として
          $$V=\frac13\left\{\left(-\frac23\right)^2+\left(\frac13\right)^2+\left(\frac13\right)^2\right\}=\frac13\times\frac69=«vsys»$$

          **答え** $«vsys»$

          **間違えやすい点** 単純無作為抽出で 4 缶選ぶ場合の分散は $(1-4/12)S^2/4=«vsrs»$（$S^2=«S2»$）。製造順に単調な傾向があると、系統抽出の標本は前半と後半をまんべんなく含むので、単純無作為抽出よりずっと精度がよい。
          逆に、ずれが 3 缶周期で変動する（例えば 3 ノズルの充填機）ときは、同じノズルの缶ばかり選ばれて精度が大きく落ちる。

      - id: s12p12b
        chapter: 29
        terms: [nelson-aalen-estimator, censored-data, kaplan-meier-estimator]
        topic: 打ち切りを含む保存試験で異常が出るまでの日数から20日時点のネルソン・エーレン累積ハザードを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          8 缶を高温で保存し、膨張などの異常が出るまでの日数を記録した（「+」は異常が出ないまま試験から外した打ち切り）。

          $$10,\ 12^+,\ 15,\ 15,\ 18^+,\ 20,\ 25^+,\ 30$$

          20 日時点の累積ハザードのネルソン・エーレン推定値 $\hat H(20)=\sum_{t_j\le20}d_j/n_j$ を求めよ（$d_j$ は時刻 $t_j$ の異常数、$n_j$ はその直前のリスク集合の大きさ）。
        answer: «H»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 異常が起きた時刻ごとに、その直前にまだ異常がなく試験中だった缶の数 $n_j$ と異常数 $d_j$ を数え、$d_j/n_j$ を足す。打ち切られた缶は、打ち切り時刻より後のリスク集合から除く。

          **途中式**
          - $t=10$：$n=8$、$d=1$ → $1/8$
          - $t=15$：10 日の異常と 12 日の打ち切りで 2 缶減り $n=6$、$d=2$ → $2/6$
          - $t=20$：15 日の 2 缶と 18 日の打ち切りで 3 缶減り $n=3$、$d=1$ → $1/3$

          $$\hat H(20)=\frac18+\frac26+\frac13=\frac{3+8+8}{24}=\frac{19}{24}=«H4»\cdots$$

          **答え** $«H_s»$

          **間違えやすい点** 打ち切りの缶も、打ち切られるまではリスク集合に入る（12 日に打ち切った缶は 10 日のリスク集合には入るが、15 日のリスク集合には入らない）。
          打ち切りを異常と同じに扱ったり、リスク集合から最初から除いたりすると、累積ハザードを誤る。$\exp\{-\hat H(t)\}$ は生存関数の推定値になり、カプラン・マイヤー推定値に近い値になる。

  - id: s12p13
    title: コーヒーの官能評価の多変量解析
    context: |
      あるロースターが、焙煎したコーヒー豆の官能特性を専門パネルで評価し、多変量解析を行った。
    items:
      - id: s12p13a
        chapter: 22
        terms: [kaiser-criterion, pca-on-correlation-matrix, cumulative-contribution-ratio]
        topic: 相関行列の固有値の和が変数の数に等しいことから残りの固有値を求めカイザー基準で主成分数と累積寄与率を決める
        level: 標準
        definition: false
        type: choice
        question: |
          苦味・酸味・甘味・コク・香りの «p» 項目の評点の相関行列で主成分分析を行った。固有値のうち大きいほうから 4 つは «e1»、«e2»、«e3»、«e4» だった（5 つ目は示されていない）。
          カイザー基準（固有値が 1 を超える主成分を採用）で採用する主成分の数と、その累積寄与率の組として正しいものはどれか。
        choices:
          - '2 個、«cum_w» %'
          - '1 個、«cum1» %'
          - '2 個、«cum2» %'
          - '3 個、«cum3» %'
          - '4 個、«cum4» %'
        answer: 2
        distractors:
          - 累積寄与率の分母に示された 4 つの固有値の和 4.8 を使った
          - 固有値が 2 を超えるものだけを採用した
          - 正解
          - 固有値が 0.7 以上のものまで採用した
          - 示された固有値をすべて採用した
        explanation: |
          **方針** 相関行列の対角成分はすべて 1 なので、固有値の和（トレース）は変数の数 «p» に等しい。これで 5 つ目の固有値と寄与率の分母が決まる。

          **途中式** 5 つ目の固有値は $«p»-«sum4»=«e5»$。固有値が 1 を超えるのは «e1» と «e2» の 2 つ。
          $$\text{累積寄与率}=\frac{«e1»+«e2»}{«p»}=\frac{«top2»}{«p»}=«cum2»\%$$

          **答え** 2 個、«cum2» %

          **間違えやすい点** 寄与率の分母は固有値の総和（相関行列なら変数の数）。示された 4 つの和で割ると $«cum_w»\%$ と大きく出る。
          カイザー基準は「1 変数分（固有値 1）以上の情報をもつ主成分を残す」という目安で、分散共分散行列の主成分分析にはそのまま使えない。

      - id: s12p13b
        chapter: 25
        terms: [factor-analysis-model, communality, common-factor-unique-factor]
        topic: 3変数の1因子モデルで3つの相関係数から因子負荷量を決め独自分散を求める
        level: 標準
        definition: false
        type: choice
        question: |
          甘味 $x_1$・コク $x_2$・香り $x_3$ の標準化した評点に、1 因子モデル $x_j=\lambda_jf+e_j$（$V[f]=1$、$e_j$ は互いに独立で $f$ とも独立、$\lambda_j>0$）を当てはめる。
          相関係数が $r_{12}=«r12»$、$r_{13}=«r13»$、$r_{23}=«r23»$ のとき、モデルが相関をちょうど再現するように負荷量を決める。甘味 $x_1$ の独自分散 $\psi_1$ はどれか。
        choices:
          - '$«w_l»$'
          - '$«psi»$'
          - '$«w_r»$'
          - '$«l1sq»$'
          - '$«w_nodiv»$'
        answer: 1
        distractors:
          - 1 から負荷量の 2 乗ではなく負荷量そのものを引いた
          - 正解
          - 1 から相関係数 r12 を引いた
          - 独自分散ではなく共通性を答えた
          - λ1^2 を r12×r13 とし、r23 で割り忘れた
        explanation: |
          **方針** 1 因子モデルでは $r_{jk}=\lambda_j\lambda_k$（$j\ne k$）。3 つの式から $\lambda_1^2=\dfrac{r_{12}r_{13}}{r_{23}}$ が得られる。標準化しているので $\psi_1=1-\lambda_1^2$。

          **途中式**
          $$\lambda_1^2=\frac{\lambda_1\lambda_2\cdot\lambda_1\lambda_3}{\lambda_2\lambda_3}=\frac{«r12»\times«r13»}{«r23»}=\frac{«prod»}{«r23»}=«l1sq»\qquad(\lambda_1=«l1»)$$
          $$\psi_1=1-«l1sq»=«psi»$$

          **答え** $«psi»$

          **間違えやすい点** 共通性 $\lambda_1^2=«l1sq»$ と独自分散 $1-\lambda_1^2$ を取り違えない。
          3 変数の 1 因子モデルは相関 3 つに対してパラメータ（負荷量）も 3 つなので、ちょうど決まる（自由度 0）。$r_{12}r_{13}/r_{23}>1$ になると独自分散が負になる不適解（ヘイウッドケース）が起こる。

      - id: s12p13c
        chapter: 26
        terms: [nonmetric-mds, multidimensional-scaling]
        topic: 非計量多次元尺度法で布置の距離と単調回帰の値からクラスカルのストレスを求める
        level: 基本
        definition: false
        type: choice
        question: |
          4 種類の豆の味の非類似度を非計量多次元尺度法で 2 次元に配置した。6 組の豆の布置上の距離 $d$ と、非類似度の順序に合わせて単調回帰で求めた値（ディスパリティ）$\hat d$ は次のとおりだった。

          | 組 | 1 | 2 | 3 | 4 | 5 | 6 |
          |---|---|---|---|---|---|---|
          | $d$ | 1.0 | 2.0 | 2.5 | 3.0 | 1.5 | 2.0 |
          | $\hat d$ | 1.0 | 1.8 | 2.5 | 3.0 | 1.7 | 2.0 |

          クラスカルのストレス $\sqrt{\sum(d-\hat d)^2/\sum d^2}$ に最も近いものはどれか。
        choices:
          - '$«st_sq»$'
          - '$«st_mean»$'
          - '$«stress»$'
          - '$«st_rms»$'
          - '$«st_raw»$'
        answer: 2
        distractors:
          - 平方根をとり忘れた
          - ずれの 2 乗を組の数 6 で割った（平方根なし）
          - 正解
          - ずれの 2 乗の平均の平方根（Σd^2 で割らない）を求めた
          - Σd^2 で割らずに平方根だけをとった
        explanation: |
          **方針** ストレスは、布置の距離が単調回帰の値（順序を保つ最良の値）からどれだけずれているかを、距離の大きさで基準化した量。

          **途中式** ずれは組 2 で $0.2$、組 5 で $-0.2$、ほかは 0。
          $$\sum(d-\hat d)^2=0.04+0.04=«num»,\qquad \sum d^2=1+4+6.25+9+2.25+4=«den»$$
          $$\text{ストレス}=\sqrt{\frac{«num»}{«den»}}=\sqrt{«ratio»}=«stress4»\cdots$$

          **答え** $«stress»$

          **間違えやすい点** 分母の $\sum d^2$ で割ることで、布置の拡大・縮小によらない量になる。
          ストレスは 0 に近いほど当てはまりがよく、目安として 0.05 程度なら「よい」、0.1 程度なら「まずまず」とされる。

  - id: s12p14
    title: 食中毒の調査と殺菌工程の評価
    context: |
      ある食品会社の品質保証部門が、食中毒の原因調査と、新しい殺菌工程の効果の評価を行った。
    items:
      - id: s12p14a
        chapter: 28
        terms: [cohort-and-case-control-study, odds-ratio-interval, two-by-two-table]
        topic: 食中毒の症例対照研究の2×2表から原因と疑われる料理のばく露オッズ比を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある宴会のあと食中毒が発生した。発症した «ncase» 人（症例）と、同じ宴会の出席者で発症しなかった人から無作為に選んだ «nctrl» 人（対照）に、生がきを食べたかを尋ねた。

          | | 食べた | 食べなかった |
          |---|---|---|
          | 症例 | «a» | «b» |
          | 対照 | «c» | «d» |

          生がきを食べたことのオッズ比（症例の食べたオッズ ÷ 対照の食べたオッズ）を求めよ。
        answer: «OR»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 症例対照研究では、症例と対照の人数を研究者が決めるので、発症率（リスク）は推定できない。推定できるのは、症例と対照のそれぞれでの「ばく露のオッズ」の比である。

          **途中式**
          $$\text{OR}=\frac{«a»/«b»}{«c»/«d»}=\frac{«a»\times«d»}{«b»\times«c»}=\frac{«ad»}{«bc»}=«OR4»\cdots$$

          **答え** $«OR_s»$

          **間違えやすい点** 表の列ごとに「食べた人の中の症例の割合 ÷ 食べなかった人の中の症例の割合」を作ると $«RRw»$ になるが、対照の人数を変えるとこの値も変わるので意味がない。
          ばく露オッズ比は、疾病オッズ比（コホート研究のオッズ比）と等しい（オッズ比の対称性）。発症がまれなら相対危険の近似にもなる。

      - id: s12p14b
        chapter: 33
        terms: [frontdoor-criterion, causal-effect, backdoor-criterion]
        topic: 未観測の原料汚染が交絡するとき残存菌の検出を中間変数にしたフロントドア調整で殺菌工程の因果効果を求める
        level: 応用
        definition: false
        type: numeric
        question: |
          多数の工場のデータで、殺菌工程 $X$（新 1、旧 0）と製品の腐敗 $Y$（あり 1、なし 0）の関係を調べる。工程の選択と腐敗の両方に影響する原料の汚染度 $U$ は観測されていない。
          そこで、出荷前検査での残存菌の検出 $M$（検出 1、なし 0）を通る経路 $X\to M\to Y$ に注目する。次を仮定する：$X$ は $M$ を通してのみ $Y$ に影響する、$U$ は $X$ と $Y$ に影響するが $M$ には直接影響しない、$X$ と $M$ の間・$M$ と $Y$ の間にほかの交絡はない。
          観測データから次の確率が得られた。

          - $P(X=1)=«px1»$
          - $P(M=1\mid X=1)=«pm1»$、$P(M=1\mid X=0)=«pm0»$
          - $P(Y=1\mid M=1,X=1)=«y11»$、$P(Y=1\mid M=1,X=0)=«y10»$、$P(Y=1\mid M=0,X=1)=«y01»$、$P(Y=1\mid M=0,X=0)=«y00»$

          フロントドア基準による調整で、平均因果効果 $P(Y=1\mid do(X=1))-P(Y=1\mid do(X=0))$ を求めよ。
        answer: «ace»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。負の値は符号をつける。±0.001 の差まで正解とする。
        explanation: |
          **方針** フロントドア調整の式
          $$P(Y=1\mid do(X=x))=\sum_m P(M=m\mid X=x)\sum_{x'}P(Y=1\mid M=m,X=x')P(X=x')$$
          を使う。外側は「$X$ が $M$ に与える効果」（交絡なし）、内側は「$M$ が $Y$ に与える効果」を $X$ でバックドア調整したもの。

          **途中式** 内側の和：
          $$m=1:\ «y11»\times«px1»+«y10»\times«px0»=«t11»+«t10»=«in1»,\qquad m=0:\ «y01»\times«px1»+«y00»\times«px0»=«t01»+«t00»=«in0»$$
          外側の和：
          $$P(Y=1\mid do(X=1))=«pm1»\times«in1»+«pm1c»\times«in0»=«do1»$$
          $$P(Y=1\mid do(X=0))=«pm0»\times«in1»+«pm0c»\times«in0»=«do0»$$
          差は $«do1»-«do0»=«ace4»$。

          **答え** $«ace_s»$

          **間違えやすい点** 観測された条件付き確率の差 $P(Y=1\mid X=1)-P(Y=1\mid X=0)=«obs1»-«obs0»=«naive»$ は、汚染度の高い工場ほど新工程を導入していたという交絡のため、効果を小さく見せている。
          内側の和で $P(Y=1\mid M=m,X=x)$ を $x$ を固定したまま使うのは誤り。$M\to Y$ の関係には $M\leftarrow X\leftarrow U\to Y$ というバックドア経路があるので、$X$ の周辺分布 $P(X=x')$ で平均して調整する。
