          - てこ比は説明変数だけで決まり、目的変数の値によらない
        explanation: |
          **方針** 切片とダミー変数だけの回帰では、当てはめ値は各群の平均になる。群の平均にその観測が占める重みは $1/(\text{群の大きさ})$ なので、てこ比は $1/n_g$。

          **途中式** イベント週の当てはめ値は 4 週の平均なので、$h_{ii}=1/4=«q8_h1»$。イベントのない週は $1/48=«q8_h0»$。
          目安は $2p/n=2\times2/52=«q8_thr»$ で、イベント週はこれを上回る。

          **答え** $h_{ii}=«q8_h1»$ で、目安を上回る

          **間違えやすい点** てこ比の大きい観測は、外れ値でなくても係数（ここではイベントの効果）の推定に強く効く。数の少ない群の観測は、どれもてこ比が大きくなる。
