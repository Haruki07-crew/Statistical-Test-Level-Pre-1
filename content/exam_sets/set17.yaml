  - id: s17p10
    title: ホテルの顧客満足度調査
    context: |
      あるホテルチェーンで宿泊客にアンケートを行い、総合満足度 $Y$ を 1（不満）、2（普通）、3（満足）の 3 段階で尋ねた。会員なら $x=1$、非会員なら $x=0$ とする。
