        terms: [regression-coefficient-t-test, multiple-regression-model, log-transformation]
        topic: 両対数の需要回帰で価格弾力性が−1（単位弾力的）と異なるかを係数のt検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          帰無仮説「価格弾力性は $-1$（単位弾力的）」、対立仮説「$-1$ ではない」を有意水準 5% の両側 $t$ 検定で調べる。正しいものはどれか。
