          - '$«ratio»$'
          - '$«w_prev»$'
          - '$«w_inv»$'
          - '$«w_diff»$'
        answer: 1
        distractors:
          - 中心化せず、第2〜第5四半期の4項平均をトレンドにした（時点が半期ずれる）
          - 正解
          - 中心化せず、第1〜第4四半期の4項平均をトレンドにした
          - 比を逆に（トレンド ÷ 実測値）した
          - 乗法型ではなく加法型の季節成分（実測値 − トレンド）を答えた
        explanation: |
          **方針** 4 項の移動平均の中心は 2 つの四半期の間に来るので、隣り合う 2 つの 4 項平均をさらに平均して中心を第 3 四半期に合わせる。重みは両端が 1/8、内側 3 つが 1/4 になる。

          **途中式**
          $$\frac{1}{4}\left(\frac{«y1»}{2}+«y2»+«y3»+«y4»+\frac{«y5»}{2}\right)=\frac{«num»}{4}=«trend»$$
          （第 1〜4 四半期の平均 «m14» と第 2〜5 四半期の平均 «m25» の平均でもある。）
          $$\text{季節指数}=\frac{«y3»}{«trend»}=«ratio4»\cdots$$

          **答え** $«ratio»$（第 3 四半期は平年のトレンドより約 «pct»% 多い）

          **間違えやすい点** 4 項平均をそのまま使うと、その平均は第 2 と第 3 四半期の間（または第 3 と第 4 の間）を表すので、時点がずれる（$«w_prev»$ や $«w_simple»$）。
          乗法型の季節指数は比で表し、差 $«y3»-«trend»=«w_diff»$ は加法型の季節成分になる。

      - id: s17p09b
        chapter: 19
        terms: [two-stage-least-squares, endogeneity, instrumental-variable-method]
        topic: 価格が需要に反応して決まるときの価格弾力性を2つの操作変数を使う2段階最小二乗法の第1段階の当てはめ値から求める
        level: 応用
        definition: false
        type: choice
        question: |
          ホテルは需要が多い週に価格を上げるので、価格の対数 $\log P$ は誤差と相関し、販売客室数の対数 $\log Q$ を $\log P$ に回帰した最小二乗推定値 «q9_ols» は偏っているおそれがある。
          そこで、需要とは関係なく費用を通じて価格を動かす 2 つの変数（地域の人件費指数と光熱費指数）を操作変数とし、2 段階最小二乗法を行った。
          第 1 段階で $\log P$ を 2 つの操作変数に回帰した当てはめ値を $\widehat{\log P}$ とすると、標本で $V[\widehat{\log P}]=«q9_vp»$、$\mathrm{Cov}(\widehat{\log P},\ \log Q)=«q9_cpq»$ だった。
          価格弾力性の 2 段階最小二乗推定値と、その解釈の組として正しいものはどれか。
        choices:
          - '$«q9_b2»$。需要の多い週に価格を上げる影響で、最小二乗推定値は 0 の方に偏っていた'
          - '$«q9_ols»$。操作変数を使っても推定値は変わらない'
          - '$«q9_w_inv»$。需要の多い週に価格を上げる影響で、最小二乗推定値は 0 の方に偏っていた'
          - '$«q9_b2»$。最小二乗推定値は 0 から離れる方向（弾力的すぎる方向）に偏っていた'
          - '$«q9_b2»$。操作変数は $\log Q$ と強く相関していればよく、誤差と相関していてもかまわない'
        answer: 0
        distractors:
          - 正解
          - 操作変数法は内生性による偏りを取り除くための方法で、推定値は一般に変わる
          - 共分散と分散の比を逆にした
          - 需要が多いと価格も数量も高くなるので、価格と数量の負の関係が弱まり、最小二乗推定値は 0 の方に偏る
          - 操作変数は説明変数（価格）と相関し、誤差とは相関しないことが必要
        explanation: |
          **方針** 第 2 段階で $\log Q$ を $\widehat{\log P}$ に回帰する。傾きは $\mathrm{Cov}(\widehat{\log P},\log Q)/V[\widehat{\log P}]$。$\widehat{\log P}$ は操作変数だけで決まる価格の部分なので、需要のショック（誤差）と相関しない。

          **途中式**
          $$\hat\beta_{2SLS}=\frac{«q9_cpq»}{«q9_vp»}=«q9_b2»$$

          **答え** $«q9_b2»$（最小二乗推定値 «q9_ols» は 0 の方に偏っていた）

          **間違えやすい点** 需要が多い週は数量が多く、同時に価格も上げるので、価格と数量の関係に正の成分が混ざり、最小二乗推定値の絶対値は小さくなる（同時性の偏り）。
          2 段階目の標準誤差は、当てはめ値ではなく元の $\log P$ で残差を計算して求める必要がある（2 段階目の最小二乗の出力をそのまま使うと誤る）。

  - id: s17p10
    title: チェックイン時刻のずれ
    context: |
      あるビジネスホテルで、予約時に申告されたチェックイン予定時刻と実際の到着時刻の差 $X$（分、遅れを正とする）を記録している。
      $X$ は位置母数 $\mu$、尺度母数 $b$ のラプラス分布（両側指数分布）$f(x)=\dfrac{1}{2b}\exp\left(-\dfrac{|x-\mu|}{b}\right)$ に従い、互いに独立とする。
    items:
      - id: s17p10a
        chapter: 8
        terms: [maximum-likelihood-estimator, likelihood-function, point-estimation]
        topic: ラプラス分布の位置母数と尺度母数の最尤推定値が標本中央値と中央値からの平均絶対偏差になることを使って求める
        level: 標準
        definition: false
        type: choice
        question: |
          7 組の記録は $«xs»$ だった。$(\mu,b)$ の最尤推定値の組として正しいものはどれか。
        choices:
          - '$(\hat\mu,\hat b)=(«m»,\ «b»)$'
          - '$(\hat\mu,\hat b)=(«xbar»,\ «b»)$'
          - '$(\hat\mu,\hat b)=(«xbar»,\ «w_bmean»)$'
          - '$(\hat\mu,\hat b)=(«m»,\ «w_sd»)$'
          - '$(\hat\mu,\hat b)=(«m»,\ «w_half»)$'
        answer: 0
        distractors:
          - 正解
          - 位置の最尤推定値を標本平均とした（正規分布の場合と混同した）
          - 位置を標本平均とし、平均からの平均絶対偏差で尺度を推定した
          - 尺度を標準偏差で推定した
          - 尺度の推定値を 2 で割った（密度の 2b と取り違えた）
        explanation: |
          **方針** 対数尤度は $\ell(\mu,b)=-n\log(2b)-\dfrac1b\sum|x_i-\mu|$。$\mu$ については $\sum|x_i-\mu|$ を最小にすればよく、これは標本中央値で最小になる。$b$ については微分して 0 とおく。

          **途中式** 並べると中央値（4 番目）は «m»。$\sum|x_i-«m»|=«sab»$。
          $$\frac{\partial\ell}{\partial b}=-\frac nb+\frac{\sum|x_i-\hat\mu|}{b^2}=0\iff\hat b=\frac{1}{n}\sum|x_i-\hat\mu|=\frac{«sab»}{7}=«b4»$$

          **答え** $(\hat\mu,\hat b)=(«m»,\ «b»)$

          **間違えやすい点** 正規分布では 2 乗の和を最小にするので平均が最尤推定値になるが、ラプラス分布では絶対値の和なので中央値になる。そのため、外れた値（ここでは 15 分）の影響を受けにくい。

  - id: s17p11
    title: 予約経路の比率
    context: |
      あるホテルでは、以前は予約の半分が公式サイト経由だった。最近の予約から無作為に 12 件を選ぶと、公式サイト経由は 10 件だった。各予約が公式サイト経由である確率を $p$ とし、予約どうしは独立とする。
    items:
      - id: s17p11a
        chapter: 10
        terms: [p-value, one-sided-two-sided-test, binomial-test]
        topic: 公式サイト経由の予約の比率が以前と変わったかを二項分布の正確な両側p値を片側の2倍として求め判定する
        level: 基本
        definition: false
        type: choice
        question: |
          帰無仮説 $H_0:p=0.5$ を対立仮説 $H_1:p\ne0.5$ に対して、二項分布にもとづく正確な検定（両側 $p$ 値は片側の確率の 2 倍とする）で、有意水準 5% で調べる。正しい記述はどれか。
        choices:
          - '両側 $p$ 値は «p2» で、0.05 を下回るので帰無仮説を棄却する'
          - '両側 $p$ 値は «p1» で、0.05 を下回るので帰無仮説を棄却する'
          - '両側 $p$ 値は «p10» で、0.05 を下回るので帰無仮説を棄却する'
          - '両側 $p$ 値は «p2» で、0.05 を下回るので、$p=0.5$ である確率は «p2» である'
          - '両側 $p$ 値は «w_le» で、0.05 を上回るので棄却されない'
        answer: 0
        distractors:
          - 正解
          - 片側の確率を両側の p 値として答えた
          - 観測値ちょうどの確率 P(X=10) だけを答えた
          - p 値は「帰無仮説が正しい確率」ではない
          - 観測値以下の側の確率 P(X≦10) を p 値とした（向きが逆）
        explanation: |
          **方針** 帰無仮説のもとで $X\sim B(12,0.5)$。観測値 10 は上側に偏っているので、片側の確率 $P(X\ge10)$ を求めて 2 倍する（$p=0.5$ では分布が対称なので、「確率が観測値以下の値をすべて足す」方法と一致する）。

          **途中式**
          $$P(X\ge10)=\frac{\binom{12}{10}+\binom{12}{11}+\binom{12}{12}}{2^{12}}=\frac{66+12+1}{4096}=\frac{79}{4096}=«p1_4»$$
          両側 $p$ 値は $2\times«p1_4»=«p2_4»$ で、0.05 を下回る。

          **答え** 両側 $p$ 値 «p2» で、帰無仮説を棄却する

          **間違えやすい点** $p$ 値は「帰無仮説が正しいとしたとき、観測値と同じかそれ以上に極端な結果が出る確率」で、帰無仮説が正しい確率ではない。
          $p\ne0.5$ のときは分布が対称でないので、両側 $p$ 値の作り方（2 倍する方法と、確率の小さい値を足す方法）で値が変わることがある。

  - id: s17p12
    title: ホテルチェーンの顧客満足度
    context: |
      3 つのホテルチェーン（比べたい対象なので固定効果）から、それぞれ 4 つのホテルを無作為に選び（ホテルは変量効果）、各ホテルで 5 人の宿泊客に満足度を答えてもらった。
      ホテルはチェーンの中に入れ子になっている（枝分かれ型の計画）。分散分析の結果は次のとおり。

      | 要因 | 平均平方 | 自由度 |
      |---|---|---|
      | チェーン | «msa» | 2 |
      | チェーン内のホテル | «msb» | 9 |
      | 誤差（ホテル内の客） | «mse» | 48 |
    items:
      - id: s17p12a
        chapter: 20
        terms: [expected-mean-square, fixed-and-random-effects, one-way-anova]
        topic: チェーンの中にホテルが入れ子になった変量効果の計画でチェーン間の差をホテルの平均平方で割ったF値で検定しホテル間の分散成分を求める
        level: 標準
        definition: false
        type: choice
        question: |
          チェーンの効果の検定と、ホテル間の分散成分 $\sigma_B^2$ の推定値の組として正しいものはどれか。必要なら $F_{0.05}(2,9)=«f29»$、$F_{0.05}(2,48)=«f248»$ を使え。
        choices:
          - '$F=«F»$ で «f29» を下回り、チェーン間の差は有意でない。$\hat\sigma_B^2=«vb»$'
          - '$F=«w_F»$ で «f248» を上回り、チェーン間の差は有意である。$\hat\sigma_B^2=«vb»$'
          - '$F=«F»$ で «f29» を下回り、有意でない。$\hat\sigma_B^2=«w_vb1»$'
          - '$F=«F»$ で «f29» を下回り、有意でない。$\hat\sigma_B^2=«w_vb2»$'
          - '$F=«w_F»$ で «f29» を上回り、チェーン間の差は有意である。$\hat\sigma_B^2=«vb»$'
        answer: 0
        distractors:
          - 正解
          - 分母に誤差の平均平方を使った（ホテルのばらつきを無視した）
          - ホテル間の分散成分を MS_B − MS_E とし、1 ホテルあたりの人数 5 で割らなかった
          - ホテル間の分散成分を MS_B/5 とし、誤差の分を引かなかった
          - 分母を誤差にしたうえで、自由度 (2,9) の点と比べた
        explanation: |
          **方針** 期待平均平方は、誤差 $\sigma^2$、ホテル $\sigma^2+5\sigma_B^2$、チェーン $\sigma^2+5\sigma_B^2+(\text{チェーンの効果})$。チェーンの効果がないとき、チェーンの平均平方の期待値はホテルの平均平方の期待値と同じなので、分母はホテルの平均平方。

          **途中式**
          $$F=\frac{«msa»}{«msb»}=«F»\quad(\text{自由度 }2,\ 9),\qquad \hat\sigma_B^2=\frac{«msb»-«mse»}{5}=«vb»$$

          **答え** $F=«F»$ で有意でない。$\hat\sigma_B^2=«vb»$

          **間違えやすい点** 誤差の平均平方で割ると $F=«w_F»$ で有意になってしまう。チェーンの比較では「ホテル」が反復の単位で、同じホテルの客の答えは似ているので、客の人数を反復とみなすと自由度を過大に数えることになる（擬似反復）。

