        chapter: 10
        terms: [uniformly-most-powerful-test, monotone-likelihood-ratio, rejection-region, chi-squared-distribution]
        topic: 指数分布の平均所要時間が基準より長いかの一様最強力検定の棄却限界をカイ二乗分布で求める
        level: 標準
        definition: false
        type: numeric
        question: |
          帰無仮説 $H_0:\theta=«th0»$、対立仮説 $H_1:\theta>«th0»$ の有意水準 5% の検定を考える。この分布族は $T$ について単調尤度比をもつので、
          「$T>c$ なら棄却する」検定が一様最強力検定になる。棄却限界 $c$ を求めよ。
          必要なら、$2T/\theta$ が自由度 $2n$ のカイ二乗分布に従うことと、次の値を使え（$\chi^2_{\alpha}(m)$ は自由度 $m$ の上側 $100\alpha\%$ 点）。

          | $\chi^2_{0.05}(10)$ | $\chi^2_{0.05}(20)$ | $\chi^2_{0.95}(20)$ |
          |---|---|---|
          | «c10» | «c20» | «c95» |
        answer: «crit»
        tolerance: 0.1
        answer_format: 小数第1位まで（小数第2位を四捨五入）で答えよ。±0.1 の差まで正解とする。
        explanation: |
          **方針** $H_0$ のもとで $2T/«th0»\sim\chi^2(«dn»)$。$P(T>c)=0.05$ となる $c$ は、$2c/«th0»$ が自由度 «dn» の上側 5% 点になる値。

          **途中式**
          $$P_{\theta=«th0»}(T>c)=P\left(\chi^2(«dn»)>\frac{2c}{«th0»}\right)=0.05\iff\frac{2c}{«th0»}=«c20»$$
          $$c=\frac{«th0»\times«c20»}{2}=«crit3»$$

          **答え** $«crit_s»$（分）。«n» 件の合計が «crit_s» 分を超えたら「平均は «th0» 分より長い」と判断する。

          **間違えやすい点** 自由度は $2n=«dn»$（$n=«n»$ とすると $c=«crit_10»$）。2 で割り忘れると «crit_no2»、下側の点 «c95» を使うと «crit_low» になる。
          対立仮説が $\theta>«th0»$ なので、$T$ が大きいほうを棄却域にする（$H_0$ のもとで $T$ の期待値は «mean0»）。

