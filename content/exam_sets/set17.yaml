          - 'A×C は列 5 に現れ、$F=«F_nodf»$ は $F_{0.05}(1,2)=«f12»$ を超えないので有意でない'
          - 'A×C は列 5 に現れ、$F=«F»$ は $F_{0.05}(1,6)=«f16»$ を超えるので 5% で有意である'
          - 'A×C は列 6 に現れ、$F=«F_BC»$ なので有意でない'
