          **途中式** 割り付け：A=列 1、B=列 2、C=列 4、A×B=列 3、A×C=列 5。残る列 6・7 が誤差で、平方和 $«ss6»+«ss7»=«sse»$、自由度 2、平均平方 «mse»。
          $$F_{A\times C}=\frac{«ss5»/1}{«sse»/2}=\frac{«ss5»}{«mse»}=«F»>F_{0.05}(1,2)=«f12»$$

          **答え** 「A×C は列 5 に現れ、$F=«F»$ は $F_{0.05}(1,2)=«f12»$ を超えるので 5% で有意である」

