      - id: s17p11a
        chapter: 10
        terms: [power-function, type-i-and-ii-errors, one-sided-two-sided-test]
        topic: 平均所要時間の両側z検定で真の平均が少しずれたときの検出力を両側の棄却域の両方から求める
        level: 標準
        definition: false
        type: choice
        question: |
          真の平均が $\mu=«mu1»$ 分のとき、この検定の検出力（帰無仮説を棄却する確率）に最も近いものはどれか。
          必要なら $\Phi(0.60)=«phiA»$、$\Phi(1.36)=«phiB»$、$\Phi(2.56)=«phiC»$ を使え。
        choices:
          - '$«w_alpha»$'
          - '$«w_one»$'
          - '$«pw»$'
          - '$«w_dl»$'
          - '$«w_beta»$'
        answer: 2
        distractors:
          - 有意水準と検出力を取り違えた
          - 反対側（下側）の棄却域に入る確率を足し忘れた
          - 正解
          - 棄却点を使わず、ずれ δ だけで P(Z>δ) とした
          - 第 2 種の誤りの確率（1−検出力）を答えた
        explanation: |
          **方針** 真の平均のもとで $Z=\dfrac{\bar X-\mu_0}{\sigma/\sqrt n}$ は平均 $\delta=\dfrac{\mu-\mu_0}{\sigma/\sqrt n}$、分散 1 の正規分布に従う。両側の棄却域 $Z>1.96$ と $Z<-1.96$ に入る確率を足す。

          **途中式** $\sigma/\sqrt n=«sig»/\sqrt{«n»}=«se»$、$\delta=(«mu1»-«mu0»)/«se»=«dl»$。
          $$P(Z>1.96)=1-\Phi(1.96-«dl»)=1-\Phi(«za»)=«up»,\qquad P(Z<-1.96)=\Phi(-1.96-«dl»)=1-\Phi(«zb»)=«lo»$$
          $$\text{検出力}=«up»+«lo»=«pw4»\cdots$$

          **答え** $«pw»$

          **間違えやすい点** 両側検定なので、ずれと反対側の棄却域に入る確率（ここでは «lo»）も検出力に含める。差が小さいと検出力は有意水準 0.05 に近い値しかない（この計画では差 0.9 分はほとんど検出できない）。
          第 2 種の誤りの確率は $1-«pw»=«w_beta»$。
