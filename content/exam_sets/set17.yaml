      - id: s17p14a
        chapter: 27
        terms: [white-noise, autocovariance-autocorrelation, arma-model, correlogram]
        topic: ARMA11の残差の標本自己相関からリュング・ボックス統計量を作りモデルの母数を引いた自由度で判定する
