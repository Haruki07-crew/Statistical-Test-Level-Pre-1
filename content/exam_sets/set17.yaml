          | 年 | 第1四半期 | 第2四半期 | 第3四半期 | 第4四半期 |
          |---|---|---|---|---|
          | 1 年目 | «y1» | «y2» | «y3» | «y4» |
          | 2 年目 | «y5» | «y6» | «y7» | «y8» |

          1 年目第 3 四半期のトレンドを中心化 4 項移動平均（2×4 移動平均）で求め、乗法型モデルの季節指数として「実測値 ÷ トレンド」を計算する。最も近い値はどれか。
        choices:
