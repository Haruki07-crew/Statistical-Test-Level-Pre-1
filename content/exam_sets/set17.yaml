  - id: s17p05
    title: 客室アップグレード提案の受諾率
    context: |
      あるシティホテルでは、チェックインのときに有料の客室アップグレードを提案している。提案を受け入れる確率を $p$ とし、
      その事前分布として密度 $\pi(p)=2(1-p)$（$0<p<1$、ベータ分布 $\mathrm{Be}(«a0»,«b0»)$）を置く。
    items:
      - id: s17p05a
        chapter: 4
        terms: [logit-logistic-transformation, change-of-variables, prior-distribution]
        topic: 受諾率のベータ事前分布をロジット変換した対数オッズの事前密度をヤコビアンで求める
        level: 応用
        definition: false
        type: choice
        question: |
          受諾の対数オッズ $\theta=\log\dfrac{p}{1-p}$（$-\infty<\theta<\infty$）について、上の事前分布から導かれる $\theta$ の密度関数として正しいものはどれか。
        choices:
          - '$\dfrac{2}{1+e^{\theta}}$'
          - '$\dfrac{2e^{\theta}}{(1+e^{\theta})^{3}}$'
          - '$\dfrac{2e^{2\theta}}{(1+e^{\theta})^{3}}$'
          - '$\dfrac{2(1+e^{\theta})}{e^{\theta}}$'
          - '$\dfrac{2e^{\theta}}{(1+e^{\theta})^{2}}$'
        answer: 1
        distractors:
          - ヤコビアン dp/dθ を掛け忘れた
          - 正解
          - p と 1−p を取り違え、1−p=e^θ/(1+e^θ) とした
          - ヤコビアンを逆数（dθ/dp）で掛けた
          - 事前密度の (1−p) を落とし、ヤコビアン 2p(1−p) だけを残した
        explanation: |
          **方針** $\theta=\log\frac{p}{1-p}$ は単調増加なので、逆変換 $p=\dfrac{e^{\theta}}{1+e^{\theta}}$ を代入し、ヤコビアン $\left|\dfrac{dp}{d\theta}\right|$ を掛ける。

          **途中式** $\dfrac{dp}{d\theta}=\dfrac{e^{\theta}}{(1+e^{\theta})^2}=p(1-p)$、$1-p=\dfrac{1}{1+e^{\theta}}$ より
          $$f(\theta)=\pi(p)\left|\frac{dp}{d\theta}\right|=2(1-p)\cdot p(1-p)=2\cdot\frac{1}{1+e^{\theta}}\cdot\frac{e^{\theta}}{(1+e^{\theta})^2}=\frac{2e^{\theta}}{(1+e^{\theta})^3}$$
          確認：$\int_{-\infty}^{\infty}f(\theta)\,d\theta=\int_0^1 2(1-p)\,dp=1$。

          **答え** $\dfrac{2e^{\theta}}{(1+e^{\theta})^{3}}$

          **間違えやすい点** ヤコビアンを掛け忘れた $\dfrac{2}{1+e^{\theta}}$ は積分が発散し、密度にならない。$1-p=\dfrac{1}{1+e^{\theta}}$ と $p=\dfrac{e^{\theta}}{1+e^{\theta}}$ を取り違えると $\mathrm{Be}(2,1)$ の場合の式になる。
          密度の形は、どのパラメータ（$p$ か $\theta$ か）で表すかによって変わる。

      - id: s17p05b
        chapter: 31
        terms: [posterior-mean-map, posterior-distribution, beta-binomial-model]
        topic: 受諾率の事後分布の最頻値（MAP推定値）が確率の尺度とロジットの尺度で異なることを確かめる
        level: 応用
        definition: false
        type: numeric
        question: |
          ある週に «m» 組に提案したところ、«y» 組が受け入れた（$p$ が与えられたとき各組は独立に確率 $p$ で受け入れるとする）。
          前問の対数オッズ $\theta$ について事後密度を最大にする値（$\theta$ の MAP 推定値）$\hat\theta$ を求め、それを確率 $\hat p=\dfrac{e^{\hat\theta}}{1+e^{\hat\theta}}$ に直した値を答えよ。
        answer: «mth»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $p$ の事後分布はベータ分布。それを前問と同じく $\theta$ に変数変換すると、ヤコビアン $p(1-p)$ の分だけ指数が 1 ずつ増える。その最大点を求める。

          **途中式** $p$ の事後密度は $\propto p^{«y»}(1-p)^{«my»}\cdot(1-p)=p^{«a1»-1}(1-p)^{«b1»-1}$（$\mathrm{Be}(«a1»,«b1»)$）。$\theta$ の事後密度は
          $$g(\theta)\propto p^{«a1»-1}(1-p)^{«b1»-1}\cdot p(1-p)=p^{«a1»}(1-p)^{«b1»},\qquad p=\frac{e^\theta}{1+e^\theta}$$
          $\log g=«a1»\log p+«b1»\log(1-p)$ を $\theta$ で微分すると、$dp/d\theta=p(1-p)$ より
          $$\frac{d\log g}{d\theta}=\left(\frac{«a1»}{p}-\frac{«b1»}{1-p}\right)p(1-p)=«a1»(1-p)-«b1»p=0\iff p=\frac{«a1»}{«ab»}=«mth4»\cdots$$

          **答え** $«mth_s»$

          **間違えやすい点** $p$ の尺度での MAP は $\mathrm{Be}(«a1»,«b1»)$ の最頻値 $(«a1»-1)/(«ab»-2)=«a1m»/«abm»=«mp»$ で、$\theta$ の尺度で求めて戻した値とは一致しない。最頻値はパラメータの取り方で変わる（中央値などの分位点は単調変換で対応がとれる）。
          観測割合 $«y»/«m»=«mle»$ は事前分布を使わない最尤推定値。なお、この例では $\theta$ の MAP を戻した値は事後平均 $«a1»/«ab»$ と一致する。

