      そこで、リネン・清掃の委託単価 $Z$ を操作変数として使う。$Z$ は費用を通じて価格に影響するが、需要の誤差 $u$ とは無相関と仮定する。
      標本分散と標本共分散は次のとおりだった。

      | | $Z$ | $\log P$ | $\log Q$ |
      |---|---|---|---|
      | $Z$ | «vz» | «czp» | «czq» |
      | $\log P$ | «czp» | «vp» | «cpq» |
      | $\log Q$ | «czq» | «cpq» | «vq» |
    items:
      - id: s17p11a
        chapter: 19
        terms: [instrumental-variable-method, endogeneity, two-stage-least-squares]
        topic: 価格が内生的な客室需要関数で費用側の操作変数から価格弾力性を推定する
        level: 標準
        definition: false
        type: choice
        question: |
          操作変数法（2 段階最小二乗法と同じ）による価格弾力性 $\beta$ の推定値に最も近いものはどれか。
        choices:
          - '$«iv»$'
          - '$«rf»$'
          - '$«inv»$'
          - '$«czq_vp»$'
          - '$«ols»$'
        answer: 0
        distractors:
          - 正解
          - 誘導形の係数 Cov(Z,logQ)/Var(Z) を答え、第 1 段階の係数で割らなかった
          - 比を逆にして Cov(Z,logP)/Cov(Z,logQ) とした
          - 分母に Cov(Z,logP) ではなく Var(logP) を使った
          - 内生性を無視した最小二乗推定値 Cov(logP,logQ)/Var(logP) を答えた
        explanation: |
          **方針** 説明変数・操作変数が 1 つずつのとき、操作変数推定量は $\hat\beta_{IV}=\dfrac{\mathrm{Cov}(Z,\log Q)}{\mathrm{Cov}(Z,\log P)}$。
          2 段階で見ると、第 1 段階 $\log P$ を $Z$ に回帰した係数 $\mathrm{Cov}(Z,\log P)/\mathrm{Var}(Z)$ で、誘導形の係数 $\mathrm{Cov}(Z,\log Q)/\mathrm{Var}(Z)$ を割ったものになる。

          **途中式**
          $$\hat\beta_{IV}=\frac{«czq»}{«czp»}=«iv»$$
          2 段階で見ると、第 1 段階 $«czp»/«vz»=«fs»$、誘導形 $«czq»/«vz»=«rf»$ で、$«rf»/«fs»=«iv»$。

          **答え** $«iv»$

          **間違えやすい点** 最小二乗推定値は $«cpq»/«vp»=«ols»$ で、需要が多い週ほど価格が高いという正の相関（誤差と価格の相関）を拾い、弾力性を 0 の側に偏らせている。
          誘導形の係数 «rf» だけでは「委託単価 1 単位あたり」の効果であり、価格への効き方（第 1 段階の «fs»）で割る必要がある。

