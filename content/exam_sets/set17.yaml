          - 正解
          - 重み (n+2)/(n−k) のないボックス・ピアース統計量を使った（指定と違う）
          - n(n+2) を掛け忘れ、自己相関の 2 乗和だけを統計量にした
          - 棄却の意味を逆にした
        explanation: |
          **方針** リュング・ボックス統計量は $Q=n(n+2)\sum_{k=1}^{K}\dfrac{r_k^2}{n-k}$。ARMA$(p,q)$ の残差に使うときは、推定した係数の数だけ自由度を減らし、自由度 $K-p-q$ のカイ二乗分布と比べる。

          **途中式**
          $$\sum_{k=1}^{3}\frac{r_k^2}{n-k}=\frac{«r1s»}{«n1»}+\frac{«r2s»}{«n2»}+\frac{«r3s»}{«n3»}=«u1»+«u2»+«u3»=«usum»$$
          $$Q=«n»\times(«n»+2)\times«usum»=«nn2»\times«usum»=«Q»$$
          自由度は $«K»-1-1=«df»$ で、$Q=«Q»>\chi^2_{0.05}(1)=«c1»$ なので、「残差はホワイトノイズ」という帰無仮説を棄却する。

          **答え** 「$Q=«Q»$ で、自由度 1 の «c1» を超えるので、残差に自己相関が残っている（モデルを見直す）」

          **間違えやすい点** 自由度をラグの数 3 のままにすると «c3» と比べて棄却しない（誤った結論）。$\phi$ と $\theta$ を推定した分だけ残差の自己相関は小さくなりやすいので、その分を自由度から引く。
          ボックス・ピアース統計量 $n\sum r_k^2=«bp»$ は小標本で小さめになる。$Q$ が大きいほど自己相関が残っていることを示す。
