          $$h_1=\max(0,\ «w10»+«w11»x_1«w12»x_2),\quad h_2=\max(0,\ «w20»+«w21»x_1+«w22»x_2),\quad \hat y=«v0»+«v1»h_1+«v2»h_2$$
          を学習した（$\max(0,u)$ は ReLU 関数）。$x_1=«x1»$、$x_2=«x2»$ のときの予測値 $\hat y$ はどれか。
        choices:
          - '$«y_nob»$'
          - '$«y_norelu»$'
          - '$«y»$'
          - '$«y_nohb»$'
          - '$«y_bias»$'
        answer: 2
