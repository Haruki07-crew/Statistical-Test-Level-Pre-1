        choices:
          - '$t=«t0»$ で $|t|>«t49»$ なので、弾力性は $-1$ と異なる'
          - '$t=«t»$ で $|t|>«t49»$ なので、弾力性は $-1$ と異なり、需要は価格に対して弾力的（値上げで売上が減る）といえる'
          - '$t=«t»$ は $-«t49»$ より小さいので、帰無仮説を採択する'
          - '$t=«bp1»$ で $|t|<«t49»$ なので、弾力性は $-1$ と異なるとはいえない'
          - '推定値 «b» は $-1$ より小さいので、検定をしなくても需要は弾力的と結論できる'
        answer: 1
        distractors:
          - 帰無仮説の値を 0 にして検定した
          - 正解
          - 棄却域の向きを取り違えた
          - 標準誤差で割り忘れた
          - 推定値の誤差（標準誤差）を考えずに判断した
        explanation: |
          **方針** 係数が特定の値 $\beta_0$ かどうかの検定統計量は $t=(\hat\beta-\beta_0)/\mathrm{SE}$ で、自由度は $n-(\text{説明変数の数})-1=52-2-1=«df»$。

          **途中式**
          $$t=\frac{«b»-(-1)}{«se»}=\frac{«bp1»}{«se»}=«t»,\qquad |t|=«tabs»>«t49»$$
          よって 5% で棄却し、弾力性は $-1$ より小さい（絶対値が 1 より大きい）と判断する。価格を 1% 上げると販売数は約 «pct»% 減り、売上（価格×数量）は減る。

          **答え** 「$t=«t»$ で $|t|>«t49»$ なので、弾力性は $-1$ と異なり、需要は価格に対して弾力的（値上げで売上が減る）といえる」

          **間違えやすい点** 統計ソフトの出力の $t$ 値（$«t0»$）は「係数 = 0」の検定なので、そのまま使えない。帰無仮説の値 $-1$ を引いてから標準誤差で割る。
          両側検定では $|t|$ と «t49» を比べる。
      - id: s17p08b
