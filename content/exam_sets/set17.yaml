          イベントがある週の 1 つのてこ比 $h_{ii}$ と、目安 $2p/n$（$p$ は係数の数）との比較として正しいものはどれか。
        choices:
          - '$h_{ii}=«q8_h1»$ で、目安 «q8_thr» を上回る'
          - '$h_{ii}=«q8_h0»$ で、目安 «q8_thr» を下回る'
          - '$h_{ii}=«q8_w_n»$ で、目安 «q8_thr» を下回る'
          - '$h_{ii}=1$ で、その週の残差は必ず 0 になる'
          - '$h_{ii}=«q8_h1»$ だが、てこ比は目的変数の値で決まるので、需要が平常並みならてこ比は小さくなる'
        answer: 0
