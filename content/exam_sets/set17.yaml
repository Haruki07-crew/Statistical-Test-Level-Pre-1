      - id: s17p13a
        chapter: 21
        terms: [regression-estimation, simple-random-sampling, ratio-estimation]
        topic: 予約システムの平均泊数を補助情報にした回帰推定量で1組あたりの館内支出を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          1 組あたりの館内での支出 $y$（千円）と泊数 $x$ について、標本では $\bar y=«yb»$、$\bar x=«xb»$、$y$ の $x$ への標本回帰係数 $b=«b»$ だった。
          予約システムから、全宿泊客の平均泊数は $\bar X=«X»$ とわかっている。回帰推定量による 1 組あたりの平均支出の推定値はどれか。
        choices:
          - '$«bx»$'
          - '$«rev»$'
          - '$«yb»$'
          - '$«reg»$'
          - '$«ratio»$'
        answer: 3
        distractors:
          - 切片を無視して b×X̄ とした
          - 補正の向きを逆にして b(x̄−X̄) を足した
          - 補助情報を使わない標本平均を答えた
          - 正解
          - 比推定量 (ȳ/x̄)X̄ を答えた
        explanation: |
          **方針** 回帰推定量は、標本の $\bar x$ が母平均 $\bar X$ からずれている分を、回帰係数で $y$ に引き直して補正する：$\bar y_{\mathrm{reg}}=\bar y+b(\bar X-\bar x)$。

          **途中式**
          $$\bar y_{\mathrm{reg}}=«yb»+«b»\times(«X»-«xb»)=«yb»+«b»\times«dx»=«yb»+«adj»=«reg»$$

          **答え** $«reg»$（千円）

          **間違えやすい点** 標本の平均泊数 «xb» は母集団の «X» より短いので、標本平均 «yb» は過小と考えて上に補正する。向きを逆にすると «rev»。
          比推定量 $(\bar y/\bar x)\bar X=«ratio»$ は回帰直線が原点を通るときに適した推定量で、回帰推定量とは一般に一致しない。

      - id: s17p13b
        chapter: 29
        terms: [multiple-imputation, rubins-rules, missing-data-mechanism]
        topic: 世帯年収の無回答を5回の多重代入で補いルービンのルールで併合した推定値の標準誤差を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          世帯年収の質問には無回答があったため、多重代入法で $m=«m»$ 組の代入済みデータを作り、それぞれで平均世帯年収（百万円）の推定値 $Q_j$ とその分散の推定値 $U_j$ を求めた。

          | $j$ | 1 | 2 | 3 | 4 | 5 |
          |---|---|---|---|---|---|
          | $Q_j$ | «q1» | «q2» | «q3» | «q4» | «q5» |
          | $U_j$ | «u1» | «u2» | «u3» | «u4» | «u5» |

          ルービンのルールで併合した推定値 $\bar Q$ の標準誤差を求めよ（代入間分散は $m-1$ で割る不偏分散とする）。
        answer: «se»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 全分散 $T=\bar U+\left(1+\dfrac1m\right)B$ を求めて平方根をとる。$\bar U$ は代入内分散の平均、$B$ は推定値 $Q_j$ の代入間の分散。

          **途中式** $\bar Q=«qb»$、$\bar U=«W»$。各 $Q_j-\bar Q$ は «dv1», «dv2», «dv3», «dv4», «dv5» で、偏差平方和は «ssq» なので $B=«ssq»/(«m»-1)=«ssq»/«m1»=«B»$。
          $$T=«W»+«fac»\times«B»=«W»+«fB»=«T»,\qquad\sqrt{«T»}=«se4»\cdots$$

          **答え** $«se_s»$

          **間違えやすい点** 代入内分散 $\bar U$ だけを使うと $\sqrt{«W»}=«se_w»$ となり、代入による不確かさを無視して標準誤差を過小に見積もる。
          $(1+1/m)$ を付け忘れると $«se_nof»$、$B$ を $m$ で割ると $«se_bm»$ になる。

  - id: s17p14
    title: 宿泊予約サイトの口コミ評価
    context: |
      ある宿泊予約サイトで、多数のホテルについて 6 項目（清潔さ・立地・接客・朝食・設備・コストパフォーマンス）の平均評価点を集計した。
    items:
      - id: s17p14a
        chapter: 22
        terms: [kaiser-criterion, cumulative-contribution-ratio, pca-on-correlation-matrix]
        topic: 口コミ6項目の相関行列の固有値からカイザー基準と累積寄与率80%基準で主成分の数を決める
        level: 基本
        definition: false
        type: choice
        question: |
          6 項目の相関行列にもとづく主成分分析を行ったところ、固有値は大きい順に «ev1», «ev2», «ev3», «ev4», «ev5», «ev6» だった。
          採用する主成分の個数について正しいものはどれか。
        choices:
          - 'カイザー基準（固有値が 1 以上）では 3 個、累積寄与率 80% 以上となる最小の個数では 2 個を採用する'
          - 'カイザー基準でも累積寄与率 80% 基準でも 2 個を採用する'
          - 'カイザー基準では 2 個、累積寄与率 80% 以上となる最小の個数では 3 個を採用する'
          - 'カイザー基準でも累積寄与率 80% 基準でも 3 個を採用する'
          - '第 1 主成分の寄与率は $«ev1»/(«ev1»+«ev2»)\approx«c12»$ である'
        answer: 2
        distractors:
          - 2 つの基準を取り違えた
          - 累積寄与率の分母を誤り、2 個で 80% に達すると判断した
          - 正解
          - カイザー基準で 0.8 も 1 に近いとして数えた
          - 寄与率の分母を固有値の総和（相関行列では 6）ではなく採用した主成分の固有値の和にした
        explanation: |
          **方針** 相関行列の固有値の和は変数の数 $p=«p»$ に等しい。カイザー基準は固有値が 1（1 変数分の分散）以上の主成分を採用する。累積寄与率は固有値の累積和を «p» で割る。

          **途中式** 1 以上の固有値は «ev1» と «ev2» の 2 個。累積寄与率は
          $$\frac{«ev1»}{«p»}=«cum1»,\qquad\frac{«s2»}{«p»}=«cum2»,\qquad\frac{«s3»}{«p»}=«cum3»$$
          で、80% 以上になるのは 3 個目から。

          **答え** 「カイザー基準では 2 個、累積寄与率 80% 以上となる最小の個数では 3 個を採用する」

          **間違えやすい点** 寄与率の分母は全固有値の和（相関行列なら変数の数 «p»）。採用する主成分の固有値の和で割ると «c12» のように過大になる。
          2 つの基準は一般に違う個数を与えるので、どちらの基準を使ったかを明記する。

      - id: s17p14b
        chapter: 25
        terms: [factor-rotation, communality, factor-loading]
        topic: 2因子モデルの負荷量を直交回転したあとの負荷量を計算し共通性が回転で変わらないことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          同じデータに直交 2 因子モデル（因子どうしは無相関で分散 1）を当てはめ、「接客」の因子負荷量は $(«l11»,\ «l12»)$ だった。
          負荷量行列 $\Lambda$ を直交行列 $T=\begin{pmatrix}«c» & -«sn»\\ «sn» & «c»\end{pmatrix}$ で $\Lambda^{*}=\Lambda T$ と回転したとき、
          「接客」の回転後の負荷量と共通性の組として正しいものはどれか。
        choices:
          - '負荷量 $(«rt1»,\ «rt2»)$、共通性 $«comm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«rsum»$'
          - '負荷量 $(«w1»,\ «w2»)$、共通性 $«wcomm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«comm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«uniq»$'
        answer: 3
        distractors:
          - 行ベクトルに T の転置を掛けた（回転の向きを逆にした）
          - 共通性を負荷量の 2 乗和ではなく和にした
          - T の対角成分だけを掛けた（行列の積の誤り）
          - 正解
          - 共通性と独自分散を取り違えた
        explanation: |
          **方針** 行ベクトル（ある項目の負荷量）に右から $T$ を掛ける。共通性は負荷量の 2 乗和で、直交回転では行ベクトルの長さが変わらないので共通性も変わらない。

          **途中式** $(«l11»,\ «l12»)T$ の第 1 成分は $T$ の第 1 列 $(«c»,«sn»)^\top$ との内積、第 2 成分は第 2 列 $(-«sn»,«c»)^\top$ との内積：
          $$«l11»\times«c»+«l12»\times«sn»=«e1»+«e2»=«r1»,\qquad «l11»\times(-«sn»)+«l12»\times«c»=-«e3»+«e4»=«r2»$$
          共通性は回転前 $«l11»^2+«l12»^2=«comm»$、回転後 $«r1»^2+(«r2»)^2=«r1sq»+«r2sq»=«comm»$ で一致する。

          **答え** 負荷量 $(«r1»,\ «r2»)$、共通性 $«comm»$

          **間違えやすい点** $\Lambda T$ と $\Lambda T^\top$ を取り違えると $(«rt1»,\ «rt2»)$ になる。共通性は 2 乗和（和の «rsum» ではない）。
          独自分散は $1-«comm»=«uniq»$（観測変数を標準化した場合）で、共通性とは別のもの。直交回転ではモデルが再現する相関行列も変わらない。
