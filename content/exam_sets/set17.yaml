        topic: 対数正規分布に従う客単価で平均客単価を上回る客の割合を求める
        level: 基本
        definition: false
        type: choice
        question: |
          チェーン全体の客単価 $Y$ について、$\log Y$ は平均 $\mu$、標準偏差 $\sigma=«sig»$ の正規分布に従うとする。
          客単価が平均客単価 $E[Y]$ を上回る客の割合に最も近いものはどれか。必要なら次の値を使え。

          | $z$ | 0.18 | 0.30 | 0.60 |
          |---|---|---|---|
          | $\Phi(z)$ | «phiA» | «phiB» | «phiC» |
        choices:
          - '$«w_sig»$'
          - '$«ans»$'
          - '$«w_var»$'
          - '$«w_half»$'
          - '$«w_tail»$'
        answer: 1
        distractors:
          - 標準化した位置を σ/2 ではなく σ とした
          - 正解
          - 標準化した位置を σ²/2 とした（σ で割り忘れ）
          - 平均と中央値を同じとみなした
          - 平均を下回る割合（反対側）を答えた
        explanation: |
          **方針** 対数正規分布の平均は $E[Y]=e^{\mu+\sigma^2/2}$。$Y>E[Y]$ を $\log Y>\mu+\sigma^2/2$ に書き直して標準化する。

          **途中式**
          $$P(Y>E[Y])=P\left(\log Y>\mu+\frac{\sigma^2}{2}\right)=P\left(Z>\frac{\sigma^2/2}{\sigma}\right)=P\left(Z>\frac{\sigma}{2}\right)=1-\Phi(«hs»)=1-«phiB»=«ans»$$

          **答え** $«ans»$

          **間違えやすい点** 対数正規分布は右に裾が長いので、平均 $e^{\mu+\sigma^2/2}$ は中央値 $e^{\mu}$ より大きく、平均を上回る客は半分より少ない。
          標準化では $\sigma^2/2=«hs2»$ を $\sigma=«sig»$ で割って «hs» にする（割り忘れると $«w_var»$）。

      - id: s17p05b
        chapter: 11
        terms: [f-test-equal-variances, f-distribution, significance-level]
        topic: 2店舗の対数客単価の母分散が等しいかを両側5%のF検定で判定する（分散比と棄却点の選び方）
        level: 基本
        definition: false
        type: choice
        question: |
          店舗 X から «n1» 人、店舗 Y から «n2» 人の客を無作為に選び、対数客単価の標準偏差（不偏分散の平方根）を求めたところ、X は «s1»、Y は «s2» だった。
          帰無仮説「2 店舗の対数客単価の母分散は等しい」、対立仮説「等しくない」として、有意水準 5% の両側 $F$ 検定を行う。正しいものはどれか。
          必要なら次の $F$ 分布の上側パーセント点を使え（$F_{\alpha}(m,n)$ は分子の自由度 $m$、分母の自由度 $n$ の上側 $100\alpha\%$ 点）。

          | $F_{0.025}(«df1»,«df2»)$ | $F_{0.05}(«df1»,«df2»)$ | $F_{0.025}(«n1»,«n2»)$ |
          |---|---|---|
          | «f025» | «f05» | «f025b» |
        choices:
          - '$F=«F»$ は $F_{0.05}(«df1»,«df2»)=«f05»$ を超えるので、帰無仮説を棄却する'
          - '$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«Fsd»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«F»$ は $F_{0.025}(«n1»,«n2»)=«f025b»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、2 店舗の母分散は等しいことが示された'
        answer: 1
        distractors:
          - 両側検定なのに片側 5% 点と比べた
          - 正解
          - 分散ではなく標準偏差の比を F とした
          - 自由度を n1, n2 とし、1 を引かなかった
          - 帰無仮説を棄却しないことを、帰無仮説が正しいことの証明と取り違えた
        explanation: |
          **方針** 不偏分散の比 $F=s_X^2/s_Y^2$ は、帰無仮説のもとで自由度 $(n_X-1,n_Y-1)$ の $F$ 分布に従う。大きいほうの分散を分子にしたとき、両側 5% 検定では上側 2.5% 点と比べる。

          **途中式** $s_X^2=«s1»^2=«v1»$、$s_Y^2=«s2»^2=«v2»$。
          $$F=\frac{«v1»}{«v2»}=«F»,\qquad\text{自由度}(«n1»-1,«n2»-1)=(«df1»,«df2»)$$
          $F=«F»<F_{0.025}(«df1»,«df2»)=«f025»$ なので棄却しない。

          **答え** 「$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない」

          **間違えやすい点** 片側 5% 点 «f05» と比べると棄却してしまうが、それは「X のほうが分散が大きい」を対立仮説とする片側検定の判定で、データを見てから片側に変えることはできない。
          標準偏差の比 «Fsd» は $F$ 分布に従わない。自由度は $n-1$。棄却しないことは「等しいことが示された」ことを意味しない（差を検出できなかっただけ）。

      - id: s17p05c
