    context: |
      あるリゾートホテルで、宿泊客アンケートの設計と、宿泊プログラム会員の継続状況の分析を行う。
    items:
      - id: s17p07a
        chapter: 29
        terms: [censored-data, kaplan-meier-estimator, missing-data-mechanism]
        topic: 途中で追跡できなくなった会員を区間の半分だけ観察されたとみなす生命表法で3年継続率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          宿泊プログラムの新規会員 200 人を 1 年ごとに追跡した。各年の初めに会員である人数、その年に退会した人数、その年に連絡がとれなくなり追跡できなくなった人数（打ち切り）は次のとおり。

          | 年 | 年初の人数 | 退会 | 打ち切り |
          |---|---|---|---|
          | 1 年目 | «n1» | «d1» | «w1» |
          | 2 年目 | «n2» | «d2» | «w2» |
          | 3 年目 | «n3» | «d3» | «w3» |

          打ち切りはその年の途中で一様に起こるとみなし、打ち切られた人はその年の半分だけ観察されたとする生命表法（保険数理法）で、3 年間会員を続ける確率を推定せよ。
        answer: «S»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 各年の退会率を $q=d/(n-w/2)$（$n-w/2$ は実質的に危険にさらされた人数）で推定し、継続率 $1-q$ を年ごとに掛ける。打ち切りは退会とは別の理由（情報のない打ち切り）とみなす。

          **途中式**
          - 1 年目：$q_1=«d1»/(«n1»-«w1»/2)=«q1»$
          - 2 年目：$q_2=«d2»/(«n2»-«w2»/2)=«q2»$
          - 3 年目：$q_3=«d3»/(«n3»-«w3»/2)=«q3»$

          $$\hat S(3)=(1-«q1»)(1-«q2»)(1-«q3»)=«S4»$$

          **答え** $«S_s»$

          **間違えやすい点** 打ち切られた人を年初の人数のまま分母に入れると退会率を過小評価し、$\hat S(3)=«w_full»$ と大きくなる。打ち切られた人を分母から全部除くと退会率を過大評価する。
          正確な退会時期がわかる場合はカプラン・マイヤー法を使う。生命表法は、時期が区間でしかわからないときの方法である。
      - id: s17p07b
        chapter: 21
        terms: [finite-population-correction, simple-random-sampling, sampling-and-nonsampling-error]
        topic: 宿泊客2000組から満足率を推定するとき95%信頼区間の半幅を0.05以内にするのに必要な標本数を有限母集団修正つきで求める
        level: 基本
        definition: false
        type: numeric
        question: |
          前月の宿泊客 «N» 組から非復元の単純無作為抽出でアンケートの対象を選び、満足と答える割合を推定したい。95% 信頼区間の半幅を 0.05 以下にするのに必要な最小の組数を、有限母集団修正を考えて求めよ。
          割合の見込みはわからないので最も不利な $p=0.5$ とし、標準正規分布の上側 2.5% 点は 1.96 とする。
        answer: «ss_n»
        tolerance: 0.4
        answer_format: 条件を満たす最小の整数で答えよ（許容範囲 ±0.4、すなわち整数が一致したときのみ正解）。
        explanation: |
          **方針** 非復元抽出での割合の推定量の分散は $\dfrac{N-n}{N-1}\cdot\dfrac{p(1-p)}{n}$。まず有限母集団修正のない必要数 $n_0=z^2p(1-p)/e^2$ を求め、$n=\dfrac{n_0}{1+(n_0-1)/N}$ で修正する。

          **途中式**
          $$n_0=\frac{1.96^2\times0.25}{0.05^2}=«ss_n0»,\qquad n=\frac{«ss_n0»}{1+(«ss_n0»-1)/«N»}=«ss_n2»$$
          切り上げて «ss_n» 組。

          **答え** $«ss_n»$ 組

          **間違えやすい点** 有限母集団修正を使わないと 385 組と多めになる。母集団が標本に比べて十分大きいと修正の効果は小さいが、ここでは抽出率が 16% ほどになるので効く。
          $p$ の見込みがあれば $p(1-p)$ はもっと小さくでき、必要数は減る。

