    items:
      - id: s17p13a
        chapter: 22
        terms: [lagrange-multiplier-pca, principal-component, eigenvalue-and-eigenvector]
        topic: 主成分の係数ベクトルをラグランジュの未定乗数法で導く手順と最大値の意味を選ぶ
        level: 標準
        definition: true
        type: choice
        question: |
          評価項目のベクトルを $\boldsymbol X$、その分散共分散行列を $\Sigma$ とする。第 1 主成分 $\boldsymbol a^\top\boldsymbol X$ の係数ベクトル $\boldsymbol a$ の求め方として正しいものはどれか。
        choices:
