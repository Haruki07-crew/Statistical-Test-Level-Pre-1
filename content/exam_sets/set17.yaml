          - 両方の隠れユニットを 0 とした
        explanation: |
          **方針** 入力から隠れユニットの線形和を計算し、ReLU（負なら 0）を通してから、出力層の線形和をとる（順伝播）。

          **途中式**
          $$«w10»+«w11»\times«x1»+(«w12»)\times«x2»=«u1»\ \Rightarrow\ h_1=0$$
          $$«w20»+«w21»\times«x1»+«w22»\times«x2»=«u2»\ \Rightarrow\ h_2=«h2»$$
          $$\hat y=«v0»+«v1»\times0+«v2»\times«h2»=«y»$$

          **答え** $«y»$

          **間違えやすい点** ReLU を通さずに $h_1=«u1»$ を使うと $«y_norelu»$。切片（バイアス）を忘れないこと。
