        explanation: |
          **方針** 状態 $i$ から始めたときの退会までの月数の期待値を $m_i$ とおく。1 か月在籍したあと、翌月の状態に応じて同じ問題が繰り返されるので、一歩先で条件づけた連立方程式を立てる。

          **途中式**
          $$m_1=1+«p11»\,m_1+«p12»\,m_2,\qquad m_2=1+«p21»\,m_1+«p22»\,m_2$$
          （退会した場合は 0 か月を足す。）整理すると
          $$«a11»\,m_1-«p12»\,m_2=1,\qquad -«p21»\,m_1+«a22»\,m_2=1$$
          行列式は $«a11»\times«a22»-«p12»\times«p21»=«det»$。クラメルの公式より
          $$m_1=\frac{1\times«a22»+«p12»\times1}{«det»}=«m1_4»\cdots,\qquad m_2=\frac{«a11»\times1+«p21»\times1}{«det»}=«m2»$$
          （基本行列 $N=(I-Q)^{-1}$ で見ると、利用中として過ごす月数の期待値 $«n11»$ と休眠として過ごす月数の期待値 $«n12»$ の和である。）

          **答え** $«m1_s»$ か月

          **間違えやすい点** 休眠を経由する道を無視して、利用中から毎月 «p13» の確率で退会するとみると $1/«p13»=«naive»$ か月になる。利用中で過ごす月数 $«n11»$ だけを答えるのも誤り（休眠の月も在籍に含む）。
