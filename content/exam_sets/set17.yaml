          - '制約 $\boldsymbol a^\top\Sigma\boldsymbol a=1$ のもとで $\boldsymbol a^\top\boldsymbol a$ を最大にする $\boldsymbol a$ を求め、最大値は $\Sigma$ の最小固有値になる'
          - '制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にする。ラグランジュ乗数法から $\Sigma\boldsymbol a=\lambda\boldsymbol a$ が導かれ、最大値（第 1 主成分の分散）は $\Sigma$ の最大固有値 $\lambda_1$ である'
          - '制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にし、最大値は最大固有値の平方根 $\sqrt{\lambda_1}$ である'
          - '第 2 主成分は、第 1 主成分と同じく $\boldsymbol a^\top\boldsymbol a=1$ の制約だけで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にすれば得られる'
        answer: 2
        distractors:
          - 制約がないと a を定数倍していくらでも分散を大きくできる
          - 目的と制約を入れ替えた（最大値も 1/最小固有値 になり意味が違う）
          - 正解
          - 分散と標準偏差を取り違えた
          - 第 1 主成分との直交（無相関）の制約を付け忘れた（同じ解になってしまう）
        explanation: |
          **方針** 分散 $V[\boldsymbol a^\top\boldsymbol X]=\boldsymbol a^\top\Sigma\boldsymbol a$ は $\boldsymbol a$ を定数倍すると大きくなるので、長さを 1 に固定して最大化する。

          **途中式** $L=\boldsymbol a^\top\Sigma\boldsymbol a-\lambda(\boldsymbol a^\top\boldsymbol a-1)$ を $\boldsymbol a$ で微分して 0 とおくと $2\Sigma\boldsymbol a-2\lambda\boldsymbol a=\boldsymbol 0$、すなわち $\Sigma\boldsymbol a=\lambda\boldsymbol a$。
          このとき $\boldsymbol a^\top\Sigma\boldsymbol a=\lambda\boldsymbol a^\top\boldsymbol a=\lambda$ なので、分散を最大にするのは最大固有値 $\lambda_1$ の固有ベクトル。第 2 主成分は、$\boldsymbol a^\top\boldsymbol a=1$ に加えて第 1 主成分の係数ベクトルと直交する条件のもとで最大化し、2 番目に大きい固有値の固有ベクトルになる。

          **答え** 「制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にする。$\Sigma\boldsymbol a=\lambda\boldsymbol a$ が導かれ、最大値は $\lambda_1$」

          **間違えやすい点** 主成分の分散は固有値そのもの（標準偏差が $\sqrt{\lambda}$）。第 2 主成分に直交の制約を付けないと、また第 1 主成分が得られてしまう。

      - id: s17p13b
        chapter: 25
        terms: [varimax-rotation, factor-rotation, factor-loading, communality]
        topic: 2つの直交回転の解でバリマックス基準（負荷量の2乗の分散の和）を計算し採用される解を選ぶ
        level: 標準
        definition: false
        type: choice
        question: |
          3 項目（接客・朝食・設備）に直交 2 因子モデルを当てはめた。回転前の負荷量 A と、それを直交回転した負荷量 B は次のとおりである。

          | 項目 | A 第1因子 | A 第2因子 | B 第1因子 | B 第2因子 |
          |---|---|---|---|---|
          | 接客 | «a11» | «a12» | «b11» | «b12» |
          | 朝食 | «a21» | «a22» | «b21» | «b22» |
          | 設備 | «a31» | «a32» | «b31» | «b32» |

          バリマックス基準 $V=\sum_{j=1}^{2}\left\{\dfrac13\sum_{i=1}^{3}\ell_{ij}^4-\left(\dfrac13\sum_{i=1}^{3}\ell_{ij}^2\right)^2\right\}$（各因子で負荷量の 2 乗の分散を求めて足したもの）を大きくする解を採用する。
          採用される解とその $V$ の値の組として正しいものはどれか。
        choices:
          - 'A（$V=«vA»$）'
          - 'B（$V=«vB_nop»$）'
          - 'B（$V=«vB_nosq»$）'
          - 'B（$V=«vB»$）'
          - 'A と B は共通性が等しいので $V$ も等しく、どちらでもよい'
        answer: 3
        distractors:
          - V の小さいほうを選んだ
          - 分散を求めるときに項目数 3 で割り忘れた
          - 負荷量を 2 乗せず、負荷量そのものの分散を足した
          - 正解
          - 直交回転で共通性は変わらないが、負荷量の配分（単純構造の度合い）と V は変わる
        explanation: |
          **方針** 各因子について負荷量の 2 乗を並べ、その平均と分散（3 で割る）を求めて 2 因子分を足す。2 乗が 0 か大きい値に分かれる（単純構造に近い）ほど $V$ は大きい。

          **途中式** B の第 1 因子の 2 乗は «b11q», «b21q», «b31q» で平均 «mB1»、分散 $\frac13(«b11q»^2+«b21q»^2+«b31q»^2)-«mB1»^2=«vB1»$。
          第 2 因子の 2 乗は «b12q», «b22q», «b32q» で平均 «mB2»、分散 «vB2»。よって $V_B=«vB1»+«vB2»=«vB4»$。
          同様に A では $V_A=«vA4»$。$V_B>V_A$ なので B を採用する。

          **答え** B（$V=«vB»$）

          **間違えやすい点** 直交回転では各項目の共通性（例：接客は A でも B でも $«comm1»$）は変わらないが、因子への負荷の配分が変わるので $V$ は変わる。
          $V$ は負荷量の 2 乗についての分散で、負荷量そのものの分散ではない。
      - id: s17p13c
        chapter: 26
        terms: [multiple-correspondence-analysis, correspondence-analysis]
        topic: 多重対応分析で指示行列の総イナーシャと次元数を質問数とカテゴリー数から求める
        level: 標準
        definition: false
        type: choice
        question: |
          同じサイトの利用者アンケートの 3 つの質問（利用目的：3 カテゴリー、予約経路：4 カテゴリー、同行者：2 カテゴリー）の回答から、
          回答者×カテゴリーの 0/1 の指示行列を作り、多重対応分析（指示行列の対応分析）を行う。指示行列の総イナーシャと、意味のある次元の最大数の組として正しいものはどれか。
        choices:
          - '総イナーシャ $«w_jq»$、次元数 «J»'
          - '総イナーシャ $«inert»$、次元数 «w_dimj»'
          - '総イナーシャ $«w_jmq»$、次元数 «dim»'
          - '総イナーシャ $«inert»$、次元数 «dim»'
          - '総イナーシャ $«w_q»$、次元数 «dim»'
        answer: 3
        distractors:
          - 総カテゴリー数を質問数で割り、1 を引かなかった
          - 次元数をカテゴリー数 − 1 とした（質問ごとに 1 次元ずつ失われることを忘れた）
          - 質問数で割り忘れた
          - 正解
          - 1 次元あたりの平均の目安 1/Q と取り違えた
        explanation: |
          **方針** 指示行列では、質問 $q$ の $J_q$ 個のカテゴリーの列の和が常に 1 になる。そのため総イナーシャは $\dfrac{J-Q}{Q}$（$J$ はカテゴリーの総数、$Q$ は質問数）、次元数は $J-Q$ になる。

          **途中式** $J=3+4+2=«J»$、$Q=«Q»$。
          $$\text{総イナーシャ}=\frac{J-Q}{Q}=\frac{«J»-«Q»}{«Q»}=«inert»,\qquad\text{次元数}=J-Q=«dim»$$
          （質問ごとに見ると、質問 $q$ は $(J_q-1)/Q$ ずつ総イナーシャに寄与する。）

          **答え** 総イナーシャ $«inert»$、次元数 «dim»

          **間違えやすい点** 総イナーシャはデータの中身によらず質問とカテゴリーの数だけで決まるので、通常の対応分析のように「関連の強さ」とは読めない。そのため多重対応分析では寄与率が小さく出やすく、補正した寄与率が使われることもある。
