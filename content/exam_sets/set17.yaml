        terms: [ci-two-sample-mean-difference, pooled-variance, t-distribution]
        topic: 2店舗の対数客単価の母平均の差の95%信頼区間をプールした分散のt区間で求め下限を出す
        level: 標準
        definition: false
        type: numeric
        question: |
          前問と同じ標本で、対数客単価の標本平均は X が «m1»、Y が «m2» だった。2 店舗の母分散は等しいと仮定し、
          母平均の差 $\mu_X-\mu_Y$ の 95% 信頼区間を $t$ 分布で作る。その**下限**を求めよ。$t$ 分布の上側 2.5% 点は $t_{0.025}(«df»)=«t27»$ である。
        answer: «lo»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。負の値は符号もつけて答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 2 群の平方和を合わせたプールした分散 $s_p^2$ を作り、$(\bar x-\bar y)\pm t_{0.025}(n_X+n_Y-2)\sqrt{s_p^2(1/n_X+1/n_Y)}$ とする。

          **途中式**
          $$s_p^2=\frac{(«n1»-1)\times«v1»+(«n2»-1)\times«v2»}{«n1»+«n2»-2}=\frac{«ss1»+«ss2»}{«df»}=\frac{«ssum»}{«df»}=«sp2»$$
          $$\mathrm{SE}=\sqrt{«sp2»\times\left(\frac1{«n1»}+\frac1{«n2»}\right)}=\sqrt{«sp2»\times«inv»}=\sqrt{«se2»}=«se»$$
          $$\text{下限}=«dm»-«t27»\times«se»=«dm»-«hw»=«lo4»\cdots$$

          **答え** $«lo_s»$（区間は 0 を含むので、5% 水準では平均の差は有意でない）

          **間違えやすい点** プールした分散の分母は $n_X+n_Y-2=«df»$（«n1»+«n2» で割ると $«lo_n»$）。$t$ 点の代わりに 1.96 を使うと $«lo_z»$、等分散を仮定しない $\sqrt{s_X^2/n_X+s_Y^2/n_Y}$ を使うと $«lo_w»$ になる。
          対数の差 «dm» は、客単価の中央値の比 $e^{«dm»}$ を表す。

  - id: s17p06
    title: 客室アップグレード提案の受諾率
    context: |
      あるシティホテルでは、チェックインのときに有料の客室アップグレードを提案している。提案を受け入れる確率を $p$ とし、
      その事前分布として密度 $\pi(p)=2(1-p)$（$0<p<1$、ベータ分布 $\mathrm{Be}(«a0»,«b0»)$）を置く。
    items:
      - id: s17p06a
        chapter: 4
        terms: [logit-logistic-transformation, change-of-variables, prior-distribution]
        topic: 受諾率のベータ事前分布をロジット変換した対数オッズの事前密度をヤコビアンで求める
        level: 応用
        definition: false
        type: choice
        question: |
          受諾の対数オッズ $\theta=\log\dfrac{p}{1-p}$（$-\infty<\theta<\infty$）について、上の事前分布から導かれる $\theta$ の密度関数として正しいものはどれか。
        choices:
          - '$\dfrac{2}{1+e^{\theta}}$'
          - '$\dfrac{2e^{\theta}}{(1+e^{\theta})^{3}}$'
          - '$\dfrac{2e^{2\theta}}{(1+e^{\theta})^{3}}$'
          - '$\dfrac{2(1+e^{\theta})}{e^{\theta}}$'
          - '$\dfrac{2e^{\theta}}{(1+e^{\theta})^{2}}$'
        answer: 1
        distractors:
          - ヤコビアン dp/dθ を掛け忘れた
          - 正解
          - p と 1−p を取り違え、1−p=e^θ/(1+e^θ) とした
          - ヤコビアンを逆数（dθ/dp）で掛けた
          - 事前密度の (1−p) を落とし、ヤコビアン 2p(1−p) だけを残した
        explanation: |
          **方針** $\theta=\log\frac{p}{1-p}$ は単調増加なので、逆変換 $p=\dfrac{e^{\theta}}{1+e^{\theta}}$ を代入し、ヤコビアン $\left|\dfrac{dp}{d\theta}\right|$ を掛ける。

          **途中式** $\dfrac{dp}{d\theta}=\dfrac{e^{\theta}}{(1+e^{\theta})^2}=p(1-p)$、$1-p=\dfrac{1}{1+e^{\theta}}$ より
          $$f(\theta)=\pi(p)\left|\frac{dp}{d\theta}\right|=2(1-p)\cdot p(1-p)=2\cdot\frac{1}{1+e^{\theta}}\cdot\frac{e^{\theta}}{(1+e^{\theta})^2}=\frac{2e^{\theta}}{(1+e^{\theta})^3}$$
          確認：$\int_{-\infty}^{\infty}f(\theta)\,d\theta=\int_0^1 2(1-p)\,dp=1$。

          **答え** $\dfrac{2e^{\theta}}{(1+e^{\theta})^{3}}$

          **間違えやすい点** ヤコビアンを掛け忘れた $\dfrac{2}{1+e^{\theta}}$ は積分が発散し、密度にならない。$1-p=\dfrac{1}{1+e^{\theta}}$ と $p=\dfrac{e^{\theta}}{1+e^{\theta}}$ を取り違えると $\mathrm{Be}(2,1)$ の場合の式になる。
          密度の形は、どのパラメータ（$p$ か $\theta$ か）で表すかによって変わる。

      - id: s17p06b
        chapter: 31
        terms: [posterior-mean-map, posterior-distribution, beta-binomial-model]
        topic: 受諾率の事後分布の最頻値（MAP推定値）が確率の尺度とロジットの尺度で異なることを確かめる
        level: 応用
        definition: false
        type: numeric
        question: |
          ある週に «m» 組に提案したところ、«y» 組が受け入れた（$p$ が与えられたとき各組は独立に確率 $p$ で受け入れるとする）。
          前問の対数オッズ $\theta$ について事後密度を最大にする値（$\theta$ の MAP 推定値）$\hat\theta$ を求め、それを確率 $\hat p=\dfrac{e^{\hat\theta}}{1+e^{\hat\theta}}$ に直した値を答えよ。
        answer: «mth»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** $p$ の事後分布はベータ分布。それを前問と同じく $\theta$ に変数変換すると、ヤコビアン $p(1-p)$ の分だけ指数が 1 ずつ増える。その最大点を求める。

          **途中式** $p$ の事後密度は $\propto p^{«y»}(1-p)^{«my»}\cdot(1-p)=p^{«a1»-1}(1-p)^{«b1»-1}$（$\mathrm{Be}(«a1»,«b1»)$）。$\theta$ の事後密度は
          $$g(\theta)\propto p^{«a1»-1}(1-p)^{«b1»-1}\cdot p(1-p)=p^{«a1»}(1-p)^{«b1»},\qquad p=\frac{e^\theta}{1+e^\theta}$$
          $\log g=«a1»\log p+«b1»\log(1-p)$ を $\theta$ で微分すると、$dp/d\theta=p(1-p)$ より
          $$\frac{d\log g}{d\theta}=\left(\frac{«a1»}{p}-\frac{«b1»}{1-p}\right)p(1-p)=«a1»(1-p)-«b1»p=0\iff p=\frac{«a1»}{«ab»}=«mth4»\cdots$$

          **答え** $«mth_s»$

          **間違えやすい点** $p$ の尺度での MAP は $\mathrm{Be}(«a1»,«b1»)$ の最頻値 $(«a1»-1)/(«ab»-2)=«a1m»/«abm»=«mp»$ で、$\theta$ の尺度で求めて戻した値とは一致しない。最頻値はパラメータの取り方で変わる（中央値などの分位点は単調変換で対応がとれる）。
          観測割合 $«y»/«m»=«mle»$ は事前分布を使わない最尤推定値。なお、この例では $\theta$ の MAP を戻した値は事後平均 $«a1»/«ab»$ と一致する。

  - id: s17p07
    title: 会社員のランチの店選び
    context: |
      オフィス街の会社員がランチに使う店を、自店 A と競合店 B, C の 3 つとする。ある会社員が毎週 1 回ランチに行く店は、次の推移確率行列（行が今週、列が翌週の店）をもつ時間的に一様なマルコフ連鎖に従うとする。
      $$P=\begin{pmatrix}«p00» & «p01» & «p02»\\ «p10» & «p11» & «p12»\\ «p20» & «p21» & «p22»\end{pmatrix}\quad(\text{行・列とも A, B, C の順})$$
    items:
      - id: s17p07a
        chapter: 14
        terms: [stationary-distribution, positive-recurrence, first-passage-time]
        topic: 3店舗を移り変わる客の定常分布から自店に再び来るまでの平均再帰時間を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          ある週に A に来た客が、次に**再び** A に来るまでの週数の期待値（平均再帰時間）を求めよ（翌週にまた A に来たら 1 週と数える）。
        answer: «ret»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 既約で非周期的な有限マルコフ連鎖では、状態 $i$ の平均再帰時間は定常分布の $1/\pi_i$ に等しい。まず定常分布 $\pi=\pi P$ を求める。

          **途中式** $\pi_A=1$ とおいて比 $x=\pi_B/\pi_A$、$w=\pi_C/\pi_A$ を求める。A と B についての釣り合いの式は
          $$(1-«p00»)=«p10»\,x+«p20»\,w,\qquad (1-«p11»)x=«p01»+«p21»\,w$$
          2 つ目から $x=(«p01»+«p21»w)/«a22»$、これを 1 つ目に代入して解くと $w=«w»$、$x=«x»$。
          合計は $1+x+w=«tot»$ なので $\pi_A=1/(«tot»)=«piA»$。
          $$\text{平均再帰時間}=\frac1{\pi_A}=«tot»=«ret4»\cdots$$

          **答え** $«ret_s»$ 週

          **間違えやすい点** A にとどまる確率だけから $1/(1-«p00»)=«naive»$ とするのは「A を離れるまでの週数」であり、再帰時間ではない。
          $1/P_{AA}=«inv_p»$ も誤り。定常分布 $\pi_A$ は長期的に A に来る週の割合で、その逆数が来店の平均間隔になる。

