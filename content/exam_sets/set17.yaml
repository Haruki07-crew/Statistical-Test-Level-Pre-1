      $$\log\frac{P(Y\le j\mid x)}{1-P(Y\le j\mid x)}=\theta_j-\beta x\quad(j=1,2)$$
      推定値は $\theta_1=«th1»$、$\theta_2=«th2»$、$\beta=«beta»$ だった（$\beta>0$ は会員のほうが高い満足度になりやすいことを表す）。
    items:
      - id: s17p10a
        chapter: 18
        terms: [ordered-logit-model, logistic-regression, link-function]
        topic: 3段階の満足度の比例オッズモデルで閾値と会員の係数から「普通」と答える確率を求める
        level: 標準
        definition: false
        type: choice
        question: |
          推定したモデルで、会員（$x=1$）が「普通」（$Y=2$）と答える確率に最も近いものはどれか。必要なら次の値を使え。

          | $u$ | $-2.0$ | $-1.2$ | $-0.4$ | $0.2$ | $1.0$ | $1.8$ |
          |---|---|---|---|---|---|---|
          | $e^{u}$ | «em20» | «em12» | «em04» | «e02» | «e10» | «e18» |
        choices:
          - '$«wsign»$'
          - '$«p3»$'
          - '$«ans»$'
          - '$«nonmem»$'
          - '$«cum2»$'
        answer: 2
        distractors:
          - 線形予測子の符号を逆にして θ_j+βx とした
          - 「満足」（Y=3）の確率を答えた
          - 正解
          - 非会員（x=0）の確率を答えた
          - 累積確率 P(Y≤2) を答え、P(Y≤1) を引かなかった
        explanation: |
          **方針** 累積確率 $P(Y\le j\mid x)=\dfrac{e^{\theta_j-\beta x}}{1+e^{\theta_j-\beta x}}$ を $j=1,2$ について求め、差をとる：$P(Y=2)=P(Y\le2)-P(Y\le1)$。

          **途中式** 会員では $\theta_1-\beta=«th1»-«beta»=«z1»$、$\theta_2-\beta=«th2»-«beta»=«z2»$。
          $$P(Y\le1\mid x=1)=\frac{«em20»}{«em20p1»}=«c1»,\qquad P(Y\le2\mid x=1)=\frac{«e02»}{«e02p1»}=«c2»$$
