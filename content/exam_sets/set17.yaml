  - id: s17p10
    title: 1組あたりの宿泊数
    context: |
      あるビジネスホテルで、無作為に選んだ «n» 組の宿泊数（1 泊以上）を調べたところ、合計 «tot» 泊、平均 $\bar x=«xbar»$ 泊だった。
      宿泊数 $X$ は 0 を除いたポアソン分布（ゼロ切断ポアソン分布）
      $$P(X=k)=\frac{e^{-\lambda}\lambda^k}{k!\,(1-e^{-\lambda})}\quad(k=1,2,\ldots)$$
      に従い、各組は独立とする。
    items:
      - id: s17p10a
        chapter: 8
        terms: [maximum-likelihood-estimator, score-function, likelihood-function]
        topic: 1泊以上の宿泊数をゼロ切断ポアソン分布とみて尤度方程式から最尤推定値を選ぶ
        level: 応用
        definition: false
        type: choice
        question: |
          $\lambda$ の最尤推定値に最も近いものはどれか。必要なら次の値を使え。

          | $\lambda$ | «l1» | «l2» | «l3» | «l4» | «l5» |
          |---|---|---|---|---|---|
          | $e^{-\lambda}$ | «e1» | «e2» | «e3» | «e4» | «e5» |
        choices:
          - '$«l1»$'
          - '$«l2»$'
          - '$«l3»$'
          - '$«l4»$'
          - '$«l5»$'
        answer: 2
        distractors:
          - 宿泊数から 1 を引いた平均（1 だけずらしたポアソン分布）と取り違えた
          - 尤度方程式の左辺 λ/(1−e^{−λ}) が 1.717 で、まだ 2 に届かない
          - 正解
          - 尤度方程式の左辺が 2.156 で 2 を超える（解を通り過ぎている）
          - 切断を無視して標本平均をそのまま λ の推定値にした
        explanation: |
          **方針** 対数尤度を $\lambda$ で微分して 0 とおく（スコア方程式）。切断のための因子 $1-e^{-\lambda}$ も $\lambda$ を含むので微分に入る。

          **途中式** 対数尤度は（定数を除き）
          $$\ell(\lambda)=\sum_i x_i\log\lambda-n\lambda-n\log(1-e^{-\lambda})$$
          $$\ell'(\lambda)=\frac{\sum x_i}{\lambda}-n-\frac{n e^{-\lambda}}{1-e^{-\lambda}}=\frac{\sum x_i}{\lambda}-\frac{n}{1-e^{-\lambda}}=0\iff\frac{\lambda}{1-e^{-\lambda}}=\bar x=«xbar»$$
          選択肢の値で左辺を計算すると «l1»→«g1»、«l2»→«g2»、«l3»→«g3»、«l4»→«g4»、«l5»→«g5»。«xbar» に最も近いのは $\lambda=«l3»$。

          **答え** $«l3»$

          **間違えやすい点** 0 泊のデータが観測されない（切断されている）ので、平均 «xbar» は $\lambda$ より大きくなる。標本平均をそのまま使うと $\lambda$ を過大に推定する。
          $X-1$ がポアソン分布に従う（ずらしたポアソン分布）モデルとは別物で、その場合の推定値 $\bar x-1=1.0$ とは一致しない。
