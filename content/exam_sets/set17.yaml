        answer: 2
        distractors:
          - 分散を答え、平方根をとらなかった
          - 打ち切りを無視して二項分布の標準誤差 √(S(1−S)/10) を使った
          - 正解
          - S² ではなく S を掛けた
          - S² を掛け忘れた
        explanation: |
          **方針** 退会が起きた時点ごとにリスク集合の大きさ $n_j$ と退会数 $d_j$ を数え、$\hat S(6)$ と和 $\sum d_j/\{n_j(n_j-d_j)\}$ を求める。打ち切られた人は、その時点より後のリスク集合から外れる。

          **途中式**
          - 2 か月：$n=10$、$d=1$（$\hat S=9/10$）
          - 4 か月：3+ が外れて $n=8$、$d=2$（$\hat S=0.9\times6/8=0.675$）
          - 6 か月：$n=6$、$d=1$（$\hat S=0.675\times5/6=«S»$）

          $$\sum\frac{d_j}{n_j(n_j-d_j)}=\frac1{10\times9}+\frac2{8\times6}+\frac1{6\times5}=«g1»+«g2»+«g3»=«acc»$$
          $$\widehat V=«S»^2\times«acc»=«S2»\times«acc»=«var»,\qquad\mathrm{SE}=\sqrt{«var»}=«se4»\cdots$$

          **答え** $«se»$

          **間違えやすい点** 打ち切りを無視して 10 人の二項分布とみると $«w_binom»$ になる（打ち切りによる情報の減少を反映しない）。
          $\hat S^2$ を掛け忘れると $«w_noS»$、$\hat S$ を 1 回だけ掛けると $«w_S1»$、平方根を忘れると $«w_var»$。4 か月の 2 人の退会は $d_j=2$ として 1 つの項にまとめる。

  - id: s17p09
    title: テラス席の売上と最高気温
    context: |
      あるカフェで夏の «n» 日間について、テラス席の売上 $y$（千円）を最高気温 $x$（℃）に単回帰したところ、$\hat y=«b0»+«b1»x$ だった。
      $\bar x=«xb»$、$S_{xx}=\sum(x_i-\bar x)^2=«sxx»$、残差の標準偏差（残差平方和を $n-2$ で割った値の平方根）は $s=«sres»$ である。誤差は独立に同じ正規分布に従うとする。
    items:
      - id: s17p09a
        chapter: 16
        terms: [confidence-and-prediction-interval-regression, regression-coefficient-t-test]
        topic: 最高気温30℃の日のテラス席の平均売上の95%信頼区間（予測区間ではない）の下限を求める
        level: 標準
        definition: false
        type: choice
        question: |
          最高気温が «x0»℃ の日の**平均売上** $E[y\mid x=«x0»]$ の 95% 信頼区間の下限に最も近いものはどれか。
          $t$ 分布の上側 2.5% 点は $t_{0.025}(18)=«t18»$、$t_{0.025}(19)=«t19»$、標準正規分布の上側 2.5% 点は 1.96 である。
        choices:
          - '$«lo_pi»$'
          - '$«lo»$'
          - '$«lo_z»$'
          - '$«lo_nox»$'
          - '$«lo_nosq»$'
        answer: 1
        distractors:
          - 新しい 1 日の売上の予測区間（√(1+…)）を作った
          - 正解
          - t 点の代わりに 1.96 を使った
          - (x0−x̄)²/Sxx の項を落とした
          - 平方根をとり忘れた
        explanation: |
          **方針** 平均の当てはめ値 $\hat y_0$ の標準誤差は $s\sqrt{\dfrac1n+\dfrac{(x_0-\bar x)^2}{S_{xx}}}$。自由度 $n-2=«df»$ の $t$ 点を使う。

          **途中式** $\hat y_0=«b0»+«b1»\times«x0»=«yh»$。
          $$\frac1{«n»}+\frac{(«x0»-«xb»)^2}{«sxx»}=«in»+«dxs»=«k»,\qquad\sqrt{«k»}=«sk»$$
          $$\text{半幅}=«t18»\times«sres»\times«sk»=«hw»,\qquad\text{下限}=«yh»-«hw»=«lo»$$

          **答え** $«lo»$（千円）

          **間違えやすい点** 「平均売上」の信頼区間なので、新しい 1 日の売上の予測区間（$\sqrt{1+«k»}$ を使い、半幅 «hw_pi»、下限 $«lo_pi»$）とは違う。
          $x_0$ が $\bar x$ から離れるほど区間は広くなる（$(x_0-\bar x)^2/S_{xx}$ を落とすと $«lo_nox»$）。自由度は $n-2=«df»$。

      - id: s17p09b
        chapter: 17
        terms: [normal-qq-plot, residual, residual-plot]
        topic: 残差の正規QQプロットで両端が直線から外側に外れる形から誤差の裾の重さを読み取る
        level: 基本
        definition: true
        type: choice
        question: |
          このモデルの残差の正規 QQ プロット（横軸に標準正規分布の理論分位点、縦軸に標準化残差を小さい順に並べた値）を描いたところ、
          中央付近の点はほぼ直線上にあったが、左端の数点は直線より**下**に、右端の数点は直線より**上**に大きく外れていた。この形から読み取れることとして最も適切なものはどれか。
        choices:
          - '誤差分布の裾は正規分布より軽い（極端な残差が少ない）'
          - '誤差分布は右に裾が長い（正の歪み）'
          - '誤差分布の裾は正規分布より重い（極端な残差が正規分布で期待されるより多い）'
          - '誤差の分散が説明変数とともに大きくなっている（不均一分散）'
          - '残差に正の系列相関がある'
        answer: 2
        distractors:
          - 両端の外れ方の向きを逆に読んだ（裾が軽いときは両端が内側に寄る）
          - 右に歪んだ分布の形（両端とも直線より上に曲がる）と取り違えた
          - 正解
          - QQ プロットは分布の形を見る図で、分散と説明変数の関係は残差プロットで見る
          - 系列相関は残差の時間順のプロットやダービン・ワトソン比で見る
        explanation: |
          **方針** QQ プロットでは、標本分位点が理論分位点より外側にあれば、その側の裾は正規分布より重い。両端がともに外側（左は下、右は上）に外れれば、左右の裾がともに重い。

          **途中式** 左端の点が直線より下 → 小さい側の残差が正規分布の予想より小さい（より極端）。右端の点が直線より上 → 大きい側の残差が予想より大きい。両側で極端な値が多いので、$t$ 分布のような裾の重い分布を示す。

          **答え** 「誤差分布の裾は正規分布より重い（極端な残差が正規分布で期待されるより多い）」

          **間違えやすい点** 裾が軽いときは逆に、左端が上・右端が下に寄る。右に歪んでいるときは左端も右端も直線より上に曲がる（下に凸の形）。
          不均一分散や系列相関は QQ プロットからは判断できない（残差と当てはめ値のプロット、時間順のプロットを使う）。

  - id: s17p10
    title: 客室清掃にかかる時間
    context: |
      あるホテルで、清掃スタッフの人数計画のために、無作為に選んだ «n» 室の清掃時間（分）を測った。

      «y»
    items:
      - id: s17p10a
        chapter: 19
        terms: [quantile-regression]
        topic: 切片だけの分位点回帰でチェック関数を最小にする定数として清掃時間の80%分位点を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          定数 $q$ について、チェック関数 $\rho_\tau(u)=u\,\{\tau-\mathbb{1}(u<0)\}$ の和 $\sum_{i=1}^{«n»}\rho_\tau(y_i-q)$ を最小にする $q$（切片だけの分位点回帰の推定値）を、$\tau=«tau»$ について求めよ。
        choices:
          - '$«med»$'
          - '$«mean»$'
          - '$«q_lo»$'
          - '$«q»$'
          - '$«q_hi»$'
        answer: 3
        distractors:
          - τ=0.5（中央値）の場合と取り違えた
          - 二乗誤差を最小にする平均を答えた
          - nτ=8.8 を切り捨てて 8 番目の値を答えた
          - 正解
          - 上から 2 番目（10 番目）の値を答えた
        explanation: |
          **方針** $q$ を少し増やすと、$q$ より上の観測 1 個あたり目的関数は $\tau$ 減り、$q$ より下の観測 1 個あたり $1-\tau$ 増える。傾きが負から正に変わる点が最小点である。

          **途中式** 小さい順に並べると «ys»。$n\tau=«n»\times«tau»=«ntau»$ は整数でないので、最小点は $\lceil«ntau»\rceil=«k»$ 番目の値になる。
          確認：$q$ を «q_lo» と «q» の間で増やすと、下に «km1» 個・上に 3 個なので傾きは $0.2\times«km1»-0.8\times3=«slope_lo»<0$（まだ減る）。«q» と «q_hi» の間では下に «k» 個・上に «nk» 個で、傾きは $0.2\times«k»-0.8\times«nk»=«slope_hi»>0$（増える）。よって最小は $q=«q»$。

          **答え** $«q»$ 分

          **間違えやすい点** 二乗誤差なら平均（«mean»）、絶対誤差（$\tau=0.5$）なら中央値（«med»）が最小点になる。分位点回帰は、$\tau$ によって重みが非対称な絶対誤差を最小にする。
          $n\tau$ を切り捨てた «km1» 番目の値（«q_lo»）では、まだ目的関数が減る。

  - id: s17p11
    title: 4種類のデザートの満足度
    context: |
      レストランで 4 種類のデザートの満足度を比べるため、客 «N» 人を各デザート «n» 人ずつ無作為に割り当てた。一元配置分散分析の結果、
      デザート間の平方和は «ssa»、誤差平方和は «sse» だった。
    items:
      - id: s17p11a
        chapter: 20
        terms: [effect-size-eta-squared, one-way-anova, sum-of-squares-decomposition]
        topic: デザート4種の一元配置分散分析表から効果量ω²を求めη²と比べる
        level: 標準
        definition: false
        type: choice
        question: |
          効果量 $\omega^2=\dfrac{S_A-(k-1)V_E}{S_T+V_E}$（$S_A$ は要因の平方和、$S_T$ は総平方和、$V_E$ は誤差の平均平方、$k$ は水準数）の値に最も近いものはどれか。
        choices:
          - '$«w_k»$'
          - '$«om»$'
          - '$«w_noden»$'
          - '$«eta»$'
          - '$«w_ratio»$'
        answer: 1
        distractors:
          - k−1 ではなく k を V_E に掛けた
          - 正解
          - 分母に V_E を足し忘れた
          - 偏りを補正しない η²=S_A/S_T を答えた
          - 総平方和ではなく誤差平方和で割った
        explanation: |
          **方針** 総平方和は要因と誤差の平方和の和。誤差の平均平方は誤差平方和を自由度 $N-k$ で割る。$\omega^2$ は $\eta^2$ の上向きの偏りを補正した効果量である。

          **途中式** $S_T=«ssa»+«sse»=«sst»$、誤差の自由度 $«N»-«k»=«dfe»$、$V_E=«sse»/«dfe»=«mse»$。
          $$\omega^2=\frac{«ssa»-«dfa»\times«mse»}{«sst»+«mse»}=\frac{«num»}{«den»}=«om4»\cdots$$

          **答え** $«om»$

          **間違えやすい点** $\eta^2=S_A/S_T=«eta»$ は、母集団で効果がなくても標本では正になりやすい（過大になる）。$\omega^2$ では要因の平方和から偶然で生じる分 $(k-1)V_E$ を引く。
          $V_E$ は誤差平方和そのもの（«sse»）ではなく、自由度で割った平均平方。

  - id: s17p12
    title: 宿泊客アンケートの無回答
    context: |
      あるリゾートホテルで、前月の宿泊客から無作為に «n» 組を選んで満足度（5 段階）のアンケートを送ったところ、«nr» 組が回答し、平均は «yr» だった。
      回答しなかった «nm» 組からさらに無作為に «nf» 組を選んで電話で聞き取りをしたところ（全員から回答を得た）、平均は «yf» だった。
    items:
      - id: s17p12a
        chapter: 21
        terms: [nonresponse-bias, sampling-weight]
        topic: 無回答者の一部を追跡調査した二相抽出で無回答の偏りを補正した満足度の平均を推定する
        level: 基本
        definition: false
        type: choice
        question: |
          回答者と無回答者の割合で重み付けして、宿泊客全体の平均満足度を推定する。推定値に最も近いものはどれか。
        choices:
          - '$«w_rev»$'
          - '$«w_avg»$'
          - '$«est»$'
          - '$«w_pool»$'
          - '$«yr2»$'
        answer: 2
        distractors:
          - 回答者と無回答者の重みを逆にした
          - 2 つの平均を単純平均した
          - 正解
          - 回答者 300 組と追跡 40 組をそのまま合わせて平均した（追跡分の重みが小さすぎる）
          - 回答者だけの平均を答えた（無回答の偏りが残る）
        explanation: |
          **方針** 無回答者の追跡標本は無回答者全体の代表なので、その平均を無回答者の平均として扱い、標本中の回答者・無回答者の割合で重み付けする（ハンセン・ハーウィッツの方法）。

          **途中式** 重みは回答者 $«nr»/«n»=«wr»$、無回答者 $«nm»/«n»=«wm»$。
          $$\hat{\bar Y}=«wr»\times«yr»+«wm»\times«yf»=«t1»+«t2»=«est»$$

          **答え** $«est»$

          **間違えやすい点** 回答者だけの平均 «yr2» は、満足度の低い人ほど回答しにくい場合に過大になる（ここでは約 «bias» の偏り）。
          追跡した «nf» 組は «nm» 組の代表なので、1 組あたり «nm»/«nf» 組分の重みをもつ。単純に合わせると $«w_pool»$ となり、無回答者の重みが小さすぎる。

  - id: s17p13
    title: ホテルの口コミ評価の多変量解析
    context: |
      ある宿泊予約サイトで、多数のホテルについて口コミの評価項目（清潔さ・立地・接客・朝食・設備・コストパフォーマンス）の平均点を集計し、多変量解析を行った。
    items:
      - id: s17p13a
        chapter: 22
        terms: [lagrange-multiplier-pca, principal-component, eigenvalue-and-eigenvector]
        topic: 主成分の係数ベクトルをラグランジュの未定乗数法で導く手順と最大値の意味を選ぶ
        level: 標準
        definition: true
        type: choice
        question: |
          評価項目のベクトルを $\boldsymbol X$、その分散共分散行列を $\Sigma$ とする。第 1 主成分 $\boldsymbol a^\top\boldsymbol X$ の係数ベクトル $\boldsymbol a$ の求め方として正しいものはどれか。
        choices:
          - '制約をつけずに $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にする $\boldsymbol a$ を求める'
          - '制約 $\boldsymbol a^\top\Sigma\boldsymbol a=1$ のもとで $\boldsymbol a^\top\boldsymbol a$ を最大にする $\boldsymbol a$ を求め、最大値は $\Sigma$ の最小固有値になる'
          - '制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にする。ラグランジュ乗数法から $\Sigma\boldsymbol a=\lambda\boldsymbol a$ が導かれ、最大値（第 1 主成分の分散）は $\Sigma$ の最大固有値 $\lambda_1$ である'
          - '制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にし、最大値は最大固有値の平方根 $\sqrt{\lambda_1}$ である'
          - '第 2 主成分は、第 1 主成分と同じく $\boldsymbol a^\top\boldsymbol a=1$ の制約だけで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にすれば得られる'
        answer: 2
        distractors:
          - 制約がないと a を定数倍していくらでも分散を大きくできる
          - 目的と制約を入れ替えた（最大値も 1/最小固有値 になり意味が違う）
          - 正解
          - 分散と標準偏差を取り違えた
          - 第 1 主成分との直交（無相関）の制約を付け忘れた（同じ解になってしまう）
        explanation: |
          **方針** 分散 $V[\boldsymbol a^\top\boldsymbol X]=\boldsymbol a^\top\Sigma\boldsymbol a$ は $\boldsymbol a$ を定数倍すると大きくなるので、長さを 1 に固定して最大化する。

          **途中式** $L=\boldsymbol a^\top\Sigma\boldsymbol a-\lambda(\boldsymbol a^\top\boldsymbol a-1)$ を $\boldsymbol a$ で微分して 0 とおくと $2\Sigma\boldsymbol a-2\lambda\boldsymbol a=\boldsymbol 0$、すなわち $\Sigma\boldsymbol a=\lambda\boldsymbol a$。
          このとき $\boldsymbol a^\top\Sigma\boldsymbol a=\lambda\boldsymbol a^\top\boldsymbol a=\lambda$ なので、分散を最大にするのは最大固有値 $\lambda_1$ の固有ベクトル。第 2 主成分は、$\boldsymbol a^\top\boldsymbol a=1$ に加えて第 1 主成分の係数ベクトルと直交する条件のもとで最大化し、2 番目に大きい固有値の固有ベクトルになる。

          **答え** 「制約 $\boldsymbol a^\top\boldsymbol a=1$ のもとで $\boldsymbol a^\top\Sigma\boldsymbol a$ を最大にする。$\Sigma\boldsymbol a=\lambda\boldsymbol a$ が導かれ、最大値は $\lambda_1$」

          **間違えやすい点** 主成分の分散は固有値そのもの（標準偏差が $\sqrt{\lambda}$）。第 2 主成分に直交の制約を付けないと、また第 1 主成分が得られてしまう。

      - id: s17p13b
        chapter: 25
        terms: [factor-rotation, communality, factor-loading]
        topic: 2因子モデルの負荷量を直交回転したあとの負荷量を計算し共通性が回転で変わらないことを確かめる
        level: 標準
        definition: false
        type: choice
        question: |
          同じ 6 項目（標準化済み）に直交 2 因子モデル（因子どうしは無相関で分散 1）を当てはめ、「接客」の因子負荷量は $(«l11»,\ «l12»)$ だった。
          負荷量行列 $\Lambda$ を直交行列 $T=\begin{pmatrix}«c» & -«sn»\\ «sn» & «c»\end{pmatrix}$ で $\Lambda^{*}=\Lambda T$ と回転したとき、
          「接客」の回転後の負荷量と共通性の組として正しいものはどれか。
        choices:
          - '負荷量 $(«rt1»,\ «rt2»)$、共通性 $«comm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«rsum»$'
          - '負荷量 $(«w1»,\ «w2»)$、共通性 $«wcomm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«comm»$'
          - '負荷量 $(«r1»,\ «r2»)$、共通性 $«uniq»$'
        answer: 3
        distractors:
          - 行ベクトルに T の転置を掛けた（回転の向きを逆にした）
          - 共通性を負荷量の 2 乗和ではなく和にした
          - T の対角成分だけを掛けた（行列の積の誤り）
          - 正解
          - 共通性と独自分散を取り違えた
        explanation: |
          **方針** 行ベクトル（ある項目の負荷量）に右から $T$ を掛ける。共通性は負荷量の 2 乗和で、直交回転では行ベクトルの長さが変わらないので共通性も変わらない。

          **途中式** $(«l11»,\ «l12»)T$ の第 1 成分は $T$ の第 1 列 $(«c»,«sn»)^\top$ との内積、第 2 成分は第 2 列 $(-«sn»,«c»)^\top$ との内積：
          $$«l11»\times«c»+«l12»\times«sn»=«e1»+«e2»=«r1»,\qquad «l11»\times(-«sn»)+«l12»\times«c»=-«e3»+«e4»=«r2»$$
          共通性は回転前 $«l11»^2+«l12»^2=«comm»$、回転後 $«r1»^2+(«r2»)^2=«r1sq»+«r2sq»=«comm»$ で一致する。

          **答え** 負荷量 $(«r1»,\ «r2»)$、共通性 $«comm»$

          **間違えやすい点** $\Lambda T$ と $\Lambda T^\top$ を取り違えると $(«rt1»,\ «rt2»)$ になる。共通性は 2 乗和（和の «rsum» ではない）。
          独自分散は $1-«comm»=«uniq»$ で、共通性とは別のもの。直交回転ではモデルが再現する相関行列 $\Lambda\Lambda^\top$ も変わらない。

      - id: s17p13c
        chapter: 26
        terms: [nonmetric-mds, multidimensional-scaling]
        topic: 非計量多次元尺度法で配置の距離を非類似度の順に単調回帰しクラスカルのストレスを求める
        level: 標準
        definition: false
        type: numeric
        question: |
          4 つのホテル A, B, C, D の「似ていなさ」を利用者に順位で答えてもらったところ、非類似度は小さい順に AB, BD, AC, BC, AD, CD だった。
          非計量多次元尺度法で 2 次元に配置したところ、配置上の距離 $d$ は次のとおりだった。

          | 組（非類似度の小さい順） | AB | BD | AC | BC | AD | CD |
          |---|---|---|---|---|---|---|
          | 距離 $d$ | «dAB» | «dBD» | «dAC» | «dBC» | «dAD» | «dCD» |

          距離を非類似度の順に単調回帰（順序が逆転している隣どうしを平均でならす）した値を $\hat d$ とし、クラスカルのストレス $\sqrt{\sum(d-\hat d)^2\big/\sum d^2}$ を求めよ。
        answer: «stress»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 非類似度の順に並べた距離が単調に増えていない箇所（逆転）を見つけ、その組の距離を平均した値で置き換える（隣接違反プール法）。置き換えた値と距離のずれの 2 乗和を、距離の 2 乗和で割って平方根をとる。

          **途中式** 順に並べた距離 «dAB», «dBD», «dAC», «dBC», «dAD», «dCD» では、BD «dBD» > AC «dAC» と AD «dAD» > CD «dCD» が逆転している。
          それぞれ平均して $\hat d$ は «hAB», «hBD», «hAC», «hBC», «hAD», «hCD»。ずれ $d-\hat d$ は «eAB», «eBD», «eAC», «eBC», «eAD», «eCD» なので
          $$\sum(d-\hat d)^2=«num»,\qquad\sum d^2=«den»$$
          $$\text{ストレス}=\sqrt{\frac{«num»}{«den»}}=\sqrt{«ratio»}=«stress4»\cdots$$

          **答え** $«stress_s»$（目安では「よい」程度の当てはまり）

          **間違えやすい点** 平方根をとり忘れると $«w_nosqrt»$。分母は距離の 2 乗和で、組の数（6）ではない（6 で割ると $«w_mean»$）。
          非計量 MDS では非類似度の**順序**だけを再現すればよいので、$\hat d$ は非類似度の値ではなく、距離を順序に合わせて単調にならした値である。

