          - '$Q=«Q»$ で、自由度 1 の «c1» を超えるので、残差に自己相関が残っている（モデルを見直す）'
          - '$Q=«bp»$ で、自由度 1 の «c1» を超えるので、残差に自己相関が残っている'
          - '$Q=«sr2»$ で、どの点も超えないので、残差はホワイトノイズとみなしてよい'
          - '$Q=«Q»$ で、自由度 1 の «c1» を超えるので、残差はホワイトノイズとみなしてよい'
        answer: 1
        distractors:
