        explanation: |
          **方針** 係数が特定の値 $\beta_0$ かどうかの検定統計量は $t=(\hat\beta-\beta_0)/\mathrm{SE}$ で、自由度は $n-(\text{説明変数の数})-1=52-2-1=«df»$。

          **途中式**
          $$t=\frac{«b»-(-1)}{«se»}=\frac{«bp1»}{«se»}=«t»,\qquad |t|=«tabs»>«t49»$$
          よって 5% で棄却し、弾力性は $-1$ より小さい（絶対値が 1 より大きい）と判断する。価格を 1% 上げると販売数は約 «pct»% 減り、売上（価格×数量）は減る。

          **答え** 「$t=«t»$ で $|t|>«t49»$ なので、弾力性は $-1$ と異なり、需要は価格に対して弾力的（値上げで売上が減る）といえる」

          **間違えやすい点** 統計ソフトの出力の $t$ 値（$«t0»$）は「係数 = 0」の検定なので、そのまま使えない。帰無仮説の値 $-1$ を引いてから標準誤差で割る。
          両側検定では $|t|$ と «t49» を比べる。
      - id: s17p08b
        chapter: 17
        terms: [residual-plot, heteroscedasticity, robust-standard-error]
        topic: 当てはめ値に対する残差プロットが漏斗型に広がるときの意味と対処を選ぶ
        level: 基本
        definition: true
        type: choice
        question: |
          このモデルの残差を当てはめ値に対してプロットしたところ、残差は 0 のまわりに平均的には散らばっていたが、当てはめ値が大きいほど散らばりが大きくなる漏斗型だった。
          この図から読み取れることと対処として最も適切なものはどれか。
        choices:
          - '回帰係数の最小二乗推定量に偏りが生じているので、係数の値そのものを信用できない'
          - '関係が曲線的なので、説明変数の 2 乗項を加える必要がある'
          - '誤差の分散が一定でない（不均一分散）。係数の推定量は不偏のままだが、通常の標準誤差や $t$ 検定は信頼できないので、頑健な標準誤差や重み付き最小二乗法を使う'
          - '残差に正の系列相関があるので、ダービン・ワトソン比を調べればよい'
          - '散らばりの大きい観測は外れ値なので、取り除いてから当てはめ直せばよい'
        answer: 2
        distractors:
          - 不均一分散でも誤差の平均が 0 なら最小二乗推定量は不偏のまま
          - 曲線的な関係なら残差は当てはめ値に対して曲がった傾向を示す（漏斗型ではない）
          - 正解
          - 系列相関は時間順のプロットで見るもので、漏斗型とは別の問題
          - 分散の構造を無視して観測を除くのは不適切
        explanation: |
          **方針** 残差プロットの「平均の傾向」と「散らばりの大きさ」を分けて読む。平均は 0 のまわりで、散らばりだけが当てはめ値とともに増えている。

          **途中式** 漏斗型は $V[\varepsilon_i]$ が当てはめ値（説明変数）とともに増える不均一分散のしるし。誤差の期待値が 0 なら最小二乗推定量は不偏のままだが、
          通常の標準誤差は誤差分散が一定であることを前提に計算されているので、検定や信頼区間が正しくなくなる。

          **答え** 「誤差の分散が一定でない（不均一分散）。係数の推定量は不偏のままだが、通常の標準誤差や $t$ 検定は信頼できないので、頑健な標準誤差や重み付き最小二乗法を使う」

          **間違えやすい点** 不均一分散は「推定量の偏り」ではなく「効率と標準誤差」の問題。前問の $t$ 検定も、頑健な標準誤差でやり直すのがよい。
          曲線的な関係（平均のずれ）や系列相関とは見る点が違う。
