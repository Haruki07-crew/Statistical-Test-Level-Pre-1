      海水浴場に面したカフェで、夏の 60 日間について、ビールの売上 $Y_1$、かき氷の売上 $Y_2$、その日の最高気温 $T$ を記録した。標本相関係数は次のとおりだった。

      | | $Y_1$（ビール） | $Y_2$（かき氷） | $T$（最高気温） |
      |---|---|---|---|
      | $Y_1$ | 1 | «r12» | «r1t» |
      | $Y_2$ | «r12» | 1 | «r2t» |
      | $T$ | «r1t» | «r2t» | 1 |
    items:
      - id: s17p12a
        chapter: 3
        terms: [partial-correlation-coefficient, spurious-correlation, covariance-and-correlation]
        topic: ビールとかき氷の売上の相関から最高気温の影響を除いた偏相関係数を求め見かけの相関を見抜く
        level: 標準
        definition: false
        type: numeric
        question: |
          最高気温 $T$ の影響を除いた $Y_1$ と $Y_2$ の偏相関係数 $r_{12\cdot T}$ を求めよ。
        answer: «pc»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 偏相関係数は、$Y_1$ と $Y_2$ をそれぞれ $T$ に回帰した残差どうしの相関で、
          $$r_{12\cdot T}=\frac{r_{12}-r_{1T}\,r_{2T}}{\sqrt{(1-r_{1T}^2)(1-r_{2T}^2)}}$$
          で求められる。

          **途中式**
          $$r_{12}-r_{1T}r_{2T}=«r12»-«r1t»\times«r2t»=«r12»-«prod»=«num»$$
          $$(1-«r1t»^2)(1-«r2t»^2)=«a1»\times«a2»=«den2»,\qquad\sqrt{«den2»}=«den»$$
          $$r_{12\cdot T}=\frac{«num»}{«den»}=«pc4»\cdots$$

          **答え** $«pc_s»$

          **間違えやすい点** 平方根をとり忘れると $«pc_nosqrt»$ になる。分子の $r_{12}-r_{1T}r_{2T}=«num»$ をそのまま答えるのも誤り。
          ビールとかき氷の相関 «r12» の大部分は、どちらも暑い日に売れることによる見かけの相関で、気温の影響を除くとほとんど残らない。

      - id: s17p12b
        chapter: 27
        terms: [arma-model, autocovariance-autocorrelation, stationarity-condition]
        topic: 気温の影響を除いた日次売上の偏差をARMA11とみて2次の自己相関を求める
        level: 応用
        definition: false
        type: choice
        question: |
          気温などの影響を除いた日次売上の偏差 $X_t$ が、定常かつ反転可能な ARMA(1,1) モデル
          $$X_t=«phi»\,X_{t-1}+\varepsilon_t+«th»\,\varepsilon_{t-1}$$
          （$\varepsilon_t$ は平均 0、分散 $\sigma^2$ のホワイトノイズ）に従うとする。2 次の自己相関係数 $\rho(2)$ に最も近いものはどれか。
        choices:
          - '$«ar2»$'
          - '$«rho2»$'
          - '$«naive»$'
          - '$«wd»$'
          - '$«rho1_3»$'
        answer: 1
        distractors:
          - MA 部分を無視して AR(1) の ρ(2)=φ² とした
          - 正解
          - ρ(1)=φ+θ と誤って ρ(2)=φ(φ+θ) とした
          - ρ(1) の分母を 1+θ² とした（γ(0) の 2φθ を落とした）
          - 1 次の自己相関 ρ(1) を答えた
        explanation: |
          **方針** ARMA(1,1)（$X_t=\phi X_{t-1}+\varepsilon_t+\theta\varepsilon_{t-1}$）では
          $$\rho(1)=\frac{(1+\phi\theta)(\phi+\theta)}{1+2\phi\theta+\theta^2},\qquad\rho(k)=\phi\,\rho(k-1)\ (k\ge2)$$
          となる。$\varepsilon_{t-1}$ の影響は 1 期先までしか直接届かないので、2 次以降は AR 部分の $\phi$ を掛けて減衰する。

          **途中式** $\phi=«phi»$、$\theta=«th»$ より $\phi\theta=«pt»$。
          $$\rho(1)=\frac{(1+«pt»)(«phi»+«th»)}{1+2\times«pt»+«th»^2}=\frac{«n1»\times«ppt»}{1+«tpt»+«th2»}=\frac{«rnum»}{«d1»}=«rho1»$$
          $$\rho(2)=«phi»\times«rho1»=«rho2_4»\cdots$$

          **答え** $«rho2»$

          **間違えやすい点** AR(1) の公式 $\rho(2)=\phi^2=«ar2»$ は MA 部分を無視している。$\rho(1)$ は $\phi+\theta$ ではない（そうすると $«naive»$）。
          $\gamma(0)=\dfrac{1+2\phi\theta+\theta^2}{1-\phi^2}\sigma^2$ の $2\phi\theta$ を落とすと $«wd»$ になる。$\rho(1)=«rho1_3»$ と取り違えないこと。

