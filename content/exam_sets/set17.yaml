          **答え** $«ans»$

          **間違えやすい点** このモデルは $\theta_j-\beta x$ の形なので、会員では累積確率が小さくなる（高い満足度に寄る）。$\theta_j+\beta x$ とすると $«wsign»$ になる。
          累積確率 $P(Y\le2)=«cum2»$ や、「満足」の確率 $1-«c2»=«p3»$ と取り違えないこと。非会員なら $e^{1.0}$ と $e^{-1.2}$ を使って $«nonmem»$ になる。

      - id: s17p10b
        chapter: 26
        terms: [goodness-of-fit-indices, structural-equation-modeling]
        topic: 顧客満足の構造方程式モデルの適合度カイ二乗と自由度と標本の大きさからRMSEAを求める
        level: 基本
        definition: false
        type: choice
        question: |
          同じアンケートの回答者 $N=«N»$ 人のデータで、満足度・再訪意向・推奨意向などを観測変数とする構造方程式モデルを最尤法で当てはめたところ、
          適合度のカイ二乗統計量は $\chi^2=«chi2»$、自由度は $df=«dfm»$ だった。RMSEA（分母に $N-1$ を用いる定義）の値に最も近いものはどれか。
        choices:
          - '$«rm_nosqrt»$'
          - '$«rmsea»$'
          - '$«rm_nodf»$'
          - '$«rm_nodfden»$'
          - '$«rm_ratio»$'
        answer: 1
        distractors:
          - 平方根をとらなかった
          - 正解
          - χ² から自由度を引かなかった
          - 分母の自由度 df を掛け忘れた
          - χ²/df の比をそのまま答えた
        explanation: |
          **方針** RMSEA は、カイ二乗統計量の期待値（自由度）を超える部分を、自由度と $N-1$ で割って平方根をとった量で、
          $$\mathrm{RMSEA}=\sqrt{\max\left\{\frac{\chi^2-df}{df\,(N-1)},\,0\right\}}$$
          と定義される。

          **途中式**
          $$\frac{«chi2»-«dfm»}{«dfm»\times«N1»}=\frac{«dchi»}{«dN»}=«rm2»,\qquad\sqrt{«rm2»}=«rmsea»$$
          目安（0.05 以下でよい、0.08 以下でまずまず、0.1 以上で悪い）では「まずまず」の当てはまりである。

          **答え** $«rmsea»$

          **間違えやすい点** カイ二乗統計量はモデルが正しくても自由度程度の大きさになるので、$\chi^2-df$ を使う（引かないと $«rm_nodf»$）。分母の $df$ を忘れると $«rm_nodfden»$、平方根を忘れると $«rm_nosqrt»$。
          $\chi^2/df=«rm_ratio»$ は別の目安であり RMSEA ではない。

  - id: s17p11
    title: 都市ホテルの客室需要と価格
    context: |
      ある都市ホテルの 52 週分の週次データで、販売客室数の対数 $\log Q$ を平均客室単価の対数 $\log P$ に回帰して、需要の価格弾力性 $\beta$ を推定したい
