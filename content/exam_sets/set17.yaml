set: 17
title: 模擬試験 第17回
minutes: 90
problems:
  - id: s17p01
    title: レストランの追加注文の組み合わせ
    context: |
      ある洋食レストランでは、ランチセットに「前菜」「デザート」「ドリンク」を追加で注文できる。来店客 1 組が前菜を注文する事象を $A$、デザートを注文する事象を $B$、ドリンクを注文する事象を $C$ とする。
      過去の大量の伝票から、追加注文の組み合わせの割合は次のとおりだった（○は注文あり、－は注文なし）。

      | 前菜 | デザート | ドリンク | 割合 |
      |---|---|---|---|
      | ○ | ○ | ○ | «t_abc» |
      | ○ | ○ | － | «t_ab» |
      | ○ | － | ○ | «t_ac» |
      | － | ○ | ○ | «t_bc» |
      | ○ | － | － | «t_a» |
      | － | ○ | － | «t_b» |
      | － | － | ○ | «t_c» |
      | － | － | － | «t_none» |
    items:
      - id: s17p01a
        chapter: 1
        terms: [independence-of-events, conditional-probability]
        topic: 追加注文3品の組み合わせの割合から対ごとには独立だが相互独立ではないことを見分ける
        level: 基本
        definition: false
        type: choice
        question: |
          無作為に選んだ 1 組について、事象 $A,B,C$ の独立性に関する記述として正しいものはどれか。
        choices:
          - '$A,B,C$ は互いに独立（相互独立）である'
          - '$A$ と $B$、$A$ と $C$、$B$ と $C$ はどれも独立だが、$A,B,C$ は相互独立ではない'
          - '$P(A\cap B)\ne P(A)P(B)$ なので、$A$ と $B$ は独立ではない'
          - '$P(C\mid A\cap B)=P(C)=«pc»$ である'
          - 'どの 2 つも独立なので、少なくとも 1 品を追加注文する確率は $1-«qa»\times«qb»\times«qc»=«union_ind»$ である'
        answer: 1
        distractors:
          - 対ごとの独立だけを確かめて、3 つの積の条件を確かめなかった
          - 正解
          - 周辺確率を表の「その品だけ」の行から読み取り、積を誤って計算した
          - 対ごとに独立なら 2 つの事象で条件づけても確率は変わらないと思い込んだ
          - 対ごとの独立から相互独立のときの公式を使った
        explanation: |
          **方針** まず表を足し合わせて $P(A),P(B),P(C)$ と 2 つずつの共通部分の確率を求める。2 つずつの独立は $P(A\cap B)=P(A)P(B)$ など 3 本の式、相互独立はそれに加えて $P(A\cap B\cap C)=P(A)P(B)P(C)$ も必要である。

          **途中式** 該当する行を足すと
          $$P(A)=«t_abc»+«t_ab»+«t_ac»+«t_a»=«pa»,\quad P(B)=«t_abc»+«t_ab»+«t_bc»+«t_b»=«pb»,\quad P(C)=«t_abc»+«t_ac»+«t_bc»+«t_c»=«pc»$$
          $$P(A\cap B)=«t_abc»+«t_ab»=«pab»=«pa»\times«pb»,\quad P(A\cap C)=«t_abc»+«t_ac»=«pac»=«pa»\times«pc»,\quad P(B\cap C)=«t_abc»+«t_bc»=«pbc»=«pb»\times«pc»$$
          よってどの 2 つも独立である。一方
          $$P(A\cap B\cap C)=«pabc»\ne P(A)P(B)P(C)=«papbpc»$$
          なので相互独立ではない。実際 $P(C\mid A\cap B)=«pabc»/«pab»=«cgab»$ で、$P(C)=«pc»$ と異なる。
          また、少なくとも 1 品を注文する確率は表から $1-«t_none»=«union»$ で、相互独立を仮定した $«union_ind»$ とは一致しない。

          **答え** 「$A$ と $B$、$A$ と $C$、$B$ と $C$ はどれも独立だが、$A,B,C$ は相互独立ではない」

          **間違えやすい点** 2 つずつ独立であっても、3 つが相互独立とは限らない。3 事象の積の式まで確かめること。相互独立でないので、$P(C\mid A\cap B)=P(C)$ や「余事象の積」の公式は使えない。
          周辺確率は「その品を含むすべての行」の和であり、「その品だけ」の行（例えば前菜だけの «t_a»）ではない。

  - id: s17p02
    title: ビジネスホテルの客室単価の重回帰
    context: |
      ある地域のビジネスホテル «n» 軒について、平日の平均客室単価 $y$（千円）を説明する重回帰モデル（切片あり、誤差は互いに独立に $N(0,\sigma^2)$ に従う）を最小二乗法で当てはめた。
      候補のモデルと残差平方和 RSS は次のとおりである（$p$ は切片を除く説明変数の個数）。

      | モデル | 説明変数 | $p$ | RSS |
      |---|---|---|---|
      | M1 | 駅からの距離・客室面積・築年数 | 3 | «rss1» |
      | M2 | M1 ＋ 朝食の評価 | 4 | «rss2» |
      | M3 | M1 ＋ 朝食の評価・大浴場の有無 | 5 | «rss3» |
      | M4 | M3 ＋ 駐車場の有無・客室数 | 7 | «rss4» |
    items:
      - id: s17p02a
        chapter: 16
        terms: [partial-f-test, multiple-regression-model, f-distribution]
        topic: 客室単価の回帰に朝食評価と大浴場の2変数を加えたときのRSSの減少から部分F検定の統計量を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          M1 に「朝食の評価」と「大浴場の有無」の 2 変数を加えた M3 が、M1 より有意に当てはまりを改善するかを調べたい。
          帰無仮説「追加した 2 変数の偏回帰係数はともに 0」に対する部分 $F$ 検定の統計量 $F$ の値を求めよ。
        answer: «F»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** 部分 $F$ 統計量は「追加した変数による RSS の減少を、追加した変数の個数で割ったもの」を、「大きいほうのモデル（M3）の誤差の平均平方」で割る。

          **途中式** RSS の減少は $«rss1»-«rss3»=«drss»$、追加した変数は «dp» 個。M3 の残差の自由度は $n-p-1=«n»-5-1=«df2»$。
          $$F=\frac{(«rss1»-«rss3»)/«dp»}{«rss3»/«df2»}=\frac{«msd»}{«mse2»}=«F_s»$$
          帰無仮説のもとで $F$ は自由度 $(«dp»,«df2»)$ の $F$ 分布に従う。上側 5% 点は約 «Fc» なので、5% で有意である。

          **答え** $«F_s»$

          **間違えやすい点** 分母は大きいほうのモデル M3 の $\mathrm{RSS}/(n-p-1)$。M1 の RSS を使うと $«F_rss1»$、自由度を $n-p=«n»-5$ と切片を数え忘れると $«F_df35»$、分子を追加した変数の個数 2 で割り忘れると $«F_nodiv»$ になる。

      - id: s17p02b
        chapter: 30
        terms: [mallows-cp, model-selection, variable-selection]
        topic: 客室単価の4つの候補モデルを全変数モデルの誤差分散を使ったマローズのCpで比べる
        level: 標準
        definition: false
        type: choice
        question: |
          4 つのモデルをマローズの $C_p$ で比べる。$C_p=\dfrac{\mathrm{RSS}}{\hat\sigma^2}-n+2k$ と定義する。ここで $k$ は**切片を含む**回帰係数の個数、
          $\hat\sigma^2$ は説明変数をすべて含むモデル M4 の誤差分散の不偏推定値である。$C_p$ が最小となるモデルとその $C_p$ の値の組として正しいものはどれか。
        choices:
          - 'M4（$C_p=«cp4»$）'
          - 'M3（$C_p=«cp_nointer»$）'
          - 'M3（$C_p=«cp3»$）'
          - 'M3（$C_p=«cp_n»$）'
          - 'M3（$C_p=«cp_non»$）'
        answer: 2
        distractors:
          - RSS が最小のモデルを選んだ（全変数モデルの Cp は常に k に等しい）
          - k に切片を数えず 2p とした
          - 正解
          - σ̂² を M4 の RSS/n（最尤推定値）にした
          - 定義の −n を落とした
        explanation: |
          **方針** まず M4 から $\hat\sigma^2$ を作り、各モデルの $\mathrm{RSS}/\hat\sigma^2-n+2k$ を計算して最小のものを選ぶ。

          **途中式** M4 の残差の自由度は $«n»-7-1=«df4»$ なので $\hat\sigma^2=«rss4»/«df4»=«s2full»$。
          $$C_p(\mathrm{M1})=\frac{«rss1»}{«s2full»}-«n»+2\times«k1»=«r1»-«nk1»=«cp1»$$
          $$C_p(\mathrm{M2})=\frac{«rss2»}{«s2full»}-«n»+2\times«k2»=«r2»-«nk2»=«cp2»$$
          $$C_p(\mathrm{M3})=\frac{«rss3»}{«s2full»}-«n»+2\times«k3»=«r3»-«nk3»=«cp3»$$
          $$C_p(\mathrm{M4})=\frac{«rss4»}{«s2full»}-«n»+2\times«k4»=«r4»-«nk4»=«cp4»$$
          最小は M3。

          **答え** M3（$C_p=«cp3»$）

          **間違えやすい点** 全変数モデルの $C_p$ は定義から必ず $k$（ここでは «k4»）になるので、RSS が最小だからといって選ばれるわけではない。
          $k$ に切片を数えないと $«cp_nointer»$、$\hat\sigma^2$ を $«rss4»/«n»=«s2n»$ にすると $«cp_n»$、$-n$ を落とすと $«cp_non»$ になる（どれも M3 が最小になるが値が違う）。

      - id: s17p02c
        chapter: 17
        terms: [studentized-residual, standardized-residual, leverage, outlier-and-influential-point]
        topic: 残差とてこ比から1軒を除いた誤差分散を求め外部スチューデント化残差を計算する
        level: 応用
        definition: false
        type: numeric
        question: |
          M3 を採用した。あるホテル $i$ の残差は $e_i=«e»$、てこ比は $h_{ii}=«h»$ だった。
          このホテルを除いて M3 を当てはめ直したときの誤差分散の不偏推定値を $\hat\sigma_{(i)}^2$ とし、外部スチューデント化残差
          $t_i=\dfrac{e_i}{\hat\sigma_{(i)}\sqrt{1-h_{ii}}}$ の値を求めよ。
          なお、ホテル $i$ を除いて当てはめたときの残差平方和は $\mathrm{RSS}-\dfrac{e_i^2}{1-h_{ii}}$ になる（RSS は全 «n» 軒で当てはめたときの値）。
        answer: «t_ext»
        tolerance: 0.01
        answer_format: 小数第2位まで（小数第3位を四捨五入）で答えよ。±0.01 の差まで正解とする。
        explanation: |
          **方針** ホテル $i$ を除いた残差平方和と、その自由度（観測が 1 つ減るので $n-p-2$）から $\hat\sigma_{(i)}^2$ を求め、定義の式に代入する。

          **途中式** 除いたときの残差平方和は
          $$«rss3»-\frac{«e»^2}{«omh»}=«rss3»-\frac{«e2»}{«omh»}=«rss3»-«e2h»=«rss_i»$$
          自由度は $(«n»-1)-5-1=«df2m1»$ なので $\hat\sigma_{(i)}^2=«rss_i»/«df2m1»=«s2_i»$、$\hat\sigma_{(i)}=«s_i»$。
          $$t_i=\frac{«e»}{«s_i»\times\sqrt{«omh»}}=\frac{«e»}{«den_ext»}=«t_ext4»\cdots$$

          **答え** $«t_ext_s»$

          **間違えやすい点** 全データの $\hat\sigma^2=«rss3»/«df2»=«mse2»$ を使うと内部スチューデント化残差（標準化残差）$r_i=«e»/«den_int»=«r_int»$ になる。外れ値の候補は自分自身が $\hat\sigma$ を大きくしているので、除いて推定した $\hat\sigma_{(i)}$ を使うと値が大きくなる。
          $\sqrt{1-h_{ii}}$ を掛け忘れると $«t_noh»$ になる。自由度は $n-p-1=«df2»$ ではなく 1 つ少ない «df2m1»。

          **別解** $r_i=«r_int4»$ から $t_i=r_i\sqrt{\dfrac{n-p-2}{n-p-1-r_i^2}}=«r_int4»\times\sqrt{\dfrac{«df2m1»}{«df2»-«rint2»}}=«t_ext4»$ としても同じ値になる。

  - id: s17p03
    title: 喫茶店の予約なし来店
    context: |
      ある喫茶店で、平日の 1 時間ごとに予約なしで来店した客の組数を、«n» 個の時間帯について数えた。

      «x»

      （合計 «T» 組、平均 $\bar x=«m»$）。各時間帯の組数 $X_1,\ldots,X_{«n»}$ は互いに独立に同じ分布に従うとする。
    items:
      - id: s17p03a
        chapter: 12
        terms: [dispersion-test, poisson-distribution, chi-squared-distribution]
        topic: 時間帯ごとの来店組数がポアソン分布より過分散かを分散指数検定で調べる
        level: 標準
        definition: false
        type: choice
        question: |
          組数がポアソン分布に従う（平均と分散が等しい）という帰無仮説に対し、「ポアソン分布より散らばりが大きい（過分散）」を対立仮説として、分散指数検定を有意水準 5% で行う。
          正しいものはどれか。必要なら次のカイ二乗分布の上側パーセント点を使え（$\chi^2_{\alpha}(m)$ は自由度 $m$ の上側 $100\alpha\%$ 点）。

          | $\chi^2_{0.05}(«df»)$ | $\chi^2_{0.95}(«df»)$ | $\chi^2_{0.05}(«df10»)$ |
          |---|---|---|
          | «c9» | «c9lo» | «c10» |
        choices:
          - '統計量は $D=«D»$ で、$\chi^2_{0.05}(«df»)=«c9»$ を超えないので、過分散とはいえない'
          - '統計量は $D=«D»$ で、$\chi^2_{0.05}(«df10»)=«c10»$ を超えないので、過分散とはいえない'
          - '統計量は $D=«D_raw»$ で、$\chi^2_{0.05}(«df»)=«c9»$ を超えないので、過分散とはいえない'
          - '統計量は $D=«D»$ で、$\chi^2_{0.95}(«df»)=«c9lo»$ を超えるので、過分散と判定する'
          - '統計量は $D=«Dratio»$ で、1 より小さいので、ポアソン分布より散らばりが小さい（過少分散）と判定する'
        answer: 0
        distractors:
          - 正解
          - 自由度を n−1 ではなく n とした
          - 偏差平方和を平均で割り忘れた
          - 上側検定なのに下側の点（χ²_0.95）と比べた
          - 分散と平均の比 s²/x̄ をそのまま統計量とし、分布と比べずに判定した
        explanation: |
          **方針** ポアソン分布なら分散と平均が等しいので、$D=\dfrac{\sum (X_i-\bar X)^2}{\bar X}=(n-1)\dfrac{s^2}{\bar X}$ は帰無仮説のもとで近似的に自由度 $n-1$ のカイ二乗分布に従う。過分散なら $D$ が大きくなるので上側で棄却する。

          **途中式** $\sum x_i^2=«sx2»$ より偏差平方和は
          $$\sum(x_i-\bar x)^2=«sx2»-«n»\times«m»^2=«sx2»-«nm2»=«ss»$$
          $$D=\frac{«ss»}{«m»}=«D»$$
          自由度は $«n»-1=«df»$ で、$D=«D»<\chi^2_{0.05}(«df»)=«c9»$ なので帰無仮説は棄却されない。

          **答え** 「統計量は $D=«D»$ で、$\chi^2_{0.05}(«df»)=«c9»$ を超えないので、過分散とはいえない」

          **間違えやすい点** 平均 $\lambda$ を $\bar x$ で推定しているので自由度は $n-1=«df»$（$n$ ではない）。偏差平方和 «ss» を平均で割るのを忘れないこと。
          比 $s^2/\bar x=«s2»/«m»\approx«Dratio»$ は 1 より小さいが、それだけでは判定できず、分布と比べる必要がある。また過分散を対立仮説とする上側検定なので、下側の点 «c9lo» と比べるのは誤り。

      - id: s17p03b
        chapter: 8
        terms: [rao-blackwell-theorem, sufficient-statistic, unbiased-estimator, invariance-of-mle]
        topic: 来店ゼロの時間帯の確率をポアソンの十分統計量で条件づけたラオ・ブラックウェル化により不偏推定する
        level: 応用
        definition: false
        type: choice
        question: |
          以下、組数は平均 $\lambda$ のポアソン分布に従うとする。ある 1 時間に予約なしの客が 1 組も来ない確率 $\theta=e^{-\lambda}$ を推定したい。
          $\mathbb{1}\{X_1=0\}$（$X_1=0$ なら 1、そうでなければ 0）は $\theta$ の不偏推定量である。これを十分統計量 $T=\sum_{i=1}^{«n»}X_i$ で条件づけた
          $E[\mathbb{1}\{X_1=0\}\mid T]$ のデータにおける値に最も近いものはどれか。必要なら $e^{-1.2}=«e12»$ を使え。
        choices:
          - '$«zf»$'
          - '$«um_p1»$'
          - '$«um»$'
          - '$«mle»$'
          - '$«um_m1»$'
        answer: 2
        distractors:
          - 条件づけをせず、0 組だった時間帯の割合を答えた
          - 指数を T+1 にした
          - 正解
          - 最尤推定量 e^{-x̄}（不変性）を答えた（不偏ではない）
          - 指数を T−1 にした
        explanation: |
          **方針** $T=t$ が与えられたとき、$X_1$ は試行回数 $t$、成功確率 $1/n$ の二項分布に従う（独立なポアソン変数の和で条件づけると多項分布になる）。ラオ・ブラックウェルの定理より、条件付き期待値も不偏で、分散は元の推定量以下になる。

          **途中式**
          $$E[\mathbb{1}\{X_1=0\}\mid T=t]=P(X_1=0\mid T=t)=\left(1-\frac1n\right)^{t}$$
          データでは $n=«n»$、$t=«T»$ なので
          $$\left(1-\frac{1}{«n»}\right)^{«T»}=«q»^{«T»}=«um4»\cdots$$

          **答え** $«um»$

          **間違えやすい点** 最尤推定量は不変性から $e^{-\bar x}=e^{-«m»}=«e12»$ だが、$E[e^{-\bar X}]\ne e^{-\lambda}$ なので不偏ではない。0 組だった時間帯の割合 $«zf»$ は不偏だが、十分統計量の情報を使っていないので分散が大きい。
          $T$ が与えられたもとで $X_1$ が従うのは二項分布 $B(t,1/n)$ であり、指数は $t$ そのもの。

      - id: s17p03c
        chapter: 6
        terms: [gamma-distribution, exponential-distribution, poisson-distribution]
        topic: 3組目の予約なし客が来るまでの時間をガンマ分布とみてポアソン過程の件数の確率から上側確率を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          予約なしの客の到着は、1 時間あたり $\lambda=«lam»$ 組のポアソン過程に従うとみなす。開店から **3 組目**の予約なし客が来るまでの時間が «t» 時間を超える確率を求めよ。
          必要なら $e^{-2.4}=«e24»$ を使え。
        answer: «p3»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 3 組目までの時間 $S_3$ は到着間隔（レート $\lambda$ の指数分布）3 つの和なので、形状 3・レート $\lambda$ のガンマ分布（アーラン分布）に従う。
          「$S_3>t$」は「時間 $t$ までの到着数 $N(t)$ が 2 組以下」と同じ事象なので、ポアソン分布の確率で計算できる。

          **途中式** $N(«t»)$ は平均 $\lambda t=«lam»\times«t»=«mu»$ のポアソン分布に従う。
          $$P(S_3>«t»)=P(N(«t»)\le2)=e^{-«mu»}\left(1+«mu»+\frac{«mu»^2}{2}\right)=«e24»\times(1+«mu»+«mu2h»)=«e24»\times«poly»=«p3_4»\cdots$$

          **答え** $«p3_s»$

          **間違えやすい点** 「3 組目が $t$ 時間を超えて来る」は「$t$ 時間までに 2 組以下」であり、3 組以下（$«p3_up3»$）でも 1 組以下（$«p3_no2»$）でもない。
          指数分布 1 つの上側確率 $e^{-«mu»}=«p3_exp»$ は 1 組目までの時間の確率である。

  - id: s17p04
    title: 温泉旅館のリピーターの割合
    context: |
      ある温泉旅館で、ある月の宿泊客から無作為に «n» 組を選んで調べたところ、«x» 組が以前にも宿泊したことのあるリピーターだった。宿泊客全体に占めるリピーターの割合を $p$、標本割合を $\hat p=«x»/«n»=«ph»$ とする。
    items:
      - id: s17p04a
        chapter: 9
        terms: [wilson-interval, ci-proportion, wald-confidence-interval]
        topic: リピーター割合の95%信頼区間をスコア法（ウィルソン区間）で作り上限を求める
        level: 標準
        definition: false
        type: numeric
        question: |
          正規近似にもとづく不等式 $|\hat p-p|\le «z»\sqrt{p(1-p)/n}$ を $p$ について解いて得られる 95% 信頼区間（ウィルソンのスコア信頼区間、連続修正なし）の**上限**を求めよ。
        answer: «up»
        tolerance: 0.001
        answer_format: 小数第3位まで（小数第4位を四捨五入）で答えよ。±0.001 の差まで正解とする。
        explanation: |
          **方針** 分母の標準誤差に未知の $p$ を残したまま両辺を 2 乗すると $p$ の 2 次不等式になる。その解が
          $$\frac{\hat p+\frac{z^2}{2n}\pm z\sqrt{\frac{\hat p(1-\hat p)}{n}+\frac{z^2}{4n^2}}}{1+\frac{z^2}{n}}$$
          である（$z=«z»$）。

          **途中式** $z^2=«z2»$、$z^2/n=«z2n»$、$z^2/(2n)=«z2_2n»$、$z^2/(4n^2)=«z2_4n2»$。
          $$\text{中心}=\frac{«ph»+«z2_2n»}{1+«z2n»}=\frac{«num_c»}{«den»}=«cen»$$
          $$\text{半幅}=\frac{«z»\sqrt{«pq_n»+«z2_4n2»}}{«den»}=\frac{«z»\times«srad»}{«den»}=«half»$$
          上限 $=«cen»+«half»=«up4»\cdots$（下限は約 «lo»）。

          **答え** $«up_s»$

          **間違えやすい点** 標準誤差に $\hat p$ を代入するワルド区間の上限 $«ph»+«z»\times«sep»=«wald_up»$ とは違う。ウィルソン区間の中心は $\hat p$ ではなく $1/2$ の側に寄る（ここでは «cen»）。
          分母の $1+z^2/n$ で割り忘れないこと。

      - id: s17p04b
        chapter: 7
        terms: [delta-method, odds-and-odds-ratio, standard-error]
        topic: リピーターのオッズの推定量の標準誤差をデルタ法で近似する
        level: 基本
        definition: false
        type: choice
        question: |
          リピーターのオッズ $\omega=p/(1-p)$ を $\hat\omega=\hat p/(1-\hat p)$ で推定する（推定値 $«odds»$）。
          デルタ法で求めた $\hat\omega$ の標準誤差の推定値に最も近いものはどれか（$p$ には $\hat p$ を代入する）。
        choices:
          - '$«se_p»$'
          - '$«se_g1nosq»$'
          - '$«se_logit»$'
          - '$«se_odds»$'
          - '$«var_odds»$'
        answer: 3
        distractors:
          - p̂ そのものの標準誤差を答えた
          - 微分係数 g'(p) を 2 乗せずに分散に掛けた
          - 対数オッズの標準誤差 √{1/(np(1−p))} を答えた
          - 正解
          - 分散を答え、平方根をとらなかった
        explanation: |
          **方針** $g(p)=p/(1-p)$ とおくと、デルタ法で $V[g(\hat p)]\approx\{g'(p)\}^2V[\hat p]$、$V[\hat p]=p(1-p)/n$。

          **途中式** $g'(p)=\dfrac{(1-p)+p}{(1-p)^2}=\dfrac{1}{(1-p)^2}$ なので、$\hat p=«ph»$ を代入して $g'=1/«qh»^2=«g1»$。
          $$V[\hat\omega]\approx«g1»^2\times\frac{«ph»\times«qh»}{«n»}=«g1sq»\times«vp»=«var_odds»$$
          $$\mathrm{SE}=\sqrt{«var_odds»}=«se_odds»$$
          （整理すると $V[\hat\omega]\approx\dfrac{p}{n(1-p)^3}$。）

          **答え** $«se_odds»$

          **間違えやすい点** 微分係数は 2 乗して掛ける（2 乗しないと $\sqrt{«g1»\times«vp»}=«se_g1nosq»$）。$\hat p$ の標準誤差 $«se_p»$ や、対数オッズの標準誤差 $«se_logit»$ と取り違えないこと。最後に平方根をとる。

  - id: s17p05
    title: 新レシピのパスタの試食会
    context: |
      イタリア料理店で新しいレシピのパスタを試すため、常連客 «N» 人を無作為に «nn» 人ずつに分け、一方に新レシピ、もう一方に従来のレシピを出した。
      食後に「また注文したい」と答えた人数は次のとおりだった。

      | | また注文したい | そうでもない | 計 |
      |---|---|---|---|
      | 新レシピ | «a» | «b» | «nn» |
      | 従来レシピ | «c» | «d» | «nn» |
      | 計 | «K» | «K» | «N» |
    items:
      - id: s17p05a
        chapter: 5
        terms: [fisher-exact-test, hypergeometric-distribution]
        topic: 少人数の試食会の2×2表で周辺度数を固定したフィッシャーの正確検定の片側p値を超幾何分布から求める
        level: 標準
        definition: false
        type: choice
        question: |
          行の合計と列の合計を固定したフィッシャーの正確検定で、「新レシピのほうが『また注文したい』と答える確率が高い」を対立仮説とする**片側** $p$ 値に最も近いものはどれか。
        choices:
          - '$«p_6»$'
          - '$«p_5»$'
          - '$«p_one»$'
          - '$«p_two»$'
          - '$«p_ge4»$'
        answer: 2
        distractors:
          - 観測より極端な表（6 人）だけを足し、観測された表の確率を入れなかった
          - 観測された表の確率だけを答え、より極端な表を足さなかった
          - 正解
          - 両側の p 値（片側の 2 倍）を答えた
          - 「以上」の境界を 1 つずらし、4 人以上を足した
        explanation: |
          **方針** 周辺度数を固定すると、新レシピ群で「また注文したい」と答える人数 $X$ は、帰無仮説（2 つのレシピで確率が等しい）のもとで超幾何分布に従う：
          «N» 人中「また注文したい」«K» 人から、新レシピ群の «nn» 人を選んだときの人数。片側 $p$ 値は $P(X\ge «a»)$。

          **途中式** 全体の場合の数は $\binom{«N»}{«nn»}=«tot»$。
          $$P(X=5)=\frac{\binom{6}{5}\binom{6}{1}}{«tot»}=\frac{«c65»\times«c61»}{«tot»}=\frac{«pk5»}{«tot»},\qquad P(X=6)=\frac{\binom{6}{6}\binom{6}{0}}{«tot»}=\frac{«pk6»}{«tot»}$$
          $$P(X\ge5)=\frac{«sum56»}{«tot»}=«p_one4»\cdots$$

          **答え** $«p_one»$（5% で有意）

          **間違えやすい点** $p$ 値は「観測された表と、それより極端な表」の確率の和。観測された表だけ（$«p_5»$）や、より極端な表だけ（$«p_6»$）では足りない。
          片側の対立仮説なので 2 倍しない（両側なら $«p_two»$）。4 人以上を足すと $\frac{«sum456»}{«tot»}=«p_ge4»$ になる。

  - id: s17p06
    title: ホテルのレストランの4つのコース
    context: |
      ホテルのレストランで 4 つのコース A, B, C, D の満足度（10 点満点）を比べるため、客 «N» 人を各コース «n» 人ずつ無作為に割り当てた。
      各コースの平均点は次のとおりで、一元配置分散分析の誤差の平均平方は $\mathrm{MSE}=«mse»$（自由度 «dfe»）だった。満足度は等分散の正規分布に従うとする。

      | コース | A | B | C | D |
      |---|---|---|---|---|
      | 平均点 | «mA» | «mB» | «mC» | «mD» |
    items:
      - id: s17p06a
        chapter: 20
        terms: [tukey-multiple-comparison, studentized-range-distribution, one-way-anova]
        topic: 4コースの満足度の平均をテューキーの方法（HSD）で全ペア比較し有意な組を数える
        level: 標準
        definition: false
        type: choice
        question: |
          テューキーの方法で、すべての組の平均の差を全体の有意水準 5% で比べる。HSD（有意となる平均の差の最小値）と有意な組について正しいものはどれか。
          必要なら次の値を使え。$q_{0.05}(k,\nu)$ はスチューデント化された範囲の分布（群の数 $k$、自由度 $\nu$）の上側 5% 点、$t_{0.025}(\nu)$ は $t$ 分布の上側 2.5% 点である。

          | $q_{0.05}(4,«dfe»)$ | $q_{0.05}(4,«N»)$ | $t_{0.025}(«dfe»)$ |
          |---|---|---|
          | «q» | «q24» | «t20» |
        choices:
          - 'HSD は $«hsd2»$ で、有意な組はない'
          - 'HSD は $«hsd»$ で、有意な組は A と C、C と D の 2 組'
          - 'HSD は $«lsd»$ で、有意な組は A と C、C と D、B と C の 3 組'
          - 'HSD は $«hsd_ns»$ で、有意な組は A と C、C と D、B と C、A と B の 4 組'
          - 'HSD は $«hsd_non»$ で、有意な組はない'
        answer: 1
        distractors:
          - √(MSE/n) の代わりに 2 標本の標準誤差 √(2MSE/n) を q に掛けた
          - 正解
          - 多重比較の調整をしない t の最小有意差（LSD）を使った
          - √ をとらずに q×MSE/n とした
          - MSE を n で割り忘れた
        explanation: |
          **方針** 各群の大きさが等しいとき、テューキーの方法では $|\bar y_i-\bar y_j|>q_{0.05}(k,\nu)\sqrt{\mathrm{MSE}/n}$ の組を有意とする（$k=4$、$\nu=«dfe»$ は誤差の自由度）。

          **途中式**
          $$\mathrm{HSD}=«q»\times\sqrt{\frac{«mse»}{«n»}}=«q»\times«smn»=«hsd»$$
          平均の差は A–B $«dAB»$、A–C $«dAC»$、A–D $«dAD»$、B–C $«dBC»$、B–D $«dBD»$、C–D $«dCD»$。«hsd» を超えるのは A–C と C–D の 2 組。

          **答え** HSD は $«hsd»$ で、有意な組は A と C、C と D の 2 組。

          **間違えやすい点** スチューデント化された範囲 $q$ には $\sqrt{\mathrm{MSE}/n}$ を掛ける（$t$ 分布のときの $\sqrt{2\mathrm{MSE}/n}$ ではない）。$\sqrt{2\mathrm{MSE}/n}$ を掛けると $«hsd2»$ になる。
          $q$ の自由度は総数 «N» ではなく誤差の自由度 «dfe»。調整しない $t$ の最小有意差 $«t20»\times\sqrt{2\times«mse»/«n»}=«lsd»$ を使うと、全体の第 1 種の誤りの確率が 5% を超える。

      - id: s17p06b
        chapter: 10
        terms: [holm-method, bonferroni-correction, multiple-testing]
        topic: コース6組の対比較のp値にホルム法とボンフェローニ法を当てはめ有意な組を比べる
        level: 基本
        definition: false
        type: choice
        question: |
          同じデータで 6 組の対比較それぞれに $t$ 検定（MSE を使い自由度 «dfe»）を行ったところ、両側 $p$ 値は次のとおりだった。

          | 組 | A–B | A–C | A–D | B–C | B–D | C–D |
          |---|---|---|---|---|---|---|
          | $p$ 値 | «pAB» | «pAC» | «pAD» | «pBC» | «pBD» | «pCD» |

          全体の有意水準（ファミリーワイズの第 1 種の誤りの確率）を 5% に抑える方法として、ホルム法とボンフェローニ法を使う。正しいものはどれか。
        choices:
          - 'ホルム法でもボンフェローニ法でも、有意なのは A–C の 1 組だけである'
          - 'ホルム法では A–C と C–D の 2 組が有意で、ボンフェローニ法では A–C の 1 組だけが有意である'
          - '多重性の調整をしても各 $p$ 値は 0.05 と比べてよいので、A–C、C–D、B–C の 3 組が有意である'
          - 'ホルム法はボンフェローニ法より保守的なので、ホルム法で有意な組はボンフェローニ法でも必ず有意である'
          - 'ホルム法でもボンフェローニ法でも、A–C と C–D の 2 組が有意である'
        answer: 1
        distractors:
          - ホルム法の 2 番目の基準を 0.05/6 のまま比べた（ボンフェローニ法と同じにした）
          - 正解
          - 多重性を調整しなかった
          - ホルム法とボンフェローニ法の保守性の関係を逆にした
          - ボンフェローニ法の基準 0.05/6 を 0.01 程度と見積もり、C–D も有意とした
        explanation: |
          **方針** ボンフェローニ法はすべての $p$ 値を $0.05/m$（$m=6$）と比べる。ホルム法は $p$ 値を小さい順に並べ、$i$ 番目を $0.05/(m-i+1)$ と比べ、初めて基準を超えたところで止める。

          **途中式** 小さい順に A–C «pAC»、C–D «pCD»、B–C «pBC»、…。
          - ボンフェローニ法：基準 $0.05/6=«th1»$。«pAC» だけが下回るので A–C の 1 組。
          - ホルム法：1 番目 $«pAC»\le0.05/6=«th1»$ で有意、2 番目 $«pCD»\le0.05/5=«th2»$ で有意、3 番目 $«pBC»>0.05/4=«th3»$ で止める。A–C と C–D の 2 組。

          **答え** 「ホルム法では A–C と C–D の 2 組が有意で、ボンフェローニ法では A–C の 1 組だけが有意である」

          **間違えやすい点** ホルム法は基準が段階的にゆるくなるので、ボンフェローニ法で有意な組は必ずホルム法でも有意になり、その逆は成り立たない（ホルム法のほうが検出力が高い）。
          C–D の $p$ 値 «pCD» は $0.05/6=«th1»$ をわずかに上回るので、ボンフェローニ法では有意にならない。調整しないと B–C まで有意になり、全体の誤りの確率が 5% を超える。

  - id: s17p07
    title: 2店舗のランチの待ち時間のばらつき
    context: |
      チェーンの 2 店舗 X, Y で、ランチの注文から料理が出るまでの待ち時間（分）を無作為に選んだ客について測った。
      X 店は «n1» 人で標準偏差 «s1»、Y 店は «n2» 人で標準偏差 «s2» だった（標準偏差は不偏分散の平方根）。待ち時間は各店で正規分布に従うとする。
    items:
      - id: s17p07a
        chapter: 11
        terms: [f-test-equal-variances, f-distribution, significance-level]
        topic: 2店舗の待ち時間の母分散が等しいかを両側5%のF検定で判定する（分散比と棄却点の選び方）
        level: 基本
        definition: false
        type: choice
        question: |
          帰無仮説「2 店舗の待ち時間の母分散は等しい」、対立仮説「等しくない」として、有意水準 5% の両側 $F$ 検定を行う。正しいものはどれか。
          必要なら次の $F$ 分布の上側パーセント点を使え（$F_{\alpha}(m,n)$ は分子の自由度 $m$、分母の自由度 $n$ の上側 $100\alpha\%$ 点）。

          | $F_{0.025}(«df1»,«df2»)$ | $F_{0.05}(«df1»,«df2»)$ | $F_{0.025}(«n1»,«n2»)$ |
          |---|---|---|
          | «f025» | «f05» | «f025b» |
        choices:
          - '$F=«F»$ は $F_{0.05}(«df1»,«df2»)=«f05»$ を超えるので、帰無仮説を棄却する'
          - '$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«Fsd»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«F»$ は $F_{0.025}(«n1»,«n2»)=«f025b»$ を超えないので、帰無仮説を棄却しない'
          - '$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、2 店舗の母分散は等しいことが示された'
        answer: 1
        distractors:
          - 両側検定なのに片側 5% 点と比べた
          - 正解
          - 分散ではなく標準偏差の比を F とした
          - 自由度を n1, n2 とし、1 を引かなかった
          - 帰無仮説を棄却しないことを、帰無仮説が正しいことの証明と取り違えた
        explanation: |
          **方針** 不偏分散の比 $F=s_X^2/s_Y^2$ は、帰無仮説のもとで自由度 $(n_X-1,n_Y-1)$ の $F$ 分布に従う。大きいほうの分散を分子にしたとき、両側 5% 検定では上側 2.5% 点と比べる。

          **途中式** $s_X^2=«s1»^2=«v1»$、$s_Y^2=«s2»^2=«v2»$。
          $$F=\frac{«v1»}{«v2»}=«F»,\qquad\text{自由度}(«n1»-1,«n2»-1)=(«df1»,«df2»)$$
          $F=«F»<F_{0.025}(«df1»,«df2»)=«f025»$ なので棄却しない。

          **答え** 「$F=«F»$ は $F_{0.025}(«df1»,«df2»)=«f025»$ を超えないので、帰無仮説を棄却しない」

          **間違えやすい点** 片側 5% 点 «f05» と比べると棄却してしまうが、それは「X 店のほうが分散が大きい」を対立仮説とする片側検定の判定で、データを見てから片側に変えることはできない。
          標準偏差の比 «Fsd» は $F$ 分布に従わない。自由度は $n-1$。棄却しないことは「等しいことが示された」ことを意味しない（差を検出できなかっただけ）。

